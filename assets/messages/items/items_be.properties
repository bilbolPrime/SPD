items.artifacts.masterthievesarmband.no_steal=Гэтаму ворагу няма чаго красці.
items.artifacts.masterthievesarmband.no_target=Вам трэба будзе нацэліцца на ворага, які знаходзіцца побач з вамі.
items.artifacts.masterthievesarmband.prompt=Выберыце ворага для нацэльвання
