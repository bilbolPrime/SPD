items.artifacts.driedrose.desc=Ці гэта тая самая ружа, пра якую згадваў прывід перад сваім знікненнем? Здаецца, яна валодае нейкай духоўнай сілай, магчыма, яе можна выкарыстаць, каб накіраваць энергію таго згубленага воіна.
