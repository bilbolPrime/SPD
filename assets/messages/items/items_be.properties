items.scrolls.scroll.ac_read=ЧЫТАЦЬ
items.scrolls.scroll.berkanan=скрутак БЕРКАНАНА
items.scrolls.scroll.blinded=Нельга прачытаць скрутак, калі ты сляпы.
items.scrolls.scroll.cursed=Твая праклятая кніга загавораў не дазваляе табе выклікаць магію гэтага скрутка! Але скрутак для зняцця праклёну можа быць дастаткова моцным, каб усё ж спрацаваць...
items.scrolls.scroll.gyfu=скрутак GYFU
items.scrolls.scroll.isaz=скрутак ISAZ
items.scrolls.scroll.kaunan=скрутак КАУНАН
