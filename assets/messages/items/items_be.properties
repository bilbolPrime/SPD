items.amulet.ac_end=КАНЕЦ ГУЛЬНІ
items.amulet.ascent_desc=Вы пачынаеце адчуваць вялікую і жудасную сілу Ёг-Дзэвы, якая выпраменьваецца з амулета. Падняцца назад праз падзямелле ў выглядзе смяротнага можа быць складаней, чым вы думалі!\n\nКалі вы працягнеце падняцца з амулетам, падзямелле стане больш небяспечным, тэлепартацыі паміж паверхамі будуць адключаныя, і вы зможаце выйграць гульню, толькі перамагаючы ворагаў падчас падняцця праз падзямелле!\n\nВы можаце пакінуць амулет тут пакуль што, калі хочаце падняцца, не пачынаючы гэтае выпрабаванне, або актываваць амулет перад падняццем, каб завяршыць гульню звычайным чынам.
items.amulet.ascent_no=Спыніся зараз
items.amulet.ascent_title=Узнясенне
items.amulet.ascent_yes=Працягвайце!
items.amulet.desc=Амулет Ендора — наймагутнейшы артэфакт, вядомы людзям ці гномам. Яго зіхатлівыя крышталі ўтрымліваюць неверагодную і цудоўную сілу.
items.amulet.desc_ascent=Паходжанне амулета невядомае, але відавочна, што на яго моцна паўплывала ўлада Ёг-Дзевы. Падзямелле, здаецца, падпарадкоўваецца волі Ёга па меры праходжання праз яго, робячы ворагаў значна больш шматлікімі і магутнымі! Вы таксама больш не можаце актываваць або скінуць амулет, быццам ён пракляты.
items.amulet.desc_origins=Паходжанне амулета невядомае. Гісторыя абвяшчае, што кароль гномаў хваліўся тым, што знайшоў артэфакт незадоўга да таго, як гномская цывілізацыя перарвала ўсе кантакты. Як ён яго знайшоў? Як Ёг-Дзева забраў яго ў яго? Магчыма, пытанні будуць у іншы раз, але цяпер важна толькі тое, што амулет ваш!
items.amulet.discover_hint=Гэты прадмет можна знайсці ўнізе падзямелля...
items.amulet.name=амулет Ендора
items.ankh.ac_bless=дабраслаўляць
items.ankh.bless=Ты благаслаўляеш анкх чароўнай вадой.
items.ankh.desc=Старажытны сімвал бессмяротнасці дазваляе вярнуцца да жыцця пасля смерці. Пры ўваскрашэнні губляюцца ўсе прадметы, якія не былі надзетыя.
items.ankh.desc_blessed=Гэты старажытны сімвал неўміручасці дае здольнасць вярнуцца да жыцця пасля смерці. Анкх быў благаслаўлёны і цяпер значна мацнейшы. Анкх ахвяруе сабой, каб выратаваць вас у хвіліну смяротнай небяспекі.
items.ankh.discover_hint=Вы можаце купіць гэты прадмет у краме.
items.ankh.name=анкх
items.arcaneresin.ac_apply=ПАДАЦЬ ЗАЯЎКУ
items.arcaneresin.apply=Ты пакрываеш сваю палачку смалой, павялічваючы яе сілу!
items.arcaneresin.desc=Гэты дробны парашок пераліваецца адценнямі фіялетавага да белага. Ён можа ўзмацняць магічную энергію, павялічваючы ўзровень палачак пры нанясенні на іх!\n\nПаляпшэнне палачкі каштуе 1, 2 або 3 адзінкі смалы ў залежнасці ад пачатковага ўзроўню палачкі. Смала можа палепшыць палачкі максімум да +3.\n\nАднак паляпшэнні з дапамогай смалы _перавызначаюцца іншымі крыніцамі паляпшэння_ (напрыклад, скруткамі паляпшэння) і не прымяняюцца пры ўкладванні палачкі ў персанал Мага.
items.arcaneresin.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.arcaneresin.level_too_high=Гэтая палачка занадта магутная, каб смала магла яе палепшыць.
items.arcaneresin.name=таемная смала
items.arcaneresin.not_enough=У цябе для гэтага смалы не хопіць!
items.arcaneresin.prompt=Выберыце палачку
items.armor.armor$glyph.discover_hint=Вы можаце знайсці прадмет з гэтым эфектам выпадковым чынам у падзямеллі або паспрабаваць прымяніць яго да прадмета самастойна.
items.armor.armor$glyph.glyph=гліф
items.armor.armor$glyph.killed=%s забіў цябе...
items.armor.armor$glyph.rankings_desc=Забіты гліфам
items.armor.armor.ac_detach=АДАРВАЦЬ
items.armor.armor.avg_absorb=Звычайна гэтая браня _tier-%1$d_ блакуе ўрон _%2$d-%3$d_ і патрабуе _%4$d сілы_ для правільнага выкарыстання.
items.armor.armor.curr_absorb=Гэтая браня _узроўню-%1$d_ блакуе ўрон ад _%2$d-%3$d_ і патрабуе _%4$d сілы_ для правільнага выкарыстання.
items.armor.armor.cursed=У гэтых даспехах хаваецца злавесная магія.
items.armor.armor.cursed_worn=Паколькі гэтыя даспехі праклятыя, ты не можаш іх зняць.
items.armor.armor.defense=Яго ўзмацняюць для ўзмацнення _абароны._
items.armor.armor.detach_seal=Ты адлучаеш пячатку ад сваіх даспехаў.
items.armor.armor.equip_cursed=Браня балюча сціскае цябе.
items.armor.armor.evasion=Яно ўзмоцнена для паляпшэння _ўхілення_.
items.armor.armor.excess_str=З-за тваёй празмернай сілы ты _больш ухіляльны_, калі носіш гэтыя даспехі.
items.armor.armor.glyph_hardened=Яно было _загартаванае._
items.armor.armor.hardened_no_glyph=Гэты даспех быў _ўмацаваны_, але пакуль што на ім няма гліфа.
items.armor.armor.hardening_gone=Зацвярдзенне гэтай брані сцерлася!
items.armor.armor.identify=Цяпер вы дастаткова добра знаёмыя са сваёй броняй, каб яе апазнаць.
items.armor.armor.incompatible=Узаемадзеянне розных відаў магіі сцерла гліф на гэтай брані!
items.armor.armor.inscribed=на ім напісана _%s._
items.armor.armor.not_cursed=Гэтыя даспехі не ўтрымліваюць злоснай магіі.
items.armor.armor.probably_too_heavy=Напэўна, гэтыя даспехі занадта цяжкія для цябе.
items.armor.armor.seal_attached=Да гэтых даспехаў прымацавана зламаная пячатка Воіна. Калі яго здароўе апускаецца ніжэй за палову, ён атрымлівае _%d абарону_.
items.armor.armor.seal_transfer=Каб воін меў карысць, зламаную пячатку трэба прымацаваць да яго даспехаў, якія ён ужо носіць. Вы хочаце аўтаматычна адлучыць пячатку ад даспехаў, якія вы здымаеце, і прымацаваць яе да даспехаў, якія вы апранаеце?
items.armor.armor.seal_transfer_no=не
items.armor.armor.seal_transfer_yes=так
items.armor.armor.too_heavy=З-за вашай недастатковай сілы нашэнне гэтай броні знізіць вашу здольнасць рухацца, ухіляцца і абараняцца.
items.armor.armor.weak_cursed=Нягледзячы на праклён, вы можаце зняць гэтую браню.
items.armor.classarmor.ac_ability=ВЫБІРАЙЦЕ ЗДОЛЬНАСЦІ
items.armor.classarmor.ac_transfer=ПЕРАДАЧА
items.armor.classarmor.charge_use=Выкарыстанне здольнасці прама зараз спажывае зарад _%s_.
items.armor.classarmor.discover_hint=Вы можаце знайсці гэты прадмет пасля перамогі над босам 20-га паверха пэўным героем.
items.armor.classarmor.low_charge=Браня не мае дастатковага зараду, каб выкарыстоўваць сваю асаблівую сілу!
items.armor.classarmor.no_ability=У вашай броні пакуль няма здольнасцей, вам варта выбраць адну!
items.armor.classarmor.not_equipped=Каб выкарыстоўваць гэтую асаблівую сілу, табе трэба насіць гэтую браню!
items.armor.classarmor.transfer_cancel=адмяніць
items.armor.classarmor.transfer_complete=Уласцівасці вашай гераічнай броні былі перададзены!
items.armor.classarmor.transfer_desc=Магію кароны караля гномаў можна перанесці на іншы камплект даспехаў. Звярніце ўвагу, што арыгінальныя даспехі будуць знішчаны ў працэсе.
items.armor.classarmor.transfer_prompt=Выберыце даспехі
items.armor.classarmor.transfer_title=Пераносная браня
items.armor.clericarmor.desc=Апрануты ў гэтую сумесь тканіны і пласцін, клірык можа выкарыстоўваць асаблівую здольнасць.
items.armor.clericarmor.name=вопратка героя
items.armor.clotharmor.desc=Гэты лёгкі даспех забяспечвае базавую абарону.
items.armor.clotharmor.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.armor.clotharmor.name=тканінныя даспехі
items.armor.curses.antientropy.desc=Антыэнтрапійны праклён дзейнічае супраць сіл Сусвету, прыцягваючы энергію ў носьбіта і адводзячы яе ад навакольнага асяроддзя. Ён ненадоўга падпальвае носьбіта, але замарожвае ўсё вакол яго!
items.armor.curses.antientropy.name=%s антыэнтрапіі
items.armor.curses.bulk.desc=Масіўная браня выглядае большай і больш уражлівай, але насамрэч не мае палепшанай абароны. Горш за ўсё, дадатковы памер значна ўскладняе праходжанне праз дзвярныя праёмы.
items.armor.curses.bulk.name=%s насыпу
items.armor.curses.corrosion.desc=Браня ад карозіі здольная лопнуць ад каразійнай вадкасці, пакрываючы ўсё ў зоне ліпкай кіслай сліззю.
items.armor.curses.corrosion.name=%s карозіі
items.armor.curses.displacement.desc=Праклён зрушэння спрабуе перамясціць носьбіта ў бяспечнае месца, калі на яго нападаюць. Аднак ён занадта эфектыўны, выпадковым чынам тэлепартуючы карыстальніка па ўзроўні.
items.armor.curses.displacement.name=%s зрушэння
items.armor.curses.metabolism.desc=Праклён метабалізму непасрэдна пераўтварае сытасць у здароўе, калі ўладальнік атрымлівае траўму, забяспечваючы паскарэнне гаення, але хутка выклікаючы голад.
items.armor.curses.metabolism.name=%s метабалізму
items.armor.curses.multiplicity.desc=Даспехі, праклятыя множнасцю, утрымліваюць небяспечную магію дубліравання. Часам яны ствараюць люстраное адлюстраванне таго, хто іх носіць, але з гэтак жа верагоднасцю могуць дубляваць і нападніка!
items.armor.curses.multiplicity.name=%s кратнасці
items.armor.curses.overgrowth.desc=Браня з зараснікаў пакрыта рознымі квітнеючымі раслінамі. Хоць гэты эфект, безумоўна, выглядае цікава, ён ніяк не абараняе, і гэтыя расліны будуць выпадковым чынам актывавацца ў баі!
items.armor.curses.overgrowth.name=%s зараснікаў
items.armor.curses.stench.desc=Браня, праклятая смуродам, вылучае воблакі атрутнага газу, які небяспечны для ўсяго, што трапляе ў воблака.
items.armor.curses.stench.name=%s смуроду
items.armor.duelistarmor.desc=Апрануўшы гэты даспех і плашч, Дуэлянт можа выкарыстоўваць асаблівую здольнасць.
items.armor.duelistarmor.name=нагруднік героя
items.armor.glyphs.affection.desc=Гэты магутны гліф маніпулюе розумам нападнікаў, часова зачароўваючы іх.
items.armor.glyphs.affection.name=%s прыхільнасці
items.armor.glyphs.antimagic.desc=Гэты магутны гліф дазваляе даспехам абараняць свайго ўладальніка як ад магічных, так і ад фізічных нападаў. Гэтая магічная абарона не залежыць ад узроўню даспеха.
items.armor.glyphs.antimagic.name=%s антымагічнага
items.armor.glyphs.brimstone.desc=Гэты гліф абараняе ўладальніка і яго рэчы ад агню, цалкам нівеліруючы яго шкоду і негатыўныя наступствы.
items.armor.glyphs.brimstone.name=%s з серы
items.armor.glyphs.camouflage.desc=Гэты гліф дазваляе ўладальніку злівацца з высокай травой, надаючы яму часовую нябачнасць.
items.armor.glyphs.camouflage.name=%s камуфляжу
items.armor.glyphs.entanglement.desc=Гэты гліф нарошчвае вакол носьбіта земляную браню, каб паглынаць шкоду, але гэтая браня зламаецца, калі носьбіт рухаецца.
items.armor.glyphs.entanglement.name=%s заблытанасці
items.armor.glyphs.flow.desc=Гэты гліф маніпулюе патокам вады вакол носьбіта, робячы яго значна хутчэйшым пры руху праз яго.
items.armor.glyphs.flow.name=%s патоку
items.armor.glyphs.obfuscation.desc=Гэты гліф зацямняе таго, хто яго носіць, што робіць яго больш цяжкім для выяўлення.
items.armor.glyphs.obfuscation.name=%s заблытвання
items.armor.glyphs.potential.desc=Гэты гліф назапашвае энергію пры ўдары, зараджаючы палачку ўладальніка пры яе актывацыі.
items.armor.glyphs.potential.name=%s патэнцыялу
items.armor.glyphs.repulsion.desc=Гэты гліф адбівае сілу ад нападнікаў, адкідваючы іх назад.
items.armor.glyphs.repulsion.name=%s адштурхвання
items.armor.glyphs.stone.desc=Гэты гліф акружае даспехі цяжкім магічным каменем, які робіць немагчымым ухіленне, але блакуе шкоду прапарцыйна ўхіленню.
items.armor.glyphs.stone.name=%s з каменя
items.armor.glyphs.swiftness.desc=Гэты гліф павялічвае хуткасць таго, хто яго носіць, калі ён не знаходзіцца побач з ворагам.
items.armor.glyphs.swiftness.name=%s хуткасці
items.armor.glyphs.thorns.desc=Гэты магутны гліф наносіць шкоду нападнікам, прымушаючы іх павольна крывацечыць, калі яны атакуюць носьбіта.
items.armor.glyphs.thorns.name=%s з шыпоў
items.armor.glyphs.viscosity$defereddamage.desc=Шкода наносіцца павольна, з цягам часу, а не імгненна.\n\nАстатняя адкладзеная шкода: %d.
items.armor.glyphs.viscosity$defereddamage.name=адкладзеная шкода
items.armor.glyphs.viscosity$defereddamage.ondeath=Адкладзеная шкода забіла цябе...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Загінуў адкладзенай шкодай
items.armor.glyphs.viscosity.deferred=адкладзены %d
items.armor.glyphs.viscosity.desc=Гэты гліф здольны захоўваць нанесеную ўладальніку шкоду, наносячы яе павольна, а не адразу.
items.armor.glyphs.viscosity.name=%s глейкасці
items.armor.huntressarmor.desc=Апрануўшы гэты плашч, Паляўніца можа выкарыстоўваць асаблівую здольнасць.
items.armor.huntressarmor.name=плашч героя
items.armor.huntressarmor.no_enemies=Няма ворагаў навідавоку
items.armor.leatherarmor.desc=Даспехі з дублёнай скуры пачвары. Не такія лёгкія, як тканінныя даспехі, але забяспечваюць лепшую абарону.
items.armor.leatherarmor.name=скураныя даспехі
items.armor.magearmor.desc=Апрануўшы гэтую цудоўную вопратку, Маг можа выкарыстоўваць асаблівую здольнасць.
items.armor.magearmor.name=вопратка героя
items.armor.mailarmor.desc=Злучаныя металічныя звёны ствараюць трывалы, але гнуткі даспех.
items.armor.mailarmor.name=кальчужныя даспехі
items.armor.platearmor.desc=Вялізныя металічныя пласціны злучаны разам у касцюм, які забяспечвае непераўзыдзеную абарону любому шукальніку прыгод, дастаткова моцнаму, каб вытрымаць яго ашаламляльную вагу.
items.armor.platearmor.name=пласціністы даспех
items.armor.roguearmor.desc=Апрануты ў гэтае цёмнае адзенне, Разбойнік можа выкарыстоўваць асаблівую здольнасць.
items.armor.roguearmor.name=вопратка героя
items.armor.scalearmor.desc=Металічныя лускавінкі, прышытыя да скураной камізэлькі, ствараюць гнуткія, але ахоўныя даспехі.
items.armor.scalearmor.name=лускаваты даспех
items.armor.warriorarmor.desc=Апрануўшы гэтыя цяжкія пласціністыя даспехі, Воін можа выкарыстоўваць асаблівую здольнасць.
items.armor.warriorarmor.name=латавая кальчуга героя
items.artifacts.alchemiststoolkit.ac_brew=ВАРАВА
items.artifacts.alchemiststoolkit.ac_energize=ЗАРАДЗІЦЦА ЭНЕРГІЯЙ
items.artifacts.alchemiststoolkit.cursed=Твой пракляты набор інструментаў не дазваляе табе карыстацца алхіміяй!
items.artifacts.alchemiststoolkit.desc=Гэты набор інструментаў змяшчае шэраг рэагентаў і траў, а таксама невялікі флакон для змешвання, што дазваляе займацца алхіміяй у дарозе. Флакон змяшчае тое, што выглядае як алхімічныя энергетычныя крышталі ў вадкай форме.
items.artifacts.alchemiststoolkit.desc_cursed=Пракляты набор інструментаў прывязаўся да цябе і адмаўляецца дазволіць табе выкарыстоўваць алхімію.
items.artifacts.alchemiststoolkit.desc_hint=Па меры набыцця вопыту, абсталяваны набор інструментаў павольна генеруе алхімічную энергію. Здаецца, што сумесь у флаконе можна палепшыць, дадаўшы ў яе энергетычныя крышталі.
items.artifacts.alchemiststoolkit.desc_warming=Інструментарый зараз разаграваецца і будзе гатовы да выкарыстання праз некаторы час.
items.artifacts.alchemiststoolkit.energize_1=6 энергіі: +1 узровень
items.artifacts.alchemiststoolkit.energize_all=Энергія %1$d: узроўні +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Кожныя 6 крышталяў энергіі дадуць набору інструментаў дастаткова энергіі для павышэння ўзроўню, што павялічвае хуткасць выпрацоўкі энергіі наборам інструментаў з цягам часу і хуткасць яго разагрэву. \n\n Колькі энергіі вы хацелі б выкарыстоўваць?
items.artifacts.alchemiststoolkit.name=набор інструментаў алхіміка
items.artifacts.alchemiststoolkit.need_energy=Для гэтага вам спатрэбіцца як мінімум 6 адзінак энергіі.
items.artifacts.alchemiststoolkit.not_ready=Ваш набор інструментаў яшчэ не скончыў разагрэў.
items.artifacts.artifact.cannot_wear_two=Нельга насіць два аднолькавыя артэфакты.
items.artifacts.artifact.curse_known=Унутры артэфакта хаваецца злавесная магія.
items.artifacts.artifact.equip_cursed=Артэфакт балюча прывязваецца да цябе.
items.artifacts.artifact.need_to_equip=Для гэтага вам трэба абсталяваць свой артэфакт.
items.artifacts.artifact.not_cursed=Гэты артэфакт не мае злога магічнага ўплыву.
items.artifacts.capeofthorns$thorns.desc=Ваш плашч выпраменьвае энергію, акружаючы вас полем адхіляльнай сілы!\n\nУся атрыманая вамі шкода памяншаецца, пакуль дзейнічае эфект шыпоў. Акрамя таго, калі нападнік знаходзіцца побач з вамі, паменшаная колькасць пашкоджанняў адхіляецца назад на нападніка.\n\nКолькасць паваротаў шыпоў, якія засталіся: %s.
items.artifacts.capeofthorns$thorns.inert=Твой плашч зноў становіцца інертным.
items.artifacts.capeofthorns$thorns.levelup=Твой плашч становіцца мацнейшым!
items.artifacts.capeofthorns$thorns.name=шыпы
items.artifacts.capeofthorns$thorns.radiating=Ваша накідка пачынае выпраменьваць энергію, вы адчуваеце сябе абароненымі!
items.artifacts.capeofthorns.desc=Гэтыя абваліўшыся металічныя лісты з DM-300 сфармаваліся разам у цвёрдую накідку. Здаецца, яна захоўвае глыбокую энергію, магчыма, у ёй ёсць частка сілы DM-300?
items.artifacts.capeofthorns.desc_active=Здаецца, што плашч вызваляе назапашаную энергію, ён выпраменьвае ахоўную сілу.
items.artifacts.capeofthorns.desc_inactive=Плашч супакойліва цяжкі на плячах, здаецца, што ён набіраецца энергіі ад атрыманай шкоды.
items.artifacts.capeofthorns.name=цярновы мыс
items.artifacts.chaliceofblood.ac_prick=УКОЛ
items.artifacts.chaliceofblood.desc=Гэты бліскучы сярэбраны келіх дзіўна ўпрыгожаны вострымі каштоўнымі камянямі па краі.
items.artifacts.chaliceofblood.desc_1=Трымаючы келіх, адчуваеш дзіўнае жаданне ўкалоцца аб вострыя каштоўныя камяні.
items.artifacts.chaliceofblood.desc_2=Частка тваёй крыві збіраецца ў келіх, ты ледзь прыкметна адчуваеш, як келіх сілкуе цябе жыццёвай энергіяй, павялічваючы натуральнае аднаўленне здароўя. Табе ўсё роўна хочацца парэзацца аб келіх, хоць ты ведаеш, што гэта будзе балюча.
items.artifacts.chaliceofblood.desc_3=Келіх напоўнены да краёў вашай жыццёвай эсэнцыяй. Вы можаце адчуць, як келіх улівае жыццёвую энергію назад у вас.
items.artifacts.chaliceofblood.desc_cursed=Пракляты келіх прывязаўся да тваёй рукі і перашкаджае тваёй здольнасці аднаўляць здароўе.
items.artifacts.chaliceofblood.name=келіх крыві
items.artifacts.chaliceofblood.no=Не, я перадумаў
items.artifacts.chaliceofblood.ondeath=Чаша высмоктвае з цябе жыццёвую сутнасць...
items.artifacts.chaliceofblood.onprick=Ты ўколешся, і твая жыццёвая эсэнцыя сцячэ ў келіх.
items.artifacts.chaliceofblood.prick_warn=Кожны раз, калі вы выкарыстоўваеце келіх, ён будзе высмоктваць больш вашай жыццёвай энергіі, але ўзамен гэта яшчэ больш палепшыць ваша натуральнае аднаўленне здароўя.\n\nУ цяперашні час укол сябе нанясе _%1$d-%2$d шкоду_, хоць гэтую шкоду можна паменшыць _як фізічнай, так і магічнай блакіроўкай або зніжэннем шкоды._ Без уліку эфектаў зніжэння шкоды, укол сябе ў цяперашні час мае _%3$s%% шанец_ цалкам высмоктаць вашу жыццёвую сілу.\n\nВы ўпэўнены, што хочаце даць келіху больш жыццёвай энергіі?
items.artifacts.chaliceofblood.yes=Так, я ведаю, што раблю
items.artifacts.cloakofshadows$cloakstealth.desc=Ваш плашч ценяў дае вам нябачнасць, пакуль вы ім ахутаны. Вы будзеце заставацца ў плашчы, пакуль яно не будзе адменена або ваш плашч не разрадзіцца.\n\nПакуль вы нябачныя, ворагі не могуць атакаваць вас або сачыць за вамі. Фізічныя атакі і магічныя эфекты (напрыклад, скруткі і палачкі) неадкладна адменяць нябачнасць.\n\nХад да выкарыстання зарада: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Твой плашч становіцца мацнейшым!
items.artifacts.cloakofshadows$cloakstealth.name=замаскіраваны
items.artifacts.cloakofshadows$cloakstealth.no_charge=У твайго плашча скончылася энергія.
items.artifacts.cloakofshadows.ac_stealth=СТЭЛС
items.artifacts.cloakofshadows.cooldown=Вашаму плашчу патрэбна больш %d патронаў, каб аднавіць энергію.
items.artifacts.cloakofshadows.cursed=Вы не можаце выкарыстоўваць пракляты плашч.
items.artifacts.cloakofshadows.desc=Бясцэнны магічны плашч, скрадзены з каралеўскай збройні шмат гадоў таму Разбойнікам. Пры нашэнні яго можна выкарыстоўваць, каб на кароткі час цалкам стаць нябачным.\n\nЧым больш выкарыстоўваецца плашч, тым мацнейшым ён становіцца, што дазваляе Разбойніку станавіцца нябачным часцей і на больш працяглы час.
items.artifacts.cloakofshadows.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.artifacts.cloakofshadows.name=плашч ценяў
items.artifacts.cloakofshadows.no_charge=Твой плашч яшчэ не дастаткова зарадзіўся, каб ім можна было карыстацца.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Як вы гэта перажылі?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Хацелася б, каб у мяне быў адзін з іх...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ого! Ты ўсё яшчэ жывы!
items.artifacts.driedrose$ghosthero.def_verb=ухіліўся
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Прабачце... поспехаў...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Скончы гэта... без мяне...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Не... я не магу...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Жадаю поспеху...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Стаміўся... пакуль што...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я вярнуся...
items.artifacts.driedrose$ghosthero.desc=Кволая эфемерная постаць чалавекападобнай формы. Здаецца, іх сіла звязана з вашай ружай. \n\n Гэты прывід можа быць не вельмі важным, але, здаецца, яны ваш адзіны сапраўдны сябар тут, унізе.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Чаму так адбываецца, я думаў, што ў нас атрымалася?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Як гэтая рэч усё яшчэ можа ўплываць на гэты свет?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Спадзяюся, ты ведаеш, што робіш з гэтым амулетам.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Мяркую, мы яшчэ не скончылі.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Мы ўжо так далёка зайшлі, мы можам скончыць гэта!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Яшчэ крыху, і мы зможам выбрацца адсюль!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Тут ужо вельмі даўно не было ні чалавека, ні гнома.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Што магло прымусіць гномаў пакінуць залатую шахту?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Шкада, што ўсё золата тут на першы погляд бескарыснае.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Істоты тут перакручаныя, як і ў каналізацыі.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Нават кажаны тут крыважэрныя.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Ніякіх прыкмет горназдабыўнога абсталявання, ці гномы ўсё вярнулі?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Гномы былі працавітыя, але прагныя.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Значыць, гномскі мегаполіс сапраўды ўпаў.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Спадзяюся, што паверхня ніколі не стане такой, як гэтае месца.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Гномы не павінны выглядаць такімі бледнымі.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Не ведаю, што горш, гномы ці іхнія стварэнні.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Здаецца, гномы цяпер таксама бяздумныя пачвары.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Што гэта за месца?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Гэтае месца жахлівае...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Пра што думалі гномы, гуляючы з уладай вось так?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Пачвары тут з іншага свету, адкуль яны ўзяліся?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Адчуваеш гэта? Быццам нешта назірае за намі.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Дзякуй Богу, што ёсць паходні, тут так цёмна!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я чуў гісторыі пра гэтае месца, нічога добрага.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Гэтае месца заўсёды было хутчэй падзямеллем, чым турмой.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Не магу сабе ўявіць, што адбывалася, калі гэтае месца было закінута.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Здаецца, і вязні, і ахоўнікі ператварыліся ў пачвараў.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Што можа быць адказным за ўсе гэтыя шкілеты?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Гэтыя людзі не павінны былі так скончыць...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Гэтыя каналізацыйныя трубы раней былі бяспечнымі, людзі нават жылі тут зімой.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Цікава, што здарылася з вартавымі патрулямі, яны здаліся?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У мяне на паверхні была сям'я, спадзяюся, яны ў бяспецы.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Вартавыя не змаглі перамагчы гэтых пачвараў, але, магчыма, мы зможам.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Калі нават каналізацыя такая небяспечная, цікава, што там унізе...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Што магло прымусіць гэтых пацукоў і крабаў вырасці такімі вялікімі?
items.artifacts.driedrose$ghosthero.direct_prompt=Што мне рабіць?
items.artifacts.driedrose$ghosthero.directed_attack_1=Добра, я буду атакаваць гэта.
items.artifacts.driedrose$ghosthero.directed_attack_2=Я вазьму гэты.
items.artifacts.driedrose$ghosthero.directed_attack_3=Захапляльна...
items.artifacts.driedrose$ghosthero.directed_attack_4=Давайце іх зловім!
items.artifacts.driedrose$ghosthero.directed_attack_5=У мяне ёсць такі.
items.artifacts.driedrose$ghosthero.directed_follow_1=Добра, я пайду за табой.
items.artifacts.driedrose$ghosthero.directed_follow_2=Я падбягуся да цябе.
items.artifacts.driedrose$ghosthero.directed_follow_3=Сачу за табой...
items.artifacts.driedrose$ghosthero.directed_follow_4=Добра, пачнем!
items.artifacts.driedrose$ghosthero.directed_follow_5=Я цябе прыкрыю.
items.artifacts.driedrose$ghosthero.directed_position_1=Добра, я буду прытрымлівацца гэтай пазіцыі.
items.artifacts.driedrose$ghosthero.directed_position_2=Я пайду туды і буду абараняцца.
items.artifacts.driedrose$ghosthero.directed_position_3=Змена пазіцыі...
items.artifacts.driedrose$ghosthero.directed_position_4=Ужо ў дарозе!
items.artifacts.driedrose$ghosthero.directed_position_5=Я туды накіруюся.
items.artifacts.driedrose$ghosthero.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай пэўнага артэфакта.
items.artifacts.driedrose$ghosthero.hello=Прывітанне зноў, %s.
items.artifacts.driedrose$ghosthero.introduce=Мая душа звязана з гэтай ружай, яна была для мяне вельмі каштоўнай, падарунак ад майго кахання, якога я пакінуў на паверхні.\n\nЯ не магу вярнуцца да яго, але дзякуючы табе ў мяне ёсць другі шанец завяршыць сваё падарожжа. Калі я змагу, я адкажу на твой заклік і буду змагацца з табой.\n\nПакуль у цябе ёсць ружа, я магу чуць твой голас, таму ты можаш выкарыстоўваць яе, каб накіроўваць мяне здалёк.\n\nСпадзяюся, ты дасягнеш поспеху там, дзе я пацярпеў няўдачу...
items.artifacts.driedrose$ghosthero.name=сумны прывід
items.artifacts.driedrose$ghosthero.player_killed_1=Не!...
items.artifacts.driedrose$ghosthero.player_killed_2=Я не мог ім дапамагчы...
items.artifacts.driedrose$ghosthero.player_killed_3=Не так...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Толькі гномы маглі пабудаваць горназдабыўную машыну, якая забівае зламыснікаў.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Гэтая рэч велізарная...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Як гэтая штука так доўга заставалася актыўнай?
items.artifacts.driedrose$ghosthero.seen_goo_1=Сцеражыся, Гу!
items.artifacts.driedrose$ghosthero.seen_goo_2=Шмат маіх сяброў загінула з-за гэтага, час помсты!
items.artifacts.driedrose$ghosthero.seen_goo_3=Такой агіднасці нельга дазволіць жыць!
items.artifacts.driedrose$ghosthero.seen_king_1=Калі людзі кажуць, што ўлада разбэшчвае, яны маюць на ўвазе менавіта гэта.
items.artifacts.driedrose$ghosthero.seen_king_2=Цяпер ён хутчэй ліч, чым кароль.
items.artifacts.driedrose$ghosthero.seen_king_3=Нават пасля смерці гномы падпарадкоўваюцца свайму гаспадару.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Адзіны палонны, які застаўся, — смяротны забойца. Вядома ж...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ён зачапіў нас!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я чуў жахлівыя гісторыі пра гэтую маску...
items.artifacts.driedrose$ghosthero.seen_yog_1=О, гэта выглядае не вельмі добра.
items.artifacts.driedrose$ghosthero.seen_yog_2=Дык вось як выглядае бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Гэта будзе балюча...
items.artifacts.driedrose$petal.desc=Кволая высахлая пялёстак, якая нейкім чынам выжыла так далёка ў падзямеллі.
items.artifacts.driedrose$petal.levelup=Вы дадаяце пялёстак да ружы.
items.artifacts.driedrose$petal.maxlevel=Ружа гатовая!
