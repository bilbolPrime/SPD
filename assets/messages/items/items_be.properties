items.artifacts.sandalsofnature.desc_1=Тое, што спачатку здаецца сандалікамі з шпагату, насамрэч з'яўляецца дзвюма раслінамі! Яны выглядаюць вельмі слабымі і бледнымі, магчыма, ім трэба даць пажыўныя рэчывы?
items.artifacts.sandalsofnature.desc_2=Абутак павялічыўся і цяпер больш нагадвае два туфлі, зробленыя па ідэальным заказе. Да яго вярнуўся нейкі колер, магчыма, ён яшчэ можа падрасці?
items.artifacts.sandalsofnature.desc_3=Расліны зноў выраслі і цяпер нагадваюць пару трывалых ботаў, зробленых з кары. Здаецца, расліны аднавілі сваю сілу, але, магчыма, яны ўсё яшчэ могуць расці далей?
items.artifacts.sandalsofnature.desc_4=Здаецца, расліны дасягнулі свайго максімальнага памеру, яны нагадваюць пару панцырных накаленнікаў. Накаленнікі маюць цёмна-карычневы колер і нагадваюць вельмі моцнае дрэва.
items.artifacts.sandalsofnature.desc_ability=Абутак пераліваецца колерам апошняга насення, якім вы яго скармілі. Ён можа ненадоўга ўкараніцца ў зямлю і стварыць эфект гэтай расліны ў любым месцы ў радыусе 3 клетак.\nНасенне: _%s_\nНеабходны зарад: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Праклятыя сандалі блакуюць любую гармонію з прыродай.
items.artifacts.sandalsofnature.desc_hint=Апрануўшы гэты артэфакт, вы адчуваеце сябе больш яднанымі з прыродай.
items.artifacts.sandalsofnature.desc_seeds=Вы падсілкавалі абутак насеннем %d.
items.artifacts.sandalsofnature.levelup=Твой абутак рэзка павялічыўся ў памеры!
items.artifacts.sandalsofnature.low_charge=У вашага абутку не хапае на гэта энергіі.
