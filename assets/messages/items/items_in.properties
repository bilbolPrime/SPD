items.weapon.melee.dagger.typical_ability_desc=Duelis dapat menyelinap sambil memegang belati. Kemampuan ini memungkinkan Duelis untuk langsung berpindah hingga 5 petak dan biasanya memberinya _%d giliran tembus pandang._
