items.weapon.weaponeffects.weaponeffect.drainlife.name=%s Pengisap
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Tongkat ini _Pengisap_. Sihirnya punya peluang _20%_ untuk memberikan _8–16_ kerusakan sihir tambahan dan memulihkan kesehatanmu sebanyak kesehatan yang diambil dari target.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Isap nyawa!

items.armor.armorprefix.stalwart.name=%s Tangguh
items.armor.armorprefix.stalwart.desc=Zirah ini _Tangguh_. Serangan musuh punya peluang _20%_ untuk memicu _Ketangguhan tingkat 5_, mengurangi kerusakannya sebesar _20%_.
items.armor.armorprefix.stalwart.activate=Ketangguhan!

items.armor.armorprefix.vigilant.name=%s Waspada
items.armor.armorprefix.vigilant.desc=Zirah ini _Waspada_. Kamu punya peluang _20%_ untuk menghindari serangan jarak jauh musuh.
items.armor.armorprefix.vigilant.activate=Kewaspadaan!

items.armor.armorprefix.elusive.name=%s Lincah
items.armor.armorprefix.elusive.desc=Zirah ini membuatmu _Lincah_. Saat serangan musuh melukaimu, ada peluang _20%_ untuk meningkatkan penghindaranmu sebesar _5_ selama _5 giliran_.
items.armor.armorprefix.elusive.activate=Penghindaran!
