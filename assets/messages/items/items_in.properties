items.armor.armor.avg_absorb=Biasanya, armor _tier-%1$d_ ini memblokir _%2$d-%3$d damage_ dan membutuhkan _%4$d strength_ untuk digunakan dengan benar.
items.armor.armor.curr_absorb=Armor _tier-%1$d_ ini memblokir _%2$d-%3$d damage_ dan membutuhkan _%4$d strength_ untuk digunakan dengan benar.
items.armor.armor.cursed=Anda dapat merasakan sihir jahat yang bersembunyi di dalam baju zirah ini.
items.armor.armor.cursed_worn=Karena baju zirah ini terkutuk, kau tidak berdaya untuk melepaskannya.
items.armor.armor.defense=Hal ini ditingkatkan untuk memperkuat pertahanan.
items.armor.armor.detach_seal=Anda melepaskan segel dari baju zirah Anda.
items.armor.armor.equip_cursed=Armor itu mencekik tubuhmu dengan menyakitkan.
items.armor.armor.evasion=Hal ini ditingkatkan untuk meningkatkan kemampuan menghindar.
items.armor.armor.excess_str=Karena kekuatanmu yang berlebih, kamu _lebih lincah_ saat mengenakan baju zirah ini.
items.armor.armor.glyph_hardened=Itu sudah mengeras.
items.armor.armor.hardened_no_glyph=Perisai ini telah diperkeras, tetapi saat ini belum diukir dengan sebuah glif.
items.armor.armor.hardening_gone=Lapisan pengeras pada baju zirah ini telah hilang!
items.armor.armor.identify=Sekarang Anda sudah cukup mengenal baju zirah Anda sehingga dapat mengidentifikasinya.
items.armor.armor.incompatible=Interaksi berbagai jenis sihir telah menghapus simbol pada baju zirah ini!
items.armor.armor.inscribed=Di atasnya tertulis _%s._
items.armor.armor.not_cursed=Armor ini bebas dari sihir jahat.
items.armor.armor.probably_too_heavy=Mungkin baju zirah ini terlalu berat untukmu.
items.armor.armor.seal_attached=Segel rusak sang Prajurit terpasang pada baju zirah ini. Saat dia hampir terluka hingga kesehatannya di bawah setengah, itu akan memberinya perisai _%d_.
items.armor.armor.seal_transfer=Segel yang rusak milik Prajurit harus ditempelkan pada baju zirah yang sedang dikenakannya agar dapat memberikan manfaat baginya. Apakah Anda ingin secara otomatis melepaskan segel dari baju zirah yang Anda lepas dan menempelkannya pada baju zirah yang Anda kenakan?
items.armor.armor.seal_transfer_no=TIDAK
items.armor.armor.seal_transfer_yes=Ya
items.armor.armor.too_heavy=Karena kekuatanmu yang tidak memadai, mengenakan baju zirah ini akan mengurangi kemampuanmu untuk bergerak, menghindar, dan bertahan.
items.armor.armor.weak_cursed=Meskipun terkena kutukan, kamu tetap bisa melepas baju zirah ini.
items.armor.classarmor.ac_ability=PILIH KEMAMPUAN
items.armor.classarmor.ac_transfer=TRANSFER
items.armor.classarmor.charge_use=Menggunakan kemampuan ini sekarang akan mengonsumsi _%s_ muatan.
items.armor.classarmor.discover_hint=Anda dapat menemukan item ini setelah mengalahkan bos lantai 20 dengan hero tertentu.
items.armor.classarmor.low_charge=Armor tersebut tidak memiliki cukup daya untuk menggunakan kekuatan spesialnya!
items.armor.classarmor.no_ability=Armor Anda saat ini tidak memiliki kemampuan apa pun, Anda harus memilih salah satunya!
items.armor.classarmor.not_equipped=Anda harus mengenakan baju zirah ini untuk menggunakan kekuatan spesialnya!
items.armor.classarmor.transfer_cancel=membatalkan
items.armor.classarmor.transfer_complete=Sifat-sifat baju zirah heroikmu telah ditransfer!
items.armor.classarmor.transfer_desc=Kekuatan magis mahkota raja kurcaci dapat ditransfer ke set baju zirah lainnya. Perlu diingat bahwa baju zirah asli akan hancur dalam proses tersebut.
items.armor.classarmor.transfer_prompt=Pilih Armor
items.armor.classarmor.transfer_title=Transfer Armor
items.armor.clericarmor.desc=Saat mengenakan campuran kain dan lempengan ini, Pendeta dapat melakukan kemampuan khusus.
items.armor.clericarmor.name=pakaian pahlawan
items.armor.clotharmor.desc=Pelindung tubuh ringan ini menawarkan perlindungan dasar.
items.armor.clotharmor.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.armor.clotharmor.name=baju zirah kain
items.armor.curses.antientropy.desc=Kutukan Anti-entropi bekerja melawan kekuatan alam semesta, menarik energi ke pemakainya dan menjauhkannya dari lingkungan sekitarnya. Hal ini akan membuat pemakainya terbakar sesaat, tetapi membekukan segala sesuatu di sekitarnya!
items.armor.curses.antientropy.name=%s dari anti-entropi
items.armor.curses.bulk.desc=Baju zirah yang tebal terlihat lebih besar dan lebih mengintimidasi, tetapi sebenarnya tidak memiliki peningkatan pertahanan. Lebih buruk lagi, ukuran yang lebih besar membuat pergerakan melewati pintu menjadi sangat sulit.
items.armor.curses.bulk.name=%s massal
items.armor.curses.corrosion.desc=Lapisan korosi mampu meledak dengan cairan korosif, melapisi segala sesuatu di area tersebut dengan cairan asam lengket.
items.armor.curses.corrosion.name=%s dari korosi
items.armor.curses.displacement.desc=Kutukan perpindahan berusaha memindahkan pemakainya ke tempat aman ketika mereka diserang. Namun, kutukan ini agak terlalu efektif, karena secara acak memindahkan pengguna ke berbagai tempat di dalam level permainan.
items.armor.curses.displacement.name=%s perpindahan
items.armor.curses.metabolism.desc=Kutukan metabolisme secara langsung mengubah rasa kenyang menjadi kesehatan ketika pemakainya terluka, memberikan dorongan penyembuhan, tetapi dengan cepat menyebabkan kelaparan.
items.armor.curses.metabolism.name=%s metabolisme
items.armor.curses.multiplicity.desc=Armor yang dikutuk dengan kemampuan penggandaan mengandung sihir duplikasi yang berbahaya. Terkadang armor ini akan menciptakan bayangan cermin dari pemakainya, tetapi kemungkinan besar juga akan menduplikasi penyerangnya!
items.armor.curses.multiplicity.name=%s dari multiplisitas
items.armor.curses.overgrowth.desc=Perisai pertumbuhan berlebih ditutupi oleh berbagai tanaman berbunga. Meskipun efek ini terlihat menarik, efek ini tidak berpengaruh pada pertahanan, dan tanaman-tanaman ini akan aktif secara acak dalam pertempuran!
items.armor.curses.overgrowth.name=%s pertumbuhan berlebih
items.armor.curses.stench.desc=Armor yang dikutuk dengan bau busuk akan melepaskan awan gas beracun, yang berbahaya bagi segala sesuatu yang terjebak dalam awan tersebut.
items.armor.curses.stench.name=%s bau busuk
items.armor.duelistarmor.desc=Saat mengenakan baju zirah dan jubah ini, Duelis dapat melakukan kemampuan khusus.
items.armor.duelistarmor.name=pelindung dada pahlawan
items.armor.glyphs.affection.desc=Simbol ampuh ini memanipulasi pikiran penyerang, memikat mereka untuk sementara waktu.
items.armor.glyphs.affection.name=%s kasih sayang
items.armor.glyphs.antimagic.desc=Simbol ampuh ini memungkinkan baju zirah untuk melindungi pemakainya dari serangan sihir maupun fisik. Pertahanan sihir ini tidak dipengaruhi oleh tingkatan baju zirah tersebut.
items.armor.glyphs.antimagic.name=%s dari anti-sihir
items.armor.glyphs.brimstone.desc=Lambang ini melindungi pemakainya dan barang-barang miliknya dari api, sepenuhnya meniadakan kerusakan dan efek negatifnya.
items.armor.glyphs.brimstone.name=%s belerang
items.armor.glyphs.camouflage.desc=Simbol ini memungkinkan pemakainya untuk menyatu dengan rerumputan tinggi, memberikan mereka kemampuan menghilang sementara.
items.armor.glyphs.camouflage.name=%s kamuflase
items.armor.glyphs.entanglement.desc=Simbol ini menumbuhkan perisai tanah di sekitar pemakainya untuk menyerap kerusakan, tetapi perisai ini akan hancur jika pemakainya bergerak.
items.armor.glyphs.entanglement.name=%s dari keterikatan
items.armor.glyphs.flow.desc=Simbol ini memanipulasi aliran air di sekitar pemakainya, membuat mereka jauh lebih cepat saat bergerak melewatinya.
items.armor.glyphs.flow.name=%s aliran
items.armor.glyphs.obfuscation.desc=Simbol ini menyamarkan pemakainya, sehingga lebih sulit untuk dideteksi.
items.armor.glyphs.obfuscation.name=%s dari pengaburan
items.armor.glyphs.potential.desc=Simbol ini menghasilkan energi saat dipukul, memberikan daya pada tongkat sihir pemakainya saat diaktifkan.
items.armor.glyphs.potential.name=%s dari potensi
items.armor.glyphs.repulsion.desc=Simbol ini memantulkan kekuatan kembali ke penyerang, membuat mereka terpental jauh.
items.armor.glyphs.repulsion.name=%s tolakan
items.armor.glyphs.stone.desc=Simbol ini mengelilingi baju zirah dengan batu magis berat yang membuat menghindar menjadi mustahil, tetapi memblokir kerusakan sebanding dengan penghindaran.
items.armor.glyphs.stone.name=%s dari batu
items.armor.glyphs.swiftness.desc=Simbol ini meningkatkan kecepatan pemakainya setiap kali mereka tidak berada di dekat musuh.
items.armor.glyphs.swiftness.name=%s kecepatan
items.armor.glyphs.thorns.desc=Simbol ampuh ini melukai penyerang, menyebabkan mereka berdarah perlahan saat menyerang pemakainya.
items.armor.glyphs.thorns.name=%s duri
items.armor.glyphs.viscosity$defereddamage.desc=Kerusakan ditimbulkan secara perlahan dari waktu ke waktu, bukan secara langsung. \n\n Kerusakan tertunda yang tersisa: %d.
items.armor.glyphs.viscosity$defereddamage.name=kerusakan yang ditangguhkan
items.armor.glyphs.viscosity$defereddamage.ondeath=Kerusakan yang tertunda itulah yang membunuhmu...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Terbunuh oleh kerusakan tertunda
items.armor.glyphs.viscosity.deferred=tertunda %d
items.armor.glyphs.viscosity.desc=Glyph ini mampu menyimpan kerusakan yang diterima pemakainya, memberikannya secara perlahan dan bukan sekaligus.
items.armor.glyphs.viscosity.name=%s viskositas
items.armor.huntressarmor.desc=Saat mengenakan jubah ini, Sang Pemburu dapat melakukan kemampuan khusus.
items.armor.huntressarmor.name=jubah pahlawan
items.armor.huntressarmor.no_enemies=Tidak ada musuh yang terlihat.
items.armor.leatherarmor.desc=Armor yang terbuat dari kulit monster yang disamak. Tidak seringan armor kain, tetapi memberikan perlindungan yang lebih baik.
items.armor.leatherarmor.name=baju zirah kulit
items.armor.magearmor.desc=Saat mengenakan jubah yang indah ini, sang Penyihir dapat melakukan kemampuan khusus.
items.armor.magearmor.name=jubah pahlawan
items.armor.mailarmor.desc=Rantai logam yang saling terkait menciptakan baju zirah yang kuat namun fleksibel.
items.armor.mailarmor.name=baju zirah rantai
items.armor.platearmor.desc=Lempengan-lempengan logam berukuran besar disatukan menjadi sebuah pakaian yang memberikan perlindungan tak tertandingi bagi petualang mana pun yang cukup kuat untuk menahan bobotnya yang luar biasa.
items.armor.platearmor.name=baju zirah lempeng
items.armor.roguearmor.desc=Saat mengenakan pakaian gelap ini, sang Rogue dapat melakukan kemampuan khusus.
items.armor.roguearmor.name=pakaian pahlawan
items.armor.scalearmor.desc=Sisik-sisik logam yang dijahit pada rompi kulit menciptakan baju zirah yang fleksibel namun tetap memberikan perlindungan.
items.armor.scalearmor.name=baju besi sisik
items.armor.warriorarmor.desc=Saat mengenakan baju zirah berlapis tebal ini, sang Prajurit dapat melakukan kemampuan khusus.
items.armor.warriorarmor.name=baju zirah pahlawan
items.artifacts.alchemiststoolkit.ac_brew=BUATAN
items.artifacts.alchemiststoolkit.ac_energize=BERI ENERGI
items.artifacts.alchemiststoolkit.cursed=Perangkat alat terkutukmu mencegahmu menggunakan alkimia!
items.artifacts.alchemiststoolkit.desc=Perangkat ini berisi sejumlah reagen dan herbal beserta botol kecil untuk mencampur, memungkinkan praktik alkimia di mana saja. Botol tersebut berisi cairan yang menyerupai kristal energi alkimia.
items.artifacts.alchemiststoolkit.desc_cursed=Perangkat terkutuk itu telah mengikat dirinya di sisimu, dan menolak untuk membiarkanmu menggunakan alkimia.
items.artifacts.alchemiststoolkit.desc_hint=Perangkat alat yang dilengkapi secara perlahan menghasilkan energi alkimia seiring bertambahnya pengalaman Anda. Tampaknya campuran dalam botol kecil itu dapat ditingkatkan dengan menambahkan kristal energi ke dalamnya.
items.artifacts.alchemiststoolkit.desc_warming=Perangkat ini sedang dalam proses pemanasan, dan akan siap digunakan setelah beberapa saat.
items.artifacts.alchemiststoolkit.energize_1=6 energi: +1 level
items.artifacts.alchemiststoolkit.energize_all=Energi %1$d: +tingkat %2$d
items.artifacts.alchemiststoolkit.energize_desc=Setiap 6 kristal energi akan memberikan cukup energi pada toolkit untuk naik level, yang meningkatkan laju perolehan energi toolkit dari waktu ke waktu, dan seberapa cepat toolkit memanas.\n\nBerapa banyak energi yang ingin Anda gunakan?
items.artifacts.alchemiststoolkit.name=perlengkapan alkemis
items.artifacts.alchemiststoolkit.need_energy=Anda membutuhkan setidaknya 6 energi untuk itu.
items.artifacts.alchemiststoolkit.not_ready=Perangkat Anda belum selesai memanas.
items.artifacts.artifact.cannot_wear_two=Anda tidak dapat mengenakan dua artefak yang sama.
items.artifacts.artifact.curse_known=Anda dapat merasakan sihir jahat yang bersembunyi di dalam artefak tersebut.
items.artifacts.artifact.equip_cursed=Artefak itu mengikat dirimu dengan menyakitkan.
items.artifacts.artifact.need_to_equip=Anda perlu melengkapi artefak Anda untuk melakukan itu.
items.artifacts.artifact.not_cursed=Artefak ini bebas dari sihir jahat.
items.artifacts.capeofthorns$thorns.desc=Jubahmu memancarkan energi, mengelilingimu dengan medan gaya defleksi!\n\nSemua kerusakan yang kamu terima berkurang saat efek duri aktif. Selain itu, jika penyerang berada di sebelahmu, jumlah yang berkurang akan dipantulkan kembali ke penyerang.\n\nJumlah giliran duri yang tersisa: %s.
items.artifacts.capeofthorns$thorns.inert=Jubahmu menjadi tidak aktif lagi.
items.artifacts.capeofthorns$thorns.levelup=Jubahmu akan semakin kuat!
items.artifacts.capeofthorns$thorns.name=duri
items.artifacts.capeofthorns$thorns.radiating=Jubahmu mulai memancarkan energi, kamu merasa terlindungi!
items.artifacts.capeofthorns.desc=Lembaran-lembaran logam yang runtuh dari DM-300 ini telah menyatu membentuk jubah yang kaku. Tampaknya jubah ini menyimpan energi yang besar, mungkin ia memiliki sebagian kekuatan DM-300?
items.artifacts.capeofthorns.desc_active=Jubah itu sepertinya melepaskan energi yang tersimpan, memancarkan kekuatan pelindung.
items.artifacts.capeofthorns.desc_inactive=Jubah itu terasa berat dan menenangkan di pundakmu, seolah-olah jubah itu mendapatkan energi dari kerusakan yang kau terima.
items.artifacts.capeofthorns.name=jubah duri
items.artifacts.chaliceofblood.ac_prick=TUSUKAN
items.artifacts.chaliceofblood.desc=Piala perak berkilauan ini dihiasi secara aneh dengan permata tajam di bagian tepinya.
items.artifacts.chaliceofblood.desc_1=Saat memegang piala itu, Anda merasa anehnya terdorong untuk menusuk diri sendiri dengan permata yang tajam.
items.artifacts.chaliceofblood.desc_2=Sebagian darahmu terkumpul di dalam cawan, kamu dapat merasakan secara samar cawan itu menyalurkan energi kehidupan ke dalam dirimu, meningkatkan regenerasi kesehatan alamimu. Kamu tetap ingin melukai dirimu sendiri dengan cawan itu, meskipun kamu tahu itu akan menyakitkan.
items.artifacts.chaliceofblood.desc_3=Cawan itu penuh hingga meluap dengan sari kehidupan Anda. Anda dapat merasakan cawan itu mengalirkan energi kehidupan kembali ke dalam diri Anda.
items.artifacts.chaliceofblood.desc_cursed=Piala terkutuk itu telah terikat pada tanganmu, dan menghambat kemampuanmu untuk memulihkan kesehatan.
items.artifacts.chaliceofblood.name=piala darah
items.artifacts.chaliceofblood.no=Tidak, saya berubah pikiran.
items.artifacts.chaliceofblood.ondeath=Piala itu menyedot habis sari kehidupanmu...
items.artifacts.chaliceofblood.onprick=Anda menusuk diri sendiri, dan sari kehidupan Anda mengalir ke dalam cawan.
items.artifacts.chaliceofblood.prick_warn=Setiap kali Anda menggunakan cawan, energi hidup Anda akan terkuras lebih banyak, tetapi sebagai gantinya akan meningkatkan regenerasi kesehatan alami Anda. Saat ini, menusuk diri sendiri akan menimbulkan kerusakan sebesar _%1$d-%2$d_, meskipun kerusakan ini dapat dikurangi dengan _pemblokiran fisik dan magis atau pengurangan kerusakan_. Tanpa mempertimbangkan efek pengurangan kerusakan, menusuk diri sendiri saat ini memiliki peluang _%3$s%%_ untuk menguras energi hidup Anda sepenuhnya. Apakah Anda yakin ingin mempersembahkan lebih banyak energi hidup kepada cawan?
items.artifacts.chaliceofblood.yes=Ya, saya tahu apa yang saya lakukan.
items.artifacts.cloakofshadows$cloakstealth.desc=Jubah bayanganmu memberimu kemampuan tak terlihat saat kamu diselimuti olehnya. Kamu akan tetap berjubah sampai efeknya hilang atau daya jubahmu habis. Saat kamu tak terlihat, musuh tidak dapat menyerang atau mengikutimu. Serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan kemampuan tak terlihat. Giliran sampai daya habis: ZXQPH0.
items.artifacts.cloakofshadows$cloakstealth.levelup=Jubahmu menjadi semakin kuat!
items.artifacts.cloakofshadows$cloakstealth.name=berjubah
items.artifacts.cloakofshadows$cloakstealth.no_charge=Jubahmu telah kehabisan energi.
items.artifacts.cloakofshadows.ac_stealth=TERSEMBUNYI
