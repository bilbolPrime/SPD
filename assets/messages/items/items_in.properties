items.potions.potion.no=Tidak, saya berubah pikiran.
items.potions.potion.shatter=Labu tersebut pecah dan cairannya terciprat tanpa membahayakan.
items.potions.potion.silver=ramuan perak
items.potions.potion.sure_drink=Apakah kamu yakin ingin meminumnya? Dalam kebanyakan kasus, sebaiknya kamu melemparkan ramuan semacam itu ke musuhmu.
items.potions.potion.sure_throw=Apakah kamu yakin ingin membuangnya? Dalam kebanyakan kasus, lebih baik meminumnya.
items.potions.potion.turquoise=ramuan pirus
items.potions.potion.unknown_desc=Cairan berwarna %s berputar-putar di dalam botol ini. Entah apa yang akan terjadi jika diminum atau dilempar.
items.potions.potion.yes=Ya, saya tahu apa yang saya lakukan.
items.potions.potionofexperience.desc=Pengalaman-pengalaman bersejarah dari berbagai pertempuran yang dituangkan dalam bentuk cair, ramuan ini akan langsung meningkatkan level pengalaman Anda.
items.potions.potionofexperience.name=ramuan pengalaman
items.potions.potionoffrost.desc=Saat terkena udara terbuka, zat ini menguap menjadi awan beku. Makhluk yang menyentuhnya akan membeku di tempat, tak bisa bergerak ataupun bertindak.
items.potions.potionoffrost.name=ramuan es
items.potions.potionofhaste.desc=Meminum cairan yang rasanya manis aneh ini akan memberi Anda energi luar biasa untuk waktu singkat, memungkinkan Anda berlari dengan kecepatan tinggi.
items.potions.potionofhaste.energetic=Kamu merasa bersemangat!
items.potions.potionofhaste.name=ramuan kecepatan
items.potions.potionofhealing.desc=Ramuan yang seketika memulihkan seluruh kesehatanmu dan menyembuhkan keracunan.
items.potions.potionofhealing.heal=Lukamu mulai menutup.
items.potions.potionofhealing.name=ramuan penyembuhan
items.potions.potionofinvisibility.desc=Meminum ramuan ini membuatmu tak terlihat untuk sementara. Musuh tak akan bisa melihatmu selama efeknya berlangsung. Menyerang musuh atau memakai tongkat sihir maupun gulungan di hadapannya akan mengakhiri efek ini.
items.potions.potionofinvisibility.invisible=Kamu melihat tanganmu menjadi tak terlihat!
items.potions.potionofinvisibility.name=ramuan menghilang
items.potions.potionoflevitation.desc=Cairan aneh ini membuatmu melayang sehingga bisa melewati perangkap dengan mudah. Namun, api dan gas memenuhi udara, jadi keduanya tak bisa dihindari dengan melayang.
items.potions.potionoflevitation.float=Kamu melayang ke udara!
items.potions.potionoflevitation.name=ramuan levitasi
items.potions.potionofliquidflame.desc=Labu ini berisi senyawa tidak stabil yang akan meledak dan terbakar hebat jika terkena udara terbuka.
items.potions.potionofliquidflame.name=ramuan api cair
items.potions.potionofmindvision.desc=Setelah meminumnya, pikiran Anda akan selaras dengan sinyal psikis makhluk-makhluk yang jauh, memungkinkan Anda untuk merasakan keberadaan biologis melalui dinding. Ramuan ini juga akan memungkinkan Anda untuk melihat menembus dinding dan pintu di dekat Anda.
items.potions.potionofmindvision.name=ramuan penglihatan pikiran
items.potions.potionofmindvision.see_mobs=Entah bagaimana, kamu bisa merasakan kehadiran pikiran makhluk lain!
items.potions.potionofmindvision.see_none=Entah bagaimana, Anda bisa merasakan bahwa Anda sendirian di level ini saat ini.
items.potions.potionofparalyticgas.desc=Saat terpapar udara terbuka, cairan dalam labu ini akan menguap menjadi kabut kuning yang mematikan rasa. Siapa pun yang menghirup kabut tersebut akan langsung lumpuh, tidak dapat bergerak untuk beberapa waktu setelah kabut menghilang. Benda ini dapat dilemparkan ke musuh yang berada jauh untuk menjebak mereka dalam efek gas tersebut.
items.potions.potionofparalyticgas.name=ramuan gas paralitik
items.potions.potionofpurity.desc=Zat ini dengan cepat menetralkan semua gas berbahaya dalam area pengaruhnya. Meminumnya memberi kekebalan sementara terhadap gas tersebut.
items.potions.potionofpurity.freshness=Anda merasakan kesegaran yang luar biasa di udara.
items.potions.potionofpurity.name=Ramuan Pemurnian
items.potions.potionofpurity.protected=Selubung pelindung menyelimuti Anda!
items.potions.potionofstrength.desc=Cairan ampuh ini akan mengalir melalui otot Anda, meningkatkan kekuatan Anda secara permanen sebesar satu poin.
items.potions.potionofstrength.msg=Kekuatan baru mengalir deras di tubuhmu, sekarang kamu memiliki kekuatan %d!
items.potions.potionofstrength.name=ramuan kekuatan
items.potions.potionoftoxicgas.desc=Membuka atau memecahkan botol kaca bertekanan ini akan menyebabkan isinya meledak menjadi awan gas hijau beracun yang mematikan. Anda mungkin memilih untuk melemparkan ramuan ini ke musuh yang jauh daripada membukanya dengan tangan.
items.potions.potionoftoxicgas.name=ramuan gas beracun
items.quest.ceremonialcandle.desc=Seperangkat lilin, yang meleleh dan menyatu karena penggunaan. Sendirian, lilin-lilin ini tidak berharga, tetapi jika digunakan bersama lilin lain dalam pola tertentu, lilin-lilin ini dapat memfokuskan energi untuk ritual pemanggilan.
items.quest.ceremonialcandle.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.ceremonialcandle.name=lilin upacara
items.quest.corpsedust.chill=Rasa dingin menjalar di sekujur tubuhmu.
items.quest.corpsedust.desc=Gumpalan debu mayat secara kasat mata tidak berbeda dari gumpalan debu biasa. Namun, Anda dapat merasakan energi jahat yang bersembunyi di dalamnya. Menyingkirkannya sesegera mungkin adalah ide yang bagus.
items.quest.corpsedust.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.corpsedust.name=debu mayat
items.quest.darkgold.desc=Logam ini disebut gelap bukan karena warnanya (tidak berbeda dengan emas biasa), tetapi karena meleleh di bawah sinar matahari, sehingga tidak berguna di permukaan.
items.quest.darkgold.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.darkgold.name=bijih emas gelap
items.quest.darkgold.you_now_have=Anda sekarang memiliki bijih emas gelap %d.
items.quest.dwarftoken.desc=Banyak kurcaci dan beberapa ciptaan mereka yang lebih besar membawa potongan-potongan logam kecil yang tujuannya tidak diketahui. Mungkin itu perhiasan atau mungkin semacam identitas. Kurcaci adalah makhluk yang aneh.
items.quest.dwarftoken.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.dwarftoken.name=token kurcaci
items.quest.embers.desc=Bara api istimewa yang hanya dapat dipanen dari elemental api muda. Bara api ini memancarkan energi termal.
items.quest.embers.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.embers.name=bara api unsur
items.quest.escapecrystal.ac_use=MENGGUNAKAN
items.quest.escapecrystal.desc=Sebuah kristal mantra magis tipis yang tampaknya mengandung sihir teleportasi. Anda dapat menggunakan kristal ini kapan saja untuk meninggalkan ruang bawah tanah kurcaci, tetapi Anda tidak akan dapat membawa apa pun keluar bersama Anda!
items.quest.escapecrystal.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.escapecrystal.name=kristal pelarian
items.quest.gooblob.desc=Gumpalan lendir kenyal, terpisah dari Goo saat ia mati. Bentuknya hampir seperti bola jeli besar, meskipun Anda tidak akan berani memakannya.\n\nBenda ini tidak melakukan apa pun sendiri, tetapi mungkin berguna jika dikombinasikan dengan ramuan tertentu, atau bom. Setidaknya, benda ini seharusnya dapat diubah menjadi sejumlah energi yang layak.
items.quest.gooblob.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.quest.gooblob.name=gumpalan lendir
items.quest.metalshard.desc=Sebuah pecahan logam berkarat terkutuk, yang terlepas dari DM-300 saat dihancurkan. Anda dapat merasakan sihir jahat yang tidak aktif di dalamnya.\n\nBenda ini tidak melakukan apa pun sendiri, tetapi mungkin berguna jika dikombinasikan dengan gulungan tertentu, atau bom. Paling tidak, benda ini seharusnya dapat diubah menjadi sejumlah energi yang layak.
items.quest.metalshard.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.quest.metalshard.name=pecahan logam terkutuk
items.quest.pickaxe.ability_desc=Duelis dapat _menusuk_ musuh dengan beliung. Serangan ini dijamin mengenai sasaran, memberikan efek rentan selama 3 giliran, dan memberikan _kerusakan sebesar _%1$d-%2$d_ kepada musuh dengan kulit kaku.
items.quest.pickaxe.ability_name=menembus
items.quest.pickaxe.desc=Ini adalah alat yang kokoh dan berat untuk memecah batu. Anda tidak perlu melengkapi diri dengan beliung untuk menambang dengannya, tetapi mungkin dapat digunakan sebagai senjata dalam keadaan darurat.
items.quest.pickaxe.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
items.quest.pickaxe.name=beliung
items.quest.pickaxe.upgrade_ability_stat_name=Kerusakan Kemampuan
items.quest.ratskull.desc=Tengkorak tikus yang ukurannya mengejutkan. Ini akan menjadi piala buruan yang bagus, jika Anda memiliki dinding untuk memasangnya.
items.quest.ratskull.name=tengkorak tikus raksasa
items.remains.bowfragment.desc=Pecahan kayu yang patah ini dulunya adalah bagian dari busur roh seorang Pemburu Wanita yang hilang. Anda masih dapat merasakan sedikit energi alam yang tersisa di pecahan tersebut, Anda dapat menggunakan pecahan itu untuk menumbuhkan rumput tinggi di sekitar Anda. Namun, melakukan hal ini akan menghancurkan pecahan tersebut.
items.remains.bowfragment.name=fragmen busur
items.remains.brokenhilt.desc=Gagang pedang yang patah ini tampak seperti berasal dari senjata seorang Duelis yang kalah. Anda masih bisa merasakan sedikit kekuatan bela diri yang tersisa di gagang pedang ini, Anda dapat menggunakannya untuk mendapatkan sedikit bonus kerusakan pada dua serangan jarak dekat Anda berikutnya. Namun, melakukan ini akan menghancurkan gagang pedang tersebut.
items.remains.brokenhilt.name=gagang patah
items.remains.brokenstaff.desc=Tongkat sihir ini telah patah menjadi dua setelah pemiliknya meninggal. Anda masih dapat merasakan sedikit energi magis yang tersisa di tongkat tersebut, Anda dapat menggunakannya untuk memberi sedikit tambahan daya pada tongkat sihir Anda. Namun, melakukan hal ini akan menghancurkan tongkat tersebut.
items.remains.brokenstaff.name=staf yang patah
items.remains.cloakscrap.desc=Potongan kain tembus pandang ini tampak seperti berasal dari jubah bayangan milik Rogue yang telah tiada. Anda masih bisa merasakan sedikit energi mistis yang tersisa di dalamnya, Anda dapat menggunakannya untuk memberikan sedikit peningkatan daya pada artefak Anda. Namun, melakukan ini akan menghancurkan kain tersebut.
items.remains.cloakscrap.name=potongan kain
items.remains.remainsitem.ac_use=MENGGUNAKAN
items.remains.remainsitem.discover_hint=Anda dapat menemukan item ini di sisa-sisa hero tertentu dari permainan yang hilang sebelumnya.
items.remains.sealshard.desc=Serpihan kecil lilin merah ini tampak seperti berasal dari segel seorang Prajurit yang gugur. Anda masih bisa merasakan sedikit kekuatan tekad yang melekat pada segel tersebut, Anda dapat menggunakannya untuk memberikan sedikit perlindungan pada diri sendiri. Namun, melakukan hal ini akan menghancurkan serpihan segel tersebut.
items.remains.sealshard.name=pecahan segel
items.remains.tornpage.desc=Halaman ini tampak seperti disobek dari kitab suci seorang Pendeta yang sudah kedaluwarsa. Masih ada sedikit energi ilahi yang melekat padanya, Anda dapat menggunakannya untuk memulihkan sedikit kesehatan. Namun, melakukan ini akan menghancurkan halaman yang sobek tersebut.
