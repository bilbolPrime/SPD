items.weapon.curses.explosive.warm=Hangat...
items.weapon.curses.friendly.desc=Senjata ramah paling cocok untuk kaum pasifis, karena terkadang memicu sihir yang membuat pertarungan menjadi mustahil.
items.weapon.curses.friendly.elestrike_desc=Serangan elemen dengan kutukan ramah memiliki peluang 50% untuk memikat setiap musuh dalam jangkauan selama 6 putaran.
items.weapon.curses.friendly.name=ramah %s
items.weapon.curses.polarized.desc=Senjata terpolarisasi dipengaruhi oleh sihir yang menyebabkan serangannya memberikan kerusakan 50% lebih besar, atau tidak memberikan kerusakan sama sekali.
items.weapon.curses.polarized.elestrike_desc=Serangan elemen dengan kutukan terpolarisasi memiliki peluang 50% untuk memberikan 24-36 kerusakan pada setiap musuh dalam jangkauan.
items.weapon.curses.polarized.name=terpolarisasi %s
items.weapon.curses.sacrificial.desc=Senjata kurban akan menuntut darah dari pemakainya sebagai imbalan untuk menyerang musuh. Semakin sehat pemakainya, semakin banyak darah yang akan diambil oleh kutukan tersebut.
items.weapon.curses.sacrificial.elestrike_desc=Serangan elemen dengan kutukan pengorbanan menyebabkan sang pahlawan dan setiap musuh dalam jangkauan mengalami pendarahan sebesar 12 HP.
items.weapon.curses.sacrificial.name=pengorbanan %s
items.weapon.curses.wayward$waywardbuff.desc=Sihir senjata liar Anda telah aktif, membuatnya sangat tidak akurat untuk waktu singkat. Perhatikan bahwa ini tidak memengaruhi serangan yang dijamin mengenai sasaran, seperti serangan mendadak. Berhasil menyerang dengan senjata liar akan segera menghilangkan efek ini.\n\nGiliran tersisa: %s.
items.weapon.curses.wayward$waywardbuff.name=nakal
items.weapon.curses.wayward.desc=Senjata yang menyimpang terkadang menjadi sangat tidak akurat. Sihir ini berlangsung sebentar saat aktif, tetapi dapat dihilangkan dengan memberikan pukulan menggunakan senjata yang menyimpang tersebut.
items.weapon.curses.wayward.elestrike_desc=Serangan elemen dengan kutukan yang menyimpang memiliki peluang 50% untuk mengutuk setiap musuh dalam jangkauan selama 6 putaran.
items.weapon.curses.wayward.name=%s yang nakal
items.weapon.enchantments.blazing.desc=Mantra ini menyebabkan api menyembur keluar dari senjata, membakar musuh dan memberikan kerusakan tambahan pada musuh yang sudah terbakar.
items.weapon.enchantments.blazing.elestrike_desc=Serangan elemen dengan mantra yang menyala-nyala menyebarkan api ke setiap petak dalam jangkauan, yang berlangsung selama 8 putaran.
items.weapon.enchantments.blazing.name=%s yang menyala-nyala
items.weapon.enchantments.blocking$blockbuff.desc=Mantra penghalang senjatamu telah memberimu peningkatan singkat pada kekuatan pertahananmu!\n\nSisa perisai: %d\n\nSisa giliran: %s.
items.weapon.enchantments.blocking$blockbuff.name=pemblokiran
items.weapon.enchantments.blocking.desc=Senjata yang digunakan untuk menangkis serangan memiliki peluang untuk memberikan perisai singkat setelah digunakan untuk menyerang.
items.weapon.enchantments.blocking.elestrike_desc=Serangan elemen dengan mantra penghalang memberikan Duelist tambahan 6 perisai untuk setiap musuh dalam jangkauan.
items.weapon.enchantments.blocking.name=memblokir %s
items.weapon.enchantments.blooming.desc=Senjata berbunga mengandung sihir yang akan menyebabkan tumbuh-tumbuhan tumbuh di atas atau di sekitar orang yang terkena serangannya.
items.weapon.enchantments.blooming.elestrike_desc=Serangan elemen dengan mantra mekar menyebarkan rumput hingga sejauh 8 petak, dan mengikat semua musuh dalam jangkauan selama 6 giliran.
items.weapon.enchantments.blooming.name=blooming %s
items.weapon.enchantments.chilling.desc=Musuh yang terkena mantra ini akan membeku, memperlambat gerakan dan serangan mereka.
items.weapon.enchantments.chilling.elestrike_desc=Serangan elemen dengan mantra yang membekukan menyebarkan udara dingin ke setiap petak dalam jangkauan, yang berlangsung selama 8 putaran.
items.weapon.enchantments.chilling.name=%s yang dingin
items.weapon.enchantments.corrupting.desc=Mantra ampuh ini memiliki kemampuan untuk mengendalikan musuh sesuai keinginan Anda. Ketika musuh terbunuh dengan senjata ini, ada kemungkinan mereka akan menjadi jahat alih-alih mati.
items.weapon.enchantments.corrupting.elestrike_desc=Serangan elemen dengan mantra perusak memiliki peluang 5-25% (berdasarkan HP yang hilang) untuk merusak setiap musuh dalam jangkauan, kecuali target utama.
items.weapon.enchantments.corrupting.name=merusak %s
items.weapon.enchantments.elastic.desc=Senjata elastis memiliki peluang untuk melemparkan musuh mundur dalam jarak pendek.
items.weapon.enchantments.elastic.elestrike_desc=Serangan elemen dengan mantra elastis akan mendorong semua musuh dalam jangkauan mundur sejauh 5 petak.
items.weapon.enchantments.elastic.name=elastis %s
items.weapon.enchantments.grim.desc=Mantra ampuh ini memiliki kekuatan untuk langsung mengeksekusi musuh. Efeknya lebih mungkin terjadi jika musuh lebih lemah.
items.weapon.enchantments.grim.elestrike_desc=Serangan elemen dengan mantra mengerikan memiliki peluang 6-30% (berdasarkan HP yang hilang) untuk membunuh setiap musuh dalam jangkauan, kecuali target utama.
items.weapon.enchantments.grim.name=suram %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Senjata Anda telah menyimpan kelebihan kekuatan dari pukulan mematikan sebelumnya, dan akan menerapkannya sebagai bonus kerusakan pada serangan Anda berikutnya. Namun, energi tersebut akan perlahan memudar seiring waktu. Kerusakan yang Disimpan: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=kerusakan yang dilestarikan
items.weapon.enchantments.kinetic.desc=Ketika musuh terbunuh dengan senjata kinetik, setiap kelebihan kekuatan akan tersimpan di dalam senjata dan akan diterapkan pada serangan sukses berikutnya.
items.weapon.enchantments.kinetic.elestrike_desc=Serangan elemen dengan penguatan kinetik memberikan 40% dari kerusakan yang tersimpan kepada setiap musuh dalam jangkauan, kecuali target utama.
items.weapon.enchantments.kinetic.name=kinetik %s
items.weapon.enchantments.lucky.desc=Musuh yang terbunuh oleh senjata yang tepat memiliki peluang untuk menjatuhkan jarahan tambahan.
items.weapon.enchantments.lucky.elestrike_desc=Serangan elemen dengan mantra keberuntungan memiliki peluang 12,5% untuk memunculkan jarahan di bawah setiap musuh dalam jangkauan. Efek ini hanya dapat dipicu sekali per musuh.
items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.projecting.desc=Dengan mantra ini, senjata jarak dekat akan mendapatkan jangkauan tambahan. Senjata jarak jauh akan menembus dinding saat diarahkan ke target di dekatnya.
items.weapon.enchantments.projecting.elestrike_desc=Serangan elemen dengan mantra proyeksi memberikan 30% kerusakan pada setiap musuh dalam jangkauan, kecuali target utama.
items.weapon.enchantments.projecting.name=memproyeksikan %s
items.weapon.enchantments.shocking.desc=Listrik menyambar dari senjata kejut, memberikan kerusakan tambahan kepada semua musuh di dekatnya.
items.weapon.enchantments.shocking.elestrike_desc=Serangan elemen dengan mantra kejut menyebarkan listrik ke setiap petak dalam jangkauan, yang berlangsung selama 8 putaran.
items.weapon.enchantments.shocking.name=mengejutkan %s
items.weapon.enchantments.unstable.desc=Mantra ini memancarkan energi kacau, bertindak sebagai mantra yang berbeda setiap kali mengenai target.
items.weapon.enchantments.unstable.elestrike_desc=Serangan elemen dengan mantra yang tidak stabil akan menerapkan efek mantra acak pada setiap musuh dalam jangkauan, kecuali target utama.
items.weapon.enchantments.unstable.name=%s tidak stabil
items.weapon.enchantments.vampiric.desc=Mantra ampuh ini menyerap energi kehidupan dari musuh setiap kali menyerang, lalu mengembalikannya ke pemakainya. Efeknya akan lebih kuat jika kesehatan pemakainya lebih rendah.
items.weapon.enchantments.vampiric.elestrike_desc=Serangan elemen dengan mantra vampir menyembuhkan Duelist sebesar 2,5 HP untuk setiap musuh dalam jangkauan.
items.weapon.enchantments.vampiric.name=vampir %s
items.weapon.melee.assassinsblade.ability_desc=Duelis dapat menyelinap sambil memegang pedang pembunuh. Kemampuan ini memungkinkan Duelis untuk langsung berteleportasi hingga 3 petak dan memberinya _%d giliran tembus pandang._
items.weapon.melee.assassinsblade.ability_name=menyelinap
items.weapon.melee.assassinsblade.desc=Sebuah bilah kecil bergelombang yang terbuat dari obsidian, sulit digunakan meskipun ringan, tetapi mematikan jika mengenai sasaran yang tepat.
items.weapon.melee.assassinsblade.name=pedang pembunuh
items.weapon.melee.assassinsblade.stats_desc=Senjata ini lebih ampuh melawan musuh yang tidak waspada.
items.weapon.melee.assassinsblade.typical_ability_desc=Duelis dapat menyelinap sambil memegang pedang pembunuh. Kemampuan ini memungkinkan Duelis untuk langsung berteleportasi hingga 3 petak dan biasanya memberinya _%d giliran tembus pandang._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.battleaxe.ability_desc=Duelis dapat melakukan _pukulan berat_ dengan kapak perang. Serangan terkonsentrasi ini memberikan _%1$d-%2$d kerusakan_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.battleaxe.ability_name=pukulan berat
items.weapon.melee.battleaxe.desc=Kepala kapak perang yang terbuat dari baja berukuran besar ini memberikan bobot yang cukup besar di balik setiap ayunan lebar.
items.weapon.melee.battleaxe.name=kapak perang
items.weapon.melee.battleaxe.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.battleaxe.typical_ability_desc=Duelis dapat melakukan _pukulan berat_ dengan kapak perang. Serangan terkonsentrasi ini biasanya memberikan _%1$d-%2$d kerusakan_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.crossbow$chargedshot.desc=Sang Duelis memfokuskan kekuatannya ke busur panahnya. Serangan berikutnya yang dia lakukan dengannya akan selalu mengenai sasaran dan menerapkan salah satu dari tiga efek berikut: \n - Serangan jarak dekat akan mendorong musuh beberapa petak jauhnya. \n - Anak panah tanpa ujung akan memberikan kerusakan bonus. \n - Anak panah berujung akan mendapatkan penggunaan tambahan dan menerapkan efeknya di area 7x7. Efek anak panah positif hanya akan memengaruhi sekutu, dan efek berbahaya hanya akan berlaku untuk musuh. Sang Duelis tidak dapat menggunakan kemampuan ini untuk menerapkan efek anak panah positif pada dirinya sendiri.
items.weapon.melee.crossbow$chargedshot.name=didakwa
items.weapon.melee.crossbow.ability_desc=Sang Duelis dapat _mengisi daya_ busur panahnya, menyebabkan serangan reguler berikutnya selalu mengenai sasaran dan menerapkan salah satu dari tiga efek: serangan jarak dekat akan menjatuhkan musuh, anak panah tanpa ujung akan memberikan _+%1$d kerusakan_, dan anak panah berujung akan menerapkan efeknya di area 7x7 dan bertahan selama _%2$d penggunaan lagi_.
items.weapon.melee.crossbow.ability_name=tembakan terisi
items.weapon.melee.crossbow.desc=Senjata yang cukup rumit yang menembakkan anak panah dengan kecepatan luar biasa. Meskipun tidak dirancang untuk itu, bobot dan konstruksi kokoh busur panah ini menjadikannya senjata jarak dekat yang layak juga.
items.weapon.melee.crossbow.name=busur silang
items.weapon.melee.crossbow.stats_desc=Senjata ini meningkatkan kekuatan lemparan anak panah sehingga menghasilkan kerusakan sebesar _%1$d-%2$d_ saat digunakan, dan bahkan akan memberikan efek sihirnya pada anak panah tersebut.
items.weapon.melee.crossbow.typical_ability_desc=Sang Duelis dapat _mengisi daya_ busur panahnya, menyebabkan serangan reguler berikutnya selalu mengenai sasaran dan menerapkan salah satu dari tiga efek: serangan jarak dekat akan menjatuhkan musuh, anak panah tanpa ujung biasanya akan memberikan _+%1$d kerusakan_, dan anak panah berujung akan menerapkan efeknya di area 7x7 dan biasanya bertahan selama _%2$d penggunaan lebih banyak_.
items.weapon.melee.crossbow.typical_stats_desc=Biasanya senjata ini meningkatkan kerusakan yang ditimbulkan oleh anak panah yang dilempar sebesar _%1$d-%2$d_ saat digunakan, dan bahkan akan memberikan efek sihirnya pada anak panah tersebut.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Peningkatan Kemampuan
items.weapon.melee.cudgel.ability_desc=Duelis dapat melakukan pukulan berat dengan gada. Serangan terkonsentrasi ini memberikan kerusakan sebesar _%1$d-%2$d_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.cudgel.ability_name=pukulan berat
items.weapon.melee.cudgel.desc=Sebuah gada kuningan kecil, dibuat lebih sebagai alat pertahanan diri bagi para bangsawan daripada sebagai senjata petualangan.
items.weapon.melee.cudgel.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
