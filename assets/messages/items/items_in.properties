items.artifacts.driedrose.desc_no_quest=Sekuntum mawar tua yang kering, namun entah bagaimana masih tetap utuh meskipun usianya sudah tua. Tampaknya memiliki kekuatan spiritual, tetapi Anda tidak tahu bagaimana cara menggunakannya saat ini.
