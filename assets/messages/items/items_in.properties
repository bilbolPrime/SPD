items.artifacts.driedrose.desc=Apakah ini mawar yang disebutkan hantu itu sebelum menghilang? Tampaknya mawar ini memiliki kekuatan spiritual, mungkin dapat digunakan untuk menyalurkan energi prajurit yang hilang itu.
