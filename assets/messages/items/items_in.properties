items.weapon.melee.rapier.ability_desc=Duelis dapat menerjang dengan rapier ke arah musuh yang berjarak 1 petak. Serangan ini bergerak menuju musuh, memberikan kerusakan sebesar _%1$d-%2$d_, dan dijamin mengenai sasaran.
items.weapon.melee.rapier.ability_name=terjang
items.weapon.melee.rapier.desc=Pedang lurus ramping yang menawarkan perlindungan tertentu dengan imbalan daya tebas yang lebih rendah.
items.weapon.melee.rapier.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
