items.artifacts.driedrose$wndghosthero.desc=Hantu itu sendiri lemah, tetapi wujudnya cukup kokoh untuk dilengkapi dengan senjata dan baju besi. Mereka akan dapat menggunakan barang-barang ini seperti yang Anda lakukan. Hantu saat ini dapat melengkapi diri dengan barang-barang yang membutuhkan kekuatan hingga _%d_.
