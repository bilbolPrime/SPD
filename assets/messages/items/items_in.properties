items.weapon.missiles.trident.desc=Tombak lempar berukuran besar dengan tiga ujung yang mematikan. Tombak ini kuat, tetapi cukup berat.
items.weapon.missiles.trident.name=trisula
items.weapon.spiritbow.ac_shoot=MENEMBAK
items.weapon.spiritbow.desc=Sebuah busur yang terbuat dari kayu ajaib kuno. Tali busur dan ukirannya bersinar dengan cahaya biru pucat. Saat tali busur ditarik, busur ini akan memunculkan anak panah ajaib yang dapat ditembakkan ke musuh.
items.weapon.spiritbow.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.weapon.spiritbow.name=busur roh
items.weapon.spiritbow.prompt=Pilih target
items.weapon.spiritbow.stats=Busur panah tidak dapat ditingkatkan secara langsung, tetapi akan terus menjadi lebih kuat seiring dengan naiknya level Anda. Pada level Anda saat ini, anak panah yang ditembakkan dari busur akan memberikan kerusakan sebesar _%1$d-%2$d_ dan membutuhkan kekuatan sebesar _%3$d_ untuk digunakan dengan benar.
items.weapon.weapon$enchantment.discover_hint=Anda dapat menemukan item dengan efek ini secara acak di dalam ruang bawah tanah, atau mencoba menerapkannya sendiri pada sebuah item.
