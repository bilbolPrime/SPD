items.weapon.melee.quarterstaff$defensivestance.desc=Sang Duelis menggunakan tongkatnya untuk menangkis pukulan dan proyektil yang datang. Selama dia berada dalam posisi ini, penghindarannya terhadap semua serangan menjadi tiga kali lipat.\n\nGiliran tersisa: %s.
items.weapon.melee.quarterstaff$defensivestance.name=sikap defensif
items.weapon.melee.quarterstaff.ability_desc=Duelis dapat mengambil posisi bertahan dengan tongkat. Posisi ini tidak memerlukan waktu untuk diaktifkan dan melipatgandakan penghindarannya selama _%d giliran._
items.weapon.melee.quarterstaff.ability_name=sikap defensif
