items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Anda baru saja melempar shuriken secara instan, dan harus menunggu sebelum melakukannya lagi. Shuriken masih dapat dilempar, tetapi dengan kecepatan senjata normal.\n\nGiliran Tersisa: %s.
