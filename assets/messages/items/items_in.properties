items.weapon.melee.flail$spinabilitytracker.desc=Duelis sedang memutar cambuknya, mengumpulkan damage untuk serangan reguler berikutnya. Setiap putaran membutuhkan satu giliran tetapi meningkatkan damage, hingga maksimal tiga putaran. Cambuk juga dijamin mengenai target saat berputar.\n\nPutaran saat ini: %1$d%%.\nGiliran tersisa: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=pemintalan
items.weapon.melee.flail.ability_desc=Duelis dapat memutar cambuk untuk mengumpulkan kekuatan dalam waktu singkat. Setiap putaran cambuk diputar, ia akan memberikan kerusakan +%d pada serangan reguler berikutnya, hingga maksimal 3 kali. Cambuk yang berputar juga dijamin mengenai sasaran. Hanya memulai memutar cambuk saja membutuhkan satu muatan.
items.weapon.melee.flail.ability_name=putaran
items.weapon.melee.flail.desc=Bola berduri yang diikatkan pada pegangan dengan seutas rantai. Sangat sulit dikendalikan, tetapi sangat menghancurkan jika mengenai sasaran dengan tepat.
items.weapon.melee.flail.name=memukul
items.weapon.melee.flail.spin_warn=Kamu tidak bisa memutar alat pengirik itu lagi.
items.weapon.melee.flail.stats_desc=Senjata ini agak tidak akurat.\nSenjata ini tidak dapat melakukan serangan mendadak.
items.weapon.melee.flail.typical_ability_desc=Duelis dapat memutar cambuk untuk mengumpulkan kekuatan dalam waktu singkat. Setiap putaran cambuk diputar, biasanya akan memberikan kerusakan +%d pada serangan reguler berikutnya, hingga maksimal 3 kali. Cambuk yang berputar juga dijamin mengenai target. Hanya memulai memutar cambuk saja membutuhkan satu muatan.
items.weapon.melee.gauntlet.ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sarung tangan batu. Serangan ini dijamin mengenai sasaran dan memberikan _+%d kerusakan_ setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.gauntlet.ability_name=serangan kombo
items.weapon.melee.gauntlet.desc=Sarung tangan raksasa ini terbuat dari kain merah tua dengan lapisan batu magis yang berat di atasnya. Kain tersebut mengencang di sekeliling tubuh Anda, membuat lempengan batu tebal itu hampir seperti kulit kedua. Mengayunkan senjata seberat ini membutuhkan kekuatan, tetapi menambah kekuatan luar biasa pada pukulan Anda.
items.weapon.melee.gauntlet.name=sarung tangan batu
items.weapon.melee.gauntlet.stats_desc=Ini adalah senjata yang sangat cepat.
items.weapon.melee.gauntlet.typical_ability_desc=Duelis dapat melakukan serangan kombo dengan sarung tangan batu. Serangan ini dijamin mengenai sasaran dan biasanya memberikan kerusakan +%d setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.glaive.ability_desc=Duelis dapat menggunakan ujung tombak untuk menusuk musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini memberikan kerusakan sebesar _%1$d-%2$d_, mendorong musuh mundur, dan dijamin mengenai sasaran.
items.weapon.melee.glaive.ability_name=paku
items.weapon.melee.glaive.desc=Senjata berbatang panjang yang terdiri dari bilah pedang di ujung sebuah tiang.
items.weapon.melee.glaive.name=pedang
items.weapon.melee.glaive.stats_desc=Senjata ini agak lambat.\nSenjata ini memiliki jangkauan ekstra.
items.weapon.melee.glaive.typical_ability_desc=Duelis dapat menggunakan ujung tombak untuk menusuk musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_, mendorong musuh mundur, dan dijamin mengenai sasaran.
items.weapon.melee.gloves.ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sarung tangan bertabur. Serangan ini dijamin mengenai sasaran dan memberikan _+%d kerusakan_ setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.gloves.ability_name=serangan kombo
items.weapon.melee.gloves.desc=Sarung tangan bertabur paku ini tidak memberikan perlindungan nyata, tetapi berfungsi sebagai senjata yang berguna sekaligus membebaskan tangan.
items.weapon.melee.gloves.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.weapon.melee.gloves.name=sarung tangan bertabur
items.weapon.melee.gloves.stats_desc=Ini adalah senjata yang sangat cepat.
items.weapon.melee.gloves.typical_ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sarung tangan bertabur. Serangan ini dijamin mengenai sasaran dan biasanya memberikan _+%d kerusakan_ setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.greataxe.ability_desc=Sang Duelis dapat melakukan serangan pembalasan dengan kapak besar jika kesehatannya di bawah 50%%. Serangan dahsyat ini memberikan kerusakan sebesar _%1$d-%2$d_, dijamin mengenai sasaran, dan seketika jika membunuh musuh.
items.weapon.melee.greataxe.ability_name=retribusi
items.weapon.melee.greataxe.desc=Dirancang untuk diayunkan di atas bahu, kapak raksasa ini sekuat dan seberat bobotnya.
items.weapon.melee.greataxe.name=kapak besar
items.weapon.melee.greataxe.stats_desc=Senjata ini sangat berat.
items.weapon.melee.greataxe.typical_ability_desc=Sang Duelis dapat melakukan serangan pembalasan dengan kapak besar jika kesehatannya di bawah 50%%. Serangan dahsyat ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_, dijamin mengenai sasaran, dan seketika jika membunuh musuh.
items.weapon.melee.greatshield.ability_desc=Duelis dapat _melindungi_ dirinya sendiri dengan perisai besar, sepenuhnya meniadakan semua serangan fisik atau magis yang ditujukan kepadanya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri perlindungan.
items.weapon.melee.greatshield.ability_name=penjaga
items.weapon.melee.greatshield.desc=Lebih mirip tembok bergerak daripada perisai, massa logam raksasa ini membantu pertahanan, tetapi tidak menyisakan banyak ruang untuk menyerang.
items.weapon.melee.greatshield.name=perisai besar
items.weapon.melee.greatshield.stats_desc=Senjata ini memblokir 0-%d kerusakan. Pemblokiran ini meningkat seiring dengan peningkatan.
items.weapon.melee.greatshield.typical_ability_desc=Duelis dapat _melindungi_ dirinya sendiri dengan perisai besar, sepenuhnya meniadakan semua serangan fisik atau magis yang ditujukan kepadanya, biasanya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri perlindungan.
