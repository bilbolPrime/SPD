items.potions.potion.bistre=ramuan bistre
items.potions.potion.charcoal=ramuan arang
items.potions.potion.crimson=ramuan merah tua
items.potions.potion.discover_hint=Anda dapat menemukan item ini secara acak di dalam ruang bawah tanah, atau membuatnya melalui alkimia.
items.potions.potion.golden=ramuan emas
items.potions.potion.harmful=Ramuan berbahaya!
