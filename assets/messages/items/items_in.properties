items.rings.ringofhaste.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan kecepatan gerakan Anda sebesar _%s%%_ secara total.
items.rings.ringofhaste.desc=Cincin ini mempercepat aliran waktu bagi pemakainya, sehingga semua tindakan bisa dilakukan sedikit lebih cepat.
items.rings.ringofhaste.name=cincin kecepatan
