items.artifacts.lloydsbeacon.tele_fail=Sihir teleportasi itu gagal.
items.artifacts.masterthievesarmband.ac_steal=MENCURI
items.artifacts.masterthievesarmband.cursed=Kamu tidak bisa menggunakan ban lengan terkutuk.
items.artifacts.masterthievesarmband.desc=Ban lengan beludru ungu ini memiliki tanda seorang pencuri ulung. Ini bukan milikmu, tetapi mungkin juga bukan milik pemakainya sebelumnya.
items.artifacts.masterthievesarmband.desc_cursed=Gelang terkutuk itu terikat di pergelangan tanganmu, dan entah bagaimana kantung emasmu sepertinya perlahan-lahan semakin ringan...
items.artifacts.masterthievesarmband.desc_worn=Anda merasakan kekuatan yang meningkat di gelang di pergelangan tangan Anda saat Anda mendapatkan pengalaman. Anda dapat menggunakan kekuatan ini untuk mencuri dari toko, atau merampok musuh! Merampok musuh terjadi secara instan, membuat mereka kehilangan orientasi sesaat, dan memberi Anda kesempatan untuk mendapatkan barang rampasan apa pun yang mereka miliki! Kekuatan ini lebih efektif terhadap musuh yang tidak waspada. Merampok musuh yang sama beberapa kali tidak memberikan lebih banyak kesempatan untuk mendapatkan barang rampasan.
items.artifacts.masterthievesarmband.failed_steal=Kamu tidak berhasil mencuri apa pun.
items.artifacts.masterthievesarmband.full=Gelang lengan Anda sudah terisi penuh!
items.artifacts.masterthievesarmband.level_up=Gelangmu akan semakin kuat!
items.artifacts.masterthievesarmband.name=ban lengan pencuri ulung
items.artifacts.masterthievesarmband.no_charge=Baterai gelang Anda tidak mencukupi.
items.artifacts.masterthievesarmband.no_steal=Musuh itu tidak punya apa pun untuk dicuri.
items.artifacts.masterthievesarmband.no_target=Anda harus membidik musuh yang berada di sebelah Anda.
