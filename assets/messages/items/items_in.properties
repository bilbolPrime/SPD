items.weapon.curses.dazzling.desc=Senjata-senjata yang menyilaukan terkadang akan memancarkan cahaya yang sangat terang, membutakan segala sesuatu yang dapat melihatnya.
items.weapon.curses.dazzling.elestrike_desc=Serangan elemen dengan kutukan yang menyilaukan memiliki peluang 50% untuk membutakan setiap musuh dalam jangkauan selama 6 putaran.
items.weapon.curses.dazzling.name=%s yang mempesona
items.weapon.curses.displacing.desc=Senjata pemindah objek diresapi dengan sihir teleportasi kacau, memiliki kemampuan untuk memindahkan musuh secara acak di lantai arena.
