items.rings.ringofarcana.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan kekuatan mantra dan glif sebesar _%s%%_ secara total.
items.rings.ringofarcana.desc=Cincin ini meningkatkan kekuatan sihir pada senjata dan simbol pada baju zirah, termasuk kutukan! Pertama, cincin ini meningkatkan peluang aktivasi, dan kemudian meningkatkan kekuatan efek setelah peluang aktivasi mencapai 100%. Sebaliknya, cincin terkutuk akan melemahkan sihir, simbol, dan kutukan.
