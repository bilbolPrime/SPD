items.weapon.weapon.too_heavy=Karena kekuatanmu yang tidak memadai, senjata ini akan menghambat kecepatan serangan, akurasi, dan kemampuanmu untuk melakukan serangan mendadak.
items.weapon.weapon.weak_cursed=Meskipun terkena kutukan, Anda tetap bisa melepaskan senjata ini.

items.keys.skeletonkey.desc=Kunci ini terlihat serius: kepalanya berbentuk seperti tengkorak. Mungkin kunci ini bisa membuka pintu yang sangat penting.
items.weapon.missiles.bombarrow.desc=Anak panah dengan bom terpasang. Jaga jarak.
items.weapon.missiles.bombarrow.name=panah bom
items.weapon.missiles.missileweapon.damage_desc=Senjata ini memberikan kerusakan sebesar _%1$d_ hingga _%2$d_ per serangan.
items.bags.seedpouch.desc=Kantong beludru kecil ini bisa menyimpan benih sebanyak apa pun. Sangat praktis.
items.bags.seedpouch.name=kantong benih
items.potions.potionofmight.desc=Cairan kuat ini mengalir melalui ototmu, menambah kekuatan secara permanen sebanyak satu poin dan kesehatan sebanyak lima poin.
items.potions.potionofmight.name=ramuan keperkasaan
items.rings.ringofdetection.desc=Cincin ini membuat pemakainya menyadari perangkap tersembunyi dan pintu rahasia tanpa perlu meluangkan waktu untuk mencari. Cincin deteksi yang melemah menumpulkan indramu, sehingga rahasia lebih sulit ditemukan meski sedang dicari.
items.rings.ringofdetection.name=cincin deteksi
items.rings.ringofhaggler.desc=Cincin ini sebenarnya tidak memiliki kekuatan sihir. Namun, para pedagang mengenalinya sebagai tanda keanggotaan Serikat Pencuri. Biasanya mereka rela memberi diskon agar dibiarkan berdagang dengan tenang untuk sementara. Meningkatkan cincin ini tidak memberi manfaat tambahan.
items.rings.ringofhaggler.name=cincin penawar
items.rings.ringofherbalism.desc=Cincin ini meningkatkan peluang menemukan embun dan benih saat menginjak rumput.
items.rings.ringofherbalism.name=cincin herbal
items.rings.ringofmending.desc=Cincin ini memperkuat kemampuan tubuh untuk pulih, sehingga kesehatan kembali lebih cepat. Cincin yang melemah akan memperlambat, bahkan menghentikan pemulihan alami.
items.rings.ringofmending.name=cincin pemulihan
items.rings.ringofpower.desc=Medan energi yang terpancar dari cincin ini memperkuat tongkat sihirmu. Cincin kekuatan yang melemah justru melemahkannya.
items.rings.ringofpower.name=cincin kekuatan
items.rings.ringofsatiety.desc=Dengan cincin ini, kamu bisa bertahan lebih lama tanpa makan. Cincin kekenyangan yang melemah memberi efek sebaliknya.
items.rings.ringofsatiety.name=Cincin Kekenyangan
items.rings.ringofshadows.desc=Musuh akan lebih kecil kemungkinannya untuk memperhatikan Anda jika Anda mengenakan cincin ini. Cincin bayangan yang rusak akan memperingatkan musuh yang mungkin tidak menyadari kehadiran Anda.
items.rings.ringofshadows.name=cincin bayangan
items.rings.ringofthorns.desc=Cincin ini tidak menumbuhkan duri sungguhan, tetapi musuh yang menyerangmu ikut menerima sebagian kerusakan yang ditimbulkannya. Meningkatkan cincin ini tidak memberi manfaat tambahan.
items.rings.ringofthorns.name=cincin duri
items.scrolls.scrollofchallenge.desc=Saat dibaca keras-keras, gulungan ini akan mengeluarkan raungan menantang yang akan membangunkan semua monster dan memberi tahu mereka lokasi pembaca.
items.scrolls.scrollofchallenge.name=gulungan tantangan
items.scrolls.scrollofenchantment.desc=Gulungan ini mampu memberikan mantra acak pada senjata atau baju zirah, sehingga memberinya kekuatan khusus.
items.scrolls.scrollofenchantment.name=gulungan sihir
items.scrolls.scrollofpsionicblast.desc=Gulungan ini berisi energi penghancur, yang dapat disalurkan secara psionik untuk menimbulkan kerusakan besar pada semua makhluk dalam bidang pandang. Kilatan cahaya yang menyertainya akan membutakan sementara semua orang di area efek, termasuk pembaca gulungan tersebut.
items.scrolls.scrollofpsionicblast.name=gulungan ledakan psionik
items.scrolls.scrollofwipeout.desc=Bacalah gulungan ini untuk melepaskan murka roh-roh penjara bawah tanah, membunuh semua yang ada di level saat ini. Yah, hampir semuanya. Beberapa makhluk yang lebih kuat mungkin tidak terpengaruh.
items.scrolls.scrollofwipeout.name=gulungan pemusnahan
items.wands.wandofblink.desc=Tongkat ini memungkinkanmu berpindah seketika ke arah yang dipilih. Makhluk dan benda penghalang akan menghentikan perpindahanmu.
items.wands.wandofblink.name=tongkat teleportasi
items.wands.wandoffirebolt.desc=Tongkat ini menembakkan semburan api sihir. Api itu menyulut permukaan yang mudah terbakar, serta melukai dan membakar makhluk yang terkena.
items.wands.wandoffirebolt.name=Tongkat Api
