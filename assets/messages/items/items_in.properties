items.waterskin.collected=Anda mengumpulkan tetesan embun ke dalam kantung air Anda.
items.waterskin.desc=Sebuah wadah untuk cairan, terbuat dari kulit dan tali, ditutup rapat dengan sumbat gabus.
items.waterskin.desc_full=Kantung air yang penuh itu sepertinya memancarkan energi, mungkin bisa digunakan untuk memberkati barang perlengkapan bertahan hidup lainnya?
items.waterskin.desc_heal=Kantung air ini saat ini digunakan untuk menyimpan air penyembuhan. Semakin penuh kantung air tersebut, semakin cepat Anda akan sembuh saat meminumnya. Anda hanya akan minum sebanyak yang Anda butuhkan.
items.waterskin.desc_water=Saat ini kantung air itu hanya berisi air minum biasa. Pasti ada sesuatu di ruang bawah tanah yang bisa disimpan di dalam kantung air itu.
