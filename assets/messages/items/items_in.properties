items.scrolls.exotic.exoticscroll.tiwaz=gulungan eksotis TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Sebuah rune magis bercahaya yang tak dapat diuraikan tertulis di atas perkamen hitam ini. Tampaknya rune ini asing di negeri ini, siapa yang tahu apa yang akan terjadi jika dibaca keras-keras?
items.scrolls.exotic.exoticscroll.yngvi=gulungan eksotis YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Mantra pada gulungan ini akan menyelimuti Anda dengan aura magis yang untuk sementara memblokir semua efek magis, baik yang berbahaya maupun bermanfaat. Ini termasuk sebagian besar efek item magis seperti tongkat sihir, gulungan, cincin, artefak, mantra, dan kutukan. Namun, kemampuan baju besi heroik cukup kuat untuk tetap berfungsi.
items.scrolls.exotic.scrollofantimagic.name=gulungan anti-sihir
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Arena magis telah muncul di sekitarmu, ditandai dengan kabut merah yang mengepul. Saat berdiri di dalam kabut, rasa laparmu tidak akan meningkat dan kamu akan menerima 33%% lebih sedikit kerusakan dari semua sumber. Jika kamu memiliki sumber pengurangan kerusakan lainnya (seperti baju besi), itu akan berlaku setelah pengurangan 33%%. Giliran tersisa: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena tantangan
items.scrolls.exotic.scrollofchallenge.desc=Saat dibaca keras-keras, gulungan ini akan mengeluarkan raungan hebat yang menarik musuh ke arah pengguna sekaligus menciptakan arena kecil di sekitar mereka. Selama pembaca tetap berada di arena ini, mereka akan menerima 33% lebih sedikit kerusakan dari semua sumber (ini diterapkan sebelum bentuk pengurangan kerusakan lainnya), dan mereka tidak akan kehilangan rasa kenyang. Ukuran arena akan menyesuaikan dengan ukuran area tempat pembaca berada. Arena akan sangat kecil di beberapa area bos.
items.scrolls.exotic.scrollofchallenge.name=gulungan tantangan
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Gulungan ramalan Anda telah mengidentifikasi hal-hal berikut:
items.scrolls.exotic.scrollofdivination.desc=Gulungan ini akan secara acak mengidentifikasi empat jenis item yang saat ini belum Anda ketahui. Jenis yang diidentifikasi dapat berupa warna ramuan, rune gulungan, atau permata cincin. Item yang diidentifikasi belum tentu merupakan item yang sedang Anda bawa.
items.scrolls.exotic.scrollofdivination.name=gulungan ramalan
items.scrolls.exotic.scrollofdivination.nothing_left=Tidak ada lagi yang perlu diidentifikasi!
items.scrolls.exotic.scrollofdread.desc=Saat dibaca, gulungan ini akan memancarkan kilatan cahaya merah yang akan menanamkan teror luar biasa pada semua musuh dalam pandangan Anda. Efek ini begitu hebat sehingga mereka akan segera mencoba melarikan diri dari seluruh ruang bawah tanah, dan tidak akan pernah terlihat lagi! Sama seperti teror, efek ini dapat berakhir seiring waktu, atau jika musuh diserang. Musuh yang berkemauan keras, seperti bos, akan terkena teror biasa sebagai gantinya.
items.scrolls.exotic.scrollofdread.name=gulungan kengerian
items.scrolls.exotic.scrollofenchantment.armor=Pilih sebuah glif untuk diterapkan pada baju zirahmu.
items.scrolls.exotic.scrollofenchantment.cancel=membatalkan
items.scrolls.exotic.scrollofenchantment.cancel_warn=Membatalkan tetap akan menghabiskan gulungan sihirmu, kamu yakin?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Tidak, saya berubah pikiran.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ya, saya yakin
items.scrolls.exotic.scrollofenchantment.desc=Gulungan ini akan menyalurkan energi magis yang kuat ke dalam senjata atau baju zirah. Pembaca bahkan memiliki kendali sampai batas tertentu atas sihir mana yang akan disalurkan.
items.scrolls.exotic.scrollofenchantment.inv_title=Berikan mantra pada suatu item.
items.scrolls.exotic.scrollofenchantment.name=gulungan sihir
items.scrolls.exotic.scrollofenchantment.weapon=Pilih mantra yang ingin Anda terapkan pada senjata Anda.
items.scrolls.exotic.scrollofforesight.desc=Setelah membaca gulungan ini, detail medan di sekitarnya akan terus-menerus disampaikan ke pikiran pembaca dengan sangat jelas. Efek ini berlangsung dalam jangka waktu yang cukup lama, dan akan mengungkapkan semua pintu atau jebakan tersembunyi, sehingga pencarian menjadi tidak perlu.
items.scrolls.exotic.scrollofforesight.name=gulungan pandangan ke depan
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Membatalkan mantra tetap akan menghabiskan gulungan metamorfosismu, kamu yakin?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Pilih bakat untuk bermetamorfosis.
items.scrolls.exotic.scrollofmetamorphosis.desc=Gulungan ini berisi sihir transmutasi yang ampuh, yang akan berlaku pada penggunanya, bukan pada item. Sihir gulungan ini memungkinkan Anda memilih satu bakat, dan menggantinya dengan salah satu dari lima bakat dengan tingkatan yang sama dari kelas pahlawan yang berbeda! Efek ini hanya berlaku untuk bakat kelas, bukan bakat yang diperoleh dari subkelas atau kemampuan armor. Bakat yang tidak dapat Anda gunakan tidak akan diberikan sebagai pilihan.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=bakat metamorfosis
items.scrolls.exotic.scrollofmetamorphosis.name=gulungan metamorfosis
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Pilih bakat baru untuk menggantikan bakatmu yang telah bermetamorfosis.
items.scrolls.exotic.scrollofmysticalenergy.desc=Kekuatan magis mentah yang terikat dalam perkamen ini, ketika dilepaskan, akan mengisi daya artefak yang dikenakan pengguna seiring waktu.
items.scrolls.exotic.scrollofmysticalenergy.name=gulungan energi mistik
items.scrolls.exotic.scrollofpassage.desc=Mantra pada perkamen ini langsung memindahkan pembaca ke wilayah terdekat di lantai satu di atas mereka. Sangat praktis untuk pergi ke toko dengan cepat.
items.scrolls.exotic.scrollofpassage.name=gulungan bagian
items.scrolls.exotic.scrollofprismaticimage.desc=Mantra pada gulungan ini akan menciptakan kembaran ilusi berwarna-warni dari pembaca. Gambar prismatik ini bertindak sebagai klon yang lebih lemah dari pembaca, dengan pertahanan yang serupa tetapi HP dan kerusakan yang lebih rendah. Gambar prismatik akan muncul ketika musuh hadir, dan akan mencoba untuk melindungi pembaca. Jika gambar prismatik sudah ada, menggunakan gulungan ini akan menyembuhkannya sepenuhnya.
items.scrolls.exotic.scrollofprismaticimage.name=gulungan gambar prisma
items.scrolls.exotic.scrollofpsionicblast.desc=Gulungan ini mengandung energi penghancur yang luar biasa yang dapat disalurkan untuk menghancurkan pikiran semua makhluk yang terlihat. Namun, ada efek samping yang signifikan, dan pembaca juga akan terluka, buta, dan melemah. Semakin banyak target yang terkena gulungan ini, semakin sedikit kerusakan yang akan diterima.
items.scrolls.exotic.scrollofpsionicblast.name=gulungan ledakan psionik
items.scrolls.exotic.scrollofpsionicblast.ondeath=Ledakan Psionik itu akan menghancurkan pikiranmu...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Makhluk ini telah terpesona oleh sihir gulungan lagu siren.\n\nKarakter yang terpesona akan selalu menjadi sekutu Anda, dan akan melawan musuh apa pun yang mereka temui.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=terpesona
items.scrolls.exotic.scrollofsirenssong.cancel=Anda harus memilih target.
items.scrolls.exotic.scrollofsirenssong.desc=Membaca gulungan ini akan memancarkan melodi yang memikat yang akan mempesona musuh yang ditargetkan, dan mengubahnya secara permanen menjadi sekutu! Musuh lain yang mendengarnya akan terpesona untuk sementara waktu. Musuh yang sangat kuat dapat menahan efek pesona, dan malah akan terpesona.
items.scrolls.exotic.scrollofsirenssong.name=gulungan lagu siren
items.scrolls.exotic.scrollofsirenssong.no_target=Gulungan tersebut aktif tanpa target.
items.scrolls.exotic.scrollofsirenssong.prompt=Pilih target
items.scrolls.inventoryscroll.no=Tidak, saya berubah pikiran.
items.scrolls.inventoryscroll.warning=Apakah Anda benar-benar ingin membatalkan penggunaan scroll ini? Scroll tersebut sebelumnya tidak teridentifikasi, jadi akan tetap digunakan.
items.scrolls.inventoryscroll.yes=Ya, saya yakin
items.scrolls.scroll$placeholder.name=menggulir
items.scrolls.scroll.ac_read=MEMBACA
items.scrolls.scroll.berkanan=gulungan BERKANAN
items.scrolls.scroll.blinded=Anda tidak bisa membaca gulungan saat mata Anda tertutup.
items.scrolls.scroll.cursed=Kitab mantra terkutukmu mencegahmu menggunakan sihir gulungan ini! Namun, gulungan penghilang kutukan mungkin cukup ampuh untuk tetap berfungsi...
items.scrolls.scroll.gyfu=gulungan GYFU
items.scrolls.scroll.isaz=gulungan ISAZ
items.scrolls.scroll.kaunan=gulungan KAUNAN
items.scrolls.scroll.laguz=gulungan LAGUZ
items.scrolls.scroll.mannaz=gulungan MANNAZ
items.scrolls.scroll.naudiz=gulungan NAUDIZ
items.scrolls.scroll.no_magic=Anda tidak bisa membaca gulungan saat kebal terhadap sihir.
items.scrolls.scroll.odal=gulungan ODAL
items.scrolls.scroll.raido=gulungan RAIDO
items.scrolls.scroll.sowilo=gulungan SOWILO
items.scrolls.scroll.tiwaz=gulungan TIWAZ
items.scrolls.scroll.unknown_desc=Perkamen ini dipenuhi tulisan yang tak terbaca, dengan rune %s sebagai judulnya. Entah apa yang akan terjadi jika dibaca keras-keras.
items.scrolls.scroll.yngvi=gulungan YNGVI
items.scrolls.scrollofidentify.desc=Mengungkap semua rahasia dari satu barang secara permanen.
items.scrolls.scrollofidentify.inv_title=Identifikasi suatu barang
items.scrolls.scrollofidentify.it_is=Barang Anda telah teridentifikasi: %s.
items.scrolls.scrollofidentify.name=gulungan identifikasi
items.scrolls.scrolloflullaby.desc=Melodi yang menenangkan akan membuat semua makhluk dalam pandangan Anda tertidur lelap, memberi Anda kesempatan untuk melarikan diri atau melakukan serangan mendadak terhadap mereka.
items.scrolls.scrolloflullaby.name=gulungan lagu pengantar tidur
items.scrolls.scrolloflullaby.sooth=Gulungan itu mengeluarkan melodi yang menenangkan. Anda merasa sangat mengantuk.
items.scrolls.scrollofmagicmapping.desc=Saat gulungan ini dibaca, sebuah gambar yang sangat jelas akan terukir dalam ingatan Anda, memberi tahu Anda tata letak level yang tepat dan mengungkapkan semua rahasia tersembunyi. Lokasi item dan makhluk akan tetap tidak diketahui.
items.scrolls.scrollofmagicmapping.layout=Anda sekarang sudah mengetahui tata letak levelnya.
items.scrolls.scrollofmagicmapping.name=gulungan pemetaan magis
items.scrolls.scrollofmirrorimage.copies=Gulungan itu membentuk gambar cermin dari dirimu.
items.scrolls.scrollofmirrorimage.desc=Mantra yang tertulis di gulungan ini akan menciptakan kembaran ilusi dari pembaca, yang akan mengejar musuh-musuhnya.
items.scrolls.scrollofmirrorimage.name=gulungan gambar cermin
items.scrolls.scrollofmirrorimage.no_copies=Gulungan itu mencoba menciptakan gambar cermin dirimu, tetapi gambar-gambar itu tidak punya tempat untuk dituju.
items.scrolls.scrollofrage.desc=Saat dibaca dengan lantang, gulungan ini akan mengeluarkan raungan hebat yang menarik semua musuh ke arah pembaca, dan membuat musuh-musuh di sekitarnya menjadi marah.
items.scrolls.scrollofrage.name=gulungan amarah
items.scrolls.scrollofrage.roar=Gulungan itu mengeluarkan raungan dahsyat yang menggema di seluruh penjara bawah tanah!
items.scrolls.scrollofrecharging.desc=Kekuatan magis mentah yang terikat dalam perkamen ini, ketika dilepaskan, akan mengisi ulang semua tongkat sihir pembaca hingga kekuatan penuh.
items.scrolls.scrollofrecharging.name=gulungan pengisian daya
items.scrolls.scrollofrecharging.surge=Gelombang energi mengalir melalui tubuhmu, menyegarkan tongkat sihirmu!
items.scrolls.scrollofremovecurse.cleansed=Barang Anda bersinar dengan cahaya pembersih, dan energi jahat pun lenyap!
items.scrolls.scrollofremovecurse.desc=Mantra yang tertera pada gulungan ini akan seketika menghilangkan dari senjata, baju besi, cincin, dan barang-barang yang dibawa pembaca segala sihir jahat yang mungkin mencegah pemakainya untuk melepaskannya.
items.scrolls.scrollofremovecurse.inv_title=Bersihkan suatu barang
items.scrolls.scrollofremovecurse.name=gulungan penghilang kutukan
items.scrolls.scrollofremovecurse.not_cleansed=Barang Anda bersinar dengan cahaya pembersih, tetapi tidak terjadi apa pun.
items.scrolls.scrollofremovecurse.spirit=Gulunganmu membebaskan jiwa yang tersiksa!
items.scrolls.scrollofretribution.blast=Energi magis yang dahsyat menyembur keluar dari gulungan itu!
items.scrolls.scrollofretribution.desc=Gulungan ini berisi energi penghancur yang menyalurkan penderitaan pembaca keluar menjadi ledakan kekuatan. Semakin lemah pembaca, semakin besar kerusakan yang akan mereka timbulkan. Pada kesehatan yang sangat rendah, gulungan ini dapat membunuh sebagian besar musuh secara instan. Namun, menggunakan gulungan ini akan berdampak buruk pada penggunanya, membutakan dan melemahkan mereka.
items.scrolls.scrollofretribution.name=gulungan pembalasan
items.scrolls.scrollofteleportation.cant_reach=Kamu tidak bisa berteleportasi ke sana.
items.scrolls.scrollofteleportation.desc=Mantra pada gulungan ini langsung memindahkan pembaca ke lokasi acak di tingkat penjara bawah tanah. Mantra ini dapat digunakan untuk melarikan diri dari situasi berbahaya, tetapi pembaca yang kurang beruntung mungkin akan mendapati dirinya berada di tempat yang bahkan lebih berbahaya.
items.scrolls.scrollofteleportation.name=gulungan teleportasi
items.scrolls.scrollofteleportation.no_tele=Sihir teleportasi itu gagal.
items.scrolls.scrollofteleportation.prompt=Pilih lokasi untuk berteleportasi
items.scrolls.scrollofteleportation.tele=Dalam sekejap mata, Anda dipindahkan ke lokasi lain di level tersebut.
items.scrolls.scrollofterror.desc=Kilatan cahaya merah akan membuat semua makhluk dalam pandangan Anda diliputi rasa takut, dan mereka akan berbalik dan melarikan diri. Menyerang musuh yang melarikan diri akan menghilangkan efek tersebut.
items.scrolls.scrollofterror.many=Gulungan itu memancarkan kilatan cahaya merah yang terang dan para monster pun melarikan diri!
items.scrolls.scrollofterror.name=gulungan teror
items.scrolls.scrollofterror.none=Gulungan itu memancarkan kilatan cahaya merah yang cemerlang.
items.scrolls.scrollofterror.one=Gulungan itu memancarkan kilatan cahaya merah yang terang dan %s pun melarikan diri!
items.scrolls.scrolloftransmutation.desc=Gulungan ini berisi sihir transmutasi yang ampuh. Saat digunakan pada item yang memenuhi syarat, gulungan ini akan mengubahnya menjadi item lain dengan tipe yang sama. Sihir ini bahkan akan mempertahankan peningkatan, pesona, dan glif. Gulungan dan ramuan akan ditransmutasikan menjadi padanan eksotisnya, dan sebaliknya.
items.scrolls.scrolloftransmutation.inv_title=Mengubah suatu barang
items.scrolls.scrolloftransmutation.morph=Barang Anda berubah menjadi sesuatu yang berbeda!
items.scrolls.scrolloftransmutation.name=gulungan transmutasi
items.scrolls.scrolloftransmutation.nothing=Tidak ada hal menarik yang terjadi.
items.scrolls.scrollofupgrade.desc=Gulungan ini akan meningkatkan satu item, memperbaiki kualitasnya. Tongkat sihir akan meningkat kekuatannya dan jumlah muatannya; senjata akan menimbulkan lebih banyak kerusakan atau lebih sering mengenai sasaran; baju zirah akan menangkis lebih banyak pukulan; efek cincin pada pemakainya akan meningkat. Senjata dan baju zirah juga akan membutuhkan lebih sedikit kekuatan untuk digunakan, dan kutukan apa pun pada item tersebut akan dihilangkan.
items.scrolls.scrollofupgrade.inv_title=Tingkatkan item
items.scrolls.scrollofupgrade.name=gulungan peningkatan
items.scrolls.scrollofupgrade.remove_curse=Gulungan peningkatan membersihkan kutukan pada item Anda!
items.scrolls.scrollofupgrade.weaken_curse=Gulungan peningkatan melemahkan kutukan pada item Anda.
items.spells.alchemize$wndalchemizeitem.energize=Berubah menjadi energi %d
items.spells.alchemize$wndalchemizeitem.energize_1=Ubah 1 menjadi energi %d
items.spells.alchemize$wndalchemizeitem.energize_all=Ubah semuanya menjadi energi %d
items.spells.alchemize$wndalchemizeitem.sell=Ubah menjadi %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Ubah 1 menjadi %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Ubah semuanya menjadi %dg
items.spells.alchemize.desc=Mantra ini mengandung kekuatan transmutatif yang mirip dengan yang ditemukan dalam bejana alkimia. Setiap kali digunakan, pengguna dapat mengubah suatu barang (atau tumpukan barang) menjadi emas atau energi alkimia. Mengubah ramuan atau gulungan menjadi energi bahkan akan mengidentifikasinya! Beberapa kegunaan Alchemize dijual di toko-toko, tetapi lebih banyak lagi dapat dibuat menggunakan alkimia dengan menggabungkan benih, batu rune, dan sedikit energi alkimia.
items.spells.alchemize.name=alkimia
items.spells.alchemize.prompt=Mengubah Suatu Barang Menjadi Alkimia
items.spells.beaconofreturning.creatures=Aura psikis makhluk-makhluk di sekitarnya tidak memungkinkanmu untuk berteleportasi saat ini.
items.spells.beaconofreturning.desc=Mantra rumit ini memberi pengguna kemampuan untuk kembali ke lokasi yang telah ditentukan, terlepas dari jaraknya. Mantra ini hanya akan hilang saat kembali, dapat diatur sebanyak yang diinginkan, tetapi hanya akan mengingat lokasi terakhir yang telah diatur.
items.spells.beaconofreturning.desc_set=Suar ini ditempatkan di suatu tempat di lantai %d.
items.spells.beaconofreturning.name=mercusuar kepulangan
items.spells.beaconofreturning.preventing=Aura magis yang kuat di tempat ini mencegahmu menggunakan mantra tersebut!
items.spells.beaconofreturning.set=Suar tersebut telah dipasang di lokasi Anda saat ini.
items.spells.beaconofreturning.wnd_body=Setting akan menimpa lokasi yang sebelumnya telah ditetapkan untuk suar.\n\nReturning akan kembali ke lokasi terakhir yang Anda tetapkan dan menggunakan satu kali penggunaan mantra.
items.spells.beaconofreturning.wnd_return=KEMBALI
items.spells.beaconofreturning.wnd_set=MENGATUR
items.spells.curseinfusion.desc=Mantra ini menanamkan sihir jahat yang sama kuatnya dengan yang ada di dalam DM-300 ke dalam sebuah peralatan. Barang yang digunakan akan langsung terkutuk, dan semua pesona atau simbol yang mungkin dimilikinya akan ditimpa. Dalam kasus senjata, baju besi, dan tongkat sihir, barang tersebut akan mendapatkan peningkatan selain dikutuk. Peningkatan penanaman kutukan tidak bertumpuk, dan peningkatan tersebut hilang jika barang tersebut tidak lagi terkutuk. Beberapa penanaman kutukan juga dapat digunakan untuk mengubah kutukan pada senjata atau baju besi.
items.spells.curseinfusion.inv_title=Kutuk sebuah barang
items.spells.curseinfusion.name=ramuan kutukan
items.spells.magicalinfusion.desc=Mantra ini memiliki kekuatan magis yang sama dengan gulungan peningkatan, tetapi dalam bentuk yang lebih stabil. Selain meningkatkan item seperti biasa, mantra ini tidak akan pernah menghapus pesona, simbol, atau kutukan.
items.spells.magicalinfusion.infuse=Item Anda telah diresapi dengan energi gaib!
items.spells.magicalinfusion.inv_title=Menggabungkan item
items.spells.magicalinfusion.name=ramuan ajaib
items.spells.magicalporter.desc=Mantra ini akan secara ajaib memindahkan item apa pun yang menjadi sasarannya. Namun, tidak seperti suar pedagang, item-item tersebut akan dipindahkan ke pintu masuk lantai bos berikutnya.
items.spells.magicalporter.inv_title=Pindahkan sebuah barang
items.spells.magicalporter.name=porter ajaib
items.spells.magicalporter.nowhere=Tidak ada tempat bagi Anda untuk memindahkan item tersebut.
items.spells.phaseshift.desc=Mantra kacau ini akan memindahkan karakter mana pun yang menjadi sasarannya ke lokasi acak di lantai saat ini, dan membuat mereka pingsan untuk waktu yang cukup lama. Musuh yang kuat akan mampu menahan efek pingsan tersebut. Mantra ini dapat diarahkan ke target atau ke pengguna itu sendiri.
items.spells.phaseshift.name=pergeseran fase
items.spells.phaseshift.no_target=Tidak ada yang bisa diteleportasi ke sana.
items.spells.reclaimtrap.desc=Mantra ini mengandung sisa-sisa energi mekanik DM-300. Saat dilemparkan pada jebakan aktif, kekuatan jebakan akan melekat pada Anda, memungkinkan Anda untuk menggunakan mantra ini lagi untuk mengeluarkan kekuatan ini dan memicu efek jebakan di lokasi mana pun yang Anda inginkan. Namun, beberapa jebakan mungkin tidak berfungsi di semua tempat, dan hanya satu jebakan yang dapat disimpan dalam satu waktu.
items.spells.reclaimtrap.desc_trap=Mantra tersebut saat ini siap untuk memicu _%s._
items.spells.reclaimtrap.name=reklamasi jebakan
items.spells.reclaimtrap.no_trap=Tidak ada jebakan di sana.
items.spells.recycle.desc=Mantra ini mengandung bentuk sihir transmutasi yang lebih rendah. Meskipun tidak akan berpengaruh pada peralatan, mantra ini akan mengubah gulungan, ramuan, benih, batu rune, atau anak panah berujung runcing menjadi barang acak dengan jenis yang sama.
items.spells.recycle.inv_title=Daur ulang barang
items.spells.recycle.name=daur ulang
items.spells.recycle.recycled=Barang Anda telah didaur ulang menjadi: %s.
items.spells.spell.ac_cast=PEMERAN
items.spells.spell.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.spells.spell.no_magic=Anda tidak bisa merapal mantra saat kebal terhadap sihir.
items.spells.summonelemental.ac_imbue=MENGILHAMI
items.spells.summonelemental.desc=Mantra ini menyalurkan energi dari bara elemen yang digunakan untuk membuatnya, dan akan memungkinkan Anda untuk memanggil elemen sekutu untuk bertarung bersama Anda! Hanya satu elemen yang dapat dipanggil dalam satu waktu, tetapi mantra ini dapat diulang untuk mengembalikan elemen tersebut kepada Anda tanpa biaya.
items.spells.summonelemental.desc_chaos=Mantra ini saat ini memancarkan energi kacau, dan akan memanggil _elemen kekacauan_. Anda dapat memberikan kekuatan pada item yang berbeda, tetapi mantra akan kehilangan kekuatan yang dimilikinya saat ini.
items.spells.summonelemental.desc_fire=Mantra ini saat ini terasa panas saat disentuh, dan akan memanggil _elemen api_. Anda dapat memberikan kekuatan pada item yang berbeda, tetapi mantra tersebut akan kehilangan kekuatan yang dimilikinya saat ini.
items.spells.summonelemental.desc_frost=Mantra ini saat ini terasa dingin saat disentuh, dan akan memanggil _elemen es_. Anda dapat memberikan kekuatan pada item yang berbeda, tetapi mantra tersebut akan kehilangan kekuatan yang dimilikinya saat ini.
items.spells.summonelemental.desc_newborn=Mantra ini saat ini belum diresapi, dan akan memanggil elemental yang baru lahir tanpa serangan jarak jauh. Anda dapat meresapi ramuan api cair, ramuan es, gulungan pengisian ulang, atau gulungan transmutasi yang telah diidentifikasi untuk meningkatkan kekuatan mantra, sehingga pemanggilan selanjutnya akan menjadi elemental dengan kekuatan penuh!
items.spells.summonelemental.desc_shock=Mantra ini saat ini memancarkan energi statis, dan akan memanggil _elemen kejut_. Anda dapat memberikan kekuatan pada item yang berbeda, tetapi mantra akan kehilangan kekuatan yang dimilikinya saat ini.
items.spells.summonelemental.imbue_prompt=Memberikan kekuatan pada suatu item
items.spells.summonelemental.name=memanggil elemen
items.spells.targetedspell.inv_title=Menggabungkan item
items.spells.targetedspell.prompt=Pilih target
items.spells.telekineticgrab.cant_grab=Kamu tidak bisa mengambil itu.
items.spells.telekineticgrab.desc=Mantra ini memungkinkan penggunanya untuk mengambil semua barang di suatu lokasi dari jarak jauh, atau semua senjata lempar yang menempel pada musuh!\n\n Mantra ini tidak dapat digunakan untuk mengambil barang milik orang lain, atau untuk mengambil wadah seperti peti.
items.spells.telekineticgrab.name=cengkeraman telekinetik
items.spells.telekineticgrab.no_target=Tidak ada yang bisa dipegang di sana.
items.spells.unstablespell.desc=Kristal persegi hitam kecil ini memiliki simbol rune yang berubah-ubah di setiap permukaannya. Saat diaktifkan, kristal ini akan memicu efek gulungan acak. Efek gulungan akan selalu berfokus pada pertempuran jika ada musuh di bidang pandang Anda, dan akan selalu tidak berfokus pada pertempuran jika tidak ada musuh.
items.spells.unstablespell.name=mantra tidak stabil
items.spells.wildenergy.desc=Mantra ini mengandung sebagian energi terkutuk yang memberi daya pada DM-300. Saat diucapkan, mantra ini akan mengisi ulang tongkat sihir dan artefak yang Anda kenakan, sekaligus memicu efek tongkat sihir terkutuk secara acak. Anda dapat memilih arah tembakan sihir terkutuk ini.
items.spells.wildenergy.name=energi liar
items.stones.inventorystone.ac_use=MENGGUNAKAN
items.stones.runestone$placeholder.name=batu rune
items.stones.runestone.discover_hint=Anda dapat menemukan item ini secara acak di dalam ruang bawah tanah, atau membuatnya melalui alkimia.
items.stones.stoneofaggression$aggression.desc=Sihir manipulatif membuat semua musuh di dekatnya lebih memilih menyerang karakter ini.\n\nGiliran tersisa: %s.
items.stones.stoneofaggression$aggression.name=ditargetkan
items.stones.stoneofaggression.desc=Saat batu ini dilemparkan ke sekutu atau musuh, semua musuh di dekatnya akan lebih memilih menyerang karakter tersebut untuk waktu singkat. Namun, musuh bos dapat menahan efeknya, mengurangi durasi secara signifikan dan menerima lebih sedikit kerusakan dari serangan anak buah mereka.
items.stones.stoneofaggression.name=batu agresi
items.stones.stoneofaugmentation$wndaugment.cancel=Sudahlah
items.stones.stoneofaugmentation$wndaugment.choice=Apa yang ingin Anda tingkatkan?
items.stones.stoneofaugmentation$wndaugment.damage=Kerusakan
items.stones.stoneofaugmentation$wndaugment.defense=Pertahanan
items.stones.stoneofaugmentation$wndaugment.evasion=Penghindaran
items.stones.stoneofaugmentation$wndaugment.none=Hapus Augmentasi
items.stones.stoneofaugmentation$wndaugment.speed=Kecepatan
items.stones.stoneofaugmentation.desc=Batu rune ini memiliki sihir ampuh yang dapat meningkatkan peralatan untuk meningkatkan satu properti dengan mengorbankan properti lainnya. Menggunakannya pada senjata akan memungkinkan Anda untuk meningkatkan kecepatan atau kerusakan. Senjata lempar juga akan mendapatkan atau kehilangan daya tahan sebanding dengan kecepatannya. Menggunakannya pada baju besi akan memungkinkan Anda untuk meningkatkan pertahanan atau penghindaran.
items.stones.stoneofaugmentation.discover_hint=Anda dapat membeli barang ini di toko, atau membuatnya melalui alkimia.
items.stones.stoneofaugmentation.inv_title=Meningkatkan suatu item
items.stones.stoneofaugmentation.name=batu augmentasi
items.stones.stoneofblast.desc=Batu rune ini akan langsung meledak di lokasi tempat ia dilemparkan. Sama seperti bom, ledakan tersebut akan menimbulkan kerusakan pada apa pun yang berada di dekatnya.
items.stones.stoneofblast.name=batu ledakan
items.stones.stoneofblink.desc=Batu rune ini akan memindahkan pengguna ke lokasi tempat batu itu dilempar.
items.stones.stoneofblink.name=batu kedip
items.stones.stoneofclairvoyance.desc=Batu ini akan langsung menyingkap semua ubin di area yang sangat luas di sekitar tempat dilempar. Efeknya bahkan dapat menembus dinding.
items.stones.stoneofclairvoyance.name=batu kewaskitaan
items.stones.stoneofdeepsleep.desc=Saat batu ini dilemparkan ke musuh, musuh tersebut akan tertidur lelap secara magis. Musuh yang tertidur secara magis akan tidur selamanya hingga diganggu.
items.stones.stoneofdeepsleep.name=batu tidur nyenyak
items.stones.stoneofdetectmagic.desc=Batu rune ini mampu mendeteksi sihir yang memengaruhi suatu benda. Menggunakan batu ini pada benda yang tidak dikenal akan memberi tahu Anda apakah benda tersebut terpengaruh oleh kutukan jahat dan apakah terpengaruh oleh sihir positif seperti penguatan atau peningkatan.
items.stones.stoneofdetectmagic.detected_bad=Anda mendeteksi sihir jahat yang memengaruhi benda ini!
items.stones.stoneofdetectmagic.detected_both=Anda mendeteksi adanya pengaruh sihir positif dan jahat yang memengaruhi benda ini!
items.stones.stoneofdetectmagic.detected_good=Anda mendeteksi adanya pengaruh sihir positif pada benda ini!
items.stones.stoneofdetectmagic.detected_none=Anda tidak mendeteksi adanya sihir yang memengaruhi barang ini.
items.stones.stoneofdetectmagic.inv_title=Mendeteksi suatu barang
items.stones.stoneofdetectmagic.name=batu pendeteksi sihir
items.stones.stoneofdisarming.desc=Batu rune ini menyimpan sihir yang dapat menonaktifkan jebakan berbahaya yang tersembunyi di seluruh ruang bawah tanah. Batu ini dapat melumpuhkan hingga 9 jebakan di sekitar area tempat ia dilempar.
items.stones.stoneofdisarming.name=batu pelucutan senjata
items.stones.stoneofenchantment.armor=Baju zirahmu bersinar dalam kegelapan!
items.stones.stoneofenchantment.desc=Batu rune ini memiliki sihir yang mempesona. Tidak seperti gulungan peningkatan, batu rune ini tidak akan meningkatkan kekuatan langsung suatu item, tetapi akan memberikan pesona pada senjata atau baju besi, sehingga memberinya kekuatan baru.
items.stones.stoneofenchantment.inv_title=Berikan mantra pada suatu item.
items.stones.stoneofenchantment.name=batu pesona
items.stones.stoneofenchantment.weapon=Senjatamu bersinar dalam kegelapan!
items.stones.stoneoffear.desc=Saat batu ini dilemparkan ke arah karakter, mereka akan diliputi rasa takut, dan akan berbalik serta melarikan diri. Menyerang karakter yang sedang melarikan diri akan mempersingkat efeknya.
items.stones.stoneoffear.name=batu ketakutan
items.stones.stoneofflock.desc=Batu rune ini memanggil domba ajaib untuk waktu singkat di sekitar lokasi tempat batu itu dilemparkan.
items.stones.stoneofflock.name=batu kawanan
items.stones.stoneofintuition$wndguess.break=Batu intuisimu hancur menjadi debu...
items.stones.stoneofintuition$wndguess.correct=Benar. Jenis barang telah diidentifikasi!
items.stones.stoneofintuition$wndguess.incorrect=Tebakan Anda salah.
items.stones.stoneofintuition$wndguess.text=Coba tebak jenis benda tak dikenal tersebut. Jika tebakanmu benar, jenis benda tersebut akan teridentifikasi!
items.stones.stoneofintuition.break_info=Anda dapat menggunakan batu intuisi dua kali sebelum salah satunya pecah, _penggunaan Anda berikutnya tidak akan menghabiskan batu_.
items.stones.stoneofintuition.break_warn=Anda telah menggunakan batu intuisi sebelumnya, jadi penggunaan Anda selanjutnya akan menghabiskan satu batu.
items.stones.stoneofintuition.desc=Batu rune ini menyimpan versi sihir yang lebih lemah dari yang ditemukan dalam gulungan identifikasi. Alih-alih langsung mengidentifikasi suatu barang, batu ini akan bekerja berdasarkan intuisi Anda, memungkinkan Anda untuk mencoba mengidentifikasi jenis ramuan, gulungan, atau cincin dengan menebak.
items.stones.stoneofintuition.inv_title=Pilih item
items.stones.stoneofintuition.name=batu intuisi
items.stones.stoneofshock.desc=Batu rune ini melepaskan ledakan energi listrik yang secara singkat melumpuhkan semua target di dekatnya, dan memberikan muatan tongkat sihir kepada pelempar untuk setiap target yang terkena.
items.stones.stoneofshock.name=batu kejutan
items.stylus.ac_inscribe=MENULISKAN
items.stylus.cursed=Keajaiban stylus tidak akan berpengaruh pada baju zirah terkutuk.
items.stylus.desc=Stylus misterius ini terbuat dari batu gelap yang sangat keras. Dengan menggunakannya, Anda dapat mengukir simbol magis pada baju zirah Anda, tetapi Anda tidak memiliki kendali untuk memilih simbol apa yang akan diukir, stylus tersebut akan menentukannya untuk Anda.
items.stylus.identify=Anda harus memastikan terlebih dahulu apakah baju zirah itu terkutuk.
items.stylus.inscribed=Kau mengukir baju zirahmu dengan stylus.
items.stylus.name=stylus misterius
items.stylus.prompt=Pilih Armor
items.tengusmask.ac_wear=MEMAKAI
items.tengusmask.desc=Topeng ini terlepas dari wajah Tengu saat dia meninggal, Anda dapat merasakan kekuatan magis yang besar terpancar darinya. Apakah topeng itu sumber kekuatan Tengu? Saat dikenakan, kekuatan luar biasa dari topeng akan ditransfer ke Anda, memungkinkan Anda untuk memilih subkelas untuk pahlawan Anda. Subkelas mana yang akan Anda pilih?
items.tengusmask.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.tengusmask.name=Topeng Tengu
items.tengusmask.used=Topeng itu hancur berkeping-keping saat kekuatannya mengalir ke dalam dirimu!
items.torch.ac_light=LAMPU
items.torch.desc=Sebagai perlengkapan wajib dalam petualangan, ketika ruang bawah tanah menjadi gelap, obor dapat membantu menerangi jalan.
items.torch.name=obor
items.trinkets.chaoticcenser.desc=Setelah beberapa waktu di dalam wadah alkimia, pedupaan pembakar dupa ini tampaknya menghasilkan asap dengan sendirinya! Gas-gas ini menumpuk dan akan menyembur keluar dari pedupaan ke arah musuh pada interval yang semi-acak. Tampaknya mampu menghasilkan berbagai macam gas, tetapi Anda akan mendapatkan peringatan sesaat sebelum pedupaan aktif.
items.trinkets.chaoticcenser.name=dupa kacau
items.trinkets.chaoticcenser.spew=Pembakar dupa Anda akan segera menyemburkan: %s.
items.trinkets.chaoticcenser.stats_desc=Pada level saat ini, pernak-pernik ini akan menghasilkan gas berbahaya di dekat musuh kira-kira setiap _%d_ giliran. Gas hanya akan muncul ketika ada musuh. Pada level yang lebih tinggi, gas-gas ini cenderung lebih eksotis dan kuat.
items.trinkets.chaoticcenser.typical_stats_desc=Biasanya, pernak-pernik ini akan memunculkan gas berbahaya di dekat musuh kira-kira setiap _%d_ giliran. Gas hanya akan muncul ketika ada musuh. Pada level yang lebih tinggi, gas-gas ini cenderung lebih eksotis dan kuat.
items.trinkets.crackedspyglass.desc=Teleskop genggam ini akan menjadi demonstrasi pengerjaan yang hebat dan presisi, jika bukan karena retakan di sepanjang lensa depannya. Teropong ini tampaknya membantu Anda dengan mengungkapkan item baru di ruang bawah tanah, tetapi karena cacatnya, item yang terungkap cukup sulit dilihat!
items.trinkets.crackedspyglass.name=teropong yang retak
items.trinkets.crackedspyglass.stats_desc=Pada level saat ini, pernak-pernik ini memiliki peluang _%1$s%%_ untuk menciptakan item tersembunyi tambahan di setiap lantai non-bos.
items.trinkets.crackedspyglass.stats_desc_upgraded=Pada level saat ini, pernak-pernik ini memiliki peluang _100%%_ untuk menciptakan item tersembunyi tambahan di setiap lantai non-bos, dan peluang _%1$s%%_ untuk menciptakan item tersembunyi tambahan kedua.
items.trinkets.crackedspyglass.typical_stats_desc=Biasanya, pernak-pernik ini memiliki peluang _%1$s%%_ untuk menciptakan item tersembunyi tambahan di setiap lantai non-bos.
items.trinkets.dimensionalsundial.desc=Jam matahari genggam kecil ini entah bagaimana mampu menghasilkan bayangan di kedalaman penjara bawah tanah, bahkan jika Anda tidak memegangnya tegak. Lebih aneh lagi, posisi bayangan tersebut tampaknya tidak berhubungan dengan matahari di dunia ini. Ketika tidak ada bayangan yang dihasilkan, jam matahari tersebut tampaknya menarik bahaya.
items.trinkets.dimensionalsundial.name=jam matahari dimensional
items.trinkets.dimensionalsundial.stats_desc=Pada level saat ini, perhiasan ini akan mengurangi tingkat kemunculan musuh sebesar _%1$d%%_ pada siang hari di waktu nyata (jam 8 pagi-8 malam), dan meningkatkan tingkat kemunculan musuh sebesar _%2$d%%_ pada malam hari (jam 8 malam-8 pagi).
items.trinkets.dimensionalsundial.typical_stats_desc=Biasanya, pernak-pernik ini akan mengurangi tingkat kemunculan musuh sebesar _%1$d%%_ pada siang hari di waktu nyata (jam 8 pagi-8 malam), dan meningkatkan tingkat kemunculan musuh sebesar _%2$d%%_ pada malam hari (jam 8 malam-8 pagi).
items.trinkets.dimensionalsundial.warning=Jam matahari Anda tidak menghasilkan bayangan, Anda merasa gelisah.
items.trinkets.exoticcrystals.desc=Kristal-kristal kecil berwarna merah muda ini memiliki bentuk yang sama dengan kristal energi alkimia. Meskipun tidak dapat digunakan langsung untuk energi, kristal-kristal ini tampaknya memengaruhi ramuan dan gulungan yang Anda temukan.
items.trinkets.exoticcrystals.name=kristal eksotis
items.trinkets.exoticcrystals.stats_desc=Pada level saat ini, pernak-pernik ini akan menggantikan _%s%%_ dari jatuhan ramuan atau gulungan dengan item eksotis yang setara. Ini tidak memengaruhi ramuan kekuatan, gulungan peningkatan, atau item yang dihasilkan untuk membantu menyelesaikan ruangan berbahaya.
items.trinkets.exoticcrystals.typical_stats_desc=Biasanya, pernak-pernik ini akan menggantikan _%s%%_ dari item ramuan atau gulungan yang dijatuhkan dengan item eksotis yang setara. Ini tidak memengaruhi ramuan kekuatan, gulungan peningkatan, atau item yang dihasilkan untuk membantu menyelesaikan ruangan berbahaya.
items.trinkets.eyeofnewt.desc=Mata kadal air berwarna emas dan hitam ini adalah bahan umum, yang kini diolah menjadi perhiasan. Mata ini tampaknya mengurangi penglihatan Anda sebagai imbalan untuk memungkinkan Anda melihat sesuatu dengan cara lain.
items.trinkets.eyeofnewt.name=mata kadal
items.trinkets.eyeofnewt.stats_desc=Pada level saat ini, pernak-pernik ini akan mengurangi jangkauan penglihatan Anda sebesar _%1$s%%_, tetapi juga akan memberi Anda penglihatan pikiran pada musuh dalam jarak _%2$d_ ubin.
items.trinkets.eyeofnewt.typical_stats_desc=Biasanya, pernak-pernik ini akan mengurangi jangkauan penglihatan Anda sebesar _%1$s%%_, tetapi juga akan memberi Anda penglihatan pikiran pada musuh dalam jarak _%2$d_ ubin.
items.trinkets.ferrettuft.desc=Segumpal bulu musang putih halus, diikat dengan pita hijau limau yang dibentuk menjadi simpul. Musang dikenal karena kelincahan, kenakalan, dan kurangnya integritasnya. Sebagian dari kekuatan itu tampaknya terpancar dari pernak-pernik ini, meningkatkan kemampuan untuk menghindari apa pun yang ada di dekatnya.
items.trinkets.ferrettuft.name=jambul musang
items.trinkets.ferrettuft.stats_desc=Pada level saat ini, perhiasan ini akan meningkatkan kemampuan menghindar semua karakter sebesar _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Biasanya, pernak-pernik ini akan meningkatkan kemampuan menghindar semua karakter sebesar _%1$s%%_.
items.trinkets.mimictooth.desc=Gigi besar dan tajam ini pasti dicabut dari makhluk peniru yang sangat tidak bahagia. Tampaknya gigi ini memengaruhi makhluk peniru di ruang bawah tanah, membuat mereka lebih sering muncul dan lebih berbahaya.
items.trinkets.mimictooth.name=gigi tiruan
items.trinkets.mimictooth.stats_desc=Pada level saat ini, pernak-pernik ini akan membuat semua jenis mimic _%1$sx_ lebih umum dan jauh lebih sulit dideteksi, tetapi juga akan meningkatkan jumlah jarahan yang mereka jatuhkan. Setiap lantai penjara bawah tanah juga akan memiliki peluang _%2$s%%_ untuk berisi mimic ebony siluman tambahan.
items.trinkets.mimictooth.typical_stats_desc=Biasanya, pernak-pernik ini akan membuat semua jenis mimic _%1$sx_ lebih umum dan jauh lebih sulit dideteksi, tetapi juga akan meningkatkan jumlah jarahan yang mereka jatuhkan. Setiap lantai penjara bawah tanah juga akan memiliki peluang _%2$s%%_ untuk berisi mimic ebony siluman tambahan.
items.trinkets.mossyclump.desc=Gumpalan lumut basah ini tampaknya mempertahankan kelembapannya tidak peduli seberapa keras Anda meremasnya. Seolah-olah secara magis terikat pada ruang bawah tanah itu sendiri, membuat rumput dan air lebih mungkin muncul.
items.trinkets.mossyclump.name=rumpun berlumut
items.trinkets.mossyclump.stats_desc=Pada level saat ini, pernak-pernik ini akan membuat _%d%%_ lantai yang tidak bertema terisi dengan air atau rumput.\n\nPernik-pernik ini membutuhkan energi yang lebih besar untuk ditingkatkan.
items.trinkets.mossyclump.typical_stats_desc=Biasanya, pernak-pernik ini akan membuat _%d%%_ lantai yang tidak bertema menjadi terisi air atau rumput.\n\nPernik-pernik ini membutuhkan energi yang lebih besar untuk ditingkatkan.
items.trinkets.parchmentscrap.desc=Secarik perkamen kecil ini tampak seperti berasal dari gulungan. Ia masih menyimpan sebagian kekuatan magisnya, dan tampaknya memengaruhi senjata dan baju besi yang ditemukan di ruang bawah tanah.
items.trinkets.parchmentscrap.name=potongan perkamen
items.trinkets.parchmentscrap.stats_desc=Pada level saat ini, perhiasan ini akan membuat mantra dan glif _%dx_ menjadi umum, dan kutukan pada senjata dan baju besi _%sx_ menjadi umum. Kutukan pada tongkat sihir, cincin, atau artefak tidak terpengaruh.\n\nPerhiasan ini membutuhkan energi yang lebih besar untuk ditingkatkan.
items.trinkets.parchmentscrap.typical_stats_desc=Biasanya, pernak-pernik ini akan membuat mantra dan glif _%dx_ menjadi umum, dan kutukan pada senjata dan baju besi _%sx_ menjadi umum. Kutukan pada tongkat sihir, cincin, atau artefak tidak terpengaruh.\n\nPernik-pernik ini membutuhkan energi yang lebih besar untuk ditingkatkan.
items.trinkets.petrifiedseed.desc=Benih ini telah menjadi fosil, baik melalui proses geologis yang lambat atau melalui sihir. Benih ini tampaknya secara magis memengaruhi flora di ruang bawah tanah, kadang-kadang menggantikan benih tanaman dengan batu rune.
items.trinkets.petrifiedseed.name=biji yang membatu
items.trinkets.petrifiedseed.stats_desc=Pada level saat ini, pernak-pernik ini akan menyebabkan rumput yang terinjak menjatuhkan batu rune alih-alih biji _%1$s%%_ sebagian besar waktu, dan juga akan menyebabkan rumput tinggi menjatuhkan item _%2$s%%_ lebih sering.
items.trinkets.petrifiedseed.typical_stats_desc=Biasanya, pernak-pernik ini akan menyebabkan rumput yang terinjak menjatuhkan batu rune alih-alih biji _%1$s%%_ sebagian besar waktu, dan juga akan menyebabkan rumput tinggi menjatuhkan item _%2$s%%_ lebih sering.
items.trinkets.ratskull.desc=Benda kecil mengerikan ini ukurannya tidak jauh lebih besar dari tengkorak tikus biasa, yang entah kenapa menjadi barang langka di ruang bawah tanah ini. Pengaruh magis tengkorak tersebut tampaknya menarik penghuni ruang bawah tanah yang lebih langka, membuat mereka muncul jauh lebih sering.
items.trinkets.ratskull.name=tengkorak tikus
items.trinkets.ratskull.stats_desc=Pada level saat ini, pernak-pernik ini akan membuat musuh eksotis langka _%dx_ lebih mungkin muncul. Namun, tengkorak tersebut hanya setengah efektif dalam menarik peniru kristal dan patung lapis baja.
items.trinkets.ratskull.typical_stats_desc=Biasanya, pernak-pernik ini akan membuat musuh eksotis langka _%dx_ lebih mungkin muncul. Namun, tengkorak tersebut hanya setengah efektif dalam menarik peniru kristal dan patung lapis baja.
items.trinkets.saltcube.desc=Kristal garam besar ini dipotong menjadi bentuk kubus yang hampir sempurna, dan entah bagaimana ia berhasil menguras setengah air dari panci alkimia alih-alih larut. Tampaknya secara ajaib ia mengeringkan dan mengawetkan makanan yang Anda makan, memperpanjang rasa kenyang yang Anda dapatkan, tetapi juga mengurangi pemulihan kesehatan Anda ketika tidak kelaparan.
items.trinkets.saltcube.name=batu garam
items.trinkets.saltcube.stats_desc=Pada level saat ini, pernak-pernik ini akan meningkatkan waktu sebelum Anda merasa lapar sebesar _%1$s%%_, tetapi juga akan mengurangi laju regenerasi kesehatan Anda sebesar _%2$s%%_ kecuali lantai tersebut terkunci.
items.trinkets.saltcube.typical_stats_desc=Biasanya, pernak-pernik ini akan meningkatkan waktu sebelum Anda merasa lapar sebesar _%1$s%%_, tetapi juga akan mengurangi laju regenerasi kesehatan Anda sebesar _%2$s%%_ kecuali lantai tersebut terkunci.
items.trinkets.shardofoblivion$thrownusetracker.desc=Anda baru saja menggunakan senjata lempar tak dikenal, yang dihitung sebagai satu bagian peralatan tak dikenal yang digunakan untuk pecahan pelupakan untuk sementara waktu.\n\nGiliran tersisa: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Senjata Lempar Tak Dikenal Digunakan
items.trinkets.shardofoblivion$wandusetracker.desc=Anda baru saja menggunakan tongkat sihir tak dikenal, yang dihitung sebagai satu bagian peralatan tak dikenal yang telah digunakan untuk pecahan kelupaan untuk sementara waktu.\n\nGiliran tersisa: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Tongkat Sihir Tak Dikenal Digunakan
items.trinkets.shardofoblivion.ac_identify=MENGENALI
items.trinkets.shardofoblivion.desc=Setelah direbus dalam panci alkimia, serpihan kecil logam terkutuk ini telah berubah menjadi terbuat dari... ketiadaan? Cahaya tampak membengkok di sekitarnya, dan ia melayang di tempat saat Anda tidak memegangnya. Serpihan itu tampaknya secara magis menarik kekuatan dari ketidaktahuan Anda, jadi mungkin sebaiknya jangan terlalu memikirkannya.
items.trinkets.shardofoblivion.identify=Anda mengidentifikasi barang tersebut!
items.trinkets.shardofoblivion.identify_not_yet=Barang itu belum siap untuk diidentifikasi.
items.trinkets.shardofoblivion.identify_prompt=Identifikasi suatu barang
items.trinkets.shardofoblivion.identify_ready=Sebuah item siap untuk diidentifikasi: %s. Gunakan Shard of Oblivion Anda untuk mengidentifikasinya.
items.trinkets.shardofoblivion.identify_ready_worn=Barang-barang usang Anda kini siap untuk diidentifikasi. Gunakan Shard of Oblivion pada barang-barang tersebut untuk mengidentifikasinya.
items.trinkets.shardofoblivion.name=pecahan kelupaan
items.trinkets.shardofoblivion.stats_desc=Pada level saat ini, perhiasan ini akan meningkatkan tingkat jatuhnya jarahan dari musuh sebesar 20%% untuk setiap item perlengkapan yang belum teridentifikasi yang Anda kenakan atau baru saja gunakan, hingga maksimal _%d item_. Pecahan ini juga akan mencegah Anda mengidentifikasi perlengkapan, tetapi dapat digunakan untuk mengidentifikasi item secara manual yang sudah siap untuk diidentifikasi.
items.trinkets.shardofoblivion.typical_stats_desc=Biasanya, perhiasan ini akan meningkatkan tingkat jatuhnya jarahan dari musuh sebesar 20%% untuk setiap item perlengkapan yang belum teridentifikasi yang Anda kenakan atau baru saja gunakan, hingga maksimal _%d item_. Pecahan ini juga akan mencegah Anda mengidentifikasi perlengkapan, tetapi dapat digunakan untuk mengidentifikasi item secara manual yang sudah siap untuk diidentifikasi.
items.trinkets.thirteenleafclover.desc=Entah bagaimana, setelah direbus dalam panci alkimia, semanggi ini tumbuh banyak daun tambahan! Tidak jelas apakah benda kecil ini membawa keberuntungan atau kesialan, mungkin benda kecil ini akan membuat keberuntunganmu lebih kacau?
items.trinkets.thirteenleafclover.name=semanggi berdaun tiga belas
items.trinkets.thirteenleafclover.stats_desc=Pada level saat ini, perhiasan ini akan menyebabkan Anda memberikan kerusakan maksimum _%1$d%%_ dari waktu tersebut, dan kerusakan minimum _%2$d%%_ dari waktu tersebut.
items.trinkets.thirteenleafclover.typical_stats_desc=Biasanya, perhiasan ini akan menyebabkan Anda memberikan kerusakan maksimum _%1$d%%_ dari waktu tersebut, dan kerusakan minimum _%2$d%%_ dari waktu tersebut.
items.trinkets.trapmechanism.desc=Mekanisme inti dari salah satu jebakan lubang di ruang bawah tanah, diukir dengan hati-hati dari lantai sehingga dapat dibawa. Tampaknya terikat secara magis dengan ruang bawah tanah itu sendiri, membuat medan berbahaya lebih sering muncul tetapi juga meningkatkan kedekatan Anda dengannya.
items.trinkets.trapmechanism.name=mekanisme jebakan
items.trinkets.trapmechanism.stats_desc=Pada level saat ini, pernak-pernik ini akan membuat _%1$d%%_ lantai yang tidak bertema menjadi penuh dengan jebakan atau jurang. Selain itu, _%2$d%%_ jebakan tersembunyi di ruang bawah tanah akan terlihat.
items.trinkets.trapmechanism.typical_stats_desc=Biasanya, pernak-pernik ini akan membuat _%1$d%%_ dari lantai yang tidak bertema menjadi penuh dengan jebakan atau jurang. Selain itu, _%2$d%%_ dari jebakan tersembunyi di ruang bawah tanah akan terlihat.
items.trinkets.trinket$placeholder.name=perhiasan kecil
items.trinkets.trinket.discover_hint=Item ini memiliki peluang untuk menjadi pilihan setiap kali Anda membuat perhiasan melalui alkimia.
items.trinkets.trinketcatalyst$randomtrinket.desc=Satu barang di dekat Anda terjebak di dalam kantung yang tidak bisa Anda buka. Proses alkimia akan melarutkan kantung tersebut, tetapi Anda tidak akan tahu perhiasan apa yang akan Anda dapatkan sampai Anda melakukannya!
items.trinkets.trinketcatalyst$randomtrinket.name=pernak-pernik acak
items.trinkets.trinketcatalyst.desc=Bola debu emas ajaib ini berkilauan dalam kegelapan ruang bawah tanah. Katalis ini dapat digunakan di dalam panci alkimia dengan sedikit energi alkimia untuk menghasilkan item perhiasan unik. Perhiasan memberikan berbagai efek berbeda yang sedikit mengubah ruang bawah tanah atau penghuninya. Perhiasan dapat ditingkatkan dengan lebih banyak energi untuk membuat efeknya lebih kuat, atau dibuang untuk menghilangkan efeknya sepenuhnya.
items.trinkets.trinketcatalyst.name=katalis magis
items.trinkets.trinketcatalyst.window_text=Air mulai bercahaya saat Anda menambahkan katalis. Ada beberapa benda di dekatnya yang dapat Anda beri energi untuk diubah menjadi pernak-pernik magis.
items.trinkets.trinketcatalyst.window_title=membuat pernak-pernik
items.trinkets.vialofblood.desc=Botol tipis ini berisi darah penghuni penjara bawah tanah, darah itu bergerak perlahan saat Anda memutar botol tersebut. Tampaknya darah itu secara magis meningkatkan efek penyembuhan yang lebih kuat, tetapi juga menundanya.
items.trinkets.vialofblood.name=botol darah
items.trinkets.vialofblood.stats_desc=Pada level saat ini, perhiasan ini akan meningkatkan total kesehatan yang Anda peroleh dari meminum ramuan penyembuhan, kantung air, atau sumur kesehatan sebesar _%1$s%%_. Namun, efek penyembuhan ini juga akan terjadi lebih lambat, meregenerasi maksimal _%2$s_ HP per giliran (ini meningkat seiring dengan level pahlawan).
items.trinkets.vialofblood.typical_stats_desc=Biasanya, perhiasan ini akan meningkatkan total kesehatan yang Anda peroleh dari meminum ramuan penyembuhan, kantung air, atau sumur kesehatan sebesar _%1$s%%_. Namun, efek penyembuhan ini juga akan terjadi lebih lambat, meregenerasi maksimal _%2$s_ HP per giliran (ini meningkat seiring dengan level pahlawan).
items.trinkets.wondrousresin.desc=Resin biru berkilauan ini tampaknya mengandung sari pati sihir tongkat sihir terkutuk. Sihir dari bejana alkimia tampaknya telah menstabilkannya sampai batas tertentu, dan sekarang memengaruhi tongkat sihir kalian.
items.trinkets.wondrousresin.name=resin yang menakjubkan
items.trinkets.wondrousresin.stats_desc=Pada level saat ini, jimat ini akan memaksa efek tongkat sihir terkutuk menjadi netral atau positif _%1$s%%_ dari waktu, dan akan menyebabkan tongkat sihir yang tidak terkutuk menembakkan sengatan terkutuk netral atau positif tambahan _%2$s%%_ dari waktu.\n\nJimat ini membutuhkan jumlah energi yang lebih besar untuk ditingkatkan.
items.trinkets.wondrousresin.typical_stats_desc=Biasanya, jimat ini akan memaksa efek tongkat sihir terkutuk menjadi netral atau positif _%1$s%%_ dari waktu, dan akan menyebabkan tongkat sihir yang tidak terkutuk menembakkan sengatan terkutuk netral atau positif tambahan _%2$s%%_ dari waktu.\n\nJimat ini membutuhkan jumlah energi yang lebih besar untuk ditingkatkan.
items.wands.cursedwand.disguise=Penampilanmu berubah di depan matamu!
items.wands.cursedwand.fire=Anda mencium bau terbakar...
items.wands.cursedwand.grass=Rumput tumbuh subur di sekitarmu!
items.wands.cursedwand.gravity=Gaya gravitasi tiba-tiba mulai menarik ke arah yang acak!
items.wands.cursedwand.gravity_end=Kekacauan gravitasi berakhir.
items.wands.cursedwand.gravity_positive=Gaya gravitasi tiba-tiba mulai menarik ke arah acak, tetapi ini tampaknya tidak memengaruhi Anda.
items.wands.cursedwand.mass_invuln=Cahaya cemerlang memancar dari tongkat sihirmu!
items.wands.cursedwand.nothing=Tidak terjadi apa-apa.
items.wands.cursedwand.ondeath=Anda terbunuh oleh %s Anda sendiri.
items.wands.cursedwand.petrify=Anda tiba-tiba membeku di tempat!
items.wands.cursedwand.sinkhole=Tanah di sekitarmu mulai ambruk!
items.wands.cursedwand.sinkhole_positive=Tanah mulai ambles, tetapi terasa cukup kokoh di bawah Anda.
items.wands.cursedwand.supernova=Sebuah bola energi yang menyala-nyala mulai membesar. Sebaiknya Anda lari!
items.wands.cursedwand.supernova_positive=Sebuah bola energi yang menyala-nyala mulai membesar, tetapi entah mengapa terasa aman.
items.wands.cursedwand.transmogrify_other=Item Anda berubah bentuk menjadi sesuatu yang berbeda!
items.wands.cursedwand.transmogrify_wand=Tongkat sihirmu berubah bentuk menjadi benda yang berbeda!
items.wands.damagewand.upgrade_stat_name_1=Kerusakan Sihir
items.wands.wand$placeholder.name=tongkat sihir
items.wands.wand.ac_zap=PERTENGKARAN
items.wands.wand.curse_discover=%s ini terkutuk!
items.wands.wand.cursed=Tongkat sihir ini terkutuk, sehingga sihirnya menjadi kacau dan acak.
items.wands.wand.fizzles=Tongkat sihirmu tidak berfungsi; pasti dayanya tidak cukup.
items.wands.wand.identify=Sekarang kamu sudah cukup mengenal tongkat sihirmu sehingga bisa mengidentifikasinya.
items.wands.wand.no_magic=Tongkat sihirmu gagal berfungsi; kamu tidak dapat menggunakan tongkat sihir saat kebal terhadap sihir.
items.wands.wand.not_cursed=Tongkat sihir ini bebas dari sihir jahat.
items.wands.wand.prompt=Pilih lokasi untuk disetrum
items.wands.wand.resin_many=Tongkat sihir ini telah memperoleh _%d level_ dari resin gaib.
items.wands.wand.resin_one=Tongkat sihir ini telah mendapatkan _1 level_ dari resin gaib.
items.wands.wand.self_target=Kamu tidak bisa menargetkan dirimu sendiri!
items.wands.wandofblastwave.bmage_desc=Saat Battlemage menyerang musuh yang lumpuh dengan tongkat gelombang ledakan, ia akan mengonsumsi kelumpuhan tersebut untuk memberikan ledakan kerusakan sihir tambahan. Ini memiliki waktu pendinginan singkat per musuh.
items.wands.wandofblastwave.desc=Tongkat sihir ini terbuat dari sejenis batu bermarmar, dengan hiasan emas dan permata hitam bulat di ujungnya. Terasa sangat berat di tangan.
items.wands.wandofblastwave.eleblast_desc=Ledakan elemen dengan tongkat gelombang ledakan memberikan 67% kerusakan dan melemparkan semua musuh keluar dari area ledakan.
items.wands.wandofblastwave.knockback_ondeath=Tabrakan itu menewaskanmu...
items.wands.wandofblastwave.name=tongkat gelombang ledakan
items.wands.wandofblastwave.ondeath=Kau bunuh diri dengan Tongkat Gelombang Ledakanmu sendiri...
items.wands.wandofblastwave.staff_name=staf gelombang ledakan
items.wands.wandofblastwave.stats_desc=Tongkat sihir ini menembakkan sebuah bola energi yang meledak dengan dahsyat di lokasi target. Kekuatan ledakan ini menimbulkan kerusakan sebesar _%1$d-%2$d_ dan cukup kuat untuk membuat sebagian besar musuh terlempar.
items.wands.wandofblastwave.typical_stats_desc=Tongkat sihir ini menembakkan sebuah bola energi yang meledak dengan dahsyat di lokasi target. Kekuatan ledakan ini biasanya menimbulkan kerusakan sebesar _%1$d-%2$d_ dan cukup kuat untuk membuat sebagian besar musuh terlempar.
items.wands.wandofblastwave.upgrade_stat_name_2=Pukulan balik
items.wands.wandofcorrosion.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat korosi, musuh tersebut memiliki peluang untuk menjadi berlendir.
items.wands.wandofcorrosion.desc=Tongkat sihir ini memiliki badan berwarna abu-abu yang terbuka memperlihatkan permata oranye yang cemerlang.
items.wands.wandofcorrosion.eleblast_desc=Ledakan elemen dengan tongkat korosi akan memberikan efek korosi pada musuh selama 4 giliran, dimulai dengan 6 kerusakan.
items.wands.wandofcorrosion.name=tongkat korosi
items.wands.wandofcorrosion.staff_name=staf korosi
items.wands.wandofcorrosion.stats_desc=Tongkat sihir ini menembakkan sebuah bola api yang meledak menjadi awan gas yang sangat korosif di lokasi yang ditargetkan. Apa pun yang terjebak di dalam awan ini akan menerima kerusakan yang meningkat seiring waktu, dimulai dari kerusakan sebesar _%d._
items.wands.wandofcorrosion.upgrade_stat_name_1=Kerusakan Korosi
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume Gas
items.wands.wandofcorruption.already_corrupted=Karakter tersebut tidak dapat dipengaruhi lebih lanjut.
items.wands.wandofcorruption.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat korupsi, musuh tersebut memiliki peluang untuk menjadi mengamuk.
items.wands.wandofcorruption.desc=Tongkat sihir ini memancarkan energi gelap yang kacau, jika itu belum jelas dari tengkorak kecil dekoratif yang berbentuk seperti itu di ujungnya.
items.wands.wandofcorruption.eleblast_desc=Ledakan elemen dengan tongkat korupsi akan membuat musuh mengamuk selama 5 giliran.
items.wands.wandofcorruption.name=tongkat korupsi
items.wands.wandofcorruption.staff_name=staf korupsi
items.wands.wandofcorruption.stats_desc=Tongkat sihir ini akan melepaskan ledakan energi jahat yang akan melemahkan musuh dan akhirnya menundukkan mereka sesuai keinginanmu. Musuh mampu melawan pengaruh jahat tersebut, tetapi musuh yang lemah jauh lebih mudah dipengaruhi daripada musuh yang sehat.
items.wands.wandofcorruption.upgrade_stat_name_1=Kekuasaan yang Korup
items.wands.wandofcorruption.upgrade_stat_name_2=Durasi Debuff
items.wands.wandofdisintegration.bmage_desc=Saat digunakan oleh _Sang Penyihir Tempur_, tongkat penghancur memiliki jangkauan serangan yang lebih luas, seolah-olah memiliki mantra proyeksi.
items.wands.wandofdisintegration.desc=Tongkat sihir ini terbuat dari bongkahan obsidian padat dan halus, dengan cahaya ungu tua yang menjalar di sisinya, berakhir di ujungnya. Tongkat ini memancarkan energi penghancur, siap melesat ke depan.
items.wands.wandofdisintegration.eleblast_desc=Ledakan elemen dengan tongkat penghancur menghasilkan 100% kerusakan dan menembus dinding.
items.wands.wandofdisintegration.name=tongkat penghancur
items.wands.wandofdisintegration.staff_name=staf disintegrasi
items.wands.wandofdisintegration.stats_desc=Tongkat sihir ini menembakkan sinar yang menembus rintangan apa pun, dan akan menjangkau lebih jauh seiring dengan peningkatan kemampuannya. Sinar tersebut memberikan kerusakan sebesar _%1$d-%2$d_, dan juga akan memberikan kerusakan bonus untuk setiap musuh dan dinding yang ditembusnya.
items.wands.wandofdisintegration.upgrade_stat_name_2=Jangkauan Maksimum
items.wands.wandoffireblast.bmage_desc=Saat Battlemage menyerang musuh dengan tongkat semburan api, ada kemungkinan serangan itu menghasilkan ledakan yang merusak musuh dan menghabiskan semua api di sekitarnya! Kemungkinan ini meningkat seiring semakin banyaknya api yang berdekatan dengan musuh.
items.wands.wandoffireblast.desc=Tongkat sihir ini terbuat dari kayu yang dilapisi pernis merah dengan lapisan emas yang digunakan secara berlimpah agar terlihat sangat anggun. Ujungnya berderak dan mendesis, seolah siap melepaskan sihirnya yang dahsyat.
items.wands.wandoffireblast.eleblast_desc=Ledakan elemen dengan tongkat semburan api memberikan kerusakan 100%, mendobrak pintu, dan membakar musuh serta medan sekitarnya.
items.wands.wandoffireblast.name=tongkat semburan api
items.wands.wandoffireblast.staff_name=staf ledakan api
items.wands.wandoffireblast.stats_desc=Tongkat sihir ini menyemburkan api berbentuk kerucut saat digunakan. Serangan berikutnya akan mengonsumsi _%1$d muatan_ dan memberikan _%2$d-%3$d kerusakan._ Semakin banyak muatan yang digunakan tongkat sihir, semakin besar dan kuat efeknya.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Kerusakan Muatan
items.wands.wandoffireblast.upgrade_stat_name_2=2 Kerusakan Muatan
items.wands.wandoffireblast.upgrade_stat_name_3=3 Kerusakan Muatan
items.wands.wandoffrost.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh yang kedinginan dengan tongkat es, mereka memiliki peluang untuk langsung membeku. Peluang ini menjadi lebih besar semakin dingin musuh tersebut.
items.wands.wandoffrost.desc=Tongkat sihir ini sepertinya terbuat dari semacam es ajaib. Warnanya semakin terang ke arah ujungnya yang membulat. Terasa sangat dingin saat dipegang, tetapi entah bagaimana tangan Anda tetap hangat.
items.wands.wandoffrost.eleblast_desc=Ledakan elemen dengan tongkat es memberikan 100% kerusakan, membekukan musuh, dan memadamkan api.
items.wands.wandoffrost.name=tongkat es
items.wands.wandoffrost.staff_name=staf embun beku
items.wands.wandoffrost.stats_desc=Tongkat sihir ini menembakkan semburan energi es ke arah musuh Anda, memberikan kerusakan sebesar _%1$d-%2$d_ dan efek membekukan. Efeknya tampak lebih kuat di dalam air. Musuh yang sudah kedinginan atau membeku akan menerima kerusakan yang lebih sedikit dari tongkat sihir ini.
items.wands.wandoffrost.upgrade_stat_name_2=Durasi Pendinginan
items.wands.wandoflightning$lightningcharge.desc=Battlemage saat ini dipenuhi energi, memberinya kekebalan terhadap tongkat petirnya dan meningkatkan jangkauan petir yang dapat menyambar darinya.\n\nGiliran Tersisa: %s.
items.wands.wandoflightning$lightningcharge.name=Bermuatan listrik
items.wands.wandoflightning.bmage_desc=Saat Battlemage menyerang musuh dengan tongkat petir, ia memiliki kesempatan untuk mengisi daya listrik pada dirinya sendiri selama 10 giliran. Saat terisi daya, Battlemage kebal terhadap kerusakan petir dan akan memancarkan petir lebih jauh.
items.wands.wandoflightning.desc=Tongkat sihir ini terbuat dari logam padat, sehingga bobotnya cukup berat. Dua cabang melengkung menyatu di ujungnya, dan listrik mengalir di antara keduanya.
items.wands.wandoflightning.eleblast_desc=Ledakan elemen dengan tongkat petir memberikan 100% kerusakan, melumpuhkan musuh selama 5 giliran, dan menyetrum air.
items.wands.wandoflightning.name=tongkat petir
items.wands.wandoflightning.ondeath=Kau bunuh diri dengan Tongkat Petirmu sendiri...
items.wands.wandoflightning.staff_name=tongkat petir
items.wands.wandoflightning.stats_desc=Tongkat sihir ini mengirimkan petir dahsyat yang melesat menembus apa pun yang ditembakkan, menimbulkan kerusakan sebesar _%1$d-%2$d_. Listrik ini akan melesat ke karakter di dekatnya, dan menyebar lebih mudah di dalam air. Petir dari tongkat sihir ini dapat melukai Anda, tetapi tidak akan melukai sekutu Anda.
items.wands.wandoflivingearth$earthguardian.desc=Batu-batu dari tongkat sihir tanah hidupmu telah membentuk pelindung dari tanah! Pelindung berbatu ini akan menyerang musuh di dekatnya, yang akan memaksa mereka untuk menyerang pelindung tersebut, bukan dirimu. Ketika semua ancaman di dekatnya telah hilang, pelindung tersebut akan terbentuk kembali di sekitarmu, dan akan kembali saat kamu menggunakan tongkat sihirmu berikutnya.
items.wands.wandoflivingearth$earthguardian.discover_hint=Anda dapat menemukan karakter ini dengan tongkat sihir tertentu.
items.wands.wandoflivingearth$earthguardian.name=penjaga bumi
items.wands.wandoflivingearth$earthguardian.wand_info=Kekuatan pertahanan penjaga terkait dengan level tongkat sihir Anda. Saat ini, ia memblokir kerusakan sebesar _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Batu-batu ajaib mengelilingi tubuhmu; saat kamu diserang, batu-batu itu akan mencoba menghalangi seranganmu dan mengurangi kerusakan yang kamu terima sebesar 50%%. Namun, setiap kerusakan yang diblokir akan mengikis sebagian batu tersebut.\n\n Sisa Armor: %1$d.\n\n Jika cukup banyak batu yang terbentuk di sekitarmu, serangan berikutnya dari tongkat sihir tanah hidupmu akan menyebabkan batu-batu tersebut membentuk penjaga yang akan bertarung bersamamu.\n\n Armor yang dibutuhkan untuk Penjaga: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Penjaga bumi ini juga mendapat manfaat dari Kekuatan Banyak. Giliran Tersisa: %d.
items.wands.wandoflivingearth$rockarmor.name=pelindung batu
items.wands.wandoflivingearth.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat tanah hidup, sebagian dari kerusakan yang ditimbulkan akan dikembalikan sebagai perisai batu.
items.wands.wandoflivingearth.desc=Tongkat sihir ini terbuat dari batuan yang unik, dengan pita-pita energi kuning yang berc bercahaya. Batuan itu tampak sedikit bergeser saat Anda menggenggam tongkat sihir, seolah-olah mereka dapat merasakan tangan Anda.
items.wands.wandoflivingearth.eleblast_desc=Ledakan elemen dengan tongkat bumi hidup memberikan 50% kerusakan, dan menyembuhkan penjaga bumi aktif untuk setiap musuh yang terkena.
items.wands.wandoflivingearth.name=tongkat bumi hidup
items.wands.wandoflivingearth.staff_name=staf bumi hidup
items.wands.wandoflivingearth.stats_desc=Tongkat sihir ini mengirimkan semburan batu magis ke musuh, memberikan kerusakan sebesar _%1$d-%2$d_. Batu-batu tersebut kemudian akan terbentuk kembali di sekitar pengguna, memberikan mereka perlindungan yang sebanding dengan kerusakan yang diberikan. Jika perlindungan yang cukup terkumpul, ia akan membentuk penjaga batu saat tongkat sihir digunakan kembali.
items.wands.wandoflivingearth.upgrade_stat_name_2=Penjaga HP Maksimum
items.wands.wandoflivingearth.upgrade_stat_name_3=Pemblokiran Penjaga
items.wands.wandofmagicmissile$magiccharge.desc=Tongkat sihir rudalmu telah mengembalikan daya ke tongkat sihirmu, meningkatkan tingkat efektif dari serangan berikutnya yang mereka lakukan.\n\nTongkat sihirmu ditingkatkan menjadi: +%d.\n\nSisa putaran muatan sihir: %s.
items.wands.wandofmagicmissile$magiccharge.name=muatan sihir
items.wands.wandofmagicmissile.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat sihir panah ajaib, semua tongkat sihirnya akan mendapatkan muatan tambahan selain tongkat sihirnya.
items.wands.wandofmagicmissile.desc=Tongkat sihir yang cukup sederhana ini meluncurkan rudal energi magis murni. Meskipun tongkat itu sendiri tidak memiliki efek khusus, ia memiliki lebih banyak muatan yang tersedia dan dapat memperkuat tongkat sihir lain untuk sementara waktu saat ditingkatkan.
items.wands.wandofmagicmissile.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.wands.wandofmagicmissile.eleblast_desc=Ledakan elemen dengan tongkat sihir rudal memberikan kerusakan 50%, dan memberi penyihir 15 giliran untuk mengisi ulang.
items.wands.wandofmagicmissile.name=tongkat sihir panah ajaib
items.wands.wandofmagicmissile.staff_name=tongkat sihir rudal
items.wands.wandofmagicmissile.stats_desc=Setiap serangan dari tongkat sihir ini memberikan kerusakan sebesar _%1$d-%2$d_, dan akan memberikan kekuatan tambahan pada tongkat sihir lain jika telah ditingkatkan.
items.wands.wandofprismaticlight.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat cahaya prismatik, mereka akan lumpuh selama durasi yang besarnya sebanding dengan level tongkat.
items.wands.wandofprismaticlight.desc=Tongkat sihir ini terbuat dari sepotong kristal tembus cahaya yang padat, seperti bongkahan kaca halus yang panjang. Serpihan kecil cahaya berwarna-warni menari-nari di sekitar ujung tongkat, seolah ingin meledak keluar.
items.wands.wandofprismaticlight.eleblast_desc=Ledakan elemen dengan tongkat cahaya prismatik memberikan 67% kerusakan, mengungkap semua medan dalam ledakan, dan membutakan musuh selama 5 putaran.
items.wands.wandofprismaticlight.name=tongkat cahaya prismatik
items.wands.wandofprismaticlight.staff_name=staf cahaya prismatik
items.wands.wandofprismaticlight.stats_desc=Tongkat sihir ini menembakkan sinar cahaya yang menembus kegelapan ruang bawah tanah, mengungkap area tersembunyi dan jebakan. Sinar tersebut dapat membutakan musuh, dan memberikan kerusakan sebesar _%1$d-%2$d_. Musuh iblis dan mayat hidup akan terbakar dalam cahaya terang tongkat sihir, menerima kerusakan tambahan.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Kesempatan Buta
items.wands.wandofprismaticlight.upgrade_stat_name_3=Durasi Cahaya
items.wands.wandofregrowth$dewcatcher.desc=Tanaman penangkap embun adalah tanaman menakjubkan yang mengisi dirinya dengan embun ajaib. Mereka mencoba menyamarkan diri sebagai rumput untuk menghindari perhatian, tetapi gumpalan embun yang terkumpul di tubuh mereka justru mengungkap keberadaan mereka.
items.wands.wandofregrowth$dewcatcher.discover_hint=Anda dapat menemukan tanaman ini dengan tongkat khusus.
items.wands.wandofregrowth$dewcatcher.name=Penangkap Embun
items.wands.wandofregrowth$lotus.desc=Teratai emas adalah tanaman mistis yang hanya dapat dipanggil dengan tongkat regenerasi yang ampuh. Auranya meningkatkan semua tanaman dan efek tanaman, tetapi ia menghabiskan energinya dan mati setelah waktu singkat.
items.wands.wandofregrowth$lotus.discover_hint=Anda dapat menemukan tanaman ini dengan tongkat sihir tertentu, setelah meningkatkan levelnya beberapa kali.
items.wands.wandofregrowth$lotus.name=Teratai Emas
items.wands.wandofregrowth$lotus.wand_info=Teratai ini dihasilkan oleh tongkat pertumbuhan kembali _+%1$d_. Semua tanaman dalam pengaruhnya akan _langsung aktif_ jika ditanam pada karakter. Tanaman juga akan memiliki peluang _%2$d%%_ untuk menjatuhkan bijinya, dan anak panah berujung runcing akan menggunakan daya tahan _%3$d%% lebih sedikit_.
items.wands.wandofregrowth$seedpod.desc=Polong Benih adalah tanaman ajaib yang menghasilkan benih dari jenis tanaman lain, bukan benih dari jenisnya sendiri. Entah bagaimana, mereka berhasil menyebar meskipun tidak memiliki benih sendiri.
items.wands.wandofregrowth$seedpod.discover_hint=Anda dapat menemukan tanaman ini dengan tongkat khusus.
items.wands.wandofregrowth$seedpod.name=Polong Biji
items.wands.wandofregrowth.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat pertumbuhan kembali, dan keduanya berdiri di atas rumput, ia akan mendapatkan penyembuhan herbal yang sebanding dengan kerusakan yang ditimbulkan.
items.wands.wandofregrowth.degradation=Setelah _%d muatan_ berikutnya, tongkat sihir ini akan mulai gagal menghasilkan tanaman dan rumput segar. Batas ini ditingkatkan dengan menaikkan level atau mengupgrade tongkat sihir.
items.wands.wandofregrowth.desc=Tongkat sihir ini terbuat dari batang kayu tipis yang diukir dengan ahli. Entah bagaimana, tongkat ini masih hidup dan bersemangat, berwarna hijau cerah seperti inti pohon muda. "Ketika kehidupan berakhir, kehidupan baru selalu mulai tumbuh... Siklus abadi selalu tetap ada!"
items.wands.wandofregrowth.eleblast_desc=Ledakan elemen dengan tongkat pertumbuhan kembali akan mengakar musuh dan menumbuhkan rumput secara acak di area ledakan.
items.wands.wandofregrowth.name=tongkat pertumbuhan kembali
items.wands.wandofregrowth.staff_name=staf pertumbuhan kembali
items.wands.wandofregrowth.stats_desc=Saat digunakan, tongkat ini akan memancarkan energi pertumbuhan magis ke luar dalam bentuk kerucut, menyebabkan rumput, akar, dan tanaman langka tumbuh subur. Semburan berikutnya akan mengonsumsi _%1$d muatan_. Semakin banyak muatan yang digunakan tongkat, semakin besar dan kuat efeknya.
items.wands.wandofregrowth.upgrade_stat_name_1=Rumput Per Biaya
items.wands.wandofregrowth.upgrade_stat_name_2=Batas Total Rumput
items.wands.wandoftransfusion.bmage_desc=Ketika _Sang Penyihir Pertempuran_ menyerang musuh yang terpesona dengan tongkat transfusi, dia akan mendapatkan perisai dan serangan berikutnya dengan tongkat tersebut tidak akan mengurangi kesehatannya.
items.wands.wandoftransfusion.charged=Tongkatmu dipenuhi dengan energi kehidupan musuhmu!
items.wands.wandoftransfusion.desc=Tongkat sihir ini memiliki bentuk yang cukup sederhana, namun menonjol karena warna magenta dan permata hitam pekat di ujungnya.
items.wands.wandoftransfusion.eleblast_desc=Ledakan elemen dengan tongkat transfusi memikat musuh, menyembuhkan sekutu, dan memberikan 100% kerusakan pada musuh mayat hidup.
items.wands.wandoftransfusion.name=tongkat transfusi
items.wands.wandoftransfusion.ondeath=Kau bunuh diri dengan Tongkat Transfusi milikmu sendiri...
items.wands.wandoftransfusion.staff_name=staf transfusi
items.wands.wandoftransfusion.stats_desc=Saat digunakan pada sekutu atau musuh yang terpesona, tongkat sihir ini akan menyerap _%1$d dari kesehatan pengguna_ untuk menyembuhkan atau melindungi sekutu sebesar _%2$d kesehatan._ Saat digunakan pada musuh, tongkat sihir ini akan mempesona mereka sebentar sambil memberikan perlindungan sebesar _%3$d_ kepada pengguna. Mayat hidup yang bermusuhan akan menerima _%4$d-%5$d kerusakan_ alih-alih terpesona.
items.wands.wandoftransfusion.upgrade_stat_name_1=Penyembuhan Sekutu
items.wands.wandoftransfusion.upgrade_stat_name_2=Perlindungan Diri
items.wands.wandoftransfusion.upgrade_stat_name_3=Kerusakan Mayat Hidup
items.wands.wandofwarding$ward.desc_1=Perisai dasar ini akan secara otomatis menyetrum musuh mana pun yang masuk ke jangkauan pandangannya, memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyetrum perisai ini dengan tongkat perisai Anda akan meningkatkannya.\n\nPerisai ini hanya akan menyetrum satu kali sebelum menghilang.\n\nTongkat perisai Anda menggunakan energi sebesar _%3$d_ untuk mempertahankan perisai ini.
items.wands.wandofwarding$ward.desc_2=Perisai yang ditingkatkan ini memiliki pola yang lebih rumit, dan dapat menyerang beberapa kali. Setiap serangan dari perisai ini akan memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyerang perisai ini dengan tongkat perlindungan Anda akan meningkatkannya.\n\nPerisai ini akan menyerang tiga kali sebelum menghilang.\n\nTongkat perlindungan Anda menggunakan energi sebesar _%3$d_ untuk mempertahankan perisai ini.
items.wands.wandofwarding$ward.desc_3=Perisai yang telah ditingkatkan sepenuhnya ini mampu menyerang lebih banyak kali daripada pendahulunya. Setiap serangan dari perisai ini akan memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyerang perisai ini dengan tongkat perlindungan Anda akan meningkatkannya.\n\nPerisai ini akan menyerang lima kali sebelum menghilang.\n\nTongkat perlindungan Anda menggunakan energi sebesar _%3$d_ untuk mempertahankan perisai ini.
items.wands.wandofwarding$ward.desc_4=Penjaga yang lebih kecil ini memiliki daya tembak yang sama dengan penjaga yang lebih besar, tetapi memiliki kesehatan alih-alih sejumlah muatan tetap. Bentuknya menyerupai permata di ujung tongkat perlindungan Anda. Setiap serangan dari penjaga ini akan memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyerang penjaga ini dengan tongkat perlindungan Anda akan meningkatkan dan menyembuhkannya.\n\nPenjaga ini akan menghabiskan sebagian kesehatannya setiap kali menyerang musuh, tetapi dapat disembuhkan dengan menggunakan tongkat perlindungan Anda padanya.\n\nTongkat perlindungan Anda menggunakan energi sebesar _%3$d_ untuk mempertahankan penjaga ini.
items.wands.wandofwarding$ward.desc_5=Pos penjaga yang ditingkatkan ini lebih besar dan lebih tahan lama daripada pos penjaga yang lebih rendah. Setiap serangan dari pos penjaga ini akan memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyerang pos penjaga ini dengan tongkat perlindungan Anda akan meningkatkan dan menyembuhkannya.\n\nPos penjaga ini akan kehilangan sebagian kesehatannya setiap kali menyerang musuh, tetapi dapat disembuhkan dengan menggunakan tongkat perlindungan Anda padanya.\n\nTongkat perlindungan Anda menggunakan energi _%3$d_ untuk mempertahankan pos penjaga ini.
items.wands.wandofwarding$ward.desc_6=Menara penjaga yang telah ditingkatkan sepenuhnya ini jauh lebih tahan lama daripada pendahulunya. Setiap serangan dari menara penjaga ini akan memberikan kerusakan sebesar _%1$d-%2$d_._\n\nMenyerang menara penjaga ini dengan tongkat perlindungan Anda akan menyembuhkannya.\n\nMenara penjaga ini akan kehilangan sebagian kesehatannya setiap kali menyerang musuh, tetapi dapat disembuhkan dengan menggunakan tongkat perlindungan Anda padanya.\n\nTongkat perlindungan Anda menggunakan energi _%3$d_ untuk mempertahankan menara penjaga ini.
items.wands.wandofwarding$ward.desc_generic_sentry=Penjaga ini memiliki daya tembak yang sama dengan perisai, tetapi memiliki kesehatan alih-alih sejumlah muatan tetap. Bentuknya menyerupai permata di ujung tongkat perlindungan Anda. Menyerang penjaga ini dengan tongkat perlindungan Anda akan meningkatkan dan menyembuhkannya. Penjaga ini akan menghabiskan sebagian kesehatannya setiap kali menyerang musuh, tetapi dapat disembuhkan dengan menggunakan tongkat perlindungan Anda padanya.
items.wands.wandofwarding$ward.desc_generic_ward=Perisai ini akan secara otomatis menyetrum musuh mana pun yang masuk ke dalam jangkauan pandangannya. Menyetrum perisai ini dengan tongkat perisai Anda akan meningkatkan kemampuannya. Perisai memiliki jumlah setruman terbatas sebelum menghilang.
items.wands.wandofwarding$ward.discover_hint=Anda dapat menemukan karakter ini dengan tongkat sihir tertentu.
items.wands.wandofwarding$ward.dismiss_body=Anda dapat menghilangkan perlindungan ini jika Anda tidak lagi ingin tongkat sihir Anda mempertahankannya. Melakukan hal itu akan langsung menghancurkan perlindungan tersebut. Menghilangkan perlindungan ini?
