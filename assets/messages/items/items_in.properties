items.rings.ringofenergy.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan kecepatan pengisian daya sebesar _%s%%_ secara total.
items.rings.ringofenergy.desc=Peralatan sihirmu akan terisi ulang lebih cepat di medan sihir yang dipancarkan dari cincin ini. Sebaliknya, cincin terkutuk akan memperlambat pengisian ulang.
items.rings.ringofenergy.name=cincin energi
