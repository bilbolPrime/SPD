items.weapon.curses.annoying.desc=Senjata-senjata yang menyebalkan ini mampu berbicara, tetapi mereka terlalu energik. Mereka sering kali menarik perhatian Anda tanpa disengaja.
items.weapon.curses.annoying.elestrike_desc=Serangan elemen dengan kutukan yang menyebalkan memiliki peluang 20% untuk membuat setiap musuh dalam jangkauan mengamuk selama 6 putaran.
