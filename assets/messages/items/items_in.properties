items.weapon.melee.greatsword.ability_desc=Duelis dapat menebas musuh dengan pedang besar. Serangan ini memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.greatsword.ability_name=membelah
