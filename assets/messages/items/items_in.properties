items.weapon.melee.greatsword.name=pedang besar
items.weapon.melee.greatsword.typical_ability_desc=Duelis dapat menebas musuh dengan pedang besar. Serangan ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.handaxe.ability_desc=Duelis dapat melakukan _pukulan berat_ dengan kapak tangan. Serangan terkonsentrasi ini memberikan _kerusakan %1$d-%2$d_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.handaxe.ability_name=pukulan berat
items.weapon.melee.handaxe.desc=Kapak ringan, paling sering digunakan untuk menebang pohon. Mata pisaunya yang lebar juga efektif melawan musuh.
