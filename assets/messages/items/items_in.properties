items.artifacts.hornofplenty.desc=Tanduk ini tidak bisa ditiup, melainkan tampak terisi makanan seiring petualangan dan bertambahnya pengalaman Anda. Anda dapat mengonsumsi setiap muatan secara terpisah sebagai camilan, atau makan sampai kenyang.
items.artifacts.hornofplenty.desc_cursed=Tanduk terkutuk itu telah mengikat dirinya di sisimu, tampaknya ia lebih ingin mengambil makanan daripada menghasilkannya.
items.artifacts.hornofplenty.desc_hint=Mungkin ada cara untuk meningkatkan kekuatan tanduk dengan memberinya energi dari makanan.
