items.artifacts.masterthievesarmband.steal_shopkeeper=Anda tidak bisa mencuri langsung dari pemilik toko.
items.artifacts.masterthievesarmband.stole_item=Anda mencuri sebuah barang: %s.
items.artifacts.sandalsofnature.absorb_seed=Sepatu tersebut menyerap biji, sehingga tampak lebih sehat.
items.artifacts.sandalsofnature.ac_feed=MEMBERI MAKAN
items.artifacts.sandalsofnature.ac_root=AKAR
items.artifacts.sandalsofnature.desc_1=Apa yang awalnya tampak seperti sandal yang terbuat dari tali sebenarnya adalah dua tanaman! Mereka tampak sangat lemah dan pucat, mungkin mereka perlu diberi nutrisi?
items.artifacts.sandalsofnature.desc_2=Sepatu itu telah membesar dan sekarang lebih menyerupai dua pasang sepatu yang dijahit. Beberapa warna telah kembali padanya, mungkin mereka masih bisa tumbuh lebih besar lagi?
items.artifacts.sandalsofnature.desc_3=Tanaman-tanaman itu telah tumbuh kembali dan sekarang menyerupai sepasang sepatu bot kokoh yang terbuat dari kulit kayu. Tanaman-tanaman itu tampaknya telah mendapatkan kembali kekuatannya, tetapi mungkin mereka masih bisa tumbuh lebih jauh?
items.artifacts.sandalsofnature.desc_4=Tumbuhan-tumbuhan itu tampaknya telah mencapai ukuran maksimalnya, bentuknya menyerupai sepasang pelindung kaki berlapis baja. Pelindung kaki itu berwarna cokelat tua dan menyerupai pohon yang sangat kokoh.
items.artifacts.sandalsofnature.desc_ability=Sepatu tersebut bergelombang dengan warna benih terakhir yang Anda berikan. Sepatu tersebut dapat berakar sebentar di tanah dan menghasilkan efek tanaman tersebut di mana saja dalam radius 3 petak.\nSeed: _%s_\nCharge needed: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Sandal terkutuk itu menghalangi segala bentuk keselarasan dengan alam.
items.artifacts.sandalsofnature.desc_hint=Anda merasa lebih menyatu dengan alam saat mengenakan artefak ini.
items.artifacts.sandalsofnature.desc_seeds=Anda telah memberi makan bibit %d pada alas kaki.
items.artifacts.sandalsofnature.levelup=Ukuran sepatu Anda bertambah drastis!
items.artifacts.sandalsofnature.low_charge=Sepatu Anda tidak memiliki energi yang cukup untuk itu.
items.artifacts.sandalsofnature.name=sandal alam
items.artifacts.sandalsofnature.name_1=sepatu alam
items.artifacts.sandalsofnature.name_2=sepatu bot alam
items.artifacts.sandalsofnature.name_3=pelindung kaki alami
items.artifacts.sandalsofnature.no_effect=Anda harus menanam benih ke alas kaki Anda terlebih dahulu.
items.artifacts.sandalsofnature.out_of_range=Lokasi itu berada di luar jangkauan.
items.artifacts.sandalsofnature.prompt=Pilih benih
items.artifacts.sandalsofnature.prompt_target=Pilih lokasi
items.artifacts.skeletonkey$keywall.desc=Dinding magis sementara telah ditempatkan di sini oleh kunci tengkorak.
items.artifacts.skeletonkey.ac_insert=MENYISIPKAN
items.artifacts.skeletonkey.crystal_charges=Membuka gembok kristal membutuhkan 5 kali pengisian daya.
items.artifacts.skeletonkey.cursed=Anda tidak bisa menggunakan kunci kerangka terkutuk.
items.artifacts.skeletonkey.desc=Sebuah kunci yang tampak penting dengan kepala berbentuk tengkorak. Gigi-giginya tampak berbeda setiap kali Anda melihatnya.
items.artifacts.skeletonkey.desc_cursed=Kunci terkutuk itu tampaknya secara aktif menghindari masuk ke dalam kunci mana pun, dan bahkan mempersulit (tetapi bukan tidak mungkin) Anda untuk menggunakan kunci Anda yang lain.
items.artifacts.skeletonkey.desc_worn=Kunci ajaib ini tampaknya semakin kuat saat Anda menggunakannya, menggantikan kunci biasa di dalam penjara bawah tanah. Kunci ini dapat dimasukkan ke hampir semua kunci di penjara bawah tanah untuk membuka atau menutupnya, termasuk pintu yang sebelumnya tidak pernah terkunci. Kunci ini bahkan dapat digunakan pada ruang kosong di arah mata angin atau diagonal untuk 'mengunci' udara di depan Anda, menciptakan dinding padat selebar 3 ubin yang bertahan selama 10 putaran. Penguncian akan mendorong musuh menjauh jika ada ruang untuk melakukannya.
items.artifacts.skeletonkey.discard=Anda membuang kunci-kunci Anda yang berlebihan.
items.artifacts.skeletonkey.force_lock=Gembok itu menjadi lemah tanpa kunci utama Anda. Anda berhasil membukanya secara paksa.
items.artifacts.skeletonkey.gold_charges=Membuka gembok emas membutuhkan 2 muatan.
items.artifacts.skeletonkey.invalid_target=Tidak ada yang perlu dikunci atau dibuka di sana.
items.artifacts.skeletonkey.iron_charges=Membuka kunci biasa membutuhkan 1 kali pengisian daya.
items.artifacts.skeletonkey.levelup=Kunci utama Anda akan semakin kuat!
items.artifacts.skeletonkey.lock_charges=Mengunci pintu membutuhkan 2 kali pengisian daya.
items.artifacts.skeletonkey.lock_no_space=Anda tidak bisa mengunci karakter di dalam pintu!
items.artifacts.skeletonkey.locked_with_key=Pintu itu dikunci dengan kunci kerangka milikmu.
items.artifacts.skeletonkey.name=kunci kerangka
items.artifacts.skeletonkey.prompt=Pilih target
items.artifacts.skeletonkey.wall_charges=Membuat dinding sementara membutuhkan 2 kali pengisian daya.
items.artifacts.skeletonkey.wont_open=Entah mengapa, kunci tersebut tidak bisa masuk ke dalam gembok ini.
items.artifacts.talismanofforesight$foresight.desc=Anda merasa sangat gugup, seolah-olah ada bahaya tak terlihat di dekat Anda.
items.artifacts.talismanofforesight$foresight.name=tinjauan ke masa depan
items.artifacts.talismanofforesight$foresight.uneasy=Anda merasa gelisah.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Sebuah batu halus dengan ukiran aneh di atasnya. Anda merasa seolah-olah batu itu mengawasi segala sesuatu di sekitar Anda, memperhatikan apa pun yang tersembunyi.
items.artifacts.talismanofforesight.desc_cursed=Jimat terkutuk itu menatapmu dengan tajam, menumpulkan indra-indramu.
items.artifacts.talismanofforesight.desc_worn=Saat Anda memegang jimat, Anda akan merasakan indra Anda menjadi lebih tajam. Jimat tersebut perlahan-lahan mengumpulkan energi seiring berjalannya waktu dan ketika Anda menemukan pintu tersembunyi atau jebakan. Jimat tersebut dapat menggunakan energinya untuk 'mengintip' dalam bentuk kerucut, yang mengungkapkan semua ubin dan rahasia di area yang dipindai, dan akan memberi Anda penglihatan tentang musuh dan item untuk waktu singkat.
items.artifacts.talismanofforesight.full_charge=Jimatmu sudah terisi penuh!
items.artifacts.talismanofforesight.levelup=Jimatmu semakin kuat!
items.artifacts.talismanofforesight.low_charge=Jimat tersebut membutuhkan setidaknya 5% daya untuk melakukan ramalan.
items.artifacts.talismanofforesight.name=jimat peramal
items.artifacts.talismanofforesight.prompt=Pilih lokasi yang akan dipindai.
items.artifacts.timekeepershourglass$sandbag.desc=Sekantong kecil pasir halus ini seharusnya sangat cocok dengan jam pasir Anda. Rasanya aneh bahwa penjaga toko memiliki barang khusus ini tepat saat Anda membutuhkannya...
items.artifacts.timekeepershourglass$sandbag.levelup=Anda menambahkan pasir ke dalam jam pasir Anda.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Jam pasirmu dipenuhi dengan pasir ajaib!
items.artifacts.timekeepershourglass$sandbag.name=sekantong pasir ajaib
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Anda tidak memiliki jam pasir untuk menempatkan pasir ini.
items.artifacts.timekeepershourglass$timefreeze.desc=Waktu membeku di sekitar Anda, memungkinkan Anda untuk melakukan tindakan secara instan. Efek ini akan berlangsung hingga dibatalkan atau jam pasir Anda kehabisan daya. Menyerang atau menggunakan sihir juga akan membatalkan efek ini.\n\nGiliran hingga penggunaan daya: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Pembekuan Waktu
items.artifacts.timekeepershourglass.ac_activate=MENGAKTIFKAN
items.artifacts.timekeepershourglass.cursed=Anda tidak dapat menggunakan jam pasir terkutuk.
items.artifacts.timekeepershourglass.deactivate=Anda menonaktifkan pembekuan waktu.
items.artifacts.timekeepershourglass.desc=Jam pasir besar dan berornamen ini tampak cukup sederhana, tetapi Anda merasakan kekuatan besar dalam bingkai ukirannya yang halus. Saat Anda memutar jam pasir dan menyaksikan pasir mengalir, Anda dapat merasakan keajaibannya menarik Anda, tentu saja menggunakan sihir ini akan memberi Anda kendali atas waktu.
items.artifacts.timekeepershourglass.desc_cursed=Jam pasir terkutuk itu terkunci di sisimu, kau bisa merasakannya mencoba memanipulasi aliran waktumu.
items.artifacts.timekeepershourglass.desc_hint=Jam pasir itu sepertinya telah kehilangan sebagian pasirnya, seandainya saja kau bisa menemukan sebagiannya...
items.artifacts.timekeepershourglass.freeze=Bekukan waktu di sekitarku
items.artifacts.timekeepershourglass.name=jam pasir penjaga waktu
items.artifacts.timekeepershourglass.no_charge=Jam pasir Anda belum terisi daya cukup untuk dapat digunakan.
items.artifacts.timekeepershourglass.onfreeze=Segala sesuatu di sekitarmu tiba-tiba membeku.
items.artifacts.timekeepershourglass.onstasis=Dunia seolah berubah di sekitarmu dalam sekejap.
items.artifacts.timekeepershourglass.prompt=Bagaimana Anda ingin menggunakan sihir jam pasir? Saat dalam keadaan stasis, waktu akan berjalan normal sementara Anda membeku dan sepenuhnya kebal, mengonsumsi hingga 2 muatan sekaligus. Saat waktu membeku, Anda dapat bergerak seolah-olah tindakan Anda tidak membutuhkan waktu. Ini dapat dinonaktifkan kapan saja dengan menggunakan jam pasir atau menyerang.
items.artifacts.timekeepershourglass.stasis=Membiarkan diriku dalam keadaan diam
items.artifacts.unstablespellbook.ac_add=MENAMBAHKAN
items.artifacts.unstablespellbook.ac_read=MEMBACA
items.artifacts.unstablespellbook.blinded=Anda tidak bisa membaca buku itu saat mata Anda tertutup.
items.artifacts.unstablespellbook.cursed=Anda tidak bisa membaca dari buku mantra terkutuk.
items.artifacts.unstablespellbook.desc=Buku ini dalam kondisi yang sangat baik mengingat usianya. Buku ini berdesis dan berderak saat Anda membalik halamannya, dipenuhi energi yang tak stabil. Jika Anda membaca dari buku ini, tidak ada yang tahu mantra apa yang mungkin Anda ucapkan.
items.artifacts.unstablespellbook.desc_cursed=Buku terkutuk itu telah mengikat dirinya padamu, ia menghambat kemampuanmu untuk menggunakan sebagian besar gulungan.
items.artifacts.unstablespellbook.desc_empowered=Gulungan-gulungan yang telah Anda tambahkan ke buku tersebut bersinar dengan kekuatan. Anda dapat memilih versi eksotis dari efek gulungan-gulungan ini, tetapi dengan biaya tambahan.
items.artifacts.unstablespellbook.desc_index=Buku ini belum lengkap. Indeksnya saat ini menunjuk ke halaman-halaman kosong berikut:
items.artifacts.unstablespellbook.infuse_scroll=Anda menyalurkan energi gulungan itu ke dalam buku.
items.artifacts.unstablespellbook.name=buku mantra yang tidak stabil
items.artifacts.unstablespellbook.no_charge=Buku mantramu kehabisan energi untuk saat ini.
items.artifacts.unstablespellbook.prompt=Pilih gulir
items.artifacts.unstablespellbook.read_empowered=Gulungan yang Anda tambahkan ke buku mantra dipenuhi energi. Anda dapat menyalurkan efek gulungan ini baik versi reguler maupun versi eksotis. Memilih varian eksotis akan membutuhkan 2 muatan, bukan 1.
items.artifacts.unstablespellbook.unable_scroll=Anda tidak dapat menambahkan gulungan ini ke buku.
items.artifacts.unstablespellbook.unknown_scroll=Anda belum yakin jenis gulungan apa ini.
items.bags.bag.discover_hint=Anda bisa membeli barang ini di toko.
items.bags.bag.name=ransel
items.bags.magicalholster.desc=Sarung ramping ini terbuat dari kulit hewan eksotis, dan memiliki sihir ampuh yang memungkinkannya menyimpan sejumlah besar senjata jarak jauh. Anda cukup meraih ke dalam tas dan akan selalu menemukan barang yang Anda cari. Karena sihir sarung ini, tongkat sihir akan terisi sedikit lebih cepat dan senjata lempar akan bertahan sedikit lebih lama di dalamnya.
items.bags.magicalholster.name=sarung ajaib
items.bags.potionbandolier.desc=Sabuk tebal ini melingkari dada Anda seperti selempang, memiliki banyak tali isolasi untuk menampung botol ramuan, kantung air, atau botol logam cair. Saat berada di dalam sabuk, ramuan Anda akan terlindungi dari dingin.
items.bags.potionbandolier.name=sabuk ramuan
items.bags.scrollholder.desc=Wadah berbentuk tabung ini terlihat seperti wadah untuk menyimpan peralatan dan bagan astronom, tetapi gulungan Anda juga akan muat di dalamnya. Bahkan ada beberapa kompartemen samping yang cocok untuk menyimpan kristal mantra, stylus sihir, dan resin sihir. Wadah ini tidak terlihat mudah terbakar, jadi gulungan Anda seharusnya aman dari api di dalamnya.
items.bags.scrollholder.name=pemegang gulungan
items.bags.velvetpouch.desc=Kantung beludru kecil ini dapat menyimpan banyak barang kecil di dalamnya, seperti biji-bijian, batu rune, dan beberapa bahan alkimia.
items.bags.velvetpouch.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.bags.velvetpouch.name=kantong beludru
items.bombs.arcanebomb.desc=Bom ini telah diresapi dengan sifat-sifat gaib. Bom ini akan meledak menjadi ledakan dahsyat yang mirip dengan serangan Goo yang diperkuat, memberikan kerusakan sihir sebesar _%1$d-%2$d_ kepada apa pun dalam jarak 2 petak.
items.bombs.arcanebomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.arcanebomb.name=bom misterius
items.bombs.bomb$doublebomb.desc=Dua bom bubuk hitam berukuran besar yang ditumpuk, sepertinya Anda dapat satu gratis!
items.bombs.bomb$doublebomb.name=dua bom
items.bombs.bomb.ac_lightthrow=CAHAYA & JARAK
items.bombs.bomb.desc=Sebuah bom bubuk hitam yang cukup besar. Ledakan dari bom ini menimbulkan kerusakan sebesar _%1$d-%2$d_ pada apa pun yang berdekatan dengannya, dan akan menghancurkan beberapa medan atau barang di sekitarnya.
items.bombs.bomb.desc_burning=Sumbu bomnya terbakar, jaga jarak atau padamkan apinya!
items.bombs.bomb.desc_fuse=Sepertinya sumbu tersebut membutuhkan beberapa kali putaran untuk terbakar habis setelah dinyalakan.
items.bombs.bomb.name=bom
items.bombs.bomb.ondeath=Ledakan itu akan membunuhmu...
items.bombs.bomb.rankings_desc=Tewas akibat ledakan
items.bombs.bomb.snuff_fuse=Anda dengan cepat memadamkan sumbu bom tersebut.
items.bombs.firebomb.desc=Bom ini telah dimodifikasi agar meledak di area yang lebih luas, menimbulkan kerusakan sebesar _%1$d-%2$d_ dan menyebarkan api yang terus menerus dalam radius 2 petak.
items.bombs.firebomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.firebomb.name=bom api
items.bombs.flashbangbomb.desc=Bom yang telah dimodifikasi ini akan meledak menjadi semburan cahaya, suara, dan listrik saat meledak. Apa pun yang berada dalam jarak 2 petak akan menerima kerusakan sebesar _%1$d-%2$d_ dari ledakan, kerusakan tambahan sebesar 25%% dari listrik, dan akan terkena efek setrum selama 10 giliran.
items.bombs.flashbangbomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.flashbangbomb.name=granat kejut
items.bombs.frostbomb.desc=Bom ini telah dimodifikasi agar meledak di area yang lebih luas, menimbulkan kerusakan sebesar _%1$d-%2$d_ dan menyebarkan hembusan udara dingin yang berkelanjutan dalam radius 2 ubin.
items.bombs.frostbomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.frostbomb.name=bom es
items.bombs.holybomb.desc=Bom ini telah dimodifikasi untuk memancarkan cahaya suci di area yang lebih luas saat meledak. Apa pun dalam jarak 2 petak akan menerima kerusakan sebesar _%1$d-%2$d_ dari ledakan tersebut, dan musuh mayat hidup atau iblis akan menerima kerusakan tambahan sebesar 50%% dari cahaya suci tersebut.
items.bombs.holybomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.holybomb.name=bom suci
items.bombs.noisemaker.desc=Bom yang telah dimodifikasi ini akan berulang kali mengeluarkan suara saat sumbunya habis. Saat sesuatu menyentuh bom, bom akan meledak dan memberikan kerusakan sebesar _%1$d-%2$d_ pada apa pun yang berada dalam jarak 2 petak!
items.bombs.noisemaker.desc_burning=Alat penghasil suara itu terus berdetik, dan akan meledak jika ada sesuatu yang mendekat!
items.bombs.noisemaker.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.noisemaker.name=alat pembuat suara
items.bombs.regrowthbomb.desc=Bom yang telah dimodifikasi ini akan menyemprotkan cairan pemberi kehidupan ke seluruh area dalam radius 3 petak, alih-alih meledak. Area yang terkena ledakan akan dengan cepat ditumbuhi rumput dan tanaman. Anda dan sekutu mana pun yang terkena ledakan akan disembuhkan seolah-olah mereka telah meminum ramuan penyembuhan.
items.bombs.regrowthbomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.regrowthbomb.name=bom pertumbuhan kembali
items.bombs.shrapnelbomb.desc=Bom ini telah dimodifikasi dengan potongan-potongan logam DM-300, yang akan pecah dan berhamburan ke mana-mana saat meledak, menimbulkan kerusakan sebesar _%1$d-%2$d_ dalam jangkauan yang sangat luas di sekitar bom. Sebaiknya Anda bersembunyi di balik sesuatu saat menggunakannya...
items.bombs.shrapnelbomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.shrapnelbomb.name=bom pecahan peluru
items.bombs.smokebomb.desc=Bom ini telah dimodifikasi untuk menyemburkan awan gas tebal bersamaan dengan ledakannya. Bom ini akan menimbulkan kerusakan sebesar _%1$d-%2$d_ dan menyebarkan kabut tebal dalam radius 2 petak.
items.bombs.smokebomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.smokebomb.name=bom asap
items.bombs.woollybomb.desc=Bom yang telah dimodifikasi ini akan menciptakan hamparan luas domba ajaib setelah meledak. Ledakan tersebut akan memberikan kerusakan sebesar _%1$d-%2$d_ pada apa pun dalam radius 2 petak. Domba-domba tersebut akan menghalangi pergerakan dan bertahan sangat lama! Namun, domba-domba tersebut tidak akan bertahan lama jika ada musuh yang kuat, dan dapat dihilangkan secara manual lebih cepat dengan berinteraksi dengan mereka.
items.bombs.woollybomb.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.bombs.woollybomb.name=bom wol
items.brokenseal$warriorshield.desc_active=Segel yang rusak milik Prajurit saat ini membantunya bertahan, memberinya perisai di atas kesehatannya. Ada waktu pendinginan setelah perisai pertama kali aktif sebelum dapat digunakan lagi. Perisai ini tidak berkurang seiring waktu, tetapi akan berakhir jika tidak ada musuh di dekatnya selama beberapa giliran. Ketika berakhir, perisai yang tidak digunakan akan mengurangi waktu pendinginan, hingga maksimal 50. Perisai tersisa: Perisai 7. Waktu Pendinginan Saat Ini: Perisai 2.
items.brokenseal$warriorshield.desc_cooldown=Sang Prajurit baru-baru ini mendapatkan perlindungan dari segelnya yang rusak, dan harus menunggu sampai dia dapat memanfaatkan efek perlindungan tersebut lagi.\n\nGiliran Tersisa: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Cooldown perisai Warrior saat ini bernilai negatif, artinya saat perisainya aktif, cooldown akan lebih rendah dari biasanya yaitu 150 giliran. Cooldown perisai dapat dikurangi hingga serendah -150 giliran, yang berarti perisai akan langsung tersedia kembali setelah diaktifkan.\n\n Cooldown saat ini: %d.
items.brokenseal$warriorshield.name=Perisai Prajurit
items.brokenseal.ac_affix=AFIKS
items.brokenseal.affix=Kau menempelkan segel itu ke baju zirahmu!
items.brokenseal.choose_desc=Baik baju zirah ini maupun segel yang rusak membawa sebuah glif. Pilih glif mana yang harus disimpan.\n\nGlif Baju Zirah: %1$s\nGlif Segel Rusak: %2$s\n\nPerhatikan bahwa jika Anda memilih glif yang saat ini ada pada baju zirah, segel tersebut tidak akan dapat mentransfernya nanti.
items.brokenseal.choose_title=Pilih sebuah Glif
items.brokenseal.cursed_armor=Segel tersebut tidak akan berlaku untuk baju zirah terkutuk.
items.brokenseal.desc=Segel lilin, ditempelkan pada baju zirah sebagai simbol keberanian. Segel ini memiliki ukiran rune perlindungan yang pudar di tengahnya, dan retak menjadi dua di tengahnya. Sebagai kenang-kenangan dari rumahnya, segel ini membantu prajurit untuk bertahan. Saat mengenakan segel ini, prajurit akan langsung mendapatkan perlindungan saat kesehatannya hampir berkurang setengah atau lebih. Segel ini dapat ditempelkan pada baju zirah, dan dipindahkan antar baju zirah. Segel ini dapat membawa satu peningkatan, selama peningkatan tersebut diterapkan pada baju zirah saat segel terpasang padanya.
items.brokenseal.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.brokenseal.inscribed=Segel tersebut bertuliskan _%s._
items.brokenseal.name=segel rusak
items.brokenseal.prompt=Pilih Armor
items.brokenseal.unknown_armor=Anda harus memastikan terlebih dahulu apakah baju zirah itu terkutuk atau tidak.
items.dewdrop.already_full=Anda sudah dalam keadaan sehat sepenuhnya.
items.dewdrop.desc=Setetes embun yang jernih. Karena keajaiban tempat ini, air murni memiliki khasiat pemulihan ringan.
items.dewdrop.name=titik embun
items.dewvial.ac_drink=MINUM
items.dewvial.auto_drink=Botol embun dikosongkan untuk menyembuhkan lukamu.
items.dewvial.collected=Kamu mengumpulkan setetes embun ke dalam botol.
items.dewvial.desc=Kamu bisa menyimpan embun yang tersisa di botol kecil ini untuk diminum nanti. Jika botol penuh, embunnya akan diminum secara otomatis saat nyawamu terancam.
items.dewvial.empty=Botol embunmu kosong!
items.dewvial.full=Botol embunmu penuh!
items.dewvial.name=botol embun
items.energycrystal.desc=Koleksi kristal magis kecil, berisi energi alkimia. Kristal-kristal ini adalah bahan paling umum dalam resep alkimia dan dapat diproduksi di panci alkimia dengan mendaur ulang barang-barang habis pakai.
items.energycrystal.name=kristal energi
items.equipableitem.ac_equip=MELENGKAPI
items.equipableitem.ac_unequip=TIDAK MEMPERLENGKAPI
items.equipableitem.curse_detected=Anda merasakan bahwa item tersebut terkutuk tepat sebelum Anda memakainya!
items.equipableitem.unequip_cursed=Kamu tidak bisa menghilangkan benda terkutuk!
items.food.berry.desc=Buah beri kecil ini ditemukan oleh Sang Pemburu di antara tumbuh-tumbuhan di dalam penjara bawah tanah. Buah ini dapat dimakan dengan cepat, mengembalikan sedikit rasa kenyang, dan mungkin mengandung biji yang dapat digunakan!
items.food.berry.discover_hint=Anda dapat menemukan item ini dengan menggunakan talenta hero tertentu.
items.food.berry.eat_msg=Buah beri itu enak sekali!
items.food.berry.name=buah beri penjara bawah tanah
items.food.blandfruit$chunks.desc=Buah hambar itu meledak saat benturan, meninggalkan potongan-potongan yang tidak bergerak. Meskipun sedikit kotor, potongan-potongan besar buah hambar yang dimasak ini tampak sangat layak dimakan.
items.food.blandfruit$chunks.name=potongan buah hambar
items.food.blandfruit.blindfruit=buah buta
items.food.blandfruit.cooked=buah hambar yang dimasak
items.food.blandfruit.desc=Terlalu kering dan hambar, mungkin merebusnya dengan bahan lain akan memperbaikinya.
items.food.blandfruit.desc_cooked=Buah tersebut telah mengembang karena direndam dalam panci dan bahkan telah menyerap khasiat dari biji yang dimasak bersamanya. Buah tersebut akan memiliki efek sesuai dengan ramuan yang terkandung dalam biji tersebut.
items.food.blandfruit.desc_eat=Sepertinya sudah siap untuk dimakan!
items.food.blandfruit.desc_throw=Sepertinya benda ini cukup mudah meledak, mungkin sebaiknya dibuang saja.
items.food.blandfruit.dreamfruit=buah ajaib
items.food.blandfruit.earthfruit=buah tanah
items.food.blandfruit.fadefruit=buah pudar
items.food.blandfruit.firefruit=buah api
items.food.blandfruit.icefruit=buah es
items.food.blandfruit.name=buah hambar
items.food.blandfruit.raw=Kamu tidak tega memakannya mentah-mentah.
items.food.blandfruit.rotfruit=buah busuk
items.food.blandfruit.sorrowfruit=buah kesedihan
items.food.blandfruit.starfruit=belimbing
items.food.blandfruit.stormfruit=buah badai
items.food.blandfruit.sunfruit=buah matahari
items.food.blandfruit.swiftfruit=buah cepat
items.food.chargrilledmeat.desc=Sepertinya steak yang lumayan enak.
items.food.chargrilledmeat.discover_hint=Anda bisa membuatnya menggunakan bahan makanan lain.
items.food.chargrilledmeat.name=daging panggang
items.food.food.ac_eat=MAKAN
items.food.food.desc=Tidak ada yang istimewa di sini: daging kering, beberapa biskuit - hal-hal seperti itu.
items.food.food.eat_msg=Makanan itu rasanya enak sekali!
items.food.food.name=jatah makanan
items.food.frozencarpaccio.better=Kamu merasa lebih baik!
items.food.frozencarpaccio.desc=Ini adalah sepotong daging mentah beku. Satu-satunya cara untuk memakannya adalah dengan memotongnya menjadi irisan tipis. Dan dengan cara ini, rasanya sungguh enak.
items.food.frozencarpaccio.discover_hint=Anda bisa membuatnya menggunakan bahan makanan lain.
items.food.frozencarpaccio.hard=Anda merasakan kulit Anda mengeras!
items.food.frozencarpaccio.invis=Kamu melihat tanganmu menjadi tak terlihat!
items.food.frozencarpaccio.name=carpaccio beku
items.food.frozencarpaccio.refresh=Menyegarkan!
items.food.meatpie.desc=Pai lezat berisi daging gurih. Ini akan membuat Anda kenyang lebih dari makanan lainnya.
items.food.meatpie.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.food.meatpie.eat_msg=Makanan itu luar biasa!
items.food.meatpie.name=pai daging
items.food.mysterymeat$placeholder.name=daging
items.food.mysterymeat.desc=Makanlah dengan risiko sendiri!
items.food.mysterymeat.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.food.mysterymeat.eat_msg=Makanan itu rasanya... aneh.
items.food.mysterymeat.hot=Oh, panas sekali!
items.food.mysterymeat.legs=Kamu tidak bisa merasakan kakimu!
items.food.mysterymeat.name=daging misterius
items.food.mysterymeat.not_well=Anda merasa tidak enak badan.
items.food.mysterymeat.stuffed=Kamu sudah kenyang.
items.food.pasty$fishleftover.desc=Sisa ikan dari makanan Anda sebelumnya. Anda bisa memakannya kapan saja untuk sedikit mengembalikan rasa lapar.
items.food.pasty$fishleftover.eat_msg=Makanan itu rasanya lumayan.
items.food.pasty$fishleftover.name=sisa ikan
items.food.pasty.amulet_desc=Akhirnya kau menemukannya, jimat ajaib milik - tunggu sebentar, ini hanya cokelat yang dibungkus kertas timah dan dibuat menyerupai jimat! Ini tidak akan memberimu kekuatan tanpa batas, tetapi setidaknya akan membuatmu kenyang dan memberimu sedikit daya artefak.\n\nApril Mop!
items.food.pasty.amulet_name=Jimat Yendor?
items.food.pasty.cane_desc=Permen tongkat yang sangat manis dan besar. Ukurannya cukup besar untuk membuatmu kenyang, dan gulanya mungkin juga akan memberikan sedikit tambahan kekuatan pada tongkat sihirmu.\n\nSelamat Liburan!
items.food.pasty.cane_name=permen tongkat
items.food.pasty.desc=Pastri Cornish otentik dengan isian tradisional berupa daging sapi dan kentang. Lezat!
items.food.pasty.egg_desc=Telur cokelat besar, dibungkus dengan kertas timah kuning warna-warni. Cokelatnya cukup banyak untuk membuatmu kenyang, dan gulanya mungkin akan menambah sedikit energi pada makananmu. Selamat Paskah!
items.food.pasty.egg_name=telur paskah
items.food.pasty.fish_desc=Seekor ikan utuh yang dikukus, diawetkan secara ajaib di atas hamparan sayuran hijau. Sudah menjadi tradisi untuk menyimpan sebagian ikan untuk nanti sekitar waktu ini setiap tahun, jadi Anda akan menyimpan sebagian sisa makanan daripada memakannya sekaligus. Selamat Tahun Baru Imlek!
items.food.pasty.fish_name=ikan kukus
items.food.pasty.name=pucat
items.food.pasty.pie_desc=Sepotong besar pai labu. Rasanya yang manis dan pedas akan membuatmu kenyang dan memberikan sedikit penyembuhan. Selamat Halloween!
items.food.pasty.pie_name=pai labu
items.food.pasty.rainbow_desc=Ramuan berwarna-warni ini adalah sejenis makanan cair. Selain memuaskan rasa lapar, ramuan ini juga mengandung sedikit sihir yang akan menenangkan musuh non-bos di sekitar Anda, membuat mereka untuk sementara ragu-ragu untuk melawan Anda.\n\nSelamat Hari Kebanggaan!
items.food.pasty.rainbow_name=ramuan pelangi
items.food.pasty.sparkling_desc=Ramuan berkilauan ini adalah sejenis makanan cair. Ia memuaskan rasa lapar dan menyerupai anggur bersoda, tetapi sebenarnya tidak mengandung alkohol. Sensasi hangat di perut Anda akan memberikan sedikit perlindungan.\n\nSelamat Tahun Baru!
items.food.pasty.sparkling_name=ramuan berkilauan
items.food.pasty.vanilla_desc=Sepotong besar kue vanila ini memiliki taburan warna-warni dan lapisan krim biru. Kue ini dibuat untuk merayakan pengalaman bertahun-tahun, dan akan memberikan sedikit pengalaman itu kepada Anda saat dimakan. \n\n Pixel Dungeon asli pertama kali dirilis pada 4 Desember 2012. Selamat ulang tahun Pixel Dungeon!
items.food.pasty.vanilla_name=kue biru
items.food.phantommeat.desc=Sepotong daging besar yang berkilauan dan tembus pandang, dipotong dari ikan piranha hantu. Daging ajaib ini tidak perlu dimasak dan memberikan sejumlah manfaat pertahanan selain membuat Anda kenyang sepenuhnya. Saat dimakan, daging ini akan memberikan kemampuan menghilang, kulit kayu, beberapa penyembuhan, dan menyembuhkan banyak efek berbahaya.
items.food.phantommeat.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.food.phantommeat.name=daging hantu
items.food.smallration.desc=Bentuknya persis seperti jatah makanan standar, hanya saja ukurannya lebih kecil.
items.food.smallration.discover_hint=Anda bisa membeli barang ini di toko.
items.food.smallration.eat_msg=Makanan itu rasanya lumayan.
items.food.smallration.name=jatah makanan kecil
items.food.stewedmeat.desc=Daging yang direbus telah dibersihkan dari penyakit atau parasit apa pun. Seharusnya aman untuk dimakan.
items.food.stewedmeat.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.food.stewedmeat.eat_msg=Makanan itu rasanya lumayan.
items.food.stewedmeat.name=daging rebus
items.food.supplyration.desc=Jatah makanan ini ditinggalkan di ruang bawah tanah oleh dan untuk anggota perkumpulan pencuri. Jatah ini dirancang khusus untuk dimakan sambil berjalan, dan membantu dalam kegiatan kriminal secara umum. Meskipun tidak mengenyangkan seperti jatah makanan biasa, makanan ini dapat dimakan dengan cepat, memberikan sedikit penyembuhan langsung, dan akan memulihkan satu daya jubah bayangan Rogue.
items.food.supplyration.discover_hint=Anda dapat menemukan item ini dengan menggunakan talenta hero tertentu.
items.food.supplyration.name=jatah pasokan
items.gold.desc=Setumpuk koin emas. Kumpulkan koin emas untuk dibelanjakan nanti di toko.
items.gold.name=emas
items.heap.artifact=sebuah artefak
items.heap.chest=Dada
items.heap.chest_desc=Anda tidak akan tahu apa isinya sampai Anda membukanya!
items.heap.crystal_chest=Peti kristal
items.heap.crystal_chest_desc=Anda dapat melihat _%s_ di dalamnya, tetapi untuk membuka peti tersebut Anda memerlukan kunci kristal.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Peti terkunci
items.heap.locked_chest_desc=Kamu tidak akan tahu apa yang ada di dalamnya sampai kamu membukanya! Tapi untuk membukanya, kamu membutuhkan kunci emas.
items.heap.remains=Jenazah sang pahlawan
items.heap.remains_desc=Inilah yang tersisa dari salah satu pendahulu Anda. Mungkin ada baiknya memeriksa apakah ada barang berharga di dalamnya.
items.heap.ring=cincin
items.heap.skeleton=Sisa-sisa kerangka
items.heap.skeleton_desc=Inilah yang tersisa dari seorang petualang malang. Mungkin ada baiknya memeriksa apakah ada barang berharga di dalamnya.
items.heap.tomb=Makam
items.heap.tomb_desc=Makam kuno ini mungkin berisi sesuatu yang berguna, tetapi pemiliknya pasti akan menolak untuk diperiksa.
items.heap.wand=tongkat sihir
items.honeypot$shatteredpot.desc=Guci itu telah hancur berkeping-keping, hanya madu lengket yang melapisi dindingnya yang menahannya agar tetap utuh, dan perlahan-lahan hancur berantakan. Meskipun dalam keadaan pecah, lebah itu tampaknya masih ingin melindungi guci tersebut.
items.honeypot$shatteredpot.name=sarang madu yang hancur
items.honeypot.ac_shatter=PECAH
items.honeypot.desc=Guci madu besar ini sebenarnya hanya dilapisi madu, tetapi di dalamnya terdapat seekor lebah raksasa! Lebah sebesar ini biasanya tinggal di sarangnya, mungkin guci ini semacam sangkar khusus untuk menjebak serangga? Lebah itu tampak cukup nyaman di dalam guci dengan madunya, dan berdengung waspada ke arah Anda saat Anda melihatnya.
items.honeypot.name=jebakan madu
items.item.ac_drop=MENJATUHKAN
items.item.ac_throw=MELEMPARKAN
items.item.curse=menyumpahi
items.item.custom_note=Item ini memiliki catatan khusus: "_%s_"
items.item.custom_note_type=Jenis barang ini memiliki catatan khusus: "_%s_"
items.item.discover_hint=Anda dapat menemukan item ini secara acak di dalam ruang bawah tanah.
items.item.prompt=Pilih arah lemparan
items.item.rankings_desc=Dibunuh oleh: %s
items.journal.alchemypage.desc=Sepotong halaman robek dari buku panduan alkimia.\n\nSebagian besar teks terlalu kecil untuk dibaca dari jarak jauh, tetapi Anda dapat membaca judul halamannya:\n\n_"%s"_
items.journal.alchemypage.name=halaman buku alkimia yang robek
items.journal.documentpage.desc=Selembar halaman, mungkin disobek dari sebuah buku. Anda perlu mengambilnya untuk membacanya.
items.journal.documentpage.name=halaman robek
items.journal.guidebook.desc=Buku panduan petualang, ditinggalkan di sini oleh seseorang yang memutuskan bahwa berpetualang bukanlah untuk mereka! Buku khusus ini ajaib, dan dapat mendorong para petualang untuk membaca halaman pada saat yang tepat. Meskipun memiliki fungsi tersebut, buku ini paling populer karena kata-kata besar "Jangan Panik!" yang ditulis dengan huruf besar dan ramah di sampulnya.
items.journal.guidebook.hint_desktop=Buku panduan Anda berisi saran untuk Anda! Pilih tombol jurnal yang berkedip (%s) di kanan atas untuk membacanya.
items.journal.guidebook.hint_mobile=Buku panduan Anda berisi saran untuk Anda! Ketuk tombol jurnal yang berkedip di kanan atas untuk membacanya.
items.journal.guidebook.hint_status=Buku panduan
items.journal.guidebook.name=buku penguasaan ruang bawah tanah
items.journal.guidepage.desc=Sepotong halaman robek dari buku panduan petualangan.\n\nSebagian besar teks terlalu kecil untuk dibaca dari jarak jauh, tetapi Anda dapat melihat judul halamannya:\n\n_"%s"_
items.journal.guidepage.name=halaman buku panduan yang robek
items.journal.regionlorepage$caves.desc=Ini tampak seperti catatan dalam buku harian seorang penjelajah, yang terpelihara dengan sangat baik meskipun usianya pasti sudah sangat tua. Ambil dan bacalah.
items.journal.regionlorepage$caves.name=entri log lama
items.journal.regionlorepage$city.desc=Sebuah lempengan logam kecil berkarat dengan pesan yang terukir secara ajaib di atasnya. Huruf-hurufnya masih jelas meskipun lempengan itu sudah tua, tetapi Anda harus mengangkatnya untuk membacanya.
items.journal.regionlorepage$city.name=tablet berkarat
items.journal.regionlorepage$halls.desc=Sebuah tablet kecil berwarna hitam dengan huruf-huruf hijau bercahaya yang terukir di atasnya. Huruf-huruf bercahaya itu tampak kabur dari kejauhan, Anda harus mengangkatnya untuk membacanya.
items.journal.regionlorepage$halls.name=tablet bercahaya
items.journal.regionlorepage$prison.desc=Sebuah catatan harian, atau catatan jenis lain, yang ditulis di selembar kertas tua. Tampaknya kondisinya lebih baik daripada surat-surat yang Anda temukan di selokan, tetapi Anda tetap perlu mengambilnya untuk membacanya.
items.journal.regionlorepage$prison.name=entri jurnal yang usang
items.journal.regionlorepage$sewers.desc=Sesuatu yang tampak seperti surat, ditulis di atas selembar kertas yang kotor. Anda perlu mengangkatnya untuk dapat membaca apa yang tertulis di atasnya.
items.journal.regionlorepage$sewers.name=huruf usang
items.keys.crystalkey.desc=Permukaan potongan kunci kristal ini berkilauan dalam kegelapan. Mungkin kunci ini akan membuka sesuatu yang terbuat dari kristal?
items.keys.crystalkey.name=Kunci kristal
items.keys.goldenkey.desc=Lekukan pada kunci emas ini sangat kecil dan rumit. Mungkin kunci ini bisa membuka peti yang terkunci?
items.keys.goldenkey.name=kunci emas
items.keys.ironkey.desc=Lekukan pada kunci besi kuno ini sudah sangat aus; tali kulitnya sudah usang dimakan usia. Pintu apa yang mungkin bisa dibukanya?
items.keys.ironkey.name=kunci besi
items.keys.skeletonkey.name=kunci kerangka
items.keys.wornkey.desc=Kunci ini sudah usang dan warnanya pudar, tetapi terlihat serius. Mungkin kunci ini bisa membuka pintu penting di dekat sini.
items.keys.wornkey.name=kunci usang
items.kindofmisc.unequip_message=Anda harus melepas salah satu item ini terlebih dahulu. Pilih item untuk ditukar.
items.kindofmisc.unequip_title=Lepaskan satu item.
items.kindofweapon.empty=kosong
items.kindofweapon.equip_cursed=Genggamanmu tanpa sadar mengencang pada senjata tersebut.
items.kindofweapon.swift_equip=Anda dengan cepat mempersiapkan senjata Anda.
items.kindofweapon.which_equip_msg=Slot senjata mana yang ingin Anda lengkapi dengan item ini?\n\nSang Juara menyerang langsung dengan senjata utamanya, tetapi dapat menggunakan kemampuan senjata mana pun. Kedua senjata memiliki jumlah muatan yang sama.\n\nSang Juara juga dapat menukar senjata utama dan sekundernya secara instan.
items.kindofweapon.which_equip_primary=Primer (%s)
items.kindofweapon.which_equip_secondary=Sekunder (%s)
items.kingscrown.ac_wear=MEMAKAI
items.kingscrown.desc=Mahkota raja kurcaci terakhir ini bersinar dengan energi magis yang luar biasa. Saat dikenakan, sihir mahkota akan mengalir ke baju zirah yang sedang Anda kenakan, mengubahnya menjadi baju zirah epik unik dengan kemampuan khusus. Baju zirah baru ini akan mempertahankan semua sifat dari baju zirah aslinya.
items.kingscrown.discover_hint=Anda bisa mendapatkan item ini sebagai hasil jarahan dari musuh tertentu.
items.kingscrown.naked=Sayangnya, mahkota itu tidak bisa mengubah pakaian dalammu.
items.kingscrown.name=Mahkota Raja Kurcaci
items.kingscrown.ratgraded=Cakar Raja Tikus bersinar terang saat zirahmu berubah!
items.kingscrown.upgraded=Mahkota itu bersinar terang lalu hancur berkeping-keping saat baju zirahmu berubah bentuk!
items.liquidmetal.ac_apply=MENERAPKAN
items.liquidmetal.already_fixed=Senjata lempar itu sudah dalam kondisi sempurna!
items.liquidmetal.apply=Anda menggunakan logam cair %d untuk memperbaiki senjata lempar Anda.
items.liquidmetal.desc=Cairan ajaib ini dapat mengisi retakan dan sobekan pada senjata lempar, mengembalikannya ke kondisi sempurna! Jika satu set senjata kehilangan satu senjata tetapi telah diperbaiki sepenuhnya, maka logam cair bahkan dapat digunakan untuk mengganti senjata yang hilang dari set tersebut! Senjata tingkat 1 membutuhkan 10 logam cair untuk diperbaiki sepenuhnya, senjata tingkat 5 membutuhkan 30. Setiap peningkatan juga meningkatkan jumlah logam yang dibutuhkan sebesar 35%. Logam cair tidak dapat digunakan untuk memperbaiki ujung anak panah.
items.liquidmetal.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.liquidmetal.name=logam cair
items.liquidmetal.prompt=Pilih senjata lempar
items.lostbackpack.desc=Ini adalah inventaris barang hilang Anda. Kumpulkan untuk mendapatkan kembali semua barang yang hilang!
items.lostbackpack.name=ransel hilang
items.merchantsbeacon.ac_use=MENGGUNAKAN
items.merchantsbeacon.desc=Teknologi kurcaci yang aneh ini memungkinkan Anda untuk berkomunikasi dari jarak jauh. Setelah diaktifkan, suar ini akan memungkinkan Anda untuk menjual barang ke Pixel Mart dari mana saja di dalam penjara bawah tanah. Namun, sihir di dalam suar hanya akan bertahan selama satu sesi, jadi gunakanlah dengan bijak.
items.merchantsbeacon.name=suar pedagang
items.potions.brews.aquabrew.desc=Saat pecah, ramuan ini akan melepaskan semburan air bertekanan di lokasinya. Semburan ini tidak hanya cukup kuat untuk melukai musuh yang berapi-api, tetapi juga menyebarkan air ke area sekitarnya, menonaktifkan jebakan, memadamkan api, dan mendorong mundur karakter yang berada di dekat semburan tersebut.
items.potions.brews.aquabrew.name=minuman air
items.potions.brews.blizzardbrew.desc=Saat pecah, ramuan ini akan melepaskan badai salju yang berputar-putar dan menyebar dengan cepat seperti gas.
items.potions.brews.blizzardbrew.name=bir badai salju
items.potions.brews.brew.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.potions.brews.causticbrew.desc=Ramuan ini akan menyebarkan cairan korosif di area yang luas di sekitar lokasi pecahnya. Apa pun yang terkena cairan tersebut akan perlahan meleleh jika tidak dapat dibersihkan dengan air.
items.potions.brews.causticbrew.name=ramuan kaustik
items.potions.brews.infernalbrew.desc=Saat pecah, ramuan ini akan melepaskan kobaran api dahsyat yang dengan cepat menyebar seperti gas.
items.potions.brews.infernalbrew.name=ramuan neraka
items.potions.brews.shockingbrew.desc=Saat pecah, ramuan ini akan melepaskan badai listrik di area luas di sekitar lokasi pecahnya.
items.potions.brews.shockingbrew.name=ramuan mengejutkan
items.potions.brews.unstablebrew.desc=Ramuan ajaib ini bersinar dengan warna-warna pelangi yang berubah-ubah. Saat diminum atau dilempar, ramuan ini akan memicu efek ramuan acak. Efek ramuan akan selalu bermanfaat jika diminum, dan akan selalu berbahaya jika dilempar.
items.potions.brews.unstablebrew.name=minuman yang tidak stabil
items.potions.elixirs.elixir.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Anda untuk sementara memperoleh khasiat pemulihan yang mirip dengan Goo. Saat berdiri di dalam air, Anda akan memulihkan sedikit kesehatan per giliran. Efeknya dihentikan sementara ketika kesehatan Anda penuh atau Anda berada di luar air. Sisa penyembuhan: ZXQPH0.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=penyembuhan air
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ramuan ini mengandung sisa-sisa Goo yang diperkaya dengan ramuan penyembuhan. Meskipun tidak akan memberikan penyembuhan langsung, ramuan ini akan secara bertahap memulihkan kesehatan dalam jumlah yang lebih besar saat Anda berdiri di dalam air.
items.potions.elixirs.elixirofaquaticrejuvenation.name=ramuan peremajaan air
items.potions.elixirs.elixirofarcanearmor.desc=Ramuan ini akan memberikan peminumnya ketahanan jangka panjang terhadap kerusakan sihir.
items.potions.elixirs.elixirofarcanearmor.name=ramuan pelindung gaib
items.potions.elixirs.elixirofdragonsblood.desc=Saat dikonsumsi, ramuan ini akan mengirimkan kekuatan api yang mengalir melalui pembuluh darah peminumnya. Efek ini akan membuat peminumnya kebal terhadap api, dan memungkinkan mereka untuk membakar musuh dengan serangan fisik.
items.potions.elixirs.elixirofdragonsblood.name=ramuan darah naga
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Anda berada di bawah pengaruh ramuan jatuh bulu, yang memungkinkan Anda jatuh ke jurang tanpa menerima kerusakan!\n\nGiliran tersisa: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=jatuh bulu
items.potions.elixirs.elixiroffeatherfall.desc=Ramuan ini menawarkan efek levitasi yang lebih lemah namun lebih terkontrol, memungkinkan peminumnya jatuh dari ketinggian yang cukup jauh tanpa membahayakan diri sendiri untuk sementara waktu.
items.potions.elixirs.elixiroffeatherfall.light=Kamu merasa seringan bulu!
items.potions.elixirs.elixiroffeatherfall.name=ramuan bulu jatuh
items.potions.elixirs.elixirofhoneyedhealing.desc=Ramuan ini menggabungkan penyembuhan dengan rasa manis madu. Saat diminum, ramuan ini akan memberikan efek yang sama seperti ramuan penyembuhan dan sedikit menghilangkan rasa lapar, tetapi juga dapat dilemparkan untuk menyembuhkan sekutu. Makhluk yang memiliki kedekatan dengan madu mungkin akan tenang jika item ini digunakan pada mereka.
items.potions.elixirs.elixirofhoneyedhealing.name=ramuan penyembuhan madu
items.potions.elixirs.elixiroficytouch.desc=Saat dikonsumsi, ramuan ini akan memungkinkan peminumnya menyerap panas dari musuh yang mereka serang. Efek ini akan membuat peminumnya kebal terhadap dingin, dan memungkinkan mereka untuk mendinginkan musuh dengan serangan fisik.
items.potions.elixirs.elixiroficytouch.name=ramuan sentuhan dingin
items.potions.elixirs.elixirofmight$htboost.desc=Tubuhmu terasa sangat kuat dan sehat. Kesehatan maksimalmu meningkat untuk jangka waktu yang lama. Seiring bertambahnya level, peningkatan ini akan berangsur-angsur berkurang. Jumlah peningkatan saat ini: 0. Level tersisa: 1.
items.potions.elixirs.elixirofmight$htboost.name=peningkatan kesehatan maksimal
items.potions.elixirs.elixirofmight.desc=Cairan ampuh ini akan mengalir melalui otot Anda, meningkatkan kekuatan Anda secara permanen sebesar satu poin dan meningkatkan kesehatan maksimal Anda sementara sebesar %d poin. Peningkatan kesehatan ini sebanding dengan kesehatan maksimal Anda, tetapi akan perlahan berkurang seiring bertambahnya level Anda.
items.potions.elixirs.elixirofmight.msg=Kekuatan baru mengalir deras di tubuhmu, sekarang kamu memiliki kekuatan %d!
items.potions.elixirs.elixirofmight.name=ramuan kekuatan
items.potions.elixirs.elixiroftoxicessence.desc=Saat dikonsumsi, ramuan ini akan memberikan energi beracun kepada peminumnya. Peminumnya akan terus menyebarkan gas beracun saat bergerak, dan akan kebal terhadap gas beracun dan racun untuk jangka waktu sedikit lebih lama daripada durasi efeknya.
items.potions.elixirs.elixiroftoxicessence.name=ramuan esensi beracun
items.potions.exotic.exoticpotion.amber=ramuan amber eksotis
items.potions.exotic.exoticpotion.azure=ramuan biru eksotis
items.potions.exotic.exoticpotion.bistre=ramuan bistre eksotis
items.potions.exotic.exoticpotion.charcoal=ramuan arang eksotis
items.potions.exotic.exoticpotion.crimson=ramuan merah tua eksotis
items.potions.exotic.exoticpotion.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.potions.exotic.exoticpotion.golden=ramuan emas eksotis
items.potions.exotic.exoticpotion.indigo=ramuan indigo eksotis
items.potions.exotic.exoticpotion.ivory=ramuan gading eksotis
items.potions.exotic.exoticpotion.jade=ramuan giok eksotis
items.potions.exotic.exoticpotion.magenta=ramuan magenta eksotis
items.potions.exotic.exoticpotion.no=Tidak, saya berubah pikiran.
items.potions.exotic.exoticpotion.silver=ramuan perak eksotis
items.potions.exotic.exoticpotion.turquoise=ramuan pirus eksotis
items.potions.exotic.exoticpotion.unknown_desc=Labu bundar ini berisi cairan berwarna-warni yang bertekstur kasar. Tampaknya cairan ini asing di negeri ini, siapa tahu apa yang akan terjadi jika diminum atau dilempar?
items.potions.exotic.exoticpotion.warning=Apakah kamu benar-benar ingin membatalkan penggunaan ramuan ini? Ramuan ini akan tetap dikonsumsi.
items.potions.exotic.exoticpotion.yes=Ya, saya yakin
items.potions.exotic.potionofcleansing$cleanse.desc=Karakter ini untuk sementara kebal terhadap semua efek status berbahaya!\n\nGiliran tersisa: %s.
items.potions.exotic.potionofcleansing$cleanse.name=dibersihkan
items.potions.exotic.potionofcleansing.desc=Reagen ampuh ini akan membuat peminumnya kebal terhadap semua efek status berbahaya selama beberapa giliran setelah diminum. Reagen ini juga dapat dilemparkan ke target untuk membersihkan mereka.
items.potions.exotic.potionofcleansing.name=ramuan pembersih
items.potions.exotic.potionofcorrosivegas.desc=Membuka atau memecahkan botol kaca bertekanan ini akan menyebabkan isinya meledak menjadi awan gas korosif berwarna karat yang mematikan. Gas ini menyebar lebih cepat daripada gas beracun dan lebih mematikan, tetapi juga tidak akan bertahan lama.
items.potions.exotic.potionofcorrosivegas.name=ramuan gas korosif
items.potions.exotic.potionofdivineinspiration.bonus=+2 Poin Bakat!
items.potions.exotic.potionofdivineinspiration.desc=Ramuan ini, yang merupakan kekuatan energi suci yang direduksi menjadi bentuk cair, akan memberikan kekuatan ilahi kepada peminumnya, serta dua poin bakat bonus dalam tingkatan pilihan mereka.\n\nRamuan ini hanya dapat digunakan sekali untuk setiap tingkatan bakat.
items.potions.exotic.potionofdivineinspiration.name=ramuan inspirasi ilahi
items.potions.exotic.potionofdivineinspiration.no_more_points=Anda tidak bisa mendapatkan poin bakat bonus lagi.
items.potions.exotic.potionofdivineinspiration.select_tier=Pilih tingkatan bakat untuk mendapatkan dua poin bonus. Anda harus telah membuka tingkatan tersebut agar dapat menggunakan poin tersebut.
items.potions.exotic.potionofdragonsbreath.desc=Labu ini berisi senyawa unik yang akan langsung terbakar setelah bercampur dengan air liur. Dengan cepat meludahkan cairan tersebut, pengguna dapat menyemburkan api dari mulut mereka!
items.potions.exotic.potionofdragonsbreath.name=ramuan napas naga
items.potions.exotic.potionofdragonsbreath.prompt=Pilih lokasi untuk membakar
items.potions.exotic.potionofearthenarmor.desc=Alih-alih melumpuhkan, cairan ini memiliki efek pengerasan pada kulit yang akan mengubahnya menjadi perisai alami sementara.
items.potions.exotic.potionofearthenarmor.name=ramuan baju besi tanah
items.potions.exotic.potionofmagicalsight.desc=Setelah meminumnya, indra Anda akan meningkat secara luar biasa untuk sementara waktu, memungkinkan Anda untuk melihat menembus dinding dalam radius 12 ubin!
items.potions.exotic.potionofmagicalsight.name=ramuan penglihatan magis
items.potions.exotic.potionofmastery.armor_easier=Baju zirahmu menjadi lebih mudah dikenakan!
items.potions.exotic.potionofmastery.desc=Alih-alih memberikan kekuatan mentah, ramuan ini justru akan menyelaraskan otot pengguna dengan item tertentu. Ini akan membuat item tersebut lebih mudah digunakan, seolah-olah peminumnya telah berlatih dengannya dan membangun memori otot. Senjata atau baju besi yang dipilih akan membutuhkan 2 kekuatan lebih sedikit untuk digunakan. Ramuan ini hanya dapat digunakan sekali pada setiap item.
items.potions.exotic.potionofmastery.name=ramuan penguasaan
items.potions.exotic.potionofmastery.prompt=Kuasai Suatu Item
items.potions.exotic.potionofmastery.weapon_easier=Senjata Anda menjadi lebih mudah digunakan!
items.potions.exotic.potionofshielding.desc=Alih-alih menyembuhkan, ramuan ini justru akan memproyeksikan perisai yang kuat di sekitar tubuh penggunanya, memblokir sejumlah besar kerusakan.
items.potions.exotic.potionofshielding.name=ramuan perisai
items.potions.exotic.potionofshroudingfog.desc=Saat terkena udara, cairan dalam labu ini akan menghasilkan kabut asap tebal yang cepat menyebar dan menghalangi pandangan musuh Anda.
items.potions.exotic.potionofshroudingfog.name=ramuan kabut yang menyelimuti
items.potions.exotic.potionofsnapfreeze.desc=Zat kimia yang terkandung dalam ramuan ini akan bereaksi cepat dengan udara, langsung membekukan dan membuat tak bergerak semua yang berada dalam jangkauannya.
items.potions.exotic.potionofsnapfreeze.name=ramuan pembeku cepat
items.potions.exotic.potionofstamina.desc=Meminum cairan yang rasanya agak manis ini akan memberi Anda dorongan energi yang tahan lama, memungkinkan Anda untuk berlari dengan kecepatan lebih tinggi dalam jangka waktu yang lama.
items.potions.exotic.potionofstamina.name=ramuan stamina
items.potions.exotic.potionofstormclouds.desc=Melempar ramuan ini akan menciptakan awan uap pekat yang menyebar dengan cepat, yang akan mengembun dan turun ke lingkungan sekitar. Sebagian besar medan akan berubah menjadi air, musuh yang berapi-api akan menerima kerusakan, api akan padam, dan jebakan akan kewalahan dan hancur.
items.potions.exotic.potionofstormclouds.name=ramuan awan badai
items.potions.potion$placeholder.name=obat
items.potions.potion$seedtopotion.name=Ramuan Acak
