items.weapon.weaponeffects.weaponeffect.spark.name=%s Rune
items.weapon.weaponeffects.weaponeffect.spark.desc=Tongkat ini bertuliskan _Rune_. Sihirnya punya peluang _20%_ untuk memicu _Percikan_, memberikan _4–8_ kerusakan sihir tambahan.
items.weapon.weaponeffects.weaponeffect.spark.activate=Percikan!

