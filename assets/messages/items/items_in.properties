items.weapon.melee.rapier.typical_ability_desc=Duelis dapat menerjang dengan rapier ke arah musuh yang berjarak 1 petak. Serangan ini bergerak menuju musuh, biasanya memberikan kerusakan sebesar _%1$d-%2$d_, dan dijamin mengenai sasaran.
items.weapon.melee.roundshield$guardtracker.desc=Sang Duelis telah menyiapkan perisainya untuk mengantisipasi serangan yang datang. Serangan fisik atau magis yang ditujukan padanya akan sepenuhnya dinetralisir.\n\nGiliran tersisa: %s.
items.weapon.melee.roundshield$guardtracker.guarded=dijaga
items.weapon.melee.roundshield$guardtracker.name=menjaga
items.weapon.melee.roundshield.ability_desc=Duelis dapat _melindungi_ dirinya sendiri dengan perisai bundar, sepenuhnya meniadakan semua serangan fisik atau magis yang ditujukan kepadanya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri perlindungan.
items.weapon.melee.roundshield.ability_name=penjaga
items.weapon.melee.roundshield.desc=Perisai besar ini efektif untuk menangkis serangan dan bisa menjadi senjata yang cukup ampuh dalam keadaan darurat.
items.weapon.melee.roundshield.name=perisai bundar
items.weapon.melee.roundshield.stats_desc=Senjata ini memblokir 0-%d kerusakan. Pemblokiran ini meningkat seiring dengan peningkatan.
items.weapon.melee.roundshield.typical_ability_desc=Duelis dapat _melindungi_ dirinya sendiri dengan perisai bundar, sepenuhnya meniadakan semua serangan fisik atau magis yang ditujukan kepadanya, biasanya selama _%d giliran_. Setelah Duelis memblokir serangan, menyerang balik atau menggunakan sihir akan mengakhiri perlindungan.
items.weapon.melee.roundshield.typical_stats_desc=Biasanya senjata ini memblokir 0-%d kerusakan. Pemblokiran ini meningkat seiring dengan peningkatan.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.runicblade.ability_desc=Duelis dapat melakukan _tebasan rune_ dengan pedang rune. Serangan ini dijamin mengenai sasaran dan memiliki _kekuatan sihir +%d%%._
items.weapon.melee.runicblade.ability_name=tebasan rune
items.weapon.melee.runicblade.desc=Senjata misterius dari negeri yang jauh, dengan bilah berwarna biru terang.
items.weapon.melee.runicblade.name=bilah rune
items.weapon.melee.runicblade.stats_desc=Senjata ini akan lebih efektif jika ditingkatkan.
items.weapon.melee.runicblade.typical_ability_desc=Duelis dapat melakukan tebasan rune dengan pedang rune. Serangan ini dijamin mengenai sasaran dan biasanya memiliki kekuatan sihir +%d%%.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Kemampuan Kekuatan
items.weapon.melee.sai$combostriketracker.desc=Duelis sedang membangun kombo yang dapat digunakan untuk meningkatkan kerusakan kemampuan serangan kombo. Setiap serangan jarak dekat atau senjata lempar biasa yang berhasil akan dihitung, tetapi tidak berhasil menyerang selama 5 giliran akan mereset kombo ini.\n\nSerangan terbaru: %1$d.\n\nGiliran hingga serangan hilang: %2$s.
items.weapon.melee.sai$combostriketracker.name=serangan kombo
items.weapon.melee.sai.ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sai. Serangan ini dijamin mengenai sasaran dan memberikan _+%d kerusakan_ setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.sai.ability_name=serangan kombo
items.weapon.melee.sai.desc=Dua bilah tipis yang dirancang untuk dipegang dengan satu tangan. Sangat cocok untuk menghabisi musuh dengan rentetan tebasan.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Ini adalah senjata yang sangat cepat.
items.weapon.melee.sai.typical_ability_desc=Duelis dapat melakukan _serangan kombo_ dengan sai. Serangan ini dijamin mengenai sasaran dan biasanya memberikan _+%d kerusakan_ setiap kali Duelis mengenai sasaran dengan serangan jarak dekat atau senjata lempar biasa. Tidak mengenai sasaran selama 5 giliran akan mereset kombo ini.
items.weapon.melee.scimitar$sworddance.desc=Duelis ini melakukan serangan berbasis momentum cepat dalam semacam tarian. Saat posisi ini aktif, dia menyerang 60%% lebih cepat (cukup untuk menyerang tepat dua kali dalam satu giliran dengan pedang lengkung) dan memiliki akurasi +50%%.\n\n Giliran tersisa: %s.
items.weapon.melee.scimitar$sworddance.name=tarian pedang
items.weapon.melee.scimitar.ability_desc=Duelis dapat melakukan _tarian pedang_ dengan pedang melengkung. Sikap ini tidak membutuhkan waktu untuk diaktifkan dan memberikan Duelis +60%% kecepatan serangan dan +50%% akurasi selama _%d giliran._
items.weapon.melee.scimitar.ability_name=tarian pedang
items.weapon.melee.scimitar.desc=Sebuah bilah tebal melengkung. Bentuknya memungkinkan serangan yang lebih cepat, namun kurang bertenaga.
items.weapon.melee.scimitar.name=pedang lengkung
items.weapon.melee.scimitar.stats_desc=Ini adalah senjata yang cukup cepat.
items.weapon.melee.scimitar.typical_ability_desc=Duelis dapat melakukan _tarian pedang_ dengan pedang melengkung. Sikap ini tidak membutuhkan waktu untuk diaktifkan dan memberikan Duelis +60%% kecepatan serangan dan +50%% akurasi biasanya selama _%d giliran._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Durasi Kemampuan
items.weapon.melee.shortsword.ability_desc=Duelis dapat menebas musuh dengan pedang pendek. Serangan ini memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.shortsword.ability_name=membelah
items.weapon.melee.shortsword.desc=Pedang yang cukup pendek, hanya beberapa inci lebih panjang dari belati.
items.weapon.melee.shortsword.name=pedang pendek
items.weapon.melee.shortsword.typical_ability_desc=Duelis dapat menebas musuh dengan pedang pendek. Serangan ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.sickle.ability_desc=Duelis dapat _memanen_ musuh dengan sabit. Serangan dahsyat ini dijamin mengenai sasaran dan memberikan _kerusakan %d_. Kerusakan ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.sickle.ability_name=memanen
items.weapon.melee.sickle.desc=Sebuah alat pertanian genggam yang juga bisa berfungsi sebagai senjata yang kuat namun sulit dikendalikan.
items.weapon.melee.sickle.name=sabit
items.weapon.melee.sickle.stats_desc=Ini adalah senjata yang agak tidak akurat.
items.weapon.melee.sickle.typical_ability_desc=Duelis dapat _memanen_ musuh dengan sabit. Serangan dahsyat ini dijamin mengenai sasaran dan biasanya memberikan _%d kerusakan_. Kerusakan ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.spear.ability_desc=Duelis dapat menggunakan ujung tombak untuk menusuk musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini memberikan kerusakan sebesar _%1$d-%2$d_, mendorong musuh mundur, dan dijamin mengenai sasaran.
items.weapon.melee.spear.ability_name=paku
items.weapon.melee.spear.desc=Sebuah tongkat kayu ramping yang ujungnya terbuat dari besi yang diasah.
items.weapon.melee.spear.name=tombak
items.weapon.melee.spear.stats_desc=Senjata ini agak lambat.\nSenjata ini memiliki jangkauan ekstra.
items.weapon.melee.spear.typical_ability_desc=Duelis dapat menggunakan ujung tombak untuk menusuk musuh yang berada dalam jangkauan tetapi tidak berdekatan. Ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_, mendorong musuh mundur, dan dijamin mengenai sasaran.
items.weapon.melee.sword$cleavetracker.desc=Duelis siap melanjutkan serangan tebasannya sebelumnya. Penggunaan tebasan berikutnya tidak akan menghabiskan muatan kemampuan senjata.\n\nGiliran tersisa: %s.
items.weapon.melee.sword$cleavetracker.name=membelah
items.weapon.melee.sword.ability_desc=Duelis dapat menebas musuh dengan pedang. Serangan ini memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.sword.ability_name=membelah
items.weapon.melee.sword.desc=Pedang yang seimbang dengan baik. Tidak terlalu besar, tetapi tetap lebih panjang daripada pedang pendek.
items.weapon.melee.sword.name=pedang
items.weapon.melee.sword.typical_ability_desc=Duelis dapat menebas musuh dengan pedang. Serangan ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.warhammer.ability_desc=Duelis dapat melakukan _pukulan berat_ dengan palu perang. Serangan terkonsentrasi ini memberikan _%1$d-%2$d kerusakan_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.warhammer.ability_name=pukulan berat
items.weapon.melee.warhammer.desc=Hanya sedikit makhluk yang mampu menahan hantaman dahsyat dari massa timah dan baja yang menjulang tinggi ini, tetapi dibutuhkan kekuatan besar untuk menggunakannya secara efektif.
items.weapon.melee.warhammer.name=palu perang
items.weapon.melee.warhammer.stats_desc=Ini adalah senjata yang cukup akurat.
items.weapon.melee.warhammer.typical_ability_desc=Duelis dapat melakukan _pukulan berat_ dengan palu perang. Serangan terkonsentrasi ini biasanya memberikan _%1$d-%2$d kerusakan_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.warscythe.ability_desc=Duelis dapat _memanen_ musuh dengan sabit perang. Serangan dahsyat ini dijamin mengenai sasaran dan memberikan _kerusakan %d_. Kerusakan ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.warscythe.ability_name=memanen
items.weapon.melee.warscythe.desc=Alat yang besar dan berat ini telah diperkuat agar lebih efektif dalam melukai musuh daripada tanaman.
items.weapon.melee.warscythe.name=sabit perang
items.weapon.melee.warscythe.stats_desc=Ini adalah senjata yang agak tidak akurat.
items.weapon.melee.warscythe.typical_ability_desc=Duelis dapat _memanen_ musuh dengan sabit perang. Serangan dahsyat ini dijamin mengenai sasaran dan biasanya memberikan _%d kerusakan_. Kerusakan ini diterapkan sebagai pendarahan jika target tidak kebal.
items.weapon.melee.whip.ability_desc=Sang Duelis dapat mencambuk semua musuh di sekitarnya dengan cambuk. Kemampuan ini memberikan kerusakan sebesar _%1$d-%2$d_, menyerang semua musuh dalam jangkauan serangan, dan dijamin mengenai sasaran.
items.weapon.melee.whip.ability_name=bulu mata
items.weapon.melee.whip.desc=Meskipun tali berduri di ujung senjata ini memberikan kerusakan yang kecil, jangkauannya tidak tertandingi.
items.weapon.melee.whip.name=cambuk
items.weapon.melee.whip.stats_desc=Senjata ini memiliki jangkauan yang luar biasa.
items.weapon.melee.whip.typical_ability_desc=Sang Duelis dapat mencambuk semua musuh di sekitarnya dengan cambuk. Kemampuan ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_, menyerang semua musuh dalam jangkauan serangan, dan dijamin mengenai sasaran.
items.weapon.melee.wornshortsword.ability_desc=Duelis dapat menebas musuh dengan pedang pendek usang. Serangan ini memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.melee.wornshortsword.ability_name=membelah
items.weapon.melee.wornshortsword.desc=Pedang yang cukup pendek, aus karena sering digunakan. Pedang ini lebih lemah dan sedikit lebih ringan daripada pedang pendek dalam kondisi yang lebih baik.
items.weapon.melee.wornshortsword.discover_hint=Salah satu pahlawan memulai permainan dengan item ini.
items.weapon.melee.wornshortsword.name=pedang pendek usang
items.weapon.melee.wornshortsword.typical_ability_desc=Duelis dapat menebas musuh dengan pedang pendek usang. Serangan ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_ dan dijamin mengenai sasaran. Jika tebasan membunuh musuh, efeknya instan dan Duelis dapat menggunakan tebasan lagi dalam 5 giliran secara gratis.
items.weapon.missiles.bolas.desc=Senjata jarak jauh yang tidak biasa ini tidak terlalu merusak, tetapi sangat efektif dalam memperlambat targetnya.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Senjata ini menyebabkan kelumpuhan pada targetnya.
items.weapon.missiles.boomerang.desc=Saat dilemparkan ke arah musuh, rudal kayu pipih melengkung ini akan kembali ke tangan pelemparnya.
items.weapon.missiles.boomerang.durability=Karena konstruksinya yang kokoh, bumerang ini tidak akan mudah rusak saat digunakan.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbahan dasar swiftthistle yang akan meningkatkan kecepatan gerak dan serangan sekutu, atau menurunkan kecepatan gerak musuh untuk sementara waktu. Anak panah itu sendiri tetap berbahaya bagi musuh, tetapi tidak akan membahayakan sekutu.
items.weapon.missiles.darts.adrenalinedart.name=suntikan adrenalin
items.weapon.missiles.darts.blindingdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbahan dasar rumput buta yang akan membutakan targetnya untuk waktu singkat. Namun, anak panah ini tidak menyebabkan disorientasi, sehingga musuh masih akan tahu di mana terakhir kali mereka melihat Anda.
items.weapon.missiles.darts.blindingdart.name=anak panah yang menyilaukan
items.weapon.missiles.darts.chillingdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbasis lapisan es yang akan mendinginkan targetnya secara signifikan.
items.weapon.missiles.darts.chillingdart.name=anak panah dingin
items.weapon.missiles.darts.cleansingdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbasis mageroyal yang akan membuat sekutu kebal sementara terhadap semua efek negatif, atau akan membersihkan efek positif dari musuh. Musuh bahkan mungkin sejenak lupa bahwa mereka sedang menyerang atau melarikan diri dari Anda. Anak panah itu sendiri masih berbahaya bagi musuh, tetapi tidak akan membahayakan sekutu.
items.weapon.missiles.darts.cleansingdart.name=anak panah pembersih
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.desc=Batang kayu sederhana berujung runcing ini diberi pemberat agar terbang lurus dan menyengat mangsanya hanya dengan jentikan pergelangan tangan. Ujungnya dapat diisi dengan biji-bijian untuk mendapatkan efek tambahan saat dilempar.
items.weapon.missiles.darts.dart.name=anak panah
items.weapon.missiles.darts.dart.prompt=Pilih benih
items.weapon.missiles.darts.dart.tip_all=ujung anak panah %1$d dengan biji %2$d
items.weapon.missiles.darts.dart.tip_cancel=membatalkan
items.weapon.missiles.darts.dart.tip_desc=Sebuah biji dapat dikombinasikan dengan satu atau dua anak panah untuk melengkapinya. Setiap jenis biji menghasilkan jenis anak panah yang dilengkapi ujung berbeda, dengan efek sekali pakai yang unik. Melengkapi anak panah dengan biji-biji ini akan menghasilkan _%s._
items.weapon.missiles.darts.dart.tip_one=ujung 1 anak panah dengan 1 biji
items.weapon.missiles.darts.dart.tip_title=Anak Panah Ujung
items.weapon.missiles.darts.dart.tip_two=ujung 2 anak panah dengan 1 biji
items.weapon.missiles.darts.dart.unlimited_uses=Karena konstruksinya yang sederhana, anak panah akan awet selamanya.
items.weapon.missiles.darts.displacingdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbasis daun fadeleaf yang akan memindahkan targetnya dalam jarak pendek.
items.weapon.missiles.darts.displacingdart.name=anak panah yang menggeser
items.weapon.missiles.darts.healingdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbahan dasar rumput matahari yang memberikan penyembuhan instan kepada targetnya. Anak panah itu sendiri tetap berbahaya bagi musuh, tetapi tidak akan membahayakan sekutu.
items.weapon.missiles.darts.healingdart.name=anak panah penyembuhan
items.weapon.missiles.darts.holydart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbasis bunga bintang yang menyalurkan energi suci ke targetnya. Sekutu dan musuh biasa akan diberkati, tetapi musuh undead atau iblis akan menerima kerusakan berat. Anak panah itu sendiri masih berbahaya bagi musuh, tetapi tidak akan melukai sekutu.
items.weapon.missiles.darts.holydart.name=panah suci
items.weapon.missiles.darts.incendiarydart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbasis firebloom yang akan meledak menjadi nyala api yang terang saat mengenai sasaran.
items.weapon.missiles.darts.incendiarydart.name=anak panah pembakar
items.weapon.missiles.darts.paralyticdart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbahan dasar akar tanah yang akan melumpuhkan targetnya untuk waktu singkat.
items.weapon.missiles.darts.paralyticdart.name=anak panah pelumpuh
items.weapon.missiles.darts.poisondart.desc=Anak panah ini memiliki ujung yang dilapisi senyawa berbahan dasar lumut duka yang akan meracuni targetnya.
items.weapon.missiles.darts.poisondart.name=anak panah beracun
items.weapon.missiles.darts.rotdart.desc=Anak panah jahat ini memiliki ujung yang dilapisi senyawa asam berbasis rotberry, yang akan secara agresif mengikis apa pun yang bersentuhan dengan anak panah tersebut. Musuh yang kuat akan menahan sebagian besar efeknya, tetapi korosi yang ditimbulkan cukup kuat untuk dengan mudah membunuh sebagian besar musuh standar. Anak panah ini bertahan lebih lama daripada anak panah berujung lainnya, tetapi daya tahannya tidak dapat ditingkatkan.
items.weapon.missiles.darts.rotdart.discover_hint=Anda dapat membuat item ini menggunakan benih dari misi tertentu.
items.weapon.missiles.darts.rotdart.name=anak panah busuk
items.weapon.missiles.darts.shockingdart.desc=Anak panah ini memiliki ujung yang dilapisi dengan senyawa berbahan dasar stormvine yang akan memberikan kejutan yang menyakitkan pada targetnya.
items.weapon.missiles.darts.shockingdart.name=anak panah yang mengejutkan
items.weapon.missiles.darts.tippeddart.about_to_break=Ujung anak panah Anda akan segera habis masa pakainya.
items.weapon.missiles.darts.tippeddart.ac_clean=MEMBERSIHKAN
items.weapon.missiles.darts.tippeddart.cancel=membatalkan
items.weapon.missiles.darts.tippeddart.clean_all=bersihkan semuanya
items.weapon.missiles.darts.tippeddart.clean_desc=Tindakan ini akan menghilangkan ujung biji pada anak panah Anda, mengembalikannya menjadi anak panah biasa.
items.weapon.missiles.darts.tippeddart.clean_one=bersih satu
items.weapon.missiles.darts.tippeddart.clean_title=Anak Panah Bersih
items.weapon.missiles.darts.tippeddart.discover_hint=Anda dapat membeli barang ini di toko, atau membuatnya menggunakan benih.
