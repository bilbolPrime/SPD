items.artifacts.cloakofshadows.desc=Jubah ajaib yang tak ternilai harganya, dicuri dari gudang senjata kerajaan bertahun-tahun yang lalu oleh Sang Pencuri. Saat dikenakan, jubah ini dapat digunakan untuk menjadi benar-benar tak terlihat untuk waktu singkat. Semakin sering jubah ini digunakan, semakin kuat jubah ini, memungkinkan Sang Pencuri untuk menjadi tak terlihat lebih sering dan untuk durasi yang lebih lama.
