items.rings.ringofmight.upgrade_stat_name_2=Peningkatan HP Maksimum
items.rings.ringofsharpshooting.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan level senjata lempar yang efektif sebesar _%1$d_ dan meningkatkan daya tahannya sebesar _%2$s%%_ secara total.
items.rings.ringofsharpshooting.desc=Cincin ini meningkatkan ketepatan dan bidikan pemakainya, yang akan membuat semua senjata proyektil lebih merusak dan tahan lama. Cincin terkutuk akan memiliki efek sebaliknya.
items.rings.ringofsharpshooting.name=lingkaran penembak jitu
items.rings.ringofsharpshooting.stats=Saat dikenakan, cincin ini akan meningkatkan kerusakan senjata lempar Anda seolah-olah levelnya ditingkatkan sebesar _%1$d_, dan akan meningkatkan daya tahannya sebesar _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Saat dikenakan, cincin ini biasanya akan meningkatkan kerusakan senjata lempar Anda seolah-olah levelnya ditingkatkan sebesar _%1$d_ dan akan meningkatkan daya tahannya sebesar _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Peningkatan Kerusakan Level
items.rings.ringofsharpshooting.upgrade_stat_name_2=Peningkatan Daya Tahan
items.rings.ringoftenacity.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, mengurangi kerusakan yang Anda terima hingga total _%s%%_.
items.rings.ringoftenacity.desc=Saat dikenakan, cincin ini akan memungkinkan pemakainya untuk menahan serangan yang biasanya mematikan. Semakin parah luka yang diderita penggunanya, semakin tahan mereka terhadap kerusakan. Sebaliknya, cincin terkutuk akan mempermudah musuh untuk mengeksekusi pemakainya.
items.rings.ringoftenacity.name=cincin ketekunan
items.rings.ringoftenacity.stats=Saat dikenakan, cincin ini akan mengurangi kerusakan yang Anda alami hingga _%s%%._
items.rings.ringoftenacity.typical_stats=Saat dikenakan, cincin ini biasanya akan mengurangi kerusakan yang Anda alami hingga _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Ketahanan Kerusakan Maksimum
items.rings.ringofwealth.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan keberuntungan Anda sebesar _%s%%_ secara total.
items.rings.ringofwealth.desc=Cincin ini bertindak seperti magnet untuk harta karun, meningkatkan kemungkinan musuh dan peti harta karun membawa barang-barang berharga. Sebaliknya, cincin terkutuk akan mengurangi peluang Anda untuk menerima jarahan.
items.rings.ringofwealth.name=lingkaran kekayaan
