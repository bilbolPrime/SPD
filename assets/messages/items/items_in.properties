items.artifacts.holytome.desc=Sebuah kitab suci yang berfungsi sebagai fokus sihir ilahi Pendeta. Dengan menggunakan kitab ini, Pendeta dapat merapal berbagai mantra sihir. Kitab ini akan terus menjadi lebih kuat seiring penggunaan oleh Pendeta, memberikan Pendeta lebih banyak muatan maksimum dan sedikit meningkatkan kecepatan pengisian ulang.
