items.rings.ringofelements.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, memberikan total resistensi elemen sebesar _%s%%_.
items.rings.ringofelements.desc=Cincin ini memberi ketahanan terhadap api, listrik, gas, dan unsur lainnya. Durasi efek buruk juga berkurang.
items.rings.ringofelements.name=cincin elemen
