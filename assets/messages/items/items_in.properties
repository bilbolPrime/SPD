items.scrolls.exotic.exoticscroll.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.scrolls.exotic.exoticscroll.gyfu=gulungan eksotis GYFU
items.scrolls.exotic.exoticscroll.isaz=gulungan eksotis ISAZ
items.scrolls.exotic.exoticscroll.kaunan=gulungan eksotis KAUNAN
