items.weapon.curses.explosive.desc=Senjata peledak secara bertahap mengumpulkan daya dan meledak, merusak apa pun yang ada di dekatnya.
items.weapon.curses.explosive.desc_cool=Senjata Anda saat ini terasa dingin saat disentuh.
items.weapon.curses.explosive.desc_hot=Senjatamu panas! Akan meledak!
items.weapon.curses.explosive.desc_warm=Senjatamu sedang mengumpulkan energi dan mulai memanas...
items.weapon.curses.explosive.elestrike_desc=Serangan elemen dengan kutukan eksplosif memiliki peluang 50% untuk menyebabkan ledakan muncul pada musuh acak dalam jangkauan.
items.weapon.curses.explosive.hot=Panas!
