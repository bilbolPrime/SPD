items.artifacts.lloydsbeacon.creatures=Aura psikis makhluk di sekitarnya tidak memungkinkan Anda untuk menggunakan suar Lloyd saat ini.
items.artifacts.lloydsbeacon.desc=Mercusuar Lloyd adalah perangkat magis rumit yang memberi penggunanya kendali atas sihir teleportasi. Mercusuar ini dapat digunakan untuk kembali ke lokasi yang telah ditentukan, tetapi juga dapat memancarkan semburan sihir teleportasi acak setelah terisi daya saat dipasang. Sihir ini dapat diarahkan ke target atau ke pengguna itu sendiri.
items.artifacts.lloydsbeacon.desc_set=Suar ini ditempatkan di suatu tempat di level %d di Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Suar Anda semakin kuat!
items.artifacts.lloydsbeacon.name=Mercusuar Lloyd
items.artifacts.lloydsbeacon.no_charge=Sinyal Anda saat ini tidak memiliki energi yang cukup.
items.artifacts.lloydsbeacon.preventing=Aura sihir yang kuat di tempat ini mencegahmu menggunakan suar Lloyd!
