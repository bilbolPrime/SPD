items.rings.ringofmight.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan kekuatan Anda sebesar _%1$d_ dan HP maksimal sebesar _%2$s%%_ secara total.
items.rings.ringofmight.desc=Cincin ini meningkatkan kemampuan fisik pemakainya, memberikan kekuatan dan daya tahan fisik yang lebih besar. Cincin terkutuk akan melemahkan pemakainya.
items.rings.ringofmight.name=cincin kekuatan
items.rings.ringofmight.stats=Saat dikenakan, cincin ini akan meningkatkan kekuatanmu sebesar _%1$d_ dan HP maksimalmu sebesar _%2$s%%._
items.rings.ringofmight.typical_stats=Saat dikenakan, cincin ini biasanya akan meningkatkan kekuatanmu sebesar _%1$d_ dan HP maksimalmu sebesar _%2$s%%._
