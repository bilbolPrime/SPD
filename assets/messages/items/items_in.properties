items.wands.wandofwarding.bmage_desc=Ketika _Sang Penyihir Perang_ menyerang musuh dengan tongkat perlindungan, semua perlindungan dan penjaga yang aktif memiliki peluang untuk disembuhkan.
items.wands.wandofwarding.desc=Tongkat logam pendek ini memiliki permata ungu terang yang melayang di atas ujungnya.
items.wands.wandofwarding.eleblast_desc=Ledakan elemen dengan tongkat perlindungan menyembuhkan semua perlindungan dan penjaga di area ledakan.
items.wands.wandofwarding.name=tongkat perlindungan
items.wands.wandofwarding.no_more_wards=Tongkat sihirmu tidak dapat lagi menahan perlindungan apa pun.
items.wands.wandofwarding.staff_name=staf bangsal
items.wands.wandofwarding.stats_desc=Alih-alih langsung melukai musuh, tongkat sihir ini akan memanggil perisai dan penjaga stasioner. Perisai dapat dipanggil di mana saja, bahkan menembus dinding jika Anda memiliki penglihatan. Tongkat sihir ini dapat mempertahankan energi sebesar _%d_ untuk memanggil perisai sekaligus.
