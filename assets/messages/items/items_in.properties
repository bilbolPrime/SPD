items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Maaf... semoga beruntung...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Selesaikan... tanpa aku...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Tidak... aku tidak bisa...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Semoga beruntung...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Lelah... untuk saat ini...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Aku akan kembali...
items.artifacts.driedrose$ghosthero.desc=Sosok halus yang tampak rapuh dengan bentuk humanoid. Kekuatan mereka tampaknya terkait dengan mawar yang kau miliki.\n\nHantu ini mungkin tidak seberapa, tetapi mereka tampaknya satu-satunya teman sejatimu di sini.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Mengapa ini terjadi? Bukankah kita sudah berhasil?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Bagaimana mungkin hal itu masih bisa memengaruhi dunia ini?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Kuharap kau tahu apa yang kau lakukan dengan jimat itu.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Kurasa kita belum selesai.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Kita sudah sampai sejauh ini, kita pasti bisa menyelesaikannya!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Sedikit lagi, kita bisa keluar dari sini!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Tidak ada manusia atau kurcaci yang pernah berada di sini dalam waktu yang sangat lama.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Apa yang menyebabkan para kurcaci meninggalkan tambang emas?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Sayang sekali semua emas di sini tidak berguna di permukaan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Makhluk-makhluk di sini mengerikan, persis seperti di selokan.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Bahkan kelelawar pun haus darah di sini.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Tidak ada tanda-tanda peralatan pertambangan, apakah para kurcaci telah merebut kembali semuanya?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Para kurcaci itu rajin, tetapi serakah.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Jadi, kota metropolitan para kurcaci benar-benar telah jatuh.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Saya harap permukaan bumi tidak akan pernah berakhir seperti tempat ini.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Kurcaci seharusnya tidak terlihat sepucat itu.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Aku tidak tahu mana yang lebih buruk, para kurcaci, atau ciptaan mereka.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Sepertinya para kurcaci sekarang juga menjadi monster tanpa akal sehat.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Tempat apakah ini?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Tempat ini menakutkan...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Apa yang dipikirkan para kurcaci, mempermainkan kekuasaan seperti ini?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monster-monster di sini berasal dari dunia lain, dari mana mereka datang?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Bisakah kamu merasakannya? Rasanya seperti ada sesuatu yang mengawasi kita.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Untung ada obor, di sini gelap sekali!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Aku pernah mendengar cerita tentang tempat ini, dan tidak ada yang baik.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Tempat ini selalu lebih mirip penjara bawah tanah daripada penjara biasa.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Aku tak bisa membayangkan apa yang terjadi ketika tempat ini ditinggalkan.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Tampaknya baik para tahanan maupun penjaga telah berubah menjadi monster.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Apa yang mungkin menjadi penyebab semua kerangka ini?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Orang-orang ini seharusnya tidak berakhir seperti ini...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Saluran pembuangan ini dulunya aman, orang bahkan tinggal di sini pada musim dingin.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Aku penasaran apa yang terjadi dengan patroli penjaga, apakah mereka menyerah?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Saya punya keluarga di permukaan, saya harap mereka aman.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Para penjaga tidak bisa mengalahkan monster-monster ini, tapi mungkin kita bisa.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Jika bahkan saluran pembuangan pun seberbahaya ini, aku jadi penasaran apa yang ada di bawahnya...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Apa yang menyebabkan tikus dan kepiting ini tumbuh begitu besar?
items.artifacts.driedrose$ghosthero.direct_prompt=Apa yang harus saya lakukan?
items.artifacts.driedrose$ghosthero.directed_attack_1=Oke, saya akan coba yang itu.
items.artifacts.driedrose$ghosthero.directed_attack_2=Saya akan ambil yang itu.
items.artifacts.driedrose$ghosthero.directed_attack_3=Menarik...
items.artifacts.driedrose$ghosthero.directed_attack_4=Ayo kita tangkap mereka!
items.artifacts.driedrose$ghosthero.directed_attack_5=Saya punya yang itu.
items.artifacts.driedrose$ghosthero.directed_follow_1=Oke, aku akan mengikutimu.
items.artifacts.driedrose$ghosthero.directed_follow_2=Aku akan mengikutimu dari belakang.
items.artifacts.driedrose$ghosthero.directed_follow_3=Mengikutimu...
items.artifacts.driedrose$ghosthero.directed_follow_4=Oke, ayo kita mulai!
items.artifacts.driedrose$ghosthero.directed_follow_5=Aku akan selalu mendukungmu.
items.artifacts.driedrose$ghosthero.directed_position_1=Baik, saya akan mempertahankan posisi itu.
items.artifacts.driedrose$ghosthero.directed_position_2=Aku akan pergi ke sana dan membela.
items.artifacts.driedrose$ghosthero.directed_position_3=Memposisikan ulang...
items.artifacts.driedrose$ghosthero.directed_position_4=Aku sedang dalam perjalanan!
items.artifacts.driedrose$ghosthero.directed_position_5=Aku akan pergi ke sana.
items.artifacts.driedrose$ghosthero.discover_hint=Anda dapat menemukan karakter ini dengan artefak tertentu.
items.artifacts.driedrose$ghosthero.hello=Halo lagi %s.
items.artifacts.driedrose$ghosthero.introduce=Jiwaku terikat pada mawar ini, mawar ini sangat berharga bagiku, hadiah dari kekasihku yang kutinggalkan di permukaan. Aku tidak bisa kembali kepadanya, tetapi berkatmu aku mendapat kesempatan kedua untuk menyelesaikan perjalananku. Ketika aku mampu, aku akan menjawab panggilanmu dan bertarung bersamamu. Selama kau memiliki mawar ini, aku bisa mendengar suaramu, jadi kau bisa menggunakannya untuk membimbingku dari jauh. Semoga kau berhasil di tempat aku gagal...
items.artifacts.driedrose$ghosthero.name=hantu sedih
items.artifacts.driedrose$ghosthero.player_killed_1=TIDAK!...
items.artifacts.driedrose$ghosthero.player_killed_2=Aku tidak bisa membantu mereka...
items.artifacts.driedrose$ghosthero.player_killed_3=Bukan seperti ini...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Hanya kurcaci yang akan membangun mesin penambangan yang membunuh penyusup.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Benda itu sangat besar...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Bagaimana benda ini bisa tetap aktif begitu lama?
items.artifacts.driedrose$ghosthero.seen_goo_1=Waspadalah terhadap Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Banyak temanku yang meninggal karena hal ini, saatnya balas dendam!
items.artifacts.driedrose$ghosthero.seen_goo_3=Kekejian seperti itu tidak boleh dibiarkan hidup!
items.artifacts.driedrose$ghosthero.seen_king_1=Ketika orang mengatakan kekuasaan itu korup, inilah yang mereka maksud.
items.artifacts.driedrose$ghosthero.seen_king_2=Dia lebih mirip lich daripada raja sekarang.
items.artifacts.driedrose$ghosthero.seen_king_3=Bahkan dalam kematian pun para kurcaci tetap patuh kepada tuan mereka.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Satu-satunya tahanan yang tersisa adalah seorang pembunuh bayaran yang mematikan. Tentu saja...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Dia telah menjebak kita!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Aku pernah mendengar cerita-cerita mengerikan tentang topeng itu...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, ini tidak terlihat bagus.
items.artifacts.driedrose$ghosthero.seen_yog_2=Jadi, seperti inilah rupa seorang dewa?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ini akan menyakitkan...
items.artifacts.driedrose$petal.desc=Kelopak bunga yang rapuh dan kering, yang entah bagaimana berhasil bertahan hingga sejauh ini di dalam ruang bawah tanah.
