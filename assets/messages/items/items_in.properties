items.amulet.ac_end=AKHIRI PERMAINAN
items.amulet.ascent_desc=Anda mulai merasakan kekuatan Yog-Dzewa yang hebat dan mengerikan memancar dari jimat tersebut. Mendaki kembali melalui ruang bawah tanah sebagai manusia biasa mungkin lebih sulit dari yang Anda kira! Jika Anda terus mendaki dengan jimat tersebut, ruang bawah tanah akan menjadi lebih berbahaya, teleportasi antar lantai akan dinonaktifkan, dan Anda hanya dapat memenangkan permainan dengan mengalahkan musuh saat mendaki melalui ruang bawah tanah! Anda dapat meninggalkan jimat di sini untuk sementara waktu jika Anda ingin mendaki tanpa memulai tantangan ini, atau mengaktifkan jimat sebelum mendaki untuk mengakhiri permainan secara normal.
items.amulet.ascent_no=Berhenti sejenak
items.amulet.ascent_title=Kenaikan
items.amulet.ascent_yes=Melanjutkan!
items.amulet.desc=Jimat Yendor adalah artefak paling ampuh yang dikenal oleh manusia atau kaum kurcaci. Kristal-kristalnya yang berkilauan mengandung kekuatan luar biasa dan menakjubkan.
items.amulet.desc_ascent=Asal usul jimat ini tidak diketahui, tetapi jelas jimat ini sangat dipengaruhi oleh kekuatan Yog-Dzewa. Ruang bawah tanah tampaknya tunduk pada kehendak Yog saat Anda melewatinya, membuat musuh jauh lebih banyak dan lebih kuat! Anda juga tidak lagi dapat mengaktifkan atau membuang jimat tersebut, seolah-olah jimat itu terkutuk.
items.amulet.desc_origins=Asal usul jimat itu tidak diketahui. Sejarah mengatakan bahwa Raja Kurcaci membual bahwa dia telah menemukan artefak itu tak lama sebelum peradaban Kurcaci memutuskan semua kontak. Bagaimana dia menemukannya? Bagaimana Yog-Dzewa mengambilnya darinya? Pertanyaan untuk lain waktu mungkin, yang terpenting sekarang adalah jimat itu milikmu!
items.amulet.discover_hint=Anda dapat menemukan item ini di dasar ruang bawah tanah...
items.amulet.name=jimat yendor
items.ankh.ac_bless=memberkati
items.ankh.bless=Anda memberkati ankh dengan air ajaib.
items.ankh.desc=Lambang keabadian kuno ini memungkinkanmu hidup kembali setelah mati. Saat bangkit, semua barang yang tidak sedang dikenakan akan hilang.
items.ankh.desc_blessed=Simbol keabadian kuno ini memberikan kemampuan untuk kembali hidup setelah kematian. Ankh telah diberkati dan sekarang jauh lebih kuat. Ankh akan mengorbankan dirinya untuk menyelamatkan Anda di saat bahaya maut.
items.ankh.discover_hint=Anda bisa membeli barang ini di toko.
items.ankh.name=ankh
items.arcaneresin.ac_apply=MENERAPKAN
items.arcaneresin.apply=Kamu melapisi tongkat sihirmu dengan resin, sehingga meningkatkan kekuatannya!
items.arcaneresin.desc=Bubuk halus ini berkilauan di antara nuansa ungu dan putih. Bubuk ini dapat berfungsi sebagai penguat energi magis, meningkatkan level tongkat sihir ketika diaplikasikan padanya! Meningkatkan level tongkat sihir membutuhkan 1, 2, atau 3 resin tergantung pada level awal tongkat sihir. Resin dapat meningkatkan level tongkat sihir hingga maksimum +3. Peningkatan resin _ditimpa oleh sumber peningkatan lain_ (seperti gulungan peningkatan), dan tidak berlaku saat memasukkan tongkat sihir ke dalam tongkat penyihir.
items.arcaneresin.discover_hint=Anda dapat membuat item ini melalui alkimia.
items.arcaneresin.level_too_high=Tongkat sihir itu terlalu kuat untuk bisa diperbaiki dengan resin.
items.arcaneresin.name=resin misterius
items.arcaneresin.not_enough=Kamu tidak punya cukup resin untuk itu!
items.arcaneresin.prompt=Pilih tongkat sihir
items.armor.armor$glyph.discover_hint=Anda dapat menemukan item dengan efek ini secara acak di dalam ruang bawah tanah, atau mencoba menerapkannya sendiri pada sebuah item.
