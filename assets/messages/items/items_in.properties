items.weapon.weaponeffects.weaponeffect.curse.desc=Tongkat ini _Pengutuk_. Sihirnya punya peluang _20%_ untuk melemahkan target, mengurangi kerusakan yang ditimbulkannya sebesar _5%_ selama _10 giliran_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Kutukan!

