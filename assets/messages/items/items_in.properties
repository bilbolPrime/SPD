items.rings.ringofforce$brawlersstance.desc=Saat dalam posisi ini, serangan reguler Duelist akan menggunakan cincin kekuatan yang terpasang bahkan saat dia sedang menggunakan senjata. Serangan ini mendapatkan bonus kerusakan dan tetap akan menggunakan peningkatan dan penguatan senjata. Namun, mempertahankan posisi ini membutuhkan fokus, mengurangi kecepatan pengisian ulang kemampuan senjata sebesar 50%. Posisi ini dapat diaktifkan atau dinonaktifkan dengan menggunakan cincin kekuatan, tetapi pengurangan kecepatan pengisian akan tetap ada untuk sementara waktu jika posisi diaktifkan dan dinonaktifkan dengan cepat.
items.rings.ringofforce$brawlersstance.name=posisi petarung
items.rings.ringofforce.ability_desc=Duelis dapat mengadopsi _sikap petarung_ dengan cincin ini, menyebabkan serangan regulernya selalu menggunakan cincin ini bahkan dengan senjata yang terpasang. Serangan ini akan memberikan _kerusakan %1$d-%2$d_ dan juga akan mewarisi pesona dan peningkatan senjata. Sikap ini memperlambat kecepatan pengisian ulang senjata sebesar 50%%.
items.rings.ringofforce.ability_name=posisi petarung
items.rings.ringofforce.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, memberikan total kerusakan sebesar _%1$d-%2$d_ tanpa senjata, atau meningkatkan kerusakan sebesar _%3$d_ dengan senjata.
items.rings.ringofforce.desc=Cincin ini meningkatkan kekuatan serangan jarak dekat pemakainya. Kekuatan tambahan ini cukup lemah saat menggunakan senjata, tetapi serangan tanpa senjata akan menjadi jauh lebih kuat. Sebaliknya, cincin terkutuk akan melemahkan serangan pemakainya.
items.rings.ringofforce.name=cincin kekuatan
items.rings.ringofforce.stats=Saat tidak bersenjata, dengan kekuatan Anda saat ini, cincin ini akan memberikan kerusakan sebesar _%1$d-%2$d._ Dengan senjata terpasang, cincin ini akan meningkatkan kerusakan sebesar _%3$d._
items.rings.ringofforce.typical_ability_desc=Duelist dapat mengadopsi _sikap petarung_ dengan cincin ini, menyebabkan serangan regulernya selalu menggunakan cincin ini bahkan dengan senjata yang terpasang. Serangan ini biasanya akan memberikan _kerusakan %1$d-%2$d_ dan juga akan mewarisi pesona dan peningkatan senjata. Sikap ini memperlambat kecepatan pengisian ulang senjata sebesar 50%%.
items.rings.ringofforce.typical_stats=Saat tidak bersenjata, dengan kekuatan Anda saat ini, biasanya cincin ini akan memberikan kerusakan sebesar _%1$d-%2$d._ Dengan senjata terpasang, biasanya cincin ini akan meningkatkan kerusakan sebesar _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Kerusakan Tanpa Senjata
items.rings.ringofforce.upgrade_stat_name_2=Peningkatan Kerusakan Senjata
items.rings.ringofforce.upgrade_stat_name_3=Kerusakan Kemampuan
items.rings.ringoffuror.combined_stats=Cincin yang Anda kenakan menggabungkan kekuatannya, meningkatkan kecepatan serangan Anda sebesar _%s%%_ secara total.
items.rings.ringoffuror.desc=Cincin ini memberikan pemakainya amarah batin, memungkinkan mereka untuk menyerang lebih cepat. Sebaliknya, cincin terkutuk akan memperlambat kecepatan serangan pemakainya.
items.rings.ringoffuror.name=cincin kemarahan
