items.artifacts.etherealchains.cant_reach=Rantaimu tidak bisa mencapai sana.
items.artifacts.etherealchains.cursed=Kamu tidak bisa menggunakan rantai terkutuk.
items.artifacts.etherealchains.desc=Rantai-rantai besar namun ringan ini memancarkan energi spiritual. Rantai ini dapat digunakan untuk menarik Anda ke arah suatu medan, atau menarik musuh ke arah Anda. Sifat eterik rantai ini bahkan memungkinkan mereka menembus dinding!
items.artifacts.etherealchains.desc_cursed=Rantai terkutuk itu terkunci di sisi tubuhmu, terus berayun-ayun, mencoba membuatmu tersandung atau mengikatmu.
items.artifacts.etherealchains.desc_equipped=Rantai-rantai itu melingkari sisi tubuhmu, perlahan-lahan menyedot energi spiritual dari mereka yang kau kalahkan. Setiap muatan adalah mata rantai, yang akan memanjang tepat satu petak.
