items.weapon.melee.cudgel.typical_ability_desc=Duelis dapat melakukan pukulan berat dengan gada. Serangan terkonsentrasi ini biasanya memberikan kerusakan sebesar _%1$d-%2$d_ jika mengejutkan musuh, dan membuat mereka linglung selama 5 giliran yang mengurangi akurasi dan penghindaran sebesar 50%%. Pukulan berat selalu mengenai sasaran tetapi memberikan kerusakan biasa jika tidak mengejutkan musuh.
items.weapon.melee.dagger.ability_desc=Duelis dapat menyelinap sambil memegang belati. Kemampuan ini memungkinkan Duelis untuk langsung berteleportasi hingga 5 petak dan memberinya _%d giliran tembus pandang._
items.weapon.melee.dagger.ability_name=menyelinap
