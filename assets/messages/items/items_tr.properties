items.artifacts.masterthievesarmband.desc=Bu mor kadife kol bandı, usta bir hırsızın izini taşıyor. Bu size ait değil, ama muhtemelen önceki sahibine de ait değildi.
items.artifacts.masterthievesarmband.desc_cursed=Lanetli bileklik bileğinize bağlı ve nedense altın keseniz yavaş yavaş hafifliyor...
items.artifacts.masterthievesarmband.desc_worn=Tecrübe kazandıkça bileğinizdeki bileklikte bir güç biriktiğini hissedersiniz. Bu gücü dükkanlardan hırsızlık yapmak veya düşmanları soymak için kullanabilirsiniz! Düşmanları soymak anında gerçekleşir, onları kısa süreliğine sersemletir ve sahip oldukları ganimetleri alma şansı verir! Bu güç, habersiz düşmanlara karşı daha etkilidir. Aynı düşmanı birden fazla kez soymak daha fazla ganimet alma şansı vermez.
items.artifacts.masterthievesarmband.failed_steal=Hiçbir şey çalmayı başaramadınız.
items.artifacts.masterthievesarmband.full=Bilekliğiniz tamamen şarj oldu!
items.artifacts.masterthievesarmband.level_up=Bileklikleriniz daha da güçleniyor!
items.artifacts.masterthievesarmband.name=usta hırsızların kol bandı
items.artifacts.masterthievesarmband.no_charge=Bilekliğinizin şarjı yeterli değil.
