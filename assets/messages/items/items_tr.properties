items.weapon.melee.spear.name=mızrak
items.weapon.melee.spear.stats_desc=Bu oldukça yavaş bir silah.\nBu silahın menzili daha uzun.
items.weapon.melee.spear.typical_ability_desc=Düellocu, menzilinde bulunan ancak bitişik olmayan bir düşmanı mızrağının ucuyla _mızrağıyla_ vurabilir. Bu genellikle _%1$d-%2$d hasar_ verir, düşmanı geri savurur ve isabet etmesi garantilidir.
items.weapon.melee.sword$cleavetracker.desc=Düellocu, önceki kılıç darbesinin ardından harekete geçmeye hazır. Kılıç darbesinin bir sonraki kullanımı herhangi bir silah yeteneği şarjına mal olmayacak.\n\nKalan tur sayısı: %s.
items.weapon.melee.sword$cleavetracker.name=yarık
items.weapon.melee.sword.ability_desc=Düellocu, bir düşmanı kılıcıyla ikiye bölebilir. Bu, _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme bir düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde ikiye bölmeyi ücretsiz olarak tekrar kullanabilir.
items.weapon.melee.sword.ability_name=yarık
items.weapon.melee.sword.desc=Dengesi güzel bir kılıç. Çok büyük değil, ama yine de kısa kılıçtan belirgin şekilde daha uzun.
items.weapon.melee.sword.name=kılıç
items.weapon.melee.sword.typical_ability_desc=Düellocu, bir düşmanı kılıcıyla ikiye bölebilir. Bu genellikle _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme bir düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde tekrar ücretsiz olarak ikiye bölme özelliğini kullanabilir.
items.weapon.melee.warhammer.ability_desc=Düellocu, savaş çekiciyle _ağır darbe_ indirebilir. Bu yoğunlaştırılmış saldırı, düşmanı şaşırtırsa _%1$d-%2$d hasar_ verir ve düşmanı 5 tur boyunca sersemletir; bu da isabet ve kaçınma oranlarını 50%% azaltır. Ağır darbe her zaman isabet eder, ancak düşmanı şaşırtmazsa normal hasar verir.
items.weapon.melee.warhammer.ability_name=ağır darbe
items.weapon.melee.warhammer.desc=Bu devasa kurşun ve çelik kütlesinin ezici darbesine çok az canlı dayanabilir, ancak onu etkili bir şekilde kullanmak büyük güç gerektirir.
items.weapon.melee.warhammer.name=savaş çekici
items.weapon.melee.warhammer.stats_desc=Bu oldukça isabetli bir silah.
items.weapon.melee.warhammer.typical_ability_desc=Düellocu, savaş çekiciyle _ağır darbe_ indirebilir. Bu yoğun saldırı, düşmanı şaşırtırsa genellikle _%1$d-%2$d hasar_ verir ve düşmanı 5 tur boyunca sersemletir; bu da isabet ve kaçınma oranlarını 50%% azaltır. Ağır darbe her zaman isabet eder, ancak düşmanı şaşırtmazsa normal hasar verir.
items.weapon.melee.warscythe.ability_desc=Düellocu, bir düşmanı savaş tırpanıyla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi garantidir ve _%d hasar_ verir. Hedef bağışık değilse, bu hasar kanama olarak uygulanır.
items.weapon.melee.warscythe.ability_name=hasat
items.weapon.melee.warscythe.desc=Bu büyük ve hantal alet, ekinlerden ziyade düşmanları kesmede daha etkili olacak şekilde güçlendirilmiştir.
items.weapon.melee.warscythe.name=savaş tırpanı
items.weapon.melee.warscythe.stats_desc=Bu oldukça isabetsiz bir silah.
items.weapon.melee.warscythe.typical_ability_desc=Düellocu, bir düşmanı savaş tırpanıyla _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi garantidir ve genellikle _%d hasar_ verir. Hedef bağışık değilse, bu hasar kanama olarak uygulanır.
items.weapon.melee.whip.ability_desc=Düellocu, etrafındaki tüm düşmanlara kırbaçla vurabilir. Bu yetenek _%1$d-%2$d hasar_ verir, saldırı menzili içindeki tüm düşmanlara saldırır ve isabet etmesi garantilidir.
items.weapon.melee.whip.ability_name=kirpik
