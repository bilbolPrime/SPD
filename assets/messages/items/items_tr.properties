items.artifacts.chaliceofblood.desc=Bu parlak gümüş kadeh, kenarında garip bir şekilde sivri taşlarla süslenmiştir.
items.artifacts.chaliceofblood.desc_1=Kadehi tutarken, garip bir şekilde sivri taşlara batma isteği duyuyorsunuz.
items.artifacts.chaliceofblood.desc_2=Kanınızın bir kısmı kadehe doluyor, kadehin size yaşam enerjisi verdiğini ve doğal sağlık yenilenmenizi artırdığını hafifçe hissedebiliyorsunuz. Acı vereceğini bilmenize rağmen yine de kadehle kendinizi kesmek istiyorsunuz.
items.artifacts.chaliceofblood.desc_3=Kadeh, yaşam özünüzle ağzına kadar dolu. Kadehin size yaşam enerjisi geri akıttığını hissedebilirsiniz.
