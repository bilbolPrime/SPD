items.artifacts.alchemiststoolkit.desc_hint=Sahip olduğunuz alet takımı, deneyim kazandıkça yavaş yavaş simya enerjisi üretiyor. Şişedeki karışımın, enerji kristalleri eklenerek daha da güçlendirilebileceği anlaşılıyor.
items.artifacts.alchemiststoolkit.desc_warming=Alet takımı şu anda ısınma aşamasında ve kısa bir süre sonra kullanıma hazır olacak.
