items.rings.ringofforce$brawlersstance.desc=Bu duruştayken, Düellocunun normal saldırıları, silahı kuşanmış olsa bile, kuşanmış bir Güç Yüzüğü kullanacaktır. Bu saldırılar bonus hasar kazanır ve yine de silahın güçlendirmesini ve büyüsünü kullanır. Ancak bu duruşu korumak odaklanmayı gerektirir ve silah yeteneği şarj hızını %50 azaltır. Bu duruş, bir Güç Yüzüğü kullanılarak açılıp kapatılabilir, ancak duruş hızlı bir şekilde etkinleştirilip devre dışı bırakılırsa şarj hızındaki azalma bir süre daha devam edecektir.
items.rings.ringofforce$brawlersstance.name=kavgacının duruşu
items.rings.ringofforce.ability_desc=Düellocu, bu yüzükle bir _dövüşçü duruşu_ benimseyebilir; bu sayede normal saldırıları, silah takılı olsa bile her zaman bu yüzüğü kullanır. Bu saldırılar _%1$d-%2$d hasar_ verir ve ayrıca silahın büyüsünü ve geliştirmesini de devralır. Bu duruş, silahın şarj hızını 50%% yavaşlatır.
items.rings.ringofforce.ability_name=kavgacının duruşu
items.rings.ringofforce.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek, silahsız toplam _%1$d-%2$d hasar_ veriyor veya silahla hasarı _%3$d_ artırıyor.
items.rings.ringofforce.desc=Bu yüzük, takanın yakın dövüş darbelerinin gücünü artırır. Bu ekstra güç, silah kullanırken oldukça zayıftır, ancak silahsız bir saldırıyı çok daha güçlü hale getirir. Lanetli bir yüzük ise takanın darbelerini zayıflatır.
items.rings.ringofforce.name=kuvvet halkası
items.rings.ringofforce.stats=Silahsızken, mevcut gücünüzle bu yüzük _%1$d-%2$d hasar verir._ Silah kuşanıldığında ise bu yüzük hasarı _%3$d_ artırır.
items.rings.ringofforce.typical_ability_desc=Düellocu, bu yüzükle bir _dövüşçü duruşu_ benimseyebilir; bu sayede normal saldırıları, silah takılı olsa bile her zaman bu yüzüğü kullanır. Bu saldırılar genellikle _%1$d-%2$d hasar_ verir ve ayrıca silahın büyüsünü ve geliştirmesini de devralır. Bu duruş, silahın şarj hızını 50%% yavaşlatır.
items.rings.ringofforce.typical_stats=Silahsızken, mevcut gücünüzle, bu yüzük genellikle _%1$d-%2$d hasar verir._ Silah kuşanıldığında ise, bu yüzük genellikle hasarı _%3$d_ kadar artırır.
