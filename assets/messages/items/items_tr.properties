items.food.supplyration.desc=Bu erzak, hırsızlar loncası üyeleri tarafından ve onlar için zindana bırakılmıştır. Özellikle hareket halindeyken yenmesi ve genel hırsızlığa yardımcı olması için tasarlanmıştır. Normal bir erzak kadar doyurucu olmasa da, hızlıca yenebilir, biraz doğrudan iyileşme sağlar ve Hırsızın gölge pelerinine bir şarj kazandırır.
