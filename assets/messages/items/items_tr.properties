items.brokenseal.desc=Cesaret sembolü olarak zırha iliştirilmiş bir balmumu mühür. Ortasında solmuş bir koruma rünü kazınmış ve ortadan ikiye çatlamış. Evinden bir hatıra olan mühür, savaşçının azimle devam etmesine yardımcı olur. Mührü takan savaşçı, canı yarıya veya daha azına düşmek üzereyken anında kalkan kazanır. Mühür, zırha iliştirilebilir ve zırhlar arasında taşınabilir. Mühür, zırha takılıyken uygulanan bir yükseltmeyi de beraberinde taşıyabilir.
