items.armor.glyphs.affection.desc=Bu güçlü sembol, saldırganların zihnini manipüle ederek onları geçici olarak etkisi altına alıyor.
items.armor.glyphs.affection.name=%s sevgi
items.armor.glyphs.antimagic.desc=Bu güçlü sembol, zırhın giyen kişiyi hem büyülü hem de fiziksel saldırılara karşı korumasını sağlar. Bu büyülü savunma, zırhın seviyesinden etkilenmez.
items.armor.glyphs.antimagic.name=%s büyü karşıtı
items.armor.glyphs.brimstone.desc=Bu sembol, taşıyıcısını ve eşyalarını ateşten koruyarak, ateşin verdiği zararı ve olumsuz etkilerini tamamen ortadan kaldırır.
items.armor.glyphs.brimstone.name=%s kükürt
