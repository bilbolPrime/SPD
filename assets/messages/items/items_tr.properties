items.potions.potion.sure_drink=Bunu içmek istediğinizden emin misiniz? Çoğu durumda bu tür iksirleri düşmanlarınıza fırlatmanız gerekir.
items.potions.potion.sure_throw=Atmak istediğinizden emin misiniz? Çoğu durumda içmek daha mantıklı.
