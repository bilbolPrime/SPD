items.rings.ringofarcana.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek büyülerin ve sembollerin gücünü toplamda _%s%%_ kadar artırıyor.
items.rings.ringofarcana.desc=Bu yüzük, silahlar üzerindeki büyülü tılsımları ve zırhlar üzerindeki sembolleri, lanetler de dahil olmak üzere güçlendirir! İlk önce etkinleştirme şansını artırır, ardından etkinleştirme şansı %100'e ulaştığında etkinin gücünü artırır. Lanetli bir yüzük ise bunun yerine büyüleri, sembolleri ve lanetleri zayıflatır.
