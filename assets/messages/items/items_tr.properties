items.arcaneresin.apply=Sihirli değneğinizi reçineyle kaplayarak gücünü artırırsınız!
items.arcaneresin.desc=Bu ince toz, mor ve beyaz tonları arasında parıldar. Büyü enerjilerini yükselterek, uygulandığında asaların seviyesini artırır! Bir asayı yükseltmek, asanın başlangıç seviyesine bağlı olarak 1, 2 veya 3 reçineye mal olur. Reçine, asaları en fazla +3'e kadar yükseltebilir. Reçine yükseltmeleri, diğer yükseltme kaynakları (örneğin yükseltme parşömenleri) tarafından geçersiz kılınır ve bir asayı Büyücünün asasına yerleştirirken uygulanmaz.
items.arcaneresin.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.arcaneresin.level_too_high=O sihirli değnek, reçinenin iyileştirebileceğinden çok daha güçlü.
