items.weapon.melee.crossbow.desc=Oldukça karmaşık bir silah olup, okları olağanüstü hızlarda fırlatır. Tasarlanmamış olsa da, bu arbaletin ağırlığı ve sağlam yapısı onu iyi bir yakın dövüş silahı haline getirir.
