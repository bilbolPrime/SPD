items.rings.ringofelements.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek toplamda _%s%%_ element direnci sağlıyor.
items.rings.ringofelements.desc=Bu yüzük ateş, elektrik, gazlar ve diğer elementlere karşı direnç sağlar. Ayrıca olumsuz etkilerin süresini kısaltır.
items.rings.ringofelements.name=elementler yüzüğü
