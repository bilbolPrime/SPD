items.artifacts.alchemiststoolkit.cursed=Lanetli alet setiniz simyayı kullanmanızı engelliyor!
items.artifacts.alchemiststoolkit.desc=Bu set, çeşitli reaktifler ve bitkilerin yanı sıra küçük bir karıştırma şişesi içerir ve böylece hareket halindeyken simya yapılmasına olanak tanır. Şişe, sıvı halde simyasal enerji kristallerine benzeyen bir madde içerir.
