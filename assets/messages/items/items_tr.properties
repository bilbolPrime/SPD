items.weapon.curses.wayward$waywardbuff.desc=Kontrolden çıkmış silahınızın büyüsü aktifleşti ve kısa bir süreliğine son derece isabetsiz hale geldi. Bu durum, sürpriz saldırılar gibi isabet garantisi olan saldırıları etkilemez. Kontrolden çıkmış silahla başarılı bir saldırı gerçekleştirmek bu etkiyi hemen ortadan kaldıracaktır. Kalan tur sayısı: %s.
