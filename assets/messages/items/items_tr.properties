items.kindofweapon.which_equip_msg=Bu eşyayı hangi silah yuvasına takmak istersiniz?\n\nŞampiyon, birincil silahıyla doğrudan saldırır, ancak her iki silahın yeteneğini de kullanabilir. Her iki silah da aynı şarj sayısına sahiptir.\n\nŞampiyon ayrıca birincil ve ikincil silahını anında değiştirebilir.
