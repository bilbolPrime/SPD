items.potions.potionofexperience.name=deneyim iksiri
items.potions.potionoffrost.desc=Bu madde açık havaya çıkınca dondurucu bir buluta dönüşür. Buluta dokunan her yaratık olduğu yerde donar; hareket edemez ve hiçbir şey yapamaz.
items.potions.potionoffrost.name=don iksiri
items.potions.potionofhaste.desc=Bu garip tatlı sıvıyı içmek size kısa bir süreliğine muazzam bir enerji verecek ve yüksek hızlarda koşmanıza olanak sağlayacaktır.
items.potions.potionofhaste.energetic=Kendinizi enerjik hissediyorsunuz!
items.potions.potionofhaste.name=hız iksiri
items.potions.potionofhealing.desc=Sağlığını anında tamamen dolduran ve zehirlenmeyi iyileştiren bir iksir.
items.potions.potionofhealing.heal=Yaralarınız iyileşmeye başlıyor.
items.potions.potionofhealing.name=şifa iksiri
items.potions.potionofinvisibility.desc=Bu iksiri içmek seni bir süre görünmez yapar. Görünmezken düşmanlar seni göremez. Bir düşmana saldırmak ya da onun gözü önünde asa veya parşömen kullanmak etkiyi bozar.
items.potions.potionofinvisibility.invisible=Ellerinizin görünmez hale geldiğini görüyorsunuz!
items.potions.potionofinvisibility.name=görünmezlik iksiri
items.potions.potionoflevitation.desc=Bu tuhaf sıvı seni havaya kaldırır ve tuzakların üzerinden kolayca süzülmeni sağlar. Ancak alevler ve gazlar havayı da doldurduğundan onlardan bu şekilde kaçamazsın.
items.potions.potionoflevitation.float=Havaya yükseliyorsun!
items.potions.potionoflevitation.name=uçma iksiri
items.potions.potionofliquidflame.desc=Bu şişe, açık havaya maruz kaldığında şiddetli bir şekilde alev alacak kararsız bir bileşik içermektedir.
items.potions.potionofliquidflame.name=sıvı alev iksiri
items.potions.potionofmindvision.desc=Bu iksiri içtikten sonra, zihniniz uzaktaki canlıların psişik imzalarına duyarlı hale gelecek ve duvarların ardındaki biyolojik varlıkları algılayabileceksiniz. Ayrıca bu iksir, yakındaki duvarların ve kapıların içini görmenizi sağlayacaktır.
items.potions.potionofmindvision.name=zihin görüşü iksiri
items.potions.potionofmindvision.see_mobs=Bir şekilde diğer canlıların zihinlerinin varlığını hissedebiliyorsunuz!
items.potions.potionofmindvision.see_none=Şu anda bu seviyede yalnız olduğunuzu bir şekilde anlayabiliyorsunuz.
items.potions.potionofparalyticgas.desc=Bu şişedeki sıvı, açık havaya maruz kaldığında uyuşturucu sarı bir sis haline dönüşerek buharlaşır. Bu bulutu soluyan herkes anında felç olur ve bulut dağıldıktan sonra bir süre hareket edemez. Bu ürün, uzaktaki düşmanlara fırlatılarak onları gazın etkisi altına alabilir.
items.potions.potionofparalyticgas.name=felç edici gaz iksiri
items.potions.potionofpurity.desc=Bu madde etki alanındaki bütün zararlı gazları hızla etkisiz hâle getirir. İçildiğinde bu gazlara karşı geçici bağışıklık sağlar.
items.potions.potionofpurity.freshness=Havada alışılmadık bir tazelik hissediyorsunuz.
items.potions.potionofpurity.name=Arınma İksiri
items.potions.potionofpurity.protected=Sizi koruyucu bir film sarıyor!
items.potions.potionofstrength.desc=Bu güçlü sıvı kaslarınızda dolaşarak gücünüzü kalıcı olarak bir puan artıracaktır.
items.potions.potionofstrength.msg=Yeni kazanılan güç vücudunuzda dalgalanıyor, artık %d gücüne sahipsiniz!
items.potions.potionofstrength.name=güç iksiri
items.potions.potionoftoxicgas.desc=Bu basınçlı cam şişenin kapağını açmak veya kırmak, içindekilerin zehirli yeşil bir gaz bulutuna dönüşerek patlamasına neden olacaktır. Bu nedenle, şişenin kapağını elle açmak yerine, bu iksiri uzaktaki düşmanlara fırlatmayı tercih edebilirsiniz.
items.potions.potionoftoxicgas.name=zehirli gaz iksiri
items.quest.ceremonialcandle.desc=Kullanım sonucu eritilip birbirine kaynaşmış bir mum seti. Tek başlarına değersizdirler, ancak diğer mumlarla birlikte bir düzen içinde kullanıldıklarında, bir çağırma ritüeli için enerjiyi odaklayabilirler.
items.quest.ceremonialcandle.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.ceremonialcandle.name=tören mumu
items.quest.corpsedust.chill=Tüyleriniz diken diken oluyor.
items.quest.corpsedust.desc=Ceset tozundan oluşan top, dış görünüş olarak normal bir toz topundan farklı değildir. Ancak içinde gizlenen kötü niyetli bir enerjiyi hissedebilirsiniz. Ondan en kısa sürede kurtulmak iyi bir fikir olacaktır.
items.quest.corpsedust.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.corpsedust.name=ceset tozu
items.quest.darkgold.desc=Bu metale koyu renk denmesinin nedeni rengi değil (normal altından farklı değil), gün ışığında eriyip yüzeyde kullanılamaz hale gelmesidir.
items.quest.darkgold.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.darkgold.name=koyu altın cevheri
items.quest.darkgold.you_now_have=Şu anda elinizde %d koyu altın cevheri var.
items.quest.dwarftoken.desc=Birçok cüce ve onların daha büyük yaratıklarından bazıları, bilinmeyen bir amaçla bu küçük metal parçalarını taşır. Belki mücevherdirler, belki de bir tür kimlik kartıdırlar. Cüceler tuhaf bir halktır.
items.quest.dwarftoken.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.dwarftoken.name=cüce jetonu
items.quest.embers.desc=Sadece genç ateş elementallerinden elde edilebilen özel közler. Isı enerjisi yayarlar.
items.quest.embers.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.embers.name=temel közler
items.quest.escapecrystal.ac_use=KULLANMAK
items.quest.escapecrystal.desc=Işınlanma büyüsü içeriyor gibi görünen ince, sihirli bir büyü kristali. Kristali istediğiniz zaman cüce mahzeninden ayrılmak için kullanabilirsiniz, ancak yanınızda hiçbir şey götüremezsiniz!
items.quest.escapecrystal.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.escapecrystal.name=kaçış kristali
items.quest.gooblob.desc=Ölen Goo'dan ayrılan, titrek bir yapışkan madde yığını. Neredeyse büyük bir jöle topu gibi, ama yemeye cesaret edemezsiniz. Tek başına hiçbir işe yaramaz, ancak bazı iksirlerle veya bir bombayla birleştirildiğinde faydalı olabilir. En azından hatırı sayılır miktarda enerjiye dönüşmesi gerekir.
items.quest.gooblob.discover_hint=Bu eşyayı belirli düşmanlardan düşen bir ganimet olarak elde edebilirsiniz.
items.quest.gooblob.name=yapışkan bir top
items.quest.metalshard.desc=DM-300'ün imha edilmesi sırasında kopan paslı, lanetli bir metal parçası. İçinde etkisiz, kötü niyetli bir büyü hissediliyor. Tek başına hiçbir işe yaramaz, ancak bazı parşömenlerle veya bir bombayla birleştirildiğinde faydalı olabilir. En azından hatırı sayılır miktarda enerjiye dönüşmesi gerekir.
items.quest.metalshard.discover_hint=Bu eşyayı belirli düşmanlardan düşen bir ganimet olarak elde edebilirsiniz.
items.quest.metalshard.name=lanetli metal parçası
items.quest.pickaxe.ability_desc=Düellocu, bir düşmanı kazmayla _delebilir_. Bu, isabet garantisi verir, 3 tur boyunca savunmasızlık etkisi uygular ve sert derili düşmanlara _%1$d-%2$d hasar_ verir.
items.quest.pickaxe.ability_name=delmek
items.quest.pickaxe.desc=Bu, kayaları kırmak için sağlam ve ağır bir alettir. Bununla madencilik yapmak için kazma kuşanmanıza gerek yok, ancak gerekirse silah olarak da kullanılabilir.
items.quest.pickaxe.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
items.quest.pickaxe.name=kazma
items.quest.pickaxe.upgrade_ability_stat_name=Yetenek Hasarı
items.quest.ratskull.desc=Şaşırtıcı derecede büyük bir sıçan kafatası. Eğer duvara asacak yeriniz varsa, harika bir av ganimeti olurdu.
items.quest.ratskull.name=dev sıçan kafatası
items.remains.bowfragment.desc=Bu kırık tahta parçası, bir zamanlar kayıp bir Avcı'nın ruh yayının bir parçasıydı. Parçada hala biraz doğa enerjisi hissedebilirsiniz, bu parçayı kullanarak etrafınızda uzun otlar yetiştirebilirsiniz. Ancak bunu yapmak parçayı yok edecektir.
items.remains.bowfragment.name=yay parçası
items.remains.brokenhilt.desc=Bu kırık kılıç kabzası, yenilmiş bir düellocunun silahından çıkmış gibi görünüyor. Kabzada hala biraz dövüş gücü kaldığını hissedebilirsiniz, bunu kullanarak sonraki iki yakın dövüş vuruşunuzda biraz bonus hasar elde edebilirsiniz. Ancak bunu yapmak kabzayı tamamen yok edecektir.
items.remains.brokenhilt.name=kırık kabza
items.remains.brokenstaff.desc=Bu büyücü asası, sahibinin ölümünden sonra ikiye bölünmüştür. Asada hala biraz büyülü enerji kaldığını hissedebilirsiniz, bunu kullanarak asalarınıza biraz enerji takviyesi verebilirsiniz. Ancak bunu yapmak asayı yok edecektir.
items.remains.brokenstaff.name=kırık personel
items.remains.cloakscrap.desc=Bu saydam kumaş parçası, sanki ölmüş bir Haydut'un gölge pelerininden kalma gibi görünüyor. İçinde hala biraz mistik enerji hissediliyor, bunu kullanarak eserlerinize biraz şarj takviyesi verebilirsiniz. Ancak bunu yapmak kumaşı yok edecektir.
items.remains.cloakscrap.name=kumaş parçası
items.remains.remainsitem.ac_use=KULLANMAK
items.remains.remainsitem.discover_hint=Bu eşyayı, önceki kayıp bir oyundan kalan belirli bir kahramanın kalıntıları arasında bulabilirsiniz.
items.remains.sealshard.desc=Bu minik kırmızı balmumu parçaları, düşmüş bir savaşçının mühründen çıkmış gibi görünüyor. Mühürde hâlâ biraz irade gücü kaldığını hissedebilirsiniz, bunu kendinize biraz kalkan sağlamak için kullanabilirsiniz. Ancak bunu yapmak mühür parçalarını yok edecektir.
items.remains.sealshard.name=fok parçaları
items.remains.tornpage.desc=Bu sayfa, ömrünü tamamlamış bir rahibin kutsal kitabından koparılmış gibi görünüyor. Üzerinde hala biraz ilahi enerji var, bunu kullanarak biraz sağlık kazanabilirsiniz. Ancak bunu yaparsanız yırtılmış sayfa yok olacaktır.
items.remains.tornpage.name=yırtılmış sayfa
