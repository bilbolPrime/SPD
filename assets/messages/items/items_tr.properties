items.food.pasty.amulet_desc=Sonunda onu buldunuz, sihirli tılsımı - durun bir dakika, bu sadece tılsım gibi görünmesi için folyoya sarılmış bir çikolata! Size sınırsız güç vermeyecek, ama en azından sizi doyuracak ve size biraz eser enerjisi verecek. 1 Nisan şakası!
items.food.pasty.amulet_name=Yendor'un tılsımı mı?
items.food.pasty.cane_desc=Kocaman, şeker gibi tatlı bir şeker kamışı. Sizi doyuracak kadar büyük ve içindeki şeker, sihirli değneklerinize de biraz ekstra enerji verebilir. Mutlu Tatiller!
items.food.pasty.cane_name=şeker kamışı
items.food.pasty.desc=İçi geleneksel dana eti ve patates dolgulu, otantik bir Cornwall pastası. Çok lezzetli!
items.food.pasty.egg_desc=Renkli sarı folyoya sarılmış kocaman bir çikolata yumurta. İçinde sizi rahatlıkla doyuracak kadar çikolata var ve şeker, yaptığınız eserlere biraz daha enerji katabilir. Mutlu Paskalya!
items.food.pasty.egg_name=Paskalya yumurtası
items.food.pasty.fish_desc=Yeşilliklerin üzerinde sihirli bir şekilde korunmuş, bütün bir buharda pişirilmiş balık. Yılın bu zamanlarında balığın bir kısmını sonraya saklamak bir gelenektir, böylece hepsini bir kerede yemek yerine artanları saklayabilirsiniz. Mutlu Ay Yeni Yılı!
items.food.pasty.fish_name=buharda pişirilmiş balık
items.food.pasty.name=hamur işi
items.food.pasty.pie_desc=Kocaman bir dilim balkabağı turtası. Tatlı ve baharatlı lezzeti sizi doyuracak ve size biraz da şifa verecek. Mutlu Cadılar Bayramı!
items.food.pasty.pie_name=balkabağı turtası
items.food.pasty.rainbow_desc=Bu renkli iksir bir çeşit sıvı besindir. Açlığınızı gidermenin yanı sıra, içinde küçük bir sihir de barındırır; bu sihir, yakındaki patron olmayan bir düşmanı sakinleştirerek, geçici olarak sizinle savaşmaktan çekinmelerini sağlar. Mutlu Onur Haftası!
items.food.pasty.rainbow_name=gökkuşağı iksiri
items.food.pasty.sparkling_desc=Bu köpüklü içecek bir çeşit sıvı besindir. Açlığı giderir ve köpüklü şarabı taklit eder, ancak aslında alkollü değildir. Karnınızdaki sıcaklık hissi biraz koruma sağlayacaktır. Mutlu Yıllar!
items.food.pasty.sparkling_name=parıldayan iksir
items.food.pasty.vanilla_desc=Bu büyük dilim vanilyalı kek, renkli şekerlemeler ve mavi krema ile süslenmiştir. Kek, yılların deneyimini kutlamak için yapılmıştır ve yendiğinde size de bu deneyimin küçük bir parçasını kazandıracaktır. Orijinal Pixel Dungeon ilk olarak 4 Aralık 2012'de piyasaya sürüldü. Pixel Dungeon'a mutlu yıllar!
items.food.pasty.vanilla_name=mavi kek
items.food.phantommeat.desc=Hayalet bir piranadan kesilmiş, büyük, parlak, saydam bir biftek. Bu sihirli etin pişirilmesine gerek yoktur ve sizi tamamen doyurmanın yanı sıra bir dizi savunma avantajı da sağlar. Yenildiğinde görünmezlik, kabuklu deri, kısmi iyileşme sağlar ve birçok zararlı etkiyi ortadan kaldırır.
