items.rings.ringofsharpshooting.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek, fırlatılan silahların etkili seviyesini _%1$d_ kadar artırıyor ve dayanıklılıklarını toplamda _%2$s%%_ kadar yükseltiyor.
items.rings.ringofsharpshooting.desc=Bu yüzük, takanın isabet ve nişan alma yeteneğini artırarak tüm fırlatma silahlarının daha etkili ve dayanıklı olmasını sağlar. Lanetli bir yüzük ise bunun tam tersi etki yaratır.
items.rings.ringofsharpshooting.name=keskin nişancılık halkası
