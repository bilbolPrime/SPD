items.weapon.melee.sai.typical_ability_desc=Düellocu, sai ile bir _kombo vuruş_ gerçekleştirebilir. Bu saldırının isabet etmesi garantidir ve genellikle Düellocunun normal bir yakın dövüş veya fırlatma silahı saldırısıyla her isabet ettiğinde _+%d hasar_ verir. 5 tur boyunca isabet etmemek bu komboyu sıfırlar.
items.weapon.melee.scimitar$sworddance.desc=Düellocu, bir tür dans edercesine, ivmeye dayalı hızlı vuruşlar yapıyor. Bu duruş aktifken, 60%% daha hızlı saldırıyor (bir kılıçla tur başına tam olarak iki kez saldırmaya yetecek kadar) ve +50%% isabet oranına sahip oluyor. Kalan tur sayısı: %s.
items.weapon.melee.scimitar$sworddance.name=kılıç dansı
items.weapon.melee.scimitar.ability_desc=Düellocu, bir pala ile _kılıç dansı_ yapabilir. Bu duruşun etkinleşmesi zaman almaz ve Düellocuya _%d tur boyunca_ +60%% saldırı hızı ve +50%% isabet oranı kazandırır.
items.weapon.melee.scimitar.ability_name=kılıç dansı
items.weapon.melee.scimitar.desc=Kalın, kavisli bir bıçak. Şekli, daha hızlı ancak daha az güçlü saldırılara olanak tanır.
items.weapon.melee.scimitar.name=pala
items.weapon.melee.scimitar.stats_desc=Bu oldukça hızlı bir silah.
items.weapon.melee.scimitar.typical_ability_desc=Düellocu, bir pala ile _kılıç dansı_ yapabilir. Bu duruşun etkinleşmesi zaman almaz ve Düellocuya genellikle _%d tur_ boyunca +60%% saldırı hızı ve +50%% isabet oranı kazandırır.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Yetenek Süresi
items.weapon.melee.shortsword.ability_desc=Düellocu, kısa kılıcıyla bir düşmanı ikiye bölebilir. Bu, _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme bir düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde ikiye bölmeyi ücretsiz olarak tekrar kullanabilir.
items.weapon.melee.shortsword.ability_name=yarık
items.weapon.melee.shortsword.desc=Oldukça kısa bir kılıç, bir hançerden sadece birkaç santim daha uzun.
items.weapon.melee.shortsword.name=kısa kılıç
items.weapon.melee.shortsword.typical_ability_desc=Düellocu, kısa kılıcıyla bir düşmanı ikiye bölebilir. Bu genellikle _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme bir düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde tekrar ücretsiz olarak ikiye bölme özelliğini kullanabilir.
items.weapon.melee.sickle.ability_desc=Düellocu, orakla bir düşmanı _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi garantidir ve _%d hasar_ verir. Hedef bağışık değilse, bu hasar kanama olarak uygulanır.
items.weapon.melee.sickle.ability_name=hasat
items.weapon.melee.sickle.desc=Hem el tipi bir tarım aleti hem de güçlü ama kullanımı hantal bir silah olarak kullanılabilen bir ürün.
items.weapon.melee.sickle.name=orak
items.weapon.melee.sickle.stats_desc=Bu oldukça isabetsiz bir silah.
items.weapon.melee.sickle.typical_ability_desc=Düellocu, orakla bir düşmanı _hasat edebilir_. Bu yıkıcı saldırının isabet etmesi garantidir ve genellikle _%d hasar_ verir. Hedef bağışık değilse, bu hasar kanama olarak uygulanır.
items.weapon.melee.spear.ability_desc=Düellocu, menzilinde bulunan ancak bitişik olmayan bir düşmana mızrağın ucunu saplayabilir. Bu, _%1$d-%2$d hasar_ verir, düşmanı geri savurur ve isabet etmesi garantilidir.
items.weapon.melee.spear.ability_name=ani yükseliş
