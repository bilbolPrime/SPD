items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Az önce anında bir şuriken fırlattınız ve tekrar fırlatmadan önce beklemeniz gerekiyor. Şurikenler hala fırlatılabilir, ancak normal silah hızıyla.\n\nKalan Tur Sayısı: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Şuriken Bekleme Süresi
items.weapon.missiles.shuriken.desc=Jilet gibi keskin kenarları olan yıldız biçimli metal parçaları, hedefe isabet ettiklerinde ciddi hasar verir. Çok hızlı fırlatılabilirler.
items.weapon.missiles.shuriken.name=şuriken
items.weapon.missiles.shuriken.stats_desc=Şurikenler 20 turluk bekleme süresiyle anında fırlatılabilir.
items.weapon.missiles.throwingclub.desc=Oldukça basit ama dayanıklı bir fırlatma silahı; esasen bir sopaya bağlanmış büyük bir taştan oluşuyor.
items.weapon.missiles.throwingclub.name=fırlatma sopası
items.weapon.missiles.throwingclub.stats_desc=Bu silah düşmanlara yapışmaz ve anında toplanabilir.
items.weapon.missiles.throwinghammer.desc=Bu ağır çekiçler düşmana fırlatılmak üzere tasarlanmıştır. Pürüzsüz, tamamen metal yapıları sayesinde oldukça dayanıklıdırlar.
items.weapon.missiles.throwinghammer.name=fırlatma çekici
items.weapon.missiles.throwinghammer.stats_desc=Bu silah düşmanlara yapışmaz ve anında toplanabilir.
items.weapon.missiles.throwingknife.desc=Bu hafif bıçaklar, havada kavis çizerek doğrudan hedeflerine ulaşacak şekilde dengelenmiştir.
items.weapon.missiles.throwingknife.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.weapon.missiles.throwingknife.name=fırlatma bıçağı
items.weapon.missiles.throwingknife.stats_desc=Bu silah, habersiz düşmanlara karşı daha etkilidir.
items.weapon.missiles.throwingspear.desc=Bu hafif mızrakların ince çerçeveleri, saplanmak yerine fırlatılmak üzere tasarlanmıştır.
items.weapon.missiles.throwingspear.name=fırlatma mızrağı
items.weapon.missiles.throwingspike.desc=Bu dayanıklı, sivri uçlu metal oklar, uzaktaki düşmanlara fırlatılmak üzere tasarlanmıştır.
items.weapon.missiles.throwingspike.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.weapon.missiles.throwingspike.name=fırlatma çivisi
items.weapon.missiles.throwingstone.desc=Bu taşlar, normal bir taşa göre daha güçlü bir şekilde fırlatılabilmeleri için zımparalanmıştır.
items.weapon.missiles.throwingstone.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.weapon.missiles.throwingstone.name=taş atmak
items.weapon.missiles.tomahawk.desc=Bu fırlatma baltalarının tırtıklı kenarları, düşmana saplandıklarında yırtılmalarına neden olur.
items.weapon.missiles.tomahawk.name=balta
items.weapon.missiles.tomahawk.stats_desc=Bu silah hedefine _%1$d-%2$d kanama_ etkisi uygular.
items.weapon.missiles.tomahawk.typical_stats_desc=Bu silah genellikle hedefine _%1$d-%2$d kanama_ etkisi uygular.
items.weapon.missiles.trident.desc=Uçlarında üç ölümcül sivri uç bulunan devasa fırlatma mızrakları. Güçlüdürler, ancak oldukça ağırdırlar.
items.weapon.missiles.trident.name=üç dişli mızrak
items.weapon.spiritbow.ac_shoot=FİLM ÇEKMEK
items.weapon.spiritbow.desc=Antik büyülü ağaçtan yapılmış bir yay. Yayın kirişi ve üzerindeki işlemeler soluk mavi bir ışıkla parlıyor. Kiriş çekildiğinde, bu yay düşmana fırlatılabilecek büyülü bir ok ortaya çıkarıyor.
items.weapon.spiritbow.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.weapon.spiritbow.name=ruh yayı
items.weapon.spiritbow.prompt=Bir hedef seçin
items.weapon.spiritbow.stats=Yay doğrudan yükseltilemez, bunun yerine seviyeniz yükseldikçe kademeli olarak güçlenir. Mevcut seviyenizde, yaydan atılan oklar _%1$d-%2$d hasar_ verir ve düzgün kullanmak için _%3$d güç_ gerektirir.
items.weapon.weapon$enchantment.discover_hint=Bu etkiye sahip bir eşyayı zindanda rastgele bulabilir veya kendiniz bir eşyaya uygulamayı deneyebilirsiniz.
items.weapon.weapon$enchantment.enchant=büyü
items.weapon.weapon$enchantment.rankings_desc=Büyüyle öldürüldü
items.weapon.weapon.cursed=Bu silahın içinde kötü niyetli bir büyünün gizlendiğini hissedebilirsiniz.
items.weapon.weapon.cursed_worn=Bu silah lanetli olduğu için onu kaldırmakta güçsüzsünüz.
items.weapon.weapon.enchant_hardened=Sertleştirildi.
items.weapon.weapon.enchanted=_%s_ koduna sahip.
items.weapon.weapon.excess_str=Sahip olduğunuz aşırı güç sayesinde, bu silahla _0-%d bonus hasar_ vereceksiniz.
items.weapon.weapon.faster=Hızı artırmak için geliştirilmiştir.
items.weapon.weapon.hardened_no_enchant=Bu silah sertleştirilmiştir, ancak şu anda büyülü değildir.
items.weapon.weapon.hardening_gone=Bu silahın sertleştirme kaplaması aşınmış!
items.weapon.weapon.identify=Artık silahınızı tanıyacak kadar aşinasınız.
items.weapon.weapon.incompatible=Farklı sihir türlerinin etkileşimi, bu silah üzerindeki büyüyü etkisiz hale getirdi!
items.weapon.weapon.not_cursed=Bu silah kötü niyetli büyüden arındırılmıştır.
items.weapon.weapon.stronger=Hasarı artırmak için güçlendirilmiştir.
items.weapon.weapon.too_heavy=Yetersiz gücünüz nedeniyle bu silah, saldırı hızınızı, isabet oranınızı ve sürpriz saldırı yeteneğinizi olumsuz etkileyecektir.
items.weapon.weapon.weak_cursed=Lanete rağmen, bu silahı üzerinizden çıkarabilirsiniz.

items.keys.skeletonkey.desc=Bu anahtar oldukça ciddi görünüyor: başı bir kafatası şeklinde. Muhtemelen çok ciddi bir kapıyı açabilir.
items.weapon.missiles.bombarrow.desc=Yanına bomba bağlanmış bir ok. Uzak durun...
items.weapon.missiles.bombarrow.name=bomba oku
items.weapon.missiles.missileweapon.damage_desc=Bu silah, vuruş başına _%1$d_ ile _%2$d_ arasında hasar verir.
items.bags.seedpouch.desc=Bu küçük kadife keseye istediğin kadar tohum koyabilirsin. Çok kullanışlı.
items.bags.seedpouch.name=tohum kesesi
items.potions.potionofmight.desc=Bu güçlü sıvı kaslarına yayılır; gücünü kalıcı olarak bir, sağlığını ise beş puan artırır.
items.potions.potionofmight.name=Kudret İksiri
items.rings.ringofdetection.desc=Bu yüzüğü takan kişi, aramakla vakit kaybetmeden gizli tuzakları ve kapıları fark edebilir. Zayıflatılmış tespit yüzükleri duyularını köreltir; ararken bile sırları bulmanı zorlaştırır.
items.rings.ringofdetection.name=tespit yüzüğü
items.rings.ringofhaggler.desc=Bu yüzüğün aslında büyülü bir etkisi yoktur. Ancak satıcılara, sahibinin Hırsızlar Loncası üyesi olduğunu gösterir. Bir süre rahat bırakılacaklarının garantisi karşılığında genellikle seve seve indirim yaparlar. Yüzüğü yükseltmek ek bir fayda sağlamaz.
items.rings.ringofhaggler.name=pazarlıkçı yüzüğü
items.rings.ringofherbalism.desc=Bu yüzük çimleri ezerken çiy ve tohum bulma şansını artırır.
items.rings.ringofherbalism.name=bitkicilik yüzüğü
items.rings.ringofmending.desc=Bu yüzük vücudun yenilenme gücünü artırarak kaybedilen sağlığın daha hızlı geri gelmesini sağlar. Zayıflatılmış yüzükler doğal iyileşmeyi yavaşlatır, hatta durdurabilir.
items.rings.ringofmending.name=iyileşme yüzüğü
items.rings.ringofpower.desc=Bu yüzüğün yaydığı enerji alanı asalarını güçlendirir. Zayıflatılmış güç yüzükleri ise asalarını zayıflatır.
items.rings.ringofpower.name=güç yüzüğü
items.rings.ringofsatiety.desc=Bu yüzükle daha uzun süre aç kalabilirsin. Zayıflatılmış tokluk yüzükleri ters etki yapar.
items.rings.ringofsatiety.name=tokluk yüzüğü
items.rings.ringofshadows.desc=Bu yüzüğü takarsanız düşmanların sizi fark etme olasılığı azalır. Bozulan gölge yüzükleri, aksi takdirde varlığınızı fark etmeyebilecek düşmanları uyarır.
items.rings.ringofshadows.name=gölgeler yüzüğü
items.rings.ringofthorns.desc=Bu yüzük gerçek dikenler çıkarmaz, ancak sana saldıran düşman verdiği hasarın bir kısmını kendisi de alır. Yüzüğü yükseltmek ek bir fayda sağlamaz.
items.rings.ringofthorns.name=diken yüzüğü
items.scrolls.scrollofchallenge.desc=Bu parşömen sesli okunduğunda, tüm canavarları uyandıracak ve okuyucunun yerini tespit etmelerini sağlayacak meydan okuyucu bir kükreme ortaya çıkaracaktır.
items.scrolls.scrollofchallenge.name=meydan okuma parşömeni
items.scrolls.scrollofenchantment.desc=Bu parşömen, bir silaha veya zırha rastgele bir büyü aşılayarak ona özel bir güç kazandırabilir.
items.scrolls.scrollofenchantment.name=büyü parşömeni
items.scrolls.scrollofpsionicblast.desc=Bu parşömen, görüş alanındaki tüm yaratıklara büyük hasar verebilecek şekilde psiyonik olarak yönlendirilebilen yıkıcı bir enerji içerir. Eşlik eden bir ışık parlaması, parşömeni okuyan kişi de dahil olmak üzere etki alanındaki herkesi geçici olarak kör edecektir.
items.scrolls.scrollofpsionicblast.name=psiyonik patlama parşömeni
items.scrolls.scrollofwipeout.desc=Bu parşömeni okuyarak zindan ruhlarının gazabını serbest bırakın ve mevcut seviyedeki her şeyi öldürün. Yani, neredeyse her şeyi. Daha güçlü yaratıklardan bazıları etkilenmeyebilir.
items.scrolls.scrollofwipeout.name=yok oluş parşömeni
items.wands.wandofblink.desc=Bu asa seçtiğin yöne ışınlanmanı sağlar. Yaratıklar ve cansız engeller ışınlanmayı durdurur.
items.wands.wandofblink.name=ışınlanma asası
items.wands.wandoffirebolt.desc=Bu asa büyülü ateş atışları yapar. Yanıcı araziyi tutuşturur; vurduğu yaratığa hasar verir ve onu yakar.
items.wands.wandoffirebolt.name=Ateş Oku Asası
