items.artifacts.masterthievesarmband.prompt=Hedef almak istediğiniz düşmanı seçin.
items.artifacts.masterthievesarmband.steal_shopkeeper=Dükkan sahiplerinden doğrudan hırsızlık yapamazsınız.
