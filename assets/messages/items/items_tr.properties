items.journal.alchemypage.desc=Simya üzerine bir rehber kitaptan yırtılmış bir sayfa. \n\nMetnin çoğu uzaktan okunamayacak kadar küçük, ancak sayfanın başlığını seçebiliyorsunuz: \n\n_"%s"_
