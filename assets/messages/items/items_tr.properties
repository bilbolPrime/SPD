items.armor.glyphs.entanglement.desc=Bu sembol, kullanan kişinin etrafında hasarı emmek için toprak zırh oluşturur, ancak kullanan kişi hareket ederse bu zırh kırılır.
items.armor.glyphs.entanglement.name=%s dolanıklığı
items.armor.glyphs.flow.desc=Bu sembol, kullanan kişinin etrafındaki suyun akışını kontrol ederek, suyun içinden geçerken çok daha hızlı hareket etmesini sağlar.
