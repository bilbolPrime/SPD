items.rings.ringofmight.desc=Bu yüzük, takanın fiziksel özelliklerini geliştirerek ona daha fazla fiziksel güç ve dayanıklılık kazandırır. Lanetli bir yüzük ise takanı zayıflatır.
items.rings.ringofmight.name=kudret yüzüğü
