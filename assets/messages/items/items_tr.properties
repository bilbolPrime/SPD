items.weapon.melee.whip.typical_ability_desc=Düellocu, etrafındaki tüm düşmanlara kırbaçla vurabilir. Bu yetenek genellikle _%1$d-%2$d hasar_ verir, saldırı menzili içindeki tüm düşmanlara saldırır ve isabet etmesi garantilidir.
items.weapon.melee.wornshortsword.ability_desc=Düellocu, yıpranmış bir kısa kılıçla düşmanı ikiye bölebilir. Bu, _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde ikiye bölmeyi ücretsiz olarak tekrar kullanabilir.
items.weapon.melee.wornshortsword.ability_name=yarık
items.weapon.melee.wornshortsword.desc=Oldukça kısa bir kılıç, yoğun kullanımdan dolayı aşınmış durumda. Daha iyi durumda olan bir kısa kılıca göre hem daha zayıf hem de biraz daha hafiftir.
items.weapon.melee.wornshortsword.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.weapon.melee.wornshortsword.name=yıpranmış kısa kılıç
items.weapon.melee.wornshortsword.typical_ability_desc=Düellocu, yıpranmış bir kısa kılıçla düşmanı ikiye bölebilir. Bu genellikle _%1$d-%2$d hasar_ verir ve isabet etmesi garantilidir. Eğer ikiye bölme düşmanı öldürürse, bu anında gerçekleşir ve Düellocu 5 tur içinde tekrar ücretsiz olarak ikiye bölme özelliğini kullanabilir.
items.weapon.missiles.bolas.desc=Bu sıra dışı menzilli silahlar çok fazla hasar vermezler, ancak hedeflerini yavaşlatmada mükemmel bir iş çıkarırlar.
