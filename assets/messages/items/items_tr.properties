items.artifacts.sandalsofnature.ac_feed=BESLEMEK
items.artifacts.sandalsofnature.ac_root=KÖK
items.artifacts.sandalsofnature.desc_1=İlk bakışta ipten yapılmış sandaletlere benzeyen şeyler aslında iki bitki! Çok zayıf ve solgun görünüyorlar, belki de besin takviyesine ihtiyaçları var?
items.artifacts.sandalsofnature.desc_2=Ayakkabılar büyüdü ve artık iki özel dikim ayakkabıya daha çok benziyorlar. Biraz renkleri geri geldi, belki daha da büyüyebilirler?
items.artifacts.sandalsofnature.desc_3=Bitkiler yeniden büyüdü ve şimdi kabuktan yapılmış sağlam bir çift çizmeye benziyorlar. Bitkiler güçlerini yeniden kazanmış gibi görünüyor, ama belki daha da büyüyebilirler?
items.artifacts.sandalsofnature.desc_4=Bitkiler maksimum boyutlarına ulaşmış gibi görünüyor, zırhlı bir çift dizliğe benziyorlar. Dizlikler koyu kahverengi ve çok sağlam bir ağacı andırıyor.
items.artifacts.sandalsofnature.desc_ability=Ayakkabılar, onlara en son verdiğiniz tohumun rengiyle dalgalanıyor. Kısa süreliğine toprağa kök salabilirler ve 3 kare yarıçapındaki herhangi bir yerde o bitkinin etkisini üretebilirler.\nTohum: _%s_\nGerekli Şarj: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Lanetli sandaletler doğayla olan her türlü uyumu engelliyor.
items.artifacts.sandalsofnature.desc_hint=Bu aksesuarı taktığınızda doğayla daha uyumlu hissedersiniz.
items.artifacts.sandalsofnature.desc_seeds=Ayakkabıya %d tohumlarını yedirdiniz.
items.artifacts.sandalsofnature.levelup=Ayakkabı numaranız birden büyüyor!
