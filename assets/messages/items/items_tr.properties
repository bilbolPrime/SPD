items.scrolls.exotic.exoticscroll.unknown_desc=Bu siyah parşömen üzerinde parıldayan, çözülemeyen büyülü bir runik yazı var. Bu topraklara yabancı gibi görünüyor, yüksek sesle okunduğunda ne olacağını kim bilebilir?
items.scrolls.exotic.exoticscroll.yngvi=YNGVI'nin egzotik parşömeni
items.scrolls.exotic.scrollofantimagic.desc=Bu parşömen üzerindeki büyü, sizi geçici olarak tüm büyülü etkileri, zararlı veya faydalı olsun, engelleyen büyülü bir aura ile çevreleyecektir. Buna asa, parşömen, yüzük, eser, büyü ve lanet gibi çoğu büyülü eşya etkisi de dahildir. Ancak kahraman zırhı yetenekleri, bu etkilerden bağımsız olarak çalışacak kadar güçlüdür.
items.scrolls.exotic.scrollofantimagic.name=büyü karşıtı parşömen
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Etrafınızda, yükselen kırmızı bir sisle belirtilen büyülü bir arena belirdi. Sis içinde dururken açlığınız artmayacak ve tüm kaynaklardan 33%% daha az hasar alacaksınız. Başka hasar azaltma kaynaklarınız varsa (örneğin zırh), bunlar 33%% azalmadan sonra uygulanacaktır. Kalan tur sayısı: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=meydan okuma arenası
items.scrolls.exotic.scrollofchallenge.desc=Bu parşömen sesli okunduğunda, düşmanları kullanıcıya çeken ve aynı anda etrafında küçük bir arena oluşturan büyük bir kükreme yayacaktır. Okuyucu bu arenada kaldığı sürece, tüm kaynaklardan %33 daha az hasar alacak (bu, diğer hasar azaltma biçimlerinden önce uygulanır) ve doygunluğunu kaybetmeyecektir. Arenanın boyutu, okuyucunun bulunduğu alanın boyutuyla orantılı olacaktır. Bazı boss alanlarında özellikle küçük olacaktır.
items.scrolls.exotic.scrollofchallenge.name=meydan okuma parşömeni
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Kehanet yazıtınız aşağıdaki maddeleri tespit etmiştir:
items.scrolls.exotic.scrollofdivination.desc=Bu parşömen, şu anda bilmediğiniz dört farklı eşya türünü rastgele belirleyecektir. Belirlenen türler, bir iksirin rengi, bir parşömenin rünü veya bir yüzüğün taşı olabilir. Belirlenen eşyalar, mutlaka yanınızda taşıdığınız eşyalar olmak zorunda değildir.
items.scrolls.exotic.scrollofdivination.name=kehanet parşömeni
items.scrolls.exotic.scrollofdivination.nothing_left=Tanımlanacak hiçbir şey kalmadı!
items.scrolls.exotic.scrollofdread.desc=Okunduğunda, bu parşömen görüş alanınızdaki tüm düşmanlara inanılmaz bir korku salacak kırmızı bir ışık yayacaktır. Bu etki o kadar büyüktür ki, düşmanlar hızla tüm zindandan kaçmaya çalışacak ve bir daha asla görünmeyeceklerdir! Tıpkı korku gibi, bu etki de zamanla veya düşmana saldırıldığında sona erebilir. Patronlar gibi güçlü iradeli düşmanlar ise bunun yerine normal bir korku etkisine maruz kalacaklardır.
items.scrolls.exotic.scrollofdread.name=korku parşömeni
items.scrolls.exotic.scrollofenchantment.armor=Zırhınıza uygulamak istediğiniz bir sembol seçin.
items.scrolls.exotic.scrollofenchantment.cancel=iptal etmek
items.scrolls.exotic.scrollofenchantment.cancel_warn=İptal etmeniz yine de büyü parşömeninizi tüketecek, emin misiniz?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Hayır, fikrimi değiştirdim.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Evet, eminim.
items.scrolls.exotic.scrollofenchantment.desc=Bu parşömen, bir silaha veya zırha güçlü sihirli enerji aşılayacaktır. Okuyucu, hangi büyünün aşılanacağı konusunda bir dereceye kadar kontrol sahibidir.
items.scrolls.exotic.scrollofenchantment.inv_title=Bir eşyayı büyüleyin
items.scrolls.exotic.scrollofenchantment.name=büyü parşömeni
items.scrolls.exotic.scrollofenchantment.weapon=Silahınıza uygulamak istediğiniz bir büyü seçin.
items.scrolls.exotic.scrollofforesight.desc=Bu parşömeni okuduktan sonra, yakındaki arazinin detayları okuyucunun zihnine kristal berraklığında sürekli olarak aktarılacaktır. Bu etki oldukça uzun bir süre devam eder ve tüm gizli kapıları veya tuzakları ortaya çıkararak aramayı gereksiz kılar.
items.scrolls.exotic.scrollofforesight.name=öngörü parşömeni
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=İptal işlemi yine de dönüşüm parşömeninizi tüketecek, emin misiniz?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Dönüştürülecek bir yetenek seçin.
items.scrolls.exotic.scrollofmetamorphosis.desc=Bu parşömen, eşyaya değil, kullanan kişiye uygulanacak güçlü bir dönüşüm büyüsü içerir. Bu parşömenin büyüsü, bir yeteneği seçmenize ve onu farklı kahraman sınıflarından aynı seviyedeki beş yetenekten biriyle değiştirmenize olanak tanır! Bu etki yalnızca sınıf yeteneklerine uygulanabilir, alt sınıflardan veya zırh yeteneklerinden elde edilen yeteneklere uygulanamaz. Kullanamayacağınız yetenekler seçenek olarak sunulmayacaktır.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=başkalaşma yeteneği
items.scrolls.exotic.scrollofmetamorphosis.name=başkalaşım parşömeni
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Değişime uğramış yeteneğinizin yerine yeni bir yetenek seçin.
items.scrolls.exotic.scrollofmysticalenergy.desc=Bu parşömen içinde hapsolmuş ham büyülü güç, serbest bırakıldığında, kullanıcının donattığı eserleri zamanla şarj edecektir.
items.scrolls.exotic.scrollofmysticalenergy.name=mistik enerji parşömeni
items.scrolls.exotic.scrollofpassage.desc=Bu parşömen üzerindeki büyü, okuyanı anında bir üst kattaki en yakın bölgeye ışınlar. Bir dükkana hızlıca ulaşmak için çok kullanışlı.
items.scrolls.exotic.scrollofpassage.name=geçiş parşömeni
items.scrolls.exotic.scrollofprismaticimage.desc=Bu parşömen üzerindeki büyü, okuyucunun renkli, hayali bir ikizini yaratacaktır. Bu prizmatik görüntü, okuyucunun daha zayıf bir klonu gibi davranır; benzer savunmaya sahip ancak daha düşük can ve hasara sahiptir. Prizmatik görüntü, düşmanlar mevcut olduğunda kendini gösterecek ve okuyucuyu savunmaya çalışacaktır. Eğer zaten bir prizmatik görüntü varsa, bu parşömeni kullanmak onu tamamen iyileştirecektir.
items.scrolls.exotic.scrollofprismaticimage.name=prizmatik görüntü rulosu
items.scrolls.exotic.scrollofpsionicblast.desc=Bu parşömen, tüm görünür varlıkların zihinlerini yok etmek için yönlendirilebilen inanılmaz yıkıcı bir enerji içerir. Ancak önemli bir geri bildirim söz konusudur ve okuyucu da zarar görecek, kör olacak ve zayıflayacaktır. Parşömen ne kadar çok hedefi vurursa, alınan kendi kendine zarar o kadar az olur.
items.scrolls.exotic.scrollofpsionicblast.name=psiyonik patlama parşömeni
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psiyonik Patlama zihninizi paramparça eder...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Bu yaratık, bir siren şarkısı parşömeninin büyüsüyle büyülenmiştir. Büyülenmiş karakter kalıcı olarak müttefikiniz olur ve karşılaştığı tüm düşmanlarla savaşır.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=büyülenmiş
items.scrolls.exotic.scrollofsirenssong.cancel=Bir hedef seçmelisiniz.
items.scrolls.exotic.scrollofsirenssong.desc=Bu parşömeni okumak, hedef alınan düşmanı büyüleyecek ve onu kalıcı olarak müttefike dönüştürecek büyüleyici bir melodi yayar! Bunu duyan diğer düşmanlar geçici olarak büyülenir. Özellikle güçlü düşmanlar büyülenme etkisine direnebilir ve bunun yerine büyülenirler.
items.scrolls.exotic.scrollofsirenssong.name=deniz kızının şarkısının parşömeni
items.scrolls.exotic.scrollofsirenssong.no_target=Parşömen hedef belirtmeden etkinleşir.
items.scrolls.exotic.scrollofsirenssong.prompt=Bir hedef seçin
items.scrolls.inventoryscroll.no=Hayır, fikrimi değiştirdim.
items.scrolls.inventoryscroll.warning=Bu kaydırma kullanımını gerçekten iptal etmek istiyor musunuz? Kaydırma daha önce tanımlanmadığı için yine de kullanılacaktır.
items.scrolls.inventoryscroll.yes=Evet, eminim.
items.scrolls.scroll$placeholder.name=taslak
items.scrolls.scroll.ac_read=OKUMAK
items.scrolls.scroll.berkanan=BERKANAN parşömeni
items.scrolls.scroll.blinded=Gözleriniz kapalıyken bir parşömen okuyamazsınız.
items.scrolls.scroll.cursed=Lanetli büyü kitabınız bu parşömenin büyüsünü kullanmanızı engelliyor! Ancak laneti kaldırma parşömeni yine de işe yarayabilir...
items.scrolls.scroll.gyfu=GYFU'nun parşömeni
items.scrolls.scroll.isaz=ISAZ'ın parşömeni
items.scrolls.scroll.kaunan=KAUNAN'ın parşömeni
items.scrolls.scroll.laguz=LAGUZ'un parşömeni
items.scrolls.scroll.mannaz=MANNAZ'ın parşömeni
items.scrolls.scroll.naudiz=NAUDIZ'in parşömeni
items.scrolls.scroll.no_magic=Büyüye karşı bağışıklığınız varken bir parşömeni okuyamazsınız.
items.scrolls.scroll.odal=ODAL'ın parşömeni
items.scrolls.scroll.raido=RAIDO'nun parşömeni
items.scrolls.scroll.sowilo=SOWILO'nun parşömeni
items.scrolls.scroll.tiwaz=TIWAZ'ın parşömeni
items.scrolls.scroll.unknown_desc=Bu parşömen okunamayan yazılarla kaplı ve başlığında %s rünü var. Sesli okunursa ne olacağını kim bilir?
items.scrolls.scroll.yngvi=YNGVI'nin parşömeni
items.scrolls.scrollofidentify.desc=Tek bir eşyanın tüm sırlarını kalıcı olarak ortaya çıkarır.
items.scrolls.scrollofidentify.inv_title=Bir öğeyi tanımlayın
items.scrolls.scrollofidentify.it_is=Öğeniz tanımlandı: %s.
items.scrolls.scrollofidentify.name=tanıma parşömeni
items.scrolls.scrolloflullaby.desc=Rahatlatıcı bir melodi, görüş alanınızdaki tüm canlıları derin bir uykuya daldıracak ve size kaçma veya onlara sürpriz bir saldırı düzenleme şansı verecektir.
items.scrolls.scrolloflullaby.name=ninni parşömeni
items.scrolls.scrolloflullaby.sooth=Parşömen sakinleştirici bir melodi çalıyor. Çok uykunuz geliyor.
items.scrolls.scrollofmagicmapping.desc=Bu parşömen okunduğunda, kristal berraklığında bir görüntü hafızanıza kazınacak, seviyenin kesin düzenini size bildirecek ve tüm gizli sırları ortaya çıkaracaktır. Eşyaların ve yaratıkların yerleri bilinmez kalacaktır.
items.scrolls.scrollofmagicmapping.layout=Artık kat planını biliyorsunuz.
items.scrolls.scrollofmagicmapping.name=sihirli haritalama parşömeni
items.scrolls.scrollofmirrorimage.copies=Parşömen, sizin ayna görüntünüzü oluşturur.
items.scrolls.scrollofmirrorimage.desc=Bu parşömen üzerindeki büyü, okuyucunun hayali ikizlerini yaratacak ve bu ikizler düşmanlarını kovalayacaktır.
items.scrolls.scrollofmirrorimage.name=ayna görüntüsü parşömeni
items.scrolls.scrollofmirrorimage.no_copies=Parşömen sizin aynınızın ayna görüntüsünü oluşturmaya çalışıyor, ancak bu görüntülerin gidecek bir yeri yok.
items.scrolls.scrollofrage.desc=Bu parşömen sesli okunduğunda, tüm düşmanları okuyucuya çeken ve yakındakileri öfkelendiren büyük bir kükreme çıkaracaktır.
items.scrolls.scrollofrage.name=öfke parşömeni
items.scrolls.scrollofrage.roar=Parşömen, zindanın her yerinde yankılanan öfke dolu bir kükreme yayıyor!
items.scrolls.scrollofrecharging.desc=Bu parşömen içinde saklı olan ham büyülü güç, serbest bırakıldığında, okuyucunun tüm sihirli değneklerini tam gücüne kavuşturacaktır.
items.scrolls.scrollofrecharging.name=yenileme parşömeni
items.scrolls.scrollofrecharging.surge=Vücudunuzda ani bir enerji dalgası belirir ve değneklerinizi canlandırır!
items.scrolls.scrollofremovecurse.cleansed=Eşyanız arındırıcı bir ışıkla parlıyor ve kötücül enerji dağılıyor!
items.scrolls.scrollofremovecurse.desc=Bu parşömen üzerindeki büyü, okuyucunun silahından, zırhından, yüzüklerinden ve taşıdığı eşyalardan, bunları çıkarmasını engelleyebilecek her türlü kötü büyüyü anında kaldıracaktır.
items.scrolls.scrollofremovecurse.inv_title=Bir öğeyi temizleyin
items.scrolls.scrollofremovecurse.name=laneti kaldırma parşömeni
items.scrolls.scrollofremovecurse.not_cleansed=Eşyanız arındırıcı bir ışıkla parlıyor, ancak hiçbir şey olmuyor.
items.scrolls.scrollofremovecurse.spirit=Sizin parşömeniniz, azap çeken ruhu özgürleştiriyor!
items.scrolls.scrollofretribution.blast=Parşömen içinden güçlü bir büyülü enerji fışkırıyor!
items.scrolls.scrollofretribution.desc=Bu parşömen, okuyucunun çektiği acıyı dışarıya bir güç patlaması olarak yönlendiren yıkıcı bir enerji içerir. Okuyucu ne kadar zayıfsa, o kadar fazla hasar verecektir. Çok düşük sağlık seviyesinde bile bu parşömen çoğu düşmanı anında öldürebilir. Ancak parşömeni kullanmak kullanıcıya zarar verir, onu kör eder ve zayıflatır.
items.scrolls.scrollofretribution.name=intikam parşömeni
items.scrolls.scrollofteleportation.cant_reach=Oraya ışınlanamazsın.
items.scrolls.scrollofteleportation.desc=Bu parşömen üzerindeki büyü, okuyucuyu anında zindan katındaki rastgele bir yere ışınlar. Tehlikeli bir durumdan kaçmak için kullanılabilir, ancak şanssız okuyucu kendini daha da tehlikeli bir yerde bulabilir.
items.scrolls.scrollofteleportation.name=ışınlanma parşömeni
items.scrolls.scrollofteleportation.no_tele=Işınlanma büyüsü başarısız oldu.
items.scrolls.scrollofteleportation.prompt=Işınlanmak istediğiniz yeri seçin.
items.scrolls.scrollofteleportation.tele=Bir anda seviyenin başka bir yerine ışınlandınız.
items.scrolls.scrollofterror.desc=Görüş alanınızdaki tüm yaratıkları korkuya boğacak kırmızı bir ışık parlaması olacak ve hepsi dönüp kaçacak. Kaçan bir düşmana saldırmak bu etkiyi ortadan kaldıracaktır.
items.scrolls.scrollofterror.many=Parşömen parlak bir kırmızı ışık saçıyor ve canavarlar kaçıyor!
items.scrolls.scrollofterror.name=terör parşömeni
items.scrolls.scrollofterror.none=Parşömen, göz alıcı bir kırmızı ışık yayıyor.
items.scrolls.scrollofterror.one=Parşömen parlak bir kırmızı ışık yayar ve %s kaçar!
items.scrolls.scrolloftransmutation.desc=Bu parşömen güçlü dönüşüm büyüsü içerir. Uygun bir eşya üzerinde kullanıldığında, onu aynı türden farklı bir eşyaya dönüştürür. Büyü, yükseltmeleri, büyüleri ve sembolleri bile korur. Parşömenler ve iksirler egzotik eşdeğerlerine, egzotik iksirler de parşömenlere dönüştürülür.
items.scrolls.scrolloftransmutation.inv_title=Bir eşyayı dönüştürün
items.scrolls.scrolloftransmutation.morph=Eşyanız bambaşka bir şeye dönüşüyor!
items.scrolls.scrolloftransmutation.name=dönüşüm parşömeni
items.scrolls.scrolloftransmutation.nothing=İlginç hiçbir şey olmuyor.
items.scrolls.scrollofupgrade.desc=Bu parşömen tek bir eşyayı yükselterek kalitesini artıracaktır. Bir asa güç ve kullanım sayısı bakımından artacak; bir silah daha fazla hasar verecek veya hedefi daha sık bulacak; bir zırh ek darbeleri savuşturacak; bir yüzüğün takan kişi üzerindeki etkisi yoğunlaşacaktır. Silahlar ve zırhlar ayrıca daha az güç gerektirecek ve eşya üzerindeki tüm lanetler kalkacaktır.
items.scrolls.scrollofupgrade.inv_title=Bir öğeyi yükseltin
items.scrolls.scrollofupgrade.name=yükseltme parşömeni
items.scrolls.scrollofupgrade.remove_curse=Yükseltme parşömeni, eşyanızdaki laneti temizler!
items.scrolls.scrollofupgrade.weaken_curse=Yükseltme parşömeni, eşyanız üzerindeki laneti zayıflatır.
items.spells.alchemize$wndalchemizeitem.energize=%d enerjisine dönüş
items.spells.alchemize$wndalchemizeitem.energize_1=1'i %d enerjisine dönüştürün
items.spells.alchemize$wndalchemizeitem.energize_all=Her şeyi %d enerjisine dönüştürün
items.spells.alchemize$wndalchemizeitem.sell=%dg'ye dönüş
items.spells.alchemize$wndalchemizeitem.sell_1=1'i %dg'ye çevirin
items.spells.alchemize$wndalchemizeitem.sell_all=Hepsini %dg'ye dönüştürün
items.spells.alchemize.desc=Bu büyü, simya kazanında bulunanlara benzer dönüştürücü güçler içerir. Her kullanım, kullanıcının bir eşyayı (veya eşya yığınını) altına veya simya enerjisine dönüştürmesine olanak tanır. İksirleri veya parşömenleri enerjiye dönüştürmek, onları tanımlamayı bile sağlar! Alchemize büyüsünün birkaç kullanımı dükkanlarda satılmaktadır, ancak çok daha fazlası bir tohum, rün taşı ve biraz simya enerjisi birleştirilerek simya yoluyla yapılabilir.
items.spells.alchemize.name=simya
items.spells.alchemize.prompt=Bir Eşyayı Simyaya Dönüştürmek
items.spells.beaconofreturning.creatures=Çevredeki yaratıkların psişik aurası şu anda ışınlanmanıza izin vermiyor.
items.spells.beaconofreturning.desc=Bu karmaşık büyü, kullanıcıya mesafeden bağımsız olarak önceden belirlenmiş bir konuma geri dönme yeteneği kazandırır. Büyü yalnızca geri dönüş sırasında tüketilir, istediğiniz kadar tekrarlanabilir, ancak yalnızca en son ayarlandığı konumu hatırlar.
items.spells.beaconofreturning.desc_set=Bu işaret feneri %d katında bir yere yerleştirildi.
items.spells.beaconofreturning.name=geri dönüşün işareti
items.spells.beaconofreturning.preventing=Bu yerin güçlü büyülü enerjisi, büyüyü kullanmanızı engelliyor!
items.spells.beaconofreturning.set=İşaretleyici bulunduğunuz konuma yerleştirildi.
items.spells.beaconofreturning.wnd_body=Ayar, işaretçinin daha önce ayarlandığı konumu geçersiz kılacaktır. Geri dönmek, en son ayarladığınız konuma geri dönecek ve büyünün bir kullanımını tüketecektir.
items.spells.beaconofreturning.wnd_return=GERİ DÖNMEK
items.spells.beaconofreturning.wnd_set=AYARLAMAK
items.spells.curseinfusion.desc=Bu büyü, bir ekipman parçasına DM-300'de bulunan aynı güçlü kötücül büyüyü aşılar. Kullanıldığı eşya anında lanetlenir ve sahip olabileceği herhangi bir büyü veya glif geçersiz kılınır. Silahlar, zırhlar ve asalar söz konusu olduğunda, eşya lanetlenmenin yanı sıra yükseltmeler de kazanır. Lanet aşılama yükseltmeleri birikmez ve eşya lanetsiz hale gelirse yükseltmeler kaybolur. Birden fazla lanet aşılama, bir silah veya zırh üzerindeki laneti değiştirmek için de kullanılabilir.
items.spells.curseinfusion.inv_title=Bir eşyayı lanetlemek
items.spells.curseinfusion.name=lanet aşısı
items.spells.magicalinfusion.desc=Bu büyü, yükseltme parşömeniyle aynı sihirli güce sahiptir, ancak daha istikrarlı bir biçimde. Normal şekilde bir eşyayı yükseltmenin yanı sıra, hiçbir zaman bir büyüyü, sembolü veya laneti silmez.
items.spells.magicalinfusion.infuse=Eşyanız gizemli enerjiyle donatılmıştır!
items.spells.magicalinfusion.inv_title=Bir ürüne bir şeyler katın.
items.spells.magicalinfusion.name=sihirli infüzyon
items.spells.magicalporter.desc=Bu büyü, üzerine uygulandığı herhangi bir eşyayı sihirli bir şekilde başka bir yere taşır. Ancak bir tüccarın fenerinden farklı olarak, eşyalar bir sonraki patron katının girişine taşınacaktır.
items.spells.magicalporter.inv_title=Bir öğeyi taşı
items.spells.magicalporter.name=sihirli kapıcı
items.spells.magicalporter.nowhere=Öğeyi aktarabileceğiniz bir yer yok.
items.spells.phaseshift.desc=Bu kaotik büyü, hedef alınan herhangi bir karakteri mevcut kattaki rastgele bir konuma ışınlayacak ve önemli bir süre boyunca sersemletecektir. Güçlü düşmanlar sersemletme etkisine karşı koyabilecektir. Bu büyü, bir hedefe veya kullanıcının kendisine yöneltilebilir.
items.spells.phaseshift.name=faz kayması
items.spells.phaseshift.no_target=Oraya ışınlanacak bir şey yok.
items.spells.reclaimtrap.desc=Bu büyü, DM-300'ün mekanik enerjisinin kalıntılarını içerir. Aktif bir tuzağa uygulandığında, tuzağın gücü size bağlanır ve bu sayede büyüyü tekrar kullanarak bu gücü dışarı atabilir ve tuzağın etkisini istediğiniz herhangi bir yerde tetikleyebilirsiniz. Ancak, bazı tuzaklar her yerde çalışmayabilir ve aynı anda yalnızca bir tuzak saklanabilir.
items.spells.reclaimtrap.desc_trap=Büyü şu anda _%s_'yu tetiklemeye hazır.
items.spells.reclaimtrap.name=geri kazanma tuzağı
items.spells.reclaimtrap.no_trap=Orada hiçbir tuzak yok.
items.spells.recycle.desc=Bu büyü, daha zayıf bir dönüşüm büyüsü türü içerir. Ekipmanlar üzerinde işe yaramasa da, bu büyü bir parşömeni, iksiri, tohumu, rün taşını veya ucu sivri oku aynı türden rastgele bir eşyaya dönüştürür.
items.spells.recycle.inv_title=Bir eşyayı geri dönüştürün
items.spells.recycle.name=geri dönüşüm
items.spells.recycle.recycled=Eşyanız şu şekilde geri dönüştürüldü: %s.
items.spells.spell.ac_cast=DÖKÜM
items.spells.spell.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.spells.spell.no_magic=Büyüye karşı bağışıklığınız varken büyü yapamazsınız.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Bu büyü, yapımında kullanılan elemental közlerin enerjisini yönlendirir ve size dost bir elementali savaşmanız için çağırmanıza olanak tanır! Bir seferde yalnızca bir elemental çağrılabilir, ancak büyüyü yeniden uygulayarak elementali hiçbir ücret ödemeden size geri döndürebilirsiniz.
items.spells.summonelemental.desc_chaos=Büyü şu anda kaotik enerji yayıyor ve bir kaos elementi çağıracak. Farklı bir eşyaya büyü uygulayabilirsiniz, ancak büyü mevcut etkisini kaybedecektir.
items.spells.summonelemental.desc_fire=Büyü şu anda dokunulduğunda sıcaktır ve bir _ateş elementi_ çağıracaktır. Farklı bir eşyaya büyü uygulayabilirsiniz, ancak büyü mevcut etkisini kaybedecektir.
items.spells.summonelemental.desc_frost=Büyü şu anda dokunulduğunda soğuktur ve bir _buz elementi_ çağıracaktır. Farklı bir eşyaya büyü uygulayabilirsiniz, ancak büyü mevcut etkisini kaybedecektir.
items.spells.summonelemental.desc_newborn=Büyü şu anda güçlendirilmemiş durumda ve menzilli saldırısı olmayan yeni doğmuş bir elementi çağıracak. Büyüyü güçlendirmek için tanımlanmış bir sıvı alev iksiri, buz iksiri, şarj etme parşömeni veya dönüşüm parşömeni ile güçlendirebilirsiniz; bu sayede gelecekteki çağrılar tam güçte bir element olacaktır!
items.spells.summonelemental.desc_shock=Büyü şu anda statik enerji yayıyor ve bir _şok elementi_ çağıracak. Farklı bir eşyaya büyü ekleyebilirsiniz, ancak büyü mevcut etkisini kaybedecektir.
items.spells.summonelemental.imbue_prompt=Bir eşyaya özellik kazandırın
items.spells.summonelemental.name=element çağırmak
items.spells.targetedspell.inv_title=Bir ürüne bir şeyler katın.
items.spells.targetedspell.prompt=Bir hedef seçin
items.spells.telekineticgrab.cant_grab=Bunu yakalayamazsın.
items.spells.telekineticgrab.desc=Bu büyü, kullanan kişinin bir konumdaki tüm eşyaları veya düşmana saplanmış tüm fırlatılmış silahları uzaktan yakalamasına olanak tanır! Başkasına ait eşyaları veya sandık gibi kapları yakalamak için kullanılamaz.
items.spells.telekineticgrab.name=telekinetik yakalama
items.spells.telekineticgrab.no_target=Orada tutulacak bir şey yok.
items.spells.unstablespell.desc=Bu küçük siyah kare kristalin her yüzeyinde değişen runik semboller bulunmaktadır. \n\n Etkinleştirildiğinde, rastgele bir parşömen efekti tetikleyecektir. Parşömen efekti, görüş alanınızda düşmanlar varsa her zaman savaş odaklı, aksi takdirde her zaman savaş dışı odaklı olacaktır.
items.spells.unstablespell.name=kararsız büyü
items.spells.wildenergy.desc=Bu büyü, DM-300'e güç veren lanetli enerjinin bir kısmını içerir. Kullanıldığında, asalarınızı ve takılı eşyalarınızı yeniden şarj ederken, rastgele bir lanetli asa etkisi de tetikler. Ancak, bu lanetli büyünün hangi yöne doğru ilerleyeceğini seçebilirsiniz.
items.spells.wildenergy.name=vahşi enerji
items.stones.inventorystone.ac_use=KULLANMAK
items.stones.runestone$placeholder.name=runestone
items.stones.runestone.discover_hint=Bu eşyayı zindanda rastgele bulabilir veya simya yoluyla üretebilirsiniz.
items.stones.stoneofaggression$aggression.desc=Manipülatif büyü, yakındaki tüm düşmanların bu karaktere saldırmayı tercih etmesini sağlıyor.\n\nKalan tur sayısı: %s.
items.stones.stoneofaggression$aggression.name=hedefli
items.stones.stoneofaggression.desc=Bu taş bir müttefike veya düşmana atıldığında, yakındaki tüm düşmanlar kısa bir süre için o karaktere saldırmayı tercih edecektir. Ancak patron düşmanlar bu etkiye karşı koyabilir, bu da etki süresini önemli ölçüde azaltır ve yardımcılarının saldırılarından daha az hasar almalarını sağlar.
items.stones.stoneofaggression.name=saldırganlık taşı
items.stones.stoneofaugmentation$wndaugment.cancel=Boş ver
items.stones.stoneofaugmentation$wndaugment.choice=Neyi geliştirmek istersiniz?
items.stones.stoneofaugmentation$wndaugment.damage=Zarar
items.stones.stoneofaugmentation$wndaugment.defense=Savunma
items.stones.stoneofaugmentation$wndaugment.evasion=Kaçınma
items.stones.stoneofaugmentation$wndaugment.none=Augmentasyonu Kaldır
items.stones.stoneofaugmentation$wndaugment.speed=Hız
items.stones.stoneofaugmentation.desc=Bu rün taşı, bir özelliği diğerinin pahasına artırmak için ekipmanı güçlendirebilen güçlü bir sihir içerir. \n\n Bir silaha takmak, hızı veya hasarı artırmanıza olanak tanır. Fırlatılan silahlar da hızlarıyla orantılı olarak dayanıklılık kazanır veya kaybeder. \n\n Zırha takmak, savunmayı veya kaçınmayı artırmanıza olanak tanır.
items.stones.stoneofaugmentation.discover_hint=Bu eşyayı bir dükkandan satın alabilir veya simya yoluyla üretebilirsiniz.
items.stones.stoneofaugmentation.inv_title=Bir öğeyi artırın
items.stones.stoneofaugmentation.name=büyütme taşı
items.stones.stoneofblast.desc=Bu rün taşı, atıldığı yerde anında patlayacaktır. Tıpkı bir bomba gibi, patlama yakındaki her şeye hasar verecektir.
items.stones.stoneofblast.name=patlama taşı
items.stones.stoneofblink.desc=Bu rün taşı, kullanıcıyı atıldığı yere ışınlayacaktır.
items.stones.stoneofblink.name=göz kırpma taşı
items.stones.stoneofclairvoyance.desc=Bu taş, atıldığı yerin etrafındaki çok geniş bir alandaki tüm karoları anında ortaya çıkaracaktır. Etkisi duvarların içinden bile geçecektir.
items.stones.stoneofclairvoyance.name=kehanet taşı
items.stones.stoneofdeepsleep.desc=Bu taş düşmana atıldığında, onu derin bir büyülü uykuya sokar. Büyülü uykuya dalmış düşmanlar, rahatsız edilene kadar sonsuza dek uyuyacaklardır.
items.stones.stoneofdeepsleep.name=derin uyku taşı
items.stones.stoneofdetectmagic.desc=Bu rün taşı, bir eşyayı etkileyen büyüyü tespit edebiliyor. Bu taşı tanımlanamayan bir eşya üzerinde kullanmak, kötü niyetli bir lanetten mi yoksa büyü veya yükseltme gibi olumlu bir büyüden mi etkilendiğini size söyleyecektir.
items.stones.stoneofdetectmagic.detected_bad=Bu eşyanın kötü niyetli bir büyü tarafından etkilendiğini tespit ettiniz!
items.stones.stoneofdetectmagic.detected_both=Bu eşyanın hem olumlu hem de kötü niyetli büyülerden etkilendiğini tespit ettiniz!
items.stones.stoneofdetectmagic.detected_good=Bu eşyanın üzerinde olumlu bir sihir etkisi olduğunu tespit ettiniz!
items.stones.stoneofdetectmagic.detected_none=Bu eşyayı etkileyen herhangi bir sihir tespit etmediniz.
items.stones.stoneofdetectmagic.inv_title=Bir öğeyi tespit et
items.stones.stoneofdetectmagic.name=sihir tespit taşı
items.stones.stoneofdisarming.desc=Bu rün taşı, zindan boyunca gizlenmiş kötü niyetli tuzakları etkisiz hale getirebilen bir sihir içerir. Atıldığı alanda en fazla 9 tuzağı etkisiz hale getirecektir.
items.stones.stoneofdisarming.name=silahsızlandırma taşı
items.stones.stoneofenchantment.armor=Zırhınız karanlıkta parlıyor!
items.stones.stoneofenchantment.desc=Bu rün taşı büyüleyici bir sihir içeriyor. Bir yükseltme parşömeninin aksine, bir eşyanın doğrudan gücünü artırmaz, bunun yerine bir silaha veya zırha bir büyü aşılayarak ona yeni bir güç kazandırır.
items.stones.stoneofenchantment.inv_title=Bir eşyayı büyüleyin
items.stones.stoneofenchantment.name=büyü taşı
items.stones.stoneofenchantment.weapon=Silahınız karanlıkta parlıyor!
items.stones.stoneoffear.desc=Bu taş bir karaktere atıldığında, karakter dehşete kapılacak, arkasını dönüp kaçacaktır. Kaçan bir karaktere saldırmak, etkiyi kısaltacaktır.
items.stones.stoneoffear.name=korku taşı
items.stones.stoneofflock.desc=Bu rün taşı, atıldığı yerin çevresine kısa bir süre için sihirli koyunlar çağırır.
items.stones.stoneofflock.name=sürü taşı
items.stones.stoneofintuition$wndguess.break=Sezgi taşınız toz haline geliyor...
items.stones.stoneofintuition$wndguess.correct=Doğru. Ürünün türü belirlendi!
items.stones.stoneofintuition$wndguess.incorrect=Tahmininiz yanlıştı.
items.stones.stoneofintuition$wndguess.text=Tanımlanamayan nesnenin türünü tahmin edin. Doğru tahmin ederseniz, türü belirlenecektir!
items.stones.stoneofintuition.break_info=Sezgi taşlarını bir tanesi kırılmadan önce iki kez kullanabilirsiniz, sonraki kullanımınızda taş tüketilmez.
items.stones.stoneofintuition.break_warn=Daha önce sezgi taşı kullandınız, bu nedenle bir sonraki kullanımınız bir taşı tüketecektir.
items.stones.stoneofintuition.desc=Bu rün taşı, tanımlama parşömenlerinde bulunan büyünün daha zayıf bir versiyonunu içerir. Bir eşyayı doğrudan tanımlamak yerine, sezgilerinize dayanarak çalışır ve bir iksirin, parşömenin veya yüzüğün türünü tahmin ederek belirlemenize olanak tanır.
items.stones.stoneofintuition.inv_title=Bir öğe seçin
items.stones.stoneofintuition.name=sezgi taşı
items.stones.stoneofshock.desc=Bu rün taşı, yakındaki tüm hedefleri kısa süreliğine sersemleten bir elektrik enerjisi patlaması yayar ve isabet eden her hedef için fırlatıcıya asa şarjı kazandırır.
items.stones.stoneofshock.name=şok taşı
items.stylus.ac_inscribe=KAZIMAK
items.stylus.cursed=Kalemin büyüsü lanetli zırh üzerinde işe yaramaz.
items.stylus.desc=Bu gizemli kalem, koyu renkli ve çok sert bir taştan yapılmıştır. Bunu kullanarak zırhınıza büyülü bir sembol kazıyabilirsiniz, ancak hangi sembolü seçeceğinize siz karar veremezsiniz, kalem sizin yerinize karar verecektir.
items.stylus.identify=Öncelikle o zırhın lanetli olup olmadığını tespit etmelisiniz.
items.stylus.inscribed=Zırhınızın üzerine kalemle yazı yazdınız.
items.stylus.name=gizemli kalem
items.stylus.prompt=Bir zırh seçin
items.tengusmask.ac_wear=GİYMEK
items.tengusmask.desc=Bu maske, Tengu ölürken yüzünden düştü; ondan yayılan muazzam bir sihirli gücü hissedebiliyorsunuz. Maske, Tengu'nun güç kaynağı mıydı? Maskeyi taktığınızda, muazzam gücü size aktarılacak ve kahramanınız için bir alt sınıf seçmenizi sağlayacak. Hangi alt sınıfı seçeceksiniz?
items.tengusmask.discover_hint=Bu eşyayı belirli düşmanlardan düşen bir ganimet olarak elde edebilirsiniz.
items.tengusmask.name=Tengu'nun maskesi
items.tengusmask.used=Gücü size aktıkça maske parçalanıyor!
items.torch.ac_light=IŞIK
items.torch.desc=Macera oyunlarının vazgeçilmezi olan meşale, zindan karanlığa gömüldüğünde yol göstermeye yardımcı olabilir.
items.torch.name=meşale
items.trinkets.chaoticcenser.desc=Simya kazanında bir süre kaldıktan sonra, bu tütsü yakma kabı kendi kendine duman üretmeye başlıyor! Bu gazlar birikiyor ve yarı rastgele aralıklarla düşmanlara doğru püskürtülüyor. Her türlü gazı üretebiliyor gibi görünüyor, ancak tütsü kabı aktif hale gelmeden hemen önce bir uyarı alacaksınız.
items.trinkets.chaoticcenser.name=kaotik buhurdanlık
items.trinkets.chaoticcenser.spew=Tütsü kabınız az sonra şu miktarı püskürtecek: %s.
items.trinkets.chaoticcenser.stats_desc=Mevcut seviyesinde, bu aksesuar yaklaşık her _%d_ turda bir düşmanın yakınında zararlı bir gaz oluşturacaktır. Gazlar yalnızca düşmanlar mevcut olduğunda ortaya çıkar. Daha yüksek seviyelerde bu gazların egzotik ve güçlü olma olasılığı daha yüksektir.
items.trinkets.chaoticcenser.typical_stats_desc=Bu tılsım genellikle her _%d_ turda bir düşmanın yakınında zararlı bir gaz oluşturur. Gazlar yalnızca düşmanlar mevcut olduğunda ortaya çıkar. Daha yüksek seviyelerde bu gazların egzotik ve güçlü olma olasılığı daha yüksektir.
items.trinkets.crackedspyglass.desc=Bu el tipi teleskop, ön merceğindeki çatlak olmasaydı, mükemmel ve hassas bir işçiliğin göstergesi olurdu. Dürbün, zindandaki yeni eşyaları ortaya çıkararak size yardımcı oluyor gibi görünüyor, ancak kusuru nedeniyle ortaya çıkan eşyaları görmek oldukça zor!
items.trinkets.crackedspyglass.name=çatlak dürbün
items.trinkets.crackedspyglass.stats_desc=Mevcut seviyesinde, bu tılsımın patron olmayan her katta fazladan gizli bir eşya oluşturma şansı _%1$s%%'dir_.
items.trinkets.crackedspyglass.stats_desc_upgraded=Mevcut seviyesinde, bu tılsımın her patron olmayan katta fazladan bir gizli eşya oluşturma olasılığı _100%%_ ve ikinci bir fazladan gizli eşya oluşturma olasılığı _%1$s%%_'dir.
items.trinkets.crackedspyglass.typical_stats_desc=Bu tılsımın genellikle patron olmayan her katta fazladan gizli bir eşya oluşturma şansı _%1$s%%'dir_.
items.trinkets.dimensionalsundial.desc=Bu küçük el tipi güneş saati, dik tutmasanız bile zindanın derinliklerinde bir şekilde gölge oluşturabiliyor. Daha da garip olanı, gölgenin konumunun bu dünyadaki güneşle hiçbir ilişkisi yok gibi görünüyor. Gölge oluşmadığında ise güneş saati tehlikeyi kendine çekiyor gibi.
items.trinkets.dimensionalsundial.name=boyutlu güneş saati
items.trinkets.dimensionalsundial.stats_desc=Mevcut seviyesinde, bu tılsım gerçek hayatta gündüz (sabah 8'den akşam 8'e kadar) düşmanların ortaya çıkma oranını _%1$d%%_ kadar azaltacak ve gece (akşam 8'den sabah 8'e kadar) düşmanların ortaya çıkma oranını _%2$d%%_ kadar artıracaktır.
items.trinkets.dimensionalsundial.typical_stats_desc=Bu tılsım genellikle gerçek hayatta gündüz (sabah 8'den akşam 8'e kadar) düşmanların ortaya çıkma oranını _%1$d%%_ kadar azaltır ve gece (akşam 8'den sabah 8'e kadar) düşmanların ortaya çıkma oranını _%2$d%%_ kadar artırır.
items.trinkets.dimensionalsundial.warning=Güneş saatiniz gölge düşürmüyor, bu sizi huzursuz ediyor.
items.trinkets.exoticcrystals.desc=Bu küçük pembe kristaller, simya enerjisi kristallerine benzer bir şekle sahip. Doğrudan enerji için kullanılamasalar da, bulduğunuz iksirleri ve parşömenleri bir şekilde etkiliyor gibi görünüyorlar.
items.trinkets.exoticcrystals.name=egzotik kristaller
items.trinkets.exoticcrystals.stats_desc=Mevcut seviyesinde bu aksesuar, iksir veya parşömen düşüşlerindeki _%s%%_ değerini egzotik eşdeğerleriyle değiştirecektir. Bu durum, güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.
items.trinkets.exoticcrystals.typical_stats_desc=Bu tılsım genellikle iksir veya parşömen düşüşlerindeki _%s%%_ değerini egzotik eşdeğerleriyle değiştirir. Bu, güç iksirlerini, yükseltme parşömenlerini veya tehlike odalarını çözmeye yardımcı olmak için üretilen eşyaları etkilemez.
items.trinkets.eyeofnewt.desc=Bu altın ve siyah semender gözü, yaygın bir malzeme olup, günümüzde bir süs eşyası haline getirilmiştir. Göz, görme yetinizi azaltırken, nesneleri farklı şekillerde görmenizi sağlıyor gibi görünüyor.
items.trinkets.eyeofnewt.name=semender gözü
items.trinkets.eyeofnewt.stats_desc=Mevcut seviyesinde bu tılsım görüş alanınızı _%1$s%%_ kadar azaltacak, ancak _%2$d_ kare içindeki düşmanlar üzerinde zihinsel görüş yeteneği de kazandıracaktır.
items.trinkets.eyeofnewt.typical_stats_desc=Bu tılsım genellikle görüş alanınızı _%1$s%%_ kadar azaltır, ancak aynı zamanda _%2$d_ kare içindeki düşmanlar üzerinde zihinsel görüş sağlar.
items.trinkets.ferrettuft.desc=İpek gibi beyaz bir gelincik tüyü tutamı, fiyonk şeklinde bağlanmış açık yeşil bir kurdeleyle bir arada tutuluyor. Gelincikler çeviklikleri, yaramazlıkları ve dürüstlükten yoksunluklarıyla bilinirler. Bu özelliklerin bir kısmı bu süs eşyasından da yansıyor gibi görünüyor ve yakındaki her şeyden kaçınmayı kolaylaştırıyor.
items.trinkets.ferrettuft.name=gelincik tüyü
items.trinkets.ferrettuft.stats_desc=Mevcut seviyesinde bu tılsım, tüm karakterlerin kaçınma oranını _%1$s%%_ kadar artıracaktır.
items.trinkets.ferrettuft.typical_stats_desc=Bu tılsım genellikle tüm karakterlerin kaçınma oranını _%1$s%%_ kadar artırır.
items.trinkets.mimictooth.desc=Bu büyük ve sivri diş, çok mutsuz bir taklitçiden çekilmiş olmalı. Zindandaki taklitçileri etkiliyor, daha sık ve tehlikeli hale getiriyor gibi görünüyor.
items.trinkets.mimictooth.name=taklit diş
items.trinkets.mimictooth.stats_desc=Mevcut seviyesinde bu tılsım, her türlü taklitçi yaratığı daha yaygın ve tespit edilmesi çok daha zor hale getirecek, ancak aynı zamanda düşürdükleri ganimet miktarını da artıracaktır. Her zindan katında ayrıca fazladan gizli bir abanoz taklitçi yaratık bulma olasılığı da artacaktır.
items.trinkets.mimictooth.typical_stats_desc=Bu tılsım genellikle her türlü taklitçi yaratığı daha yaygın ve tespit edilmesi çok daha zor hale getirecek, ancak aynı zamanda düşürdükleri ganimet miktarını da artıracaktır. Her zindan katında ayrıca fazladan gizli bir abanoz taklitçi yaratık bulma olasılığı da vardır.
items.trinkets.mossyclump.desc=Bu ıslak yosun yığını, ne kadar sıkarsanız sıkın nemini koruyor gibi görünüyor. Sanki zindanın kendisine sihirli bir şekilde bağlıymış gibi, bu da çimen ve suyun daha sık ortaya çıkmasını sağlıyor.
items.trinkets.mossyclump.name=yosunlu küme
items.trinkets.mossyclump.stats_desc=Mevcut seviyesinde bu tılsım, teması olmayan katların _%d%%_'sinin su veya çimle dolmasını sağlayacak.\n\nBu tılsımın yükseltilmesi daha fazla enerji gerektiriyor.
items.trinkets.mossyclump.typical_stats_desc=Bu süs eşyası genellikle temalı olmayan katların _%d%%_ kısmının su veya çimle dolmasını sağlar.\n\nBu süs eşyasının yükseltilmesi daha fazla enerji gerektirir.
items.trinkets.parchmentscrap.desc=Bu küçük parşömen parçası bir el yazmasından alınmış gibi görünüyor. Büyüsünün bir kısmını korumuş ve zindanda bulunan silah ve zırhları etkiliyor gibi görünüyor.
items.trinkets.parchmentscrap.name=parşömen parçası
items.trinkets.parchmentscrap.stats_desc=Mevcut seviyesinde bu tılsım, büyüler ve glifleri _%dx_ kadar yaygın, silah ve zırhlardaki lanetleri ise _%sx_ kadar yaygın hale getirecektir. Asa, yüzük veya eserlerdeki lanetler etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerji gerektirir.
items.trinkets.parchmentscrap.typical_stats_desc=Bu tılsım genellikle büyüleri ve sembolleri _%dx_ yaygın hale getirir ve silah ve zırhlardaki lanetleri _%sx_ yaygın hale getirir. Asa, yüzük veya eserlerdeki lanetler etkilenmez.\n\nBu tılsımın yükseltilmesi daha fazla enerji gerektirir.
items.trinkets.petrifiedseed.desc=Bu tohum, yavaş jeolojik süreçler veya sihir yoluyla fosilleşmiştir. Tohum, zindanın bitki örtüsünü sihirli bir şekilde etkiliyor gibi görünüyor ve zaman zaman bitki tohumlarının yerini runik taşlar alıyor.
items.trinkets.petrifiedseed.name=taşlaşmış tohum
items.trinkets.petrifiedseed.stats_desc=Mevcut seviyesinde bu tılsım, ezilmiş çimenlerin tohum yerine rün taşı düşürmesine neden olacak (_%1$s%%_) ve ayrıca yüksek çimenlerin daha sık eşya düşürmesine neden olacak (_%2$s%%_).
items.trinkets.petrifiedseed.typical_stats_desc=Bu tılsım genellikle ezilmiş çimenlerin tohum yerine runestone düşürmesine neden olur (_%1$s%%_) ve ayrıca yüksek çimenlerin daha sık eşya düşürmesine neden olur (_%2$s%%_).
items.trinkets.ratskull.desc=Bu ürkütücü obje, normal bir sıçanın kafatasından çok da büyük değil; bu da bu zindanda bir şekilde nadir bulunan bir şey. Kafatasının büyülü etkisi, zindanın daha nadir sakinlerini kendine çekiyor ve onların çok daha sık görünmelerini sağlıyor.
items.trinkets.ratskull.name=fare kafatası
items.trinkets.ratskull.stats_desc=Mevcut haliyle bu tılsım, nadir egzotik düşmanların _%dx_ ortaya çıkma olasılığını artıracaktır. Ancak kafatası, kristal taklitçilerini ve zırhlı heykelleri çekmede yalnızca yarı yarıya etkilidir.
items.trinkets.ratskull.typical_stats_desc=Bu tılsım genellikle nadir egzotik düşmanların (_%dx_) ortaya çıkma olasılığını artırır. Ancak kafatası, kristal taklitçilerini ve zırhlı heykelleri çekmede yalnızca yarı yarıya etkilidir.
items.trinkets.saltcube.desc=Bu büyük tuz kristali neredeyse mükemmel bir küp şeklinde kesilmişti ve bir şekilde çözünmek yerine simya kazanındaki suyun yarısını boşaltmayı başardı. Yediğiniz yiyecekleri sihirli bir şekilde kurutup koruyor, tokluk hissini uzatıyor, ancak aç kalmadığınızda sağlığınızın yenilenmesini de yavaşlatıyor gibi görünüyor.
items.trinkets.saltcube.name=tuz küpü
items.trinkets.saltcube.stats_desc=Mevcut seviyesinde bu tılsım, aç kalmadan önceki süreyi _%1$s%%_ kadar uzatacak, ancak kat kilitli değilse sağlık yenilenme hızınızı da _%2$s%%_ kadar azaltacaktır.
items.trinkets.saltcube.typical_stats_desc=Bu tılsım genellikle acıkmadan önceki süreyi _%1$s%%_ kadar uzatır, ancak zemin kilitli değilse sağlık yenilenme hızınızı da _%2$s%%_ kadar azaltır.
items.trinkets.shardofoblivion$thrownusetracker.desc=Yakın zamanda tanımlanamayan bir fırlatma silahı kullandınız; bu, bir süreliğine unutulma parçası için kullanılan tanımlanamayan ekipman parçası olarak sayılır.\n\nKalan tur sayısı: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Kimliği Belirsiz Fırlatılan Silah Kullanıldı
items.trinkets.shardofoblivion$wandusetracker.desc=Yakın zamanda tanımlanamayan bir asa kullandınız; bu, bir süreliğine Unutulmuşluk Parçası için kullanılmış tanımlanamayan ekipman parçası olarak sayılır.\n\nKalan tur sayısı: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Kimliği Belirsiz Asa Kullanıldı
items.trinkets.shardofoblivion.ac_identify=TANIMLAMAK
items.trinkets.shardofoblivion.desc=Simya kazanında kaynatıldıktan sonra, bu küçük lanetli metal parçası... hiçbir şeyden oluşmaya başladı? Işık etrafında bükülüyor gibi görünüyor ve elinizde tutmadığınızda havada asılı kalıyor. Parça, sihirli bir şekilde sizin cehaletinizden güç çekiyor gibi görünüyor, bu yüzden muhtemelen çok fazla düşünmemek en iyisi.
items.trinkets.shardofoblivion.identify=Eşyayı siz tanımladınız!
items.trinkets.shardofoblivion.identify_not_yet=O öğe henüz tanımlanmaya hazır değil.
items.trinkets.shardofoblivion.identify_prompt=Bir öğeyi tanımlayın
items.trinkets.shardofoblivion.identify_ready=Tanımlanmaya hazır bir öğe var: %s. Tanımlamak için Unutulmuşluk Parçanızı kullanın.
items.trinkets.shardofoblivion.identify_ready_worn=Artık yıpranmış eşyalarınızın tümü tanımlanmaya hazır. Eşyalarınızı tanımlamak için Unutulmuşluk Parçası'nı kullanın.
items.trinkets.shardofoblivion.name=unutulmuşluğun parçası
items.trinkets.shardofoblivion.stats_desc=Mevcut seviyesinde bu tılsım, taktığınız veya yakın zamanda kullandığınız tanımlanmamış her ekipman parçası için düşmanlardan düşen ganimet oranını 20%% artıracak ve maksimum _%d eşyaya_ kadar çıkaracaktır. Parça ayrıca ekipmanınızı tanımlamanızı engelleyecektir, ancak tanımlamaya hazır olan eşyaları manuel olarak tanımlamak için kullanılabilir.
items.trinkets.shardofoblivion.typical_stats_desc=Bu tılsım genellikle, taktığınız veya yakın zamanda kullandığınız tanımlanmamış her ekipman parçası için düşmanlardan düşen ganimet oranını 20%% artırır ve maksimum _%d eşyaya_ kadar çıkarır. Parça ayrıca ekipmanınızı tanımlamanızı engeller, ancak tanımlamaya hazır olan eşyaları manuel olarak tanımlamak için kullanılabilir.
items.trinkets.thirteenleafclover.desc=Bir şekilde simya kazanında kaynatılan bu yonca, fazladan bir sürü yaprak çıkarmış! Bu tılsımın şanslı mı yoksa şanssız mı olduğu pek belli değil, belki de bu tılsım şansınızı daha da kaotik hale getirecektir?
items.trinkets.thirteenleafclover.name=on üç yapraklı yonca
items.trinkets.thirteenleafclover.stats_desc=Mevcut seviyesinde bu tılsım, size o anın maksimum hasarı olan _%1$d%%_ ve minimum hasarı olan _%2$d%%_ kadar hasar vermenizi sağlayacaktır.
items.trinkets.thirteenleafclover.typical_stats_desc=Genellikle bu tılsım, sürenin maksimum hasarını _%1$d%%_ ve minimum hasarını _%2$d%%_ vermenize neden olur.
items.trinkets.trapmechanism.desc=Zindanın tuzaklarından birinin temel mekanizması, taşınabilmesi için zeminden özenle oyulmuştur. Zindanın kendisiyle sihirli bir şekilde bağlantılı gibi görünüyor; bu da tehlikeli arazinin daha sık görülmesine yol açarken, aynı zamanda bu tür arazilere olan yakınlığınızı da artırıyor.
items.trinkets.trapmechanism.name=tuzak mekanizması
items.trinkets.trapmechanism.stats_desc=Mevcut seviyesinde bu tılsım, teması olmayan katların _%1$d%%_ kısmının tuzaklarla veya uçurumlarla dolmasına neden olacak. Ek olarak, zindanın gizli tuzaklarının _%2$d%%_ kısmı görünür hale gelecek.
items.trinkets.trapmechanism.typical_stats_desc=Genellikle bu tılsım, temalı olmayan katların _%1$d%%_ kısmının tuzaklarla veya uçurumlarla dolmasına neden olur. Ek olarak, zindanın gizli tuzaklarının _%2$d%%_ kısmı görünür hale gelir.
items.trinkets.trinket$placeholder.name=biblo
items.trinkets.trinket.discover_hint=Bu eşya, simya yoluyla bir tılsım ürettiğinizde seçenekler arasında yer alma olasılığına sahiptir.
items.trinkets.trinketcatalyst$randomtrinket.desc=Yakındaki bir eşya, açamadığınız bir kesenin içinde sıkışmış durumda. Simya işlemi keseyi eritecek, ancak işlemi tamamlayana kadar hangi tılsımı elde edeceğinizi bilemeyeceksiniz!
items.trinkets.trinketcatalyst$randomtrinket.name=rastgele biblo
items.trinkets.trinketcatalyst.desc=Bu sihirli altın toz topu, zindanın karanlığında parıldıyor. Bu katalizör, az miktarda simya enerjisiyle bir simya kazanında kullanılarak benzersiz bir tılsım eşyası üretmek için kullanılabilir. Tılsımlar, zindanı veya sakinlerini hafifçe değiştiren çeşitli farklı etkiler sağlar. Tılsımlar, etkilerini daha güçlü hale getirmek için daha fazla enerjiyle yükseltilebilir veya etkiyi tamamen ortadan kaldırmak için atılabilir.
items.trinkets.trinketcatalyst.name=sihirli katalizör
items.trinkets.trinketcatalyst.window_text=Katalizörü eklediğinizde su parlamaya başlar. Yakınlarda bulunan birkaç eşyaya enerji yükleyerek onları sihirli bir tılsım haline getirebilirsiniz.
items.trinkets.trinketcatalyst.window_title=küçük bir eşya yaratın
items.trinkets.vialofblood.desc=Bu ince şişe, zindandaki bir sakinin kanını içeriyor; şişeyi döndürdükçe kan yavaşça hareket ediyor. Büyülü bir şekilde iyileştirici etkileri artırıyor gibi görünüyor, ancak aynı zamanda geciktiriyor da.
items.trinkets.vialofblood.name=kan şişesi
items.trinkets.vialofblood.stats_desc=Mevcut seviyesinde bu aksesuar, iyileştirici iksirler, su tulumları veya sağlık kuyularından elde ettiğiniz toplam sağlık puanını _%1$s%%_ kadar artıracaktır. Ancak bu iyileştirici etkiler daha yavaş gerçekleşecek ve tur başına en fazla _%2$s_ HP yenileyecektir (bu, kahraman seviyesiyle doğru orantılıdır).
items.trinkets.vialofblood.typical_stats_desc=Bu tılsım genellikle iyileştirici iksirler, su tulumları veya sağlık kuyularından elde ettiğiniz toplam sağlık puanını _%1$s%%_ kadar artırır. Ancak bu iyileştirici etkiler daha yavaş gerçekleşir ve tur başına maksimum _%2$s_ HP yeniler (bu, kahraman seviyesiyle doğru orantılıdır).
items.trinkets.wondrousresin.desc=Bu parıldayan mavi reçine, lanetli bir asanın büyüsünün damıtılmış özünü içeriyor gibi görünüyor. Simya kazanından gelen büyü, onu bir nebze olsun dengelemiş ve şimdi asalarınızı etkiliyor.
items.trinkets.wondrousresin.name=harika reçine
items.trinkets.wondrousresin.stats_desc=Mevcut seviyesinde bu tılsım, lanetli asa etkilerinin zamanın _%1$s%%_ oranında nötr veya pozitif hale gelmesine neden olacak ve lanetli olmayan asaların zamanın _%2$s%%_ oranında ek bir nötr veya pozitif lanetli yıldırım fırlatmasına neden olacaktır.\n\nBu tılsımın yükseltilmesi daha fazla enerji gerektirir.
items.trinkets.wondrousresin.typical_stats_desc=Bu tılsım genellikle lanetli asa etkilerinin zamanın _%1$s%%_ oranında nötr veya pozitif hale gelmesine neden olur ve lanetli olmayan asaların zamanın _%2$s%%_ oranında ek bir nötr veya pozitif lanetli yıldırım fırlatmasına neden olur. Bu tılsımın yükseltilmesi daha fazla enerji gerektirir.
items.wands.cursedwand.disguise=Görünüşünüz gözlerinizin önünde değişiyor!
items.wands.cursedwand.fire=Yanık kokusu geliyor...
items.wands.cursedwand.grass=Etrafınızda otlar fışkırıyor!
items.wands.cursedwand.gravity=Yerçekimi aniden rastgele yönlere doğru çekmeye başlıyor!
items.wands.cursedwand.gravity_end=Yerçekimi kaosu sona eriyor.
items.wands.cursedwand.gravity_positive=Yerçekimi aniden rastgele yönlere doğru çekmeye başlıyor, ancak bu sizi etkilemiyor gibi görünüyor.
items.wands.cursedwand.mass_invuln=Asanızdan göz kamaştırıcı bir ışık fışkırıyor!
items.wands.cursedwand.nothing=Hiçbir şey olmaz.
items.wands.cursedwand.ondeath=Kendi %s'nuz tarafından öldürüldünüz.
items.wands.cursedwand.petrify=Birdenbire olduğunuz yerde donakalıyorsunuz!
items.wands.cursedwand.sinkhole=Etrafınızdaki zemin çökmeye başlıyor!
items.wands.cursedwand.sinkhole_positive=Zemin çökmeye başlıyor, ancak altınızda yeterince sağlam hissediliyor.
items.wands.cursedwand.supernova=Parlayan bir enerji topu büyümeye başlıyor. Kaçmak isteyebilirsiniz!
items.wands.cursedwand.supernova_positive=Alev alev yanan bir enerji topu büyümeye başlıyor, ama nedense kendini güvende hissediyor.
items.wands.cursedwand.transmogrify_other=Eşyanız bambaşka bir şeye dönüşüyor!
items.wands.cursedwand.transmogrify_wand=Asanız farklı bir eşyaya dönüşüyor!
items.wands.damagewand.upgrade_stat_name_1=Büyü Hasarı
items.wands.wand$placeholder.name=asa
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Bu %s lanetli!
items.wands.wand.cursed=Bu asa lanetli, bu yüzden büyüsü kaotik ve rastgele.
items.wands.wand.fizzles=Asanız cızırdıyor; yeterince şarjı yok demek ki.
items.wands.wand.identify=Artık sihirli değneğinizi tanıyacak kadar iyi biliyorsunuz.
items.wands.wand.no_magic=Asanız işe yaramıyor; sihir bağışıklığınız varken asa kullanamazsınız.
items.wands.wand.not_cursed=Bu asa kötü niyetli büyülerden arındırılmıştır.
items.wands.wand.prompt=Yok etmek istediğiniz konumu seçin.
items.wands.wand.resin_many=Bu asa, gizemli reçineden _%d seviye_ kazanmıştır.
items.wands.wand.resin_one=Bu asa, büyülü reçine sayesinde _1 seviye_ yükseldi.
items.wands.wand.self_target=Kendinizi hedef alamazsınız!
items.wands.wandofblastwave.bmage_desc=Savaş Büyücüsü, felç olmuş bir düşmana patlama dalgası asasıyla vurduğunda, felç etkisini tüketerek ek büyü hasarı verir. Bu, düşman başına kısa bir bekleme süresine sahiptir.
items.wands.wandofblastwave.desc=Bu asa, mermer görünümlü bir taştan yapılmış, altın işlemeli ve ucunda yuvarlak siyah bir değerli taş bulunuyor. Elinizde oldukça ağır bir his veriyor.
items.wands.wandofblastwave.eleblast_desc=Patlama dalgası asasıyla yapılan elementel patlama %67 hasar verir ve patlama alanının dışındaki tüm düşmanları savurur.
items.wands.wandofblastwave.knockback_ondeath=Çarpışma sonucu öldün...
items.wands.wandofblastwave.name=patlama dalgası asası
items.wands.wandofblastwave.ondeath=Kendi Patlama Dalgası Asa'nla kendini öldürdün...
items.wands.wandofblastwave.staff_name=patlama dalgası personeli
items.wands.wandofblastwave.stats_desc=Bu asa, hedef noktada şiddetli bir şekilde patlayan bir cıvata fırlatır. Bu patlamanın gücü _%1$d-%2$d hasar_ verir ve çoğu düşmanı havaya fırlatacak kadar güçlüdür.
items.wands.wandofblastwave.typical_stats_desc=Bu asa, hedef noktada şiddetli bir şekilde patlayan bir cıvata fırlatır. Bu patlamanın gücü tipik olarak _%1$d-%2$d hasar_ verir ve çoğu düşmanı havaya fırlatacak kadar güçlüdür.
items.wands.wandofblastwave.upgrade_stat_name_2=Geri tepme
items.wands.wandofcorrosion.bmage_desc=Savaş Büyücüsü, düşmanına korozyon asasıyla vurduğunda, düşmanın sızma tehlikesi ortaya çıkar.
items.wands.wandofcorrosion.desc=Bu asa kül rengi bir gövdeye sahip olup, açıldığında parlak turuncu bir mücevher ortaya çıkar.
items.wands.wandofcorrosion.eleblast_desc=Korozyon asasıyla yapılan elementel bir patlama, düşmanlara 6 hasarla başlayarak 4 tur boyunca korozyon etkisi uygular.
items.wands.wandofcorrosion.name=korozyon asası
items.wands.wandofcorrosion.staff_name=korozyon personeli
items.wands.wandofcorrosion.stats_desc=Bu asa, hedef alınan bir noktada son derece aşındırıcı bir gaz bulutu halinde patlayan bir ok fırlatır. Bu bulutun içinde kalan her şey zamanla artan hasar alır; hasar _%d_ seviyesinde başlar.
items.wands.wandofcorrosion.upgrade_stat_name_1=Korozyon Hasarı
items.wands.wandofcorrosion.upgrade_stat_name_2=Gaz Hacmi
items.wands.wandofcorruption.already_corrupted=O karakter artık daha fazla etkilenemez.
items.wands.wandofcorruption.bmage_desc=Savaş Büyücüsü, bir düşmana yozlaşma asasıyla vurduğunda, düşmanın duman içinde kalma şansı vardır.
items.wands.wandofcorruption.desc=Bu asa, ucundaki küçük dekoratif kurukafa şeklinden zaten belli olduğu üzere, kaotik karanlık enerji yayıyor.
items.wands.wandofcorruption.eleblast_desc=Yozlaşma asasıyla yapılan elementel bir patlama, düşmanlara 5 tur boyunca kontrolsüzlük hali verir.
items.wands.wandofcorruption.name=yolsuzluk asası
items.wands.wandofcorruption.staff_name=yolsuzluk personeli
items.wands.wandofcorruption.stats_desc=Bu asa, düşmanları zayıflatacak ve sonunda onları sizin iradenize boyun eğdirecek bir yozlaştırıcı enerji patlaması yayacaktır. Düşmanlar yozlaşmaya direnebilirler, ancak zayıflamış düşmanları yozlaştırmak sağlıklı düşmanlara göre çok daha kolaydır.
items.wands.wandofcorruption.upgrade_stat_name_1=Gücü Bozmak
items.wands.wandofcorruption.upgrade_stat_name_2=Olumsuz Etki Süresi
items.wands.wandofdisintegration.bmage_desc=Bir parçalanma asası, _Savaş Büyücüsü_ tarafından kullanıldığında, sanki üzerine bir yansıtma büyüsü yapılmış gibi, saldırı menzilini artırır.
items.wands.wandofdisintegration.desc=Bu asa, düz ve pürüzsüz bir obsidyen parçasından yapılmış olup, yan tarafında koyu mor bir ışık yayarak ucunda son bulmaktadır. Yıkıcı bir enerjiyle parıldamakta ve ileriye doğru fırlamaya hazır beklemektedir.
items.wands.wandofdisintegration.eleblast_desc=Parçalama asasıyla yapılan elementel bir patlama %100 hasar verir ve duvarları deler.
items.wands.wandofdisintegration.name=parçalanma asası
items.wands.wandofdisintegration.staff_name=dağılma personeli
items.wands.wandofdisintegration.stats_desc=Bu asa, her türlü engeli delen bir ışın fırlatır ve yükseltildikçe daha uzağa gider. Işın _%1$d-%2$d hasar_ verir ve ayrıca deldiği her düşman ve duvar için ek hasar verir.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maksimum Menzil
items.wands.wandoffireblast.bmage_desc=Savaş Büyücüsü, ateş püskürtme asasıyla bir düşmana vurduğunda, düşmanlara hasar veren ve yakındaki tüm ateşi tüketen bir patlama meydana gelme olasılığı vardır! Düşmana bitişik ateş miktarı arttıkça bu olasılık da artar.
items.wands.wandoffireblast.desc=Bu asa, bolca altın varak kullanılarak oldukça asil bir görünüm kazandırılmış, kırmızı lake kaplı ahşaptan yapılmıştır. Ucu çıtırdıyor ve tıslıyor, güçlü büyüsünü açığa çıkarmaya can atıyor.
items.wands.wandoffireblast.eleblast_desc=Ateş püskürtme asasıyla yapılan elementel bir patlama %100 hasar verir, kapıları parçalar ve düşmanları ve araziyi ateşe verir.
items.wands.wandoffireblast.name=ateş patlaması asası
items.wands.wandoffireblast.staff_name=ateş patlaması personeli
items.wands.wandoffireblast.stats_desc=Bu asa kullanıldığında koni şeklinde bir ateş püskürtür. Bir sonraki saldırısı _%1$d şarj_ tüketir ve _%2$d-%3$d hasar_ verir. Asa ne kadar çok şarj kullanırsa, etkisi o kadar büyük ve güçlü olur.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Şarj Hasarı
items.wands.wandoffireblast.upgrade_stat_name_2=2 Şarj Hasarı
items.wands.wandoffireblast.upgrade_stat_name_3=3 Şarj Hasarı
items.wands.wandoffrost.bmage_desc=Savaş Büyücüsü, buz asasıyla soğuk bir düşmana vurduğunda, düşmanın anında donma şansı vardır. Düşman ne kadar soğuksa, bu şans o kadar artar.
items.wands.wandoffrost.desc=Bu asa bir çeşit sihirli buzdan yapılmış gibi görünüyor. Yuvarlak ucuna doğru daha parlaklaşıyor. Elde tutulduğunda çok soğuk hissediliyor, ama nedense eliniz sıcak kalıyor.
items.wands.wandoffrost.eleblast_desc=Buz asasıyla yapılan elementel bir patlama %100 hasar verir, düşmanları dondurur ve yangınları söndürür.
items.wands.wandoffrost.name=don asası
items.wands.wandoffrost.staff_name=don personeli
items.wands.wandoffrost.stats_desc=Bu asa, düşmanlarınıza doğru buz enerjisi patlamaları fırlatarak _%1$d-%2$d hasar_ verir ve onları dondurur. Etkisi suda daha güçlü görünmektedir. Zaten donmuş veya üşümüş olan düşmanlar bu asadan daha az hasar alır.
items.wands.wandoffrost.upgrade_stat_name_2=Soğukluk Süresi
items.wands.wandoflightning$lightningcharge.desc=Savaş Büyücüsü şu anda enerjiyle yüklüdür, bu da ona yıldırım asasına karşı bağışıklık kazandırır ve yıldırımın asadan çıkabileceği menzili artırır.\n\nKalan Tur Sayısı: %s.
items.wands.wandoflightning$lightningcharge.name=Elektrik yüklü
items.wands.wandoflightning.bmage_desc=Savaş Büyücüsü, bir düşmana yıldırım asasıyla vurduğunda, 10 tur boyunca kendini elektriksel olarak şarj etme şansına sahip olur. Şarj halindeyken Savaş Büyücüsü yıldırım hasarına karşı bağışıklıdır ve yıldırımları daha uzağa fırlatır.
items.wands.wandoflightning.desc=Bu asa tamamen metalden yapılmış olup şaşırtıcı derecede ağırdır. İki çatal uçta birbirine doğru kıvrılır ve aralarında elektrik akımı geçer.
items.wands.wandoflightning.eleblast_desc=Yıldırım asasıyla yapılan elementel bir patlama %100 hasar verir, düşmanları 5 tur boyunca sersemletir ve suyu elektriklendirir.
items.wands.wandoflightning.name=şimşek asası
items.wands.wandoflightning.ondeath=Kendi Şimşek Asa'nla kendini öldürdün...
items.wands.wandoflightning.staff_name=yıldırım asası
items.wands.wandoflightning.stats_desc=Bu asa, hedef aldığı her şeye güçlü bir şimşek yayarak _%1$d-%2$d hasar_ verir. Bu elektrik yakındaki karakterlere sıçrar ve suda daha kolay yayılır. Bu asanın yaydığı elektrik size zarar verebilir, ancak müttefiklerinize zarar vermez.
items.wands.wandoflivingearth$earthguardian.desc=Yaşayan toprak asanızdan çıkan kayalar, koruyucu bir toprak muhafızına dönüştü! Bu kayalık koruyucu, yakındaki düşmanlara saldıracak ve onları size değil, muhafıza saldırmaya zorlayacak. Yakındaki tüm tehditler ortadan kalktığında, muhafız etrafınızda yeniden oluşacak ve asanızı bir sonraki kullanımınızda geri dönecektir.
items.wands.wandoflivingearth$earthguardian.discover_hint=Bu karakteri belirli bir asa ile bulabilirsiniz.
items.wands.wandoflivingearth$earthguardian.name=toprak koruyucu
items.wands.wandoflivingearth$earthguardian.wand_info=Koruyucunun savunma gücü, asanızın seviyesine bağlıdır. Şu anda _%1$d-%2$d hasarı engeller._
items.wands.wandoflivingearth$rockarmor.desc=Büyülü kayalar vücudunuzu çevreliyor; saldırıya uğradığınızda sizin için kalkan görevi görecek ve aldığınız hasarı 50%% azaltacaklar. Ancak, engellenen her hasar kayanın bir kısmını da aşındırır.\n\nKalan Zırh: %1$d.\n\nEğer etrafınızda yeterince kaya birikirse, yaşayan toprak asanızdan gelen bir sonraki darbe, kayaların bir araya gelerek sizinle birlikte savaşacak bir koruyucu oluşturmasına neden olur.\n\nKoruyucu için gerekli zırh: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Bu toprak koruyucu da Çoklu Güç'ten faydalanıyor. Kalan Tur Sayısı: %d.
items.wands.wandoflivingearth$rockarmor.name=kaya zırhı
items.wands.wandoflivingearth.bmage_desc=Savaş Büyücüsü, yaşayan topraktan yapılmış bir asa ile düşmana vurduğunda, verilen hasarın bir kısmı kaya zırhı olarak geri döner.
items.wands.wandoflivingearth.desc=Bu asa, üzerinde parlayan sarı enerji bantları bulunan ilginç bir taştan yapılmıştır. Asayı tuttuğunuzda taşlar hafifçe hareket ediyor gibi görünüyor, sanki elinizi hissedebiliyorlar.
items.wands.wandoflivingearth.eleblast_desc=Canlı topraktan yapılmış bir asa ile gerçekleştirilen elementel patlama %50 hasar verir ve isabet eden her düşman için aktif bir toprak koruyucusunu iyileştirir.
items.wands.wandoflivingearth.name=yaşayan dünyanın asası
items.wands.wandoflivingearth.staff_name=yaşayan dünyanın asası
items.wands.wandoflivingearth.stats_desc=Bu asa, düşmanlara sihirli kaya cıvataları fırlatarak _%1$d-%2$d hasar_ verir. Kayalar daha sonra kullanıcının etrafında yeniden oluşarak, verilen hasarla orantılı olarak zırh kazandırır. Yeterli zırh oluşursa, asa bir sonraki darbede kaya koruyucusuna dönüşür.
items.wands.wandoflivingearth.upgrade_stat_name_2=Muhafız Maksimum HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Koruyucu Engelleme
items.wands.wandofmagicmissile$magiccharge.desc=Sihirli füze asanız, diğer asalarınıza güç geri kazandırarak, bir sonraki fırlattıkları sihirli füzenin etkili seviyesini artırdı. Asalarınızın gücü şu seviyeye yükseldi: +%d.Kalan sihirli şarj süresi: %s.
items.wands.wandofmagicmissile$magiccharge.name=sihirli yük
items.wands.wandofmagicmissile.bmage_desc=Savaş Büyücüsü, sihirli füze asasıyla bir düşmana vurduğunda, asasının yanı sıra tüm değnekleri de şarj kazanır.
items.wands.wandofmagicmissile.desc=Bu oldukça sade asa, saf sihirli enerji füzeleri fırlatır. Asanın kendisinde herhangi bir özel efekt bulunmasa da, daha fazla kullanılabilir şarjı vardır ve yükseltildiğinde diğer asaları kısa süreliğine güçlendirebilir.
items.wands.wandofmagicmissile.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.wands.wandofmagicmissile.eleblast_desc=Büyülü füze asasıyla yapılan element patlaması %50 hasar verir ve büyücüye 15 tur boyunca yeniden şarj olma imkanı tanır.
items.wands.wandofmagicmissile.name=sihirli füze asası
items.wands.wandofmagicmissile.staff_name=sihirli füze asası
items.wands.wandofmagicmissile.stats_desc=Bu asadan çıkan her ok _%1$d-%2$d hasar_ verir ve yükseltilirse diğer asaları kısa süreliğine güçlendirir.
items.wands.wandofprismaticlight.bmage_desc=Savaş Büyücüsü prizmatik ışık asasıyla bir düşmana vurduğunda, düşman asanın seviyesine bağlı olarak değişen bir süre boyunca sakat kalır.
items.wands.wandofprismaticlight.desc=Bu asa, uzun ve pürüzsüz bir cam parçası gibi, saydam kristalden yapılmış yekpare bir yapıdadır. Asanın ucunda, dışarı fırlamayı bekleyen küçük renkli ışık parçacıkları dans etmektedir.
items.wands.wandofprismaticlight.eleblast_desc=Prizmatik ışık asasıyla yapılan elementel bir patlama %67 hasar verir, patlamanın etkilediği tüm araziyi ortaya çıkarır ve düşmanları 5 tur boyunca kör eder.
items.wands.wandofprismaticlight.name=prizmatik ışık asası
items.wands.wandofprismaticlight.staff_name=prizmatik ışık asası
items.wands.wandofprismaticlight.stats_desc=Bu asa, zindanın karanlığını yarıp geçen, gizli alanları ve tuzakları ortaya çıkaran ışınlar fırlatır. Işın düşmanları kör edebilir ve _%1$d-%2$d hasar_ verir. Şeytani ve ölümsüz düşmanlar, asanın parlak ışığında yanarak ek hasar alırlar.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Kör Şans
items.wands.wandofprismaticlight.upgrade_stat_name_3=Işık Süresi
items.wands.wandofregrowth$dewcatcher.desc=Çiğ toplayıcılar, kendilerini sihirli çiğle dolduran harika bitkilerdir. Dikkat çekmemek için çimen gibi kamufle olmaya çalışırlar, ancak biriktirdikleri çiğden oluşan şişkinlikler onları ele verir.
items.wands.wandofregrowth$dewcatcher.discover_hint=Bu bitkiyi özel bir değnek yardımıyla bulabilirsiniz.
items.wands.wandofregrowth$dewcatcher.name=Çiğ yakalayıcı
items.wands.wandofregrowth$lotus.desc=Altın lotus, yalnızca güçlü bir yeniden büyüme asasıyla çağrılabilecek mistik bir bitkidir. Aurası tüm bitkileri ve bitki etkilerini güçlendirir, ancak enerjisini tüketir ve kısa bir süre sonra ölür.
items.wands.wandofregrowth$lotus.discover_hint=Bu bitkiyi, birkaç kez yükselttikten sonra belirli bir sihirli değnekle bulabilirsiniz.
items.wands.wandofregrowth$lotus.name=Altın Lotus
items.wands.wandofregrowth$lotus.wand_info=Bu nilüfer, _+%1$d_ yeniden büyüme asası tarafından üretildi. Etki alanındaki tüm bitkiler, bir karaktere dikildiklerinde _anında tetiklenir_. Bitkilerin ayrıca _%2$d%% şansı_ tohumlarını düşürecek ve uçlu oklar _%3$d%% daha az dayanıklılık_ kullanacak.
items.wands.wandofregrowth$seedpod.desc=Tohum kapsülleri, kendi tohumları yerine diğer bitki türlerinden tohum üreten sihirli bitkilerdir. Kendi tohumları olmamasına rağmen bir şekilde yayılmayı başarırlar.
items.wands.wandofregrowth$seedpod.discover_hint=Bu bitkiyi özel bir değnek yardımıyla bulabilirsiniz.
items.wands.wandofregrowth$seedpod.name=Tohum Kapsülü
items.wands.wandofregrowth.bmage_desc=Savaş Büyücüsü, yeniden büyüme asasıyla bir düşmana vurduğunda ve ikisi de çimen üzerinde duruyorsa, verilen hasarla orantılı olarak bitkisel iyileşme kazanır.
items.wands.wandofregrowth.degradation=Bir _%d şarjı daha yapıldıktan sonra_ bu asa bitki ve taze çim üretmeyi bırakacaktır. Bu sınır, asanın seviyesini yükselterek veya geliştirerek artırılabilir.
items.wands.wandofregrowth.desc=Bu asa, ustalıkla oyulmuş ince bir ahşap gövdeden yapılmıştır. Bir şekilde hâlâ canlı ve enerjik, genç bir ağacın özü gibi parlak yeşil. "Hayat sona erdiğinde her zaman yeni bir hayat filizlenmeye başlar... Sonsuz döngü her zaman devam eder!"
items.wands.wandofregrowth.eleblast_desc=Yeniden büyüme asasıyla yapılan elementel bir patlama, düşmanları köklerine bağlar ve patlama alanının üzerinde rastgele çimenler büyütür.
items.wands.wandofregrowth.name=yeniden büyüme asası
items.wands.wandofregrowth.staff_name=yeniden büyüme personeli
items.wands.wandofregrowth.stats_desc=Kullanıldığında, bu asa sihirli yeniden büyüme enerjisini koni şeklinde dışarı doğru fırlatarak çimenlerin, köklerin ve nadir bitkilerin canlanmasına neden olur. Bir sonraki atış _%1$d şarj_ tüketir. Asa ne kadar çok şarj kullanırsa, etkisi o kadar büyük ve güçlü olur.
items.wands.wandofregrowth.upgrade_stat_name_1=Çim, Ücret Başına
items.wands.wandofregrowth.upgrade_stat_name_2=Toplam Çim Sınırı
items.wands.wandoftransfusion.bmage_desc=Savaş Büyücüsü, büyülenmiş bir düşmana kan nakli asasıyla vurduğunda, kalkan kazanır ve asasıyla yapacağı bir sonraki vuruş can kaybına yol açmaz.
items.wands.wandoftransfusion.charged=Personeliniz düşmanınızın yaşam enerjisiyle yüklü!
items.wands.wandoftransfusion.desc=Oldukça sade bir şekle sahip olan bu asa, macenta rengi ve ucundaki simsiyah taşıyla dikkat çekiyor.
items.wands.wandoftransfusion.eleblast_desc=Kan nakli asasıyla yapılan elementel bir patlama düşmanları etkiler, müttefikleri iyileştirir ve ölümsüz düşmanlara %100 hasar verir.
items.wands.wandoftransfusion.name=kan transfüzyon asası
items.wands.wandoftransfusion.ondeath=Kendi Kan Nakli Asa'nla kendini öldürdün...
items.wands.wandoftransfusion.staff_name=transfüzyon personeli
items.wands.wandoftransfusion.stats_desc=Müttefikler veya büyülenmiş düşmanlar üzerinde kullanıldığında, bu asa kullanıcının canından _%1$d_ kadarını emerek müttefiki _%2$d can_ kadar iyileştirir veya kalkan görevi görür. Düşmanlar üzerinde kullanıldığında, asa onları kısa süreliğine büyülerken kullanıcıya _%3$d kalkan_ uygular. Düşman ölümsüzler büyülenmek yerine _%4$d-%5$d hasar_ alırlar.
items.wands.wandoftransfusion.upgrade_stat_name_1=Müttefik Şifa
items.wands.wandoftransfusion.upgrade_stat_name_2=Kendinden Korumalı
items.wands.wandoftransfusion.upgrade_stat_name_3=Ölümsüz Hasarı
items.wands.wandofwarding$ward.desc_1=Bu temel görüş alanı, görüş alanına giren herhangi bir düşmanı otomatik olarak vurarak _%1$d-%2$d hasar_ verir. Bu görüş alanını görüş asanızla vurarak yükseltebilirsiniz. Bu görüş alanı, dağılmadan önce yalnızca bir kez vurur. Görüş asanız bu görüş alanını sürdürmek için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_2=Bu yükseltilmiş kalkan daha karmaşık bir desene sahip ve birden fazla kez saldırabilir. Bu kalkanın her darbesi _%1$d-%2$d hasar verir._\n\n Bu kalkanı koruma asanızla vurmak onu yükseltir._\n\n Bu kalkan dağılmadan önce üç kez darbe vurur._\n\n Koruma asanız bu kalkanı sürdürmek için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_3=Tamamen yükseltilmiş bu koruma kalkanı, önceki versiyonlarından daha fazla saldırı yapabiliyor. Bu kalkanın her darbesi _%1$d-%2$d hasar verir._\n\n Bu kalkanı koruma asanızla vurmak onu yükseltir._\n\n Bu kalkan dağılmadan önce beş kez darbe vurur._\n\n Koruma asanız bu kalkanı sürdürmek için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_4=Bu daha küçük nöbetçi, daha büyük bir nöbetçiyle aynı ateş gücüne sahip, ancak belirli sayıda şarj yerine canı var. Koruma asanızın ucundaki mücevhere benziyor. Bu nöbetçiden gelen her darbe _%1$d-%2$d hasar verir._\n\nBu nöbetçiye koruma asanızla darbe vurmak onu yükseltir ve iyileştirir.\n\nBu nöbetçi, bir düşmana her darbe vurduğunda biraz can harcar, ancak koruma asanızı kullanarak iyileştirilebilir.\n\nKoruma asanız bu nöbetçiyi ayakta tutmak için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_5=Bu yükseltilmiş nöbetçi, daha düşük seviyedeki bir nöbetçiden daha büyük ve daha dayanıklıdır. Bu nöbetçiden gelen her darbe _%1$d-%2$d hasar verir._\n\n Bu nöbetçiye koruma asanızla darbe vurmak onu yükseltir ve iyileştirir._\n\n Bu nöbetçi, bir düşmana her darbe vurduğunda biraz can harcar, ancak koruma asanızı kullanarak iyileştirilebilir._\n\n Koruma asanız bu nöbetçiyi ayakta tutmak için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_6=Tamamen yükseltilmiş bu nöbetçi, önceki modellerine göre önemli ölçüde daha dayanıklıdır. Bu nöbetçiden gelen her darbe _%1$d-%2$d hasar verir._\n\n Bu nöbetçiye koruma asanızla darbe vurmak onu iyileştirir._\n\n Bu nöbetçi, bir düşmana her darbe vurduğunda biraz can harcar, ancak koruma asanızı kullanarak iyileştirilebilir._\n\n Koruma asanız bu nöbetçiyi ayakta tutmak için _%3$d enerji_ kullanıyor.
items.wands.wandofwarding$ward.desc_generic_sentry=Bu nöbetçi, bir koruma kulesiyle aynı ateş gücüne sahip, ancak belirli sayıda şarj yerine canı var. Koruma asanızın ucundaki mücevhere benziyor. Bu nöbetçiyi koruma asanızla vurduğunuzda yükseltilir ve iyileştirilir. Bu nöbetçi, her düşmana vurduğunda canının bir kısmını harcar, ancak koruma asanızı kullanarak iyileştirilebilir.
items.wands.wandofwarding$ward.desc_generic_ward=Bu totem, görüş alanına giren herhangi bir düşmanı otomatik olarak etkisiz hale getirecektir. Bu toteme totem asasıyla vurarak onu yükseltebilirsiniz. Totemlerin kaybolmadan önce sınırlı sayıda etkisiz hale getirme hakkı vardır.
items.wands.wandofwarding$ward.discover_hint=Bu karakteri belirli bir asa ile bulabilirsiniz.
items.wands.wandofwarding$ward.dismiss_body=Eğer artık asanızın bu korumayı sürdürmesini istemiyorsanız, bu korumayı kaldırabilirsiniz. Bunu yaptığınızda koruma anında yok olur.\n\nBu korumayı kaldır?
items.wands.wandofwarding$ward.dismiss_cancel=HAYIR
items.wands.wandofwarding$ward.dismiss_confirm=Evet
items.wands.wandofwarding$ward.dismiss_title=Bu koğuşu görevden mi alalım?
items.wands.wandofwarding$ward.name_1=küçük koğuş
items.wands.wandofwarding$ward.name_2=koğuş
items.wands.wandofwarding$ward.name_3=büyük mahalle
items.wands.wandofwarding$ward.name_4=küçük nöbetçi
items.wands.wandofwarding$ward.name_5=nöbetçi
items.wands.wandofwarding$ward.name_6=büyük nöbetçi
items.wands.wandofwarding.bad_location=Oraya bir koruma görevlisi yerleştiremezsiniz.
items.wands.wandofwarding.bmage_desc=Savaş Büyücüsü bir düşmana koruma asasıyla vurduğunda, aktif olan tüm koruma kalkanları ve nöbetçilerin iyileşme şansı olur.
items.wands.wandofwarding.desc=Bu kısa metal asanın ucunda parlak mor bir taş yüzüyor.
items.wands.wandofwarding.eleblast_desc=Koruma asasıyla yapılan elementel bir patlama, patlama alanındaki tüm koruma kalkanlarını ve nöbetçileri iyileştirir.
items.wands.wandofwarding.name=koruma asası
items.wands.wandofwarding.no_more_wards=Asanız artık daha fazla koruma büyüsünü destekleyemez.
items.wands.wandofwarding.staff_name=koğuş personeli
items.wands.wandofwarding.stats_desc=Bu asa, düşmana doğrudan hasar vermek yerine, sabit görüş kuleleri ve nöbetçiler çağırır. Görüş alanınız varsa, görüş kuleleri duvarların içinden bile her yere çağrılabilir. Bu asa aynı anda _%d enerji_ değerinde görüş kulesini destekleyebilir.
items.wands.wandofwarding.upgrade_stat_name_1=Koğuş Hasarı
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=İÇMEK
items.waterskin.collected=Çiğ damlasını su tulumunuza topluyorsunuz.
items.waterskin.desc=Deri ve ipten yapılmış, mantar tıpa ile kapatılmış sıvı kabı.
items.waterskin.desc_full=Su tulumunun tamamı enerji yayıyor gibi görünüyor, belki de başka bir hayatta kalma eşyasını kutsamak için kullanılabilir?
items.waterskin.desc_heal=Su tulumu şu anda şifalı su depolamak için kullanılıyor. Su tulumu ne kadar dolu olursa, ondan içtiğinizde o kadar hızlı iyileşirsiniz. Sadece ihtiyacınız kadar içeceksiniz.
items.waterskin.desc_water=Şu anda su tulumunda sadece sade içme suyu var. Zindanda su tulumunun içine konulabilecek başka bir şey mutlaka vardır.
items.waterskin.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.waterskin.empty=Su tulumunuz boş!
items.waterskin.full=Su tulumunuz doldu!
