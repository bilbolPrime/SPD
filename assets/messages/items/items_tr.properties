items.journal.documentpage.name=yırtılmış sayfa
items.journal.guidebook.desc=Maceracıların rehberi, maceranın kendilerine göre olmadığına karar veren biri tarafından burada bırakıldı! Bu kitap sihirli ve maceracıları doğru anda bir sayfa okumaya teşvik edebiliyor. Bu işlevine rağmen, kitap en çok kapağında büyük ve dostane harflerle yazılmış "Panik Yapmayın!" sözü nedeniyle popüler.
items.journal.guidebook.hint_desktop=Rehberinizde sizin için tavsiyeler var! Okumak için sağ üst köşedeki yanıp sönen günlük düğmesini (%s) seçin.
