items.armor.curses.antientropy.desc=Anti-entropi laneti, evrenin güçlerine karşı çalışarak enerjiyi kullanan kişiye doğru çeker ve çevresinden uzaklaştırır. Bu durum, kullanan kişiyi kısa süreliğine ateşe verirken, etrafındaki her şeyi dondurur!
items.armor.curses.antientropy.name=%s anti-entropi
items.armor.curses.bulk.desc=Hacimli zırh daha büyük ve heybetli görünse de aslında savunma açısından bir avantaj sağlamıyor. Daha da kötüsü, ek boyut kapılardan geçmeyi çok zorlaştırıyor.
items.armor.curses.bulk.name=%s toplu
items.armor.curses.corrosion.desc=Korozyon zırhı, aşındırıcı sıvıyla delinerek, çevredeki her şeyi yapışkan asidik bir sıvıyla kaplayabilir.
items.armor.curses.corrosion.name=%s korozyonu
items.armor.curses.displacement.desc=Yer değiştirme laneti, kullanıcı saldırıya uğradığında onu güvenli bir yere taşımayı amaçlar. Ancak biraz fazla etkili olduğu için kullanıcıyı seviye içinde rastgele ışınlar.
items.armor.curses.displacement.name=%s yer değiştirmesi
items.armor.curses.metabolism.desc=Metabolizma laneti, kullanıcı yaralandığında tokluğu doğrudan sağlığa dönüştürerek iyileşmeyi hızlandırır, ancak hızla açlığa neden olur.
items.armor.curses.metabolism.name=metabolizmanın %s'su
items.armor.curses.multiplicity.desc=Çoklu çoğaltma lanetiyle lanetlenmiş zırh, tehlikeli bir kopyalama büyüsü içerir. Bazen giyenin ayna görüntüsünü oluşturur, ancak saldırganın kopyasını oluşturma olasılığı da aynı derecede yüksektir!
items.armor.curses.multiplicity.name=%s çokluğu
items.armor.curses.overgrowth.desc=Aşırı büyüme zırhı, çeşitli çiçekli bitkilerle kaplıdır. Bu etki kesinlikle ilgi çekici görünse de, savunma açısından hiçbir faydası yoktur ve bu bitkiler savaş sırasında rastgele aktif hale gelir!
