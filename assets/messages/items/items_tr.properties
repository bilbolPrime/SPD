items.potions.exotic.exoticpotion.turquoise=egzotik turkuaz iksir
items.potions.exotic.exoticpotion.unknown_desc=Bu yuvarlak şişenin içinde taneli, renkli bir sıvı var. Bu topraklara yabancı gibi görünüyor, içildiğinde veya fırlatıldığında ne olacağını kim bilebilir?
items.potions.exotic.exoticpotion.warning=Bu iksirin kullanımını gerçekten iptal etmek istiyor musunuz? Zaten tüketilecek.
items.potions.exotic.exoticpotion.yes=Evet, eminim.
items.potions.exotic.potionofcleansing$cleanse.desc=Bu karakter geçici olarak tüm zararlı durum etkilerine karşı bağışıklıdır!\n\nKalan tur sayısı: %s.
items.potions.exotic.potionofcleansing$cleanse.name=temizlenmiş
items.potions.exotic.potionofcleansing.desc=Bu güçlü reaktif, içildiğinde içen kişiyi birkaç tur boyunca tüm zararlı durum etkilerinden bağışık hale getirir. Hedefe fırlatılarak da onu arındırabilir.
items.potions.exotic.potionofcleansing.name=temizleyici iksir
items.potions.exotic.potionofcorrosivegas.desc=Bu basınçlı cam şişenin açılması veya kırılması, içindekilerin ölümcül, aşındırıcı, pas rengi bir gaz bulutuna dönüşmesine neden olur. Bu gaz, zehirli gazdan daha hızlı yayılır ve daha ölümcüldür, ancak etkisi daha kısa sürer.
items.potions.exotic.potionofcorrosivegas.name=aşındırıcı gaz iksiri
items.potions.exotic.potionofdivineinspiration.bonus=+2 Yetenek Puanı!
items.potions.exotic.potionofdivineinspiration.desc=Kutsal enerjinin sıvı hale indirgenmiş gücü olan bu iksir, içene ilahi güç aşılayarak, seçtiği bir yetenek seviyesinde iki bonus yetenek puanı kazandırır. Bu iksir, her yetenek seviyesi için yalnızca bir kez kullanılabilir.
items.potions.exotic.potionofdivineinspiration.name=ilahi ilham iksiri
items.potions.exotic.potionofdivineinspiration.no_more_points=Artık daha fazla bonus yetenek puanı kazanamazsınız.
items.potions.exotic.potionofdivineinspiration.select_tier=İki bonus puan kazanmak için bir yetenek seviyesi seçin. Puanları harcayabilmek için ilgili seviyenin kilidini açmış olmanız gerekir.
items.potions.exotic.potionofdragonsbreath.desc=Bu şişe, tükürükle karıştıktan kısa süre sonra alev alan sıra dışı bir bileşik içeriyor. Sıvıyı hızla tükürmek, kullanıcının ağzından alev püskürtmesini sağlayacak!
items.potions.exotic.potionofdragonsbreath.name=ejderha nefesi iksiri
items.potions.exotic.potionofdragonsbreath.prompt=Yakılacak yeri seçin
items.potions.exotic.potionofearthenarmor.desc=Bu sıvı, felç edici etki yaratmak yerine, cildi sertleştirerek geçici bir doğal zırh haline getirir.
items.potions.exotic.potionofearthenarmor.name=toprak zırh iksiri
items.potions.exotic.potionofmagicalsight.desc=Bunu içtikten sonra, duyularınız kısa süreliğine inanılmaz seviyelere çıkacak ve 12 karo yarıçapındaki duvarların içini görebileceksiniz!
items.potions.exotic.potionofmagicalsight.name=sihirli görüş iksiri
items.potions.exotic.potionofmastery.armor_easier=Zırhınızı giymek daha kolay hale geliyor!
items.potions.exotic.potionofmastery.desc=Bu iksir, doğrudan güç vermek yerine, kullanıcının kaslarını belirli bir eşyaya uyumlandırmayı sağlar. Bu sayede, içen kişi o eşyayla pratik yapmış ve kas hafızası oluşturmuş gibi, o eşyayı kullanmak daha kolay hale gelir. Seçilen silah veya zırhın kullanımı için 2 daha az güç gerekecektir. Bu iksir her eşyada yalnızca bir kez kullanılabilir.
items.potions.exotic.potionofmastery.name=ustalık iksiri
items.potions.exotic.potionofmastery.prompt=Bir öğeye hakim olun
items.potions.exotic.potionofmastery.weapon_easier=Silahınızı kullanmak daha kolay hale geliyor!
items.potions.exotic.potionofshielding.desc=Bu iksir iyileştirme yerine, kullanıcının vücudunun etrafına dayanıklı bir kalkan oluşturarak önemli miktarda hasarı engelleyecektir.
items.potions.exotic.potionofshielding.name=kalkan iksiri
items.potions.exotic.potionofshroudingfog.desc=Bu şişedeki sıvı havaya maruz kaldığında, hızla yayılan ve düşmanlarınızın görüşünü engelleyen yoğun bir duman tabakası oluşturacaktır.
items.potions.exotic.potionofshroudingfog.name=örtücü sis iksiri
items.potions.exotic.potionofsnapfreeze.desc=Bu iksirin içerdiği kimyasal madde havayla hızla reaksiyona girerek, etki alanındaki her şeyi anında donduracak ve kök salmasına neden olacaktır.
items.potions.exotic.potionofsnapfreeze.name=ani dondurma iksiri
items.potions.exotic.potionofstamina.desc=Bu garip tatlı sıvıyı içmek size uzun süreli bir enerji artışı sağlayacak ve daha uzun süre daha hızlı koşmanıza olanak tanıyacaktır.
items.potions.exotic.potionofstamina.name=dayanıklılık iksiri
items.potions.exotic.potionofstormclouds.desc=Bu iksiri atmak, hızla yayılan yoğun bir buhar bulutu oluşturacak ve bu buhar yoğunlaşarak çevreye yayılacaktır. Arazinin büyük bir kısmı suya dönüşecek, ateşli düşmanlar hasar alacak, ateş söndürülecek ve tuzaklar etkisiz hale gelerek kırılacaktır.
items.potions.exotic.potionofstormclouds.name=fırtına bulutları iksiri
