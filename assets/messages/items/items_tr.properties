items.liquidmetal.apply=Fırlattığınız silahı onarmak için %d sıvı metalini kullanıyorsunuz.
items.liquidmetal.desc=Bu sihirli sıvı, fırlatılan bir silahtaki çatlakları ve yırtıkları doldurarak onu mükemmel duruma getirebilir! Bir silah setinde bir silah eksikse ancak diğer kısımları tamamen onarılmışsa, sıvı metal eksik silahı setten değiştirmek için bile kullanılabilir! Birinci seviye bir silahın tamamen onarılması için 10 sıvı metal, beşinci seviye bir silahın ise 30 sıvı metal gerekir. Her yükseltme ayrıca gereken metal miktarını %35 artırır. Sıvı metal, uçlu dartların uçlarını onarmak için kullanılamaz.
items.liquidmetal.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.liquidmetal.name=sıvı metal
items.liquidmetal.prompt=Fırlatılan bir silah seçin
items.lostbackpack.desc=Bu, kayıp envanteriniz. Kaybettiğiniz tüm eşyaları geri almak için onu toplayın!
items.lostbackpack.name=kayıp sırt çantası
items.merchantsbeacon.ac_use=KULLANMAK
items.merchantsbeacon.desc=Bu tuhaf cüce teknolojisi, çok uzak mesafelerden iletişim kurmanıza olanak tanır. \n\nAktifleştirildikten sonra, bu işaretçi zindanın herhangi bir yerinden Pixel Mart'a eşya satmanıza izin verecektir. \n\nAncak, işaretçinin içindeki sihir yalnızca bir oturum boyunca sürecektir, bu yüzden akıllıca kullanın.
items.merchantsbeacon.name=tüccarın feneri
items.potions.brews.aquabrew.desc=Bu karışım kırıldığında, bulunduğu yere basınçlı su püskürtür. Sadece ateşli düşmanlara zarar verecek kadar güçlüdür, ancak aynı zamanda yakındaki araziye su yayar, tuzakları etkisiz hale getirir, yangınları söndürür ve patlamanın yakınındaki karakterleri geriye doğru savurur.
items.potions.brews.aquabrew.name=su içeceği
items.potions.brews.blizzardbrew.desc=Bu karışım parçalandığında, hızla gaz gibi yayılan girdaplı bir kar fırtınası ortaya çıkaracaktır.
items.potions.brews.blizzardbrew.name=kar fırtınası birası
items.potions.brews.brew.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.potions.brews.causticbrew.desc=Bu karışım, parçalandığı yerin etrafındaki geniş bir alana aşındırıcı bir sıvı yayacaktır. Bu sıvıya maruz kalan her şey, suyla yıkanamazsa yavaş yavaş eriyecektir.
items.potions.brews.causticbrew.name=yakıcı bira
items.potions.brews.infernalbrew.desc=Parçalandığında, bu karışım hızla gaz gibi yayılan şiddetli bir yangına yol açacaktır.
items.potions.brews.infernalbrew.name=cehennem iksiri
items.potions.brews.shockingbrew.desc=Bu karışım parçalandığında, kırıldığı noktanın etrafındaki geniş bir alanda elektriksel bir fırtına başlatacaktır.
items.potions.brews.shockingbrew.name=şok edici bira
items.potions.brews.unstablebrew.desc=Bu sihirli iksir, gökkuşağının değişen renkleriyle parlıyor. İçildiğinde veya fırlatıldığında rastgele bir iksirin etkisini tetikler. İksirin etkisi içildiğinde her zaman faydalı, fırlatıldığında ise her zaman zararlı olacaktır.
items.potions.brews.unstablebrew.name=kararsız demleme
items.potions.elixirs.elixir.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Geçici olarak Goo'ya benzer iyileştirici özellikler kazandınız. Su içinde dururken, her turda az miktarda can yenileyeceksiniz. Tam cana ulaştığınızda veya sudan çıktığınızda bu etki duraklatılır. Kalan iyileşme: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=su şifası
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Bu iksir, iyileştirici bir iksirle zenginleştirilmiş yapışkan madde kalıntıları içerir. Anında iyileşme sağlamasa da, suda durduğunuz sürece sağlığınızı giderek daha fazla iyileştirecektir.
items.potions.elixirs.elixirofaquaticrejuvenation.name=su bazlı gençleştirici iksir
items.potions.elixirs.elixirofarcanearmor.desc=Bu iksir, içene uzun süreli büyülü hasara karşı direnç kazandıracaktır.
items.potions.elixirs.elixirofarcanearmor.name=gizemli zırh iksiri
items.potions.elixirs.elixirofdragonsblood.desc=Bu iksir tüketildiğinde, içenin damarlarında ateşli bir güç akmasına neden olur. Bu etki, içeni ateşe karşı bağışıklık kazanmasını sağlar ve fiziksel saldırılarla düşmanlarını ateşe vermesine olanak tanır.
items.potions.elixirs.elixirofdragonsblood.name=ejderha kanı iksiri
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Tüy gibi düşme iksirinin etkisi altındasınız, bu sayede hasar almadan uçurumlara düşebilirsiniz!\n\nKalan tur sayısı: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=tüy dökülmesi
items.potions.elixirs.elixiroffeatherfall.desc=Bu iksir, daha zayıf ama daha kontrollü bir yükselme etkisi sunarak, içenin bir süreliğine zarar görmeden büyük mesafelerden düşmesine olanak tanır.
items.potions.elixirs.elixiroffeatherfall.light=Kendinizi tüy gibi hafif hissediyorsunuz!
items.potions.elixirs.elixiroffeatherfall.name=tüy düşüşü iksiri
items.potions.elixirs.elixirofhoneyedhealing.desc=Bu iksir, iyileştirici özelliği balın tatlılığıyla birleştirir. İçildiğinde, iyileştirici bir iksirin etkisini gösterir ve az miktarda açlığı giderir; ayrıca bir müttefiki iyileştirmek için de fırlatılabilir. Bal seven yaratıklar, bu eşya onlara uygulandığında sakinleşebilir.
items.potions.elixirs.elixirofhoneyedhealing.name=bal özlü şifa iksiri
items.potions.elixirs.elixiroficytouch.desc=Bu iksir tüketildiğinde, içenin saldırdığı düşmanlardan ısıyı emmesini sağlar. Bu etki, içeni soğuğa karşı bağışıklık kazanmasını ve fiziksel saldırılarla düşmanlarını dondurmasını mümkün kılar.
items.potions.elixirs.elixiroficytouch.name=buz dokunuşunun iksiri
items.potions.elixirs.elixirofmight$htboost.desc=Vücudunuz doğal olmayan bir şekilde güçlü ve sağlıklı hissediyor. Sağlığınız uzun bir süre boyunca en üst seviyede kalıyor. Seviye atladıkça bu artış yavaş yavaş azalacak. Mevcut artış miktarı: Kalan seviye:
items.potions.elixirs.elixirofmight$htboost.name=maksimum sağlık artışı
items.potions.elixirs.elixirofmight.desc=Bu güçlü sıvı kaslarınızda dolaşarak gücünüzü kalıcı olarak bir puan artıracak ve maksimum sağlığınızı geçici olarak %d puan artıracaktır. Sağlık artışı maksimum sağlığınızla doğru orantılıdır, ancak seviye atladıkça yavaş yavaş azalacaktır.
items.potions.elixirs.elixirofmight.msg=Yeni kazanılan güç vücudunuzda dalgalanıyor, artık %d gücüne sahipsiniz!
items.potions.elixirs.elixirofmight.name=kudret iksiri
items.potions.elixirs.elixiroftoxicessence.desc=Bu iksir tüketildiğinde içene zehirli enerji aşılar. İçen kişi hareket ettikçe sürekli olarak zehirli gaz yayar ve etkinin süresinden biraz daha uzun süre zehirli gaz ve zehire karşı bağışıklık kazanır.
items.potions.elixirs.elixiroftoxicessence.name=zehirli özlü iksir
items.potions.exotic.exoticpotion.amber=egzotik kehribar iksiri
items.potions.exotic.exoticpotion.azure=egzotik mavi iksir
items.potions.exotic.exoticpotion.bistre=egzotik bistre iksiri
items.potions.exotic.exoticpotion.charcoal=egzotik kömür iksiri
items.potions.exotic.exoticpotion.crimson=egzotik kızıl iksir
