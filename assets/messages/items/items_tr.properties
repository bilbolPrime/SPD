items.kingscrown.ac_wear=GİYMEK
items.kingscrown.desc=Son cüce kralının tacı, muazzam bir sihirli enerjiyle parlıyor. Takıldığında, tacın büyüsü şu anda giydiğiniz zırha akacak ve onu _özel yeteneklere sahip eşsiz bir epik zırha_ dönüştürecektir. Yeni zırh, orijinal zırhın tüm özelliklerini koruyacaktır.
items.kingscrown.discover_hint=Bu eşyayı belirli düşmanlardan düşen bir ganimet olarak elde edebilirsiniz.
