items.weapon.melee.crossbow.typical_ability_desc=Düellocu, arbaletini şarj edebilir; bu sayede bir sonraki normal saldırısı her zaman isabet eder ve üç etkiden birini uygular: yakın dövüş saldırıları düşmanları uzağa savurur, uçsuz oklar genellikle +%1$d hasar verir ve uçlu oklar etkilerini 7x7'lik bir alanda uygular ve genellikle %2$d kullanım daha sürer.
