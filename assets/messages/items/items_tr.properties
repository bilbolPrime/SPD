items.weapon.melee.crossbow$chargedshot.name=şarj edildi
items.weapon.melee.crossbow.ability_desc=Düellocu, arbaletini şarj edebilir; bu sayede bir sonraki normal saldırısı her zaman isabet eder ve üç etkiden birini uygular: yakın dövüş saldırıları düşmanları uzağa savurur, uçsuz oklar +%1$d hasar verir ve uçlu oklar etkilerini 7x7'lik bir alanda uygular ve %2$d kullanım daha uzun sürer.
