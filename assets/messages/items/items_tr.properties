items.rings.ringofsharpshooting.typical_stats=Bu yüzük takıldığında, fırlattığınız silahların hasarını, seviyeleri _%1$d_ kadar artırılmış gibi yükseltir ve dayanıklılıklarını _%2$s%%_ kadar artırır.
