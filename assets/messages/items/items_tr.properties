items.rings.ringofenergy.combined_stats=Takılı yüzükleriniz güçlerini birleştirerek şarj hızını toplamda _%s%%_ kadar artırıyor.
items.rings.ringofenergy.desc=Bu yüzükten yayılan büyülü alanda sihirli ekipmanlarınız daha hızlı şarj olur. Lanetli bir yüzük ise şarjı yavaşlatır.
items.rings.ringofenergy.name=enerji halkası
