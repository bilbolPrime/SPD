items.journal.regionlorepage$caves.desc=Bir kaşifin günlüğüne ait gibi görünen, yaşına rağmen şaşırtıcı derecede iyi korunmuş bir kayıt. Okumak için elinize alın.
items.journal.regionlorepage$caves.name=eski günlük kaydı
items.journal.regionlorepage$city.desc=Paslanmış küçük bir metal tabletin üzerine sihirli bir şekilde bir mesaj kazınmış. Tabletin yaşına rağmen harfler hala net, ancak okumak için onu elinize almanız gerekecek.
items.journal.regionlorepage$city.name=paslanmış tablet
items.journal.regionlorepage$halls.desc=Üzerine parlayan yeşil harfler kazınmış küçük siyah bir tablet. Parlayan harfler uzaktan bakıldığında bulanık bir görüntü oluşturuyor, okuyabilmek için tableti elinize almanız gerekiyor.
items.journal.regionlorepage$halls.name=parlayan tablet
items.journal.regionlorepage$prison.desc=Eski bir kağıt parçasına yazılmış bir günlük kaydı veya başka bir tür not. Kanalizasyonda bulduğunuz mektuplardan daha iyi durumda görünüyor, ancak yine de okumak için onu almanız gerekecek.
items.journal.regionlorepage$prison.name=yıpranmış günlük kaydı
items.journal.regionlorepage$sewers.desc=Üzerinde kir lekeleri olan bir kağıt parçasına yazılmış, mektuba benzeyen bir şey. Yazılanları okuyabilmek için onu elinize almanız gerekecek.
