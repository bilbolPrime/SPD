items.artifacts.skeletonkey$keywall.desc=İskelet anahtarı tarafından buraya geçici bir sihirli duvar yerleştirildi.
items.artifacts.skeletonkey.ac_insert=SOKMAK
items.artifacts.skeletonkey.crystal_charges=Kristal kilidi açmak için 5 şarj gerekir.
items.artifacts.skeletonkey.cursed=Lanetli bir iskelet anahtarını kullanamazsınız.
items.artifacts.skeletonkey.desc=Kafatası şeklinde bir başa sahip, önemli görünümlü bir anahtar. Dişleri her baktığınızda farklı görünüyor.
items.artifacts.skeletonkey.desc_cursed=Lanetli anahtar, herhangi bir kilide girmeyi aktif olarak reddediyor ve hatta diğer anahtarlarınızı kullanmanızı zorlaştırıyor (ama imkansız hale getirmiyor).
items.artifacts.skeletonkey.desc_worn=Bu sihirli anahtar, zindanın normal anahtarları yerine kullanıldıkça güç kazanıyor gibi görünüyor. Zindanın neredeyse tüm kilitlerine takılarak, daha önce hiç kilitlenmemiş kapılar da dahil olmak üzere, kapıları açıp kapatabiliyor. Anahtar, önünüzdeki havayı 'kilitlemek' için ana veya çapraz yönde boş alanda bile kullanılabiliyor ve 10 tur boyunca süren 3 karo genişliğinde sağlam bir duvar oluşturuyor. Kilitleme, yeterli alan varsa düşmanları uzaklaştırıyor.
items.artifacts.skeletonkey.discard=Fazla anahtarlarınızı atın.
items.artifacts.skeletonkey.force_lock=Anahtarınız olmadan kilit zayıflamıştı. Zorla açmayı başardınız.
items.artifacts.skeletonkey.gold_charges=Altın bir kilidi açmak için 2 şarj gerekir.
items.artifacts.skeletonkey.invalid_target=Orada kilitlenecek veya açılacak bir şey yok.
items.artifacts.skeletonkey.iron_charges=Normal bir kilidi açmak için 1 şarj gerekir.
items.artifacts.skeletonkey.levelup=Anahtarının gücü giderek artıyor!
items.artifacts.skeletonkey.lock_charges=Bir kapıyı kilitlemek 2 şarj gerektirir.
items.artifacts.skeletonkey.lock_no_space=Bir karakteri kapının içine kilitleyemezsiniz!
items.artifacts.skeletonkey.locked_with_key=O kapı senin anahtarınla kilitlenmişti.
items.artifacts.skeletonkey.name=iskelet anahtar
items.artifacts.skeletonkey.prompt=Bir hedef seçin
items.artifacts.skeletonkey.wall_charges=Geçici bir duvar oluşturmak 2 şarj gerektirir.
items.artifacts.skeletonkey.wont_open=Anahtar nedense bu kilide girmiyor.
items.artifacts.talismanofforesight$foresight.desc=Çok gergin hissediyorsunuz, sanki yakınınızda görünmeyen bir tehlike var gibi.
items.artifacts.talismanofforesight$foresight.name=öngörü
items.artifacts.talismanofforesight$foresight.uneasy=Kendinizi huzursuz hissediyorsunuz.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Üzerinde garip oymalar olan pürüzsüz bir taş. Sanki etrafınızdaki her şeyi izliyor, gizli bir şey olup olmadığını kontrol ediyor gibi hissediyorsunuz.
items.artifacts.talismanofforesight.desc_cursed=Lanetli tılsım, duyularınızı körelterek, size dikkatle bakıyor.
items.artifacts.talismanofforesight.desc_worn=Tılsımı elinizde tuttuğunuzda duyularınızın keskinleştiğini hissedersiniz. Tılsım zaman geçtikçe ve gizli kapıları veya tuzakları keşfettikçe yavaş yavaş şarj olur. Tılsım, koni şeklinde bir "gözlem" yapmak için şarjını harcayabilir; bu, taranan alandaki tüm karoları ve sırları ortaya çıkarır ve kısa bir süre için düşmanları ve eşyaları görmenizi sağlar.
items.artifacts.talismanofforesight.full_charge=Tılsımınız tamamen şarj oldu!
items.artifacts.talismanofforesight.levelup=Tılsımınız daha da güçleniyor!
items.artifacts.talismanofforesight.low_charge=Tılsımın kehanet yapabilmesi için en az %5 şarja ihtiyacı vardır.
items.artifacts.talismanofforesight.name=öngörü tılsımı
items.artifacts.talismanofforesight.prompt=Taranacak konumu seçin.
items.artifacts.timekeepershourglass$sandbag.desc=Bu küçük ince kum torbası kum saatinizle mükemmel uyum sağlayacaktır.\n\nDükkan sahibinin tam da ihtiyacınız olduğu anda bu özel ürüne sahip olması garip görünüyor...
items.artifacts.timekeepershourglass$sandbag.levelup=Kum saatinize kum ekliyorsunuz.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Kum saatiniz sihirli kumlarla dolu!
items.artifacts.timekeepershourglass$sandbag.name=sihirli kum torbası
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Bu kumu koyabileceğiniz bir kum saatiniz yok.
items.artifacts.timekeepershourglass$timefreeze.desc=Etrafınızdaki zaman donar, bu da anında eylemler gerçekleştirmenizi sağlar. Etki, iptal edilene veya kum saatinizin şarjı bitene kadar devam eder. Saldırmak veya sihir kullanmak da bu etkiyi bozar. \n\nŞarj kullanımına kadar tur sayısı: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Zaman Dondurma
items.artifacts.timekeepershourglass.ac_activate=AKTİVE ET
items.artifacts.timekeepershourglass.cursed=Lanetli kum saatini kullanamazsınız.
items.artifacts.timekeepershourglass.deactivate=Zaman dondurma özelliğini devre dışı bırakıyorsunuz.
items.artifacts.timekeepershourglass.desc=Bu büyük, süslü kum saati oldukça sade görünüyor, ancak ince işlenmiş çerçevesinde büyük bir güç hissediyorsunuz. Kum saatini döndürüp kumun dökülmesini izlerken, büyüsünün sizi kendine çektiğini hissedebiliyorsunuz; bu büyüyü kullanmak size zaman üzerinde bir kontrol sağlayacaktır.
items.artifacts.timekeepershourglass.desc_cursed=Lanetli kum saati yanınıza kilitlenmiş durumda, zaman akışınızı manipüle etmeye çalıştığını hissedebiliyorsunuz.
items.artifacts.timekeepershourglass.desc_hint=Kum saati biraz kum kaybetmiş gibi görünüyor, keşke birazını bulabilseydiniz...
items.artifacts.timekeepershourglass.freeze=Etrafımdaki zamanı dondur.
items.artifacts.timekeepershourglass.name=zaman tutucunun kum saati
items.artifacts.timekeepershourglass.no_charge=Kum saatiniz henüz kullanılabilecek kadar şarj olmadı.
items.artifacts.timekeepershourglass.onfreeze=Etrafınızdaki her şey aniden donup kalıyor.
items.artifacts.timekeepershourglass.onstasis=Dünya bir anda etrafınızda değişiyor gibi görünüyor.
items.artifacts.timekeepershourglass.prompt=Kum saatinin büyüsünü nasıl kullanmak istersiniz?\n\n ...
items.artifacts.timekeepershourglass.stasis=Kendimi hareketsiz hale getirdim.
items.artifacts.unstablespellbook.ac_add=EKLEMEK
items.artifacts.unstablespellbook.ac_read=OKUMAK
items.artifacts.unstablespellbook.blinded=Gözleriniz kapalıyken kitaptan okuyamazsınız.
items.artifacts.unstablespellbook.cursed=Lanetli bir büyü kitabından okuyamazsınız.
items.artifacts.unstablespellbook.desc=Bu kitap, yaşına göre şaşırtıcı derecede iyi durumda. Sayfaları çevirdikçe cızırtılar ve çıtırtılar çıkarıyor, dengesiz bir enerjiyle dolup taşıyor. Bu kitaptan okursanız, ne tür bir büyü yapacağınızı kimse bilemez.
items.artifacts.unstablespellbook.desc_cursed=Lanetli kitap sana yapıştı ve çoğu parşömeni kullanma yeteneğini engelliyor.
items.artifacts.unstablespellbook.desc_empowered=Kitaba eklediğiniz parşömenler güçle parıldıyor. Bu parşömenlerin etkilerinin egzotik versiyonunu seçebileceksiniz, ancak bunun için ek bir ücret ödemeniz gerekecek.
items.artifacts.unstablespellbook.desc_index=Kitap tamamlanmamış. Dizin şu anda aşağıdaki boş sayfalara işaret ediyor:
items.artifacts.unstablespellbook.infuse_scroll=Parşömenin enerjisini kitaba aktarıyorsunuz.
items.artifacts.unstablespellbook.name=kararsız büyü kitabı
items.artifacts.unstablespellbook.no_charge=Büyü kitabınızın enerjisi şu an tükendi.
items.artifacts.unstablespellbook.prompt=Bir kaydırma çubuğu seçin
items.artifacts.unstablespellbook.read_empowered=Büyü kitabına eklediğiniz parşömen enerjiyle dolup taşıyor. Bu parşömenin etkisinin normal veya egzotik versiyonunu kullanabilirsiniz. Egzotik versiyonu seçmek 1 yerine 2 kullanım hakkı gerektirecektir.
items.artifacts.unstablespellbook.unable_scroll=Bu parşömeni kitaba ekleyemezsiniz.
items.artifacts.unstablespellbook.unknown_scroll=Bu parşömenin ne tür bir parşömen olduğundan henüz emin değilsiniz.
items.bags.bag.discover_hint=Bu ürünü bir mağazadan satın alabilirsiniz.
items.bags.bag.name=sırt çantası
items.bags.magicalholster.desc=Bu ince kılıf, egzotik bir hayvan derisinden yapılmıştır ve çok sayıda menzilli silahı saklamasına olanak tanıyan güçlü bir sihir içerir. \n\nÇantaya uzanmanız yeterlidir ve aradığınız eşyayı her zaman bulabilirsiniz. \n\nKılıfın sihri sayesinde, asalar biraz daha hızlı şarj olur ve fırlatılan silahlar içinde biraz daha uzun süre dayanır.
items.bags.magicalholster.name=sihirli kılıf
items.bags.potionbandolier.desc=Bu kalın bandolier, göğsünüzün etrafına kuşak gibi oturur ve iksir şişelerinizi, su tulumunuzu veya sıvı metal şişelerinizi taşımak için üzerinde birçok yalıtımlı kayış bulunur. Bandolier içindeyken, iksirleriniz soğuktan korunacaktır.
items.bags.potionbandolier.name=iksir kemeri
items.bags.scrollholder.desc=Bu boru şeklindeki kap, bir astronomun aletlerini ve haritalarını tutacak gibi görünüyor, ancak parşömenleriniz de içine rahatlıkla sığacaktır. Hatta büyü kristalleri, gizemli kalemler ve gizemli reçine için de uygun birkaç yan bölmesi var. Kabın yanıcı olmadığı için parşömenleriniz içinde yangından güvende olacaktır.
items.bags.scrollholder.name=parşömen tutucu
items.bags.velvetpouch.desc=Bu küçük kadife kese, tohumlar, rün taşları ve bazı simya malzemeleri gibi birçok küçük eşyayı saklayabilir.
items.bags.velvetpouch.discover_hint=Kahramanlardan biri bu eşyayla başlıyor.
items.bags.velvetpouch.name=kadife kese
items.bombs.arcanebomb.desc=Bu bombaya gizemli özellikler yüklenmiştir. Goo'nun güçlendirilmiş saldırısına benzer güçlü bir patlamayla infilak edecek ve 2 kare içindeki her şeye _%1$d-%2$d büyülü hasar_ verecektir.
items.bombs.arcanebomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.arcanebomb.name=gizemli bomba
items.bombs.bomb$doublebomb.desc=İki adet ağır kara barut bombası yığını, anlaşılan birini bedava alıyorsunuz!
items.bombs.bomb$doublebomb.name=iki bomba
items.bombs.bomb.ac_lightthrow=IŞIK VE ATIŞ
items.bombs.bomb.desc=Oldukça ağır bir kara barut bombası. Bu bombanın patlaması, ona bitişik her şeye _%1$d-%2$d hasar_ verir ve bitişik arazinin veya eşyaların bir kısmını yok eder.
items.bombs.bomb.desc_burning=Bombanın fitili yanıyor, uzak durun veya söndürün!
items.bombs.bomb.desc_fuse=Görünüşe göre fitil bir kez tutuşturulduktan sonra tamamen yanması birkaç atış gerektirecek.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=Patlama seni öldürüyor...
items.bombs.bomb.rankings_desc=Patlama sonucu öldü.
items.bombs.bomb.snuff_fuse=Bombanın fitilini hızla söndürüyorsunuz.
items.bombs.firebomb.desc=Bu bomba, daha geniş bir alanda patlayacak şekilde modifiye edilmiştir ve _%1$d-%2$d hasar_ verip 2 karelik bir alanda sürekli alev yayar.
items.bombs.firebomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.firebomb.name=yangın bombası
items.bombs.flashbangbomb.desc=Bu özelleştirilmiş bomba patladığında ışık, ses ve elektrik patlamasına neden olacak. 2 kare içindeki her şey patlamadan _%1$d-%2$d hasar_ alacak, elektrikten ek olarak 25%% hasar alacak ve 10 tur boyunca sersemleyecek.
items.bombs.flashbangbomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.flashbangbomb.name=flaş bombası
items.bombs.frostbomb.desc=Bu bomba, daha geniş bir alanda patlayacak şekilde modifiye edilmiştir ve _%1$d-%2$d hasar_ verir ve 2 karelik bir alanda sürekli bir dondurucu hava akımı yayar.
items.bombs.frostbomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.frostbomb.name=don bombası
items.bombs.holybomb.desc=Bu bomba, patladığında daha geniş bir alana kutsal ışık saçacak şekilde modifiye edilmiştir. 2 kare içindeki her şey patlamadan _%1$d-%2$d hasar_ alacak ve ölümsüz veya şeytani düşmanlar kutsal ışıktan ek olarak 50%% hasar daha alacaktır.
items.bombs.holybomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.holybomb.name=kutsal bomba
items.bombs.noisemaker.desc=Bu özel yapım bomba, fitili bittiğinde tekrar tekrar ses çıkaracaktır. Bombaya bir şey dokunduğunda patlayacak ve 2 kare yarıçapındaki her şeye _%1$d-%2$d hasar_ verecektir!
items.bombs.noisemaker.desc_burning=Ses çıkaran alet tıkır tıkır çalışıyor, bir şey yaklaşınca patlayacak!
items.bombs.noisemaker.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.noisemaker.name=gürültücü
items.bombs.regrowthbomb.desc=Bu özelleştirilmiş bomba, patlamak yerine 3 karelik bir alana hayat veren sıvı püskürtecektir. Patlamanın etkilediği alan hızla çimen ve bitkilerle kaplanacaktır. Patlamaya maruz kalan siz ve müttefikleriniz, iyileştirici bir iksir içmiş gibi iyileşeceksiniz.
items.bombs.regrowthbomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.regrowthbomb.name=yeniden büyüme bombası
items.bombs.shrapnelbomb.desc=Bu bomba, DM-300'ün metal parçalarıyla modifiye edilmiştir; patladığında parçalara ayrılıp her yere saçılacak ve bombanın etrafındaki geniş bir alanda _%1$d-%2$d hasar_ verecektir. Kullanırken bir şeyin arkasına saklansanız iyi olur...
items.bombs.shrapnelbomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.shrapnelbomb.name=şarapnel bombası
items.bombs.smokebomb.desc=Bu bomba, patladığı anda yoğun bir gaz bulutu püskürtecek şekilde modifiye edilmiştir. _%1$d-%2$d hasar_ verecek ve 2 karelik bir alana sis yayacaktır.
items.bombs.smokebomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.smokebomb.name=sis bombası
items.bombs.woollybomb.desc=Bu özelleştirilmiş bomba, patladıktan sonra geniş bir alanda sihirli koyunlar yaratacak. Patlama, 2 kare içindeki her şeye _%1$d-%2$d hasar_ verecek. Koyunlar hareketi engelleyecek ve çok uzun süre kalacak! Ancak güçlü düşmanların varlığında koyunlar daha kısa süre kalacak ve onlarla etkileşime girerek daha erken manuel olarak ortadan kaldırılabilir.
items.bombs.woollybomb.discover_hint=Bu eşyayı simya yoluyla üretebilirsiniz.
items.bombs.woollybomb.name=yünlü bomba
items.brokenseal$warriorshield.desc_active=Savaşçının kırık mührü şu anda ona dayanıklılığını artırmada yardımcı oluyor ve sağlığına ek olarak kalkan sağlıyor. Kalkan ilk tetiklendikten sonra tekrar kullanılabilmesi için bir bekleme süresi vardır. Bu kalkan zamanla azalmaz, ancak birkaç tur boyunca yakınlarda düşman yoksa sona erer. Sona erdiğinde, kullanılmayan kalkan bekleme süresini en fazla 50'ye kadar azaltır. Kalan kalkan: Mevcut bekleme süresi:
items.brokenseal$warriorshield.desc_cooldown=Savaşçı, yakın zamanda kırılan mühründen kalkan etkisi kazandı ve bu kalkan etkisinden tekrar faydalanana kadar beklemek zorunda.\n\nKalan Tur Sayısı: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Savaşçının kalkanının bekleme süresi şu anda negatiftir, yani kalkanı etkinleştiğinde bekleme süresi normal 150 turdan daha düşük olacaktır. Kalkan bekleme süresi -150 tura kadar düşürülebilir, bu da etkinleştirildikten hemen sonra tekrar kullanılabilir olacağı anlamına gelir. Mevcut bekleme süresi: %d.
items.brokenseal$warriorshield.name=Savaşçı Kalkanı
items.brokenseal.ac_affix=TAKMAK
items.brokenseal.affix=Mührü zırhınıza yapıştırıyorsunuz!
items.brokenseal.choose_desc=Hem bu zırh hem de kırık mühür birer sembol taşıyor. Hangi sembolün saklanacağına karar verin. Zırh Sembolü: \n\n Kırık Mühür Sembolü: %2$s\n\n Şu anda zırh üzerinde bulunan sembolü seçerseniz, mühür daha sonra bu sembolü aktaramayacaktır.
