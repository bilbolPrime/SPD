items.weapon.missiles.boomerang.desc=Düşmana fırlatılan bu düz, kavisli ahşap füze, fırlatanın eline geri dönecektir.
items.weapon.missiles.boomerang.durability=Sağlam yapısı sayesinde bu bumerang kullanım sırasında kırılmaz.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Bu okların uçları, müttefiklerin hareket ve saldırı hızını artıracak veya düşmanların hareket hızını kısa süreliğine düşürecek, hızlı dikenli bitki bazlı bir bileşikle kaplanmıştır. Okun kendisi düşmanlar için hala zararlıdır, ancak müttefiklere zarar vermez.
items.weapon.missiles.darts.adrenalinedart.name=adrenalin oku
items.weapon.missiles.darts.blindingdart.desc=Bu dartların uçları, hedeflerini kısa süreliğine kör edecek kör ot bazlı bir bileşikle kaplanmıştır. Ancak yönlerini şaşırtmazlar, bu nedenle düşmanınız sizi en son nerede gördüğünü yine de bilecektir.
items.weapon.missiles.darts.blindingdart.name=kör edici ok
items.weapon.missiles.darts.chillingdart.desc=Bu dartların uçları, hedeflerini önemli ölçüde soğutacak buz örtüsü bazlı bir bileşik ile kaplanmıştır.
items.weapon.missiles.darts.chillingdart.name=ürpertici dart
items.weapon.missiles.darts.cleansingdart.desc=Bu okların uçları, müttefikleri geçici olarak tüm olumsuz etkilerden koruyacak veya düşmanlardan olumlu etkileri temizleyecek mageroyal bazlı bir bileşikle kaplanmıştır. Düşmanlar, size saldırdıklarını veya sizden kaçtıklarını kısa bir süreliğine bile unutabilirler. Okun kendisi düşmanlar için hala zararlıdır, ancak müttefiklere zarar vermez.
items.weapon.missiles.darts.cleansingdart.name=temizleme oku
items.weapon.missiles.darts.dart.ac_tip=UÇ
items.weapon.missiles.darts.dart.desc=Uçları sivri tahtadan yapılmış bu basit oklar, doğru yönde uçmaları ve bilek hareketiyle avlarını sokmaları için ağırlıklandırılmıştır. Fırlatıldıklarında ek etkiler elde etmek için uçlarına tohum yerleştirilebilir.
items.weapon.missiles.darts.dart.name=dart
items.weapon.missiles.darts.dart.prompt=Bir tohum seçin
items.weapon.missiles.darts.dart.tip_all=%1$d ok ucu, %2$d tohumu ile
items.weapon.missiles.darts.dart.tip_cancel=iptal etmek
items.weapon.missiles.darts.dart.tip_desc=Bir tohum, okların ucunu değiştirmek için bir veya iki okla birleştirilebilir. Her tohum türü, benzersiz ve tek kullanımlık bir etkiye sahip, kendine özgü uçlu bir ok üretir. \n\nBu tohumlarla bir okun ucunu değiştirmek _%s_ üretecektir.
items.weapon.missiles.darts.dart.tip_one=1 tohumlu 1 ok ucu
items.weapon.missiles.darts.dart.tip_title=Uçlu Dartlar
items.weapon.missiles.darts.dart.tip_two=1 tohumlu 2 ok ucu
items.weapon.missiles.darts.dart.unlimited_uses=Basit yapıları sayesinde dartlar neredeyse sonsuza kadar dayanır.
items.weapon.missiles.darts.displacingdart.desc=Bu dartların uçları, hedeflerini kısa bir mesafeye ışınlayacak olan fadeleaf bazlı bir bileşikle kaplanmıştır.
items.weapon.missiles.darts.displacingdart.name=yer değiştiren ok
items.weapon.missiles.darts.healingdart.desc=Bu okların uçları, hedeflerine ani bir iyileştirme etkisi sağlayan ayçiçek otu bazlı bir bileşikle kaplanmıştır. Okun kendisi düşmanlar için hala zararlıdır, ancak müttefiklere zarar vermez.
items.weapon.missiles.darts.healingdart.name=şifa oku
items.weapon.missiles.darts.holydart.desc=Bu okların uçları, hedeflerine kutsal enerji aşılayan yıldız çiçeği bazlı bir bileşikle kaplanmıştır. Müttefikler ve sıradan düşmanlar kutsanacak, ancak ölümsüz veya şeytani düşmanlar ağır hasar alacaktır. Okun kendisi düşmanlar için hala zararlıdır, ancak müttefiklere zarar vermez.
items.weapon.missiles.darts.holydart.name=kutsal ok
items.weapon.missiles.darts.incendiarydart.desc=Bu dartların uçları, çarpma anında parlak alevler saçacak olan ateş çiçeği bazlı bir bileşikle kaplanmıştır.
items.weapon.missiles.darts.incendiarydart.name=kundaklama oku
items.weapon.missiles.darts.paralyticdart.desc=Bu dartların uçları, hedeflerini kısa süreliğine felç edecek olan, toprak kökü bazlı bir bileşikle kaplanmıştır.
items.weapon.missiles.darts.paralyticdart.name=felç edici ok
items.weapon.missiles.darts.poisondart.desc=Bu okların uçları, hedeflerini zehirleyecek olan, keder yosunu bazlı bir bileşikle kaplanmıştır.
items.weapon.missiles.darts.poisondart.name=zehirli ok
items.weapon.missiles.darts.rotdart.desc=Bu zehirli okların uçları, temas ettikleri her şeyi hızla aşındıracak asidik bir çürük meyvesi bazlı bileşikle kaplıdır. Güçlü düşmanlar bu etkinin çoğuna direnebilir, ancak aşındırma etkisi çoğu standart düşmanı kolayca öldürecek kadar güçlüdür. Bu oklar diğer uçlu oklardan daha uzun süre dayanır, ancak dayanıklılıkları artırılamaz.
items.weapon.missiles.darts.rotdart.discover_hint=Bu öğeyi belirli bir görevden elde edilen bir tohum kullanarak oluşturabilirsiniz.
items.weapon.missiles.darts.rotdart.name=çürük ok
items.weapon.missiles.darts.shockingdart.desc=Bu dartların uçları, hedeflerine şiddetli bir şok etkisi yaratacak olan, asma bitkisinden elde edilen bir bileşik ile kaplanmıştır.
items.weapon.missiles.darts.shockingdart.name=şok edici dart
