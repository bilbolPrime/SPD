items.amulet.ac_end=OYUNU SONLANDIR
items.amulet.ascent_desc=Tılsım'dan yayılan Yog-Dzewa'nın muazzam ve korkunç gücünü hissetmeye başlıyorsunuz. Ölümlü olarak zindandan geri çıkmak düşündüğünüzden daha zor olabilir! \n\nTılsım ile yukarı çıkmaya devam ederseniz zindan daha tehlikeli hale gelecek, katlar arası ışınlanma devre dışı kalacak ve oyunu yalnızca zindanda yukarı çıkarken düşmanları yenerek kazanabileceksiniz! \n\nBu mücadeleye başlamadan yukarı çıkmak istiyorsanız tılsımı şimdilik burada bırakabilirsiniz veya oyunu normal şekilde bitirmek için yukarı çıkmadan önce tılsımı etkinleştirebilirsiniz.
items.amulet.ascent_no=Şimdilik dur
items.amulet.ascent_title=Yükseliş
items.amulet.ascent_yes=Devam etmek!
items.amulet.desc=Yendor Tılsımı, insan veya cüce ırkı tarafından bilinen en güçlü eserdir. Parıldayan kristalleri inanılmaz ve harika bir güç içerir.
items.amulet.desc_ascent=Tılsımın kökeni bilinmiyor, ancak açıkça Yog-Dzewa'nın gücünden büyük ölçüde etkilenmiş. Zindanda ilerledikçe, Yog'un iradesine boyun eğiyor gibi görünüyor, düşmanlar çok daha fazla ve güçlü hale geliyor! Ayrıca artık tılsımı etkinleştiremiyor veya atamıyorsunuz, neredeyse lanetlenmiş gibi.
items.amulet.desc_origins=Tılsımın kökeni bilinmiyor. Tarih, Cüceler Kralı'nın, Cüce uygarlığı tüm iletişimi kesmeden kısa bir süre önce bu eseri keşfettiğini övünerek anlattığını söylüyor. Peki onu nasıl buldu? Yog-Dzewa onu ondan nasıl aldı? Belki de bu sorular başka bir zamanın konusu, şu an önemli olan tek şey tılsımın sizin olması!
items.amulet.discover_hint=Bu eşyayı zindanın en dibinde bulabilirsiniz...
items.amulet.name=Yendor'un tılsımı
items.ankh.ac_bless=kutsasın
items.ankh.bless=Ankh'ı sihirli suyla kutsuyorsunuz.
items.ankh.desc=Ölümsüzlüğün bu kadim simgesi, öldükten sonra hayata dönmeni sağlar. Dirilirken kuşanmadığın bütün eşyalar kaybolur.
items.ankh.desc_blessed=Bu kadim ölümsüzlük sembolü, ölümden sonra hayata geri dönme yeteneği bahşeder. Ankh kutsanmıştır ve artık çok daha güçlüdür. Ankh, ölümcül bir tehlike anında sizi kurtarmak için kendini feda edecektir.
items.ankh.discover_hint=Bu ürünü bir mağazadan satın alabilirsiniz.
items.ankh.name=ankh
