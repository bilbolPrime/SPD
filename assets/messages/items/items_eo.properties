items.weapon.melee.warhammer.typical_ability_desc=La Duelanto povas plenumi _pezan baton_ per militmartelo. Ĉi tiu koncentrita atako tipe kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.warscythe.ability_desc=La Duelanto povas _rikolti_ malamikon per militfalĉilo. Ĉi tiu detruiga atako certe trafos kaj kaŭzas _%d damaĝon_. Ĉi tiu damaĝo aplikiĝas kiel sangado se la celo ne estas imuna.
