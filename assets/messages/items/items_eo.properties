items.weapon.melee.whip.typical_ability_desc=La Duelanto povas _vipi_ ĉiujn malamikojn ĉirkaŭ ŝi per vipo. Ĉi tiu kapablo tipe kaŭzas _%1$d-%2$d damaĝon_, atakas ĉiujn malamikojn ene de atakdistanco, kaj estas garantiite trafi.
items.weapon.melee.wornshortsword.ability_desc=La Duelanto povas _fendi_ malamikon per eluzita mallonga glavo. Tio kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
items.weapon.melee.wornshortsword.ability_name=fendi
