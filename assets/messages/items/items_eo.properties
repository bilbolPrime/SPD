items.weapon.melee.dagger.name=ponardo
items.weapon.melee.dagger.stats_desc=Ĉi tiu armilo estas pli forta kontraŭ nekonsciaj malamikoj.
items.weapon.melee.dagger.typical_ability_desc=La Duelanto povas _ŝteliri_ dum tenado de ponardo. Ĉi tiu kapablo permesas al la Duelanto tuj palpebrumi ĝis 5 kahelojn for kaj tipe donas al ŝi _%d vicojn de nevidebleco_.
items.weapon.melee.dagger.upgrade_ability_stat_name=Daŭro de kapablo
items.weapon.melee.dirk.ability_desc=La Duelanto povas _ŝteliri_ dum ŝi tenas ponardon. Ĉi tiu kapablo permesas al la Duelanto tuj palpebrumi ĝis 4 kahelojn for kaj donas al ŝi _%d vicojn de nevidebleco_.
items.weapon.melee.dirk.ability_name=ŝteliri
items.weapon.melee.dirk.desc=Pli longa puŝponardo donas iom pli da ŝtalo por plonĝi en malamikojn.
