items.rings.ringofsharpshooting.combined_stats=Viaj ekipitaj ringoj kombinas ilian potencon, pliigante la nivelon de efika ĵetarmilo je _%1$d_ kaj pliigante ilian daŭrecon je _%2$s%%_ entute.
items.rings.ringofsharpshooting.desc=Ĉi tiu ringo plibonigas la precizecon kaj celadon de la portanto, kio igos ĉiujn kuglarmilojn pli damaĝaj kaj daŭremaj. Malbenita ringo havos la kontraŭan efikon.
items.rings.ringofsharpshooting.name=ringo de pafpafado
items.rings.ringofsharpshooting.stats=Kiam portata, ĉi tiu ringo pliigos la damaĝon de viaj ĵetarmiloj kvazaŭ ilia nivelo estus pliigita je _%1$d_, kaj pliigos ilian daŭrecon je _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Kiam portata, ĉi tiu ringo tipe pliigos la damaĝon de viaj ĵetarmiloj kvazaŭ ilia nivelo estus pliigita je _%1$d_ kaj pliigos ilian daŭrecon je _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Nivela Difekto-Akcelo
items.rings.ringofsharpshooting.upgrade_stat_name_2=Daŭripova Akcelo
items.rings.ringoftenacity.combined_stats=Viaj ekipitaj ringoj kombinas sian potencon, reduktante la damaĝon, kiun vi ricevas, je ĝis _%s%%_ entute.
items.rings.ringoftenacity.desc=Kiam portata, ĉi tiu ringo permesas al la portanto rezisti normale mortigajn batojn. Ju pli vundita la uzanto estas, des pli rezistema li/ŝi estos al damaĝo. Malbenita ringo anstataŭe faciligos al malamikoj ekzekuti la portanton.
