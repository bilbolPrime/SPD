items.artifacts.skeletonkey$keywall.desc=Provizora magia muro estis metita ĉi tien apud la skeletŝlosilo.
items.artifacts.skeletonkey.ac_insert=ENMETI
items.artifacts.skeletonkey.crystal_charges=Malfermi kristalan seruron postulas 5 ŝargojn.
items.artifacts.skeletonkey.cursed=Vi ne povas uzi malbenitan skeletŝlosilon.
items.artifacts.skeletonkey.desc=Graveaspektanta ŝlosilo kun kapo formita kiel kranio. Ĝiaj dentoj ŝajnas esti malsamaj ĉiufoje kiam oni rigardas ilin.
items.artifacts.skeletonkey.desc_cursed=La malbenita ŝlosilo ŝajnas aktive eviti konveni en iun ajn seruron, kaj eĉ malfaciligas (sed ne malebligas) por vi uzi viajn aliajn ŝlosilojn.
items.artifacts.skeletonkey.desc_worn=Ŝajnas, ke ĉi tiu magia ŝlosilo akiras potencon kiam vi uzas ĝin anstataŭ la regulaj ŝlosiloj de la kelkarcero. Ĝi povas esti enigita en preskaŭ ajnan el la seruroj de la kelkarcero por malfermi aŭ fermi ilin, inkluzive de pordoj, kiuj neniam antaŭe estis ŝlositaj. \n\nLa ŝlosilo eĉ povas esti uzata sur malplena spaco en ĉefa aŭ diagonala direkto por "ŝlosi" la aeron antaŭ vi, kreante 3-kahelan larĝan solidan muron, kiu daŭras 10 turnojn. Ŝlosado forpuŝos malamikojn se estas spaco por fari tion.
items.artifacts.skeletonkey.discard=Vi forĵetas viajn superfluajn ŝlosilojn.
items.artifacts.skeletonkey.force_lock=La seruro malfortiĝis sen via skeletŝlosilo. Vi sukcesas perforte malfermi ĝin.
items.artifacts.skeletonkey.gold_charges=Malfermi oran seruron postulas 2 ŝargojn.
items.artifacts.skeletonkey.invalid_target=Nenio estas tie por ŝlosi aŭ malŝlosi.
items.artifacts.skeletonkey.iron_charges=Malfermi normalan seruron postulas 1 ŝargon.
items.artifacts.skeletonkey.levelup=Via skeletŝlosilo plifortiĝas!
items.artifacts.skeletonkey.lock_charges=Ŝlosi pordon postulas 2 ŝargojn.
items.artifacts.skeletonkey.lock_no_space=Vi ne povas ŝlosi rolulon interne de pordo!
items.artifacts.skeletonkey.locked_with_key=Tiu pordo estis ŝlosita per via skeletŝlosilo.
items.artifacts.skeletonkey.name=skeletŝlosilo
items.artifacts.skeletonkey.prompt=Elektu celon
items.artifacts.skeletonkey.wall_charges=Krei provizoran muron postulas 2 ŝargojn.
items.artifacts.skeletonkey.wont_open=La ŝlosilo pro iu kialo rifuzas eniri ĉi tiun seruron.
items.artifacts.talismanofforesight$foresight.desc=Vi sentas vin tre nervoza, kvazaŭ estus proksime nevidita danĝero.
items.artifacts.talismanofforesight$foresight.name=antaŭscio
items.artifacts.talismanofforesight$foresight.uneasy=Vi sentas vin malkomforte.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Glata ŝtono kun strangaj gravuraĵoj sur ĝi. Vi sentas kvazaŭ ĝi observas ĉion ĉirkaŭ vi, atentante pri io ajn kaŝita.
items.artifacts.talismanofforesight.desc_cursed=La malbenita talismano atente rigardas vin, malakrigante viajn sentojn.
items.artifacts.talismanofforesight.desc_worn=Kiam vi tenas la talismanon, vi sentas, ke viaj sentoj plifortiĝas. La talismano malrapide ŝargiĝas dum la tempo pasas kaj kiam vi malkovras kaŝitajn pordojn aŭ kaptilojn. \n\nLa talismano povas elspezi sian ŝargon por "spritigi" en konusa formo, kiu malkaŝas ĉiujn kahelojn kaj sekretojn en la skanita areo, kaj donos al vi vidon de malamikoj kaj objektoj dum mallonga tempo.
items.artifacts.talismanofforesight.full_charge=Via Talismano estas plene ŝargita!
items.artifacts.talismanofforesight.levelup=Via Talismano plifortiĝas!
items.artifacts.talismanofforesight.low_charge=La talismano postulas almenaŭ 5% ŝargon por skrii.
items.artifacts.talismanofforesight.name=talismano de antaŭscio
items.artifacts.talismanofforesight.prompt=Elektu lokon por skani.
items.artifacts.timekeepershourglass$sandbag.desc=Ĉi tiu malgranda saketo da fajna sablo devus perfekte funkcii kun via sablohorloĝo.\n\nŜajnas strange, ke la butikisto havus ĉi tiun specifan aĵon ĝuste kiam vi bezonas ĝin...
items.artifacts.timekeepershourglass$sandbag.levelup=Vi aldonas la sablon al via sablohorloĝo.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Via sablohorloĝo estas plena de magia sablo!
items.artifacts.timekeepershourglass$sandbag.name=sako da magia sablo
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Vi ne havas sablohorloĝon por meti ĉi tiun sablon en ĝin.
items.artifacts.timekeepershourglass$timefreeze.desc=Tempo frostiĝas ĉirkaŭ vi, permesante al vi plenumi agojn tuj. La efiko daŭros ĝis ĝi nuliĝos aŭ via sablohorloĝo elĉerpiĝos. Atakado aŭ uzado de magio ankaŭ rompos ĉi tiun efikon.\n\nTurnas ĝis ŝargado: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Tempa Frostigo
items.artifacts.timekeepershourglass.ac_activate=AKTIVIGI
items.artifacts.timekeepershourglass.cursed=Vi ne povas uzi malbenitan sablohorloĝon.
items.artifacts.timekeepershourglass.deactivate=Vi malaktivigas la tempofrostigon.
items.artifacts.timekeepershourglass.desc=Ĉi tiu granda ornamita sablohorloĝo aspektas sufiĉe modesta, sed vi sentas grandan potencon en ĝia fajne ĉizita kadro. Dum vi rotacias la sablohorloĝon kaj rigardas la sablon verŝiĝi, vi povas senti ĝian magion tirantan vin, certe uzi ĉi tiun magion donus al vi iom da kontrolo super la tempo.
items.artifacts.timekeepershourglass.desc_cursed=La malbenita sablohorloĝo estas ŝlosita ĉe via flanko, vi povas senti ĝin provi manipuli vian fluon de tempo.
items.artifacts.timekeepershourglass.desc_hint=La sablohorloĝo ŝajnas esti perdinta iom da sablo, se nur vi povus trovi iom...
items.artifacts.timekeepershourglass.freeze=Frostigu tempon ĉirkaŭ mi
items.artifacts.timekeepershourglass.name=sablohorloĝo de kronometristo
items.artifacts.timekeepershourglass.no_charge=Via sablohorloĝo ankoraŭ ne reŝargiĝis sufiĉe por esti uzebla.
items.artifacts.timekeepershourglass.onfreeze=Ĉio ĉirkaŭ vi subite frostiĝas.
items.artifacts.timekeepershourglass.onstasis=La mondo ŝajnas ŝanĝiĝi ĉirkaŭ vi en momento.
items.artifacts.timekeepershourglass.prompt=Kiel vi ŝatus uzi la magion de la sablohorloĝo?\n\nDum stazo, la tempo moviĝos normale dum vi estas frostigita kaj tute nevundebla, konsumas ĝis 2 ŝargojn samtempe.\n\nKiam tempo estas frostigita, vi povas moviĝi kvazaŭ viaj agoj daŭrus nenian tempon. Ĉi tio povas esti malaktivigita iam ajn per uzado de la sablohorloĝo aŭ atakado.
items.artifacts.timekeepershourglass.stasis=Metu min en stazon
items.artifacts.unstablespellbook.ac_add=ALDONU
items.artifacts.unstablespellbook.ac_read=LEGU
items.artifacts.unstablespellbook.blinded=Vi ne povas legi el la libro dum blindeco.
items.artifacts.unstablespellbook.cursed=Vi ne povas legi el malbenita sorĉlibro.
items.artifacts.unstablespellbook.desc=Ĉi tiu volumo estas en surprize bona stato konsiderante sian aĝon. Ĝi ŝaŭmas kaj kraketas dum vi movas la paĝojn, ŝprucante de malstabila energio. Se vi legas el ĉi tiu libro, ne eblas scii, kian sorĉon vi eble ĵetos.
items.artifacts.unstablespellbook.desc_cursed=La malbenita libro ligis sin al vi, ĝi malhelpas vian kapablon uzi la plej multajn volvlibrojn.
items.artifacts.unstablespellbook.desc_empowered=La volvlibroj, kiujn vi aldonis al la libro, brilas per potenco. Vi povos elekti la ekzotikan version de la efikoj de ĉi tiuj volvlibroj, sed je kosto de aldona pago.
items.artifacts.unstablespellbook.desc_index=La libro estas nekompleta. Ĝia indekso nuntempe montras al la jenaj malplenaj paĝoj:
items.artifacts.unstablespellbook.infuse_scroll=Vi enmetas la energion de la volvaĵo en la libron.
items.artifacts.unstablespellbook.name=malstabila sorĉlibro
items.artifacts.unstablespellbook.no_charge=Via sorĉlibro nun elĉerpis energion.
items.artifacts.unstablespellbook.prompt=Elektu volvlibron
items.artifacts.unstablespellbook.read_empowered=La volvlibro, kiun vi aldonis al la sorĉlibro, ŝprucas de energio. Vi povas kanaligi aŭ la normalan aŭ la ekzotikan version de la efiko de ĉi tiu volvlibro.\n\nElekti la ekzotikan variaĵon kostos 2 ŝargojn anstataŭ 1.
items.artifacts.unstablespellbook.unable_scroll=Vi ne povas aldoni ĉi tiun volvlibron al la libro.
items.artifacts.unstablespellbook.unknown_scroll=Vi ankoraŭ ne certas, kia volvlibro ĉi tio estas.
items.bags.bag.discover_hint=Vi povas aĉeti ĉi tiun objekton en vendejo.
items.bags.bag.name=dorsosako
items.bags.magicalholster.desc=Ĉi tiu maldika pistolujo estas farita el iu ekzotika besthaŭto, kaj posedas potencan magion, kiu ebligas al ĝi stoki grandegan kvanton da distancarmiloj. \n\nVi povas simple etendi la manon en la sakon kaj ĉiam prenos la objekton, kiun vi serĉis. \n\nPro la magio de la pistolujo, sorĉbastonoj ŝargiĝos iom pli rapide kaj ĵetarmiloj daŭros iom pli longe interne de ĝi.
items.bags.magicalholster.name=magia pistolujo
items.bags.potionbandolier.desc=Ĉi tiu dika bandoliero sidas ĉirkaŭ via brusto kiel zono, ĝi havas multajn izolitajn rimenojn sur ĝi por teni pociofioletojn, vian akvosakon aŭ likvajn metalajn fioletojn. \n\n Interne de la bandoliero, viaj pocioj devus esti protektitaj kontraŭ la malvarmo.
items.bags.potionbandolier.name=pociobandoliero
items.bags.scrollholder.desc=Ĉi tiu tubforma ujo aspektas kvazaŭ ĝi enhavus la ilojn kaj diagramojn de astronomo, sed viaj volvlibroj same bone taŭgos. Estas eĉ kelkaj flankaj fakoj, kiuj bone konvenus al sorĉkristaloj, arkanaj grifeloj kaj arkana rezino. \n\nLa tenilo ne aspektas tre flamiĝema, do viaj volvlibroj devus esti protektitaj kontraŭ fajro interne.
items.bags.scrollholder.name=volvlibro-tenilo
items.bags.velvetpouch.desc=Ĉi tiu malgranda velura saketo povas enhavi multajn malgrandajn objektojn, kiel ekzemple semojn, runŝtonojn kaj kelkajn alĥemiajn ingrediencojn.
items.bags.velvetpouch.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.bags.velvetpouch.name=velura saketo
items.bombs.arcanebomb.desc=Ĉi tiu bombo estas trapenetrita per arkanaj ecoj. Ĝi eksplodos en potencan eksplodon similan al la ŝveligita atako de Goo, kaŭzante _%1$d-%2$d magian damaĝon_ al io ajn ene de 2 kaheloj.
items.bombs.arcanebomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.arcanebomb.name=arkana bombo
items.bombs.bomb$doublebomb.desc=Stako de du pezaj nigrapulvaj bomboj, aspektas kvazaŭ vi ricevas unu senpage!
items.bombs.bomb$doublebomb.name=du bomboj
items.bombs.bomb.ac_lightthrow=LUMO & ĴETU
items.bombs.bomb.desc=Sufiĉe forta nigrapulva bombo. Eksplodo de ĉi tiu bombo kaŭzas _%1$d-%2$d damaĝon_ al io ajn apuda, kaj detruos iujn apudajn terenojn aŭ objektojn.
items.bombs.bomb.desc_burning=La meĉo de la bombo forbrulas, tenu distancon aŭ estingu ĝin!
items.bombs.bomb.desc_fuse=Ŝajnas, ke la meĉo bezonos kelkajn rondojn por bruliĝi post kiam ĝi ekbrulos.
items.bombs.bomb.name=bombo
items.bombs.bomb.ondeath=La eksplodo vin mortigas...
items.bombs.bomb.rankings_desc=Mortigita per eksplodo
items.bombs.bomb.snuff_fuse=Vi rapide estingas la meĉon de la bombo.
items.bombs.firebomb.desc=Ĉi tiu bombo estis modifita por eksplodi en pli granda areo, kaŭzante _%1$d-%2$d damaĝon_ kaj disvastigante daŭran flamon ene de 2 kaheloj.
items.bombs.firebomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.firebomb.name=brulbombo
items.bombs.flashbangbomb.desc=Ĉi tiu personigita bombo erupcios en eksplodon de lumo, sono kaj elektro kiam ĝi eksplodos. Ĉio ene de 2 kaheloj ricevos _%1$d-%2$d damaĝon_ de la eksplodo, plian 25%% damaĝon de la elektro, kaj estos ŝokita dum 10 vicoj.
items.bombs.flashbangbomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.flashbangbomb.name=fulmo-eksplodo
items.bombs.frostbomb.desc=Ĉi tiu bombo estis modifita por eksplodi en pli granda areo, kaŭzante _%1$d-%2$d damaĝon_ kaj disvastigante daŭran ekblovon de frosta aero ene de 2 kaheloj.
items.bombs.frostbomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.frostbomb.name=frostbombo
items.bombs.holybomb.desc=Ĉi tiu bombo estis modifita por ekbriligi sanktan lumon en pli granda areo kiam ĝi eksplodas. Ĉio ene de 2 kaheloj ricevos _%1$d-%2$d damaĝon_ de la eksplodo, kaj malmortaj aŭ demonaj malamikoj ricevos plian 50%% damaĝon de la sankta lumo.
items.bombs.holybomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.holybomb.name=sankta bombo
items.bombs.noisemaker.desc=Ĉi tiu personigita bombo plurfoje bruos kiam ĝia meĉo elĉerpiĝos. Kiam io tuŝas la bombon, ĝi eksplodos kaj kaŭzos _%1$d-%2$d damaĝon_ al io ajn ene de 2 kaheloj!
items.bombs.noisemaker.desc_burning=La bruigilo tiktakas, ĝi eksplodos kiam io alproksimiĝos!
items.bombs.noisemaker.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.noisemaker.name=bruemigilo
items.bombs.regrowthbomb.desc=Ĉi tiu personigita bombo ŝprucigos vivigan likvaĵon ĉien ene de 3 kaheloj anstataŭ eksplodi. La areo kaptita de la eksplodo rapide burĝonigos herbon kaj plantojn. Vi kaj ĉiuj aliancanoj kaptitaj de la eksplodo resaniĝos kvazaŭ ili trinkis pocion de resanigo.
items.bombs.regrowthbomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.regrowthbomb.name=rekreska bombo
items.bombs.shrapnelbomb.desc=Ĉi tiu bombo estis modifita per pecetoj de la metalo de DM-300, kiuj fragmentiĝos kaj flugos ĉien kiam ĝi eksplodos, kaŭzante _%1$d-%2$d damaĝon_ en grandega distanco ĉirkaŭ la bombo. Vi pli bone kaŝu vin malantaŭ io dum uzado de ĝi...
items.bombs.shrapnelbomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.shrapnelbomb.name=ŝrapnela bombo
items.bombs.smokebomb.desc=Ĉi tiu bombo estis modifita por elsputi densan nubon da gaso samtempe kun eksplodo. Ĝi kaŭzos _%1$d-%2$d damaĝon_ kaj disvastigos kovrantan nebulon ene de 2 kaheloj.
items.bombs.smokebomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.smokebomb.name=fumobombo
items.bombs.woollybomb.desc=Ĉi tiu personigita bombo kreos larĝan kampon de magiaj ŝafoj post eksplodo. La eksplodo kaŭzos _%1$d-%2$d damaĝon_ al io ajn ene de 2 kaheloj. La ŝafo blokos movadon kaj daŭros tre longe! La ŝafo tamen ne daŭros tiel longe en la ĉeesto de potencaj malamikoj, kaj povas esti permane dispelita pli frue per interagado kun ili.
items.bombs.woollybomb.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.bombs.woollybomb.name=lana bombo
items.brokenseal$warriorshield.desc_active=La rompita sigelo de la Militisto nuntempe helpas lin persisti, donante al li ŝirmadon aldone al lia sano. Estas malvarmiĝtempo post kiam la ŝirmado komence ekfunkcias antaŭ ol ĝi povas esti uzata denove.\n\nĈi tiu ŝildo ne kadukiĝas laŭlonge de la tempo, sed finiĝos se neniuj malamikoj estas proksime dum kelkaj turnoj. Kiam ĝi finiĝas, iu ajn neuzata ŝirmado reduktos la malvarmiĝtempon, ĝis maksimumo de 50%%.\n\nRestanta ŝildo: %1$d.\n\nAktuala malvarmiĝtempo: %2$d.
items.brokenseal$warriorshield.desc_cooldown=La Militisto ĵus akiris ŝirmadon de sia rompita sigelo, kaj devas atendi ĝis li denove povos profiti de ĝia ŝirma efiko. \n\nRestantaj Turnoj: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=La malvarmiĝtempo de la ŝildo de la Militisto estas nuntempe negativa, kio signifas, ke kiam lia ŝildo aktiviĝas, la malvarmiĝtempo estos pli malalta ol la kutimaj 150 vicoj. La malvarmiĝtempo de la ŝildo povas esti reduktita ĝis -150 vicoj, kio signifas, ke ĝi tuj estos havebla denove post kiam ĝi estos aktivigita. \n\nAktuala malvarmiĝtempo: %d.
items.brokenseal$warriorshield.name=Militista Ŝildo
items.brokenseal.ac_affix=AFIKSIO
items.brokenseal.affix=Vi algluas la sigelon al via kiraso!
items.brokenseal.choose_desc=Kaj ĉi tiu kiraso kaj la rompita sigelo portas glifon. Elektu kiun glifon konservi.\n\nKirasa Glifo: %1$s\nRompita Sigela Glifo: %2$s\n\nNotu, ke se vi elektas la glifon, kiu nuntempe estas sur la kiraso, la sigelo ne povos transdoni ĝin poste.
items.brokenseal.choose_title=Elektu Glifon
items.brokenseal.cursed_armor=La sigelo ne aplikiĝos al malbenita kiraso.
items.brokenseal.desc=Vaksa sigelo, fiksita al kiraso kiel simbolo de kuraĝo. Ĝi havas paliĝintan runon de protekto gravuritan en la centro, kaj estas fendita duone trans la mezo. \n\nMemoraĵo el lia hejmo, la sigelo helpas la militiston persisti. Dum portado de la sigelo, la militisto tuj gajnos ŝirmadon kiam li estas ronde esti difektita al duono de sia sano aŭ malpli. \n\nLa sigelo povas esti _fiksita al kiraso,_ kaj movita inter kirasoj. Ĝi povas porti unuopan plibonigon kun si, kondiĉe ke tiu plibonigo estis aplikita al la kiraso dum la sigelo estis ligita al ĝi.
items.brokenseal.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.brokenseal.inscribed=La sigelo estas gravurita per _%s._
items.brokenseal.name=rompita sigelo
items.brokenseal.prompt=Elektu Kirason
items.brokenseal.unknown_armor=Vi devas unue identigi ĉu tiu kiraso estas malbenita aŭ ne.
items.dewdrop.already_full=Vi jam havas plenan sanon.
items.dewdrop.desc=Kristalklara rosguto.
items.dewdrop.name=rosguto
items.dewvial.ac_drink=TRINKI
items.dewvial.auto_drink=La rosflakono estis malplenigita por resanigi viajn vundojn.
items.dewvial.collected=Vi kolektis rosoguton en vian rosflakonon.
items.dewvial.desc=En ĉi tiu eta flakono vi povas konservi superfluan roson por trinki ĝin poste. Se la flakono estas plena, vi aŭtomate trinkos la roson en morta danĝero.
items.dewvial.empty=Via rosflakono estas malplena!
items.dewvial.full=Via rosflakono estas plena!
items.dewvial.name=rosflakono
items.energycrystal.desc=Kolekto de malgrandaj magiaj kristaloj, plenaj de alkemia energio. \n\n Ĉi tiuj kristaloj estas la plej ofta ingredienco en alkemiaj receptoj kaj povas esti produktitaj ĉe alkemia poto per skrapado de konsumeblaj objektoj.
items.energycrystal.name=energia kristalo
items.equipableitem.ac_equip=EKIPI
items.equipableitem.ac_unequip=MALEKIPI
items.equipableitem.curse_detected=Vi sentas, ke la objekto estas malbenita ĝuste antaŭ ol vi ekipas ĝin!
items.equipableitem.unequip_cursed=Vi ne povas forigi malbenitan objekton!
items.food.berry.desc=Ĉi tiun malgrandan beron trovis la Ĉasistino inter la vegetaĵaro de la kelkarcero. Ĝi estas rapide manĝebla, redonas iom da sateco, kaj eble enhavas uzeblan semon!
items.food.berry.discover_hint=Vi povas trovi ĉi tiun objekton uzante specifan heroo-talenton.
items.food.berry.eat_msg=Tiu bero estis bongusta!
items.food.berry.name=kelkarcera bero
