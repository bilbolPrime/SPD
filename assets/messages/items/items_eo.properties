items.weapon.melee.flail$spinabilitytracker.desc=La Duelanto turnas sian draŝilon, kreskigante damaĝon por ŝia sekva regula atako per ĝi. Ĉiu turno daŭras unu vicon sed pliigas la damaĝon, ĝis maksimumo de tri turnoj. La draŝilo ankaŭ garantiite trafos dum turnado.\n\nNunaj turnoj: %1$d%%.\nRestaj turnoj: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=turniĝante
items.weapon.melee.flail.ability_desc=La Duelanto povas _turni_ draŝilon por akumuli potencon por mallonga tempo. Ĉiun vicon kiam la draŝilo estas turnita, ĝi kaŭzos _+%d damaĝon_ dum sia sekva regula atako, ĝis maksimume 3 fojojn. Turniĝanta draŝilo ankaŭ garantiite trafos. Nur komenci turnigi la draŝilon kostas ŝargon.
items.weapon.melee.flail.ability_name=spino
items.weapon.melee.flail.desc=Pikita pilko ligita al tenilo per ĉeno. Tre maloportuna, sed detruega se ĝi trafas forte.
items.weapon.melee.flail.name=draŝilo
items.weapon.melee.flail.spin_warn=Vi ne plu povas turni la draŝilon.
items.weapon.melee.flail.stats_desc=Ĉi tiu armilo estas sufiĉe malpreciza. \n Ĉi tiu armilo ne povas surprizataki.
items.weapon.melee.flail.typical_ability_desc=La Duelanto povas _turni_ draŝilon por akumuli potencon por mallonga tempo. Ĉiun vicon kiam la draŝilo estas turnita, ĝi tipe kaŭzos _+%d damaĝon_ dum sia sekva regula atako, ĝis maksimume 3 fojojn. Turniĝanta draŝilo ankaŭ garantiite trafos. Nur komenci turnigi la draŝilon kostas ŝargon.
items.weapon.melee.gauntlet.ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ per ŝtona ganto. Ĉi tiu atako garantiite trafos kaj kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per normala manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.gauntlet.ability_name=kombinita striko
items.weapon.melee.gauntlet.desc=Ĉi tiu masiva ganto estas farita el karmezina ŝtofo kun peza magia ŝtono tavoligita supre. La ŝtofo streĉiĝas ĉirkaŭ vi, igante la dikajn ŝtonplatojn preskaŭ kiel dua haŭto. Svingi tian pezan armilon postulas forton, sed aldonas grandegan forton al viaj batoj.
items.weapon.melee.gauntlet.name=ŝtona ganto
items.weapon.melee.gauntlet.stats_desc=Ĉi tiu estas tre rapida armilo.
items.weapon.melee.gauntlet.typical_ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ per ŝtona ganto. Ĉi tiu atako garantiite trafos kaj tipe kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per regula manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.glaive.ability_desc=La Duelanto povas uzi la pinton de glavo por _piki_ malamikon, kiu estas en atingodistanco sed ne apuda. Tio kaŭzas _%1$d-%2$d damaĝon_, repuŝas la malamikon, kaj ĝi garantiite trafos.
items.weapon.melee.glaive.ability_name=pikilo
items.weapon.melee.glaive.desc=Masiva astarmilo konsistanta el glavoklingo ĉe la fino de stango.
items.weapon.melee.glaive.name=glavo
items.weapon.melee.glaive.stats_desc=Ĉi tiu estas sufiĉe malrapida armilo. \n Ĉi tiu armilo havas ekstran atingon.
items.weapon.melee.glaive.typical_ability_desc=La Duelanto povas uzi la pinton de glavo por _piki_ malamikon, kiu estas en atingodistanco sed ne apuda. Tio tipe kaŭzas _%1$d-%2$d damaĝon_, repuŝas la malamikon, kaj ĝi garantiite trafos.
items.weapon.melee.gloves.ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ kun ŝtofitaj gantoj. Ĉi tiu atako garantiite trafos kaj kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per normala manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.gloves.ability_name=kombinita striko
items.weapon.melee.gloves.desc=Ĉi tiuj ŝtofitaj gantoj ne provizas veran protekton, sed ili funkcias kiel utila armilo dum ili tenas la manojn liberaj.
items.weapon.melee.gloves.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.weapon.melee.gloves.name=ŝtofitaj gantoj
items.weapon.melee.gloves.stats_desc=Ĉi tiu estas tre rapida armilo.
items.weapon.melee.gloves.typical_ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ kun ŝtofitaj gantoj. Ĉi tiu atako garantiite trafos kaj tipe kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per regula manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.greataxe.ability_desc=La Duelanto povas plenumi _venĝan_ atakon per granda hakilo se ŝi havas sanon sub 50%%. Ĉi tiu detruiga atako kaŭzas _%1$d-%2$d damaĝon_, estas garantiita trafi, kaj estas tuja se ĝi mortigas malamikon.
items.weapon.melee.greataxe.ability_name=venĝo
items.weapon.melee.greataxe.desc=Destinita por esti uzata super la ŝultro, ĉi tiu titana hakilo estas tiel potenca kiel peza.
items.weapon.melee.greataxe.name=granda hakilo
items.weapon.melee.greataxe.stats_desc=Ĉi tiu armilo estas nekredeble peza.
items.weapon.melee.greataxe.typical_ability_desc=La Duelanto povas plenumi _venĝan_ atakon per granda hakilo se ŝi havas sanon sub 50%%. Ĉi tiu detruiga atako tipe kaŭzas _%1$d-%2$d damaĝon_, estas garantiita trafi, kaj estas tuja se ĝi mortigas malamikon.
items.weapon.melee.greatshield.ability_desc=La Duelanto povas _gardi_ sin per granda ŝildo, tute nuligante ĉiujn fizikajn aŭ magiajn atakojn faritajn kontraŭ ŝi dum _%d vicoj_. Post kiam la Duelanto blokis atakon, reataki aŭ uzi magion finos la gardadon.
items.weapon.melee.greatshield.ability_name=gardisto
items.weapon.melee.greatshield.desc=Pli simila al movebla muro ol al ŝildo, ĉi tiu giganta maso el metalo helpas defendon, sed ne lasas multan spacon por ataki.
items.weapon.melee.greatshield.name=granda ŝildo
items.weapon.melee.greatshield.stats_desc=Ĉi tiu armilo blokas damaĝon de 0-%d. Ĉi tiu blokado pligrandiĝas laŭ plibonigoj.
items.weapon.melee.greatshield.typical_ability_desc=La Duelanto povas _gardi_ sin per granda ŝildo, tute nuligante ĉiujn fizikajn aŭ magiajn atakojn faritajn kontraŭ ŝi tipe por _%d vicoj_. Post kiam la Duelanto blokis atakon, reataki aŭ uzi magion finos la gardadon.
items.weapon.melee.greatshield.typical_stats_desc=Tipe ĉi tiu armilo blokas damaĝon de 0-%d. Ĉi tiu blokado pligrandiĝas kun plibonigoj.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Daŭro de kapablo
items.weapon.melee.greatsword.ability_desc=La Duelanto povas _fendi_ malamikon per granda glavo. Tio kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
items.weapon.melee.greatsword.ability_name=fendi
items.weapon.melee.greatsword.desc=Ĉi tiu tura klingo kaŭzas pezan damaĝon investante sian pezon en ĉiun svingon.
items.weapon.melee.greatsword.name=grandglavo
items.weapon.melee.greatsword.typical_ability_desc=La Duelanto povas _fendi_ malamikon per granda glavo. Tio tipe kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
items.weapon.melee.handaxe.ability_desc=La Duelanto povas plenumi _pezan baton_ per mana hakilo. Ĉi tiu koncentrita atako kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.handaxe.ability_name=forta bato
items.weapon.melee.handaxe.desc=Malpeza hakilo, plej ofte uzata por faligi arbojn. La larĝa klingo ankaŭ bone funkcias kontraŭ malamikoj.
items.weapon.melee.handaxe.name=mana hakilo
items.weapon.melee.handaxe.stats_desc=Ĉi tiu estas sufiĉe preciza armilo.
items.weapon.melee.handaxe.typical_ability_desc=La Duelanto povas plenumi _pezan baton_ per mana hakilo. Ĉi tiu koncentrita atako tipe kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.katana.ability_desc=La Duelanto povas _elfali_ per katano al malamiko je 1 kahelo for. Tio moviĝas al la malamiko, kaŭzas _%1$d-%2$d damaĝon_, kaj ĝi garantiite trafos.
items.weapon.melee.katana.ability_name=elfalo
