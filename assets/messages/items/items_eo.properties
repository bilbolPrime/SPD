items.heap.locked_chest=Ŝlosita brusto
items.heap.locked_chest_desc=Vi ne scios, kio estas interne, ĝis vi malfermos ĝin! Sed por malfermi ĝin, vi bezonas oran ŝlosilon.
items.heap.remains=La restaĵoj de la heroo
items.heap.remains_desc=Jen ĉio, kio restis de unu el viaj antaŭuloj. Eble valoras kontroli ĉu estas iuj valoraĵoj.
items.heap.ring=ringo
items.heap.skeleton=Skeletaj restaĵoj
items.heap.skeleton_desc=Jen ĉio, kio restis de iu malfeliĉa aventuristo. Eble valoras kontroli por trovi iujn ajn valoraĵojn.
items.heap.tomb=Tombo
items.heap.tomb_desc=Ĉi tiu antikva tombo eble enhavas ion utilan, sed ĝia posedanto certe kontraŭos kontrolon.
items.heap.wand=sorĉbastono
items.honeypot$shatteredpot.desc=La poto estas frakasita, nur la gluiĝema mielo, kiu kovras ĝiajn murojn, tenas ĝin kune, kaj ĝi malrapide disiĝas. \n\nMalgraŭ ĝia rompita stato, la abelo ŝajnas ankoraŭ voli protekti la poton.
items.honeypot$shatteredpot.name=frakasita mielpoto
items.honeypot.ac_shatter=FRAŬDI
items.honeypot.desc=Tiu ĉi granda mielpoto estas vere kovrita nur per mielo, anstataŭe ĝi gastigas gigantan abelon! Ĉi tiuj specoj de masivaj abeloj kutime restas en siaj abelujoj, eble la poto estas ia speciala kaĝo por kaptistoj? La abelo ŝajnas sufiĉe kontenta ene de la poto kun sia mielo, kaj zumas al vi singarde kiam vi rigardas ĝin.
items.honeypot.name=mielpoto
