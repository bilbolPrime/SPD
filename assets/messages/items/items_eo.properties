items.weapon.melee.warscythe.typical_ability_desc=La Duelanto povas _rikolti_ malamikon per militfalĉilo. Ĉi tiu detruiga atako certe trafos kaj tipe kaŭzas _%d damaĝon_. Ĉi tiu damaĝo aplikiĝas kiel sangado se la celo ne estas imuna.
items.weapon.melee.whip.ability_desc=La Duelanto povas _vipi_ ĉiujn malamikojn ĉirkaŭ ŝi per vipo. Ĉi tiu kapablo kaŭzas _%1$d-%2$d damaĝon_, atakas ĉiujn malamikojn ene de atakdistanco, kaj ĝi garantiite trafos.
items.weapon.melee.whip.ability_name=vipoharo
items.weapon.melee.whip.desc=Kvankam la pikhava ŝnuro ĉe la fino de ĉi tiu armilo kaŭzas malmultan damaĝon, ĝia atingo estas nekomparebla.
items.weapon.melee.whip.name=vipo
