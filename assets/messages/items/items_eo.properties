items.artifacts.hornofplenty.desc=Ĉi tiun kornon oni ne povas blovi en ĝin, sed anstataŭe ŝajnas pleniĝi per manĝaĵo dum vi aventuras kaj akiras sperton. Vi povas konsumi ĉiun ŝargon individue kiel manĝeton, aŭ manĝi ĝis vi estas sata.
items.artifacts.hornofplenty.desc_cursed=La malbenita korno ligis sin al via flanko, ŝajnas ke ĝi volas preni manĝaĵon anstataŭ produkti ĝin.
items.artifacts.hornofplenty.desc_hint=Eble ekzistas maniero pliigi la potencon de la korno donante al ĝi manĝenergion.
