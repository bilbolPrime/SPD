items.weapon.missiles.darts.rotdart.desc=Ĉi tiuj malicaj sagetoj estas pintaj per acida putrober-bazita komponaĵo, kiu agreseme formanĝos ĉion, kion la sageto kontaktos. Potencaj malamikoj rezistos plejparton de la efiko, sed la korodo estas sufiĉe forta por facile mortigi plej multajn normajn malamikojn. Ĉi tiuj daŭras pli longe ol aliaj pintaj sagetoj, sed ilia daŭreco ne povas esti plibonigita.
