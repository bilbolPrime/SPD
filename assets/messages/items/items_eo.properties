items.weapon.melee.sword.desc=Bone ekvilibra glavo. Ne tro granda, sed tamen rimarkinde pli longa ol mallonga glavo.
items.weapon.melee.sword.name=glavo
items.weapon.melee.sword.typical_ability_desc=La Duelanto povas _tratranĉi_ malamikon per glavo. Tio tipe kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se tratranĉi mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi tratranĉi denove ene de 5 vicoj senpage.
