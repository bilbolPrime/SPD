items.scrolls.scroll.raido=volvlibro de RAIDO
items.scrolls.scroll.sowilo=volvaĵo de SOWILO
items.scrolls.scroll.tiwaz=volvlibro de TIWAZ
items.scrolls.scroll.unknown_desc=Ĉi tiu pergameno estas kovrita de nelegeblaj skribsignoj kaj portas la runon %s kiel titolon. Kiu scias, kio okazos, se oni voĉlegos ĝin?
items.scrolls.scroll.yngvi=volvlibro de YNGVI
items.scrolls.scrollofidentify.desc=Permanente malkaŝas ĉiujn sekretojn de unuopa objekto.
items.scrolls.scrollofidentify.inv_title=Identigu objekton
items.scrolls.scrollofidentify.it_is=Via aĵo estis identigita: %s.
items.scrolls.scrollofidentify.name=skribrulaĵo de identigo
items.scrolls.scrolloflullaby.desc=Trankviliga melodio metos ĉiujn estaĵojn en via vidkampo en profundan dormon, donante al vi ŝancon fuĝi aŭ fari surprizan atakon kontraŭ ili.
items.scrolls.scrolloflullaby.name=volvaĵo de lulkanto
items.scrolls.scrolloflullaby.sooth=La volvaĵo eldiras trankviligan melodion. Vi sentas vin tre dormema.
items.scrolls.scrollofmagicmapping.desc=Kiam ĉi tiu volvlibro estos legita, bildo de kristala klareco gravuriĝos en vian memoron, avertante vin pri la preciza aranĝo de la nivelo kaj malkaŝante ĉiujn kaŝitajn sekretojn. La lokoj de objektoj kaj estaĵoj restos nekonataj.
items.scrolls.scrollofmagicmapping.layout=Vi nun konscias pri la aranĝo de la nivelo.
items.scrolls.scrollofmagicmapping.name=volvlibro de magia mapado
items.scrolls.scrollofmirrorimage.copies=La volvaĵo formas spegulajn bildojn de vi.
items.scrolls.scrollofmirrorimage.desc=La ekzorco sur ĉi tiu volvlibro kreos iluziajn ĝemelojn de la leganto, kiuj postkuros liajn malamikojn.
items.scrolls.scrollofmirrorimage.name=volvaĵo de spegula bildo
items.scrolls.scrollofmirrorimage.no_copies=La volvlibro provas krei spegulajn bildojn de vi, sed ili ne havas kien iri.
items.scrolls.scrollofrage.desc=Kiam laŭtlegita, ĉi tiu volvlibro ellasos grandan muĝon, kiu altiras ĉiujn malamikojn al la leganto kaj kolerigas la proksimajn.
items.scrolls.scrollofrage.name=volvlibro de kolero
items.scrolls.scrollofrage.roar=La volvlibro elsendas koleran muĝon, kiu eĥas tra la kelkarcero!
items.scrolls.scrollofrecharging.desc=La kruda magia povo ligita en ĉi tiu pergameno, kiam liberigita, reŝargos ĉiujn sorĉbastonojn de la leganto al plena potenco.
items.scrolls.scrollofrecharging.name=rulaĵo de reŝargado
items.scrolls.scrollofrecharging.surge=Ondo da energio trafluas vian korpon, vigligante viajn sorĉbastonojn!
items.scrolls.scrollofremovecurse.cleansed=Via objekto brilas per puriga lumo, kaj malica energio disiĝas!
items.scrolls.scrollofremovecurse.desc=La ekzorco sur ĉi tiu volvlibro tuj forigos de la armilo, kiraso, ringoj kaj portataj objektoj de la leganto ĉiujn malbonajn sorĉojn, kiuj eble malhelpos la portanton forigi ilin.
items.scrolls.scrollofremovecurse.inv_title=Purigu objekton
items.scrolls.scrollofremovecurse.name=volvlibro de forigo de malbeno
items.scrolls.scrollofremovecurse.not_cleansed=Via objekto brilas per puriga lumo, sed nenio okazas.
items.scrolls.scrollofremovecurse.spirit=Via volvlibro liberigas la turmentatan spiriton!
items.scrolls.scrollofretribution.blast=Potenca magia energio erupcias el la volvlibro!
items.scrolls.scrollofretribution.desc=Ĉi tiu volvlibro enhavas detruan energion, kiu kanaligas la suferon de la leganto eksteren en eksplodon de potenco. Ju pli malforta la leganto estas, des pli da damaĝo ili kaŭzos. Ĉe tre malalta sano, ĉi tiu volvlibro povas mortigi plej multajn malamikojn tuj. \n\nUuzado de la volvlibro tamen damaĝas la uzanton, blindigante kaj malfortigante lin/ŝin.
items.scrolls.scrollofretribution.name=volvlibro de venĝo
items.scrolls.scrollofteleportation.cant_reach=Vi ne povas teletransportiĝi tien.
items.scrolls.scrollofteleportation.desc=La sorĉo sur ĉi tiu pergameno tuj transportas la leganton al hazarda loko sur la kelkarcera nivelo. Ĝi povas esti uzata por eskapi danĝeran situacion, sed la malbonŝanca leganto povus trovi sin en eĉ pli danĝera loko.
items.scrolls.scrollofteleportation.name=volvlibro de teleportado
items.scrolls.scrollofteleportation.no_tele=La teleporta magio malsukcesas.
items.scrolls.scrollofteleportation.prompt=Elektu lokon por teletransporti
items.scrolls.scrollofteleportation.tele=En palpebrumo vi estis teletransportita al alia loko de la nivelo.
items.scrolls.scrollofterror.desc=Fulmo de ruĝa lumo superverŝos ĉiujn estaĵojn en via vidkampo per teruro, kaj ili turniĝos kaj fuĝos. Ataki fuĝantan malamikon dispelos la efikon.
items.scrolls.scrollofterror.many=La volvlibro elsendas brilan fulmon de ruĝa lumo kaj la monstroj fuĝas!
items.scrolls.scrollofterror.name=volvaĵo de teruro
items.scrolls.scrollofterror.none=La volvlibro elsendas brilan fulmon de ruĝa lumo.
items.scrolls.scrollofterror.one=La volvlibro elsendas brilan fulmon de ruĝa lumo kaj la %s fuĝas!
items.scrolls.scrolloftransmutation.desc=Ĉi tiu volvlibro enhavas potencan transmutacian magion. Kiam uzata sur elektebla objekto, ĝi transformos ĝin en alian objekton de la sama tipo. La magio eĉ konservos plibonigojn, sorĉojn kaj ideogramojn. Volvlibroj kaj pocioj estos transmutaciitaj en siajn ekzotikajn ekvivalentojn, kaj inverse.
items.scrolls.scrolloftransmutation.inv_title=Transformi objekton
items.scrolls.scrolloftransmutation.morph=Via objekto transformiĝas en ion malsaman!
items.scrolls.scrolloftransmutation.name=volvaĵo de transmutacio
items.scrolls.scrolloftransmutation.nothing=Nenio interesa okazas.
items.scrolls.scrollofupgrade.desc=Ĉi tiu volvlibro plibonigos unuopan objekton, plibonigante ĝian kvaliton. Sorĉbastono plifortiĝos kaj pli ŝargiĝos; armilo kaŭzos pli da damaĝo aŭ trafos sian celon pli ofte; kiraso deviigos pliajn batojn; la efiko de ringo sur ĝia portanto intensiĝos. Armiloj kaj kirasoj ankaŭ postulos malpli da forto por uzi, kaj ĉiuj malbenoj sur la objekto estos forigitaj.
items.scrolls.scrollofupgrade.inv_title=Ĝisdatigu objekton
items.scrolls.scrollofupgrade.name=skribrulaĵo de plibonigo
items.scrolls.scrollofupgrade.remove_curse=La volvlibro de plibonigo purigas la malbenon de via objekto!
items.scrolls.scrollofupgrade.weaken_curse=La volvlibro de plibonigo malfortigas la malbenon sur via objekto.
items.spells.alchemize$wndalchemizeitem.energize=Transformu en %d energion
items.spells.alchemize$wndalchemizeitem.energize_1=Transformu 1 en %d energion
items.spells.alchemize$wndalchemizeitem.energize_all=Transformu ĉion en %d energion
items.spells.alchemize$wndalchemizeitem.sell=Transformiĝi en %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Transformu 1 en %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Transformu ĉion en %dg
items.spells.alchemize.desc=Ĉi tiu sorĉo enhavas transmutaciajn povojn similajn al tiuj troveblaj en alĥemia poto. Ĉiu sorĉo permesas al la uzanto transformi objekton (aŭ stakon da objektoj) en oron aŭ alkemian energion. Transformi pociojn aŭ volvlibrojn en energion eĉ identigos ilin!\n\nKelkaj Alkemizaj uzoj estas vendataj en butikoj, sed multaj pliaj povas esti faritaj per alĥemio kombinante semon, runŝtonon kaj iom da alkemia energio.
items.spells.alchemize.name=alkemiigi
items.spells.alchemize.prompt=Alkemiigi objekton
items.spells.beaconofreturning.creatures=La Psikika aŭro de najbaraj estaĵoj ne permesas al vi teletransportiĝi en ĉi tiu momento.
items.spells.beaconofreturning.desc=Ĉi tiu kompleksa sorĉo donas al la uzanto la kapablon reveni al difinita loko, sendepende de distanco. La sorĉo konsumiĝos nur per reveno, ĝi povas esti uzata tiom da fojoj kiom vi deziras, sed ĝi memoros nur la plej lastan lokon, al kiu ĝi estis uzata.
items.spells.beaconofreturning.desc_set=Ĉi tiu lumturo estis lokita ie sur la etaĝo %d.
items.spells.beaconofreturning.name=signostango de reveno
items.spells.beaconofreturning.preventing=La forta magia aŭro de ĉi tiu loko malhelpas vin uzi la sorĉon!
items.spells.beaconofreturning.set=La lumturo estis starigita ĉe via nuna loko.
items.spells.beaconofreturning.wnd_body=Agordo anstataŭigos la lokon, al kiu la signostango estis antaŭe agordita. \n\nReveno revenos al via laste agordita loko kaj konsumos unu uzon de la sorĉo.
items.spells.beaconofreturning.wnd_return=REVENO
items.spells.beaconofreturning.wnd_set=ARO
items.spells.curseinfusion.desc=Ĉi tiu sorĉo plenigas ekipaĵon per la sama potenca maligna magio ĉeestanta en DM-300. La objekto, sur kiu ĝi estas uzata, tuj estos malbenita, kaj ajna sorĉo aŭ glifo, kiun ĝi eble havis, estos superregita.\n\nKoncerne armilojn, kirasojn kaj sorĉbastonojn, la objekto gajnos plibonigojn aldone al esti malbenita. Malbeninfuzaj plibonigoj ne akumuliĝas, kaj la plibonigoj perdiĝas se la objekto iĝas nemalbenita.\n\nPluraj malbeninfuzoj ankaŭ povas esti uzataj por ŝanĝi la malbenon de armilo aŭ kiraso.
items.spells.curseinfusion.inv_title=Malbeni objekton
items.spells.curseinfusion.name=malbeninfuzaĵo
items.spells.magicalinfusion.desc=Ĉi tiu sorĉo posedas la saman magian potencon kiel volvlibro de plibonigo, sed en pli stabila formo. \n\nAldone al plibonigo de objekto kiel kutime, ĝi neniam forigos sorĉon, ideogramon aŭ malbenon.
items.spells.magicalinfusion.infuse=Via objekto estas plena de arkana energio!
items.spells.magicalinfusion.inv_title=Enmeti objekton
items.spells.magicalinfusion.name=magia infuzaĵo
items.spells.magicalporter.desc=Ĉi tiu sorĉo magie transportos ajnan objekton, sur kiun ĝi estas ĵetita. Male al komerca signostango tamen, la objektoj estos transportitaj al la enirejo de la sekva estro-etaĝo.
items.spells.magicalporter.inv_title=Porti eron
items.spells.magicalporter.name=magia portisto
items.spells.magicalporter.nowhere=Ne estas loko, kien vi povas porti eron.
items.spells.phaseshift.desc=Ĉi tiu kaosa sorĉo teletransportos ajnan rolulon, al kiu ĝi celas, al hazarda loko sur la nuna etaĝo, kaj miregigos ilin dum signifa tempo. Potencaj malamikoj povos rezisti la miregigan efikon. Ĉi tiu sorĉo povas esti direktita al celo aŭ al la uzanto mem.
items.spells.phaseshift.name=fazoŝovo
items.spells.phaseshift.no_target=Nenio estas teletransportebla tie.
items.spells.reclaimtrap.desc=Ĉi tiu sorĉo enhavas restaĵojn de la mekanika energio de DM-300. Kiam ĝi estas uzata sur aktivan kaptilon, la povo de la kaptilo alkroĉiĝos al vi, permesante al vi uzi la sorĉon denove por elpeli ĉi tiun povon kaj ekigi la efikon de la kaptilo ĉe iu ajn loko, kiun vi ŝatas. \n\nTamen, iuj kaptiloj eble ne funkcias en ĉiuj lokoj, kaj nur unu kaptilo povas esti konservita samtempe.
items.spells.reclaimtrap.desc_trap=La sorĉo estas nuntempe preta ekigi _%s._
items.spells.reclaimtrap.name=reakiri kaptilon
items.spells.reclaimtrap.no_trap=Tie ne estas kaptilo.
items.spells.recycle.desc=Ĉi tiu sorĉo enhavas malpli gravan formon de transmutacia magio. Kvankam ĝi ne funkcios sur ekipaĵo, ĉi tiu sorĉo transformos volvlibron, pocion, semon, runŝtonon aŭ renversitan sageton en hazardan objekton de la sama tipo.
items.spells.recycle.inv_title=Reciklu objekton
items.spells.recycle.name=recikli
items.spells.recycle.recycled=Via aĵo estis reciklita en: %s.
items.spells.spell.ac_cast=ROLANTARO
items.spells.spell.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.spells.spell.no_magic=Vi ne povas sorĉi dum vi estas imuna kontraŭ magio.
items.spells.summonelemental.ac_imbue=ENPLENI
items.spells.summonelemental.desc=Ĉi tiu sorĉo kanaligas la energion de la elementaj cindroj uzitaj por fari ĝin, kaj permesos al vi alvoki amikan elementulon por batali kun vi! Nur unu elementulo povas esti alvokita samtempe, sed la sorĉo povas esti refarita por redoni la elementulon al vi senkoste.
items.spells.summonelemental.desc_chaos=La sorĉo nuntempe radias kaosan energion, ĝi alvokos _kaosan elementan elementon_. Vi povas enkorpigi alian objekton, sed la sorĉo perdos sian nunan enkorpigon.
items.spells.summonelemental.desc_fire=La sorĉo estas nuntempe varmega, ĝi alvokos _fajran elementaĵon_. Vi povas trapenetri alian objekton, sed la sorĉo perdos sian nunan trapenetron.
items.spells.summonelemental.desc_frost=La sorĉo estas nuntempe malvarma al la tuŝo, ĝi alvokos _frostan elementaĵon_. Vi povas trapenetri alian objekton, sed la sorĉo perdos sian nunan trapenetron.
items.spells.summonelemental.desc_newborn=La sorĉo nuntempe ne estas trapenetrita, kaj alvokos _novnaskitan elementan elementon_ sen distanca atako. Vi povas trapenetri identigitan pocion de likva flamo, pocion de frosto, volvlibron de reŝargado, aŭ volvlibron de transmutacio por plifortigi la sorĉon, kaŭzante ke estontaj alvokoj estos plenpotenca elementa elemento!
items.spells.summonelemental.desc_shock=La sorĉo nuntempe radias statikan energion, ĝi alvokos _ŝokan elementaĵon_. Vi povas trapenetri alian objekton, sed la sorĉo perdos sian nunan trapenetron.
items.spells.summonelemental.imbue_prompt=Trapenetri objekton
items.spells.summonelemental.name=alvoki elementan
items.spells.targetedspell.inv_title=Enmeti objekton
items.spells.targetedspell.prompt=Elektu celon
items.spells.telekineticgrab.cant_grab=Vi ne povas kapti tion.
items.spells.telekineticgrab.desc=Ĉi tiu sorĉo permesas al la gisisto malproksime kapti ĉiujn objektojn ĉe iu loko, aŭ ĉiujn ĵetarmilojn algluitajn al malamiko!\n\nĜi ne uzeblas por kapti objektojn, kiujn iu alia posedas, aŭ por kapti ujojn kiel kestojn.
items.spells.telekineticgrab.name=telekineta forpreno
items.spells.telekineticgrab.no_target=Nenio estas tie por kapti.
items.spells.unstablespell.desc=Ĉi tiu malgranda nigra kvadrata kristalo havas ŝanĝiĝantajn runajn simbolojn sur ĉiu el siaj surfacoj. \n\nKiam aktivigite, ĝi ekigos la efikon de hazarda volvlibro. La volvlibro-efiko ĉiam estos batal-fokusita se estas malamikoj en via vidkampo, kaj ĉiam estos ne-batal-fokusita alie.
items.spells.unstablespell.name=malstabila sorĉo
items.spells.wildenergy.desc=Ĉi tiu sorĉo enhavas iom da la malbenita energio, kiu funkciigis DM-300. Kiam ĝi estas ĵetita, ĝi reŝargos viajn sorĉbastonojn kaj eluzitajn artefaktojn, samtempe ekigante hazardan malbenitan sorĉbastonan efikon. Tamen, vi povas elekti direkton, kien ĉi tiu malbenita magio devas esti pafita.
items.spells.wildenergy.name=sovaĝa energio
items.stones.inventorystone.ac_use=UZU
items.stones.runestone$placeholder.name=runŝtono
items.stones.runestone.discover_hint=Vi povas trovi ĉi tiun objekton hazarde en la kelkarcero, aŭ krei ĝin per alĥemio.
items.stones.stoneofaggression$aggression.desc=Manipula magio igas ĉiujn proksimajn malamikojn preferi ataki ĉi tiun rolulon. \n\nRestantaj turnoj: %s.
items.stones.stoneofaggression$aggression.name=celita
items.stones.stoneofaggression.desc=Kiam ĉi tiu ŝtono estas ĵetita al aliancano aŭ malamiko, ĉiuj proksimaj malamikoj preferos ataki tiun rolulon por mallonga tempo. \n\nEstroj tamen povas rezisti la efikon, signife reduktante la daŭron kaj ricevante malpli da damaĝo de la atakoj de sia helpanto.
items.stones.stoneofaggression.name=ŝtono de agreso
items.stones.stoneofaugmentation$wndaugment.cancel=Ne gravas
items.stones.stoneofaugmentation$wndaugment.choice=Kion vi ŝatus plibonigi?
items.stones.stoneofaugmentation$wndaugment.damage=Difekto
items.stones.stoneofaugmentation$wndaugment.defense=Defendo
items.stones.stoneofaugmentation$wndaugment.evasion=Senigado
items.stones.stoneofaugmentation$wndaugment.none=Forigi Pligrandigon
items.stones.stoneofaugmentation$wndaugment.speed=Rapido
items.stones.stoneofaugmentation.desc=Ĉi tiu runŝtono posedas potencan magion, kiu povas plibonigi ekipaĵon por plibonigi unu econ je la kosto de alia.\n\nUzado sur armilo permesos al vi plibonigi aŭ rapidon aŭ damaĝon. Ĵetarmiloj ankaŭ gajnos aŭ perdos daŭrivokon proporcie al sia rapido.\n\nUzado sur kiraso permesos al vi plibonigi aŭ defendon aŭ evitadon.
items.stones.stoneofaugmentation.discover_hint=Vi povas aĉeti ĉi tiun objekton en butiko, aŭ krei ĝin per alĥemio.
items.stones.stoneofaugmentation.inv_title=Pligrandigi objekton
items.stones.stoneofaugmentation.name=ŝtono de pliigo
items.stones.stoneofblast.desc=Ĉi tiu runŝtono tuj eksplodos ĉe la loko, kien ĝi estas ĵetita. Same kiel bombo, la eksplodo kaŭzos damaĝon al ĉio proksima.
items.stones.stoneofblast.name=ŝtono de eksplodo
items.stones.stoneofblink.desc=Ĉi tiu runŝtono teletransportos la uzanton al la loko, kien ĝi estas ĵetita.
items.stones.stoneofblink.name=ŝtono de palpebrumo
items.stones.stoneofclairvoyance.desc=Ĉi tiu ŝtono tuj malkaŝos ĉiujn kahelojn en tre larĝa areo ĉirkaŭ kie ĝi estas ĵetita. Ĝia efiko eĉ atingos tra muroj.
items.stones.stoneofclairvoyance.name=ŝtono de klarvido
items.stones.stoneofdeepsleep.desc=Kiam ĉi tiu ŝtono estas ĵetita al malamiko, ĝi enigos lin/ŝin en profundan magian dormon. Magie dormintaj malamikoj dormos eterne ĝis ili estos ĝenataj.
items.stones.stoneofdeepsleep.name=ŝtono de profunda dormo
items.stones.stoneofdetectmagic.desc=Ĉi tiu runŝtono kapablas detekti magion influantan objekton. Uzante ĉi tiun ŝtonon sur neidentigita objekto, vi diros ĉu ĝi estas influata de malica malbeno kaj ĉu ĝi estas influata de pozitiva magio kiel sorĉo aŭ plibonigoj.
items.stones.stoneofdetectmagic.detected_bad=Vi detektas malican magion influantan ĉi tiun objekton!
items.stones.stoneofdetectmagic.detected_both=Vi detektas kaj pozitivan kaj malbonan magion influantan ĉi tiun objekton!
items.stones.stoneofdetectmagic.detected_good=Vi detektas pozitivan magion influantan ĉi tiun objekton!
items.stones.stoneofdetectmagic.detected_none=Vi ne detektas ian magion influantan ĉi tiun objekton.
items.stones.stoneofdetectmagic.inv_title=Detekti objekton
items.stones.stoneofdetectmagic.name=ŝtono de detekti magion
items.stones.stoneofdisarming.desc=Ĉi tiu runŝtono enhavas magion, kiu povas malŝalti malicajn kaptilojn kaŝitajn tra la kelkarcero. Ĝi senarmigos ĝis 9 kaptilojn ĉirkaŭ la areo, al kiu ĝi estas ĵetita.
items.stones.stoneofdisarming.name=ŝtono de senarmigo
items.stones.stoneofenchantment.armor=Via kiraso brilas en la mallumo!
items.stones.stoneofenchantment.desc=Ĉi tiu runŝtono posedas sorĉan magion. Male al volvlibro de plibonigo, ĝi ne pliigos la rektan potencon de objekto, sed anstataŭe plenigos armilon aŭ kirason per sorĉo, donante al ĝi novan potencon.
items.stones.stoneofenchantment.inv_title=Sorĉi objekton
items.stones.stoneofenchantment.name=ŝtono de sorĉo
items.stones.stoneofenchantment.weapon=Via armilo brilas en la mallumo!
items.stones.stoneoffear.desc=Kiam ĉi tiu ŝtono estas ĵetita sur rolulon, tiu estos superfortita de teruro, turniĝos kaj fuĝos. Ataki fuĝantan rolulon mallongigos la efikon.
items.stones.stoneoffear.name=ŝtono de timo
items.stones.stoneofflock.desc=Ĉi tiu runŝtono alvokas magiajn ŝafojn por mallonga tempo ĉirkaŭ la loko, al kiu ĝi estas ĵetita.
items.stones.stoneofflock.name=ŝtono de grego
items.stones.stoneofintuition$wndguess.break=Via ŝtono de intuicio disfaliĝas al polvo...
items.stones.stoneofintuition$wndguess.correct=Ĝuste. La tipo de la objekto estas identigita!
items.stones.stoneofintuition$wndguess.incorrect=Via diveno estis malĝusta.
items.stones.stoneofintuition$wndguess.text=Divenu, kia estas la tipo de la neidentigita objekto. Se vi divenos ĝuste, la tipo estos identigita!
items.stones.stoneofintuition.break_info=Vi povas uzi ŝtonojn de intuicio dufoje antaŭ ol unu rompiĝos, _via sekva uzo ne konsumos ŝtonon_.
items.stones.stoneofintuition.break_warn=Vi jam uzis ŝtonon de intuicio antaŭe, do _via sekva uzo konsumos ŝtonon_.
items.stones.stoneofintuition.desc=Ĉi tiu runŝtono enhavas pli malfortan version de la magio trovebla en volvlibroj de identigo. Anstataŭ rekte identigi objekton, ĝi funkcios laŭ via intuicio, permesante al vi provi identigi la tipon de pocio, volvlibro aŭ ringo per divenado.
items.stones.stoneofintuition.inv_title=Elektu elementon
items.stones.stoneofintuition.name=ŝtono de intuicio
items.stones.stoneofshock.desc=Ĉi tiu runŝtono ellasas eksplodon de elektra energio, kiu nelonge miregigas ĉiujn proksimajn celojn kaj donas al la ĵetanto ŝargon por ĉiu trafita celo.
items.stones.stoneofshock.name=ŝtono de ŝoko
items.stylus.ac_inscribe=ENSKRIBI
items.stylus.cursed=La magio de la grifelo ne funkcios kontraŭ malbenita kiraso.
items.stylus.desc=Ĉi tiu arkana grifelo estas farita el iu malhela, tre malmola ŝtono. Uzante ĝin vi povas gravuri magian glifon sur vian kirason, sed vi ne havas potencon elekti, kian glifon ĝi estos, la grifelo decidos ĝin por vi.
items.stylus.identify=Vi devas unue identigi ĉu tiu kiraso estas malbenita.
items.stylus.inscribed=Vi gravuris vian kirason per la grifelo.
items.stylus.name=arkana grifelo
items.stylus.prompt=Elektu Kirason
items.tengusmask.ac_wear=ELUZO
items.tengusmask.desc=Ĉi tiu masko defalis de la vizaĝo de Tengu dum li mortis, vi povas senti grandan magian potencon emanantan el ĝi. Ĉu la masko estis la fonto de forto de Tengu?\n\nKiam portate, la grandega potenco de la masko transdoniĝos al vi, ebligante al vi _elekti subklason por via heroo._\n\nKiun subklason vi elektos?
items.tengusmask.discover_hint=Vi povas akiri ĉi tiun objekton kiel falon de certaj malamikoj.
items.tengusmask.name=La masko de Tengu
items.tengusmask.used=La masko diseriĝas dum ĝia potenco fluas en vin!
items.torch.ac_light=LUMO
items.torch.desc=Bazvaro por aventurado, kiam kelkarcero mallumiĝas, torĉo povas helpi montri la vojon.
items.torch.name=torĉo
items.trinkets.chaoticcenser.desc=Post iom da tempo en la alĥemia poto, ĉi tiu incensobruliga incensujo ŝajnas produkti fumon tute memstare! Ĉi tiuj gasoj akumuliĝas kaj elŝprucas el la incensujo al malamikoj je duonhazardaj intervaloj. Ĝi ŝajnas kapabla produkti ĉiajn gasojn, sed vi ricevos momenton de averto ĝuste antaŭ ol la incensujo aktiviĝos.
items.trinkets.chaoticcenser.name=kaosa incensujo
items.trinkets.chaoticcenser.spew=Via incensujo tuj elvomos: %s.
items.trinkets.chaoticcenser.stats_desc=Ĉe sia nuna nivelo, ĉi tiu ornamaĵo generos damaĝan gason proksime de malamiko proksimume ĉiun _%d_ vicon. Gasoj aperos nur kiam malamikoj ĉeestas. Ĉe pli altaj niveloj, ĉi tiuj gasoj pli verŝajne estos ekzotaj kaj potencaj.
items.trinkets.chaoticcenser.typical_stats_desc=Tipe, ĉi tiu ornamaĵo generos damaĝan gason proksime de malamiko ĉirkaŭ ĉiujn _%d_ vicojn. Gasoj aperos nur kiam malamikoj ĉeestas. Je pli altaj niveloj, ĉi tiuj gasoj pli verŝajne estos ekzotaj kaj potencaj.
items.trinkets.crackedspyglass.desc=Ĉi tiu portebla teleskopo estus demonstraĵo de bonega kaj preciza metiisteco, se ne estus la fendo laŭlonge de ĝia antaŭa lenso. La teleskopo ŝajnas helpi vin malkaŝante novajn objektojn en la kelkarcero, sed pro sia difekto la malkaŝitajn objektojn estas sufiĉe malfacile videblaj!
items.trinkets.crackedspyglass.name=fendita lorno
items.trinkets.crackedspyglass.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo havas _%1$s%% ŝancon_ krei ekstran kaŝitan objekton sur ĉiu ne-estra etaĝo.
items.trinkets.crackedspyglass.stats_desc_upgraded=Je sia nuna nivelo, ĉi tiu juvelo havas _100%% ŝancon_ krei ekstran kaŝitan objekton sur ĉiu ne-estra etaĝo, kaj _%1$s%% ŝancon_ krei duan ekstran kaŝitan objekton.
items.trinkets.crackedspyglass.typical_stats_desc=Tipe ĉi tiu juvelo havas _%1$s%% ŝancon_ krei ekstran kaŝitan objekton sur ĉiu ne-estra etaĝo.
items.trinkets.dimensionalsundial.desc=Ĉi tiu malgranda portebla sunhorloĝo iel kapablas ĵeti ombron en la profundojn de la kelkarcero, eĉ se vi ne tenas ĝin vertikale. Eĉ pli strange, la pozicio de la ombro ŝajnas havi nenian rilaton al la suno en ĉi tiu mondo. Kiam neniu ombro estas ĵetita, la sunhorloĝo ŝajnas altiri danĝeron.
items.trinkets.dimensionalsundial.name=dimensia sunhorloĝo
items.trinkets.dimensionalsundial.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo reduktos la aperoftecon de malamikoj je _%1$d%%_ dumtage en la reala vivo (8:00-20:00), kaj pliigos la aperoftecon de malamikoj je _%2$d%%_ nokte (20:00-8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=Tipe ĉi tiu ornamaĵo reduktos la aperoftecon de malamikoj je _%1$d%%_ dumtage en la reala vivo (8:00-20:00), kaj pliigos la aperoftecon de malamikoj je _%2$d%%_ nokte (20:00-8:00).
items.trinkets.dimensionalsundial.warning=Via sunhorloĝo ne ĵetas ombron, vi sentas vin malkomforte.
items.trinkets.exoticcrystals.desc=Ĉi tiuj malgrandaj rozkoloraj kristaloj havas la saman formon kiel kristaloj de alkemia energio. Kvankam ili ne povas esti uzataj por energio rekte, ili ŝajnas iel influi la pociojn kaj volvlibrojn, kiujn vi trovas.
items.trinkets.exoticcrystals.name=ekzotikaj kristaloj
items.trinkets.exoticcrystals.stats_desc=Ĉe sia nuna nivelo, ĉi tiu ornamaĵo anstataŭigos _%s%%_ pociojn aŭ volvlibrojn per iliaj ekzotikaj ekvivalentoj. Ĉi tio ne influas pociojn de forto, volvlibrojn de plibonigo, aŭ objektojn generitajn por helpi solvi danĝerajn ĉambrojn.
items.trinkets.exoticcrystals.typical_stats_desc=Tipe ĉi tiu ornamaĵo anstataŭigos _%s%%_ pociojn aŭ volvlibrojn per iliaj ekzotikaj ekvivalentoj. Ĉi tio ne influas pociojn de forto, volvlibrojn de plibonigo, aŭ objektojn generitajn por helpi solvi danĝerajn ĉambrojn.
items.trinkets.eyeofnewt.desc=Ĉi tiu ora kaj nigra salamandra okulo estas ofta ingredienco, nun plibonigita kiel ornamaĵo. La okulo ŝajnas redukti vian vidkapablon kontraŭ permesado de vidi aferojn alimaniere.
items.trinkets.eyeofnewt.name=okulo de salamandro
items.trinkets.eyeofnewt.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo reduktos vian vidkampon je _%1$s%%_, sed ankaŭ donos al vi mensan vidon sur malamikoj ene de _%2$d_ kaheloj.
items.trinkets.eyeofnewt.typical_stats_desc=Tipe ĉi tiu juvelo reduktos vian vidkampon je _%1$s%%_, sed ankaŭ donos al vi mensan vidon sur malamikoj ene de _%2$d_ kaheloj.
items.trinkets.ferrettuft.desc=Tufo da silkeca blanka fura felo, tenata kune per lime-verda rubando ligita en bantkravaton. Furoj estas konataj pro sia lerteco, petolemo kaj manko de integreco. Iom da tiu potenco ŝajnas radii el la ornamaĵo, plifortigante la evitadon de io ajn proksima.
items.trinkets.ferrettuft.name=furotufo
items.trinkets.ferrettuft.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo pliigos la evitadon de ĉiuj roluloj je _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Tipe ĉi tiu juvelo pliigos la evitadon de ĉiuj roluloj je _%1$s%%_.
items.trinkets.mimictooth.desc=Tiu ĉi granda akra dento certe estis eltirita de tre malfeliĉa imitisto. Ŝajnas, ke ĝi influas la imitistojn de la kelkarcero, igante ilin pli oftaj kaj danĝeraj.
items.trinkets.mimictooth.name=imita dento
items.trinkets.mimictooth.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo igos ĉiajn imitistojn _%1$sx_ pli oftaj kaj multe pli malfacile detekteblaj, sed ankaŭ pliigos la kvanton da rabaĵo, kiun ili faligas. Ĉiu kelkarcera etaĝo ankaŭ havos ŝancon _%2$s%%_ enhavi ekstran sekretan ebonan imitiston.
items.trinkets.mimictooth.typical_stats_desc=Tipe ĉi tiu juvelo igos ĉiajn imitistojn _%1$sx_ pli oftaj kaj multe pli malfacile detekteblaj, sed ankaŭ pliigos la kvanton da rabaĵo, kiun ili faligas. Ĉiu kelkarcera etaĝo ankaŭ havos ŝancon _%2$s%%_ enhavi ekstran sekretan ebonan imitiston.
items.trinkets.mossyclump.desc=Ŝajnas, ke ĉi tiu aro da malseka musko retenas sian humidon, kiom ajn forte oni premas ĝin. Ĝi ŝajnas esti magie ligita al la kelkarcero mem, kio pliigas la aperon de herbo kaj akvo.
items.trinkets.mossyclump.name=muska areto
items.trinkets.mossyclump.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo igos _%d%%_ da sendistemajn plankojn pleniĝi per aŭ akvo aŭ herbo anstataŭe.\n\n Ĉi tiu juvelo kostas pli grandan kvanton da energio por ĝisdatigi.
items.trinkets.mossyclump.typical_stats_desc=Tipe ĉi tiu juvelo igos _%d%%_ da sendistemajn plankojn pleniĝi per aŭ akvo aŭ herbo anstataŭe. \n\n Ĉi tiu juvelo kostas pli grandan kvanton da energio por ĝisdatigi.
items.trinkets.parchmentscrap.desc=Ĉi tiu eta pergamena peceto aspektas kvazaŭ ĝi devenis de volvlibro. Ĝi konservis iom da sia magio, kaj ŝajnas, ke ĝi influas armilojn kaj kirasojn trovitajn en la kelkarcero.
items.trinkets.parchmentscrap.name=pergamenpeceto
items.trinkets.parchmentscrap.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo igos sorĉojn kaj ideogramojn _%dx_ kiel oftajn, kaj malbenojn sur armiloj kaj kirasoj _%sx_ kiel oftajn. Malbenoj sur sorĉbastonoj, ringoj aŭ artefaktoj ne estas tuŝitaj.\n\nĈi tiu ornamaĵo kostas pli grandan kvanton da energio por ĝisdatigi.
items.trinkets.parchmentscrap.typical_stats_desc=Tipe ĉi tiu juvelo igos sorĉojn kaj ideogramojn _%dx_ kiel oftajn, kaj malbenojn sur armiloj kaj kirasoj _%sx_ kiel oftajn. Malbenoj sur sorĉbastonoj, ringoj aŭ artefaktoj ne estas tuŝitaj. \n\nĈi tiu juvelo kostas pli grandan kvanton da energio por ĝisdatigi.
items.trinkets.petrifiedseed.desc=Ĉi tiu semo fosiliiĝis, ĉu per malrapidaj geologiaj procezoj ĉu per magio. La semo ŝajnas magie influi la flaŭron de la kelkarcero, foje anstataŭigante plantsemojn per runŝtonoj.
items.trinkets.petrifiedseed.name=ŝtonigita semo
items.trinkets.petrifiedseed.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo kaŭzos, ke piedpremita herbo faligos runŝtonojn anstataŭ semojn _%1$s%%_ tiutempe, kaj ankaŭ kaŭzos, ke alta herbo faligos objektojn _%2$s%%_ pli ofte.
items.trinkets.petrifiedseed.typical_stats_desc=Tipe ĉi tiu juvelo kaŭzos, ke piedpremita herbo faligos runŝtonojn anstataŭ semojn _%1$s%%_ foje, kaj ankaŭ kaŭzos, ke alta herbo faligos objektojn _%2$s%%_ pli ofte.
items.trinkets.ratskull.desc=Ĉi tiu makabra ornamaĵo ne estas multe pli granda ol la kranio de normala rato, kio estas iel maloftaĵo en ĉi tiu kelkarcero. La magia influo de la kranio ŝajnas allogi la pli maloftajn loĝantojn de la kelkarcero, igante ilin aperi multe pli ofte.
items.trinkets.ratskull.name=ratkranio
items.trinkets.ratskull.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo malpli probable aperos maloftajn ekzotikajn malamikojn _%dx_. La kranio tamen estas nur duone tiel efika por allogi kristalajn imitistojn kaj kirasitajn statuojn.
items.trinkets.ratskull.typical_stats_desc=Tipe ĉi tiu ornamaĵo malpli probable aperos maloftajn ekzotikajn malamikojn _%dx_. La kranio tamen estas nur duone tiel efika por allogi kristalajn imitistojn kaj kirasitajn statuojn.
items.trinkets.saltcube.desc=Ĉi tiu granda salkristalo estis tranĉita en preskaŭ perfektan kuban formon, kaj ĝi iel sukcesis forverŝi duonon de la akvo el la alĥemia poto anstataŭ dissolviĝi. Ŝajnas, ke ĝi magie senakvigas kaj konservas la manĝaĵon, kiun vi manĝas, plilongigante la satecon, kiun vi ricevas, sed ankaŭ malpliigante vian sanrestarigon kiam vi ne malsatas.
items.trinkets.saltcube.name=salkubo
items.trinkets.saltcube.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo plilongigos la tempon antaŭ ol vi malsatos je _%1$s%%_, sed ankaŭ malpliigos vian sanregeneradan rapidecon je _%2$s%%_ krom se la planko estas ŝlosita.
items.trinkets.saltcube.typical_stats_desc=Tipe ĉi tiu ornamaĵo plilongigos la tempon antaŭ ol vi malsatos je _%1$s%%_, sed ankaŭ malpliigos vian sanregeneradan rapidecon je _%2$s%%_ krom se la planko estas ŝlosita.
items.trinkets.shardofoblivion$thrownusetracker.desc=Vi ĵus uzis neidentigitan ĵetarmilon, kiu kalkuliĝas kiel unu peco de uzita neidentigita ekipaĵo por la fragmento de forgeso por mallonga tempo. \n\nRestantaj turnoj: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Neidentigita ĵetita armilo uzita
items.trinkets.shardofoblivion$wandusetracker.desc=Vi ĵus uzis neidentigitan sorĉbastonon, kiu kalkuliĝas kiel unu peco de uzita neidentigita ekipaĵo por la fragmento de forgeso por mallonga tempo.\n\nRestantaj turnoj: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Neidentigita Sorĉbastono Uzita
items.trinkets.shardofoblivion.ac_identify=IDENTIGI
items.trinkets.shardofoblivion.desc=Post kuirado en la alĥemia poto, ĉi tiu malgranda fragmento de malbenita metalo ŝanĝiĝis kaj fariĝis el... nenio? Lumo ŝajnas fleksiĝi ĉirkaŭ ĝi, kaj ĝi ŝvebas surloke kiam vi ne tenas ĝin. La fragmento ŝajnas magie ĉerpi potencon el via nescio, do verŝajne estas plej bone ne tro pensi pri ĝi.
items.trinkets.shardofoblivion.identify=Vi identigas la objekton!
items.trinkets.shardofoblivion.identify_not_yet=Tiu objekto ankoraŭ ne estas preta por esti identigita.
items.trinkets.shardofoblivion.identify_prompt=Identigu objekton
items.trinkets.shardofoblivion.identify_ready=Objekto estas preta por identigo: %s. Uzu vian Forgesfragmenton sur ĝi por identigi ĝin.
items.trinkets.shardofoblivion.identify_ready_worn=Viaj uzitaj objektoj nun estas pretaj por identigi. Uzu vian Forgesfragmenton sur objektoj por identigi ilin.
items.trinkets.shardofoblivion.name=fragmento de forgeso
items.trinkets.shardofoblivion.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo pliigos la rapidecon, per kiu malamikoj faligas rabaĵon je 20%% por ĉiu peco de neidentigita ekipaĵo, kiun vi ekipis aŭ ĵus uzis, ĝis maksimumo de _%d objekto(j)_. La fragmento ankaŭ malhelpos vin identigi ekipaĵon, sed povas esti uzata por permane identigi objektojn, kiuj estas pretaj por ĝi.
items.trinkets.shardofoblivion.typical_stats_desc=Tipe ĉi tiu juvelo pliigos la rapidecon, per kiu malamikoj faligas rabaĵon je 20%% por ĉiu peco de neidentigita ekipaĵo, kiun vi ekipis aŭ ĵus uzis, ĝis maksimumo de _%d objekto(j)_. La fragmento ankaŭ malhelpos vin identigi ekipaĵon, sed povas esti uzata por permane identigi objektojn, kiuj estas pretaj por ĝi.
items.trinkets.thirteenleafclover.desc=Iel stufado en la alĥemia poto kaŭzis, ke ĉi tiu trifolio kreskigis amason da ekstraj folioj! Ne estas vere klare, ĉu ĉi tiu juvelo estas bonŝanca aŭ malbonŝanca, eble ĉi tiu juvelo igos vian bonŝancon pli kaosa?
items.trinkets.thirteenleafclover.name=dek trifolia trifolio
items.trinkets.thirteenleafclover.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo kaŭzos al vi maksimuman damaĝon _%1$d%%_ de la tempo, kaj minimuman damaĝon _%2$d%%_ de la tempo.
items.trinkets.thirteenleafclover.typical_stats_desc=Tipe ĉi tiu juvelo kaŭzos al vi kaŭzon de maksimuma damaĝo _%1$d%%_ de la tempo, kaj minimuma damaĝo _%2$d%%_ de la tempo.
items.trinkets.trapmechanism.desc=La kerna mekanismo de unu el la falkaptiloj de la kelkarcero, zorge ĉizita el la planko por ke ĝi estu portebla. Ĝi ŝajnas esti magie ligita al la kelkarcero mem, igante danĝeran terenon pli ofta sed ankaŭ pliigante vian simpation al ĝi.
items.trinkets.trapmechanism.name=kaptila mekanismo
items.trinkets.trapmechanism.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo igos _%1$d%%_ el la sendistemitaj etaĝoj pleniĝi per kaptiloj aŭ abismoj anstataŭe. Krome, _%2$d%%_ el la kaŝitaj kaptiloj de la kelkarcero anstataŭe estos videblaj.
items.trinkets.trapmechanism.typical_stats_desc=Tipe ĉi tiu ornamaĵo igos _%1$d%%_ el la sendistemitaj etaĝoj pleniĝi per kaptiloj aŭ abismoj anstataŭe. Krome, _%2$d%%_ el la kaŝitaj kaptiloj de la kelkarcero anstataŭe estos videblaj.
items.trinkets.trinket$placeholder.name=juvelo
items.trinkets.trinket.discover_hint=Ĉi tiu objekto havas ŝancon esti opcio kiam ajn vi kreas juvelaĵon per alĥemio.
items.trinkets.trinketcatalyst$randomtrinket.desc=Unu proksima objekto estas blokita en saketo, kiun vi ne povas malfermi. \n\nLa alkemia procezo dissolvos la saketon, sed vi ne scios, kian ornamaĵon vi ricevos, ĝis vi faros ĝin!
items.trinkets.trinketcatalyst$randomtrinket.name=hazarda ornamaĵo
items.trinkets.trinketcatalyst.desc=Ĉi tiu bulo da magia ora polvo briletas en la mallumo de la kelkarcero. Ĉi tiu katalizilo uzeblas ĉe alĥemia poto kun iom da alkemia energio por produkti unikan ornamaĵon.\n\nOrnamaĵoj provizas diversajn efikojn, kiuj iomete ŝanĝas la kelkarceron aŭ ĝiajn loĝantojn. Ornamaĵoj povas esti plibonigitaj per pli da energio por igi ilian efikon pli potenca, aŭ faligitaj por tute rezigni pri la efiko.
items.trinkets.trinketcatalyst.name=magia katalizilo
items.trinkets.trinketcatalyst.window_text=La akvo komencas brili dum vi aldonas la katalizilon. Estas kelkaj proksimaj objektoj, kiujn vi povus plenigi per energio por transformi ilin en magian ornamaĵon.
items.trinkets.trinketcatalyst.window_title=krei ornamaĵon
items.trinkets.vialofblood.desc=Ĉi tiu maldika fiolo enhavas la sangon de iu loĝanto de la kelkarcero, ĝi moviĝas malrapide dum vi rotacias la fiolon. Ŝajnas, ke ĝi magie plifortigas resanigajn efikojn, sed ankaŭ prokrastas ilin.
items.trinkets.vialofblood.name=fiolo da sango
items.trinkets.vialofblood.stats_desc=Je sia nuna nivelo, ĉi tiu ornamaĵo pliigos la ĝeneralan sanon, kiun vi gajnas trinkante resanigajn pociojn, akvosakojn, aŭ sanputojn je _%1$s%%_. Tamen, ĉi tiuj resanigaj efikoj ankaŭ okazos pli malrapide, regenerante maksimumon de _%2$s_ vivpoentoj po turno (ĉi tio skalas laŭ la nivelo de la heroo).
items.trinkets.vialofblood.typical_stats_desc=Tipe ĉi tiu juvelo pliigos la ĝeneralan sanon, kiun vi gajnas trinkante resanigajn pociojn, akvosakojn, aŭ sanputojn je _%1$s%%_. Tamen, ĉi tiuj resanigaj efikoj ankaŭ okazos pli malrapide, regenerante maksimumon de _%2$s_ vivpoentoj po turno (ĉi tio skalas laŭ la nivelo de la heroo).
items.trinkets.wondrousresin.desc=Ĉi tiu brilanta blua rezino ŝajnas havi la distilitan esencon de la magio de malbenita sorĉbastono. La magio el la alĥemia poto ŝajne iom stabiligis ĝin, kaj ĝi nun influas viajn sorĉbastonojn.
items.trinkets.wondrousresin.name=mirinda rezino
items.trinkets.wondrousresin.stats_desc=Je sia nuna nivelo, ĉi tiu juvelo devigos la malbenitajn sorĉbastonajn efikojn fariĝi neŭtralaj aŭ pozitivaj _%1$s%%_ de la tempo, kaj kaŭzos, ke nemalbenitaj sorĉbastonoj lanĉos plian neŭtralan aŭ pozitivan malbenitan elektron _%2$s%%_ de la tempo. \n\n Ĉi tiu juvelo kostas pli grandan kvanton da energio por ĝisdatigi.
items.trinkets.wondrousresin.typical_stats_desc=Tipe ĉi tiu juvelo devigos la efikojn de malbenitaj sorĉbastonoj fariĝi neŭtralaj aŭ pozitivaj _%1$s%%_ de la tempo, kaj kaŭzos, ke nemalbenitaj sorĉbastonoj lanĉos plian neŭtralan aŭ pozitivan malbenitan elektron _%2$s%%_ de la tempo. \n\n Ĉi tiu juvelo kostas pli grandan kvanton da energio por ĝisdatigi.
items.wands.cursedwand.disguise=Via aspekto ŝanĝiĝas antaŭ viaj okuloj!
items.wands.cursedwand.fire=Vi odoras brulantan...
items.wands.cursedwand.grass=Herbo erupcias ĉirkaŭ vi!
items.wands.cursedwand.gravity=Gravito subite komencas tiri en hazardaj direktoj!
items.wands.cursedwand.gravity_end=La gravita kaoso finiĝas.
items.wands.cursedwand.gravity_positive=Gravito subite komencas tiri en hazardaj direktoj, sed tio ŝajnas ne influi vin.
items.wands.cursedwand.mass_invuln=Brila lumo erupcias el via sorĉbastono!
items.wands.cursedwand.nothing=Nenio okazas.
items.wands.cursedwand.ondeath=Vin mortigis via propra %s.
items.wands.cursedwand.petrify=Vi subite frostiĝas surloke!
items.wands.cursedwand.sinkhole=La tero komencas cedi ĉirkaŭ vi!
items.wands.cursedwand.sinkhole_positive=La tero komencas cedi, sed sentiĝas sufiĉe solida sub vi.
items.wands.cursedwand.supernova=Flamanta bulo da energio komencas kreski. Eble vi volas kuri!
items.wands.cursedwand.supernova_positive=Flamanta bulo da energio komencas kreski, sed ĝi iel sentas sin sekura.
items.wands.cursedwand.transmogrify_other=Via objekto transformiĝas en ion malsaman!
items.wands.cursedwand.transmogrify_wand=Via sorĉbastono transformiĝas en alian objekton!
items.wands.damagewand.upgrade_stat_name_1=Magia Difekto
items.wands.wand$placeholder.name=sorĉbastono
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Ĉi tiu %s estas malbenita!
items.wands.wand.cursed=Ĉi tiu sorĉbastono estas malbenita, igante ĝian magion kaosa kaj hazarda.
items.wands.wand.fizzles=Via sorĉbastono fajfas; ĝi verŝajne ne havas sufiĉe da ŝargo.
items.wands.wand.identify=Vi nun sufiĉe konas vian sorĉbastonon por identigi ĝin.
items.wands.wand.no_magic=Via sorĉbastono fajfas; vi ne povas uzi sorĉbastonojn dum magioimuna.
items.wands.wand.not_cursed=Ĉi tiu sorĉbastono estas libera de malica magio.
items.wands.wand.prompt=Elektu lokon por zapi
items.wands.wand.resin_many=Ĉi tiu sorĉbastono akiris _%d-nivelojn_ el arkana rezino.
items.wands.wand.resin_one=Ĉi tiu sorĉbastono gajnis _1 nivelon_ el arkana rezino.
items.wands.wand.self_target=Vi ne povas celi vin mem!
items.wands.wandofblastwave.bmage_desc=Kiam _la Batalmago_ trafas paralizitan malamikon per bastono de eksploda ondo, ĝi konsumos la paralizon por kaŭzi eksplodon de kroma magia damaĝo. Ĉi tio havas mallongan malvarmiĝtempon por ĉiu malamiko.
items.wands.wandofblastwave.desc=Ĉi tiu sorĉbastono estas farita el ia marmorita ŝtono, kun ora bordero kaj ronda nigra gemo ĉe la pinto. Ĝi sentiĝas tre peza en via mano.
items.wands.wandofblastwave.eleblast_desc=Elementa eksplodo kun bastono de eksplodondo kaŭzas 67%-an damaĝon kaj frapas ĉiujn malamikojn ekster la eksplodareon.
items.wands.wandofblastwave.knockback_ondeath=La kolizio mortigis vin...
items.wands.wandofblastwave.name=bastono de eksplodondo
items.wands.wandofblastwave.ondeath=Vi mortigis vin per via propra Sorĉbastono de Eksplodondo...
items.wands.wandofblastwave.staff_name=kunlaborantaro de eksplodondo
items.wands.wandofblastwave.stats_desc=Ĉi tiu sorĉbastono pafas sagon, kiu perforte detonacias ĉe celloko. La forto de ĉi tiu eksplodo kaŭzas _%1$d-%2$d damaĝon_ kaj estas sufiĉe forta por flugigi plej multajn malamikojn.
items.wands.wandofblastwave.typical_stats_desc=Ĉi tiu sorĉbastono pafas sagon, kiu perforte detonacias ĉe celloko. La forto de ĉi tiu eksplodo tipe kaŭzas _%1$d-%2$d damaĝon_ kaj estas sufiĉe forta por flugigi plej multajn malamikojn.
items.wands.wandofblastwave.upgrade_stat_name_2=Rebato
items.wands.wandofcorrosion.bmage_desc=Kiam _la Batalmago_ trafas malamikon per bastono de korodo, la malamiko havas ŝancon ŝlimiĝi.
items.wands.wandofcorrosion.desc=Ĉi tiu sorĉbastono havas cindrogrizan korpon, kiu malfermiĝas al brile oranĝa gemo.
items.wands.wandofcorrosion.eleblast_desc=Elementa eksplodo per bastono de korodo kaŭzas al malamikoj 4 vicojn de korodo, komencante je 6 damaĝo.
items.wands.wandofcorrosion.name=bastono de korodo
items.wands.wandofcorrosion.staff_name=kunlaborantaro de korodo
items.wands.wandofcorrosion.stats_desc=Ĉi tiu sorĉbastono pafas sagon, kiu eksplodas en nubon de tre koroda gaso ĉe celita loko. Ĉio kaptita en ĉi tiu nubo ricevos kreskantan damaĝon laŭlonge de la tempo, komencante je _%d damaĝo_.
items.wands.wandofcorrosion.upgrade_stat_name_1=Koroda Difekto
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolumeno
items.wands.wandofcorruption.already_corrupted=Tiu karaktero ne povas esti plu influita.
items.wands.wandofcorruption.bmage_desc=Kiam _la Batalmago_ frapas malamikon per bastono de korupto, la malamiko havas ŝancon fumiĝi.
items.wands.wandofcorruption.desc=Ĉi tiu sorĉbastono radias kaosan malhelan energion, se tio ne jam estus evidenta pro la malgranda ornama kranio formita sur ĝia pinto.
items.wands.wandofcorruption.eleblast_desc=Elementa eksplodo per bastono de korupto kaŭzas al malamikoj 5 vicojn da amok.
items.wands.wandofcorruption.name=sorĉbastono de korupto
items.wands.wandofcorruption.staff_name=dungitaro de korupto
items.wands.wandofcorruption.stats_desc=Ĉi tiu sorĉbastono ellasos eksplodon de korupta energio, kiu malfortigos malamikojn kaj fine fleksos ilin al via volo. Malamikoj kapablas rezisti la korupton, sed malfortigitaj malamikoj estas multe pli facile korupteblaj ol sanaj.
items.wands.wandofcorruption.upgrade_stat_name_1=Koruptante Potencon
items.wands.wandofcorruption.upgrade_stat_name_2=Daŭro de Malplibonigo
items.wands.wandofdisintegration.bmage_desc=Kiam uzata de _la Batalmago_, bastono de disfalo havas pliigitan atakan atingon, kvazaŭ ĝi havus projekciantan sorĉon.
items.wands.wandofdisintegration.desc=Ĉi tiu sorĉbastono estas farita el solida glata peco de obsidiano, kun malhelviola lumo kuranta laŭ ĝia flanko, finiĝante ĉe la pinto. Ĝi brilas per detrua energio, atendante pafi antaŭen.
items.wands.wandofdisintegration.eleblast_desc=Elementa eksplodo kun bastono de disfalo kaŭzas 100%-an damaĝon kaj trapenetras murojn.
items.wands.wandofdisintegration.name=sorĉbastono de disfalo
items.wands.wandofdisintegration.staff_name=kunlaborantaro de disfalo
items.wands.wandofdisintegration.stats_desc=Ĉi tiu sorĉbastono pafas radion kiu trapikas ajnan obstaklon, kaj iros pli foren ju pli ĝi estas plibonigita. La radio kaŭzas _%1$d-%2$d damaĝon,_ kaj ankaŭ kaŭzos kroman damaĝon por ĉiu malamiko kaj muro, kiun ĝi penetras.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maksimuma Atingo
items.wands.wandoffireblast.bmage_desc=Kiam _la Batalmago_ trafas malamikon per fajra eksplodo, ekzistas ŝanco, ke ĝi produktu eksplodon, kiu damaĝas malamikojn kaj konsumas ĉian proksiman fajron! Ĉi tiu ŝanco pliiĝas ju pli fajro estas apud la malamiko.
items.wands.wandoffireblast.desc=Ĉi tiu sorĉbastono estas farita el ruĝlakita ligno kun oraj folioj uzataj abunde por doni al ĝi aspekton sufiĉe reĝa. Ĝi kraketas kaj siblas ĉe la pinto, avida malkaŝi sian potencan magion.
items.wands.wandoffireblast.eleblast_desc=Elementa eksplodo kun bastono de fajroeksplodo kaŭzas 100% damaĝon, eksplodigas malfermajn pordojn, kaj ekbruligas malamikojn kaj terenon.
items.wands.wandoffireblast.name=sorĉbastono de fajroeksplodo
items.wands.wandoffireblast.staff_name=bastono de fajreblovo
items.wands.wandoffireblast.stats_desc=Ĉi tiu sorĉbastono eligas fajrokonuson kiam uzata. Ĝia sekva atako konsumos _%1$d ŝargojn_ kaj kaŭzos _%2$d-%3$d damaĝon_. Ju pli da ŝargoj la sorĉbastono uzas, des pli granda kaj forta la efiko.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Ŝarĝa Difekto
items.wands.wandoffireblast.upgrade_stat_name_2=2 Ŝarĝa Difekto
items.wands.wandoffireblast.upgrade_stat_name_3=3 Ŝarĝa Difekto
items.wands.wandoffrost.bmage_desc=Kiam _la Batalmagisto_ trafas malvarmigitan malamikon per frostbastono, ili havas ŝancon tuj frostiĝi. Tiu ŝanco pligrandiĝas ju pli malvarmigitaj ili estas.
items.wands.wandoffrost.desc=Ĉi tiu sorĉbastono ŝajnas esti farita el ia magia glacio. Ĝi pliheliĝas al sia ronda pinto. Ĝi sentiĝas tre malvarma kiam tenata, sed iel via mano restas varma.
items.wands.wandoffrost.eleblast_desc=Elementa eksplodo per frostbastono kaŭzas 100%-an damaĝon, frostigas malamikojn, kaj estingas fajrojn.
items.wands.wandoffrost.name=bastono de frosto
items.wands.wandoffrost.staff_name=bastono de frosto
items.wands.wandoffrost.stats_desc=Ĉi tiu sorĉbastono pafas eksplodojn de glacia energio al viaj malamikoj, kaŭzante _%1$d-%2$d damaĝon_ kaj malvarmigon. La efiko ŝajnas pli forta en akvo. Malamikoj, kiuj jam estas malvarmigitaj aŭ frostigitaj, ricevas malpli da damaĝo de ĉi tiu sorĉbastono.
items.wands.wandoffrost.upgrade_stat_name_2=Malvarmiga Daŭro
items.wands.wandoflightning$lightningcharge.desc=La Batalmago estas nuntempe ŝargita per energio, donante al li imunecon kontraŭ lia fulmbastono kaj pliigante la atingon, kiun fulmo povas arĉi de ĝi. \n\nRestantaj Turnoj: %s.
items.wands.wandoflightning$lightningcharge.name=Elektre ŝargita
items.wands.wandoflightning.bmage_desc=Kiam _la Batalmago_ trafas malamikon per fulmbastono, li havas ŝancon elektre ŝargi sin dum 10 vicoj. Dum ŝargita, la Batalmago estas imuna kontraŭ fulmdamaĝo kaj plu arkos fulmojn.
items.wands.wandoflightning.desc=Ĉi tiu sorĉbastono estas farita el solida metalo, kio igas ĝin surprize peza. Du pintoj kurbiĝas kune ĉe la pinto, kaj elektro arĉas inter ili.
items.wands.wandoflightning.eleblast_desc=Elementa eksplodo per fulmobastono kaŭzas 100%-an damaĝon, miregigas malamikojn dum 5 vicoj, kaj elektrigas akvon.
items.wands.wandoflightning.name=bastono de fulmo
items.wands.wandoflightning.ondeath=Vi mortigis vin per via propra Fulmobastono...
items.wands.wandoflightning.staff_name=bastono de fulmo
items.wands.wandoflightning.stats_desc=Ĉi tiu sorĉbastono sendas potencajn fulmojn tra ĉio, al kio ĝi estas pafita, kaŭzante _%1$d-%2$d damaĝon._ Ĉi tiu elektro arkos al proksimaj roluloj, kaj disvastiĝas pli facile en akvo. La arkoj de ĉi tiu sorĉbastono povas damaĝi vin, sed ne vundos viajn aliancanojn.
items.wands.wandoflivingearth$earthguardian.desc=La ŝtonoj el via sorĉbastono el vivanta tero formiĝis en protektan teran gardanton! Ĉi tiu ŝtona protektanto atakos proksimajn malamikojn, kio devigos ilin ataki la gardanton anstataŭ vin. Kiam ĉiuj proksimaj minacoj malaperos, la gardanto reformiĝos ĉirkaŭ vi, kaj revenos kiam vi denove uzos vian sorĉbastonon.
items.wands.wandoflivingearth$earthguardian.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa sorĉbastono.
items.wands.wandoflivingearth$earthguardian.name=tera gardanto
items.wands.wandoflivingearth$earthguardian.wand_info=La defenda povo de la gardisto estas ligita al la nivelo de via sorĉbastono. Ĝi nuntempe blokas _%1$d-%2$d damaĝon_.
items.wands.wandoflivingearth$rockarmor.desc=Magiaj rokoj ĉirkaŭas vian korpon, kiam vi estas atakita, ili provos bloki por vi, kaj reduktos la damaĝon, kiun vi ricevas, je 50%%. Ĉiu blokita damaĝo tamen skrapas iom da la roko.\n\nRestanta Kiraso: %1$d.\n\nSe sufiĉe da roko estas konstruita ĉirkaŭ vi, la sekva pafo de via sorĉbastono el vivanta tero kaŭzos, ke la rokoj formiĝos en gardanton, kiu batalos kontraŭ vi.\n\nKiraso bezonata por Gardanto: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ĉi tiu tera gardanto ankaŭ profitas de la Potenco de Multaj. Restantaj Vicoj: %d.
items.wands.wandoflivingearth$rockarmor.name=roka kiraso
items.wands.wandoflivingearth.bmage_desc=Kiam _la Batalmago_ frapas malamikon per bastono el vivanta tero, iom da la kaŭzita damaĝo estas resendita kiel roka kiraso.
items.wands.wandoflivingearth.desc=Ĉi tiu sorĉbastono estas farita el stranga roko, kun bendoj de brilanta flava energio. La rokoj ŝajnas iomete ŝoviĝi dum vi tenas la sorĉbastonon, kvazaŭ ili povus senti vian manon.
items.wands.wandoflivingearth.eleblast_desc=Elementa eksplodo per bastono el vivanta tero kaŭzas 50%-an damaĝon, kaj resanigas aktivan teran gardanton por ĉiu malamika trafo.
items.wands.wandoflivingearth.name=sorĉbastono el vivanta tero
items.wands.wandoflivingearth.staff_name=bastono de vivanta tero
items.wands.wandoflivingearth.stats_desc=Ĉi tiu sorĉbastono sendas sagojn de magia roko al malamikoj, kaŭzante _%1$d-%2$d damaĝon._ La rokoj tiam reformiĝos ĉirkaŭ la uzanto, donante al ili kirason proporcie al la kaŭzita damaĝo. Se sufiĉe da kiraso estas konstruita, ĝi formiĝos en rokgardanton kiam la sorĉbastono estos sekve pafita.
items.wands.wandoflivingearth.upgrade_stat_name_2=Gardanto Maksimuma HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Gardanto-Blokado
items.wands.wandofmagicmissile$magiccharge.desc=Via sorĉbastono de magia misilo reenkondukis potencon en viajn sorĉbastonojn, pliigante la efikan nivelon de la sekva fulmo, kiun ili faras. ZXQPH2 ZXQZXQPH3 ZXQ Viaj sorĉbastonoj estas plifortigitaj al: +ZXQPH0 ZXQ. ZXQPH4 ZXQZXQPH5 ZXQ Restantaj turnoj de magia ŝargo: ZXQPH1 ZXQ.
items.wands.wandofmagicmissile$magiccharge.name=magia ŝargo
items.wands.wandofmagicmissile.bmage_desc=Kiam _la Batalmago_ trafas malamikon per bastono de magiaj misiloj, ĉiuj liaj sorĉbastonoj gajnos ŝargon aldone al lia bastono.
items.wands.wandofmagicmissile.desc=Ĉi tiu sufiĉe simpla sorĉbastono lanĉas misilojn de pura magia energio. Kvankam al la sorĉbastono mem mankas iuj specialaj efikoj, ĝi havas pli da disponeblaj ŝargoj kaj povas nelonge povigi aliajn sorĉbastonojn kiam ĝisdatigita.
items.wands.wandofmagicmissile.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.wands.wandofmagicmissile.eleblast_desc=Elementa eksplodo per bastono de magia misilo kaŭzas 50%-an damaĝon, kaj donas al la magiisto 15 vicojn da reŝargado.
items.wands.wandofmagicmissile.name=sorĉbastono de magia misilo
items.wands.wandofmagicmissile.staff_name=bastono de magia misilo
items.wands.wandofmagicmissile.stats_desc=Ĉiu sago de ĉi tiu sorĉbastono kaŭzas _%1$d-%2$d damaĝon,_ kaj nelonge povigos aliajn sorĉbastonojn se ĝi estas plibonigita.
items.wands.wandofprismaticlight.bmage_desc=Kiam _la Batalmago_ frapas malamikon per bastono el prisma lumo, ili estos kripligitaj por daŭro kiu skalas laŭ la nivelo de la bastono.
items.wands.wandofprismaticlight.desc=Ĉi tiu sorĉbastono estas farita el solida peco de travidebla kristalo, kvazaŭ longa bloko de glata vitro. Malgrandaj pecetoj de bunta lumo dancas ĉirkaŭ la pinto de la sorĉbastono, avidaj eksplodi.
items.wands.wandofprismaticlight.eleblast_desc=Elementa eksplodo per bastono de prisma lumo kaŭzas 67%-an damaĝon, rivelas ĉian terenon en la eksplodo, kaj blindigas malamikojn dum 5 vicoj.
items.wands.wandofprismaticlight.name=bastono de prisma lumo
items.wands.wandofprismaticlight.staff_name=bastono de prisma lumo
items.wands.wandofprismaticlight.stats_desc=Ĉi tiu sorĉbastono pafas lumradiojn, kiuj tranĉas la mallumon de la kelkarcero, rivelante kaŝitajn areojn kaj kaptilojn. La radio povas blindigi malamikojn kaj kaŭzas _%1$d-%2$d damaĝon._ Demonaj kaj malmortaj malamikoj brulos en la brila lumo de la sorĉbastono, ricevante kroman damaĝon.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blinda Ŝanco
items.wands.wandofprismaticlight.upgrade_stat_name_3=Luma Daŭro
items.wands.wandofregrowth$dewcatcher.desc=Roskaptiloj estas mirindaj plantoj, kiuj plenigas sin per magia roso. Ili provas kamufli sin kiel herbo por eviti atenton, sed iliaj ŝvelaĵoj de kolektita roso perfidas ilin.
items.wands.wandofregrowth$dewcatcher.discover_hint=Vi povas trovi ĉi tiun planton per specifa sorĉbastono.
items.wands.wandofregrowth$dewcatcher.name=Roskaptilo
items.wands.wandofregrowth$lotus.desc=La ora lotuso estas mistika planto, kiun oni povas elvoki nur per potenca sorĉbastono de rekresko. Ĝia aŭro plibonigas ĉiujn plantojn kaj plantajn efikojn, sed ĝi brulas per sia energio kaj mortas post mallonga tempo.
items.wands.wandofregrowth$lotus.discover_hint=Vi povas trovi ĉi tiun planton per specifa sorĉbastono, post plibonigo de ĝi plurfoje.
items.wands.wandofregrowth$lotus.name=Ora Lotuso
items.wands.wandofregrowth$lotus.wand_info=Ĉi tiu lotuso estis produktita per _+%1$d_ sorĉbastono de rekresko. Ĉiuj plantoj sub ĝia efiko _tuj ekiĝos_ se ili estas plantitaj sur rolulo. Plantoj ankaŭ havos _%2$d%% ŝancon_ faligi siajn semojn, kaj pintaj sagetoj uzos _%3$d%% malpli da daŭripovo_.
items.wands.wandofregrowth$seedpod.desc=Semkapsuloj estas magiaj plantoj, kiuj produktas semojn de aliaj plantspecoj, anstataŭ iujn ajn proprajn semojn. Ili iel sukcesas disvastiĝi malgraŭ ne havi proprajn semojn.
items.wands.wandofregrowth$seedpod.discover_hint=Vi povas trovi ĉi tiun planton per specifa sorĉbastono.
items.wands.wandofregrowth$seedpod.name=Semkapsulo
items.wands.wandofregrowth.bmage_desc=Kiam _la Batalmago_ frapas malamikon per bastono de rekresko, kaj ambaŭ staras sur herbo, li gajnos herban resanigon proporcie al la kaŭzita damaĝo.
items.wands.wandofregrowth.degradation=Post pliaj _%d ŝargoj_ ĉi tiu sorĉbastono komencos ĉesi produkti plantojn kaj freŝan herbon. Ĉi tiu limo pliiĝas per plialtigo de la nivelo aŭ plibonigo de la sorĉbastono.
items.wands.wandofregrowth.desc=Ĉi tiu sorĉbastono estas farita el maldika ŝafto el lerte ĉizita ligno. Iel ĝi ankoraŭ vivas kaj viglas, brile verda kiel la kerno de juna arbo. "Kiam la vivo ĉesas, nova vivo ĉiam komencas kreski... La eterna ciklo ĉiam restas!"
items.wands.wandofregrowth.eleblast_desc=Elementa eksplodo kun bastono de rekreskaĵo enradikigas malamikojn kaj hazarde kreskigas herbon super la eksplodareo.
items.wands.wandofregrowth.name=sorĉbastono de rekresko
items.wands.wandofregrowth.staff_name=kunlaborantaro de rekresko
items.wands.wandofregrowth.stats_desc=Kiam uzata, ĉi tiu sorĉbastono eksplodos magian rekreskan energion eksteren en konuso, kaŭzante la reviviĝon de herbo, radikoj kaj raraj plantoj. Ĝia sekva pafo konsumos _%1$d ŝargojn_. Ju pli da ŝargoj la sorĉbastono uzas, des pli granda kaj forta la efiko.
items.wands.wandofregrowth.upgrade_stat_name_1=Herbo Po Ŝarĝo
items.wands.wandofregrowth.upgrade_stat_name_2=Totala Herba Limo
items.wands.wandoftransfusion.bmage_desc=Kiam _la Batalmago_ trafas ĉarmitan malamikon per bastono de transfuzo, li akiros ŝirmadon kaj lia sekva frapo per la bastono ne kostos sanon.
items.wands.wandoftransfusion.charged=Via bastono estas ŝargita per la vivo-energio de via malamiko!
items.wands.wandoftransfusion.desc=Sufiĉe simple formita sorĉbastono, ĝi elstaras pro sia magenta nuanco kaj nigra gemo ĉe la pinto.
items.wands.wandoftransfusion.eleblast_desc=Elementa eksplodo per bastono de transfuzo ĉarmas malamikojn, resanigas aliancanojn, kaj kaŭzas 100%-an damaĝon al malmortaj malamikoj.
items.wands.wandoftransfusion.name=bastono de transfuzo
items.wands.wandoftransfusion.ondeath=Vi mortigis vin per via propra Bastono de Transfuzo...
items.wands.wandoftransfusion.staff_name=dungitaro de transfuzio
items.wands.wandoftransfusion.stats_desc=Kiam uzata kontraŭ aliancanoj aŭ ĉarmitaj malamikoj, ĉi tiu sorĉbastono elĉerpos _%1$d de la sano de la uzanto_ por resanigi aŭ ŝirmi la aliancanon por _%2$d sano_. Kiam uzata kontraŭ malamikoj, la sorĉbastono nelonge ĉarmas ilin dum ĝi aplikas _%3$d ŝirmadon_ al la uzanto. Malamikaj malmortuloj ricevos _%4$d-%5$d damaĝon_ anstataŭ esti ĉarmitaj.
items.wands.wandoftransfusion.upgrade_stat_name_1=Aliancana Resanigo
items.wands.wandoftransfusion.upgrade_stat_name_2=Mem-ŝirmado
items.wands.wandoftransfusion.upgrade_stat_name_3=Difekto de Malmortuloj
items.wands.wandofwarding$ward.desc_1=Ĉi tiu baza protektilo aŭtomate forpafos ĉiun malamikon, kiu eniras ĝian vidkampon, kaŭzante _%1$d-%2$d damaĝon._\n\n Forpafante ĉi tiun protektilon per via sorĉbastono de protekto ĝi plibonigos ĝin.\n\n Ĉi tiu protektilo forpafos nur unu fojon antaŭ ol disipiĝi.\n\nVia sorĉbastono de protekto uzas _%3$d energion_ por subteni ĉi tiun protektilon.
items.wands.wandofwarding$ward.desc_2=Ĉi tiu plibonigita protektilo havas pli komplikan ŝablonon, kaj povas ataki plurfoje. Ĉiu pafo de ĉi tiu protektilo kaŭzos _%1$d-%2$d damaĝon._\n\nTelpafo de ĉi tiu protektilo per via sorĉbastono de protekto plibonigos ĝin.\n\nĈi tiu protektilo pafos tri fojojn antaŭ ol disipiĝi.\n\nVia sorĉbastono de protekto uzas _%3$d energion_ por subteni ĉi tiun protektilon.
items.wands.wandofwarding$ward.desc_3=Ĉi tiu plene plibonigita protektanto kapablas ataki pli ofte ol siaj antaŭuloj. Ĉiu pafo de ĉi tiu protektanto kaŭzos _%1$d-%2$d damaĝon._\n\n Pafado de ĉi tiu protektanto per via sorĉbastono de protektado plibonigos ĝin.\n\n Ĉi tiu protektanto pafos kvin fojojn antaŭ ol malaperi.\n\nVia sorĉbastono de protektado uzas _%3$d energion_ por subteni ĉi tiun protektanton.
items.wands.wandofwarding$ward.desc_4=Ĉi tiu pli malgranda gardostaranto havas la saman pafforton kiel pli granda protektanto, sed havas sanon anstataŭ fiksitan nombron da ŝargoj. Ĝi similas al la gemo ĉe la pinto de via protekta sorĉbastono. Ĉiu pafo de ĉi tiu gardostaranto kaŭzos _%1$d-%2$d damaĝon._\n\n Pafado de ĉi tiu gardostaranto per via protekta sorĉbastono plibonigos kaj resanigos ĝin.\n\n Ĉi tiu gardostaranto elspezos iom da sano ĉiufoje kiam ĝi pafas malamikon, sed povas esti resanigita per uzado de via protekta sorĉbastono sur ĝin.\n\nVia protekta sorĉbastono uzas _%3$d energion_ por subteni ĉi tiun gardostaranton.
items.wands.wandofwarding$ward.desc_5=Ĉi tiu plibonigita gardostaranto estas pli granda kaj pli daŭra ol malpli bona gardostaranto. Ĉiu pafo de ĉi tiu gardostaranto kaŭzos _%1$d-%2$d damaĝon._\n\n Pafado de ĉi tiu gardostaranto per via sorĉbastono de protekto plibonigos kaj resanigos ĝin.\n\n Ĉi tiu gardostaranto elspezos iom da sano ĉiufoje kiam ĝi pafas malamikon, sed povas esti resanigita per uzado de via sorĉbastono de protekto sur ĝi.\n\nVia sorĉbastono de protekto uzas _%3$d energion_ por subteni ĉi tiun gardostaranton.
items.wands.wandofwarding$ward.desc_6=Ĉi tiu plene plibonigita gardostaranto estas signife pli daŭra ol siaj antaŭuloj. Ĉiu pafo de ĉi tiu gardostaranto kaŭzos _%1$d-%2$d damaĝon._\n\n Pafante ĉi tiun gardostaranton per via sorĉbastono de protekto resanigos ĝin.\n\n Ĉi tiu gardostaranto elspezos iom da sano ĉiufoje kiam ĝi pafas malamikon, sed povas esti resanigita per uzado de via sorĉbastono de protekto sur ĝin.\n\nVia sorĉbastono de protekto uzas _%3$d energion_ por subteni ĉi tiun gardostaranton.
items.wands.wandofwarding$ward.desc_generic_sentry=Ĉi tiu gardostaranto havas la saman pafforton kiel protektanto, sed havas sanon anstataŭ fiksitan nombron da ŝargoj. Ĝi similas al la gemo ĉe la pinto de via protekta sorĉbastono.\n\nTelefonante ĉi tiun gardostaranton per via protekta sorĉbastono plibonigos kaj resanigos ĝin.\n\nĈi tiu gardostaranto elspezos iom da sanon ĉiufoje kiam ĝi telefonas malamikon, sed povas esti resanigita per uzado de via protekta sorĉbastono sur ĝin.
items.wands.wandofwarding$ward.desc_generic_ward=Ĉi tiu protektanto aŭtomate forigos ĉiun malamikon, kiu eniras ĝian vidkampon.\n\nForigo de ĉi tiu protektanto per via protekta sorĉbastono plibonigos ĝin.\n\nKuracantoj havas limigitan nombron da forigoj antaŭ ol disipiĝi.
items.wands.wandofwarding$ward.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa sorĉbastono.
items.wands.wandofwarding$ward.dismiss_body=Vi povas dispeli ĉi tiun protektanton se vi jam ne volas, ke via sorĉbastono konservu ĝin. Fari tion tuj detruas la protektaton.\n\nĈu forigi ĉi tiun protektaton?
items.wands.wandofwarding$ward.dismiss_cancel=ne
items.wands.wandofwarding$ward.dismiss_confirm=jes
items.wands.wandofwarding$ward.dismiss_title=Forigi ĉi tiun hospitalan sekcion?
items.wands.wandofwarding$ward.name_1=pli malgranda hospitala sekcio
items.wands.wandofwarding$ward.name_2=hospitala sekcio
items.wands.wandofwarding$ward.name_3=pli granda hospitala sekcio
items.wands.wandofwarding$ward.name_4=pli malgranda gardostaranto
items.wands.wandofwarding$ward.name_5=gardostaranto
items.wands.wandofwarding$ward.name_6=pli granda gardostaranto
items.wands.wandofwarding.bad_location=Vi ne povas meti hospitalan sekcion tien.
items.wands.wandofwarding.bmage_desc=Kiam _la Batalmago_ frapas malamikon per bastono de protekto, ĉiuj aktivaj protektoj kaj gardostarantoj havas ŝancon resaniĝi.
items.wands.wandofwarding.desc=Ĉi tiu mallonga metala sorĉbastono havas brile purpuran gemon ŝvebantan super sia pinto.
items.wands.wandofwarding.eleblast_desc=Elementa eksplodo kun bastono de protekto resanigas ĉiujn protektojn kaj gardostarantojn en la eksplodareo.
items.wands.wandofwarding.name=sorĉbastono de protekto
items.wands.wandofwarding.no_more_wards=Via sorĉbastono ne povas subteni pluajn protektajn protektojn.
items.wands.wandofwarding.staff_name=dungitaro de vartado
items.wands.wandofwarding.stats_desc=Anstataŭ rekte damaĝi malamikon, ĉi tiu sorĉbastono alvokos senmovajn protektatojn kaj gardostarantojn. Protektoj povas esti alvokitaj ie ajn, eĉ tra muroj se vi havas vidon. Ĉi tiu sorĉbastono povas subteni energion egalan al _%d_ da protektatoj samtempe.
items.wands.wandofwarding.upgrade_stat_name_1=Hospitala Difekto
items.wands.wandofwarding.upgrade_stat_name_2=Hospitala Sekcia Energio
items.waterskin.ac_drink=TRINKAĴO
items.waterskin.collected=Vi kolektas la rosguton en vian akvosakon.
items.waterskin.desc=Ujo por likvaĵo, farita el ledo kaj ŝnuro, sigelita per korkŝtopilo.
items.waterskin.desc_full=La plena akvosako ŝajnas radii energion, eble ĝi povus esti uzata por beni alian supervivobjekton?
items.waterskin.desc_heal=La akvosako nuntempe estas uzata por konservi kuracantan akvon. Ju pli plena estas la akvosako, des pli vi tuj resaniĝos trinkante el ĝi. Vi trinkos nur tiom, kiom vi bezonas.
items.waterskin.desc_water=Nuntempe la akvosako enhavas nur iom da simpla trinkakvo. Certe estas io en la kelkarcero, kion la akvosako povus anstataŭe konservi.
items.waterskin.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.waterskin.empty=Via akvosako estas malplena!
items.waterskin.full=Via akvosako estas plena!
items.waterskin.name=akvosako
items.weapon.curses.annoying.desc=Ĝenaj armiloj kapablas paroli, sed ili estas iom tro energiaj. Ili ofte altiros atenton al vi senintence.
items.weapon.curses.annoying.elestrike_desc=Elementa atako kun ĝena malbeno havas 20%-an ŝancon amoki ĉiun malamikon ene de atingo dum 6 vicoj.
items.weapon.curses.annoying.msg_1=HO, ĈU NI BATALAS KONTRAŬ IO!?
items.weapon.curses.annoying.msg_10=BONE TRAFITA!
items.weapon.curses.annoying.msg_11=Mi ne volis esti armilo, mi volis esti hakilo de lignisto.
items.weapon.curses.annoying.msg_12=Memoru, troa memfido estas malrapida kaj insida murdisto.
items.weapon.curses.annoying.msg_13=Viaj ĉiuj bazoj apartenas al ni!
items.weapon.curses.annoying.msg_2=JES, PRENU ILIN!
items.weapon.curses.annoying.msg_3=HEJ, AŬSKULTU!
items.weapon.curses.annoying.msg_4=ĈU NI JAM ĈE LA ESTRO?!
items.weapon.curses.annoying.msg_5=AŬ, NE SVINGU MIN TIEL FORTE!
items.weapon.curses.annoying.msg_6=MORTU, INSEKTO!
items.weapon.curses.annoying.msg_7=TIIIIIIIIIIIII!
items.weapon.curses.annoying.msg_8=ĈU NI POVAS PAŬZI?!
items.weapon.curses.annoying.msg_9=PU, HAHA!
items.weapon.curses.annoying.name=ĝena %s
items.weapon.curses.dazzling.desc=Brilaj armiloj iafoje fulmas per brila lumo, blindigante ĉion, kio povas vidi ilin.
items.weapon.curses.dazzling.elestrike_desc=Elementa atako kun brila malbeno havas 50%-an ŝancon blindigi ĉiun malamikon ene de atingo dum 6 vicoj.
items.weapon.curses.dazzling.name=brila %s
items.weapon.curses.displacing.desc=Delokiĝantaj armiloj estas plenigitaj per kaosa teleportada magio, posedante la kapablon hazarde misprezenti malamikojn ĉirkaŭ la planko.
items.weapon.curses.displacing.elestrike_desc=Elementa atako kun delokiga malbeno havas 50% ŝancon teletransporti ĉiun malamikon ene de atingo.
items.weapon.curses.displacing.name=delokigo de %s
items.weapon.curses.explosive.desc=Eksplodemaj armiloj konstante akumulas potencon kaj eksplodas, difektante ĉion proksime.
items.weapon.curses.explosive.desc_cool=Via armilo estas nuntempe malvarma tuŝeble.
items.weapon.curses.explosive.desc_hot=Via armilo estas varmega! Ĝi tuj eksplodos!
items.weapon.curses.explosive.desc_warm=Via armilo estas kreskigi energion kaj varmiĝi...
items.weapon.curses.explosive.elestrike_desc=Elementa atako kun eksplodema malbeno havas 50%-an ŝancon kaŭzi eksplodon sur hazarda malamiko ene de atingo.
items.weapon.curses.explosive.hot=Varmega!
items.weapon.curses.explosive.name=eksplodema %s
items.weapon.curses.explosive.warm=Varma...
items.weapon.curses.friendly.desc=Amikaj armiloj plej taŭgas por pacifistoj, foje ekigante magion, kiu malebligas batali.
items.weapon.curses.friendly.elestrike_desc=Elementa atako kun amika malbeno havas 50% ŝancon ĉarmi ĉiun malamikon ene de atingo dum 6 vicoj.
items.weapon.curses.friendly.name=amika %s
items.weapon.curses.polarized.desc=Polarigita armilo estas influita de magio, kiu kaŭzas, ke ĝia atako aŭ kaŭzas 50% pli da damaĝo, aŭ tute ne kaŭzas damaĝon.
items.weapon.curses.polarized.elestrike_desc=Elementa atako kun polarigita malbeno havas 50% ŝancon kaŭzi 24-36 damaĝon al ĉiu malamiko en atingodistanco.
items.weapon.curses.polarized.name=polarigita %s
items.weapon.curses.sacrificial.desc=Oferarmiloj postulos sangon de la portanto kontraŭ atakado de malamikoj. Ju pli sana estas la portanto, des pli da sango la malbeno prenos.
items.weapon.curses.sacrificial.elestrike_desc=Elementa atako kun ofermalbeno kaŭzas, ke la heroo kaj ĉiu malamiko en atingopovo sangas je 12 vivpoentoj.
items.weapon.curses.sacrificial.name=oferaj %s
items.weapon.curses.wayward$waywardbuff.desc=La magio de via kaprica armilo aktiviĝis, igante ĝin ekstreme malpreciza por mallonga tempo. Notu, ke tio ne influas atakojn, kiuj garantiite trafos, kiel ekzemple surprizaj atakoj. Sukcesa atakado per la kaprica armilo tuj forigos ĉi tiun efikon.\n\nRestantaj turnoj: %s.
items.weapon.curses.wayward$waywardbuff.name=kaprica
items.weapon.curses.wayward.desc=Kapricaj armiloj foje fariĝas ekstreme malprecizaj. Ĉi tiu magio daŭras iom da tempo kiam ĝi aktiviĝas, sed povas esti dispelita per bato per la kaprica armilo.
items.weapon.curses.wayward.elestrike_desc=Elementa atako kun kaprica malbeno havas 50% ŝancon sorĉi ĉiun malamikon ene de atingo dum 6 vicoj.
items.weapon.curses.wayward.name=kaprica %s
items.weapon.enchantments.blazing.desc=Ĉi tiu sorĉo igas flamojn ŝpruci el armilo, ekbruligante malamikojn kaj kaŭzante kroman damaĝon al malamikoj, kiuj jam brulas.
items.weapon.enchantments.blazing.elestrike_desc=Elementa atako kun flamanta sorĉo disvastigas fajron al ĉiu kahelo en atingodistanco, kiu daŭras 8 vicojn.
items.weapon.enchantments.blazing.name=flamanta %s
items.weapon.enchantments.blocking$blockbuff.desc=La blokada sorĉo de via armilo donis al vi mallongan akcelon al via defenda povo!\n\nRestas ŝirmado: %d\n\nRestas turnoj: %s.
items.weapon.enchantments.blocking$blockbuff.name=blokado
items.weapon.enchantments.blocking.desc=Blokaj armiloj havas ŝancon nelonge ŝirmi vin post atakado per ili.
items.weapon.enchantments.blocking.elestrike_desc=Elementa atako kun blokanta sorĉo donas al la Duelanto pliajn 6 ŝirmadojn por ĉiu malamiko en atingodistanco.
items.weapon.enchantments.blocking.name=blokante %s
items.weapon.enchantments.blooming.desc=Florantaj armiloj enhavas magion, kiu kaŭzos vegetaĵaron ŝosi sur aŭ ĉirkaŭ tiuj, kiujn ili trafis.
items.weapon.enchantments.blooming.elestrike_desc=Elementa atako kun floranta sorĉo disvastigas herbon ĝis 8 kahelojn ene de atingo, kaj enradikigas ĉiujn malamikojn ene de atingo dum 6 vicoj.
items.weapon.enchantments.blooming.name=floranta %s
items.weapon.enchantments.chilling.desc=Malamikoj trafitaj de ĉi tiu sorĉo malvarmiĝas, malrapidigante ilian movon kaj atakojn.
items.weapon.enchantments.chilling.elestrike_desc=Elementa atako kun malvarmiga sorĉo disvastigas malvarmigan aeron al ĉiu kahelo en atingodistanco, kio daŭras 8 vicojn.
items.weapon.enchantments.chilling.name=malvarmiga %s
items.weapon.enchantments.corrupting.desc=Ĉi tiu potenca sorĉo posedas la kapablon ŝanĝi malamikojn al via volo. Kiam malamiko estas mortigita per ĉi tiu armilo, ekzistas ŝanco, ke ili koruptiĝos anstataŭ morti.
items.weapon.enchantments.corrupting.elestrike_desc=Elementa atako kun korupta sorĉo havas 5-25% ŝancon (bazitan sur mankantaj vivpoentoj) korupti ĉiun malamikon en atingodistanco, krom la ĉefa celo.
items.weapon.enchantments.corrupting.name=koruptante %s
items.weapon.enchantments.elastic.desc=Elastaj armiloj havas ŝancon sendi malamikojn flugantajn reen mallongajn distancojn.
items.weapon.enchantments.elastic.elestrike_desc=Elementa atako kun elasta sorĉo ĵetas ĉiujn malamikojn en atingodistanco malantaŭen je 5 kaheloj.
items.weapon.enchantments.elastic.name=elasta %s
items.weapon.enchantments.grim.desc=Ĉi tiu potenca sorĉo posedas la povon tuj ekzekuti malamikon. La efiko pli verŝajne okazos ju pli malforta estas la malamiko.
items.weapon.enchantments.grim.elestrike_desc=Elementa atako kun sinistra sorĉo havas 6-30% ŝancon (bazitan sur mankantaj vivpoentoj) mortigi ĉiun malamikon en atingodistanco, krom la ĉefa celo.
items.weapon.enchantments.grim.name=sinistra %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Via armilo stokis la troan forton de antaŭa mortiga bato, kaj aplikos ĝin kiel kroman damaĝon al via sekva atako. La energio tamen malrapide svagiĝos laŭlonge de la tempo. \n\nKonservita Damaĝo: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=konservita difekto
items.weapon.enchantments.kinetic.desc=Kiam malamiko estas mortigita per kineta armilo, ĉia troa forto estas stokita en la armilo kaj estos aplikita al la sekva sukcesa atako.
items.weapon.enchantments.kinetic.elestrike_desc=Elementa atako kun kineta sorĉo aplikas 40% de la stokita damaĝo al ĉiu malamiko en atingodistanco, krom la ĉefa celo.
items.weapon.enchantments.kinetic.name=kineta %s
items.weapon.enchantments.lucky.desc=Malamikoj mortigitaj per bonŝanca armilo havas ŝancon faligi ekstran rabaĵon.
items.weapon.enchantments.lucky.elestrike_desc=Elementa atako kun bonŝanca sorĉo havas 12.5% ŝancon generi rabaĵon sub ĉiu malamiko en atingodistanco. Ĉi tiu efiko povas ekfunkcii nur unufoje por ĉiu malamiko.
items.weapon.enchantments.lucky.name=bonŝanca %s
items.weapon.enchantments.projecting.desc=Per ĉi tiu sorĉo, manbatalaj armiloj akiros plian atingon. Distancaj armiloj penetros murojn kiam celitaj al proksimaj celoj.
items.weapon.enchantments.projecting.elestrike_desc=Elementa atako kun projekcianta sorĉo kaŭzas 30%-an damaĝon al ĉiu malamiko en atingodistanco, krom la ĉefa celo.
items.weapon.enchantments.projecting.name=projekciante %s
items.weapon.enchantments.shocking.desc=Elektro arĉas el ŝoka armilo, kaŭzante ekstran damaĝon al ĉiuj proksimaj malamikoj.
items.weapon.enchantments.shocking.elestrike_desc=Elementa atako kun ŝoka sorĉo disvastigas elektron al ĉiu kahelo en atingodistanco, kiu daŭras 8 vicojn.
items.weapon.enchantments.shocking.name=ŝoka %s
items.weapon.enchantments.unstable.desc=Ĉi tiu sorĉo radias kaosan energion, funkciante kiel malsama sorĉo kun ĉiu trafo.
items.weapon.enchantments.unstable.elestrike_desc=Elementa atako kun malstabila sorĉo aplikas hazardan sorĉefikon al ĉiu malamiko en atingodistanco, krom la ĉefa celo.
items.weapon.enchantments.unstable.name=malstabila %s
items.weapon.enchantments.vampiric.desc=Ĉi tiu potenca sorĉo elsuĉas vivoforton el malamikoj ĉe ĉiu bato, enkanaligante ĝin reen en la portanton. La efiko estas pli forta ju pli malalta estas la sano de la portanto.
items.weapon.enchantments.vampiric.elestrike_desc=Elementa atako kun vampira sorĉo resanigas la Duelanton je 2.5 vivpoentoj por ĉiu malamiko en atingodistanco.
items.weapon.enchantments.vampiric.name=vampira %s
items.weapon.melee.assassinsblade.ability_desc=La Duelanto povas _ŝteliri_ dum ŝi uzas klingon de insidmurdisto. Ĉi tiu kapablo permesas al la Duelanto tuj palpebrumi ĝis 3 kahelojn for kaj donas al ŝi _%d vicojn de nevidebleco_.
items.weapon.melee.assassinsblade.ability_name=ŝteliri
items.weapon.melee.assassinsblade.desc=Malgranda onda klingo farita el obsidiano, malfacile uzebla malgraŭ malpeza grandeco, sed mortiga se ĝi trovas la ĝustan celon.
items.weapon.melee.assassinsblade.name=klingo de insidmurdisto
items.weapon.melee.assassinsblade.stats_desc=Ĉi tiu armilo estas pli forta kontraŭ nekonsciaj malamikoj.
items.weapon.melee.assassinsblade.typical_ability_desc=La Duelanto povas _ŝteliri_ dum ŝi uzas klingon de insidmurdisto. Ĉi tiu kapablo permesas al la Duelanto tuj palpebrumi ĝis 3 kahelojn for kaj tipe donas al ŝi _%d vicojn de nevidebleco_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Daŭro de kapablo
items.weapon.melee.battleaxe.ability_desc=La Duelanto povas plenumi _pezan baton_ per batalhakilo. Ĉi tiu koncentrita atako kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.battleaxe.ability_name=forta bato
items.weapon.melee.battleaxe.desc=La grandega ŝtala kapo de ĉi tiu batalhakilo metas konsiderindan pezon malantaŭ ĉiun larĝan baton.
items.weapon.melee.battleaxe.name=batalhakilo
items.weapon.melee.battleaxe.stats_desc=Ĉi tiu estas sufiĉe preciza armilo.
items.weapon.melee.battleaxe.typical_ability_desc=La Duelanto povas plenumi _pezan baton_ per batalhakilo. Ĉi tiu koncentrita atako tipe kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.crossbow$chargedshot.desc=La Duelanto koncentras potencon en sian arbaleston. La sekva atako, kiun ŝi faras per ĝi, ĉiam trafos kaj aplikos unu el tri efikoj: \n - Proksimbataj atakoj faligos malamikojn kelkajn kahelojn for. \n - Nerenversitaj sagetoj kaŭzos kroman damaĝon. \n - Renversitaj sagetoj gajnos ekstrajn uzojn kaj aplikos sian efikon en areo 7x7. Pozitivaj sagetaj efikoj influos nur aliancanojn, kaj damaĝaj efikoj aplikiĝos nur al malamikoj. La Duelanto ne povas uzi ĉi tiun kapablon por apliki pozitivajn sagetajn efikojn al si mem.
items.weapon.melee.crossbow$chargedshot.name=ŝargita
items.weapon.melee.crossbow.ability_desc=La Duelanto povas _ŝargi_ sian arbaleston, kaŭzante ke ŝia sekva regula atako per ĝi ĉiam trafos kaj aplikos unu el tri efikoj: manbatalaj atakoj forbatos malamikojn, nepintitaj sagetoj kaŭzos _+%1$d damaĝon_, kaj pintitaj sagetoj aplikos sian efikon en areo 7x7 kaj daŭros dum _%2$d pliaj uzoj_.
items.weapon.melee.crossbow.ability_name=ŝargita pafo
items.weapon.melee.crossbow.desc=Sufiĉe komplika armilo, kiu pafas sagojn je esceptaj rapidoj. Kvankam ĝi ne estas desegnita por tio, la pezo kaj fortika konstruo de ĉi tiu arbalesto igas ĝin ankaŭ deca manbatalarmilo.
items.weapon.melee.crossbow.name=arbalesto
items.weapon.melee.crossbow.stats_desc=Ĉi tiu armilo plibonigas ĵetsagetojn por kaŭzi _%1$d-%2$d damaĝon_ kiam ĝi estas ekipita, kaj eĉ donos sian sorĉon al ili.
items.weapon.melee.crossbow.typical_ability_desc=La Duelanto povas _ŝargi_ sian arbaleston, kaŭzante ke ŝia sekva regula atako per ĝi ĉiam trafos kaj aplikos unu el tri efikoj: manbatalaj atakoj forbatos malamikojn, nepintitaj sagetoj tipe kaŭzos _+%1$d damaĝon_, kaj pintitaj sagetoj aplikos sian efikon en areo 7x7 kaj tipe daŭros dum _%2$d pliaj uzoj_.
items.weapon.melee.crossbow.typical_stats_desc=Tipe ĉi tiu armilo plibonigas ĵetitajn sagetojn por kaŭzi _%1$d-%2$d damaĝon_ kiam ĝi estas ekipita, kaj eĉ donos sian sorĉon al ili.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Kapablo-Akcelo
items.weapon.melee.cudgel.ability_desc=La Duelanto povas plenumi _pezan baton_ per klabo. Ĉi tiu koncentrita atako kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.cudgel.ability_name=forta bato
items.weapon.melee.cudgel.desc=Malgranda latuna muskatfloro, farita pli kiel memdefenda ilo por nobeloj ol kiel aventura armilo.
items.weapon.melee.cudgel.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
