items.scrolls.scroll.kaunan=volvaĵo de KAUNAN
items.scrolls.scroll.laguz=volvaĵo de LAGUZ
items.scrolls.scroll.mannaz=volvlibro de MANNAZ
items.scrolls.scroll.naudiz=volvlibro de NAUDIZ
items.scrolls.scroll.no_magic=Vi ne povas legi volvlibron dum vi estas imuna kontraŭ magio.
