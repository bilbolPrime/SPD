items.weapon.melee.cudgel.stats_desc=Ĉi tiu estas sufiĉe preciza armilo.
items.weapon.melee.cudgel.typical_ability_desc=La Duelanto povas plenumi _pezan baton_ per klabo. Ĉi tiu koncentrita atako tipe kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.dagger.ability_desc=La Duelanto povas _ŝteliri_ dum tenado de ponardo. Ĉi tiu kapablo permesas al la Duelanto tuj palpebrumi ĝis 5 kahelojn for kaj donas al ŝi _%d vicojn de nevidebleco_.
items.weapon.melee.dagger.ability_name=ŝteliri
items.weapon.melee.dagger.desc=Simpla fera ponardo kun eluzita ligna tenilo.
