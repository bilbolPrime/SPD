items.artifacts.sandalsofnature.desc_1=Kio komence ŝajnas sandaloj faritaj el ŝnuro estas fakte du plantoj! Ili aspektas tre malfortaj kaj palaj, eble ili bezonas nutraĵojn?
items.artifacts.sandalsofnature.desc_2=La ŝuoj kreskis kaj nun pli similas al du tajloritaj ŝuoj. Iom da koloro revenis al ili, eble ili ankoraŭ povas plu kreski?
items.artifacts.sandalsofnature.desc_3=La plantoj rekreskis kaj nun similas al paro da solidaj botoj faritaj el arboŝelo. Ŝajnas, ke la plantoj reakiris sian forton, sed eble ili ankoraŭ povas plu kreski?
items.artifacts.sandalsofnature.desc_4=La plantoj ŝajnas esti atingintaj sian maksimuman grandecon, ili similas paron da kirasitaj kruroj. La kruroj estas malhelbrunaj kaj similas tre fortikan arbon.
items.artifacts.sandalsofnature.desc_ability=La ŝuo ondetas laŭ la koloro de la lasta semo, kiun vi donis al ili. Ili povas nelonge enradikiĝi en la teron kaj produkti la efikon de tiu planto ie ajn en radiuso de 3 kaheloj. \nSemo: _%s_\nŜarĝo bezonata: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=La malbenitaj sandaloj blokas ĉian agordiĝon kun la naturo.
items.artifacts.sandalsofnature.desc_hint=Vi sentas vin pli agordita kun la naturo portante ĉi tiun artefakton.
items.artifacts.sandalsofnature.desc_seeds=Vi nutris la ŝuojn per semoj %d.
items.artifacts.sandalsofnature.levelup=Viaj ŝuoj ŝvebas multe!
items.artifacts.sandalsofnature.low_charge=Viaj ŝuoj ne havas sufiĉe da energio por tio.
