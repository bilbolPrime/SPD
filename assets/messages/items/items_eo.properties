items.weapon.missiles.darts.healingdart.name=resaniga sageto
items.weapon.missiles.darts.holydart.desc=Ĉi tiuj sagetoj estas kovritaj per komponaĵo bazita sur stelfloro, kiu enigas sanktan energion en sian celon. Aliancanoj kaj ordinaraj malamikoj estos benitaj, sed malmortaj aŭ demonaj malamikoj ricevos grandan damaĝon. La sageto mem ankoraŭ estas damaĝa al malamikoj, sed ne damaĝos aliancanojn.
