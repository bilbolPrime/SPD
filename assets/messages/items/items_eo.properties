items.food.blandfruit.desc_cooked=La frukto ŝveliĝis post sia trempado en la poto kaj eĉ sorbis la ecojn de la semo, kun kiu ĝi estis kuirita. Ĝi havos la efikon de kia ajn pocio, al kiu la semo respondis.
items.food.blandfruit.desc_eat=Ĝi aspektas preta por esti manĝata!
