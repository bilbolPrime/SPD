items.artifacts.alchemiststoolkit.ac_brew=BIERFERO
items.artifacts.alchemiststoolkit.ac_energize=ENERGIGI
items.artifacts.alchemiststoolkit.cursed=Via malbenita ilaro malhelpas vin uzi alĥemion!
items.artifacts.alchemiststoolkit.desc=Ĉi tiu ilaro enhavas kelkajn reakciilojn kaj herbojn kune kun malgranda miksa fiolo, ebligante alĥemion survoje. La fiolo enhavas ion, kio aspektas kiel alkemiaj energiaj kristaloj en likva formo.
items.artifacts.alchemiststoolkit.desc_cursed=La malbenita ilaro ligis sin al via flanko, kaj rifuzas lasi vin uzi alĥemion.
items.artifacts.alchemiststoolkit.desc_hint=La ekipita ilaro malrapide generas alkemian energion dum vi akiras sperton. Ŝajnas, ke la miksaĵo en la fiolo povus esti plibonigita per aldono de energiaj kristaloj al ĝi.
items.artifacts.alchemiststoolkit.desc_warming=La ilaro nuntempe varmiĝas, kaj estos preta por uzo post iom da tempo.
items.artifacts.alchemiststoolkit.energize_1=6 energio: +1 nivelo
items.artifacts.alchemiststoolkit.energize_all=Energio de %1$d: +%2$d niveloj
items.artifacts.alchemiststoolkit.energize_desc=Ĉiuj 6 energiaj kristaloj donos al la ilaro sufiĉe da energio por atingi nivelon, kio pliigas la rapidecon, per kiu la ilaro generas energion laŭlonge de la tempo, kaj kiom rapide ĝi varmiĝas. \n\nKiom da energio vi ŝatus uzi?
items.artifacts.alchemiststoolkit.name=ilaro de alkemiisto
items.artifacts.alchemiststoolkit.need_energy=Vi bezonas almenaŭ 6 energion por tio.
items.artifacts.alchemiststoolkit.not_ready=Via ilaro ne finis varmiĝi.
items.artifacts.artifact.cannot_wear_two=Vi ne povas porti du el la samaj artefaktoj.
items.artifacts.artifact.curse_known=Vi povas senti malican magion kaŝiĝantan en la artefakto.
items.artifacts.artifact.equip_cursed=La artefakto dolore ligas sin al vi.
items.artifacts.artifact.need_to_equip=Vi devas ekipi vian artefakton por fari tion.
items.artifacts.artifact.not_cursed=Ĉi tiu artefakto estas libera de malica magio.
items.artifacts.capeofthorns$thorns.desc=Via kabo radias energion, ĉirkaŭante vin per kampo de deviiga forto!\n\nĈiu damaĝo, kiun vi ricevas, estas reduktita dum la dornefiko estas aktiva. Krome, se la atakanto estas apud vi, la reduktita kvanto estas deviigita reen al la atakanto.\n\nRestantaj dornoj: %s.
items.artifacts.capeofthorns$thorns.inert=Via Kabo denove fariĝas inerta.
items.artifacts.capeofthorns$thorns.levelup=Via Kabo plifortiĝas!
items.artifacts.capeofthorns$thorns.name=dornoj
items.artifacts.capeofthorns$thorns.radiating=Via Kabo komencas radii energion, vi sentas vin protektita!
items.artifacts.capeofthorns.desc=Ĉi tiuj kolapsintaj metalaj folioj de la DM-300 kuniĝis en rigidan mantelon. Ŝajnas, ke ĝi stokas profundan energion, eble ĝi posedas iom da la potenco de la DM-300?
items.artifacts.capeofthorns.desc_active=La kabo ŝajnas liberigi stokitan energion, ĝi radias protektan potencon.
items.artifacts.capeofthorns.desc_inactive=La kabo sentas trankvilige peza sur viaj ŝultroj, ŝajnas ke ĝi akiras energion de la damaĝo, kiun vi ricevas.
items.artifacts.capeofthorns.name=kabo de dornoj
items.artifacts.chaliceofblood.ac_prick=PIKO
items.artifacts.chaliceofblood.desc=Ĉi tiu brilanta arĝenta kaliko estas strange ornamita per akraj gemoj ĉe la rando.
items.artifacts.chaliceofblood.desc_1=Dum vi tenas la kalikon, vi sentas vin strange devigita piki vin per la akraj gemoj.
items.artifacts.chaliceofblood.desc_2=Iom da via sango kolektiĝas en la kalikon, vi povas subtile senti la kalikon nutri vivenergion en vin, pliigante vian naturan sanregeneradon. Vi ankoraŭ volas tranĉi vin sur la kaliko, kvankam vi scias, ke ĝi doloros.
items.artifacts.chaliceofblood.desc_3=La kaliko estas plenigita ĝis la rando per via vivoesenco. Vi povas senti la kalikon verŝi vivoenergion reen en vin.
items.artifacts.chaliceofblood.desc_cursed=La malbenita kaliko ligis sin al via mano, kaj malhelpas vian kapablon regeneri sanon.
items.artifacts.chaliceofblood.name=kaliko de sango
items.artifacts.chaliceofblood.no=Ne, mi ŝanĝis mian opinion
items.artifacts.chaliceofblood.ondeath=La Kaliko sekigas vian vivesencon...
items.artifacts.chaliceofblood.onprick=Vi pikas vin mem, kaj via vivesenco dreniĝas en la kalikon.
items.artifacts.chaliceofblood.prick_warn=Ĉiufoje kiam vi uzas la kalikon, ĝi drenos pli da via vivoforto, sed plue plibonigos vian naturan sanregeneradon reciproke.\n\nNuntempe piki vin mem kaŭzos _%1$d-%2$d damaĝon_, kvankam ĉi tiu damaĝo povas esti reduktita per _kaj fizika kaj magia blokado aŭ damaĝredukto._ Sen konsideri la efikojn de damaĝredukto, piki vin mem nuntempe havas _%3$s%% ŝancon_ tute dreni vian vivoforton.\n\nĈu vi certas, ke vi volas oferti al la kaliko pli da vivoforto?
items.artifacts.chaliceofblood.yes=Jes, mi scias, kion mi faras
items.artifacts.cloakofshadows$cloakstealth.desc=Via mantelo de ombroj donas al vi nevideblecon dum vi estas vualita de ĝi. Vi restos mantelita ĝis ĝi nuliĝos aŭ via mantelo elĉerpiĝos.\n\nDum vi estas nevidebla, malamikoj ne povas ataki aŭ sekvi vin. Fizikaj atakoj kaj magiaj efikoj (kiel volvlibroj kaj sorĉbastonoj) tuj nuligos nevideblecon.\n\nTurnas ĝis ŝarga uzo: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Via mantelo fariĝas pli forta!
items.artifacts.cloakofshadows$cloakstealth.name=kovrita
items.artifacts.cloakofshadows$cloakstealth.no_charge=Via mantelo elĉerpis sian energion.
items.artifacts.cloakofshadows.ac_stealth=KAŜTELO
items.artifacts.cloakofshadows.cooldown=Via mantelo bezonas pliajn raŭndojn de %d por revigliĝi.
items.artifacts.cloakofshadows.cursed=Vi ne povas uzi malbenitan mantelon.
items.artifacts.cloakofshadows.desc=Nepagebla magia mantelo, ŝtelita el la reĝa armilejo antaŭ multaj jaroj fare de la Fripono. Kiam portata, ĝi povas esti uzata por fariĝi tute nevidebla por mallonga tempo. \n\nJu pli la mantelo estas uzata, des pli forta ĝi fariĝos, permesante al la Fripono fariĝi nevidebla pli ofte kaj por pli longaj daŭroj.
items.artifacts.cloakofshadows.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.artifacts.cloakofshadows.name=mantelo de ombroj
items.artifacts.cloakofshadows.no_charge=Via mantelo ankoraŭ ne reŝargiĝis sufiĉe por esti uzebla.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Kiel vi tion travivis?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Mi deziras, ke mi havu unu el tiuj...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ho ve! Vi ankoraŭ vivas!
items.artifacts.driedrose$ghosthero.def_verb=evitita
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Mi bedaŭras... bonŝancon...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finu ĝin... sen mi...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Ne... mi ne povas...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Bonŝancon...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Laca... nuntempe...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Mi revenos...
items.artifacts.driedrose$ghosthero.desc=Malforta etera figuro kun humanoida formo. Ilia potenco ŝajnas ligita al la rozo, kiun vi havas. \n\nĈi tiu fantomo eble ne estas multe, ili ŝajnas esti via sola vera amiko ĉi tie.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Kial tio okazas, mi pensis, ke ni sukcesis?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Kiel tiu aĵo ankoraŭ kapablas influi ĉi tiun mondon?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Mi esperas, ke vi scias, kion vi faras per tiu amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Mi supozas, ke ni ankoraŭ ne finis.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Ni jam atingis tiun punkton, ni povas fini ĉi tion!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nur iom pli foren, ni povas foriri de ĉi tie!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Neniu homo aŭ nano estis ĉi tie dum tre longa tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Kio kaŭzus, ke la gnomoj abandonu orminejon?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Estas domaĝe, ke la tuta oro ĉi tie estas ŝajne senutila.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=La estaĵoj ĉi tie estas torditaj, same kiel en la kloakoj.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Eĉ la vespertoj estas sangavidaj ĉi tie.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Neniu signo de iu ajn minekipaĵo, ĉu la gnomoj reprenis ĉion?
items.artifacts.driedrose$ghosthero.dialogue_city_1=La gnomoj estis laboremaj, sed avidaj.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Do la nana metropolo vere falis.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Mi esperas, ke la surfaco neniam finiĝos kiel ĉi tiu loko.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Nanoj ne supozeble aspektu tiel palaj.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Mi ne scias kio estas pli malbona, la gnomoj, aŭ iliaj kreaĵoj.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Ŝajnas, ke la gnomoj ankaŭ nun estas sencerbaj monstroj.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Kio estas ĉi tiu loko?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Ĉi tiu loko estas timiga...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Pri kio pensis la gnomoj, ludante kun potenco tiel?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=La monstroj ĉi tie estas alimondaj, de kie ili venis?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Ĉu vi sentas ĝin? Estas kvazaŭ io rigardas nin.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Danke al Dio, estas torĉoj, estas tiel mallume ĉi tie!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Mi aŭdis rakontojn pri ĉi tiu loko, nenio bona.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Ĉi tiu loko ĉiam estis pli kelkarcero ol malliberejo.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Mi ne povas imagi, kio okazis, kiam ĉi tiu loko estis forlasita.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Ŝajnas, ke kaj la kaptitoj kaj gardistoj fariĝis monstroj.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Kio povus esti respondeca pri ĉiuj ĉi tiuj skeletoj?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ĉi tiuj homoj ne devis fini tiel...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Ĉi tiuj kloakoj iam estis sekuraj, homoj eĉ loĝis ĉi tie vintre.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Mi scivolas, kio okazis al la gardpatroloj, ĉu ili rezignis?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Mi havis familion sur la surfaco, mi esperas, ke ili estas sekuraj.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=La gardistoj ne povis venki ĉi tiujn monstrojn, sed eble ni povas.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se eĉ la kloakoj estas tiel danĝeraj, mi scivolas kio estas sube...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Kio povus esti kaŭzinta, ke ĉi tiuj ratoj kaj kraboj kresku tiel grandaj?
items.artifacts.driedrose$ghosthero.direct_prompt=Kion mi faru?
items.artifacts.driedrose$ghosthero.directed_attack_1=Bone, mi atakos tiun.
items.artifacts.driedrose$ghosthero.directed_attack_2=Mi prenos tiun.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engaĝiga...
items.artifacts.driedrose$ghosthero.directed_attack_4=Ni kaptu ilin!
items.artifacts.driedrose$ghosthero.directed_attack_5=Mi havas tiun.
items.artifacts.driedrose$ghosthero.directed_follow_1=Bone, mi sekvos vin.
items.artifacts.driedrose$ghosthero.directed_follow_2=Mi sekvos vin.
items.artifacts.driedrose$ghosthero.directed_follow_3=Sekvante vin...
items.artifacts.driedrose$ghosthero.directed_follow_4=Bone, ni iru!
items.artifacts.driedrose$ghosthero.directed_follow_5=Mi subtenas vin.
items.artifacts.driedrose$ghosthero.directed_position_1=Bone, mi tenos tiun pozicion.
items.artifacts.driedrose$ghosthero.directed_position_2=Mi iros tien kaj defendos.
items.artifacts.driedrose$ghosthero.directed_position_3=Repoziciigado...
items.artifacts.driedrose$ghosthero.directed_position_4=Survoje!
items.artifacts.driedrose$ghosthero.directed_position_5=Mi iros tien.
items.artifacts.driedrose$ghosthero.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa artefakto.
items.artifacts.driedrose$ghosthero.hello=Saluton denove %s.
items.artifacts.driedrose$ghosthero.introduce=Mia spirito estas ligita al ĉi tiu rozo, ĝi estis tre altvalora por mi, donaco de mia amo, kiun mi lasis sur la surfaco. \n\nMi ne povas reveni al li, sed dank' al vi mi havas duan ŝancon kompletigi mian vojaĝon. Kiam mi povos, mi respondos al via voko kaj batalos kun vi. \n\nDum vi havas la rozon, mi povas aŭdi vian voĉon, do vi povas uzi ĝin por direkti min de malproksime. \n\nEspereble vi sukcesos kie mi malsukcesis...
items.artifacts.driedrose$ghosthero.name=malĝoja fantomo
items.artifacts.driedrose$ghosthero.player_killed_1=Ne!...
items.artifacts.driedrose$ghosthero.player_killed_2=Mi ne povis helpi ilin...
items.artifacts.driedrose$ghosthero.player_killed_3=Ne tiel...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Nur nanoj konstruus minmaŝinon, kiu mortigas entrudiĝintojn.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Tiu afero estas grandega...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Kiel ĉi tiu afero restis aktiva tiel longe?
items.artifacts.driedrose$ghosthero.seen_goo_1=Atentu Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Multaj el miaj amikoj mortis pro ĉi tiu afero, tempo por venĝo!
items.artifacts.driedrose$ghosthero.seen_goo_3=Tia abomenindaĵo ne povas esti permesita vivi!
items.artifacts.driedrose$ghosthero.seen_king_1=Kiam homoj diras, ke potenco koruptas, tion ili celas.
items.artifacts.driedrose$ghosthero.seen_king_2=Li estas pli likho ol reĝo nun.
items.artifacts.driedrose$ghosthero.seen_king_3=Eĉ en morto la gnomoj obeas sian mastron.
items.artifacts.driedrose$ghosthero.seen_tengu_1=La sola restanta kaptito estas mortiga insidmurdisto. Kompreneble...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Li kaptis nin!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Mi aŭdis hororrakontojn pri tiu masko...
items.artifacts.driedrose$ghosthero.seen_yog_1=Ho, ĉi tio ne aspektas bone.
items.artifacts.driedrose$ghosthero.seen_yog_2=Do tiel aspektas dio?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ĉi tio doloros...
