items.armor.platearmor.desc=Grandegaj metalaj platoj estas kunigitaj en veston, kiu provizas neegalatan protekton al ĉiu aventuristo sufiĉe forta por porti ĝian ŝanceligan pezon.
items.armor.platearmor.name=platkiraso
