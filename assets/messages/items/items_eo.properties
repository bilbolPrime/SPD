items.weapon.melee.shortsword.ability_desc=La Duelanto povas _fendi_ malamikon per mallonga glavo. Tio kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
