items.artifacts.driedrose$wndghosthero.desc=La fantomo estas malforta memstare, sed ĝia formo estas sufiĉe solida por esti ekipita per armilo kaj kiraso. Ĝi povos uzi ĉi tiujn objektojn same kiel vi. \n\nLa fantomo nuntempe povas ekipi objektojn postulantajn ĝis _%d forton._
