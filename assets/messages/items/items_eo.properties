items.scrolls.scroll.berkanan=volvlibro de BERKANAN
items.scrolls.scroll.blinded=Vi ne povas legi volvlibron blindiĝante.
items.scrolls.scroll.cursed=Via malbenita sorĉlibro malhelpas vin alvoki la magion de ĉi tiu volvaĵo! Volvaĵo de forigo de malbeno eble estas sufiĉe forta por ankoraŭ funkcii...
