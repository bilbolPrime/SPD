items.weapon.spiritbow.desc=Arko farita el antikva magia ligno. La ŝnuro kaj gravuraĵoj de la arko brilas per palblua lumo. Kiam la ŝnuro estas streĉita, ĉi tiu arko elvokos magian sagon, kiu povas esti pafita al malamiko.
