items.heap.chest=Brusto
items.heap.chest_desc=Vi ne scios, kio estas interne, ĝis vi malfermos ĝin!
items.heap.crystal_chest=Kristala kesto
items.heap.crystal_chest_desc=Vi povas vidi _%s_ interne, sed por malfermi la keston vi bezonas kristalan ŝlosilon.
