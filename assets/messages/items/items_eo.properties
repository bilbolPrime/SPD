items.scrolls.exotic.exoticscroll.unknown_desc=Brilanta nedeĉifrebla magia runo estas skribita sur ĉi tiu nigra pergameno. Ĝi ŝajnas esti fremda al ĉi tiu lando, kiu scias, kion ĝi faros kiam legita laŭte?
items.scrolls.exotic.exoticscroll.yngvi=ekzotika volvlibro de YNGVI
items.scrolls.exotic.scrollofantimagic.desc=La ekzorco sur ĉi tiu volvlibro ĉirkaŭos vin per magia aŭro, kiu provizore blokas ĉiujn magiajn efikojn, malutilajn aŭ helpajn. Tio inkluzivas plej multajn magiajn objekto-efikojn kiel sorĉbastonojn, volvlibrojn, ringojn, artefaktojn, sorĉojn kaj malbenojn. Heroaj kiraskapabloj estas sufiĉe fortaj por funkcii ĉiuokaze.
items.scrolls.exotic.scrollofantimagic.name=volvlibro de kontraŭmagio
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Magia areno aperis ĉirkaŭ vi, indikita per ondiĝanta ruĝa nebulo.\n\nStarante en la nebulo, via malsato ne pliiĝos kaj vi ricevos 33%% malpli da damaĝo de ĉiuj fontoj. Se vi havas iujn aliajn fontojn de damaĝoredukto (kiel ekzemple kiraso), ili aplikiĝos post la 33%% redukto.\n\nRestantaj turnoj: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=defia areno
items.scrolls.exotic.scrollofchallenge.desc=Kiam laŭtlegita, ĉi tiu volvlibro ellasos grandan muĝon, kiu altiras malamikojn al la uzanto kaj samtempe kreas malgrandan arenon ĉirkaŭ ili.\n\nDum la leganto restas en ĉi tiu areno, ili ricevos 33% malpli da damaĝo de ĉiuj fontoj (ĉi tio estas aplikata antaŭ aliaj formoj de damaĝoredukto), kaj ili ne perdos satecon.\n\nLa grandeco de la areno skalaros laŭ la grandeco de la areo, en kiu la leganto estas. Ĝi estos precipe malgranda en iuj estraj areoj.
items.scrolls.exotic.scrollofchallenge.name=volvlibro de defio
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Via skribrulaĵo de aŭgurado identigis la jenajn erojn:
items.scrolls.exotic.scrollofdivination.desc=Ĉi tiu volvlibro hazarde identigos kvar specojn de objektoj, kiujn vi nuntempe ne konas. La identigitaj specoj povas esti la koloro de pocio, la runo de volvlibro, aŭ la gemo de ringo. La identigitaj objektoj ne nepre estos tiuj, kiujn vi portas.
items.scrolls.exotic.scrollofdivination.name=volvaĵo de aŭgurado
items.scrolls.exotic.scrollofdivination.nothing_left=Nenio plu estas por identigi!
items.scrolls.exotic.scrollofdread.desc=Kiam legita, ĉi tiu volvlibro elsendos fulmon de ruĝa lumo, kiu enstampos nekredeblan teruron en ĉiujn malamikojn en via vidkampo. Tiel granda estas ĉi tiu efiko, ke ili rapide provos fuĝi el la tuta kelkarcero, por neniam plu esti viditaj! \n\nSame kiel ĉe teruro, ĉi tiu efiko povas eksvalidiĝi kun la tempo, aŭ se la malamiko estas atakita. \n\nFortvolaj malamikoj, kiel ekzemple estroj, estos kaŭzitaj de regula teruro anstataŭe.
items.scrolls.exotic.scrollofdread.name=volvlibro de timo
items.scrolls.exotic.scrollofenchantment.armor=Elektu glifon por apliki al via kiraso.
items.scrolls.exotic.scrollofenchantment.cancel=nuligi
items.scrolls.exotic.scrollofenchantment.cancel_warn=Nuligo ankoraŭ konsumos vian sorĉvolvaĵon, ĉu vi certas?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ne, mi ŝanĝis mian opinion
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Jes, mi certas
items.scrolls.exotic.scrollofenchantment.desc=Ĉi tiu volvlibro plenigos armilon aŭ kirason per potenca magia energio. La leganto eĉ havas iom da kontrolo pri kiu magio estas trapenetrita.
items.scrolls.exotic.scrollofenchantment.inv_title=Sorĉi objekton
items.scrolls.exotic.scrollofenchantment.name=volvlibro de sorĉo
items.scrolls.exotic.scrollofenchantment.weapon=Elektu sorĉon por apliki al via armilo.
items.scrolls.exotic.scrollofforesight.desc=Post legado de ĉi tiu volvlibro, la detaloj de la proksima tereno estos konstante montrataj al la menso de la leganto en kristala klareco. Ĉi tiu efiko daŭras konsiderindan tempon, kaj rivelos ĉiujn kaŝitajn pordojn aŭ kaptilojn, farante serĉadon nenecesa.
items.scrolls.exotic.scrollofforesight.name=volvlibro de antaŭscio
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Nuligo ankoraŭ konsumos vian volvlibron de metamorfozo, ĉu vi certas?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Elektu talenton por metamorfozi.
items.scrolls.exotic.scrollofmetamorphosis.desc=Ĉi tiu volvlibro enhavas potencan transmutacian magion, kiu aplikiĝos al la sorĉisto anstataŭ al objekto. La magio de ĉi tiu volvlibro ebligos al vi elekti unu talenton kaj anstataŭigi ĝin per unu el kvin talentoj de la sama nivelo el malsamaj herooklasoj!\n\nĈi tiu efiko povas aplikiĝi nur al klastalentoj, ne al talentoj akiritaj de subklasoj aŭ kiraskapabloj. Talentoj, kiujn vi ne povas uzi, ne estos donitaj kiel opcioj.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfoza talento
items.scrolls.exotic.scrollofmetamorphosis.name=volvaĵo de metamorfozo
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Elektu novan talenton por anstataŭigi vian metamorfozitan talenton.
items.scrolls.exotic.scrollofmysticalenergy.desc=La kruda magia povo ligita en ĉi tiu pergameno, kiam liberigita, ŝargos la ekipitajn artefaktojn de uzanto laŭlonge de la tempo.
items.scrolls.exotic.scrollofmysticalenergy.name=volvlibro de mistera energio
items.scrolls.exotic.scrollofpassage.desc=La sorĉo sur ĉi tiu pergameno tuj transportas la leganton al la plej proksima regiono en la unua etaĝo super ili. Tre oportuna por rapide atingi butikon.
items.scrolls.exotic.scrollofpassage.name=volvaĵo de trairejo
items.scrolls.exotic.scrollofprismaticimage.desc=La ekzorco sur ĉi tiu volvlibro kreos buntan iluzian ĝemelon de la leganto. Ĉi tiu prisma bildo agas kiel pli malforta klono de la leganto, kun simila defendo sed pli malalta vivpovo kaj damaĝo. \n\nLa prisma bildo montros sin kiam malamikoj ĉeestas, kaj provos defendi la leganton. \n\nSe prisma bildo jam ekzistas, uzado de ĉi tiu volvlibro plene resanigos ĝin.
items.scrolls.exotic.scrollofprismaticimage.name=volvaĵo de prisma bildo
items.scrolls.exotic.scrollofpsionicblast.desc=Ĉi tiu volvlibro enhavas nekredeblan detruan energion, kiu povas esti kanaligita por detrui la mensojn de ĉiuj videblaj estaĵoj. \n\nTamen ekzistas signifa reago, kaj la leganto ankaŭ estos difektita, blindigita kaj malfortigita. Ju pli da celoj la volvlibro trafos, des malpli da memdifekto estos ricevita.
items.scrolls.exotic.scrollofpsionicblast.name=volvlibro de psiona eksplodo
items.scrolls.exotic.scrollofpsionicblast.ondeath=La Psionika Eksplodo disŝiras vian menson...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Ĉi tiu kreitaĵo estis sorĉita de la magio de volvlibro de sirenkanto. \n\nRavita rolulo estas konstante via aliancano, kaj batalos kontraŭ ĉiuj malamikoj, kiujn ili renkontos.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=ravita
items.scrolls.exotic.scrollofsirenssong.cancel=Vi devas elekti celon.
items.scrolls.exotic.scrollofsirenssong.desc=Legante ĉi tiun volvlibron, oni eligas allogan melodion, kiu ravos celitan malamikon, porĉiame ŝanĝante lin/ŝin en aliancanon! Aliaj malamikoj, kiuj aŭdos ĝin, estos provizore ĉarmitaj. \n\nPrecipe fortaj malamikoj povas rezisti la ravan efikon, kaj estos ĉarmitaj anstataŭe.
items.scrolls.exotic.scrollofsirenssong.name=volvaĵo de la kanto de sireno
items.scrolls.exotic.scrollofsirenssong.no_target=La volvlibro aktiviĝas sen celo.
items.scrolls.exotic.scrollofsirenssong.prompt=Elektu celon
items.scrolls.inventoryscroll.no=Ne, mi ŝanĝis mian opinion
items.scrolls.inventoryscroll.warning=Ĉu vi vere volas nuligi ĉi tiun uzadon de la volvlibro? La volvlibro ne estis antaŭe identigita, do ĝi estos konsumita ĉiuokaze.
items.scrolls.inventoryscroll.yes=Jes, mi estas pozitiva
