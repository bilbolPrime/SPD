items.artifacts.hornofplenty.feed=La korno formanĝas viajn manĝoferojn.
items.artifacts.hornofplenty.full=Via korno estas plena de manĝaĵo!
items.artifacts.hornofplenty.levelup=La korno formanĝas viajn manĝaĵojn kaj kreskas en forto!
items.artifacts.hornofplenty.maxlevel=Via korno formanĝis ĉian manĝaĵon, kiun ĝi povis!
