items.artifacts.etherealchains.cursed=Vi ne povas uzi malbenitajn ĉenojn.
items.artifacts.etherealchains.desc=Ĉi tiuj grandaj sed malpezaj ĉenoj brilas per spirita energio. Ili povas esti uzataj por tiri vin al tereno, aŭ tiri malamikojn al vi. La etera naturo de la ĉenoj eĉ permesas al ili etendiĝi tra muroj!
items.artifacts.etherealchains.desc_cursed=La malbenitaj ĉenoj estas ŝlositaj ĉe via flanko, konstante svingiĝante ĉirkaŭe, provante stumbli aŭ ligi vin.
items.artifacts.etherealchains.desc_equipped=La ĉenoj ripozas ĉirkaŭ via flanko, malrapide forprenante la spiritan energion de tiuj, kiujn vi venkas. Ĉiu ŝargo estas ligo en la ĉeno, kiu etendiĝos ekzakte unu kahelon.
items.artifacts.etherealchains.does_nothing=Tio nenion faros.
items.artifacts.etherealchains.inside_wall=Viaj ĉenoj povas tiri vin nur tra murojn, ne en ilin.
