items.weapon.melee.sword$cleavetracker.desc=La Duelantino pretas daŭrigi sian antaŭan fendadon. La sekva uzo de fendado ne kostos ian ajn armilan kapablon. \n\nRestantaj turnoj: %s.
items.weapon.melee.sword$cleavetracker.name=fendi
items.weapon.melee.sword.ability_desc=La Duelanto povas _tratranĉi_ malamikon per glavo. Tio kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se tratranĉi mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi tratranĉi denove ene de 5 vicoj senpage.
