items.rings.ringofmight.combined_stats=Viaj ekipitaj ringoj kombinas sian potencon, pliigante vian forton je _%1$d_ kaj maksimuman vivpoenton je _%2$s%%_ entute.
items.rings.ringofmight.desc=Ĉi tiu ringo plibonigas la fizikajn trajtojn de la portanto, donante al ili pli grandan fizikan forton kaj konstitucion. Malbenita ringo malfortigos la portanton.
