items.rings.ringofforce$brawlersstance.desc=Dum en ĉi tiu sinteno, la regulaj atakoj de la Duelanto uzos ekipitan ringon de forto eĉ kiam ŝi havas ekipitan armilon. Ĉi tiuj atakoj gajnas bonusan damaĝon kaj ankoraŭ uzos la plifortigon kaj sorĉon de la armilo.\n\nKonservi ĉi tiun sintenon tamen postulas fokuson, reduktante la reŝargan rapidon de la armilkapablo je 50%.\n\nĈi tiu sinteno povas esti ŝaltita aŭ malŝaltita per uzado de ringo de forto, sed la redukto de ŝarga rapido daŭros iom da tempo se la sinteno estas rapide aktivigita kaj malaktivigita.
items.rings.ringofforce$brawlersstance.name=sinteno de batalanto
items.rings.ringofforce.ability_desc=La Duelanto povas adopti _batalantan sintenon_ kun ĉi tiu ringo, kaŭzante ke ŝiaj regulaj atakoj ĉiam uzu ĉi tiun ringon eĉ kun armilo ekipita. Ĉi tiuj atakoj kaŭzos _%1$d-%2$d damaĝon_ kaj ankaŭ heredos la sorĉon kaj plifortigon de la armilo. Ĉi tiu sinteno malrapidigas la reŝargan rapidon de la armilo je 50%%.
items.rings.ringofforce.ability_name=sinteno de batalanto
items.rings.ringofforce.combined_stats=Viaj ekipitaj ringoj kombinas sian potencon, kaŭzante entute _%1$d-%2$d damaĝon_ sen armilo, aŭ pliigante damaĝon je _%3$d_ per unu.
items.rings.ringofforce.desc=Ĉi tiu ringo plifortigas la forton de la manbatalaj batoj de la portanto. Ĉi tiu ekstra povo estas sufiĉe malforta dum uzado de armiloj, sed senarma atako fariĝos multe pli forta. Malbenita ringo anstataŭe malfortigos la batojn de la portanto.
items.rings.ringofforce.name=ringo de forto
items.rings.ringofforce.stats=Kiam senarma, je via nuna forto, ĉi tiu ringo kaŭzos _%1$d-%2$d damaĝon._ Kun armilo ekipita, ĉi tiu ringo pliigos damaĝon je _%3$d._
items.rings.ringofforce.typical_ability_desc=La Duelanto povas adopti _batalantan sintenon_ kun ĉi tiu ringo, kaŭzante ke ŝiaj regulaj atakoj ĉiam uzas ĉi tiun ringon eĉ kun armilo ekipita. Ĉi tiuj atakoj tipe kaŭzos _%1$d-%2$d damaĝon_ kaj ankaŭ heredos la sorĉon kaj plifortigon de la armilo. Ĉi tiu sinteno malrapidigas la reŝargan rapidon de la armilo je 50%%.
items.rings.ringofforce.typical_stats=Kiam senarma, kun via nuna forto, tipe ĉi tiu ringo kaŭzos _%1$d-%2$d damaĝon._ Kun armilo ekipita, tipe ĉi tiu ringo pliigos damaĝon je _%3$d._
