items.journal.alchemypage.desc=Ŝirita paĝo el gvidlibro pri alĥemio. \n\nPlejparto de la teksto estas tro malgranda por legi de malproksime, sed oni povas distingi la titolon de la paĝo: \n\n_"%s"_
items.journal.alchemypage.name=ŝirita paĝo de libro pri alĥemio
items.journal.documentpage.desc=Sola paĝo, verŝajne ŝirita el iu libro. Vi devos preni ĝin por legi ĝin.
items.journal.documentpage.name=ŝirita paĝo
items.journal.guidebook.desc=Gvidlibro por aventuristoj, lasita ĉi tie de iu, kiu decidis, ke aventurado ne taŭgas por ili! Ĉi tiu aparta libro estas magia, kaj povas instigi aventuristojn legi paĝon en la ĝusta momento. \n\nMalgraŭ tiu funkcieco, la libro estas plej populara pro la grandaj vortoj "Ne paniku!" skribitaj per grandaj amikaj literoj sur la kovrilo.
items.journal.guidebook.hint_desktop=Via gvidlibro havas konsilojn por vi! Elektu la fulmantan butonon por la taglibro (%s) supre dekstre por legi ĝin.
items.journal.guidebook.hint_mobile=Via gvidlibro havas konsilojn por vi! Frapu la fulmantan butonon de la taglibro supre dekstre por legi ĝin.
items.journal.guidebook.hint_status=Gvidlibro
items.journal.guidebook.name=volumo de kelkarcera majstrado
items.journal.guidepage.desc=Ŝirita paĝo el aventura gvidlibro. ZXQPH1 ZXQZXQPH2 ZXQ Plejparto de la teksto estas tro malgranda por legi de malproksime, sed vi povas distingi la titolon de la paĝo: ZXQPH3 ZXQZXQPH4 ZXQ_"%s"_
items.journal.guidepage.name=ŝirita gvidlibro-paĝo
items.journal.regionlorepage$caves.desc=Ŝajnas esti enskribo en esplorlibro, surprize bone konservita malgraŭ ĝia aĝo. Prenu ĝin por legi ĝin.
items.journal.regionlorepage$caves.name=malnova protokola eniro
items.journal.regionlorepage$city.desc=Malgranda rusta metala tabuleto kun mesaĝo magie gravurita en ĝi. La literoj estas ankoraŭ klaraj malgraŭ la aĝo de la tabuleto, sed vi devos preni ĝin por legi ĝin.
items.journal.regionlorepage$city.name=rusta tabulkomputilo
items.journal.regionlorepage$halls.desc=Malgranda nigra tabuleto kun brilantaj verdaj literoj gravuritaj sur ĝi. La brilantaj literoj malklariĝas kune en nebulon de malproksime, vi devos preni ĝin por legi ĝin.
items.journal.regionlorepage$halls.name=brilanta tablojdo
items.journal.regionlorepage$prison.desc=Ĵurnala noto, aŭ ia alia speco de registro, skribita sur malnova paperfolio. Ŝajnas, ke ĝi restis pli bone ol la leteroj, kiujn vi trovis en la kloakoj, sed vi tamen devos preni ĝin por legi ĝin.
items.journal.regionlorepage$prison.name=eluzita ĵurnala eniro
items.journal.regionlorepage$sewers.desc=Ŝajnas, ke estas letero, skribita sur malpuraĵmakulita paperfolio. Vi devos levi ĝin por povi distingi, kio estas skribita sur ĝi.
items.journal.regionlorepage$sewers.name=eluzita letero
items.keys.crystalkey.desc=La tranĉitaj surfacoj de ĉi tiu kristala ŝlosilo briletas en la mallumo. Eble ĝi malfermos ion faritan el kristalo?
items.keys.crystalkey.name=Kristala ŝlosilo
items.keys.goldenkey.desc=La noĉoj sur ĉi tiu ora ŝlosilo estas etaj kaj komplikaj. Eble ĝi malfermos ŝlositan keston?
items.keys.goldenkey.name=ora ŝlosilo
items.keys.ironkey.desc=La noĉoj sur ĉi tiu antikva fera ŝlosilo estas bone uzitaj; ĝia leda ŝnuro estas difektita de la aĝo. Kiun pordon ĝi eble malfermos?
items.keys.ironkey.name=fera ŝlosilo
items.keys.skeletonkey.name=skeletŝlosilo
items.keys.wornkey.desc=Ĉi tiu ŝlosilo estas uzita kaj senkolora, sed aspektas serioza. Verŝajne ĝi povas malfermi iun gravan pordon proksime.
items.keys.wornkey.name=eluzita ŝlosilo
items.kindofmisc.unequip_message=Vi devas unue senekipigi unu el ĉi tiuj objektoj. Elektu objekton por interŝanĝi kun.
items.kindofmisc.unequip_title=Malekipigu unu objekton
items.kindofweapon.empty=malplena
items.kindofweapon.equip_cursed=Via teno propravole streĉiĝas ĉirkaŭ la armilo.
items.kindofweapon.swift_equip=Vi rapide ekipas vian armilon.
items.kindofweapon.which_equip_msg=Al kiu armilfendo vi ŝatus ekipi ĉi tiun objekton?\n\nLa Ĉampiono atakas rekte per sia ĉefa armilo, sed povas uzi la kapablon de ambaŭ armiloj. Ambaŭ armiloj dividas la saman ŝargnombron.\n\nLa Ĉampiono ankaŭ povas tuj interŝanĝi sian ĉefan kaj duarangan armilon.
items.kindofweapon.which_equip_primary=Primara (%s)
items.kindofweapon.which_equip_secondary=Sekundara (%s)
items.kingscrown.ac_wear=ELUZO
items.kingscrown.desc=La krono de la lasta nana reĝo, ĝi brilas per grandega magia energio. \n\nKiam portata, la magio de la krono fluos en la kirason, kiun vi nuntempe portas, transformante ĝin en _unikan eposan kirason kun specialaj kapabloj_. La nova kiraso konservos ĉiujn ecojn de la originala kiraso.
items.kingscrown.discover_hint=Vi povas akiri ĉi tiun objekton kiel falon de certaj malamikoj.
items.kingscrown.naked=Bedaŭrinde, la krono ne povas transformi viajn subvestojn.
items.kingscrown.name=La krono de la nana reĝo
items.kingscrown.ratgraded=La piedoj de Rat King brilas hele dum via kiraso transformiĝas!
items.kingscrown.upgraded=La krono brilas hele kaj poste diseriĝas dum via kiraso transformiĝas!
items.liquidmetal.ac_apply=APLIKI
items.liquidmetal.already_fixed=Tiu ĵetarmilo jam estas en perfekta stato!
items.liquidmetal.apply=Vi uzas likvan metalon %d por ripari vian ĵetarmilon.
items.liquidmetal.desc=Ĉi tiu magia likvaĵo povas plenigi la fendetojn kaj ŝiraĵojn de ĵetarmilo, restarigante ĝin al perfekta stato! Se al aro da armiloj mankas armilo sed alie ĝi estas plene riparita, tiam likva metalo eĉ povas esti uzata por anstataŭigi mankantan armilon el la aro! \n\nArmilo de nivelo 1 postulas 10 likvajn metalojn por esti plene riparita, armilo de nivelo 5 postulas 30. Ĉiu plibonigo ankaŭ pliigas la kvanton da metalo bezonata je 35%. \n\nLikva metalo ne povas esti uzata por ripari la pintojn de pintaj ĵetsagetoj.
items.liquidmetal.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.liquidmetal.name=likva metalo
items.liquidmetal.prompt=Elektu ĵetarmilon
items.lostbackpack.desc=Jen via perdita inventaro. Kolektu ĝin por repreni ĉiujn aĵojn, kiujn vi perdis!
items.lostbackpack.name=perdita dorsosako
items.merchantsbeacon.ac_use=UZU
items.merchantsbeacon.desc=Ĉi tiu stranga peco de nana teknologio permesas al vi komuniki de grandaj distancoj.\n\nPost aktivigo, ĉi tiu signostango ebligos al vi vendi objektojn al Pixel Mart de ie ajn en la kelkarcero.\n\nTamen, la magio ene de la signostango daŭros nur unu seancon, do uzu ĝin saĝe.
items.merchantsbeacon.name=komercisto-signostango
items.potions.brews.aquabrew.desc=Kiam frakasita, ĉi tiu trinkaĵo ellasos eksplodon de premizita akvo ĉe sia loko. Ĝi estas nur sufiĉe forta por damaĝi fajrajn malamikojn, sed ĝi ankaŭ disvastigas akvon al proksima tereno, malŝaltas kaptilojn, estingas fajrojn, kaj repuŝas rolulojn proksime al la eksplodo.
items.potions.brews.aquabrew.name=akva biero
items.potions.brews.blizzardbrew.desc=Kiam frakasita, ĉi tiu trinkaĵo ellasos kirlantan neĝoŝtormon, kiu rapide disvastiĝas kiel gaso.
items.potions.brews.blizzardbrew.name=neĝoŝtorma biero
items.potions.brews.brew.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.potions.brews.causticbrew.desc=Ĉi tiu trinkaĵo disvastigos korodan ŝlimon en larĝa areo ĉirkaŭ la loko, kie ĝi frakasiĝas. Ĉio, kion la ŝlimo kaptis, malrapide fandiĝos se ĝi ne povas forlavi ĝin per akvo.
items.potions.brews.causticbrew.name=morda biero
items.potions.brews.infernalbrew.desc=Kiam frakasita, ĉi tiu trinkaĵo ellasos furiozan inferon, kiu rapide disvastiĝas kiel gaso.
items.potions.brews.infernalbrew.name=infera biero
items.potions.brews.shockingbrew.desc=Kiam frakasiite, ĉi tiu trinkaĵo ellasos elektran ŝtormon en vasta areo ĉirkaŭ la loko, kie ĝi erupcias.
items.potions.brews.shockingbrew.name=ŝoka trinkaĵo
items.potions.brews.unstablebrew.desc=Ĉi tiu magia trinkaĵo brilas per ŝanĝiĝantaj koloroj de la ĉielarko. \n\nKiam trinkita aŭ ĵetita, ĝi aktivigos la efikon de hazarda pocio. La pocia efiko ĉiam estos utila se ĝi estas trinkita, kaj ĉiam estos malutila se ĝi estas ĵetita.
items.potions.brews.unstablebrew.name=malstabila biero
items.potions.elixirs.elixir.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Vi provizore akiris resanigajn ecojn similajn al tiuj de Goo.\n\nStarante en akvo, vi reakiros malgrandan kvanton da sano po turno. La efiko paŭziĝas kiam vi estas plena de sano aŭ estas el akvo.\n\nRestas resanigo: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=akva resanigo
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ĉi tiu eliksiro enhavas la restaĵojn de Goo plibonigitajn per resaniga pocio. Kvankam ĝi ne tuj resanigos, ĝi konstante restarigos pli grandan kvanton da sano dum vi staras en akvo.
items.potions.elixirs.elixirofaquaticrejuvenation.name=eliksiro de akva rejunigo
items.potions.elixirs.elixirofarcanearmor.desc=Ĉi tiu eliksiro donos al la trinkanto longdaŭran reziston kontraŭ magia damaĝo.
items.potions.elixirs.elixirofarcanearmor.name=eliksiro de arkana kiraso
items.potions.elixirs.elixirofdragonsblood.desc=Kiam konsumita, ĉi tiu eliksiro sendos fajran potencon tra la vejnoj de la trinkanto. Ĉi tiu efiko imunigos la trinkanton kontraŭ fajro, kaj permesos al ili ekbruligi malamikojn per fizikaj atakoj.
items.potions.elixirs.elixirofdragonsblood.name=eliksiro de draka sango
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Vi estas sub la efikoj de plumfala eliksiro, kiu permesas al vi fali en abismojn sen suferi damaĝon!\n\nRestantaj turnoj: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=plumfalo
items.potions.elixirs.elixiroffeatherfall.desc=Ĉi tiu eliksiro ofertas pli malfortan sed pli kontrolitan levitacian efikon, permesante al la trinkanto fali grandajn distancojn sen damaĝo dum mallonga tempo.
items.potions.elixirs.elixiroffeatherfall.light=Vi sentas vin malpeza kiel plumo!
items.potions.elixirs.elixiroffeatherfall.name=eliksiro de plumfalo
items.potions.elixirs.elixirofhoneyedhealing.desc=Ĉi tiu eliksiro kombinas resanigon kun la dolĉeco de mielo. Trinkita, ĝi aplikos la saman efikon kiel resaniga pocio kaj kontentigos iomete da malsato, sed ĝi ankaŭ povas esti ĵetita por resanigi aliancanon.\n\nEstaĵoj kun afineco por mielo povus esti pacigitaj se ĉi tiu objekto estas uzata sur ili.
items.potions.elixirs.elixirofhoneyedhealing.name=eliksiro de miela resanigo
items.potions.elixirs.elixiroficytouch.desc=Kiam konsumita, ĉi tiu eliksiro permesos al la trinkanto elsuĉi la varmon de la malamikoj, kiujn ili atakas. Ĉi tiu efiko imunigos la trinkanton kontraŭ la malvarmo, kaj permesos al ili malvarmigi malamikojn per fizikaj atakoj.
items.potions.elixirs.elixiroficytouch.name=eliksiro de glacia tuŝo
items.potions.elixirs.elixirofmight$htboost.desc=Via korpo sentas sin nenature forta kaj sana.\n\nVia maksimuma sano estas plifortigita dum plilongigita tempodaŭro. Dum vi akiras nivelojn, la plifortigo konstante malfortiĝos.\n\nAktuala plifortiga kvanto: %d.\nRestaj niveloj: %d.
items.potions.elixirs.elixirofmight$htboost.name=maksimuma sanplibonigo
items.potions.elixirs.elixirofmight.desc=Ĉi tiu potenca likvaĵo fluos tra viaj muskoloj, konstante pliigante vian forton je unu poento kaj provizore pliigante maksimuman sanon je %d poentoj. La sanplibonigo kreskas laŭ via maksimuma sano, sed malrapide malpliiĝos dum vi akiras nivelojn.
items.potions.elixirs.elixirofmight.msg=Nove trovita forto trafluas vian korpon, vi nun havas %d forton!
items.potions.elixirs.elixirofmight.name=eliksiro de povo
items.potions.elixirs.elixiroftoxicessence.desc=Kiam konsumita, ĉi tiu eliksiro plenigos la trinkanton per toksa energio. La trinkanto kontinue disvastigos toksan gason dum sia movado, kaj estos imuna kontraŭ toksa gaso kaj veneno dum iom pli longa tempo ol la daŭro de la efiko.
items.potions.elixirs.elixiroftoxicessence.name=eliksiro de toksa esenco
