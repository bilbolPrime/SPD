items.weapon.melee.roundshield.ability_desc=La Duelanto povas _gardi_ sin per ronda ŝildo, tute nuligante ĉiujn fizikajn aŭ magiajn atakojn faritajn kontraŭ ŝi dum _%d vicoj_. Post kiam la Duelanto blokis atakon, reataki aŭ uzi magion finos la gardadon.
items.weapon.melee.roundshield.ability_name=gardisto
