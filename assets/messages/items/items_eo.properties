items.rings.ringofdetection.desc=Portante ĉi tiun ringon, vi povos rimarki kaŝitajn kaptilojn kaj sekretajn pordojn sen halti por serĉi. Malfortigitaj ringoj de detekto obtuzigas viajn sensojn, tiel ke sekretoj pli malfacile troveblas eĉ dum aktiva serĉado.
items.rings.ringofdetection.name=Ringo de Detekto
items.rings.ringofhaggler.desc=Ĉi tiu ringo fakte ne havas magian efikon. Ĝi montras al komercistoj, ke ĝia portanto membras en la Ŝtelista Gildo. Ili kutime volonte donas rabaton kontraŭ provizora garantio, ke oni lasos ilin trankvilaj. Plibonigi la ringon donos neniun plian avantaĝon.
items.rings.ringofhaggler.name=Ringo de Marĉandanto
items.rings.ringofherbalism.desc=Ĉi tiu ringo pliigas vian ŝancon trovi roson kaj semojn en surpaŝita herbo.
items.rings.ringofherbalism.name=ringo de herboscienco
items.rings.ringofmending.desc=Ĉi tiu ringo plifortigas la resaniĝon de la korpo, tiel ke perdita sano revenas pli rapide. Malfortigitaj ringoj malrapidigas aŭ eĉ haltigas naturan resaniĝon.
items.rings.ringofmending.name=ringo de resaniĝo
items.rings.ringofpower.desc=La energia kampo de ĉi tiu ringo plifortigas viajn vergojn. Malfortigitaj ringoj de potenco anstataŭe malfortigas ilin.
items.rings.ringofpower.name=Ringo de Potenco
items.rings.ringofsatiety.desc=Portante ĉi tiun ringon, vi povos elteni pli longe sen manĝo. Malfortigitaj ringoj de sateco havas la kontraŭan efikon.
items.rings.ringofsatiety.name=Ringo de Sateco
items.rings.ringofshadows.desc=Malamikoj malpli probable rimarkos vin se vi portas ĉi tiun ringon. Degraditaj ringoj de ombroj avertos malamikojn, kiuj alie eble ne rimarkus vian ĉeeston.
items.rings.ringofshadows.name=Ringo de Ombroj
items.rings.ringofthorns.desc=La ringo ne havas verajn dornojn, sed malamiko atakanta vin mem ricevos parton de la damaĝo, kiun ĝi kaŭzas. Plibonigi la ringon donos neniun plian avantaĝon.
items.rings.ringofthorns.name=Ringo de Dornoj
items.scrolls.scrollofchallenge.desc=Kiam laŭtlegita, ĉi tiu volvlibro ellasos defian muĝon, kiu vekos ĉiujn monstrojn kaj avertos ilin pri la loko de la leganto.
items.scrolls.scrollofchallenge.name=volvlibro de defio
items.scrolls.scrollofenchantment.desc=Ĉi tiu volvlibro kapablas plenigi armilon aŭ kirason per hazarda sorĉo, donante al ĝi specialan potencon.
items.scrolls.scrollofenchantment.name=volvlibro de sorĉo
items.scrolls.scrollofpsionicblast.desc=Ĉi tiu volvlibro enhavas detruan energion, kiu povas esti psione kanaligita por kaŭzi grandegan damaĝon al ĉiuj estaĵoj ene de vidkampo. Akompananta ekbrilo de lumo provizore blindigos ĉiujn en la areo de efiko, inkluzive de la leganto de la volvlibro.
items.scrolls.scrollofpsionicblast.name=volvlibro de psiona eksplodo
items.scrolls.scrollofwipeout.desc=Legu ĉi tiun volvlibron por ellasi la koleron de la kelkarceraj spiritoj, mortigante ĉion sur la nuna nivelo. Nu, preskaŭ ĉion. Kelkaj el la pli potencaj estaĵoj eble ne estos trafitaj.
items.scrolls.scrollofwipeout.name=skribrulaĵo de ekstermo
items.wands.wandofblink.desc=Ĉi tiu vergo ebligas teletransportiĝi en la elektita direkto. Estaĵoj kaj senvivaj obstakloj haltigos la teletransporton.
