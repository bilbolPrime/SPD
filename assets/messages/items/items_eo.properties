items.artifacts.holytome.cursed=Vi ne povas uzi malbenitan volumon.
items.artifacts.holytome.desc=Sankta volumo, kiu funkcias kiel fokuso por la dia magio de la Kleriko. Uzante la volumon, la Kleriko povas ĵeti diversajn magiajn sorĉojn. \n\nLa volumo konstante plipotencos dum la Kleriko uzas ĝin, donante al la Kleriko pli da maksimumaj ŝargoj kaj iomete pliigante la reŝargan rapidon.
items.artifacts.holytome.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.artifacts.holytome.levelup=Via volumo plifortiĝas!
items.artifacts.holytome.name=sankta volumo
items.artifacts.holytome.no_spell=Vi ne kapablas ĵeti tiun sorĉon nun.
