items.weapon.melee.roundshield$guardtracker.desc=La Duelantino pretigis sian ŝildon anticipe de alvenantaj atakoj. Fizikaj aŭ magiaj atakoj faritaj kontraŭ ŝi estos tute nuligitaj.\n\nRestantaj turnoj: %s.
