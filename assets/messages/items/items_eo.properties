items.artifacts.driedrose.desc=Ĉu ĉi tiu estas la rozo, kiun la fantomo menciis antaŭ ol malaperi? Ĝi ŝajnas enhavi iun spiritan potencon, eble ĝi povus esti uzata por kanaligi la energion de tiu perdita militisto.
