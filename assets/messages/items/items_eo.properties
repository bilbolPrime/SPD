items.rings.ringofarcana.desc=Ĉi tiu ringo plibonigas magiajn sorĉojn sur armiloj kaj ideogramojn sur kirasoj, inkluzive de malbenoj! Ĝi unue pliigas la aktivigan ŝancon, kaj poste pliigas la forton de la efiko kiam la aktiviga ŝanco estas 100%. Malbenita ringo anstataŭe malfortigos sorĉojn, ideogramojn kaj malbenojn.
