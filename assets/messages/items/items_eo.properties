items.food.pasty$fishleftover.desc=Iom da superflua fiŝo de via antaŭa manĝo. Vi povas manĝi ĝin iam ajn kiam vi volas por iom restarigi malsaton.
items.food.pasty$fishleftover.eat_msg=Tiu manĝaĵo gustumis bone.
items.food.pasty$fishleftover.name=fiŝaj restaĵoj
items.food.pasty.amulet_desc=Vi finfine trovis ĝin, la magian amuleton de - atendu momenton, ĉi tio estas nur ĉokolado envolvita en folio farita por aspekti kiel la amuleto! Ĝi ne donos al vi senliman potencon, sed almenaŭ ĝi plenigos vin kaj donos al vi iom da artefakta ŝargo.\n\nAprilaj ŝercoj!
items.food.pasty.amulet_name=amuleto de endoro?
items.food.pasty.cane_desc=Grandega sukereca dolĉa bombonkanbastono. Ĝi estas sufiĉe granda por plenigi vin, kaj la sukero eble ankaŭ donos al viaj sorĉbastonoj iom da ekstra ŝargo. \n\nFeliĉajn Festojn!
items.food.pasty.cane_name=bombonkanbastono
items.food.pasty.desc=Aŭtentika kornvala pasteĉo kun tradicia farĉo el bovaĵo kaj terpomo. Bongusta!
items.food.pasty.egg_desc=Granda ĉokolada ovo, envolvita en bunta flava folio. Estas facile sufiĉe da ĉokolado ĉi tie por satigi vin, kaj la sukero eble donos al viaj artefaktoj iomete da ekstra ŝarĝo. \n\nFeliĉan Paskon!
items.food.pasty.egg_name=paska ovo
items.food.pasty.fish_desc=Tuta vaporita fiŝo, magie konservita sur lito da verdaĵoj. Estas tradicio konservi iom da fiŝo por poste ĉirkaŭ ĉi tiu tempo de la jaro, por ke vi konservu iom da restaĵoj anstataŭ manĝi ĝin tutan samtempe. \n\nFeliĉan Lunan Novjaron!
items.food.pasty.fish_name=vaporita fiŝo
items.food.pasty.name=pasteca
items.food.pasty.pie_desc=Granda tranĉaĵo da kukurba torto. Ĝia dolĉa kaj spica gusto satigos vin kaj donos al vi iomete da resaniĝo. \n\nFeliĉan Halovenon!
items.food.pasty.pie_name=kukurba torto
items.food.pasty.rainbow_desc=Ĉi tiu bunta pocio estas speco de likva manĝaĵo. Krom kontentigi vian malsaton, ĝi havas iom da magio, kiu trankviligos apudan ne-estran malamikon, igante lin/ŝin provizore heziti batali kontraŭ vi.\n\nFeliĉan Fieron!
items.food.pasty.rainbow_name=ĉielarka pocio
items.food.pasty.sparkling_desc=Ĉi tiu ŝaŭmtrinkaĵo estas speco de likva manĝaĵo. Ĝi kontentigas malsaton kaj simulas ŝaŭmvinon, sed ne estas vere alkohola. La varma sento en via ventro donos iom da ŝirmado.\n\nFeliĉan Novjaron!
items.food.pasty.sparkling_name=brileta pocio
items.food.pasty.vanilla_desc=Ĉi tiu granda tranĉaĵo de vanila kuko havas buntajn ŝprucetojn kaj bluan glazuron. La kuko estis farita por festi jarojn da sperto, kaj donos al vi malgrandan kvanton da tiu sperto kiam manĝite. \n\nLa originala Pixel Dungeon unue estis publikigita la 4-an de decembro 2012. Feliĉan naskiĝtagon Pixel Dungeon!
items.food.pasty.vanilla_name=blua kuko
items.food.phantommeat.desc=Granda brilanta travidebla bifsteko, tranĉita el fantoma piranjo. Ĉi tiu magia viando ne bezonas esti kuirita kaj donas kelkajn defendajn avantaĝojn krom plene satigi vin. Kiam manĝita, ĝi donos nevideblecon, ŝelhaŭton, iom da resanigo, kaj kuracas multajn damaĝajn efikojn.
items.food.phantommeat.discover_hint=Vi povas akiri ĉi tiun objekton kiel falon de certaj malamikoj.
items.food.phantommeat.name=fantoma viando
items.food.smallration.desc=Ĝi aspektas precize kiel norma porcio da manĝaĵo sed pli malgranda.
items.food.smallration.discover_hint=Vi povas aĉeti ĉi tiun objekton en vendejo.
items.food.smallration.eat_msg=Tiu manĝaĵo gustumis bone.
items.food.smallration.name=malgranda manĝaĵporcio
items.food.stewedmeat.desc=Stufado de la viando purigis ĝin de ĉia malsano aŭ parazitoj. Ĝi devus esti sekura por manĝi.
items.food.stewedmeat.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.food.stewedmeat.eat_msg=Tiu manĝaĵo gustumis bone.
items.food.stewedmeat.name=stufita viando
items.food.supplyration.desc=Ĉi tiu porcio estis lasita en la kelkarcero de kaj por membroj de la ŝtelista gildo. Ĝi estas specife desegnita por esti manĝata survoje, kaj helpi pri ĝenerala friponado. \n\nKvankam ĝi ne satigas vin tiom kiom regula porcio, ĝi povas esti rapide manĝata, provizas iom da rekta resanigo, kaj redonos ŝargon al la mantelo de ombroj de la Fripono.
items.food.supplyration.discover_hint=Vi povas trovi ĉi tiun objekton uzante specifan heroo-talenton.
items.food.supplyration.name=provizoproporcio
items.gold.desc=Stako da oraj moneroj. Kolektu orajn monerojn por elspezi ilin poste en butiko.
items.gold.name=oro
