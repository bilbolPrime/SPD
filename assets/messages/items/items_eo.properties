items.weapon.melee.katana.name=katano
items.weapon.melee.katana.stats_desc=Ĉi tiu armilo blokas 0-3 damaĝon.
items.weapon.melee.katana.typical_ability_desc=La Duelanto povas _elfali_ per katano al malamiko je 1 kahelo for. Tio moviĝas al la malamiko, tipe kaŭzas _%1$d-%2$d damaĝon_, kaj ĝi garantiite trafos.
items.weapon.melee.longsword.ability_desc=La Duelanto povas _fendi_ malamikon per longa glavo. Tio kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
items.weapon.melee.longsword.ability_name=fendi
items.weapon.melee.longsword.desc=La longa akrega ŝtala klingo de ĉi tiu glavo brilas trankvilige, kvankam ĝia grandeco igas ĝin sufiĉe peza.
items.weapon.melee.longsword.name=longa glavo
