items.amulet.ac_end=FINU LA LUDO
items.amulet.ascent_desc=Vi komencas senti la grandan kaj teruran potencon de Yog-Dzewa radiantan el la amuleto. Supreniri reen tra la kelkarcero kiel mortonto povus esti pli malfacila ol vi pensis! \n\nSe vi daŭre supreniros per la amuleto, la kelkarcero fariĝos pli danĝera, teletransportoj inter etaĝoj estos malebligitaj, kaj vi nur povos venki en la ludo venkante malamikojn dum vi supreniras tra la kelkarcero! \n\nVi povas lasi la amuleton ĉi tie nun se vi volas supreniri sen komenci ĉi tiun defion, aŭ aktivigi la amuleton antaŭ ol supreniri por fini la ludon normale.
items.amulet.ascent_no=Haltu Nun
items.amulet.ascent_title=Ĉieliro
items.amulet.ascent_yes=Daŭrigu!
items.amulet.desc=La Amuleto de Endor estas la plej potenca artefakto konata al homoj aŭ nanoj. Ĝiaj brilantaj kristaloj enhavas nekredeblan kaj mirindan potencon.
items.amulet.desc_ascent=La originoj de la amuleto estas nekonataj, sed klare ĝi estis forte influita de la povo de Yog-Dzewa. La kelkarcero ŝajnas fleksiĝi al la volo de Yog dum vi moviĝas tra ĝi, igante malamikojn multe pli multaj kaj potencaj! Vi ankaŭ ne plu povas aktivigi aŭ forĵeti la amuleton, preskaŭ kvazaŭ ĝi estus malbenita.
items.amulet.desc_origins=La originoj de la amuleto estas nekonataj. Historio diras, ke la Reĝo de la Nanoj fanfaronis, ke li malkovris la artefakton baldaŭ antaŭ ol la Nana civilizo ĉesis kontakti lin. Kiel li trovis ĝin? Kiel Yog-Dzewa prenis ĝin de li? Demandoj por alia fojo eble, ĉio, kio gravas nun, estas, ke la amuleto estas via!
items.amulet.discover_hint=Vi povas trovi ĉi tiun objekton ĉe la fundo de la kelkarcero...
items.amulet.name=amuleto de endoro
items.ankh.ac_bless=beni
items.ankh.bless=Vi benas la anĥon per magia akvo.
items.ankh.desc=La antikva simbolo de senmorteco ebligas reveni al la vivo post morto. Dum reviviĝo ĉiuj nesurmetitaj objektoj perdiĝas.
items.ankh.desc_blessed=Ĉi tiu antikva simbolo de senmorteco donas la kapablon reveni al vivo post la morto. La Anĥo estis benita kaj nun estas multe pli forta. La Anĥo oferos sin por savi vin en momento de mortiga danĝero.
items.ankh.discover_hint=Vi povas aĉeti ĉi tiun objekton en vendejo.
items.ankh.name=anĥo
items.arcaneresin.ac_apply=APLIKI
items.arcaneresin.apply=Vi kovras vian sorĉbastonon per rezino, pliigante ĝian potencon!
items.arcaneresin.desc=Ĉi tiu fajna pulvoro briletas inter nuancoj de viola kaj blanka. Ĝi povas funkcii kiel amplifilo por magiaj energioj, pliigante la nivelon de sorĉbastonoj kiam ĝi estas aplikita al ili!\n\nPlibonigi sorĉbastonon kostas 1, 2 aŭ 3 rezinojn depende de la komenca nivelo de la sorĉbastono. Rezino povas plibonigi sorĉbastonojn ĝis maksimume +3.\n\nRezinaj plibonigoj estas _superregataj de aliaj plibonigaj fontoj_ tamen (kiel ekzemple volvlibroj de plibonigo), kaj ne aplikiĝas kiam oni enigas sorĉbastonon en la bastonon de la Magiisto.
items.arcaneresin.discover_hint=Vi povas krei ĉi tiun objekton per alĥemio.
items.arcaneresin.level_too_high=Tiu sorĉbastono estas tro potenca por ke rezino povu plibonigi ĝin.
items.arcaneresin.name=arkana rezino
items.arcaneresin.not_enough=Vi ne havas sufiĉe da rezino por tio!
items.arcaneresin.prompt=Elektu sorĉbastonon
