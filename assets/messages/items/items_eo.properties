items.weapon.missiles.boomerang.name=bumerango
items.weapon.missiles.darts.adrenalinedart.desc=Ĉi tiuj sagetoj estas kovritaj per kombinaĵo bazita sur rapidkardo, kiu pliigos la movo- kaj atakrapidecon de aliancanoj, aŭ mallonge malaltigos la movo-rapidecon de malamikoj. La sageto mem ankoraŭ estas damaĝa al malamikoj, sed ne damaĝos aliancanojn.
items.weapon.missiles.darts.adrenalinedart.name=adrenalina sageto
items.weapon.missiles.darts.blindingdart.desc=Ĉi tiuj sagetoj estas kovritaj per komponaĵo bazita sur blindherbo, kiu blindigos la celon por mallonga tempo. Tamen ili ne konfuzas, do malamiko ankoraŭ scios, kie ili laste vidis vin.
items.weapon.missiles.darts.blindingdart.name=blindiga sageto
items.weapon.missiles.darts.chillingdart.desc=Ĉi tiuj ĵetsagetoj estas kovritaj per landglaciego-bazita komponaĵo, kiu signife malvarmigos ilian celon.
items.weapon.missiles.darts.chillingdart.name=malvarmiga sageto
items.weapon.missiles.darts.cleansingdart.desc=Ĉi tiuj sagetoj estas kovritaj per magerjol-bazita komponaĵo, kiu provizore imunigos aliancanojn kontraŭ ĉiuj negativaj efikoj, aŭ purigos pozitivajn efikojn de malamikoj. Malamikoj eĉ povas nelonge forgesi, ke ili atakas aŭ fuĝas de vi. La sageto mem ankoraŭ estas damaĝa al malamikoj, sed ne damaĝos aliancanojn.
items.weapon.missiles.darts.cleansingdart.name=puriga sageto
items.weapon.missiles.darts.dart.ac_tip=KONSILETO
items.weapon.missiles.darts.dart.desc=Ĉi tiuj simplaj ŝaftoj el pikilpintaj ligno estas pezbalancitaj por flugi rekte kaj piki sian predon per pojnomovo. Oni povas ŝuti semojn sur ilin por akiri kromefikojn kiam ĵetitaj.
items.weapon.missiles.darts.dart.name=sageto
