items.armor.armor.probably_too_heavy=Verŝajne ĉi tiu kiraso estas tro peza por vi.
items.armor.armor.seal_attached=La rompita sigelo de la Militisto estas ligita al ĉi tiu kiraso. Kiam li estas vundita sub duono de sia sano, ĝi donos al li _%d ŝirmadon_.
items.armor.armor.seal_transfer=La rompita sigelo de la Militisto devas esti alfiksita al lia nuntempe portata kiraso por utili al li. Ĉu vi ŝatus aŭtomate dekroĉi la sigelon de la kiraso, kiun vi forigas, kaj alfiksi ĝin al la kiraso, kiun vi ekipas?
