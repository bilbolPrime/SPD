items.weapon.melee.shortsword.typical_ability_desc=La Duelanto povas _fendi_ malamikon per mallonga glavo. Tio tipe kaŭzas _%1$d-%2$d damaĝon_ kaj ĝi garantiite trafos. Se fendado mortigas malamikon, ĝi estas tuja kaj la Duelanto povas uzi fendadon denove ene de 5 vicoj senpage.
items.weapon.melee.sickle.ability_desc=La Duelanto povas _rikolti_ malamikon per serpo. Ĉi tiu detruiga atako certe trafos kaj kaŭzas _%d damaĝon_. Ĉi tiu damaĝo aplikiĝas kiel sangado se la celo ne estas imuna.
