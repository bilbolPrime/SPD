items.armor.clericarmor.name=ornatoj de heroo
items.armor.clotharmor.desc=Ĉi tiu malpeza kiraso ofertas bazan protekton.
items.armor.clotharmor.discover_hint=Unu el la herooj komencas per ĉi tiu objekto.
items.armor.clotharmor.name=ŝtofa kiraso
items.armor.curses.antientropy.desc=La Kontraŭentropia malbeno funkcias kontraŭ la fortoj de la universo, tirante energion en la portanton kaj for de ties ĉirkaŭaĵo. Tio nelonge ekbruligas la portanton, sed frostigas ĉion ĉirkaŭ ili!
items.armor.curses.antientropy.name=%s de kontraŭ-entropio
items.armor.curses.bulk.desc=Kiraso de amasa grandeco aspektas pli granda kaj pli impona, sed fakte ne havas plibonigitan defendon. Eĉ pli malbone, la aldonita grandeco tre malfaciligas la eniron en pordojn.
items.armor.curses.bulk.name=%s de groco
items.armor.curses.corrosion.desc=Kiraso de korodo kapablas eksplodi per koroda fluido, kovrante ĉion en la areo per glueca acida ŝlimo.
items.armor.curses.corrosion.name=%s de korodo
items.armor.curses.displacement.desc=La malbeno de delokiĝo provas movi la portanton al sekureco kiam ili estas atakitaj. Tamen, ĝi estas iom tro efika, hazarde teletransportante la uzanton ĉirkaŭ la nivelo.
items.armor.curses.displacement.name=%s de delokiĝo
items.armor.curses.metabolism.desc=La metabolmalbeno rekte konvertas satecon en sanon kiam la portanto estas vundita, provizante akcelon de resaniĝo, sed rapide kaŭzante malsaton.
items.armor.curses.metabolism.name=%s de metabolo
items.armor.curses.multiplicity.desc=Kiraso malbenita per diverseco enhavas danĝeran duobligan magion. Ĝi foje kreos spegulan bildon de la portanto, sed same verŝajne duobligos la atakanton!
items.armor.curses.multiplicity.name=%s de obleco
items.armor.curses.overgrowth.desc=Kiraso de trokreskaĵo estas kovrita per diversaj florantaj plantoj. Kvankam ĉi tiu efiko certe aspektas interesa, ĝi nenion helpas por defendo, kaj ĉi tiuj plantoj hazarde aktiviĝos en batalo!
items.armor.curses.overgrowth.name=%s de trokreskaĵo
items.armor.curses.stench.desc=Kiraso malbenita per fetoro ellasos nubojn de venena gaso, kiu estas danĝera por ĉio kaptita en la nubo.
items.armor.curses.stench.name=%s de fetoro
items.armor.duelistarmor.desc=Portante ĉi tiun platkirason kaj kabon, la Duelanto povas plenumi specialan kapablon.
items.armor.duelistarmor.name=la brustkiraso de la heroo
items.armor.glyphs.affection.desc=Ĉi tiu potenca glifo manipulas la menson de atakantoj, ĉarmante ilin provizore.
items.armor.glyphs.affection.name=%s de amo
items.armor.glyphs.antimagic.desc=Ĉi tiu potenca glifo permesas al kiraso defendi sian portanton kontraŭ magiaj atakoj same kiel fizikaj. Ĉi tiu magia defendo ne estas influita de la nivelo de la kiraso.
items.armor.glyphs.antimagic.name=%s de kontraŭmagio
items.armor.glyphs.brimstone.desc=Ĉi tiu glifo ŝirmas la portanton kaj liajn havaĵojn kontraŭ fajro, tute nuligante ĝian damaĝon kaj negativajn efikojn.
items.armor.glyphs.brimstone.name=%s de sulfuro
items.armor.glyphs.camouflage.desc=Ĉi tiu glifo permesas al la portanto miksiĝi en altan herbon, donante al ili provizoran nevideblecon.
items.armor.glyphs.camouflage.name=%s de kamuflaĵo
items.armor.glyphs.entanglement.desc=Ĉi tiu glifo kreskigas argilan kirason ĉirkaŭ la portanto por absorbi damaĝon, sed ĉi tiu kiraso rompiĝos se la portanto moviĝas.
items.armor.glyphs.entanglement.name=%s de implikiĝo
items.armor.glyphs.flow.desc=Ĉi tiu glifo manipulas la fluon de akvo ĉirkaŭ la portanto, igante lin/ŝin multe pli rapida dum movado tra ĝi.
items.armor.glyphs.flow.name=%s de fluo
items.armor.glyphs.obfuscation.desc=Ĉi tiu glifo obskuras la portanton, malfaciligante ilin detekti.
items.armor.glyphs.obfuscation.name=%s de malklarigado
items.armor.glyphs.potential.desc=Ĉi tiu glifo kreskigas energion kiam frapita, donante ŝargon al la sorĉbastono de la portanto kiam ĝi aktiviĝas.
items.armor.glyphs.potential.name=%s de potencialo
items.armor.glyphs.repulsion.desc=Ĉi tiu glifo resaltas forton kontraŭ atakantoj, sendante ilin flugi reen.
items.armor.glyphs.repulsion.name=%s de repuŝo
items.armor.glyphs.stone.desc=Ĉi tiu glifo ĉirkaŭas la kirason per peza magia ŝtono, kiu malebligas evitadon, sed blokas damaĝon proporcie kun la evitado.
items.armor.glyphs.stone.name=%s el ŝtono
items.armor.glyphs.swiftness.desc=Ĉi tiu glifo plibonigas la rapidon de la portanto kiam ajn ili ne estas proksime al malamiko.
items.armor.glyphs.swiftness.name=%s de rapideco
items.armor.glyphs.thorns.desc=Ĉi tiu potenca glifo damaĝas atakantojn, kaŭzante ilian malrapidan sangadon kiam ili atakas la portanton.
items.armor.glyphs.thorns.name=%s de dornoj
