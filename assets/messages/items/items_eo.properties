items.artifacts.lloydsbeacon.creatures=La metapsikia aŭro de najbaraj estaĵoj ne permesas al vi uzi la signostangon de Lloyd nuntempe.
items.artifacts.lloydsbeacon.desc=La signostango de Lloyd estas komplika magia aparato, kiu donas al la uzanto kontrolon de teleportaj magioj. La signostango povas esti uzata por reveni al difinita loko, sed ankaŭ povas elpeli eksplodojn de hazarda teleporta magio post kiam ĝi ŝargiĝis pro esti ekipita. Ĉi tiu magio povas esti direktita al celo aŭ al la uzanto mem.
items.artifacts.lloydsbeacon.desc_set=Ĉi tiu lumturo estis lokita ie sur la nivelo %d de Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Via lumturo plifortiĝas!
items.artifacts.lloydsbeacon.name=la signostango de Lloyd
items.artifacts.lloydsbeacon.no_charge=Via lumturo ne havas sufiĉe da energio nun.
items.artifacts.lloydsbeacon.preventing=Forta magia aŭro de ĉi tiu loko malhelpas vin uzi la signostangon de Lloyd!
items.artifacts.lloydsbeacon.prompt=Elektu lokon por zapi.
items.artifacts.lloydsbeacon.return=La signalo de Lloyd estas sukcese agordita ĉe via nuna loko, nun vi povas reveni ĉi tien iam ajn.
items.artifacts.lloydsbeacon.tele_fail=La teleporta magio malsukcesas.
items.artifacts.masterthievesarmband.ac_steal=ŜTELI
items.artifacts.masterthievesarmband.cursed=Vi ne povas uzi malbenitan brakbendon.
items.artifacts.masterthievesarmband.desc=Ĉi tiu purpura velura brakbendo portas la markon de majstra ŝtelisto. Ĝi ne apartenas al vi, sed verŝajne ĝi ankaŭ ne apartenis al sia lasta uzanto.
items.artifacts.masterthievesarmband.desc_cursed=La malbenita brakbendo estas ligita al via pojno, kaj iel via saketo da oro ŝajnas malrapide plipeziĝi...
items.artifacts.masterthievesarmband.desc_worn=Vi sentas potencon kreski en la brakbendo sur via pojno dum vi akiras sperton. Vi povas uzi ĉi tiun potencon por ŝteli el butikoj, aŭ por rabi malamikojn! \n\nRabi malamikojn okazas tuj, nelonge konfuzas ilin, kaj donas al vi ŝancon akiri kian ajn rabaĵon ili havas! Ĉi tiu potenco estas pli efika kontraŭ nekonsciaj malamikoj. Rabi la saman malamikon plurfoje ne donas pli da ŝancoj je rabaĵo.
items.artifacts.masterthievesarmband.failed_steal=Vi ne sukcesis ŝteli ion ajn.
items.artifacts.masterthievesarmband.full=Via brakbendo estas plene ŝargita!
items.artifacts.masterthievesarmband.level_up=Via brakbendo plifortiĝas!
