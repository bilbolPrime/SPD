items.artifacts.driedrose.desc_hint=Ŝajnas, ke mankas kelkaj petaloj. Eble ilia refiksado plifortigos la rozon.
items.artifacts.driedrose.desc_no_quest=Sekigita maljuna rozo, kiu iel ankoraŭ tenas sin kune malgraŭ sia aĝo. \n\nĜi ŝajnas havi iom da spirita potenco, sed vi tute ne scias kiel uzi ĝin nun.
