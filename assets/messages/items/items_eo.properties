items.potions.potion.silver=arĝenta pocio
items.potions.potion.sure_drink=Ĉu vi certas, ke vi volas trinki ĝin? Plejofte vi devus ĵeti tiajn pociojn al viaj malamikoj.
items.potions.potion.sure_throw=Ĉu vi certas, ke vi volas ĝin ĵeti? Plejofte estas logike trinki ĝin.
items.potions.potion.turquoise=turkisa pocio
items.potions.potion.unknown_desc=En ĉi tiu flakono kirliĝas %s likvaĵo. Kiu scias, kio okazos, se oni trinkos ĝin aŭ ĵetos la flakonon?
items.potions.potion.yes=Jes, mi scias, kion mi faras
items.potions.potionofexperience.desc=La rakontitaj spertoj de amasoj da bataloj reduktitaj al likva formo, ĉi tiu trinkaĵo tuj levos vian spertnivelon.
items.potions.potionofexperience.name=pocio de sperto
items.potions.potionoffrost.desc=Eksponita al aero, ĉi tiu substanco vaporiĝas en frostan nubon. Ĉiu estaĵo, kiu tuŝas ĝin, frostiĝas surloke kaj povas nek agi nek moviĝi.
items.potions.potionoffrost.name=pocio de frosto
items.potions.potionofhaste.desc=Trinki ĉi tiun strange dolĉan likvaĵon donos al vi grandegan energion por mallonga tempo, permesante al vi kuri je altaj rapidecoj.
items.potions.potionofhaste.energetic=Vi sentas vin energia!
items.potions.potionofhaste.name=pocio de rapido
items.potions.potionofhealing.desc=Eliksiro, kiu tuj plene restarigas vian sanon kaj kuracas veneniĝon.
items.potions.potionofhealing.heal=Viaj vundoj komencas fermiĝi.
items.potions.potionofhealing.name=pocio de resanigo
items.potions.potionofinvisibility.desc=Trinki ĉi tiun eliksiron igos vin portempe nevidebla. Dum tiu tempo malamikoj ne povos vidi vin. Atako kontraŭ malamiko aŭ uzo de vergo aŭ skribrulaĵo antaŭ ties okuloj nuligos la efikon.
items.potions.potionofinvisibility.invisible=Vi vidas viajn manojn fariĝi nevideblaj!
items.potions.potionofinvisibility.name=pocio de nevidebleco
items.potions.potionoflevitation.desc=Trinki ĉi tiun strangan likvaĵon levos vin en la aeron, tiel ke vi povos senpene flosi super kaptiloj. Tamen flamoj kaj gasoj plenigas la aeron, do flugante vi ne evitos ilin.
items.potions.potionoflevitation.float=Vi ŝvebas en la aeron!
items.potions.potionoflevitation.name=pocio de levitacio
items.potions.potionofliquidflame.desc=Ĉi tiu flakono enhavas malstabilan komponaĵon, kiu furioze eksplodos en flamon post eksponiĝo al la libera aero.
items.potions.potionofliquidflame.name=pocio de likva flamo
items.potions.potionofmindvision.desc=Post trinkado de ĉi tio, via menso agordiĝos al la psika signaturo de malproksimaj estaĵoj, ebligante al vi senti biologiajn ĉeestojn tra muroj. Ankaŭ ĉi tiu pocio permesos al vi vidi tra proksimaj muroj kaj pordoj.
items.potions.potionofmindvision.name=pocio de mensa vizio
items.potions.potionofmindvision.see_mobs=Vi povas iel senti la ĉeeston de la mensoj de aliaj estaĵoj!
items.potions.potionofmindvision.see_none=Vi povas iel diri, ke vi estas sola sur ĉi tiu nivelo nuntempe.
items.potions.potionofparalyticgas.desc=Post eksponiĝo al la libera aero, la likvaĵo en ĉi tiu flakono vaporiĝos en sensentigan flavan nebuleton. Ĉiu, kiu enspiras la nubon, tuj paraliziĝos, nekapabla moviĝi dum iom da tempo post kiam la nubo disipiĝos. Ĉi tiu objekto povas esti ĵetita al malproksimaj malamikoj por kapti ilin sub la efiko de la gaso.
items.potions.potionofparalyticgas.name=pocio de paraliza gaso
items.potions.potionofpurity.desc=Ĉi tiu substanco rapide neŭtraligas ĉiujn malutilajn gasojn en la efikareo. Trinkite, ĝi donas portempan imunecon kontraŭ tiaj gasoj.
items.potions.potionofpurity.freshness=Vi sentas nekutiman freŝecon en la aero.
items.potions.potionofpurity.name=Pocio de Purigo
items.potions.potionofpurity.protected=Protekta filmo vin ĉirkaŭvolvas!
items.potions.potionofstrength.desc=Ĉi tiu potenca likvaĵo trafluos viajn muskolojn, konstante pliigante vian forton je unu poento.
items.potions.potionofstrength.msg=Nove trovita forto trafluas vian korpon, vi nun havas %d forton!
items.potions.potionofstrength.name=pocio de forto
items.potions.potionoftoxicgas.desc=Malŝtopi aŭ frakasi ĉi tiun preman vitron kaŭzos, ke ĝia enhavo eksplodos en mortigan nubon de toksa verda gaso. Vi povus elekti ĵeti ĉi tiun pocion al malproksimaj malamikoj anstataŭ malŝtopi ĝin permane.
items.potions.potionoftoxicgas.name=pocio de toksa gaso
items.quest.ceremonialcandle.desc=Aro da kandeloj, fanditaj kaj kunfanditaj kune per uzo. \n\nSolaj ili estas senvaloraj, sed uzataj kun aliaj kandeloj laŭ ŝablono, ili povas fokusigi la energion por alvoka rito.
items.quest.ceremonialcandle.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.ceremonialcandle.name=ceremonia kandelo
items.quest.corpsedust.chill=Frostotremo trafluas vian spinon.
items.quest.corpsedust.desc=La bulo da kadavropolvo ne diferencas ekstere de ordinara polvobulo. Sed vi povas senti malican energion kaŝiĝantan en ĝi. \n\nForigi ĝin kiel eble plej baldaŭ estus bona ideo.
items.quest.corpsedust.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.corpsedust.name=kadavropolvo
items.quest.darkgold.desc=Ĉi tiu metalo estas nomata malhela ne pro sia koloro (ĝi ne diferencas de la normala oro), sed ĉar ĝi fandiĝas sub la taglumo, igante ĝin senutila sur la surfaco.
items.quest.darkgold.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.darkgold.name=malhela ora erco
items.quest.darkgold.you_now_have=Vi nun havas %d malhelan oran ercon.
items.quest.dwarftoken.desc=Multaj gnomoj kaj kelkaj el iliaj pli grandaj kreaĵoj portas ĉi tiujn malgrandajn pecojn da metalo kun nekonata celo. Eble ili estas juveloj aŭ eble ia identigilo. Gnomoj estas strangaj homoj.
items.quest.dwarftoken.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.dwarftoken.name=nana ĵetono
items.quest.embers.desc=Specialaj ardaĵoj, kiujn oni povas rikolti nur de junaj fajraj elementuloj. Ili radias varmenergion.
items.quest.embers.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.embers.name=elementaj ardaĵoj
items.quest.escapecrystal.ac_use=UZU
items.quest.escapecrystal.desc=Maldika magia sorĉkristalo, kiu ŝajnas enhavi teleportan magion. Vi povas uzi la kristalon iam ajn por forlasi la nanan trezorejon, sed vi ne povos kunporti ion ajn!
items.quest.escapecrystal.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.escapecrystal.name=fuĝkristalo
items.quest.gooblob.desc=Skuema gluaĵo, disigita de Guo dum ĝi mortis. Ĝi preskaŭ aspektas kiel granda bulo da ĵeleo, kvankam vi ne kuraĝus manĝi ĝin. \n\nĜi faras nenion memstare, sed ĝi povus esti utila kiam kombinita kun certaj pocioj, aŭ bombo. Almenaŭ ĝi devus konvertiĝi en decan kvanton da energio.
items.quest.gooblob.discover_hint=Vi povas akiri ĉi tiun objekton kiel falon de certaj malamikoj.
items.quest.gooblob.name=bulo da gluaĵo
items.quest.metalshard.desc=Fragmento de rusta malbenita metalo, kiu derompiĝis de DM-300 dum ĝia detruo. Vi povas senti neaktivan malican magion en ĝi. \n\nĜi faras nenion memstare, sed ĝi povus esti utila kiam kombinite kun certaj volvlibroj, aŭ bombo. Minimume ĝi devus konvertiĝi en decan kvanton da energio.
items.quest.metalshard.discover_hint=Vi povas akiri ĉi tiun objekton kiel falon de certaj malamikoj.
items.quest.metalshard.name=malbenita metala breĉeto
items.quest.pickaxe.ability_desc=La Duelanto povas _trapiki_ malamikon per pioĉo. Ĉi tio garantiite trafos, vundiĝas dum 3 vicoj, kaj kaŭzas _%1$d-%2$d damaĝon_ al malamikoj kun rigida haŭto.
items.quest.pickaxe.ability_name=trapiki
items.quest.pickaxe.desc=Jen fortika kaj peza ilo por rompi rokojn. Vi ne bezonas ekipi la pioĉon por minadi per ĝi, sed ĝi verŝajne povas esti ekipita kiel armilo en kriza situacio.
items.quest.pickaxe.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
items.quest.pickaxe.name=pioĉo
items.quest.pickaxe.upgrade_ability_stat_name=Kapabla Difekto
items.quest.ratskull.desc=Surprize granda kranio de rato. Ĝi estus bonega ĉastrofeo, se vi havus muron por munti ĝin.
items.quest.ratskull.name=kranio de giganta rata
items.remains.bowfragment.desc=Ĉi tiu rompita lignofragmento iam estis parto de la spirita arko de perdita ĉasistino. Vi ankoraŭ povas senti iom da natura energio restanta en la fragmento, vi povas uzi la fragmenton por kreskigi iom da alta herbo ĉirkaŭ vi. Fari tion tamen detruos la fragmenton.
items.remains.bowfragment.name=arkofragmento
items.remains.brokenhilt.desc=Ĉi tiu rompita tenilo aspektas kvazaŭ ĝi devenis de la armilo de venkita duelanto. Vi ankoraŭ povas senti iom da militema povo restanta en la tenilo, vi povas uzi ĝin por ricevi iom da kroma damaĝo dum viaj sekvaj du manbatalaj trafoj. Tamen, fari tion detruos la tenilon.
items.remains.brokenhilt.name=rompita glavtenilo
items.remains.brokenstaff.desc=La bastono de ĉi tiu magiisto estis rompita duone post kiam ĝia posedanto mortis. Vi ankoraŭ povas senti iom da magia energio restanta en la bastono, vi povas uzi ĝin por doni al viaj sorĉbastonoj iom da ŝargo-akcelo. Tamen fari tion detruos la bastonon.
items.remains.brokenstaff.name=rompita bastono
items.remains.cloakscrap.desc=Ĉi tiu peceto da travidebla ŝtofo aspektas kvazaŭ ĝi devenis de la mantelo de ombroj de malfru-a Rogue. Vi ankoraŭ povas senti iom da mistera energio restanta en ĝi, vi povas uzi ĝin por doni al viaj artefaktoj iom da ŝargo-akcelo. Tamen fari tion detruos la ŝtofon.
items.remains.cloakscrap.name=peceto de ŝtofo
items.remains.remainsitem.ac_use=UZU
items.remains.remainsitem.discover_hint=Vi povas trovi ĉi tiun objekton en la restaĵoj de specifa heroo el antaŭa perdita kuro.
items.remains.sealshard.desc=Ĉi tiuj etaj fragmentoj de ruĝa vakso aspektas kvazaŭ ili devenis de la sigelo de falinta militisto. Vi ankoraŭ povas senti iom da voloforto algluiĝanta al la sigelo, vi povas uzi ĝin por doni al vi iom da ŝirmado. Fari tion tamen detruos la sigelfragmentojn.
items.remains.sealshard.name=fokaj fragmentoj
items.remains.tornpage.desc=Ĉi tiu paĝo aspektas kvazaŭ ĝi estis elŝirita el eksvalidiĝinta sankta volumo de kleriko. Ankoraŭ estas iom da dia energio algluiĝinta al ĝi, vi povas uzi ĝin por reakiri iom da sano. Tamen fari tion detruos la ŝiritan paĝon.
