items.weapon.melee.mace.ability_desc=La Duelanto povas plenumi _pezan baton_ per muskatfloro. Ĉi tiu koncentrita atako kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
items.weapon.melee.mace.ability_name=forta bato
items.weapon.melee.mace.desc=La granda fera kapo de ĉi tiu armilo kaŭzas grandan damaĝon.
items.weapon.melee.mace.name=muskatfloro
items.weapon.melee.mace.stats_desc=Ĉi tiu estas sufiĉe preciza armilo.
items.weapon.melee.mace.typical_ability_desc=La Duelanto povas plenumi _pezan baton_ per muskatfloro. Ĉi tiu koncentrita atako tipe kaŭzas _%1$d-%2$d damaĝon_ se ĝi surprizas la malamikon, kaj konfuzas lin/ŝin dum 5 vicoj, kio reduktas precizecon kaj evitadon je 50%%. Forta bato ĉiam trafas sed kaŭzas regulan damaĝon se ĝi ne surprizas la malamikon.
