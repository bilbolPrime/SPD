items.weapon.melee.warhammer.ability_name=forta bato
items.weapon.melee.warhammer.desc=Malmultaj estaĵoj povas elteni la gigantan baton de ĉi tiu tura maso el plumbo kaj ŝtalo, sed ĝi bezonas grandan forton por uzi ĝin efike.
items.weapon.melee.warhammer.name=militmartelo
