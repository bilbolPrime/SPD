items.potions.exotic.exoticpotion.unknown_desc=Ĉi tiu ronda flakono enhavas grajnecan buntan likvaĵon. Ĝi ŝajnas esti fremda al ĉi tiu lando, kiu scias, kion ĝi povus fari, se trinkita aŭ ĵetita?
items.potions.exotic.exoticpotion.warning=Ĉu vi vere volas nuligi la uzadon de ĉi tiu pocio? Ĝi estos konsumita ĉiuokaze.
items.potions.exotic.exoticpotion.yes=Jes, mi estas pozitiva
items.potions.exotic.potionofcleansing$cleanse.desc=Ĉi tiu rolulo estas provizore imuna kontraŭ ĉiuj malutilaj statusaj efikoj!\n\nRestantaj turnoj: %s.
items.potions.exotic.potionofcleansing$cleanse.name=purigita
items.potions.exotic.potionofcleansing.desc=Ĉi tiu potenca reakciilo imunigos la trinkanton kontraŭ ĉiuj malutilaj statusaj efikoj dum kelkaj vicoj kiam trinkite. Ĝi ankaŭ povas esti ĵetita al celo por purigi lin/ŝin.
items.potions.exotic.potionofcleansing.name=pocio de purigo
items.potions.exotic.potionofcorrosivegas.desc=Malŝtopi aŭ frakasi ĉi tiun premizitan vitron kaŭzos, ke ĝia enhavo eksplodos en mortigan nubon de koroda rustkolora gaso. La gaso disvastiĝas pli rapide ol toksa gaso kaj estas pli mortiga, sed ankaŭ ne daŭros tiel longe.
items.potions.exotic.potionofcorrosivegas.name=pocio de koroda gaso
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talento-Poentoj!
items.potions.exotic.potionofdivineinspiration.desc=La povo de sankta energio reduktita al likva formo, ĉi tiu trinkaĵo plenigos la trinkanton per dia povo, donante al ili du kromajn talentpoentojn en nivelo laŭ ilia elekto. \n\nĈi tiu pocio uzeblas nur unufoje por ĉiu talentnivelo.
items.potions.exotic.potionofdivineinspiration.name=pocio de dia inspiro
items.potions.exotic.potionofdivineinspiration.no_more_points=Vi ne povas gajni pluajn kromajn talentpoentojn.
items.potions.exotic.potionofdivineinspiration.select_tier=Elektu talentnivelon por gajni du krompoentojn. Vi devas esti malŝlosinta la nivelon por povi elspezi la poentojn.
items.potions.exotic.potionofdragonsbreath.desc=Ĉi tiu flakono enhavas nekutiman komponaĵon, kiu ekflamas baldaŭ post miksiĝo kun salivo. Rapida kraĉado de la likvaĵo permesos al la uzanto elsputi flamon el sia buŝo!
items.potions.exotic.potionofdragonsbreath.name=pocio de drako-spiro
items.potions.exotic.potionofdragonsbreath.prompt=Elektu lokon por bruligi
items.potions.exotic.potionofearthenarmor.desc=Anstataŭ paralizi, ĉi tiu likvaĵo havas malmoligan efikon sur la haŭton, kiu transformos ĝin en provizoran naturan kirason.
items.potions.exotic.potionofearthenarmor.name=pocio de tera kiraso
items.potions.exotic.potionofmagicalsight.desc=Post trinkado de ĉi tio, viaj sentoj estos nelonge pliigitaj ĝis nekredeblaj niveloj, permesante al vi vidi tra muroj en radiuso de 12 kaheloj!
items.potions.exotic.potionofmagicalsight.name=pocio de magia vido
items.potions.exotic.potionofmastery.armor_easier=Via kiraso fariĝas pli facile portebla!
items.potions.exotic.potionofmastery.desc=Anstataŭ doni krudan forton, ĉi tiu pocio anstataŭe agordos la muskolojn de la uzanto al specifa objekto. Tio faciligos la uzon de tiu objekto, kvazaŭ la trinkanto praktikis kun ĝi kaj konstruis muskolan memoron. \n\nLa elektita armilo aŭ kiraso postulos 2 poentojn malpli da forto por uzi. Ĉi tiu pocio uzeblas nur unufoje por ĉiu objekto.
items.potions.exotic.potionofmastery.name=pocio de majstreco
items.potions.exotic.potionofmastery.prompt=Majstri Objekton
items.potions.exotic.potionofmastery.weapon_easier=Via armilo fariĝas pli facile uzebla!
items.potions.exotic.potionofshielding.desc=Anstataŭ resanigi, ĉi tiu pocio anstataŭe projektos daŭrivan ŝildon ĉirkaŭ la korpo de la uzanto, blokante konsiderindan kvanton da damaĝo.
items.potions.exotic.potionofshielding.name=pocio de ŝirmado
items.potions.exotic.potionofshroudingfog.desc=Kiam eksponita al aero, la likvaĵo en ĉi tiu flakono produktos densan fumplenan nebulon, kiu rapide disvastiĝas kaj blokas la vidon de viaj malamikoj.
items.potions.exotic.potionofshroudingfog.name=pocio de kovranta nebulo
items.potions.exotic.potionofsnapfreeze.desc=La kemiaĵo en ĉi tiu pocio rapide reagos kun la aero, tuj frostigante kaj enradikigante ĉion sub sia efiko.
items.potions.exotic.potionofsnapfreeze.name=pocio de fulmfrostigo
items.potions.exotic.potionofstamina.desc=Trinki ĉi tiun strange dolĉan likvaĵon donos al vi longdaŭran akcelon de energio, permesante al vi kuri je akcelita rapideco dum plilongigita tempodaŭro.
items.potions.exotic.potionofstamina.name=pocio de eltenemo
items.potions.exotic.potionofstormclouds.desc=Ĵetado de ĉi tiu pocio kreos rapide disvastiĝantan nubon de koncentrita vaporo, kiu kondensiĝos kaj verŝiĝos sur la ĉirkaŭaĵon. Plejparto de la tereno transformiĝos al akvo, fajraj malamikoj ricevos damaĝon, fajro estingiĝos, kaj kaptiloj estos superfortitaj kaj rompiĝos.
items.potions.exotic.potionofstormclouds.name=pocio de ŝtormnuboj
