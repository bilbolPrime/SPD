items.rings.ringoftenacity.upgrade_stat_name_1=Maksimuma Damaĝo-Rezisto
items.rings.ringofwealth.combined_stats=Viaj ekipitaj ringoj kombinas sian potencon, pliigante vian bonŝancon je _%s%%_ entute.
items.rings.ringofwealth.desc=Ĉi tiu ringo agas kiel magneto por trezoroj, pliigante la probablecon, ke malamikoj kaj ujoj portos valorajn objektojn. Malbenita ringo anstataŭe malpliigos vian ŝancon ricevi rabaĵon.
