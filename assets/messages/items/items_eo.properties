items.food.frozencarpaccio.better=Vi sentas vin pli bone!
items.food.frozencarpaccio.desc=Ĝi estas peco da frostigita kruda viando. La sola maniero manĝi ĝin estas tranĉante maldikajn tranĉaĵojn de ĝi. Kaj tiel ĝi estas surprize bongusta.
