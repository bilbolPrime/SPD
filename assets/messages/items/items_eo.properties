items.weapon.melee.sai$combostriketracker.desc=La Duelanto konstruas kombon, kiu povas esti uzata por pliigi la damaĝon de la kombinaĵa frapkapablo. Ĉiu sukcesa regula manbatalo aŭ ĵetarmilo-atako kalkuliĝos, sed ne sukcesa atakado dum 5 vicoj rekomencigas ĉi tiun kombon.\n\nLastaj trafoj: %1$d.\n\nVicoj ĝis trafoj perdiĝas: %2$s.
items.weapon.melee.sai$combostriketracker.name=kombinita striko
items.weapon.melee.sai.ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ per sai. Ĉi tiu atako garantiite trafos kaj kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per regula manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.sai.ability_name=kombinita striko
items.weapon.melee.sai.desc=Du maldikaj klingoj destinitaj por esti tenataj en ĉiu mano. Bonegaj por disŝiri malamikojn per amaso da tranĉoj.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Ĉi tiu estas tre rapida armilo.
items.weapon.melee.sai.typical_ability_desc=La Duelanto povas plenumi _kombinaĵan atakon_ per sai. Ĉi tiu atako garantiite trafos kaj tipe kaŭzas _+%d damaĝon_ ĉiufoje kiam la Duelanto trafis per regula manbatalo aŭ ĵetita armilatako. Ne trafi dum 5 vicoj rekomencigas ĉi tiun kombinaĵon.
items.weapon.melee.scimitar$sworddance.desc=La Duelanto faras rapidajn atakojn bazitajn sur impeto en ia danco. Dum ĉi tiu sinteno estas aktiva, ŝi atakas 60%% pli rapide (sufiĉe por ataki ekzakte dufoje en vico per adzo) kaj havas +50%% precizecon.\n\nRestantaj vicoj: %s.
items.weapon.melee.scimitar$sworddance.name=glavodanco
items.weapon.melee.scimitar.ability_desc=La Duelanto povas plenumi _glavodancon_ per adzo. Ĉi tiu sinteno ne bezonas tempon por aktiviĝi kaj donas al la Duelanto +60%% atakrapidecon kaj +50%% precizecon por _%d vicoj_.
items.weapon.melee.scimitar.ability_name=glavodanco
items.weapon.melee.scimitar.desc=Dika kurba klingo. Ĝia formo permesas pli rapidajn, tamen malpli potencajn atakojn.
