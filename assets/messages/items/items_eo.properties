items.armor.glyphs.viscosity.desc=Ĉi tiu glifo kapablas stoki damaĝon kaŭzitan al la portanto, kaŭzante ĝin al ili malrapide anstataŭ samtempe.
items.armor.glyphs.viscosity.name=%s de viskozeco
items.armor.huntressarmor.desc=Portante ĉi tiun mantelon, la Ĉasistino povas plenumi specialan kapablon.
items.armor.huntressarmor.name=mantelo de heroo
items.armor.huntressarmor.no_enemies=Neniuj malamikoj videblaj
items.armor.leatherarmor.desc=Kiraso farita el sunbrunigita monstrohaŭto. Ne tiel malpeza kiel ŝtofa kiraso, sed provizas pli bonan protekton.
items.armor.leatherarmor.name=leda kiraso
items.armor.magearmor.desc=Portante ĉi tiun belegan robon, la Magiisto povas plenumi specialan kapablon.
