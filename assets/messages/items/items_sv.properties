items.armor.huntressarmor.no_enemies=Inga fiender i sikte
items.armor.leatherarmor.desc=Rustning tillverkad av garvat monsterhud. Inte lika lätt som tygrustning men ger bättre skydd.
items.armor.leatherarmor.name=läderrustning
items.armor.magearmor.desc=Medan magikern bär denna underbara mantel kan han utföra en speciell förmåga.
items.armor.magearmor.name=hjältemantel
items.armor.mailarmor.desc=Sammankopplade metalllänkar skapar en tuff men flexibel rustning.
items.armor.mailarmor.name=postpansar
items.armor.platearmor.desc=Enorma metallplattor är sammanfogade till en dräkt som ger oöverträffat skydd till alla äventyrare som är starka nog att bära dess svindlande vikt.
items.armor.platearmor.name=plåtpansar
items.armor.roguearmor.desc=Medan han bär denna mörka dräkt kan Rogue utföra en speciell förmåga.
items.armor.roguearmor.name=hjältekläder
items.armor.scalearmor.desc=Metallfjällen som är fastsydda på en läderväst skapar en flexibel men skyddande rustning.
