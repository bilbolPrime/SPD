items.weapon.melee.flail$spinabilitytracker.desc=Duelisten snurrar sin slaga och bygger skada inför nästa vanliga attack med den. Varje snurr tar en tur men ökar skadan, till maximalt tre snurr. Slagan garanteras också att träffa medan hon snurrar.\n\nAktuella snurr: %1$d%%.\nÅterstående turar: %2$s
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail.ability_desc=Duelisten kan _snurra_ en slaga för att bygga upp kraft under en kort tid. Varje varv slagan snurras kommer den att göra _+%d skada_ på sin nästa vanliga attack, upp till max 3 gånger. En snurrande slaga garanteras också att träffa. Bara att börja snurra slagan kostar en avgift.
items.weapon.melee.flail.ability_name=snurra
items.weapon.melee.flail.desc=En spetsig boll fäst vid ett handtag med en kedja. Mycket otymplig, men förödande om den träffar ordentligt.
items.weapon.melee.flail.name=slaga
items.weapon.melee.flail.spin_warn=Du kan inte snurra slagan längre.
items.weapon.melee.flail.stats_desc=Detta är ett ganska oprecis vapen. \nDetta vapen kan inte överraska attacker.
items.weapon.melee.flail.typical_ability_desc=Duelisten kan _snurra_ en slaga för att bygga upp kraft under en kort tid. Varje varv slagan snurras kommer den vanligtvis att göra _+%d skada_ på sin nästa vanliga attack, upp till max 3 gånger. En snurrande slaga garanteras också att träffa. Bara att börja snurra slagan kostar en avgift.
items.weapon.melee.gauntlet.ability_desc=Duelisten kan utföra en _kombinationsattack_ med en stenhandske. Denna attack garanterar träffande och gör _+%d skada_ för varje gång duelisten har träffat med en vanlig närstridsattack eller en vapenattack med kastade attacker. Om du inte träffar på 5 turer återställs denna kombination.
items.weapon.melee.gauntlet.ability_name=kombinationsslag
items.weapon.melee.gauntlet.desc=Denna massiva handske är tillverkad av karmosinrött tyg med tunga magiska stenar ovanpå. Tyget stramar åt runt dig, vilket gör att de tjocka stenplattorna nästan känns som en andra hud. Att svinga ett så tungt vapen kräver styrka, men ger en enorm kraft till dina slag.
items.weapon.melee.gauntlet.name=stenhandske
items.weapon.melee.gauntlet.stats_desc=Detta är ett mycket snabbt vapen.
items.weapon.melee.gauntlet.typical_ability_desc=Duelisten kan utföra en _kombinationsattack_ med en stenhandske. Denna attack garanterar träffande och gör vanligtvis _+%d skada_ för varje gång duelisten har träffat med en vanlig närstridsattack eller vapenattack. Om du inte träffar på 5 turer återställs denna kombination.
items.weapon.melee.glaive.ability_desc=Duelisten kan använda spetsen på en glasögon för att _spika_ en fiende som är inom räckhåll men inte intill. Detta gör _%1$d-%2$d skada_, slår tillbaka fienden och garanterar att träffa.
items.weapon.melee.glaive.ability_name=spika
