items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Trött... för tillfället...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Jag kommer att återvända...
items.artifacts.driedrose$ghosthero.desc=En skör eterisk figur med en människoliknande form. Deras kraft verkar knuten till rosen du har. \n\nDet här spöket kanske inte är mycket, de verkar vara din enda sanna vän här nere.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Varför händer detta, jag trodde vi lyckades?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hur kan den där saken fortfarande påverka den här världen?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Jag hoppas att du vet vad du gör med den där amuletten.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Jag antar att vi inte är klara än.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Vi har redan kommit så långt, vi kan avsluta det här!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Bara lite längre, så kan vi ta oss härifrån!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Ingen människa eller dvärg har varit här på särskilt länge.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Vad skulle få dvärgarna att överge en guldgruva?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Det är synd att allt guld här är värdelöst på ytan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Varelserna här är förvridna, precis som i avloppet.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Till och med fladdermössen är blodtörstiga här.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Inga tecken på någon gruvutrustning, återtog dvärgarna allt?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Dvärgarna var flitiga, men giriga.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Så dvärgmetropolen har verkligen fallit.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Jag hoppas att ytan aldrig blir som den här platsen.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Dvärgar ska inte se så bleka ut.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Jag vet inte vad som är värst, dvärgarna eller deras skapelser.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Det verkar som att dvärgarna också är tanklösa monster nu.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Vad är det här för plats?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Det här stället är skrämmande...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Vad tänkte dvärgarna, när de lekte med makt så här?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Monstren här är utomjordiska, varifrån kommer de?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Kan du känna det? Det är som om något tittar på oss.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Tack och lov att det finns facklor, det är så mörkt här!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Jag har hört historier om det här stället, inget positivt.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Den här platsen har alltid varit mer en fängelsehåla än ett fängelse.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Jag kan inte föreställa mig vad som hände när den här platsen övergavs.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Det verkar som att både fångarna och vakterna har förvandlats till monster.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Vad kan vara orsaken till alla dessa skelett?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Dessa människor behövde inte sluta så här...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Dessa avlopp brukade vara säkra, folk bodde till och med här på vintern.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Jag undrar vad som hände med vaktpatrullerna, gav de upp?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Jag hade familj på ytan, jag hoppas att de är i säkerhet.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Vakterna kunde inte besegra dessa monstren, men kanske vi kan.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Om ens avloppen är så här farliga, undrar jag vad som finns nedanför...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Vad kan ha orsakat att dessa råttor och krabbor växte sig så stora?
items.artifacts.driedrose$ghosthero.direct_prompt=Vad ska jag göra?
items.artifacts.driedrose$ghosthero.directed_attack_1=Okej, jag attackerar den.
items.artifacts.driedrose$ghosthero.directed_attack_2=Jag ska hämta den där.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engagerande...
items.artifacts.driedrose$ghosthero.directed_attack_4=Låt oss hämta dem!
items.artifacts.driedrose$ghosthero.directed_attack_5=Jag har den där.
items.artifacts.driedrose$ghosthero.directed_follow_1=Okej, jag följer dig.
items.artifacts.driedrose$ghosthero.directed_follow_2=Jag ställer mig bakom dig.
items.artifacts.driedrose$ghosthero.directed_follow_3=Följer dig...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okej, nu kör vi!
items.artifacts.driedrose$ghosthero.directed_follow_5=Jag står bakom dig.
items.artifacts.driedrose$ghosthero.directed_position_1=Okej, jag behåller den positionen.
items.artifacts.driedrose$ghosthero.directed_position_2=Jag ska dit och försvara mig.
items.artifacts.driedrose$ghosthero.directed_position_3=Ompositionering...
items.artifacts.driedrose$ghosthero.directed_position_4=På väg!
items.artifacts.driedrose$ghosthero.directed_position_5=Jag åker dit.
items.artifacts.driedrose$ghosthero.discover_hint=Du kan hitta den här karaktären med en specifik artefakt.
items.artifacts.driedrose$ghosthero.hello=Hej igen %s.
items.artifacts.driedrose$ghosthero.introduce=Min ande är bunden till denna ros, den var mycket värdefull för mig, en gåva från min kärlek som jag lämnade kvar på ytan.\n\nJag kan inte återvända till honom, men tack vare dig har jag en andra chans att slutföra min resa. När jag kan kommer jag att svara på ditt kall och kämpa med dig.\n\nSå länge du har rosen kan jag höra din röst, så att du kan använda den för att vägleda mig på avstånd.\n\nFörhoppningsvis lyckas du där jag misslyckades...
items.artifacts.driedrose$ghosthero.name=sorgligt spöke
items.artifacts.driedrose$ghosthero.player_killed_1=Inga!...
items.artifacts.driedrose$ghosthero.player_killed_2=Jag kunde inte hjälpa dem...
items.artifacts.driedrose$ghosthero.player_killed_3=Inte så här...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Endast dvärgar skulle bygga en gruvmaskin som dödar inkräktare.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Den där grejen är enorm...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hur har den här saken kunnat vara aktiv så länge?
items.artifacts.driedrose$ghosthero.seen_goo_1=Se upp, Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Många av mina vänner dog av den här saken, dags för hämnd!
items.artifacts.driedrose$ghosthero.seen_goo_3=En sådan styggelse kan inte tillåtas leva!
items.artifacts.driedrose$ghosthero.seen_king_1=När folk säger att makt korrumperar, är det detta de menar.
items.artifacts.driedrose$ghosthero.seen_king_2=Han är mer en lich än en kung nu.
items.artifacts.driedrose$ghosthero.seen_king_3=Även i döden lyder dvärgarna sin herre.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Den enda fången som är kvar är en dödlig lönnmördare. Självklart...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Han har fångat oss!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Jag har hört skräckhistorier om den där masken...
items.artifacts.driedrose$ghosthero.seen_yog_1=Åh, det här ser inte bra ut.
items.artifacts.driedrose$ghosthero.seen_yog_2=Så ser en gud ut så här?
items.artifacts.driedrose$ghosthero.seen_yog_3=Det här kommer att göra ont...
items.artifacts.driedrose$petal.desc=Ett bräckligt, uttorkat kronblad, som på något sätt har överlevt så här långt in i fängelsehålan.
items.artifacts.driedrose$petal.levelup=Du lägger till kronbladet på rosen.
items.artifacts.driedrose$petal.maxlevel=Rosen är klar!
items.artifacts.driedrose$petal.name=torkat kronblad
items.artifacts.driedrose$petal.no_room=Det finns ingen plats kvar för detta kronblad, så du slänger det.
items.artifacts.driedrose$petal.no_rose=Du har ingen ros att lägga detta kronblad till.
items.artifacts.driedrose$wndghosthero.armor_prompt=Välj en rustning
items.artifacts.driedrose$wndghosthero.cant_cursed=Spöket kan bara använda utrustning som du är säker på att inte är förbannad.
items.artifacts.driedrose$wndghosthero.cant_strength=Spöket är inte starkt nog att använda det.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Spöket kanske inte är starkt nog att använda det.
items.artifacts.driedrose$wndghosthero.cant_unique=Spöket kan inte använda unika föremål.
items.artifacts.driedrose$wndghosthero.desc=Spöket är svagt på egen hand, men deras form är tillräckligt solid för att utrustas med vapen och rustning. De kommer att kunna använda dessa föremål precis som du. \n\nSpöket kan för närvarande utrusta föremål som kräver upp till _%d styrka._
items.artifacts.driedrose$wndghosthero.title=Spökets utrustning
items.artifacts.driedrose$wndghosthero.weapon_prompt=Välj ett vapen
items.artifacts.driedrose.ac_direct=DIREKT
items.artifacts.driedrose.ac_outfit=UTRUSTA
items.artifacts.driedrose.ac_summon=KALLA
items.artifacts.driedrose.charged=Din ros är fulladdad!
items.artifacts.driedrose.cursed=Du kan inte använda en förbannad ros.
items.artifacts.driedrose.desc=Är detta rosen som spöket nämnde innan den försvann? Den verkar ha någon form av andlig kraft, kanske kan den användas för att kanalisera den där förlorade krigarens energi.
items.artifacts.driedrose.desc_armor=Spökets rustning: %s
items.artifacts.driedrose.desc_cursed=Den förbannade rosen är bunden till din hand, den känns kusligt kall.
items.artifacts.driedrose.desc_hint=Det verkar som att det saknas några kronblad. Att sätta tillbaka dem kanske stärker rosen.
items.artifacts.driedrose.desc_no_quest=En torkad, lagrad ros som på något sätt fortfarande håller ihop trots sin ålder. \n\n Den verkar ha en viss andlig kraft, men du har ingen aning om hur du ska använda den just nu.
items.artifacts.driedrose.desc_strength=Spökets styrka: %s
items.artifacts.driedrose.desc_weapon=Spökets vapen: %s
items.artifacts.driedrose.name=torkad ros
items.artifacts.driedrose.no_charge=Din ros är inte fulladdad än.
items.artifacts.driedrose.no_space=Det finns ingen ledig plats nära dig.
items.artifacts.driedrose.spawned=Du har redan kallat fram spöket.
items.artifacts.etherealchains$chainsrecharge.levelup=Dina kedjor blir starkare!
items.artifacts.etherealchains.ac_cast=KASTA
items.artifacts.etherealchains.cant_pull=Era kedjor kan inte dra det målet.
items.artifacts.etherealchains.cant_reach=Dina kedjor kan inte nå dit.
items.artifacts.etherealchains.cursed=Du kan inte använda förbannade kedjor.
items.artifacts.etherealchains.desc=Dessa stora men lätta kedjor glöder med andlig energi. De kan användas för att dra dig mot terräng, eller dra fiender mot dig. Kedjornas eteriska natur gör att de till och med kan sträcka sig genom väggar!
items.artifacts.etherealchains.desc_cursed=De förbannade kedjorna är låsta vid din sida, svänger ständigt runt och försöker snubbla eller binda dig.
items.artifacts.etherealchains.desc_equipped=Kedjorna vilar runt din sida och suger långsamt ut den andliga energin från dem du besegrar. Varje laddning är en länk i kedjan, som sträcker sig ut exakt en ruta.
items.artifacts.etherealchains.does_nothing=Det kommer inte att göra någonting.
items.artifacts.etherealchains.inside_wall=Dina kedjor kan bara dra dig genom väggar, inte in i dem.
items.artifacts.etherealchains.name=eteriska kedjor
items.artifacts.etherealchains.no_charge=Dina kedjor har inte tillräckligt med laddning.
items.artifacts.etherealchains.nothing_to_grab=Det finns inget att hämta där.
items.artifacts.etherealchains.prompt=Välj en plats att rikta in dig på.
items.artifacts.etherealchains.rooted=Dina kedjor kan inte dra dig medan du är rotad.
items.artifacts.holytome.ac_cast=KASTA
items.artifacts.holytome.cursed=Du kan inte använda en förbannad novell.
items.artifacts.holytome.desc=En helig skrift som fungerar som ett fokus för prästens gudomliga magi. Genom att använda skriften kan prästen utföra en mängd olika magiska trollformler. \n\n Boken blir stadigt kraftfullare allt eftersom prästen använder den, vilket ger prästen fler maximala laddningar och ökar laddningshastigheten något.
items.artifacts.holytome.discover_hint=En av hjältarna börjar med det här föremålet.
items.artifacts.holytome.levelup=Din novell blir starkare!
items.artifacts.holytome.name=helig skrift
items.artifacts.holytome.no_spell=Du kan inte utöva den besvärjelsen just nu.
items.artifacts.hornofplenty.ac_eat=ÄTA
items.artifacts.hornofplenty.ac_snack=MELLANMÅL
items.artifacts.hornofplenty.ac_store=LAGRA
items.artifacts.hornofplenty.desc=Det här hornet kan inte blåses i, utan verkar istället fyllas med mat allt eftersom du ger dig ut på äventyr och får erfarenhet. Du kan konsumera varje laddning individuellt som mellanmål, eller äta tills du är mätt.
items.artifacts.hornofplenty.desc_cursed=Det förbannade hornet har bundit sig till din sida, det verkar vara ivrigt att ta mat hellre än att producera den.
items.artifacts.hornofplenty.desc_hint=Kanske finns det ett sätt att öka hornets kraft genom att ge det matenergi.
items.artifacts.hornofplenty.eat=Du äter från hornet.
items.artifacts.hornofplenty.feed=Hornet förtär ditt matoffer.
items.artifacts.hornofplenty.full=Ditt horn är fullt av mat!
items.artifacts.hornofplenty.levelup=Hornet förtär ditt matoffer och växer i styrka!
items.artifacts.hornofplenty.maxlevel=Ditt horn har ätit upp all mat det kan!
items.artifacts.hornofplenty.name=ymnighetshorn
items.artifacts.hornofplenty.no_food=Ditt horn har ingen mat i sig att äta!
items.artifacts.hornofplenty.prompt=Välj lite mat
items.artifacts.hornofplenty.reject=Ditt horn avvisar den okokta, intetsigande frukten.
items.artifacts.lloydsbeacon.ac_return=ÅTERVÄNDA
items.artifacts.lloydsbeacon.ac_set=UPPSÄTTNING
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.creatures=Den psykiska auran från angränsande varelser tillåter dig inte att använda Lloyds fyrbåk just nu.
items.artifacts.lloydsbeacon.desc=Lloyds fyr är en invecklad magisk anordning som ger användaren kontroll över teleporteringsmagi. Fyren kan användas för att återvända till en given plats, men kan också avge utbrott av slumpmässig teleporteringsmagi när den har laddats från sin utrustning. Denna magi kan riktas mot ett mål eller mot användaren själv.
items.artifacts.lloydsbeacon.desc_set=Denna fyr placerades någonstans på nivån %d i Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Din ledstjärna blir starkare!
items.artifacts.lloydsbeacon.name=Lloyds fyr
items.artifacts.lloydsbeacon.no_charge=Din beacon har inte tillräckligt med energi just nu.
items.artifacts.lloydsbeacon.preventing=Den här platsens starka magiska aura hindrar dig från att använda Lloyds fyr!
items.artifacts.lloydsbeacon.prompt=Välj en plats att zappa.
items.artifacts.lloydsbeacon.return=Lloyds fyr har ställts in på din nuvarande plats, nu kan du återvända hit när som helst.
items.artifacts.lloydsbeacon.tele_fail=Teleporteringsmagin misslyckas.
items.artifacts.masterthievesarmband.ac_steal=STJÄLA
items.artifacts.masterthievesarmband.cursed=Du kan inte använda ett förbannat armband.
items.artifacts.masterthievesarmband.desc=Detta lila sammetsarmband bär en mästertjuvs märke. Det tillhör inte dig, men det tillhörde förmodligen inte heller dess förra användare.
items.artifacts.masterthievesarmband.desc_cursed=Det förbannade armbandet är knutet runt din handled, och på något sätt verkar din guldpåse sakta bli lättare...
items.artifacts.masterthievesarmband.desc_worn=Du känner hur kraften byggs upp i armbandet på din handled allt eftersom du får erfarenhet. Du kan använda den här kraften för att stjäla från butiker eller för att råna fiender! Att råna fiender sker omedelbart, desorienterar dem kortvarigt och ger dig en chans att få tag på det byte de har! Denna kraft är mer effektiv mot omedvetna fiender. Att råna samma fiende flera gånger ger inte fler chanser att plundra.
items.artifacts.masterthievesarmband.failed_steal=Du lyckades inte stjäla något.
items.artifacts.masterthievesarmband.full=Ditt armband är fulladdat!
items.artifacts.masterthievesarmband.level_up=Ditt armband blir starkare!
items.artifacts.masterthievesarmband.name=mästertjuvars armband
items.artifacts.masterthievesarmband.no_charge=Ditt armband har inte tillräckligt med laddning.
items.artifacts.masterthievesarmband.no_steal=Den fienden har ingenting att stjäla.
items.artifacts.masterthievesarmband.no_target=Du måste rikta in dig på en fiende som ligger intill dig.
items.artifacts.masterthievesarmband.prompt=Välj en fiende att rikta in dig på
items.artifacts.masterthievesarmband.steal_shopkeeper=Man kan inte stjäla direkt från butiksägare.
items.artifacts.masterthievesarmband.stole_item=Du stal ett föremål: %s.
items.artifacts.sandalsofnature.absorb_seed=Skorna absorberar fröet, de verkar friskare.
items.artifacts.sandalsofnature.ac_feed=FODER
items.artifacts.sandalsofnature.ac_root=ROT
items.artifacts.sandalsofnature.desc_1=Det som först ser ut som sandaler gjorda av snöre är egentligen två växter! De verkar väldigt svaga och bleka, kanske behöver de få näring?
items.artifacts.sandalsofnature.desc_2=Skorna har vuxit och liknar nu mer två skräddarsydda skor. De har fått tillbaka lite färg, kanske kan de växa ytterligare?
items.artifacts.sandalsofnature.desc_3=Växterna har vuxit igen och liknar nu ett par solida stövlar gjorda av bark. Växterna verkar ha återfått sin styrka, men kanske kan de fortfarande växa ytterligare?
items.artifacts.sandalsofnature.desc_4=Växterna verkar ha nått sin maximala storlek, de liknar ett par pansarben. Benen är djupt bruna och liknar ett mycket robust träd.
items.artifacts.sandalsofnature.desc_ability=Skodonet krusar färgen av det senaste fröet du matade dem. De kan kort rota sig i jorden och producera växtens effekt var som helst inom en radie av 3 rutor. \nFrö: _%s_\nLaddning behövs: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=De förbannade sandalerna blockerar all samhörighet med naturen.
items.artifacts.sandalsofnature.desc_hint=Du känner dig mer i samklang med naturen när du bär den här artefakten.
items.artifacts.sandalsofnature.desc_seeds=Du har matat skorna med %d frön.
items.artifacts.sandalsofnature.levelup=Dina skor ökar i storlek!
items.artifacts.sandalsofnature.low_charge=Dina skor har inte tillräckligt med energi för det.
items.artifacts.sandalsofnature.name=naturens sandaler
items.artifacts.sandalsofnature.name_1=skor av naturen
items.artifacts.sandalsofnature.name_2=naturens stövlar
items.artifacts.sandalsofnature.name_3=naturens grevar
items.artifacts.sandalsofnature.no_effect=Du måste först ge dina skor ett frö.
items.artifacts.sandalsofnature.out_of_range=Den platsen är utom räckhåll.
items.artifacts.sandalsofnature.prompt=Välj ett frö
items.artifacts.sandalsofnature.prompt_target=Välj en plats
items.artifacts.skeletonkey$keywall.desc=En tillfällig magisk vägg har placerats här av skelettnyckeln.
items.artifacts.skeletonkey.ac_insert=INFOGA
items.artifacts.skeletonkey.crystal_charges=Att öppna ett kristalllås kräver 5 laddningar.
items.artifacts.skeletonkey.cursed=Du kan inte använda en förbannad skelettnyckel.
items.artifacts.skeletonkey.desc=En viktig nyckel med ett huvud format som en skalle. Dess tänder verkar vara olika varje gång man tittar på dem.
items.artifacts.skeletonkey.desc_cursed=Den förbannade nyckeln verkar aktivt undvika att passa i något lås, och gör det till och med svårt (men inte omöjligt) för dig att använda dina andra nycklar.
items.artifacts.skeletonkey.desc_worn=Denna magiska nyckel verkar få kraft när du använder den istället för fängelsehålans vanliga nycklar. Den kan sättas in i nästan alla fängelsehålans lås för att antingen öppna eller stänga dem, inklusive dörrar som aldrig varit låsta tidigare. \n\n Nyckeln kan till och med användas på tomt utrymme i kardinal- eller diagonalriktning för att "låsa" luften framför dig, vilket skapar en 3 rutor bred solid vägg som varar i 10 omgångar. Låsning kommer att stöta bort fiender om det finns utrymme för det.
items.artifacts.skeletonkey.discard=Du slänger dina överflödiga nycklar.
items.artifacts.skeletonkey.force_lock=Låset har försvagats utan din skelettnyckel. Du lyckas öppna det med våld.
items.artifacts.skeletonkey.gold_charges=Att öppna ett guldlås kräver 2 laddningar.
items.artifacts.skeletonkey.invalid_target=Det finns inget att låsa eller upplåsa där.
items.artifacts.skeletonkey.iron_charges=Att öppna ett vanligt lås kräver 1 laddning.
items.artifacts.skeletonkey.levelup=Din skelettnyckel blir starkare!
items.artifacts.skeletonkey.lock_charges=Att låsa en dörr kräver 2 laddningar.
items.artifacts.skeletonkey.lock_no_space=Du kan inte låsa in en karaktär innanför en dörr!
items.artifacts.skeletonkey.locked_with_key=Den dörren var låst med din skelettnyckel.
items.artifacts.skeletonkey.name=skelettnyckel
items.artifacts.skeletonkey.prompt=Välj ett mål
items.artifacts.skeletonkey.wall_charges=Att bygga en tillfällig vägg kräver 2 laddningar.
items.artifacts.skeletonkey.wont_open=Nyckeln vägrar passa i det här låset av någon anledning.
items.artifacts.talismanofforesight$foresight.desc=Du känner dig väldigt nervös, som om det finns en osynlig fara i närheten.
items.artifacts.talismanofforesight$foresight.name=framsynthet
items.artifacts.talismanofforesight$foresight.uneasy=Du känner dig illa till mods.
items.artifacts.talismanofforesight.ac_scry=SKRY
items.artifacts.talismanofforesight.desc=En slät sten med märkliga gravyrer på. Det känns som att den iakttar allt omkring dig, håller utkik efter allt som är dolt.
items.artifacts.talismanofforesight.desc_cursed=Den förbannade talismanen stirrar intensivt in i dig och avslökar dina sinnen.
items.artifacts.talismanofforesight.desc_worn=När du håller i talismanen känns det som att dina sinnen förstärks. Talismanen bygger långsamt upp laddning allt eftersom tiden går och när du upptäcker gömda dörrar eller fällor. \n\n Talismanen kan använda sin laddning för att "skrika" i en konform, vilket avslöjar alla brickor och hemligheter i det skannade området och ger dig en kort sikt på fiender och föremål.
items.artifacts.talismanofforesight.full_charge=Din Talisman är fulladdad!
items.artifacts.talismanofforesight.levelup=Din Talisman blir starkare!
items.artifacts.talismanofforesight.low_charge=Talismanen kräver minst 5 % laddning för att skrika.
items.artifacts.talismanofforesight.name=framsynthetens talisman
items.artifacts.talismanofforesight.prompt=Välj en plats att skanna.
items.artifacts.timekeepershourglass$sandbag.desc=Den här lilla påsen med fin sand borde fungera perfekt med ditt timglas. \n\n Det verkar konstigt att butiksinnehavaren skulle ha just den här varan precis när du behöver den...
items.artifacts.timekeepershourglass$sandbag.levelup=Du lägger sanden i ditt timglas.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ditt timglas är fyllt med magisk sand!
items.artifacts.timekeepershourglass$sandbag.name=påse med magisk sand
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du har inget timglas att placera sanden i.
items.artifacts.timekeepershourglass$timefreeze.desc=Tiden är fryst runt dig, vilket gör att du kan utföra handlingar direkt. Effekten varar tills den avbryts eller ditt timglas tar slut på laddning. Att attackera eller använda magi kommer även att bryta denna effekt. \n\nVänder tills laddningen används: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Tidsfrysning
items.artifacts.timekeepershourglass.ac_activate=AKTIVERA
items.artifacts.timekeepershourglass.cursed=Du kan inte använda ett förbannat timglas.
items.artifacts.timekeepershourglass.deactivate=Du avaktiverar tidsfrysningen.
items.artifacts.timekeepershourglass.desc=Detta stora utsmyckade timglas ser ganska oansenligt ut, men du känner en stor kraft i dess fint snidade ram. När du roterar timglaset och ser sanden rinna kan du känna dess magi dra i dig, och att använda denna magi skulle säkert ge dig lite kontroll över tiden.
items.artifacts.timekeepershourglass.desc_cursed=Det förbannade timglaset är låst vid din sida, du kan känna hur det försöker manipulera ditt tidsflöde.
items.artifacts.timekeepershourglass.desc_hint=Timglaset verkar ha tappat lite sand, om man bara kunde hitta lite...
items.artifacts.timekeepershourglass.freeze=Frys tiden runt mig
items.artifacts.timekeepershourglass.name=tidtagarens timglas
items.artifacts.timekeepershourglass.no_charge=Ditt timglas har inte laddats tillräckligt för att vara användbart än.
items.artifacts.timekeepershourglass.onfreeze=Allt omkring dig fryser plötsligt till is.
items.artifacts.timekeepershourglass.onstasis=Världen verkar förändras runt omkring dig på ett ögonblick.
items.artifacts.timekeepershourglass.prompt=Hur skulle du vilja använda timglasets magi?\n\nMedan tiden är i stillastående rör sig tiden normalt medan du är frusen och helt osårbar, förbrukar upp till 2 laddningar åt gången.\n\nNär tiden är frusen kan du röra dig som om dina handlingar inte tar någon tid. Detta kan avaktiveras när som helst genom att använda timglaset eller attackera.
items.artifacts.timekeepershourglass.stasis=Satte mig själv i stagnation
items.artifacts.unstablespellbook.ac_add=TILLÄGGA
items.artifacts.unstablespellbook.ac_read=LÄSA
items.artifacts.unstablespellbook.blinded=Du kan inte läsa ur boken när du är blind.
items.artifacts.unstablespellbook.cursed=Du kan inte läsa från en förbannad trollformelbok.
items.artifacts.unstablespellbook.desc=Den här boken är i förvånansvärt bra skick med tanke på dess ålder. Den fräser och knastrar när man bläddrar i sidorna, och den böljar av instabil energi. Om du läser från den här boken finns det ingen som vet vilken besvärjelse du kan komma att kasta.
items.artifacts.unstablespellbook.desc_cursed=Den förbannade boken har bundit sig till dig, den hämmar din förmåga att använda de flesta skriftrullar.
items.artifacts.unstablespellbook.desc_empowered=Rullarna som du har lagt till i boken glöder av kraft. Du kommer att kunna välja den exotiska versionen av dessa rullars effekter, men till en extra kostnad.
items.artifacts.unstablespellbook.desc_index=Boken är ofullständig. Dess index pekar för närvarande på följande tomma sidor:
items.artifacts.unstablespellbook.infuse_scroll=Du ingjuter skriftrullens energi i boken.
items.artifacts.unstablespellbook.name=instabil trollformelbok
items.artifacts.unstablespellbook.no_charge=Din trollformel har slut på energi för tillfället.
items.artifacts.unstablespellbook.prompt=Välj en rullning
items.artifacts.unstablespellbook.read_empowered=Rullningen du lade till i trollformelboken svämmar över av energi. Du kan kanalisera antingen den vanliga eller exotiska versionen av denna rullnings effekt. \n\n Att välja den exotiska varianten kostar 2 avgifter istället för 1.
items.artifacts.unstablespellbook.unable_scroll=Du kan inte lägga till den här skriftrullen i boken.
items.artifacts.unstablespellbook.unknown_scroll=Du är inte säker på vilken typ av skriftrulle det här är än.
items.bags.bag.discover_hint=Du kan köpa den här varan i en butik.
items.bags.bag.name=ryggsäck
items.bags.magicalholster.desc=Detta smala hölster är tillverkat av exotiskt djurhud och besitter kraftfull magi som gör att det kan förvara en enorm mängd distansvapen.\n\nDu kan helt enkelt sträcka dig ner i väskan så hittar du alltid det föremål du letade efter.\n\nPå grund av hölstrets magi laddas trollstavar något snabbare och kastade vapen håller något längre inuti det.
items.bags.magicalholster.name=magiskt hölster
items.bags.potionbandolier.desc=Denna tjocka bandolier sitter runt bröstet som ett skärp och har många isolerade remmar för att hålla trolldrycksflaskor, din vattenbehållare eller flytande metallflaskor. \n\n Medan du är inuti bandoliern bör dina trolldrycker skyddas från kylan.
items.bags.potionbandolier.name=trolldryckbandolier
items.bags.scrollholder.desc=Den här rörformiga behållaren ser ut som att den skulle rymma en astronoms verktyg och diagram, men dina skriftrullar får lika bra plats. Det finns till och med några sidofack som fint skulle passa för trollformelkristaller, arcana nålar och arcana harts. \n\nHållaren ser inte särskilt brandfarlig ut, så dina skriftrullar bör vara eldsäkra inuti.
items.bags.scrollholder.name=rullhållare
items.bags.velvetpouch.desc=Denna lilla sammetspåse kan förvara många små föremål, såsom frön, runstenar och vissa alkemiingredienser.
items.bags.velvetpouch.discover_hint=En av hjältarna börjar med det här föremålet.
items.bags.velvetpouch.name=sammetspåse
items.bombs.arcanebomb.desc=Denna bomb har genomsyrats av svårbegripliga egenskaper. Den kommer att explodera i en kraftfull explosion liknande Goos uppblåsta attack och orsaka _%1$d-%2$d magisk skada_ på allt inom 2 rutor.
items.bombs.arcanebomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.arcanebomb.name=mystisk bomb
items.bombs.bomb$doublebomb.desc=En trave med två rejäla svartkrutsbomber, ser ut som att man får en gratis!
items.bombs.bomb$doublebomb.name=två bomber
items.bombs.bomb.ac_lightthrow=LJUS & KAST
items.bombs.bomb.desc=En ganska rejäl svartkrutsbomb. En explosion från denna bomb orsakar _%1$d-%2$d skada_ på allt i närheten och förstör viss terräng eller föremål i närheten.
items.bombs.bomb.desc_burning=Bombens tändrör brinner bort, håll avstånd eller släck den!
items.bombs.bomb.desc_fuse=Det ser ut som att det kommer ta ett par varv för säkringen att brinna ner när den väl tänds.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=Explosionen dödar dig...
items.bombs.bomb.rankings_desc=Dödad av en explosion
items.bombs.bomb.snuff_fuse=Du släcker snabbt bombens tändrör.
items.bombs.firebomb.desc=Denna bomb har modifierats för att explodera i ett större område, vilket orsakar _%1$d-%2$d skada_ och sprider ihållande lågor inom 2 rutor.
items.bombs.firebomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.firebomb.name=brandbomb
items.bombs.flashbangbomb.desc=Denna anpassade bomb kommer att utbryta i en explosion av ljus, ljud och elektricitet när den exploderar. Allt inom 2 rutor kommer att ta _%1$d-%2$d skada_ från explosionen, ytterligare 25%% skada från elektriciteten och bli bedövad i 10 rundor.
items.bombs.flashbangbomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.flashbangbomb.name=flashbang
items.bombs.frostbomb.desc=Denna bomb har modifierats för att explodera i ett större område, vilket orsakar _%1$d-%2$d skada_ och sprider en ihållande vindpust av frysande luft inom två rutor.
items.bombs.frostbomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.frostbomb.name=frostbomb
items.bombs.holybomb.desc=Denna bomb har modifierats för att blinka heligt ljus i ett större område när den exploderar. Allt inom 2 rutor kommer att ta _%1$d-%2$d skada_ från explosionen, och odöda eller demoniska fiender kommer att ta ytterligare 50%% skada från det heliga ljuset.
items.bombs.holybomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.holybomb.name=helig bomb
items.bombs.noisemaker.desc=Denna anpassade bomb kommer att upprepade gånger ge ifrån sig ljud när dess stubin går ur. När något vidrör bomben exploderar den och orsakar _%1$d-%2$d skada_ på allt inom 2 rutor!
items.bombs.noisemaker.desc_burning=Ljudmakaren tickar på, den kommer att explodera när något kommer i närheten!
items.bombs.noisemaker.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.noisemaker.name=ljudmakare
items.bombs.regrowthbomb.desc=Denna specialbyggda bomb kommer att stänka livgivande vätska överallt inom 3 rutor istället för att explodera. Området som fångas i explosionen kommer snabbt att få gräs och växter att gro. Du och alla allierade som fångas i explosionen kommer att helas som om de hade druckit en helande dryck.
items.bombs.regrowthbomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.regrowthbomb.name=återväxtbomb
items.bombs.shrapnelbomb.desc=Den här bomben har modifierats med metallbitar från DM-300, som kommer att splittras och flyga överallt när den exploderar, vilket orsakar _%1$d-%2$d skada_ över ett stort område runt bomben. Du gör bäst i att gömma dig bakom något när du använder den...
items.bombs.shrapnelbomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.shrapnelbomb.name=granatsplitterbomb
items.bombs.smokebomb.desc=Denna bomb har modifierats för att spy ut ett tjockt gasmoln samtidigt som den exploderar. Den kommer att orsaka _%1$d-%2$d skada_ och sprida höljande dimma inom 2 rutor.
items.bombs.smokebomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.smokebomb.name=rökbomb
items.bombs.woollybomb.desc=Denna anpassade bomb kommer att skapa ett brett fält av magiska får efter att ha exploderat. Explosionen kommer att orsaka _%1$d-%2$d skada_ på allt inom 2 rutor. Fåret kommer att blockera rörelse och överleva under en mycket lång tid! Fåret kommer dock inte att överleva lika länge i närvaro av mäktiga fiender, och kan manuellt fördrivas tidigare genom att interagera med dem.
items.bombs.woollybomb.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.bombs.woollybomb.name=ullbomb
items.brokenseal$warriorshield.desc_active=Krigarens brutna sigill hjälper honom för närvarande att hålla ut, vilket ger honom sköld utöver sin hälsa. Det finns en nedkylningstid efter att skölden initialt utlösts innan den kan användas igen.\n\nDenna sköld förfaller inte med tiden, utan kommer att upphöra om inga fiender är i närheten under några omgångar. När den slutar kommer all oanvänd sköld att minska nedkylningstiden, upp till maximalt 50%%.\n\nÅterstående sköld: %1$d.\n\nNuvarande nedkylningstid: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Krigaren har nyligen fått skydd från sitt brutna sigill och måste vänta tills han kan dra nytta av dess skyddande effekt igen. \n\n Återstående tur: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Krigarens sköldnedkylningstid är för närvarande negativ, vilket innebär att när hans sköld aktiveras kommer nedkylningstiden att vara lägre än de vanliga 150 turerna. Sköldens nedkylningstid kan reduceras till så lågt som -150 turar, vilket innebär att den omedelbart kommer att vara tillgänglig igen när den aktiveras. \n\nAktuell nedkylningstid: %d.
items.brokenseal$warriorshield.name=Krigarsköld
items.brokenseal.ac_affix=AFFIX
items.brokenseal.affix=Du fäster sigillet på din rustning!
items.brokenseal.choose_desc=Både denna rustning och det brutna sigillet bär en glyph. Välj vilken glyph som ska behållas.\n\nRustningglyf: %1$s\nTrasigt sigillglyf: %2$s\n\nObservera att om du väljer glyfen som för närvarande finns på rustningen kommer sigillet inte att kunna överföra den senare.
items.brokenseal.choose_title=Välj en teckenfönster
items.brokenseal.cursed_armor=Sigillet gäller inte förbannad rustning.
items.brokenseal.desc=Ett vaxsigill, fäst vid rustning som en symbol för tapperhet. Det har en bleknad skyddsruna graverad i mitten och är sprucket på mitten. \n\nA, ett minne från sitt hem, hjälper sigillet krigaren att hålla ut. Medan krigaren bär sigillet får hen omedelbart skydd när hen är på väg att skadas till hälften av sin hälsa eller lägre. \n\n Sigillet kan _fästas på rustning_ och flyttas mellan rustningar. Det kan bära en enda uppgradering med sig, så länge som uppgraderingen tillämpades på rustningen medan sigillet var fäst vid den.
items.brokenseal.discover_hint=En av hjältarna börjar med det här föremålet.
items.brokenseal.inscribed=Sigillet är ingraverat med en _%s._
items.brokenseal.name=bruten försegling
items.brokenseal.prompt=Välj en rustning
items.brokenseal.unknown_armor=Du måste först identifiera om rustningen är förbannad eller inte.
items.dewdrop.already_full=Du har redan full hälsa.
items.dewdrop.desc=En kristallklar daggdroppe.
items.dewdrop.name=daggdroppe
items.dewvial.ac_drink=DRICK
items.dewvial.auto_drink=Daggflaskan tömdes för att läka dina sår.
items.dewvial.collected=Du samlade en daggdroppe i din daggflaska.
items.dewvial.desc=Du kan spara överbliven dagg i den här lilla flaskan och dricka den senare. Om flaskan är full dricks daggen automatiskt när du är i livsfara.
items.dewvial.empty=Din daggflaska är tom!
items.dewvial.full=Din daggflaska är full!
items.dewvial.name=daggflaska
items.energycrystal.desc=En samling små magiska kristaller, fyllda med alkemisk energi. \n\nDessa kristaller är den vanligaste ingrediensen i alkemirecept och kan framställas i en alkemikruka genom att skrota förbrukningsartiklar.
items.energycrystal.name=energikristall
items.equipableitem.ac_equip=UTRUSTA
items.equipableitem.ac_unequip=AVRUSTA
items.equipableitem.curse_detected=Du känner att föremålet är förbannat precis innan du utrustar det!
items.equipableitem.unequip_cursed=Du kan inte ta bort ett förbannat föremål!
items.food.berry.desc=Detta lilla bär hittades av Jägarinnan bland fängelsehålans vegetation. Det kan ätas snabbt, återställer en liten mängd mättnadskänsla och kan innehålla ett användbart frö!
items.food.berry.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.
items.food.berry.eat_msg=Det bäret var gott!
items.food.berry.name=dungeon berry
items.food.blandfruit$chunks.desc=Den blandfruktiga frukten har exploderat vid kollisionen och lämnat kvar inerta bitar. \n\n Trots lite smuts verkar dessa stora bitar av kokt blandfrukt fullt ätbara.
items.food.blandfruit$chunks.name=blandfruktbitar
items.food.blandfruit.blindfruit=blindfrukt
items.food.blandfruit.cooked=kokt blandfrukt
items.food.blandfruit.desc=Så torr och obetydlig, kanske att koka den med en annan ingrediens skulle förbättra den.
items.food.blandfruit.desc_cooked=Frukten har fyllt sig efter att ha legat i grytan och har till och med absorberat egenskaperna hos fröet den tillagades med. Den kommer att ha samma effekt som vilken dryck som helst som fröet motsvarar.
items.food.blandfruit.desc_eat=Den ser ut att vara redo att ätas!
items.food.blandfruit.desc_throw=Det verkar ganska volatilt, det kanske är bäst att slänga det.
items.food.blandfruit.dreamfruit=magisk frukt
items.food.blandfruit.earthfruit=jordfrukt
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.firefruit=eldfrukt
items.food.blandfruit.icefruit=isfrukt
items.food.blandfruit.name=blandfrukt
items.food.blandfruit.raw=Du orkar inte äta den rå.
items.food.blandfruit.rotfruit=rotfrukt
items.food.blandfruit.sorrowfruit=sorgfrukt
items.food.blandfruit.starfruit=stjärnfrukt
items.food.blandfruit.stormfruit=stormfrukt
items.food.blandfruit.sunfruit=solfrukt
items.food.blandfruit.swiftfruit=snabbfrukt
items.food.chargrilledmeat.desc=Det ser ut som en hyfsad biff.
items.food.chargrilledmeat.discover_hint=Du kan skapa detta med hjälp av en annan matvara.
items.food.chargrilledmeat.name=grillat kött
items.food.food.ac_eat=ÄTA
items.food.food.desc=Inget märkvärdigt här: torkat kött, lite kex - sådana saker.
items.food.food.eat_msg=Den maten smakade utsökt!
items.food.food.name=ranson av mat
items.food.frozencarpaccio.better=Du mår bättre!
items.food.frozencarpaccio.desc=Det är en bit fryst rått kött. Det enda sättet att äta det är genom att skära tunna skivor av det. Och på det här sättet är det förvånansvärt gott.
items.food.frozencarpaccio.discover_hint=Du kan skapa detta med hjälp av en annan matvara.
items.food.frozencarpaccio.hard=Du känner hur din hud hårdnar!
items.food.frozencarpaccio.invis=Du ser dina händer bli osynliga!
items.food.frozencarpaccio.name=fryst carpaccio
items.food.frozencarpaccio.refresh=Uppfriskande!
items.food.meatpie.desc=En utsökt paj fylld med smakrikt kött. Denna kommer att mätta dig betydligt mer än någon annan måltid.
items.food.meatpie.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.food.meatpie.eat_msg=Den maten var otrolig!
items.food.meatpie.name=köttpaj
items.food.mysterymeat$placeholder.name=kött
items.food.mysterymeat.desc=Ät på egen risk!
items.food.mysterymeat.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.food.mysterymeat.eat_msg=Den maten smakade... konstigt.
items.food.mysterymeat.hot=Åh, det är varmt!
items.food.mysterymeat.legs=Du kan inte känna dina ben!
items.food.mysterymeat.name=mystiskt kött
items.food.mysterymeat.not_well=Du mår inte bra.
items.food.mysterymeat.stuffed=Du är proppmätt.
items.food.pasty$fishleftover.desc=Lite överskottsfisk från din föregående måltid. Du kan äta den när du vill för att återställa lite hunger.
items.food.pasty$fishleftover.eat_msg=Den maten smakade okej.
items.food.pasty$fishleftover.name=fiskrester
items.food.pasty.amulet_desc=Du har äntligen hittat den, den magiska amuletten av – vänta lite, det här är bara en folieinslagen choklad gjord för att se ut som amuletten! Den kommer inte att ge dig obegränsad kraft, men den kommer åtminstone att mätta dig och ge dig lite artefaktladdning. \n\nAprilskämt!
items.food.pasty.amulet_name=Yendors amulett?
items.food.pasty.cane_desc=En enorm sockersöt polkagrisstång. Den är stor nog att mätta dig, och sockret kan ge dina trollstavar lite extra laddning också. \n\nGod Jul!
items.food.pasty.cane_name=polkagrisstång
items.food.pasty.desc=En autentisk kornisk pasty med en traditionell fyllning av nötkött och potatis. Utsökt!
items.food.pasty.egg_desc=Ett stort chokladägg, insvept i färgglad gul folie. Det finns lätt tillräckligt med choklad här för att mätta dig, och sockret kan ge dina artefakter lite extra laddning. \n\n Glad Påsk!
items.food.pasty.egg_name=påskägg
items.food.pasty.fish_desc=En hel ångad fisk, magiskt konserverad på en bädd av grönsaker. Det är tradition att spara lite fisk till senare vid den här tiden på året, så att du sparar rester istället för att äta allt på en gång. Gott nytt kinesiskt år!
items.food.pasty.fish_name=ångkokt fisk
items.food.pasty.name=degliknande
items.food.pasty.pie_desc=En stor bit pumpapaj. Dess söta och kryddiga smak kommer att mätta dig och ge dig lite läkning. \n\n Glad Halloween!
items.food.pasty.pie_name=pumpapaj
items.food.pasty.rainbow_desc=Denna färgglada trolldryck är en sorts flytande mat. Förutom att stilla din hunger innehåller den lite magi som lugnar en intilliggande fiende som inte är boss, vilket gör dem tillfälligt tveksamma till att slåss mot dig. \n\n Glad Pride!
items.food.pasty.rainbow_name=regnbågsdryck
items.food.pasty.sparkling_desc=Denna mousserande dryck är en sorts flytande mat. Den stillar hunger och simulerar mousserande vin, men är egentligen inte alkoholhaltig. Den varma känslan i magen kommer att ge lite skydd. Gott nytt år!
items.food.pasty.sparkling_name=mousserande dryck
items.food.pasty.vanilla_desc=Denna stora bit vaniljkaka har färgglada strössel och blå frosting. Kakan gjordes för att fira åratal av erfarenhet, och kommer att ge dig en liten mängd av den upplevelsen när du äter den. \n\n Den ursprungliga Pixel Dungeon släpptes första gången den 4 december 2012. Grattis på födelsedagen Pixel Dungeon!
items.food.pasty.vanilla_name=blå kaka
items.food.phantommeat.desc=En stor, glittrande, genomskinlig biff, skuren från en fantompiraya. Detta magiska kött behöver inte tillagas och ger ett antal defensiva fördelar utöver att mätta dig fullständigt. När det äts ger det osynlighet, barkhud, viss läkning och botar många skadliga effekter.
items.food.phantommeat.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.food.phantommeat.name=fantomkött
items.food.smallration.desc=Det ser precis ut som en vanlig matranson, fast mindre.
items.food.smallration.discover_hint=Du kan köpa den här varan i en butik.
items.food.smallration.eat_msg=Den maten smakade okej.
items.food.smallration.name=liten matranson
items.food.stewedmeat.desc=Att koka köttet har renat det från alla sjukdomar eller parasiter. Det ska vara säkert att äta.
items.food.stewedmeat.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.food.stewedmeat.eat_msg=Den maten smakade okej.
items.food.stewedmeat.name=kokt kött
items.food.supplyration.desc=Denna ranson lämnades i fängelsehålan av och för medlemmar i tjuvgillet. Den är specifikt utformad för att ätas på språng och hjälpa till med allmänt skurkskap. \n\nÄven om den inte mättar lika mycket som en vanlig ranson, kan den ätas snabbt, ger lite direkt läkning och återställer en laddning till skurkens skuggmantel.
items.food.supplyration.discover_hint=Du kan hitta det här föremålet med hjälp av en specifik hjältetalang.
items.food.supplyration.name=utbudsranson
items.gold.desc=En hög med guldmynt. Samla guldmynt för att spendera dem senare i en butik.
items.gold.name=guld
items.heap.artifact=en artefakt
items.heap.chest=Bröst
items.heap.chest_desc=Du vet inte vad som finns inuti förrän du öppnar den!
items.heap.crystal_chest=Kristallkista
items.heap.crystal_chest_desc=Du kan se _%s_ inuti, men för att öppna kistan behöver du en kristallnyckel.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Låst bröst
items.heap.locked_chest_desc=Du vet inte vad som finns inuti förrän du öppnar den! Men för att öppna den behöver du en gyllene nyckel.
items.heap.remains=Hjältens kvarlevor
items.heap.remains_desc=Det här är allt som finns kvar från en av dina föregångare. Det kanske är värt att kontrollera om det finns några värdesaker.
items.heap.ring=en ring
items.heap.skeleton=Skelettrester
items.heap.skeleton_desc=Det här är allt som finns kvar av någon olycklig äventyrare. Kanske det är värt att kontrollera om det finns några värdesaker.
items.heap.tomb=Grav
items.heap.tomb_desc=Denna forntida grav kan innehålla något användbart, men dess ägare kommer säkerligen att motsätta sig att kontrollera det.
items.heap.wand=en trollstav
items.honeypot$shatteredpot.desc=Krukan har krossats, bara den klibbiga honungen som täcker dess väggar håller ihop den, och den faller sakta isär. \n\n Trots sitt trasiga tillstånd verkar biet fortfarande vilja skydda krukan.
items.honeypot$shatteredpot.name=krossad honungsgryta
items.honeypot.ac_shatter=SPLITTRAS
items.honeypot.desc=Denna stora honungsbur är egentligen bara fodrad med honung, istället hyser den ett jättebi! Den här typen av massiva bin brukar hålla sig i sina bikupor, kanske är burken någon sorts specialiserad fångstbur? Biet verkar ganska nöjd inuti burken med sin honung och surrar vaksamt åt dig när du tittar på det.
items.honeypot.name=honungsgryta
items.item.ac_drop=SLÄPPA
items.item.ac_throw=KASTA
items.item.curse=förbannelse
items.item.custom_note=Denna artikel har en anpassad anteckning: "_%s_"
items.item.custom_note_type=Den här typen av artikel har en anpassad anteckning: "_%s_"
items.item.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan.
items.item.prompt=Välj kastriktning
items.item.rankings_desc=Dödad av: %s
items.journal.alchemypage.desc=En riven sida från en guidebok om alkemi. \n\nDet mesta av texten är för liten för att läsas på avstånd, men man kan urskilja sidans titel: \n\n_"%s"_
items.journal.alchemypage.name=trasig alkemiboksida
items.journal.documentpage.desc=En ensam sida, förmodligen riven ur någon sorts bok. Du måste plocka upp den för att läsa den.
items.journal.documentpage.name=riven sida
items.journal.guidebook.desc=En äventyrarguide, lämnad här av någon som bestämde sig för att äventyr inte var för dem! Den här boken är magisk och kan få äventyrare att läsa en sida i rätt ögonblick. \n\nTrots den funktionen är boken mest populär på grund av de stora orden "Don't Panic!" skrivna med stora vänliga bokstäver på omslaget.
items.journal.guidebook.hint_desktop=Din guidebok har råd till dig! Klicka på den blinkande journalknappen (%s) längst upp till höger för att läsa den.
items.journal.guidebook.hint_mobile=Din guidebok har råd till dig! Tryck på den blinkande journalknappen uppe till höger för att läsa den.
items.journal.guidebook.hint_status=Guidebok
items.journal.guidebook.name=en sträng av dungeon-mästerskap
items.journal.guidepage.desc=En sönderriven sida från en äventyrsguide. \n\n Det mesta av texten är för liten för att läsas på avstånd, men man kan urskilja sidans titel: \n\n_"%s"_
items.journal.guidepage.name=trasig guideboksida
items.journal.regionlorepage$caves.desc=Det som ser ut att vara en anteckning i en upptäcktsresandes loggbok, förvånansvärt väl bevarad trots hur gammal den måste vara. Plocka upp den för att läsa den.
items.journal.regionlorepage$caves.name=gammal loggpost
items.journal.regionlorepage$city.desc=En liten rostig metalltavla med ett magiskt etsat budskap. Bokstäverna är fortfarande tydliga trots tavlans ålder, men du måste plocka upp den för att läsa den.
items.journal.regionlorepage$city.name=rostig tablett
items.journal.regionlorepage$halls.desc=En liten svart tavla med lysande gröna bokstäver inristade i den. De lysande bokstäverna suddas ut till en dis på avstånd, du måste plocka upp den för att läsa den.
items.journal.regionlorepage$halls.name=glödande surfplatta
items.journal.regionlorepage$prison.desc=En dagboksanteckning, eller någon annan sorts uppteckning, skriven på ett gammalt papper. Den verkar ha klarat sig bättre än breven du hittade i avloppet, men du måste fortfarande plocka upp den för att läsa den.
items.journal.regionlorepage$prison.name=sliten journalpost
items.journal.regionlorepage$sewers.desc=Vad som ser ut att vara ett brev, skrivet på ett smutsigt papper. Du måste plocka upp det för att kunna urskilja vad som står på det.
items.journal.regionlorepage$sewers.name=sliten bokstav
items.keys.crystalkey.desc=De snittade ytorna på denna kristallklara nyckel skimrar i mörkret. Kanske öppnar den något gjort av kristall?
items.keys.crystalkey.name=Kristallnyckel
items.keys.goldenkey.desc=Skårorna på den här gyllene nyckeln är små och invecklade. Kanske öppnar den en låst kista?
items.keys.goldenkey.name=gyllene nyckel
items.keys.ironkey.desc=Skårorna på denna gamla järnnyckel är välnötta; dess läderrem är sliten av ålder. Vilken dörr skulle den kunna öppna?
items.keys.ironkey.name=järnnyckel
items.keys.skeletonkey.name=skelettnyckel
items.keys.wornkey.desc=Den här nyckeln är sliten och missfärgad, men ser seriös ut. Förmodligen kan den öppna någon seriös dörr i närheten.
items.keys.wornkey.name=sliten nyckel
items.kindofmisc.unequip_message=Du måste först avutrustninga ett av dessa föremål. Välj ett föremål att byta med.
items.kindofmisc.unequip_title=Avutrustninga ett föremål
items.kindofweapon.empty=tömma
items.kindofweapon.equip_cursed=Ditt grepp stramar ofrivilligt runt vapnet.
items.kindofweapon.swift_equip=Du utrustar snabbt ditt vapen.
items.kindofweapon.which_equip_msg=Vilken vapenplats vill du utrusta den här föremålet till?\n\nMästaren attackerar direkt med sitt primära vapen, men kan använda förmågan hos båda vapnen. Båda vapnen delar samma laddningsantal.\n\nMästaren kan också byta ut sitt primära och sekundära vapen direkt.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kingscrown.ac_wear=BÄRA
items.kingscrown.desc=Den siste dvärgkungens krona, den glöder med enorm magisk energi. \n\nNär kronan bärs kommer den att flöda in i rustningen du för närvarande bär och förvandla den till en _unik episk rustning med speciella förmågor._ Den nya rustningen kommer att behålla alla egenskaper hos den ursprungliga rustningen.
items.kingscrown.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.kingscrown.naked=Tyvärr kan kronan inte förvandla dina underkläder.
items.kingscrown.name=Dvärgkungens krona
items.kingscrown.ratgraded=Råttkungens tassar lyser starkt när din rustning förvandlas!
items.kingscrown.upgraded=Kronan lyser starkt och sönderfaller sedan när din rustning förvandlas!
items.liquidmetal.ac_apply=TILLÄMPAS
items.liquidmetal.already_fixed=Det där kastade vapnet är redan i perfekt skick!
items.liquidmetal.apply=Du använder %d flytande metall för att reparera ditt kastade vapen.
items.liquidmetal.desc=Denna magiska vätska kan fylla i sprickor och revor på ett kastat vapen och återställa det till perfekt skick! Om en vapenuppsättning saknar ett vapen men i övrigt är helt reparerat, kan flytande metall till och med användas för att ersätta ett saknat vapen från uppsättningen!\n\nA Nivå 1-vapen kräver 10 flytande metall för att repareras helt, ett nivå 5-vapen kräver 30. Varje uppgradering ökar också mängden metall som behövs med 35%.\n\nFlytande metall kan inte användas för att reparera spetsarna på spetsiga pilar.
items.liquidmetal.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.liquidmetal.name=flytande metall
items.liquidmetal.prompt=Välj ett kastat vapen
items.lostbackpack.desc=Detta är ditt förlorade inventarium. Samla det för att återta alla föremål du förlorat!
items.lostbackpack.name=förlorad ryggsäck
items.merchantsbeacon.ac_use=ANVÄNDA
items.merchantsbeacon.desc=Denna udda dvärgteknologi låter dig kommunicera på stora avstånd.\n\nEfter att ha aktiverats låter denna fyr dig sälja föremål till Pixel Mart var som helst i fängelsehålan.\n\nMagin i fyren varar dock bara i en session, så använd den klokt.
items.merchantsbeacon.name=köpmannens fyr
items.potions.brews.aquabrew.desc=När den krossas kommer denna brygd att släppa ut en explosion av trycksatt vatten på platsen. Den är bara tillräckligt kraftfull för att skada eldiga fiender, men den sprider också vatten till närliggande terräng, avaktiverar fällor, släcker bränder och slår tillbaka karaktärer nära explosionen.
items.potions.brews.aquabrew.name=vattenbrygd
items.potions.brews.blizzardbrew.desc=När denna brygd krossas kommer den att utlösa en virvlande snöstorm som snabbt sprider sig som en gas.
items.potions.brews.blizzardbrew.name=snöstormsbrygd
items.potions.brews.brew.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.potions.brews.causticbrew.desc=Denna brygd kommer att sprida frätande slem över ett brett område runt den plats den splittras på. Allt som fångas upp av slemmet kommer långsamt att smälta om det inte kan tvättas bort i vatten.
items.potions.brews.causticbrew.name=kaustisk brygd
items.potions.brews.infernalbrew.desc=När denna brygd krossas kommer den att utlösa en rasande eld som snabbt sprider sig som en gas.
items.potions.brews.infernalbrew.name=infernal brygd
items.potions.brews.shockingbrew.desc=När denna brygd splittras kommer den att utlösa en elektrisk storm i ett stort område runt den plats där den går sönder.
items.potions.brews.shockingbrew.name=chockerande brygd
items.potions.brews.unstablebrew.desc=Denna magiska dryck glöder med regnbågens skiftande färger. \n\n När den dricks eller kastas utlöser den effekten av en slumpmässig dryck. Dryckeseffekten är alltid gynnsam om den dricks och skadlig om den kastas.
items.potions.brews.unstablebrew.name=instabil brygd
items.potions.elixirs.elixir.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du har tillfälligt fått återställande egenskaper som liknar Goos.\n\nMedan du står i vatten återställer du en liten mängd hälsa per tur. Effekten pausas när du är full hälsa eller är ur vattnet.\n\nLäkning vänster: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=vattenläkning
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Detta elixir innehåller resterna av Goo förstärkt med en helande dryck. Även om det inte ger omedelbar läkning, kommer det stadigt att återställa en större mängd hälsa medan du står i vatten.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir för vattenföryngring
items.potions.elixirs.elixirofarcanearmor.desc=Detta elixir ger drickaren ett långvarigt motstånd mot magisk skada.
items.potions.elixirs.elixirofarcanearmor.name=elixir av arkan rustning
items.potions.elixirs.elixirofdragonsblood.desc=När detta elixir konsumeras skickar det eldig kraft genom drickarens ådror. Denna effekt gör drickaren immun mot eld och låter dem sätta fiender i brand med fysiska attacker.
items.potions.elixirs.elixirofdragonsblood.name=elixir av drakens blod
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du är under effekterna av ett fjäderfallselixir, vilket gör att du kan falla ner i avgrunder utan att ta skada!\n\nÅterstående tur: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=fjäderfall
items.potions.elixirs.elixiroffeatherfall.desc=Detta elixir erbjuder en svagare men mer kontrollerad levitationseffekt, vilket gör att den som dricker kan falla stora avstånd utan att skadas under en kort stund.
items.potions.elixirs.elixiroffeatherfall.light=Du känner dig lätt som en fjäder!
items.potions.elixirs.elixiroffeatherfall.name=elixir av fjäderfall
items.potions.elixirs.elixirofhoneyedhealing.desc=Detta elixir kombinerar läkning med honungens sötma. När det dricks har det samma effekt som en läkande dryck och stillar en liten mängd hunger, men det kan också kastas för att läka en allierad. \n\nVarelser med en förkärlek för honung kan bli lugnade om detta föremål används på dem.
items.potions.elixirs.elixirofhoneyedhealing.name=elixir av honungsliknande läkning
items.potions.elixirs.elixiroficytouch.desc=När detta elixir konsumeras, kommer det att låta drickaren suga ut värmen från fiender de attackerar. Denna effekt gör drickaren immun mot kyla och låter dem kyla ner fiender med fysiska attacker.
items.potions.elixirs.elixiroficytouch.name=elixir av isig beröring
items.potions.elixirs.elixirofmight$htboost.desc=Din kropp känns onaturligt stark och hälsosam.\n\nDin maximala hälsa boostas under en längre tid. Allt eftersom du går upp i nivåer kommer boosten stadigt att avta.\n\nAktuell boostmängd: %d.\nÅterstående nivåer: %d.
items.potions.elixirs.elixirofmight$htboost.name=maximal hälsoökning
items.potions.elixirs.elixirofmight.desc=Denna kraftfulla vätska kommer att strömma genom dina muskler, vilket permanent ökar din styrka med en poäng och tillfälligt ökar din maximala hälsa med %d poäng. Hälsoökningen skalas upp med din maximala hälsa, men kommer sakta att avta allt eftersom du går upp i nivåer.
items.potions.elixirs.elixirofmight.msg=Nyfunnen styrka väller genom din kropp, du har nu %d styrka!
items.potions.elixirs.elixirofmight.name=maktens elixir
items.potions.elixirs.elixiroftoxicessence.desc=När detta elixir konsumeras kommer det att ge drickaren giftig energi. Drickaren kommer kontinuerligt att sprida giftig gas när hen rör sig och kommer att vara immun mot giftig gas och gift något längre än effekten varar.
items.potions.elixirs.elixiroftoxicessence.name=elixir av giftig essens
items.potions.exotic.exoticpotion.amber=exotisk bärnstensdryck
items.potions.exotic.exoticpotion.azure=exotisk azurblå dryck
items.potions.exotic.exoticpotion.bistre=exotisk bistrodryck
items.potions.exotic.exoticpotion.charcoal=exotisk koldryck
items.potions.exotic.exoticpotion.crimson=exotisk karmosinröd dryck
items.potions.exotic.exoticpotion.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.potions.exotic.exoticpotion.golden=exotisk gyllene dryck
items.potions.exotic.exoticpotion.indigo=exotisk indigodryck
items.potions.exotic.exoticpotion.ivory=exotisk elfenbensdryck
items.potions.exotic.exoticpotion.jade=exotisk jadedryck
items.potions.exotic.exoticpotion.magenta=exotisk magenta dryck
items.potions.exotic.exoticpotion.no=Nej, jag ändrade mig
items.potions.exotic.exoticpotion.silver=exotisk silverdryck
items.potions.exotic.exoticpotion.turquoise=exotisk turkos dryck
items.potions.exotic.exoticpotion.unknown_desc=Denna runda flaska innehåller en kornig, färgglad vätska. Den verkar vara främmande för detta land, vem vet vad den kan göra om den dricks eller kastas?
items.potions.exotic.exoticpotion.warning=Vill du verkligen avbryta användningen av den här trolldrycken? Den kommer att konsumeras ändå.
items.potions.exotic.exoticpotion.yes=Ja, jag är säker
items.potions.exotic.potionofcleansing$cleanse.desc=Denna karaktär är tillfälligt immun mot alla skadliga statuseffekter!\n\nÅterstående turar: %s.
items.potions.exotic.potionofcleansing$cleanse.name=rengjord
items.potions.exotic.potionofcleansing.desc=Detta kraftfulla reagens gör drickaren immun mot alla skadliga statuseffekter i några omgångar när den svalsar. Det kan också kastas mot ett mål för att rena dem.
items.potions.exotic.potionofcleansing.name=reningsdryck
items.potions.exotic.potionofcorrosivegas.desc=Om man lossar eller krossar detta trycksatta glas kommer innehållet att explodera till ett dödligt moln av frätande rostfärgad gas. Gasen sprids snabbare än giftig gas och är mer dödlig, men den varar inte heller lika länge.
items.potions.exotic.potionofcorrosivegas.name=dryck av frätande gas
items.potions.exotic.potionofdivineinspiration.bonus=+2 talangpoäng!
items.potions.exotic.potionofdivineinspiration.desc=Den heliga energins kraft reduceras till flytande form. Denna dryck kommer att genomsyra drickaren med gudomlig kraft och ge dem två bonustalangpoäng i en nivå de själva väljer. \n\nDenna dryck kan bara användas en gång för varje talangnivå.
items.potions.exotic.potionofdivineinspiration.name=trolldryck av gudomlig inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kan inte få fler bonustalangpoäng.
items.potions.exotic.potionofdivineinspiration.select_tier=Välj en talangnivå för att få två bonuspoäng. Du måste ha låst upp nivån för att kunna spendera poängen.
items.potions.exotic.potionofdragonsbreath.desc=Denna flaska innehåller en ovanlig förening som fattar eld kort efter att den blandats med saliv. Genom att snabbt spotta ut vätskan kan användaren spy ut lågor ur munnen!
items.potions.exotic.potionofdragonsbreath.name=drakens andedräktsdryck
items.potions.exotic.potionofdragonsbreath.prompt=Välj en plats att bränna
items.potions.exotic.potionofearthenarmor.desc=Istället för att förlama har denna vätska en härdande effekt på huden som förvandlar den till en tillfällig naturlig rustning.
items.potions.exotic.potionofearthenarmor.name=trolldryck av jordpansar
items.potions.exotic.potionofmagicalsight.desc=Efter att ha druckit detta kommer dina sinnen kortvarigt att höjas till otroliga nivåer, så att du kan se genom väggar inom en radie av 12 kakelplattor!
items.potions.exotic.potionofmagicalsight.name=trolldryck av magisk syn
items.potions.exotic.potionofmastery.armor_easier=Din rustning blir lättare att bära!
items.potions.exotic.potionofmastery.desc=Istället för att ge rå styrka, kommer denna dryck istället att stämma av användarens muskler på ett visst föremål. Detta kommer att göra föremålet lättare att använda, som om drickaren hade övat med det och byggt upp muskelminne. \n\nDet valda vapnet eller rustningen kräver 2 poäng mindre styrka för att användas. Denna dryck kan bara användas en gång på varje föremål.
items.potions.exotic.potionofmastery.name=mästerskapsdryck
items.potions.exotic.potionofmastery.prompt=Behärska ett objekt
items.potions.exotic.potionofmastery.weapon_easier=Ditt vapen blir lättare att använda!
items.potions.exotic.potionofshielding.desc=Istället för att läka, kommer denna dryck istället att projicera en hållbar sköld runt användarens kropp och blockera en avsevärd mängd skada.
items.potions.exotic.potionofshielding.name=skölddryck
items.potions.exotic.potionofshroudingfog.desc=När vätskan i denna flaska utsätts för luft kommer den att producera en tjock rökig dimma som snabbt sprider sig och blockerar dina fienders sikt.
items.potions.exotic.potionofshroudingfog.name=trolldryck av höljande dimma
items.potions.exotic.potionofsnapfreeze.desc=Kemikalien i denna dryck reagerar snabbt med luften, fryser omedelbart och rotar allt inom dess effekt.
items.potions.exotic.potionofsnapfreeze.name=Snap Freeze-dryck
items.potions.exotic.potionofstamina.desc=Att dricka denna märkligt söta vätska kommer att ge dig en långvarig energikick, vilket gör att du kan springa i ett snabbare tempo under en längre tid.
items.potions.exotic.potionofstamina.name=uthållighetsdryck
items.potions.exotic.potionofstormclouds.desc=Att kasta denna dryck skapar ett snabbt spridd moln av koncentrerad ånga, som kondenserar och strömmar ner över omgivningen. Större delen av terrängen kommer att omvandlas till vatten, eldiga fiender kommer att ta skada, eld kommer att släckas och fällor kommer att överväldigas och spricka.
items.potions.exotic.potionofstormclouds.name=trolldryck av stormmoln
