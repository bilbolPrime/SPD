items.artifacts.artifact.need_to_equip=Du måste utrusta din artefakt för att göra det.
items.artifacts.artifact.not_cursed=Denna artefakt är fri från ondskefull magi.
items.artifacts.capeofthorns$thorns.desc=Din mantel utstrålar energi och omger dig i ett fält av avböjande kraft!\n\nAll skada du får minskas medan törneeffekten är aktiv. Om angriparen är bredvid dig avböjs dessutom den reducerade mängden tillbaka mot angriparen.\n\nÅterstående törneomgångar: %s.
items.artifacts.capeofthorns$thorns.inert=Din Kap blir inert igen.
items.artifacts.capeofthorns$thorns.levelup=Din kappa blir starkare!
items.artifacts.capeofthorns$thorns.name=törnen
items.artifacts.capeofthorns$thorns.radiating=Din Kap börjar utstråla energi, du känner dig skyddad!
items.artifacts.capeofthorns.desc=Dessa kollapsade metallplåtar från DM-300 har bildat en stel kappa. Den verkar lagra en djup energi, kanske innehåller den lite av DM-300:s kraft?
items.artifacts.capeofthorns.desc_active=Kapellet verkar frigöra lagrad energi, den utstrålar en skyddande kraft.
items.artifacts.capeofthorns.desc_inactive=Kappan känns betryggande tung på dina axlar, den verkar få energi från skadan du tar.
items.artifacts.capeofthorns.name=törneudden
items.artifacts.chaliceofblood.ac_prick=STICKA
items.artifacts.chaliceofblood.desc=Denna glänsande silverkalk är märkligt prydd med vassa ädelstenar vid kanten.
items.artifacts.chaliceofblood.desc_1=När du håller i kalken känner du dig konstigt nog tvungen att sticka dig själv i de vassa ädelstenarna.
items.artifacts.chaliceofblood.desc_2=En del av ditt blod samlas i kalken, du kan subtilt känna kalken mata dig med livsenergi, vilket ökar din naturliga hälsoåterhämtning. Du vill fortfarande skära dig på kalken, även om du vet att det kommer att göra ont.
items.artifacts.chaliceofblood.desc_3=Kalken är fylld till brädden med din livsessens. Du kan känna kalken strömma tillbaka in i dig.
items.artifacts.chaliceofblood.desc_cursed=Den förbannade kalken har bundit sig till din hand och hämmar din förmåga att återfå hälsa.
items.artifacts.chaliceofblood.name=blodkalk
items.artifacts.chaliceofblood.no=Nej, jag ändrade mig
items.artifacts.chaliceofblood.ondeath=Kalken suger ut din livsessens...
items.artifacts.chaliceofblood.onprick=Du sticker dig själv, och din livsessens rinner ner i kalken.
items.artifacts.chaliceofblood.prick_warn=Varje gång du använder kalken kommer den att dränera mer av din livsenergi, men den kommer i gengäld ytterligare att förbättra din naturliga hälsoåteruppbyggnad.\n\nAtt sticka dig själv för närvarande kommer att orsaka _%1$d-%2$d skada_, även om denna skada kan minskas genom _både fysisk och magisk blockering eller skadereducering._ Utan att beakta effekterna av skadereducering har stickning av dig själv för närvarande en _%3$s%% chans_ att dränera din livskraft helt.\n\nÄr du säker på att du vill erbjuda kalken mer livsenergi?
items.artifacts.chaliceofblood.yes=Ja, jag vet vad jag gör
items.artifacts.cloakofshadows$cloakstealth.desc=Din skuggmantel ger dig osynlighet medan du är höljd i den. Du kommer att förbli höljd tills den avaktiveras eller din mantel tar slut på laddning.\n\nMedan du är osynlig kan fiender inte attackera eller följa dig. Fysiska attacker och magiska effekter (som skriftrullar och trollstavar) kommer omedelbart att avaktivera osynligheten.\n\nVänder sig tills laddningen används: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Din mantel blir starkare!
items.artifacts.cloakofshadows$cloakstealth.name=maskerad
items.artifacts.cloakofshadows$cloakstealth.no_charge=Din mantel har slut på energi.
items.artifacts.cloakofshadows.ac_stealth=STEALTH
items.artifacts.cloakofshadows.cooldown=Din mantel behöver %d fler rundor för att återupplivas.
items.artifacts.cloakofshadows.cursed=Du kan inte använda en förbannad mantel.
items.artifacts.cloakofshadows.desc=En ovärderlig magisk mantel, stulen från det kungliga vapenförrådet för många år sedan av Rogue. När den bärs kan den användas för att bli helt osynlig under en kort tid. \n\n Ju mer manteln används, desto starkare blir den, vilket gör att Rogue kan bli osynlig oftare och under längre perioder.
items.artifacts.cloakofshadows.discover_hint=En av hjältarna börjar med det här föremålet.
items.artifacts.cloakofshadows.name=skuggornas mantel
items.artifacts.cloakofshadows.no_charge=Din mantel har inte laddats tillräckligt för att vara användbar än.
