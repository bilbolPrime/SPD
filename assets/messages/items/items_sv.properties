items.rings.ring.unknown_desc=Den här metallringen är prydd med %s som glittrar i mörkret. Vem vet vilken verkan den har när man bär den?
items.rings.ringofaccuracy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din noggrannhet med totalt _%s%%_.
items.rings.ringofaccuracy.desc=Den här ringen ökar din chans att träffa fienden.
