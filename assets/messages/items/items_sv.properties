items.armor.armor.seal_attached=Krigarens brutna sigill är fäst vid denna rustning. När han är på väg att skadas under halv hälsa, kommer den att ge honom _%d sköld_.
items.armor.armor.seal_transfer=Krigarens brutna sigill måste fästas på den rustning han för närvarande bär för att gynna honom. Vill du automatiskt lossa sigillet från rustningen du tar av dig och fästa det på rustningen du utrustar?
items.armor.armor.seal_transfer_no=inga
items.armor.armor.seal_transfer_yes=ja
items.armor.armor.too_heavy=På grund av din otillräckliga styrka kommer att bära denna rustning att minska din förmåga att röra dig, undvika och försvara dig.
items.armor.armor.weak_cursed=Trots förbannelsen kan du avutrustningen av denna rustning.
