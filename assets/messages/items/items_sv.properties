items.rings.ringofenergy.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar laddningshastigheten med totalt _%s%%_.
items.rings.ringofenergy.desc=Din magiska utrustning kommer att laddas snabbare i det mystiska fältet som strålar ut från den här ringen. En förbannad ring kommer istället att laddas långsammare.
items.rings.ringofenergy.name=ring av energi
items.rings.ringofenergy.stats=När den här ringen bärs ökar den laddningshastigheten för trollstav, artefakt och heroisk rustning med _%s%%._
items.rings.ringofenergy.typical_stats=När den här ringen bärs ökar den vanligtvis laddningshastigheten för trollstav, artefakt och heroisk rustning med _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Laddningsboost
items.rings.ringofevasion.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar din undvikande förmåga med totalt _%s%%_.
items.rings.ringofevasion.desc=Den här ringen ökar din chans att undvika fiendens angrepp.
items.rings.ringofevasion.name=undvikningsringen
items.rings.ringofevasion.stats=När den här ringen bärs kommer den att öka din undvikning med _%s%%._
items.rings.ringofevasion.typical_stats=När den här ringen bärs kommer den vanligtvis att öka din undvikning med _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Undvikningsboost
items.rings.ringofforce$brawlersstance.desc=I den här ställningen använder duelisten i sina vanliga attacker en utrustad kraftring, även när hon har ett vapen utrustat. Dessa attacker ger bonusskada och använder fortfarande vapnets förstärkning och förtrollning. \n\nAtt bibehålla denna ställning kräver dock fokus, vilket minskar vapnets laddningshastighet med 50%. \n\nDenna ställning kan slås på eller av med hjälp av en kraftring, men minskningen av laddningshastigheten kommer att bestå ett tag om ställningen aktiveras och avaktiveras snabbt.
items.rings.ringofforce$brawlersstance.name=slagskämpens hållning
items.rings.ringofforce.ability_desc=Duelisten kan anta en _brawlers hållning_ med denna ring, vilket gör att hennes vanliga attacker alltid använder denna ring även med ett vapen utrustat med det. Dessa attacker kommer att göra _%1$d-%2$d skada_ och kommer även att ärva vapnets förtrollning och förstärkning. Denna hållning saktar ner vapnets laddningshastighet med 50%%.
items.rings.ringofforce.ability_name=slagskämpens hållning
items.rings.ringofforce.combined_stats=Dina utrustade ringar kombinerar sin kraft och gör totalt _%1$d-%2$d skada_ utan ett vapen, eller ökar skadan med _%3$d_ med ett.
items.rings.ringofforce.desc=Denna ring förstärker kraften i bärarens närstridsslag. Denna extra kraft är ganska svag när man använder vapen, men en obeväpnad attack blir mycket starkare. En förbannad ring försvagar istället bärarens slag.
items.rings.ringofforce.name=kraftens ring
items.rings.ringofforce.stats=När den är obeväpnad, med din nuvarande styrka, kommer den här ringen att göra _%1$d-%2$d skada._ Med ett vapen utrustat kommer den här ringen att öka skadan med _%3$d._
items.rings.ringofforce.typical_ability_desc=Duelisten kan anta en _brawlers hållning_ med denna ring, vilket gör att hennes vanliga attacker alltid använder denna ring även med ett vapen utrustat med det. Dessa attacker kommer vanligtvis att göra _%1$d-%2$d skada_ och kommer också att ärva vapnets förtrollning och förstärkning. Denna hållning saktar ner vapnets laddningshastighet med 50%%.
items.rings.ringofforce.typical_stats=När den är obeväpnad, med din nuvarande styrka, kommer den här ringen vanligtvis att göra _%1$d-%2$d skada._ Med ett vapen utrustat kommer den vanligtvis att öka skadan med _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Obeväpnad skada
items.rings.ringofforce.upgrade_stat_name_2=Beväpnad skadaökning
items.rings.ringofforce.upgrade_stat_name_3=Förmåga Skada
items.rings.ringoffuror.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar hastigheten på dina attacker med totalt _%s%%_.
items.rings.ringoffuror.desc=Denna ring ger bäraren en inre ilska, vilket gör att hen kan attackera snabbare. En förbannad ring kommer istället att sakta ner bärarens attackhastighet.
items.rings.ringoffuror.name=ring av furor
items.rings.ringoffuror.stats=När den här ringen bärs kommer den att öka hastigheten på dina attacker med _%s%%._
items.rings.ringoffuror.typical_stats=När den här ringen bärs kommer den vanligtvis att öka hastigheten på dina attacker med _%s%%._
