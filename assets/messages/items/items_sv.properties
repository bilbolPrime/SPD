items.rings.ringofhaste.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din rörelsehastighet med totalt _%s%%_.
items.rings.ringofhaste.desc=Den här ringen får tiden att gå snabbare för bäraren, så att alla handlingar går lite fortare.
items.rings.ringofhaste.name=snabbhetens ring
items.rings.ringofhaste.stats=När den bärs kommer den här ringen att öka din rörelsehastighet med _%s%%._
