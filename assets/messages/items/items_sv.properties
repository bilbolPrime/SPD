items.rings.ringofmight.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar din styrka med _%1$d_ och maximala HP med _%2$s%%_ totalt.
items.rings.ringofmight.desc=Denna ring förstärker bärarens fysiska egenskaper och ger denne större fysisk styrka och konstitution. En förbannad ring kommer att försvaga bäraren.
items.rings.ringofmight.name=maktens ring
