items.rings.ringofmight.typical_stats=När den bärs kommer den här ringen vanligtvis att öka din styrka med _%1$d_ och din maximala HP med _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=styrkeökning
items.rings.ringofmight.upgrade_stat_name_2=Max HP-ökning
items.rings.ringofsharpshooting.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket ökar nivån av effektiva kastade vapen med _%1$d_ och ökar deras hållbarhet med _%2$s%%_ totalt.
items.rings.ringofsharpshooting.desc=Denna ring förbättrar bärarens precision och sikte, vilket gör alla projektilvapen mer skadliga och hållbara. En förbannad ring har motsatt effekt.
items.rings.ringofsharpshooting.name=ring av skarpskytte
items.rings.ringofsharpshooting.stats=När den här ringen bärs kommer den att öka skadan på dina kastade vapen som om deras nivå hade ökat med _%1$d_, och öka deras hållbarhet med _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=När den här ringen bärs kommer den vanligtvis att öka skadan på dina kastade vapen som om deras nivå ökades med _%1$d_ och öka deras hållbarhet med _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Nivåskadaökning
items.rings.ringofsharpshooting.upgrade_stat_name_2=Hållbarhetsökning
items.rings.ringoftenacity.combined_stats=Dina utrustade ringar kombinerar sin kraft, vilket minskar skadan du tar med upp till _%s%%_ totalt.
items.rings.ringoftenacity.desc=När den bärs kommer den här ringen att göra det möjligt för bäraren att motstå normalt dödliga slag. Ju mer skadad användaren är, desto mer motståndskraftig kommer hen att vara mot skador. En förbannad ring kommer istället att göra det lättare för fiender att avrätta bäraren.
items.rings.ringoftenacity.name=en ring av ihärdighet
items.rings.ringoftenacity.stats=När den bärs kommer den här ringen att minska skadan du tar med upp till _%s%%._
items.rings.ringoftenacity.typical_stats=När den bärs minskar den här ringen vanligtvis skadan med upp till _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maximal skademotståndskraft
items.rings.ringofwealth.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar din tur med totalt _%s%%_.
items.rings.ringofwealth.desc=Den här ringen fungerar som en magnet för skatter, vilket ökar sannolikheten för att fiender och behållare bär värdefulla föremål. En förbannad ring minskar istället din chans att få byte.
items.rings.ringofwealth.name=ring av rikedom
items.rings.ringofwealth.stats=När den här ringen bärs kommer den att öka din tur med _%s%%._
items.rings.ringofwealth.typical_stats=När den här ringen bärs kommer den vanligtvis att öka din tur med _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Turboost
items.scrolls.exotic.exoticscroll.berkanan=exotisk skriftrulle av BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.scrolls.exotic.exoticscroll.gyfu=exotisk skriftrulle av GYFU
items.scrolls.exotic.exoticscroll.isaz=exotisk rullning av ISAZ
items.scrolls.exotic.exoticscroll.kaunan=exotisk rullning av KAUNAN
items.scrolls.exotic.exoticscroll.laguz=exotisk rullning av LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=exotisk rullning av MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotisk skriftrulle av NAUDIZ
items.scrolls.exotic.exoticscroll.odal=exotisk rullning av ODAL
items.scrolls.exotic.exoticscroll.raido=exotisk rullning av RAIDO
items.scrolls.exotic.exoticscroll.sowilo=exotisk rullning av SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=exotisk rullning av TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=En lysande, otydlig magisk runa är skriven på detta svarta pergament. Den verkar vara främmande för detta land, vem vet vad den kommer att göra när den läses högt?
items.scrolls.exotic.exoticscroll.yngvi=exotisk skriftrulle av YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Besvärjelsen på denna skriftrulle kommer att omge dig med en magisk aura som tillfälligt blockerar alla magiska effekter, skadliga eller hjälpsamma. Detta inkluderar de flesta magiska föremålseffekter såsom trollstavar, skriftrullar, ringar, artefakter, förtrollningar och förbannelser. Heroiska rustningsförmågor är dock tillräckligt starka för att fungera oavsett.
items.scrolls.exotic.scrollofantimagic.name=antimagisk rullning
items.scrolls.exotic.scrollofchallenge$challengearena.desc=En magisk arena har dykt upp runt dig, markerad av en böljande röd dimma.\n\nMedan du står i dimman kommer din hunger inte att öka och du kommer att ta 33%% mindre skada från alla källor. Om du har några andra källor för skademinskning (som rustning), kommer de att tillämpas efter 33%%-reduktionen.\n\nÅterstående turar: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=utmaningsarena
items.scrolls.exotic.scrollofchallenge.desc=När den här skriftrullen läses högt kommer den att utlösa ett kraftigt vrål som lockar fiender till användaren samtidigt som en liten arena skapas runt dem.\n\nAs så länge läsaren stannar i arenan kommer de att ta 33 % mindre skada från alla källor (detta tillämpas före andra former av skadereducering), och de kommer inte att förlora mättnadskänslan.\n\nArenans storlek kommer att skalas med storleken på det område där läsaren befinner sig. Den kommer att vara särskilt liten i vissa bossområden.
items.scrolls.exotic.scrollofchallenge.name=utmaningens rullning
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Din spådomsskrift har identifierat följande föremål:
items.scrolls.exotic.scrollofdivination.desc=Denna rullning kommer slumpmässigt att identifiera fyra typer av föremål som du för närvarande inte känner till. De identifierade typerna kan vara en trolldryckes färg, en rullnings runa eller en ringas ädelsten. De identifierade föremålen kommer inte nödvändigtvis att vara sådana du bär.
items.scrolls.exotic.scrollofdivination.name=spådomsskriftrulle
items.scrolls.exotic.scrollofdivination.nothing_left=Det finns inget kvar att identifiera!
items.scrolls.exotic.scrollofdread.desc=När den här skriftrullen läses kommer den att avge en blixt av rött ljus som kommer att ingjuta otrolig skräck hos alla fiender i ditt synfält. Effekten är så stor att de snabbt kommer att försöka fly från hela fängelsehålan för att aldrig ses igen! \n\n Precis som med skräck kan effekten upphöra med tiden, eller om fienden attackeras. \n\n Viljestark fiender, som bossar, kommer istället att utsättas för vanlig skräck.
items.scrolls.exotic.scrollofdread.name=skräckens rulla
items.scrolls.exotic.scrollofenchantment.armor=Välj en teckensymbol att tillämpa på din rustning.
items.scrolls.exotic.scrollofenchantment.cancel=avboka
items.scrolls.exotic.scrollofenchantment.cancel_warn=Att avbryta kommer fortfarande att förbruka din förtrollningsskriftrulle, är du säker?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nej, jag ändrade mig
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, jag är säker
items.scrolls.exotic.scrollofenchantment.desc=Denna skriftrulle kommer att ge ett vapen eller en rustning kraftfull magisk energi. Läsaren har till och med en viss grad av kontroll över vilken magi som är genomsyrad.
items.scrolls.exotic.scrollofenchantment.inv_title=Förtrolla ett föremål
items.scrolls.exotic.scrollofenchantment.name=förtrollningens rulla
items.scrolls.exotic.scrollofenchantment.weapon=Välj en förtrollning att tillämpa på ditt vapen.
items.scrolls.exotic.scrollofforesight.desc=Efter att ha läst denna skriftrulle kommer detaljer om närliggande terräng ständigt att matas till läsarens sinne i kristallklarhet. Denna effekt varar under en avsevärd tid och kommer att avslöja alla dolda dörrar eller fällor, vilket gör letande onödigt.
items.scrolls.exotic.scrollofforesight.name=framsynthetens rulla
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Att avbryta kommer fortfarande att förbruka din metamorfosskriftrulle, är du säker?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Välj en talang att förvandla
items.scrolls.exotic.scrollofmetamorphosis.desc=Denna rullning innehåller kraftfull transmutationsmagi, som kommer att tillämpas på kastaren istället för på ett föremål. Magin i denna rullning låter dig välja en talang och ersätta den med en av fem talanger på samma nivå från olika hjälteklasser! \n\nDenna effekt kan endast tillämpas på klasstalanger, inte talanger som erhållits från underklasser eller rustningsförmågor. Talanger som du inte kan använda kommer inte att ges som alternativ.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=förvandla talang
items.scrolls.exotic.scrollofmetamorphosis.name=metamorfosens rull
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Välj en ny talang att ersätta din metamorfoserade talang med.
items.scrolls.exotic.scrollofmysticalenergy.desc=Den råa magiska kraften som finns bunden i detta pergament kommer, när den släpps, att ladda en användares utrustade artefakter över tid.
items.scrolls.exotic.scrollofmysticalenergy.name=rull av mystisk energi
items.scrolls.exotic.scrollofpassage.desc=Besvärjelsen på detta pergament transporterar omedelbart läsaren till närmaste region på första våningen ovanför. Mycket praktiskt för att snabbt ta sig till en butik.
items.scrolls.exotic.scrollofpassage.name=passage-rulle
items.scrolls.exotic.scrollofprismaticimage.desc=Besvärjelsen på denna skriftrulle kommer att skapa en färgstark, illusorisk tvilling av läsaren. Denna prismatiska bild fungerar som en svagare klon av läsaren, med liknande försvar men lägre HP och skada.\n\nDen prismatiska bilden kommer att visa sig när fiender är närvarande och kommer att försöka försvara läsaren.\n\nOm en prismatisk bild redan finns, kommer användning av denna skriftrulle att läka den helt.
items.scrolls.exotic.scrollofprismaticimage.name=rullning av prismatisk bild
items.scrolls.exotic.scrollofpsionicblast.desc=Denna skriftrulle innehåller otrolig destruktiv energi som kan kanaliseras för att förstöra sinnena hos alla synliga varelser. \n\n Det finns dock betydande återkoppling, och läsaren kommer också att skadas, bli förblindad och försvagad. Ju fler mål skriftrullen träffar, desto mindre självskada kommer att tas.
items.scrolls.exotic.scrollofpsionicblast.name=rullning av psionisk explosion
items.scrolls.exotic.scrollofpsionicblast.ondeath=Den psioniska explosionen sliter sönder ditt sinne...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Denna varelse har förtrollats av magin i en skriftrulle med sirenens sång. \n\n En trollbunden karaktär är din allierade för alltid och kommer att bekämpa alla fiender den möter.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=trollbunden
items.scrolls.exotic.scrollofsirenssong.cancel=Du måste välja ett mål.
items.scrolls.exotic.scrollofsirenssong.desc=När man läser den här skriftrullen utsänds en lockande melodi som kommer att fängsla en riktad fiende och permanent förvandla dem till en allierad! Andra fiender som hör den kommer tillfälligt att bli förtrollade. \n\n Särskilt starka fiender kan motstå fängslande effekten och kommer istället att bli förtrollade.
items.scrolls.exotic.scrollofsirenssong.name=sirenens sångrulle
items.scrolls.exotic.scrollofsirenssong.no_target=Scrollen aktiveras utan ett mål.
items.scrolls.exotic.scrollofsirenssong.prompt=Välj ett mål
items.scrolls.inventoryscroll.no=Nej, jag ändrade mig
items.scrolls.inventoryscroll.warning=Vill du verkligen avbryta den här scroll-användningen? Scrollen identifierades inte tidigare, så den kommer att användas ändå.
items.scrolls.inventoryscroll.yes=Ja, jag är säker
items.scrolls.scroll$placeholder.name=rulla
items.scrolls.scroll.ac_read=LÄSA
items.scrolls.scroll.berkanan=BERKANANS rullning
items.scrolls.scroll.blinded=Du kan inte läsa en skriftrulle när du är blind.
items.scrolls.scroll.cursed=Din förbannade trollformelbok hindrar dig från att åberopa den här skriftrullens magi! En skriftrulle med "ta bort förbannelsen" kan dock vara tillräckligt stark för att fortfarande fungera...
items.scrolls.scroll.gyfu=GYFU-rulle
items.scrolls.scroll.isaz=ISAZ-rulle
items.scrolls.scroll.kaunan=KAUNAN-rulle
items.scrolls.scroll.laguz=LAGUZ-rulle
items.scrolls.scroll.mannaz=MANNAZ-rulle
items.scrolls.scroll.naudiz=NAUDIZ-rulle
items.scrolls.scroll.no_magic=Du kan inte läsa en skriftrulle när du är magiskt immun.
items.scrolls.scroll.odal=ODAL-rulle
items.scrolls.scroll.raido=RAIDO-rulle
items.scrolls.scroll.sowilo=SOWILO-rulle
items.scrolls.scroll.tiwaz=TIWAZ-rulle
items.scrolls.scroll.unknown_desc=Det här pergamentet är täckt av oläslig skrift och har runan %s som titel. Vem vet vad som händer om man läser det högt?
items.scrolls.scroll.yngvi=YNGVI-rullen
items.scrolls.scrollofidentify.desc=Avslöjar permanent alla hemligheter hos ett enda föremål.
items.scrolls.scrollofidentify.inv_title=Identifiera ett föremål
items.scrolls.scrollofidentify.it_is=Ditt objekt har identifierats: %s.
items.scrolls.scrollofidentify.name=identifieringens skriftrulle
items.scrolls.scrolloflullaby.desc=En lugnande melodi kommer att försätta alla varelser i ditt synfält i djup sömn, vilket ger dig en chans att fly eller göra en överraskningsattack mot dem.
items.scrolls.scrolloflullaby.name=vaggvisans skriftrulle
items.scrolls.scrolloflullaby.sooth=Rullningen framför en lugnande melodi. Du känner dig väldigt sömnig.
items.scrolls.scrollofmagicmapping.desc=När du läser denna skriftrulle etsas en kristallklar bild in i ditt minne, som informerar dig om nivåns exakta utformning och avslöjar alla dolda hemligheter. Föremålens och varelsernas platser förblir okända.
items.scrolls.scrollofmagicmapping.layout=Du är nu medveten om nivålayouten.
items.scrolls.scrollofmagicmapping.name=kartläggningens skriftrulle
items.scrolls.scrollofmirrorimage.copies=Rullningen bildar spegelbilder av dig.
items.scrolls.scrollofmirrorimage.desc=Besvärjelsen på denna skriftrulle kommer att skapa illusionära tvillingar hos läsaren, som kommer att jaga hans fiender.
items.scrolls.scrollofmirrorimage.name=spegelbildens skriftrulle
items.scrolls.scrollofmirrorimage.no_copies=Rullningen försöker skapa spegelbilder av dig, men de har ingenstans att ta vägen.
items.scrolls.scrollofrage.desc=När den läses högt kommer denna skriftrulle att utlösa ett stort vrål som drar alla fiender till läsaren och gör de i närheten rasande.
items.scrolls.scrollofrage.name=rulla av raseri
items.scrolls.scrollofrage.roar=Rullan avger ett rasande vrål som ekar genom hela fängelsehålan!
items.scrolls.scrollofrecharging.desc=Den råa magiska kraften som finns bunden i detta pergament kommer, när den släpps, att ladda alla läsarens trollstavar till full kraft.
items.scrolls.scrollofrecharging.name=uppladdningens skriftrulle
items.scrolls.scrollofrecharging.surge=En våg av energi flödar genom din kropp och ger dina trollstavar ny energi!
items.scrolls.scrollofremovecurse.cleansed=Ditt föremål glöder med ett renande ljus, och en ondskefull energi skingras!
items.scrolls.scrollofremovecurse.desc=Besvärjelsen på denna skriftrulle kommer omedelbart att ta bort alla onda förtrollningar som kan hindra bäraren från att ta av sig vapen, rustning, ringar och andra föremål.
items.scrolls.scrollofremovecurse.inv_title=Rengör ett föremål
items.scrolls.scrollofremovecurse.name=förbannelsebrytande skriftrulle
items.scrolls.scrollofremovecurse.not_cleansed=Ditt föremål lyser med ett rengörande ljus, men ingenting händer.
items.scrolls.scrollofremovecurse.spirit=Din skriftrulle befriar den plågade anden!
items.scrolls.scrollofretribution.blast=Kraftfull magisk energi utbryter från skriftrullen!
items.scrolls.scrollofretribution.desc=Denna skriftrulle innehåller destruktiv energi som kanaliserar läsarens lidande utåt till en kraftexplosion. Ju svagare läsaren är, desto mer skada kommer den att orsaka. Vid mycket låg hälsa kan denna skriftrulle döda de flesta fiender direkt. \n\n Att använda skriftrullen tar dock ut sin rätt på användaren, det förblindar och försvagar dem.
items.scrolls.scrollofretribution.name=vedergällningens skriftrulle
items.scrolls.scrollofteleportation.cant_reach=Du kan inte teleportera dig dit.
items.scrolls.scrollofteleportation.desc=Besvärjelsen på detta pergament transporterar omedelbart läsaren till en slumpmässig plats på fängelsehålsnivån. Den kan användas för att fly från en farlig situation, men den oturliga läsaren kan hamna på en ännu farligare plats.
items.scrolls.scrollofteleportation.name=teleporteringens skriftrulle
items.scrolls.scrollofteleportation.no_tele=Teleporteringsmagin misslyckas.
items.scrolls.scrollofteleportation.prompt=Välj en plats att teleportera
items.scrolls.scrollofteleportation.tele=På ett ögonblick blev du teleporterad till en annan plats på nivån.
items.scrolls.scrollofterror.desc=En blixt av rött ljus kommer att överväldiga alla varelser i ditt synfält med skräck, och de kommer att vända sig om och fly. Att attackera en flyende fiende kommer att skingra effekten.
items.scrolls.scrollofterror.many=Rullningen avger en lysande blixt av rött ljus och monstren flyr!
items.scrolls.scrollofterror.name=skräckens skriftrulle
items.scrolls.scrollofterror.none=Rullet avger en lysande blixt av rött ljus.
items.scrolls.scrollofterror.one=Rullrullen avger en lysande blixt av rött ljus och %s flyr!
items.scrolls.scrolloftransmutation.desc=Denna skriftrulle innehåller kraftfull förvandlingsmagi. När den används på ett giltigt föremål förvandlas det till ett annat föremål av samma typ. Magin bevarar till och med uppgraderingar, förtrollningar och tecken. Skrifrullar och trolldrycker förvandlas till sina exotiska motsvarigheter, och vice versa.
items.scrolls.scrolloftransmutation.inv_title=Transmutera ett objekt
items.scrolls.scrolloftransmutation.morph=Ditt föremål förvandlas till något annat!
items.scrolls.scrolloftransmutation.name=transmutationens rulla
items.scrolls.scrolloftransmutation.nothing=Inget intressant händer.
items.scrolls.scrollofupgrade.desc=Denna skriftrulle uppgraderar ett enskilt föremål och förbättrar dess kvalitet. En trollstav ökar i kraft och antal laddningar; ett vapen orsakar mer skada eller träffar sitt märke oftare; en rustning avvärjer ytterligare slag; effekten av en ring på bäraren intensifieras. Vapen och rustningar kräver också mindre styrka att använda, och eventuella förbannelser på föremålet upphävs.
items.scrolls.scrollofupgrade.inv_title=Uppgradera ett objekt
items.scrolls.scrollofupgrade.name=uppgraderingens skriftrulle
items.scrolls.scrollofupgrade.remove_curse=Uppgraderingsskriften rensar bort förbannelsen på ditt föremål!
items.scrolls.scrollofupgrade.weaken_curse=Uppgraderingsrullen försvagar förbannelsen på ditt föremål.
items.spells.alchemize$wndalchemizeitem.energize=Förvandlas till %d-energi
items.spells.alchemize$wndalchemizeitem.energize_1=Förvandla 1 till %d energi
items.spells.alchemize$wndalchemizeitem.energize_all=Förvandla allt till %d energi
items.spells.alchemize$wndalchemizeitem.sell=Förvandla till %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Förvandla 1 till %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Förvandla allt till %dg
items.spells.alchemize.desc=Denna besvärjelse innehåller transmutativa krafter liknande de som finns i en alkemikruka. Varje kast låter användaren förvandla ett föremål (eller en hög med föremål) till guld eller alkemisk energi. Att förvandla trolldrycker eller skriftrullar till energi kommer till och med att identifiera dem!\n\nA Några få Alkemiseringsanvändningar säljs i butiker, men många fler kan göras med hjälp av alkemi genom att kombinera ett frö, en runsten och lite alkemisk energi.
items.spells.alchemize.name=alkemisera
items.spells.alchemize.prompt=Alkemisera ett föremål
items.spells.beaconofreturning.creatures=Den psykiska auran från angränsande varelser tillåter dig inte att teleportera dig just nu.
items.spells.beaconofreturning.desc=Denna invecklade besvärjelse ger användaren möjligheten att återvända till en given plats, oavsett avstånd. Besvärjelsen förbrukas endast genom att återvända, den kan sättas så många gånger du vill, men den kommer bara ihåg den senaste platsen den placerades på.
items.spells.beaconofreturning.desc_set=Denna fyr var placerad någonstans på våning %d.
items.spells.beaconofreturning.name=återvändandets ledstjärna
items.spells.beaconofreturning.preventing=Den starka magiska auran på den här platsen hindrar dig från att använda besvärjelsen!
items.spells.beaconofreturning.set=Fyren ställdes in på din nuvarande plats.
items.spells.beaconofreturning.wnd_body=Inställningen åsidosätter den plats som fyren tidigare var inställd på. \n\n Om du återgår återgår du till din senast inställda plats och förbrukar en användning av besvärjelsen.
items.spells.beaconofreturning.wnd_return=ÅTERVÄNDA
items.spells.beaconofreturning.wnd_set=UPPSÄTTNING
items.spells.curseinfusion.desc=Denna besvärjelse fyller en utrustningsdel med samma kraftfulla elakartade magi som finns i DM-300. Föremålet den används på kommer omedelbart att bli förbannat, och eventuella förtrollningar eller tecken den kan ha haft kommer att åsidosättas.\n\nNär det gäller vapen, rustningar och trollstavar kommer föremålet att få uppgraderingar utöver att vara förbannat. Uppgraderingar för förbannelseinfusion staplas inte, och uppgraderingarna går förlorade om föremålet blir avförbannat.\n\nFlera förbannelseinfusioner kan också användas för att ändra förbannelsen på ett vapen eller en rustning.
items.spells.curseinfusion.inv_title=Förbannelse över ett föremål
items.spells.curseinfusion.name=förbannelseinfusion
items.spells.magicalinfusion.desc=Denna besvärjelse har samma magiska kraft som en uppgraderingsskriftrulle, men i en mer stabil form. \n\n Förutom att uppgradera ett föremål som vanligt kommer den aldrig att radera en förtrollning, glyph eller förbannelse.
items.spells.magicalinfusion.infuse=Ditt föremål är fyllt med mystisk energi!
items.spells.magicalinfusion.inv_title=Infundera ett föremål
items.spells.magicalinfusion.name=magisk infusion
items.spells.magicalporter.desc=Denna besvärjelse kommer magiskt att transportera alla föremål den kastas på. Till skillnad från en köpmans fyr kommer dock föremålen att transporteras till ingången till nästa bossvåning.
items.spells.magicalporter.inv_title=Portera ett objekt
items.spells.magicalporter.name=magisk bärare
items.spells.magicalporter.nowhere=Det finns ingenstans för dig att portera ett objekt till.
items.spells.phaseshift.desc=Denna kaotiska besvärjelse teleporterar vilken karaktär som helst den riktas mot till en slumpmässig plats på den aktuella våningen och bedövar dem under en betydande tid. Kraftfulla fiender kommer att kunna motstå bedövningseffekten. Besvärjelsen kan riktas mot ett mål eller mot användaren själv.
items.spells.phaseshift.name=fasförskjutning
items.spells.phaseshift.no_target=Det finns inget att teleportera dit.
items.spells.reclaimtrap.desc=Denna besvärjelse innehåller rester av DM-300s mekaniska energi. När du använder en aktiv fälla kommer fällans kraft att fästas på dig, vilket gör att du kan använda besvärjelsen igen för att fördriva denna kraft och utlösa fällans effekt var du vill. \n\nVissa fällor fungerar dock inte på alla platser, och endast en fälla kan lagras åt gången.
items.spells.reclaimtrap.desc_trap=Besvärjelsen är för närvarande redo att utlösa en _%s._
items.spells.reclaimtrap.name=återvinningsfälla
items.spells.reclaimtrap.no_trap=Det finns ingen fälla där.
items.spells.recycle.desc=Denna besvärjelse innehåller en mindre form av transmutationsmagi. Även om den inte fungerar på utrustning, förvandlar den en skriftrulle, trolldryck, frö, runsten eller spetsad pil till ett slumpmässigt föremål av samma typ.
items.spells.recycle.inv_title=Återvinn ett föremål
items.spells.recycle.name=återvinna
items.spells.recycle.recycled=Din vara återvanns till: %s.
items.spells.spell.ac_cast=KASTA
items.spells.spell.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.spells.spell.no_magic=Du kan inte kasta trollformler när du är magisk immun.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Denna besvärjelse kanaliserar energin från de elementära glöden som används för att tillverka den, och låter dig kalla fram en vänlig elemental för att slåss mot dig! Endast en elemental kan kallas fram åt gången, men besvärjelsen kan göras om för att återlämna elementalet till dig utan kostnad.
items.spells.summonelemental.desc_chaos=Besvärjelsen utstrålar för närvarande kaotisk energi, den kommer att kalla fram ett _kaoselement_. Du kan genomsyra ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande genomsyra.
items.spells.summonelemental.desc_fire=Besvärjelsen är för närvarande varm att beröra, den kommer att framkalla en _eldelemental_. Du kan genomsyra ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande genomsyra.
items.spells.summonelemental.desc_frost=Besvärjelsen är för närvarande kall vid beröring, den kommer att framkalla en _frostelemental_. Du kan genomsyra ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande genomsyra.
items.spells.summonelemental.desc_newborn=Besvärjelsen är för närvarande obeväpnad och kommer att kalla fram en _nyfödd elemental_ utan en distansattack. Du kan ge en identifierad dryck av flytande flamma, frostdryck, återladdningsskriftrulle eller transmutationsskriftrulle för att ge besvärjelsen kraft, vilket gör att framtida kallelser blir en elemental med full kraft!
items.spells.summonelemental.desc_shock=Besvärjelsen utstrålar för närvarande statisk energi, den kommer att kalla fram ett _chockelement_. Du kan genomsyra ett annat föremål, men besvärjelsen kommer att förlora sin nuvarande genomsyra.
items.spells.summonelemental.imbue_prompt=Genomsyra ett föremål
items.spells.summonelemental.name=kalla elementär
items.spells.targetedspell.inv_title=Infundera ett föremål
items.spells.targetedspell.prompt=Välj ett mål
items.spells.telekineticgrab.cant_grab=Det kan du inte greppa.
items.spells.telekineticgrab.desc=Denna besvärjelse låter utövaren på distans ta tag i alla föremål på en plats, eller alla kastade vapen som fastnat på en fiende! \n\n Den kan inte användas för att ta tag i föremål som någon annan äger, eller för att ta behållare som kistor.
items.spells.telekineticgrab.name=telekinetisk grip
items.spells.telekineticgrab.no_target=Det finns inget att hämta där.
items.spells.unstablespell.desc=Denna lilla svarta fyrkantiga kristall har skiftande runsymboler på var och en av sina ytor. \n\n När den aktiveras utlöser den effekten av en slumpmässig rullning. Rullningseffekten kommer alltid att vara stridsfokuserad om det finns fiender i ditt synfält, och kommer annars alltid att vara icke-stridsfokuserad.
items.spells.unstablespell.name=instabil besvärjelse
items.spells.wildenergy.desc=Denna besvärjelse innehåller en del av den förbannade energin som drev DM-300. När den kastas kommer den att ladda dina trollstavar och slitna artefakter, samtidigt som den utlöser en slumpmässig förbannad trollstaveffekt. Du kan dock välja en riktning för denna förbannade magi att skjuta i.
items.spells.wildenergy.name=vild energi
items.stones.inventorystone.ac_use=ANVÄNDA
items.stones.runestone$placeholder.name=runsten
items.stones.runestone.discover_hint=Du kan hitta det här föremålet slumpmässigt i fängelsehålan, eller tillverka det via alkemi.
items.stones.stoneofaggression$aggression.desc=Manipulativ magi gör att alla fiender i närheten föredrar att attackera den här karaktären.\n\nÅterstående turar: %s.
items.stones.stoneofaggression$aggression.name=målinriktad
items.stones.stoneofaggression.desc=När denna sten kastas mot en allierad eller fiende, kommer alla fiender i närheten att föredra att attackera den karaktären under en kort tid. \n\nBossfiender kan dock motstå effekten, vilket minskar varaktigheten avsevärt och tar mindre skada från sina undersåtars attacker.
items.stones.stoneofaggression.name=aggressionens sten
items.stones.stoneofaugmentation$wndaugment.cancel=Strunt samma
items.stones.stoneofaugmentation$wndaugment.choice=Vad skulle du vilja förbättra?
items.stones.stoneofaugmentation$wndaugment.damage=Skada
items.stones.stoneofaugmentation$wndaugment.defense=Försvar
items.stones.stoneofaugmentation$wndaugment.evasion=Undvikande
items.stones.stoneofaugmentation$wndaugment.none=Ta bort förstärkning
items.stones.stoneofaugmentation$wndaugment.speed=Hastighet
items.stones.stoneofaugmentation.desc=Denna runsten besitter kraftfull magi som kan förstärka utrustning för att förbättra en egenskap på bekostnad av en annan.\n\nGenom att använda ett vapen kan du öka antingen hastighet eller skada. Kastade vapen kommer också att öka eller förlora hållbarhet i proportion till sin hastighet.\n\nGenom att använda rustning kan du förbättra antingen försvar eller undvikande.
items.stones.stoneofaugmentation.discover_hint=Du kan köpa den här artikeln i en butik eller tillverka den via alkemi.
items.stones.stoneofaugmentation.inv_title=Utöka ett objekt
items.stones.stoneofaugmentation.name=förstoringssten
items.stones.stoneofblast.desc=Denna runsten kommer omedelbart att explodera på den plats den kastas till. Precis som en bomb kommer explosionen att orsaka skada på allt i närheten.
items.stones.stoneofblast.name=explosionssten
items.stones.stoneofblink.desc=Denna runsten teleporterar användaren till den plats den kastas till.
items.stones.stoneofblink.name=blinksten
items.stones.stoneofclairvoyance.desc=Denna sten kommer omedelbart att avslöja alla brickor i ett mycket brett område runt där den kastas. Dess effekt når till och med genom väggar.
items.stones.stoneofclairvoyance.name=sten av klärvoyans
items.stones.stoneofdeepsleep.desc=När denna sten kastas mot en fiende, kommer den att försätta dem i en djup magisk sömn. Magiskt sovande fiender kommer att sova för evigt tills de störs.
items.stones.stoneofdeepsleep.name=stenen av djup sömn
items.stones.stoneofdetectmagic.desc=Denna runsten kan upptäcka magi som påverkar ett föremål. Att använda denna sten på ett oidentifierat föremål visar om det påverkas av en ondskefull förbannelse och om det påverkas av positiv magi såsom en förtrollning eller uppgraderingar.
items.stones.stoneofdetectmagic.detected_bad=Du upptäcker ondskefull magi som påverkar detta föremål!
items.stones.stoneofdetectmagic.detected_both=Du upptäcker både positiv och ondskefull magi som påverkar detta föremål!
items.stones.stoneofdetectmagic.detected_good=Du upptäcker positiv magi som påverkar detta föremål!
items.stones.stoneofdetectmagic.detected_none=Du upptäcker ingen magi som påverkar den här artikeln.
items.stones.stoneofdetectmagic.inv_title=Identifiera ett objekt
items.stones.stoneofdetectmagic.name=sten för att upptäcka magi
items.stones.stoneofdisarming.desc=Denna runsten innehåller magi som kan avaktivera illvilliga fällor gömda i hela fängelsehålan. Den avväpnar upp till 9 fällor runt området den kastas på.
items.stones.stoneofdisarming.name=avväpnande sten
items.stones.stoneofenchantment.armor=Din rustning lyser i mörkret!
items.stones.stoneofenchantment.desc=Denna runsten besitter förtrollande magi. Till skillnad från en uppgraderingsskriftrulle kommer den inte att öka ett föremåls direkta kraft, utan istället ge ett vapen eller en rustning en förtrollning, vilket ger det en ny kraft.
items.stones.stoneofenchantment.inv_title=Förtrolla ett föremål
items.stones.stoneofenchantment.name=förtrollningens sten
items.stones.stoneofenchantment.weapon=Ditt vapen lyser i mörkret!
items.stones.stoneoffear.desc=När denna sten kastas på en karaktär kommer den att bli överväldigad av skräck och vända sig om och fly. Att attackera en flyende karaktär kommer att förkorta effekten.
items.stones.stoneoffear.name=sten av rädsla
items.stones.stoneofflock.desc=Denna runsten kallar fram magiska får under en kort tid runt den plats den kastas till.
items.stones.stoneofflock.name=sten av flock
items.stones.stoneofintuition$wndguess.break=Din intuitionsten faller sönder till stoft...
items.stones.stoneofintuition$wndguess.correct=Korrekt. Objektets typ har identifierats!
items.stones.stoneofintuition$wndguess.incorrect=Din gissning var felaktig.
items.stones.stoneofintuition$wndguess.text=Gissa vilken typ av oidentifierat föremål är. Om du gissar rätt kommer typen att identifieras!
items.stones.stoneofintuition.break_info=Du kan använda intuitionens stenar två gånger innan en går sönder, _din nästa användning kommer inte att förbruka en sten_.
items.stones.stoneofintuition.break_warn=Du har använt en intuitionens sten tidigare, så _din nästa användning kommer att förbruka en sten_.
items.stones.stoneofintuition.desc=Denna runsten innehåller en svagare version av den magi som finns i identifieringsrullar. Istället för att direkt identifiera ett föremål, kommer den att arbeta på din intuition, vilket gör att du kan försöka identifiera typen av en trolldryck, rullning eller ring genom att gissa.
items.stones.stoneofintuition.inv_title=Välj ett objekt
items.stones.stoneofintuition.name=intuitionens sten
items.stones.stoneofshock.desc=Denna runsten släpper lös en explosion av elektrisk energi som kortvarigt bedövar alla närliggande mål och ger kastarens trollstav laddning för varje träff på målet.
items.stones.stoneofshock.name=chocksten
items.stylus.ac_inscribe=INSKRIVA
items.stylus.cursed=Pennans magi fungerar inte på förbannad rustning.
items.stylus.desc=Denna mystiska penna är gjord av någon mörk, mycket hård sten. Med den kan du rista in en magisk symbol på din rustning, men du har ingen makt över att välja vilken symbol det ska vara, pennan bestämmer det åt dig.
items.stylus.identify=Du måste först identifiera om rustningen är förbannad.
items.stylus.inscribed=Du inristade din rustning med pennan.
items.stylus.name=svårbegriplig stylus
items.stylus.prompt=Välj en rustning
items.tengusmask.ac_wear=BÄRA
items.tengusmask.desc=Den här masken föll av Tengus ansikte när han dog, man kan känna stor magisk kraft utgå från den. Var masken Tengus styrka? \n\nNär den bärs kommer maskens enorma kraft att överföras till dig, vilket gör att du kan _välja en underklass till din hjälte._\n\nVilken underklass kommer du att välja?
items.tengusmask.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.tengusmask.name=Tengus mask
items.tengusmask.used=Masken sönderfaller när dess kraft flödar in i dig!
items.torch.ac_light=LJUS
items.torch.desc=Ett äventyrligt basmaterial, när en grotte blir mörk kan en fackla hjälpa till att visa vägen.
items.torch.name=fackla
items.trinkets.chaoticcenser.desc=Efter en tid i alkemikrukan verkar det som att denna rökelsebrinnande rökelsekar producerar rök helt på egen hand! Dessa gaser byggs upp och kommer att sprutas ut från rökelsekaret mot fiender med halvslumpmässiga intervall. Den verkar kunna producera alla möjliga gaser, men du får en varningssignal precis innan rökelsekaret aktiveras.
items.trinkets.chaoticcenser.name=kaotisk rökelsekar
items.trinkets.chaoticcenser.spew=Ditt rökelsekar håller på att spy ut: %s.
items.trinkets.chaoticcenser.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att skapa en skadlig gas nära en fiende ungefär var _%d_ tur. Gaser dyker bara upp när fiender är närvarande. På högre nivåer är dessa gaser mer benägna att vara exotiska och kraftfulla.
items.trinkets.chaoticcenser.typical_stats_desc=Vanligtvis kommer denna prydnadssak att skapa en skadlig gas nära en fiende ungefär var _%d_-tur. Gaser dyker bara upp när fiender är närvarande. På högre nivåer är dessa gaser mer benägna att vara exotiska och kraftfulla.
items.trinkets.crackedspyglass.desc=Detta handhållna teleskop skulle vara en uppvisning i fantastiskt och precist hantverk, om det inte vore för sprickan längs dess främre lins. Kikaren verkar hjälpa dig genom att avslöja nya föremål i fängelsehålan, men på grund av dess fel är de avslöjade föremålen ganska svåra att se!
items.trinkets.crackedspyglass.name=sprucken kikare
items.trinkets.crackedspyglass.stats_desc=På sin nuvarande nivå har denna prydnadssak en _%1$s%% chans_ att skapa ett extra dolt föremål på varje våning som inte är boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=På sin nuvarande nivå har denna prydnadssak en _100%% chans_ att skapa ett extra dolt föremål på varje våning som inte är boss, och en _%1$s%% chans_ att skapa ett andra extra dolt föremål.
items.trinkets.crackedspyglass.typical_stats_desc=Vanligtvis har denna prydnadssak en _%1$s%% chans_ att skapa ett extra dolt föremål på varje våning som inte är boss.
items.trinkets.dimensionalsundial.desc=Detta lilla handhållna solur kan på något sätt kasta en skugga i fängelsehålans djup, även om du inte håller det upprätt. Ännu märkligare är att skuggans position inte verkar ha någon relation till solen i den här världen. När ingen skugga kastas verkar soluret locka till sig fara.
items.trinkets.dimensionalsundial.name=dimensionellt solur
items.trinkets.dimensionalsundial.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att minska fienders lekfrekvens med _%1$d%%_ under dagtid i verkliga livet (8.00-20.00), och öka fienders lekfrekvens med _%2$d%%_ på natten (20.00-8.00).
items.trinkets.dimensionalsundial.typical_stats_desc=Vanligtvis minskar denna prydnadssak antalet fiender som leker med _%1$d%%_ under dagtid i verkliga livet (8.00-20.00), och ökar antalet fiender som leker med _%2$d%%_ på natten (20.00-8.00).
items.trinkets.dimensionalsundial.warning=Ditt solur kastar inte någon skugga, du känner dig illa till mods.
items.trinkets.exoticcrystals.desc=Dessa små rosa kristaller har samma form som kristaller av alkemisk energi. Även om de inte kan användas direkt för energi, verkar de på något sätt påverka de trolldrycker och skriftrullar du hittar.
items.trinkets.exoticcrystals.name=exotiska kristaller
items.trinkets.exoticcrystals.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att ersätta _%s%%_ av trolldrycker eller skriftrullar med deras exotiska motsvarigheter. Detta påverkar inte styrkedrycker, uppgraderingsskriftrullar eller föremål som genereras för att hjälpa till att lösa riskrum.
items.trinkets.exoticcrystals.typical_stats_desc=Vanligtvis ersätter denna prydnadssak _%s%%_ av trolldrycker eller skriftrullar med deras exotiska motsvarigheter. Detta påverkar inte styrkedrycker, uppgraderingsskriftrullar eller föremål som genereras för att hjälpa till att lösa riskrum.
items.trinkets.eyeofnewt.desc=Detta gyllene och svarta vattensalamandersöga är en vanlig ingrediens, nu förvandlad till en prydnadssak. Ögat verkar minska din syn i utbyte mot att låta dig se saker på andra sätt.
items.trinkets.eyeofnewt.name=öga av salamander
items.trinkets.eyeofnewt.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att minska ditt synfält med _%1$s%%_, men kommer också att ge dig tankeseende på fiender inom _%2$d_-rutor.
items.trinkets.eyeofnewt.typical_stats_desc=Vanligtvis minskar den här prydnadssaken din synräckvidd med _%1$s%%_, men den ger dig också tankeseende på fiender inom _%2$d_-rutor.
items.trinkets.ferrettuft.desc=En tofs av silkeslen vit illerpäls, sammanhållen av ett limegrönt band knutet till en rosett. Illrar är kända för sin smidighet, busighet och brist på integritet. En del av den kraften verkar stråla ut från prydnadssakerna, vilket förstärker undvikandet av allt i närheten.
items.trinkets.ferrettuft.name=illerns tofs
items.trinkets.ferrettuft.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka undvikandet av alla karaktärer med _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Vanligtvis ökar denna prydnadssak undvikandet av alla karaktärer med _%1$s%%_.
items.trinkets.mimictooth.desc=Den här stora vassa tanden måste ha dragits ut från en mycket olycklig härmare. Den verkar påverka fängelsehålans härmare, vilket gör dem mer frekventa och farliga.
items.trinkets.mimictooth.name=härma tand
items.trinkets.mimictooth.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra alla typer av härmare _%1$sx_ vanligare och mycket svårare att upptäcka, men kommer också att öka mängden byte de släpper. Varje fängelsehålsvåning kommer också att ha en _%2$s%%_ chans att innehålla en extra smygande ebenholtshärmare.
items.trinkets.mimictooth.typical_stats_desc=Vanligtvis gör denna prydnadssak alla typer av härmare _%1$sx_ vanligare och mycket svårare att upptäcka, men den ökar också mängden byte de släpper. Varje fängelsehålsvåning har också en _%2$s%%_ chans att innehålla en extra smygande ebenholtshärmare.
items.trinkets.mossyclump.desc=Denna klump av våt mossa verkar hålla fast vid sin fukt oavsett hur hårt man klämmer på den. Den verkar vara magiskt bunden till själva fängelsehålan, vilket gör att gräs och vatten är mer benägna att dyka upp.
items.trinkets.mossyclump.name=mossig klump
items.trinkets.mossyclump.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra att _%d%%_ av temanlösa golv fylls med antingen vatten eller gräs istället. \n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.mossyclump.typical_stats_desc=Vanligtvis kommer den här prydnadssaken att göra att _%d%%_ av temanlösa golv fylls med antingen vatten eller gräs istället. \n\nDen här prydnadssaken kostar en större mängd energi att uppgradera.
items.trinkets.parchmentscrap.desc=Denna lilla pergamentbit ser ut som om den kom från en skriftrulle. Den har behållit en del av sin magi, och den verkar påverka vapen och rustningar som finns i fängelsehålan.
items.trinkets.parchmentscrap.name=pergamentskrot
items.trinkets.parchmentscrap.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra förtrollningar och glyfer _%dx_ lika vanliga, och förbannelser på vapen och rustningar _%sx_ lika vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte. \n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.parchmentscrap.typical_stats_desc=Vanligtvis gör denna prydnadssak att förtrollningar och tecken _%dx_ är vanliga, och förbannelser på vapen och rustningar _%sx_ är vanliga. Förbannelser på trollstavar, ringar eller artefakter påverkas inte. \n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.petrifiedseed.desc=Detta frö har fossiliserats, antingen genom långsamma geologiska processer eller genom magi. Fröet verkar magiskt påverka fängelsehålans flora och ersätter ibland växtfrön med runstenar.
items.trinkets.petrifiedseed.name=förstenat frö
items.trinkets.petrifiedseed.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att få nedtrampat gräs att släppa runstenar istället för frön _%1$s%%_ för tiden, och kommer också att få högt gräs att släppa föremål _%2$s%%_ oftare.
items.trinkets.petrifiedseed.typical_stats_desc=Vanligtvis gör denna prydnadssak att nedtrampat gräs släpper runstenar istället för frön _%1$s%%_ ibland, och det gör också att högt gräs släpper föremål _%2$s%%_ oftare.
items.trinkets.ratskull.desc=Denna makabra prydnadssak är inte mycket större än skallen på en vanlig råtta, vilket på något sätt är en sällsynthet nere i den här fängelsehålan. Skallens magiska inflytande verkar locka till sig de mer sällsynta invånarna i fängelsehålan, vilket gör att de dyker upp mycket oftare.
items.trinkets.ratskull.name=råttskalle
items.trinkets.ratskull.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra sällsynta exotiska fiender _%dx_ mindre benägna att dyka upp. Skallen är dock bara hälften så effektiv på att locka till sig kristallhärmare och pansarstatyer.
items.trinkets.ratskull.typical_stats_desc=Vanligtvis gör denna prydnadssak att sällsynta exotiska fiender _%dx_ är mindre benägna att dyka upp. Skallen är dock bara hälften så effektiv på att locka till sig kristallhärmare och rustade statyer.
items.trinkets.saltcube.desc=Denna stora saltkristall skars till en nästan perfekt kubform, och den lyckades på något sätt tömma hälften av vattnet från alkemikrukan istället för att lösas upp. Den verkar magiskt uttorka och konservera maten du äter, vilket förlänger mättnadskänslan du får, men minskar också din hälsoåterställning när du inte svälter.
items.trinkets.saltcube.name=saltkub
items.trinkets.saltcube.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka tiden innan du blir hungrig med _%1$s%%_, men kommer också att minska din hastighet av hälsaregenerering med _%2$s%%_ om inte våningen är låst.
items.trinkets.saltcube.typical_stats_desc=Vanligtvis ökar den här prydnadssaken tiden innan du blir hungrig med _%1$s%%_, men den minskar också din hälsoregenereringshastighet med _%2$s%%_ om inte våningen är låst.
items.trinkets.shardofoblivion$thrownusetracker.desc=Du har nyligen använt ett oidentifierat kastat vapen, vilket räknas som en använd oidentifierad utrustning för glömskans skärva ett tag. \n\n Återstående tur: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Oidentifierat kastat vapen som använts
items.trinkets.shardofoblivion$wandusetracker.desc=Du har nyligen använt en oidentifierad trollstav, vilket räknas som en använd oidentifierad utrustning för glömskans skärva ett tag. \n\n Återstående tur: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Oidentifierad trollstav använd
items.trinkets.shardofoblivion.ac_identify=IDENTIFIERA
items.trinkets.shardofoblivion.desc=Efter att ha kokat i alkemikrukan har denna lilla skärva av förbannad metall förändrats till att vara gjord av... ingenting? Ljus verkar böjas runt den, och den svävar på plats när du inte håller i den. Skärvan verkar magiskt hämta kraft från din okunnighet, så det är nog bäst att inte tänka på det för mycket.
items.trinkets.shardofoblivion.identify=Du identifierar föremålet!
items.trinkets.shardofoblivion.identify_not_yet=Det föremålet är inte redo att identifieras än.
items.trinkets.shardofoblivion.identify_prompt=Identifiera ett föremål
items.trinkets.shardofoblivion.identify_ready=Ett föremål är redo att identifieras: %s. Använd din Glömska skärva på det för att identifiera det.
items.trinkets.shardofoblivion.identify_ready_worn=Dina slitna föremål är nu redo att identifieras. Använd din Glömska skärva på föremålen för att identifiera dem.
items.trinkets.shardofoblivion.name=en skärva av glömska
items.trinkets.shardofoblivion.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka andelen fiender som släpper byte med 20%% för varje oidentifierad utrustning du har utrustat eller nyligen använt, till maximalt _%d föremål_. Skärvan kommer också att hindra dig från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för den.
items.trinkets.shardofoblivion.typical_stats_desc=Vanligtvis ökar denna prydnadssak andelen fiender som släpper byte med 20%% för varje oidentifierad utrustning du har utrustat eller nyligen använt, till maximalt _%d föremål_. Skärvan hindrar dig också från att identifiera utrustning, men kan användas för att manuellt identifiera föremål som är redo för den.
items.trinkets.thirteenleafclover.desc=På något sätt har kokningen i alkemikrukan fått den här klövern att få en massa extra blad! Det är inte riktigt klart om den här prydnadssaken är tur eller otur, kanske den här prydnadssaken gör din tur mer kaotisk?
items.trinkets.thirteenleafclover.name=trettonklöver
items.trinkets.thirteenleafclover.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att orsaka maximal skada _%1$d%%_ av tiden, och minimal skada _%2$d%%_ av tiden.
items.trinkets.thirteenleafclover.typical_stats_desc=Vanligtvis gör den här prydnadssaken maximal skada _%1$d%%_ varje gång och minimal skada _%2$d%%_ varje gång.
items.trinkets.trapmechanism.desc=Kärnmekanismen i en av fängelsehålans fallgropar, noggrant uthuggen ur golvet så att den kan bäras. Den verkar vara magiskt knuten till själva fängelsehålan, vilket gör farlig terräng vanligare men också ökar din affinitet för den.
items.trinkets.trapmechanism.name=fällmekanism
items.trinkets.trapmechanism.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att göra att _%1$d%%_ av temanlösa våningar fylls med antingen fällor eller klyftor istället. Dessutom kommer _%2$d%%_ av fängelsehålans dolda fällor istället att vara synliga.
items.trinkets.trapmechanism.typical_stats_desc=Vanligtvis kommer denna prydnadssak att göra att _%1$d%%_ av temanlösa våningar fylls med antingen fällor eller klyftor istället. Dessutom kommer _%2$d%%_ av fängelsehålans dolda fällor istället att vara synliga.
items.trinkets.trinket$placeholder.name=prydnadssak
items.trinkets.trinket.discover_hint=Det här föremålet har en chans att vara ett alternativ när du tillverkar en prydnadssak via alkemi.
items.trinkets.trinketcatalyst$randomtrinket.desc=Ett föremål i närheten sitter fast i en påse som du inte kan öppna. \n\n Alkemiprocessen kommer att lösa upp påsen, men du vet inte vilken prydnadssak du får förrän du gör det!
items.trinkets.trinketcatalyst$randomtrinket.name=slumpmässig prydnadssak
items.trinkets.trinketcatalyst.desc=Denna boll av magiskt gyllene damm glimmar i mörkret i fängelsehålan. Denna katalysator kan användas vid en alkemikruka med lite alkemisk energi för att producera ett unikt prydnadsföremål. \n\nPrydnadssaker ger olika effekter som förändrar fängelsehålan eller dess invånare något. Prydnadssaker kan uppgraderas med mer energi för att göra deras effekt kraftfullare, eller släppas för att helt avstå från effekten.
items.trinkets.trinketcatalyst.name=magisk katalysator
items.trinkets.trinketcatalyst.window_text=Vattnet börjar glöda när du tillsätter katalysatorn. Det finns några föremål i närheten som du kan fylla med energi och förvandla till en magisk prydnadssak.
items.trinkets.trinketcatalyst.window_title=skapa en prydnadssak
items.trinkets.vialofblood.desc=Denna tunna ampull innehåller blod från någon invånare i fängelsehålan, den rör sig långsamt när du roterar ampullen. Den verkar magiskt förstärka starkare helande effekter, men också fördröja dem.
items.trinkets.vialofblood.name=flaska med blod
items.trinkets.vialofblood.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att öka den totala hälsan du får från att dricka helande trolldrycker, vattensäckar eller hälsobrunnar med _%1$s%%_. Dessa helande effekter kommer dock också att ske långsammare och regenerera maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).
items.trinkets.vialofblood.typical_stats_desc=Vanligtvis ökar denna prydnadssak den totala hälsan du får från att dricka helande trolldrycker, vattensäckar eller hälsobrunnar med _%1$s%%_. Dessa helande effekter sker dock också långsammare och regenererar maximalt _%2$s_ HP per tur (detta skalas med hjältenivå).
items.trinkets.wondrousresin.desc=Detta skimrande blå harts verkar ha den destillerade essensen av en förbannad trollstavsmagi. Magin från alkemikrukan har verkat stabilisera den något, och den påverkar nu dina trollstavar.
items.trinkets.wondrousresin.name=underbart harts
items.trinkets.wondrousresin.stats_desc=På sin nuvarande nivå kommer denna prydnadssak att tvinga förbannade trollstaveffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och kommer att få oförbannade trollstavar att avfyra ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden. \n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.trinkets.wondrousresin.typical_stats_desc=Vanligtvis tvingar denna prydnadssak förbannade trollstaveffekter att bli neutrala eller positiva _%1$s%%_ av tiden, och gör att oförbannade trollstavar avfyrar ytterligare en neutral eller positiv förbannad zap _%2$s%%_ av tiden. \n\nDenna prydnadssak kostar en större mängd energi att uppgradera.
items.wands.cursedwand.disguise=Ditt utseende förändras framför dina ögon!
items.wands.cursedwand.fire=Du luktar bränt...
items.wands.cursedwand.grass=Gräset bryter ut runt omkring dig!
items.wands.cursedwand.gravity=Tyngdkraften börjar plötsligt dra i slumpmässiga riktningar!
items.wands.cursedwand.gravity_end=Gravitationskaoset tar slut.
items.wands.cursedwand.gravity_positive=Tyngdkraften börjar plötsligt dra i slumpmässiga riktningar, men det verkar inte påverka dig.
items.wands.cursedwand.mass_invuln=Strålande ljus utbryter från din trollstav!
items.wands.cursedwand.nothing=Ingenting händer.
items.wands.cursedwand.ondeath=Du dödades av din egen %s.
items.wands.cursedwand.petrify=Du fryser plötsligt fast!
items.wands.cursedwand.sinkhole=Marken börjar ge vika runt dig!
items.wands.cursedwand.sinkhole_positive=Marken börjar ge vika, men känns tillräckligt fast under dig.
items.wands.cursedwand.supernova=En flammande energiboll börjar växa. Du kanske vill springa!
items.wands.cursedwand.supernova_positive=En flammande energiboll börjar växa, men det känns tryggt på något sätt.
items.wands.cursedwand.transmogrify_other=Ditt föremål förvandlas till något annat!
items.wands.cursedwand.transmogrify_wand=Din trollstav förvandlas till ett annat föremål!
items.wands.damagewand.upgrade_stat_name_1=Magisk skada
items.wands.wand$placeholder.name=trollstav
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Denna %s är förbannad!
items.wands.wand.cursed=Denna trollstav är förbannad, vilket gör dess magi kaotisk och slumpmässig.
items.wands.wand.fizzles=Din trollstav fräser; den måste ha för lite laddning.
items.wands.wand.identify=Du är nu tillräckligt bekant med din trollstav för att kunna identifiera den.
items.wands.wand.no_magic=Din trollstav fräser; du kan inte använda trollstavar medan du är magiskt immun.
items.wands.wand.not_cursed=Denna trollstav är fri från ondskefull magi.
items.wands.wand.prompt=Välj en plats att zappa
items.wands.wand.resin_many=Denna trollstav har uppnått _%d-nivåer_ från arcane harts.
items.wands.wand.resin_one=Denna trollstav har fått _1 nivå_ från arcane harts.
items.wands.wand.self_target=Du kan inte rikta in dig på dig själv!
items.wands.wandofblastwave.bmage_desc=När _stridsmagikern_ träffar en förlamad fiende med en stav av explosionsvåg, kommer den att förbruka förlamningen för att orsaka en explosion av bonusmagisk skada. Detta har en kort nedkylningstid per fiende.
items.wands.wandofblastwave.desc=Denna trollstav är gjord av en sorts marmorerad sten, med guldkant och en rund svart ädelsten i spetsen. Den känns väldigt tung i handen.
items.wands.wandofblastwave.eleblast_desc=En elementär explosion med en stav av explosionsvåg gör 67 % skada och slår ner alla fiender utanför explosionsområdet.
items.wands.wandofblastwave.knockback_ondeath=Kollisionen dödade dig...
items.wands.wandofblastwave.name=trollstav av sprängvåg
items.wands.wandofblastwave.ondeath=Du tog livet av dig med din egen sprängvågstav...
items.wands.wandofblastwave.staff_name=personal för sprängvåg
items.wands.wandofblastwave.stats_desc=Denna trollstav avfyrar en bult som våldsamt detonerar mot en målplats. Kraften från denna explosion orsakar _%1$d-%2$d skada_ och är tillräckligt stark för att skicka de flesta fiender på flyg.
items.wands.wandofblastwave.typical_stats_desc=Denna trollstav avfyrar en bult som våldsamt detonerar mot en målplats. Kraften från denna explosion orsakar vanligtvis _%1$d-%2$d skada_ och är tillräckligt stark för att skicka de flesta fiender på flykten.
items.wands.wandofblastwave.upgrade_stat_name_2=Återkoppling
items.wands.wandofcorrosion.bmage_desc=När _stridsmagikern_ slår en fiende med en tärningsstav, har fienden en chans att bli utsöndrad.
items.wands.wandofcorrosion.desc=Denna trollstav har en askgrå kropp som öppnar sig mot en lysande orange ädelsten.
items.wands.wandofcorrosion.eleblast_desc=En elementär explosion med en korrosionsstav tillfogar fiender 4 korrosionsvändor, med början vid 6 skada.
items.wands.wandofcorrosion.name=korrosionsstav
items.wands.wandofcorrosion.staff_name=personal för korrosion
items.wands.wandofcorrosion.stats_desc=Denna trollstav avfyrar en blixt som exploderar till ett moln av mycket frätande gas på en riktad plats. Allt som fastnar inuti detta moln kommer att ta ökande skada över tid, med början vid _%d skada._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsskador
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolym
items.wands.wandofcorruption.already_corrupted=Den karaktären kan inte påverkas ytterligare.
items.wands.wandofcorruption.bmage_desc=När _stridsmagikern_ slår en fiende med en korruptionens stav, har fienden en chans att bli förbannad.
items.wands.wandofcorruption.desc=Denna trollstav utstrålar kaotisk mörk energi, om det inte redan vore uppenbart från den lilla dekorativa skallen formad på dess spets.
items.wands.wandofcorruption.eleblast_desc=En elementär explosion med en stav av korruption tillfogar fiender fem amokomgångar.
items.wands.wandofcorruption.name=korruptionens trollstav
items.wands.wandofcorruption.staff_name=personal inom korruption
items.wands.wandofcorruption.stats_desc=Denna trollstav kommer att frigöra en explosion av korrumperande energi som kommer att avvärja fiender och så småningom böja dem efter din vilja. Fiender kan motstå korrumperingen, men försvagade fiender är mycket lättare att korrumpera än friska.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumperande makt
items.wands.wandofcorruption.upgrade_stat_name_2=Debuff-varaktighet
items.wands.wandofdisintegration.bmage_desc=När den används av _stridsmagikern_ har en sönderfallsstav ökat attackräckvidd, som om den hade en utskjutande förtrollning.
items.wands.wandofdisintegration.desc=Denna trollstav är gjord av en solid, slät bit obsidian, med ett djupt lila ljus som löper upp längs sidan och slutar i spetsen. Den glöder med destruktiv energi och väntar på att skjutas framåt.
items.wands.wandofdisintegration.eleblast_desc=En elementär explosion med en sönderfallsstav gör 100 % skada och genomborrar väggar.
items.wands.wandofdisintegration.name=upplösningens trollstav
items.wands.wandofdisintegration.staff_name=personal för upplösning
items.wands.wandofdisintegration.stats_desc=Denna trollstav skjuter en stråle som genomborrar vilket hinder som helst, och kommer att gå längre ju mer den uppgraderas. Strålen gör _%1$d-%2$d skada,_ och kommer också att göra bonusskada för varje fiende och vägg den penetrerar.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max räckvidd
items.wands.wandoffireblast.bmage_desc=När _stridsmagikern_ träffar en fiende med en stav av eldstöt, finns det en chans att den producerar en explosion som skadar fiender och förbrukar all eld i närheten! Denna risk ökar ju mer eld det finns i närheten av fienden.
items.wands.wandoffireblast.desc=Denna trollstav är tillverkad av rödlackerat trä med rikligt med gyllene blad som ger den ett majestätiskt utseende. Den sprakar och väser i spetsen, ivrig att släppa lös sin kraftfulla magi.
items.wands.wandoffireblast.eleblast_desc=En elementär explosion med en stav av eldexplosion gör 100 % skada, spränger dörrar och sätter fiender och terräng i brand.
items.wands.wandoffireblast.name=eldstav
items.wands.wandoffireblast.staff_name=personal på Fireblast
items.wands.wandoffireblast.stats_desc=Denna trollstav avfyrar en eldkon när den används. Nästa attack kommer att förbruka _%1$d laddningar_ och göra _%2$d-%3$d skada._ Ju fler laddningar trollstaven använder, desto större och starkare blir effekten.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_2=2 Laddningsskada
items.wands.wandoffireblast.upgrade_stat_name_3=3 Laddningsskada
items.wands.wandoffrost.bmage_desc=När _stridsmagikern_ slår en kyld fiende med en stav av frost, har de en chans att omedelbart frysa. Denna chans blir större ju mer kylda de är.
items.wands.wandoffrost.desc=Den här trollstav verkar vara gjord av någon sorts magisk is. Den blir ljusare mot sin rundade spets. Den känns väldigt kall när man håller den, men på något sätt håller sig handen varm.
items.wands.wandoffrost.eleblast_desc=En elementär explosion med en stav av frost gör 100 % skada, fryser fiender och släcker bränder.
items.wands.wandoffrost.name=froststav
items.wands.wandoffrost.staff_name=frostpersonal
items.wands.wandoffrost.stats_desc=Denna trollstav skjuter strömmar av isande energi mot dina fiender, vilket orsakar _%1$d-%2$d skada_ och kyler ner. Effekten verkar starkare i vatten. Fiender som redan är kylda eller frusna tar mindre skada av denna trollstav.
items.wands.wandoffrost.upgrade_stat_name_2=Kylningsvaraktighet
items.wands.wandoflightning$lightningcharge.desc=Battlemagikern är för närvarande laddad med energi, vilket ger honom immunitet mot sin blixtstav och ökar räckvidden som blixten kan utstråla från den. \n\n Återstående tur: %s.
items.wands.wandoflightning$lightningcharge.name=Elektriskt laddad
items.wands.wandoflightning.bmage_desc=När _stridsmagikern_ träffar en fiende med en blixtstav har han en chans att ladda sig själv elektriskt i 10 omgångar. Medan den är laddad är stridsmagikern immun mot blixtskador och kommer att avfyra ytterligare blixtar.
items.wands.wandoflightning.desc=Denna trollstav är gjord av solid metall, vilket gör den förvånansvärt tung. Två stift böjs mot varandra i spetsen, och elektricitet bildas mellan dem.
items.wands.wandoflightning.eleblast_desc=En elementär explosion med en blixtstav gör 100 % skada, bedövar fiender i 5 omgångar och elektrifierar vatten.
items.wands.wandoflightning.name=blixtens trollstav
items.wands.wandoflightning.ondeath=Du tog livet av dig själv med din egen blixtstav...
items.wands.wandoflightning.staff_name=blixtens stav
items.wands.wandoflightning.stats_desc=Denna trollstav skickar kraftfulla blixtar som bågar genom vad den än skjuts på, och orsakar _%1$d-%2$d skada._ Denna elektricitet kommer att bågas till närliggande karaktärer och sprida sig lättare i vatten. Bågarna från denna trollstav kan skada dig, men kommer inte att skada dina allierade.
items.wands.wandoflivingearth$earthguardian.desc=Stenarna från din trollstav av levande jord har formats till en skyddande jordisk väktare! Denna steniga beskyddare kommer att attackera fiender i närheten, vilket tvingar dem att attackera väktaren istället för dig. När alla hot i närheten är borta kommer väktaren att återformas runt dig och återvända nästa gång du använder din trollstav.
items.wands.wandoflivingearth$earthguardian.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.
items.wands.wandoflivingearth$earthguardian.name=jordisk väktare
items.wands.wandoflivingearth$earthguardian.wand_info=Väktarens defensiva kraft är knuten till nivån på din trollstav. Den blockerar för närvarande _%1$d-%2$d skada._
items.wands.wandoflivingearth$rockarmor.desc=Magiska stenar omger din kropp. När du blir attackerad kommer de att försöka blockera dig och minska skadan du tar med 50%%. Varje blockerad skada skrapar dock bort en del av stenen.\n\nÅterstående rustning: %1$d.\n\nOm tillräckligt med sten byggs runt dig kommer nästa zapp från din trollstav av levande jord att få stenarna att formas till en väktare som kommer att slåss mot dig.\n\nRustning som behövs för väktaren: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Denna jordiska väktare drar också nytta av Mångas Kraft. Återstående tur: %d.
items.wands.wandoflivingearth$rockarmor.name=stenrustning
items.wands.wandoflivingearth.bmage_desc=När _stridsmagikern_ slår en fiende med en stav av levande jord, återgäldas en del av den skada som stenrustning.
items.wands.wandoflivingearth.desc=Denna trollstav är gjord av en märklig sten, med band av glödande gul energi. Stenarna verkar röra sig något när du greppar trollstaven, som om de kan känna din hand.
items.wands.wandoflivingearth.eleblast_desc=En elementär explosion med en stav av levande jord gör 50 % skada och läker en aktiv jordväktare för varje fiendeträff.
items.wands.wandoflivingearth.name=trollstav av levande jord
items.wands.wandoflivingearth.staff_name=personal på den levande jorden
items.wands.wandoflivingearth.stats_desc=Denna trollstav skickar magiska stenar mot fiender och orsakar _%1$d-%2$d skada._ Stenarna kommer sedan att formas om runt användaren och ge dem rustning i proportion till den skada som orsakats. Om tillräckligt med rustning byggs upp kommer den att formas till en stenbeskyddare när trollstaven zappas nästa gång.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Väktarblockering
items.wands.wandofmagicmissile$magiccharge.desc=Din trollstav med magiska missiler har matat tillbaka kraft till dina trollstavar, vilket ökar den effektiva nivån för nästa zapp de gör.\n\nDina trollstavar har boostats till: +%d.\n\nÅterstående omgångar av magisk laddning: %s.
items.wands.wandofmagicmissile$magiccharge.name=magisk laddning
items.wands.wandofmagicmissile.bmage_desc=När _stridsmagikern_ slår en fiende med en stav av magisk missil, kommer alla hans trollstavar att få laddning utöver hans stav.
items.wands.wandofmagicmissile.desc=Denna ganska enkla trollstav avfyrar missiler med ren magisk energi. Även om själva trollstaven saknar specialeffekter har den fler tillgängliga laddningar och kan kortvarigt ge kraft åt andra trollstavar när den uppgraderas.
items.wands.wandofmagicmissile.discover_hint=En av hjältarna börjar med det här föremålet.
items.wands.wandofmagicmissile.eleblast_desc=En elementär explosion med en stav av magisk missil gör 50% skada och ger magikern 15 omgångar att ladda.
items.wands.wandofmagicmissile.name=trollstav av magisk missil
items.wands.wandofmagicmissile.staff_name=personal av magisk missil
items.wands.wandofmagicmissile.stats_desc=Varje bult från denna trollstav gör _%1$d-%2$d skada,_ och kommer kortvarigt att ge andra trollstavar kraft om den uppgraderas.
items.wands.wandofprismaticlight.bmage_desc=När _stridsmagikern_ träffar en fiende med en stav av prismatiskt ljus, kommer de att vara förlamade under en tid som skalas med stavnivån.
items.wands.wandofprismaticlight.desc=Denna trollstav är gjord av en solid bit genomskinlig kristall, likt en lång bit slät glas. Små bitar av färgglatt ljus dansar runt spetsen på trollstaven, ivriga att explodera.
items.wands.wandofprismaticlight.eleblast_desc=En elementär explosion med en stav av prismatiskt ljus gör 67% skada, avslöjar all terräng i explosionen och förblindar fiender i 5 rundor.
items.wands.wandofprismaticlight.name=stav av prismatiskt ljus
items.wands.wandofprismaticlight.staff_name=personal av prismatiskt ljus
items.wands.wandofprismaticlight.stats_desc=Denna trollstav skjuter ljusstrålar som skär igenom mörkret i fängelsehålan och avslöjar dolda områden och fällor. Strålen kan blända fiender och orsakar _%1$d-%2$d skada._ Demoniska och odöda fiender brinner i trollstavens starka ljus och tar bonusskada.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind chans
items.wands.wandofprismaticlight.upgrade_stat_name_3=Ljusvaraktighet
items.wands.wandofregrowth$dewcatcher.desc=Daggfångare är förunderliga växter som fyller sig med magisk dagg. De försöker kamouflera sig som gräs för att undvika uppmärksamhet, men deras utbuktningar av samlad dagg avslöjar dem.
items.wands.wandofregrowth$dewcatcher.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$dewcatcher.name=Daggfångare
items.wands.wandofregrowth$lotus.desc=Den gyllene lotusen är en mystisk växt som bara kan frammanas med en kraftfull återväxtstav. Dess aura förstärker alla växter och växteffekter, men den förbränner sin energi och dör efter en kort tid.
items.wands.wandofregrowth$lotus.discover_hint=Du kan hitta den här växten med en specifik trollstav efter att ha uppgraderat den flera gånger.
items.wands.wandofregrowth$lotus.name=Gyllene lotus
items.wands.wandofregrowth$lotus.wand_info=Denna lotus producerades av en _+%1$d_ trollstav av återväxt. Alla växter i dess effekt kommer _omedelbart att utlösas_ om de planteras på en karaktär. Växter kommer också att ha en _%2$d%% chans_ att släppa sina fröer, och tippande pilar kommer att använda _%3$d%% mindre hållbarhet_.
items.wands.wandofregrowth$seedpod.desc=Frökapslar är magiska växter som producerar frön från andra växttyper, snarare än egna frön. De lyckas på något sätt sprida sig trots att de inte har några egna frö.
items.wands.wandofregrowth$seedpod.discover_hint=Du kan hitta den här växten med en specifik trollstav.
items.wands.wandofregrowth$seedpod.name=Frökapsel
items.wands.wandofregrowth.bmage_desc=När _stridsmagikern_ slår en fiende med en stav av återväxt, och antingen står på gräs, kommer han att få örtläkning i proportion till den skada som orsakats.
items.wands.wandofregrowth.degradation=Efter ytterligare _%d-laddningar_ kommer den här trollstav att börja sluta producera växter och färskt gräs. Denna gräns ökas genom att nivån höjs eller uppgraderas.
items.wands.wandofregrowth.desc=Denna trollstav är gjord av ett tunt skaft av skickligt snidat trä. På något sätt är den fortfarande levande och vibrerande, ljusgrön som kärnan i ett ungt träd. "När livet upphör börjar nytt liv alltid växa... Den eviga cykeln består alltid!"
items.wands.wandofregrowth.eleblast_desc=En elementär explosion med en stav av återväxt rotar fiender och låter gräs växa slumpmässigt över explosionsområdet.
items.wands.wandofregrowth.name=trollstav av återväxt
items.wands.wandofregrowth.staff_name=personal för återväxt
items.wands.wandofregrowth.stats_desc=När den används kommer denna trollstav att sprida magisk återväxtenergi utåt i en kon, vilket får gräs, rötter och sällsynta växter att vakna till liv. Nästa stöt kommer att förbruka _%1$d laddningar_. Ju fler laddningar trollstaven använder, desto större och starkare blir effekten.
items.wands.wandofregrowth.upgrade_stat_name_1=Gräs per laddning
items.wands.wandofregrowth.upgrade_stat_name_2=Total gräsgräns
items.wands.wandoftransfusion.bmage_desc=När _stridsmagikern_ angriper en förtrollad fiende med en transfusionsstav, kommer han att få sköld och hans nästa attack med staven kommer inte att kosta någon hälsa.
items.wands.wandoftransfusion.charged=Din stav är laddad med din fiendens livsenergi!
items.wands.wandoftransfusion.desc=En ganska enkel formad trollstav, den sticker ut tack vare sin magenta nyans och becksvarta ädelsten i spetsen.
items.wands.wandoftransfusion.eleblast_desc=En elementär explosion med en stav av transfusioner charmar fiender, helar allierade och gör 100 % skada på odöda fiender.
items.wands.wandoftransfusion.name=transfusionsstaven
items.wands.wandoftransfusion.ondeath=Du tog livet av dig själv med din egen transfusionsstav...
items.wands.wandoftransfusion.staff_name=personal för transfusioner
items.wands.wandoftransfusion.stats_desc=När den används mot allierade eller förtrollade fiender, kommer denna trollstav att tappa _%1$d av användarens hälsa_ för att läka eller skydda den allierade för _%2$d hälsa._ När den används mot fiender, förtrollar trollstaven dem kort samtidigt som den applicerar _%3$d sköldning_ på användaren. Fientliga odöda kommer att ta _%4$d-%5$d skada_ istället för att bli förtrollade.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Självskyddande
items.wands.wandoftransfusion.upgrade_stat_name_3=Odöda skada
items.wands.wandofwarding$ward.desc_1=Denna grundläggande försvarslinje kommer automatiskt att zappa alla fiender som kommer inom dess synfält och orsakar _%1$d-%2$d skada._\n\nAtt zappa denna försvarslinje med din försvarstav kommer att uppgradera den.\n\nDenna försvarslinje kommer bara att zappa en gång innan den försvinner.\n\nDin försvarstav använder _%3$d energi_ för att upprätthålla denna försvarslinje.
items.wands.wandofwarding$ward.desc_2=Denna uppgraderade försvarsavdelning har ett mer invecklat mönster och kan attackera flera gånger. Varje zapp från denna försvarsavdelning kommer att göra _%1$d-%2$d skada._\n\nAtt zappa denna försvarsavdelning med din försvarstav kommer att uppgradera den.\n\nDenna försvarsavdelning kommer att zappa tre gånger innan den försvinner.\n\nDin försvarstav använder _%3$d energi_ för att upprätthålla denna försvarsavdelning.
items.wands.wandofwarding$ward.desc_3=Denna fullt uppgraderade försvarsavdelning kan attackera fler gånger än sina föregångare. Varje zapp från denna försvarsavdelning kommer att göra _%1$d-%2$d skada._\n\nAtt zappa denna försvarsavdelning med din försvarstav kommer att uppgradera den.\n\nDenna försvarsavdelning kommer att zappa fem gånger innan den försvinner.\n\nDin försvarstav använder _%3$d energi_ för att upprätthålla denna försvarsavdelning.
items.wands.wandofwarding$ward.desc_4=Denna mindre vaktpost har samma eldkraft som en större försvarsstav, men har hälsa istället för ett visst antal laddningar. Den liknar ädelstenen på spetsen av din försvarstav. Varje zapp från denna vaktpost kommer att göra _%1$d-%2$d skada._\n\nAtt zappa denna vaktpost med din försvarstav kommer att uppgradera och läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den zappar en fiende, men kan helas genom att använda din försvarstav på den.\n\nDin försvarstav använder _%3$d energi_ för att upprätthålla denna vaktpost.
items.wands.wandofwarding$ward.desc_5=Denna uppgraderade vaktpost är större och mer hållbar än en mindre vaktpost. Varje zapp från denna vaktpost kommer att göra _%1$d-%2$d skada._\n\nAtt zappa denna vaktpost med din avvärjningstavla kommer att uppgradera och läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den zappar en fiende, men kan helas genom att använda din avvärjningstavla på den.\n\nDin avvärjningstavla använder _%3$d energi_ för att upprätthålla denna vaktpost.
items.wands.wandofwarding$ward.desc_6=Denna helt uppgraderade vaktpost är betydligt mer hållbar än sina föregångare. Varje zapp från denna vaktpost kommer att göra _%1$d-%2$d skada._\n\nAtt zappa denna vaktpost med din avvärjningstavla kommer att läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den zappar en fiende, men kan helas genom att använda din avvärjningstavla på den.\n\nDin avvärjningstavla använder _%3$d energi_ för att upprätthålla denna vaktpost.
items.wands.wandofwarding$ward.desc_generic_sentry=Denna vaktpost har samma eldkraft som en försvarsstav, men har hälsa istället för ett visst antal laddningar. Den liknar ädelstenen på spetsen av din försvarstav.\n\nAtt slå denna vaktpost med din försvarstav kommer att uppgradera och läka den.\n\nDenna vaktpost kommer att spendera lite hälsa varje gång den slår en fiende, men kan helas genom att använda din försvarstav på den.
items.wands.wandofwarding$ward.desc_generic_ward=Denna försvarsavdelning kommer automatiskt att zappa alla fiender som kommer inom dess synfält.\n\nAtt zappa denna försvarsavdelning med din försvarstav kommer att uppgradera den.\n\nFjärrförsvar har ett begränsat antal zappar innan de försvinner.
items.wands.wandofwarding$ward.discover_hint=Du kan hitta den här karaktären med en specifik trollstav.
items.wands.wandofwarding$ward.dismiss_body=Du kan fördriva denna försvarsavdelning om du inte längre vill att din trollstav ska underhålla den. Om du gör det förstörs försvarsavdelningen omedelbart. \n\nVill du fördriva denna försvarsavdelning?
items.wands.wandofwarding$ward.dismiss_cancel=inga
items.wands.wandofwarding$ward.dismiss_confirm=ja
items.wands.wandofwarding$ward.dismiss_title=Avfärda den här avdelningen?
items.wands.wandofwarding$ward.name_1=mindre avdelning
items.wands.wandofwarding$ward.name_2=avdelning
items.wands.wandofwarding$ward.name_3=större avdelning
items.wands.wandofwarding$ward.name_4=mindre vaktpost
items.wands.wandofwarding$ward.name_5=vakt
items.wands.wandofwarding$ward.name_6=större vaktpost
items.wands.wandofwarding.bad_location=Du kan inte placera en avdelning där.
items.wands.wandofwarding.bmage_desc=När _stridsmagikern_ slår en fiende med en skyddsstav, har alla aktiva skyddslingar och vaktposter en chans att bli helade.
items.wands.wandofwarding.desc=Denna korta metallstav har en ljuslila ädelsten som svävar ovanför spetsen.
items.wands.wandofwarding.eleblast_desc=En elementär explosion med en stav av skydd helar alla skydd och vakter i explosionsområdet.
items.wands.wandofwarding.name=avvärjningstavla
items.wands.wandofwarding.no_more_wards=Din trollstav klarar inte av fler avvärjningar.
items.wands.wandofwarding.staff_name=personal på vakthavande
items.wands.wandofwarding.stats_desc=Istället för att direkt skada en fiende, kommer denna trollstav att kalla fram stationära försvar och vakter. Värder kan kallas fram var som helst, även genom väggar om du har sikt. Denna trollstav kan upprätthålla _%d energi_ värde av försvar åt gången.
items.wands.wandofwarding.upgrade_stat_name_1=Skador på avdelningen
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=DRYCK
items.waterskin.collected=Du samlar daggdropparna i din vattensäck.
items.waterskin.desc=En behållare för vätska, gjord av läder och snöre, förseglad med en korkpropp.
items.waterskin.desc_full=Den fulla vattenskinen verkar utstråla energi, kanske kan den användas för att välsigna ett annat överlevnadsföremål?
items.waterskin.desc_heal=Vattensäcken används för närvarande för att lagra helande vatten. Ju fylligare vattensäcken är, desto mer läkt blir du omedelbart när du dricker ur den. Du dricker bara så mycket du behöver.
items.waterskin.desc_water=Just nu innehåller vattensäcken bara lite vanligt dricksvatten. Det finns säkert något i fängelsehålan som vattensäcken skulle kunna förvara istället.
items.waterskin.discover_hint=En av hjältarna börjar med det här föremålet.
items.waterskin.empty=Din vattensäck är tom!
items.waterskin.full=Din vattensäck är full!
items.waterskin.name=vattensäck
items.weapon.curses.annoying.desc=Irriterande vapen kan tala, men de är lite för energiska. De kommer ofta att dra uppmärksamhet till dig utan att avsiktligt.
items.weapon.curses.annoying.elestrike_desc=Ett elementärt angrepp med en irriterande förbannelse har 20 % chans att amokförgöra varje fiende inom räckhåll i 6 rundor.
items.weapon.curses.annoying.msg_1=ÅH, SLÅSS VI MOT NÅGOT!?
items.weapon.curses.annoying.msg_10=VÄL SLÅTT!
items.weapon.curses.annoying.msg_11=Jag ville inte vara ett vapen, jag ville vara en skogshuggaryxa.
items.weapon.curses.annoying.msg_12=Kom ihåg att överdriven självförtroende är en långsam och lömsk mördare.
items.weapon.curses.annoying.msg_13=HELA DINA BASER TILLHÖR OSS!
items.weapon.curses.annoying.msg_2=JA, TA DEM!
items.weapon.curses.annoying.msg_3=HEJ, LYSSNA!
items.weapon.curses.annoying.msg_4=ÄR VI BOSSEN ÄN!?
items.weapon.curses.annoying.msg_5=AJ, SVINGA MIG INTE SÅ HÅRT!
items.weapon.curses.annoying.msg_6=DÖ, INSEKTER!
items.weapon.curses.annoying.msg_7=HÄHÄHÄH!
items.weapon.curses.annoying.msg_8=KAN VI TA EN PAUS!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.name=irriterande %s
items.weapon.curses.dazzling.desc=Bländande vapen blinkar ibland med bländande ljus och bländar allt som kan se dem.
items.weapon.curses.dazzling.elestrike_desc=Ett elementärt anfall med en bländande förbannelse har 50 % chans att förblinda varje fiende inom räckhåll i 6 rundor.
items.weapon.curses.dazzling.name=bländande %s
items.weapon.curses.displacing.desc=Förflyttningsvapen är fyllda med kaotisk teleporteringsmagi och har förmågan att förvränga fiender slumpmässigt runt golvet.
items.weapon.curses.displacing.elestrike_desc=Ett elementärt anfall med en förträngande förbannelse har 50% chans att teleportera varje fiende inom räckhåll.
items.weapon.curses.displacing.name=förskjuter %s
items.weapon.curses.explosive.desc=Explosiva vapen bygger stadigt upp kraft och exploderar, vilket skadar allt i närheten.
items.weapon.curses.explosive.desc_cool=Ditt vapen är för närvarande svalt att ta på.
items.weapon.curses.explosive.desc_hot=Ditt vapen är hett! Det håller på att explodera!
items.weapon.curses.explosive.desc_warm=Ditt vapen bygger upp energi och blir varmt...
items.weapon.curses.explosive.elestrike_desc=Ett elementärt attack med en explosiv förbannelse har 50 % chans att orsaka en explosion mot en slumpmässig fiende inom räckhåll.
items.weapon.curses.explosive.hot=Varm!
items.weapon.curses.explosive.name=explosiv %s
items.weapon.curses.explosive.warm=Värma...
items.weapon.curses.friendly.desc=Vänliga vapen passar bäst för pacifister, då de ibland utlöser magi som gör det omöjligt att slåss.
items.weapon.curses.friendly.elestrike_desc=Ett elementärt anfall med en vänlig förbannelse har 50 % chans att charma varje fiende inom räckhåll i 6 rundor.
items.weapon.curses.friendly.name=vänlig %s
items.weapon.curses.polarized.desc=Ett polariserat vapen påverkas av magi som gör att dess attack antingen gör 50 % mer skada, eller ingen skada alls.
items.weapon.curses.polarized.elestrike_desc=Ett elementärt anfall med en polariserad förbannelse har 50 % chans att göra 24–36 skada på varje fiende inom räckhåll.
items.weapon.curses.polarized.name=polariserad %s
items.weapon.curses.sacrificial.desc=Offervapen kommer att kräva blod från bäraren i utbyte mot att attackera fiender. Ju friskare bäraren är, desto mer blod kommer förbannelsen att ta.
items.weapon.curses.sacrificial.elestrike_desc=En elementär attack med en offerförbannelse får hjälten och varje fiende inom räckhåll att förblöda för 12 HP.
items.weapon.curses.sacrificial.name=uppoffrande %s
items.weapon.curses.wayward$waywardbuff.desc=Ditt egensinniga vapens magi har aktiverats, vilket gör det extremt oprecis under en kort tid. Observera att detta inte påverkar attacker som garanterat träffar, såsom överraskningsattacker. Om du lyckas attackera med det egensinniga vapnet försvinner denna effekt omedelbart.\n\nÅterstående tur: %s.
items.weapon.curses.wayward$waywardbuff.name=egensinnig
items.weapon.curses.wayward.desc=Irrationella vapen blir ibland extremt oprecisa. Denna magi varar en kort stund när den aktiveras, men kan skingras genom att man träffar det rare vapnet.
items.weapon.curses.wayward.elestrike_desc=Ett elementärt angrepp med en egensinnig förbannelse har 50 % chans att hexa varje fiende inom räckhåll i 6 rundor.
items.weapon.curses.wayward.name=egensinnig %s
items.weapon.enchantments.blazing.desc=Denna förtrollning får lågor att spruta ut från ett vapen, vilket antänder fiender och orsakar bonusskada på fiender som redan är i brand.
items.weapon.enchantments.blazing.elestrike_desc=Ett elementärt angrepp med en flammande förtrollning sprider eld till varje ruta inom räckhåll, vilket varar i 8 omgångar.
items.weapon.enchantments.blazing.name=flammande %s
items.weapon.enchantments.blocking$blockbuff.desc=Ditt vapens blockerande förtrollning har gett dig en kort boost till din defensiva kraft!\n\nÅterstående avskärmning: %d\n\nÅterstående tur: %s.
items.weapon.enchantments.blocking$blockbuff.name=blockering
items.weapon.enchantments.blocking.desc=Blockerande vapen har chansen att kortvarigt skydda dig efter att du anfallit med dem.
items.weapon.enchantments.blocking.elestrike_desc=En elementär attack med en blockerande förtrollning ger Duelisten 6 extra sköldar för varje fiende inom räckhåll.
items.weapon.enchantments.blocking.name=blockerande %s
items.weapon.enchantments.blooming.desc=Blommande vapen innehåller magi som får vegetation att spira på eller runt de som träffas av dem.
items.weapon.enchantments.blooming.elestrike_desc=Ett elementärt anfall med en blommande förtrollning sprider gräs till upp till 8 rutor inom räckhåll och rotar alla fiender inom räckhåll i 6 rundor.
items.weapon.enchantments.blooming.name=blommande %s
items.weapon.enchantments.chilling.desc=Fiender som drabbas av denna förtrollning kyls ner, vilket saktar ner deras rörelser och attacker.
items.weapon.enchantments.chilling.elestrike_desc=Ett elementärt anfall med en kylig förtrollning sprider kylig luft till varje ruta inom räckhåll, vilket varar i 8 omgångar.
items.weapon.enchantments.chilling.name=kylning %s
items.weapon.enchantments.corrupting.desc=Denna kraftfulla förtrollning har förmågan att vända fiender till din vilja. När en fiende dödas med detta vapen finns det en chans att de blir korrumperade istället för att dö.
items.weapon.enchantments.corrupting.elestrike_desc=Ett elementärt anfall med en korrumperande förtrollning har en 5–25 % chans (baserat på saknad HP) att korrumpera varje fiende inom räckhåll, förutom det primära målet.
items.weapon.enchantments.corrupting.name=korrumperar %s
items.weapon.enchantments.elastic.desc=Elastiska vapen har chansen att skicka fiender som flyger tillbaka korta sträckor.
items.weapon.enchantments.elastic.elestrike_desc=Ett elementärt anfall med en elastisk förtrollning slår tillbaka alla fiender inom räckhåll 5 rutor.
items.weapon.enchantments.elastic.name=elastisk %s
items.weapon.enchantments.grim.desc=Denna kraftfulla förtrollning har kraften att omedelbart avrätta en fiende. Effekten är mer sannolikt att inträffa ju svagare fienden är.
items.weapon.enchantments.grim.elestrike_desc=Ett elementärt anfall med en dyster förtrollning har en 6–30 % chans (baserat på saknad HP) att döda varje fiende inom räckhåll, förutom det primära målet.
items.weapon.enchantments.grim.name=dyster %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Ditt vapen har lagrat överskottskraften från ett tidigare dödande slag och kommer att tillämpa den som bonusskada på din nästa attack. Energin kommer dock långsamt att avta med tiden. \n\nBevarad skada: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=bevarad skada
items.weapon.enchantments.kinetic.desc=När en fiende dödas med ett kinetiskt vapen lagras all överskottskraft i vapnet och används vid nästa lyckade attack.
items.weapon.enchantments.kinetic.elestrike_desc=Ett elementärt anfall med kinetisk förtrollning applicerar 40 % av lagrad skada på varje fiende inom räckhåll, förutom det primära målet.
items.weapon.enchantments.kinetic.name=kinetisk %s
items.weapon.enchantments.lucky.desc=Fiender som dödas av ett turvapen har en chans att släppa extra byte.
items.weapon.enchantments.lucky.elestrike_desc=En elementär attack med en lyckoförtrollning har 12,5% chans att skapa byte under varje fiende inom räckhåll. Denna effekt kan bara utlösas en gång per fiende.
items.weapon.enchantments.lucky.name=tur %s
items.weapon.enchantments.projecting.desc=Med denna förtrollning får närstridsvapen extra räckvidd. Avståndsvapen tränger igenom väggar när de riktas mot närliggande mål.
items.weapon.enchantments.projecting.elestrike_desc=Ett elementärt anfall med en utskjutande förtrollning gör 30 % skada på varje fiende inom räckhåll, förutom det primära målet.
items.weapon.enchantments.projecting.name=utskjutande %s
items.weapon.enchantments.shocking.desc=Elektricitetsbågar från ett chockerande vapen orsakar extra skada på alla fiender i närheten.
items.weapon.enchantments.shocking.elestrike_desc=Ett elementärt anfall med en chockerande förtrollning sprider elektricitet till varje ruta inom räckhåll, vilket varar i 8 omgångar.
items.weapon.enchantments.shocking.name=chockerande %s
items.weapon.enchantments.unstable.desc=Denna förtrollning utstrålar kaotisk energi och fungerar som en ny förtrollning för varje träff.
items.weapon.enchantments.unstable.elestrike_desc=En elementär attack med en instabil förtrollning applicerar en slumpmässig förtrollningseffekt på varje fiende inom räckhåll, förutom det primära målet.
items.weapon.enchantments.unstable.name=instabil %s
items.weapon.enchantments.vampiric.desc=Denna kraftfulla förtrollning suger livskraft från fiender med varje slag och kanaliserar den tillbaka till bäraren. Effekten är starkare ju lägre bärarens hälsa är.
items.weapon.enchantments.vampiric.elestrike_desc=En elementär attack med en vampyrförtrollning helar Duelisten för 2,5 HP för varje fiende inom räckhåll.
items.weapon.enchantments.vampiric.name=vampyrisk %s
items.weapon.melee.assassinsblade.ability_desc=Duelisten kan _smyga_ medan hon svingar ett lönnmördarblad. Denna förmåga låter Duelisten blinka direkt upp till 3 rutor bort och ger henne _%d osynlighetsrundor._
items.weapon.melee.assassinsblade.ability_name=smyga sig
