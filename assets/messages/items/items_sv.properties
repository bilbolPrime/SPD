items.armor.warriorarmor.desc=Medan krigaren bär denna tunga pläterade rustning kan han utföra en speciell förmåga.
items.armor.warriorarmor.name=hjältens platemail
items.artifacts.alchemiststoolkit.ac_brew=BRYGGA
items.artifacts.alchemiststoolkit.ac_energize=ENERGI
items.artifacts.alchemiststoolkit.cursed=Din förbannade verktygslåda hindrar dig från att använda alkemi!
items.artifacts.alchemiststoolkit.desc=Denna verktygslåda innehåller ett antal reagenser och örter tillsammans med en liten blandningsflaska, vilket möjliggör alkemi när du är på språng. Flaskan innehåller vad som ser ut som alkemiska energikristaller i flytande form.
items.artifacts.alchemiststoolkit.desc_cursed=Den förbannade verktygslådan har bundit sig vid din sida och vägrar låta dig använda alkemi.
items.artifacts.alchemiststoolkit.desc_hint=Den utrustade verktygslådan genererar långsamt alkemisk energi allt eftersom du får erfarenhet. Det ser ut som att blandningen i flaskan skulle kunna förbättras genom att tillsätta energikristaller.
items.artifacts.alchemiststoolkit.desc_warming=Verktygssatsen värms just nu upp och kommer att vara redo att användas efter en liten stund.
items.artifacts.alchemiststoolkit.energize_1=6 energi: +1 nivå
items.artifacts.alchemiststoolkit.energize_all=%1$d energi: +%2$d nivåer
items.artifacts.alchemiststoolkit.energize_desc=Var 6:e energikristall ger verktygslådan tillräckligt med energi för att nå en nivå, vilket ökar hastigheten med vilken verktygslådan genererar energi över tid och hur snabbt den värms upp. \n\nHur mycket energi vill du använda?
items.artifacts.alchemiststoolkit.name=alkemistens verktygslåda
items.artifacts.alchemiststoolkit.need_energy=Du behöver minst 6 energier för det.
items.artifacts.alchemiststoolkit.not_ready=Din verktygslåda har inte värmts upp färdigt.
items.artifacts.artifact.cannot_wear_two=Du kan inte bära två av samma artefakt.
items.artifacts.artifact.curse_known=Du kan känna en ondskefull magi lura inuti artefakten.
