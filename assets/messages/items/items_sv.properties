items.weapon.melee.greataxe.ability_desc=Duelisten kan utföra en _retribution_-attack med en greadyxa om hon har en hälsa under 50%%. Denna förödande attack gör _%1$d-%2$d skada,_ garanteras att träffa och är omedelbar om den dödar en fiende.
