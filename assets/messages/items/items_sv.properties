items.weapon.melee.quarterstaff.typical_ability_desc=Duelisten kan inta en _defensiv ställning_ med en kvartstav. Denna ställning tar ingen tid att aktivera och tredubblar hennes undvikande, vanligtvis för _%d-omgångar._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Förmåga Varaktighet
