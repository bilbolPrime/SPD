items.weapon.melee.glaive.name=glasögon
items.weapon.melee.glaive.stats_desc=Detta är ett ganska långsamt vapen. \nDetta vapen har extra räckvidd.
items.weapon.melee.glaive.typical_ability_desc=Duelisten kan använda spetsen på en glasögon för att _spika_ en fiende som är inom räckhåll men inte intill. Detta orsakar vanligtvis _%1$d-%2$d skada_, slår tillbaka fienden och är garanterad att träffa.
items.weapon.melee.gloves.ability_desc=Duelisten kan utföra en _kombinationsattack_ med dubbade handskar. Denna attack garanterar träffande och gör _+%d skada_ för varje gång duelisten har träffat med en vanlig närstridsattack eller en vapenattack med kastat slag. Om du inte träffar på 5 turer återställs denna kombination.
items.weapon.melee.gloves.ability_name=kombinationsslag
