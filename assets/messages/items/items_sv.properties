items.armor.glyphs.swiftness.desc=Denna teckenförstärkare ökar bärarens hastighet när de inte är nära en fiende.
items.armor.glyphs.swiftness.name=%s av snabbhet
items.armor.glyphs.thorns.desc=Denna kraftfulla tecken skadar angripare och får dem att långsamt blöda när de attackerar bäraren.
items.armor.glyphs.thorns.name=%s av törnen
items.armor.glyphs.viscosity$defereddamage.desc=Skada hanteras långsamt över tid istället för omedelbart. \n\n Återstående uppskjuten skada: %d.
