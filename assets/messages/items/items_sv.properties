items.weapon.melee.greataxe.typical_ability_desc=Duelisten kan utföra en _retribution_-attack med en greaaxe om hon har en hälsa under 50%%. Denna förödande attack orsakar vanligtvis _%1$d-%2$d skada,_ garanteras att träffa och är omedelbar om den dödar en fiende.
items.weapon.melee.greatshield.ability_desc=Duelisten kan _skydda_ sig själv med en storsköld, vilket helt omintetgör alla fysiska eller magiska attacker mot henne under _%d turer_. När duelisten har blockerat en attack, kommer attack mot henne eller användning av magi att avsluta skyddet.
items.weapon.melee.greatshield.ability_name=skydda
