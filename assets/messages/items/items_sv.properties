items.amulet.ac_end=AVSLUTA SPELET
items.amulet.ascent_desc=Du börjar känna Yog-Dzewas stora och fruktansvärda kraft stråla ut från amuletten. Att stiga tillbaka genom fängelsehålan som en dödlig kan vara svårare än du trodde!\n\nOm du fortsätter att stiga med amuletten kommer fängelsehålan att bli farligare, teleportering mellan våningar kommer att inaktiveras, och du kommer bara att kunna vinna spelet genom att besegra fiender när du stiger genom fängelsehålan!\n\nDu kan lämna amuletten här för tillfället om du vill stiga utan att starta den här utmaningen, eller aktivera amuletten innan du stiger upp för att avsluta spelet normalt.
items.amulet.ascent_no=Stopp för nu
items.amulet.ascent_title=Uppstigning
items.amulet.ascent_yes=Fortsätta!
items.amulet.desc=Yendors amulett är den kraftfullaste artefakten som människor eller dvärgar känner till. Dess skimrande kristaller innehåller otrolig och underbar kraft.
items.amulet.desc_ascent=Amulettens ursprung är okänt, men det är tydligt att den har varit starkt influerad av Yog-Dzewas kraft. Fängelsehålan verkar böja sig för Yogs vilja när du rör dig genom den, vilket gör fienderna mycket fler och mäktigare! Du kan inte längre aktivera eller kasta amuletten, nästan som om den är förbannad.
items.amulet.desc_origins=Amulettens ursprung är okänt. Historien säger att dvärgarnas kung skröt om att han hade upptäckt artefakten strax innan dvärgcivilisationen bröt all kontakt. Hur hittade han den? Hur tog Yog-Dzewa den ifrån honom? Frågor för en annan gång kanske, allt som spelar roll nu är att amuletten är din!
items.amulet.discover_hint=Du hittar det här föremålet längst ner i grottan...
items.amulet.name=amulett av yendor
items.ankh.ac_bless=välsigna
items.ankh.bless=Du välsignar ankh med magiskt vatten.
items.ankh.desc=Denna uråldriga symbol för odödlighet låter dig återvända till livet efter döden. Vid återuppståndelsen förloras alla föremål som du inte har utrustat.
items.ankh.desc_blessed=Denna uråldriga symbol för odödlighet ger möjligheten att återvända till livet efter döden. Ankh har välsignats och är nu mycket starkare. Ankh kommer att offra sig själv för att rädda dig i ett ögonblick av dödlig fara.
items.ankh.discover_hint=Du kan köpa den här varan i en butik.
items.ankh.name=ankh
items.arcaneresin.ac_apply=TILLÄMPAS
items.arcaneresin.apply=Du täcker din trollstav med harts, vilket ökar dess kraft!
items.arcaneresin.desc=Detta fina pulver skimrar mellan nyanser av lila och vitt. Det kan fungera som en förstärkare för magiska energier och ökar nivån på trollstavar när det appliceras på dem!\n\nAtt uppgradera en trollstav kostar 1, 2 eller 3 resin beroende på trollstavens initiala nivå. Resin kan uppgradera trollstavar till maximalt +3.\n\nResinuppgraderingar _åsidosätts dock av andra uppgraderingskällor_ (som uppgraderingsskriftrullar) och gäller inte när en trollstav placeras i magikerns stav.
items.arcaneresin.discover_hint=Du kan tillverka det här föremålet via alkemi.
items.arcaneresin.level_too_high=Den där staven är för kraftfull för att hartset ska kunna förbättras.
items.arcaneresin.name=svårbegripligt harts
items.arcaneresin.not_enough=Du har inte tillräckligt med harts för det!
items.arcaneresin.prompt=Välj en trollstav
