items.rings.ringofarcana.combined_stats=Dina utrustade ringar kombinerar sin kraft och ökar kraften hos förtrollningar och glyfer med totalt _%s%%_.
items.rings.ringofarcana.desc=Denna ring förstärker magiska förtrollningar på vapen och tecken på rustningar, inklusive förbannelser! Den ökar först aktiveringschansen och ökar sedan effektens styrka när aktiveringschansen är 100 %. En förbannad ring försvagar istället förtrollningar, tecken och förbannelser.
items.rings.ringofarcana.name=Arcanas ring
items.rings.ringofarcana.stats=När den bärs kommer denna ring att öka kraften i förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.typical_stats=När den bärs kommer den här ringen vanligtvis att öka kraften hos förtrollningar och glyfer med _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofelements.combined_stats=Dina utrustade ringar kombinerar sin kraft och ger totalt _%s%%_ elementärt motstånd.
items.rings.ringofelements.desc=Den här ringen ger motståndskraft mot bland annat eld, elektricitet och gaser. Den förkortar också varaktigheten hos negativa effekter.
items.rings.ringofelements.name=ring av element
items.rings.ringofelements.stats=När den bärs kommer denna ring att ge _%s%%_ elementärt motstånd.
