items.armor.curses.antientropy.desc=Anti-entropiförbannelsen verkar mot universums krafter och drar energi in i bäraren och bort från omgivningen. Detta sätter bäraren i brand kortvarigt, men fryser allt omkring hen!
items.armor.curses.antientropy.name=%s av antientropi
items.armor.curses.bulk.desc=En kraftig rustning ser större och mer imponerande ut, men har egentligen inget förbättrat försvar. Ännu värre är att den ökade storleken gör det mycket svårt att ta sig in i dörröppningar.
items.armor.curses.bulk.name=%s av bulk
items.armor.curses.corrosion.desc=Korrosionsskydd kan sprängas med frätande vätska och täcka allt i området med klibbig sur vätska.
items.armor.curses.corrosion.name=%s av korrosion
items.armor.curses.displacement.desc=Förskjutningens förbannelse försöker flytta bäraren i säkerhet när de blir attackerade. Den är dock lite för effektiv och teleporterar användaren slumpmässigt runt på nivån.
items.armor.curses.displacement.name=%s av förskjutning
items.armor.curses.metabolism.desc=Metabolismförbannelsen omvandlar direkt mättnad till hälsa när bäraren skadas, vilket ger en läkningskänsla men orsakar snabbt svält.
items.armor.curses.metabolism.name=%s av ämnesomsättningen
items.armor.curses.multiplicity.desc=Rustning förbannad med mångfald innehåller farlig dupliceringsmagi. Den skapar ibland en spegelbild av bäraren, men är lika benägen att duplicera angriparen!
items.armor.curses.multiplicity.name=%s av mångfald
items.armor.curses.overgrowth.desc=Pansar av igenväxning är täckta av diverse blommande växter. Även om den här effekten verkligen ser intressant ut, gör den ingenting för försvaret, och dessa växter aktiveras slumpmässigt i strid!
items.armor.curses.overgrowth.name=%s av överväxt
items.armor.curses.stench.desc=Rustning förbannad med stank kommer att släppa ut moln av giftig gas, vilket är farligt för allt som fångats i molnet.
items.armor.curses.stench.name=%s av stank
items.armor.duelistarmor.desc=Medan Duelisten bär denna plåtrustning och mantel kan han utföra en speciell förmåga.
items.armor.duelistarmor.name=hjältens bröstskydd
items.armor.glyphs.affection.desc=Denna kraftfulla glyf manipulerar angriparnas sinnen och charmar dem tillfälligt.
items.armor.glyphs.affection.name=%s av tillgivenhet
items.armor.glyphs.antimagic.desc=Denna kraftfulla symbol låter rustningen försvara sin bärare mot både magiska och fysiska attacker. Detta magiska försvar påverkas inte av rustningens nivå.
items.armor.glyphs.antimagic.name=%s av antimagi
items.armor.glyphs.brimstone.desc=Denna glyph skyddar bäraren och dennes tillhörigheter från eld, vilket helt ogiltigförklarar dess skador och negativa effekter.
items.armor.glyphs.brimstone.name=%s av svavel
items.armor.glyphs.camouflage.desc=Denna symbol gör att bäraren kan smälta in i högt gräs, vilket ger dem tillfällig osynlighet.
items.armor.glyphs.camouflage.name=%s av kamouflage
items.armor.glyphs.entanglement.desc=Denna glyph odlar en jordisk rustning runt bäraren för att absorbera skada, men rustningen kommer att gå sönder om bäraren rör sig.
items.armor.glyphs.entanglement.name=%s av intrassling
items.armor.glyphs.flow.desc=Denna symbol manipulerar vattenflödet runt bäraren, vilket gör att de rör sig mycket snabbare genom det.
items.armor.glyphs.flow.name=%s av flöde
items.armor.glyphs.obfuscation.desc=Denna tecken döljer bäraren, vilket gör hen svårare att upptäcka.
items.armor.glyphs.obfuscation.name=%s av förvirring
items.armor.glyphs.potential.desc=Denna glyph bygger energi när den träffas, och ger laddning till bärarens trollstav när den aktiveras.
items.armor.glyphs.potential.name=%s av potentiell
items.armor.glyphs.repulsion.desc=Denna glyph studsar tillbaka med kraft mot angripare och skickar dem flygande tillbaka.
items.armor.glyphs.repulsion.name=%s av repulsion
items.armor.glyphs.stone.desc=Denna glyph omger rustningen med tung magisk sten som gör det omöjligt att undvika, men blockerar skada i proportion till undvikande.
