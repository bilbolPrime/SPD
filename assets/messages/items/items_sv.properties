items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbarisk
items.weapon.weaponeffects.weaponeffect.smite.name=%s från barbaren
items.weapon.weaponeffects.weaponeffect.smite.desc=Det här vapnet är _barbariskt_. Träffar har _20%_ chans att utlösa _Slag på nivå 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Slag!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Bortstötande
items.weapon.weaponeffects.weaponeffect.knockback.name=Bortstötande %s
items.weapon.weaponeffects.weaponeffect.knockback.desc=Det här vapnet är _bortstötande_. Träffar har _20%_ chans att knuffa en fiende _en ruta_ bakåt. Bossar kan inte knuffas.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Tillbakastötning!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Ormlik
items.weapon.weaponeffects.weaponeffect.venom.name=%s från ormen
items.weapon.weaponeffects.weaponeffect.venom.desc=Det här vapnet är _ormlikt_. Träffar har _20%_ chans att förgifta målet.
items.weapon.weaponeffects.weaponeffect.venom.activate=Gift!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Lemlästande
items.weapon.weaponeffects.weaponeffect.kneeshot.name=Lemlästande %s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Det här vapnet är _lemlästande_. Avståndsträffar har _20%_ chans att göra en fiende halt i _10 turer_. Bossar är immuna.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Halt!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Runisk
items.weapon.weaponeffects.weaponeffect.spark.name=%s med runor
items.weapon.weaponeffects.weaponeffect.spark.desc=Den här staven är _runisk_. Dess magi har _20%_ chans att utlösa _Gnista_, som ger _4–8_ extra magisk skada.
items.weapon.weaponeffects.weaponeffect.spark.activate=Gnista!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Förhäxande
items.weapon.weaponeffects.weaponeffect.curse.name=Förhäxande %s
items.weapon.weaponeffects.weaponeffect.curse.desc=Den här staven är _förhäxande_. Dess magi har _20%_ chans att försvaga målet så att det ger _5%_ mindre skada i _10 turer_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Förbannelse!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Livssugande
items.weapon.weaponeffects.weaponeffect.drainlife.name=Livssugande %s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Den här staven är _livssugande_. Dess magi har _20%_ chans att utlösa _Livsdränering_, som ger _8–16_ extra magisk skada och läker dig med lika mycket liv som stjäls.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Livsdränering!

items.armor.armorprefix.stalwart.name=%s av ståndaktighet
items.armor.armorprefix.stalwart.desc=Den här rustningen är _ståndaktig_. Fiendens attacker har _20%_ chans att utlösa _Tålighet på nivå 5_, vilket minskar deras skada med _20%_.
items.armor.armorprefix.stalwart.activate=Tålighet!

items.armor.armorprefix.vigilant.name=Vaksam %s
items.armor.armorprefix.vigilant.desc=Den här rustningen är _vaksam_. Den ger dig _20%_ chans att undvika en fiendes avståndsattack.
items.armor.armorprefix.vigilant.activate=Vaksamhet!

items.armor.armorprefix.elusive.name=Undflyende %s
items.armor.armorprefix.elusive.desc=Den här rustningen gör dig _undflyende_. När en fiendes attack skadar dig finns _20%_ chans att din undvikandeförmåga ökar med _5_ i _5 turer_.
items.armor.armorprefix.elusive.activate=Undvikande!
