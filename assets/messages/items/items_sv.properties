items.weapon.melee.battleaxe.ability_desc=Duelisten kan utföra ett _kraftigt slag_ med en stridsyxa. Denna koncentrerade attack gör _%1$d-%2$d skada_ om den överraskar fienden, och förvirrar dem i 5 turer vilket minskar precision och undvikande med 50%%. Ett kraftigt slag träffar alltid men gör regelbunden skada om det inte överraskar fienden.
items.weapon.melee.battleaxe.ability_name=kraftigt slag
items.weapon.melee.battleaxe.desc=Det enorma stålhuvudet på denna stridsyxa lägger avsevärd tyngd bakom varje breda hugg.
items.weapon.melee.battleaxe.name=stridsyxa
items.weapon.melee.battleaxe.stats_desc=Detta är ett ganska exakt vapen.
items.weapon.melee.battleaxe.typical_ability_desc=Duelisten kan utföra ett _kraftigt slag_ med en stridsyxa. Denna koncentrerade attack gör vanligtvis _%1$d-%2$d skada_ om den överraskar fienden, och förvirrar dem i 5 turer vilket minskar precision och undvikande med 50%%. Ett kraftigt slag träffar alltid men gör regelbunden skada om det inte överraskar fienden.
items.weapon.melee.crossbow$chargedshot.desc=Duelisten fokuserar kraften på sitt armborst. Nästa attack hon gör med den kommer alltid att träffa och tillämpa en av tre effekter: \n - Närstridsattacker slår ner fiender några rutor bort. \n - Ospetsade pilar ger bonusskada. \n - Spetsade pilar får extra användningsområden och tillämpar sin effekt i ett 7x7-område. Positiva pileffekter påverkar endast allierade, och skadliga effekter gäller endast fiender. Duelisten kan inte använda denna förmåga för att tillämpa positiva pileffekter på sig själv.
items.weapon.melee.crossbow$chargedshot.name=laddad
items.weapon.melee.crossbow.ability_desc=Duelisten kan _ladda_ sitt armborst, vilket gör att hennes nästa regelbundna attack med den alltid träffar och tillämpar en av tre effekter: närstridsattacker slår bort fiender, ospetsade pilar gör _+%1$d skada_, och spetsade pilar tillämpar sin effekt i ett 7x7-område och varar i _%2$d fler användningsområden_.
items.weapon.melee.crossbow.ability_name=laddat skott
items.weapon.melee.crossbow.desc=Ett ganska invecklat vapen som skjuter blixtar med exceptionella hastigheter. Även om det inte är designat för det, gör armborstens tyngd och robusta konstruktion det också till ett hyfsat närstridsvapen.
items.weapon.melee.crossbow.name=armborst
items.weapon.melee.crossbow.stats_desc=Detta vapen förstärker kastade pilar för att göra _%1$d-%2$d skada_ när det är utrustat, och kommer till och med att ge dem sin förtrollning.
items.weapon.melee.crossbow.typical_ability_desc=Duelisten kan _ladda_ sitt armborst, vilket gör att hennes nästa regelbundna attack med den alltid träffar och tillämpar en av tre effekter: närstridsattacker slår bort fiender, ospetsade pilar orsakar vanligtvis _+%1$d skada_, och spetsade pilar tillämpar sin effekt i ett 7x7-område och varar vanligtvis i _%2$d fler användningsområden_.
items.weapon.melee.crossbow.typical_stats_desc=Vanligtvis förstärker detta vapen kastade pilar för att göra _%1$d-%2$d skada_ när det är utrustat, och kommer till och med att ge dem sin förtrollning.
