items.potions.potion.no=Nej, jag ändrade mig
items.potions.potion.shatter=Kolven splittras och vätskan stänker ofarligt.
items.potions.potion.silver=silverdryck
items.potions.potion.sure_drink=Är du säker på att du vill dricka det? I de flesta fall borde du kasta sådana trolldrycker på dina fiender.
items.potions.potion.sure_throw=Är du säker på att du vill kasta den? I de flesta fall är det vettigt att dricka den.
items.potions.potion.turquoise=turkos trolldryck
items.potions.potion.unknown_desc=I den här flaskan virvlar en %s vätska. Vem vet vad som händer om man dricker den eller kastar flaskan?
items.potions.potion.yes=Ja, jag vet vad jag gör
items.potions.potionofexperience.desc=De sägenrika upplevelserna från mängder av strider reducerade till flytande form, detta utkast kommer omedelbart att höja din erfarenhetsnivå.
items.potions.potionofexperience.name=erfarenhetens dryck
items.potions.potionoffrost.desc=När detta ämne kommer i kontakt med luften avdunstar det till ett iskallt moln. Alla varelser som rör vid molnet fryser fast och kan varken röra sig eller handla.
items.potions.potionoffrost.name=frostdryck
items.potions.potionofhaste.desc=Att dricka denna märkligt söta vätska kommer att ge dig enorm energi under en kort tid, vilket gör att du kan springa i höga hastigheter.
items.potions.potionofhaste.energetic=Du känner dig energisk!
items.potions.potionofhaste.name=hastdryck
items.potions.potionofhealing.desc=Ett elixir som genast återställer all din hälsa och botar förgiftning.
items.potions.potionofhealing.heal=Dina sår börjar sluta sig.
items.potions.potionofhealing.name=helande dryck
items.potions.potionofinvisibility.desc=Den här drycken gör dig osynlig en kort stund. Fiender kan inte se dig så länge effekten varar. Om du angriper en fiende eller använder en stav eller skriftrulle inför en fiende blir du synlig igen.
items.potions.potionofinvisibility.invisible=Du ser dina händer bli osynliga!
items.potions.potionofinvisibility.name=osynlighetens trolldryck
items.potions.potionoflevitation.desc=Den här märkliga vätskan får dig att sväva i luften, så att du lätt kan ta dig över fällor. Eld och gas fyller däremot luften och går inte att undvika på det sättet.
items.potions.potionoflevitation.float=Du svävar upp i luften!
items.potions.potionoflevitation.name=levitationsdryck
items.potions.potionofliquidflame.desc=Denna kolv innehåller en instabil förening som våldsamt bryter i brand vid exponering för öppen luft.
items.potions.potionofliquidflame.name=dryck av flytande låga
items.potions.potionofmindvision.desc=Efter att ha druckit detta kommer ditt sinne att bli inställt på den psykiska signaturen hos avlägsna varelser, vilket gör att du kan känna biologiska närvaror genom väggar. Denna dryck kommer också att låta dig se genom närliggande väggar och dörrar.
items.potions.potionofmindvision.name=sinnets synsdryck
items.potions.potionofmindvision.see_mobs=Man kan på något sätt känna närvaron av andra varelsers sinnen!
items.potions.potionofmindvision.see_none=Du kan på något sätt märka att du är ensam på den här nivån just nu.
items.potions.potionofparalyticgas.desc=Vid exponering för öppen luft förångas vätskan i denna kolv till en bedövande gul dis. Den som inhalerar molnet blir omedelbart förlamad och oförmögen att röra sig under en tid efter att molnet har skingrats. Detta föremål kan kastas mot avlägsna fiender för att fånga dem i gasens öga.
items.potions.potionofparalyticgas.name=dryck av paralytisk gas
items.potions.potionofpurity.desc=Det här ämnet neutraliserar snabbt alla skadliga gaser inom området. Om du dricker det blir du tillfälligt immun mot sådana gaser.
items.potions.potionofpurity.freshness=Du känner en ovanlig friskhet i luften.
items.potions.potionofpurity.name=Reningsdryck
items.potions.potionofpurity.protected=En skyddande film omsluter dig!
items.potions.potionofstrength.desc=Denna kraftfulla vätska kommer att strömma genom dina muskler och permanent öka din styrka med en poäng.
items.potions.potionofstrength.msg=Nyfunnen styrka väller genom din kropp, du har nu %d styrka!
items.potions.potionofstrength.name=styrkedryck
items.potions.potionoftoxicgas.desc=Om du korkar upp eller krossar detta trycksatta glas kommer innehållet att explodera till ett dödligt moln av giftig grön gas. Du kan välja att kasta denna dryck mot avlägsna fiender istället för att korka upp den för hand.
items.potions.potionoftoxicgas.name=dryck av giftig gas
items.quest.ceremonialcandle.desc=En uppsättning ljus, smälta ner och sammanfogade genom användning. \n\n Ensamma är de värdelösa, men använda med andra ljus i ett mönster kan de fokusera energin för en åkallande ritual.
items.quest.ceremonialcandle.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.ceremonialcandle.name=ceremoniellt ljus
items.quest.corpsedust.chill=En rysning rinner längs ryggraden på dig.
items.quest.corpsedust.desc=Klotan av likdamm skiljer sig inte utåt från en vanlig dammboll. Men man kan känna en ondskefull energi som lurar inuti den. \n\nAtt bli av med den så snart som möjligt vore en bra idé.
items.quest.corpsedust.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.corpsedust.name=likdamm
items.quest.darkgold.desc=Denna metall kallas mörk inte på grund av sin färg (den skiljer sig inte från vanligt guld), utan för att den smälter i dagsljuset, vilket gör den oanvändbar på ytan.
items.quest.darkgold.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.darkgold.name=mörk guldmalm
items.quest.darkgold.you_now_have=Du har nu %d mörk guldmalm.
items.quest.dwarftoken.desc=Många dvärgar och några av deras större skapelser bär dessa små metallbitar med okänt syfte. Kanske är de smycken eller kanske någon form av ID. Dvärgar är märkliga människor.
items.quest.dwarftoken.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.dwarftoken.name=dvärgpolett
items.quest.embers.desc=Speciella glödande element som bara kan utvinnas från unga eldelement. De utstrålar värmeenergi.
items.quest.embers.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.embers.name=elementära glöd
items.quest.escapecrystal.ac_use=ANVÄNDA
items.quest.escapecrystal.desc=En tunn magisk kristall som verkar innehålla teleporteringsmagi. Du kan använda kristallen när som helst för att lämna dvärgarnas valv, men du kommer inte att kunna ta med dig något!
items.quest.escapecrystal.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.escapecrystal.name=flyktkristall
items.quest.gooblob.desc=En ryckig klump gegga, som lossnade från geggan när den dog. Det är nästan som en stor boll gelé, även om du inte skulle våga äta den. \n\nDen gör ingenting på egen hand, men den kan vara användbar i kombination med vissa trolldrycker eller en bomb. Som allra minst borde den omvandlas till en hyfsad mängd energi.
items.quest.gooblob.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.quest.gooblob.name=en klump av gegga
items.quest.metalshard.desc=En skärva av rostig, förbannad metall, som bröts av DM-300 när den förstördes. Man kan känna en inaktiv, ondskefull magi inuti den. \n\n Den gör ingenting på egen hand, men den kan vara användbar i kombination med vissa skriftrullar eller en bomb. Som allra minst bör den omvandlas till en hyfsad mängd energi.
items.quest.metalshard.discover_hint=Du kan få det här föremålet som en droppe från vissa fiender.
items.quest.metalshard.name=förbannad metallskärva
items.quest.pickaxe.ability_desc=Duelisten kan _pierca_ en fiende med en hacka. Detta garanterar att träffa, är sårbart i 3 omgångar och gör _%1$d-%2$d skada_ till fiender med stel hud.
items.quest.pickaxe.ability_name=genomborra
items.quest.pickaxe.desc=Detta är ett robust och tungt verktyg för att bryta stenar. Du behöver inte utrusta hackan för att bryta med den, men den kan förmodligen utrustas som ett vapen i nödfall.
items.quest.pickaxe.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
items.quest.pickaxe.name=hacka
items.quest.pickaxe.upgrade_ability_stat_name=Förmåga Skada
items.quest.ratskull.desc=En förvånansvärt stor råttskalle. Den skulle bli en utmärkt jakttrofé om man hade en vägg att hänga den på.
items.quest.ratskull.name=jätteråttskalle
items.remains.bowfragment.desc=Detta trasiga träfragment var en gång en del av en förlorad jägares andebåge. Du kan fortfarande känna lite naturenergi kvar i fragmentet, du kan använda fragmentet för att odla högt gräs runt dig. Att göra detta kommer dock att förstöra fragmentet.
items.remains.bowfragment.name=bågfragment
items.remains.brokenhilt.desc=Det här trasiga fästet ser ut som om det kom från en besegrad duellants vapen. Du kan fortfarande känna lite krigisk kraft kvar i fästet, du kan använda den för att få lite bonusskada på dina nästa två närstridsträffar. Om du gör detta kommer dock fästet att förstöras.
items.remains.brokenhilt.name=brutet handtag
items.remains.brokenstaff.desc=Denna magikers stav har brutits itu efter att dess ägare mött sin död. Du kan fortfarande känna lite magisk energi kvar i staven, du kan använda den för att ge dina trollstavar en liten laddningsboost. Att göra detta kommer dock att förstöra staven.
items.remains.brokenstaff.name=trasig personal
items.remains.cloakscrap.desc=Den här biten av genomskinligt tyg ser ut som om den kommer från en sen skurks skuggmantel. Du kan fortfarande känna lite mystisk energi kvar i den, du kan använda den för att ge dina artefakter en liten laddningsboost. Att göra detta kommer dock att förstöra tyget.
items.remains.cloakscrap.name=tygbit
items.remains.remainsitem.ac_use=ANVÄNDA
items.remains.remainsitem.discover_hint=Du kan hitta det här föremålet i resterna av en specifik hjälte från en tidigare förlorad flykt.
items.remains.sealshard.desc=Dessa små skärvor av rött vax ser ut som om de kom från en fallen krigares sigill. Du kan fortfarande känna lite viljestyrka som klamrar sig fast vid sigillet, du kan använda det för att ge dig själv lite skydd. Att göra detta kommer dock att förstöra sigillskärvorna.
items.remains.sealshard.name=sälskärvor
items.remains.tornpage.desc=Den här sidan ser ut som om den rivits ur en utgången prästs heliga bok. Det finns fortfarande lite gudomlig energi kvar som klamrar sig fast vid den, du kan använda den för att återfå lite hälsa. Att göra detta kommer dock att förstöra den sönderrivna sidan.
items.remains.tornpage.name=riven sida
items.rings.ring.agate=agatring
items.rings.ring.amethyst=ametistring
items.rings.ring.curse_known=Man kan känna en ondskefull magi lura inuti den här ringen.
items.rings.ring.cursed_worn=Eftersom den här ringen är förbannad, är du maktlös att ta bort den.
