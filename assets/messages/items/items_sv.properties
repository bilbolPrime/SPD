items.weapon.melee.magesstaff.imbue_desc=Är du säker på att du vill ge din stav den här trollstav?\n\nOm trollstaven som ska genomsyras är av samma eller högre nivå än staven, kommer staven att ärva nivån av den trollstaven plus en enda av sina egna uppgraderingar.
