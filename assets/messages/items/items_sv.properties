items.weapon.melee.rapier.name=värja
items.weapon.melee.rapier.stats_desc=Detta vapen blockerar 0-1 skada.
items.weapon.melee.rapier.typical_ability_desc=Duelisten kan _utfalla_ med en värja mot en fiende 1 ruta bort. Detta rör sig mot fienden, orsakar vanligtvis _%1$d-%2$d skada_ och garanterar att träffa.
items.weapon.melee.roundshield$guardtracker.desc=Duelisten har förberett sin sköld inför kommande attacker. Fysiska eller magiska attacker mot henne kommer att helt ogiltigförklaras. \n\n Återstående tur: %s.
items.weapon.melee.roundshield$guardtracker.guarded=bevakad
items.weapon.melee.roundshield$guardtracker.name=bevakning
items.weapon.melee.roundshield.ability_desc=Duelisten kan _skydda_ sig själv med en rund sköld, vilket helt omintetgör alla fysiska eller magiska attacker mot henne under _%d turer_. När duelisten har blockerat en attack, kommer attack mot henne eller användning av magi att avsluta skyddet.
items.weapon.melee.roundshield.ability_name=skydda
items.weapon.melee.roundshield.desc=Denna stora sköld blockerar effektivt attacker och är ett hyfsat vapen i nödfall.
items.weapon.melee.roundshield.name=rund sköld
items.weapon.melee.roundshield.stats_desc=Detta vapen blockerar 0-%d skada. Denna blockering skalas upp med uppgraderingar.
items.weapon.melee.roundshield.typical_ability_desc=Duelisten kan _skydda_ sig själv med en rund sköld, vilket helt omintetgör alla fysiska eller magiska attacker som vanligtvis görs mot henne under _%d-omgångar_. När duelisten har blockerat en attack, kommer attack mot henne eller användning av magi att avsluta skyddet.
items.weapon.melee.roundshield.typical_stats_desc=Vanligtvis blockerar detta vapen 0-%d skada. Denna blockering skalas upp med uppgraderingar.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Förmåga Varaktighet
items.weapon.melee.runicblade.ability_desc=Duelisten kan utföra ett _runskär_ med ett runblad. Denna attack garanterar träffande kraft och har _+%d%% förtrollningskraft._
items.weapon.melee.runicblade.ability_name=runisk snedstreck
items.weapon.melee.runicblade.desc=Ett mystiskt vapen från ett avlägset land, med ett klarblått blad.
items.weapon.melee.runicblade.name=runblad
items.weapon.melee.runicblade.stats_desc=Detta vapen gynnas mer av uppgraderingar.
items.weapon.melee.runicblade.typical_ability_desc=Duelisten kan utföra ett _runiskt hugg_ med ett runblad. Denna attack garanterar träffande kraft och har vanligtvis _+%d%% förtrollningskraft._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Förmåga Kraft
items.weapon.melee.sai$combostriketracker.desc=Duelisten bygger en kombination som kan användas för att öka skadan från kombinationens förmåga att slåss. Varje lyckad vanlig närstridsattack eller vapenattack med kastade vapen räknas, men om man inte lyckas attackera i 5 rundor återställs kombinationen. \n\nSenaste träffar: %1$d.\n\nTur tills träffar förloras: %2$s.
items.weapon.melee.sai$combostriketracker.name=kombinationsslag
items.weapon.melee.sai.ability_desc=Duelisten kan utföra en _kombinationsattack_ med sai. Denna attack garanterar träffande och gör _+%d skada_ för varje gång duelisten har träffat med en vanlig närstridsattack eller en vapenattack med kastat vapen. Om du inte träffar på 5 turer återställs denna kombination.
items.weapon.melee.sai.ability_name=kombinationsslag
items.weapon.melee.sai.desc=Två tunna blad avsedda att användas i en hand vardera. Utmärkta för att riva ner fiender med en mängd hugg.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Detta är ett mycket snabbt vapen.
items.weapon.melee.sai.typical_ability_desc=Duelisten kan utföra en _kombinationsattack_ med sai. Denna attack garanteras träffande och gör vanligtvis _+%d skada_ för varje gång duelisten har träffat med en vanlig närstridsattack eller en kastad vapenattack. Om du inte träffar på 5 turer återställs denna kombination.
items.weapon.melee.scimitar$sworddance.desc=Duelisten gör snabba momentumbaserade slag i ett slags dans. Medan denna ställning är aktiv attackerar hon 60%% snabbare (tillräckligt för att attackera exakt två gånger per tur med en scimitar) och har +50%% precision. \n\n Återstående turar: %s.
items.weapon.melee.scimitar$sworddance.name=svärdsdans
items.weapon.melee.scimitar.ability_desc=Duelisten kan utföra en _svärdsdans_ med en scimitar. Denna ställning tar ingen tid att aktivera och ger Duelisten +60%% attackhastighet och +50%% precision för _%d turer._
items.weapon.melee.scimitar.ability_name=svärdsdans
items.weapon.melee.scimitar.desc=Ett tjockt, böjt blad. Dess form möjliggör snabbare, men mindre kraftfulla attacker.
items.weapon.melee.scimitar.name=krumsabel
items.weapon.melee.scimitar.stats_desc=Detta är ett ganska snabbt vapen.
items.weapon.melee.scimitar.typical_ability_desc=Duelisten kan utföra en _svärdsdans_ med en scimitar. Denna ställning tar ingen tid att aktivera och ger Duelisten +60%% attackhastighet och +50%% precision, vanligtvis för _%d-omgångar._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Förmåga Varaktighet
items.weapon.melee.shortsword.ability_desc=Duelisten kan _klyva_ en fiende med ett kortsvärd. Detta gör _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.melee.shortsword.ability_name=klyva
items.weapon.melee.shortsword.desc=Ett ganska kort svärd, bara några centimeter längre än en dolk.
items.weapon.melee.shortsword.name=kortsvärd
items.weapon.melee.shortsword.typical_ability_desc=Duelisten kan _klyva_ en fiende med ett kortsvärd. Detta orsakar vanligtvis _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.melee.sickle.ability_desc=Duelisten kan _skörda_ en fiende med en skära. Denna förödande attack garanterar att träffa och orsakar _%d skada_. Denna skada appliceras som blödning om målet inte är immunt.
items.weapon.melee.sickle.ability_name=skörda
items.weapon.melee.sickle.desc=Ett handhållet jordbruksredskap som kan fungera som ett starkt men otympligt vapen.
items.weapon.melee.sickle.name=skära
items.weapon.melee.sickle.stats_desc=Detta är ett ganska oprecis vapen.
items.weapon.melee.sickle.typical_ability_desc=Duelisten kan _skörda_ en fiende med en skära. Denna förödande attack garanterar att träffa och orsakar vanligtvis _%d skada_. Denna skada appliceras som blödning om målet inte är immunt.
items.weapon.melee.spear.ability_desc=Duelisten kan använda spetsen på ett spjut för att _spika_ en fiende som är inom räckhåll men inte intill. Detta gör _%1$d-%2$d skada_, slår tillbaka fienden och garanterar att träffa.
items.weapon.melee.spear.ability_name=spika
