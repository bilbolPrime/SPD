items.armor.glyphs.viscosity.desc=Denna glyph kan lagra skada som utdelats mot bäraren, och dela ut den långsamt snarare än allt på en gång.
items.armor.glyphs.viscosity.name=%s av viskositet
items.armor.huntressarmor.desc=Medan Jägaren bär denna mantel kan hon utföra en speciell förmåga.
