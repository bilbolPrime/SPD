items.weapon.melee.spear.name=spjut
items.weapon.melee.spear.stats_desc=Detta är ett ganska långsamt vapen. \nDetta vapen har extra räckvidd.
items.weapon.melee.spear.typical_ability_desc=Duelisten kan använda spetsen på ett spjut för att _spika_ en fiende som är inom räckhåll men inte intill. Detta orsakar vanligtvis _%1$d-%2$d skada_, slår tillbaka fienden och är garanterad att träffa.
items.weapon.melee.sword$cleavetracker.desc=Duelisten är redo att följa upp sin tidigare klyvning. Nästa användning av klyvning kostar ingen vapenförmåga. \n\n Återstående tur: %s
items.weapon.melee.sword$cleavetracker.name=klyva
items.weapon.melee.sword.ability_desc=Duelisten kan _klyva_ en fiende med ett svärd. Detta gör _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.melee.sword.ability_name=klyva
items.weapon.melee.sword.desc=Ett välbalanserat svärd. Inte för stort, men ändå betydligt längre än ett kortsvärd.
items.weapon.melee.sword.name=svärd
items.weapon.melee.sword.typical_ability_desc=Duelisten kan _klyva_ en fiende med ett svärd. Detta orsakar vanligtvis _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.melee.warhammer.ability_desc=Duelisten kan utföra ett _kraftigt slag_ med en stridshammare. Denna koncentrerade attack gör _%1$d-%2$d skada_ om den överraskar fienden, och förvirrar dem i 5 turer vilket minskar precision och undvikande med 50%%. Ett kraftigt slag träffar alltid men gör regelbunden skada om det inte överraskar fienden.
items.weapon.melee.warhammer.ability_name=kraftigt slag
items.weapon.melee.warhammer.desc=Få varelser kan motstå det förkrossande slaget från denna höga massa av bly och stål, men det krävs stor styrka för att använda den effektivt.
items.weapon.melee.warhammer.name=krigshammare
items.weapon.melee.warhammer.stats_desc=Detta är ett ganska exakt vapen.
items.weapon.melee.warhammer.typical_ability_desc=Duelisten kan utföra ett _kraftigt slag_ med en stridshammare. Denna koncentrerade attack gör vanligtvis _%1$d-%2$d skada_ om den överraskar fienden, och förvirrar dem i 5 turer vilket minskar precision och undvikande med 50%%. Ett kraftigt slag träffar alltid men gör regelbunden skada om det inte överraskar fienden.
items.weapon.melee.warscythe.ability_desc=Duelisten kan _skörda_ en fiende med en krigslie. Denna förödande attack garanterar att träffa och orsakar _%d skada_. Denna skada appliceras som blödning om målet inte är immunt.
items.weapon.melee.warscythe.ability_name=skörda
items.weapon.melee.warscythe.desc=Detta stora och otympliga verktyg har förstärkts för att göra det bättre på att skära ner fiender än grödor.
items.weapon.melee.warscythe.name=krigsli
items.weapon.melee.warscythe.stats_desc=Detta är ett ganska oprecis vapen.
items.weapon.melee.warscythe.typical_ability_desc=Duelisten kan _avverka_ en fiende med en krigslie. Denna förödande attack garanterar att träffa och orsakar vanligtvis _%d skada_. Denna skada appliceras som blödning om målet inte är immunt.
items.weapon.melee.whip.ability_desc=Duelisten kan _piska_ alla fiender runt omkring henne med en piska. Denna förmåga gör _%1$d-%2$d skada_, attackerar alla fiender inom attackräckvidd och garanterar att träffa.
items.weapon.melee.whip.ability_name=surra
items.weapon.melee.whip.desc=Även om det hullingförsedda repet i änden av detta vapen gör liten skada, kan dess räckvidd inte matchas.
items.weapon.melee.whip.name=piska
items.weapon.melee.whip.stats_desc=Detta vapen har enorm räckvidd.
items.weapon.melee.whip.typical_ability_desc=Duelisten kan _piska_ alla fiender runt omkring henne med en piska. Denna förmåga gör vanligtvis _%1$d-%2$d skada_, attackerar alla fiender inom attackräckvidd och garanterar att träffa.
items.weapon.melee.wornshortsword.ability_desc=Duelisten kan _klyva_ en fiende med ett slitet kortsvärd. Detta gör _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.melee.wornshortsword.ability_name=klyva
items.weapon.melee.wornshortsword.desc=Ett ganska kort svärd, slitet av hårt bruk. Det är både svagare och lite lättare än ett kortsvärd i bättre skick.
items.weapon.melee.wornshortsword.discover_hint=En av hjältarna börjar med det här föremålet.
items.weapon.melee.wornshortsword.name=slitet kortsvärd
items.weapon.melee.wornshortsword.typical_ability_desc=Duelisten kan _klyva_ en fiende med ett slitet kortsvärd. Detta orsakar vanligtvis _%1$d-%2$d skada_ och garanterar träff. Om klyvning dödar en fiende sker det omedelbart och Duelisten kan använda klyvning igen inom 5 rundor gratis.
items.weapon.missiles.bolas.desc=Dessa ovanliga distansvapen är inte särskilt skadliga, men gör ett utmärkt jobb med att sakta ner sitt mål.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Detta vapen förlamar sitt mål.
items.weapon.missiles.boomerang.desc=När denna platta, böjda trämissil kastas till fienden kommer den att återvända till kastarens händer.
items.weapon.missiles.boomerang.durability=Tack vare sin solida konstruktion kommer denna boomerang inte att gå sönder vid användning.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Dessa pilar är spetsade med en förening baserad på snabbtistel som ökar allierades rörelse- och attackhastighet, eller sänker fienders rörelsehastighet kortvarigt. Själva pilen är fortfarande skadlig för fiender, men kommer inte att skada allierade.
items.weapon.missiles.darts.adrenalinedart.name=adrenalinpil
items.weapon.missiles.darts.blindingdart.desc=Dessa pilar har en spets av en blindörtsbaserad förening som kommer att blända deras mål under en kort tid. De desorienterar dock inte, så en fiende kommer fortfarande att veta var de senast såg dig.
items.weapon.missiles.darts.blindingdart.name=bländande pil
items.weapon.missiles.darts.chillingdart.desc=Dessa pilar har en tippning med en ismössa-baserad förening som kommer att kyla ner deras mål avsevärt.
items.weapon.missiles.darts.chillingdart.name=kylande pil
items.weapon.missiles.darts.cleansingdart.desc=Dessa pilar är spetsade med en mageroyalbaserad förening som tillfälligt gör allierade immuna mot alla negativa effekter, eller renar positiva effekter från fiender. Fiender kan till och med kort glömma att de attackerar eller flyr från dig. Själva pilen är fortfarande skadlig för fiender, men kommer inte att skada allierade.
items.weapon.missiles.darts.cleansingdart.name=rengöringspil
items.weapon.missiles.darts.dart.ac_tip=DRICKS
items.weapon.missiles.darts.dart.desc=Dessa enkla träskaft med spikar är viktade för att flyga rakt och sticka sitt byte med en handledsväng. De kan tippas med frön för att få bonuseffekter när de kastas.
items.weapon.missiles.darts.dart.name=pil
items.weapon.missiles.darts.dart.prompt=Välj ett frö
items.weapon.missiles.darts.dart.tip_all=tippa %1$d-pilar med %2$d-frön
items.weapon.missiles.darts.dart.tip_cancel=avboka
items.weapon.missiles.darts.dart.tip_desc=Ett frö kan kombineras med en eller två pilar för att tippa dem. Varje typ av frö producerar sin egen typ av pil med spets, med en unik engångseffekt. \n\nAtt tippa en pil med dessa frön kommer att producera en _%s._
items.weapon.missiles.darts.dart.tip_one=tippa 1 pil med 1 frö
items.weapon.missiles.darts.dart.tip_title=Tip Dart
items.weapon.missiles.darts.dart.tip_two=tippa 2 dartpilar med 1 frö
items.weapon.missiles.darts.dart.unlimited_uses=Tack vare sin enkla konstruktion kommer dartpilar i praktiken att hålla för evigt.
items.weapon.missiles.darts.displacingdart.desc=Dessa pilar har en tippning av en fadeleaf-baserad förening som teleporterar sitt mål ett kort avstånd bort.
items.weapon.missiles.darts.displacingdart.name=förskjutande pil
items.weapon.missiles.darts.healingdart.desc=Dessa pilar har en spets av en solgräsbaserad förening som ger en explosion av läkning till deras mål. Själva pilen är fortfarande skadlig för fiender, men kommer inte att skada allierade.
items.weapon.missiles.darts.healingdart.name=helande pil
items.weapon.missiles.darts.holydart.desc=Dessa pilar är spetsade med en stjärnblomsbaserad förening som tillför helig energi till deras mål. Allierade och vanliga fiender blir välsignade, men odöda eller demoniska fiender kommer att ta stor skada. Själva pilen är fortfarande skadlig för fiender, men kommer inte att skada allierade.
items.weapon.missiles.darts.holydart.name=helig pil
items.weapon.missiles.darts.incendiarydart.desc=Dessa pilar har en tippning av en eldblomsbaserad förening som kommer att fatta lysande lågor vid träffar.
items.weapon.missiles.darts.incendiarydart.name=brandpil
items.weapon.missiles.darts.paralyticdart.desc=Dessa pilar är tippade med en jordrotbaserad förening som kommer att förlama deras mål under en kort tid.
items.weapon.missiles.darts.paralyticdart.name=paralytisk pil
items.weapon.missiles.darts.poisondart.desc=Dessa pilar är tippade med en sorgmossbaserad förening som kommer att förgifta deras mål.
items.weapon.missiles.darts.poisondart.name=giftpil
items.weapon.missiles.darts.rotdart.desc=Dessa grymma pilar är spetsade med en sur, rotbärsbaserad förening, som aggressivt äter igenom allt pilen kommer i kontakt med. Kraftfulla fiender kommer att motstå det mesta av effekten, men korrosionen är tillräckligt stark för att enkelt döda de flesta vanliga fiender. Dessa håller längre än andra pilar med spets, men deras hållbarhet kan inte ökas.
items.weapon.missiles.darts.rotdart.discover_hint=Du kan skapa det här föremålet med hjälp av ett frö från ett specifikt uppdrag.
items.weapon.missiles.darts.rotdart.name=ruttna pil
items.weapon.missiles.darts.shockingdart.desc=Dessa pilar har en tippning med en stormvine-baserad förening som kommer att ge en otäck chock till deras mål.
items.weapon.missiles.darts.shockingdart.name=chockerande pil
items.weapon.missiles.darts.tippeddart.about_to_break=Din pilspets håller på att gå ut.
items.weapon.missiles.darts.tippeddart.ac_clean=RENA
items.weapon.missiles.darts.tippeddart.cancel=avboka
items.weapon.missiles.darts.tippeddart.clean_all=rengör allt
items.weapon.missiles.darts.tippeddart.clean_desc=Den här åtgärden tar bort frödumpningen på dina pilar och återgår till vanliga pilar.
items.weapon.missiles.darts.tippeddart.clean_one=ren en
items.weapon.missiles.darts.tippeddart.clean_title=Rena dartpilar
items.weapon.missiles.darts.tippeddart.discover_hint=Du kan köpa den här produkten i en butik, eller skapa den med hjälp av ett frö.
items.weapon.missiles.darts.tippeddart.has_broken=Din pilspets har gått ut.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Men dessa är av så hög kvalitet att de i praktiken kommer att hålla för evigt._
items.weapon.missiles.darts.tippeddart.uses_left=Den här högen med pilar har _%d/%d_ kvar att användas innan en av spetsen slits av.
items.weapon.missiles.fishingspear.desc=Små kastspjut som fungerar bra som improviserade vapen trots att de är designade för fiske.
items.weapon.missiles.fishingspear.name=fiskespjut
items.weapon.missiles.forcecube.desc=Dessa udda formade magiska kuber är små nog att hålla i handen, men är otroligt tunga.
items.weapon.missiles.forcecube.name=kraftkub
items.weapon.missiles.forcecube.ondeath=Du tog livet av dig med din egen kraftkub...
items.weapon.missiles.forcecube.stats_desc=Detta vapen sprider kraften av sin anslag över ett litet område och träffar allt i närheten.
items.weapon.missiles.heavyboomerang.desc=Denna stora boomerang är svår att använda effektivt, men kommer att orsaka avsevärd skada.
items.weapon.missiles.heavyboomerang.name=tung bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Detta vapen cirklar tillbaka till den plats det kastades från efter fem varv.
items.weapon.missiles.javelin.desc=Dessa större kastspjut är viktade för att hålla spiken i spetsen främst när de seglar genom luften.
items.weapon.missiles.javelin.name=spjut
items.weapon.missiles.kunai.desc=Dessa små knivar är mycket kraftfulla i händerna på en skicklig användare.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Detta vapen är starkare mot omedvetna fiender.
items.weapon.missiles.missileweapon$placeholder.name=kastat vapen
items.weapon.missiles.missileweapon.about_to_break=Ditt kastade vapen håller på att gå sönder.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Om det senast kastade vapnet i din förbättrade uppsättning kastade vapen går sönder, kommer uppsättningen att gå förlorad permanent. Är du säker på att du vill kasta det?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=inga
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=ja
items.weapon.missiles.missileweapon.curse_discover=Detta kastade vapen är förbannat!
items.weapon.missiles.missileweapon.distance=Kastade vapen är mer exakta på avstånd, men mindre exakta på nära håll.
items.weapon.missiles.missileweapon.durability=Kastade vapen kommer att slitas ut och gå sönder allt eftersom de används.
items.weapon.missiles.missileweapon.dust=Det kastade vapnet smular sönder till damm när du rör vid det.
items.weapon.missiles.missileweapon.has_broken=Ett av dina kastade vapen har gått sönder.
items.weapon.missiles.missileweapon.probably_too_heavy=Förmodligen är det här vapnet för tungt för dig.
items.weapon.missiles.missileweapon.stats_known=Denna uppsättning _tier-%1$d_ kastade vapen gör _%2$d-%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.stats_unknown=Vanligtvis gör denna uppsättning _tier-%1$d_ kastade vapen _%2$d-%3$d skada_ och kräver _%4$d styrka_ för att användas.
items.weapon.missiles.missileweapon.unknown_uses=Vanligtvis har denna uppsättning kastade vapen _%d_ användningsområden innan ett går sönder.
items.weapon.missiles.missileweapon.unlimited_uses=Denna uppsättning är av så hög kvalitet att den i praktiken kommer att hålla för evigt.
items.weapon.missiles.missileweapon.uses_left=Denna uppsättning kastade vapen har _%d/%d_ användningsområden kvar innan ett går sönder.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du har nyligen kastat en shuriken direkt, och måste vänta innan du gör det igen. Shurikener kan fortfarande kastas, men med normal vapenhastighet. \n\n Återstående tur: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Shuriken-nedkylning
items.weapon.missiles.shuriken.desc=Dessa stjärnformade metallbitar med rakbladsvassa kanter gör stor skada när de träffar. De kan kastas mycket snabbt.
items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens kan kastas direkt med en nedkylningstid på 20 tur.
items.weapon.missiles.throwingclub.desc=Ett ganska enkelt men hållbart kastvapen, i huvudsak en stor sten fäst vid en pinne.
items.weapon.missiles.throwingclub.name=kastklubb
items.weapon.missiles.throwingclub.stats_desc=Detta vapen fastnar inte på fiender och kan samlas in direkt.
items.weapon.missiles.throwinghammer.desc=Dessa rejäla hammare är designade för att kastas mot en fiende. Deras släta helmetallkonstruktion gör att de är ganska hållbara.
items.weapon.missiles.throwinghammer.name=kasta hammare
items.weapon.missiles.throwinghammer.stats_desc=Detta vapen fastnar inte på fiender och kan samlas in direkt.
items.weapon.missiles.throwingknife.desc=Dessa lätta knivar är balanserade för att kunna röra sig genom luften rakt in i sitt mål.
items.weapon.missiles.throwingknife.discover_hint=En av hjältarna börjar med det här föremålet.
items.weapon.missiles.throwingknife.name=kastkniv
items.weapon.missiles.throwingknife.stats_desc=Detta vapen är starkare mot omedvetna fiender.
items.weapon.missiles.throwingspear.desc=Dessa lätta spjut har tunna ramar som är utformade för att kastas och inte stötas.
items.weapon.missiles.throwingspear.name=kasta spjut
items.weapon.missiles.throwingspike.desc=Dessa hållbara spetsiga metallskaft är avsedda att kastas mot avlägsna fiender.
items.weapon.missiles.throwingspike.discover_hint=En av hjältarna börjar med det här föremålet.
items.weapon.missiles.throwingspike.name=kastspik
items.weapon.missiles.throwingstone.desc=Dessa stenar slipas ner för att de ska kunna kastas med mer kraft än en vanlig sten.
items.weapon.missiles.throwingstone.discover_hint=En av hjältarna börjar med det här föremålet.
items.weapon.missiles.throwingstone.name=kasta sten
items.weapon.missiles.tomahawk.desc=Dessa kastyxor har en tandad egg som slits sönder när de fastnar i en fiende.
items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Detta vapen orsakar _%1$d-%2$d blödning_ till sitt mål.
items.weapon.missiles.tomahawk.typical_stats_desc=Detta vapen orsakar vanligtvis _%1$d-%2$d blödning_ till sitt mål.
items.weapon.missiles.trident.desc=Massiva kastspjut med tre dödliga utsprång i änden. De är kraftfulla, men ganska tunga.
items.weapon.missiles.trident.name=treudd
items.weapon.spiritbow.ac_shoot=SKJUTA
items.weapon.spiritbow.desc=En båge gjord av uråldrigt magiskt trä. Bågens snöre och etsningar lyser med ett ljusblått ljus. När snöret dras frammanar bågen en magisk pil som kan avfyras mot en fiende.
items.weapon.spiritbow.discover_hint=En av hjältarna börjar med det här föremålet.
items.weapon.spiritbow.name=andlig båge
items.weapon.spiritbow.prompt=Välj ett mål
items.weapon.spiritbow.stats=Bågen kan inte uppgraderas direkt, utan kommer istället att stadigt bli starkare allt eftersom du går upp i nivå. På din nuvarande nivå kommer pilar som skjuts från bågen att göra _%1$d-%2$d skada_ och kräva _%3$d styrka_ för att användas korrekt.
items.weapon.weapon$enchantment.discover_hint=Du kan hitta ett föremål med den här effekten slumpmässigt i fängelsehålan, eller försöka tillämpa den på ett föremål själv.
items.weapon.weapon$enchantment.enchant=förtrollning
items.weapon.weapon$enchantment.rankings_desc=Dödad av en förtrollning
items.weapon.weapon.cursed=Man kan känna en ondskefull magi lura inuti detta vapen.
items.weapon.weapon.cursed_worn=Eftersom detta vapen är förbannat är du maktlös att ta bort det.
items.weapon.weapon.enchant_hardened=Den har blivit _härdad._
items.weapon.weapon.enchanted=den har en _%s._
items.weapon.weapon.excess_str=På grund av din överdrivna styrka kommer du att orsaka _0-%d bonusskada_ med detta vapen.
items.weapon.weapon.faster=Den är utökad för att förbättra _hastigheten._
items.weapon.weapon.hardened_no_enchant=Detta vapen har _härdats_ men är för närvarande inte förtrollat.
items.weapon.weapon.hardening_gone=Härdningen på det här vapnet har avtagit!
items.weapon.weapon.identify=Du är nu tillräckligt bekant med ditt vapen för att kunna identifiera det.
items.weapon.weapon.incompatible=Samspelet mellan olika typer av magi har omintetgjort förtrollningen på detta vapen!
items.weapon.weapon.not_cursed=Detta vapen är fritt från ondskefull magi.
items.weapon.weapon.stronger=Den är förstärkt för att öka _skadan_.
items.weapon.weapon.too_heavy=På grund av din otillräckliga styrka kommer detta vapen att hämma din attackhastighet, precision och förmåga att överraska attacker.
items.weapon.weapon.weak_cursed=Trots förbannelsen kan du avutrustninga detta vapen.

items.keys.skeletonkey.desc=Den här nyckeln ser allvarlig ut: huvudet är format som en skalle. Förmodligen kan den öppna någon allvarlig dörr.
items.weapon.missiles.bombarrow.desc=En pil med en fast bomb. Håll avstånd.
items.weapon.missiles.bombarrow.name=bombpil
items.weapon.missiles.missileweapon.damage_desc=Detta vapen gör _%1$d_ till _%2$d_ skada per träff.
items.bags.seedpouch.desc=I den här lilla sammetspåsen kan du förvara hur många frön som helst. Mycket praktiskt.
items.bags.seedpouch.name=fröpåse
items.potions.potionofmight.desc=Den här kraftfulla vätskan strömmar genom dina muskler och ökar din styrka permanent med en poäng och din hälsa med fem.
items.potions.potionofmight.name=Maktens trolldryck
items.rings.ringofdetection.desc=Den som bär ringen kan upptäcka dolda fällor och hemliga dörrar utan att behöva stanna och leta. Försvagade upptäcktsringar avtrubbar dina sinnen, så att hemligheter blir svårare att hitta även när du letar.
items.rings.ringofdetection.name=upptäcktens ring
items.rings.ringofhaggler.desc=Den här ringen har egentligen ingen magisk kraft. Den visar köpmän att bäraren tillhör Tjuvarnas gille. De ger gärna rabatt i utbyte mot att få vara i fred ett tag. Ringen ger inga ytterligare fördelar om den uppgraderas.
items.rings.ringofhaggler.name=prutarens ring
items.rings.ringofherbalism.desc=Den här ringen ökar din chans att hitta dagg och frön när du trampar ned gräs.
items.rings.ringofherbalism.name=Örtmedicinens ring
items.rings.ringofmending.desc=Den här ringen stärker kroppens läkkraft, så att förlorad hälsa återställs snabbare. Försvagade ringar saktar ned eller stoppar kroppens naturliga läkning.
items.rings.ringofmending.name=läkningens ring
items.rings.ringofpower.desc=Energifältet som strålar från den här ringen gör dina stavar starkare. Försvagade kraftringar gör dem i stället svagare.
items.rings.ringofpower.name=Maktens ring
items.rings.ringofsatiety.desc=Med den här ringen kan du klara dig längre utan mat. Försvagade mättnadsringar har motsatt effekt.
items.rings.ringofsatiety.name=Mättnadsringen
items.rings.ringofshadows.desc=Fiender kommer att vara mindre benägna att lägga märke till dig om du bär den här ringen. Försämrade ringar av skuggor kommer att varna fiender som annars kanske inte skulle ha lagt märke till din närvaro.
items.rings.ringofshadows.name=Skuggornas ring
items.rings.ringofthorns.desc=Ringen har inga riktiga taggar, men en fiende som angriper dig får själv ta en del av skadan den orsakar. Ringen ger inga ytterligare fördelar om den uppgraderas.
items.rings.ringofthorns.name=Törnringen
items.scrolls.scrollofchallenge.desc=När den här skriftrullen läses högt kommer den att utlösa ett utmanande vrål som väcker alla monster och varnar dem om läsarens plats.
items.scrolls.scrollofchallenge.name=utmaningens skriftrulle
items.scrolls.scrollofenchantment.desc=Denna skriftrulle kan genomsyra ett vapen eller en rustning med en slumpmässig förtrollning, vilket ger den en speciell kraft.
items.scrolls.scrollofenchantment.name=förtrollningens skriftrulle
items.scrolls.scrollofpsionicblast.desc=Denna skriftrulle innehåller destruktiv energi som kan kanaliseras psyoniskt för att orsaka massiv skada på alla varelser inom ett synfält. En medföljande ljusblixt kommer tillfälligt att blända alla i synfältet, inklusive läsaren av skriftrullen.
items.scrolls.scrollofpsionicblast.name=sinnesstötens skriftrulle
items.scrolls.scrollofwipeout.desc=Läs den här skriftrullen för att släppa lös fängelsehålans vrede och döda allt på den aktuella nivån. Tja, nästan allt. Vissa av de kraftfullare varelserna kanske inte påverkas.
items.scrolls.scrollofwipeout.name=utplåningens skriftrulle
items.wands.wandofblink.desc=Med den här staven kan du teleportera dig i vald riktning. Varelser och fasta hinder stoppar teleporteringen.
items.wands.wandofblink.name=teleporteringens stav
items.wands.wandoffirebolt.desc=Den här staven skjuter ut skurar av magisk eld. Den antänder brännbar terräng och skadar och sätter eld på den varelse som träffas.
items.wands.wandoffirebolt.name=Eldblixtens trollstav
