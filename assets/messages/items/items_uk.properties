items.artifacts.skeletonkey$keywall.desc=Тимчасову магічну стіну було встановлено тут за допомогою скелетного ключа.
items.artifacts.skeletonkey.ac_insert=ВСТАВИТИ
items.artifacts.skeletonkey.crystal_charges=Для відкриття кришталевого замка потрібно 5 зарядів.
items.artifacts.skeletonkey.cursed=Ти не можеш використовувати проклятий скелетний ключ.
items.artifacts.skeletonkey.desc=Важливий на вигляд ключ із головкою у формі черепа. Його зубці здаються різними щоразу, коли на них дивишся.
items.artifacts.skeletonkey.desc_cursed=Проклятий ключ, здається, активно уникає вставляння в будь-який замок і навіть ускладнює (але не робить неможливим) для вас використання інших ключів.
items.artifacts.skeletonkey.desc_worn=Цей магічний ключ, здається, набуває сили, коли ви використовуєте його замість звичайних ключів підземелля. Його можна вставити майже в будь-який замок підземелля, щоб відкрити або закрити їх, включаючи двері, які ніколи раніше не були замкнені.\n\nКлюч можна навіть використовувати на порожньому просторі в напрямку за сторонами світу або по діагоналі, щоб «замкнути» повітря перед собою, створюючи суцільну стіну шириною 3 клітинки, яка триває 10 ходів. Замикання відштовхне ворогів, якщо для цього є місце.
items.artifacts.skeletonkey.discard=Ви викидаєте зайві ключі.
items.artifacts.skeletonkey.force_lock=Замок ослаб без вашого скелетного ключа. Вам вдається його відчинити силою.
items.artifacts.skeletonkey.gold_charges=Відкриття золотого замка вимагає 2 зарядів.
items.artifacts.skeletonkey.invalid_target=Там нічого не можна замикати чи відмикати.
items.artifacts.skeletonkey.iron_charges=Відкриття звичайного замка вимагає 1 зарядки.
items.artifacts.skeletonkey.levelup=Твій скелетний ключ стає сильнішим!
items.artifacts.skeletonkey.lock_charges=Замикання дверей вимагає 2 зарядів.
items.artifacts.skeletonkey.lock_no_space=Ви не можете замкнути персонажа всередині дверей!
items.artifacts.skeletonkey.locked_with_key=Ті двері були замкнені твоїм скелетним ключем.
items.artifacts.skeletonkey.name=скелетний ключ
items.artifacts.skeletonkey.prompt=Виберіть ціль
items.artifacts.skeletonkey.wall_charges=Для створення тимчасової стіни потрібно 2 заряди.
items.artifacts.skeletonkey.wont_open=Ключ з якоїсь причини відмовляється вставлятися в цей замок.
items.artifacts.talismanofforesight$foresight.desc=Ви відчуваєте сильну нервовість, ніби поруч є невидима небезпека.
items.artifacts.talismanofforesight$foresight.name=передбачення
items.artifacts.talismanofforesight$foresight.uneasy=Ви відчуваєте неспокій.
items.artifacts.talismanofforesight.ac_scry=СКРІ
items.artifacts.talismanofforesight.desc=Гладкий камінь із дивними гравіюваннями. Здається, ніби він спостерігає за всім навколо, пильнує за чимось прихованим.
items.artifacts.talismanofforesight.desc_cursed=Проклятий талісман пильно дивиться на тебе, притупляючи твої почуття.
items.artifacts.talismanofforesight.desc_worn=Коли ви тримаєте талісман, ви відчуваєте, як ваші почуття загострюються. Талісман повільно накопичує заряд з плином часу, і коли ви знаходите приховані двері або пастки. \n\nТалісман може витрачати свій заряд на «відання» у формі конуса, що розкриває всі плитки та секрети в області сканування, і надасть вам бачення ворогів та предметів на короткий час.
items.artifacts.talismanofforesight.full_charge=Ваш Талісман повністю заряджений!
items.artifacts.talismanofforesight.levelup=Твій Талісман стає сильнішим!
items.artifacts.talismanofforesight.low_charge=Талісман потребує щонайменше 5% заряду для віщування.
items.artifacts.talismanofforesight.name=талісман передбачення
items.artifacts.talismanofforesight.prompt=Виберіть місце для сканування.
items.artifacts.timekeepershourglass$sandbag.desc=Цей маленький мішечок з дрібним піском ідеально підійде до вашого пісочного годинника.\n\nЗдається дивним, що продавець має саме цей предмет саме тоді, коли він вам потрібен...
items.artifacts.timekeepershourglass$sandbag.levelup=Ви додаєте пісок у свій пісочний годинник.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ваш пісочний годинник наповнений чарівним піском!
items.artifacts.timekeepershourglass$sandbag.name=мішечок чарівного піску
items.artifacts.timekeepershourglass$sandbag.no_hourglass=У вас немає пісочного годинника, щоб помістити туди цей пісок.
items.artifacts.timekeepershourglass$timefreeze.desc=Час навколо вас застигає, що дозволяє вам виконувати дії миттєво. Ефект триватиме, доки його не буде скасовано або ваш пісочний годинник не розрядиться. Атака або використання магії також порушить цей ефект. \n\nХодить до використання заряду: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Заморожування часу
items.artifacts.timekeepershourglass.ac_activate=АКТИВАЦІЯ
items.artifacts.timekeepershourglass.cursed=Не можна використовувати проклятий пісочний годинник.
items.artifacts.timekeepershourglass.deactivate=Ви деактивуєте заморожування часу.
items.artifacts.timekeepershourglass.desc=Цей великий вишуканий пісочний годинник виглядає досить скромно, але ви відчуваєте величезну силу в його витончено вирізьбленій оправі. Коли ви обертаєте пісочний годинник і спостерігаєте, як сиплеться пісок, ви можете відчути, як його магія тягне вас до себе, і використання цієї магії, безсумнівно, дасть вам певний контроль над часом.
items.artifacts.timekeepershourglass.desc_cursed=Проклятий пісочний годинник прив'язаний до тебе, ти відчуваєш, як він намагається маніпулювати твоїм потоком часу.
items.artifacts.timekeepershourglass.desc_hint=Здається, пісочний годинник втратив трохи піщинки, якби тільки можна було її знайти...
items.artifacts.timekeepershourglass.freeze=Замри час навколо мене
items.artifacts.timekeepershourglass.name=пісочний годинник хронометриста
items.artifacts.timekeepershourglass.no_charge=Ваш пісочний годинник ще не зарядився достатньо, щоб бути використаним.
items.artifacts.timekeepershourglass.onfreeze=Все навколо раптово завмирає.
items.artifacts.timekeepershourglass.onstasis=Здається, що світ навколо тебе миттєво змінюється.
items.artifacts.timekeepershourglass.prompt=Як би ви хотіли використовувати магію пісочного годинника?\n\nУ стазисі час рухатиметься нормально, поки ви заморожені та повністю невразливі, споживаючи до 2 зарядів одночасно.\n\nКоли час заморожений, ви можете рухатися так, ніби ваші дії не займають багато часу. Це можна деактивувати будь-коли, використовуючи пісочний годинник або атакуючи.
items.artifacts.timekeepershourglass.stasis=Вводжу себе в стазис
items.artifacts.unstablespellbook.ac_add=ДОДАТИ
items.artifacts.unstablespellbook.ac_read=ЧИТАТИ
items.artifacts.unstablespellbook.blinded=Ви не можете читати з книги, будучи сліпим.
items.artifacts.unstablespellbook.cursed=Ви не можете читати з проклятої книги заклинань.
items.artifacts.unstablespellbook.desc=Цей фоліант у дивовижно хорошому стані, враховуючи його вік. Він шипить і потріскує, коли ви перегортаєте сторінки, вируючи нестабільною енергією. Якщо ви читаєте з цієї книги, невідомо, яке заклинання ви можете накласти.
items.artifacts.unstablespellbook.desc_cursed=Проклята книга прив'язалася до тебе, вона перешкоджає твоїй здатності користуватися більшістю сувоїв.
items.artifacts.unstablespellbook.desc_empowered=Сувої, які ви додали до книги, світяться силою. Ви зможете вибрати екзотичну версію ефектів цих сувоїв, але за додаткову плату.
items.artifacts.unstablespellbook.desc_index=Книга неповна. Її покажчик наразі вказує на такі порожні сторінки:
items.artifacts.unstablespellbook.infuse_scroll=Ти вкладаєш енергію сувою в книгу.
items.artifacts.unstablespellbook.name=нестабільна книга заклинань
items.artifacts.unstablespellbook.no_charge=Твоя книга заклинань зараз закінчилася.
items.artifacts.unstablespellbook.prompt=Виберіть сувій
items.artifacts.unstablespellbook.read_empowered=Сувій, який ви додали до книги заклинань, наповнюється енергією. Ви можете використовувати як звичайну, так і екзотичну версію ефекту цього сувою.\n\nВибір екзотичного варіанту коштуватиме 2 заряди замість 1.
items.artifacts.unstablespellbook.unable_scroll=Ви не можете додати цей сувій до книги.
items.artifacts.unstablespellbook.unknown_scroll=Ви ще не впевнені, який це тип сувою.
items.bags.bag.discover_hint=Ви можете придбати цей товар у магазині.
items.bags.bag.name=рюкзак
items.bags.magicalholster.desc=Ця тонка кобура виготовлена зі шкіри екзотичної тварини та має потужну магію, яка дозволяє зберігати в ній величезну кількість зброї далекого бою. \n\nВи можете просто засунути руку в сумку та завжди дістати потрібний вам предмет. \n\nЗавдяки магії кобури, чарівні палички заряджатимуться трохи швидше, а метальна зброя прослужить трохи довше всередині.
items.bags.magicalholster.name=чарівна кобура
items.bags.potionbandolier.desc=Цей товстий патронташ облягає груди, як пояс, і має багато ізольованих ремінців для зберігання флаконів із зіллями, бурдюка з водою або флаконів з рідким металом. \n\nПеребуваючи всередині патронташа, ваші зілля слід захищати від холоду.
items.bags.potionbandolier.name=патронташ для зілля
items.bags.scrollholder.desc=Цей трубчастий контейнер виглядає так, ніби він вміщує інструменти та діаграми астронома, але ваші сувої також добре помістяться. Є навіть кілька бічних відділень, в яких чудово помістяться кристали заклинань, арканні стилуси та арканні смоли.\n\nТримач не виглядає дуже легкозаймистим, тому ваші сувої мають бути захищені від вогню всередині нього.
items.bags.scrollholder.name=тримач для сувоїв
items.bags.velvetpouch.desc=У цьому маленькому оксамитовому мішечку можна зберігати багато дрібних предметів, таких як насіння, рунічні камені та деякі алхімічні інгредієнти.
items.bags.velvetpouch.discover_hint=Один з героїв починає з цього предмета.
items.bags.velvetpouch.name=оксамитовий мішечок
items.bombs.arcanebomb.desc=Ця бомба набула магічних властивостей. Вона вибухне потужним вибухом, подібним до посиленої атаки Гу, завдаючи _%1$d-%2$d магічної шкоди_ всьому в межах 2 клітинок.
items.bombs.arcanebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.arcanebomb.name=таємнича бомба
items.bombs.bomb$doublebomb.desc=Стопка з двох здоровенних бомб з чорним порохом, схоже, що одну отримуєш безкоштовно!
items.bombs.bomb$doublebomb.name=дві бомби
items.bombs.bomb.ac_lightthrow=СВІТЛО ТА ОСВІТЛЕННЯ
items.bombs.bomb.desc=Досить потужна бомба з чорним порохом. Вибух цієї бомби завдає _%1$d-%2$d шкоди_ всьому, що знаходиться поруч, та знищує деякі сусідні об'єкти або місцевість.
items.bombs.bomb.desc_burning=Запал бомби згорає, тримайся на відстані або загаси її!
items.bombs.bomb.desc_fuse=Схоже, що запобіжнику знадобиться кілька вибухів, щоб згоріти після того, як він запалиться.
items.bombs.bomb.name=бомба
items.bombs.bomb.ondeath=Вибух тебе вб'є...
items.bombs.bomb.rankings_desc=Загинув внаслідок вибуху
items.bombs.bomb.snuff_fuse=Ти швидко загасиш запал бомби.
items.bombs.firebomb.desc=Цю бомбу було модифіковано таким чином, щоб вона вибухала на більшій площі, завдаючи _%1$d-%2$d шкоди_ та поширюючи стійке полум'я в межах 2 клітинок.
items.bombs.firebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.firebomb.name=запальна бомба
items.bombs.flashbangbomb.desc=Ця кастомізована бомба вибухне, перетворившись на вибух світла, звуку та електрики. Будь-що в межах 2 клітинок отримає _%1$d-%2$d пошкоджень_ від вибуху, додаткові 25%% пошкоджень від електрики та буде приголомшене на 10 ходів.
items.bombs.flashbangbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.flashbangbomb.name=спалах
items.bombs.frostbomb.desc=Цю бомбу було модифіковано таким чином, щоб вона вибухала на більшій площі, завдаючи _%1$d-%2$d шкоди_ та поширюючи стійкий порив крижаного повітря в межах 2 клітинок.
items.bombs.frostbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.frostbomb.name=морозну бомбу
items.bombs.holybomb.desc=Цю бомбу модифіковано таким чином, щоб вона випромінювала святе світло на більшій площі під час вибуху. Будь-що в межах 2 клітинок отримає _%1$d-%2$d шкоди_ від вибуху, а нежить або демонічні вороги отримають додаткові 50%% шкоди від святого світла.
items.bombs.holybomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.holybomb.name=свята бомба
items.bombs.noisemaker.desc=Ця кастомізована бомба неодноразово видаватиме звук, коли її детонатор закінчиться. Коли щось торкнеться бомби, вона вибухне та завдасть _%1$d-%2$d шкоди_ всьому в межах 2 клітинок!
items.bombs.noisemaker.desc_burning=Шумогенератор цокає, він вибухне, якщо щось наблизиться!
items.bombs.noisemaker.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.noisemaker.name=шумовисько
items.bombs.regrowthbomb.desc=Ця спеціально розроблена бомба розбризкуватиме життєдайну рідину в радіусі 3 клітинок замість вибуху. У зоні, що потрапила під вибух, швидко проросте трава та рослини. Ви та будь-які союзники, що потрапили під вибух, зцілитеся, ніби випили зілля зцілення.
items.bombs.regrowthbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.regrowthbomb.name=бомба для відростання
items.bombs.shrapnelbomb.desc=Цю бомбу модифіковано шматками металу DM-300, які розлетяться на фрагменти та розлетяться навсюди, коли вибухнуть, завдаючи _%1$d-%2$d шкоди_ на величезному діапазоні навколо бомби. Краще сховатися за чимось, коли ви її використовуєте...
items.bombs.shrapnelbomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.shrapnelbomb.name=осколкова бомба
items.bombs.smokebomb.desc=Цю бомбу модифіковано таким чином, щоб вона викидала густу хмару газу під час вибуху. Вона завдасть _%1$d-%2$d шкоди_ та поширить огортаючий туман у радіусі 2 клітинок.
items.bombs.smokebomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.smokebomb.name=димова бомба
items.bombs.woollybomb.desc=Ця кастомізована бомба створить широке поле магічних овець після вибуху. Вибух завдасть _%1$d-%2$d шкоди_ всьому в межах 2 клітинок. Вівці блокуватимуть рух і залишатимуться там дуже довго! Однак вівці не так довго протримаються в присутності сильних ворогів, і їх можна швидше розвіяти вручну, взаємодіючи з ними.
items.bombs.woollybomb.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.bombs.woollybomb.name=вовняна бомба
items.brokenseal$warriorshield.desc_active=Зламана печатка Воїна зараз допомагає йому вистояти, надаючи йому щит на додаток до здоров'я. Після першого спрацьовування щита є час відновлення, перш ніж його можна буде використати знову.\n\nЦей щит не згасає з часом, але припиняє свою дію, якщо протягом кількох ходів поблизу немає ворогів. Коли він закінчується, будь-який невикористаний щит зменшить час відновлення, максимум до 50%%.\n\nЗалишок щита: %1$d.\n\nПоточний час відновлення: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воїн нещодавно отримав захист від своєї зламаної печатки та мусить чекати, поки знову зможе скористатися її ефектом захисту. \n\nХодів залишилося: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Час відновлення щита Воїна наразі негативний, тобто коли його щит активується, час відновлення буде меншим, ніж звичайні 150 ходів. Час відновлення щита можна зменшити до -150 ходів, що означає, що він буде знову доступний одразу після активації. \n\nПоточний час відновлення: %d.
items.brokenseal$warriorshield.name=Щит воїна
items.brokenseal.ac_affix=АФІКС
items.brokenseal.affix=Ти прикріплюєш печатку до своїх обладунків!
items.brokenseal.choose_desc=І ці обладунки, і зламана печатка несуть гліф. Виберіть, який гліф слід зберегти. \n\nГліф обладунків: %1$s\nГліф зламаної печатки: %2$s\n\nЗверніть увагу, що якщо ви оберете гліф, який зараз є на обладунках, печатка не зможе перенести його пізніше.
items.brokenseal.choose_title=Виберіть гліф
items.brokenseal.cursed_armor=Печатка не застосовуватиметься до проклятої броні.
items.brokenseal.desc=Воскова печатка, прикріплена до броні як символ доблесті. У центрі вигравірувана вицвіла руна захисту, і вона розколота навпіл посередині.\n\nA Сувенір з його дому, печатка допомагає воїну залишатися наполегливим. Під час носіння печатки воїн миттєво отримує щит, коли його здоров'я ось-ось втратить половину або менше.\n\nПечатку можна _прикріпити до броні_ та переміщати між бронями. Вона може нести одне покращення, якщо це покращення було застосовано до броні, коли до неї була прикріплена печатка.
items.brokenseal.discover_hint=Один з героїв починає з цього предмета.
items.brokenseal.inscribed=На печатці нанесено вигравіруваний літерний символ _%s._.
items.brokenseal.name=пошкоджена печатка
items.brokenseal.prompt=Виберіть броню
items.brokenseal.unknown_armor=Спочатку ти повинен визначити, чи проклята ця броня, чи ні.
items.dewdrop.already_full=Ви вже маєте повне здоров'я.
items.dewdrop.desc=Кришталево чиста крапля роси.
items.dewdrop.name=крапля роси
items.dewvial.ac_drink=ВИПИТИ
items.dewvial.auto_drink=Роса з пляшечки зцілила ваші рани. Пляшечка спорожніла.
items.dewvial.collected=Ви зібрали краплю роси в пляшечку.
items.dewvial.desc=У цій маленькій пляшечці можна зберігати зайву росу, щоб випити її пізніше. Якщо пляшечка повна, у мить смертельної небезпеки роса буде випита автоматично.
items.dewvial.empty=Ваша пляшечка для роси порожня!
items.dewvial.full=Ваша пляшечка для роси повна!
items.dewvial.name=пляшечка для роси
items.energycrystal.desc=Колекція маленьких магічних кристалів, наповнених алхімічною енергією.\n\nЦі кристали є найпоширенішим інгредієнтом в алхімічних рецептах і можуть бути вироблені в алхімічному горщику шляхом утилізації витратних предметів.
items.energycrystal.name=енергетичний кристал
items.equipableitem.ac_equip=ОБЛАДНАННЯ
items.equipableitem.ac_unequip=ЗНЯТИ ОБЛАДНАННЯ
items.equipableitem.curse_detected=Ви відчуваєте, що предмет проклятий, безпосередньо перед тим, як його екіпірувати!
items.equipableitem.unequip_cursed=Проклятий предмет видалити не можна!
items.food.berry.desc=Цю маленьку ягоду знайшла Мисливиця серед рослинності підземелля. Її можна швидко з'їсти, вона трохи насичує і може містити корисне насіння!
items.food.berry.discover_hint=Ви можете знайти цей предмет, використовуючи певний талант героя.
items.food.berry.eat_msg=Та ягода була смачна!
items.food.berry.name=ягода підземелля
items.food.blandfruit$chunks.desc=Пряний фрукт вибухнув від удару, залишивши після себе неживі шматки. \n\nНезважаючи на трохи бруду, ці великі шматки приготованого прісного фрукта здаються цілком їстівними.
items.food.blandfruit$chunks.name=шматочки м'яких фруктів
items.food.blandfruit.blindfruit=сліпий плод
items.food.blandfruit.cooked=приготовані м'які фрукти
items.food.blandfruit.desc=Такий сухий і несуттєвий, можливо, тушкування з іншим інгредієнтом покращило б його.
items.food.blandfruit.desc_cooked=Плід набряк від часу замочування в горщику та навіть увібрав у себе властивості насіння, з яким його варили. Він матиме ефект того зілля, якому відповідало це насіння.
items.food.blandfruit.desc_eat=Здається, його можна з'їсти!
items.food.blandfruit.desc_throw=Здається досить нестабільним, можливо, краще його викинути.
items.food.blandfruit.dreamfruit=магічний фрукт
items.food.blandfruit.earthfruit=земляні плоди
items.food.blandfruit.fadefruit=фейдфрут
items.food.blandfruit.firefruit=вогняний фрукт
items.food.blandfruit.icefruit=айсфрут
items.food.blandfruit.name=м'який фрукт
items.food.blandfruit.raw=Ти терпіти не можеш, щоб їсти його сирим.
items.food.blandfruit.rotfruit=гниль
items.food.blandfruit.sorrowfruit=печальний фрукт
items.food.blandfruit.starfruit=карамбола
items.food.blandfruit.stormfruit=штормфрут
items.food.blandfruit.sunfruit=соняшник
items.food.blandfruit.swiftfruit=швидкоплодний
items.food.chargrilledmeat.desc=Виглядає як пристойний стейк.
items.food.chargrilledmeat.discover_hint=Ви можете створити це, використовуючи інший харчовий продукт.
items.food.chargrilledmeat.name=смажене м'ясо
items.food.food.ac_eat=ЇСТИ
items.food.food.desc=Нічого особливого: сушене м'ясо, трохи печива – щось таке.
items.food.food.eat_msg=Та їжа була смачна!
items.food.food.name=раціон їжі
items.food.frozencarpaccio.better=Тобі краще!
items.food.frozencarpaccio.desc=Це шматок замороженого сирого м’яса. Їсти його можна лише тонко нарізавши. І в такому вигляді воно напрочуд смачне.
items.food.frozencarpaccio.discover_hint=Ви можете створити це, використовуючи інший харчовий продукт.
items.food.frozencarpaccio.hard=Ти відчуваєш, як твоя шкіра твердне!
items.food.frozencarpaccio.invis=Бачиш, твої руки стають невидимими!
items.food.frozencarpaccio.name=заморожене карпаччо
items.food.frozencarpaccio.refresh=Освіжає!
items.food.meatpie.desc=Смачний пиріг, начинений пікантним м’ясом. Він наситить вас набагато більше, ніж будь-яка інша страва.
items.food.meatpie.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.food.meatpie.eat_msg=Та їжа була неймовірна!
items.food.meatpie.name=м'ясний пиріг
items.food.mysterymeat$placeholder.name=м'ясо
items.food.mysterymeat.desc=Їжте на свій страх і ризик!
items.food.mysterymeat.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.food.mysterymeat.eat_msg=Та їжа мала... дивний смак.
items.food.mysterymeat.hot=О, спекотно!
items.food.mysterymeat.legs=Ти не відчуваєш ніг!
items.food.mysterymeat.name=таємниче м'ясо
items.food.mysterymeat.not_well=Ви погано почуваєтеся.
items.food.mysterymeat.stuffed=Ти ситий.
items.food.pasty$fishleftover.desc=Трохи риби, що залишилася з вашого попереднього прийому їжі. Ви можете з'їсти її будь-коли, щоб трохи вгамувати голод.
items.food.pasty$fishleftover.eat_msg=Та їжа була на смак нормальною.
items.food.pasty$fishleftover.name=залишки риби
items.food.pasty.amulet_desc=Ви нарешті знайшли його, чарівний амулет... зачекайте хвилинку, це ж просто шоколадка у фользі, зроблена так, щоб виглядати як амулет! Вона не дасть вам безмежної сили, але принаймні наситить вас і дасть трохи артефакту. \n\nПерше квітня!
items.food.pasty.amulet_name=амулет Єндора?
items.food.pasty.cane_desc=Величезна солодка цукрова льодяниця-тростина. Вона достатньо велика, щоб наситити вас, а цукор може ще й трохи зарядити ваші палички. \n\nЗі святами!
items.food.pasty.cane_name=цукерка-тростина
items.food.pasty.desc=Автентичний корнуольський пиріжок з традиційною начинкою з яловичини та картоплі. Смакота!
items.food.pasty.egg_desc=Велике шоколадне яйце, загорнуте в різнокольорову жовту фольгу. Тут легко вистачить шоколаду, щоб насититися, а цукор може додати вашим артефактам трохи додаткового заряду. \n\nЗ Великоднем!
items.food.pasty.egg_name=пасхальне яйце
items.food.pasty.fish_desc=Ціла риба на пару, чарівним чином законсервована на подушці з зелені. Приблизно в цю пору року існує традиція зберігати трохи риби на потім, щоб ви зберегли залишки, а не з'їли все одразу. \n\nЗ Новим роком за місячним календарем!
items.food.pasty.fish_name=риба на пару
items.food.pasty.name=тістоподібний
items.food.pasty.pie_desc=Великий шматок гарбузового пирога. Його солодкий та пряний смак наситить вас і дасть вам трохи зцілення. \n\nЗ Хеллоуїном!
items.food.pasty.pie_name=гарбузовий пиріг
items.food.pasty.rainbow_desc=Це барвисте зілля — різновид рідкої їжі. Окрім того, що воно втамовує голод, воно містить трохи магії, яка заспокоїть сусіднього ворога, який не є босом, тимчасово змусивши його вагатися битися з вами. \n\n Щасливої гордості!
items.food.pasty.rainbow_name=райдужне зілля
items.food.pasty.sparkling_desc=Це ігристе зілля — різновид рідкої їжі. Воно втамовує голод та імітує ігристе вино, але насправді не є алкогольним. Тепле відчуття у вашому животі надасть трохи захисту. \n\nЗ Новим роком!
items.food.pasty.sparkling_name=ігристе зілля
items.food.pasty.vanilla_desc=Цей великий шматок ванільного торта має різнокольорову посипку та блакитну глазур. Торт був виготовлений на честь багаторічного досвіду, і коли ви його з'їсте, він подарує вам невелику частинку цього досвіду. \n\nОригінальна гра Pixel Dungeon вперше вийшла 4 грудня 2012 року. З днем народження, Pixel Dungeon!
items.food.pasty.vanilla_name=синій торт
items.food.phantommeat.desc=Великий блискучий напівпрозорий стейк, вирізаний з фантомної піраньї. Це чарівне м'ясо не потребує приготування та надає низку захисних переваг, окрім повного насичення. З'їдене воно дарує невидимість, шкіру кори, деяке зцілення та позбавляє від багатьох шкідливих наслідків.
items.food.phantommeat.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.food.phantommeat.name=фантомне м'ясо
items.food.smallration.desc=Це виглядає точно як стандартний харчовий раціон, але менший.
items.food.smallration.discover_hint=Ви можете придбати цей товар у магазині.
items.food.smallration.eat_msg=Та їжа була на смак нормальною.
items.food.smallration.name=невеликий харчовий раціон
items.food.stewedmeat.desc=Гасіння м’яса очистило його від будь-яких хвороб чи паразитів. Його можна їсти.
items.food.stewedmeat.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.food.stewedmeat.eat_msg=Та їжа була на смак нормальною.
items.food.stewedmeat.name=тушковане м'ясо
items.food.supplyration.desc=Цей пайок був залишений у підземеллі членами гільдії злодіїв для них. Він спеціально розроблений для того, щоб його їли на ходу та допомагали у звичайних шахрайствах.\n\nХоча він не насичує так сильно, як звичайний пайок, його можна швидко з'їсти, він забезпечує невелике пряме зцілення та відновлює заряд плаща тіней Розбійника.
items.food.supplyration.discover_hint=Ви можете знайти цей предмет, використовуючи певний талант героя.
items.food.supplyration.name=раціон постачання
items.gold.desc=Купа золотих монет. Збирайте золоті монети, щоб витратити їх пізніше в магазині.
items.gold.name=золото
items.heap.artifact=артефакт
items.heap.chest=Груди
items.heap.chest_desc=Ви не дізнаєтесь, що всередині, поки не відкриєте!
items.heap.crystal_chest=Кришталева скриня
items.heap.crystal_chest_desc=Ви можете побачити _%s_ всередині, але щоб відкрити скриню, вам потрібен кришталевий ключ.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Замкнена скриня
items.heap.locked_chest_desc=Ти не знатимеш, що всередині, поки не відкриєш його! Але щоб його відкрити, тобі потрібен золотий ключик.
items.heap.remains=Останки героя
items.heap.remains_desc=Це все, що залишилося від одного з ваших попередників. Можливо, варто перевірити, чи немає тут якихось цінностей.
items.heap.ring=кільце
items.heap.skeleton=Скелетні останки
items.heap.skeleton_desc=Це все, що залишилося від якогось нещасного шукача пригод. Можливо, варто перевірити, чи немає тут якихось цінностей.
items.heap.tomb=Гробниця
items.heap.tomb_desc=Ця стародавня гробниця може й містити щось корисне, але її власник, безумовно, заперечуватиме проти перевірки.
items.heap.wand=паличка
items.honeypot$shatteredpot.desc=Горщик розбитий, його тримає цілим лише липкий мед, що вистилає його стінки, і він повільно розвалюється.\n\nНезважаючи на розбитий стан, бджола, здається, все ще хоче захистити горщик.
items.honeypot$shatteredpot.name=розбитий горщик з медом
items.honeypot.ac_shatter=РОЗБИТИ
items.honeypot.desc=Цей великий горщик з медом насправді лише вистелений медом, замість цього в ньому живе гігантська бджола! Такі величезні бджоли зазвичай сидять у своїх вуликах, можливо, горщик — це якась спеціалізована клітка ловця? Бджола здається досить задоволеною всередині горщика з медом і насторожено дзижчить, коли ви на неї дивитеся.
items.honeypot.name=медовий горщик
items.item.ac_drop=ПАДІННЯ
items.item.ac_throw=КИНУТИ
items.item.curse=прокляття
items.item.custom_note=Цей елемент має власну примітку: "_%s_"
items.item.custom_note_type=Цей тип елемента має спеціальну примітку: "_%s_"
items.item.discover_hint=Ви можете знайти цей предмет випадковим чином у підземеллі.
items.item.prompt=Виберіть напрямок кидка
items.item.rankings_desc=Убитий: %s
items.journal.alchemypage.desc=Вирвана сторінка з посібника з алхімії.\n\nБільша частина тексту занадто дрібна, щоб читати здалеку, але ви можете розібрати назву сторінки:\n\n_"%s"_
items.journal.alchemypage.name=розірвана сторінка книги з алхімії
items.journal.documentpage.desc=Самотня сторінка, ймовірно, вирвана з якоїсь книги. Вам потрібно буде взяти її в руки, щоб прочитати.
items.journal.documentpage.name=розірвана сторінка
items.journal.guidebook.desc=Путівник шукача пригод, залишений тут кимось, хто вирішив, що пригоди — це не для нього! Ця конкретна книга чарівна і може спонукати шукачів пригод прочитати сторінку у потрібний момент.\n\nНезважаючи на цю функціональність, книга є найбільш популярною завдяки великим словам «Не панікуйте!», написаним великими дружніми літерами на обкладинці.
items.journal.guidebook.hint_desktop=У вашому путівнику є поради для вас! Натисніть кнопку журналу (%s) у верхньому правому куті, щоб прочитати її.
items.journal.guidebook.hint_mobile=У вашому путівнику є поради для вас! Натисніть кнопку журналу, що блимає, у верхньому правому куті, щоб прочитати його.
items.journal.guidebook.hint_status=Путівник
items.journal.guidebook.name=том про майстерність підземель
items.journal.guidepage.desc=Вирвана сторінка з путівника для мандрівників.\n\nБільша частина тексту занадто дрібна, щоб читати здалеку, але ви можете розібрати назву сторінки:\n\n_"%s"_
items.journal.guidepage.name=порвана сторінка путівника
items.journal.regionlorepage$caves.desc=Щось схоже на запис у бортовому журналі дослідника, що напрочуд добре зберігся, незважаючи на те, наскільки він старий. Візьміть його, щоб прочитати.
items.journal.regionlorepage$caves.name=старий запис у журналі
items.journal.regionlorepage$city.desc=Маленька іржава металева табличка з магічно викарбуваним на ній повідомленням. Літери все ще чіткі, незважаючи на вік таблички, але вам доведеться взяти її в руки, щоб прочитати.
items.journal.regionlorepage$city.name=іржавий планшет
items.journal.regionlorepage$halls.desc=Маленька чорна табличка з вигравіруваними на ній сяючими зеленими літерами. Сяючі літери розмиваються в серпанок на відстані, вам доведеться підняти її, щоб прочитати.
items.journal.regionlorepage$halls.name=світиться планшет
items.journal.regionlorepage$prison.desc=Запис у щоденнику або якийсь інший документ, написаний на старому аркуші паперу. Здається, він зберігся краще, ніж листи, які ви знайшли в каналізації, але вам все одно доведеться його підняти, щоб прочитати.
items.journal.regionlorepage$prison.name=зношений запис у журналі
items.journal.regionlorepage$sewers.desc=Щось схоже на лист, написаний на забрудненому брудом аркуші паперу. Вам потрібно буде підняти його, щоб розібрати, що на ньому написано.
items.journal.regionlorepage$sewers.name=зношений лист
items.keys.crystalkey.desc=Зрізані поверхні цього кришталевого ключа мерехтять у темряві. Можливо, він відкриє щось зроблене з кришталю?
items.keys.crystalkey.name=Кришталевий ключ
items.keys.goldenkey.desc=Виїмки на цьому золотому ключику крихітні та вигадливі. Можливо, він відкриє замкнену скриню?
items.keys.goldenkey.name=золотий ключ
items.keys.ironkey.desc=Виїмки на цьому старовинному залізному ключі добряче зношені; його шкіряний шнурок пошарпаний від часу. Які двері він може відчинити?
items.keys.ironkey.name=залізний ключ
items.keys.skeletonkey.name=скелетний ключ
items.keys.wornkey.desc=Цей ключ зношений і знебарвлений, але виглядає серйозно. Ймовірно, він може відчинити якісь серйозні двері неподалік.
items.keys.wornkey.name=зношений ключ
items.kindofmisc.unequip_message=Спочатку потрібно зняти з екіпірування один із цих предметів. Виберіть предмет, на який потрібно поміняти його.
items.kindofmisc.unequip_title=Зняти з екіпіровки один предмет
items.kindofweapon.empty=порожній
items.kindofweapon.equip_cursed=Твоя хватка мимоволі міцніше стискає зброю.
items.kindofweapon.swift_equip=Ти швидко озброюєш свою зброю.
items.kindofweapon.which_equip_msg=У який слот для зброї ви хочете вставити цей предмет?\n\nЧемпіонка атакує безпосередньо своєю основною зброєю, але може використовувати здатність будь-якої з них. Обидві зброї мають однакову кількість зарядів.\n\nЧемпіонка також може миттєво міняти місцями свою основну та додаткову зброю.
items.kindofweapon.which_equip_primary=Основний (%s)
items.kindofweapon.which_equip_secondary=Вторинний (%s)
items.kingscrown.ac_wear=ОДЯГ
items.kingscrown.desc=Корона останнього короля гномів, вона світиться неймовірною магічною енергією.\n\nПісля носіння магія корони перетікає в броню, яку ви зараз носите, перетворюючи її на _унікальну епічну броню зі спеціальними здібностями._ Нова броня збереже всі властивості оригінальної броні.
items.kingscrown.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.kingscrown.naked=На жаль, корона не може перетворити вашу спідню білизну.
items.kingscrown.name=Корона короля гномів
items.kingscrown.ratgraded=Лапи Короля Щурів яскраво світяться, коли ваша броня трансформується!
items.kingscrown.upgraded=Корона яскраво світиться, а потім розпадається, коли ваша броня трансформується!
items.liquidmetal.ac_apply=ЗАЯВИТИСЯ
items.liquidmetal.already_fixed=Та кидна зброя вже в ідеальному стані!
items.liquidmetal.apply=Ви використовуєте рідкий метал %d для ремонту своєї метальної зброї.
items.liquidmetal.desc=Ця магічна рідина може заповнити тріщини та розриви на кинутій зброї, відновлюючи її до ідеального стану! Якщо в комплекті зброї відсутня зброя, але вона повністю відремонтована, то рідкий метал можна навіть використовувати для заміни відсутньої зброї з комплекту! \n\nA Для повного ремонту зброї 1 рівня потрібно 10 рідкого металу, а для зброї 5 рівня — 30. Кожне покращення також збільшує кількість необхідного металу на 35%. \n\nРідкий метал не можна використовувати для ремонту наконечників дротиків з наконечниками.
items.liquidmetal.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.liquidmetal.name=рідкий метал
items.liquidmetal.prompt=Виберіть кидальну зброю
items.lostbackpack.desc=Це ваш втрачений інвентар. Зберіть його, щоб повернути всі втрачені предмети!
items.lostbackpack.name=загублений рюкзак
items.merchantsbeacon.ac_use=ВИКОРИСТАННЯ
items.merchantsbeacon.desc=Цей дивний фрагмент гномьої технології дозволяє вам спілкуватися на великих відстанях.\n\nПісля активації цей маяк дозволить вам продавати предмети в Pixel Mart з будь-якої точки підземелля.\n\nОднак магія всередині маяка триватиме лише один сеанс, тому використовуйте її з розумом.
items.merchantsbeacon.name=торговельний маяк
items.potions.brews.aquabrew.desc=Коли ця суміш розбивається, вона вивільняє вибух води під тиском у місці свого розташування. Його сила достатня лише для того, щоб завдати шкоди вогняним ворогам, але вона також поширює воду на сусідню місцевість, знешкоджує пастки, гасить пожежі та відкидає персонажів поблизу вибуху.
items.potions.brews.aquabrew.name=аква-брю
items.potions.brews.blizzardbrew.desc=Коли цей напій розбивається, він вивільняє завірюху, яка швидко поширюється, як газ.
items.potions.brews.blizzardbrew.name=хуртовина
items.potions.brews.brew.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.potions.brews.causticbrew.desc=Цей напій поширює корозійний слиз на широку область навколо місця, де він розіб'ється. Все, що потрапить у слиз, повільно розтане, якщо його не змити водою.
items.potions.brews.causticbrew.name=їдкий напій
items.potions.brews.infernalbrew.desc=Коли цей напій розбито, він викличе шалене пекло, яке швидко поширюється, як газ.
items.potions.brews.infernalbrew.name=пекельне варення
items.potions.brews.shockingbrew.desc=Коли цей напій розіб'ється, він спричинить електричну бурю у великій області навколо місця розбиття.
items.potions.brews.shockingbrew.name=шокуюче варення
items.potions.brews.unstablebrew.desc=Цей чарівний напій світиться мінливими кольорами веселки. \n\nЯкщо його випити або кинути, він активує ефект випадкового зілля. Ефект зілля завжди буде корисним, якщо його випити, і завжди буде шкідливим, якщо його кинути.
items.potions.brews.unstablebrew.name=нестабільне заварювання
items.potions.elixirs.elixir.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Ви тимчасово отримали відновлювальні властивості, подібні до властивостей Гу.\n\nСтоячи у воді, ви відновлюватимете невелику кількість здоров'я за хід. Ефект призупиняється, коли у вас повне здоров'я або ви поза водою.\n\nЗалишилося зцілення: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=водне зцілення
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Цей еліксир містить залишки слизу, посилені цілющим зіллям. Хоча він не забезпечить негайного зцілення, він поступово відновлюватиме більшу кількість здоров'я, поки ви стоїте у воді.
items.potions.elixirs.elixirofaquaticrejuvenation.name=еліксир водного омолодження
items.potions.elixirs.elixirofarcanearmor.desc=Цей еліксир надасть тому, хто його вип'є, тривалу стійкість до магічної шкоди.
items.potions.elixirs.elixirofarcanearmor.name=еліксир таємничої броні
items.potions.elixirs.elixirofdragonsblood.desc=Після вживання цей еліксир посилає вогняну силу, що циркулює по жилах того, хто п'є. Цей ефект зробить того, хто п'є, невразливим до вогню та дозволить йому підпалювати ворогів фізичними атаками.
items.potions.elixirs.elixirofdragonsblood.name=еліксир драконової крові
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Ви перебуваєте під дією еліксиру падіння пір'я, який дозволяє вам падати у прірви, не отримуючи шкоди!\n\nХодів залишилося: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=падіння пір'я
items.potions.elixirs.elixiroffeatherfall.desc=Цей еліксир пропонує слабший, але більш контрольований ефект левітації, дозволяючи тому, хто його п'є, падати на великі відстані без шкоди протягом деякого часу.
items.potions.elixirs.elixiroffeatherfall.light=Ти відчуваєш себе легким, як пір'їнка!
items.potions.elixirs.elixiroffeatherfall.name=еліксир падіння пір'я
items.potions.elixirs.elixirofhoneyedhealing.desc=Цей еліксир поєднує в собі зцілення із солодкістю меду. Випитий, він матиме той самий ефект, що й зілля зцілення, і трохи втамує голод, але його також можна кинути, щоб зцілити союзника. \n\nІстоти, схильні до меду, можуть бути заспокоєні, якщо цей предмет буде використаний проти них.
items.potions.elixirs.elixirofhoneyedhealing.name=медовий лікувальний еліксир
items.potions.elixirs.elixiroficytouch.desc=Після вживання цей еліксир дозволить тому, хто його вип'є, висмоктати тепло з ворогів, на яких він нападає. Цей ефект зробить того, хто його вип'є, несприйнятливим до холоду та дозволить йому охолоджувати ворогів фізичними атаками.
items.potions.elixirs.elixiroficytouch.name=еліксир крижаного дотику
items.potions.elixirs.elixirofmight$htboost.desc=Ваше тіло відчувається неприродно сильним і здоровим.\n\nВаше максимальне здоров'я підвищується на тривалий період часу. Зі збільшенням рівнів підсилення поступово зменшуватиметься.\n\nПоточний рівень підсилення: %d.\nЗалишок рівнів: %d.
items.potions.elixirs.elixirofmight$htboost.name=максимальне посилення здоров'я
items.potions.elixirs.elixirofmight.desc=Ця потужна рідина протікає крізь ваші м'язи, постійно збільшуючи вашу силу на одне очко та тимчасово збільшуючи максимальне здоров'я на %d очок. Підвищення здоров'я залежить від вашого максимального здоров'я, але поступово зникатиме зі збільшенням рівня.
items.potions.elixirs.elixirofmight.msg=Новознайдена сила пронизує ваше тіло, тепер у вас є сила %d!
items.potions.elixirs.elixirofmight.name=еліксир могутності
items.potions.elixirs.elixiroftoxicessence.desc=Після вживання цей еліксир наповнить того, хто його п'є, токсичною енергією. Той, хто його п'є, постійно поширюватиме токсичний газ під час руху та буде несприйнятливим до токсичного газу та отрути трохи довше, ніж триває ефект.
items.potions.elixirs.elixiroftoxicessence.name=еліксир токсичної сутності
items.potions.exotic.exoticpotion.amber=екзотичне бурштинове зілля
items.potions.exotic.exoticpotion.azure=екзотичне блакитне зілля
items.potions.exotic.exoticpotion.bistre=екзотичне зілля бістр
items.potions.exotic.exoticpotion.charcoal=екзотичне вугільне зілля
items.potions.exotic.exoticpotion.crimson=екзотичне багряне зілля
items.potions.exotic.exoticpotion.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.potions.exotic.exoticpotion.golden=екзотичне золоте зілля
items.potions.exotic.exoticpotion.indigo=екзотичне зілля індиго
items.potions.exotic.exoticpotion.ivory=екзотичне зілля зі слонової кістки
items.potions.exotic.exoticpotion.jade=екзотичне нефритове зілля
items.potions.exotic.exoticpotion.magenta=екзотичне пурпурове зілля
items.potions.exotic.exoticpotion.no=Ні, я передумав/передумала.
items.potions.exotic.exoticpotion.silver=екзотичне срібне зілля
items.potions.exotic.exoticpotion.turquoise=екзотичне бірюзове зілля
items.potions.exotic.exoticpotion.unknown_desc=Ця кругла фляжка містить зернисту різнокольорову рідину. Вона здається чужою для цієї землі, хто знає, що з нею можна зробити, якщо її випити чи кинути в воду?
items.potions.exotic.exoticpotion.warning=Ви справді хочете скасувати використання цього зілля? Його все одно буде спожито.
items.potions.exotic.exoticpotion.yes=Так, я впевнений
items.potions.exotic.potionofcleansing$cleanse.desc=Цей персонаж тимчасово має імунітет до всіх шкідливих ефектів статусу!\n\nХодів залишилося: %s.
items.potions.exotic.potionofcleansing$cleanse.name=очищений
items.potions.exotic.potionofcleansing.desc=Цей потужний реагент зробить того, хто п'є, імунітетом до всіх шкідливих ефектів статусу на кілька ходів, якщо його випити. Його також можна кинути в ціль, щоб очистити її.
items.potions.exotic.potionofcleansing.name=зілля очищення
items.potions.exotic.potionofcorrosivegas.desc=Відкупорювання або розбиття цієї склянки під тиском призведе до вибуху її вмісту, перетворюючи смертельну хмару корозійного газу кольору іржі. Газ поширюється швидше, ніж токсичний газ, і є більш смертельним, але також не буде діяти так довго.
items.potions.exotic.potionofcorrosivegas.name=зілля корозійного газу
items.potions.exotic.potionofdivineinspiration.bonus=+2 очки талантів!
items.potions.exotic.potionofdivineinspiration.desc=Сила святої енергії, перетворена на рідку форму, цей напій наповнить того, хто вип'є, божественною силою, надаючи йому два бонусні очки талантів на рівні на вибір. \n\nЦе зілля можна використовувати лише один раз для кожного рівня талантів.
items.potions.exotic.potionofdivineinspiration.name=зілля божественного натхнення
items.potions.exotic.potionofdivineinspiration.no_more_points=Ви не можете отримати більше бонусних очок талантів.
items.potions.exotic.potionofdivineinspiration.select_tier=Виберіть рівень таланту, щоб отримати два бонусні очки. Ви повинні розблокувати рівень, щоб мати змогу витратити очки.
items.potions.exotic.potionofdragonsbreath.desc=Ця колба містить незвичайну сполуку, яка спалахує невдовзі після змішування зі слиною. Швидке виплювання рідини дозволить користувачеві вивергнути полум'я з рота!
items.potions.exotic.potionofdragonsbreath.name=зілля дихання дракона
items.potions.exotic.potionofdragonsbreath.prompt=Виберіть місце для спалювання
items.potions.exotic.potionofearthenarmor.desc=Замість паралізу, ця рідина має загартовувальний ефект на шкіру, перетворюючи її на тимчасовий природний панцир.
items.potions.exotic.potionofearthenarmor.name=зілля земляних обладунків
items.potions.exotic.potionofmagicalsight.desc=Після того, як ви вип'єте це, ваші відчуття ненадовго загостряться до неймовірного рівня, що дозволить вам бачити крізь стіни в радіусі 12 плиток!
items.potions.exotic.potionofmagicalsight.name=зілля магічного зору
items.potions.exotic.potionofmastery.armor_easier=Ваші обладунки легше носити!
items.potions.exotic.potionofmastery.desc=Замість того, щоб дарувати чисту силу, це зілля налаштовуватиме м'язи користувача на певний предмет. Це зробить цей предмет легшим у використанні, ніби той, хто його випив, потренувався з ним і розвинув м'язову пам'ять. \n\nДля використання обраної зброї або броні знадобиться на 2 одиниці сили менше. Це зілля можна використовувати лише один раз на кожному предметі.
items.potions.exotic.potionofmastery.name=зілля майстерності
items.potions.exotic.potionofmastery.prompt=Опануйте елемент
items.potions.exotic.potionofmastery.weapon_easier=Твоєю зброєю стане легше володіти!
items.potions.exotic.potionofshielding.desc=Замість лікування, це зілля створює міцний щит навколо тіла користувача, блокуючи значну кількість шкоди.
items.potions.exotic.potionofshielding.name=зілля захисту
items.potions.exotic.potionofshroudingfog.desc=Під впливом повітря рідина в цій колбі утворює густий димний туман, який швидко поширюється та блокує зір вашим ворогам.
items.potions.exotic.potionofshroudingfog.name=зілля огортаючий туман
items.potions.exotic.potionofsnapfreeze.desc=Хімічна речовина, що міститься в цьому зіллі, швидко реагуватиме з повітрям, миттєво заморожуючи та знищуючи все, що знаходиться під її дією.
items.potions.exotic.potionofsnapfreeze.name=зілля швидкого заморожування
items.potions.exotic.potionofstamina.desc=Вживання цієї дивно солодкої рідини наповнить вас тривалим зарядом енергії, що дозволить вам бігати в прискореному темпі протягом тривалого періоду часу.
items.potions.exotic.potionofstamina.name=зілля витривалості
items.potions.exotic.potionofstormclouds.desc=Кидання цього зілля створить швидкорозповсюджувану хмару концентрованої пари, яка конденсуватиметься та виллється на навколишнє середовище. Більша частина місцевості перетвориться на воду, вогняні вороги отримають пошкодження, вогонь буде загашено, а пастки будуть знищені та зруйновані.
items.potions.exotic.potionofstormclouds.name=зілля грозових хмар
items.potions.potion$placeholder.name=зілля
items.potions.potion$seedtopotion.name=Випадкове зілля
items.potions.potion.ac_drink=ВИПИТИ
items.potions.potion.amber=бурштинове зілля
items.potions.potion.azure=блакитне зілля
items.potions.potion.beneficial=Корисне зілля
items.potions.potion.bistre=бістре зілля
items.potions.potion.charcoal=вугільне зілля
items.potions.potion.crimson=багряне зілля
items.potions.potion.discover_hint=Ви можете знайти цей предмет випадковим чином у підземеллі або створити його за допомогою алхімії.
items.potions.potion.golden=золоте зілля
items.potions.potion.harmful=Шкідливе зілля!
items.potions.potion.indigo=зілля індиго
items.potions.potion.ivory=зілля зі слонової кістки
items.potions.potion.jade=нефритове зілля
items.potions.potion.magenta=пурпурове зілля
items.potions.potion.no=Ні, я передумав/передумала.
items.potions.potion.shatter=Колба розбивається, і рідина нешкідливо бризкається.
items.potions.potion.silver=срібне зілля
items.potions.potion.sure_drink=Ти впевнений, що хочеш це випити? У більшості випадків тобі слід кидати такі зілля у ворогів.
items.potions.potion.sure_throw=Ти впевнений, що хочеш це випити? У більшості випадків має сенс це випити.
items.potions.potion.turquoise=бірюзове зілля
items.potions.potion.unknown_desc=У цій колбі вирує рідина %s. Хто знає, що станеться, якщо випити її чи кинути колбу?
items.potions.potion.yes=Так, я знаю, що роблю
items.potions.potionofexperience.desc=Цей напій, що містить багатовіковий досвід безлічі битв, перетворений на рідку форму, миттєво підвищить ваш рівень досвіду.
items.potions.potionofexperience.name=зілля досвіду
items.potions.potionoffrost.desc=На відкритому повітрі ця речовина випаровується, утворюючи крижану хмару. Кожна істота, що торкнеться її, замерзне на місці й не зможе ні рухатися, ні діяти.
items.potions.potionoffrost.name=зілля морозу
items.potions.potionofhaste.desc=Вживання цієї дивно солодкої рідини на короткий час наповнить вас величезною енергією, що дозволить вам бігати на високій швидкості.
items.potions.potionofhaste.energetic=Ви відчуваєте себе енергійними!
items.potions.potionofhaste.name=зілля поспіху
items.potions.potionofhealing.desc=Еліксир, який миттєво відновить усе здоров'я та вилікує отруєння.
items.potions.potionofhealing.heal=Твої рани починають затягуватися.
items.potions.potionofhealing.name=зілля зцілення
items.potions.potionofinvisibility.desc=Це зілля на деякий час зробить тебе невидимим для ворогів. Атака на ворога або використання жезла чи сувою в нього на очах розвіють дію зілля.
items.potions.potionofinvisibility.invisible=Бачиш, твої руки стають невидимими!
items.potions.potionofinvisibility.name=зілля невидимості
items.potions.potionoflevitation.desc=Ця незвичайна рідина дозволить ширяти в повітрі й легко пролітати над пастками. Проте полум'я та гази заповнюють і повітря, тож так їх не оминути.
items.potions.potionoflevitation.float=Ти ширяєш у повітрі!
items.potions.potionoflevitation.name=зілля левітації
items.potions.potionofliquidflame.desc=Ця колба містить нестабільну сполуку, яка різко спалахне на відкритому повітрі.
items.potions.potionofliquidflame.name=зілля рідкого полум'я
items.potions.potionofmindvision.desc=Після вживання цього настою ваш розум налаштується на психічні сигнали віддалених істот, що дозволить вам відчувати біологічну присутність крізь стіни. Також це зілля дозволить вам бачити крізь сусідні стіни та двері.
items.potions.potionofmindvision.name=зілля розумового бачення
items.potions.potionofmindvision.see_mobs=Ви якимось чином можете відчути присутність розуму інших істот!
items.potions.potionofmindvision.see_none=Якось можна сказати, що на даний момент ви самі на цьому рівні.
items.potions.potionofparalyticgas.desc=Під впливом відкритого повітря рідина в цій колбі випаровується, перетворюючись на онімілий жовтий серпанок. Той, хто вдихне хмару, миттєво паралізується і не зможе рухатися деякий час після того, як хмара розсіється. Цей предмет можна кинути у віддалених ворогів, щоб зловити їх у зоні дії газу.
items.potions.potionofparalyticgas.name=зілля паралітичного газу
items.potions.potionofpurity.desc=Ця речовина швидко знешкоджує всі шкідливі гази в області дії. Якщо її випити, вона на деякий час захистить від таких газів.
items.potions.potionofpurity.freshness=У повітрі відчувається незвичайна свіжість.
items.potions.potionofpurity.name=Зілля очищення
items.potions.potionofpurity.protected=Захисна плівка огортає вас!
items.potions.potionofstrength.desc=Ця потужна рідина протікає крізь ваші м'язи, постійно збільшуючи вашу силу на один бал.
items.potions.potionofstrength.msg=Новознайдена сила пронизує ваше тіло, тепер у вас є сила %d!
items.potions.potionofstrength.name=зілля сили
items.potions.potionoftoxicgas.desc=Відкоркування або розбиття цієї склянки під тиском призведе до вибуху її вмісту, перетворивши на смертельну хмару токсичного зеленого газу. Ви можете кинути це зілля у віддалених ворогів, замість того, щоб відкорковувати його вручну.
items.potions.potionoftoxicgas.name=зілля токсичного газу
items.quest.ceremonialcandle.desc=Набір свічок, розплавлених та сплавлених разом під час використання. \n\nОкремо вони нічого не варті, але використані з іншими свічками у візерунку, вони можуть зосередити енергію для ритуалу виклику.
items.quest.ceremonialcandle.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.ceremonialcandle.name=обрядова свічка
items.quest.corpsedust.chill=По спині пробігає холодок.
items.quest.corpsedust.desc=Куля трупного пилу зовні нічим не відрізняється від звичайної. Але всередині неї відчувається зловмисна енергія. \n\n Було б гарною ідеєю позбутися її якомога швидше.
items.quest.corpsedust.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.corpsedust.name=трупний пил
items.quest.darkgold.desc=Цей метал називають темним не через його колір (він не відрізняється від звичайного золота), а тому, що він плавиться під денним світлом, роблячи його поверхнево непридатним.
items.quest.darkgold.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.darkgold.name=темно-золота руда
items.quest.darkgold.you_now_have=Тепер у вас є темно-золота руда %d.
items.quest.dwarftoken.desc=Багато гномів та деякі з їхніх більших творінь носять ці маленькі шматочки металу невідомого призначення. Можливо, це коштовності або якесь посвідчення особи. Гноми — дивний народ.
items.quest.dwarftoken.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.dwarftoken.name=жетон гнома
items.quest.embers.desc=Особливе вугілля, яке можна зібрати лише з молодих вогняних елементалів. Воно випромінює теплову енергію.
items.quest.embers.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.embers.name=елементарні вугілля
items.quest.escapecrystal.ac_use=ВИКОРИСТАННЯ
items.quest.escapecrystal.desc=Тонкий магічний кристал заклинань, який, здається, містить магію телепортації. Ви можете використати кристал будь-коли, щоб покинути гномське сховище, але ви не зможете нічого з собою забрати!
items.quest.escapecrystal.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.escapecrystal.name=кристал втечі
items.quest.gooblob.desc=Хитаюча грудка липкої речовини, що відкололась від Гу, коли той помирав. Вона майже як велика куля желе, хоча ви б не наважилися її з'їсти.\n\nСама по собі вона нічого не робить, але може бути корисною в поєднанні з певними зіллями або бомбою. Як мінімум, вона має перетворюватися на пристойну кількість енергії.
items.quest.gooblob.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.quest.gooblob.name=крапля липкої речовини
items.quest.metalshard.desc=Уламок іржавого проклятого металу, який відламався від DM-300 під час його знищення. У ньому відчувається неактивна зловмисна магія. \n\nСам по собі він нічого не робить, але може бути корисним у поєднанні з певними сувоями або бомбою. Як мінімум, він має перетворитися на пристойну кількість енергії.
items.quest.metalshard.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.quest.metalshard.name=проклятий металевий осколок
items.quest.pickaxe.ability_desc=Дуелянт може _пронизати_ ворога киркою. Це гарантовано влучає, накладає вразливість на 3 ходи та завдає _%1$d-%2$d шкоди_ ворогам із жорсткою шкірою.
items.quest.pickaxe.ability_name=проколювати
items.quest.pickaxe.desc=Це міцний і важкий інструмент для руйнування каміння. Вам не потрібно оснащувати його киркою, щоб добувати корисні копалини, але його, ймовірно, можна використовувати як зброю в крайньому випадку.
items.quest.pickaxe.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
items.quest.pickaxe.name=кирка
items.quest.pickaxe.upgrade_ability_stat_name=Шкода від здібностей
items.quest.ratskull.desc=Напрочуд великий череп щура. Він був би чудовим мисливським трофеєм, якби у вас була стіна, на яку можна його повісити.
items.quest.ratskull.name=череп гігантського щура
items.remains.bowfragment.desc=Цей зламаний фрагмент дерева колись був частиною духівного лука загубленої Мисливиці. Ви все ще можете відчути трохи природної енергії, що залишилася у фрагменті, ви можете використати фрагмент, щоб виростити навколо себе високу траву. Однак, якщо зробити це, фрагмент буде знищено.
items.remains.bowfragment.name=фрагмент лука
items.remains.brokenhilt.desc=Цей зламаний рукоять виглядає так, ніби він від зброї переможеного дуелянта. Ви все ще можете відчути трохи бойової сили, що залишилася в рукояті, ви можете використати її, щоб отримати невелику додаткову шкоду наступними двома ударами ближнього бою. Однак, якщо зробити це, рукоять буде знищена.
items.remains.brokenhilt.name=зламана рукоять
items.remains.brokenstaff.desc=Посох цього мага було зламано навпіл після смерті його власника. Ви все ще можете відчути певну магічну енергію, що залишилася в посохе, ви можете використовувати її, щоб трохи підсилити заряд своїх паличок. Однак це знищить посох.
items.remains.brokenstaff.name=зламаний персонал
items.remains.cloakscrap.desc=Цей клаптик напівпрозорої тканини виглядає так, ніби він походить з плаща тіней покійного Розбійника. Ви все ще можете відчути в ньому трохи містичної енергії, яку можете використовувати, щоб трохи підсилити заряд своїх артефактів. Однак це знищить тканину.
items.remains.cloakscrap.name=клаптик тканини
items.remains.remainsitem.ac_use=ВИКОРИСТАННЯ
items.remains.remainsitem.discover_hint=Ви можете знайти цей предмет у останках певного героя з попереднього програного заходу.
items.remains.sealshard.desc=Ці крихітні шматочки червоного воску виглядають так, ніби вони походять від печатки загиблого Воїна. Ви все ще можете відчути трохи сили волі, що чіпляється за печатку, ви можете використати її, щоб створити собі певний захист. Однак це знищить уламки печатки.
items.remains.sealshard.name=осколки печатки
items.remains.tornpage.desc=Ця сторінка виглядає так, ніби її вирвали зі священного томіну клірика, термін дії якого минув. На ній все ще є трохи божественної енергії, ви можете використати її, щоб відновити трохи здоров'я. Однак, якщо зробити це, ви знищите розірвану сторінку.
items.remains.tornpage.name=розірвана сторінка
items.rings.ring.agate=агатове кільце
items.rings.ring.amethyst=аметистове кільце
items.rings.ring.curse_known=Ви можете відчути зловісну магію, що ховається в цьому кільці.
items.rings.ring.cursed_worn=Оскільки це кільце прокляте, ти безсилий його зняти.
items.rings.ring.diamond=діамантове кільце
items.rings.ring.emerald=смарагдове кільце
items.rings.ring.equip_cursed=Кільце боляче затягується навколо пальця!
items.rings.ring.garnet=гранатове кільце
items.rings.ring.identify=Тепер ви достатньо знайомі зі своїм кільцем, щоб його розпізнати.
items.rings.ring.known=Це %s.
items.rings.ring.not_cursed=Цей перстень вільний від зловісної магії.
items.rings.ring.onyx=каблучка з оніксом
items.rings.ring.opal=каблучка з опалом
items.rings.ring.quartz=кварцове кільце
items.rings.ring.ruby=рубіновий перстень
items.rings.ring.sapphire=сапфірове кільце
items.rings.ring.topaz=кільце з топазом
items.rings.ring.tourmaline=турмалінове кільце
items.rings.ring.unknown_desc=Цей металевий перстень оздоблений великим %s, що виблискує в темряві. Хто знає, що станеться, якщо його надягти?
items.rings.ringofaccuracy.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи вашу точність загалом на _%s%%_.
items.rings.ringofaccuracy.desc=Цей перстень збільшує шанс влучити у ворога.
items.rings.ringofaccuracy.name=перстень точності
items.rings.ringofaccuracy.stats=При носінні це кільце збільшить вашу точність на _%s%%._
items.rings.ringofaccuracy.typical_stats=При носінні це кільце зазвичай підвищує вашу точність на _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Підвищення точності
items.rings.ringofarcana.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи загалом силу чарів та гліфів на _%s%%_.
items.rings.ringofarcana.desc=Це кільце посилює магічні чари на зброї та гліфи на броні, включаючи прокляття! Спочатку воно збільшує шанс активації, а потім збільшує силу ефекту, коли шанс активації досягає 100%. Прокляте кільце натомість послаблює чари, гліфи та прокляття.
items.rings.ringofarcana.name=кільце арканів
items.rings.ringofarcana.stats=При носінні цей перстень збільшить силу чарів та гліфів на _%s%%._
items.rings.ringofarcana.typical_stats=При носінні цей перстень зазвичай збільшує силу чарів та гліфів на _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Підсилення Аркани
items.rings.ringofelements.combined_stats=Ваші екіпіровані кільця об'єднують свою силу, загалом забезпечуючи елементарний опір _%s%%_.
items.rings.ringofelements.desc=Цей перстень надає стійкість до вогню, електрики, газів та інших стихій. Він також скорочує тривалість шкідливих ефектів.
items.rings.ringofelements.name=перстень стихій
items.rings.ringofelements.stats=Після носіння це кільце забезпечуватиме _%s%%_ елементарний опір.
items.rings.ringofelements.typical_stats=Під час зносу це кільце зазвичай забезпечуватиме _%s%%_ елементарний опір.
items.rings.ringofelements.upgrade_stat_name_1=Опір
items.rings.ringofenergy.combined_stats=Ваші екіпіровані кільця об'єднують свою силу, збільшуючи швидкість заряду загалом на _%s%%_.
items.rings.ringofenergy.desc=Ваше магічне спорядження перезаряджатиметься швидше в арканному полі, що випромінюється з цього кільця. Прокляте кільце натомість уповільнить перезарядку.
items.rings.ringofenergy.name=кільце енергії
items.rings.ringofenergy.stats=При носінні цей перстень збільшить швидкість заряджання чарівної палички, артефакту та героїчної броні на _%s%%._
items.rings.ringofenergy.typical_stats=При носінні це кільце зазвичай збільшує швидкість заряджання чарівної палички, артефакту та героїчної броні на _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Підвищення заряду
items.rings.ringofevasion.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи ваше ухилення загалом на _%s%%_.
items.rings.ringofevasion.desc=Цей перстень збільшує шанс ухилитися від ворожої атаки.
items.rings.ringofevasion.name=перстень ухилення
items.rings.ringofevasion.stats=Якщо носити це кільце, воно збільшить вашу здатність ухилятися на _%s%%._
items.rings.ringofevasion.typical_stats=При носінні це кільце зазвичай збільшує вашу здатність ухилятися на _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Підсилення ухилення
items.rings.ringofforce$brawlersstance.desc=У цій стійці звичайні атаки Дуелянтки використовуватимуть споряджене кільце сили, навіть якщо в неї є зброя. Ці атаки отримують додаткову шкоду та все ще використовуватимуть доповнення та зачарування зброї.\n\nОднак підтримка цієї стійки вимагає фокусу, що зменшує швидкість перезарядки здібностей зброї на 50%.\n\nЦю стійку можна вмикати або вимикати за допомогою кільця сили, але зниження швидкості заряду зберігатиметься деякий час, якщо стійку швидко активувати та деактивувати.
items.rings.ringofforce$brawlersstance.name=позиція бешкетника
items.rings.ringofforce.ability_desc=Дуелянтка може прийняти _стійку бійця_ з цим кільцем, що змушує її звичайні атаки завжди використовувати це кільце, навіть зі зброєю в руках. Ці атаки завдаватимуть _%1$d-%2$d шкоди_, а також успадкують зачарування та доповнення зброї. Ця стійка уповільнює швидкість перезарядки зброї на 50%%.
items.rings.ringofforce.ability_name=позиція бешкетника
items.rings.ringofforce.combined_stats=Ваші екіпіровані кільця поєднують свою силу, завдаючи загалом _%1$d-%2$d шкоди_ без зброї або збільшуючи шкоду на _%3$d_ з нею.
items.rings.ringofforce.desc=Це кільце посилює силу ударів ближнього бою власника. Ця додаткова сила досить слабка при використанні зброї, але атака без зброї буде набагато сильнішою. Прокляте кільце натомість послабить удари власника.
items.rings.ringofforce.name=кільце сили
items.rings.ringofforce.stats=Коли ви без зброї, за вашої поточної сили, це кільце завдасть _%1$d-%2$d шкоди._ Зі зброєю, це кільце збільшить шкоду на _%3$d._
items.rings.ringofforce.typical_ability_desc=Дуелянтка може прийняти _стійку бійця_ з цим кільцем, що змушує її звичайні атаки завжди використовувати це кільце, навіть зі зброєю в руках. Ці атаки зазвичай завдають _%1$d-%2$d шкоди_, а також успадковують зачарування та доповнення зброї. Ця стійка уповільнює швидкість перезарядки зброї на 50%%.
items.rings.ringofforce.typical_stats=Коли ви без зброї, за вашої поточної сили, це кільце зазвичай завдає _%1$d-%2$d шкоди._ Зі зброєю, яке ви носите, це кільце зазвичай збільшує шкоду на _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Пошкодження без зброї
items.rings.ringofforce.upgrade_stat_name_2=Підвищення шкоди від зброї
items.rings.ringofforce.upgrade_stat_name_3=Шкода від здібностей
items.rings.ringoffuror.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи швидкість ваших атак загалом на _%s%%_.
items.rings.ringoffuror.desc=Це кільце надає власнику внутрішню лють, що дозволяє йому атакувати швидше. Прокляте кільце натомість уповільнить швидкість атаки власника.
items.rings.ringoffuror.name=кільце фурору
items.rings.ringoffuror.stats=При носінні це кільце збільшить швидкість ваших атак на _%s%%._
items.rings.ringoffuror.typical_stats=При носінні це кільце зазвичай збільшує швидкість ваших атак на _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Підвищення швидкості атаки
items.rings.ringofhaste.combined_stats=Ваші екіпіровані кільця об'єднують свою силу, збільшуючи вашу швидкість руху загалом на _%s%%_.
items.rings.ringofhaste.desc=Цей перстень прискорює плин часу для свого власника, дозволяючи виконувати будь-які дії трохи швидше.
items.rings.ringofhaste.name=перстень швидкості
items.rings.ringofhaste.stats=При носінні це кільце збільшить вашу швидкість руху на _%s%%._
items.rings.ringofhaste.typical_stats=При носінні це кільце зазвичай збільшує швидкість вашого руху на _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Прискорення швидкості руху
items.rings.ringofmight.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи вашу силу на _%1$d_ та максимальний рівень здоров'я на _%2$s%%_ загалом.
items.rings.ringofmight.desc=Цей перстень посилює фізичні риси власника, надаючи йому більшу фізичну силу та конституцію. Проклятий перстень послабить власника.
items.rings.ringofmight.name=кільце могутності
items.rings.ringofmight.stats=При носінні цей перстень збільшить вашу силу на _%1$d_ та ваш максимальний запас здоров'я на _%2$s%%._
items.rings.ringofmight.typical_stats=При носінні це кільце зазвичай збільшує вашу силу на _%1$d_ та ваш максимальний запас здоров'я на _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=підвищення сили
items.rings.ringofmight.upgrade_stat_name_2=Максимальне збільшення HP
items.rings.ringofsharpshooting.combined_stats=Ваші екіпіровані кільця поєднують свою силу, підвищуючи ефективний рівень кидкової зброї на _%1$d_ та збільшуючи їхню міцність загалом на _%2$s%%_.
items.rings.ringofsharpshooting.desc=Це кільце підвищує точність і прицілювання власника, що зробить всю метальну зброю більш руйнівною та міцною. Прокляте кільце матиме протилежний ефект.
items.rings.ringofsharpshooting.name=кільце влучної стрільби
items.rings.ringofsharpshooting.stats=При носінні це кільце збільшить шкоду вашої метальної зброї, ніби її рівень було підвищено на _%1$d_, та збільшить її міцність на _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=При носінні це кільце зазвичай збільшує шкоду вашої метальної зброї, ніби її рівень підвищено на _%1$d_, та збільшує її міцність на _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Підвищення шкоди рівня
items.rings.ringofsharpshooting.upgrade_stat_name_2=Підвищення міцності
items.rings.ringoftenacity.combined_stats=Ваші екіпіровані кільця об'єднують свою силу, зменшуючи загалом шкоду, яку ви отримуєте, до _%s%%_.
items.rings.ringoftenacity.desc=Якщо носити цей перстень, він дозволить своєму власнику протистояти звичайним смертельним ударам. Чим більше поранений користувач, тим стійкішим він буде до пошкоджень. Проклятий перстень, навпаки, полегшить ворогам страту власника.
items.rings.ringoftenacity.name=кільце наполегливості
items.rings.ringoftenacity.stats=При носінні це кільце зменшить отриману вами шкоду до _%s%%._
items.rings.ringoftenacity.typical_stats=При носінні це кільце зазвичай зменшує отриману вами шкоду до _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Максимальний опір пошкодженням
items.rings.ringofwealth.combined_stats=Ваші екіпіровані кільця поєднують свою силу, збільшуючи вашу удачу загалом на _%s%%_.
items.rings.ringofwealth.desc=Це кільце діє як магніт для скарбів, збільшуючи ймовірність того, що вороги та контейнери міститимуть цінні предмети. Прокляте кільце навпаки зменшить ваш шанс отримати здобич.
items.rings.ringofwealth.name=кільце багатства
items.rings.ringofwealth.stats=Якщо носити цю каблучку, вона збільшить вашу удачу на _%s%%._
items.rings.ringofwealth.typical_stats=При носінні ця каблучка зазвичай збільшує вашу удачу на _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Посилення удачі
items.scrolls.exotic.exoticscroll.berkanan=екзотичний сувій БЕРКАНАН
items.scrolls.exotic.exoticscroll.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.scrolls.exotic.exoticscroll.gyfu=екзотичний сувій GYFU
items.scrolls.exotic.exoticscroll.isaz=екзотичний сувій ІСАА
items.scrolls.exotic.exoticscroll.kaunan=екзотичний сувій КАУНАН
items.scrolls.exotic.exoticscroll.laguz=екзотичний сувій ЛАГУЗ
items.scrolls.exotic.exoticscroll.mannaz=екзотичний сувій МАННАЗ
items.scrolls.exotic.exoticscroll.naudiz=екзотичний сувій NAUDIZ
items.scrolls.exotic.exoticscroll.odal=екзотичний сувій ODAL
items.scrolls.exotic.exoticscroll.raido=екзотичний сувій RAIDO
items.scrolls.exotic.exoticscroll.sowilo=екзотичний сувій СОВІЛО
items.scrolls.exotic.exoticscroll.tiwaz=екзотичний сувій TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=На цьому чорному пергаменті написана сяюча нерозбірлива магічна руна. Вона ніби чужа цій землі, хто знає, що вона зробить, якщо її прочитати вголос?
items.scrolls.exotic.exoticscroll.yngvi=екзотичний сувій YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Заклинання на цьому сувої оточить вас магічною аурою, яка тимчасово блокує всі магічні ефекти, шкідливі чи корисні. Це включає більшість ефектів магічних предметів, таких як палички, сувої, кільця, артефакти, чари та прокляття. Однак здібності героїчної броні достатньо сильні, щоб працювати незалежно від цього.
items.scrolls.exotic.scrollofantimagic.name=сувій проти магії
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Навколо вас з'явилася магічна арена, позначена клубами червоного туману.\n\nПоки ви стоїте в тумані, ваш голод не збільшуватиметься, і ви отримуватимете на 33%% менше шкоди з усіх джерел. Якщо у вас є інші джерела зменшення шкоди (наприклад, броня), вони застосовуватимуться після зменшення на 33%%.\n\nХодів залишилося: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арена викликів
items.scrolls.exotic.scrollofchallenge.desc=При читанні вголос цей сувій видасть потужний рев, який приваблюватиме ворогів до користувача, одночасно створюючи навколо них невелику арену.\n\nДоки читач перебуває на цій арені, він отримуватиме на 33% менше шкоди з усіх джерел (це застосовується до інших форм зменшення шкоди), і він не втрачатиме відчуття ситості.\n\nРозмір арени буде масштабуватися залежно від розміру області, в якій знаходиться читач. Вона буде особливо малою в деяких областях з босами.
items.scrolls.exotic.scrollofchallenge.name=сувій виклику
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш сувій ворожіння визначив такі предмети:
items.scrolls.exotic.scrollofdivination.desc=Цей сувій випадковим чином визначить чотири типи предметів, які ви наразі не знаєте. Визначені типи можуть бути кольором зілля, руною сувою або самоцвітом кільця. Визначені предмети не обов'язково будуть тими, які ви носите з собою.
items.scrolls.exotic.scrollofdivination.name=сувій ворожіння
items.scrolls.exotic.scrollofdivination.nothing_left=Немає чого ідентифікувати!
items.scrolls.exotic.scrollofdread.desc=Після прочитання цей сувій випромінюватиме спалах червоного світла, який вселятиме неймовірний жах у всіх ворогів у вашому полі зору. Цей ефект настільки сильний, що вони швидко намагатимуться втекти з усього підземелля, щоб більше ніколи їх не побачити! \n\nЯк і жах, цей ефект може зникнути з часом або якщо на ворога напали. \n\nВольові вороги, такі як боси, будуть зазнавати звичайного жаху.
items.scrolls.exotic.scrollofdread.name=сувій жаху
items.scrolls.exotic.scrollofenchantment.armor=Виберіть гліф, який потрібно застосувати до вашої броні.
items.scrolls.exotic.scrollofenchantment.cancel=скасувати
items.scrolls.exotic.scrollofenchantment.cancel_warn=Скасування все одно знищить твій сувій чарів, ти впевнений?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ні, я передумав/передумала.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Так, я впевнений/впевнена
items.scrolls.exotic.scrollofenchantment.desc=Цей сувій наповнить зброю або обладунки потужною магічною енергією. Читач навіть має певний ступінь контролю над тим, яку магію він наповнює.
items.scrolls.exotic.scrollofenchantment.inv_title=Зачарувати предмет
items.scrolls.exotic.scrollofenchantment.name=сувій чарів
items.scrolls.exotic.scrollofenchantment.weapon=Виберіть чари, які потрібно застосувати до вашої зброї.
items.scrolls.exotic.scrollofforesight.desc=Після прочитання цього сувою деталі навколишньої місцевості постійно постачатимуться до свідомості читача з кришталевою чіткістю. Цей ефект триває протягом значного часу та виявить усі приховані двері чи пастки, що зробить пошуки непотрібними.
items.scrolls.exotic.scrollofforesight.name=сувій передбачення
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Скасування все одно збереже ваш сувій метаморфози, ви впевнені?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Оберіть талант для метаморфози.
items.scrolls.exotic.scrollofmetamorphosis.desc=Цей сувій містить потужну магію трансмутації, яка застосовуватиметься до заклинателя, а не до предмета. Магія цього сувою дозволить вам вибрати один талант і замінити його одним із п'яти талантів того ж рівня з різних класів героїв!\n\nЦей ефект може застосовуватися лише до талантів класу, а не до талантів, отриманих з підкласів або здібностей броні. Таланти, які ви не можете використовувати, не будуть надані як опції.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=талант метаморфози
items.scrolls.exotic.scrollofmetamorphosis.name=сувій метаморфози
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Оберіть новий талант, щоб замінити ним свій метаморфозований талант.
items.scrolls.exotic.scrollofmysticalenergy.desc=Сира магічна сила, замкнена в цьому пергаменті, після вивільнення з часом заряджатиме артефакти користувача, що знаходяться в його екіпіровці.
items.scrolls.exotic.scrollofmysticalenergy.name=сувій містичної енергії
items.scrolls.exotic.scrollofpassage.desc=Заклинання на цьому пергаменті миттєво переносить читача до найближчого регіону першим поверхом над ним. Дуже зручно для швидкого діставання до магазину.
items.scrolls.exotic.scrollofpassage.name=сувій уривку
items.scrolls.exotic.scrollofprismaticimage.desc=Заклинання на цьому сувої створить барвистого ілюзорного двійника читача. Це призматичне зображення діє як слабший клон читача, з подібним захистом, але меншим рівнем здоров'я та пошкодженням.\n\nПризматичне зображення з'являтиметься, коли присутні вороги, і намагатиметься захистити читача.\n\nЯкщо призматичне зображення вже існує, використання цього сувою повністю його вилікує.
items.scrolls.exotic.scrollofprismaticimage.name=сувій призматичного зображення
items.scrolls.exotic.scrollofpsionicblast.desc=Цей сувій містить неймовірну руйнівну енергію, яку можна спрямувати на знищення розумів усіх видимих істот.\n\nОднак існує значний зворотний зв'язок, і читач також буде пошкоджений, засліплений та ослаблений. Чим більше цілей вражає сувій, тим менше шкоди він отримає собі.
items.scrolls.exotic.scrollofpsionicblast.name=сувій псионічного вибуху
items.scrolls.exotic.scrollofpsionicblast.ondeath=Псионічний вибух розриває твій розум на шматки...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Цю істоту зачарувала магія сувою з піснею сирени. \n\nЗачарований персонаж назавжди стане вашим союзником і буде боротися з будь-якими ворогами, з якими зіткнеться.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=захоплений
items.scrolls.exotic.scrollofsirenssong.cancel=Ви повинні вибрати ціль.
items.scrolls.exotic.scrollofsirenssong.desc=Читання цього сувою видає привабливу мелодію, яка зачарує цільового ворога, назавжди перетворивши його на союзника! Інші вороги, які її почують, будуть тимчасово зачаровані.\n\nОсобливо сильні вороги можуть протистояти ефекту зачарування і натомість будуть зачаровані.
items.scrolls.exotic.scrollofsirenssong.name=сувій пісні сирени
items.scrolls.exotic.scrollofsirenssong.no_target=Сувій активується без цілі.
items.scrolls.exotic.scrollofsirenssong.prompt=Виберіть ціль
items.scrolls.inventoryscroll.no=Ні, я передумав/передумала.
items.scrolls.inventoryscroll.warning=Ви справді хочете скасувати використання цього сувою? Сувій раніше не був ідентифікований, тому його буде використано в будь-якому разі.
items.scrolls.inventoryscroll.yes=Так, я впевнений
items.scrolls.scroll$placeholder.name=прокручування
items.scrolls.scroll.ac_read=ЧИТАТИ
items.scrolls.scroll.berkanan=сувій БЕРКАНАНА
items.scrolls.scroll.blinded=Не можна прочитати сувій, будучи сліпим.
items.scrolls.scroll.cursed=Твоя проклята книга заклинань не дозволяє тобі викликати магію цього сувою! Однак сувій зняття прокляття може бути достатньо сильним, щоб все ще спрацювати...
items.scrolls.scroll.gyfu=сувій GYFU
items.scrolls.scroll.isaz=сувій ІСААЗ
items.scrolls.scroll.kaunan=сувій КАУНАН
items.scrolls.scroll.laguz=сувій ЛАГУЗ
items.scrolls.scroll.mannaz=сувій МАННАЗ
items.scrolls.scroll.naudiz=сувій НАУДІЗ
items.scrolls.scroll.no_magic=Ви не можете прочитати сувій, маючи імунітет до магії.
items.scrolls.scroll.odal=сувій ODAL
items.scrolls.scroll.raido=сувій RAIDO
items.scrolls.scroll.sowilo=сувій СОВІЛО
items.scrolls.scroll.tiwaz=сувій TIWAZ
items.scrolls.scroll.unknown_desc=Цей пергамент укритий нерозбірливими письменами, а замість назви стоїть руна %s. Хто знає, що станеться, якщо прочитати його вголос?
items.scrolls.scroll.yngvi=сувій YNGVI
items.scrolls.scrollofidentify.desc=Назавжди розкриває всі секрети одного предмета.
items.scrolls.scrollofidentify.inv_title=Визначити предмет
items.scrolls.scrollofidentify.it_is=Ваш товар ідентифіковано: %s.
items.scrolls.scrollofidentify.name=сувій розпізнавання
items.scrolls.scrolloflullaby.desc=Заспокійлива мелодія занурить усіх істот у ваше поле зору у глибокий сон, даючи вам шанс втекти або здійснити несподівану атаку на них.
items.scrolls.scrolloflullaby.name=сувій колискової
items.scrolls.scrolloflullaby.sooth=Сувій видає заспокійливу мелодію. Ви відчуваєте сильну сонливість.
items.scrolls.scrollofmagicmapping.desc=Коли ви прочитаєте цей сувій, у вашій пам'яті закарбується образ кришталевої ясності, який нагадає вам про точне розташування рівня та розкриє всі приховані таємниці. Розташування предметів та істот залишиться невідомим.
items.scrolls.scrollofmagicmapping.layout=Тепер ви знаєте схему рівнів.
items.scrolls.scrollofmagicmapping.name=сувій магічного картографування
items.scrolls.scrollofmirrorimage.copies=Сувій утворює твої дзеркальні відображення.
items.scrolls.scrollofmirrorimage.desc=Заклинання на цьому сувої створить ілюзорних двійників читача, які переслідуватимуть його ворогів.
items.scrolls.scrollofmirrorimage.name=сувій дзеркального відображення
items.scrolls.scrollofmirrorimage.no_copies=Сувій намагається створити твої дзеркальні відображення, але їм нікуди подітися.
items.scrolls.scrollofrage.desc=При читанні вголос цей сувій видаватиме гучний рев, який притягуватиме всіх ворогів до читача та розлючуватиме тих, хто знаходиться поруч.
items.scrolls.scrollofrage.name=сувій люті
items.scrolls.scrollofrage.roar=Сувій видає шалений рев, який луною розноситься по всьому підземеллю!
items.scrolls.scrollofrecharging.desc=Сира магічна сила, замкнена в цьому пергаменті, після вивільнення повністю зарядить усі чарівні палички читача.
items.scrolls.scrollofrecharging.name=сувій для підзарядки
items.scrolls.scrollofrecharging.surge=Хвиля енергії пронизує ваше тіло, бадьорячи ваші чарівні палички!
items.scrolls.scrollofremovecurse.cleansed=Ваш предмет світиться очисним світлом, і зловісна енергія розсіюється!
items.scrolls.scrollofremovecurse.desc=Заклинання на цьому сувої миттєво зніме зі зброї, обладунків, перснів та предметів, що носяться читачем, будь-які злі чари, які можуть перешкодити власнику зняти їх.
items.scrolls.scrollofremovecurse.inv_title=Очистити предмет
items.scrolls.scrollofremovecurse.name=сувій для зняття прокляття
items.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет світиться очисним світлом, але нічого не відбувається.
items.scrolls.scrollofremovecurse.spirit=Твій сувій звільняє змучений дух!
items.scrolls.scrollofretribution.blast=Потужна магічна енергія вивергається з сувою!
items.scrolls.scrollofretribution.desc=Цей сувій містить руйнівну енергію, яка перетворює страждання читача на вибух сили. Чим слабший читач, тим більше шкоди він завдає. При дуже низькому рівні здоров'я цей сувій може миттєво вбити більшість ворогів.\n\nОднак використання сувою негативно впливає на користувача, засліплюючи та послаблюючи його.
items.scrolls.scrollofretribution.name=сувій відплати
items.scrolls.scrollofteleportation.cant_reach=Туди телепортуватися не можна.
items.scrolls.scrollofteleportation.desc=Заклинання на цьому пергаменті миттєво переносить читача у випадкове місце на рівні підземелля. Його можна використати, щоб уникнути небезпечної ситуації, але невдалий читач може опинитися в ще небезпечнішому місці.
items.scrolls.scrollofteleportation.name=сувій телепортації
items.scrolls.scrollofteleportation.no_tele=Магія телепортації не спрацьовує.
items.scrolls.scrollofteleportation.prompt=Виберіть місце для телепортації
items.scrolls.scrollofteleportation.tele=В одну мить вас телепортували в інше місце на рівні.
items.scrolls.scrollofterror.desc=Спалах червоного світла вселить жах у всіх істот у вашому полі зору, вони розвернуться та втечуть. Атака на ворога, що тікає, розвіє цей ефект.
items.scrolls.scrollofterror.many=Сувій випромінює яскравий спалах червоного світла, і монстри тікають!
items.scrolls.scrollofterror.name=сувій жаху
items.scrolls.scrollofterror.none=Сувій випромінює яскравий спалах червоного світла.
items.scrolls.scrollofterror.one=Сувій випромінює яскравий спалах червоного світла, і %s тікає!
items.scrolls.scrolloftransmutation.desc=Цей сувій містить потужну магію трансмутації. При використанні на відповідному предметі він перетворить його на інший предмет того ж типу. Магія навіть збереже покращення, чари та гліфи. Сувої та зілля будуть трансмутовані на їхні екзотичні еквіваленти, і навпаки.
items.scrolls.scrolloftransmutation.inv_title=Трансмутувати предмет
items.scrolls.scrolloftransmutation.morph=Ваш предмет перетворюється на щось інше!
items.scrolls.scrolloftransmutation.name=сувій трансмутації
items.scrolls.scrolloftransmutation.nothing=Нічого цікавого не відбувається.
items.scrolls.scrollofupgrade.desc=Цей сувій покращить окремий предмет, покращивши його якість. Чарівна паличка збільшиться в потужності та кількості зарядів; зброя завдаватиме більше шкоди або частіше знаходитиме свою ціль; обладунки відбиватимуть додаткові удари; вплив кільця на його власника посилиться. Зброя та обладунки також вимагатимуть менше сили для використання, а будь-які прокляття з предмета будуть зняті.
items.scrolls.scrollofupgrade.inv_title=Покращення предмета
items.scrolls.scrollofupgrade.name=сувій поліпшення
items.scrolls.scrollofupgrade.remove_curse=Сувій покращення знімає прокляття з вашого предмета!
items.scrolls.scrollofupgrade.weaken_curse=Сувій покращення послаблює прокляття на вашому предметі.
items.spells.alchemize$wndalchemizeitem.energize=Перетворитися на енергію %d
items.spells.alchemize$wndalchemizeitem.energize_1=Перетворіть 1 на енергію %d
items.spells.alchemize$wndalchemizeitem.energize_all=Перетворіть все на енергію %d
items.spells.alchemize$wndalchemizeitem.sell=Перетворися на %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Перетворіть 1 на %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Перетворити все на %dg
items.spells.alchemize.desc=Це заклинання містить трансмутативні сили, подібні до тих, що знаходяться в алхімічному горщику. Кожне заклинання дозволяє користувачеві перетворити предмет (або стопку предметів) на золото або алхімічну енергію. Перетворення зілля або сувоїв на енергію навіть дозволить їх ідентифікувати!\n\nA Кілька застосувань Алхімізації продаються в магазинах, але набагато більше можна зробити за допомогою алхімії, поєднавши насіння, рунічний камінь і трохи алхімічної енергії.
items.spells.alchemize.name=алхімізувати
items.spells.alchemize.prompt=Алхімізація предмета
items.spells.beaconofreturning.creatures=Психічна аура сусідніх істот не дозволяє вам телепортуватися в цей момент.
items.spells.beaconofreturning.desc=Це складне заклинання надає користувачеві можливість повертатися у встановлене місце, незалежно від відстані. Заклинання буде використано лише після повернення, його можна накладати скільки завгодно разів, але воно запам'ятає лише останнє місце, де воно було накладено.
items.spells.beaconofreturning.desc_set=Цей маяк був встановлений десь на поверсі %d.
items.spells.beaconofreturning.name=маяк повернення
items.spells.beaconofreturning.preventing=Сильна магічна аура цього місця заважає тобі використати заклинання!
items.spells.beaconofreturning.set=Маяк встановлено у вашому поточному місці розташування.
items.spells.beaconofreturning.wnd_body=Налаштування замінить місце, де маяк був попередньо встановлений. \n\nПовернення призведе до повернення до останнього встановленого місця та витратить одне використання заклинання.
items.spells.beaconofreturning.wnd_return=ПОВЕРНЕННЯ
items.spells.beaconofreturning.wnd_set=НАБІР
items.spells.curseinfusion.desc=Це заклинання наповнює спорядження тією ж потужною злоякісною магією, що й DM-300. Предмет, на якому його використовують, буде негайно проклятий, а будь-які чари чи гліфи, які він міг мати, будуть перезаписані.\n\nЩо стосується зброї, броні та паличок, предмет отримає покращення окрім прокляття. Покращення від прокляття не сумуються, і покращення втрачаються, якщо предмет стає проклятим.\n\nКілька проклятих вливань також можна використовувати для зміни прокляття на зброї чи броні.
items.spells.curseinfusion.inv_title=Проклясти предмет
items.spells.curseinfusion.name=настій прокляття
items.spells.magicalinfusion.desc=Це заклинання має таку ж магічну силу, як і сувій покращення, але в стабільнішій формі. \n\nОкрім звичайного покращення предмета, воно ніколи не стерє чари, гліфи чи прокляття.
items.spells.magicalinfusion.infuse=Ваш предмет наповнений таємничою енергією!
items.spells.magicalinfusion.inv_title=Настоювати предмет
items.spells.magicalinfusion.name=чарівний настій
items.spells.magicalporter.desc=Це заклинання магічно перенесе будь-який предмет, на який його накладено. Однак, на відміну від торговельного маяка, предмети будуть перенесені до входу на наступний поверх боса.
items.spells.magicalporter.inv_title=Перенести елемент
items.spells.magicalporter.name=чарівний портьє
items.spells.magicalporter.nowhere=Немає куди переносити предмет.
items.spells.phaseshift.desc=Це хаотичне заклинання телепортує будь-якого персонажа, на якого воно спрямоване, у випадкове місце на поточному поверсі та оглушить його на значний час. Потужні вороги зможуть протистояти ефекту оглушення. Це заклинання може бути спрямоване на ціль або на самого користувача.
items.spells.phaseshift.name=фазовий зсув
items.spells.phaseshift.no_target=Там нема чого телепортуватися.
items.spells.reclaimtrap.desc=Це заклинання містить залишки механічної енергії DM-300. Під час застосування до активної пастки сила пастки приєднується до вас, що дозволяє вам використовувати заклинання знову, щоб вигнати цю силу та запустити ефект пастки в будь-якому місці, яке вам подобається.\n\nОднак деякі пастки можуть працювати не в усіх місцях, і одночасно можна зберігати лише одну пастку.
items.spells.reclaimtrap.desc_trap=Заклинання зараз готове до запуску _%s._.
items.spells.reclaimtrap.name=повернути пастку
items.spells.reclaimtrap.no_trap=Там немає жодної пастки.
items.spells.recycle.desc=Це заклинання містить меншу форму магії трансмутації. Хоча воно не працює на спорядженні, воно перетворить сувій, зілля, насіння, рунічний камінь або дротик з наконечником на випадковий предмет того ж типу.
items.spells.recycle.inv_title=Переробка предмета
items.spells.recycle.name=переробляти
items.spells.recycle.recycled=Ваш товар було перероблено в: %s.
items.spells.spell.ac_cast=КАСТ
items.spells.spell.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.spells.spell.no_magic=Ви не можете застосовувати заклинання, маючи імунітет до магії.
items.spells.summonelemental.ac_imbue=ПРОСТОЧИТИ
items.spells.summonelemental.desc=Це заклинання спрямовує енергію елементального вугілля, що використовується для його створення, і дозволить вам викликати дружнього елементаля, щоб битися з вами! Одночасно можна викликати лише одного елементаля, але заклинання можна повторити, щоб повернути вам елементаля безкоштовно.
items.spells.summonelemental.desc_chaos=Заклинання зараз випромінює хаотичну енергію, воно викличе _елементаля хаосу_. Ви можете наповнити його іншим предметом, але заклинання втратить свою поточну силу.
items.spells.summonelemental.desc_fire=Заклинання зараз гаряче на дотик, воно викличе _вогняного елементаля_. Ви можете наповнити його іншим предметом, але заклинання втратить свою поточну силу.
items.spells.summonelemental.desc_frost=Заклинання зараз холодне на дотик, воно викличе _елементаля льоду_. Ви можете наповнити його іншим предметом, але заклинання втратить свою поточну силу.
items.spells.summonelemental.desc_newborn=Заклинання наразі не має ефекту проникнення, і воно викличе _новонародженого елементаля_ без дальньої атаки. Ви можете посилити заклинання певним зіллям рідкого полум'я, зіллям морозу, сувоєм перезарядки або сувоєм трансмутації, щоб зробити його потужнішим, що призведе до майбутніх викликів елементалів з повною силою!
items.spells.summonelemental.desc_shock=Заклинання зараз випромінює статичну енергію, воно викличе _елементаля шоку_. Ви можете наповнити заклинання іншим предметом, але воно втратить свою поточну силу.
items.spells.summonelemental.imbue_prompt=Наповнити предмет
items.spells.summonelemental.name=викликати елементарій
items.spells.targetedspell.inv_title=Настоювати предмет
items.spells.targetedspell.prompt=Виберіть ціль
items.spells.telekineticgrab.cant_grab=Ти цього не можеш схопити.
items.spells.telekineticgrab.desc=Це заклинання дозволяє заклинателю дистанційно захопити всі предмети в певному місці або всю кинуту зброю, прикріплену до ворога!\n\nЙого не можна використовувати для захоплення предметів, що належать комусь іншому, або для захоплення контейнерів, таких як скрині.
items.spells.telekineticgrab.name=телекінетичне захоплення
items.spells.telekineticgrab.no_target=Там нема за що хапатися.
items.spells.unstablespell.desc=Цей маленький чорний квадратний кристал має рухливі рунічні символи на кожній своїй поверхні.\n\nПісля активації він запускає ефект випадкового сувою. Ефект сувою завжди буде зосереджений на бою, якщо у вашому полі зору є вороги, і завжди буде зосереджений на небою в іншому випадку.
items.spells.unstablespell.name=нестабільне заклинання
items.spells.wildenergy.desc=Це заклинання містить частину проклятої енергії, яка живила DM-300. Після застосування воно перезаряджає ваші чарівні палички та зношені артефакти, а також запускає випадковий ефект проклятої палички. Однак ви можете вибрати напрямок, в якому ця проклята магія стрілятиме.
items.spells.wildenergy.name=дика енергія
items.stones.inventorystone.ac_use=ВИКОРИСТАННЯ
items.stones.runestone$placeholder.name=рунічний камінь
items.stones.runestone.discover_hint=Ви можете знайти цей предмет випадковим чином у підземеллі або створити його за допомогою алхімії.
items.stones.stoneofaggression$aggression.desc=Маніпулятивна магія змушує всіх ворогів поблизу атакувати цього персонажа. \n\nХодів залишилося: %s.
items.stones.stoneofaggression$aggression.name=цільовий
items.stones.stoneofaggression.desc=Коли цей камінь кидають у союзника або ворога, усі вороги поблизу нададуть перевагу атакі цього персонажа протягом короткого часу. Однак \n\nВорожі-боси можуть чинити опір ефекту, значно зменшуючи тривалість і отримуючи менше шкоди від атак своїх міньйонів.
items.stones.stoneofaggression.name=камінь агресії
items.stones.stoneofaugmentation$wndaugment.cancel=Неважливо
items.stones.stoneofaugmentation$wndaugment.choice=Що б ви хотіли покращити?
items.stones.stoneofaugmentation$wndaugment.damage=Пошкодження
items.stones.stoneofaugmentation$wndaugment.defense=Захист
items.stones.stoneofaugmentation$wndaugment.evasion=Ухилення
items.stones.stoneofaugmentation$wndaugment.none=Видалити доповнення
items.stones.stoneofaugmentation$wndaugment.speed=Швидкість
items.stones.stoneofaugmentation.desc=Цей рунічний камінь володіє потужною магією, яка може посилити спорядження, покращуючи одну властивість ціною іншої.\n\nВикористання на зброї дозволить вам збільшити швидкість або шкоду. Метальна зброя також зростатиме або втрачатиме міцність пропорційно до своєї швидкості.\n\nВикористання на броні дозволить вам покращити захист або ухилення.
items.stones.stoneofaugmentation.discover_hint=Ви можете придбати цей предмет у магазині або створити його за допомогою алхімії.
items.stones.stoneofaugmentation.inv_title=Покращення предмета
items.stones.stoneofaugmentation.name=камінь збільшення
items.stones.stoneofblast.desc=Цей рунічний камінь миттєво вибухне в тому місці, куди його кинуть. Як і бомба, вибух завдасть шкоди всьому, що знаходиться поблизу.
items.stones.stoneofblast.name=камінь вибуху
items.stones.stoneofblink.desc=Цей рунічний камінь телепортує користувача туди, куди його кинули.
items.stones.stoneofblink.name=камінь моргання
items.stones.stoneofclairvoyance.desc=Цей камінь миттєво розкриє всі плитки у дуже широкій зоні навколо, куди його кинуть. Його ефект проходитиме навіть крізь стіни.
items.stones.stoneofclairvoyance.name=камінь ясновидіння
items.stones.stoneofdeepsleep.desc=Коли цей камінь кидають у ворога, він занурює його у глибокий магічний сон. Вороги, що сплять у магічному сні, спатимуть вічно, поки їх не потурбують.
items.stones.stoneofdeepsleep.name=камінь глибокого сну
items.stones.stoneofdetectmagic.desc=Цей рунічний камінь здатний виявляти магію, що впливає на предмет. Використання цього каменю на невпізнаному предметі покаже, чи на нього накладено злісне прокляття, а чи позитивну магію, таку як чари або покращення.
items.stones.stoneofdetectmagic.detected_bad=Ви виявили зловісну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.detected_both=Ви виявляєте як позитивну, так і зловмисну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.detected_good=Ви виявили позитивну магію, що впливає на цей предмет!
items.stones.stoneofdetectmagic.detected_none=Ви не помічаєте жодної магії, що впливає на цей предмет.
items.stones.stoneofdetectmagic.inv_title=Виявлення елемента
items.stones.stoneofdetectmagic.name=камінь виявлення магії
items.stones.stoneofdisarming.desc=Цей рунічний камінь містить магію, яка може знешкодити шкідливі пастки, заховані по всьому підземеллю. Він знешкодить до 9 пасток навколо області, куди його кинуть.
items.stones.stoneofdisarming.name=камінь роззброєння
items.stones.stoneofenchantment.armor=Твої обладунки світяться у темряві!
items.stones.stoneofenchantment.desc=Цей рунічний камінь володіє чарівною магією. На відміну від сувою покращення, він не збільшує пряму силу предмета, а натомість наповнює зброю або броню чарами, надаючи їм нову силу.
items.stones.stoneofenchantment.inv_title=Зачарувати предмет
items.stones.stoneofenchantment.name=камінь чарів
items.stones.stoneofenchantment.weapon=Твоя зброя світиться в темряві!
items.stones.stoneoffear.desc=Коли цей камінь кинуть у персонажа, його охопить жах, він розвернеться та втече. Атака на персонажа, що тікає, скоротить час дії ефекту.
items.stones.stoneoffear.name=камінь страху
items.stones.stoneofflock.desc=Цей рунічний камінь на короткий час викликає магічних овець навколо місця, куди його кинули.
items.stones.stoneofflock.name=камінь з отари
items.stones.stoneofintuition$wndguess.break=Твій камінь інтуїції розсиплеться на порох...
items.stones.stoneofintuition$wndguess.correct=Правильно. Тип предмета визначено!
items.stones.stoneofintuition$wndguess.incorrect=Ваша здогадка була неправильною.
items.stones.stoneofintuition$wndguess.text=Вгадайте, який тип невпізнаного предмета. Якщо ви вгадаєте правильно, тип буде визначено!
items.stones.stoneofintuition.break_info=Ви можете використовувати камені інтуїції двічі, перш ніж один з них зламається, _ваше наступне використання не споживатиме камінь_.
items.stones.stoneofintuition.break_warn=Ви вже використовували камінь інтуїції раніше, тому _ваше наступне використання споживатиме камінь_.
items.stones.stoneofintuition.desc=Цей рунічний камінь містить слабшу версію магії, яку можна знайти в сувоях ідентифікації. Замість того, щоб безпосередньо ідентифікувати предмет, він працюватиме на вашу інтуїцію, дозволяючи вам спробувати визначити тип зілля, сувою чи кільця шляхом вгадування.
items.stones.stoneofintuition.inv_title=Виберіть елемент
items.stones.stoneofintuition.name=камінь інтуїції
items.stones.stoneofshock.desc=Цей рунічний камінь вивільняє вибух електричної енергії, який ненадовго приголомшує всі цілі поблизу та заряджає паличку метальника за кожне вражене в ціль.
items.stones.stoneofshock.name=камінь шоку
items.stylus.ac_inscribe=ЗАРЕЄСТРУВАТИ
items.stylus.cursed=Магія стилуса не працюватиме на проклятій броні.
items.stylus.desc=Цей чарівний стилус виготовлений з якогось темного, дуже твердого каменю. З його допомогою ви можете викарбувати магічний гліф на своїх обладунках, але ви не маєте влади вибирати, який це буде гліф, стилус вирішить це за вас.
items.stylus.identify=Спочатку ви повинні визначити, чи проклята ця броня.
items.stylus.inscribed=Ти накреслив на своїх обладунках стилусом.
items.stylus.name=таємничий стилус
items.stylus.prompt=Виберіть броню
items.tengusmask.ac_wear=ОДЯГ
items.tengusmask.desc=Ця маска впала з обличчя Тенгу, коли він помирав, ви можете відчути величезну магічну силу, що виходить з неї. Чи була маска джерелом сили Тенгу?\n\nПісля носіння величезна сила маски передається вам, що дозволяє вам _вибрати підклас для вашого героя._\n\nЯкий підклас ви оберете?
items.tengusmask.discover_hint=Ви можете отримати цей предмет як дроп з певних ворогів.
items.tengusmask.name=Маска Тенгу
items.tengusmask.used=Маска розпадається, коли її сила вливається в тебе!
items.torch.ac_light=СВІТЛО
items.torch.desc=Коли підземелля темніє, факел може допомогти вказати шлях, що є обов'язковим елементом для шукачів пригод.
items.torch.name=факел
items.trinkets.chaoticcenser.desc=Після деякого часу в алхімічному горщику ця кадильниця для пахощів, здається, починає самостійно виділяти дим! Ці гази накопичуються та викидаються з кадильниці на ворогів через напіввипадкові проміжки часу. Здається, вона здатна виробляти всілякі гази, але ви отримаєте попередження безпосередньо перед тим, як кадильниця активується.
items.trinkets.chaoticcenser.name=хаотичне кадило
items.trinkets.chaoticcenser.spew=Твоя кадильниця ось-ось вивергне: %s.
items.trinkets.chaoticcenser.stats_desc=На поточному рівні ця дрібничка генеруватиме шкідливий газ поблизу ворога приблизно кожні _%d_ ходи. Гази з'являтимуться лише за наявності ворогів. На вищих рівнях ці гази, швидше за все, будуть екзотичними та потужними.
items.trinkets.chaoticcenser.typical_stats_desc=Зазвичай ця дрібничка генеруватиме шкідливий газ поблизу ворога приблизно кожні _%d_ ходи. Гази з'являтимуться лише за наявності ворогів. На вищих рівнях ці гази, ймовірніше, будуть екзотичними та потужними.
items.trinkets.crackedspyglass.desc=Цей ручний телескоп був би демонстрацією чудової та точної роботи, якби не тріщина вздовж його передньої лінзи. Підзорна труба, здається, допомагає вам, показуючи нові предмети в підземеллі, але через її недолік ці предмети досить важко побачити!
items.trinkets.crackedspyglass.name=тріснута підзорна труба
items.trinkets.crackedspyglass.stats_desc=На поточному рівні ця дрібничка має шанс _%1$s%%_ створити додатковий прихований предмет на кожному поверсі, де немає боса.
items.trinkets.crackedspyglass.stats_desc_upgraded=На поточному рівні цей дрібничка має шанс _100%%_ створити додатковий прихований предмет на кожному поверсі, де немає боса, та шанс _%1$s%%_ створити другий додатковий прихований предмет.
items.trinkets.crackedspyglass.typical_stats_desc=Зазвичай ця дрібничка має шанс _%1$s%%_ створити додатковий прихований предмет на кожному поверсі, де немає боса.
items.trinkets.dimensionalsundial.desc=Цей маленький портативний сонячний годинник якимось чином здатний відкидати тінь у глибинах підземелля, навіть якщо ви не тримаєте його вертикально. Ще дивніше те, що положення тіні, здається, не має жодного стосунку до сонця в цьому світі. Коли тіні немає, сонячний годинник ніби приваблює небезпеку.
items.trinkets.dimensionalsundial.name=об'ємний сонячний годинник
items.trinkets.dimensionalsundial.stats_desc=На поточному рівні цей дрібничка зменшить частоту появи ворогів на _%1$d%%_ вдень у реальному житті (з 8:00 до 20:00) та збільшить частоту появи ворогів на _%2$d%%_ вночі (з 20:00 до 8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=Зазвичай ця дрібничка зменшує частоту появи ворогів на _%1$d%%_ вдень у реальному житті (з 8:00 до 20:00), та збільшує частоту появи ворогів на _%2$d%%_ вночі (з 20:00 до 8:00).
items.trinkets.dimensionalsundial.warning=Ваш сонячний годинник не відкидає тіні, вам неспокійно.
items.trinkets.exoticcrystals.desc=Ці маленькі рожеві кристали мають таку ж форму, як кристали алхімічної енергії. Хоча їх не можна використовувати для отримання енергії безпосередньо, вони, здається, якимось чином впливають на зілля та сувої, які ви знаходите.
items.trinkets.exoticcrystals.name=екзотичні кристали
items.trinkets.exoticcrystals.stats_desc=На поточному рівні цей дрібничка замінить _%s%%_ зілля або сувоїв, що випадають, на їх екзотичні еквіваленти. Це не впливає на зілля сили, сувої покращення або предмети, що генеруються для допомоги у вирішенні небезпечних кімнат.
items.trinkets.exoticcrystals.typical_stats_desc=Зазвичай цей дрібничка замінює _%s%%_ зілля або сувоїв на їх екзотичні еквіваленти. Це не впливає на зілля сили, сувої покращення або предмети, що генеруються для допомоги у вирішенні небезпечних кімнат.
items.trinkets.eyeofnewt.desc=Це золотисто-чорне око тритона – поширений інгредієнт, який тепер перетворили на дрібничку. Здається, що око зменшує ваш зір, дозволяючи вам бачити речі по-іншому.
items.trinkets.eyeofnewt.name=око тритона
items.trinkets.eyeofnewt.stats_desc=На поточному рівні цей дрібничка зменшить дальність вашого зору на _%1$s%%_, але також надасть вам зір розуму на ворогів у межах клітинок _%2$d_.
items.trinkets.eyeofnewt.typical_stats_desc=Зазвичай ця дрібничка зменшить дальність вашого зору на _%1$s%%_, але також надасть вам зір розуму на ворогів у межах клітинок _%2$d_.
items.trinkets.ferrettuft.desc=Пучок шовковисто-білого хутра тхора, скріплений лаймово-зеленою стрічкою, зав'язаною бантом. Тхори відомі своєю спритністю, бешкетництвом та відсутністю чесності. Частина цієї сили, здається, випромінюється від цієї дрібнички, посилюючи ухилення від усього, що знаходиться поруч.
items.trinkets.ferrettuft.name=чубчик тхора
items.trinkets.ferrettuft.stats_desc=На поточному рівні ця дрібничка збільшить ухилення всіх персонажів на _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Зазвичай ця дрібничка збільшує ухилення всіх персонажів на _%1$s%%_.
items.trinkets.mimictooth.desc=Цей великий гострий зуб, мабуть, вирваний у дуже нещасного мімікрика. Здається, він впливає на мімікрики підземелля, роблячи їх частішими та небезпечнішими.
items.trinkets.mimictooth.name=імітувати зуб
items.trinkets.mimictooth.stats_desc=На поточному рівні ця дрібничка зробить усі види імітаторів _%1$sx_ більш поширеними та набагато складнішими для виявлення, але також збільшить кількість здобичі, яку вони випадають. На кожному поверсі підземелля також буде шанс _%2$s%%_ містити додаткового непомітного імітатора чорного дерева.
items.trinkets.mimictooth.typical_stats_desc=Зазвичай ця дрібничка робить усі види імітацій _%1$sx_ більш поширеними та набагато складнішими для виявлення, але також збільшує кількість здобичі, яку з них випадає. На кожному поверсі підземелля також буде шанс _%2$s%%_ містити додаткового непомітного імітатора чорного дерева.
items.trinkets.mossyclump.desc=Цей жмут мокрого моху ніби утримує вологу, як би сильно його не стискали. Він ніби магічно прив'язаний до самого підземелля, що робить появу трави та води більш імовірною.
items.trinkets.mossyclump.name=моховий грудка
items.trinkets.mossyclump.stats_desc=На поточному рівні ця дрібничка призведе до того, що _%d%%_ нетематичних поверхів заповниться водою або травою. \n\n Для покращення цієї дрібнички потрібно більше енергії.
items.trinkets.mossyclump.typical_stats_desc=Зазвичай ця дрібничка змушує _%d%%_ нетематичних поверхів заповнюватися водою або травою. \n\nПокращення цієї дрібнички вимагає більше енергії.
items.trinkets.parchmentscrap.desc=Цей маленький клаптик пергаменту виглядає так, ніби він узятий зі сувою. Він зберіг частину своєї магії, і, здається, вона впливає на зброю та обладунки, знайдені в підземеллі.
items.trinkets.parchmentscrap.name=клаптик пергаменту
items.trinkets.parchmentscrap.stats_desc=На поточному рівні цей дрібник зробить чари та гліфи _%dx_ такими ж поширеними, а прокляття на зброї та броні _%sx_ — такими ж поширеними. Прокляття на чарівних паличках, кільцях або артефактах залишаться в силі.\n\nПокращення цього дрібничка вимагає більшої кількості енергії.
items.trinkets.parchmentscrap.typical_stats_desc=Зазвичай цей дрібничка зробить чари та гліфи _%dx_ поширеними, а прокляття на зброї та броні _%sx_ — поширеними. Прокляття на чарівних паличках, кільцях або артефактах не зазнають змін. \n\n. Покращення цього дрібнички вимагає більшої кількості енергії.
items.trinkets.petrifiedseed.desc=Це насіння скам'яніло або внаслідок повільних геологічних процесів, або за допомогою магії. Здається, що насіння магічно впливає на флору підземелля, час від часу замінюючи насіння рослин рунічним камінням.
items.trinkets.petrifiedseed.name=скам'янілого насіння
items.trinkets.petrifiedseed.stats_desc=На поточному рівні ця дрібничка призведе до того, що з витоптаної трави замість насіння _%1$s%%_ того часу випадатимуть рунічні камені, а також з високої трави частіше випадатимуть предмети _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Зазвичай ця дрібничка змушує витоптану траву скидати рунічні камені замість насіння _%1$s%%_ того часу, а також частіше призводить до того, що з високої трави випадатимуть предмети _%2$s%%_.
items.trinkets.ratskull.desc=Ця моторошна дрібничка не набагато більша за череп звичайного пацюка, що якимось чином є рідкістю в цьому підземеллі. Магічний вплив черепа, здається, приваблює рідкісніших мешканців підземелля, змушуючи їх з'являтися набагато частіше.
items.trinkets.ratskull.name=череп щура
items.trinkets.ratskull.stats_desc=На поточному рівні ця дрібничка зробить рідкісних екзотичних ворогів _%dx_ найімовірнішими. Однак череп лише наполовину так само ефективний у привабленні кристалічних міміків та броньованих статуй.
items.trinkets.ratskull.typical_stats_desc=Зазвичай ця дрібничка зробить рідкісних екзотичних ворогів _%dx_ найімовірнішими. Однак череп лише наполовину так само ефективний у привабленні кришталевих міміків та броньованих статуй.
items.trinkets.saltcube.desc=Цей великий кристал солі був розрізаний майже ідеальною кубічною формою, і йому якимось чином вдалося злити половину води з алхімічного горщика замість того, щоб розчинитися. Здається, він магічним чином зневоднює та зберігає їжу, яку ви їсте, подовжуючи відчуття ситості, але також зменшуючи відновлення здоров'я, коли ви не голодуєте.
items.trinkets.saltcube.name=кубик солі
items.trinkets.saltcube.stats_desc=На поточному рівні ця дрібничка збільшить час до того, як ви зголоднієте, на _%1$s%%_, але також зменшить швидкість регенерації здоров'я на _%2$s%%_, якщо поверх не заблоковано.
items.trinkets.saltcube.typical_stats_desc=Зазвичай ця дрібничка збільшує час до того, як ви зголоднієте, на _%1$s%%_, але також зменшує швидкість регенерації здоров'я на _%2$s%%_, якщо поверх не заблоковано.
items.trinkets.shardofoblivion$thrownusetracker.desc=Ви нещодавно використали неідентифіковану меткову зброю, що вважається одним використаним неідентифікованим спорядженням за осколок забуття на деякий час. \n\nХодів залишилося: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Використана неідентифікована метальна зброя
items.trinkets.shardofoblivion$wandusetracker.desc=Ви нещодавно використали неідентифіковану паличку, що вважається одним використаним неідентифікованим спорядженням для отримання уламка забуття на деякий час. \n\nХодів залишилося: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Використана неідентифікована чарівна паличка
items.trinkets.shardofoblivion.ac_identify=ВИЗНАЧИТИ
items.trinkets.shardofoblivion.desc=Після варіння в алхімічному казані цей маленький уламок проклятого металу змінився і став зробленим з... нічого? Здається, світло огинає його, і він зависає на місці, коли ви його не тримаєте. Уламок ніби магічно черпає силу з вашого невігластва, тому, мабуть, краще не думати про нього надто багато.
items.trinkets.shardofoblivion.identify=Ви ідентифікуєте предмет!
items.trinkets.shardofoblivion.identify_not_yet=Цей предмет ще не готовий до ідентифікації.
items.trinkets.shardofoblivion.identify_prompt=Визначити предмет
items.trinkets.shardofoblivion.identify_ready=Предмет готовий до ідентифікації: %s. Використайте на ньому свій Уламок Забуття, щоб ідентифікувати його.
items.trinkets.shardofoblivion.identify_ready_worn=Ваші зношені речі тепер готові до ідентифікації. Використайте свій Уламок Забуття на предметах, щоб їх ідентифікувати.
items.trinkets.shardofoblivion.name=осколок забуття
items.trinkets.shardofoblivion.stats_desc=На поточному рівні цей дрібничка збільшить швидкість випадання здобичі ворогами на 20%% за кожен неідентифікований предмет спорядження, який ви екіпірували або нещодавно використовували, до максимум _%d предмета(ів)_. Осколок також не дозволить вам ідентифікувати спорядження, але його можна використовувати для ручної ідентифікації предметів, готових до нього.
items.trinkets.shardofoblivion.typical_stats_desc=Зазвичай цей дрібничка збільшує швидкість випадання здобичі ворогами на 20%% за кожен неідентифікований предмет спорядження, який ви екіпірували або нещодавно використовували, до максимум _%d предмета(ів)_. Осколок також не дозволить вам ідентифікувати спорядження, але його можна використовувати для ручної ідентифікації предметів, готових до нього.
items.trinkets.thirteenleafclover.desc=Якимось чином, варячись в алхімічному казані, ця конюшина виростила купу зайвого листя! Не зовсім зрозуміло, чи приносить ця дрібничка щастя, чи невдачу, можливо, вона зробить вашу удачу більш хаотичною?
items.trinkets.thirteenleafclover.name=тринадцятилистої конюшини
items.trinkets.thirteenleafclover.stats_desc=На поточному рівні цей дрібничка завдаватиме вам максимальної шкоди _%1$d%%_ часу та мінімальної шкоди _%2$d%%_ часу.
items.trinkets.thirteenleafclover.typical_stats_desc=Зазвичай ця дрібничка завдає вам максимальної шкоди _%1$d%%_ часу та мінімальної шкоди _%2$d%%_ часу.
items.trinkets.trapmechanism.desc=Основний механізм однієї з пасток підземелля, ретельно вирізьблений у підлозі, щоб його можна було переносити. Здається, він магічно пов'язаний із самим підземеллям, що робить небезпечну місцевість більш поширеною, але також збільшує вашу схильність до неї.
items.trinkets.trapmechanism.name=механізм пастки
items.trinkets.trapmechanism.stats_desc=На поточному рівні ця дрібничка призведе до того, що _%1$d%%_ нетематичних поверхів будуть заповнені або пастками, або прірвами. Крім того, натомість будуть видимими _%2$d%%_ прихованих пасток підземелля.
items.trinkets.trapmechanism.typical_stats_desc=Зазвичай ця дрібничка змушує _%1$d%%_ нетематичних поверхів заповнюватися пастками або прірвами. Крім того, натомість будуть видимими _%2$d%%_ прихованих пасток підземелля.
items.trinkets.trinket$placeholder.name=дрібничка
items.trinkets.trinket.discover_hint=Цей предмет може бути доступним щоразу, коли ви створюєте дрібничку за допомогою алхімії.
items.trinkets.trinketcatalyst$randomtrinket.desc=Один предмет поблизу застряг у мішечку, який ви не можете відкрити.\n\nПроцес алхімічного процесу розчинить мішечок, але ви не знатимете, яку дрібничку отримаєте, поки не зробите це!
items.trinkets.trinketcatalyst$randomtrinket.name=випадкова дрібничка
items.trinkets.trinketcatalyst.desc=Ця куля чарівного золотого пилу мерехтить у темряві підземелля. Цей каталізатор можна використовувати в алхімічному горщику з невеликою кількістю алхімічної енергії для створення унікального предмета-дрібнички.\n\nБрилянтки надають різні ефекти, які дещо змінюють підземелля або його мешканців. Брелянтки можна покращувати, збільшуючи енергію, щоб зробити їхній ефект сильнішим, або скидати, щоб повністю відмовитися від ефекту.
items.trinkets.trinketcatalyst.name=магічний каталізатор
items.trinkets.trinketcatalyst.window_text=Вода починає світитися, коли ви додаєте каталізатор. Поруч є кілька предметів, які можна наповнити енергією та перетворити на чарівну дрібничку.
items.trinkets.trinketcatalyst.window_title=створити дрібничку
items.trinkets.vialofblood.desc=Ця тонка ампула містить кров якогось мешканця підземелля, вона повільно рухається, коли ви її обертаєте. Здається, вона магічно посилює цілющі ефекти, але також і затримує їх.
items.trinkets.vialofblood.name=флакон крові
items.trinkets.vialofblood.stats_desc=На поточному рівні цей дрібничка збільшить загальний запас здоров'я, який ви отримуєте від вживання зілля лікування, бурдюків з водою або джерел здоров'я, на _%1$s%%_. Однак ці цілющі ефекти також проявлятимуться повільніше, відновлюючи максимум _%2$s_ здоров'я за хід (це залежить від рівня героя).
items.trinkets.vialofblood.typical_stats_desc=Зазвичай ця дрібничка збільшує загальний запас здоров'я, який ви отримуєте від вживання зілля зцілення, бурдюків з водою або джерел здоров'я, на _%1$s%%_. Однак ці цілющі ефекти також проявлятимуться повільніше, відновлюючи максимум _%2$s_ здоров'я за хід (це залежить від рівня героя).
items.trinkets.wondrousresin.desc=Ця мерехтлива блакитна смола, здається, містить дистильовану есенцію магії проклятої чарівної палички. Магія з алхімічного горщика, здається, дещо стабілізувала її, і тепер вона впливає на ваші чарівні палички.
items.trinkets.wondrousresin.name=чудова смола
items.trinkets.wondrousresin.stats_desc=На поточному рівні цей дрібничка змусить ефекти проклятих паличок стати нейтральними або позитивними _%1$s%%_ часу, а непрокляті палички стрілятимуть додатковим нейтральним або позитивним проклятим ударом _%2$s%%_ часу.\n\n. Покращення цього дрібнички вимагає більшої кількості енергії.
items.trinkets.wondrousresin.typical_stats_desc=Зазвичай цей дрібничка змушує ефекти проклятих паличок стати нейтральними або позитивними _%1$s%%_ часу, і змушує непрокляті палички стріляти додатковим нейтральним або позитивним проклятим ударом _%2$s%%_ часу.\n\nПокращення цього дрібнички вимагає більшої кількості енергії.
items.wands.cursedwand.disguise=Твій вигляд змінюється на очах!
items.wands.cursedwand.fire=Від тебе пахне горілим...
items.wands.cursedwand.grass=Трава проростає навколо тебе!
items.wands.cursedwand.gravity=Гравітація раптово починає тягнути в різних напрямках!
items.wands.cursedwand.gravity_end=Гравітаційний хаос закінчується.
items.wands.cursedwand.gravity_positive=Гравітація раптово починає тягнути в різних напрямках, але, здається, це не впливає на вас.
items.wands.cursedwand.mass_invuln=Яскраве світло виривається з твоєї палички!
items.wands.cursedwand.nothing=Нічого не відбувається.
items.wands.cursedwand.ondeath=Тебе вбив власний %s.
items.wands.cursedwand.petrify=Ти раптом завмираєш на місці!
items.wands.cursedwand.sinkhole=Земля навколо тебе починає руйнуватися!
items.wands.cursedwand.sinkhole_positive=Земля починає прогинатися, але під вами здається достатньо твердою.
items.wands.cursedwand.supernova=Палаюча куля енергії починає зростати. Можливо, вам захочеться бігти!
items.wands.cursedwand.supernova_positive=Палаюча куля енергії починає зростати, але чомусь відчувається безпечно.
items.wands.cursedwand.transmogrify_other=Ваш предмет перетворюється на щось інше!
items.wands.cursedwand.transmogrify_wand=Ваша чарівна паличка перетворюється на інший предмет!
items.wands.damagewand.upgrade_stat_name_1=Магічна шкода
items.wands.wand$placeholder.name=паличка
items.wands.wand.ac_zap=ЗАП
items.wands.wand.curse_discover=Цей %s проклятий!
items.wands.wand.cursed=Ця чарівна паличка проклята, що робить її магію хаотичною та випадковою.
items.wands.wand.fizzles=Твоя чарівна паличка шипить; мабуть, у неї недостатньо заряду.
items.wands.wand.identify=Тепер ви достатньо знайомі зі своєю паличкою, щоб її розпізнати.
items.wands.wand.no_magic=Ваша чарівна паличка шипить; ви не можете користуватися паличками, поки маєте імунітет до магії.
items.wands.wand.not_cursed=Ця паличка вільна від зловісної магії.
items.wands.wand.prompt=Виберіть місце для удару струмом
items.wands.wand.resin_many=Ця чарівна паличка отримала _%d рівні_ завдяки арканній смолі.
items.wands.wand.resin_one=Ця чарівна паличка отримала _1 рівень_ завдяки магічній смолі.
items.wands.wand.self_target=Ти не можеш цілитися в себе!
items.wands.wandofblastwave.bmage_desc=Коли _Бойовий маг_ вражає паралізованого ворога посохом вибухової хвилі, він поглинає параліч, завдаючи вибуху додаткової магічної шкоди. Має короткий час відновлення для кожного ворога.
items.wands.wandofblastwave.desc=Ця чарівна паличка зроблена з мармурового каменю, із золотим оздобленням та круглим чорним самоцвітом на кінчику. Вона дуже важка в руці.
items.wands.wandofblastwave.eleblast_desc=Стихійний вибух з посохом вибухової хвилі завдає 67% шкоди та відкидає всіх ворогів за межі зони вибуху.
items.wands.wandofblastwave.knockback_ondeath=Зіткнення тебе вбило...
items.wands.wandofblastwave.name=паличка вибухової хвилі
items.wands.wandofblastwave.ondeath=Ти вбив себе власною Паличкою Вибухової Хвилі...
items.wands.wandofblastwave.staff_name=персонал вибухової хвилі
items.wands.wandofblastwave.stats_desc=Ця чарівна паличка випускає заряд, який сильно детонує у вибраному місці. Сила цього вибуху завдає _%1$d-%2$d шкоди_ і є достатньо сильною, щоб змахнути більшістю ворогів.
items.wands.wandofblastwave.typical_stats_desc=Ця чарівна паличка випускає заряд, який сильно детонує у вибраному місці. Сила цього вибуху зазвичай завдає _%1$d-%2$d шкоди_ та є достатньо сильною, щоб змахнути більшістю ворогів.
items.wands.wandofblastwave.upgrade_stat_name_2=Відкидання
items.wands.wandofcorrosion.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом іржі, ворог має шанс просочитися.
items.wands.wandofcorrosion.desc=Ця паличка має попелясте тіло, яке відкривається блискучим помаранчевим дорогоцінним каменем.
items.wands.wandofcorrosion.eleblast_desc=Стихійний вибух посохом корозії завдає ворогам 4 ходи корозії, починаючи з 6 одиниць шкоди.
items.wands.wandofcorrosion.name=паличка корозії
items.wands.wandofcorrosion.staff_name=персонал корозії
items.wands.wandofcorrosion.stats_desc=Ця чарівна паличка вистрілює розряд, який вибухає, перетворюючись на хмару високої корозійної речовини в цільовому місці. Все, що потрапить всередину цієї хмари, з часом зазнаватиме зростаючої шкоди, починаючи з _%d шкоди._
items.wands.wandofcorrosion.upgrade_stat_name_1=Корозійні пошкодження
items.wands.wandofcorrosion.upgrade_stat_name_2=Об'єм газу
items.wands.wandofcorruption.already_corrupted=На цього персонажа більше не можна впливати.
items.wands.wandofcorruption.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом псування, ворог має шанс задимитися.
items.wands.wandofcorruption.desc=Ця паличка випромінює хаотичну темну енергію, якщо це ще не було очевидно з маленького декоративного черепа, у формі якого вона має кінчик.
items.wands.wandofcorruption.eleblast_desc=Стихійний вибух посохом псування завдає ворогам 5 ходів сказу.
items.wands.wandofcorruption.name=паличка корупції
items.wands.wandofcorruption.staff_name=персонал корупції
items.wands.wandofcorruption.stats_desc=Ця чарівна паличка вивільнить вибух порчуючої енергії, яка знешкодить ворогів і зрештою підкорить їх вашій волі. Вороги здатні протистояти порчі, але ослаблених ворогів набагато легше порчати, ніж здорових.
items.wands.wandofcorruption.upgrade_stat_name_1=Розбещуюча влада
items.wands.wandofcorruption.upgrade_stat_name_2=Тривалість дебаффу
items.wands.wandofdisintegration.bmage_desc=Коли _Бойовий маг_ тримає посох розпаду, він збільшує дальність атаки, ніби має проектуючі чари.
items.wands.wandofdisintegration.desc=Ця паличка виготовлена з твердого гладкого шматка обсидіану, з темно-фіолетовим світлом, що пробігає по її боці та закінчується на кінчику. Вона світиться руйнівною енергією, чекаючи, щоб вистрілити вперед.
items.wands.wandofdisintegration.eleblast_desc=Стихійний вибух з посохом розпаду завдає 100% шкоди та пробиває стіни.
items.wands.wandofdisintegration.name=паличка розпаду
items.wands.wandofdisintegration.staff_name=персонал розпаду
items.wands.wandofdisintegration.stats_desc=Ця чарівна паличка вистрілює променем, який пронизує будь-яку перешкоду, і чим більше вона покращується, тим далі вона літає. Промінь завдає _%1$d-%2$d шкоди,_ а також завдає додаткової шкоди за кожного ворога та стіну, яких він пробиває.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максимальний діапазон
items.wands.wandoffireblast.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом вогняного вибуху, є шанс, що він спричинить вибух, який завдає шкоди ворогам і поглинає весь вогонь поблизу! Цей шанс збільшується, чим більше вогню знаходиться поруч із ворогом.
items.wands.wandoffireblast.desc=Ця чарівна паличка виготовлена з червоного лакованого дерева, щедро використаного з золотим листям, що надає їй досить королівського вигляду. Вона потріскує та шипить на кінчику, прагнучи розкрити свою могутню магію.
items.wands.wandoffireblast.eleblast_desc=Стихійний вибух посохом вогняного вибуху завдає 100% шкоди, вириває двері та підпалює ворогів і місцевість.
items.wands.wandoffireblast.name=паличка вогняного вибуху
items.wands.wandoffireblast.staff_name=персонал вогняного вибуху
items.wands.wandoffireblast.stats_desc=Ця чарівна паличка випускає вогняний конус під час використання. Її наступна атака споживатиме заряди _%1$d_ та завдасть _%2$d-%3$d шкоди._ Чим більше зарядів використовує чарівна паличка, тим більший і сильніший ефект.
items.wands.wandoffireblast.upgrade_stat_name_1=1 заряд шкоди
items.wands.wandoffireblast.upgrade_stat_name_2=2 Пошкодження від заряду
items.wands.wandoffireblast.upgrade_stat_name_3=3 Шкода від заряду
items.wands.wandoffrost.bmage_desc=Коли _Бойовий маг_ вражає охолодженого ворога посохом льоду, той має шанс миттєво заморозити його. Цей шанс тим більший, чим сильніше він охолоджується.
items.wands.wandoffrost.desc=Ця паличка, здається, зроблена з якогось чарівного льоду. Ближче до заокругленого кінчика вона стає яскравішою. Коли її тримають у руках, вона дуже холодна, але якимось чином ваша рука залишається теплою.
items.wands.wandoffrost.eleblast_desc=Стихійний вибух посохом льоду завдає 100% шкоди, заморожує ворогів і гасить пожежі.
items.wands.wandoffrost.name=паличка морозу
items.wands.wandoffrost.staff_name=посох морозу
items.wands.wandoffrost.stats_desc=Ця чарівна паличка стріляє у ворогів вибухами крижаної енергії, завдаючи _%1$d-%2$d шкоди_ та охолоджуючи. Ефект здається сильнішим у воді. Вороги, які вже охолоджені або заморожені, отримують менше шкоди від цієї палички.
items.wands.wandoffrost.upgrade_stat_name_2=Тривалість охолодження
items.wands.wandoflightning$lightningcharge.desc=Бойовий маг зараз заряджений енергією, що надає йому імунітет до його посоху блискавок і збільшує дальність вибуху блискавок. \n\nХодів залишилося: %s.
items.wands.wandoflightning$lightningcharge.name=Електрично заряджений
items.wands.wandoflightning.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом блискавки, він має шанс зарядитися електрично на 10 ходів. Поки Бойовий маг заряджений, він невразливий до пошкоджень блискавкою та може продовжувати генерувати дугу блискавки.
items.wands.wandoflightning.desc=Ця паличка виготовлена з міцного металу, що робить її напрочуд важкою. Два зубці вигинаються разом на кінчику, і між ними протікає електрична дуга.
items.wands.wandoflightning.eleblast_desc=Стихійний вибух з посохом блискавки завдає 100% шкоди, приголомшує ворогів на 5 ходів та електризує воду.
items.wands.wandoflightning.name=паличка блискавки
items.wands.wandoflightning.ondeath=Ти вбив себе власним жезлом блискавки...
items.wands.wandoflightning.staff_name=посох блискавки
items.wands.wandoflightning.stats_desc=Ця паличка посилає потужну блискавку крізь усе, куди нею стріляють, завдаючи _%1$d-%2$d шкоди._ Ця електрика передаватиме дугу до персонажів поблизу та легше поширюватиметься у воді. Дуги від цієї палички можуть завдати шкоди вам, але не зашкодять вашим союзникам.
items.wands.wandoflivingearth$earthguardian.desc=Камені з вашої палички живої землі сформувалися в захисного земляного охоронця! Цей кам'янистий захисник атакуватиме ворогів поблизу, що змусить їх атакувати охоронця замість вас. Коли всі загрози поблизу зникнуть, охоронець знову сформується навколо вас і повернеться, коли ви наступного разу скористаєтеся своєю паличкою.
items.wands.wandoflivingearth$earthguardian.discover_hint=Ви можете знайти цього персонажа за допомогою спеціальної палички.
items.wands.wandoflivingearth$earthguardian.name=земляний охоронець
items.wands.wandoflivingearth$earthguardian.wand_info=Захисна сила охоронця залежить від рівня вашої чарівної палички. Наразі вона блокує пошкодження від _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Магічне каміння оточує ваше тіло. Коли на вас нападають, воно намагатиметься блокувати удари та зменшуватиме отриману вами шкоду на 50%%. Однак кожне заблоковане пошкодження зішкрібає частину каменю.\n\nЗалишок броні: %1$d.\n\nЯкщо навколо вас накопичиться достатньо каменів, наступний удар вашої палички живої землі призведе до того, що каміння сформується в охоронця, який битиметься з вами.\n\nБроня, необхідна для Охоронця: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Цей земляний охоронець також отримує вигоду від Сили багатьох. Залишилося ходів: %d.
items.wands.wandoflivingearth$rockarmor.name=кам'яна броня
items.wands.wandoflivingearth.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом з живої землі, частина завданої шкоди повертається у вигляді кам'яної броні.
items.wands.wandoflivingearth.desc=Ця чарівна паличка виготовлена з цікавої породи, зі смугами сяючої жовтої енергії. Камені злегка зміщуються, коли ви тримаєте паличку, ніби відчувають вашу руку.
items.wands.wandoflivingearth.eleblast_desc=Стихійний вибух посохом живої землі завдає 50% шкоди та лікує активного земляного охоронця за кожного ураженого ворога.
items.wands.wandoflivingearth.name=паличка живої землі
items.wands.wandoflivingearth.staff_name=посох живої землі
items.wands.wandoflivingearth.stats_desc=Ця чарівна паличка посилає у ворогів магічні кам'яні заряди, завдаючи _%1$d-%2$d шкоди._ Камені потім переформуються навколо користувача, надаючи йому броню пропорційно до завданої шкоди. Якщо накопичиться достатньо броні, вона перетвориться на кам'яного охоронця, коли чарівна паличка буде наступного разу вражена струмом.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Блокування опікуна
items.wands.wandofmagicmissile$magiccharge.desc=Ваша чарівна паличка з магічним снарядом повернула енергію вашим паличкам, підвищивши ефективний рівень наступного удару, який вони здійснять. \n\nВаші палички посилені до: +%d.\n\nХодоти магічного заряду, що залишилися: %s.
items.wands.wandofmagicmissile$magiccharge.name=магічний заряд
items.wands.wandofmagicmissile.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом магічного снаряда, усі його палички, окрім посоха, отримують заряд.
items.wands.wandofmagicmissile.desc=Ця досить проста чарівна паличка випускає снаряди чистої магічної енергії. Хоча сама паличка не має жодних спеціальних ефектів, вона має більше доступних зарядів і може ненадовго посилювати інші палички після покращення.
items.wands.wandofmagicmissile.discover_hint=Один з героїв починає з цього предмета.
items.wands.wandofmagicmissile.eleblast_desc=Стихійний вибух магічною ракетою завдає 50% шкоди та дає магу 15 ходів перезарядки.
items.wands.wandofmagicmissile.name=чарівна паличка
items.wands.wandofmagicmissile.staff_name=посох магічної ракети
items.wands.wandofmagicmissile.stats_desc=Кожен заряд з цієї палички завдає _%1$d-%2$d шкоди_ та ненадовго посилює інші палички, якщо її покращити.
items.wands.wandofprismaticlight.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом призматичного світла, він буде покалічений на час, який залежить від рівня посоха.
items.wands.wandofprismaticlight.desc=Ця паличка виготовлена з цільного шматка напівпрозорого кришталю, схожого на довгий шматок гладкого скла. Маленькі шматочки різнокольорового світла танцюють навколо кінчика палички, прагнучи вибухнути.
items.wands.wandofprismaticlight.eleblast_desc=Стихійний вибух призматичним світлом завдає 67% шкоди, відкриває всю місцевість під вибухом і засліплює ворогів на 5 ходів.
items.wands.wandofprismaticlight.name=паличка призматичного світла
items.wands.wandofprismaticlight.staff_name=посох призматичного світла
items.wands.wandofprismaticlight.stats_desc=Ця чарівна паличка вистрілює променями світла, які прорізають темряву підземелля, виявляючи приховані місця та пастки. Промінь може засліплювати ворогів і завдає _%1$d-%2$d шкоди._ Демонічні вороги та нежить горітимуть у яскравому світлі чарівної палички, отримуючи додаткову шкоду.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Сліпий шанс
items.wands.wandofprismaticlight.upgrade_stat_name_3=Тривалість світла
items.wands.wandofregrowth$dewcatcher.desc=Росоловки – це дивовижні рослини, які наповнюють себе чарівною росою. Вони намагаються маскуватися під траву, щоб уникнути уваги, але їхні опуклості зібраної роси видають їх.
items.wands.wandofregrowth$dewcatcher.discover_hint=Ви можете знайти цю рослину за допомогою спеціальної палички.
items.wands.wandofregrowth$dewcatcher.name=Ловець роси
items.wands.wandofregrowth$lotus.desc=Золотий лотос — це містична рослина, яку можна викликати лише потужним помахом палички відростання. Його аура підсилює всі рослини та рослинні ефекти, але вона випалює свою енергію та гине через короткий час.
items.wands.wandofregrowth$lotus.discover_hint=Ви можете знайти цю рослину за допомогою спеціальної палички, попередньо покращивши її кілька разів.
items.wands.wandofregrowth$lotus.name=Золотий лотос
items.wands.wandofregrowth$lotus.wand_info=Цей лотос був створений за допомогою палички відростання _+%1$d_. Усі рослини, що знаходяться під його дією, _миттєво спрацюють_, якщо їх посадити на персонажа. Рослини також матимуть _%2$d%% шанс_ скинути своє насіння, а дротики з наконечниками використовуватимуть _%3$d%% меншу міцність_.
items.wands.wandofregrowth$seedpod.desc=Насіннєві коробочки – це чарівні рослини, які виробляють насіння з інших видів рослин, а не з власного насіння. Вони якимось чином поширюються, незважаючи на відсутність власного насіння.
items.wands.wandofregrowth$seedpod.discover_hint=Ви можете знайти цю рослину за допомогою спеціальної палички.
items.wands.wandofregrowth$seedpod.name=Насіннєва стручка
items.wands.wandofregrowth.bmage_desc=Коли _Бойовий маг_ вражає ворога посохом відростання, і будь-хто з них стоїть на траві, він отримує трав'яне зцілення пропорційно до завданої шкоди.
items.wands.wandofregrowth.degradation=Після чергових зарядів _%d_ ця чарівна паличка почне не виробляти рослини та свіжу траву. Цей ліміт збільшується шляхом підвищення рівня або покращення чарівної палички.
items.wands.wandofregrowth.desc=Ця чарівна паличка зроблена з тонкого держака майстерно вирізьбленого дерева. Якимось чином вона досі жива та яскрава, яскраво-зелена, як серцевина молодого дерева. «Коли життя припиняється, нове життя завжди починає рости... Вічний цикл завжди залишається!»
items.wands.wandofregrowth.eleblast_desc=Стихійний вибух з посохом відростання укорінює ворогів і випадковим чином обростає травою по всій зоні вибухів.
items.wands.wandofregrowth.name=паличка відростання
items.wands.wandofregrowth.staff_name=персонал відродження
items.wands.wandofregrowth.stats_desc=Під час використання ця паличка випромінюватиме магічну енергію відростання конусом, змушуючи траву, коріння та рідкісні рослини оживати. Наступний удар споживатиме заряди _%1$d_. Чим більше зарядів використовує паличка, тим більший і сильніший ефект.
items.wands.wandofregrowth.upgrade_stat_name_1=Трава на один заряд
items.wands.wandofregrowth.upgrade_stat_name_2=Загальний ліміт трави
items.wands.wandoftransfusion.bmage_desc=Коли _Бойовий маг_ вражає зачарованого ворога посохом переливання, той отримує щит, і його наступний удар посохом не коштуватиме йому здоров'я.
items.wands.wandoftransfusion.charged=Ваш посох заряджений життєвою енергією вашого ворога!
items.wands.wandoftransfusion.desc=Досить проста форма палички, вона виділяється своїм пурпуровим відтінком та чорним каменем на кінчику.
items.wands.wandoftransfusion.eleblast_desc=Стихійний вибух посохом переливання зачаровує ворогів, лікує союзників і завдає 100% шкоди немертвим ворогам.
items.wands.wandoftransfusion.name=паличка переливання
items.wands.wandoftransfusion.ondeath=Ти вбив себе власною паличкою переливання...
items.wands.wandoftransfusion.staff_name=персонал переливання крові
items.wands.wandoftransfusion.stats_desc=При використанні на союзниках або зачарованих ворогах, ця чарівна паличка висмикує _%1$d здоров'я користувача_, щоб зцілити або захистити союзника на _%2$d здоров'я._ При використанні на ворогах, паличка ненадовго зачаровує їх, одночасно застосовуючи _%3$d захист_ до користувача. Ворожа нежить отримує _%4$d-ZXQ4ZXQ шкоди_ замість того, щоб бути зачарованою.
items.wands.wandoftransfusion.upgrade_stat_name_1=Зцілення союзника
items.wands.wandoftransfusion.upgrade_stat_name_2=Самозахист
items.wands.wandoftransfusion.upgrade_stat_name_3=Шкода від нежиті
items.wands.wandofwarding$ward.desc_1=Цей базовий захист автоматично вразить будь-якого ворога, який потрапить у його поле зору, завдаючи _%1$d-%2$d шкоди._\n\nУраження цього захисту вашою паличкою захисту покращить його.\n\nЦей захист вразить лише один раз, перш ніж розсіється.\n\nВаша паличка захисту використовує енергію _%3$d_ для підтримки цього захисту.
items.wands.wandofwarding$ward.desc_2=Цей покращений вард має складніший візерунок і може атакувати кілька разів. Кожен удар струмом від цього варда завдасть _%1$d-%2$d шкоди._\n\nУраження цього варда вашою паличкою варда покращить його.\n\nЦей вард завдасть удару струмом тричі, перш ніж розсіється.\n\nВаша паличка варда використовує енергію _%3$d_ для підтримки цього варда.
items.wands.wandofwarding$ward.desc_3=Цей повністю покращений вард здатний атакувати частіше, ніж його попередники. Кожен удар струмом від цього варда завдасть _%1$d-%2$d шкоди._\n\nУраження цього варда вашою паличкою варда покращить його.\n\nЦей вард завдасть п'яти ударів струмом, перш ніж розсіється.\n\nВаша паличка варда використовує _%3$d енергію_ для підтримки цього варда.
items.wands.wandofwarding$ward.desc_4=Цей менший вартовий має таку ж вогневу міць, як і більший вард, але має здоров'я замість фіксованої кількості зарядів. Він нагадує самоцвіт на кінчику вашої чарівної палички. Кожен удар цим вартом завдасть _%1$d-%2$d шкоди._\n\nУдар по цьому варту вашою чарівною паличкою покращить та вилікує його.\n\nЦей вартовий витрачатиме трохи здоров'я щоразу, коли вражає ворога, але його можна вилікувати, використовуючи на ньому чарівну паличку.\n\nВаша чарівна паличка використовує _%3$d енергію_ для підтримки цього варту.
items.wands.wandofwarding$ward.desc_5=Цей покращений вартовий більший і витриваліший, ніж менший вартовий. Кожен удар зарядом цього вартового завдасть _%1$d-%2$d шкоди._\n\nУдар по цьому вартовому вашою паличкою захисту покращить та вилікує його.\n\nЦей вартовий витрачатиме трохи здоров'я щоразу, коли вражає ворога зарядом, але його можна вилікувати, використовуючи на ньому паличку захисту.\n\nВаша паличка захисту використовує _%3$d енергію_ для підтримки цього вартового.
items.wands.wandofwarding$ward.desc_6=Цей повністю покращений вартовий значно витриваліший за своїх попередників. Кожен удар струмом від цього вартового завдасть _%1$d-%2$d шкоди._\n\nУдар по цьому вартовому вашою паличкою захисту вилікує його.\n\nЦей вартовий витрачатиме певну кількість здоров'я щоразу, коли вражає ворога струмом, але його можна вилікувати, використавши на ньому паличку захисту.\n\nВаша паличка захисту використовує _%3$d енергію_ для підтримки цього вартового.
items.wands.wandofwarding$ward.desc_generic_sentry=Цей вартовий має таку ж вогневу міць, як і вард, але має здоров'я замість встановленої кількості зарядів. Він нагадує самоцвіт на кінчику вашої чарівної палички.\n\nЯкщо ви вдарите по цьому вартовому чарівною паличкою, це покращить та зцілить його.\n\nЦей вартовий витрачатиме трохи здоров'я щоразу, коли вражає ворога чарівною паличкою, але його можна зцілити, використовуючи на ньому чарівну паличку.
items.wands.wandofwarding$ward.desc_generic_ward=Цей вард автоматично вразить будь-якого ворога, який потрапить у його поле зору.\n\nВразливість цього варда вашою чарівною паличкою варду покращить його.\n\nВарди мають обмежену кількість ударів, перш ніж розсіюються.
items.wands.wandofwarding$ward.discover_hint=Ви можете знайти цього персонажа за допомогою спеціальної палички.
items.wands.wandofwarding$ward.dismiss_body=Ви можете розвіяти цей вард, якщо більше не хочете, щоб ваша чарівна паличка підтримувала його. Це негайно знищить вард.\n\nЗвіяти цей вард?
items.wands.wandofwarding$ward.dismiss_cancel=ні
items.wands.wandofwarding$ward.dismiss_confirm=так
items.wands.wandofwarding$ward.dismiss_title=Звільнити цього підопічного?
items.wands.wandofwarding$ward.name_1=менший відділ
items.wands.wandofwarding$ward.name_2=палата
items.wands.wandofwarding$ward.name_3=більший прихід
items.wands.wandofwarding$ward.name_4=менший вартовий
items.wands.wandofwarding$ward.name_5=вартовий
items.wands.wandofwarding$ward.name_6=більший вартовий
items.wands.wandofwarding.bad_location=Ви не можете там розмістити варду.
items.wands.wandofwarding.bmage_desc=Коли _Бойовий маг_ вражає ворога охоронним посохом, усі активні охоронці та вартові мають шанс зцілитися.
items.wands.wandofwarding.desc=Ця коротка металева паличка має яскраво-фіолетовий камінь, що плаває над її кінчиком.
items.wands.wandofwarding.eleblast_desc=Стихійний вибух із посохом захисту лікує всі варти та вартових у зоні вибуху.
items.wands.wandofwarding.name=чарівна паличка
items.wands.wandofwarding.no_more_wards=Твоя чарівна паличка більше не витримує жодних вардів.
items.wands.wandofwarding.staff_name=персонал опіки
items.wands.wandofwarding.stats_desc=Замість того, щоб завдавати безпосередньої шкоди ворогові, ця чарівна паличка призватиме стаціонарні варди та вартових. Варди можна викликати будь-де, навіть крізь стіни, якщо у вас є зір. Ця чарівна паличка може одночасно підтримувати варди на _%d енергії_.
items.wands.wandofwarding.upgrade_stat_name_1=Пошкодження варда
items.wands.wandofwarding.upgrade_stat_name_2=Ворд Енерджі
items.waterskin.ac_drink=НАПІЙ
items.waterskin.collected=Ти збираєш краплю роси у свій бурдюк.
items.waterskin.desc=Ємність для рідини, виготовлена зі шкіри та мотузки, запечатана корковою пробкою.
items.waterskin.desc_full=Здається, повний бурдюк випромінює енергію, можливо, його можна використати для благословення іншого предмета для виживання?
items.waterskin.desc_heal=Бурдюк зараз використовується для зберігання цілющої води. Чим повніший бурдюк, тим миттєво ви зцілитеся, п'ючи з нього. Ви вип'єте лише стільки, скільки вам потрібно.
items.waterskin.desc_water=Зараз у бурдюку просто питна вода. Напевно, у підземеллі є щось, що можна було б зберігати в бурдюку.
items.waterskin.discover_hint=Один з героїв починає з цього предмета.
items.waterskin.empty=Твій бурдюк порожній!
items.waterskin.full=Твій бурдюк повний!
items.waterskin.name=бурдюк для води
items.weapon.curses.annoying.desc=Дратівлива зброя здатна говорити, але вона трохи занадто енергійна. Вона часто привертає до вас увагу, навіть не бажаючи цього.
items.weapon.curses.annoying.elestrike_desc=Стихійний удар з надокучливим прокляттям має 20% шанс підірвати кожного ворога в радіусі дії на 6 ходів.
items.weapon.curses.annoying.msg_1=Ооо, МИ З ЧИМСЯМ БОРИМОСЯ?!
items.weapon.curses.annoying.msg_10=ДОБРЕ ВДАРИВСЯ!
items.weapon.curses.annoying.msg_11=Я не хотів бути зброєю, я хотів бути сокирою лісоруба.
items.weapon.curses.annoying.msg_12=Пам'ятайте, що надмірна впевненість — це повільний і підступний убивця.
items.weapon.curses.annoying.msg_13=ВСЯ ВАША БАЗА НАЛЕЖИТЬ НАМ!
items.weapon.curses.annoying.msg_2=ТАК, ЗАБЕРІТЬ ЇХ!
items.weapon.curses.annoying.msg_3=ГЕЙ, СЛУХАЙ!
items.weapon.curses.annoying.msg_4=МИ ВЖЕ ДІСТАЛИСЯ ДО БОСА!?
items.weapon.curses.annoying.msg_5=ОЙ, НЕ РОЗГОУБЛЮЙ МЕНЕ ТАК СИЛЬНО!
items.weapon.curses.annoying.msg_6=ЗГИНЬ, КОМАХО!
items.weapon.curses.annoying.msg_7=УФУУУУУУУУУУУУ!
items.weapon.curses.annoying.msg_8=МОЖЕМО ЗРОБИТИ ПЕРЕРВУ!?
items.weapon.curses.annoying.msg_9=ВОУ, ХА-ХА!
items.weapon.curses.annoying.name=дратівливий %s
items.weapon.curses.dazzling.desc=Сліпуча зброя іноді блиматиме сліпучим світлом, засліплюючи все, хто може її побачити.
items.weapon.curses.dazzling.elestrike_desc=Стихійний удар із сліпучим прокляттям має 50% шанс засліпити кожного ворога в радіусі дії на 6 ходів.
items.weapon.curses.dazzling.name=сліпучий %s
items.weapon.curses.displacing.desc=Зброя, що переміщується, наповнена хаотичною магією телепортації, що має здатність випадковим чином деформувати ворогів по підлозі.
items.weapon.curses.displacing.elestrike_desc=Стихійний удар із прокляттям витіснення має 50% шанс телепортувати кожного ворога в радіусі дії.
items.weapon.curses.displacing.name=витісняючи %s
items.weapon.curses.explosive.desc=Вибухова зброя невпинно нарощує потужність і вибухає, пошкоджуючи все, що знаходиться поблизу.
items.weapon.curses.explosive.desc_cool=Ваша зброя зараз холодна на дотик.
items.weapon.curses.explosive.desc_hot=Твоя зброя гаряча! Вона ось-ось вибухне!
items.weapon.curses.explosive.desc_warm=Твоя зброя накопичує енергію та нагрівається...
items.weapon.curses.explosive.elestrike_desc=Стихійний удар з вибуховим прокляттям має 50% шанс викликати вибух на випадковому ворогові в радіусі дії.
items.weapon.curses.explosive.hot=Гаряче!
items.weapon.curses.explosive.name=вибухівка %s
items.weapon.curses.explosive.warm=Теплий...
items.weapon.curses.friendly.desc=Дружня зброя найкраще підходить для пацифістів, оскільки іноді вона активує магію, що унеможливлює боротьбу.
items.weapon.curses.friendly.elestrike_desc=Стихійний удар із дружнім прокляттям має 50% шанс зачарувати кожного ворога в радіусі дії на 6 ходів.
items.weapon.curses.friendly.name=дружній %s
items.weapon.curses.polarized.desc=На поляризовану зброю впливає магія, яка призводить до того, що її атака завдає на 50% більше шкоди, або взагалі не завдає шкоди.
items.weapon.curses.polarized.elestrike_desc=Стихійний удар з поляризованим прокляттям має 50% шанс завдати 24-36 одиниць шкоди кожному ворогу в радіусі дії.
items.weapon.curses.polarized.name=поляризований %s
items.weapon.curses.sacrificial.desc=Жертвенна зброя вимагатиме крові від власника в обмін на атаку на ворогів. Чим здоровіший власник, тим більше крові вимагатиме прокляття.
items.weapon.curses.sacrificial.elestrike_desc=Стихійний удар із жертовним прокляттям призводить до того, що герой та кожен ворог у радіусі дії кровоточать на 12 здоров'я.
items.weapon.curses.sacrificial.name=жертовний %s
items.weapon.curses.wayward$waywardbuff.desc=Магія вашої зброї-неслухняності активувалася, що зробило її надзвичайно неточною на короткий час. Зверніть увагу, що це не впливає на атаки, які гарантовано влучають, такі як несподівані атаки. Успішна атака зброєю-неслухняністю негайно зніме цей ефект. \n\nХодів залишилося: %s.
items.weapon.curses.wayward$waywardbuff.name=норовливий
items.weapon.curses.wayward.desc=Зброя, що використовується як «неслухняна», іноді стає надзвичайно неточною. Ця магія діє деякий час після активації, але її можна розвіяти, завдавши удару зброєю, що використовується як «неслухняна».
items.weapon.curses.wayward.elestrike_desc=Стихійний удар із закляттям «неслухняного» має 50% шанс накласти прокляття на кожного ворога в радіусі дії на 6 ходів.
items.weapon.curses.wayward.name=норовливий %s
items.weapon.enchantments.blazing.desc=Це зачарування змушує зброю вивергатися полум'я, підпалюючи ворогів і завдаючи додаткової шкоди ворогам, які вже горять.
items.weapon.enchantments.blazing.elestrike_desc=Стихійний удар із палаючими чарами поширює вогонь на кожну клітинку в радіусі дії, що триває 8 ходів.
items.weapon.enchantments.blazing.name=палаючий %s
items.weapon.enchantments.blocking$blockbuff.desc=Блокувальні чари вашої зброї на короткий час посилили вашу захисну силу! \n\nЗалишок щита: %d\n\nХодів залишилося: %s.
items.weapon.enchantments.blocking$blockbuff.name=блокування
items.weapon.enchantments.blocking.desc=Блокуюча зброя має шанс ненадовго захистити вас після атаки нею.
items.weapon.enchantments.blocking.elestrike_desc=Стихійний удар із блокуючими чарами надає Дуелянту додаткові 6 одиниць захисту за кожного ворога в радіусі дії.
items.weapon.enchantments.blocking.name=блокування %s
items.weapon.enchantments.blooming.desc=Квітуча зброя містить магію, яка спричиняє проростання рослинності на або навколо тих, кого вона вразить.
items.weapon.enchantments.blooming.elestrike_desc=Стихійний удар із квітучим зачаруванням поширює траву на радіус до 8 клітинок і пригнічує всіх ворогів у радіусі дії на 6 ходів.
items.weapon.enchantments.blooming.name=цвітіння %s
items.weapon.enchantments.chilling.desc=Вороги, уражені цими чарами, охолоджуються, що уповільнює їхній рух та атаки.
items.weapon.enchantments.chilling.elestrike_desc=Стихійний удар із крижаними чарами поширює крижане повітря на кожну клітинку в радіусі дії, що триває 8 ходів.
items.weapon.enchantments.chilling.name=охолоджуючий %s
items.weapon.enchantments.corrupting.desc=Ці потужні чари мають здатність підкорювати ворогів вашій волі. Коли ворога вбивають цією зброєю, є ймовірність того, що він стане зіпсованим, а не помре.
items.weapon.enchantments.corrupting.elestrike_desc=Стихійний удар із зачаруванням, що псує, має 5-25% шанс (залежно від відсутнього HP) псувати кожного ворога в радіусі дії, окрім основної цілі.
items.weapon.enchantments.corrupting.name=пошкодження %s
items.weapon.enchantments.elastic.desc=Еластична зброя має шанс відкинути ворогів назад на короткі відстані.
items.weapon.enchantments.elastic.elestrike_desc=Стихійний удар з еластичними чарами відкидає всіх ворогів у радіусі дії на 5 клітинок назад.
items.weapon.enchantments.elastic.name=еластичний %s
items.weapon.enchantments.grim.desc=Ці потужні чари мають силу миттєво стратити ворога. Ефект тим імовірніший, чим слабший ворог.
items.weapon.enchantments.grim.elestrike_desc=Стихійний удар із похмурим зачаруванням має 6-30% шанс (залежно від браку здоров'я) вбити кожного ворога в радіусі дії, окрім основної цілі.
items.weapon.enchantments.grim.name=похмурий %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваша зброя накопичила надлишкову силу від попереднього смертельного удару та застосує її як додаткову шкоду до вашої наступної атаки. Однак з часом енергія повільно зникатиме. \n\nЗбережена шкода: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=збережені пошкодження
items.weapon.enchantments.kinetic.desc=Коли ворога вбивають кінетичною зброєю, будь-яка надлишкова сила зберігається у зброї та буде застосована до наступної успішної атаки.
items.weapon.enchantments.kinetic.elestrike_desc=Стихійний удар з кінетичним зачаруванням завдає 40% накопиченої шкоди кожному ворогу в радіусі дії, окрім основної цілі.
items.weapon.enchantments.kinetic.name=кінетичний %s
items.weapon.enchantments.lucky.desc=Вороги, вбиті щасливою зброєю, мають шанс випасти додаткову здобич.
items.weapon.enchantments.lucky.elestrike_desc=Стихійний удар із зачаруванням удачі має 12,5% шанс створити здобич під кожним ворогом у радіусі дії. Цей ефект може спрацювати лише один раз на кожного ворога.
items.weapon.enchantments.lucky.name=щасливий %s
items.weapon.enchantments.projecting.desc=Завдяки цьому зачаруванню зброя ближнього бою отримає додаткову дальність дії. Зброя дальнього бою пробиватиме стіни, якщо її націлити на цілі поблизу.
items.weapon.enchantments.projecting.elestrike_desc=Стихійний удар із проектуючим зачаруванням завдає 30% шкоди кожному ворогу в радіусі дії, окрім основної цілі.
items.weapon.enchantments.projecting.name=проектування %s
items.weapon.enchantments.shocking.desc=Електричні дуги від шокуючої зброї, що завдають додаткової шкоди всім ворогам поблизу.
items.weapon.enchantments.shocking.elestrike_desc=Стихійний удар із шокуючою чарівністю поширює електрику на кожну клітинку в радіусі дії, що триває 8 ходів.
items.weapon.enchantments.shocking.name=шокуючий %s
items.weapon.enchantments.unstable.desc=Ці чари випромінюють хаотичну енергію, діючи як різні чари з кожним ударом.
items.weapon.enchantments.unstable.elestrike_desc=Стихійний удар з нестабільним зачаруванням застосовує випадковий ефект зачарування до кожного ворога в радіусі дії, окрім основної цілі.
items.weapon.enchantments.unstable.name=нестабільний %s
items.weapon.enchantments.vampiric.desc=Ці потужні чари з кожним ударом висмоктують життєву силу з ворогів, спрямовуючи її назад у власника. Ефект тим сильніший, чим нижче здоров'я власника.
items.weapon.enchantments.vampiric.elestrike_desc=Стихійний удар з вампірськими чарами лікує Дуелянта на 2,5 одиниці здоров'я за кожного ворога в радіусі дії.
items.weapon.enchantments.vampiric.name=вампір %s
items.weapon.melee.assassinsblade.ability_desc=Дуелянт може _підкрадатися_, тримаючи в руках клинок вбивці. Ця здатність дозволяє дуелянту миттєво віддалятися на відстань до 3 клітинок та надає йому _%d ходи невидимості._
items.weapon.melee.assassinsblade.ability_name=підкрадатися
items.weapon.melee.assassinsblade.desc=Невелике хвилясте лезо з обсидіану, важке у використанні, незважаючи на легкість, але смертельне, якщо знайде потрібну ціль.
items.weapon.melee.assassinsblade.name=клинок вбивці
items.weapon.melee.assassinsblade.stats_desc=Ця зброя сильніша проти непідготовлених ворогів.
items.weapon.melee.assassinsblade.typical_ability_desc=Дуелянт може _підкрадатися_, тримаючи в руках клинок вбивці. Ця здатність дозволяє дуелянту миттєво віддалятися на відстань до 3 клітинок і зазвичай надає йому _%d ходи невидимості._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.battleaxe.ability_desc=Дуелянт може завдати _сильного удару_ бойовою сокирою. Ця концентрована атака завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.battleaxe.ability_name=сильний удар
items.weapon.melee.battleaxe.desc=Величезна сталева головка цієї бойової сокири надає значної ваги кожному широкому удару.
items.weapon.melee.battleaxe.name=бойова сокира
items.weapon.melee.battleaxe.stats_desc=Це досить точна зброя.
items.weapon.melee.battleaxe.typical_ability_desc=Дуелянт може завдати _сильного удару_ бойовою сокирою. Ця концентрована атака зазвичай завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.crossbow$chargedshot.desc=Дуелянтка зосереджує силу свого арбалета. Наступна атака, яку вона здійснить ним, завжди влучить і застосує один із трьох ефектів:\n – атаки ближнього бою відкинуть ворогів на кілька клітинок.\n – дротики без наконечника завдадуть додаткової шкоди.\n – дротики з наконечником отримають додаткові можливості використання та застосують свій ефект у зоні 7x7. Позитивні ефекти дротиків впливатимуть лише на союзників, а шкідливі ефекти – лише на ворогів. Дуелянтка не може використовувати цю здатність, щоб застосувати позитивні ефекти дротиків до себе.
items.weapon.melee.crossbow$chargedshot.name=заряджений
items.weapon.melee.crossbow.ability_desc=Дуелянтка може _зарядити_ свій арбалет, завдяки чому її наступна звичайна атака ним завжди влучатиме та застосовуватиме один із трьох ефектів: атаки ближнього бою відкидатимуть ворогів, дротики без наконечника завдаватимуть _+%1$d шкоди_, а дротики з наконечником застосовуватимуть свій ефект у зоні 7x7 та триватимуть ще _%2$d використань_.
items.weapon.melee.crossbow.ability_name=заряджений постріл
items.weapon.melee.crossbow.desc=Досить складна зброя, яка стріляє болтами з надзвичайною швидкістю. Хоча він не призначений для цього, вага та міцна конструкція цього арбалета роблять його також непоганою зброєю ближнього бою.
items.weapon.melee.crossbow.name=арбалет
items.weapon.melee.crossbow.stats_desc=Ця зброя посилює кинуті дротики, завдаючи _%1$d-%2$d шкоди_, коли вона екіпірована, і навіть накладає на них свої чари.
items.weapon.melee.crossbow.typical_ability_desc=Дуелянтка може _зарядити_ свій арбалет, завдяки чому її наступна звичайна атака ним завжди влучатиме та застосовуватиме один із трьох ефектів: атаки ближнього бою відкидатимуть ворогів, дротики без наконечника зазвичай завдаватимуть _+%1$d шкоди_, а дротики з наконечником застосовуватимуть свій ефект у зоні 7x7 і зазвичай триватимуть _%2$d додаткових використань_.
items.weapon.melee.crossbow.typical_stats_desc=Зазвичай ця зброя посилює кинуті дротики, завдаючи _%1$d-%2$d шкоди_, коли вона екіпірована, і навіть накладає на них свої чари.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Підвищення здібностей
items.weapon.melee.cudgel.ability_desc=Дуелянт може завдати _сильного удару_ палицею. Ця концентрована атака завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.cudgel.ability_name=сильний удар
items.weapon.melee.cudgel.desc=Невелика латунна булава, виготовлена радше як засіб самооборони для дворян, ніж як зброя для шукачів пригод.
items.weapon.melee.cudgel.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.cudgel.name=дубинка
items.weapon.melee.cudgel.stats_desc=Це досить точна зброя.
items.weapon.melee.cudgel.typical_ability_desc=Дуелянт може завдати _сильного удару_ палицею. Ця концентрована атака зазвичай завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.dagger.ability_desc=Дуелянт може _підкрадатися_, тримаючи кинджала. Ця здатність дозволяє Дуелянту миттєво моргнути на відстань до 5 клітинок та надає йому _%d ходи невидимості._
items.weapon.melee.dagger.ability_name=підкрадатися
items.weapon.melee.dagger.desc=Простий залізний кинджал із зношеною дерев'яною ручкою.
items.weapon.melee.dagger.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.dagger.name=кинджал
items.weapon.melee.dagger.stats_desc=Ця зброя сильніша проти непідготовлених ворогів.
items.weapon.melee.dagger.typical_ability_desc=Дуелянт може _підкрадатися_, тримаючи кинджала. Ця здатність дозволяє Дуелянту миттєво віддалятися на відстані до 5 клітинок і зазвичай надає йому _%d ходи невидимості._
items.weapon.melee.dagger.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.dirk.ability_desc=Дуелянт може _підкрадатися_, тримаючи кортик. Ця здатність дозволяє йому миттєво віддалятися на відстані до 4 клітинок та надає йому _%d ходи невидимості._
items.weapon.melee.dirk.ability_name=підкрадатися
items.weapon.melee.dirk.desc=Довший колючий кинджал дає трохи більше сталі, щоб занурюватися у ворогів.
items.weapon.melee.dirk.name=кортик
items.weapon.melee.dirk.stats_desc=Ця зброя сильніша проти непідготовлених ворогів.
items.weapon.melee.dirk.typical_ability_desc=Дуелянт може _підкрадатися_, тримаючи кортик. Ця здатність дозволяє дуелянту миттєво віддалятися на відстані до 4 клітинок і зазвичай надає йому _%d ходи невидимості._
items.weapon.melee.dirk.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.flail$spinabilitytracker.desc=Дуелянтка обертає свій ціп, накопичуючи шкоду для наступної звичайної атаки ним. Кожне обертання займає один хід, але збільшує шкоду, максимум до трьох обертань. Ціп також гарантовано влучає під час обертання.\n\nПоточні обертання: %1$d%%.\nХоди, що залишилися: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=спінінг
items.weapon.melee.flail.ability_desc=Дуелянт може _закручувати_ ціп, щоб на короткий час накопичити силу. З кожним ходу обертання ціпа він завдає _+%d шкоди_ під час наступної звичайної атаки, максимум 3 рази. Ціп, що обертається, також гарантовано влучає. Лише початок обертання ціпа коштує заряду.
items.weapon.melee.flail.ability_name=обертання
items.weapon.melee.flail.desc=Шипаста куля, прикріплена до ручки довгим ланцюгом. Дуже громіздка, але руйнівна, якщо влучить сильно.
items.weapon.melee.flail.name=ціп
items.weapon.melee.flail.spin_warn=Більше не можна крутити ціп.
items.weapon.melee.flail.stats_desc=Це досить неточна зброя. \nЦя зброя не може завдати несподіваної атаки.
items.weapon.melee.flail.typical_ability_desc=Дуелянт може _закручувати_ ціп, щоб на короткий час накопичити силу. За кожен хід обертання ціпа він зазвичай завдає _+%d шкоди_ під час наступної звичайної атаки, максимум 3 рази. Ціп, що обертається, також гарантовано влучає. Лише початок обертання ціпа коштує заряду.
items.weapon.melee.gauntlet.ability_desc=Дуелянт може виконати _комбо-удари_ кам'яною рукавицею. Ця атака гарантовано влучає та завдає _+%d шкоди_ за кожен удар дуелянта звичайною рукопашною або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.gauntlet.ability_name=комбінований удар
items.weapon.melee.gauntlet.desc=Ця масивна рукавиця виготовлена з малинової тканини, зверху якої нанесено шар важкого магічного каменю. Тканина щільніше облягає вас, роблячи товсті кам'яні пластини майже як другу шкіру. Розмахування такою важкою зброєю вимагає сили, але додає величезної потужності вашим ударам.
items.weapon.melee.gauntlet.name=кам'яна рукавиця
items.weapon.melee.gauntlet.stats_desc=Це дуже швидка зброя.
items.weapon.melee.gauntlet.typical_ability_desc=Дуелянт може виконати _комбо-удари_ кам'яною рукавицею. Ця атака гарантовано вражає та зазвичай завдає _+%d шкоди_ за кожен удар дуелянта звичайною рукопашною або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.glaive.ability_desc=Дуелянт може використати кінчик глефи, щоб _проткнути_ ворога, який знаходиться в зоні досяжності, але не поруч. Це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.glaive.ability_name=шип
items.weapon.melee.glaive.desc=Масивна древкова зброя, що складається з леза меча на кінці древка.
items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Це досить повільна зброя. \nЦя зброя має додаткову досяжність.
items.weapon.melee.glaive.typical_ability_desc=Дуелянт може використати кінчик глефи, щоб _проткнути_ ворога, який знаходиться в зоні досяжності, але не поруч. Зазвичай це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.gloves.ability_desc=Дуелянт може виконати _комбо-удари_ за допомогою рукавичок з шипами. Ця атака гарантовано влучає та завдає _+%d шкоди_ за кожен удар дуелянта звичайною рукопашною або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.gloves.ability_name=комбінований удар
items.weapon.melee.gloves.desc=Ці рукавички з шипами не забезпечують жодного реального захисту, але вони діють як корисна зброя, зберігаючи руки вільними.
items.weapon.melee.gloves.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.gloves.name=рукавички з шипами
items.weapon.melee.gloves.stats_desc=Це дуже швидка зброя.
items.weapon.melee.gloves.typical_ability_desc=Дуелянт може виконувати _комбо-удари_ за допомогою рукавичок з шипами. Ця атака гарантовано вражає та зазвичай завдає _+%d шкоди_ за кожен удар дуелянта звичайною рукопашною або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.greataxe.ability_desc=Дуелянт може виконати атаку _відплати_ великою сокирою, якщо його здоров'я менше 50%%. Ця руйнівна атака завдає _%1$d-%2$d шкоди,_ гарантовано влучає та діє миттєво, якщо вбиває ворога.
items.weapon.melee.greataxe.ability_name=відплата
items.weapon.melee.greataxe.desc=Ця титанічна сокира, призначена для носіння через плече, така ж потужна, як і важка.
items.weapon.melee.greataxe.name=велика сокира
items.weapon.melee.greataxe.stats_desc=Ця зброя неймовірно важка.
items.weapon.melee.greataxe.typical_ability_desc=Дуелянт може виконати атаку _відплати_ великою сокирою, якщо його здоров'я менше 50%%. Ця руйнівна атака зазвичай завдає _%1$d-%2$d шкоди,_ гарантовано влучає та діє миттєво, якщо вбиває ворога.
items.weapon.melee.greatshield.ability_desc=Дуелянт може _захищатися_ великим щитом, повністю нейтралізуючи всі фізичні або магічні атаки, спрямовані проти нього, протягом _%d ходів_. Як тільки Дуелянт заблокує атаку, атака у відповідь або використання магії припинить захист.
items.weapon.melee.greatshield.ability_name=охоронець
items.weapon.melee.greatshield.desc=Ця гігантська маса металу, більше схожа на мобільну стіну, ніж на щит, допомагає в обороні, але не залишає багато місця для атаки.
items.weapon.melee.greatshield.name=великий щит
items.weapon.melee.greatshield.stats_desc=Ця зброя блокує пошкодження від 0 до %d. Це блокування масштабується залежно від покращень.
items.weapon.melee.greatshield.typical_ability_desc=Дуелянт може _захищатися_ великим щитом, повністю нейтралізуючи всі фізичні або магічні атаки, спрямовані проти нього, зазвичай протягом _%d ходів_. Як тільки Дуелянт заблокує атаку, атака у відповідь або використання магії припинить захист.
items.weapon.melee.greatshield.typical_stats_desc=Зазвичай ця зброя блокує пошкодження від 0 до %d. Це блокування масштабується залежно від покращень.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.greatsword.ability_desc=Дуелянт може _розсікти_ ворога дворучним мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.greatsword.ability_name=розщеплювати
items.weapon.melee.greatsword.desc=Це височенне лезо завдає сильної шкоди, вкладаючи свою вагу в кожен замах.
items.weapon.melee.greatsword.name=дворучний меч
items.weapon.melee.greatsword.typical_ability_desc=Дуелянт може _розсікти_ ворога дворучним мечем. Зазвичай це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.handaxe.ability_desc=Дуелянт може завдати _сильного удару_ ручною сокирою. Ця концентрована атака завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.handaxe.ability_name=сильний удар
items.weapon.melee.handaxe.desc=Легка сокира, яку найчастіше використовують для рубки дерев. Широке лезо також добре працює проти ворогів.
items.weapon.melee.handaxe.name=ручна сокира
items.weapon.melee.handaxe.stats_desc=Це досить точна зброя.
items.weapon.melee.handaxe.typical_ability_desc=Дуелянт може завдати _сильного удару_ ручною сокирою. Ця концентрована атака зазвичай завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.katana.ability_desc=Дуелянт може _здійснити_ кидок катаною на ворога на відстані 1 клітинки. Це рухається до ворога, завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.katana.ability_name=випад
items.weapon.melee.katana.desc=Тонкий меч з великою металевою гардою над рукояткою.
items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Ця зброя блокує 0-3 одиниці шкоди.
items.weapon.melee.katana.typical_ability_desc=Дуелянт може _здійснити_ _кидок_ катаною на ворога на відстані 1 клітинки. Він рухається до ворога, зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.longsword.ability_desc=Дуелянт може _розсікти_ ворога довгим мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.longsword.ability_name=розщеплювати
items.weapon.melee.longsword.desc=Довге, гостре, як бритва, сталеве лезо цього меча заспокійливо блищить, хоча його розмір робить його досить важким.
items.weapon.melee.longsword.name=довгий меч
items.weapon.melee.longsword.typical_ability_desc=Дуелянт може _розсікти_ ворога довгим мечем. Зазвичай це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.mace.ability_desc=Дуелянт може завдати _сильного удару_ булавою. Ця концентрована атака завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.mace.ability_name=сильний удар
items.weapon.melee.mace.desc=Велика залізна головка цієї зброї завдає значної шкоди.
items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Це досить точна зброя.
items.weapon.melee.mace.typical_ability_desc=Дуелянт може завдати _сильного удару_ булавою. Ця концентрована атака зазвичай завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.magesstaff.ac_imbue=ПРОСТОЧИТИ
items.weapon.melee.magesstaff.ac_zap=ЗАП
items.weapon.melee.magesstaff.cursed_wand=Посох проклятий, що робить його магію хаотичною та випадковою.
items.weapon.melee.magesstaff.desc=Виготовлений самим Магом, цей посох — унікальна магічна зброя, яку можна наповнити чарівною паличкою.
items.weapon.melee.magesstaff.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.magesstaff.has_wand=Персонал наразі наповнений _%s._.
items.weapon.melee.magesstaff.imbue=Ви насичуєте своїх співробітників %s.
items.weapon.melee.magesstaff.imbue_cursed=_Якщо ви наповните прокляту паличку, то ваш посох також стане проклятим!_
items.weapon.melee.magesstaff.imbue_desc=Ви впевнені, що хочете наділити свій посох цією паличкою?\n\nЯкщо паличка, яку насичують, має той самий або вищий рівень, що й посох, посох успадкує рівень цієї палички плюс одне з її власних покращень.
items.weapon.melee.magesstaff.imbue_level=Це насичення призведе до створення посох _+%d._
items.weapon.melee.magesstaff.imbue_lost=Паличка, якою зараз наповнений ваш посох, _буде втрачена_.
items.weapon.melee.magesstaff.imbue_talent=Паличка, якою зараз наповнений ваш посох, _буде повернута о +0_.
items.weapon.melee.magesstaff.imbue_unknown=Ви не знаєте рівня цієї палички, але це насичення призведе до створення щонайменше посох _+%d._
items.weapon.melee.magesstaff.name=посох мага
items.weapon.melee.magesstaff.no=Ні, я передумав/передумала.
items.weapon.melee.magesstaff.no_wand=Посох наразі не має магії, його потрібно _наповнити силою чарівної палички_, перш ніж його можна буде використовувати для накладання заклинань.
items.weapon.melee.magesstaff.preserved=Попередня паличка збереглася!
items.weapon.melee.magesstaff.prompt=Виберіть паличку
items.weapon.melee.magesstaff.yes=Так, я впевнений/впевнена
items.weapon.melee.meleeweapon.ability_cant_use=Ти не можеш зараз скористатися цією здатністю.
items.weapon.melee.meleeweapon.ability_low_str=Ти недостатньо сильний, щоб скористатися здатністю цієї зброї.
items.weapon.melee.meleeweapon.ability_need_equip=Ви повинні екіпірувати цю зброю, щоб використовувати її здатність.
items.weapon.melee.meleeweapon.ability_no_charge=У тебе недостатньо енергії, щоб скористатися цією здатністю.
items.weapon.melee.meleeweapon.ability_no_target=Там немає цілі.
