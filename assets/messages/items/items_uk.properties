items.artifacts.lloydsbeacon.creatures=Психічна аура сусідніх істот не дозволяє вам використовувати маяк Ллойда на даний момент.
items.artifacts.lloydsbeacon.desc=Маяк Ллойда — це складний магічний пристрій, який надає користувачеві контроль над магією телепортації. Маяк можна використовувати для повернення у визначене місце, але він також може випускати випадкові магічні ефекти телепортації після заряджання з екіпірування. Цю магію можна спрямувати на ціль або на самого користувача.
items.artifacts.lloydsbeacon.desc_set=Цей маяк був встановлений десь на рівні %d у Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Ваш маяк стає сильнішим!
items.artifacts.lloydsbeacon.name=маяк Ллойда
items.artifacts.lloydsbeacon.no_charge=Вашому маяку зараз недостатньо енергії.
items.artifacts.lloydsbeacon.preventing=Сильна магічна аура цього місця заважає вам використовувати маяк Ллойда!
items.artifacts.lloydsbeacon.prompt=Виберіть місце для удару струмом.
items.artifacts.lloydsbeacon.return=Маяк Ллойда успішно встановлено у вашому поточному місці, тепер ви можете повернутися сюди будь-коли.
items.artifacts.lloydsbeacon.tele_fail=Магія телепортації не спрацьовує.
items.artifacts.masterthievesarmband.ac_steal=КРАДІТИ
items.artifacts.masterthievesarmband.cursed=Не можна використовувати прокляту пов'язку.
items.artifacts.masterthievesarmband.desc=Ця фіолетова оксамитова пов'язка має клеймо майстра-злодія. Вона не належить тобі, але, ймовірно, не належала й попередньому користувачеві.
items.artifacts.masterthievesarmband.desc_cursed=Проклята пов'язка прив'язана до твого зап'ястя, і якимось чином твій мішечок із золотом потроху стає легшим...
items.artifacts.masterthievesarmband.desc_worn=Ви відчуваєте, як сила наростає в браслеті на вашому зап'ясті, коли ви отримуєте досвід. Ви можете використовувати цю здатність, щоб красти з магазинів або грабувати ворогів!\n\nПограбування ворогів відбувається миттєво, ненадовго дезорієнтує їх і дає вам шанс отримати будь-яку здобич, яку вони мають! Ця здатність ефективніша проти непідозрілих ворогів. Пограбування одного й того ж ворога кілька разів не дає більше шансів на здобич.
items.artifacts.masterthievesarmband.failed_steal=Тобі нічого не вдалося вкрасти.
items.artifacts.masterthievesarmband.full=Ваш браслет повністю заряджений!
items.artifacts.masterthievesarmband.level_up=Твоя пов'язка стає міцнішою!
items.artifacts.masterthievesarmband.name=пов'язка майстра-злодію
items.artifacts.masterthievesarmband.no_charge=Ваш браслет недостатньо заряджений.
items.artifacts.masterthievesarmband.no_steal=Цьому ворогу нема чого красти.
items.artifacts.masterthievesarmband.no_target=Ви повинні цільитися на ворога, який знаходиться поруч з вами.
items.artifacts.masterthievesarmband.prompt=Виберіть ворога для цілі
items.artifacts.masterthievesarmband.steal_shopkeeper=Ви не можете красти безпосередньо у власників магазинів.
items.artifacts.masterthievesarmband.stole_item=Ви вкрали предмет: %s.
items.artifacts.sandalsofnature.absorb_seed=Взуття вбирає насіння, воно виглядає здоровішим.
items.artifacts.sandalsofnature.ac_feed=ПОДАЧА
items.artifacts.sandalsofnature.ac_root=КОРІНЬ
items.artifacts.sandalsofnature.desc_1=Те, що спочатку здається сандаліями, зробленими зі шпагату, насправді є двома рослинами! Вони здаються дуже слабкими та блідими, можливо, їм потрібно давати поживні речовини?
items.artifacts.sandalsofnature.desc_2=Взуття виросло і тепер більше нагадує два черевики, зроблені на замовлення. До них повернувся певний колір, можливо, вони ще можуть вирости?
items.artifacts.sandalsofnature.desc_3=Рослини знову виросли і тепер нагадують пару міцних чобіт, зроблених з кори. Здається, рослини відновили свою силу, але, можливо, вони все ще можуть рости далі?
items.artifacts.sandalsofnature.desc_4=Рослини, здається, досягли свого максимального розміру, вони нагадують пару панцирних наголівників. Наголівники насичено-коричневого кольору та нагадують дуже міцне дерево.
items.artifacts.sandalsofnature.desc_ability=Взуття переливається кольором останнього насіння, яким ви його згодували. Вони можуть ненадовго вкорінитися в землі та створити ефект цієї рослини будь-де в радіусі 3 клітинок.\nНасіння: _%s_\nНеобхідний заряд: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Прокляті сандалі блокують будь-яке налаштування на природу.
items.artifacts.sandalsofnature.desc_hint=Носячи цей артефакт, ви відчуваєте більшу гармонію з природою.
items.artifacts.sandalsofnature.desc_seeds=Ви підсіяли взуття насінням %d.
items.artifacts.sandalsofnature.levelup=Ваше взуття збільшується в розмірі!
items.artifacts.sandalsofnature.low_charge=Ваше взуття не має для цього достатньо енергії.
