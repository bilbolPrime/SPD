items.artifacts.hornofplenty.desc=У цей ріг не можна подути, він наповнюється їжею під час пригод та набуття досвіду. Ви можете споживати кожен заряд окремо як перекус або їсти, поки не насититеся.
items.artifacts.hornofplenty.desc_cursed=Проклятий ріг прив'язався до тебе, здається, він прагне їсти більше, ніж виробляти її.
items.artifacts.hornofplenty.desc_hint=Можливо, є спосіб збільшити силу рогу, давши йому харчову енергію.
items.artifacts.hornofplenty.eat=Ти їси з рогу.
items.artifacts.hornofplenty.feed=Ріг поглинає твою жертву.
items.artifacts.hornofplenty.full=Твій ріг повний їжі!
items.artifacts.hornofplenty.levelup=Ріг поглинає твою жертву і міцніє!
items.artifacts.hornofplenty.maxlevel=Твій ріг з'їв усю їжу, яку міг з'їсти!
items.artifacts.hornofplenty.name=ріг достатку
items.artifacts.hornofplenty.no_food=У твоєму рогу немає їжі!
items.artifacts.hornofplenty.prompt=Виберіть якусь їжу
items.artifacts.hornofplenty.reject=Твій ріг відкидає сирі прісні плоди.
