items.weapon.melee.meleeweapon.ac_ability=ЗДІБНІСТЬ
items.weapon.melee.meleeweapon.probably_too_heavy=Мабуть, ця зброя занадто важка для тебе.
items.weapon.melee.meleeweapon.prompt=Виберіть ціль
items.weapon.melee.meleeweapon.stats_known=Ця зброя ближнього бою _рівня-%1$d_ завдає _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для правильного використання.
items.weapon.melee.meleeweapon.stats_unknown=Зазвичай ця зброя ближнього бою _рівня-%1$d_ завдає _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для правильного використання.
items.weapon.melee.meleeweapon.swap=Обмін зброєю
items.weapon.melee.meleeweapon.swap_full=Ви не можете цього зробити з повним інвентаризаційним списком.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Шкода від здібностей
items.weapon.melee.quarterstaff$defensivestance.desc=Дуелянтка використовує свій посох, щоб відбивати удари та снаряди. Поки вона перебуває в цій стійці, її ухилення від усіх атак потроюється. \n\nХодів залишилося: %s.
items.weapon.melee.quarterstaff$defensivestance.name=захисна позиція
items.weapon.melee.quarterstaff.ability_desc=Дуелянт може прийняти _захисну стійку_ з посохом. Ця стійка активується миттєво та потроює її ухилення протягом ходів _%d._
items.weapon.melee.quarterstaff.ability_name=захисна позиція
items.weapon.melee.quarterstaff.desc=Палиця з твердих порід дерева, кінці її ковані залізом.
items.weapon.melee.quarterstaff.name=посох
items.weapon.melee.quarterstaff.stats_desc=Ця зброя блокує 0-2 пошкодження.
items.weapon.melee.quarterstaff.typical_ability_desc=Дуелянт може прийняти _захисну стійку_ з посохом. Ця стійка активується миттєво та зазвичай потроює її ухилення протягом ходів _%d._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.rapier.ability_desc=Дуелянт може _здійснити_ _випад_ рапірою на ворога на відстані 1 клітинки. Це рухається до ворога, завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.rapier.ability_name=випад
items.weapon.melee.rapier.desc=Тонкий прямий меч, який пропонує певний захист в обмін на меншу рубаючу силу.
items.weapon.melee.rapier.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.rapier.name=рапіра
items.weapon.melee.rapier.stats_desc=Ця зброя блокує 0-1 пошкоджень.
items.weapon.melee.rapier.typical_ability_desc=Дуелянт може _здійснити_ _випад_ рапірою на ворога на відстані 1 клітинки. Це рухається до ворога, зазвичай завдає _%1$d-%2$d шкоди_ та гарантовано влучає.
items.weapon.melee.roundshield$guardtracker.desc=Дуелянтка приготувала свій щит в очікуванні майбутніх атак. Фізичні або магічні атаки, спрямовані проти неї, будуть повністю нейтралізовані. \n\nХодів залишилося: %s.
items.weapon.melee.roundshield$guardtracker.guarded=охороняється
items.weapon.melee.roundshield$guardtracker.name=охорона
items.weapon.melee.roundshield.ability_desc=Дуелянт може _захищатися_ круглим щитом, повністю нейтралізуючи всі фізичні або магічні атаки, спрямовані проти нього, протягом _%d ходів_. Як тільки Дуелянт заблокує атаку, атака у відповідь або використання магії припинить захист.
items.weapon.melee.roundshield.ability_name=охоронець
items.weapon.melee.roundshield.desc=Цей великий щит ефективно блокує атаки та є непоганою зброєю в скрутну хвилину.
items.weapon.melee.roundshield.name=круглий щит
items.weapon.melee.roundshield.stats_desc=Ця зброя блокує пошкодження від 0 до %d. Це блокування масштабується залежно від покращень.
items.weapon.melee.roundshield.typical_ability_desc=Дуелянт може _захищатися_ круглим щитом, повністю нейтралізуючи всі фізичні або магічні атаки, спрямовані проти нього, зазвичай протягом ходів _%d_. Як тільки Дуелянт заблокує атаку, атака у відповідь або використання магії припинить захист.
items.weapon.melee.roundshield.typical_stats_desc=Зазвичай ця зброя блокує пошкодження від 0 до %d. Це блокування масштабується залежно від покращень.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.runicblade.ability_desc=Дуелянт може виконати _рунічний удар_ рунічним клинком. Ця атака гарантовано вражає та має силу зачарування _+%d%%._
items.weapon.melee.runicblade.ability_name=рунічна коса лінія
items.weapon.melee.runicblade.desc=Таємнича зброя з далекої країни, з яскраво-синім лезом.
items.weapon.melee.runicblade.name=рунічне лезо
items.weapon.melee.runicblade.stats_desc=Ця зброя отримує більше переваг від покращень.
items.weapon.melee.runicblade.typical_ability_desc=Дуелянт може виконати _рунічний удар_ рунічним клинком. Ця атака гарантовано вражає і зазвичай має силу зачарування _+%d%%._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Сила здібностей
items.weapon.melee.sai$combostriketracker.desc=Дуелянт створює комбо, яке можна використовувати для збільшення шкоди від здатності комбо-удару. Кожна успішна атака звичайною рукопашною або кидковою зброєю буде зарахована, але якщо атака не буде успішною протягом 5 ходів, це комбо скинеться. \n\nНедавні влучання: %1$d.\n\nХоди до втрати влучань: %2$s.
items.weapon.melee.sai$combostriketracker.name=комбінований удар
items.weapon.melee.sai.ability_desc=Дуелянт може виконати _комбо-ударк_ за допомогою саю. Ця атака гарантовано влучає та завдає _+%d шкоди_ за кожен раз, коли Дуелянт влучає звичайною атакою ближнього бою або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.sai.ability_name=комбінований удар
items.weapon.melee.sai.desc=Два тонких леза, призначені для тримання в одній руці. Чудово підходять для знищення ворогів шквалом ударів.
items.weapon.melee.sai.name=сай
items.weapon.melee.sai.stats_desc=Це дуже швидка зброя.
items.weapon.melee.sai.typical_ability_desc=Дуелянт може виконати _комбо-ударк_ за допомогою саю. Ця атака гарантовано влучає і зазвичай завдає _+%d шкоди_ за кожен раз, коли Дуелянт влучає звичайною атакою ближнього бою або кидковою зброєю. Якщо дуелянт не влучає протягом 5 ходів, це комбо скидається.
items.weapon.melee.scimitar$sworddance.desc=Дуелянтка виконує швидкі удари на основі імпульсу, ніби танцюючи. Поки ця стійка активна, вона атакує на 60%% швидше (достатньо, щоб атакувати рівно двічі за хід ятаганом) та має +50%% точність.\n\nХоди залишилися: %s.
items.weapon.melee.scimitar$sworddance.name=танець з мечами
items.weapon.melee.scimitar.ability_desc=Дуелянт може виконувати _танець мечів_ зі сцимітаром. Ця стійка активується миттєво та надає Дуелянту +60%% до швидкості атаки та +50%% до точності протягом _%d ходів._
items.weapon.melee.scimitar.ability_name=танець з мечами
items.weapon.melee.scimitar.desc=Товсте вигнуте лезо. Його форма дозволяє здійснювати швидші, але менш потужні атаки.
items.weapon.melee.scimitar.name=ятаган
items.weapon.melee.scimitar.stats_desc=Це досить швидка зброя.
items.weapon.melee.scimitar.typical_ability_desc=Дуелянт може виконувати _танець мечів_ зі сцимітаром. Ця стійка активується миттєво та надає Дуелянту +60%% до швидкості атаки та +50%% до точності, зазвичай протягом _%d ходів._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Тривалість здібності
items.weapon.melee.shortsword.ability_desc=Дуелянт може _розсікти_ ворога коротким мечем. Це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.shortsword.ability_name=розщеплювати
items.weapon.melee.shortsword.desc=Досить короткий меч, лише на кілька дюймів довший за кинджал.
items.weapon.melee.shortsword.name=короткий меч
items.weapon.melee.shortsword.typical_ability_desc=Дуелянт може _розсікти_ ворога коротким мечем. Зазвичай це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.sickle.ability_desc=Дуелянт може _зібрати_ у ворога серп. Ця руйнівна атака гарантовано вражає та завдає _%d шкоди_. Ця шкода застосовується у вигляді кровотечі, якщо ціль не має імунітету.
items.weapon.melee.sickle.ability_name=урожай
items.weapon.melee.sickle.desc=Ручний сільськогосподарський інструмент, який може бути водночас потужною, але громіздкою зброєю.
items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=Це досить неточна зброя.
items.weapon.melee.sickle.typical_ability_desc=Дуелянт може _зібрати_ у ворога серп. Ця руйнівна атака гарантовано вражає та зазвичай завдає _%d шкоди_. Ця шкода застосовується у вигляді кровотечі, якщо ціль не має імунітету.
items.weapon.melee.spear.ability_desc=Дуелянт може використати кінчик списа, щоб _проткнути_ ворога, який знаходиться в зоні досяжності, але не поруч. Це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.spear.ability_name=шип
items.weapon.melee.spear.desc=Тонкий дерев'яний стрижень з загостреним залізним кінчиком.
items.weapon.melee.spear.name=спис
items.weapon.melee.spear.stats_desc=Це досить повільна зброя. \nЦя зброя має додаткову досяжність.
items.weapon.melee.spear.typical_ability_desc=Дуелянт може використати кінчик списа, щоб _проткнути_ ворога, який знаходиться в зоні досяжності, але не поруч. Зазвичай це завдає _%1$d-%2$d шкоди_, відкидає ворога назад і гарантовано влучає.
items.weapon.melee.sword$cleavetracker.desc=Дуелянтка готова продовжити свій попередній розсікаючий удар. Наступне використання розсікаючого удару не коштуватиме заряду зброї. \n\nХодів залишилося: %s.
items.weapon.melee.sword$cleavetracker.name=розщеплювати
items.weapon.melee.sword.ability_desc=Дуелянт може _розсікти_ ворога мечем. Це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.sword.ability_name=розщеплювати
items.weapon.melee.sword.desc=Добре збалансований меч. Не надто великий, але все ж помітно довший за короткий меч.
items.weapon.melee.sword.name=меч
items.weapon.melee.sword.typical_ability_desc=Дуелянт може _розсікати_ ворога мечем. Зазвичай це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.melee.warhammer.ability_desc=Дуелянт може завдати _сильного удару_ бойовим молотом. Ця концентрована атака завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.warhammer.ability_name=сильний удар
items.weapon.melee.warhammer.desc=Мало які істоти можуть витримати нищівний удар цієї величної маси свинцю та сталі, але для ефективного використання потрібна величезна сила.
items.weapon.melee.warhammer.name=бойовий молот
items.weapon.melee.warhammer.stats_desc=Це досить точна зброя.
items.weapon.melee.warhammer.typical_ability_desc=Дуелянт може завдати _сильного удару_ бойовим молотом. Ця концентрована атака зазвичай завдає _%1$d-%2$d шкоди_, якщо застає ворога зненацька, і приголомшує його на 5 ходів, що зменшує точність та ухилення на 50%%. Сильний удар завжди влучає, але завдає звичайної шкоди, якщо не застає ворога зненацька.
items.weapon.melee.warscythe.ability_desc=Дуелянт може _зібрати_ у ворога бойовою косою. Ця руйнівна атака гарантовано вражає та завдає _%d шкоди_. Ця шкода застосовується у вигляді кровотечі, якщо ціль не має імунітету.
items.weapon.melee.warscythe.ability_name=урожай
items.weapon.melee.warscythe.desc=Цей великий і громіздкий інструмент був посилений, щоб він краще рубав ворогів, ніж посіви.
items.weapon.melee.warscythe.name=бойова коса
items.weapon.melee.warscythe.stats_desc=Це досить неточна зброя.
items.weapon.melee.warscythe.typical_ability_desc=Дуелянт може _зібрати_ у ворога бойовою косою. Ця руйнівна атака гарантовано вражає та зазвичай завдає _%d шкоди_. Ця шкода застосовується у вигляді кровотечі, якщо ціль не має імунітету.
items.weapon.melee.whip.ability_desc=Дуелянт може _відшмагати_ всіх ворогів навколо себе батогом. Ця здатність завдає _%1$d-%2$d шкоди_, атакує всіх ворогів у межах досяжності атаки та гарантовано влучає.
items.weapon.melee.whip.ability_name=вія
items.weapon.melee.whip.desc=Хоча колюча мотузка на кінці цієї зброї завдає мало шкоди, її досяжність незрівнянна.
items.weapon.melee.whip.name=батіг
items.weapon.melee.whip.stats_desc=Ця зброя має величезну дальність дії.
items.weapon.melee.whip.typical_ability_desc=Дуелянт може _відшмагати_ всіх ворогів навколо себе батогом. Ця здатність зазвичай завдає _%1$d-%2$d шкоди_, атакує всіх ворогів у межах досяжності атаки та гарантовано влучає.
items.weapon.melee.wornshortsword.ability_desc=Дуелянт може _розсікти_ ворога зношеним коротким мечем. Це завдає _%1$d-%2$d шкоди_ та гарантовано влучає. Якщо заклинання вбиває ворога, це відбувається миттєво, і Дуелянт може використати його знову протягом 5 ходів безкоштовно.
items.weapon.melee.wornshortsword.ability_name=розщеплювати
items.weapon.melee.wornshortsword.desc=Досить короткий меч, зношений від інтенсивного використання. Він водночас слабший і трохи легший за короткий меч у кращому стані.
items.weapon.melee.wornshortsword.discover_hint=Один з героїв починає з цього предмета.
items.weapon.melee.wornshortsword.name=зношений короткий меч
items.weapon.melee.wornshortsword.typical_ability_desc=Дуелянт може _розсікти_ ворога зношеним коротким мечем. Зазвичай це завдає _%1$d-%2$d шкоди_ і гарантовано влучає. Якщо розсікання вбиває ворога, це відбувається миттєво, і Дуелянт може використати розсікання знову протягом 5 ходів безкоштовно.
items.weapon.missiles.bolas.desc=Ця незвичайна зброя дальнього бою не завдає великої шкоди, але чудово уповільнює ціль.
items.weapon.missiles.bolas.name=болас
items.weapon.missiles.bolas.stats_desc=Ця зброя завдає каліцтва цілі.
items.weapon.missiles.boomerang.desc=Кинута ворогові, ця плоска вигнута дерев'яна ракета повернеться в руки того, хто її кинув.
items.weapon.missiles.boomerang.durability=Завдяки своїй міцній конструкції, цей бумеранг не зламається від використання.
items.weapon.missiles.boomerang.name=бумеранг
items.weapon.missiles.darts.adrenalinedart.desc=Ці дротики мають наконечники зі складом на основі швидкої будячки, який підвищує швидкість пересування та атаки союзників або ненадовго знижує швидкість пересування ворогів. Сам дротик все ще шкідливий для ворогів, але не завдасть шкоди союзникам.
items.weapon.missiles.darts.adrenalinedart.name=адреналіновий дротик
items.weapon.missiles.darts.blindingdart.desc=Ці дротики мають наконечники зі складом на основі сліпої трави, який на короткий час засліплює ціль. Однак вони не дезорієнтують, тому ворог все одно знатиме, де він вас бачив востаннє.
items.weapon.missiles.darts.blindingdart.name=сліпуча стріла
items.weapon.missiles.darts.chillingdart.desc=Ці дротики мають наконечники з матеріалу на основі крижаних шапок, який значно охолоджує ціль.
items.weapon.missiles.darts.chillingdart.name=холодний дротик
items.weapon.missiles.darts.cleansingdart.desc=Ці дротики мають наконечники зі сполуки на основі магероялу, яка тимчасово зробить союзників невразливими до всіх негативних ефектів або очистить ворогів від позитивних. Вороги можуть навіть ненадовго забути, що вони атакують або тікають від вас. Сама дротик все ще шкідлива для ворогів, але не завдасть шкоди союзникам.
items.weapon.missiles.darts.cleansingdart.name=очищувальний дротик
items.weapon.missiles.darts.dart.ac_tip=ПОРАДА
items.weapon.missiles.darts.dart.desc=Ці прості дерев'яні стріли з шипами наконечниками мають обтяження, що дозволяє їм летіти прямо та жалити здобич одним рухом зап'ястя. Їх можна насадити насінням на кінчик, щоб отримати бонусні ефекти під час кидка.
items.weapon.missiles.darts.dart.name=дротик
items.weapon.missiles.darts.dart.prompt=Виберіть насіння
items.weapon.missiles.darts.dart.tip_all=дротики %1$d з насінинами %2$d
items.weapon.missiles.darts.dart.tip_cancel=скасувати
items.weapon.missiles.darts.dart.tip_desc=Насінину можна поєднати з одним або двома дротиками, щоб наконечник був у них. Кожен тип насіння створює свій власний тип дротика з наконечником, який має унікальний ефект одноразового використання. \n\nНаконечник дротика цими насінинами створить _%s._
items.weapon.missiles.darts.dart.tip_one=кінчик 1 дротика з 1 зернятком
items.weapon.missiles.darts.dart.tip_title=Тіп Дартс
items.weapon.missiles.darts.dart.tip_two=кінчик 2 дротиків з 1 зернятком
items.weapon.missiles.darts.dart.unlimited_uses=Завдяки своїй простій конструкції, дротики фактично прослужать вічно.
items.weapon.missiles.darts.displacingdart.desc=Ці дротики мають наконечники з речовиною на основі зів'ялого листя, яка телепортує ціль на невелику відстань.
items.weapon.missiles.darts.displacingdart.name=зміщуючий дротик
items.weapon.missiles.darts.healingdart.desc=Ці дротики мають наконечники зі складом на основі сонячної трави, який дає цілі вибух зцілення. Сама дротик все ще шкідлива для ворогів, але не завдасть шкоди союзникам.
items.weapon.missiles.darts.healingdart.name=цілюща стріла
items.weapon.missiles.darts.holydart.desc=Ці дротики мають наконечники зі складом на основі зірчастої квітки, який наповнює ціль святою енергією. Союзники та звичайні вороги стануть благословенними, але нежить або демонічні вороги отримають серйозну шкоду. Сама дротик все ще шкідлива для ворогів, але не завдасть шкоди союзникам.
items.weapon.missiles.darts.holydart.name=святий дротик
items.weapon.missiles.darts.incendiarydart.desc=Ці дротики мають наконечники з вогняного цвіту, який при ударі спалахує яскравим полум'ям.
items.weapon.missiles.darts.incendiarydart.name=запальний дротик
items.weapon.missiles.darts.paralyticdart.desc=Ці дротики мають наконечники з речовиною на основі коренів землі, яка на короткий час паралізує ціль.
items.weapon.missiles.darts.paralyticdart.name=паралітичний дротик
items.weapon.missiles.darts.poisondart.desc=Ці дротики мають наконечники зі складом на основі скорботного моху, який отруює ціль.
items.weapon.missiles.darts.poisondart.name=отруйна стріла
items.weapon.missiles.darts.rotdart.desc=Ці жахливі дротики мають наконечники з кислого складу на основі гнилі, який агресивно роз'їдає все, з чим вони стикаються. Потужні вороги будуть чинити опір більшості ефектів, але корозія достатньо сильна, щоб легко вбити більшість стандартних ворогів. Вони служать довше, ніж інші дротики з наконечниками, але їхню довговічність не можна підвищити.
items.weapon.missiles.darts.rotdart.discover_hint=Ви можете створити цей предмет, використовуючи насіння з певного квесту.
items.weapon.missiles.darts.rotdart.name=гнильний дротик
items.weapon.missiles.darts.shockingdart.desc=Ці дротики мають наконечники з пастою на основі штормової лози, яка завдасть цілі сильного удару струмом.
items.weapon.missiles.darts.shockingdart.name=шокуючий дротик
items.weapon.missiles.darts.tippeddart.about_to_break=Термін придатності наконечника твого дротика скоро закінчиться.
items.weapon.missiles.darts.tippeddart.ac_clean=ЧИСТИЙ
items.weapon.missiles.darts.tippeddart.cancel=скасувати
items.weapon.missiles.darts.tippeddart.clean_all=очистити все
items.weapon.missiles.darts.tippeddart.clean_desc=Ця дія позбавить вас від накипу зерна на ваших дротиках, повернувши їх до звичайних дротиків.
items.weapon.missiles.darts.tippeddart.clean_one=чистий
items.weapon.missiles.darts.tippeddart.clean_title=Чисті дротики
items.weapon.missiles.darts.tippeddart.discover_hint=Ви можете придбати цей предмет у магазині або створити його за допомогою насіння.
items.weapon.missiles.darts.tippeddart.has_broken=Термін придатності наконечника твого дротика закінчився.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Але вони настільки високої якості, що фактично прослужать вічно._
items.weapon.missiles.darts.tippeddart.uses_left=Цей стек дротиків можна використовувати _%d/%d_ разів, перш ніж один наконечник зноситься.
items.weapon.missiles.fishingspear.desc=Крихітні метальні списи, які добре підходять як імпровізована зброя, незважаючи на те, що вони призначені для риболовлі.
items.weapon.missiles.fishingspear.name=рибальський спис
items.weapon.missiles.forcecube.desc=Ці магічні кубики дивної форми достатньо малі, щоб їх можна було тримати в руці, але вони неймовірно важкі.
items.weapon.missiles.forcecube.name=куб сили
items.weapon.missiles.forcecube.ondeath=Ти вбив себе власним Силовим Кубом...
items.weapon.missiles.forcecube.stats_desc=Ця зброя розподіляє силу свого удару по невеликій площі, вражаючи все, що знаходиться поблизу.
items.weapon.missiles.heavyboomerang.desc=Цим великим бумерангом важко ефективно володіти, але він завдає значної шкоди.
items.weapon.missiles.heavyboomerang.name=важкий бумеранг
items.weapon.missiles.heavyboomerang.stats_desc=Ця зброя повертається туди, звідки її було кинуто, через п'ять ходів.
items.weapon.missiles.javelin.desc=Ці більші метальні списи обтяжені, щоб кінчик списа був на передній позиції, коли вони летять у повітрі.
items.weapon.missiles.javelin.name=спис
items.weapon.missiles.kunai.desc=Ці маленькі ножі дуже потужні в руках вмілого користувача.
items.weapon.missiles.kunai.name=кунай
items.weapon.missiles.kunai.stats_desc=Ця зброя сильніша проти непідготовлених ворогів.
items.weapon.missiles.missileweapon$placeholder.name=кинута зброя
items.weapon.missiles.missileweapon.about_to_break=Твоя кинута зброя ось-ось зламається.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Якщо остання кидна зброя з вашого покращеного набору кидкової зброї зламається, набір буде втрачено назавжди. Ви впевнені, що хочете її кинути?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=ні
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=так
items.weapon.missiles.missileweapon.curse_discover=Ця кинута зброя проклята!
items.weapon.missiles.missileweapon.distance=Метальна зброя точніша на відстані, але менш точна зблизька.
items.weapon.missiles.missileweapon.durability=Метальна зброя зношуватиметься та ламатиметься під час використання.
items.weapon.missiles.missileweapon.dust=Кинута зброя розсипається на порох, коли ви до неї торкаєтеся.
items.weapon.missiles.missileweapon.has_broken=Одна з твоїх кидкових зброї зламалася.
items.weapon.missiles.missileweapon.probably_too_heavy=Мабуть, ця зброя занадто важка для тебе.
items.weapon.missiles.missileweapon.stats_known=Цей набір метальної зброї _рівня-%1$d_ завдає _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для використання.
items.weapon.missiles.missileweapon.stats_unknown=Зазвичай цей набір метальної зброї _tier-%1$d_ завдає _%2$d-%3$d шкоди_ та вимагає _%4$d сили_ для використання.
items.weapon.missiles.missileweapon.unknown_uses=Зазвичай цей набір метальної зброї має _%d_ використання, перш ніж одне зламається.
items.weapon.missiles.missileweapon.unlimited_uses=Цей набір настільки високої якості, що він дійсно прослужить вічно.
items.weapon.missiles.missileweapon.uses_left=Цей набір метальної зброї має _%d/%d_ використань, перш ніж одне зламається.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Ви нещодавно миттєво кинули сюрікен і повинні почекати, перш ніж робити це знову. Сюрікени все ще можна кидати, але зі звичайною швидкістю зброї.\n\nХодів залишилося: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Час відновлення сюрікена
items.weapon.missiles.shuriken.desc=Металеві зірочки з гострими як бритва краями завдають значних ран при влучанні. Їх можна метати дуже швидко.
items.weapon.missiles.shuriken.name=сюрикен
items.weapon.missiles.shuriken.stats_desc=Сюрікени можна кидати миттєво з часом відновлення 20 ходів.
items.weapon.missiles.throwingclub.desc=Досить проста, але міцна метальна зброя, по суті великий камінь, прикріплений до палиці.
items.weapon.missiles.throwingclub.name=кидальний клуб
items.weapon.missiles.throwingclub.stats_desc=Ця зброя не прилипає до ворогів і її можна зібрати миттєво.
items.weapon.missiles.throwinghammer.desc=Ці важкі молоти призначені для кидання у ворога. Їхня гладка суцільнометалева конструкція робить їх досить міцними.
items.weapon.missiles.throwinghammer.name=метання молота
items.weapon.missiles.throwinghammer.stats_desc=Ця зброя не прилипає до ворогів і її можна зібрати миттєво.
items.weapon.missiles.throwingknife.desc=Ці легкі ножі збалансовані так, щоб дугоподібно летіти крізь повітря прямо в ціль.
items.weapon.missiles.throwingknife.discover_hint=Один з героїв починає з цього предмета.
items.weapon.missiles.throwingknife.name=метальний ніж
items.weapon.missiles.throwingknife.stats_desc=Ця зброя сильніша проти непідготовлених ворогів.
items.weapon.missiles.throwingspear.desc=Ці легкі списи мають тонкі рами, призначені для метання, а не для колючих ударів.
items.weapon.missiles.throwingspear.name=метання списа
items.weapon.missiles.throwingspike.desc=Ці міцні загострені металеві стріли призначені для метання у ворогів на відстані.
items.weapon.missiles.throwingspike.discover_hint=Один з героїв починає з цього предмета.
items.weapon.missiles.throwingspike.name=кидання шипа
items.weapon.missiles.throwingstone.desc=Це каміння шліфують, щоб його можна було кидати з більшою силою, ніж звичайний камінь.
items.weapon.missiles.throwingstone.discover_hint=Один з героїв починає з цього предмета.
items.weapon.missiles.throwingstone.name=кидання каменю
items.weapon.missiles.tomahawk.desc=Ці метальні сокири мають зазубрене лезо, яке рветься, коли воно впивається у ворога.
items.weapon.missiles.tomahawk.name=томагавк
items.weapon.missiles.tomahawk.stats_desc=Ця зброя завдає цілі _%1$d-%2$d кровотечі_.
items.weapon.missiles.tomahawk.typical_stats_desc=Ця зброя зазвичай завдає _%1$d-%2$d кровотечі_ своїй цілі.
items.weapon.missiles.trident.desc=Масивні метальні списи з трьома смертоносними зубцями на кінці. Вони потужні, але досить важкі.
items.weapon.missiles.trident.name=тризуб
items.weapon.spiritbow.ac_shoot=СТРІЛЯТИ
items.weapon.spiritbow.desc=Лук, виготовлений зі стародавнього магічного дерева. Тятива та гравюри світяться блідо-блакитним світлом. Коли тятиву натягнути, цей лук викликатиме магічну стрілу, яку можна вистрілити у ворога.
items.weapon.spiritbow.discover_hint=Один з героїв починає з цього предмета.
items.weapon.spiritbow.name=дух лук
items.weapon.spiritbow.prompt=Виберіть ціль
items.weapon.spiritbow.stats=Лук не можна безпосередньо покращити, але він поступово міцнішатиме з підвищенням рівня. На вашому поточному рівні стріли, випущені з лука, завдаватимуть _%1$d-%2$d шкоди_ та вимагатимуть _%3$d сили_ для правильного використання.
items.weapon.weapon$enchantment.discover_hint=Ви можете знайти предмет із цим ефектом випадковим чином у підземеллі або спробувати застосувати його до предмета самостійно.
items.weapon.weapon$enchantment.enchant=чари
items.weapon.weapon$enchantment.rankings_desc=Убитий чарами
items.weapon.weapon.cursed=Ви можете відчути зловісну магію, що ховається в цій зброї.
items.weapon.weapon.cursed_worn=Оскільки ця зброя проклята, ти безсилий її зняти.
items.weapon.weapon.enchant_hardened=Його _загартували._
items.weapon.weapon.enchanted=він має _%s._
items.weapon.weapon.excess_str=Через вашу надмірну силу ви завдасте _0-%d додаткової шкоди_ цією зброєю.
items.weapon.weapon.faster=Його доповнено для підвищення _швидкості_.
items.weapon.weapon.hardened_no_enchant=Цю зброю було _загартовано_, але наразі вона не зачарована.
items.weapon.weapon.hardening_gone=Загартування цієї зброї зникло!
items.weapon.weapon.identify=Тепер ви достатньо знайомі зі своєю зброєю, щоб її розпізнати.
items.weapon.weapon.incompatible=Взаємодія різних видів магії знешкодила чари на цій зброї!
items.weapon.weapon.not_cursed=Ця зброя вільна від зловісної магії.
items.weapon.weapon.stronger=Його посилюють для збільшення _шкоди_.
items.weapon.weapon.too_heavy=Через вашу недостатню силу ця зброя завадить вашій швидкості атаки, точності та здатності до несподіваної атаки.
items.weapon.weapon.weak_cursed=Незважаючи на прокляття, ви можете зняти цю зброю з екіпірування.

items.keys.skeletonkey.desc=Цей ключ виглядає серйозно: його головка має форму черепа. Ймовірно, він може відчинити якісь серйозні двері.
items.weapon.missiles.bombarrow.desc=Стріла з прикріпленою бомбою. Тримай дистанцію...
items.weapon.missiles.bombarrow.name=бомбова стріла
items.weapon.missiles.missileweapon.damage_desc=Ця зброя завдає від _%1$d_ до _%2$d_ шкоди за удар.
items.bags.seedpouch.desc=У цьому маленькому оксамитовому мішечку можна зберігати скільки завгодно насіння. Дуже зручно.
items.bags.seedpouch.name=мішечок з насінням
items.potions.potionofmight.desc=Ця потужна рідина розіллється по м'язах, назавжди збільшивши силу на один пункт, а здоров'я — на п'ять.
items.potions.potionofmight.name=Зілля могутності
items.rings.ringofdetection.desc=З цим перснем можна помічати приховані пастки й таємні двері, не витрачаючи часу на пошуки. Ослаблені персні виявлення притуплюють чуття, тож знаходити таємниці стає важче навіть під час ретельного пошуку.
items.rings.ringofdetection.name=перстень виявлення
items.rings.ringofhaggler.desc=Насправді цей перстень не має магічних властивостей. Він показує торговцям, що його власник належить до Гільдії злодіїв. Зазвичай вони охоче дають знижку в обмін на обіцянку певний час їх не чіпати. Поліпшення персня не дає додаткових переваг.
items.rings.ringofhaggler.name=перстень торгу
items.rings.ringofherbalism.desc=Цей перстень збільшує шанс знайти росу та насіння, витоптуючи траву.
items.rings.ringofherbalism.name=перстень травництва
items.rings.ringofmending.desc=Цей перстень посилює здатність тіла до відновлення, прискорюючи повернення втраченого здоров'я. Ослаблені персні сповільнюють або навіть зупиняють природне зцілення.
items.rings.ringofmending.name=перстень відновлення
items.rings.ringofpower.desc=Енергетичне поле цього персня посилює твої жезли. Ослаблені персні могутності, навпаки, роблять їх слабшими.
items.rings.ringofpower.name=перстень могутності
items.rings.ringofsatiety.desc=З цим перснем можна довше обходитися без їжі. Ослаблені персні ситості діють навпаки.
items.rings.ringofsatiety.name=перстень ситості
items.rings.ringofshadows.desc=Вороги з меншою ймовірністю помітять вас, якщо ви носите це кільце. Зруйновані кільця тіней попередять ворогів, які інакше могли б не помітити вашої присутності.
items.rings.ringofshadows.name=перстень тіней
items.rings.ringofthorns.desc=Цей перстень не має справжніх шипів, але ворог, який тебе атакує, сам отримає частину завданої шкоди. Поліпшення персня не дає додаткових переваг.
items.rings.ringofthorns.name=перстень шипів
items.scrolls.scrollofchallenge.desc=При читанні вголос цей сувій видаватиме запеклий рев, який розбудить усіх монстрів і попередить їх про місцезнаходження читача.
items.scrolls.scrollofchallenge.name=сувій виклику
items.scrolls.scrollofenchantment.desc=Цей сувій здатний наповнити зброю або броню випадковим зачаруванням, надаючи їм особливу силу.
items.scrolls.scrollofenchantment.name=сувій чарів
items.scrolls.scrollofpsionicblast.desc=Цей сувій містить руйнівну енергію, яку можна піонічно спрямувати, щоб завдати величезної шкоди всім істотам у полі зору. Супутній спалах світла тимчасово засліпить усіх у зоні дії, включаючи читача сувою.
items.scrolls.scrollofpsionicblast.name=сувій псионічного вибуху
items.scrolls.scrollofwipeout.desc=Прочитайте цей сувій, щоб розкрити гнів духів підземель, знищивши все на поточному рівні. Ну, майже все. Деякі з наймогутніших істот можуть не постраждати.
items.scrolls.scrollofwipeout.name=сувій винищення
items.wands.wandofblink.desc=Цей жезл дозволяє телепортуватися в обраному напрямку. Істоти та нерухомі перешкоди зупиняють телепортацію.
items.wands.wandofblink.name=жезл переміщення
items.wands.wandoffirebolt.desc=Цей жезл випускає заряди магічного вогню. Він підпалює горючу місцевість, ранить і запалює істоту, в яку влучить.
items.wands.wandoffirebolt.name=жезл вогняної стріли
