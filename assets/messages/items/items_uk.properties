items.artifacts.etherealchains.cursed=Не можна використовувати прокляті ланцюги.
items.artifacts.etherealchains.desc=Ці великі, але легкі ланцюги світяться духовною енергією. Їх можна використовувати, щоб притягувати вас до місцевості або ворогів. Ефірна природа ланцюгів навіть дозволяє їм проходити крізь стіни!
items.artifacts.etherealchains.desc_cursed=Прокляті ланцюги прикуті до тебе, постійно розгойдуються, намагаючись підставити тебе або зв'язати.
items.artifacts.etherealchains.desc_equipped=Ланцюги огортають ваш бік, повільно висмоктуючи духовну енергію тих, кого ви перемагаєте. Кожен заряд — це ланка в ланцюгу, який простягатиметься рівно на одну клітинку.
items.artifacts.etherealchains.does_nothing=Це нічого не дасть.
items.artifacts.etherealchains.inside_wall=Твої ланцюги можуть протягнути тебе лише крізь стіни, а не в них.
items.artifacts.etherealchains.name=ефірні ланцюги
items.artifacts.etherealchains.no_charge=Ваші ланцюги не мають достатнього заряду.
items.artifacts.etherealchains.nothing_to_grab=Там нема за що хапатися.
items.artifacts.etherealchains.prompt=Виберіть місце для цільового націлювання.
items.artifacts.etherealchains.rooted=Твої ланцюги не можуть тягнути тебе, поки ти прикутий до кореня.
items.artifacts.holytome.ac_cast=КАСТ
items.artifacts.holytome.cursed=Ви не можете використовувати проклятий фоліант.
items.artifacts.holytome.desc=Священний фоліант, який служить фокусом для божественної магії Клірика. Використання фоліанта дозволяє Клірику використовувати різноманітні магічні заклинання.\n\nФоліант поступово стає потужнішим у міру використання Кліриком, надаючи йому більше максимальних зарядів і трохи збільшуючи швидкість перезарядки.
items.artifacts.holytome.discover_hint=Один з героїв починає з цього предмета.
items.artifacts.holytome.levelup=Твій фоліант стає сильнішим!
items.artifacts.holytome.name=священний том
items.artifacts.holytome.no_spell=Ти не можеш зараз накласти це заклинання.
