items.weapon.weaponeffects.weaponeffect.smite.prefix=Варварський
items.weapon.weaponeffects.weaponeffect.smite.name=%s варвара
items.weapon.weaponeffects.weaponeffect.smite.desc=Це _варварська_ зброя. При влучанні з імовірністю _20%_ вона застосовує _Удар 1-го рівня_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Удар!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Відштовхувальний
items.weapon.weaponeffects.weaponeffect.knockback.name=%s відштовхування
items.weapon.weaponeffects.weaponeffect.knockback.desc=Це _відштовхувальна_ зброя. При влучанні з імовірністю _20%_ вона відкидає ворога на _одну клітинку_. Босів відштовхнути не можна.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Відкидання!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Зміїний
items.weapon.weaponeffects.weaponeffect.venom.name=%s змії
items.weapon.weaponeffects.weaponeffect.venom.desc=Це _зміїна_ зброя. При влучанні з імовірністю _20%_ вона отруює ціль.
items.weapon.weaponeffects.weaponeffect.venom.activate=Отрута!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Калічний
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s каліцтва
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Ця зброя _калічить_. Дистанційні влучання з імовірністю _20%_ змушують ворога кульгати протягом _10 ходів_. На босів не діє.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Кульгавість!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Рунічний
items.weapon.weaponeffects.weaponeffect.spark.name=%s рун
items.weapon.weaponeffects.weaponeffect.spark.desc=Це _рунічна_ паличка. Її магія з імовірністю _20%_ викликає _Іскру_, завдаючи _4–8_ додаткової магічної шкоди.
items.weapon.weaponeffects.weaponeffect.spark.activate=Іскра!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Проклинальний
items.weapon.weaponeffects.weaponeffect.curse.name=%s прокляття
items.weapon.weaponeffects.weaponeffect.curse.desc=Ця паличка _проклинає_. Її магія з імовірністю _20%_ послаблює ціль, зменшуючи завдану нею шкоду на _5%_ протягом _10 ходів_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Прокляття!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Поглинальний
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s поглинання
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Ця паличка _поглинає життя_. Її магія з імовірністю _20%_ завдає _8–16_ додаткової магічної шкоди й відновлює вам стільки здоров'я, скільки забрала в цілі.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Поглинання!

items.armor.armorprefix.stalwart.name=%s стійкості
items.armor.armorprefix.stalwart.desc=Ця броня дає _стійкість_. Атаки ворогів з імовірністю _20%_ активують _Міцність 5-го рівня_, зменшуючи свою шкоду на _20%_.
items.armor.armorprefix.stalwart.activate=Міцність!

items.armor.armorprefix.vigilant.name=%s пильності
items.armor.armorprefix.vigilant.desc=Ця броня дає _пильність_. З імовірністю _20%_ вона дозволяє ухилитися від дистанційної атаки ворога.
items.armor.armorprefix.vigilant.activate=Пильність!

items.armor.armorprefix.elusive.name=%s невловимості
items.armor.armorprefix.elusive.desc=Ця броня робить вас _невловимим_. Зазнавши шкоди від атаки ворога, ви з імовірністю _20%_ підвищуєте ухилення на _5_ протягом _5 ходів_.
items.armor.armorprefix.elusive.activate=Ухилення!
