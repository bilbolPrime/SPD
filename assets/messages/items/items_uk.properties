items.amulet.ac_end=ЗАВЕРШИТИ ГРУ
items.amulet.ascent_desc=Ви починаєте відчувати, як з амулета випромінюється велика та жахлива сила Йог-Дзеви. Підйом назад через підземелля у вигляді смертного може бути складнішим, ніж ви думали!\n\nЯкщо ви продовжите підйом з амулетом, підземелля стане небезпечнішим, телепортації між поверхами будуть вимкнені, і ви зможете виграти гру, лише перемагаючи ворогів під час підйому через підземелля!\n\nВи можете поки що залишити амулет тут, якщо хочете піднятися, не починаючи це випробування, або активувати амулет перед підйомом, щоб завершити гру звичайним способом.
items.amulet.ascent_no=Зупиніться зараз
items.amulet.ascent_title=Вознесіння
items.amulet.ascent_yes=Продовжуйте!
items.amulet.desc=Амулет Єндора — найпотужніший артефакт, відомий людям чи гномам. Його мерехтливі кристали містять неймовірну та дивовижну силу.
items.amulet.desc_ascent=Походження амулета невідоме, але очевидно, що на нього сильно вплинула сила Йог-Дзеви. Підземелля, здається, підкоряється волі Йога, коли ви рухаєтесь крізь нього, роблячи ворогів набагато численнішими та могутнішими! Ви також більше не можете активувати або скинути амулет, майже ніби він проклятий.
items.amulet.desc_origins=Походження амулета невідоме. Історія свідчить, що Король Гномів хвалився, що відкрив артефакт незадовго до того, як цивілізація Гномів перервала всі контакти. Як він його знайшов? Як Йог-Дзева забрав його у нього? Можливо, питання будуть на інший раз, але зараз важливо лише те, що амулет ваш!
items.amulet.discover_hint=Ви можете знайти цей предмет на дні підземелля...
items.amulet.name=амулет Єндора
items.ankh.ac_bless=благословляти
items.ankh.bless=Ти благословляєш анкх чарівною водою.
items.ankh.desc=Давній символ безсмертя дозволяє повернутися до життя після смерті. Під час воскресіння втрачаються всі предмети, які не були споряджені.
items.ankh.desc_blessed=Цей давній символ безсмертя дарує здатність повернутися до життя після смерті. Анкх був благословенний і тепер набагато сильніший. Анкх пожертвує собою, щоб врятувати вас у момент смертельної небезпеки.
items.ankh.discover_hint=Ви можете придбати цей товар у магазині.
items.ankh.name=анкх
items.arcaneresin.ac_apply=ЗАЯВИТИСЯ
items.arcaneresin.apply=Ви покриваєте свою паличку смолою, збільшуючи її силу!
items.arcaneresin.desc=Цей дрібний порошок переливається між відтінками фіолетового та білого. Він може діяти як підсилювач магічної енергії, підвищуючи рівень паличок, коли його наносять на них!\n\nПокращення палички коштує 1, 2 або 3 одиниці смоли залежно від початкового рівня палички. Смола може покращити палички максимум до +3.\n\nОднак покращення смоли _перезаписуються іншими джерелами покращення_ (наприклад, сувоями покращення) і не застосовуються під час наповнення палички посохом Мага.
items.arcaneresin.discover_hint=Ви можете створити цей предмет за допомогою алхімії.
items.arcaneresin.level_too_high=Ця паличка занадто потужна, щоб смола її покращила.
items.arcaneresin.name=таємнича смола
items.arcaneresin.not_enough=У тебе для цього недостатньо смоли!
items.arcaneresin.prompt=Виберіть паличку
items.armor.armor$glyph.discover_hint=Ви можете знайти предмет із цим ефектом випадковим чином у підземеллі або спробувати застосувати його до предмета самостійно.
items.armor.armor$glyph.glyph=гліф
items.armor.armor$glyph.killed=%s тебе вбив...
items.armor.armor$glyph.rankings_desc=Убитий гліфом
items.armor.armor.ac_detach=ВІДРІЗНЯТИ
items.armor.armor.avg_absorb=Зазвичай ця броня _рівня-%1$d_ блокує пошкодження _%2$d-%3$d_ та вимагає _%4$d сили_ для правильного використання.
items.armor.armor.curr_absorb=Ця броня _рівня-%1$d_ блокує пошкодження _%2$d-%3$d_ та вимагає _%4$d сили_ для правильного використання.
items.armor.armor.cursed=Ви можете відчути зловісну магію, що ховається в цих обладунках.
items.armor.armor.cursed_worn=Оскільки ці обладунки прокляті, ти безсилий їх зняти.
items.armor.armor.defense=Його посилюють для посилення _захисту_.
items.armor.armor.detach_seal=Ти від'єднуєш печатку від своїх обладунків.
items.armor.armor.equip_cursed=Броня боляче стискається навколо тебе.
items.armor.armor.evasion=Його посилюють для посилення _ухилення_.
items.armor.armor.excess_str=Через твою надмірну силу, ти _більш ухильний_, коли носиш цю броню.
items.armor.armor.glyph_hardened=Його _загартували._
items.armor.armor.hardened_no_glyph=Цей обладунок _загартовано_, але наразі на ньому немає жодного гліфа.
items.armor.armor.hardening_gone=Зміцнення цієї броні зникло!
items.armor.armor.identify=Тепер ви достатньо знайомі зі своєю бронею, щоб її впізнати.
items.armor.armor.incompatible=Взаємодія різних видів магії стерла гліф на цій броні!
items.armor.armor.inscribed=на ньому написано _%s._
items.armor.armor.not_cursed=Ці обладунки вільні від зловісної магії.
items.armor.armor.probably_too_heavy=Мабуть, ця броня занадто важка для тебе.
items.armor.armor.seal_attached=Зламана печатка Воїна прикріплена до цієї броні. Коли він ось-ось отримає поранення, у нього залишиться менше половини здоров'я, це надасть йому _%d захист_.
items.armor.armor.seal_transfer=Зламану печатку Воїна потрібно прикріпити до його поточної броні, щоб вона принесла йому користь. Бажаєте автоматично від'єднати печатку від броні, яку ви знімаєте, та прикріпити її до броні, яку ви одягаєте?
items.armor.armor.seal_transfer_no=ні
items.armor.armor.seal_transfer_yes=так
items.armor.armor.too_heavy=Через вашу недостатню силу носіння цієї броні зменшить вашу здатність рухатися, ухилятися та захищатися.
items.armor.armor.weak_cursed=Незважаючи на прокляття, ви можете зняти цю броню.
items.armor.classarmor.ac_ability=ОБЕРІТЬ ЗДІБНОСТІ
items.armor.classarmor.ac_transfer=ПЕРЕВІРКА
items.armor.classarmor.charge_use=Використання здібності зараз споживатиме заряд _%s_.
items.armor.classarmor.discover_hint=Ви можете знайти цей предмет після перемоги над босом 20-го поверху певним героєм.
items.armor.classarmor.low_charge=Броня не має достатнього заряду, щоб використовувати свою особливу силу!
items.armor.classarmor.no_ability=Ваша броня зараз не має здібностей, вам слід вибрати одну!
items.armor.classarmor.not_equipped=Тобі потрібно носити цю броню, щоб використовувати її особливу силу!
items.armor.classarmor.transfer_cancel=скасувати
items.armor.classarmor.transfer_complete=Властивості вашої героїчної броні перенесено!
items.armor.classarmor.transfer_desc=Магію корони короля гномів можна перенести на інший комплект обладунків. Зверніть увагу, що оригінальні обладунки будуть знищені в процесі.
items.armor.classarmor.transfer_prompt=Виберіть броню
items.armor.classarmor.transfer_title=Трансферна броня
items.armor.clericarmor.desc=Носячи цю суміш тканини та пластин, Клірик може виконувати особливу здатність.
items.armor.clericarmor.name=облачення героя
items.armor.clotharmor.desc=Цей легкий обладунок забезпечує базовий захист.
items.armor.clotharmor.discover_hint=Один з героїв починає з цього предмета.
items.armor.clotharmor.name=тканинні обладунки
items.armor.curses.antientropy.desc=Прокляття проти ентропії діє проти сил всесвіту, втягуючи енергію в носія та віддаляючи її від оточення. Це ненадовго підпалює носія, але заморожує все навколо!
items.armor.curses.antientropy.name=%s антиентропії
items.armor.curses.bulk.desc=Об'ємна броня виглядає більшою та вражаючою, але насправді не має посиленого захисту. Ще гірше те, що додаткові розміри дуже ускладнюють проходження через дверні отвори.
items.armor.curses.bulk.name=%s оптом
items.armor.curses.corrosion.desc=Броня від корозії здатна лопнути від корозійної рідини, покриваючи все навколо липким кислотним мулом.
items.armor.curses.corrosion.name=%s корозії
items.armor.curses.displacement.desc=Прокляття зміщення намагається перемістити власника в безпечне місце, коли на нього нападають. Однак воно трохи занадто ефективне, випадковим чином телепортуючи користувача по рівню.
items.armor.curses.displacement.name=%s переміщення
items.armor.curses.metabolism.desc=Прокляття метаболізму безпосередньо перетворює ситість на здоров'я, коли носій отримує травму, забезпечуючи поштовх до загоєння, але швидко викликаючи голодування.
items.armor.curses.metabolism.name=%s метаболізму
items.armor.curses.multiplicity.desc=Броня, проклята множинністю, містить небезпечну магію дублювання. Іноді вона створює дзеркальне відображення власника, але з такою ж ймовірністю дублює і нападника!
items.armor.curses.multiplicity.name=%s кратності
items.armor.curses.overgrowth.desc=Броня із заростей вкрита різноманітними квітучими рослинами. Хоча цей ефект, безумовно, виглядає цікаво, він ніяк не захищає, і ці рослини випадковим чином активуватимуться в бою!
items.armor.curses.overgrowth.name=%s надмірного заростання
items.armor.curses.stench.desc=Броня, проклята смородом, випускатиме хмари отруйного газу, який небезпечний для всього, що потрапить у хмару.
items.armor.curses.stench.name=%s смороду
items.armor.duelistarmor.desc=Одягнувши ці пластинчасті обладунки та плащ, Дуелянт може виконувати особливу здатність.
items.armor.duelistarmor.name=нагрудник героя
items.armor.glyphs.affection.desc=Цей потужний гліф маніпулює розумом нападників, тимчасово зачаровуючи їх.
items.armor.glyphs.affection.name=%s прихильності
items.armor.glyphs.antimagic.desc=Цей потужний гліф дозволяє броні захищати свого власника як від магічних, так і від фізичних атак. Цей магічний захист не залежить від рівня броні.
items.armor.glyphs.antimagic.name=%s антимагії
items.armor.glyphs.brimstone.desc=Цей гліф захищає власника та його речі від вогню, повністю зводячи до нівеля його шкоду та негативний вплив.
items.armor.glyphs.brimstone.name=%s сірки
items.armor.glyphs.camouflage.desc=Цей гліф дозволяє власнику зливатися з високою травою, надаючи йому тимчасову невидимість.
items.armor.glyphs.camouflage.name=%s камуфляжу
items.armor.glyphs.entanglement.desc=Цей гліф створює навколо власника земляний обладунок, який поглинає пошкодження, але цей обладунок зламається, якщо власник поворухнеться.
items.armor.glyphs.entanglement.name=%s заплутаності
items.armor.glyphs.flow.desc=Цей гліф маніпулює потоком води навколо власника, роблячи його набагато швидшим під час руху крізь нього.
items.armor.glyphs.flow.name=%s потоку
items.armor.glyphs.obfuscation.desc=Цей гліф затьмарює носія, що ускладнює його виявлення.
items.armor.glyphs.obfuscation.name=%s обфускації
items.armor.glyphs.potential.desc=Цей гліф накопичує енергію при ударі, заряджаючи паличку власника під час її активації.
items.armor.glyphs.potential.name=%s потенціалу
items.armor.glyphs.repulsion.desc=Цей гліф відбиває силу від нападників, відкидаючи їх назад.
items.armor.glyphs.repulsion.name=%s відштовхування
items.armor.glyphs.stone.desc=Цей гліф оточує броню важким магічним каменем, який унеможливлює ухилення, але блокує пошкодження пропорційно до ухилення.
items.armor.glyphs.stone.name=%s з каменю
items.armor.glyphs.swiftness.desc=Цей гліф підвищує швидкість власника, коли він не знаходиться поруч із ворогом.
items.armor.glyphs.swiftness.name=%s швидкості
items.armor.glyphs.thorns.desc=Цей потужний гліф завдає шкоди нападникам, викликаючи у них повільну кровотечу під час атаки на носія.
items.armor.glyphs.thorns.name=%s з шипів
items.armor.glyphs.viscosity$defereddamage.desc=Шкода завдається повільно, з часом, а не одразу. \n\nЗалишок відкладеної шкоди: %d.
items.armor.glyphs.viscosity$defereddamage.name=відкладена шкода
items.armor.glyphs.viscosity$defereddamage.ondeath=Відкладена шкода вбила тебе...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Загинув відкладеною шкодою
items.armor.glyphs.viscosity.deferred=відкладений %d
items.armor.glyphs.viscosity.desc=Цей гліф здатний накопичувати шкоду, завдану власнику, завдаючи її повільно, а не одразу.
items.armor.glyphs.viscosity.name=%s в'язкості
items.armor.huntressarmor.desc=Одягнувши цей плащ, Мисливиця може виконувати особливу здатність.
items.armor.huntressarmor.name=плащ героя
items.armor.huntressarmor.no_enemies=Жодних ворогів не видно
items.armor.leatherarmor.desc=Броня виготовлена з дубленої шкіри монстра. Не така легка, як тканинна броня, але забезпечує кращий захист.
items.armor.leatherarmor.name=шкіряні обладунки
items.armor.magearmor.desc=Одягнувши цей чудовий халат, Маг може виконувати особливу здатність.
items.armor.magearmor.name=шата героя
items.armor.mailarmor.desc=Зчеплені металеві ланки створюють міцний, але гнучкий бронежилет.
items.armor.mailarmor.name=кольчужний обладунок
items.armor.platearmor.desc=Величезні металеві пластини з'єднані разом у костюм, який забезпечує неперевершений захист будь-якому шукачеві пригод, достатньо міцному, щоб витримати його приголомшливу вагу.
items.armor.platearmor.name=пластинчастий обладунок
items.armor.roguearmor.desc=Одягнувши цей темний одяг, Розбійник може виконувати особливу здібність.
items.armor.roguearmor.name=вбрання героя
items.armor.scalearmor.desc=Металева луска, пришита до шкіряного жилета, створює гнучкий, але захисний обладунок.
items.armor.scalearmor.name=луската броня
items.armor.warriorarmor.desc=Одягнувши цю важку латунь, Воїн може виконувати особливу здатність.
items.armor.warriorarmor.name=латний кольчуга героя
items.artifacts.alchemiststoolkit.ac_brew=ЗАВАР
items.artifacts.alchemiststoolkit.ac_energize=ЗАРЯДЖУЙТЕСЯ ЕНЕРГІЄЮ
items.artifacts.alchemiststoolkit.cursed=Твій проклятий набір інструментів заважає тобі використовувати алхімію!
items.artifacts.alchemiststoolkit.desc=Цей набір інструментів містить низку реагентів і трав, а також невелику ампулу для змішування, що дозволяє займатися алхімією в дорозі. Ампула містить те, що виглядає як алхімічні енергетичні кристали в рідкій формі.
items.artifacts.alchemiststoolkit.desc_cursed=Проклятий набір інструментів прив'язався до тебе і відмовляється дозволити тобі використовувати алхімію.
items.artifacts.alchemiststoolkit.desc_hint=Споряджений набір інструментів повільно генерує алхімічну енергію, коли ви набуваєте досвіду. Схоже, що суміш у флаконі можна покращити, додавши до неї енергетичні кристали.
items.artifacts.alchemiststoolkit.desc_warming=Наразі інструментарій розігрівається і буде готовий до використання через деякий час.
items.artifacts.alchemiststoolkit.energize_1=6 енергії: +1 рівень
items.artifacts.alchemiststoolkit.energize_all=Енергія %1$d: рівні +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Кожні 6 кристалів енергії дадуть інструментарію достатньо енергії для досягнення рівня, що збільшує швидкість, з якою інструментарій генерує енергію з часом, і швидкість його нагрівання. \n\nСкільки енергії ви хочете використовувати?
items.artifacts.alchemiststoolkit.name=набір інструментів алхіміка
items.artifacts.alchemiststoolkit.need_energy=Для цього потрібно щонайменше 6 одиниць енергії.
items.artifacts.alchemiststoolkit.not_ready=Ваш набір інструментів ще не завершив розігрівання.
items.artifacts.artifact.cannot_wear_two=Не можна носити два однакових артефакти.
items.artifacts.artifact.curse_known=Ви можете відчути зловісну магію, що ховається всередині артефакту.
items.artifacts.artifact.equip_cursed=Артефакт болісно прив'язується до тебе.
items.artifacts.artifact.need_to_equip=Для цього вам потрібно екіпірувати свій артефакт.
items.artifacts.artifact.not_cursed=Цей артефакт вільний від зловісної магії.
items.artifacts.capeofthorns$thorns.desc=Ваш плащ випромінює енергію, оточуючи вас полем відхиляючої сили!\n\nУся отримана вами шкода зменшується, поки активний ефект шипів. Крім того, якщо атакуючий знаходиться поруч з вами, зменшена кількість шкоди відбивається назад на атакуючого.\n\nЗалишилося витків шипів: %s.
items.artifacts.capeofthorns$thorns.inert=Ваш плащ знову стає інертним.
items.artifacts.capeofthorns$thorns.levelup=Твій плащ стає міцнішим!
items.artifacts.capeofthorns$thorns.name=колючки
items.artifacts.capeofthorns$thorns.radiating=Ваша накидка починає випромінювати енергію, ви відчуваєте себе захищеною!
items.artifacts.capeofthorns.desc=Ці зруйновані металеві листи з DM-300 сформувалися разом у жорсткий плащ. Здається, він зберігає глибоку енергію, можливо, він має частину сили DM-300?
items.artifacts.capeofthorns.desc_active=Плащ ніби вивільняє накопичену енергію, він випромінює захисну силу.
items.artifacts.capeofthorns.desc_inactive=Плащ заспокійливо важить на твоїх плечах, здається, що він набирається енергії від отриманої шкоди.
items.artifacts.capeofthorns.name=терновий плащ
items.artifacts.chaliceofblood.ac_prick=УКОЛ
items.artifacts.chaliceofblood.desc=Ця блискуча срібна чаша дивним чином прикрашена гострими дорогоцінними каменями по краю.
items.artifacts.chaliceofblood.desc_1=Тримаючи чашу, відчуваєш дивне бажання вколоти себе об гострі самоцвіти.
items.artifacts.chaliceofblood.desc_2=Частина вашої крові збирається в чаші, ви можете ледь помітно відчути, як чаша живить вас життєвою енергією, збільшуючи природне відновлення здоров'я. Вам все одно хочеться порізатися об чашу, хоча ви знаєте, що це буде боляче.
items.artifacts.chaliceofblood.desc_3=Чаша наповнена до країв вашою життєвою сутністю. Ви можете відчути, як чаша вливає життєву енергію назад у вас.
items.artifacts.chaliceofblood.desc_cursed=Проклята чаша прив'язалася до твоєї руки та перешкоджає твоїй здатності відновлювати здоров'я.
items.artifacts.chaliceofblood.name=чаша крові
items.artifacts.chaliceofblood.no=Ні, я передумав/передумала.
items.artifacts.chaliceofblood.ondeath=Чаша висмоктує твою життєву сутність...
items.artifacts.chaliceofblood.onprick=Ти колешся, і твоя життєва сутність стікає в чашу.
items.artifacts.chaliceofblood.prick_warn=Щоразу, коли ви використовуєте чашу, вона виснажуватиме більше вашої життєвої енергії, але натомість ще більше покращить ваше природне відновлення здоров'я.\n\nПоточне уколювання себе завдасть _%1$d-%2$d шкоди_, хоча цю шкоду можна зменшити _як фізичним, так і магічним блокуванням або зменшенням шкоди._ Не враховуючи ефекти зменшення шкоди, уколювання себе зараз має _%3$s%% шанс_ повністю виснажити вашу життєву силу.\n\nВи впевнені, що хочете запропонувати чаші більше життєвої енергії?
items.artifacts.chaliceofblood.yes=Так, я знаю, що роблю
items.artifacts.cloakofshadows$cloakstealth.desc=Ваш плащ тіней надає вам невидимість, поки ви ним оповиті. Ви залишатиметеся в плащі, доки його не буде скасовано або ваш плащ не розрядиться.\n\nПоки ви невидимі, вороги не можуть атакувати вас або стежити за вами. Фізичні атаки та магічні ефекти (такі як сувої та палички) негайно скасовують невидимість.\n\nХоди до використання заряду: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Твій плащ стає міцнішим!
items.artifacts.cloakofshadows$cloakstealth.name=замаскований
items.artifacts.cloakofshadows$cloakstealth.no_charge=У твого плаща закінчилася енергія.
items.artifacts.cloakofshadows.ac_stealth=СТЕЛС
items.artifacts.cloakofshadows.cooldown=Вашому плащу потрібно більше раундів, щоб %d відновити енергію.
items.artifacts.cloakofshadows.cursed=Ти не можеш використовувати проклятий плащ.
items.artifacts.cloakofshadows.desc=Безцінний магічний плащ, викрадений з королівської зброї багато років тому Розбійником. При носінні його можна використовувати, щоб на короткий час стати повністю невидимим.\n\nЧим більше використовується плащ, тим міцнішим він стає, що дозволяє Розбійнику ставати невидимим частіше та на довший час.
items.artifacts.cloakofshadows.discover_hint=Один з героїв починає з цього предмета.
items.artifacts.cloakofshadows.name=плащ тіней
items.artifacts.cloakofshadows.no_charge=Твій плащ ще не зарядився достатньо, щоб ним можна було користуватися.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Як ти це пережив/пережила?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Шкода, що в мене немає одного з них...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ой! Ти ще живий!
items.artifacts.driedrose$ghosthero.def_verb=ухилився
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Вибачте... удачі...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Закінчи це... без мене...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Ні... я не можу...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачі...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Втомився... поки що...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я повернуся...
items.artifacts.driedrose$ghosthero.desc=Крихка на вигляд ефемерна фігура людиноподібної форми. Їхня сила, здається, пов'язана з трояндою, яку ти маєш.\n\nЦей привид може й не такий вже й особливий, але, здається, він твій єдиний справжній друг тут, внизу.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Чому так відбувається, я думав, що нам вдалося?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Як ця річ досі здатна впливати на цей світ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Сподіваюся, ти знаєш, що робиш з цим амулетом.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Гадаю, ми ще не закінчили.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Ми вже так далеко зайшли, ми можемо це завершити!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Ще трохи, і ми зможемо звідси вибратися!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Тут вже дуже давно не було ні людини, ні гнома.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Що могло змусити гномів покинути золоту шахту?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Шкода, що все золото тут на перший погляд марне.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Істоти тут перекручені, як і в каналізації.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Навіть кажани тут кровожерливі.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Жодних ознак гірничого обладнання, невже гноми все повернули?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Гноми були працьовиті, але жадібні.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Отже, гномська столиця справді впала.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Сподіваюся, що поверхня ніколи не стане такою, як це місце.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Гноми не повинні виглядати такими блідими.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, що гірше, гноми чи їхні творіння.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Здається, що гноми тепер також є бездумними монстрами.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Що це за місце?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Це місце жахливе...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Про що думали гноми, граючись так із владою?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Чудовиська тут неземні, звідки вони взялися?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Відчуваєш це? Ніби щось спостерігає за нами.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава Богу, що є смолоскипи, тут так темно!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я чув історії про це місце, нічого хорошого.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Це місце завжди було радше підземеллям, ніж в'язницею.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Я не можу уявити, що відбувалося, коли це місце було покинуте.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Здається, і в'язні, і охоронці перетворилися на монстрів.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Що може бути відповідальним за всі ці скелети?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ці люди не повинні були так закінчити...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Колись ці каналізації були безпечними, люди навіть жили тут взимку.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Цікаво, що сталося з патрулями охорони, вони здалися?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У мене на поверхні була родина, сподіваюся, вони в безпеці.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Вартові не змогли перемогти цих монстрів, але, можливо, ми зможемо.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Якщо навіть каналізація така небезпечна, цікаво, що там внизу...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Що могло спричинити такі великі розміри цих щурів та крабів?
items.artifacts.driedrose$ghosthero.direct_prompt=Що мені робити?
items.artifacts.driedrose$ghosthero.directed_attack_1=Добре, я атакуватиму це.
items.artifacts.driedrose$ghosthero.directed_attack_2=Я візьму цей.
items.artifacts.driedrose$ghosthero.directed_attack_3=Захопливо...
items.artifacts.driedrose$ghosthero.directed_attack_4=Давайте їх візьмемо!
items.artifacts.driedrose$ghosthero.directed_attack_5=У мене є такий.
items.artifacts.driedrose$ghosthero.directed_follow_1=Добре, я піду за тобою.
items.artifacts.driedrose$ghosthero.directed_follow_2=Я піду за тобою.
items.artifacts.driedrose$ghosthero.directed_follow_3=Слідкую за тобою...
items.artifacts.driedrose$ghosthero.directed_follow_4=Гаразд, ходімо!
items.artifacts.driedrose$ghosthero.directed_follow_5=Я тебе підтримаю.
items.artifacts.driedrose$ghosthero.directed_position_1=Добре, я залишуся на цій позиції.
items.artifacts.driedrose$ghosthero.directed_position_2=Я піду туди і захищатимуся.
items.artifacts.driedrose$ghosthero.directed_position_3=Зміна положення...
items.artifacts.driedrose$ghosthero.directed_position_4=Вже в дорозі!
items.artifacts.driedrose$ghosthero.directed_position_5=Я туди попрямую.
items.artifacts.driedrose$ghosthero.discover_hint=Ви можете знайти цього персонажа за допомогою певного артефакту.
items.artifacts.driedrose$ghosthero.hello=Знову привіт, %s.
items.artifacts.driedrose$ghosthero.introduce=Мій дух пов'язаний з цією трояндою, вона була для мене дуже дорогоцінною, подарунок від мого кохання, яке я залишив на поверхні.\n\nЯ не можу повернутися до нього, але завдяки тобі в мене є другий шанс завершити свою подорож. Коли я зможу, я відгукнуся на твій заклик і буду боротися з тобою.\n\nДоки в тебе є троянда, я чую твій голос, тож ти можеш використовувати його, щоб вести мене здалеку.\n\nСподіваюся, ти досягнеш успіху там, де я зазнав невдачі...
items.artifacts.driedrose$ghosthero.name=сумний привид
items.artifacts.driedrose$ghosthero.player_killed_1=Ні!...
items.artifacts.driedrose$ghosthero.player_killed_2=Я не міг їм допомогти...
items.artifacts.driedrose$ghosthero.player_killed_3=Не так...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Тільки гноми могли побудувати гірничодобувну машину, яка вбиває непроханих гостей.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Ця штука величезна...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Як ця штука так довго залишалася активною?
items.artifacts.driedrose$ghosthero.seen_goo_1=Обережно, Гу!
items.artifacts.driedrose$ghosthero.seen_goo_2=Багато моїх друзів загинули через це, час помсти!
items.artifacts.driedrose$ghosthero.seen_goo_3=Такій гидоті не можна дозволити жити!
items.artifacts.driedrose$ghosthero.seen_king_1=Коли люди кажуть, що влада розбещує, вони мають на увазі саме це.
items.artifacts.driedrose$ghosthero.seen_king_2=Він тепер скоріше ліч, ніж король.
items.artifacts.driedrose$ghosthero.seen_king_3=Навіть після смерті гноми слухаються свого господаря.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Єдиний в'язень, що залишився, — смертоносний вбивця. Звісно...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Він нас заманив у пастку!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я чув жахливі історії про цю маску...
items.artifacts.driedrose$ghosthero.seen_yog_1=О, це виглядає недобре.
items.artifacts.driedrose$ghosthero.seen_yog_2=Тож ось як виглядає бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Це буде боляче...
items.artifacts.driedrose$petal.desc=Тендітна висохла пелюстка, яка якимось чином вижила аж до підземелля.
items.artifacts.driedrose$petal.levelup=Ви додаєте пелюстку до троянди.
items.artifacts.driedrose$petal.maxlevel=Троянда готова!
items.artifacts.driedrose$petal.name=сушена пелюстка
items.artifacts.driedrose$petal.no_room=Для цієї пелюстки не залишилося місця, тому ви її викидаєте.
items.artifacts.driedrose$petal.no_rose=У тебе немає троянди, до якої можна додати цю пелюстку.
items.artifacts.driedrose$wndghosthero.armor_prompt=Виберіть броню
items.artifacts.driedrose$wndghosthero.cant_cursed=Привид може використовувати лише те спорядження, яке, як ви впевнені, не прокляте.
items.artifacts.driedrose$wndghosthero.cant_strength=Привид недостатньо сильний, щоб цим скористатися.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Привид може бути недостатньо сильним, щоб цим скористатися.
items.artifacts.driedrose$wndghosthero.cant_unique=Привид не може використовувати унікальні предмети.
items.artifacts.driedrose$wndghosthero.desc=Привид сам по собі слабкий, але його форма достатньо міцна, щоб бути екіпірованим зброєю та бронею. Він зможе використовувати ці предмети так само, як і ви. \n\nПривид зараз може екіпірувати предмети, що потребують сили до _%d._
items.artifacts.driedrose$wndghosthero.title=Спорядження Привида
items.artifacts.driedrose$wndghosthero.weapon_prompt=Виберіть зброю
items.artifacts.driedrose.ac_direct=ПРЯМИЙ
items.artifacts.driedrose.ac_outfit=ОДЯГ
items.artifacts.driedrose.ac_summon=ВИКЛИКАТИ
items.artifacts.driedrose.charged=Ваша троянда повністю заряджена!
items.artifacts.driedrose.cursed=Не можна використовувати прокляту троянду.
items.artifacts.driedrose.desc=Це та троянда, про яку згадував привид перед зникненням? Здається, вона має якусь духовну силу, можливо, її можна використовувати для спрямування енергії того загубленого воїна.
items.artifacts.driedrose.desc_armor=Броня Привида: %s
items.artifacts.driedrose.desc_cursed=Проклята троянда прив'язана до твоєї руки, вона моторошно холодна.
items.artifacts.driedrose.desc_hint=Здається, у неї бракує деяких пелюсток. Можливо, якщо їх прикріпити, троянда стане міцнішою.
items.artifacts.driedrose.desc_no_quest=Висушена витримана троянда, яка якимось чином все ще тримається цілісною, незважаючи на свій вік. \n\nЗдається, вона має якусь духовну силу, але ви не знаєте, як її використовувати зараз.
items.artifacts.driedrose.desc_strength=Сила Привида: %s
items.artifacts.driedrose.desc_weapon=Зброя Привида: %s
