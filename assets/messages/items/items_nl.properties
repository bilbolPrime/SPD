items.weapon.melee.magesstaff.imbue_unknown=Je weet niet wat het niveau van deze toverstaf is, maar deze betovering zal in ieder geval resulteren in een _+%d staf._
items.weapon.melee.magesstaff.name=tovenaarsstaf
