items.artifacts.hornofplenty.desc=Je kunt niet in deze hoorn blazen, maar hij lijkt zich te vullen met voedsel naarmate je avonturen beleeft en ervaring opdoet. Je kunt elke lading afzonderlijk als snack consumeren, of eten tot je vol zit.
items.artifacts.hornofplenty.desc_cursed=De vervloekte hoorn heeft zich aan je vastgeklampt; hij lijkt eerder voedsel te willen stelen dan produceren.
items.artifacts.hornofplenty.desc_hint=Misschien is er een manier om de kracht van de hoorn te vergroten door hem voedselenergie te geven.
