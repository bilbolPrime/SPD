items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbaars
items.weapon.weaponeffects.weaponeffect.smite.name=Barbaarse %s
items.weapon.weaponeffects.weaponeffect.smite.desc=Dit wapen is _barbaars_. Een treffer heeft _20%_ kans om _Slag van niveau 1_ uit te voeren.
items.weapon.weaponeffects.weaponeffect.smite.activate=Slag!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Terugstotend
items.weapon.weaponeffects.weaponeffect.knockback.name=Terugstotende %s
items.weapon.weaponeffects.weaponeffect.knockback.desc=Dit wapen is _terugstotend_. Een treffer heeft _20%_ kans om een vijand _één vakje_ terug te duwen. Bazen kunnen niet worden teruggeduwd.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Terugslag!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Slangachtig
items.weapon.weaponeffects.weaponeffect.venom.name=Slangachtige %s
items.weapon.weaponeffects.weaponeffect.venom.desc=Dit wapen is _slangachtig_. Een treffer heeft _20%_ kans om het doelwit te vergiftigen.
items.weapon.weaponeffects.weaponeffect.venom.activate=Gif!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Kreupelend
items.weapon.weaponeffects.weaponeffect.kneeshot.name=Kreupelende %s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Dit wapen is _kreupelend_. Afstandstreffers hebben _20%_ kans om een vijand _10 beurten_ kreupel te maken. Bazen zijn immuun.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Kreupel!

