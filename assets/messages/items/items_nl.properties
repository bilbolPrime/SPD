items.weapon.melee.roundshield$guardtracker.desc=De Duelist heeft haar schild gereedgemaakt in afwachting van naderende aanvallen. Fysieke of magische aanvallen die op haar gericht zijn, zullen volledig worden geneutraliseerd.\n\nResterende beurten: %s.
items.weapon.melee.roundshield$guardtracker.guarded=bewaakt
items.weapon.melee.roundshield$guardtracker.name=bewaken
items.weapon.melee.roundshield.ability_desc=De Duelist kan zichzelf beschermen met een rond schild, waardoor alle fysieke of magische aanvallen die op haar gericht zijn gedurende _%d beurten_ volledig worden geneutraliseerd. Zodra de Duelist een aanval heeft geblokkeerd, zal een tegenaanval of het gebruik van magie de bescherming beëindigen.
items.weapon.melee.roundshield.ability_name=bewaker
items.weapon.melee.roundshield.desc=Dit grote schild blokkeert effectief aanvallen en is in noodsituaties een prima wapen.
items.weapon.melee.roundshield.name=rond schild
items.weapon.melee.roundshield.stats_desc=Dit wapen blokkeert 0-%d schade. Deze blokkering neemt toe met upgrades.
items.weapon.melee.roundshield.typical_ability_desc=De Duelist kan zichzelf beschermen met een rond schild, waardoor alle fysieke of magische aanvallen die op haar gericht zijn, volledig worden geneutraliseerd, meestal gedurende _%d beurten_. Zodra de Duelist een aanval heeft geblokkeerd, zal een tegenaanval of het gebruik van magie de bescherming beëindigen.
