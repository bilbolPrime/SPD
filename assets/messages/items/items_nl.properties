items.weapon.melee.spear.typical_ability_desc=De Duelist kan de punt van een speer gebruiken om een vijand die binnen bereik is maar niet direct naast hem staat, te doorsteken. Dit veroorzaakt doorgaans _%1$d-%2$d schade_, stoot de vijand achteruit en raakt gegarandeerd.
items.weapon.melee.sword$cleavetracker.desc=De Duelist is klaar om haar vorige cleave-aanval voort te zetten. Het volgende gebruik van cleave kost geen wapenvaardigheidslading.\n\nAantal resterende beurten: %s.
items.weapon.melee.sword$cleavetracker.name=splijten
items.weapon.melee.sword.ability_desc=De Duelist kan een vijand met een zwaard doorsnijden. Dit veroorzaakt _%1$d-%2$d schade_ en raakt gegarandeerd. Als de doorsnijaanval een vijand doodt, is dit direct en kan de Duelist de doorsnijaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.sword.ability_name=splijten
items.weapon.melee.sword.desc=Een mooi uitgebalanceerd zwaard. Niet te groot, maar toch merkbaar langer dan een kortzwaard.
items.weapon.melee.sword.name=zwaard
items.weapon.melee.sword.typical_ability_desc=De Duelist kan een vijand met een zwaard doorsnijden. Dit veroorzaakt doorgaans _%1$d-%2$d schade_ en raakt gegarandeerd. Als de doorsnijaanval een vijand doodt, is dit direct en kan de Duelist de doorsnijaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.warhammer.ability_desc=De Duelist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval brengt _%1$d-%2$d schade_ toe als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar brengt normale schade toe als de vijand niet verrast wordt.
items.weapon.melee.warhammer.ability_name=zware klap
items.weapon.melee.warhammer.desc=Weinig wezens kunnen de verpletterende klap van deze torenhoge massa van lood en staal weerstaan, maar het vergt grote kracht om er effectief mee om te gaan.
items.weapon.melee.warhammer.name=oorlogshamer
items.weapon.melee.warhammer.stats_desc=Dit is een behoorlijk nauwkeurig wapen.
items.weapon.melee.warhammer.typical_ability_desc=De Duelist kan een _zware slag_ uitvoeren met een oorlogshamer. Deze geconcentreerde aanval richt doorgaans _%1$d-%2$d schade_ aan als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
items.weapon.melee.warscythe.ability_desc=De Duelist kan een vijand oogsten met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd doel en richt _%d schade_ aan. Deze schade wordt als bloeding toegebracht als het doelwit niet immuun is.
items.weapon.melee.warscythe.ability_name=oogst
items.weapon.melee.warscythe.desc=Dit grote en onhandige werktuig is versterkt om het beter geschikt te maken voor het doden van vijanden dan voor het verdelgen van gewassen.
items.weapon.melee.warscythe.name=oorlogszeis
items.weapon.melee.warscythe.stats_desc=Dit is een nogal onnauwkeurig wapen.
items.weapon.melee.warscythe.typical_ability_desc=De Duelist kan een vijand oogsten met een oorlogszeis. Deze verwoestende aanval raakt gegarandeerd doel en richt doorgaans _%d schade_ aan. Deze schade wordt als bloeding toegebracht als het doelwit niet immuun is.
items.weapon.melee.whip.ability_desc=De Duelist kan alle vijanden om haar heen met een zweep geselen. Deze vaardigheid veroorzaakt _%1$d-%2$d schade_, valt alle vijanden binnen aanvalsbereik aan en raakt gegarandeerd.
items.weapon.melee.whip.ability_name=wimper
items.weapon.melee.whip.desc=Hoewel het weerhaakvormige touw aan het uiteinde van dit wapen weinig schade aanricht, is het bereik ervan ongeëvenaard.
items.weapon.melee.whip.name=zweep
items.weapon.melee.whip.stats_desc=Dit wapen heeft een enorm bereik.
items.weapon.melee.whip.typical_ability_desc=De Duelist kan alle vijanden om haar heen met een zweep geselen. Deze vaardigheid richt doorgaans _%1$d-%2$d schade aan_, valt alle vijanden binnen aanvalsbereik aan en raakt gegarandeerd.
items.weapon.melee.wornshortsword.ability_desc=De Duelist kan een vijand _hakken_ met een versleten kortzwaard. Dit veroorzaakt _%1$d-%2$d schade_ en raakt gegarandeerd. Als hakken een vijand doodt, is dat direct en kan de Duelist hakken binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.wornshortsword.ability_name=splijten
items.weapon.melee.wornshortsword.desc=Een vrij kort zwaard, versleten door intensief gebruik. Het is zowel zwakker als iets lichter dan een kortzwaard in betere staat.
items.weapon.melee.wornshortsword.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.melee.wornshortsword.name=versleten kortzwaard
items.weapon.melee.wornshortsword.typical_ability_desc=De Duelist kan een vijand splijten met een versleten kortzwaard. Dit veroorzaakt doorgaans _%1$d-%2$d schade_ en raakt gegarandeerd. Als de splijtaanval een vijand doodt, is dit direct en kan de Duelist de splijtaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.missiles.bolas.desc=Deze ongebruikelijke afstandswapens richten niet veel schade aan, maar vertragen hun doelwit wel uitstekend.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Dit wapen verlamt het doelwit.
items.weapon.missiles.boomerang.desc=Als dit platte, gebogen houten projectiel naar de vijand wordt gegooid, keert het terug in de handen van de werper.
items.weapon.missiles.boomerang.durability=Door de stevige constructie zal deze boemerang niet breken bij gebruik.
items.weapon.missiles.boomerang.name=boemerang
items.weapon.missiles.darts.adrenalinedart.desc=Deze pijlen zijn voorzien van een middel op basis van snelle distel, dat de bewegings- en aanvalssnelheid van bondgenoten verhoogt of de bewegingssnelheid van vijanden tijdelijk verlaagt. De pijl zelf is nog steeds schadelijk voor vijanden, maar zal bondgenoten geen schade berokkenen.
items.weapon.missiles.darts.adrenalinedart.name=adrenaline-dart
items.weapon.missiles.darts.blindingdart.desc=Deze pijltjes zijn voorzien van een middel op basis van blindkruid, waardoor het doelwit korte tijd verblind wordt. Ze desoriënteren echter niet, dus een vijand weet nog steeds waar hij je voor het laatst heeft gezien.
items.weapon.missiles.darts.blindingdart.name=verblindende pijl
items.weapon.missiles.darts.chillingdart.desc=Deze pijltjes zijn voorzien van een punt met een samenstelling op basis van ijs, die het doelwit aanzienlijk zal afkoelen.
items.weapon.missiles.darts.chillingdart.name=ijzige dartpijl
items.weapon.missiles.darts.cleansingdart.desc=Deze pijlen zijn voorzien van een mageroyal-verbinding die bondgenoten tijdelijk immuun maakt voor alle negatieve effecten, of positieve effecten van vijanden neutraliseert. Vijanden kunnen zelfs even vergeten dat ze je aanvallen of voor je vluchten. De pijl zelf is nog steeds schadelijk voor vijanden, maar zal bondgenoten geen schade berokkenen.
items.weapon.missiles.darts.cleansingdart.name=reinigingspijl
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.desc=Deze eenvoudige schachten van hout met puntige uiteinden zijn verzwaard zodat ze recht vliegen en hun prooi met een simpele polsbeweging kunnen steken. Ze kunnen worden voorzien van zaadjes voor extra effecten bij het gooien.
items.weapon.missiles.darts.dart.name=dart
items.weapon.missiles.darts.dart.prompt=Kies een zaadje
items.weapon.missiles.darts.dart.tip_all=tip %1$d darts met %2$d zaden
items.weapon.missiles.darts.dart.tip_cancel=annuleren
items.weapon.missiles.darts.dart.tip_desc=Een zaadje kan gecombineerd worden met een of twee pijltjes om ze van een puntje te voorzien. Elk type zaadje produceert zijn eigen type pijltje met een uniek, eenmalig effect. Door een pijltje van een puntje te voorzien met deze zaadjes ontstaat een _%s_.
items.weapon.missiles.darts.dart.tip_one=tip 1 pijl met 1 zaadje
items.weapon.missiles.darts.dart.tip_title=Tip Darts
items.weapon.missiles.darts.dart.tip_two=tip 2 darts met 1 zaadje
items.weapon.missiles.darts.dart.unlimited_uses=Door hun eenvoudige constructie gaan dartpijlen in principe eeuwig mee.
items.weapon.missiles.darts.displacingdart.desc=Deze pijltjes zijn voorzien van een verbinding op basis van fadeleaf, waardoor ze hun doelwit over een korte afstand kunnen teleporteren.
items.weapon.missiles.darts.displacingdart.name=verdringingspijl
items.weapon.missiles.darts.healingdart.desc=Deze pijlen zijn voorzien van een verbinding op basis van zonnegras, die het doelwit een kortstondige genezingsboost geeft. De pijl zelf is nog steeds schadelijk voor vijanden, maar zal bondgenoten geen schade berokkenen.
items.weapon.missiles.darts.healingdart.name=genezende pijl
items.weapon.missiles.darts.holydart.desc=Deze pijlen zijn voorzien van een verbinding op basis van sterrenbloem, die heilige energie in het doelwit brengt. Bondgenoten en gewone vijanden worden gezegend, maar ondoden of demonische vijanden lopen zware schade op. De pijl zelf is nog steeds schadelijk voor vijanden, maar zal bondgenoten geen schade berokkenen.
items.weapon.missiles.darts.holydart.name=heilige pijl
items.weapon.missiles.darts.incendiarydart.desc=Deze pijltjes zijn voorzien van een vlamvertragende coating die bij impact in felle vlammen uitbarst.
items.weapon.missiles.darts.incendiarydart.name=brandpijl
items.weapon.missiles.darts.paralyticdart.desc=Deze pijltjes zijn voorzien van een verbinding op basis van aardwortels, die het doelwit gedurende korte tijd verlamt.
items.weapon.missiles.darts.paralyticdart.name=verlammingspijl
items.weapon.missiles.darts.poisondart.desc=Deze pijltjes zijn voorzien van een verbinding op basis van rouwmos, die het doelwit vergiftigt.
items.weapon.missiles.darts.poisondart.name=gifpijl
items.weapon.missiles.darts.rotdart.desc=Deze venijnige pijlen zijn voorzien van een zure, op rotbes gebaseerde verbinding, die alles wat ermee in contact komt agressief aantast. Krachtige vijanden zullen het effect grotendeels weerstaan, maar de corrosie is sterk genoeg om de meeste standaard vijanden gemakkelijk te doden. Deze pijlen gaan langer mee dan andere pijlen met een speciale punt, maar hun duurzaamheid kan niet worden verhoogd.
items.weapon.missiles.darts.rotdart.discover_hint=Je kunt dit voorwerp maken met behulp van een seed uit een specifieke quest.
items.weapon.missiles.darts.rotdart.name=rotte pijl
items.weapon.missiles.darts.shockingdart.desc=Deze pijltjes zijn voorzien van een punt met een samenstelling op basis van stormrank, die het doelwit een nare schok zal toedienen.
items.weapon.missiles.darts.shockingdart.name=schokkende dartpijl
items.weapon.missiles.darts.tippeddart.about_to_break=De punt van je dartpijl is bijna aan vervanging toe.
items.weapon.missiles.darts.tippeddart.ac_clean=SCHOON
items.weapon.missiles.darts.tippeddart.cancel=annuleren
items.weapon.missiles.darts.tippeddart.clean_all=alles schoonmaken
items.weapon.missiles.darts.tippeddart.clean_desc=Door deze actie wordt de zaadcoating op je dartpijlen verwijderd, waardoor ze weer normale dartpijlen worden.
items.weapon.missiles.darts.tippeddart.clean_one=schone één
items.weapon.missiles.darts.tippeddart.clean_title=Schone dartpijlen
items.weapon.missiles.darts.tippeddart.discover_hint=Je kunt dit item in een winkel kopen of maken met behulp van een seed.
items.weapon.missiles.darts.tippeddart.has_broken=De punt van je dartpijl is versleten.
items.weapon.missiles.darts.tippeddart.unlimited_uses=Maar ze zijn van zo'n hoge kwaliteit dat ze in principe eeuwig meegaan.
items.weapon.missiles.darts.tippeddart.uses_left=Deze stapel dartpijlen kan nog _%d/%d_ keer gebruikt worden voordat een puntje versleten is.
items.weapon.missiles.fishingspear.desc=Kleine werpsperen die, ondanks hun ontwerp voor de visserij, prima dienst doen als geïmproviseerd wapen.
items.weapon.missiles.fishingspear.name=visspeer
items.weapon.missiles.forcecube.desc=Deze vreemd gevormde magische kubussen zijn klein genoeg om in je hand te houden, maar ze zijn ongelooflijk zwaar.
items.weapon.missiles.forcecube.name=krachtkubus
items.weapon.missiles.forcecube.ondeath=Je hebt jezelf gedood met je eigen Krachtkubus...
items.weapon.missiles.forcecube.stats_desc=Dit wapen verspreidt de kracht van zijn inslag over een klein gebied en raakt alles in de omgeving.
items.weapon.missiles.heavyboomerang.desc=Deze grote boemerang is lastig effectief te hanteren, maar kan aanzienlijke schade aanrichten.
items.weapon.missiles.heavyboomerang.name=zware boemerang
items.weapon.missiles.heavyboomerang.stats_desc=Dit wapen keert na vijf omwentelingen terug naar de plek waar het vandaan werd geworpen.
items.weapon.missiles.javelin.desc=Deze grotere werpsperen zijn verzwaard zodat de punt aan de buitenkant naar voren blijft wijzen terwijl ze door de lucht vliegen.
items.weapon.missiles.javelin.name=speer
items.weapon.missiles.kunai.desc=Deze kleine messen zijn zeer krachtig in de handen van een ervaren gebruiker.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Dit wapen is effectiever tegen vijanden die niet opletten.
items.weapon.missiles.missileweapon$placeholder.name=werpwapen
items.weapon.missiles.missileweapon.about_to_break=Je werpwapen staat op het punt te breken.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Als het laatste werpwapen in je verbeterde werpwapenset breekt, raak je de set definitief kwijt. Weet je zeker dat je het wilt gooien?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Nee
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.curse_discover=Dit werpwapen is vervloekt!
items.weapon.missiles.missileweapon.distance=Werpwapens zijn nauwkeuriger op afstand, maar minder nauwkeurig van dichtbij.
items.weapon.missiles.missileweapon.durability=Werpwapens slijten en breken naarmate ze gebruikt worden.
items.weapon.missiles.missileweapon.dust=Het weggegooide wapen verkruimelt tot stof zodra je het aanraakt.
items.weapon.missiles.missileweapon.has_broken=Een van je werpwapens is kapot.
items.weapon.missiles.missileweapon.probably_too_heavy=Waarschijnlijk is dit wapen te zwaar voor je.
items.weapon.missiles.missileweapon.stats_known=Deze set _tier-%1$d_ werpwapens richt _%2$d-%3$d schade_ aan en vereist _%4$d kracht_ om te gebruiken.
items.weapon.missiles.missileweapon.stats_unknown=Doorgaans richt deze set _tier-%1$d_ werpwapens _%2$d-%3$d schade_ aan en vereist _%4$d kracht_ om te gebruiken.
items.weapon.missiles.missileweapon.unknown_uses=Normaal gesproken kan deze set werpwapens _%d_ keer gebruikt worden voordat er één kapot gaat.
items.weapon.missiles.missileweapon.unlimited_uses=Deze set is van zulke hoge kwaliteit dat hij praktisch een leven lang meegaat.
items.weapon.missiles.missileweapon.uses_left=Deze set werpwapens heeft nog _%d/%d_ gebruiksmogelijkheden over voordat er één kapot gaat.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Je hebt zojuist direct een shuriken gegooid en moet even wachten voordat je dit opnieuw kunt doen. Shurikens kunnen nog steeds worden gegooid, maar met de normale wapensnelheid.\n\nResterende beurten: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Afkoeltijd voor shuriken
items.weapon.missiles.shuriken.desc=Deze stervormige metalen werpwapens met vlijmscherpe randen richten veel schade aan. Je kunt ze heel snel achter elkaar werpen.
items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens kunnen direct worden gegooid en hebben een afkoeltijd van 20 beurten.
items.weapon.missiles.throwingclub.desc=Een vrij eenvoudig maar duurzaam werpwapen, in wezen een grote steen bevestigd aan een stok.
items.weapon.missiles.throwingclub.name=werpknuppel
items.weapon.missiles.throwingclub.stats_desc=Dit wapen kleeft niet aan vijanden en kan direct worden opgepakt.
items.weapon.missiles.throwinghammer.desc=Deze forse hamers zijn ontworpen om naar een vijand te gooien. Dankzij hun gladde, volledig metalen constructie zijn ze bijzonder duurzaam.
items.weapon.missiles.throwinghammer.name=werphamer
items.weapon.missiles.throwinghammer.stats_desc=Dit wapen kleeft niet aan vijanden en kan direct worden opgepakt.
items.weapon.missiles.throwingknife.desc=Deze lichtgewicht messen zijn zo uitgebalanceerd dat ze in een boog door de lucht recht op hun doel afvliegen.
items.weapon.missiles.throwingknife.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.missiles.throwingknife.name=werpmes
items.weapon.missiles.throwingknife.stats_desc=Dit wapen is effectiever tegen vijanden die niet opletten.
items.weapon.missiles.throwingspear.desc=Deze lichtgewicht speren hebben dunne frames en zijn ontworpen om te worden geworpen, niet om mee te stoten.
items.weapon.missiles.throwingspear.name=werpspeer
items.weapon.missiles.throwingspike.desc=Deze duurzame, puntige metalen schachten zijn bedoeld om naar vijanden op afstand te worden geworpen.
items.weapon.missiles.throwingspike.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.missiles.throwingspike.name=werpspike
items.weapon.missiles.throwingstone.desc=Deze stenen worden afgeschuurd zodat ze met meer kracht kunnen worden gegooid dan een gewone steen.
items.weapon.missiles.throwingstone.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.missiles.throwingstone.name=steen gooien
items.weapon.missiles.tomahawk.desc=Deze werpbijlen hebben een gekartelde rand die scheurt wanneer ze in een vijand blijven steken.
items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Dit wapen brengt _%1$d-%2$d bloeding_ toe aan het doelwit.
items.weapon.missiles.tomahawk.typical_stats_desc=Dit wapen brengt doorgaans _%1$d-%2$d bloeding_ toe aan het doelwit.
items.weapon.missiles.trident.desc=Enorme werpsperen met drie dodelijke punten aan het uiteinde. Ze zijn krachtig, maar ook behoorlijk zwaar.
items.weapon.missiles.trident.name=drietand
items.weapon.spiritbow.ac_shoot=SCHIETEN
items.weapon.spiritbow.desc=Een boog gemaakt van oeroud, magisch hout. De boogpees en de gravures gloeien met een lichtblauw licht. Wanneer de pees wordt aangespannen, tovert deze boog een magische pijl tevoorschijn die op een vijand kan worden afgeschoten.
items.weapon.spiritbow.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.spiritbow.name=geestenboog
items.weapon.spiritbow.prompt=Kies een doelwit
items.weapon.spiritbow.stats=De boog kan niet direct worden geüpgraded, maar wordt in plaats daarvan geleidelijk sterker naarmate je in level stijgt. Op je huidige level richten pijlen die met de boog worden afgeschoten _%1$d-%2$d schade aan_ en vereisen ze _%3$d kracht_ om ze goed te kunnen gebruiken.
items.weapon.weapon$enchantment.discover_hint=Je kunt in de kerker willekeurig een voorwerp met dit effect vinden, of proberen het zelf op een voorwerp toe te passen.
items.weapon.weapon$enchantment.enchant=betovering
items.weapon.weapon$enchantment.rankings_desc=Gedood door een betovering.
items.weapon.weapon.cursed=Je voelt de kwaadaardige magie die in dit wapen schuilt.
items.weapon.weapon.cursed_worn=Omdat dit wapen vervloekt is, ben je machteloos om het te verwijderen.
items.weapon.weapon.enchant_hardened=Het is gehard.
items.weapon.weapon.enchanted=Het heeft een _%s._
items.weapon.weapon.excess_str=Vanwege je overmatige kracht zul je met dit wapen _0-%d bonusschade_ toebrengen.
items.weapon.weapon.faster=Het is verbeterd om de snelheid te verhogen.
items.weapon.weapon.hardened_no_enchant=Dit wapen is gehard, maar is momenteel niet betoverd.
items.weapon.weapon.hardening_gone=De hardingslaag van dit wapen is afgesleten!
items.weapon.weapon.identify=Je bent nu voldoende vertrouwd met je wapen om het te kunnen herkennen.
items.weapon.weapon.incompatible=Door de wisselwerking van verschillende soorten magie is de betovering op dit wapen tenietgedaan!
items.weapon.weapon.not_cursed=Dit wapen is vrij van kwaadaardige magie.
items.weapon.weapon.stronger=Het is verbeterd om de schade te vergroten.
items.weapon.weapon.too_heavy=Door je ontoereikende kracht zal dit wapen je aanvalssnelheid, nauwkeurigheid en vermogen om een verrassingsaanval uit te voeren belemmeren.
items.weapon.weapon.weak_cursed=Ondanks de vloek kun je dit wapen wel afleggen.

items.keys.skeletonkey.desc=Deze sleutel ziet er serieus uit: de kop heeft de vorm van een schedel. Waarschijnlijk kan hij een serieuze deur openen.
items.weapon.missiles.bombarrow.desc=Een pijl met een bom eraan. Houd afstand.
items.weapon.missiles.bombarrow.name=bompijl
items.weapon.missiles.missileweapon.damage_desc=Dit wapen brengt _%1$d_ tot _%2$d_ schade toe per slag.
items.bags.seedpouch.desc=In dit kleine fluwelen zakje kun je zoveel zaden bewaren als je wilt. Erg handig.
items.bags.seedpouch.name=zaadzakje
items.potions.potionofmight.desc=Deze krachtige vloeistof stroomt door je spieren en verhoogt je kracht blijvend met één punt en je gezondheid met vijf punten.
items.potions.potionofmight.name=Drankje van Macht
items.rings.ringofdetection.desc=Met deze ring merk je verborgen vallen en geheime deuren op zonder tijd te besteden aan zoeken. Een verslechterde ring verdooft je zintuigen en maakt geheimen moeilijker te ontdekken, ook als je er actief naar zoekt.
items.rings.ringofdetection.name=Detectiering
items.rings.ringofhaggler.desc=Deze ring heeft geen magische werking, maar laat handelaars zien dat de drager bij het Dievengilde hoort. Ze geven meestal graag korting in ruil voor de belofte dat ze een tijdje met rust worden gelaten. De ring verbeteren levert geen extra voordeel op.
items.rings.ringofhaggler.name=ring van de afdinger
items.rings.ringofherbalism.desc=Deze ring vergroot je kans om dauw en zaden te vinden als je gras platloopt.
items.rings.ringofherbalism.name=Ring van kruidenkunde
items.rings.ringofmending.desc=Deze ring versterkt het herstelvermogen van het lichaam, zodat verloren gezondheid sneller terugkomt. Een verslechterde ring vertraagt of stopt zelfs je natuurlijke herstel.
items.rings.ringofmending.name=ring van herstel
items.rings.ringofpower.desc=Het energieveld van deze ring maakt je toverstaven krachtiger. Een verslechterde ring verzwakt ze juist.
items.rings.ringofpower.name=Ring van Macht
items.rings.ringofsatiety.desc=Met deze ring kun je langer zonder eten. Een verslechterde ring heeft het omgekeerde effect.
items.rings.ringofsatiety.name=Ring van verzadiging
items.rings.ringofshadows.desc=Vijanden zullen je minder snel opmerken als je deze ring draagt. Verzwakte schaduwringen zullen vijanden alarmeren die je anders misschien niet zouden hebben opgemerkt.
items.rings.ringofshadows.name=Ring van schaduwen
items.rings.ringofthorns.desc=Deze ring heeft geen echte doornen, maar een vijand die je aanvalt krijgt zelf een deel van de toegebrachte schade. De ring verbeteren levert geen extra voordeel op.
items.rings.ringofthorns.name=Ring van Doornen
items.scrolls.scrollofchallenge.desc=Wanneer deze rol hardop wordt voorgelezen, zal er een uitdagend gebrul klinken dat alle monsters zal wekken en hen zal waarschuwen voor de locatie van de lezer.
items.scrolls.scrollofchallenge.name=rol van uitdaging
items.scrolls.scrollofenchantment.desc=Met deze perkamentrol kun je een wapen of pantser voorzien van een willekeurige betovering, waardoor het een speciale kracht krijgt.
items.scrolls.scrollofenchantment.name=betoveringsrol
items.scrolls.scrollofpsionicblast.desc=Deze perkamentrol bevat vernietigende energie die psionisch kan worden gekanaliseerd om enorme schade toe te brengen aan alle wezens binnen een bepaald gezichtsveld. Een bijbehorende lichtflits zal iedereen in het getroffen gebied, inclusief de lezer van de perkamentrol, tijdelijk verblinden.
items.scrolls.scrollofpsionicblast.name=perkament van psionische explosie
items.scrolls.scrollofwipeout.desc=Lees deze perkamentrol om de toorn van de kerkergeesten te ontketenen, die alles op het huidige niveau zullen doden. Nou ja, bijna alles. Sommige van de krachtigere wezens zullen er misschien niet door worden beïnvloed.
items.scrolls.scrollofwipeout.name=rol van vernietiging
items.wands.wandofblink.desc=Met deze toverstaf teleporteer je in de gekozen richting. Wezens en andere obstakels blokkeren de teleportatie.
items.wands.wandofblink.name=toverstaf van teleportatie
items.wands.wandoffirebolt.desc=Deze toverstaf schiet magisch vuur. Hij ontsteekt brandbaar terrein en verwondt en verbrandt wezens die geraakt worden.
items.wands.wandoffirebolt.name=Toverstaf van Vuurflits
