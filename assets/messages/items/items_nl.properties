items.weapon.melee.runicblade.ability_desc=De Duelist kan een _runenslag_ uitvoeren met een runenzwaard. Deze aanval raakt gegarandeerd doel en heeft een _+%d%% betoveringskracht._
items.weapon.melee.runicblade.ability_name=runen slag
