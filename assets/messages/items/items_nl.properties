items.rings.ring.sapphire=saffieren ring
items.rings.ring.topaz=topaas ring
items.rings.ring.tourmaline=toermalijn ring
items.rings.ring.unknown_desc=Deze metalen ring is versierd met een grote %s die in het donker schittert. Wie weet welk effect hij heeft als je hem draagt?
items.rings.ringofaccuracy.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen je nauwkeurigheid met in totaal _%s%%_.
items.rings.ringofaccuracy.desc=Deze ring vergroot je kans om de vijand te raken.
items.rings.ringofaccuracy.name=ring van nauwkeurigheid
items.rings.ringofaccuracy.stats=Wanneer je deze ring draagt, zal je nauwkeurigheid met _%s%%._ toenemen.
items.rings.ringofaccuracy.typical_stats=Wanneer je deze ring draagt, zal je nauwkeurigheid doorgaans met _%s%%._ toenemen.
items.rings.ringofaccuracy.upgrade_stat_name_1=Nauwkeurigheidsverbetering
items.rings.ringofarcana.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen de kracht van betoveringen en glyphs met in totaal _%s%%_.
items.rings.ringofarcana.desc=Deze ring versterkt magische betoveringen op wapens en symbolen op pantsers, inclusief vloeken! Hij verhoogt eerst de activeringskans en vervolgens de sterkte van het effect zodra de activeringskans 100% is. Een vervloekte ring verzwakt daarentegen betoveringen, symbolen en vloeken.
items.rings.ringofarcana.name=ring van arcana
items.rings.ringofarcana.stats=Wanneer deze ring gedragen wordt, verhoogt hij de kracht van betoveringen en glyphs met _%s%%._
items.rings.ringofarcana.typical_stats=Wanneer deze ring gedragen wordt, zal hij de kracht van betoveringen en glyphs doorgaans met _%s%%_ verhogen.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofelements.combined_stats=De ringen die je draagt, bundelen hun krachten en bieden in totaal _%s%%_ elementaire weerstand.
items.rings.ringofelements.desc=Deze ring beschermt tegen verschillende elementen, zoals vuur, elektriciteit en gassen. Hij verkort ook de duur van negatieve effecten.
items.rings.ringofelements.name=ring van elementen
items.rings.ringofelements.stats=Wanneer deze ring gedragen wordt, biedt hij _%s%%_ elementaire weerstand.
items.rings.ringofelements.typical_stats=Wanneer deze ring gedragen wordt, biedt hij doorgaans _%s%%_ elementaire weerstand.
items.rings.ringofelements.upgrade_stat_name_1=Weerstand
items.rings.ringofenergy.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen de laadsnelheid met in totaal _%s%%_.
items.rings.ringofenergy.desc=Je magische uitrusting laadt sneller op in het magische veld dat van deze ring uitstraalt. Een vervloekte ring laadt daarentegen langzamer op.
items.rings.ringofenergy.name=ring van energie
items.rings.ringofenergy.stats=Wanneer deze ring gedragen wordt, verhoogt hij de oplaadsnelheid van toverstaven, artefacten en heldhaftige pantsers met _%s%%._
items.rings.ringofenergy.typical_stats=Wanneer deze ring gedragen wordt, verhoogt hij doorgaans de oplaadsnelheid van toverstaven, artefacten en heldhaftige pantsers met _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Laadboost
items.rings.ringofevasion.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen je ontwijking met in totaal _%s%%_.
items.rings.ringofevasion.desc=Deze ring vergroot je kans om een vijandelijke aanval te ontwijken.
items.rings.ringofevasion.name=ring van ontwijking
items.rings.ringofevasion.stats=Wanneer je deze ring draagt, vergroot hij je ontwijkingsvermogen met _%s%%._
items.rings.ringofevasion.typical_stats=Wanneer je deze ring draagt, vergroot je je ontwijkingskans doorgaans met _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Ontwijkingsboost
items.rings.ringofforce$brawlersstance.desc=In deze houding gebruikt de Duelist bij haar normale aanvallen een uitgeruste krachtring, zelfs als ze een wapen draagt. Deze aanvallen krijgen bonusschade en gebruiken nog steeds de versterking en betovering van het wapen. Het behouden van deze houding vereist echter concentratie, waardoor de oplaadsnelheid van wapenvaardigheden met 50% afneemt. Deze houding kan worden in- of uitgeschakeld met een krachtring, maar de vermindering van de oplaadsnelheid blijft nog even aanhouden als de houding snel wordt geactiveerd en gedeactiveerd.
items.rings.ringofforce$brawlersstance.name=vechtershouding
items.rings.ringofforce.ability_desc=De Duelist kan met deze ring een vechtershouding aannemen, waardoor haar normale aanvallen altijd deze ring gebruiken, zelfs wanneer ze een wapen draagt. Deze aanvallen zullen _%1$d-%2$d schade_ toebrengen en zullen ook de betovering en versterking van het wapen overnemen. Deze houding vertraagt de herlaadsnelheid van het wapen met 50%%.
items.rings.ringofforce.ability_name=vechtershouding
items.rings.ringofforce.combined_stats=De ringen die je draagt, bundelen hun krachten en richten in totaal _%1$d-%2$d schade aan_ zonder wapen, of verhogen de schade met _%3$d_ met een wapen.
items.rings.ringofforce.desc=Deze ring versterkt de slagkracht van de drager bij gevechten van dichtbij. Deze extra kracht is vrij zwak bij het hanteren van wapens, maar een aanval zonder wapens wordt er aanzienlijk sterker door. Een vervloekte ring zal de slagkracht van de drager juist verzwakken.
items.rings.ringofforce.name=ring van kracht
items.rings.ringofforce.stats=Zonder wapen, met je huidige kracht, zal deze ring _%1$d-%2$d schade toebrengen._ Met een wapen uitgerust, zal deze ring de schade met _%3$d_ verhogen._
items.rings.ringofforce.typical_ability_desc=De Duelist kan met deze ring een vechtershouding aannemen, waardoor haar normale aanvallen altijd deze ring gebruiken, zelfs wanneer ze een wapen draagt. Deze aanvallen zullen doorgaans _%1$d-%2$d schade_ toebrengen en zullen ook de betovering en versterking van het wapen overnemen. Deze houding vertraagt de herlaadsnelheid van het wapen met 50%%.
items.rings.ringofforce.typical_stats=Zonder wapens, met je huidige kracht, zal deze ring doorgaans _%1$d-%2$d schade toebrengen. Met een wapen uitgerust, zal deze ring de schade doorgaans met _%3$d_ verhogen.
items.rings.ringofforce.upgrade_stat_name_1=Onbewapende schade
items.rings.ringofforce.upgrade_stat_name_2=Schadeboost voor wapens
items.rings.ringofforce.upgrade_stat_name_3=Vaardigheidsschade
items.rings.ringoffuror.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen de snelheid van je aanvallen met in totaal _%s%%_.
items.rings.ringoffuror.desc=Deze ring schenkt de drager een innerlijke woede, waardoor hij sneller kan aanvallen. Een vervloekte ring zal de aanvalssnelheid van de drager juist vertragen.
items.rings.ringoffuror.name=ring van woede
items.rings.ringoffuror.stats=Wanneer je deze ring draagt, verhoogt hij de snelheid van je aanvallen met _%s%%._
items.rings.ringoffuror.typical_stats=Wanneer je deze ring draagt, zal de snelheid van je aanvallen doorgaans met _%s%%_ toenemen.
items.rings.ringoffuror.upgrade_stat_name_1=Aanvalssnelheidsboost
items.rings.ringofhaste.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen je bewegingssnelheid met in totaal _%s%%_.
items.rings.ringofhaste.desc=Deze ring versnelt de tijd voor de drager, waardoor alle handelingen iets sneller gaan.
items.rings.ringofhaste.name=ring van haast
items.rings.ringofhaste.stats=Wanneer je deze ring draagt, verhoog je je bewegingssnelheid met _%s%%._
items.rings.ringofhaste.typical_stats=Wanneer je deze ring draagt, zal je bewegingssnelheid doorgaans met _%s%%_ toenemen.
items.rings.ringofhaste.upgrade_stat_name_1=Bewegingssnelheidsboost
items.rings.ringofmight.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen je totale kracht met _%1$d_ en je maximale HP met _%2$s%%_.
items.rings.ringofmight.desc=Deze ring versterkt de fysieke eigenschappen van de drager, waardoor deze meer fysieke kracht en een betere conditie krijgt. Een vervloekte ring zal de drager juist verzwakken.
items.rings.ringofmight.name=ring van macht
items.rings.ringofmight.stats=Wanneer je deze ring draagt, verhoogt hij je kracht met _%1$d_ en je maximale HP met _%2$s%%_.
items.rings.ringofmight.typical_stats=Wanneer je deze ring draagt, zal je kracht doorgaans met _%1$d_ toenemen en je maximale HP met _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=krachtverhoging
items.rings.ringofmight.upgrade_stat_name_2=Maximale HP-boost
items.rings.ringofsharpshooting.combined_stats=De ringen die je draagt, bundelen hun krachten, waardoor het effectieve niveau van je werpwapen met _%1$d_ wordt verhoogd en de duurzaamheid ervan met _%2$s%%_ toeneemt.
items.rings.ringofsharpshooting.desc=Deze ring verbetert de precisie en het richtvermogen van de drager, waardoor alle projectielwapens meer schade aanrichten en duurzamer worden. Een vervloekte ring heeft het tegenovergestelde effect.
items.rings.ringofsharpshooting.name=ring van scherpschutters
items.rings.ringofsharpshooting.stats=Wanneer je deze ring draagt, verhoogt hij de schade van je werpwapens alsof hun niveau met _%1$d_ is verhoogd, en verhoogt hij hun duurzaamheid met _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Wanneer deze ring gedragen wordt, verhoogt hij doorgaans de schade van je werpwapens alsof hun niveau met _%1$d_ is verhoogd en verhoogt hij hun duurzaamheid met _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Schadeverhoging per niveau
items.rings.ringofsharpshooting.upgrade_stat_name_2=Duurzaamheidsboost
items.rings.ringoftenacity.combined_stats=De ringen die je draagt, bundelen hun krachten en verminderen de schade die je oploopt met maximaal _%s%%_ in totaal.
items.rings.ringoftenacity.desc=Deze ring stelt de drager in staat om dodelijke aanvallen te weerstaan. Hoe meer verwondingen de drager heeft, hoe beter hij of zij bestand is tegen schade. Een vervloekte ring maakt het vijanden echter juist gemakkelijker om de drager te executeren.
items.rings.ringoftenacity.name=ring van vasthoudendheid
items.rings.ringoftenacity.stats=Wanneer je deze ring draagt, vermindert hij de schade die je oploopt met maximaal _%s%%._
items.rings.ringoftenacity.typical_stats=Wanneer je deze ring draagt, zal hij de schade die je oploopt doorgaans met maximaal _%s%%_ verminderen.
items.rings.ringoftenacity.upgrade_stat_name_1=Maximale schadeweerstand
items.rings.ringofwealth.combined_stats=De ringen die je draagt, bundelen hun krachten en verhogen je geluk met in totaal _%s%%_.
items.rings.ringofwealth.desc=Deze ring werkt als een magneet voor schatten, waardoor de kans groter wordt dat vijanden en containers waardevolle voorwerpen bevatten. Een vervloekte ring verkleint juist je kans op het vinden van buit.
items.rings.ringofwealth.name=ring van rijkdom
items.rings.ringofwealth.stats=Wanneer je deze ring draagt, vergroot hij je geluk met _%s%%._
items.rings.ringofwealth.typical_stats=Wanneer je deze ring draagt, zal je geluk doorgaans met _%s%%_ toenemen.
items.rings.ringofwealth.upgrade_stat_name_1=Geluksboost
items.scrolls.exotic.exoticscroll.berkanan=exotische rol van BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.scrolls.exotic.exoticscroll.gyfu=exotische rol van GYFU
items.scrolls.exotic.exoticscroll.isaz=exotische rol van ISAZ
items.scrolls.exotic.exoticscroll.kaunan=exotische rol van KAUNAN
items.scrolls.exotic.exoticscroll.laguz=exotische rol van LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=exotische rol van MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotische rol van NAUDIZ
items.scrolls.exotic.exoticscroll.odal=exotische rol van ODAL
items.scrolls.exotic.exoticscroll.raido=exotische rol van RAIDO
items.scrolls.exotic.exoticscroll.sowilo=exotische rol van SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=exotische rol van TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Op dit zwarte perkament staat een gloeiende, onleesbare magische rune geschreven. Hij lijkt van vreemde oorsprong te zijn in dit land; wie weet wat er zal gebeuren als hij hardop wordt voorgelezen?
items.scrolls.exotic.exoticscroll.yngvi=exotische rol van YNGVI
items.scrolls.exotic.scrollofantimagic.desc=De spreuk op deze perkamentrol omhult je met een magische aura die tijdelijk alle magische effecten blokkeert, zowel schadelijke als nuttige. Dit omvat de meeste magische effecten van voorwerpen zoals toverstaven, perkamentrollen, ringen, artefacten, betoveringen en vloeken. De vaardigheden van heldhaftige pantsers zijn echter sterk genoeg om desondanks te werken.
items.scrolls.exotic.scrollofantimagic.name=rol van anti-magie
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Er is een magische arena om je heen verschenen, aangegeven door een golvende rode mist. Terwijl je in de mist staat, zal je honger niet toenemen en zul je 33%% minder schade oplopen van alle bronnen. Als je andere bronnen van schadebeperking hebt (zoals pantser), zullen deze van toepassing zijn na de 33%% vermindering. Resterende beurten: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=uitdagingsarena
items.scrolls.exotic.scrollofchallenge.desc=Wanneer deze perkamentrol hardop wordt voorgelezen, zal er een oorverdovend gebrul ontstaan dat vijanden naar de gebruiker lokt en tegelijkertijd een kleine arena om hen heen creëert. Zolang de lezer zich in deze arena bevindt, zal hij 33% minder schade oplopen van alle bronnen (dit wordt toegepast vóór andere vormen van schadebeperking) en zal hij geen verzadiging verliezen. De grootte van de arena zal schalen met de grootte van het gebied waarin de lezer zich bevindt. In sommige baasgevechten zal de arena bijzonder klein zijn.
items.scrolls.exotic.scrollofchallenge.name=scroll van uitdaging
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Uw waarzegrol heeft de volgende items geïdentificeerd:
items.scrolls.exotic.scrollofdivination.desc=Deze perkamentrol zal willekeurig vier soorten voorwerpen identificeren die je momenteel niet kent. De geïdentificeerde soorten kunnen de kleur van een drankje, een rune op een perkamentrol of een edelsteen op een ring zijn. De geïdentificeerde voorwerpen hoeven niet per se voorwerpen te zijn die je bij je draagt.
items.scrolls.exotic.scrollofdivination.name=waarzeggerijrol
items.scrolls.exotic.scrollofdivination.nothing_left=Er valt niets meer te identificeren!
items.scrolls.exotic.scrollofdread.desc=Wanneer deze perkamentrol wordt gelezen, zal er een flits van rood licht verschijnen die ongelooflijke angst inboezemt bij alle vijanden in je gezichtsveld. Dit effect is zo sterk dat ze razendsnel uit de hele kerker zullen vluchten en nooit meer teruggezien zullen worden! Net als bij angst kan dit effect na verloop van tijd verdwijnen, of als de vijand wordt aangevallen. Vijanden met een sterke wil, zoals eindbazen, zullen in plaats daarvan gewone angst ervaren.
items.scrolls.exotic.scrollofdread.name=rol van angst
items.scrolls.exotic.scrollofenchantment.armor=Kies een symbool om op je pantser aan te brengen.
items.scrolls.exotic.scrollofenchantment.cancel=annuleren
items.scrolls.exotic.scrollofenchantment.cancel_warn=Als je annuleert, verbruik je nog steeds je betoveringsrol, weet je het zeker?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nee, ik ben van gedachten veranderd.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ik weet het zeker.
items.scrolls.exotic.scrollofenchantment.desc=Deze perkamentrol zal een wapen of pantser doordrenken met krachtige magische energie. De lezer heeft zelfs enige controle over welke magie wordt ingebracht.
items.scrolls.exotic.scrollofenchantment.inv_title=Betover een voorwerp
items.scrolls.exotic.scrollofenchantment.name=betoveringsrol
items.scrolls.exotic.scrollofenchantment.weapon=Kies een betovering die je op je wapen wilt toepassen.
items.scrolls.exotic.scrollofforesight.desc=Na het lezen van deze rol zal de lezer voortdurend en haarscherp details van het omliggende terrein in zijn of haar geest ontvangen. Dit effect houdt geruime tijd aan en onthult alle verborgen deuren of vallen, waardoor zoeken overbodig wordt.
items.scrolls.exotic.scrollofforesight.name=rol van vooruitziendheid
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Annuleren kost je nog steeds je transformatie-scroll, weet je het zeker?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Kies een talent om te transformeren.
items.scrolls.exotic.scrollofmetamorphosis.desc=Deze perkamentrol bevat krachtige transmutatiemagie, die van toepassing is op de gebruiker in plaats van op een voorwerp. De magie van deze perkamentrol stelt je in staat om één talent te selecteren en te vervangen door één van vijf talenten van hetzelfde niveau uit verschillende heldenklassen! Dit effect is alleen van toepassing op klassetalenten, niet op talenten verkregen via subklassen of pantservaardigheden. Talenten die je niet kunt gebruiken, worden niet als opties weergegeven.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfose talent
items.scrolls.exotic.scrollofmetamorphosis.name=rol van metamorfose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Kies een nieuw talent om je veranderde talent mee te vervangen.
items.scrolls.exotic.scrollofmysticalenergy.desc=De pure magische kracht die in dit perkament besloten ligt, zal, wanneer deze vrijkomt, de uitgeruste voorwerpen van de gebruiker na verloop van tijd opladen.
items.scrolls.exotic.scrollofmysticalenergy.name=rol van mystieke energie
items.scrolls.exotic.scrollofpassage.desc=De spreuk op dit perkament transporteert de lezer direct naar de dichtstbijzijnde ruimte op de eerste verdieping erboven. Erg handig om snel naar een winkel te gaan.
items.scrolls.exotic.scrollofpassage.name=rol van passage
items.scrolls.exotic.scrollofprismaticimage.desc=De spreuk op deze perkamentrol creëert een kleurrijke, illusoire tweeling van de lezer. Dit prismatische beeld fungeert als een zwakkere kloon van de lezer, met een vergelijkbare verdediging maar lagere HP en schade.\n\nHet prismatische beeld verschijnt wanneer er vijanden aanwezig zijn en probeert de lezer te verdedigen.\n\nAls er al een prismatisch beeld bestaat, zal het gebruik van deze perkamentrol dit volledig genezen.
items.scrolls.exotic.scrollofprismaticimage.name=rol van prismatische afbeelding
items.scrolls.exotic.scrollofpsionicblast.desc=Deze rol bevat ongelooflijke vernietigende energie die kan worden gekanaliseerd om de geesten van alle zichtbare wezens te vernietigen. Er is echter aanzienlijke terugkoppeling, en de lezer zal ook beschadigd, verblind en verzwakt raken. Hoe meer doelen de rol raakt, hoe minder schade de lezer zelf zal oplopen.
items.scrolls.exotic.scrollofpsionicblast.name=perkament van psionische explosie
items.scrolls.exotic.scrollofpsionicblast.ondeath=De Psionische Explosie scheurt je geest aan stukken...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Dit wezen is betoverd door de magie van een perkamentrol met sirenengezang. Een betoverd personage is permanent je bondgenoot en zal alle vijanden die hij tegenkomt bestrijden.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=geboeid
items.scrolls.exotic.scrollofsirenssong.cancel=Je moet een doel kiezen.
items.scrolls.exotic.scrollofsirenssong.desc=Het lezen van deze perkamentrol laat een betoverende melodie horen die een vijand in de ban zal houden en hem permanent tot een bondgenoot zal maken! Andere vijanden die het horen, zullen tijdelijk betoverd worden. Bijzonder sterke vijanden kunnen het betoverende effect weerstaan en zullen in plaats daarvan betoverd worden.
items.scrolls.exotic.scrollofsirenssong.name=rol van sirenenzang
items.scrolls.exotic.scrollofsirenssong.no_target=De perkamentrol wordt geactiveerd zonder doelwit.
items.scrolls.exotic.scrollofsirenssong.prompt=Kies een doelwit
items.scrolls.inventoryscroll.no=Nee, ik ben van gedachten veranderd.
items.scrolls.inventoryscroll.warning=Wil je dit scrollgebruik echt annuleren? Het scrollitem was niet eerder geïdentificeerd, dus het zal sowieso gebruikt worden.
items.scrolls.inventoryscroll.yes=Ja, ik ben er zeker van.
items.scrolls.scroll$placeholder.name=rol
items.scrolls.scroll.ac_read=LEZEN
items.scrolls.scroll.berkanan=rol van BERKANAN
items.scrolls.scroll.blinded=Je kunt geen boekrol lezen als je blind bent.
items.scrolls.scroll.cursed=Je vervloekte spreukenboek verhindert je om de magie van deze perkamentrol te gebruiken! Een perkamentrol om een vloek op te heffen zou echter wel krachtig genoeg kunnen zijn om te werken...
items.scrolls.scroll.gyfu=rol van GYFU
items.scrolls.scroll.isaz=rol van ISAZ
items.scrolls.scroll.kaunan=rol van KAUNAN
items.scrolls.scroll.laguz=rol van LAGUZ
items.scrolls.scroll.mannaz=rol van MANNAZ
items.scrolls.scroll.naudiz=scroll van NAUDIZ
items.scrolls.scroll.no_magic=Je kunt geen perkamentrol lezen als je immuun bent voor magie.
items.scrolls.scroll.odal=rol van ODAL
items.scrolls.scroll.raido=rol van RAIDO
items.scrolls.scroll.sowilo=rol van SOWILO
items.scrolls.scroll.tiwaz=rol van TIWAZ
items.scrolls.scroll.unknown_desc=Dit perkament staat vol onleesbare tekens en draagt de rune %s als titel. Wie weet wat er gebeurt als je het hardop voorleest?
items.scrolls.scroll.yngvi=rol van YNGVI
items.scrolls.scrollofidentify.desc=Onthult permanent alle geheimen van een enkel voorwerp.
items.scrolls.scrollofidentify.inv_title=Identificeer een item
items.scrolls.scrollofidentify.it_is=Uw artikel is geïdentificeerd als: %s.
items.scrolls.scrollofidentify.name=identificatierol
items.scrolls.scrolloflullaby.desc=Een rustgevende melodie brengt alle wezens in je gezichtsveld in een diepe slaap, waardoor je de kans krijgt om te vluchten of een verrassingsaanval uit te voeren.
items.scrolls.scrolloflullaby.name=rol van slaapliedje
items.scrolls.scrolloflullaby.sooth=De perkamentrol speelt een rustgevende melodie. Je voelt je erg slaperig.
items.scrolls.scrollofmagicmapping.desc=Wanneer deze rol wordt gelezen, zal een kristalhelder beeld in je geheugen worden gegrift, dat je de precieze indeling van het level laat zien en alle verborgen geheimen onthult. De locaties van voorwerpen en wezens blijven onbekend.
items.scrolls.scrollofmagicmapping.layout=Je bent nu op de hoogte van de levelindeling.
items.scrolls.scrollofmagicmapping.name=rol van magische kaart
items.scrolls.scrollofmirrorimage.copies=De rol vormt een spiegelbeeld van jou.
items.scrolls.scrollofmirrorimage.desc=De bezwering op deze perkamentrol zal illusoir tweelingen van de lezer creëren, die zijn vijanden zullen achtervolgen.
items.scrolls.scrollofmirrorimage.name=rol van spiegelbeeld
items.scrolls.scrollofmirrorimage.no_copies=De rol probeert spiegelbeelden van jou te creëren, maar ze hebben nergens heen te gaan.
items.scrolls.scrollofrage.desc=Wanneer deze rol hardop wordt voorgelezen, zal er een oorverdovend gebrul losbarsten dat alle vijanden naar de lezer lokt en degenen in de omgeving woedend maakt.
items.scrolls.scrollofrage.name=rol van woede
items.scrolls.scrollofrage.roar=De perkamentrol stoot een woedend gebrul uit dat door de hele kerker galmt!
items.scrolls.scrollofrecharging.desc=De pure magische kracht die in dit perkament besloten ligt, zal, wanneer deze wordt vrijgelaten, alle toverstokken van de lezer weer volledig opladen.
items.scrolls.scrollofrecharging.name=rol van opladen
items.scrolls.scrollofrecharging.surge=Een golf van energie stroomt door je lichaam en geeft je toverstokken nieuwe kracht!
items.scrolls.scrollofremovecurse.cleansed=Je voorwerp straalt een zuiverend licht uit en een kwaadaardige energie verdwijnt!
items.scrolls.scrollofremovecurse.desc=De spreuk op deze perkamentrol zal onmiddellijk alle kwade betoveringen verwijderen van het wapen, de bepantsering, de ringen en de voorwerpen die de lezer bij zich draagt, waardoor de drager ze niet kan verwijderen.
items.scrolls.scrollofremovecurse.inv_title=Reinig een voorwerp
items.scrolls.scrollofremovecurse.name=perkament om de vloek te verwijderen
items.scrolls.scrollofremovecurse.not_cleansed=Je voorwerp geeft een reinigend licht af, maar er gebeurt verder niets.
items.scrolls.scrollofremovecurse.spirit=Jouw perkament bevrijdt de gekwelde geest!
items.scrolls.scrollofretribution.blast=Krachtige magische energie barst uit de rol!
items.scrolls.scrollofretribution.desc=Deze perkamentrol bevat vernietigende energie die het lijden van de lezer naar buiten kanaliseert in een explosie van kracht. Hoe zwakker de lezer is, hoe meer schade hij of zij zal aanrichten. Bij een zeer lage gezondheid kan deze perkamentrol de meeste vijanden onmiddellijk doden. Het gebruik van de perkamentrol eist echter zijn tol van de gebruiker, waardoor hij of zij verblind en verzwakt raakt.
items.scrolls.scrollofretribution.name=rol van vergelding
items.scrolls.scrollofteleportation.cant_reach=Je kunt daar niet naartoe teleporteren.
items.scrolls.scrollofteleportation.desc=De spreuk op dit perkament transporteert de lezer direct naar een willekeurige locatie in de kerker. Hij kan gebruikt worden om aan een gevaarlijke situatie te ontsnappen, maar de onfortuinlijke lezer kan zich daardoor ook in een nog gevaarlijkere omgeving bevinden.
items.scrolls.scrollofteleportation.name=teleportatierol
items.scrolls.scrollofteleportation.no_tele=De teleportatiemagie mislukt.
items.scrolls.scrollofteleportation.prompt=Kies een locatie om naartoe te teleporteren
items.scrolls.scrollofteleportation.tele=In een oogwenk werd je naar een andere locatie in het level geteleporteerd.
items.scrolls.scrollofterror.desc=Een flits van rood licht zal alle wezens in je gezichtsveld met angst vervullen, waardoor ze zich omdraaien en vluchten. Het aanvallen van een vluchtende vijand zal het effect opheffen.
items.scrolls.scrollofterror.many=De rol geeft een felle rode lichtflits af en de monsters slaan op de vlucht!
items.scrolls.scrollofterror.name=rol van terreur
items.scrolls.scrollofterror.none=De rol straalt een felle rode lichtflits uit.
items.scrolls.scrollofterror.one=De rol geeft een felle rode lichtflits af en de %s vlucht weg!
items.scrolls.scrolloftransmutation.desc=Deze perkamentrol bevat krachtige transmutatiemagie. Wanneer deze op een geschikt voorwerp wordt gebruikt, verandert het dit in een ander voorwerp van hetzelfde type. De magie behoudt zelfs upgrades, betoveringen en glyphs. Perkamentrollen en drankjes worden getransmuteerd in hun exotische equivalent, en omgekeerd.
items.scrolls.scrolloftransmutation.inv_title=Een voorwerp omzetten
items.scrolls.scrolloftransmutation.morph=Je voorwerp verandert in iets heel anders!
items.scrolls.scrolloftransmutation.name=rol van transmutatie
items.scrolls.scrolloftransmutation.nothing=Er gebeurt niets interessants.
items.scrolls.scrollofupgrade.desc=Deze perkamentrol verbetert één enkel voorwerp, waardoor de kwaliteit ervan toeneemt. Een toverstaf zal krachtiger worden en het aantal ladingen zal toenemen; een wapen zal meer schade toebrengen of vaker doel treffen; een harnas zal meer klappen afweren; het effect van een ring op de drager zal intensiveren. Wapens en harnassen zullen ook minder kracht vereisen om te gebruiken, en eventuele vloeken op het voorwerp zullen worden opgeheven.
items.scrolls.scrollofupgrade.inv_title=Upgrade een item
items.scrolls.scrollofupgrade.name=rol van verbetering
items.scrolls.scrollofupgrade.remove_curse=De upgrade-rol heft de vloek op je voorwerp op!
items.scrolls.scrollofupgrade.weaken_curse=De upgrade-rol verzwakt de vloek op je voorwerp.
items.spells.alchemize$wndalchemizeitem.energize=Verander in %d-energie
items.spells.alchemize$wndalchemizeitem.energize_1=Zet 1 om in %d-energie
items.spells.alchemize$wndalchemizeitem.energize_all=Zet alles om in %d-energie
items.spells.alchemize$wndalchemizeitem.sell=Verander in %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Verander 1 in %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Verander alles in %dg
items.spells.alchemize.desc=Deze spreuk bevat transformatieve krachten die vergelijkbaar zijn met die in een alchemieketel. Elke keer dat de spreuk wordt uitgesproken, kan de gebruiker een voorwerp (of een stapel voorwerpen) omzetten in goud of alchemistische energie. Het omzetten van drankjes of perkamenten in energie zal ze zelfs identificeren! Een paar Alchemize-gebruiksmogelijkheden worden in winkels verkocht, maar veel meer kunnen worden gemaakt met behulp van alchemie door een zaadje, een runensteen en een beetje alchemistische energie te combineren.
items.spells.alchemize.name=alchemiseren
items.spells.alchemize.prompt=Alchemiseer een voorwerp
items.spells.beaconofreturning.creatures=De psychische aura van naburige wezens verhindert op dit moment teleporteren.
items.spells.beaconofreturning.desc=Deze complexe spreuk geeft de gebruiker de mogelijkheid om terug te keren naar een vooraf ingestelde locatie, ongeacht de afstand. De spreuk wordt pas verbruikt bij terugkeer. Je kunt de spreuk zo vaak instellen als je wilt, maar hij onthoudt alleen de laatst ingestelde locatie.
items.spells.beaconofreturning.desc_set=Dit baken was ergens op verdieping %d geplaatst.
items.spells.beaconofreturning.name=baken van terugkeer
items.spells.beaconofreturning.preventing=De sterke magische aura van deze plek verhindert je om de spreuk te gebruiken!
items.spells.beaconofreturning.set=Het baken is ingesteld op uw huidige locatie.
items.spells.beaconofreturning.wnd_body=De instelling overschrijft de locatie waarop het baken eerder was ingesteld.\n\nReturning keert terug naar je laatst ingestelde locatie en verbruikt één gebruik van de spreuk.
items.spells.beaconofreturning.wnd_return=OPBRENGST
items.spells.beaconofreturning.wnd_set=SET
items.spells.curseinfusion.desc=Deze spreuk doordrenkt een uitrustingsstuk met dezelfde krachtige, kwaadaardige magie die aanwezig is in DM-300. Het voorwerp waarop de spreuk wordt gebruikt, wordt onmiddellijk vervloekt en elke betovering of glyph die het had, wordt overschreven. In het geval van wapens, pantsers en toverstaven krijgt het voorwerp naast de vloek ook upgrades. Upgrades door vloekinfusie stapelen niet op en gaan verloren als de vloek van het voorwerp wordt opgeheven. Meerdere vloekinfusies kunnen ook worden gebruikt om de vloek op een wapen of pantser te veranderen.
items.spells.curseinfusion.inv_title=Vervloek een voorwerp
items.spells.curseinfusion.name=vloekinfusie
items.spells.magicalinfusion.desc=Deze spreuk bezit dezelfde magische kracht als een upgrade-rol, maar in een stabielere vorm.\n\nNaast het op de normale manier upgraden van een voorwerp, zal het nooit een betovering, glyph of vloek verwijderen.
items.spells.magicalinfusion.infuse=Je voorwerp is doordrenkt met mysterieuze energie!
items.spells.magicalinfusion.inv_title=Een voorwerp doordrenken
items.spells.magicalinfusion.name=magische infusie
items.spells.magicalporter.desc=Deze spreuk verplaatst elk voorwerp waarop hij wordt uitgesproken op magische wijze. In tegenstelling tot een baken van een handelaar worden de voorwerpen echter naar de ingang van de volgende baasverdieping getransporteerd.
items.spells.magicalporter.inv_title=Een item vervoeren
items.spells.magicalporter.name=magische drager
items.spells.magicalporter.nowhere=Er is geen plek waar je een item naartoe kunt transporteren.
items.spells.phaseshift.desc=Deze chaotische spreuk teleporteert elk personage waarop hij gericht is naar een willekeurige locatie op de huidige verdieping en verlamt hem voor een aanzienlijke tijd. Krachtige vijanden kunnen het verlammende effect weerstaan. Deze spreuk kan op een doelwit of op de gebruiker zelf gericht worden.
items.spells.phaseshift.name=faseverschuiving
items.spells.phaseshift.no_target=Er is niets om naartoe te teleporteren.
items.spells.reclaimtrap.desc=Deze spreuk bevat restanten van de mechanische energie van DM-300. Wanneer deze spreuk op een actieve val wordt uitgesproken, zal de kracht van de val zich aan jou hechten, waardoor je de spreuk opnieuw kunt gebruiken om deze kracht uit te stoten en het effect van de val op elke gewenste locatie te activeren. Sommige vallen werken echter mogelijk niet overal, en er kan slechts één val tegelijk worden opgeslagen.
items.spells.reclaimtrap.desc_trap=De spreuk is momenteel klaar om een _%s_ te activeren.
items.spells.reclaimtrap.name=terugwinnen val
items.spells.reclaimtrap.no_trap=Er is daar geen valstrik.
items.spells.recycle.desc=Deze spreuk bevat een minder krachtige vorm van transmutatiemagie. Hoewel hij niet werkt op uitrusting, kan deze spreuk een perkamentrol, drankje, zaadje, runensteen of pijlpunt omzetten in een willekeurig voorwerp van hetzelfde type.
items.spells.recycle.inv_title=Recycle een artikel
items.spells.recycle.name=recycle
items.spells.recycle.recycled=Uw artikel is gerecycled tot: %s.
items.spells.spell.ac_cast=VORM
items.spells.spell.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.spells.spell.no_magic=Je kunt geen spreuken uitspreken als je immuun bent voor magie.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Deze spreuk kanaliseert de energie van de elementaire gloed die gebruikt is om hem te maken, en stelt je in staat een bevriende elementaal op te roepen om met je mee te vechten! Er kan slechts één elementaal tegelijk worden opgeroepen, maar de spreuk kan opnieuw worden uitgesproken om de elementaal kosteloos naar je terug te laten keren.
items.spells.summonelemental.desc_chaos=De spreuk straalt momenteel chaotische energie uit en zal een _chaos-elementaal_ oproepen. Je kunt een ander voorwerp betoveren, maar de spreuk verliest dan zijn huidige betovering.
items.spells.summonelemental.desc_fire=De spreuk is momenteel heet om aan te raken en zal een vuurelementaal oproepen. Je kunt een ander voorwerp betoveren, maar de spreuk verliest dan zijn huidige betovering.
items.spells.summonelemental.desc_frost=De spreuk voelt momenteel koud aan en roept een _vorstelementaal_ op. Je kunt een ander voorwerp betoveren, maar de spreuk verliest dan zijn huidige betovering.
items.spells.summonelemental.desc_newborn=De spreuk is momenteel niet versterkt en roept een _pasgeboren elementaal_ op zonder aanval op afstand. Je kunt een specifiek drankje van vloeibare vlam, een drankje van ijs, een oplaadrol of een transmutatierol versterken om de spreuk krachtiger te maken, waardoor toekomstige oproepingen een elementaal met volledige kracht zullen zijn!
items.spells.summonelemental.desc_shock=De spreuk straalt momenteel statische energie uit en zal een schokelementaal oproepen. Je kunt een ander voorwerp betoveren, maar de spreuk verliest dan zijn huidige betovering.
items.spells.summonelemental.imbue_prompt=Een voorwerp doordrenken
items.spells.summonelemental.name=roep elementaal op
items.spells.targetedspell.inv_title=Een voorwerp doordrenken
items.spells.targetedspell.prompt=Kies een doelwit
items.spells.telekineticgrab.cant_grab=Dat kun je niet pakken.
items.spells.telekineticgrab.desc=Met deze spreuk kan de gebruiker op afstand alle voorwerpen op een locatie pakken, of alle geworpen wapens die aan een vijand vastzitten!\n\nHij kan niet worden gebruikt om voorwerpen te pakken die van iemand anders zijn, of om containers zoals kisten te pakken.
items.spells.telekineticgrab.name=telekinetische greep
items.spells.telekineticgrab.no_target=Daar valt niets te grijpen.
items.spells.unstablespell.desc=Dit kleine zwarte vierkante kristal heeft verschuivende runensymbolen op elk van zijn vlakken.\n\nWanneer het geactiveerd wordt, activeert het het effect van een willekeurige perkamentrol. Het effect van de perkamentrol is altijd gericht op gevechten als er vijanden in je gezichtsveld zijn, en altijd niet-gevechtsgericht in andere gevallen.
items.spells.unstablespell.name=onstabiele spreuk
items.spells.wildenergy.desc=Deze spreuk bevat een deel van de vervloekte energie die DM-300 aandreef. Bij het uitspreken laadt hij je toverstokken en gedragen artefacten weer op en activeert hij een willekeurig vervloekt toverstokeffect. Je kunt echter wel een richting kiezen waarin deze vervloekte magie zich verspreidt.
items.spells.wildenergy.name=wilde energie
items.stones.inventorystone.ac_use=GEBRUIK
items.stones.runestone$placeholder.name=runensteen
items.stones.runestone.discover_hint=Je kunt dit voorwerp willekeurig in de kerker vinden, of het via alchemie maken.
items.stones.stoneofaggression$aggression.desc=Manipulatieve magie zorgt ervoor dat alle vijanden in de buurt er de voorkeur aan geven om dit personage aan te vallen.\n\nAantal resterende beurten: %s.
items.stones.stoneofaggression$aggression.name=gericht
items.stones.stoneofaggression.desc=Wanneer deze steen naar een bondgenoot of vijand wordt gegooid, zullen alle nabijgelegen vijanden gedurende een korte tijd de voorkeur geven aan het aanvallen van dat personage. Baasvijanden kunnen het effect echter weerstaan, waardoor de duur aanzienlijk wordt verkort en ze minder schade oplopen door de aanvallen van hun handlangers.
items.stones.stoneofaggression.name=steen van agressie
items.stones.stoneofaugmentation$wndaugment.cancel=Laat maar zitten
items.stones.stoneofaugmentation$wndaugment.choice=Wat zou u graag willen verbeteren?
items.stones.stoneofaugmentation$wndaugment.damage=Schade
items.stones.stoneofaugmentation$wndaugment.defense=Verdediging
items.stones.stoneofaugmentation$wndaugment.evasion=Ontwijking
items.stones.stoneofaugmentation$wndaugment.none=Augmentatie verwijderen
items.stones.stoneofaugmentation$wndaugment.speed=Snelheid
items.stones.stoneofaugmentation.desc=Deze runensteen bezit krachtige magie waarmee je uitrusting kunt verbeteren door één eigenschap te versterken ten koste van een andere. Door hem op een wapen te gebruiken, kun je ofwel de snelheid ofwel de schade verhogen. Werpwapens zullen ook duurzaamheid winnen of verliezen in verhouding tot hun snelheid. Door hem op een pantser te gebruiken, kun je ofwel de verdediging ofwel de ontwijking verhogen.
items.stones.stoneofaugmentation.discover_hint=Je kunt dit voorwerp in een winkel kopen of via alchemie maken.
items.stones.stoneofaugmentation.inv_title=Een item uitbreiden
items.stones.stoneofaugmentation.name=steen van augmentatie
items.stones.stoneofblast.desc=Deze runensteen explodeert direct op de plek waar hij wordt gegooid. Net als een bom zal de explosie schade toebrengen aan alles in de buurt.
items.stones.stoneofblast.name=steen van explosie
items.stones.stoneofblink.desc=Deze runensteen teleporteert de gebruiker naar de locatie waar hij naartoe wordt gegooid.
items.stones.stoneofblink.name=steen van knipperen
items.stones.stoneofclairvoyance.desc=Deze steen onthult direct alle tegels in een zeer groot gebied rondom de plek waar hij wordt gegooid. Het effect reikt zelfs door muren heen.
items.stones.stoneofclairvoyance.name=steen van helderziendheid
items.stones.stoneofdeepsleep.desc=Wanneer deze steen naar een vijand wordt gegooid, zal hij hem in een diepe magische slaap brengen. Vijanden die in magische slaap verkeren, zullen voor altijd slapen totdat ze worden gestoord.
items.stones.stoneofdeepsleep.name=steen van diepe slaap
items.stones.stoneofdetectmagic.desc=Deze runensteen kan detecteren of magie een voorwerp beïnvloedt. Door deze steen op een onbekend voorwerp te gebruiken, kun je zien of het beïnvloed is door een kwaadaardige vloek en of het beïnvloed is door positieve magie, zoals een betovering of upgrades.
items.stones.stoneofdetectmagic.detected_bad=Je detecteert kwaadaardige magie die dit voorwerp beïnvloedt!
items.stones.stoneofdetectmagic.detected_both=Je detecteert zowel positieve als kwaadaardige magie die dit voorwerp beïnvloedt!
items.stones.stoneofdetectmagic.detected_good=Je detecteert positieve magie die dit voorwerp beïnvloedt!
items.stones.stoneofdetectmagic.detected_none=Je detecteert geen magie die dit voorwerp beïnvloedt.
items.stones.stoneofdetectmagic.inv_title=Een item detecteren
items.stones.stoneofdetectmagic.name=steen om magie te detecteren
items.stones.stoneofdisarming.desc=Deze runensteen bevat magie waarmee schadelijke vallen die in de kerker verborgen liggen, onschadelijk gemaakt kunnen worden. Hij kan tot 9 vallen in de omgeving waar hij wordt gegooid uitschakelen.
items.stones.stoneofdisarming.name=steen van ontwapening
items.stones.stoneofenchantment.armor=Je pantser gloeit in het donker!
items.stones.stoneofenchantment.desc=Deze runensteen bezit betoverende magie. In tegenstelling tot een upgrade-rol verhoogt hij niet de directe kracht van een voorwerp, maar voorziet hij een wapen of pantser van een betovering, waardoor het een nieuwe kracht krijgt.
items.stones.stoneofenchantment.inv_title=Betover een voorwerp
items.stones.stoneofenchantment.name=steen der betovering
items.stones.stoneofenchantment.weapon=Je wapen gloeit in het donker!
items.stones.stoneoffear.desc=Wanneer deze steen naar een personage wordt gegooid, zal deze overmand worden door angst en zich omdraaien en vluchten. Het aanvallen van een vluchtend personage verkort het effect.
items.stones.stoneoffear.name=steen van angst
items.stones.stoneofflock.desc=Deze runensteen roept voor korte tijd magische schapen op rond de plek waar hij wordt gegooid.
items.stones.stoneofflock.name=steen van kudde
items.stones.stoneofintuition$wndguess.break=Je steen van intuïtie verkruimelt tot stof...
items.stones.stoneofintuition$wndguess.correct=Klopt. Het type artikel is vastgesteld!
items.stones.stoneofintuition$wndguess.incorrect=Je gok was onjuist.
items.stones.stoneofintuition$wndguess.text=Raad eens wat voor soort voorwerp het is. Als je het goed raadt, wordt het type onthuld!
items.stones.stoneofintuition.break_info=Je kunt intuïtiestenen twee keer gebruiken voordat er een breekt; bij het volgende gebruik wordt er geen steen verbruikt.
items.stones.stoneofintuition.break_warn=Je hebt eerder een steen van intuïtie gebruikt, dus _je volgende gebruik zal een steen verbruiken_.
items.stones.stoneofintuition.desc=Deze runensteen bevat een zwakkere versie van de magie die te vinden is in identificatierollen. In plaats van een voorwerp direct te identificeren, werkt hij op je intuïtie, waardoor je kunt proberen het type drankje, rol of ring te identificeren door te gokken.
items.stones.stoneofintuition.inv_title=Selecteer een item
items.stones.stoneofintuition.name=steen van intuïtie
items.stones.stoneofshock.desc=Deze runensteen ontketent een explosie van elektrische energie die alle nabijgelegen doelen kortstondig verlamt en de werpstaf oplaadt voor elk geraakt doelwit.
items.stones.stoneofshock.name=steen van shock
items.stylus.ac_inscribe=INSCHRIJVEN
items.stylus.cursed=De magie van de stylus werkt niet op vervloekte bepantsering.
items.stylus.desc=Deze geheimzinnige stylus is gemaakt van een donkere, zeer harde steen. Hiermee kun je een magisch symbool op je pantser graveren, maar je hebt geen controle over welk symbool het wordt; de stylus bepaalt dat voor je.
items.stylus.identify=Je moet eerst vaststellen of dat pantser vervloekt is.
items.stylus.inscribed=Je hebt je harnas met de stylus gegraveerd.
items.stylus.name=geheimzinnige stylus
items.stylus.prompt=Kies een pantser
items.tengusmask.ac_wear=DRAGEN
items.tengusmask.desc=Dit masker viel van Tengu's gezicht toen hij stierf, je voelt een enorme magische kracht ervan uitgaan. Was dit masker Tengu's bron van kracht? Wanneer je het draagt, wordt de enorme kracht van het masker op jou overgedragen, waardoor je een subklasse voor je held kunt kiezen. Welke subklasse kies je?
items.tengusmask.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.tengusmask.name=Tengu's masker
items.tengusmask.used=Het masker valt uiteen zodra de kracht ervan in je stroomt!
items.torch.ac_light=LICHT
items.torch.desc=Een onmisbaar item voor avonturiers: wanneer een kerker in het donker gehuld is, kan een fakkel helpen de weg te vinden.
items.torch.name=fakkel
items.trinkets.chaoticcenser.desc=Na enige tijd in de alchemieketel lijkt dit wierookvat vanzelf rook te produceren! Deze gassen hopen zich op en zullen met semi-willekeurige tussenpozen uit het wierookvat naar vijanden worden gespoten. Het lijkt in staat om allerlei soorten gassen te produceren, maar je krijgt een waarschuwing vlak voordat het wierookvat activeert.
items.trinkets.chaoticcenser.name=chaotische wierookbrander
items.trinkets.chaoticcenser.spew=Je wierookbrander staat op het punt om uit te spuwen: %s.
items.trinkets.chaoticcenser.stats_desc=Op het huidige niveau zal dit snuisterijtje ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand produceren. Gassen verschijnen alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotischer en krachtiger zijn.
items.trinkets.chaoticcenser.typical_stats_desc=Normaal gesproken zal dit snuisterijtje ongeveer elke _%d_ beurten een schadelijk gas in de buurt van een vijand laten verschijnen. Gassen verschijnen alleen als er vijanden aanwezig zijn. Op hogere niveaus is de kans groter dat deze gassen exotischer en krachtiger zijn.
items.trinkets.crackedspyglass.desc=Deze handtelescoop zou een toonbeeld zijn van uitstekend en nauwkeurig vakmanschap, ware het niet voor de barst in de voorste lens. De verrekijker lijkt je te helpen door nieuwe voorwerpen in de kerker te onthullen, maar door het defect zijn de onthulde voorwerpen erg moeilijk te zien!
items.trinkets.crackedspyglass.name=gebarsten verrekijker
items.trinkets.crackedspyglass.stats_desc=Op het huidige niveau heeft dit snuisterijtje een kans van _%1$s%%_ om op elke verdieping (behalve de eindbaas) een extra verborgen voorwerp te creëren.
items.trinkets.crackedspyglass.stats_desc_upgraded=Op het huidige niveau heeft dit snuisterijtje een kans van _100%%_ om een extra verborgen voorwerp te creëren op elke verdieping die geen eindbaas bevat, en een kans van _%1$s%%_ om een tweede extra verborgen voorwerp te creëren.
items.trinkets.crackedspyglass.typical_stats_desc=Normaal gesproken heeft dit snuisterijtje een kans van _%1$s%%_ om op elke verdieping (behalve de eindbaas) een extra verborgen voorwerp te creëren.
items.trinkets.dimensionalsundial.desc=Deze kleine, draagbare zonnewijzer is op de een of andere manier in staat om een schaduw te werpen in de diepten van de kerker, zelfs als je hem niet rechtop houdt. Nog vreemder is dat de positie van de schaduw in deze wereld geen verband lijkt te houden met de zon. Wanneer er geen schaduw wordt geworpen, lijkt de zonnewijzer gevaar aan te trekken.
items.trinkets.dimensionalsundial.name=dimensionale zonnewijzer
items.trinkets.dimensionalsundial.stats_desc=Op het huidige niveau zal dit snuisterijtje de spawnfrequentie van vijanden met _%1$d%%_ verlagen gedurende de dag in de echte wereld (8.00-20.00 uur) en de spawnfrequentie van vijanden met _%2$d%%_ verhogen 's nachts (20.00-8.00 uur).
items.trinkets.dimensionalsundial.typical_stats_desc=Normaal gesproken zal dit snuisterijtje de spawnfrequentie van vijanden met _%1$d%%_ verlagen gedurende de dag in de echte wereld (8.00-20.00 uur) en de spawnfrequentie van vijanden met _%2$d%%_ verhogen 's nachts (20.00-8.00 uur).
items.trinkets.dimensionalsundial.warning=Je zonnewijzer werpt geen schaduw, je voelt je ongemakkelijk.
items.trinkets.exoticcrystals.desc=Deze kleine roze kristallen hebben dezelfde vorm als kristallen van alchemistische energie. Hoewel ze niet direct voor energie gebruikt kunnen worden, lijken ze op de een of andere manier invloed uit te oefenen op de drankjes en spreuken die je vindt.
items.trinkets.exoticcrystals.name=exotische kristallen
items.trinkets.exoticcrystals.stats_desc=Op het huidige niveau vervangt dit snuisterijtje de drops van drankjes of perkamenten (_%s%%_) door hun exotische equivalenten. Dit heeft geen invloed op krachtdrankjes, upgrade-perkamenten of items die worden gegenereerd om gevaarlijke kamers op te lossen.
items.trinkets.exoticcrystals.typical_stats_desc=Normaal gesproken vervangt dit snuisterijtje de _%s%%_ van drankjes of perkamenten die je vindt door hun exotische equivalenten. Dit heeft geen invloed op krachtdrankjes, upgrade-perkamenten of items die worden gegenereerd om gevaarlijke kamers op te lossen.
items.trinkets.eyeofnewt.desc=Dit goud-zwarte salamanderoog is een veelvoorkomend ingrediënt, nu verwerkt in een sieraad. Het oog lijkt je zicht te beperken in ruil voor een andere manier van kijken.
items.trinkets.eyeofnewt.name=oog van salamander
items.trinkets.eyeofnewt.stats_desc=Op het huidige niveau zal dit snuisterijtje je zichtbereik met _%1$s%%_ verminderen, maar je tevens telepathisch zicht geven op vijanden binnen _%2$d_ vakjes.
items.trinkets.eyeofnewt.typical_stats_desc=Normaal gesproken zal dit snuisterijtje je zichtbereik met _%1$s%%_ verminderen, maar je tevens telepathisch zicht geven op vijanden binnen een straal van _%2$d_ tegels.
items.trinkets.ferrettuft.desc=Een plukje zijdezacht wit frettenbont, bijeengehouden door een limoengroen lintje dat tot een strik is geknoopt. Fretten staan bekend om hun behendigheid, ondeugendheid en gebrek aan integriteit. Een deel van die kracht lijkt van het sieraad af te stralen, waardoor het nog makkelijker is om alles in de buurt te ontwijken.
items.trinkets.ferrettuft.name=frettenpluim
items.trinkets.ferrettuft.stats_desc=Op het huidige niveau verhoogt dit snuisterijtje de ontwijking van alle personages met _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Normaal gesproken verhoogt dit snuisterijtje de ontwijking van alle personages met _%1$s%%_.
items.trinkets.mimictooth.desc=Deze grote, scherpe tand moet uit een zeer ongelukkige nabootser getrokken zijn. Hij lijkt de nabootsers in de kerker te beïnvloeden, waardoor ze vaker voorkomen en gevaarlijker worden.
items.trinkets.mimictooth.name=nabootsende tand
items.trinkets.mimictooth.stats_desc=Op het huidige niveau zal dit snuisterijtje ervoor zorgen dat allerlei soorten mimics _%1$sx_ vaker voorkomen en veel moeilijker te detecteren zijn, maar het zal ook de hoeveelheid buit die ze laten vallen vergroten. Elke kerkerverdieping heeft ook een kans van _%2$s%%_ om een extra stealthy ebony mimic te bevatten.
items.trinkets.mimictooth.typical_stats_desc=Doorgaans zorgt dit snuisterijtje ervoor dat allerlei soorten mimics _%1$sx_ vaker voorkomen en veel moeilijker te detecteren zijn, maar het verhoogt ook de hoeveelheid buit die ze laten vallen. Elke kerkerverdieping heeft bovendien een kans van _%2$s%%_ om een extra stealthy ebony mimic te bevatten.
items.trinkets.mossyclump.desc=Deze pluk nat mos lijkt zijn vocht vast te houden, hoe hard je er ook in knijpt. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor gras en water eerder verschijnen.
items.trinkets.mossyclump.name=mosachtige klomp
items.trinkets.mossyclump.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat _%d%%_ van de ongethematiseerde verdiepingen gevuld worden met water of gras.\n\nDit snuisterijtje kost meer energie om te upgraden.
items.trinkets.mossyclump.typical_stats_desc=Normaal gesproken zorgt dit snuisterijtje ervoor dat _%d%%_ van de ongethematiseerde verdiepingen gevuld worden met water of gras.\n\nHet upgraden van dit snuisterijtje kost meer energie.
items.trinkets.parchmentscrap.desc=Dit kleine stukje perkament lijkt afkomstig te zijn van een boekrol. Het heeft een deel van zijn magie behouden en lijkt invloed uit te oefenen op wapens en harnassen die in de kerker gevonden worden.
items.trinkets.parchmentscrap.name=perkamentfragment
items.trinkets.parchmentscrap.stats_desc=Op het huidige niveau maakt dit snuisterijtje betoveringen en glyphs _%dx_ net zo gewoon, en vloeken op wapens en bepantsering _%sx_ net zo gewoon. Vloeken op toverstaven, ringen of artefacten worden niet beïnvloed.\n\nDit snuisterijtje kost meer energie om te upgraden.
items.trinkets.parchmentscrap.typical_stats_desc=Doorgaans maakt dit snuisterijtje betoveringen en glyphs _%dx_ net zo gewoon, en vloeken op wapens en bepantsering _%sx_ net zo gewoon. Vloeken op toverstaven, ringen of artefacten worden niet beïnvloed.\n\nDit snuisterijtje kost meer energie om te upgraden.
items.trinkets.petrifiedseed.desc=Dit zaad is gefossiliseerd, hetzij door langzame geologische processen, hetzij door magie. Het zaad lijkt op magische wijze de flora van de kerker te beïnvloeden en vervangt af en toe plantenzaden door runenstenen.
items.trinkets.petrifiedseed.name=versteend zaad
items.trinkets.petrifiedseed.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat vertrapt gras runenstenen laat vallen in plaats van zaden _%1$s%%_ van de tijd, en zorgt het er ook voor dat hoog gras vaker voorwerpen laat vallen _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Doorgaans zorgt dit snuisterijtje ervoor dat vertrapt gras runenstenen laat vallen in plaats van zaden _%1$s%%_ van de tijd, en zorgt het er ook voor dat hoog gras vaker voorwerpen laat vallen _%2$s%%_.
items.trinkets.ratskull.desc=Dit macabere snuisterijtje is nauwelijks groter dan de schedel van een gewone rat, wat vreemd genoeg een zeldzaamheid is in deze kerker. De magische invloed van de schedel lijkt de zeldzamere bewoners van de kerker aan te trekken, waardoor ze veel vaker verschijnen.
items.trinkets.ratskull.name=rattenschedel
items.trinkets.ratskull.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat zeldzame exotische vijanden _%dx_ waarschijnlijker verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen mimics en gepantserde beelden.
items.trinkets.ratskull.typical_stats_desc=Doorgaans zorgt dit snuisterijtje ervoor dat zeldzame exotische vijanden _%dx_ vaker verschijnen. De schedel is echter slechts half zo effectief in het aantrekken van kristallen mimics en gepantserde beelden.
items.trinkets.saltcube.desc=Dit grote zoutkristal was in een bijna perfecte kubusvorm gesneden en slaagde er op de een of andere manier in om de helft van het water uit de alchemiepot te laten weglopen in plaats van op te lossen. Het lijkt het voedsel dat je eet op magische wijze te dehydrateren en te conserveren, waardoor je langer een verzadigd gevoel hebt, maar het herstel van je gezondheid vertraagt wanneer je niet aan het verhongeren bent.
items.trinkets.saltcube.name=zoutblokje
items.trinkets.saltcube.stats_desc=Op het huidige niveau verlengt dit snuisterijtje de tijd voordat je honger krijgt met _%1$s%%_, maar verlaagt het ook je gezondheidsregeneratie met _%2$s%%_, tenzij de verdieping vergrendeld is.
items.trinkets.saltcube.typical_stats_desc=Normaal gesproken verlengt dit snuisterijtje de tijd voordat je honger krijgt met _%1$s%%_, maar verlaagt het ook je gezondheidsregeneratie met _%2$s%%_, tenzij de verdieping vergrendeld is.
items.trinkets.shardofoblivion$thrownusetracker.desc=Je hebt onlangs een onbekend werpwapen gebruikt, wat voor een korte tijd telt als één stuk gebruikte onbekende uitrusting voor de Scherf van Vergetelheid.\n\nBeurten resterend: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Onbekend werpwapen gebruikt
items.trinkets.shardofoblivion$wandusetracker.desc=Je hebt onlangs een onbekende toverstaf gebruikt, wat voor de Scherf van Vergetelheid een korte tijd telt als één stuk gebruikte onbekende uitrusting.\n\nBeurten resterend: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Onbekende toverstaf gebruikt
items.trinkets.shardofoblivion.ac_identify=IDENTIFICEREN
items.trinkets.shardofoblivion.desc=Na te hebben gesudderd in de alchemieketel, is dit kleine scherfje vervloekt metaal veranderd in... niets? Licht lijkt eromheen te buigen en het zweeft op zijn plek wanneer je het niet vasthoudt. Het scherfje lijkt op magische wijze kracht te putten uit je onwetendheid, dus je kunt er waarschijnlijk het beste niet te veel over nadenken.
items.trinkets.shardofoblivion.identify=Jij identificeert het item!
items.trinkets.shardofoblivion.identify_not_yet=Dat item kan nog niet worden geïdentificeerd.
items.trinkets.shardofoblivion.identify_prompt=Identificeer een item
items.trinkets.shardofoblivion.identify_ready=Een voorwerp is klaar om te worden geïdentificeerd: %s. Gebruik je Scherf van Vergetelheid erop om het te identificeren.
items.trinkets.shardofoblivion.identify_ready_worn=Je versleten voorwerpen zijn nu allemaal klaar om geïdentificeerd te worden. Gebruik je Scherf van Vergetelheid op de voorwerpen om ze te identificeren.
items.trinkets.shardofoblivion.name=scherf van de vergetelheid
items.trinkets.shardofoblivion.stats_desc=Op het huidige niveau verhoogt dit snuisterijtje de kans dat vijanden buit laten vallen met 20%% voor elk stuk ongeïdentificeerde uitrusting dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d items_. De scherf voorkomt ook dat je uitrusting kunt identificeren, maar kan worden gebruikt om handmatig items te identificeren die daarvoor geschikt zijn.
items.trinkets.shardofoblivion.typical_stats_desc=Normaal gesproken verhoogt dit snuisterijtje de kans dat vijanden buit laten vallen met 20%% voor elk stuk ongeïdentificeerde uitrusting dat je hebt uitgerust of recent hebt gebruikt, tot een maximum van _%d items_. Het fragment voorkomt ook dat je uitrusting kunt identificeren, maar kan worden gebruikt om handmatig items te identificeren die daarvoor geschikt zijn.
items.trinkets.thirteenleafclover.desc=Op de een of andere manier heeft dit klavertje, door het sudderen in de alchemieketel, een heleboel extra blaadjes gekregen! Het is niet helemaal duidelijk of dit snuisterijtje geluk of ongeluk brengt, misschien zorgt het wel voor meer chaos in je geluk?
items.trinkets.thirteenleafclover.name=dertienbladige klaver
items.trinkets.thirteenleafclover.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat je maximaal _%1$d%%_ schade toebrengt en minimaal _%2$d%%_ schade.
items.trinkets.thirteenleafclover.typical_stats_desc=Normaal gesproken zorgt dit snuisterijtje ervoor dat je de maximale schade _%1$d%%_ van de tijd en de minimale schade _%2$d%%_ van de tijd toebrengt.
items.trinkets.trapmechanism.desc=Het kernmechanisme van een van de valkuilen in de kerker, zorgvuldig uit de vloer gehouwen zodat het meegenomen kan worden. Het lijkt op magische wijze verbonden te zijn met de kerker zelf, waardoor gevaarlijk terrein vaker voorkomt, maar ook je affiniteit ermee toeneemt.
items.trinkets.trapmechanism.name=valmechanisme
items.trinkets.trapmechanism.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat _%1$d%%_ van de ongethematiseerde verdiepingen gevuld raken met vallen of afgronden. Bovendien worden _%2$d%%_ van de verborgen vallen in de kerker zichtbaar.
items.trinkets.trapmechanism.typical_stats_desc=Normaal gesproken zorgt dit snuisterijtje ervoor dat _%1$d%%_ van de ongethematiseerde verdiepingen gevuld raken met vallen of afgronden. Bovendien worden _%2$d%%_ van de verborgen vallen in de kerker zichtbaar.
items.trinkets.trinket$placeholder.name=snuisterij
items.trinkets.trinket.discover_hint=Dit voorwerp heeft een kans om een optie te zijn wanneer je een snuisterij maakt via alchemie.
items.trinkets.trinketcatalyst$randomtrinket.desc=Een voorwerp in de buurt zit vast in een zakje dat je niet open krijgt. Het alchemieproces zal het zakje oplossen, maar je weet pas welk snuisterijtje je krijgt als je het gedaan hebt!
items.trinkets.trinketcatalyst$randomtrinket.name=willekeurig snuisterijtje
items.trinkets.trinketcatalyst.desc=Deze bal van magisch gouden stof glinstert in de duisternis van de kerker. Deze katalysator kan met een beetje alchemistische energie in een alchemieketel worden gebruikt om een uniek snuisterijtje te maken. Snuisterijen hebben verschillende effecten die de kerker of zijn bewoners enigszins veranderen. Snuisterijen kunnen worden geüpgraded met meer energie om hun effect te versterken, of worden weggegooid om het effect volledig te laten vervallen.
items.trinkets.trinketcatalyst.name=magische katalysator
items.trinkets.trinketcatalyst.window_text=Het water begint te gloeien zodra je de katalysator toevoegt. Er liggen een paar voorwerpen in de buurt die je met energie kunt doordrenken om er een magisch snuisterijtje van te maken.
items.trinkets.trinketcatalyst.window_title=maak een snuisterij
items.trinkets.vialofblood.desc=Dit dunne flesje bevat het bloed van een of andere bewoner van de kerker; het beweegt langzaam als je het flesje draait. Het lijkt op magische wijze de genezende effecten te versterken, maar ze tegelijkertijd ook te vertragen.
items.trinkets.vialofblood.name=buisje bloed
items.trinkets.vialofblood.stats_desc=Op het huidige niveau verhoogt dit snuisterijtje de totale hoeveelheid levenspunten die je verkrijgt door het drinken van genezingsdrankjes, waterzakken of gezondheidsbronnen met _%1$s%%_. Deze genezende effecten treden echter ook langzamer op, met een maximale regeneratie van _%2$s_ HP per beurt (dit schaalt met het heldenniveau).
items.trinkets.vialofblood.typical_stats_desc=Normaal gesproken verhoogt dit snuisterijtje de totale hoeveelheid levenspunten die je verkrijgt door het drinken van genezingsdrankjes, waterzakken of gezondheidsbronnen met _%1$s%%_. Deze genezende effecten treden echter ook langzamer op, met een maximale regeneratie van _%2$s_ HP per beurt (dit schaalt met het heldenniveau).
items.trinkets.wondrousresin.desc=Deze glinsterende blauwe hars lijkt de geconcentreerde essentie van de magie van een vervloekte toverstaf te bevatten. De magie uit de alchemieketel lijkt de hars enigszins te hebben gestabiliseerd, en nu beïnvloedt het jouw toverstaven.
items.trinkets.wondrousresin.name=wonderbaarlijke hars
items.trinkets.wondrousresin.stats_desc=Op het huidige niveau zorgt dit snuisterijtje ervoor dat de effecten van vervloekte toverstokken _%1$s%%_ van de tijd neutraal of positief worden, en zorgt het ervoor dat niet-vervloekte toverstokken _%2$s%%_ van de tijd een extra neutrale of positieve vervloekte bliksemstraal afvuren. Dit snuisterijtje kost meer energie om te upgraden.
items.trinkets.wondrousresin.typical_stats_desc=Normaal gesproken zorgt dit snuisterijtje ervoor dat de effecten van vervloekte toverstokken neutraal of positief worden (_%1$s%%_ van de tijd), en zorgt het ervoor dat niet-vervloekte toverstokken een extra neutrale of positieve vervloekte bliksemstraal afvuren (_%2$s%%_ van de tijd). Dit snuisterijtje kost meer energie om te upgraden.
items.wands.cursedwand.disguise=Je uiterlijk verandert voor je ogen!
items.wands.cursedwand.fire=Je ruikt een brandlucht...
items.wands.cursedwand.grass=Het gras schiet als paddenstoelen uit de grond!
items.wands.cursedwand.gravity=De zwaartekracht begint plotseling in willekeurige richtingen te trekken!
items.wands.cursedwand.gravity_end=De zwaartekrachtchaos eindigt.
items.wands.cursedwand.gravity_positive=De zwaartekracht begint plotseling in willekeurige richtingen te trekken, maar dit lijkt geen effect op je te hebben.
items.wands.cursedwand.mass_invuln=Een schitterend licht komt uit je toverstaf!
items.wands.cursedwand.nothing=Er gebeurt niets.
items.wands.cursedwand.ondeath=Je bent gedood door je eigen %s.
items.wands.cursedwand.petrify=Je blijft plotseling stokstijf staan!
items.wands.cursedwand.sinkhole=De grond begint om je heen te verzakken!
items.wands.cursedwand.sinkhole_positive=De grond begint te verzakken, maar voelt nog stevig genoeg aan onder je voeten.
items.wands.cursedwand.supernova=Een gloeiende bal van energie begint te groeien. Je kunt maar beter rennen!
items.wands.cursedwand.supernova_positive=Een gloeiende energiebal begint te groeien, maar voelt op de een of andere manier veilig aan.
items.wands.cursedwand.transmogrify_other=Je voorwerp verandert in iets anders!
items.wands.cursedwand.transmogrify_wand=Je toverstaf verandert in een ander voorwerp!
items.wands.damagewand.upgrade_stat_name_1=Magische schade
items.wands.wand$placeholder.name=toverstaf
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Deze %s is vervloekt!
items.wands.wand.cursed=Deze toverstaf is vervloekt, waardoor zijn magie chaotisch en willekeurig is.
items.wands.wand.fizzles=Je toverstaf sist; hij is waarschijnlijk niet genoeg opgeladen.
items.wands.wand.identify=Je bent nu voldoende vertrouwd met je toverstaf om hem te herkennen.
items.wands.wand.no_magic=Je toverstaf dooft; je kunt geen toverstaven gebruiken zolang je immuun bent voor magie.
items.wands.wand.not_cursed=Deze toverstaf is vrij van kwaadaardige magie.
items.wands.wand.prompt=Kies een locatie om te zappen.
items.wands.wand.resin_many=Deze toverstaf heeft _%d niveaus_ verkregen door arcane hars.
items.wands.wand.resin_one=Deze toverstaf heeft _1 niveau_ gewonnen door arcane hars.
items.wands.wand.self_target=Je kunt jezelf niet als doelwit kiezen!
items.wands.wandofblastwave.bmage_desc=Wanneer de Strijdmagiër een verlamde vijand raakt met een staf van explosieve golven, wordt de verlamming opgeheven om een explosie van extra magische schade toe te brengen. Dit heeft een korte afkoeltijd per vijand.
items.wands.wandofblastwave.desc=Deze toverstaf is gemaakt van een soort gemarmerde steen, met gouden accenten en een ronde zwarte edelsteen aan de punt. Hij voelt erg zwaar aan in de hand.
items.wands.wandofblastwave.eleblast_desc=Een elementaire explosie met een staf van explosiegolven richt 67% schade aan en stoot alle vijanden buiten het explosiegebied weg.
items.wands.wandofblastwave.knockback_ondeath=Je bent door de botsing om het leven gekomen...
items.wands.wandofblastwave.name=toverstaf van explosiegolf
items.wands.wandofblastwave.ondeath=Je hebt jezelf gedood met je eigen toverstaf van explosiegolven...
items.wands.wandofblastwave.staff_name=personeel van de explosiegolf
items.wands.wandofblastwave.stats_desc=Deze toverstaf schiet een projectiel af dat met grote kracht op een doelwitlocatie ontploft. De kracht van deze explosie veroorzaakt _%1$d-%2$d schade_ en is sterk genoeg om de meeste vijanden weg te slingeren.
items.wands.wandofblastwave.typical_stats_desc=Deze toverstaf schiet een projectiel af dat met grote kracht ontploft op een doelwitlocatie. De kracht van deze explosie veroorzaakt doorgaans _%1$d-%2$d schade_ en is sterk genoeg om de meeste vijanden weg te slingeren.
items.wands.wandofblastwave.upgrade_stat_name_2=Terugslag
items.wands.wandofcorrosion.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf van corrosie, bestaat de kans dat de vijand slijmerig wordt.
items.wands.wandofcorrosion.desc=Deze toverstaf heeft een asgrijs lichaam dat zich opent tot een schitterende oranje edelsteen.
items.wands.wandofcorrosion.eleblast_desc=Een elementaire explosie met een staf van corrosie brengt vijanden 4 beurten lang corrosie toe, beginnend bij 6 schade.
items.wands.wandofcorrosion.name=toverstaf van corrosie
items.wands.wandofcorrosion.staff_name=personeel van corrosie
items.wands.wandofcorrosion.stats_desc=Deze toverstaf schiet een projectiel af dat explodeert in een wolk van zeer corrosief gas op een beoogde locatie. Alles wat zich in deze wolk bevindt, loopt na verloop van tijd steeds meer schade op, beginnend bij _%d schade._
items.wands.wandofcorrosion.upgrade_stat_name_1=Corrosieschade
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolume
items.wands.wandofcorruption.already_corrupted=Dat karakter kan niet verder worden beïnvloed.
items.wands.wandofcorruption.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf der verderfelijkheid, bestaat de kans dat de vijand in een roes raakt.
items.wands.wandofcorruption.desc=Deze toverstaf straalt chaotische, duistere energie uit, mocht dat nog niet duidelijk zijn door het kleine decoratieve schedeltje op de punt.
items.wands.wandofcorruption.eleblast_desc=Een elementaire explosie met een staf der verderfelijkheid bezorgt vijanden 5 beurten lang chaos.
items.wands.wandofcorruption.name=toverstaf van corruptie
items.wands.wandofcorruption.staff_name=personeel van corruptie
items.wands.wandofcorruption.stats_desc=Deze toverstaf zal een explosie van verderfelijke energie vrijgeven die vijanden verzwakt en uiteindelijk naar jouw wil buigt. Vijanden kunnen de verderfelijkheid weerstaan, maar verzwakte vijanden zijn veel gemakkelijker te beïnvloeden dan gezonde vijanden.
items.wands.wandofcorruption.upgrade_stat_name_1=Corrumperende macht
items.wands.wandofcorruption.upgrade_stat_name_2=Debuffduur
items.wands.wandofdisintegration.bmage_desc=Wanneer een staf der desintegratie door de strijdmagiër wordt gehanteerd, heeft deze een groter aanvalsbereik, alsof hij een projectie-betovering bezit.
items.wands.wandofdisintegration.desc=Deze toverstaf is gemaakt van een massief, glad stuk obsidiaan, met een dieppaars licht dat langs de zijkant omhoog loopt en eindigt bij de punt. Hij gloeit van destructieve energie en staat klaar om naar voren te schieten.
items.wands.wandofdisintegration.eleblast_desc=Een elementaire explosie met een desintegratiestaf richt 100% schade aan en dringt door muren heen.
items.wands.wandofdisintegration.name=toverstaf van desintegratie
items.wands.wandofdisintegration.staff_name=personeel van desintegratie
items.wands.wandofdisintegration.stats_desc=Deze toverstaf schiet een straal af die door elk obstakel heen dringt en verder reikt naarmate hij meer geüpgraded is. De straal richt _%1$d-%2$d schade aan_ en veroorzaakt bovendien bonusschade voor elke vijand en muur die hij doorboort.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maximaal bereik
items.wands.wandoffireblast.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een vuurstraalstaf, bestaat de kans dat er een explosie ontstaat die vijanden beschadigt en al het nabijgelegen vuur verbruikt! Deze kans neemt toe naarmate er meer vuur in de buurt van de vijand is.
items.wands.wandoffireblast.desc=Deze toverstaf is gemaakt van rood gelakt hout, rijkelijk versierd met bladgoud om hem een vorstelijke uitstraling te geven. Hij knettert en sist aan de punt, klaar om zijn krachtige magie te ontketenen.
items.wands.wandoffireblast.eleblast_desc=Een elementaire explosie met een vuurstaf richt 100% schade aan, blaast deuren open en zet vijanden en terrein in brand.
items.wands.wandoffireblast.name=toverstaf van vuurexplosie
items.wands.wandoffireblast.staff_name=personeel van Fireblast
items.wands.wandoffireblast.stats_desc=Deze toverstaf stoot bij gebruik een kegel van vuur uit. De volgende aanval verbruikt _%1$d ladingen_ en richt _%2$d-%3$d schade_ aan. Hoe meer ladingen de toverstaf verbruikt, hoe groter en sterker het effect.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Laadschade
items.wands.wandoffireblast.upgrade_stat_name_2=2 Oplaadschade
items.wands.wandoffireblast.upgrade_stat_name_3=3 Oplaadschade
items.wands.wandoffrost.bmage_desc=Wanneer de Strijdmagiër een bevroren vijand raakt met een ijsstaf, bestaat de kans dat deze direct bevriest. Deze kans wordt groter naarmate de vijand meer is afgekoeld.
items.wands.wandoffrost.desc=Deze toverstaf lijkt gemaakt te zijn van een soort magisch ijs. Hij wordt helderder naar de afgeronde punt toe. Hij voelt erg koud aan, maar op de een of andere manier blijft je hand warm.
items.wands.wandoffrost.eleblast_desc=Een elementaire explosie met een ijsstaf richt 100% schade aan, bevriest vijanden en blust branden.
items.wands.wandoffrost.name=toverstaf van vorst
items.wands.wandoffrost.staff_name=personeel van vorst
items.wands.wandoffrost.stats_desc=Deze toverstaf schiet ijzige energiestralen op je vijanden af, die _%1$d-%2$d schade_ toebrengen en hen bevriezen. Het effect lijkt sterker in water. Vijanden die al bevroren of gekoeld zijn, lopen minder schade op door deze toverstaf.
items.wands.wandoffrost.upgrade_stat_name_2=Koelduur
items.wands.wandoflightning$lightningcharge.desc=De Strijdmagiër is momenteel opgeladen met energie, waardoor hij immuun is voor zijn bliksemstaf en het bereik van de bliksem die eruit kan schieten, wordt vergroot.\n\nBeurten resterend: %s.
items.wands.wandoflightning$lightningcharge.name=Elektrisch geladen
items.wands.wandoflightning.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een bliksemstaf, heeft hij een kans om zichzelf gedurende 10 beurten elektrisch op te laden. Zolang hij opgeladen is, is de Strijdmagiër immuun voor bliksemschade en kan hij bliksemstralen verder laten reiken.
items.wands.wandoflightning.desc=Deze toverstaf is gemaakt van massief metaal, waardoor hij verrassend zwaar is. Twee punten buigen naar elkaar toe aan het uiteinde, en er springt elektriciteit tussenin.
items.wands.wandoflightning.eleblast_desc=Een elementaire explosie met een bliksemstaf richt 100% schade aan, verlamt vijanden gedurende 5 beurten en elektrificeert water.
items.wands.wandoflightning.name=bliksemstaf
items.wands.wandoflightning.ondeath=Je hebt jezelf gedood met je eigen bliksemstaf...
items.wands.wandoflightning.staff_name=staf van bliksem
items.wands.wandoflightning.stats_desc=Deze toverstaf stuurt krachtige bliksemflitsen door alles waar hij op gericht is, en richt daarbij _%1$d-%2$d schade aan._ Deze elektriciteit springt over naar personages in de buurt en verspreidt zich gemakkelijker in water. De bliksemflitsen van deze toverstaf kunnen jou verwonden, maar zullen je bondgenoten niet schaden.
items.wands.wandoflivingearth$earthguardian.desc=De stenen uit je toverstaf van levende aarde hebben zich gevormd tot een beschermende aarden bewaker! Deze rotsachtige beschermer zal vijanden in de buurt aanvallen, waardoor ze gedwongen worden de bewaker aan te vallen in plaats van jou. Wanneer alle bedreigingen in de buurt verdwenen zijn, zal de bewaker zich opnieuw om je heen vormen en terugkeren wanneer je je toverstaf de volgende keer gebruikt.
items.wands.wandoflivingearth$earthguardian.discover_hint=Je kunt dit personage vinden met een specifieke toverstaf.
items.wands.wandoflivingearth$earthguardian.name=aardse beschermer
items.wands.wandoflivingearth$earthguardian.wand_info=De verdedigingskracht van de beschermer is gekoppeld aan het niveau van je toverstaf. Hij blokkeert momenteel schade van _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Magische rotsen omringen je lichaam. Wanneer je wordt aangevallen, zullen ze proberen de aanval voor je te blokkeren en de schade die je oploopt met 50%% te verminderen. Elke geblokkeerde aanval schaaft echter een deel van de rots weg.\n\nResterende pantser: %1$d.\n\nAls er genoeg rots om je heen is gevormd, zal de volgende blikseminslag van je toverstaf van levende aarde ervoor zorgen dat de rotsen zich samenvoegen tot een beschermer die met je meevecht.\n\nBenodigd pantser voor de beschermer: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Deze aardse beschermer profiteert ook van de Kracht van Velen. Resterende beurten: %d.
items.wands.wandoflivingearth$rockarmor.name=rotspantser
items.wands.wandoflivingearth.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf van levende aarde, wordt een deel van de toegebrachte schade omgezet in rotspantser.
items.wands.wandoflivingearth.desc=Deze toverstaf is gemaakt van een merkwaardig gesteente, met banden van gloeiende gele energie. De stenen lijken lichtjes te verschuiven wanneer je de staf vastpakt, alsof ze je hand kunnen voelen.
items.wands.wandoflivingearth.eleblast_desc=Een elementaire explosie met een staf van levende aarde richt 50% schade aan en geneest een actieve aardbewaker voor elke geraakte vijand.
items.wands.wandoflivingearth.name=toverstaf van levende aarde
items.wands.wandoflivingearth.staff_name=medewerkers van Living Earth
items.wands.wandoflivingearth.stats_desc=Deze toverstaf schiet magische rotsstralen op vijanden af, die _%1$d-%2$d schade toebrengen._ De rotsen vormen zich vervolgens opnieuw rond de gebruiker en geven hem pantser in verhouding tot de toegebrachte schade. Als er voldoende pantser is opgebouwd, vormt het zich tot een rotsbeschermer wanneer de toverstaf de volgende keer wordt gebruikt.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandofmagicmissile$magiccharge.desc=Je toverstaf met magische projectielen heeft energie teruggevoerd naar je toverstaven, waardoor het effectieve niveau van de volgende bliksemstraal die ze afgeven, is verhoogd.\n\nJe toverstaven zijn versterkt tot: +%d.\n\nResterende magische lading: %s.
items.wands.wandofmagicmissile$magiccharge.name=magische lading
items.wands.wandofmagicmissile.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf van magische projectielen, zullen al zijn toverstaven, naast zijn staf, ook opgeladen worden.
items.wands.wandofmagicmissile.desc=Deze vrij eenvoudige toverstaf lanceert projectielen van pure magische energie. Hoewel de toverstaf zelf geen speciale effecten heeft, heeft hij meer beschikbare ladingen en kan hij, na een upgrade, andere toverstaven kortstondig versterken.
items.wands.wandofmagicmissile.discover_hint=Een van de helden begint met dit voorwerp.
items.wands.wandofmagicmissile.eleblast_desc=Een elementaire explosie met een staf van magische projectielen richt 50% schade aan en geeft de magiër 15 beurten om zijn spreuken op te laden.
items.wands.wandofmagicmissile.name=toverstaf van magische raket
items.wands.wandofmagicmissile.staff_name=staf van magische raket
items.wands.wandofmagicmissile.stats_desc=Elke pijl uit deze toverstaf richt _%1$d-%2$d schade aan_, en zal andere toverstaven kortstondig versterken als deze wordt geüpgraded.
items.wands.wandofprismaticlight.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf van prismatisch licht, zal deze vijand verlamd raken voor een periode die evenredig is aan het niveau van de staf.
items.wands.wandofprismaticlight.desc=Deze toverstaf is gemaakt van een massief stuk doorschijnend kristal, als een lang stuk glad glas. Kleine, kleurrijke lichtflitsen dansen rond de punt van de staf, klaar om naar buiten te barsten.
items.wands.wandofprismaticlight.eleblast_desc=Een elementaire explosie met een staf van prismatisch licht richt 67% schade aan, onthult al het terrein binnen het explosiegebied en verblindt vijanden gedurende 5 beurten.
items.wands.wandofprismaticlight.name=toverstaf van prismatisch licht
items.wands.wandofprismaticlight.staff_name=staf van prismatisch licht
items.wands.wandofprismaticlight.stats_desc=Deze toverstaf schiet lichtstralen af die door de duisternis van de kerker snijden en verborgen gebieden en vallen onthullen. De straal kan vijanden verblinden en richt _%1$d-%2$d schade aan._ Demonische en ondode vijanden zullen verbranden in het felle licht van de toverstaf en extra schade oplopen.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blinde kans
items.wands.wandofprismaticlight.upgrade_stat_name_3=Lichtduur
items.wands.wandofregrowth$dewcatcher.desc=Dauwvangers zijn wonderlijke planten die zich vullen met magische dauw. Ze proberen zich te camoufleren als gras om onopgemerkt te blijven, maar de ophopingen van dauw verraden hun ware aard.
items.wands.wandofregrowth$dewcatcher.discover_hint=Je kunt deze plant vinden met behulp van een speciale toverstaf.
items.wands.wandofregrowth$dewcatcher.name=Dauwvanger
items.wands.wandofregrowth$lotus.desc=De gouden lotus is een mystieke plant die alleen tevoorschijn getoverd kan worden met een krachtige toverstaf van hergroei. Zijn aura versterkt alle planten en hun effecten, maar de plant verbruikt zijn energie snel en sterft na korte tijd.
items.wands.wandofregrowth$lotus.discover_hint=Je kunt deze plant vinden met een speciale toverstaf, nadat je die een aantal keer hebt geüpgraded.
items.wands.wandofregrowth$lotus.name=Gouden Lotus
items.wands.wandofregrowth$lotus.wand_info=Deze lotus is geproduceerd door een _+%1$d_ toverstaf van hergroei. Alle planten binnen het effect ervan zullen _direct geactiveerd_ worden als ze op een personage worden geplant. Planten hebben ook een _%2$d%% kans_ om hun zaad te laten vallen, en pijlen met een punt zullen _%3$d%% minder duurzaamheid_ verbruiken.
items.wands.wandofregrowth$seedpod.desc=Zaadpeulen zijn magische planten die zaden produceren van andere plantensoorten, in plaats van zelf zaden te hebben. Op de een of andere manier slagen ze erin zich te verspreiden, ondanks dat ze geen eigen zaden hebben.
items.wands.wandofregrowth$seedpod.discover_hint=Je kunt deze plant vinden met behulp van een speciale toverstaf.
items.wands.wandofregrowth$seedpod.name=Zaadpeul
items.wands.wandofregrowth.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een staf van hergroei, en beiden staan op gras, ontvangt hij kruidengenezing in verhouding tot de toegebrachte schade.
items.wands.wandofregrowth.degradation=Na nog eens _%d ladingen_ zal deze toverstaf geen planten en vers gras meer produceren. Deze limiet wordt verhoogd door de toverstaf te levelen of te upgraden.
items.wands.wandofregrowth.desc=Deze toverstaf is gemaakt van een dunne schacht van vakkundig gesneden hout. Op de een of andere manier is hij nog steeds levend en levendig, heldergroen als de kern van een jonge boom. "Wanneer het leven ophoudt, begint er altijd nieuw leven te groeien... De eeuwige cyclus blijft altijd bestaan!"
items.wands.wandofregrowth.eleblast_desc=Een elementaire explosie met een staf van hergroei wortelt vijanden en laat willekeurig gras groeien in het explosiegebied.
items.wands.wandofregrowth.name=toverstaf van hergroei
items.wands.wandofregrowth.staff_name=personeel van hergroei
items.wands.wandofregrowth.stats_desc=Bij gebruik stoot deze toverstaf magische hergroei-energie in een kegelvorm naar buiten, waardoor gras, wortels en zeldzame planten tot leven komen. De volgende stoot verbruikt _%1$d ladingen_. Hoe meer ladingen de toverstaf verbruikt, hoe groter en sterker het effect.
items.wands.wandofregrowth.upgrade_stat_name_1=Gras per lading
items.wands.wandofregrowth.upgrade_stat_name_2=Totale graslimiet
items.wands.wandoftransfusion.bmage_desc=Wanneer de Strijdmagiër een betoverde vijand raakt met een staf van bloedtransfusie, krijgt hij een schild en kost zijn volgende aanval met de staf geen levenspunten.
items.wands.wandoftransfusion.charged=Je staf is doordrenkt met de levensenergie van je vijand!
items.wands.wandoftransfusion.desc=Het is een toverstaf met een vrij eenvoudige vorm, maar hij valt op door zijn magenta kleur en de pikzwarte edelsteen aan het uiteinde.
items.wands.wandoftransfusion.eleblast_desc=Een elementaire explosie met een transfusiestaf betovert vijanden, geneest bondgenoten en brengt 100% schade toe aan ondode vijanden.
items.wands.wandoftransfusion.name=toverstaf van transfusie
items.wands.wandoftransfusion.ondeath=Je hebt jezelf gedood met je eigen bloedtransfusiestaf...
items.wands.wandoftransfusion.staff_name=personeel van de transfusie
items.wands.wandoftransfusion.stats_desc=Wanneer deze toverstaf op bondgenoten of betoverde vijanden wordt gebruikt, zal hij _%1$d van de gezondheid van de gebruiker_ aftappen om de bondgenoot te genezen of te beschermen met _%2$d gezondheidspunten_. Wanneer de toverstaf op vijanden wordt gebruikt, betovert hij hen kortstondig terwijl de gebruiker _%3$d bescherming_ krijgt. Vijandige ondoden zullen _%4$d-%5$d schade_ oplopen in plaats van betoverd te worden.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Zelfbescherming
items.wands.wandoftransfusion.upgrade_stat_name_3=Schade door ondoden
items.wands.wandofwarding$ward.desc_1=Deze basisbescherming zal automatisch elke vijand die binnen zijn zichtbereik komt, elektrocuteren en _%1$d-%2$d schade toebrengen._\n\nDoor deze bescherming met je toverstaf te elektrocuteren, wordt deze geüpgraded.\n\nDeze bescherming zal slechts één keer elektrocuteren voordat hij verdwijnt.\n\nJe toverstaf gebruikt _%3$d energie_ om deze bescherming in stand te houden.
items.wands.wandofwarding$ward.desc_2=Deze verbeterde bescherming heeft een complexer patroon en kan meerdere keren aanvallen. Elke blikseminslag van deze bescherming zal _%1$d-%2$d schade toebrengen._\n\nDoor deze bescherming met je beschermingsstaf te raken, wordt deze verbeterd.\n\nDeze bescherming zal drie keer toeslaan voordat hij verdwijnt.\n\nJe beschermingsstaf gebruikt _%3$d energie_ om deze bescherming in stand te houden.
items.wands.wandofwarding$ward.desc_3=Deze volledig geüpgradede bescherming kan vaker aanvallen dan zijn voorgangers. Elke blikseminslag van deze bescherming zal _%1$d-%2$d schade toebrengen._\n\nDoor deze bescherming met je beschermingsstaf te raken, wordt deze geüpgraded.\n\nDeze bescherming zal vijf keer toeslaan voordat hij verdwijnt.\n\nJe beschermingsstaf gebruikt _%3$d energie_ om deze bescherming in stand te houden.
items.wands.wandofwarding$ward.desc_4=Deze kleinere schildwacht heeft dezelfde vuurkracht als een grotere schildwacht, maar heeft levenspunten in plaats van een vast aantal ladingen. Hij lijkt op de edelsteen aan het uiteinde van je toverstaf. Elke blikseminslag van deze schildwacht richt _%1$d-%2$d schade aan._\n\nDoor deze schildwacht met je toverstaf te bestralen, wordt hij geüpgraded en genezen.\n\nDeze schildwacht verbruikt wat levenspunten elke keer dat hij een vijand bestraalt, maar kan worden genezen door je toverstaf erop te gebruiken.\n\nJe toverstaf gebruikt _%3$d energie_ om deze schildwacht in stand te houden.
items.wands.wandofwarding$ward.desc_5=Deze verbeterde schildwacht is groter en duurzamer dan een gewone schildwacht. Elke bliksemstraal van deze schildwacht richt _%1$d-%2$d schade aan._\n\nDoor deze schildwacht met je beschermingsstaf te raken, wordt hij geüpgraded en genezen.\n\nDeze schildwacht verbruikt wat levenspunten elke keer dat hij een vijand raakt, maar kan genezen worden door je beschermingsstaf erop te gebruiken.\n\nJe beschermingsstaf gebruikt _%3$d energie_ om deze schildwacht in stand te houden.
items.wands.wandofwarding$ward.desc_6=Deze volledig geüpgradede schildwacht is aanzienlijk duurzamer dan zijn voorgangers. Elke blikseminslag van deze schildwacht zal _%1$d-%2$d schade toebrengen._\n\nDoor deze schildwacht met je beschermingsstaf te bestralen, genees je hem.\n\nDeze schildwacht verbruikt wat levenspunten elke keer dat hij een vijand bestraalt, maar kan genezen worden door je beschermingsstaf erop te gebruiken.\n\nJe beschermingsstaf gebruikt _%3$d energie_ om deze schildwacht in stand te houden.
items.wands.wandofwarding$ward.desc_generic_sentry=Deze schildwacht heeft dezelfde vuurkracht als een beschermingsschild, maar heeft levenspunten in plaats van een vast aantal ladingen. Hij lijkt op de edelsteen aan het uiteinde van je beschermingsstaf. Door deze schildwacht met je beschermingsstaf te raken, wordt hij geüpgraded en genezen. Deze schildwacht verbruikt wat levenspunten elke keer dat hij een vijand raakt, maar kan genezen worden door hem met je beschermingsstaf te raken.
items.wands.wandofwarding$ward.desc_generic_ward=Deze bescherming zal automatisch elke vijand die binnen het gezichtsveld komt, elektrocuteren.\n\nDoor deze bescherming met je toverstaf te activeren, wordt deze geüpgraded.\n\nBeschermingen hebben een beperkt aantal elektrocuties voordat ze verdwijnen.
items.wands.wandofwarding$ward.discover_hint=Je kunt dit personage vinden met een specifieke toverstaf.
items.wands.wandofwarding$ward.dismiss_body=Je kunt deze bescherming opheffen als je niet langer wilt dat je toverstaf deze in stand houdt. Hierdoor wordt de bescherming onmiddellijk vernietigd.\n\nDeze bescherming opheffen?
items.wands.wandofwarding$ward.dismiss_cancel=Nee
items.wands.wandofwarding$ward.dismiss_confirm=Ja
items.wands.wandofwarding$ward.dismiss_title=Deze afdeling opheffen?
items.wands.wandofwarding$ward.name_1=kleinere afdeling
items.wands.wandofwarding$ward.name_2=afdeling
items.wands.wandofwarding$ward.name_3=grotere wijk
items.wands.wandofwarding$ward.name_4=lagere schildwacht
items.wands.wandofwarding$ward.name_5=schildwacht
items.wands.wandofwarding$ward.name_6=grotere schildwacht
items.wands.wandofwarding.bad_location=Je kunt daar geen ward plaatsen.
items.wands.wandofwarding.bmage_desc=Wanneer de Strijdmagiër een vijand raakt met een beschermingsstaf, hebben alle actieve beschermingsspreuken en wachters een kans om genezen te worden.
items.wands.wandofwarding.desc=Deze korte metalen toverstaf heeft een helderpaarse edelsteen die boven de punt zweeft.
items.wands.wandofwarding.eleblast_desc=Een elementaire explosie met een beschermingsstaf geneest alle beschermingseenheden en wachters in het explosiegebied.
items.wands.wandofwarding.name=toverstaf van bescherming
items.wands.wandofwarding.no_more_wards=Je toverstaf kan geen beschermingsspreuken meer in stand houden.
items.wands.wandofwarding.staff_name=personeel van de afdeling
items.wands.wandofwarding.stats_desc=In plaats van een vijand direct schade toe te brengen, roept deze toverstaf stationaire beschermingsspreuken en wachters op. Beschermingsspreuken kunnen overal worden opgeroepen, zelfs door muren heen als je zicht hebt. Deze toverstaf kan tegelijkertijd beschermingsspreuken ter waarde van _%d energie_ in stand houden.
items.wands.wandofwarding.upgrade_stat_name_1=Wardschade
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energie
items.waterskin.ac_drink=DRANKJE
items.waterskin.collected=Je vangt de dauwdruppel op in je waterzak.
items.waterskin.desc=Een vloeistofreservoir, gemaakt van leer en touw, afgesloten met een kurken stop.
items.waterskin.desc_full=De volle waterzak lijkt energie uit te stralen; misschien kan hij gebruikt worden om een ander overlevingsvoorwerp te zegenen?
items.waterskin.desc_heal=De waterzak wordt momenteel gebruikt om genezend water in op te slaan. Hoe voller de waterzak is, hoe meer je direct genezen zult worden wanneer je eruit drinkt. Je drinkt alleen zoveel als je nodig hebt.
items.waterskin.desc_water=Op dit moment bevat de waterzak alleen gewoon drinkwater. Er moet toch wel iets in de kerker liggen dat in plaats daarvan in de waterzak bewaard zou kunnen worden.
items.waterskin.discover_hint=Een van de helden begint met dit voorwerp.
items.waterskin.empty=Je waterzak is leeg!
items.waterskin.full=Je waterzak zit vol!
items.waterskin.name=waterzak
items.weapon.curses.annoying.desc=Vervelende wapens kunnen praten, maar ze zijn wel erg energiek. Ze trekken vaak onbedoeld de aandacht op je.
items.weapon.curses.annoying.elestrike_desc=Een elementaire aanval met een vervelende vloek heeft 20% kans om elke vijand binnen bereik 6 beurten lang te terroriseren.
items.weapon.curses.annoying.msg_1=Oei, zijn we ergens tegen aan het vechten?!
items.weapon.curses.annoying.msg_10=GOED GESLAGEN!
items.weapon.curses.annoying.msg_11=Ik wilde geen wapen zijn, ik wilde de bijl van een houthakker zijn.
items.weapon.curses.annoying.msg_12=Onthoud dat overmoed een langzame en verraderlijke moordenaar is.
items.weapon.curses.annoying.msg_13=AL JULLIE BASISSEN ZIJN VAN ONS!
items.weapon.curses.annoying.msg_2=JA, PAK ZE!
items.weapon.curses.annoying.msg_3=Hé, luister!
items.weapon.curses.annoying.msg_4=ZIJN WE AL BIJ DE BAAS!?
items.weapon.curses.annoying.msg_5=AUW, SLA ME NIET ZO HARD!
items.weapon.curses.annoying.msg_6=STERF, INSECT!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=KUNNEN WE EVEN PAUZE NEMEN!?
items.weapon.curses.annoying.msg_9=KNAL, HAHA!
items.weapon.curses.annoying.name=irritant %s
items.weapon.curses.dazzling.desc=Schitterende wapens kunnen soms een verblindend licht uitstralen, waardoor alles wat ze kan zien, verblind wordt.
items.weapon.curses.dazzling.elestrike_desc=Een elementaire aanval met een verblindende vloek heeft 50% kans om elke vijand binnen bereik gedurende 6 beurten te verblinden.
items.weapon.curses.dazzling.name=schitterende %s
items.weapon.curses.displacing.desc=Verplaatsingswapens zijn doordrenkt met chaotische teleportatiemagie en bezitten het vermogen om vijanden willekeurig over de vloer te verplaatsen.
items.weapon.curses.displacing.elestrike_desc=Een elementaire aanval met een verdringingsvloek heeft 50% kans om elke vijand binnen bereik te teleporteren.
items.weapon.curses.displacing.name=verdringing %s
items.weapon.curses.explosive.desc=Explosieve wapens bouwen geleidelijk aan kracht op en exploderen, waarbij alles in de omgeving beschadigd raakt.
items.weapon.curses.explosive.desc_cool=Je wapen voelt momenteel koel aan.
items.weapon.curses.explosive.desc_hot=Je wapen is heet! Het staat op het punt te ontploffen!
items.weapon.curses.explosive.desc_warm=Je wapen bouwt energie op en wordt warm...
items.weapon.curses.explosive.elestrike_desc=Een elementaire aanval met een explosieve vloek heeft 50% kans om een explosie te veroorzaken bij een willekeurige vijand binnen bereik.
items.weapon.curses.explosive.hot=Heet!
items.weapon.curses.explosive.name=explosief %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.friendly.desc=Vriendelijke wapens zijn het meest geschikt voor pacifisten, omdat ze soms magie activeren die het onmogelijk maakt om te vechten.
items.weapon.curses.friendly.elestrike_desc=Een elementaire aanval met een bevriende vloek heeft 50% kans om elke vijand binnen bereik gedurende 6 beurten te betoveren.
items.weapon.curses.friendly.name=vriendelijke %s
items.weapon.curses.polarized.desc=Een gepolariseerd wapen wordt beïnvloed door magie, waardoor de aanval ervan ofwel 50% meer schade toebrengt, ofwel helemaal geen schade aanricht.
items.weapon.curses.polarized.elestrike_desc=Een elementaire aanval met een gepolariseerde vloek heeft 50% kans om 24-36 schade toe te brengen aan elke vijand binnen bereik.
items.weapon.curses.polarized.name=gepolariseerd %s
items.weapon.curses.sacrificial.desc=Offerwapens eisen bloed van de drager in ruil voor het aanvallen van vijanden. Hoe gezonder de drager is, hoe meer bloed de vloek zal vergen.
items.weapon.curses.sacrificial.elestrike_desc=Een elementaire aanval met een offervloek zorgt ervoor dat de held en elke vijand binnen bereik 12 HP bloedverlies lijden.
items.weapon.curses.sacrificial.name=opoffering %s
items.weapon.curses.wayward$waywardbuff.desc=De magie van je afgedwaalde wapen is geactiveerd, waardoor het gedurende korte tijd extreem onnauwkeurig is. Let op: dit heeft geen invloed op aanvallen die gegarandeerd raak zijn, zoals verrassingsaanvallen. Een succesvolle aanval met het afgedwaalde wapen heft dit effect onmiddellijk op.\n\nAantal beurten resterend: %s.
items.weapon.curses.wayward$waywardbuff.name=eigenzinnig
items.weapon.curses.wayward.desc=Afwijkende wapens kunnen soms extreem onnauwkeurig worden. Deze magie duurt slechts kort na activering, maar kan worden opgeheven door een slag toe te dienen met het afwijkende wapen.
items.weapon.curses.wayward.elestrike_desc=Een elementaire aanval met een oncontroleerbare vloek heeft 50% kans om elke vijand binnen bereik gedurende 6 beurten te vervloeken.
items.weapon.curses.wayward.name=eigenzinnige %s
items.weapon.enchantments.blazing.desc=Deze betovering zorgt ervoor dat er vlammen uit een wapen komen, waardoor vijanden in brand vliegen en extra schade wordt toegebracht aan vijanden die al in brand staan.
items.weapon.enchantments.blazing.elestrike_desc=Een elementaire aanval met een vlammende betovering verspreidt vuur naar elk vakje binnen bereik, en dit effect duurt 8 beurten.
items.weapon.enchantments.blazing.name=vlammend %s
items.weapon.enchantments.blocking$blockbuff.desc=De blokkeerbetovering van je wapen heeft je verdedigingskracht tijdelijk een boost gegeven!\n\nResterende schildkracht: %d\n\nResterende beurten: %s.
items.weapon.enchantments.blocking$blockbuff.name=blokkeren
items.weapon.enchantments.blocking.desc=Blokkerende wapens hebben een kans om je kortstondig te beschermen na een aanval.
items.weapon.enchantments.blocking.elestrike_desc=Een elementaire aanval met een blokkerende betovering geeft de Duelist 6 extra schildpunten voor elke vijand binnen bereik.
items.weapon.enchantments.blocking.name=%s blokkeren
items.weapon.enchantments.blooming.desc=Bloeiende wapens bevatten magie waardoor er vegetatie zal ontspruiten op of rondom degenen die ermee geraakt worden.
items.weapon.enchantments.blooming.elestrike_desc=Een elementaire aanval met een bloeiende betovering verspreidt gras tot een afstand van 8 tegels en zet alle vijanden binnen bereik 6 beurten lang vast.
items.weapon.enchantments.blooming.name=bloeiende %s
items.weapon.enchantments.chilling.desc=Vijanden die door deze betovering worden getroffen, raken bevroren, waardoor hun beweging en aanvallen vertragen.
items.weapon.enchantments.chilling.elestrike_desc=Een elementaire aanval met een bevriezende betovering verspreidt ijskoude lucht naar elk vakje binnen bereik, wat 8 beurten aanhoudt.
items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.corrupting.desc=Deze krachtige betovering heeft het vermogen om vijanden aan je wil te onderwerpen. Wanneer een vijand met dit wapen wordt gedood, bestaat de kans dat hij gecorrumpeerd raakt in plaats van te sterven.
items.weapon.enchantments.corrupting.elestrike_desc=Een elementaire aanval met een verderfelijke betovering heeft een kans van 5-25% (afhankelijk van het ontbrekende aantal HP) om elke vijand binnen bereik te corrumperen, behalve het primaire doelwit.
items.weapon.enchantments.corrupting.name=%s wordt beschadigd
items.weapon.enchantments.elastic.desc=Elastische wapens kunnen vijanden over korte afstanden wegslingeren.
items.weapon.enchantments.elastic.elestrike_desc=Een elementaire aanval met een elastische betovering stoot alle vijanden binnen bereik 5 tegels achteruit.
items.weapon.enchantments.elastic.name=elastisch %s
items.weapon.enchantments.grim.desc=Deze krachtige betovering heeft de kracht om een vijand onmiddellijk uit te schakelen. Hoe zwakker de vijand, hoe groter de kans dat dit effect optreedt.
items.weapon.enchantments.grim.elestrike_desc=Een elementaire aanval met een grimmige betovering heeft een kans van 6-30% (afhankelijk van het ontbrekende aantal HP) om elke vijand binnen bereik te doden, behalve het primaire doelwit.
items.weapon.enchantments.grim.name=grimmige %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Je wapen heeft de overtollige kracht van een eerdere dodelijke slag opgeslagen en zal deze als bonusschade toepassen op je volgende aanval. De energie zal echter langzaam afnemen.\n\nBewaarde schade: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=geconserveerde schade
items.weapon.enchantments.kinetic.desc=Wanneer een vijand wordt gedood met een kinetisch wapen, wordt de overtollige energie in het wapen opgeslagen en gebruikt voor de volgende succesvolle aanval.
items.weapon.enchantments.kinetic.elestrike_desc=Een elementaire aanval met een kinetische betovering brengt 40% van de opgeslagen schade toe aan elke vijand binnen bereik, met uitzondering van het primaire doelwit.
items.weapon.enchantments.kinetic.name=kinetisch %s
items.weapon.enchantments.lucky.desc=Vijanden die gedood worden door een wapen met geluk, hebben een kans om extra buit te laten vallen.
items.weapon.enchantments.lucky.elestrike_desc=Een elementaire aanval met een geluksbetovering heeft een kans van 12,5% om buit te laten verschijnen onder elke vijand binnen bereik. Dit effect kan slechts één keer per vijand worden geactiveerd.
items.weapon.enchantments.lucky.name=geluk %s
items.weapon.enchantments.projecting.desc=Met deze betovering krijgen slagwapens een groter bereik. Afstandswapens zullen door muren heen dringen wanneer ze op doelen in de buurt worden gericht.
items.weapon.enchantments.projecting.elestrike_desc=Een elementaire aanval met een projectie-betovering brengt 30% schade toe aan elke vijand binnen bereik, behalve aan het primaire doelwit.
items.weapon.enchantments.projecting.name=projectie %s
items.weapon.enchantments.shocking.desc=Elektrische vonken schieten uit een schokwapen en brengen extra schade toe aan alle vijanden in de buurt.
items.weapon.enchantments.shocking.elestrike_desc=Een elementaire aanval met een schokkende betovering verspreidt elektriciteit naar elk vakje binnen bereik, en dit effect duurt 8 beurten.
items.weapon.enchantments.shocking.name=schokkend %s
items.weapon.enchantments.unstable.desc=Deze betovering straalt chaotische energie uit en werkt bij elke treffer als een andere betovering.
items.weapon.enchantments.unstable.elestrike_desc=Een elementaire aanval met een instabiele betovering past een willekeurig betoveringseffect toe op elke vijand binnen bereik, behalve op het primaire doelwit.
items.weapon.enchantments.unstable.name=instabiele %s
items.weapon.enchantments.vampiric.desc=Deze krachtige betovering onttrekt levenskracht aan vijanden bij elke slag en leidt deze terug naar de drager. Het effect is sterker naarmate de gezondheid van de drager lager is.
items.weapon.enchantments.vampiric.elestrike_desc=Een elementaire aanval met een vampirische betovering geneest de duelist met 2,5 HP voor elke vijand binnen bereik.
items.weapon.enchantments.vampiric.name=vampirisch %s
items.weapon.melee.assassinsblade.ability_desc=De Duelist kan _sluipen_ terwijl ze een moordenaarsmes hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 3 vakjes weg te teleporteren en geeft haar _%d beurten onzichtbaarheid_.
items.weapon.melee.assassinsblade.ability_name=stiekem
items.weapon.melee.assassinsblade.desc=Een klein, golvend mesje van obsidiaan, ondanks zijn lichte gewicht moeilijk te hanteren, maar dodelijk als het het juiste doelwit raakt.
items.weapon.melee.assassinsblade.name=moordenaarsmes
items.weapon.melee.assassinsblade.stats_desc=Dit wapen is effectiever tegen vijanden die niet opletten.
items.weapon.melee.assassinsblade.typical_ability_desc=De Duelist kan _sluipen_ terwijl ze een moordenaarsmes hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 3 vakjes weg te teleporteren en geeft haar doorgaans _%d beurten onzichtbaarheid_.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Vaardigheidsduur
items.weapon.melee.battleaxe.ability_desc=De Duelist kan een _zware slag_ uitvoeren met een strijdbijl. Deze geconcentreerde aanval brengt _%1$d-%2$d schade_ toe als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar brengt normale schade toe als de vijand niet verrast wordt.
items.weapon.melee.battleaxe.ability_name=zware klap
items.weapon.melee.battleaxe.desc=De enorme stalen kop van deze strijdbijl geeft aanzienlijke kracht aan elke brede slag.
items.weapon.melee.battleaxe.name=strijdbijl
items.weapon.melee.battleaxe.stats_desc=Dit is een behoorlijk nauwkeurig wapen.
items.weapon.melee.battleaxe.typical_ability_desc=De Duelist kan een _zware slag_ uitvoeren met een strijdbijl. Deze geconcentreerde aanval richt doorgaans _%1$d-%2$d schade aan_ als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
items.weapon.melee.crossbow$chargedshot.desc=De Duelist concentreert haar kracht in haar kruisboog. De volgende aanval die ze ermee uitvoert, zal altijd raak zijn en een van de volgende drie effecten toepassen: \n - Melee-aanvallen zullen vijanden een paar vakjes wegstoten. \n - Pijlen zonder punt zullen extra schade toebrengen. \n - Pijlen met punt krijgen extra gebruiksmogelijkheden en passen hun effect toe in een gebied van 7x7 vakjes. Positieve pijleffecten zijn alleen van toepassing op bondgenoten, en schadelijke effecten zijn alleen van toepassing op vijanden. De Duelist kan deze vaardigheid niet gebruiken om positieve pijleffecten op zichzelf toe te passen.
items.weapon.melee.crossbow$chargedshot.name=aangeklaagd
items.weapon.melee.crossbow.ability_desc=De Duelist kan haar kruisboog opladen, waardoor haar volgende normale aanval ermee altijd raak is en een van de volgende drie effecten toepast: mêlee-aanvallen stoten vijanden weg, pijlen zonder punt richten +%1$d schade aan, en pijlen met punt passen hun effect toe in een gebied van 7x7 en duren 1%1$d keer langer.
items.weapon.melee.crossbow.ability_name=geladen schot
items.weapon.melee.crossbow.desc=Een tamelijk ingewikkeld wapen dat pijlen met uitzonderlijke snelheid afvuurt. Hoewel het er niet voor ontworpen is, maken het gewicht en de robuuste constructie van deze kruisboog het ook een degelijk wapen voor gevechten van dichtbij.
items.weapon.melee.crossbow.name=kruisboog
items.weapon.melee.crossbow.stats_desc=Dit wapen verbetert de schade die geworpen pijlen toebrengen, waardoor ze _%1$d-%2$d schade_ toebrengen wanneer het is uitgerust, en het zal de betovering ervan zelfs aan de pijlen doorgeven.
items.weapon.melee.crossbow.typical_ability_desc=De Duelist kan haar kruisboog opladen, waardoor haar volgende normale aanval ermee altijd raak is en een van de volgende drie effecten toepast: mêlee-aanvallen stoten vijanden weg, pijlen zonder punt richten doorgaans +%1$d schade aan, en pijlen met punt oefenen hun effect uit in een gebied van 7x7 en duren doorgaans 1ZXQQ keer langer.
items.weapon.melee.crossbow.typical_stats_desc=Normaal gesproken verbetert dit wapen de schade die geworpen pijlen toebrengen, waardoor ze _%1$d-%2$d_ schade oplopen wanneer het is uitgerust, en het zal de betovering er zelfs aan doorgeven.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Vaardigheidsverbetering
items.weapon.melee.cudgel.ability_desc=De Duelist kan een _zware slag_ uitvoeren met een knuppel. Deze geconcentreerde aanval veroorzaakt _%1$d-%2$d schade_ als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar veroorzaakt normale schade als de vijand niet verrast wordt.
items.weapon.melee.cudgel.ability_name=zware klap
items.weapon.melee.cudgel.desc=Een kleine messing strijdknots, meer bedoeld als zelfverdedigingsmiddel voor edellieden dan als wapen voor avonturiers.
items.weapon.melee.cudgel.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.melee.cudgel.name=knuppel
items.weapon.melee.cudgel.stats_desc=Dit is een behoorlijk nauwkeurig wapen.
items.weapon.melee.cudgel.typical_ability_desc=De Duelist kan een _zware slag_ uitvoeren met een knuppel. Deze geconcentreerde aanval richt doorgaans _%1$d-%2$d schade_ aan als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
items.weapon.melee.dagger.ability_desc=De Duelist kan _sluipen_ terwijl ze een dolk hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 5 vakjes weg te teleporteren en geeft haar _%d beurten onzichtbaarheid_.
items.weapon.melee.dagger.ability_name=stiekem
items.weapon.melee.dagger.desc=Een eenvoudige ijzeren dolk met een versleten houten handvat.
items.weapon.melee.dagger.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.melee.dagger.name=dolk
items.weapon.melee.dagger.stats_desc=Dit wapen is effectiever tegen vijanden die niet opletten.
items.weapon.melee.dagger.typical_ability_desc=De Duelist kan _sluipen_ terwijl ze een dolk hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 5 vakjes weg te teleporteren en geeft haar doorgaans _%d beurten onzichtbaarheid_.
items.weapon.melee.dagger.upgrade_ability_stat_name=Vaardigheidsduur
items.weapon.melee.dirk.ability_desc=De Duelist kan _sluipen_ terwijl ze een dolk hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 4 vakjes weg te teleporteren en geeft haar _%d beurten onzichtbaarheid_.
items.weapon.melee.dirk.ability_name=stiekem
items.weapon.melee.dirk.desc=Een langere stootdolk biedt wat meer staal om in vijanden te steken.
items.weapon.melee.dirk.name=dolk
items.weapon.melee.dirk.stats_desc=Dit wapen is effectiever tegen vijanden die niet opletten.
items.weapon.melee.dirk.typical_ability_desc=De Duelist kan _sluipen_ terwijl ze een dolk hanteert. Deze vaardigheid stelt de Duelist in staat om direct tot 4 vakjes weg te teleporteren en geeft haar doorgaans _%d beurten onzichtbaarheid_.
items.weapon.melee.dirk.upgrade_ability_stat_name=Vaardigheidsduur
items.weapon.melee.flail$spinabilitytracker.desc=De Duelist zwaait met haar strijdvlegel en bouwt daarmee schade op voor haar volgende normale aanval. Elke draai duurt één beurt, maar verhoogt de schade, tot een maximum van drie draaien. De strijdvlegel raakt gegarandeerd raak tijdens het draaien.\n\nHuidige draaien: %1$d%%.\nResterende beurten: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=draaien
items.weapon.melee.flail.ability_desc=De Duelist kan een dorsvlegel _ronddraaien_ om gedurende korte tijd kracht op te bouwen. Elke beurt dat de dorsvlegel wordt rondgedraaid, zal deze _+%d schade_ toebrengen bij zijn volgende normale aanval, tot een maximum van 3 keer. Een ronddraaiende dorsvlegel raakt gegarandeerd doel. Alleen het starten van het ronddraaien van de dorsvlegel kost een lading.
items.weapon.melee.flail.ability_name=draaien
items.weapon.melee.flail.desc=Een bal met stekels, verbonden aan een handvat door een ketting. Erg onhandig, maar verwoestend als hij raak is.
items.weapon.melee.flail.name=dorsvlegel
items.weapon.melee.flail.spin_warn=Je kunt de dorsvlegel niet meer ronddraaien.
items.weapon.melee.flail.stats_desc=Dit is een nogal onnauwkeurig wapen.\nDit wapen kan geen verrassingsaanval uitvoeren.
items.weapon.melee.flail.typical_ability_desc=De Duelist kan een dorsvlegel laten ronddraaien om gedurende korte tijd kracht op te bouwen. Elke beurt dat de dorsvlegel ronddraait, zal deze normaal gesproken +%d schade toebrengen bij zijn volgende normale aanval, tot een maximum van 3 keer. Een ronddraaiende dorsvlegel raakt gegarandeerd doel. Alleen het starten van het ronddraaien van de dorsvlegel kost een lading.
items.weapon.melee.gauntlet.ability_desc=De Duelist kan een combo-aanval uitvoeren met een stenen handschoen. Deze aanval raakt gegarandeerd en richt +%d schade aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.gauntlet.ability_name=combo-aanval
items.weapon.melee.gauntlet.desc=Deze enorme handschoen is gemaakt van karmozijnrode stof met daarop een dikke laag magische steen. De stof sluit nauw aan op je lichaam, waardoor de dikke stenen platen bijna als een tweede huid aanvoelen. Het hanteren van zo'n zwaar wapen vereist kracht, maar geeft je slagen een enorme slagkracht.
items.weapon.melee.gauntlet.name=stenen handschoen
items.weapon.melee.gauntlet.stats_desc=Dit is een zeer snel wapen.
items.weapon.melee.gauntlet.typical_ability_desc=De Duelist kan een combo-aanval uitvoeren met een stenen handschoen. Deze aanval raakt gegarandeerd en richt doorgaans +%d schade aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.glaive.ability_desc=De Duelist kan de punt van een strijdzeis gebruiken om een vijand die binnen bereik is maar niet direct naast hem staat, te doorsteken. Dit veroorzaakt _%1$d-%2$d schade_, stoot de vijand achteruit en raakt gegarandeerd.
items.weapon.melee.glaive.ability_name=piek
items.weapon.melee.glaive.desc=Een enorm strijdwapen bestaande uit een zwaardblad aan het uiteinde van een stok.
items.weapon.melee.glaive.name=hellebaard
items.weapon.melee.glaive.stats_desc=Dit is een vrij traag wapen.\nDit wapen heeft een groter bereik.
items.weapon.melee.glaive.typical_ability_desc=De Duelist kan de punt van een strijdzeis gebruiken om een vijand die binnen bereik is maar niet direct naast hem staat, te doorsteken. Dit veroorzaakt doorgaans _%1$d-%2$d schade_, stoot de vijand achteruit en raakt gegarandeerd.
items.weapon.melee.gloves.ability_desc=De Duelist kan een combo-aanval uitvoeren met handschoenen met noppen. Deze aanval raakt gegarandeerd doel en richt +%d schade aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.gloves.ability_name=combo-aanval
items.weapon.melee.gloves.desc=Deze handschoenen met noppen bieden geen echte bescherming, maar ze fungeren wel als een bruikbaar wapen terwijl de handen vrij blijven.
items.weapon.melee.gloves.discover_hint=Een van de helden begint met dit voorwerp.
items.weapon.melee.gloves.name=handschoenen met noppen
items.weapon.melee.gloves.stats_desc=Dit is een zeer snel wapen.
items.weapon.melee.gloves.typical_ability_desc=De Duelist kan een combo-aanval uitvoeren met handschoenen met noppen. Deze aanval raakt gegarandeerd doel en richt doorgaans +%d schade aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.greataxe.ability_desc=De Duelist kan een _vergeldings_aanval uitvoeren met een strijdbijl als haar gezondheid onder de 50%% is. Deze verwoestende aanval brengt _%1$d-%2$d schade toe, raakt gegarandeerd en is direct dodelijk als hij een vijand doodt.
items.weapon.melee.greataxe.ability_name=vergelding
items.weapon.melee.greataxe.desc=Deze gigantische bijl, bedoeld om over de schouder te worden gedragen, is even krachtig als zwaar.
items.weapon.melee.greataxe.name=grote bijl
items.weapon.melee.greataxe.stats_desc=Dit wapen is ongelooflijk zwaar.
items.weapon.melee.greataxe.typical_ability_desc=De Duelist kan een _vergeldings_aanval uitvoeren met een strijdbijl als haar gezondheid onder de 50%% is. Deze verwoestende aanval richt doorgaans _%1$d-%2$d schade aan, raakt gegarandeerd en is direct dodelijk als hij een vijand doodt.
items.weapon.melee.greatshield.ability_desc=De Duelist kan zichzelf beschermen met een groot schild, waardoor alle fysieke of magische aanvallen die op haar gericht zijn gedurende _%d beurten_ volledig worden geneutraliseerd. Zodra de Duelist een aanval heeft geblokkeerd, zal een tegenaanval of het gebruik van magie de bescherming beëindigen.
items.weapon.melee.greatshield.ability_name=bewaker
items.weapon.melee.greatshield.desc=Deze gigantische metalen massa, die meer weg heeft van een mobiele muur dan van een schild, biedt weliswaar ondersteuning bij de verdediging, maar laat weinig ruimte over voor aanvallen.
items.weapon.melee.greatshield.name=groot schild
items.weapon.melee.greatshield.stats_desc=Dit wapen blokkeert 0-%d schade. Deze blokkering neemt toe met upgrades.
items.weapon.melee.greatshield.typical_ability_desc=De Duelist kan zichzelf beschermen met een groot schild, waardoor alle fysieke of magische aanvallen die op haar gericht zijn, volledig worden geneutraliseerd, meestal gedurende _%d beurten_. Zodra de Duelist een aanval heeft geblokkeerd, zal een tegenaanval of het gebruik van magie de bescherming beëindigen.
items.weapon.melee.greatshield.typical_stats_desc=Normaal gesproken blokkeert dit wapen 0-%d schade. Deze blokkering neemt toe met upgrades.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Vaardigheidsduur
items.weapon.melee.greatsword.ability_desc=De Duelist kan een vijand met een grootzwaard splijten. Dit veroorzaakt _%1$d-%2$d schade_ en raakt gegarandeerd. Als de splijting een vijand doodt, is dit direct en kan de Duelist de splijting binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.greatsword.ability_name=splijten
items.weapon.melee.greatsword.desc=Dit imposante zwaard brengt enorme schade toe door bij elke slag zijn volledige gewicht te gebruiken.
items.weapon.melee.greatsword.name=grootzwaard
items.weapon.melee.greatsword.typical_ability_desc=De Duelist kan een vijand met een grootzwaard doorsnijden. Dit veroorzaakt doorgaans _%1$d-%2$d schade_ en raakt gegarandeerd. Als een vijand door het doorsnijden gedood wordt, is dat direct en kan de Duelist binnen 5 beurten gratis opnieuw doorsnijden.
items.weapon.melee.handaxe.ability_desc=De Duelist kan een _zware slag_ uitvoeren met een handbijl. Deze geconcentreerde aanval veroorzaakt _%1$d-%2$d schade_ als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar veroorzaakt normale schade als de vijand niet verrast wordt.
items.weapon.melee.handaxe.ability_name=zware klap
items.weapon.melee.handaxe.desc=Een lichte bijl, die meestal gebruikt wordt om bomen te vellen. Het brede blad is ook effectief tegen vijanden.
items.weapon.melee.handaxe.name=handbijl
items.weapon.melee.handaxe.stats_desc=Dit is een behoorlijk nauwkeurig wapen.
items.weapon.melee.handaxe.typical_ability_desc=De Duelist kan een _zware slag_ uitvoeren met een handbijl. Deze geconcentreerde aanval richt doorgaans _%1$d-%2$d schade_ aan als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
items.weapon.melee.katana.ability_desc=De Duelist kan met een katana een aanval uitvoeren op een vijand die zich op 1 tegel afstand bevindt. Deze aanval beweegt zich naar de vijand toe, brengt _%1$d-%2$d schade_ toe en raakt gegarandeerd.
items.weapon.melee.katana.ability_name=longe
items.weapon.melee.katana.desc=Een slank zwaard met een grote metalen pareerstang boven het handvat.
items.weapon.melee.katana.name=katana
