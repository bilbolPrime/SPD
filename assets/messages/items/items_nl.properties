items.artifacts.driedrose.no_charge=Je roos is nog niet volledig opgeladen.
items.artifacts.driedrose.no_space=Er is geen vrije parkeerplaats bij u in de buurt.
items.artifacts.driedrose.spawned=Je hebt de geest al opgeroepen.
items.artifacts.etherealchains$chainsrecharge.levelup=Je kettingen worden sterker!
items.artifacts.etherealchains.ac_cast=VORM
items.artifacts.etherealchains.cant_pull=Je kettingen kunnen dat doelwit niet trekken.
items.artifacts.etherealchains.cant_reach=Jouw kettingen kunnen daar niet bij.
items.artifacts.etherealchains.cursed=Je kunt geen vervloekte kettingen gebruiken.
items.artifacts.etherealchains.desc=Deze grote, maar lichte kettingen stralen een spirituele energie uit. Ze kunnen gebruikt worden om je naar een bepaald terrein te trekken, of om vijanden naar je toe te trekken. Dankzij hun etherische aard kunnen de kettingen zelfs dwars door muren heen reiken!
items.artifacts.etherealchains.desc_cursed=De vervloekte kettingen zitten aan je zij vast, zwaaien constant heen en weer en proberen je te laten struikelen of vast te binden.
items.artifacts.etherealchains.desc_equipped=De kettingen rusten om je heen en zuigen langzaam de spirituele energie af van degenen die je verslaat. Elke lading is een schakel in de ketting, die precies één tegel uitsteekt.
items.artifacts.etherealchains.does_nothing=Dat zal niets uithalen.
items.artifacts.etherealchains.inside_wall=Met jouw kettingen kun je alleen door muren heen trekken, niet erin.
items.artifacts.etherealchains.name=etherische kettingen
items.artifacts.etherealchains.no_charge=Je kettingen zijn niet voldoende opgeladen.
items.artifacts.etherealchains.nothing_to_grab=Daar valt niets te grijpen.
items.artifacts.etherealchains.prompt=Kies een locatie om op te richten.
items.artifacts.etherealchains.rooted=Je kettingen kunnen je niet meetrekken als je stevig geworteld bent.
items.artifacts.holytome.ac_cast=VORM
items.artifacts.holytome.cursed=Je kunt geen vervloekt boek gebruiken.
items.artifacts.holytome.desc=Een heilig boek dat dient als focuspunt voor de goddelijke magie van de geestelijke. Door het boek te gebruiken kan de geestelijke verschillende magische spreuken uitspreken. Het boek wordt steeds krachtiger naarmate de geestelijke het gebruikt, waardoor de geestelijke meer maximale ladingen krijgt en de oplaadsnelheid iets toeneemt.
items.artifacts.holytome.discover_hint=Een van de helden begint met dit voorwerp.
items.artifacts.holytome.levelup=Je boek wordt steeds sterker!
items.artifacts.holytome.name=heilig boek
items.artifacts.holytome.no_spell=Je kunt die spreuk momenteel niet uitspreken.
