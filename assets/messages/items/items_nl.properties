items.weapon.melee.katana.typical_ability_desc=De Duelist kan met een katana een aanval uitvoeren op een vijand die zich op 1 tegel afstand bevindt. Deze aanval beweegt zich naar de vijand toe, richt doorgaans _%1$d-%2$d schade_ aan en raakt gegarandeerd.
items.weapon.melee.longsword.ability_desc=De Duelist kan een vijand met een langzwaard doorsnijden. Dit veroorzaakt _%1$d-%2$d schade_ en raakt gegarandeerd. Als de doorsnijaanval een vijand doodt, is dit direct en kan de Duelist de doorsnijaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.longsword.ability_name=splijten
