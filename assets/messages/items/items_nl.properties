items.weapon.melee.scimitar.typical_ability_desc=De Duelist kan een _zwaarddans_ uitvoeren met een kromzwaard. Deze houding is direct te activeren en geeft de Duelist +60%% aanvalssnelheid en +50%% nauwkeurigheid, doorgaans gedurende _%d beurten._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Vaardigheidsduur
items.weapon.melee.shortsword.ability_desc=De Duelist kan een vijand met een kortzwaard splijten. Dit veroorzaakt _%1$d-%2$d schade_ en raakt gegarandeerd. Als de splijtaanval een vijand doodt, is dit direct en kan de Duelist de splijtaanval binnen 5 beurten gratis opnieuw gebruiken.
