items.weapon.melee.rapier.ability_desc=De Duelist kan met een rapier een aanval uitvoeren op een vijand die zich op 1 tegel afstand bevindt. Deze aanval beweegt zich naar de vijand toe, brengt _%1$d-%2$d schade_ toe en raakt gegarandeerd.
items.weapon.melee.rapier.ability_name=longe
