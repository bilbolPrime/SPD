items.weapon.melee.shortsword.name=kortzwaard
items.weapon.melee.shortsword.typical_ability_desc=De Duelist kan een vijand met een kortzwaard splijten. Dit veroorzaakt doorgaans _%1$d-%2$d schade_ en raakt gegarandeerd. Als de splijtaanval een vijand doodt, is dit direct en kan de Duelist de splijtaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.sickle.ability_desc=De Duelist kan een vijand oogsten met een sikkel. Deze verwoestende aanval raakt gegarandeerd doel en richt _%d schade_ aan. Deze schade wordt als bloeding toegebracht als het doelwit niet immuun is.
items.weapon.melee.sickle.ability_name=oogst
