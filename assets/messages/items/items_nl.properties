items.amulet.ac_end=BEËINDIG HET SPEL
items.amulet.ascent_desc=Je begint de grote en verschrikkelijke kracht van Yog-Dzewa uit het amulet te voelen stralen. Terugklimmen door de kerker als sterveling is misschien moeilijker dan je dacht! Als je doorgaat met klimmen met het amulet, wordt de kerker gevaarlijker, worden teleports tussen verdiepingen uitgeschakeld en kun je het spel alleen winnen door vijanden te verslaan terwijl je door de kerker klimt! Je kunt het amulet hier voorlopig achterlaten als je wilt klimmen zonder deze uitdaging te starten, of het amulet activeren voordat je klimt om het spel normaal te beëindigen.
items.amulet.ascent_no=Stop nu even
items.amulet.ascent_title=Hemelvaart
items.amulet.ascent_yes=Doorgaan!
items.amulet.desc=Het Amulet van Yendor is het krachtigste artefact dat bekend is bij mensen en dwergen. De glinsterende kristallen bevatten een ongelooflijke en wonderbaarlijke kracht.
items.amulet.desc_ascent=De oorsprong van het amulet is onbekend, maar het is duidelijk sterk beïnvloed door de macht van Yog-Dzewa. De kerker lijkt zich te schikken naar Yog's wil terwijl je erdoorheen beweegt, waardoor vijanden veel talrijker en sterker worden! Je kunt het amulet ook niet meer activeren of weggooien, alsof het vervloekt is.
items.amulet.desc_origins=De oorsprong van het amulet is onbekend. De geschiedenis vertelt dat de Dwergenkoning opschepte dat hij het artefact had ontdekt kort voordat de Dwergenbeschaving alle contact verbrak. Hoe heeft hij het gevonden? Hoe heeft Yog-Dzewa het van hem afgenomen? Vragen voor een andere keer, want nu is het belangrijkste dat het amulet van jou is!
items.amulet.discover_hint=Je kunt dit voorwerp onderin de kerker vinden...
items.amulet.name=amulet van Yendor
items.ankh.ac_bless=zegenen
items.ankh.bless=Je zegent de ankh met magisch water.
items.ankh.desc=Dit oude symbool van onsterfelijkheid laat je na de dood terugkeren naar het leven. Bij de wederopstanding verlies je alle voorwerpen die je niet hebt uitgerust.
items.ankh.desc_blessed=Dit eeuwenoude symbool van onsterfelijkheid schenkt de mogelijkheid om na de dood terug te keren naar het leven. De ankh is gezegend en is nu veel sterker. De ankh zal zichzelf opofferen om je te redden in een moment van levensgevaar.
items.ankh.discover_hint=Je kunt dit artikel in een winkel kopen.
items.ankh.name=ankh
items.arcaneresin.ac_apply=TOEPASSEN
items.arcaneresin.apply=Je bedekt je toverstaf met hars, waardoor de kracht ervan toeneemt!
items.arcaneresin.desc=Dit fijne poeder glinstert tussen paarse en witte tinten. Het kan fungeren als een versterker van magische energieën, waardoor het niveau van toverstokken toeneemt wanneer het erop wordt aangebracht!\n\nHet upgraden van een toverstok kost 1, 2 of 3 hars, afhankelijk van het initiële niveau van de toverstok. Hars kan toverstokken upgraden tot een maximum van +3.\n\nHars-upgrades worden echter overschreven door andere upgradebronnen (zoals upgrade-rollen) en zijn niet van toepassing wanneer een toverstok in de staf van de magiër wordt geplaatst.
items.arcaneresin.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.arcaneresin.level_too_high=Die toverstaf is te krachtig om met hars verbeterd te worden.
items.arcaneresin.name=geheimzinnige hars
items.arcaneresin.not_enough=Daarvoor heb je niet genoeg hars!
items.arcaneresin.prompt=Kies een toverstaf
