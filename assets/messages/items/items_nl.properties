items.artifacts.masterthievesarmband.steal_shopkeeper=Je mag niet rechtstreeks van winkeliers stelen.
items.artifacts.masterthievesarmband.stole_item=Je hebt een voorwerp gestolen: %s.
items.artifacts.sandalsofnature.absorb_seed=Het schoeisel absorbeert de zaden, waardoor ze er gezonder uitzien.
items.artifacts.sandalsofnature.ac_feed=VOER
items.artifacts.sandalsofnature.ac_root=WORTEL
items.artifacts.sandalsofnature.desc_1=Wat in eerste instantie op sandalen van touw lijkt, zijn eigenlijk twee plantjes! Ze zien er erg zwak en bleek uit, misschien hebben ze voedingsstoffen nodig?
items.artifacts.sandalsofnature.desc_2=Het schoeisel is gegroeid en lijkt nu meer op twee op maat gemaakte schoenen. Er is weer wat kleur in gekomen, misschien kunnen ze nog verder groeien?
items.artifacts.sandalsofnature.desc_3=De planten zijn weer aangegroeid en lijken nu op een paar stevige laarzen van boomschors. De planten lijken hun kracht terug te hebben, maar misschien kunnen ze nog verder groeien?
items.artifacts.sandalsofnature.desc_4=De planten lijken hun maximale grootte te hebben bereikt; ze lijken op een paar gepantserde beenbeschermers. De beenbeschermers zijn diepbruin en lijken op een zeer stevige boom.
items.artifacts.sandalsofnature.desc_ability=De schoenen golven in de kleur van het laatste zaadje dat je ze hebt gegeven. Ze kunnen kortstondig wortel schieten in de grond en het effect van die plant overal binnen een straal van 3 tegels produceren.\nZaad: _%s_\nBenodigde lading: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=De vervloekte sandalen blokkeren elke verbinding met de natuur.
items.artifacts.sandalsofnature.desc_hint=Je voelt je meer verbonden met de natuur wanneer je dit voorwerp draagt.
items.artifacts.sandalsofnature.desc_seeds=Je hebt de schoenen %d-zaden gegeven.
items.artifacts.sandalsofnature.levelup=Je schoenen worden ineens een stuk groter!
