items.weapon.melee.runicblade.upgrade_ability_stat_name=Vermogen Kracht
items.weapon.melee.sai$combostriketracker.desc=De Duelist bouwt een combo op die gebruikt kan worden om de schade van de combo-aanval te verhogen. Elke succesvolle normale mêlee- of werpwapenaanval telt mee, maar als er gedurende 5 beurten geen succesvolle aanval plaatsvindt, wordt deze combo gereset.\n\nRecente treffers: %1$d.\n\nBeurten tot treffers verloren gaan: %2$s.
items.weapon.melee.sai$combostriketracker.name=combo-aanval
items.weapon.melee.sai.ability_desc=De Duelist kan een _combo-aanval_ uitvoeren met een sai. Deze aanval raakt gegarandeerd en richt _+%d schade_ aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.sai.ability_name=combo-aanval
items.weapon.melee.sai.desc=Twee dunne messen, bedoeld om elk in één hand te hanteren. Uitstekend geschikt om vijanden met een salvo van sneden neer te halen.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Dit is een zeer snel wapen.
items.weapon.melee.sai.typical_ability_desc=De Duelist kan een combo-aanval uitvoeren met een sai. Deze aanval raakt gegarandeerd en richt doorgaans +%d schade aan voor elke keer dat de Duelist een normale mêlee- of werpwapenaanval heeft uitgevoerd. Als de Duelist 5 beurten lang niet raakt, wordt deze combo gereset.
items.weapon.melee.scimitar$sworddance.desc=De Duelist voert snelle, op momentum gebaseerde aanvallen uit in een soort dans. Zolang deze houding actief is, valt ze 60%% sneller aan (genoeg om precies twee keer per beurt met een kromzwaard aan te vallen) en heeft ze +50%% nauwkeurigheid.\n\nBeurten resterend: %s.
items.weapon.melee.scimitar$sworddance.name=zwaarddans
items.weapon.melee.scimitar.ability_desc=De Duelist kan een _zwaarddans_ uitvoeren met een kromzwaard. Deze houding is direct te activeren en geeft de Duelist +60%% aanvalssnelheid en +50%% nauwkeurigheid gedurende _%d beurten._
items.weapon.melee.scimitar.ability_name=zwaarddans
items.weapon.melee.scimitar.desc=Een dik, gebogen lemmet. De vorm maakt snellere, maar minder krachtige aanvallen mogelijk.
