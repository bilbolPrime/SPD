items.weapon.melee.mace.typical_ability_desc=De Duelist kan een _zware slag_ uitvoeren met een knots. Deze geconcentreerde aanval richt doorgaans _%1$d-%2$d schade_ aan als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
