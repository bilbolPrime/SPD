items.weapon.melee.magesstaff.imbue_desc=Weet je zeker dat je je staf met deze toverstaf wilt betoveren?\n\nAls de toverstaf die wordt betovert van hetzelfde of een hoger niveau is dan de staf, erft de staf het niveau van die toverstaf plus één van zijn eigen upgrades.
