items.weapon.melee.longsword.typical_ability_desc=De Duelist kan een vijand met een langzwaard doorsnijden. Dit veroorzaakt doorgaans _%1$d-%2$d schade_ en raakt gegarandeerd. Als de doorsnijaanval een vijand doodt, is dit direct en kan de Duelist de doorsnijaanval binnen 5 beurten gratis opnieuw gebruiken.
items.weapon.melee.mace.ability_desc=De Duelist kan een _zware slag_ uitvoeren met een knots. Deze geconcentreerde aanval richt _%1$d-%2$d schade_ aan als de vijand verrast wordt, en verdooft hem gedurende 5 beurten, waardoor de nauwkeurigheid en ontwijking met 50%% worden verminderd. Een zware slag raakt altijd doel, maar richt normale schade aan als de vijand niet verrast wordt.
