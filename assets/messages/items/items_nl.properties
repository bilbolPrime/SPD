items.weapon.melee.spear.ability_desc=De Duelist kan de punt van een speer gebruiken om een vijand die binnen bereik is maar niet direct ernaast staat, te doorsteken. Dit veroorzaakt _%1$d-%2$d schade_, stoot de vijand achteruit en raakt gegarandeerd.
