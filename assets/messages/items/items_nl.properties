items.artifacts.lloydsbeacon.creatures=De psychische aura van naburige wezens verhindert je op dit moment om Lloyds baken te gebruiken.
items.artifacts.lloydsbeacon.desc=Lloyds baken is een ingenieus magisch apparaat dat de gebruiker controle geeft over teleportatiemagie. Het baken kan worden gebruikt om terug te keren naar een vooraf bepaalde locatie, maar kan ook, zodra het is opgeladen door het uitrusten, willekeurige uitbarstingen van teleportatiemagie afgeven. Deze magie kan worden gericht op een doelwit of op de gebruiker zelf.
items.artifacts.lloydsbeacon.desc_set=Dit baken werd ergens op het niveau %d van Pixel Dungeon geplaatst.
items.artifacts.lloydsbeacon.levelup=Je baken wordt sterker!
items.artifacts.lloydsbeacon.name=Lloyds baken
items.artifacts.lloydsbeacon.no_charge=Je baken heeft momenteel onvoldoende energie.
items.artifacts.lloydsbeacon.preventing=De sterke magische aura van deze plek verhindert je om Lloyds baken te gebruiken!
items.artifacts.lloydsbeacon.prompt=Kies een locatie om te scannen.
items.artifacts.lloydsbeacon.return=Het baken van Lloyd is succesvol geplaatst op uw huidige locatie; u kunt hier nu op elk gewenst moment terugkeren.
items.artifacts.lloydsbeacon.tele_fail=De teleportatiemagie mislukt.
items.artifacts.masterthievesarmband.ac_steal=STELEN
items.artifacts.masterthievesarmband.cursed=Je kunt geen vervloekte armband gebruiken.
items.artifacts.masterthievesarmband.desc=Deze paarse fluwelen armband draagt het teken van een meesterdief. Hij is niet van jou, maar waarschijnlijk was hij ook niet van de vorige drager.
items.artifacts.masterthievesarmband.desc_cursed=De vervloekte armband zit om je pols en op de een of andere manier lijkt je goudbuidel langzaam lichter te worden...
items.artifacts.masterthievesarmband.desc_worn=Je voelt de kracht in de armband om je pols toenemen naarmate je meer ervaring opdoet. Je kunt deze kracht gebruiken om winkels te beroven of vijanden te overvallen! Vijanden beroven gebeurt direct, desoriënteert ze even en geeft je de kans om hun buit te bemachtigen! Deze kracht is effectiever tegen nietsvermoedende vijanden. Meerdere keren dezelfde vijand beroven geeft je geen extra kans op buit.
items.artifacts.masterthievesarmband.failed_steal=Je hebt niets kunnen stelen.
