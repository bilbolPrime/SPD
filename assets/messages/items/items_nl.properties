items.armor.armor.avg_absorb=Normaal gesproken blokkeert dit _tier-%1$d_ pantser _%2$d-%3$d schade_ en vereist het _%4$d kracht_ om het goed te kunnen gebruiken.
items.armor.armor.curr_absorb=Dit pantser blokkeert schade van niveau _%1$d_ tot _%2$d-%3$d_ en vereist kracht van niveau _%4$d_ om goed te functioneren.
items.armor.armor.cursed=Je voelt de kwaadaardige magie die in dit harnas schuilt.
items.armor.armor.cursed_worn=Omdat dit pantser vervloekt is, ben je machteloos om het te verwijderen.
items.armor.armor.defense=Het is uitgebreid om de verdediging te versterken.
items.armor.armor.detach_seal=Je verwijdert het zegel van je pantser.
items.armor.armor.equip_cursed=Het pantser knelt pijnlijk om je heen.
items.armor.armor.evasion=Het is verbeterd om ontwijking te vergroten.
items.armor.armor.excess_str=Door je overmatige kracht ben je _moeilijker te ontwijken_ wanneer je dit harnas draagt.
items.armor.armor.glyph_hardened=Het is gehard.
items.armor.armor.hardened_no_glyph=Dit pantser is gehard, maar is momenteel niet voorzien van een glyph.
items.armor.armor.hardening_gone=De verharding van dit pantser is verdwenen!
items.armor.armor.identify=Je bent nu voldoende vertrouwd met je pantser om het te kunnen herkennen.
items.armor.armor.incompatible=Door de wisselwerking van verschillende soorten magie is het symbool op dit pantser verdwenen!
items.armor.armor.inscribed=Het is gegraveerd met _%s._
items.armor.armor.not_cursed=Dit pantser is vrij van kwaadaardige magie.
items.armor.armor.probably_too_heavy=Waarschijnlijk is dit harnas te zwaar voor je.
items.armor.armor.seal_attached=Het verbroken zegel van de krijger is aan dit pantser bevestigd. Wanneer zijn gezondheid onder de helft van zijn totale gezondheid dreigt te dalen, zal dit hem _%d-schild_ geven.
items.armor.armor.seal_transfer=Het verbroken zegel van de krijger moet aan zijn huidige pantser worden bevestigd om hem voordeel te bieden. Wilt u het zegel automatisch loskoppelen van het pantser dat u uittrekt en aan het pantser bevestigen dat u aantrekt?
items.armor.armor.seal_transfer_no=Nee
items.armor.armor.seal_transfer_yes=Ja
items.armor.armor.too_heavy=Door je ontoereikende kracht zal het dragen van dit harnas je vermogen om te bewegen, te ontwijken en jezelf te verdedigen beperken.
items.armor.armor.weak_cursed=Ondanks de vloek kun je dit pantser afdoen.
items.armor.classarmor.ac_ability=KIES VAARDIGHEID
items.armor.classarmor.ac_transfer=OVERDRACHT
items.armor.classarmor.charge_use=Het gebruik van deze vaardigheid verbruikt momenteel _%s_ lading.
items.armor.classarmor.discover_hint=Je kunt dit voorwerp vinden nadat je de eindbaas van verdieping 20 hebt verslagen met een specifieke held.
items.armor.classarmor.low_charge=Het pantser heeft onvoldoende lading om zijn speciale kracht te gebruiken!
items.armor.classarmor.no_ability=Je pantser heeft momenteel geen speciale vaardigheid, je moet er een kiezen!
items.armor.classarmor.not_equipped=Je moet dit harnas dragen om de speciale kracht ervan te kunnen gebruiken!
items.armor.classarmor.transfer_cancel=annuleren
items.armor.classarmor.transfer_complete=De eigenschappen van je heldhaftige pantser zijn overgedragen!
items.armor.classarmor.transfer_desc=De magie van de dwergenkoningskroon kan worden overgedragen op een ander harnas. Houd er rekening mee dat het oorspronkelijke harnas daarbij wordt vernietigd.
items.armor.classarmor.transfer_prompt=Kies een pantser
items.armor.classarmor.transfer_title=Transfer Armor
items.armor.clericarmor.desc=Wanneer de geestelijke dit harnas van stof en plaat draagt, kan hij een speciale vaardigheid uitvoeren.
items.armor.clericarmor.name=heldenkleding
items.armor.clotharmor.desc=Dit lichtgewicht pantser biedt basisbescherming.
items.armor.clotharmor.discover_hint=Een van de helden begint met dit voorwerp.
items.armor.clotharmor.name=stoffen pantser
items.armor.curses.antientropy.desc=De anti-entropievloek werkt tegen de krachten van het universum in, waardoor energie naar de drager wordt getrokken en aan de omgeving wordt onttrokken. Dit zet de drager kortstondig in brand, maar bevriest alles eromheen!
items.armor.curses.antientropy.name=%s van anti-entropie
items.armor.curses.bulk.desc=Een pantser van lomp materiaal oogt groter en imposanter, maar biedt in werkelijkheid geen verbeterde bescherming. Sterker nog, door de extra omvang wordt het erg moeilijk om door deuropeningen te komen.
items.armor.curses.bulk.name=%s van bulk
items.armor.curses.corrosion.desc=Het pantser van corrosie kan openbarsten met corrosieve vloeistof, waardoor alles in de omgeving bedekt raakt met een kleverige, zure substantie.
items.armor.curses.corrosion.name=%s van corrosie
items.armor.curses.displacement.desc=De vloek van verplaatsing probeert de drager in veiligheid te brengen wanneer deze wordt aangevallen. Hij is echter iets te effectief, waardoor de gebruiker willekeurig door het level wordt geteleporteerd.
items.armor.curses.displacement.name=%s van verplaatsing
items.armor.curses.metabolism.desc=De stofwisselingsvloek zet verzadiging direct om in gezondheid wanneer de drager gewond raakt, wat een boost geeft aan de genezing, maar snel tot hongersnood leidt.
items.armor.curses.metabolism.name=%s van metabolisme
items.armor.curses.multiplicity.desc=Een pantser dat vervloekt is met vermenigvuldigingsmagie bevat gevaarlijke duplicatiemagie. Het kan soms een spiegelbeeld van de drager creëren, maar de kans is net zo groot dat het de aanvaller dupliceert!
items.armor.curses.multiplicity.name=%s van multipliciteit
items.armor.curses.overgrowth.desc=Het pantser van overwoekering is bedekt met diverse bloeiende planten. Hoewel dit effect er zeker interessant uitziet, biedt het geen enkele bescherming en zullen deze planten willekeurig actief worden tijdens gevechten!
items.armor.curses.overgrowth.name=%s van overgroei
items.armor.curses.stench.desc=Pantser dat doordrenkt is van stank, zal wolken giftig gas vrijgeven, die gevaarlijk zijn voor alles wat in de wolk terechtkomt.
items.armor.curses.stench.name=%s van stank
items.armor.duelistarmor.desc=Met dit harnas en deze cape aan kan de Duelist een speciale vaardigheid uitvoeren.
items.armor.duelistarmor.name=heldenborstplaat
items.armor.glyphs.affection.desc=Dit krachtige symbool manipuleert de geest van aanvallers en betovert hen tijdelijk.
items.armor.glyphs.affection.name=%s van genegenheid
items.armor.glyphs.antimagic.desc=Dit krachtige symbool zorgt ervoor dat het pantser de drager beschermt tegen zowel magische als fysieke aanvallen. Deze magische verdediging wordt niet beïnvloed door het niveau van het pantser.
items.armor.glyphs.antimagic.name=%s van anti-magie
items.armor.glyphs.brimstone.desc=Dit symbool beschermt de drager en zijn bezittingen tegen vuur, waardoor de schade en negatieve effecten ervan volledig worden geneutraliseerd.
items.armor.glyphs.brimstone.name=%s van zwavel
items.armor.glyphs.camouflage.desc=Dit symbool stelt de drager in staat om op te gaan in hoog gras, waardoor hij tijdelijk onzichtbaar wordt.
items.armor.glyphs.camouflage.name=%s van camouflage
items.armor.glyphs.entanglement.desc=Dit symbool laat een aarden pantser rond de drager groeien om schade op te vangen, maar dit pantser breekt als de drager beweegt.
items.armor.glyphs.entanglement.name=%s van verstrengeling
items.armor.glyphs.flow.desc=Dit symbool manipuleert de waterstroom rondom de drager, waardoor deze zich veel sneller door het water kan bewegen.
items.armor.glyphs.flow.name=%s van stroom
items.armor.glyphs.obfuscation.desc=Dit symbool verbergt de drager, waardoor deze moeilijker te detecteren is.
items.armor.glyphs.obfuscation.name=%s van verduistering
items.armor.glyphs.potential.desc=Dit symbool genereert energie wanneer het wordt geraakt, waardoor de toverstaf van de drager wordt opgeladen wanneer het wordt geactiveerd.
items.armor.glyphs.potential.name=%s van potentieel
items.armor.glyphs.repulsion.desc=Dit symbool kaatst de kracht van de aanval terug, waardoor de aanvallers achteruit vliegen.
items.armor.glyphs.repulsion.name=%s van afstoting
items.armor.glyphs.stone.desc=Dit symbool omhult het pantser met zware magische steen, waardoor ontwijken onmogelijk wordt, maar de schade evenredig met de ontwijkingskans wordt geblokkeerd.
items.armor.glyphs.stone.name=%s van steen
items.armor.glyphs.swiftness.desc=Dit symbool verhoogt de snelheid van de drager wanneer deze zich niet in de buurt van een vijand bevindt.
items.armor.glyphs.swiftness.name=%s van snelheid
items.armor.glyphs.thorns.desc=Dit krachtige symbool brengt schade toe aan aanvallers, waardoor ze langzaam bloeden wanneer ze de drager aanvallen.
items.armor.glyphs.thorns.name=%s van doornen
items.armor.glyphs.viscosity$defereddamage.desc=De schade wordt geleidelijk in de loop van de tijd toegebracht in plaats van direct.\n\nResterende uitgestelde schade: %d.
items.armor.glyphs.viscosity$defereddamage.name=uitgestelde schade
items.armor.glyphs.viscosity$defereddamage.ondeath=De uitgestelde schade heeft je fataal getroffen...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Gedood door uitgestelde schade
items.armor.glyphs.viscosity.deferred=uitgesteld %d
items.armor.glyphs.viscosity.desc=Dit symbool kan de schade die de drager oploopt opslaan, waardoor deze geleidelijk in plaats van in één keer wordt toegebracht.
items.armor.glyphs.viscosity.name=%s van viscositeit
items.armor.huntressarmor.desc=Wanneer de Jageres deze mantel draagt, kan ze een speciale vaardigheid uitvoeren.
items.armor.huntressarmor.name=heldenmantel
items.armor.huntressarmor.no_enemies=Geen vijanden in zicht
items.armor.leatherarmor.desc=Pantser gemaakt van gelooid monsterhuid. Niet zo licht als stoffen pantser, maar biedt betere bescherming.
items.armor.leatherarmor.name=leren harnas
items.armor.magearmor.desc=Gekleed in dit prachtige gewaad kan de magiër een speciale vaardigheid uitvoeren.
items.armor.magearmor.name=heldenmantel
items.armor.mailarmor.desc=De in elkaar grijpende metalen schakels zorgen voor een stevig maar flexibel harnas.
items.armor.mailarmor.name=maliënkolder
items.armor.platearmor.desc=Enorme metalen platen worden aan elkaar bevestigd tot een pak dat ongeëvenaarde bescherming biedt aan elke avonturier die sterk genoeg is om het duizelingwekkende gewicht te dragen.
items.armor.platearmor.name=plaatpantser
items.armor.roguearmor.desc=Gekleed in deze donkere kleding kan de Schurk een speciale vaardigheid uitvoeren.
items.armor.roguearmor.name=heldenkleding
items.armor.scalearmor.desc=De metalen schubben die op een leren vest zijn genaaid, vormen een flexibel maar beschermend pantser.
items.armor.scalearmor.name=schubbenpantser
items.armor.warriorarmor.desc=Gehuld in dit zware pantser kan de krijger een speciale vaardigheid uitvoeren.
items.armor.warriorarmor.name=heldenpantser
items.artifacts.alchemiststoolkit.ac_brew=BROUWEN
items.artifacts.alchemiststoolkit.ac_energize=ENERGIE
items.artifacts.alchemiststoolkit.cursed=Door je vervloekte gereedschapskist kun je geen alchemie gebruiken!
items.artifacts.alchemiststoolkit.desc=Deze gereedschapskit bevat een aantal reagentia en kruiden, samen met een klein mengflesje, waardoor alchemie onderweg mogelijk is. Het flesje bevat wat lijkt op alchemistische energiekristallen in vloeibare vorm.
items.artifacts.alchemiststoolkit.desc_cursed=De vervloekte gereedschapskist heeft zich aan je vastgeklampt en weigert je alchemie te laten gebruiken.
items.artifacts.alchemiststoolkit.desc_hint=De gereedschapskit genereert langzaam alchemistische energie naarmate je meer ervaring opdoet. Het lijkt erop dat het mengsel in het flesje verbeterd kan worden door er energiekristallen aan toe te voegen.
items.artifacts.alchemiststoolkit.desc_warming=De toolkit wordt momenteel opgestart en zal over een korte tijd gebruiksklaar zijn.
items.artifacts.alchemiststoolkit.energize_1=6 energie: +1 niveau
items.artifacts.alchemiststoolkit.energize_all=%1$d energie: +%2$d niveaus
items.artifacts.alchemiststoolkit.energize_desc=Elke 6 energiekristallen geven de gereedschapskit genoeg energie om een niveau omhoog te gaan, waardoor de toolkit sneller energie genereert en sneller opwarmt.\n\nHoeveel energie wilt u gebruiken?
items.artifacts.alchemiststoolkit.name=gereedschapskist van de alchemist
items.artifacts.alchemiststoolkit.need_energy=Daarvoor heb je minstens 6 energie nodig.
items.artifacts.alchemiststoolkit.not_ready=Je gereedschapskist is nog niet helemaal opgewarmd.
items.artifacts.artifact.cannot_wear_two=Je kunt niet twee dezelfde voorwerpen dragen.
items.artifacts.artifact.curse_known=Je voelt een kwaadaardige magie in het artefact schuilen.
items.artifacts.artifact.equip_cursed=Het artefact hecht zich op pijnlijke wijze aan je.
items.artifacts.artifact.need_to_equip=Daarvoor moet je je artefact uitrusten.
items.artifacts.artifact.not_cursed=Dit artefact is vrij van kwaadaardige magie.
items.artifacts.capeofthorns$thorns.desc=Je cape straalt energie uit en omhult je met een veld van afbuigende kracht!\n\nAlle schade die je oploopt, wordt verminderd zolang het doorneneffect actief is. Bovendien, als de aanvaller zich naast je bevindt, wordt de verminderde hoeveelheid teruggekaatst naar de aanvaller.\n\nAantal beurten doornen resterend: %s.
items.artifacts.capeofthorns$thorns.inert=Je cape wordt weer inert.
items.artifacts.capeofthorns$thorns.levelup=Je cape wordt steeds sterker!
items.artifacts.capeofthorns$thorns.name=doornen
items.artifacts.capeofthorns$thorns.radiating=Je cape begint energie uit te stralen, je voelt je beschermd!
items.artifacts.capeofthorns.desc=Deze samengekrompen metalen platen van de DM-300 hebben zich samengevoegd tot een stijve cape. Het lijkt een diepe energie op te slaan, misschien bevat het wel een deel van de kracht van de DM-300?
items.artifacts.capeofthorns.desc_active=De cape lijkt opgeslagen energie vrij te geven; hij straalt een beschermende kracht uit.
items.artifacts.capeofthorns.desc_inactive=De cape voelt geruststellend zwaar aan op je schouders; het lijkt alsof hij energie opdoet uit de schade die je oploopt.
items.artifacts.capeofthorns.name=doornenmantel
items.artifacts.chaliceofblood.ac_prick=PRIK
items.artifacts.chaliceofblood.desc=Deze glanzende zilveren kelk is merkwaardig genoeg aan de rand versierd met scherpe edelstenen.
items.artifacts.chaliceofblood.desc_1=Terwijl je de kelk vasthoudt, voel je een vreemde drang om jezelf te prikken aan de scherpe edelstenen.
items.artifacts.chaliceofblood.desc_2=Een deel van je bloed verzamelt zich in de kelk; je voelt subtiel hoe de kelk levensenergie in je pompt en je natuurlijke gezondheidsregeneratie bevordert. Je wilt jezelf nog steeds aan de kelk snijden, ook al weet je dat het pijn zal doen.
items.artifacts.chaliceofblood.desc_3=De kelk is tot de rand gevuld met jouw levensessentie. Je voelt hoe de kelk levensenergie in je terugstroomt.
items.artifacts.chaliceofblood.desc_cursed=De vervloekte kelk heeft zich aan je hand vastgeketend en belemmert je vermogen om je gezondheid te herstellen.
items.artifacts.chaliceofblood.name=kelk van bloed
items.artifacts.chaliceofblood.no=Nee, ik ben van gedachten veranderd.
items.artifacts.chaliceofblood.ondeath=De kelk zuigt je levensessentie volledig leeg...
items.artifacts.chaliceofblood.onprick=Je prikt jezelf, en je levensessentie vloeit in de kelk.
items.artifacts.chaliceofblood.prick_warn=Elke keer dat je de kelk gebruikt, verbruikt deze meer van je levensenergie, maar in ruil daarvoor bevordert het je natuurlijke gezondheidsregeneratie. Momenteel veroorzaakt prikken in jezelf _%1$d-%2$d schade_, hoewel deze schade kan worden verminderd door _zowel fysieke als magische blokkering of schadebeperking_. Zonder rekening te houden met schadebeperkende effecten, heeft prikken in jezelf momenteel een _%3$s%% kans_ om je levenskracht volledig uit te putten. Weet je zeker dat je de kelk meer levensenergie wilt geven?
items.artifacts.chaliceofblood.yes=Ja, ik weet wat ik doe.
items.artifacts.cloakofshadows$cloakstealth.desc=Je schaduwmantel geeft je onzichtbaarheid zolang je erdoor gehuld bent. Je blijft onzichtbaar totdat de mantel wordt opgeheven of de lading ervan op is. Terwijl je onzichtbaar bent, kunnen vijanden je niet aanvallen of volgen. Fysieke aanvallen en magische effecten (zoals spreuken en toverstaven) zullen de onzichtbaarheid onmiddellijk opheffen. Beurten tot lading op is: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Je mantel wordt sterker!
items.artifacts.cloakofshadows$cloakstealth.name=gehuld
items.artifacts.cloakofshadows$cloakstealth.no_charge=Je mantel heeft geen energie meer.
items.artifacts.cloakofshadows.ac_stealth=HEILIGHEID
items.artifacts.cloakofshadows.cooldown=Je mantel heeft nog %d rondes nodig om weer op te laden.
items.artifacts.cloakofshadows.cursed=Je kunt geen vervloekte mantel gebruiken.
items.artifacts.cloakofshadows.desc=Een onbetaalbare magische mantel, jaren geleden gestolen uit de koninklijke wapenkamer door de Schurk. Wanneer de mantel gedragen wordt, kan de Schurk zichzelf gedurende korte tijd volledig onzichtbaar maken. Hoe vaker de mantel gebruikt wordt, hoe sterker hij wordt, waardoor de Schurk vaker en langer onzichtbaar kan worden.
items.artifacts.cloakofshadows.discover_hint=Een van de helden begint met dit voorwerp.
items.artifacts.cloakofshadows.name=mantel van schaduwen
items.artifacts.cloakofshadows.no_charge=Je mantel is nog niet voldoende opgeladen om te kunnen worden gebruikt.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Hoe heb je dat overleefd?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ik wou dat ik er eentje had...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=O jee! Je leeft nog!
items.artifacts.driedrose$ghosthero.def_verb=ontweken
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Het spijt me... veel succes...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Maak het af... zonder mij...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nee... dat kan ik niet...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Succes...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Moe... voor nu...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ik kom terug...
items.artifacts.driedrose$ghosthero.desc=Een fragiel ogende, etherische figuur met een humanoïde vorm. Hun kracht lijkt verbonden te zijn met de roos die je hebt.\n\nDeze geest stelt misschien niet veel voor, maar lijkt je enige echte vriend hier beneden te zijn.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Waarom gebeurt dit? Ik dacht dat we geslaagd waren.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hoe kan zoiets deze wereld nog steeds beïnvloeden?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ik hoop dat je weet wat je doet met dat amulet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Ik denk dat we nog niet helemaal klaar zijn.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=We zijn al zo ver gekomen, we kunnen dit afmaken!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nog een klein stukje en we zijn hier weg!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Er is hier al heel lang geen mens of dwerg meer geweest.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Wat zou de dwergen ertoe bewegen een goudmijn te verlaten?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Het is jammer dat al het goud hier aan de oppervlakte nutteloos is.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=De wezens hier zijn misvormd, net als in de riolen.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Zelfs de vleermuizen zijn hier bloeddorstig.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Geen spoor van mijnbouwapparatuur te bekennen, hebben de dwergen alles teruggewonnen?
items.artifacts.driedrose$ghosthero.dialogue_city_1=De dwergen waren ijverig, maar ook hebzuchtig.
items.artifacts.driedrose$ghosthero.dialogue_city_2=De dwergenmetropool is dus echt gevallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Ik hoop dat het aardoppervlak er nooit zo uit komt te zien als hier.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Dwergen horen er niet zo bleek uit te zien.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Ik weet niet wat erger is, de dwergen of hun creaties.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Het lijkt erop dat de dwergen nu ook hersenloze monsters zijn geworden.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Wat is dit voor plek?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Deze plek is angstaanjagend...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Wat bezielde de dwergen toch, om zo met macht te spelen?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=De monsters hier zijn van een andere planeet, waar komen ze vandaan?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Voel je het ook? Het is alsof iets ons in de gaten houdt.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Gelukkig zijn er zaklampen, het is hier zo donker!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ik heb verhalen over deze plek gehoord, en niets goeds.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Deze plek leek meer op een kerker dan op een gevangenis.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Ik kan me niet voorstellen wat er allemaal gebeurde toen deze plek verlaten werd.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Het lijkt erop dat zowel de gevangenen als de bewakers in monsters zijn veranderd.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Waardoor zouden al die skeletten veroorzaakt kunnen zijn?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Deze mensen hadden niet zo hoeven te eindigen...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Deze riolen waren vroeger veilig; mensen woonden er zelfs in de winter.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ik vraag me af wat er met de bewakingspatrouilles is gebeurd, hebben ze het opgegeven?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Ik had familie aan de oppervlakte, ik hoop dat ze veilig zijn.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=De bewakers konden deze monsters niet verslaan, maar misschien kunnen wij dat wel.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Als zelfs het riool zo gevaarlijk is, vraag ik me af wat er zich daaronder bevindt...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Waardoor zouden deze ratten en krabben zo groot zijn geworden?
items.artifacts.driedrose$ghosthero.direct_prompt=Wat moet ik doen?
items.artifacts.driedrose$ghosthero.directed_attack_1=Oké, die ga ik aanpakken.
items.artifacts.driedrose$ghosthero.directed_attack_2=Die neem ik.
items.artifacts.driedrose$ghosthero.directed_attack_3=Boeiend...
items.artifacts.driedrose$ghosthero.directed_attack_4=Laten we ze pakken!
items.artifacts.driedrose$ghosthero.directed_attack_5=Die heb ik.
items.artifacts.driedrose$ghosthero.directed_follow_1=Oké, ik volg je.
items.artifacts.driedrose$ghosthero.directed_follow_2=Ik zal je volgen.
items.artifacts.driedrose$ghosthero.directed_follow_3=Ik volg je...
items.artifacts.driedrose$ghosthero.directed_follow_4=Oké, laten we gaan!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ik sta achter je.
items.artifacts.driedrose$ghosthero.directed_position_1=Oké, ik blijf bij dat standpunt.
items.artifacts.driedrose$ghosthero.directed_position_2=Ik ga erheen en zal het verdedigen.
items.artifacts.driedrose$ghosthero.directed_position_3=Herpositionering...
items.artifacts.driedrose$ghosthero.directed_position_4=Ik ben onderweg!
items.artifacts.driedrose$ghosthero.directed_position_5=Ik ga daarheen.
items.artifacts.driedrose$ghosthero.discover_hint=Je kunt dit personage vinden met behulp van een specifiek artefact.
items.artifacts.driedrose$ghosthero.hello=Hallo %s, daar ben ik weer.
items.artifacts.driedrose$ghosthero.introduce=Mijn ziel is verbonden met deze roos, ze was me zeer dierbaar, een geschenk van mijn geliefde die ik op aarde heb achtergelaten. Ik kan niet naar hem terugkeren, maar dankzij jou krijg ik een tweede kans om mijn reis te voltooien. Wanneer ik daartoe in staat ben, zal ik gehoor geven aan je oproep en met je meevechten. Zolang je de roos hebt, kan ik je stem horen, dus kun je die gebruiken om me van verre te leiden. Hopelijk slaag je waar ik gefaald heb...
items.artifacts.driedrose$ghosthero.name=droevige geest
items.artifacts.driedrose$ghosthero.player_killed_1=Nee!...
items.artifacts.driedrose$ghosthero.player_killed_2=Ik kon ze niet helpen...
items.artifacts.driedrose$ghosthero.player_killed_3=Niet op deze manier...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Alleen dwergen zouden een mijnbouwmachine bouwen die indringers doodt.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Dat ding is enorm...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hoe is dit ding zo lang actief gebleven?
items.artifacts.driedrose$ghosthero.seen_goo_1=Pas op voor slijm!
items.artifacts.driedrose$ghosthero.seen_goo_2=Veel van mijn vrienden zijn hierdoor omgekomen, tijd voor wraak!
items.artifacts.driedrose$ghosthero.seen_goo_3=Zo'n gruweldaad mag niet blijven bestaan!
items.artifacts.driedrose$ghosthero.seen_king_1=Als mensen zeggen dat macht corrumpeert, bedoelen ze dit.
items.artifacts.driedrose$ghosthero.seen_king_2=Hij is nu meer een ondode dan een koning.
items.artifacts.driedrose$ghosthero.seen_king_3=Zelfs in de dood gehoorzamen de dwergen hun meester.
items.artifacts.driedrose$ghosthero.seen_tengu_1=De enige overgebleven gevangene is een dodelijke huurmoordenaar. Natuurlijk...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Hij heeft ons in de val gelokt!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ik heb vreselijke verhalen gehoord over dat masker...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oei, dit ziet er niet goed uit.
items.artifacts.driedrose$ghosthero.seen_yog_2=Dus zo ziet een god eruit?
items.artifacts.driedrose$ghosthero.seen_yog_3=Dit gaat pijn doen...
items.artifacts.driedrose$petal.desc=Een broos, verdroogd bloemblaadje, dat op de een of andere manier zo ver in de kerker heeft overleefd.
items.artifacts.driedrose$petal.levelup=Je voegt het blaadje toe aan de roos.
items.artifacts.driedrose$petal.maxlevel=De roos is klaar!
items.artifacts.driedrose$petal.name=gedroogd bloemblad
items.artifacts.driedrose$petal.no_room=Er is geen plaats meer voor dit blaadje, dus je gooit het weg.
items.artifacts.driedrose$petal.no_rose=Je hebt geen roos waaraan je dit blaadje kunt toevoegen.
items.artifacts.driedrose$wndghosthero.armor_prompt=Kies een pantser
items.artifacts.driedrose$wndghosthero.cant_cursed=De geest kan alleen apparatuur gebruiken waarvan je zeker weet dat die niet vervloekt is.
items.artifacts.driedrose$wndghosthero.cant_strength=De geest is niet sterk genoeg om dat te gebruiken.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=De geest is wellicht niet sterk genoeg om dat te gebruiken.
items.artifacts.driedrose$wndghosthero.cant_unique=De geest kan geen unieke voorwerpen gebruiken.
items.artifacts.driedrose$wndghosthero.desc=De geest is op zichzelf zwak, maar zijn vorm is stevig genoeg om een wapen en pantser te dragen. Hij kan deze voorwerpen net als jij gebruiken. De geest kan momenteel voorwerpen dragen die tot _%d kracht_ vereisen.
