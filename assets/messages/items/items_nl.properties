items.artifacts.skeletonkey$keywall.desc=Met behulp van de skeletsleutel is hier een tijdelijke magische muur geplaatst.
items.artifacts.skeletonkey.ac_insert=INVOEGEN
items.artifacts.skeletonkey.crystal_charges=Het openen van een kristallen slot vereist 5 oplaadbeurten.
items.artifacts.skeletonkey.cursed=Je kunt geen vervloekte loper gebruiken.
items.artifacts.skeletonkey.desc=Een belangrijk ogende sleutel met een kop in de vorm van een schedel. De tanden lijken er elke keer anders uit te zien als je ernaar kijkt.
items.artifacts.skeletonkey.desc_cursed=De vervloekte sleutel lijkt zich actief te verzetten tegen het passen in welk slot dan ook, en maakt het zelfs moeilijk (maar niet onmogelijk) om je andere sleutels te gebruiken.
items.artifacts.skeletonkey.desc_worn=Deze magische sleutel lijkt aan kracht te winnen naarmate je hem vaker gebruikt in plaats van de gewone sleutels van de kerker. Hij kan in bijna elk slot van de kerker worden gestoken om ze te openen of te sluiten, zelfs deuren die voorheen nooit op slot zaten. De sleutel kan zelfs worden gebruikt op een lege ruimte in een hoofdrichting of diagonaal om de lucht voor je te 'vergrendelen', waardoor een massieve muur van 3 tegels breed ontstaat die 10 beurten standhoudt. Door de vergrendeling worden vijanden weggeduwd als er ruimte voor is.
items.artifacts.skeletonkey.discard=Je gooit je overtollige sleutels weg.
items.artifacts.skeletonkey.force_lock=Zonder uw loper is het slot verzwakt. U slaagt erin het open te breken.
items.artifacts.skeletonkey.gold_charges=Het openen van een gouden slot vereist 2 oplaadbeurten.
items.artifacts.skeletonkey.invalid_target=Er valt daar niets te vergrendelen of te ontgrendelen.
items.artifacts.skeletonkey.iron_charges=Het openen van een normaal slot vereist 1 oplaadbeurt.
items.artifacts.skeletonkey.levelup=Je loper wordt steeds sterker!
items.artifacts.skeletonkey.lock_charges=Het vergrendelen van een deur vereist 2 oplaadbeurten.
items.artifacts.skeletonkey.lock_no_space=Je kunt een personage niet in een deur opsluiten!
items.artifacts.skeletonkey.locked_with_key=Die deur zat op slot met jouw loper.
items.artifacts.skeletonkey.name=loper
items.artifacts.skeletonkey.prompt=Kies een doelwit
items.artifacts.skeletonkey.wall_charges=Het plaatsen van een tijdelijke muur kost 2 oplaadbeurten.
items.artifacts.skeletonkey.wont_open=Om de een of andere reden past de sleutel niet in dit slot.
items.artifacts.talismanofforesight$foresight.desc=Je voelt je erg nerveus, alsof er een onzichtbaar gevaar op de loer ligt.
items.artifacts.talismanofforesight$foresight.name=vooruitziendheid
items.artifacts.talismanofforesight$foresight.uneasy=Je voelt je ongemakkelijk.
items.artifacts.talismanofforesight.ac_scry=WAARZEGGERIJ
items.artifacts.talismanofforesight.desc=Een gladde steen met vreemde gravures erop. Je hebt het gevoel dat hij alles om je heen in de gaten houdt, alsof hij speurt naar alles wat verborgen is.
items.artifacts.talismanofforesight.desc_cursed=De vervloekte talisman staart je indringend aan en verdooft je zintuigen.
items.artifacts.talismanofforesight.desc_worn=Wanneer je de talisman vasthoudt, voelt het alsof je zintuigen verscherpt zijn. De talisman laadt langzaam op naarmate de tijd verstrijkt en wanneer je verborgen deuren of vallen ontdekt. De talisman kan zijn lading gebruiken om in een kegelvorm te 'scryen', waardoor alle tegels en geheimen in het gescande gebied zichtbaar worden en je gedurende korte tijd vijanden en voorwerpen kunt zien.
items.artifacts.talismanofforesight.full_charge=Je talisman is volledig opgeladen!
items.artifacts.talismanofforesight.levelup=Je talisman wordt sterker!
items.artifacts.talismanofforesight.low_charge=De talisman heeft minimaal 5% lading nodig om te kunnen scryen.
items.artifacts.talismanofforesight.name=talisman van vooruitziendheid
items.artifacts.talismanofforesight.prompt=Kies een locatie om te scannen.
items.artifacts.timekeepershourglass$sandbag.desc=Dit kleine zakje fijn zand zou perfect moeten werken met je zandloper.\n\nHet lijkt vreemd dat de winkelier juist dit artikel op voorraad heeft wanneer je het nodig hebt...
items.artifacts.timekeepershourglass$sandbag.levelup=Je voegt het zand toe aan je zandloper.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Je zandloper is gevuld met magisch zand!
items.artifacts.timekeepershourglass$sandbag.name=zak magisch zand
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Je hebt geen zandloper om dit zand in te doen.
items.artifacts.timekeepershourglass$timefreeze.desc=De tijd om je heen staat stil, waardoor je direct acties kunt uitvoeren. Dit effect duurt voort totdat het wordt opgeheven of je zandloper leeg is. Aanvallen of magie gebruiken verbreekt dit effect ook.\n\nAantal beurten tot lading op is: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Tijdbevriezing
items.artifacts.timekeepershourglass.ac_activate=ACTIVEREN
items.artifacts.timekeepershourglass.cursed=Je kunt geen vervloekte zandloper gebruiken.
items.artifacts.timekeepershourglass.deactivate=Je deactiveert de tijdbevriezing.
items.artifacts.timekeepershourglass.desc=Deze grote, sierlijke zandloper ziet er vrij onopvallend uit, maar je voelt een enorme kracht in het fijn bewerkte frame. Terwijl je de zandloper ronddraait en het zand erin ziet stromen, voel je de magie ervan aan je trekken; het gebruik van deze magie zou je ongetwijfeld enige controle over de tijd geven.
items.artifacts.timekeepershourglass.desc_cursed=De vervloekte zandloper zit aan je vast, je voelt hoe hij probeert je tijd te manipuleren.
items.artifacts.timekeepershourglass.desc_hint=Het zandlopertje lijkt wat zand te hebben verloren, als je er maar wat kon vinden...
items.artifacts.timekeepershourglass.freeze=Bevries de tijd om me heen.
items.artifacts.timekeepershourglass.name=zandloper van de tijdwaarnemer
items.artifacts.timekeepershourglass.no_charge=Je zandloper is nog niet voldoende opgeladen om te kunnen worden gebruikt.
items.artifacts.timekeepershourglass.onfreeze=Alles om je heen bevriest plotseling.
items.artifacts.timekeepershourglass.onstasis=De wereld om je heen lijkt in een oogwenk te veranderen.
items.artifacts.timekeepershourglass.prompt=Hoe zou je de magie van de zandloper willen gebruiken?\n\nTerwijl je in stasis bent, loopt de tijd normaal terwijl je bevroren en volledig onkwetsbaar bent. Verbruikt maximaal 2 ladingen per keer.\n\nWanneer de tijd bevroren is, kun je bewegen alsof je acties geen tijd kosten. Dit kan op elk moment worden gedeactiveerd door de zandloper te gebruiken of aan te vallen.
items.artifacts.timekeepershourglass.stasis=Ik heb mezelf in een staat van stilstand gebracht.
items.artifacts.unstablespellbook.ac_add=TOEVOEGEN
items.artifacts.unstablespellbook.ac_read=LEZEN
items.artifacts.unstablespellbook.blinded=Je kunt niet uit het boek lezen als je blind bent.
items.artifacts.unstablespellbook.cursed=Je kunt niet lezen uit een vervloekt toverboek.
items.artifacts.unstablespellbook.desc=Dit boek verkeert in verrassend goede staat gezien zijn leeftijd. Het bruist en knettert als je de bladzijden omslaat, en bruist van onstabiele energie. Als je uit dit boek leest, weet je nooit welke spreuk je zult uitspreken.
items.artifacts.unstablespellbook.desc_cursed=Het vervloekte boek heeft zich aan je gebonden en verhindert je om de meeste spreuken te gebruiken.
items.artifacts.unstablespellbook.desc_empowered=De rollen die je aan het boek hebt toegevoegd, stralen kracht uit. Je kunt de exotische versie van de effecten van deze rollen kiezen, maar dit kost extra.
items.artifacts.unstablespellbook.desc_index=Het boek is onvolledig. De index verwijst momenteel naar de volgende lege pagina's:
items.artifacts.unstablespellbook.infuse_scroll=Je brengt de energie van de rol over op het boek.
items.artifacts.unstablespellbook.name=onstabiel spreukenboek
items.artifacts.unstablespellbook.no_charge=Je spreukenboek heeft momenteel geen energie meer.
items.artifacts.unstablespellbook.prompt=Selecteer een scroll
items.artifacts.unstablespellbook.read_empowered=De perkamentrol die je aan het spreukenboek hebt toegevoegd, bruist van energie. Je kunt kiezen tussen de normale en de exotische versie van het effect van deze perkamentrol. Het kiezen van de exotische variant kost 2 ladingen in plaats van 1.
items.artifacts.unstablespellbook.unable_scroll=Je kunt deze rol niet aan het boek toevoegen.
items.artifacts.unstablespellbook.unknown_scroll=Je weet nog niet zeker wat voor soort rol dit is.
items.bags.bag.discover_hint=Je kunt dit artikel in een winkel kopen.
items.bags.bag.name=rugzak
items.bags.magicalholster.desc=Deze slanke holster is gemaakt van een exotische dierenhuid en bezit krachtige magie waardoor er een enorme hoeveelheid afstandswapens in opgeborgen kan worden. Je kunt eenvoudig in de tas grijpen en altijd het gewenste voorwerp vinden. Dankzij de magie van de holster laden toverstaven iets sneller op en gaan werpwapens er iets langer in mee.
items.bags.magicalholster.name=magische holster
items.bags.potionbandolier.desc=Deze dikke bandelier past als een sjerp om je borst en heeft veel geïsoleerde banden om flesjes met drankjes, je waterzak of flesjes met vloeibaar metaal in op te bergen. In de bandelier zijn je drankjes beschermd tegen de kou.
items.bags.potionbandolier.name=drank bandelier
items.bags.scrollholder.desc=Deze buisvormige houder lijkt bedoeld voor de instrumenten en kaarten van een astronoom, maar je perkamentrollen passen er net zo goed in. Er zijn zelfs een paar zijvakjes waar je spreukkristallen, magische pennen en magische hars prima in kwijt kunt. De houder lijkt niet erg brandbaar, dus je perkamentrollen zouden erin veilig moeten zijn voor vuur.
items.bags.scrollholder.name=rolhouder
items.bags.velvetpouch.desc=In dit kleine fluwelen zakje kunnen veel kleine voorwerpen worden bewaard, zoals zaden, runenstenen en enkele alchemistische ingrediënten.
items.bags.velvetpouch.discover_hint=Een van de helden begint met dit voorwerp.
items.bags.velvetpouch.name=fluwelen etui
items.bombs.arcanebomb.desc=Deze bom is doordrenkt met mysterieuze eigenschappen. Hij zal exploderen in een krachtige knal, vergelijkbaar met Goo's opgepompte aanval, en _%1$d-%2$d magische schade_ toebrengen aan alles binnen een straal van 2 tegels.
items.bombs.arcanebomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.arcanebomb.name=geheimzinnige bom
items.bombs.bomb$doublebomb.desc=Een stapel van twee flinke buskruitbommen, het lijkt erop dat je er één gratis krijgt!
items.bombs.bomb$doublebomb.name=twee bommen
items.bombs.bomb.ac_lightthrow=LICHT & REK
items.bombs.bomb.desc=Een tamelijk zware buskruitbom. Een explosie van deze bom veroorzaakt _%1$d-%2$d schade_ aan alles wat ernaast staat en vernietigt ook aangrenzend terrein of voorwerpen.
items.bombs.bomb.desc_burning=De lont van de bom brandt door, houd afstand of doof hem!
items.bombs.bomb.desc_fuse=Het lijkt erop dat de lont een paar schoten nodig heeft om op te branden als hij eenmaal is aangestoken.
items.bombs.bomb.name=bom
items.bombs.bomb.ondeath=De explosie doodt je...
items.bombs.bomb.rankings_desc=Gedood door een explosie
items.bombs.bomb.snuff_fuse=Je dooft snel de lont van de bom.
items.bombs.firebomb.desc=Deze bom is aangepast om in een groter gebied te exploderen, waarbij _%1$d-%2$d schade_ wordt toegebracht en een aanhoudende vlam over een gebied van 2 tegels wordt verspreid.
items.bombs.firebomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.firebomb.name=brandbom
items.bombs.flashbangbomb.desc=Deze op maat gemaakte bom zal bij de explosie een explosie van licht, geluid en elektriciteit veroorzaken. Alles binnen een straal van 2 tegels zal _%1$d-%2$d schade_ oplopen door de explosie, daarnaast nog eens 25%% schade door de elektriciteit, en gedurende 10 beurten verlamd zijn.
items.bombs.flashbangbomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.flashbangbomb.name=flitsgranaat
items.bombs.frostbomb.desc=Deze bom is aangepast om in een groter gebied te exploderen, waarbij _%1$d-%2$d schade_ wordt toegebracht en een aanhoudende stroom ijskoude lucht over een gebied van 2 tegels wordt verspreid.
items.bombs.frostbomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.frostbomb.name=ijsbom
items.bombs.holybomb.desc=Deze bom is aangepast om bij de explosie een groter gebied te bestrijken met heilig licht. Alles binnen een straal van 2 tegels loopt _%1$d-%2$d schade_ op door de explosie, en ondoden of demonische vijanden lopen daarnaast nog eens 50%% schade op door het heilige licht.
items.bombs.holybomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.holybomb.name=heilige bom
items.bombs.noisemaker.desc=Deze op maat gemaakte bom zal herhaaldelijk lawaai maken wanneer de lont op is. Wanneer iets de bom aanraakt, zal deze exploderen en _%1$d-%2$d schade_ toebrengen aan alles binnen een straal van 2 tegels!
items.bombs.noisemaker.desc_burning=Het lawaaiapparaat tikt door, het zal ontploffen als er iets in de buurt komt!
items.bombs.noisemaker.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.noisemaker.name=lawaaimaker
items.bombs.regrowthbomb.desc=Deze aangepaste bom zal in een straal van 3 tegels een levensgevende vloeistof verspreiden in plaats van te exploderen. In het gebied dat door de explosie wordt getroffen, zullen snel gras en planten groeien. Jijzelf en alle bondgenoten die door de explosie worden getroffen, zullen genezen alsof ze een genezingsdrankje hebben gedronken.
items.bombs.regrowthbomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.regrowthbomb.name=hergroeibom
items.bombs.shrapnelbomb.desc=Deze bom is aangepast met stukjes metaal van de DM-300, die bij de explosie zullen versplinteren en in het rond vliegen, waardoor _%1$d-%2$d schade_ wordt aangericht in een enorm gebied rondom de bom. Je kunt je maar beter ergens achter verschuilen als je hem gebruikt...
items.bombs.shrapnelbomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.shrapnelbomb.name=schrapnelbom
items.bombs.smokebomb.desc=Deze bom is aangepast om tegelijk met de explosie een dikke gaswolk uit te stoten. Hij zal _%1$d-%2$d schade_ toebrengen en een omhullende mist verspreiden over een gebied van 2 tegels.
items.bombs.smokebomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.smokebomb.name=rookbom
items.bombs.woollybomb.desc=Deze aangepaste bom creëert na de explosie een groot veld van magische schapen. De explosie zal _%1$d-%2$d schade_ toebrengen aan alles binnen een straal van 2 tegels. De schapen blokkeren beweging en blijven zeer lang aanwezig! In de aanwezigheid van krachtige vijanden zullen de schapen echter minder lang blijven bestaan en kunnen ze eerder handmatig worden verdreven door met hen te interageren.
items.bombs.woollybomb.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.bombs.woollybomb.name=wollige bom
items.brokenseal$warriorshield.desc_active=Het verbroken zegel van de krijger helpt hem momenteel te overleven door hem naast zijn gezondheid ook een schild te geven. Er is een afkoelperiode nadat het schild voor het eerst is geactiveerd voordat het opnieuw kan worden gebruikt. Dit schild neemt niet af na verloop van tijd, maar verdwijnt als er gedurende een paar beurten geen vijanden in de buurt zijn. Wanneer het eindigt, zal elk ongebruikt schild de afkoelperiode verkorten, tot een maximum van 50. Resterend schild: 1. Huidige afkoelperiode: 2.
items.brokenseal$warriorshield.desc_cooldown=De krijger heeft onlangs bescherming gekregen door het verbreken van zijn zegel en moet wachten tot hij weer van dit beschermende effect kan profiteren.\n\nBeurten resterend: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=De afkoeltijd van het schild van de krijger is momenteel negatief, wat betekent dat wanneer zijn schild activeert, de afkoeltijd lager zal zijn dan de gebruikelijke 150 beurten. De afkoeltijd van het schild kan worden verlaagd tot -150 beurten, wat betekent dat het direct weer beschikbaar is zodra het is geactiveerd.\n\nHuidige afkoeltijd: %d.
items.brokenseal$warriorshield.name=Krijgersschild
items.brokenseal.ac_affix=BEVESTIGEN
items.brokenseal.affix=Je bevestigt het zegel aan je harnas!
items.brokenseal.choose_desc=Zowel dit pantser als het gebroken zegel dragen een glyph. Kies welke glyph behouden moet worden.\n\nPantserglyph: %1$s\nGebroken zegelglyph: %2$s\n\nLet op: als je de glyph kiest die momenteel op het pantser staat, kan het zegel deze later niet overdragen.
items.brokenseal.choose_title=Kies een glyph
items.brokenseal.cursed_armor=Het zegel is niet van toepassing op vervloekte bepantsering.
items.brokenseal.desc=Een zegel van was, bevestigd aan een harnas als symbool van moed. Het heeft een vervaagde beschermingsrune in het midden gegraveerd en is in het midden doormidden gebroken. Een aandenken van thuis, het zegel helpt de krijger vol te houden. Zolang de krijger het zegel draagt, krijgt hij direct een schild wanneer zijn gezondheid tot de helft of minder wordt gereduceerd. Het zegel kan aan een harnas worden bevestigd en tussen verschillende harnassen worden verplaatst. Het kan één upgrade meenemen, mits die upgrade op het harnas is toegepast terwijl het zegel eraan bevestigd was.
items.brokenseal.discover_hint=Een van de helden begint met dit voorwerp.
items.brokenseal.inscribed=Het zegel is voorzien van de inscriptie _%s_.
items.brokenseal.name=verbroken zegel
items.brokenseal.prompt=Kies een pantser
items.brokenseal.unknown_armor=Je moet eerst vaststellen of dat harnas vervloekt is of niet.
items.dewdrop.already_full=Je bent al in topconditie.
items.dewdrop.desc=Een kristalheldere dauwdruppel.
items.dewdrop.name=dauwdruppel
items.dewvial.ac_drink=DRINKEN
items.dewvial.auto_drink=Het dauwflesje is leeggedronken om je wonden te genezen.
items.dewvial.collected=Je hebt een dauwdruppel in je dauwflesje verzameld.
items.dewvial.desc=In dit kleine flesje kun je overtollige dauw bewaren om later op te drinken. Als het flesje vol is, drink je de dauw automatisch op wanneer je in levensgevaar bent.
items.dewvial.empty=Je dauwflesje is leeg!
items.dewvial.full=Je dauwflesje is vol!
items.dewvial.name=dauwflesje
items.energycrystal.desc=Een verzameling kleine magische kristallen, gevuld met alchemistische energie. Deze kristallen zijn het meest voorkomende ingrediënt in alchemistische recepten en kunnen worden geproduceerd in een alchemieketel door verbruiksartikelen te recyclen.
items.energycrystal.name=energiekristal
items.equipableitem.ac_equip=UITRUSTING
items.equipableitem.ac_unequip=DE-UITRUSTING
items.equipableitem.curse_detected=Je voelt al aan dat het voorwerp vervloekt is, vlak voordat je het uitrust!
items.equipableitem.unequip_cursed=Je kunt een vervloekt voorwerp niet verwijderen!
items.food.berry.desc=Deze kleine bes werd door de Jageres gevonden tussen de begroeiing van de kerker. Hij kan snel gegeten worden, geeft een beetje verzadiging en bevat mogelijk een bruikbaar zaadje!
items.food.berry.discover_hint=Je kunt dit voorwerp vinden door een specifiek heldentalent te gebruiken.
items.food.berry.eat_msg=Die bes was heerlijk!
items.food.berry.name=kerkerbes
items.food.blandfruit$chunks.desc=De smakeloze vrucht is bij de inslag uiteengespat en heeft levenloze brokken achtergelaten. Ondanks een beetje vuil lijken deze grote brokken gekookte smakeloze vrucht perfect eetbaar.
items.food.blandfruit$chunks.name=flauwe fruitstukjes
items.food.blandfruit.blindfruit=blinde vrucht
items.food.blandfruit.cooked=gekookt flauw fruit
items.food.blandfruit.desc=Het is zo droog en smaakloos, misschien zou het beter smaken als je er nog een ingrediënt aan toevoegt.
items.food.blandfruit.desc_cooked=Het fruit is opgezwollen doordat het in de pan heeft gelegen en heeft zelfs de eigenschappen van het zaad waarmee het gekookt is, opgenomen. Het zal het effect hebben van het drankje waarmee het zaad correspondeerde.
items.food.blandfruit.desc_eat=Het ziet eruit alsof het klaar is om opgegeten te worden!
items.food.blandfruit.desc_throw=Het lijkt nogal instabiel, misschien is het het beste om het weg te gooien.
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.earthfruit=aardvrucht
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.firefruit=vuurvrucht
items.food.blandfruit.icefruit=ijsfruit
items.food.blandfruit.name=flauw fruit
items.food.blandfruit.raw=Je kunt het niet verdragen om het rauw te eten.
items.food.blandfruit.rotfruit=rotte vruchten
items.food.blandfruit.sorrowfruit=treurvrucht
items.food.blandfruit.starfruit=stervrucht
items.food.blandfruit.stormfruit=stormfruit
items.food.blandfruit.sunfruit=zonnebloem
items.food.blandfruit.swiftfruit=snelfruit
items.food.chargrilledmeat.desc=Het ziet eruit als een prima biefstuk.
items.food.chargrilledmeat.discover_hint=Je kunt dit ook met een ander voedingsmiddel maken.
items.food.chargrilledmeat.name=gegrild vlees
items.food.food.ac_eat=ETEN
items.food.food.desc=Niets bijzonders hier: gedroogd vlees, wat koekjes - dat soort dingen.
items.food.food.eat_msg=Dat eten smaakte heerlijk!
items.food.food.name=voedselrantsoen
items.food.frozencarpaccio.better=Je voelt je beter!
items.food.frozencarpaccio.desc=Het is een stuk bevroren rauw vlees. Je kunt het alleen eten door er dunne plakjes van te snijden. En op die manier is het verrassend lekker.
items.food.frozencarpaccio.discover_hint=Je kunt dit ook met een ander voedingsmiddel maken.
items.food.frozencarpaccio.hard=Je voelt je huid harder worden!
items.food.frozencarpaccio.invis=Je ziet je handen onzichtbaar worden!
items.food.frozencarpaccio.name=bevroren carpaccio
items.food.frozencarpaccio.refresh=Verfrissend!
items.food.meatpie.desc=Een heerlijke pastei gevuld met hartig vlees. Deze maaltijd zal je veel meer verzadigen dan welke andere maaltijd ook.
items.food.meatpie.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.food.meatpie.eat_msg=Dat eten was fantastisch!
items.food.meatpie.name=vleespastei
items.food.mysterymeat$placeholder.name=vlees
items.food.mysterymeat.desc=Eten op eigen risico!
items.food.mysterymeat.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.food.mysterymeat.eat_msg=Dat eten smaakte... vreemd.
items.food.mysterymeat.hot=O, wat is het warm!
items.food.mysterymeat.legs=Je voelt je benen niet meer!
items.food.mysterymeat.name=mysterieus vlees
items.food.mysterymeat.not_well=Je voelt je niet goed.
items.food.mysterymeat.stuffed=Je zit helemaal vol.
items.food.pasty$fishleftover.desc=Er is wat vis overgebleven van je vorige maaltijd. Je kunt het opeten wanneer je maar wilt om je honger een beetje te stillen.
items.food.pasty$fishleftover.eat_msg=Dat eten smaakte wel oké.
items.food.pasty$fishleftover.name=visresten
items.food.pasty.amulet_desc=Je hebt het eindelijk gevonden, het magische amulet van... wacht even, dit is gewoon een in folie verpakte chocolade die eruitziet als het amulet! Het geeft je geen onbeperkte kracht, maar het vult je maag in ieder geval en geeft je een kleine lading voor het artefact.\n\n1 1 aprilgrap!
items.food.pasty.amulet_name=Amulet van Yendor?
items.food.pasty.cane_desc=Een enorme, suikerzoete zuurstok. Hij is groot genoeg om je helemaal vol te eten, en de suiker geeft je toverstokjes misschien ook nog een klein beetje extra energie.\n\nFijne feestdagen!
items.food.pasty.cane_name=snoepstok
items.food.pasty.desc=Een authentieke Cornish pasty met een traditionele vulling van rundvlees en aardappel. Heerlijk!
items.food.pasty.egg_desc=Een enorm chocolade-ei, verpakt in kleurrijke gele folie. Er zit meer dan genoeg chocolade in om je te vullen, en de suiker geeft je creaties misschien wel een klein beetje extra pit. Fijne Pasen!
items.food.pasty.egg_name=paasei
items.food.pasty.fish_desc=Een hele gestoomde vis, op magische wijze geconserveerd op een bedje van groenten. Het is traditie om rond deze tijd van het jaar wat vis te bewaren voor later, zodat je wat restjes overhoudt in plaats van alles in één keer op te eten. Gelukkig Chinees Nieuwjaar!
items.food.pasty.fish_name=gestoomde vis
items.food.pasty.name=pasteiachtig
items.food.pasty.pie_desc=Een heerlijk groot stuk pompoentaart. De zoete en kruidige smaak vult je maag en geeft je een beetje troost. Fijne Halloween!
items.food.pasty.pie_name=pompoentaart
items.food.pasty.rainbow_desc=Dit kleurrijke drankje is een soort vloeibaar voedsel. Naast het stillen van je honger, bevat het ook een beetje magie die een nabijgelegen vijand (niet-baas) kalmeert, waardoor deze tijdelijk aarzelt om tegen je te vechten.\n\nHappy Pride!
items.food.pasty.rainbow_name=regenboogdrankje
items.food.pasty.sparkling_desc=Dit sprankelende drankje is een soort vloeibaar voedsel. Het stilt de honger en lijkt op mousserende wijn, maar is niet echt alcoholisch. Het warme gevoel in je buik geeft je een beetje bescherming. Gelukkig nieuwjaar!
items.food.pasty.sparkling_name=sprankelende toverdrank
items.food.pasty.vanilla_desc=Deze grote plak vanillecake is versierd met kleurrijke hagelslag en blauwe glazuur. De cake is gemaakt ter ere van jarenlange ervaring en zal je een klein beetje van die ervaring schenken wanneer je hem opeet. De originele Pixel Dungeon werd voor het eerst uitgebracht op 4 december 2012. Gefeliciteerd met je verjaardag, Pixel Dungeon!
items.food.pasty.vanilla_name=blauwe cake
items.food.phantommeat.desc=Een grote, glanzende, doorschijnende biefstuk, afkomstig van een spookpiranha. Dit magische vlees hoeft niet gekookt te worden en biedt naast een verzadigd gevoel ook diverse verdedigingsvoordelen. Bij het eten ervan verkrijgt het onzichtbaarheid, een schorsachtige huid, enige genezing en heft het vele schadelijke effecten op.
items.food.phantommeat.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.food.phantommeat.name=spookvlees
items.food.smallration.desc=Het ziet er precies uit als een standaard voedselrantsoen, maar dan kleiner.
items.food.smallration.discover_hint=Je kunt dit artikel in een winkel kopen.
items.food.smallration.eat_msg=Dat eten smaakte wel oké.
items.food.smallration.name=kleine voedselrantsoen
items.food.stewedmeat.desc=Door het stoven is het vlees ontdaan van ziektes en parasieten. Het zou veilig moeten zijn om te eten.
items.food.stewedmeat.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.food.stewedmeat.eat_msg=Dat eten smaakte wel oké.
items.food.stewedmeat.name=gestoofd vlees
items.food.supplyration.desc=Dit rantsoen werd in de kerker achtergelaten door en voor leden van het dievengilde. Het is speciaal ontworpen om onderweg te worden gegeten en te helpen bij allerlei snode plannen. Hoewel het je niet zo vult als een normaal rantsoen, kan het snel worden gegeten, biedt het een beetje directe genezing en vult het de schaduwmantel van de schurk aan.
items.food.supplyration.discover_hint=Je kunt dit voorwerp vinden door een specifiek heldentalent te gebruiken.
items.food.supplyration.name=leveringsrantsoen
items.gold.desc=Een stapel gouden munten. Verzamel gouden munten om ze later in een winkel uit te geven.
items.gold.name=goud
items.heap.artifact=een artefact
items.heap.chest=Borst
items.heap.chest_desc=Je weet pas wat erin zit als je het openmaakt!
items.heap.crystal_chest=Kristallen kist
items.heap.crystal_chest_desc=Je kunt _%s_ binnenin zien, maar om de kist te openen heb je een kristallen sleutel nodig.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Gesloten kist
items.heap.locked_chest_desc=Je weet pas wat erin zit als je het openmaakt! Maar om het te openen heb je een gouden sleutel nodig.
items.heap.remains=De overblijfselen van de held
items.heap.remains_desc=Dit is alles wat er nog over is van een van je voorgangers. Misschien is het de moeite waard om te kijken of er nog waardevolle spullen tussen zitten.
items.heap.ring=een ring
items.heap.skeleton=Skeletresten
items.heap.skeleton_desc=Dit is alles wat er over is van een ongelukkige avonturier. Misschien is het de moeite waard om te kijken of er nog waardevolle spullen tussen zitten.
items.heap.tomb=Graf
items.heap.tomb_desc=Dit oude graf bevat mogelijk iets nuttigs, maar de eigenaar zal er ongetwijfeld bezwaar tegen hebben als hij het laat onderzoeken.
items.heap.wand=een toverstaf
items.honeypot$shatteredpot.desc=De pot is verbrijzeld, alleen de kleverige honing die de wanden bedekt houdt hem nog bij elkaar, en hij valt langzaam uit elkaar. Ondanks de gebroken staat lijkt de bij de pot nog steeds te willen beschermen.
items.honeypot$shatteredpot.name=verbrijzelde honingpot
items.honeypot.ac_shatter=STUKSLAAN
items.honeypot.desc=Deze enorme honingpot is eigenlijk alleen maar met honing gevuld, want er woont een gigantische bij in! Zulke enorme bijen blijven normaal gesproken in hun kasten, misschien is de pot wel een soort speciale vangkooi? De bij lijkt behoorlijk tevreden in de pot met zijn honing en zoemt wantrouwend naar je als je ernaar kijkt.
items.honeypot.name=honingpot
items.item.ac_drop=DRUPPEL
items.item.ac_throw=GOOIEN
items.item.curse=vloek
items.item.custom_note=Dit artikel heeft een aangepaste notitie: "_%s_"
items.item.custom_note_type=Dit type artikel heeft een aangepaste notitie: "_%s_"
items.item.discover_hint=Je kunt dit voorwerp willekeurig in de kerker vinden.
items.item.prompt=Kies de werprichting.
items.item.rankings_desc=Gedood door: %s
items.journal.alchemypage.desc=Een afgescheurde pagina uit een handleiding over alchemie.\n\nHet grootste deel van de tekst is te klein om van een afstand te lezen, maar de titel van de pagina is nog wel te onderscheiden:\n\n_"%s"_
items.journal.alchemypage.name=gescheurde pagina uit een alchemieboek
items.journal.documentpage.desc=Een losse bladzijde, waarschijnlijk uit een boek gescheurd. Je moet hem oppakken om hem te kunnen lezen.
items.journal.documentpage.name=gescheurde pagina
items.journal.guidebook.desc=Een reisgids voor avonturiers, achtergelaten door iemand die besloot dat avonturieren niets voor hem was! Dit specifieke boek is magisch en kan avonturiers ertoe aanzetten om op het juiste moment een pagina te lezen. Ondanks die functionaliteit is het boek vooral populair vanwege de grote woorden "Geen paniek!" in grote, vriendelijke letters op de omslag.
items.journal.guidebook.hint_desktop=Uw reisgids bevat tips! Selecteer de knipperende knop (%s) rechtsboven om deze te lezen.
items.journal.guidebook.hint_mobile=Je reisgids staat vol met tips! Tik op de knipperende knop rechtsboven om hem te lezen.
items.journal.guidebook.hint_status=Gids
items.journal.guidebook.name=boek van kerkermeesterschap
items.journal.guidepage.desc=Een afgescheurde pagina uit een avonturengids.\n\nHet grootste deel van de tekst is te klein om van een afstand te lezen, maar de titel van de pagina is nog wel te onderscheiden:\n\n_"%s"_
items.journal.guidepage.name=gescheurde pagina uit de reisgids
items.journal.regionlorepage$caves.desc=Wat lijkt op een aantekening in het logboek van een ontdekkingsreiziger, verrassend goed bewaard gebleven ondanks de ouderdom. Pak het op en lees het.
items.journal.regionlorepage$caves.name=oude logboekvermelding
items.journal.regionlorepage$city.desc=Een klein, verroest metalen tabletje met een boodschap die er op magische wijze in is gegraveerd. De letters zijn ondanks de ouderdom van het tabletje nog steeds duidelijk leesbaar, maar je moet het oppakken om het te kunnen lezen.
items.journal.regionlorepage$city.name=verroeste tablet
items.journal.regionlorepage$halls.desc=Een klein zwart tabletje met daarin gegraveerde, lichtgevende groene letters. De lichtgevende letters vervagen van een afstand tot een waas; je moet het tabletje oppakken om ze te kunnen lezen.
items.journal.regionlorepage$halls.name=gloeiende tablet
items.journal.regionlorepage$prison.desc=Een dagboekfragment, of een ander soort aantekening, geschreven op een oud stuk papier. Het lijkt er beter aan toe te zijn dan de brieven die je in het riool vond, maar je zult het toch moeten oppakken om het te kunnen lezen.
items.journal.regionlorepage$prison.name=versleten dagboekvermelding
items.journal.regionlorepage$sewers.desc=Wat lijkt op een brief, geschreven op een met vuil bevlekt stuk papier. Je moet het oppakken om te kunnen lezen wat erop staat.
items.journal.regionlorepage$sewers.name=versleten letter
items.keys.crystalkey.desc=De geslepen oppervlakken van deze kristallen sleutel glinsteren in het donker. Misschien opent hij wel iets van kristal?
items.keys.crystalkey.name=Kristallen sleutel
items.keys.goldenkey.desc=De inkepingen op deze gouden sleutel zijn klein en verfijnd. Misschien kan hij een afgesloten kist openen?
items.keys.goldenkey.name=gouden sleutel
items.keys.ironkey.desc=De inkepingen op deze antieke ijzeren sleutel zijn flink versleten; het leren koord is door de tijd gehavend. Welke deur zou hij kunnen openen?
items.keys.ironkey.name=ijzeren sleutel
items.keys.skeletonkey.name=loper
items.keys.wornkey.desc=Deze sleutel is versleten en verkleurd, maar ziet er degelijk uit. Waarschijnlijk kan hij een belangrijke deur in de buurt openen.
items.keys.wornkey.name=versleten sleutel
items.kindofmisc.unequip_message=Je moet eerst een van deze items verwijderen. Selecteer een item om mee te wisselen.
items.kindofmisc.unequip_title=Verwijder één item uit je uitrusting.
items.kindofweapon.empty=leeg
items.kindofweapon.equip_cursed=Je greep zich onwillekeurig om het wapen heen.
items.kindofweapon.swift_equip=Je pakt je wapen snel.
items.kindofweapon.which_equip_msg=In welk wapenslot wilt u dit voorwerp plaatsen?\n\nDe kampioen valt direct aan met haar primaire wapen, maar kan de vaardigheid van beide wapens gebruiken. Beide wapens hebben hetzelfde aantal ladingen.\n\nDe kampioen kan ook direct wisselen tussen haar primaire en secundaire wapen.
items.kindofweapon.which_equip_primary=Primair (%s)
items.kindofweapon.which_equip_secondary=Secundair (%s)
items.kingscrown.ac_wear=DRAGEN
items.kingscrown.desc=De kroon van de laatste dwergenkoning straalt een enorme magische energie uit. Wanneer je de kroon draagt, stroomt de magie ervan in het pantser dat je momenteel draagt, waardoor het verandert in een uniek episch pantser met speciale eigenschappen. Het nieuwe pantser behoudt alle eigenschappen van het originele pantser.
items.kingscrown.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.kingscrown.naked=Helaas kan de kroon je ondergoed niet veranderen.
items.kingscrown.name=Kroon van de Dwergenkoning
items.kingscrown.ratgraded=De poten van Rat King lichten fel op terwijl je pantser transformeert!
items.kingscrown.upgraded=De kroon gloeit fel en valt vervolgens uiteen terwijl je pantser transformeert!
items.liquidmetal.ac_apply=TOEPASSEN
items.liquidmetal.already_fixed=Dat werpwapen verkeert al in perfecte staat!
items.liquidmetal.apply=Je gebruikt vloeibaar metaal %d om je werpwapen te repareren.
items.liquidmetal.desc=Deze magische vloeistof kan de scheuren en barsten in een werpwapen opvullen en het in perfecte staat herstellen! Als een wapenset een wapen mist, maar verder volledig gerepareerd is, kan vloeibaar metaal zelfs worden gebruikt om een ontbrekend wapen uit de set te vervangen! Een wapen van niveau 1 vereist 10 vloeibaar metaal om volledig gerepareerd te worden, een wapen van niveau 5 vereist 30. Elke upgrade verhoogt ook de benodigde hoeveelheid metaal met 35%. Vloeibaar metaal kan niet worden gebruikt om de punten van pijlen met een punt te repareren.
items.liquidmetal.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.liquidmetal.name=vloeibaar metaal
items.liquidmetal.prompt=Kies een werpwapen
items.lostbackpack.desc=Dit is je verloren inventaris. Verzamel deze om alle verloren spullen terug te krijgen!
items.lostbackpack.name=verloren rugzak
items.merchantsbeacon.ac_use=GEBRUIK
items.merchantsbeacon.desc=Dit eigenaardige stukje dwergentechnologie stelt je in staat om over grote afstanden te communiceren.\n\nNa activering kun je met dit baken vanuit elke plek in de kerker items verkopen aan Pixel Mart.\n\nDe magie in het baken werkt echter maar één sessie, dus gebruik het verstandig.
items.merchantsbeacon.name=koopmansbaken
items.potions.brews.aquabrew.desc=Wanneer dit brouwsel wordt gebroken, komt er een straal water onder hoge druk vrij op de plek waar het is gebroken. Deze straal is alleen krachtig genoeg om vurige vijanden te beschadigen, maar verspreidt ook water over nabijgelegen terrein, schakelt vallen uit, blust branden en stoot personages in de buurt van de explosie achteruit.
items.potions.brews.aquabrew.name=aqua brew
items.potions.brews.blizzardbrew.desc=Als dit brouwsel wordt gebroken, ontstaat er een wervelende sneeuwstorm die zich snel als een gas verspreidt.
items.potions.brews.blizzardbrew.name=sneeuwstormbrouwsel
items.potions.brews.brew.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.potions.brews.causticbrew.desc=Dit brouwsel verspreidt een corrosieve substantie over een groot gebied rond de plek waar het uiteenspat. Alles wat door de substantie wordt geraakt, zal langzaam smelten als het niet met water kan worden afgespoeld.
items.potions.brews.causticbrew.name=bijtend brouwsel
items.potions.brews.infernalbrew.desc=Als dit brouwsel wordt gebroken, ontketent het een woedende vuurzee die zich snel als een gas verspreidt.
items.potions.brews.infernalbrew.name=hels brouwsel
items.potions.brews.shockingbrew.desc=Als dit brouwsel breekt, zal het een elektrische storm ontketenen in een groot gebied rond de plek waar het breekt.
items.potions.brews.shockingbrew.name=schokkend brouwsel
items.potions.brews.unstablebrew.desc=Dit magische brouwsel gloeit met wisselende kleuren van de regenboog.\n\nWanneer het gedronken of gegooid wordt, activeert het het effect van een willekeurig drankje. Het effect van het drankje is altijd gunstig als het gedronken wordt en altijd schadelijk als het gegooid wordt.
items.potions.brews.unstablebrew.name=onstabiel brouwsel
items.potions.elixirs.elixir.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Je hebt tijdelijk herstellende eigenschappen verkregen die vergelijkbaar zijn met die van Goo.\n\nTerwijl je in water staat, herstel je een kleine hoeveelheid gezondheid per beurt. Het effect wordt gepauzeerd wanneer je volledig hersteld bent of uit het water bent.\n\nResterende genezing: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatische genezing
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Dit elixer bevat de resten van Goo, verrijkt met een helende drank. Hoewel het niet direct genezing biedt, zal het je gezondheid geleidelijk aan herstellen zolang je in het water staat.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixer van aquatische verjonging
items.potions.elixirs.elixirofarcanearmor.desc=Dit elixer verleent de drinker langdurige weerstand tegen magische schade.
items.potions.elixirs.elixirofarcanearmor.name=elixer van arcane pantser
items.potions.elixirs.elixirofdragonsblood.desc=Na inname zal dit elixer een vurige energie door de aderen van de drinker laten stromen. Dit effect maakt de drinker immuun voor vuur en stelt hem in staat vijanden in brand te steken met fysieke aanvallen.
items.potions.elixirs.elixirofdragonsblood.name=elixer van drakenbloed
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Je staat onder invloed van een vederlicht val-elixer, waardoor je in ravijnen kunt vallen zonder schade op te lopen!\n\nAantal resterende beurten: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=veerval
items.potions.elixirs.elixiroffeatherfall.desc=Dit elixer biedt een zwakker, maar beter gecontroleerd levitatie-effect, waardoor de drinker gedurende korte tijd van grote hoogte kan vallen zonder schade op te lopen.
items.potions.elixirs.elixiroffeatherfall.light=Je voelt je vederlicht!
items.potions.elixirs.elixiroffeatherfall.name=elixer van vederlichte val
items.potions.elixirs.elixirofhoneyedhealing.desc=Dit elixer combineert genezing met de zoetheid van honing. Wanneer het gedronken wordt, heeft het hetzelfde effect als een genezingsdrankje en stilt het een beetje de honger, maar het kan ook gegooid worden om een bondgenoot te genezen. Wezens met een voorliefde voor honing kunnen mogelijk tot rust komen als dit voorwerp op hen gebruikt wordt.
items.potions.elixirs.elixirofhoneyedhealing.name=elixer van honingzoete genezing
items.potions.elixirs.elixiroficytouch.desc=Na inname van dit elixer kan de gebruiker de warmte van aanvallende vijanden onttrekken. Dit effect maakt de gebruiker immuun voor kou en stelt hem in staat vijanden met fysieke aanvallen te bevriezen.
items.potions.elixirs.elixiroficytouch.name=elixer van ijzige aanraking
items.potions.elixirs.elixirofmight$htboost.desc=Je lichaam voelt onnatuurlijk sterk en gezond aan. Je maximale gezondheid wordt gedurende een langere periode verhoogd. Naarmate je levels stijgt, zal de boost geleidelijk afnemen. Huidige boost: 0. Resterende levels: 1.
items.potions.elixirs.elixirofmight$htboost.name=maximale gezondheidsboost
items.potions.elixirs.elixirofmight.desc=Deze krachtige vloeistof stroomt door je spieren, waardoor je kracht permanent met één punt toeneemt en je maximale gezondheid tijdelijk met %d punten stijgt. De gezondheidsboost schaalt mee met je maximale gezondheid, maar neemt langzaam af naarmate je levels stijgt.
items.potions.elixirs.elixirofmight.msg=Een golf van nieuwe kracht stroomt door je lichaam, je hebt nu %d-kracht!
items.potions.elixirs.elixirofmight.name=elixer van macht
items.potions.elixirs.elixiroftoxicessence.desc=Na inname zal dit elixer de drinker giftige energie geven. De drinker zal tijdens het bewegen voortdurend giftig gas verspreiden en zal gedurende een periode die iets langer duurt dan de werkingsduur immuun zijn voor giftig gas en gif.
items.potions.elixirs.elixiroftoxicessence.name=elixer van giftige essentie
items.potions.exotic.exoticpotion.amber=exotische barnsteendrank
items.potions.exotic.exoticpotion.azure=exotische azuurblauwe drank
items.potions.exotic.exoticpotion.bistre=exotische bistre drank
items.potions.exotic.exoticpotion.charcoal=exotische houtskooldrank
items.potions.exotic.exoticpotion.crimson=exotische karmozijnrode drank
items.potions.exotic.exoticpotion.discover_hint=Je kunt dit voorwerp maken via alchemie.
items.potions.exotic.exoticpotion.golden=exotische gouden drank
items.potions.exotic.exoticpotion.indigo=exotische indigo toverdrank
items.potions.exotic.exoticpotion.ivory=exotische ivoor drank
items.potions.exotic.exoticpotion.jade=exotische jade drank
items.potions.exotic.exoticpotion.magenta=exotische magenta toverdrank
items.potions.exotic.exoticpotion.no=Nee, ik ben van gedachten veranderd.
items.potions.exotic.exoticpotion.silver=exotische zilveren drank
items.potions.exotic.exoticpotion.turquoise=exotische turkooizen drank
items.potions.exotic.exoticpotion.unknown_desc=Deze ronde fles bevat een korrelige, kleurrijke vloeistof. Het lijkt wel een vreemde vloeistof voor dit land; wie weet wat er gebeurt als je ervan drinkt of het weggooit?
items.potions.exotic.exoticpotion.warning=Wil je het gebruik van dit drankje echt annuleren? Het wordt toch wel verbruikt.
items.potions.exotic.exoticpotion.yes=Ja, ik ben er zeker van.
items.potions.exotic.potionofcleansing$cleanse.desc=Dit personage is tijdelijk immuun voor alle schadelijke status-effecten!\n\nAantal resterende beurten: %s.
items.potions.exotic.potionofcleansing$cleanse.name=gereinigd
items.potions.exotic.potionofcleansing.desc=Dit krachtige middel maakt de drinker na het drinken enkele beurten immuun voor alle schadelijke status-effecten. Het kan ook naar een doelwit worden gegooid om het te reinigen.
items.potions.exotic.potionofcleansing.name=reinigingsdrank
items.potions.exotic.potionofcorrosivegas.desc=Als je deze fles onder druk openbreekt of verbrijzelt, zal de inhoud exploderen in een dodelijke wolk van corrosief, roestkleurig gas. Dit gas verspreidt zich sneller dan giftig gas en is dodelijker, maar blijft ook minder lang aanwezig.
items.potions.exotic.potionofcorrosivegas.name=drankje van bijtend gas
items.potions.exotic.potionofdivineinspiration.bonus=+2 talentpunten!
items.potions.exotic.potionofdivineinspiration.desc=De kracht van heilige energie, gereduceerd tot vloeibare vorm, zal de drinker goddelijke kracht schenken en hem twee bonuspunten voor talenten in een niveau naar keuze geven.\n\nDeze drank kan slechts eenmaal per talentniveau worden gebruikt.
items.potions.exotic.potionofdivineinspiration.name=elixer van goddelijke inspiratie
items.potions.exotic.potionofdivineinspiration.no_more_points=Je kunt geen bonuspunten voor talenten meer verdienen.
items.potions.exotic.potionofdivineinspiration.select_tier=Kies een talentniveau om twee bonuspunten te verdienen. Je moet het niveau wel hebben vrijgespeeld om de punten te kunnen besteden.
items.potions.exotic.potionofdragonsbreath.desc=Deze fles bevat een ongebruikelijke stof die direct vlam vat zodra deze met speeksel in contact komt. Door de vloeistof snel uit te spugen, kan de gebruiker vlammen uit zijn of haar mond spuwen!
items.potions.exotic.potionofdragonsbreath.name=toverdrank van drakenadem
items.potions.exotic.potionofdragonsbreath.prompt=Kies een locatie om te branden.
items.potions.exotic.potionofearthenarmor.desc=In plaats van te verlammen, heeft deze vloeistof een verhardend effect op de huid, waardoor deze tijdelijk een natuurlijk pantser vormt.
items.potions.exotic.potionofearthenarmor.name=drankje van aarden pantser
items.potions.exotic.potionofmagicalsight.desc=Na het drinken hiervan zullen je zintuigen tijdelijk tot ongelooflijke hoogten worden verscherpt, waardoor je door muren heen kunt kijken in een straal van 12 tegels!
items.potions.exotic.potionofmagicalsight.name=toverdrank van magisch zicht
items.potions.exotic.potionofmastery.armor_easier=Je harnas wordt comfortabeler om te dragen!
items.potions.exotic.potionofmastery.desc=In plaats van brute kracht te verlenen, stemt dit drankje de spieren van de gebruiker af op een specifiek voorwerp. Hierdoor wordt dat voorwerp gemakkelijker te gebruiken, alsof de drinker ermee geoefend heeft en spiergeheugen heeft opgebouwd. Het gekozen wapen of pantser vereist 2 minder kracht om te gebruiken. Dit drankje kan slechts één keer per voorwerp gebruikt worden.
items.potions.exotic.potionofmastery.name=toverdrank van meesterschap
items.potions.exotic.potionofmastery.prompt=Beheers een item
items.potions.exotic.potionofmastery.weapon_easier=Je wapen wordt makkelijker te hanteren!
items.potions.exotic.potionofshielding.desc=In plaats van te genezen, zal dit drankje een duurzaam schild rond het lichaam van de gebruiker projecteren, dat een aanzienlijke hoeveelheid schade blokkeert.
items.potions.exotic.potionofshielding.name=beschermingsdrankje
items.potions.exotic.potionofshroudingfog.desc=Wanneer de vloeistof in deze fles aan de lucht wordt blootgesteld, ontstaat er een dikke, rokerige mist die zich snel verspreidt en het zicht van je vijanden belemmert.
items.potions.exotic.potionofshroudingfog.name=drankje van omhullende mist
items.potions.exotic.potionofsnapfreeze.desc=De chemische stof in dit drankje reageert snel met de lucht, waardoor alles binnen het werkingsgebied onmiddellijk bevriest en vast komt te zitten.
items.potions.exotic.potionofsnapfreeze.name=drankje van snelle bevriezing
items.potions.exotic.potionofstamina.desc=Het drinken van deze merkwaardig zoete vloeistof geeft je een langdurige energieboost, waardoor je gedurende langere tijd in een versneld tempo kunt hardlopen.
items.potions.exotic.potionofstamina.name=uithoudingsvermogendrankje
items.potions.exotic.potionofstormclouds.desc=Door dit drankje te gooien ontstaat een snel om zich heen grijpende wolk van geconcentreerde damp, die condenseert en neerdaalt op de omgeving. Het grootste deel van het terrein verandert in water, vurige vijanden lopen schade op, vuur wordt gedoofd en vallen worden overweldigd en breken.
items.potions.exotic.potionofstormclouds.name=toverdrank van stormwolken
items.potions.potion$placeholder.name=drankje
items.potions.potion$seedtopotion.name=Willekeurig drankje
items.potions.potion.ac_drink=DRINKEN
items.potions.potion.amber=barnsteendrank
items.potions.potion.azure=azuurblauwe drank
items.potions.potion.beneficial=Weldadig drankje
items.potions.potion.bistre=bistre-drankje
items.potions.potion.charcoal=houtskooldrankje
items.potions.potion.crimson=karmozijnrood drankje
items.potions.potion.discover_hint=Je kunt dit voorwerp willekeurig in de kerker vinden, of het via alchemie maken.
items.potions.potion.golden=gouden drankje
items.potions.potion.harmful=Schadelijk drankje!
items.potions.potion.indigo=indigo drankje
items.potions.potion.ivory=ivoor drankje
items.potions.potion.jade=jade drankje
items.potions.potion.magenta=magenta drankje
items.potions.potion.no=Nee, ik ben van gedachten veranderd.
items.potions.potion.shatter=De fles spat uiteen en de vloeistof spat ongevaarlijk in het rond.
items.potions.potion.silver=zilveren drankje
items.potions.potion.sure_drink=Weet je zeker dat je het wilt drinken? In de meeste gevallen kun je zulke drankjes beter naar je vijanden gooien.
items.potions.potion.sure_throw=Weet je zeker dat je het wilt weggooien? In de meeste gevallen is het verstandiger om het op te drinken.
items.potions.potion.turquoise=turkooizen drankje
items.potions.potion.unknown_desc=In dit flesje kolkt een %s vloeistof. Wie weet wat er gebeurt als je die drinkt of het flesje gooit?
items.potions.potion.yes=Ja, ik weet wat ik doe.
items.potions.potionofexperience.desc=De legendarische ervaringen van talloze veldslagen, samengebald in vloeibare vorm, zullen je ervaringsniveau direct verhogen met dit drankje.
items.potions.potionofexperience.name=ervaringsdrankje
items.potions.potionoffrost.desc=In de open lucht verdampt deze stof tot een ijskoude wolk. Elk wezen dat ermee in aanraking komt, bevriest ter plekke en kan niet bewegen of handelen.
items.potions.potionoffrost.name=vorstdrank
items.potions.potionofhaste.desc=Het drinken van deze merkwaardig zoete vloeistof geeft je voor korte tijd enorm veel energie, waardoor je op hoge snelheid kunt rennen.
items.potions.potionofhaste.energetic=Je voelt je energiek!
items.potions.potionofhaste.name=haastdrankje
items.potions.potionofhealing.desc=Een elixer dat onmiddellijk al je gezondheid herstelt en vergiftiging geneest.
items.potions.potionofhealing.heal=Je wonden beginnen te genezen.
items.potions.potionofhealing.name=genezingsdrankje
items.potions.potionofinvisibility.desc=Deze drank maakt je tijdelijk onzichtbaar voor vijanden. Aanvallen, of een toverstaf of boekrol voor hun ogen gebruiken, verbreekt het effect.
items.potions.potionofinvisibility.invisible=Je ziet je handen onzichtbaar worden!
items.potions.potionofinvisibility.name=onzichtbaarheidsdrank
items.potions.potionoflevitation.desc=Deze vreemde vloeistof laat je door de lucht zweven, zodat je moeiteloos over vallen heen glijdt. Vlammen en gassen vullen echter ook de lucht en kun je zo niet ontwijken.
items.potions.potionoflevitation.float=Je zweeft de lucht in!
items.potions.potionoflevitation.name=levitatiedrankje
items.potions.potionofliquidflame.desc=Deze fles bevat een instabiele stof die bij blootstelling aan de open lucht heftig in vlammen zal opgaan.
items.potions.potionofliquidflame.name=drankje van vloeibare vlam
items.potions.potionofmindvision.desc=Na het drinken hiervan zal je geest afgestemd raken op de psychische signalen van verre wezens, waardoor je biologische aanwezigheid door muren heen kunt waarnemen. Deze drank stelt je ook in staat om door nabijgelegen muren en deuren heen te kijken.
items.potions.potionofmindvision.name=drankje van mentale visie
items.potions.potionofmindvision.see_mobs=Je kunt op de een of andere manier de aanwezigheid van de gedachten van andere wezens voelen!
items.potions.potionofmindvision.see_none=Je kunt op de een of andere manier merken dat je op dit moment alleen bent op dit niveau.
items.potions.potionofparalyticgas.desc=Bij blootstelling aan de open lucht zal de vloeistof in deze fles verdampen tot een verdovende gele nevel. Iedereen die de wolk inademt, zal onmiddellijk verlamd raken en zich enige tijd niet kunnen bewegen nadat de wolk is verdwenen. Dit voorwerp kan naar vijanden op afstand worden gegooid om ze in het effect van het gas te vangen.
items.potions.potionofparalyticgas.name=drankje van verlammend gas
items.potions.potionofpurity.desc=Dit middel neutraliseert snel alle schadelijke gassen in het getroffen gebied. Als je het drinkt, ben je tijdelijk immuun voor die gassen.
items.potions.potionofpurity.freshness=Je voelt een ongewone frisheid in de lucht.
items.potions.potionofpurity.name=Zuiveringsdrankje
items.potions.potionofpurity.protected=Je bent omhuld door een beschermende folie!
items.potions.potionofstrength.desc=Deze krachtige vloeistof stroomt door je spieren en verhoogt je kracht permanent met één punt.
items.potions.potionofstrength.msg=Een golf van nieuwe kracht stroomt door je lichaam, je hebt nu %d-kracht!
items.potions.potionofstrength.name=krachtdrank
items.potions.potionoftoxicgas.desc=Als je deze fles onder druk openbreekt of verbrijzelt, zal de inhoud exploderen in een dodelijke wolk giftig groen gas. Je kunt er ook voor kiezen om dit drankje naar vijanden op afstand te gooien in plaats van het met de hand open te breken.
items.potions.potionoftoxicgas.name=drankje van giftig gas
items.quest.ceremonialcandle.desc=Een set kaarsen, gesmolten en door gebruik aan elkaar vastgesmolten.\n\nLos van elkaar zijn ze waardeloos, maar samen met andere kaarsen in een bepaald patroon kunnen ze de energie bundelen voor een oproepingsritueel.
items.quest.ceremonialcandle.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.ceremonialcandle.name=ceremoniële kaars
items.quest.corpsedust.chill=Een rilling loopt over je rug.
items.quest.corpsedust.desc=De bal van lijkstof verschilt uiterlijk niet van een gewone stofbal. Maar je voelt een kwaadaardige energie erin schuilen. Het zou verstandig zijn om er zo snel mogelijk vanaf te komen.
items.quest.corpsedust.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.corpsedust.name=lijkstof
items.quest.darkgold.desc=Dit metaal wordt donker genoemd, niet vanwege de kleur (die verschilt niet van gewoon goud), maar omdat het smelt in daglicht, waardoor het aan de oppervlakte onbruikbaar wordt.
items.quest.darkgold.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.darkgold.name=donker gouderts
items.quest.darkgold.you_now_have=Je hebt nu %d donkergouderts.
items.quest.dwarftoken.desc=Veel dwergen en sommige van hun grotere creaties dragen deze kleine metalen stukjes met zich mee, waarvan het doel onbekend is. Misschien zijn het sieraden, of misschien een soort identiteitsbewijs. Dwergen zijn vreemde wezens.
items.quest.dwarftoken.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.dwarftoken.name=dwergtoken
items.quest.embers.desc=Bijzondere gloeiende kooltjes die alleen van jonge vuurelementalen kunnen worden geoogst. Ze stralen thermische energie uit.
items.quest.embers.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.embers.name=elementaire gloed
items.quest.escapecrystal.ac_use=GEBRUIK
items.quest.escapecrystal.desc=Een dun, magisch spreukkristal dat teleportatiemagie lijkt te bevatten. Je kunt het kristal op elk moment gebruiken om de dwergenkluis te verlaten, maar je kunt niets meenemen!
items.quest.escapecrystal.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.escapecrystal.name=ontsnappingskristal
items.quest.gooblob.desc=Een wiebelende, slijmerige massa, afgesplitst van Goo toen die stierf. Het lijkt bijna op een grote bal gelei, maar je zou het niet durven op te eten. Het doet op zichzelf niets, maar het zou nuttig kunnen zijn in combinatie met bepaalde drankjes of een bom. Het zou in ieder geval een behoorlijke hoeveelheid energie moeten opleveren.
items.quest.gooblob.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.quest.gooblob.name=klodder slijm
items.quest.metalshard.desc=Een scherf verroest, vervloekt metaal, afkomstig van DM-300 toen deze werd vernietigd. Je voelt er een inactieve, kwaadaardige magie in. \n\n Op zichzelf doet het niets, maar het zou nuttig kunnen zijn in combinatie met bepaalde spreuken of een bom. Het zou in ieder geval een behoorlijke hoeveelheid energie moeten opleveren.
items.quest.metalshard.discover_hint=Je kunt dit voorwerp als buit verkrijgen door bepaalde vijanden te verslaan.
items.quest.metalshard.name=vervloekte metalen scherf
items.quest.pickaxe.ability_desc=De Duelist kan een vijand doorboren met een houweel. Dit raakt gegarandeerd, maakt de vijand 3 beurten lang kwetsbaar en brengt _%1$d-%2$d schade_ toe aan vijanden met een stijve huid.
items.quest.pickaxe.ability_name=doorboren
items.quest.pickaxe.desc=Dit is een stevig en zwaar gereedschap om stenen mee te breken. Je hoeft de houweel niet te gebruiken om ermee te mijnen, maar in geval van nood kan hij waarschijnlijk wel als wapen dienen.
items.quest.pickaxe.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
items.quest.pickaxe.name=pikhouweel
items.quest.pickaxe.upgrade_ability_stat_name=Vaardigheidsschade
items.quest.ratskull.desc=Een verrassend grote rattenschedel. Het zou een geweldige jachttrofee zijn, als je tenminste een muur had om hem aan op te hangen.
items.quest.ratskull.name=gigantische rattenschedel
items.remains.bowfragment.desc=Dit gebroken stuk hout was ooit onderdeel van de geestboog van een verloren jageres. Je kunt nog steeds een beetje natuurenergie in het fragment voelen en je kunt het gebruiken om hoog gras om je heen te laten groeien. Houd er wel rekening mee dat het fragment daardoor zal verdwijnen.
items.remains.bowfragment.name=boogfragment
items.remains.brokenhilt.desc=Dit gebroken handvat lijkt afkomstig te zijn van het wapen van een verslagen duellist. Je voelt nog een beetje vechtkracht in het handvat, die je kunt gebruiken om wat extra schade toe te brengen aan je volgende twee mêlee-aanvallen. Houd er wel rekening mee dat het handvat hierdoor kapotgaat.
items.remains.brokenhilt.name=gebroken handvat
items.remains.brokenstaff.desc=Deze tovenaarsstaf is in tweeën gebroken nadat de eigenaar om het leven kwam. Je voelt nog steeds wat magische energie in de staf, die je kunt gebruiken om je toverstokken een kleine boost te geven. Als je dit doet, wordt de staf echter vernietigd.
items.remains.brokenstaff.name=gebroken personeel
items.remains.cloakscrap.desc=Dit stukje doorschijnende stof lijkt afkomstig te zijn van de schaduwmantel van een overleden schurk. Je voelt er nog een beetje mystieke energie in, die je kunt gebruiken om je artefacten een kleine energieboost te geven. Houd er wel rekening mee dat de stof hierdoor beschadigd raakt.
items.remains.cloakscrap.name=lapje stof
items.remains.remainsitem.ac_use=GEBRUIK
items.remains.remainsitem.discover_hint=Je kunt dit voorwerp vinden in de overblijfselen van een specifieke held uit een eerdere verloren speelsessie.
items.remains.sealshard.desc=Deze kleine scherven rode was lijken afkomstig te zijn van het zegel van een gevallen krijger. Je voelt nog een beetje wilskracht aan het zegel kleven, die je kunt gebruiken om jezelf een beetje te beschermen. Houd er wel rekening mee dat de scherven dan zullen verdwijnen.
items.remains.sealshard.name=zegelfragmenten
items.remains.tornpage.desc=Deze pagina ziet eruit alsof hij uit een oud heilig boek van een geestelijke is gescheurd. Er kleeft nog een beetje goddelijke energie aan, die je kunt gebruiken om een klein beetje levensenergie terug te winnen. Houd er wel rekening mee dat de gescheurde pagina hierdoor vernietigd wordt.
items.remains.tornpage.name=gescheurde pagina
items.rings.ring.agate=agaat ring
items.rings.ring.amethyst=amethist ring
items.rings.ring.curse_known=Je voelt de kwaadaardige magie die in deze ring schuilt.
items.rings.ring.cursed_worn=Omdat deze ring vervloekt is, ben je machteloos om hem te verwijderen.
items.rings.ring.diamond=diamanten ring
items.rings.ring.emerald=smaragd ring
items.rings.ring.equip_cursed=De ring trekt pijnlijk strak om je vinger!
items.rings.ring.garnet=granaat ring
items.rings.ring.identify=Je kent je ring nu voldoende om hem te herkennen.
items.rings.ring.known=Dit is een %s
items.rings.ring.not_cursed=Deze ring is vrij van kwaadaardige magie.
items.rings.ring.onyx=onyx ring
items.rings.ring.opal=opalen ring
items.rings.ring.quartz=kwartsring
