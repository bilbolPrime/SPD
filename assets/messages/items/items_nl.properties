items.artifacts.driedrose.cursed=Je kunt geen vervloekte roos gebruiken.
items.artifacts.driedrose.desc=Is dit de roos waar de geest het over had voordat hij verdween? Hij lijkt een soort spirituele kracht te bezitten, misschien kan hij gebruikt worden om de energie van die verloren krijger te kanaliseren.
items.artifacts.driedrose.desc_armor=Ghost's pantser: %s
items.artifacts.driedrose.desc_cursed=De vervloekte roos zit vast aan je hand, hij voelt griezelig koud aan.
items.artifacts.driedrose.desc_hint=Het lijkt erop dat er enkele blaadjes ontbreken. Misschien dat het terugplaatsen ervan de roos sterker maakt.
items.artifacts.driedrose.desc_no_quest=Een gedroogde, oude roos die ondanks haar leeftijd op de een of andere manier nog steeds intact is.\n\nHet lijkt een soort spirituele kracht te bezitten, maar je hebt geen idee hoe je die nu moet gebruiken.
