items.potions.potion.no=No, ho cambiato idea.
items.potions.potion.shatter=La fiaschetta si frantuma e il liquido schizza innocuamente.
items.potions.potion.silver=pozione d'argento
items.potions.potion.sure_drink=Sei sicuro di volerlo bere? Nella maggior parte dei casi, dovresti lanciare queste pozioni contro i tuoi nemici.
items.potions.potion.sure_throw=Sei sicuro di volerlo buttare? Nella maggior parte dei casi, conviene berlo.
items.potions.potion.turquoise=pozione turchese
items.potions.potion.unknown_desc=Questa boccetta contiene un liquido %s che vortica al suo interno. Chissà cosa accadrà bevendolo o lanciando la boccetta.
items.potions.potion.yes=Sì, so cosa sto facendo
items.potions.potionofexperience.desc=Le epiche esperienze di innumerevoli battaglie ridotte in forma liquida: questa pozione aumenterà istantaneamente il tuo livello di esperienza.
items.potions.potionofexperience.name=pozione di esperienza
items.potions.potionoffrost.desc=A contatto con l'aria, questa sostanza evapora in una nube gelida. Ogni creatura che la tocca viene congelata sul posto, incapace di muoversi o agire.
items.potions.potionoffrost.name=pozione di gelo
items.potions.potionofhaste.desc=Bere questo liquido stranamente dolce ti infonderà un'energia straordinaria per un breve periodo, permettendoti di correre ad alta velocità.
items.potions.potionofhaste.energetic=Ti senti pieno di energia!
items.potions.potionofhaste.name=pozione della velocità
items.potions.potionofhealing.desc=Un elisir che ripristina istantaneamente tutta la salute e cura l'avvelenamento.
items.potions.potionofhealing.heal=Le tue ferite cominciano a rimarginarsi.
items.potions.potionofhealing.name=pozione curativa
items.potions.potionofinvisibility.desc=Bere questa pozione ti rende temporaneamente invisibile ai nemici. Attaccare, oppure usare una bacchetta o una pergamena sotto i loro occhi, dissolve l'effetto.
items.potions.potionofinvisibility.invisible=Vedrete le vostre mani diventare invisibili!
items.potions.potionofinvisibility.name=pozione dell'invisibilità
items.potions.potionoflevitation.desc=Questo curioso liquido ti fa fluttuare nell'aria e superare le trappole senza sforzo. Fiamme e gas, però, riempiono anche l'aria: volare non permette di evitarli.
items.potions.potionoflevitation.float=Fluttui nell'aria!
items.potions.potionoflevitation.name=pozione di levitazione
items.potions.potionofliquidflame.desc=Questa fiaschetta contiene un composto instabile che prenderà fuoco violentemente se esposto all'aria aperta.
items.potions.potionofliquidflame.name=pozione di fiamma liquida
items.potions.potionofmindvision.desc=Dopo aver bevuto questa pozione, la tua mente si sintonizzerà sulla firma psichica di creature lontane, permettendoti di percepire presenze biologiche attraverso i muri. Inoltre, questa pozione ti consentirà di vedere attraverso muri e porte vicini.
items.potions.potionofmindvision.name=pozione della visione mentale
items.potions.potionofmindvision.see_mobs=In qualche modo si può percepire la presenza delle menti di altre creature!
items.potions.potionofmindvision.see_none=In qualche modo si percepisce che in questo momento sei solo a questo livello.
items.potions.potionofparalyticgas.desc=A contatto con l'aria aperta, il liquido contenuto in questa fiaschetta vaporizzerà trasformandosi in una nebbia giallastra e paralizzante. Chiunque inali la nube rimarrà paralizzato all'istante, incapace di muoversi per un certo periodo di tempo dopo la sua dissipazione. Questo oggetto può essere lanciato contro nemici distanti per intrappolarli nell'effetto del gas.
items.potions.potionofparalyticgas.name=pozione di gas paralizzante
items.potions.potionofpurity.desc=Questo reagente neutralizza rapidamente tutti i gas nocivi nell'area colpita. Berlo ti rende temporaneamente immune a quei gas.
items.potions.potionofpurity.freshness=Nell'aria si percepisce una freschezza insolita.
items.potions.potionofpurity.name=Pozione di purificazione
items.potions.potionofpurity.protected=Una pellicola protettiva ti avvolge!
items.potions.potionofstrength.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando permanentemente la tua forza di un punto.
items.potions.potionofstrength.msg=Una forza rinnovata pervade il tuo corpo, ora possiedi la forza %d!
items.potions.potionofstrength.name=pozione di forza
items.potions.potionoftoxicgas.desc=Stappando o rompendo questo flacone di vetro pressurizzato, il suo contenuto esploderà in una nube letale di gas verde tossico. Potresti scegliere di lanciare questa pozione contro nemici lontani invece di stapparla a mano.
items.potions.potionoftoxicgas.name=pozione di gas tossico
items.quest.ceremonialcandle.desc=Un set di candele, fuse e unite insieme attraverso l'uso. Da sole non valgono nulla, ma usate con altre candele in uno schema, possono concentrare l'energia per un rituale di evocazione.
items.quest.ceremonialcandle.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.ceremonialcandle.name=candela cerimoniale
items.quest.corpsedust.chill=Un brivido ti percorre la schiena.
items.quest.corpsedust.desc=La palla di polvere cadaverica non differisce esteriormente da una normale palla di polvere. Ma puoi sentire un'energia malevola che si annida al suo interno.\n\nSbarazzarsene il prima possibile sarebbe una buona idea.
items.quest.corpsedust.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.corpsedust.name=polvere di cadavere
items.quest.darkgold.desc=Questo metallo viene chiamato scuro non per il suo colore (che non differisce dall'oro normale), ma perché si fonde alla luce del giorno, diventando inutilizzabile in superficie.
items.quest.darkgold.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.darkgold.name=minerale d'oro scuro
items.quest.darkgold.you_now_have=Ora possiedi il minerale d'oro scuro %d.
items.quest.dwarftoken.desc=Molti nani e alcune delle loro creazioni più grandi portano con sé questi piccoli pezzi di metallo dallo scopo ignoto. Forse sono gioielli o forse una sorta di documento d'identità. I nani sono gente strana.
items.quest.dwarftoken.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.dwarftoken.name=segnalino nano
items.quest.embers.desc=Braci speciali che possono essere raccolte solo da giovani elementali del fuoco. Esse irradiano energia termica.
items.quest.embers.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.embers.name=braci elementari
items.quest.escapecrystal.ac_use=UTILIZZO
items.quest.escapecrystal.desc=Un sottile cristallo magico che sembra contenere la magia del teletrasporto. Puoi usare il cristallo in qualsiasi momento per uscire dalla cripta nanica, ma non potrai portare nulla con te!
items.quest.escapecrystal.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.escapecrystal.name=file di escape
items.quest.gooblob.desc=Una massa gelatinosa e tremolante, staccatasi da Goo mentre moriva. È quasi come una grossa palla di gelatina, anche se non oseresti mangiarla.\n\nNon fa nulla da sola, ma potrebbe essere utile se combinata con certe pozioni o una bomba. Come minimo dovrebbe convertirsi in una discreta quantità di energia.
items.quest.gooblob.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.quest.gooblob.name=una massa gelatinosa
items.quest.metalshard.desc=Un frammento di metallo arrugginito e maledetto, staccatosi dal DM-300 durante la sua distruzione. Al suo interno si percepisce una magia malevola inattiva. Da solo non ha alcuna utilità, ma potrebbe essere utile se combinato con certe pergamene o una bomba. Come minimo, dovrebbe convertirsi in una discreta quantità di energia.
items.quest.metalshard.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.quest.metalshard.name=scheggia di metallo maledetta
items.quest.pickaxe.ability_desc=Il Duellante può _perforare_ un nemico con un piccone. Questo colpo è garantito, applica vulnerabilità per 3 turni e infligge _%1$d-%2$d danni_ ai nemici con pelle rigida.
items.quest.pickaxe.ability_name=forare
items.quest.pickaxe.desc=Si tratta di uno strumento robusto e pesante per rompere le rocce. Non è necessario equipaggiare il piccone per usarlo per estrarre minerali, ma all'occorrenza può essere utilizzato come arma.
items.quest.pickaxe.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
items.quest.pickaxe.name=piccone
items.quest.pickaxe.upgrade_ability_stat_name=Danno alle capacità
items.quest.ratskull.desc=Un cranio di ratto sorprendentemente grande. Sarebbe un ottimo trofeo di caccia, se solo si avesse una parete su cui appenderlo.
items.quest.ratskull.name=teschio di ratto gigante
items.remains.bowfragment.desc=Questo frammento di legno spezzato faceva un tempo parte dell'arco spirituale di una cacciatrice perduta. Puoi ancora percepire un po' di energia naturale nel frammento e usarlo per far crescere dell'erba alta intorno a te. Tuttavia, così facendo, il frammento verrà distrutto.
items.remains.bowfragment.name=frammento di arco
items.remains.brokenhilt.desc=Quest'elsa rotta sembra appartenere all'arma di un duellante sconfitto. Puoi ancora percepire un po' di potere marziale al suo interno, che puoi usare per ottenere un piccolo bonus di danno sui tuoi prossimi due colpi in mischia. Tuttavia, così facendo, l'elsa andrà distrutta.
items.remains.brokenhilt.name=impugnatura rotta
items.remains.brokenstaff.desc=Il bastone di questo mago si è spezzato a metà dopo la morte del suo proprietario. Puoi ancora percepire una certa energia magica al suo interno, che puoi utilizzare per dare una piccola spinta di carica alle tue bacchette. Tuttavia, così facendo, il bastone andrà distrutto.
items.remains.brokenstaff.name=bastone rotto
items.remains.cloakscrap.desc=Questo frammento di tessuto traslucido sembra provenire dal mantello delle ombre di un Ladro deceduto. Puoi ancora percepire un po' di energia mistica al suo interno, puoi usarla per dare una piccola carica extra ai tuoi artefatti. Tuttavia, così facendo, il tessuto si distruggerà.
items.remains.cloakscrap.name=pezzo di stoffa
items.remains.remainsitem.ac_use=UTILIZZO
items.remains.remainsitem.discover_hint=Puoi trovare questo oggetto tra i resti di uno specifico eroe di una precedente partita perduta.
items.remains.sealshard.desc=Questi minuscoli frammenti di cera rossa sembrano provenire dal sigillo di un guerriero caduto. Puoi ancora percepire un po' di forza di volontà aggrappata al sigillo, puoi usarla per crearti un po' di protezione. Tuttavia, così facendo distruggerai i frammenti del sigillo.
items.remains.sealshard.name=frammenti di sigillo
items.remains.tornpage.desc=Questa pagina sembra essere stata strappata dal tomo sacro di un chierico defunto. C'è ancora un po' di energia divina attaccata ad essa, puoi usarla per recuperare un po' di salute. Tuttavia, così facendo distruggerai la pagina strappata.
items.remains.tornpage.name=pagina strappata
items.rings.ring.agate=anello in agata
items.rings.ring.amethyst=anello con ametista
items.rings.ring.curse_known=Si può percepire una magia malevola che si annida all'interno di questo anello.
items.rings.ring.cursed_worn=Poiché questo anello è maledetto, non hai il potere di toglierlo.
