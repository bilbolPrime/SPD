items.armor.classarmor.transfer_complete=Le proprietà della tua armatura eroica sono state trasferite!
items.armor.classarmor.transfer_desc=La magia della corona del re dei nani può essere trasferita a un'altra armatura. Tieni presente che l'armatura originale verrà distrutta durante il processo.
items.armor.classarmor.transfer_prompt=Seleziona un'armatura
