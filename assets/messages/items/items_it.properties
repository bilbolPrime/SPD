items.weapon.melee.quarterstaff$defensivestance.desc=La Duellante sta usando il suo bastone per deviare i colpi e i proiettili in arrivo. Finché rimane in questa posizione, la sua elusione contro tutti gli attacchi è triplicata.\n\nTurni rimanenti: %s.
