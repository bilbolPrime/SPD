items.weapon.melee.dagger.ability_desc=Il Duellante può _muoversi furtivamente_ mentre impugna un pugnale. Questa abilità permette al Duellante di teletrasportarsi istantaneamente fino a 5 caselle di distanza e gli garantisce _%d turni di invisibilità._
