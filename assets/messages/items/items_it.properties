items.weapon.melee.dirk.ability_desc=Il Duellante può _muoversi furtivamente_ mentre impugna un pugnale. Questa abilità permette al Duellante di teletrasportarsi istantaneamente fino a 4 caselle di distanza e gli garantisce _%d turni di invisibilità._
items.weapon.melee.dirk.ability_name=furtivo
items.weapon.melee.dirk.desc=Un pugnale da affondo più lungo offre un po' più di acciaio da affondare nei nemici.
