items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento della precisione
items.rings.ringofarcana.combined_stats=I tuoi anelli equipaggiati stanno combinando la loro potenza, aumentando la potenza degli incantesimi e dei glifi di _%s%%_ in totale.
items.rings.ringofarcana.desc=Questo anello potenzia gli incantesimi magici sulle armi e i glifi sulle armature, incluse le maledizioni! Inizialmente aumenta la probabilità di attivazione, e una volta raggiunta tale soglia, ne potenzia l'effetto. Un anello maledetto, invece, indebolirà incantesimi, glifi e maledizioni.
items.rings.ringofarcana.name=anello degli arcani
items.rings.ringofarcana.stats=Quando indossato, questo anello aumenterà il potere degli incantesimi e dei glifi di _%s%%._
items.rings.ringofarcana.typical_stats=Quando indossato, questo anello aumenterà in genere il potere degli incantesimi e dei glifi di _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Potenziamento Arcana
items.rings.ringofelements.combined_stats=I tuoi anelli equipaggiati combinano la loro potenza, fornendo una resistenza elementale totale pari a _%s%%_.
items.rings.ringofelements.desc=Questo anello protegge da diversi elementi, come fuoco, elettricità e gas. Riduce anche la durata degli effetti negativi.
items.rings.ringofelements.name=anello degli elementi
items.rings.ringofelements.stats=Quando indossato, questo anello fornirà una resistenza elementale _%s%%_.
items.rings.ringofelements.typical_stats=Quando indossato, questo anello fornirà in genere una resistenza elementale _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Resistenza
items.rings.ringofenergy.combined_stats=Gli anelli equipaggiati combinano la loro potenza, aumentando la velocità di ricarica di _%s%%_ in totale.
items.rings.ringofenergy.desc=Il tuo equipaggiamento magico si ricaricherà più velocemente nel campo arcano che si irradia da questo anello. Un anello maledetto, invece, rallenterà la ricarica.
items.rings.ringofenergy.name=anello di energia
items.rings.ringofenergy.stats=Quando indossato, questo anello aumenterà la velocità di carica di bacchette, artefatti e armature eroiche di _%s%%._
items.rings.ringofenergy.typical_stats=Quando indossato, questo anello aumenterà in genere la velocità di carica di bacchette, artefatti e armature eroiche di _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Aumento di carica
items.rings.ringofevasion.combined_stats=I tuoi anelli equipaggiati combinano la loro potenza, aumentando la tua elusione di _%s%%_ in totale.
items.rings.ringofevasion.desc=Questo anello aumenta le tue probabilità di schivare gli attacchi nemici.
items.rings.ringofevasion.name=anello di evasione
items.rings.ringofevasion.stats=Quando indossato, questo anello aumenterà la tua elusione di _%s%%._
items.rings.ringofevasion.typical_stats=Quando indossato, questo anello aumenterà in genere la tua elusione di _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Aumento dell'evasione
items.rings.ringofforce$brawlersstance.desc=In questa posizione, gli attacchi normali del Duellante utilizzeranno un anello di forza equipaggiato, anche se ha un'arma equipaggiata. Questi attacchi ottengono danni bonus e utilizzeranno comunque il potenziamento e l'incantamento dell'arma. Mantenere questa posizione richiede concentrazione, riducendo la velocità di ricarica delle abilità dell'arma del 50%. Questa posizione può essere attivata o disattivata utilizzando un anello di forza, ma la riduzione della velocità di ricarica persisterà per un po' se la posizione viene attivata e disattivata rapidamente.
items.rings.ringofforce$brawlersstance.name=posizione del lottatore
items.rings.ringofforce.ability_desc=Il Duellante può assumere una posizione da lottatore con questo anello, facendo sì che i suoi attacchi normali utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi infliggeranno _%1$d-%2$d danni_ e erediteranno anche l'incantamento e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.rings.ringofforce.ability_name=posizione del lottatore
items.rings.ringofforce.combined_stats=I tuoi anelli equipaggiati combinano la loro potenza, infliggendo un totale di _%1$d-%2$d danni_ senza un'arma, oppure aumentando i danni di _%3$d_ con un'arma.
items.rings.ringofforce.desc=Questo anello potenzia la forza dei colpi in mischia di chi lo indossa. Questo bonus di potenza è piuttosto debole quando si impugnano armi, ma un attacco a mani nude risulterà molto più efficace. Un anello maledetto, invece, indebolirà i colpi di chi lo indossa.
items.rings.ringofforce.name=anello di forza
items.rings.ringofforce.stats=Senza armi, con la tua forza attuale, questo anello infliggerà _%1$d-%2$d danni._ Con un'arma equipaggiata, questo anello aumenterà i danni di _%3$d._
items.rings.ringofforce.typical_ability_desc=Il Duellante può assumere una posizione da lottatore con questo anello, facendo sì che i suoi attacchi normali utilizzino sempre questo anello anche con un'arma equipaggiata. Questi attacchi infliggeranno in genere _%1$d-%2$d danni_ e erediteranno anche l'incantamento e il potenziamento dell'arma. Questa posizione rallenta la velocità di ricarica dell'arma di 50%%.
items.rings.ringofforce.typical_stats=Quando sei disarmato, con la tua forza attuale, in genere questo anello infliggerà _%1$d-%2$d danni._ Con un'arma equipaggiata, in genere questo anello aumenterà i danni di _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Danni non armati
items.rings.ringofforce.upgrade_stat_name_2=Aumento del danno armato
items.rings.ringofforce.upgrade_stat_name_3=Danno alle capacità
items.rings.ringoffuror.combined_stats=Gli anelli che indossi uniscono le loro forze, aumentando la velocità dei tuoi attacchi di _%s%%_ in totale.
items.rings.ringoffuror.desc=Questo anello conferisce a chi lo indossa una furia interiore, permettendogli di attaccare più rapidamente. Un anello maledetto, al contrario, rallenterà la velocità d'attacco di chi lo indossa.
items.rings.ringoffuror.name=anello di furore
items.rings.ringoffuror.stats=Quando indossato, questo anello aumenterà la velocità dei tuoi attacchi di _%s%%._
items.rings.ringoffuror.typical_stats=Quando indossato, questo anello aumenterà in genere la velocità dei tuoi attacchi di _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Aumento della velocità d'attacco
items.rings.ringofhaste.combined_stats=Gli anelli che indossi uniscono le loro forze, aumentando la tua velocità di movimento di _%s%%_ in totale.
items.rings.ringofhaste.desc=Questo anello accelera lo scorrere del tempo per chi lo indossa, permettendogli di compiere tutte le azioni un po' più in fretta.
items.rings.ringofhaste.name=anello della fretta
items.rings.ringofhaste.stats=Quando indossato, questo anello aumenterà la tua velocità di movimento di _%s%%._
items.rings.ringofhaste.typical_stats=Quando indossato, questo anello aumenterà in genere la tua velocità di movimento di _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Aumento della velocità di movimento
items.rings.ringofmight.combined_stats=Gli anelli che indossi uniscono i loro poteri, aumentando la tua forza di _%1$d_ e i tuoi HP massimi di _%2$s%%_ in totale.
items.rings.ringofmight.desc=Questo anello potenzia le doti fisiche di chi lo indossa, conferendogli maggiore forza e robustezza. Un anello maledetto, al contrario, indebolirà chi lo porta.
items.rings.ringofmight.name=anello di potere
items.rings.ringofmight.stats=Quando indossato, questo anello aumenterà la tua forza di _%1$d_ e i tuoi HP massimi di _%2$s%%._
items.rings.ringofmight.typical_stats=Quando indossato, questo anello aumenterà in genere la tua forza di _%1$d_ e i tuoi HP massimi di _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=aumento di forza
items.rings.ringofmight.upgrade_stat_name_2=Massima potenza di calcolo
items.rings.ringofsharpshooting.combined_stats=I tuoi anelli equipaggiati combinano la loro potenza, aumentando il livello effettivo delle armi da lancio di _%1$d_ e incrementandone la durabilità di _%2$s%%_ in totale.
items.rings.ringofsharpshooting.desc=Questo anello migliora la precisione e la mira di chi lo indossa, rendendo tutte le armi da lancio più efficaci e resistenti. Un anello maledetto avrà l'effetto opposto.
items.rings.ringofsharpshooting.name=anello di tiratori scelti
items.rings.ringofsharpshooting.stats=Quando indossato, questo anello aumenterà il danno delle tue armi da lancio come se il loro livello fosse aumentato di _%1$d_ e ne aumenterà la durabilità di _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Quando indossato, questo anello aumenterà in genere il danno delle tue armi da lancio come se il loro livello fosse aumentato di _%1$d_ e ne aumenterà la durabilità di _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento del danno di livello
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento della durabilità
items.rings.ringoftenacity.combined_stats=Gli anelli che indossi uniscono le loro forze, riducendo il danno subito fino a un totale di _%s%%_.
items.rings.ringoftenacity.desc=Indossato, questo anello conferirà a chi lo porta la capacità di resistere a colpi normalmente mortali. Più grave è la ferita di chi lo indossa, maggiore sarà la sua resistenza. Un anello maledetto, al contrario, renderà più facile per i nemici giustiziare chi lo porta.
items.rings.ringoftenacity.name=anello della tenacia
items.rings.ringoftenacity.stats=Quando indossato, questo anello ridurrà i danni subiti fino a _%s%%._
items.rings.ringoftenacity.typical_stats=Quando indossato, questo anello ridurrà in genere i danni subiti fino a _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Resistenza massima ai danni
items.rings.ringofwealth.combined_stats=I tuoi anelli equipaggiati stanno combinando la loro potenza, aumentando la tua fortuna di _%s%%_ in totale.
items.rings.ringofwealth.desc=Questo anello agisce come una calamita per i tesori, aumentando la probabilità che nemici e contenitori contengano oggetti di valore. Un anello maledetto, invece, ridurrà le tue possibilità di ottenere bottino.
items.rings.ringofwealth.name=anello di ricchezza
items.rings.ringofwealth.stats=Quando indossato, questo anello aumenterà la tua fortuna di _%s%%._
items.rings.ringofwealth.typical_stats=Quando indossato, questo anello in genere aumenterà la tua fortuna di _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Aumento della fortuna
items.scrolls.exotic.exoticscroll.berkanan=pergamena esotica di BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.scrolls.exotic.exoticscroll.gyfu=pergamena esotica di GYFU
items.scrolls.exotic.exoticscroll.isaz=pergamena esotica di ISAZ
items.scrolls.exotic.exoticscroll.kaunan=pergamena esotica di KAUNAN
items.scrolls.exotic.exoticscroll.laguz=pergamena esotica di LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=pergamena esotica di MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=pergamena esotica di Naudiz
items.scrolls.exotic.exoticscroll.odal=pergamena esotica di ODA
items.scrolls.exotic.exoticscroll.raido=pergamena esotica di RAIDO
items.scrolls.exotic.exoticscroll.sowilo=pergamena esotica di SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=pergamena esotica di TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Su questa pergamena nera è incisa una runa magica, luminosa e indecifrabile. Sembra essere estranea a questa terra, chissà cosa succederà se verrà letta ad alta voce?
items.scrolls.exotic.exoticscroll.yngvi=pergamena esotica di YNGVI
items.scrolls.exotic.scrollofantimagic.desc=L'incantesimo su questa pergamena ti avvolgerà in un'aura magica che bloccherà temporaneamente tutti gli effetti magici, sia benefici che dannosi. Ciò include la maggior parte degli effetti degli oggetti magici come bacchette, pergamene, anelli, artefatti, incantesimi e maledizioni. Le abilità dell'armatura eroica, tuttavia, sono sufficientemente potenti da funzionare comunque.
items.scrolls.exotic.scrollofantimagic.name=pergamena anti-magia
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Attorno a te è apparsa un'arena magica, indicata da una nebbia rossa ondeggiante. Mentre ti trovi nella nebbia, la tua fame non aumenterà e subirai 33%% danni in meno da tutte le fonti. Se disponi di altre fonti di riduzione del danno (come l'armatura), queste si applicheranno dopo la riduzione di 33%%. Turni rimanenti: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena delle sfide
items.scrolls.exotic.scrollofchallenge.desc=Quando viene letto ad alta voce, questo rotolo scatenerà un grande ruggito che attirerà i nemici verso chi lo legge, creando contemporaneamente una piccola arena intorno a lui. Finché chi lo legge rimarrà in quest'arena, subirà il 33% di danni in meno da tutte le fonti (questo effetto viene applicato prima di altre forme di riduzione del danno) e non perderà la sazietà. Le dimensioni dell'arena varieranno in base alle dimensioni dell'area in cui si trova chi la legge. Sarà particolarmente piccola in alcune aree dei boss.
items.scrolls.exotic.scrollofchallenge.name=pergamena della sfida
items.scrolls.exotic.scrollofdivination$wnddivination.desc=La tua pergamena di divinazione ha identificato i seguenti elementi:
items.scrolls.exotic.scrollofdivination.desc=Questa pergamena identificherà casualmente quattro tipi di oggetti che al momento non conosci. I tipi identificati possono essere il colore di una pozione, la runa di una pergamena o la gemma di un anello. Gli oggetti identificati non saranno necessariamente quelli che stai portando con te.
items.scrolls.exotic.scrollofdivination.name=pergamena di divinazione
items.scrolls.exotic.scrollofdivination.nothing_left=Non c'è più nulla da identificare!
items.scrolls.exotic.scrollofdread.desc=Quando viene letta, questa pergamena emetterà un lampo di luce rossa che infonderà un terrore incredibile in tutti i nemici nel tuo campo visivo. L'effetto è così potente che cercheranno rapidamente di fuggire dall'intero dungeon, per non essere mai più visti! Proprio come con il terrore, questo effetto può svanire col tempo o se il nemico viene attaccato. I nemici dalla forte volontà, come i boss, saranno invece colpiti dal terrore normale.
items.scrolls.exotic.scrollofdread.name=pergamena del terrore
items.scrolls.exotic.scrollofenchantment.armor=Seleziona un glifo da applicare alla tua armatura.
items.scrolls.exotic.scrollofenchantment.cancel=cancellare
items.scrolls.exotic.scrollofenchantment.cancel_warn=Annullando l'operazione, consumerai comunque la tua pergamena di incantesimo, ne sei sicuro?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, ho cambiato idea.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sì, ne sono sicuro
items.scrolls.exotic.scrollofenchantment.desc=Questa pergamena infonderà un'arma o un'armatura di potente energia magica. Chi la legge avrà persino un certo grado di controllo sul tipo di magia che verrà infusa.
items.scrolls.exotic.scrollofenchantment.inv_title=Incanta un oggetto
items.scrolls.exotic.scrollofenchantment.name=pergamena dell'incantesimo
items.scrolls.exotic.scrollofenchantment.weapon=Seleziona un incantesimo da applicare alla tua arma.
items.scrolls.exotic.scrollofforesight.desc=Dopo aver letto questa pergamena, i dettagli del terreno circostante verranno costantemente impressi nella mente del lettore con una chiarezza cristallina. Questo effetto durerà per un periodo di tempo considerevole e rivelerà tutte le porte o trappole nascoste, rendendo superflua la ricerca.
items.scrolls.exotic.scrollofforesight.name=pergamena della preveggenza
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Annullando l'operazione, consumerai comunque la tua pergamena della metamorfosi, ne sei sicuro?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Scegli un talento da trasformare.
items.scrolls.exotic.scrollofmetamorphosis.desc=Questa pergamena contiene una potente magia di trasmutazione, che si applicherà all'incantatore invece che a un oggetto. La magia di questa pergamena ti permetterà di selezionare un talento e sostituirlo con uno dei cinque talenti dello stesso livello di diverse classi di eroi!\n\nQuesto effetto può essere applicato solo ai talenti di classe, non ai talenti ottenuti dalle sottoclassi o dalle abilità dell'armatura. I talenti che non puoi utilizzare non saranno offerti come opzioni.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento metamorfosante
items.scrolls.exotic.scrollofmetamorphosis.name=rotolo della metamorfosi
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Scegli un nuovo talento con cui sostituire il tuo talento trasformato.
items.scrolls.exotic.scrollofmysticalenergy.desc=La pura energia magica racchiusa in questa pergamena, una volta liberata, caricherà nel tempo gli artefatti equipaggiati da chi la utilizza.
items.scrolls.exotic.scrollofmysticalenergy.name=pergamena di energia mistica
items.scrolls.exotic.scrollofpassage.desc=L'incantesimo su questa pergamena teletrasporta istantaneamente chi la legge al primo piano della regione più vicina. Molto utile per raggiungere rapidamente un negozio.
items.scrolls.exotic.scrollofpassage.name=rotolo di passaggio
items.scrolls.exotic.scrollofprismaticimage.desc=L'incantesimo su questa pergamena creerà un gemello illusorio colorato del lettore. Questa immagine prismatica agisce come un clone più debole del lettore, con una difesa simile ma meno punti vita e danni. L'immagine prismatica si mostrerà quando sono presenti nemici e tenterà di difendere il lettore. Se esiste già un'immagine prismatica, l'utilizzo di questa pergamena la curerà completamente.
items.scrolls.exotic.scrollofprismaticimage.name=rotolo di immagine prismatica
items.scrolls.exotic.scrollofpsionicblast.desc=Questa pergamena contiene un'incredibile energia distruttiva che può essere incanalata per distruggere le menti di tutte le creature visibili.\n\nTuttavia, si verifica un significativo effetto di feedback e anche il lettore subirà danni, verrà accecato e indebolito. Più bersagli colpisce la pergamena, minore sarà il danno autoinflitto.
items.scrolls.exotic.scrollofpsionicblast.name=pergamena dell'esplosione psionica
items.scrolls.exotic.scrollofpsionicblast.ondeath=L'esplosione psionica ti fa a pezzi la mente...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Questa creatura è stata stregata dalla magia di una pergamena del canto delle sirene.\n\nUn personaggio stregato è permanentemente tuo alleato e combatterà qualsiasi nemico incontri.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=affascinato
items.scrolls.exotic.scrollofsirenssong.cancel=Devi scegliere un bersaglio.
items.scrolls.exotic.scrollofsirenssong.desc=Leggendo questa pergamena si sprigiona una melodia ammaliante che incanterà un nemico bersaglio, trasformandolo permanentemente in un alleato! Gli altri nemici che la ascoltano saranno temporaneamente ammaliati. I nemici particolarmente forti possono resistere all'effetto ammaliante e saranno invece ammaliati.
items.scrolls.exotic.scrollofsirenssong.name=rotolo del canto della sirena
items.scrolls.exotic.scrollofsirenssong.no_target=La pergamena si attiva senza bersaglio.
items.scrolls.exotic.scrollofsirenssong.prompt=Scegli un obiettivo
items.scrolls.inventoryscroll.no=No, ho cambiato idea.
items.scrolls.inventoryscroll.warning=Vuoi davvero annullare l'utilizzo di questa pergamena? La pergamena non era stata precedentemente identificata, quindi verrà comunque consumata.
items.scrolls.inventoryscroll.yes=Sì, ne sono certo
items.scrolls.scroll$placeholder.name=pergamena
items.scrolls.scroll.ac_read=LEGGERE
items.scrolls.scroll.berkanan=rotolo di BERKANAN
items.scrolls.scroll.blinded=Non puoi leggere una pergamena se sei cieco.
items.scrolls.scroll.cursed=Il tuo libro degli incantesimi maledetto ti impedisce di invocare la magia di questa pergamena! Una pergamena di rimozione della maledizione potrebbe però essere abbastanza potente da funzionare...
items.scrolls.scroll.gyfu=rotolo di GYFU
items.scrolls.scroll.isaz=rotolo dell'ISAZ
items.scrolls.scroll.kaunan=rotolo di KAUNAN
items.scrolls.scroll.laguz=pergamena di LAGUZ
items.scrolls.scroll.mannaz=pergamena di MANNAZ
items.scrolls.scroll.naudiz=pergamena di Naudiz
items.scrolls.scroll.no_magic=Non puoi leggere una pergamena se sei immune alla magia.
items.scrolls.scroll.odal=rotolo di ODA
items.scrolls.scroll.raido=rotolo di RAIDO
items.scrolls.scroll.sowilo=rotolo di SOWILO
items.scrolls.scroll.tiwaz=rotolo di TIWAZ
items.scrolls.scroll.unknown_desc=Questa pergamena è coperta di scritte indecifrabili e porta la runa %s come titolo. Chissà cosa accadrà leggendola ad alta voce.
items.scrolls.scroll.yngvi=rotolo di YNGVI
items.scrolls.scrollofidentify.desc=Rivela in modo permanente tutti i segreti di un singolo oggetto.
items.scrolls.scrollofidentify.inv_title=Identifica un elemento
items.scrolls.scrollofidentify.it_is=Il tuo articolo è stato identificato: %s.
items.scrolls.scrollofidentify.name=pergamena di identificazione
items.scrolls.scrolloflullaby.desc=Una melodia rilassante farà addormentare profondamente tutte le creature nel tuo campo visivo, dandoti la possibilità di fuggire o di sferrare un attacco a sorpresa.
items.scrolls.scrolloflullaby.name=pergamena della ninna nanna
items.scrolls.scrolloflullaby.sooth=La pergamena emette una melodia rilassante. Ti senti molto assonnato.
items.scrolls.scrollofmagicmapping.desc=Una volta letta questa pergamena, un'immagine di cristallina nitidezza si imprimerà nella tua memoria, rivelandoti la precisa conformazione del livello e svelandoti tutti i segreti nascosti. La posizione degli oggetti e delle creature rimarrà sconosciuta.
items.scrolls.scrollofmagicmapping.layout=Ora conosci la struttura del livello.
items.scrolls.scrollofmagicmapping.name=pergamena di mappatura magica
items.scrolls.scrollofmirrorimage.copies=La pergamena forma immagini speculari di te.
items.scrolls.scrollofmirrorimage.desc=L'incantesimo contenuto in questa pergamena creerà dei gemelli illusori del lettore, che inseguiranno i suoi nemici.
items.scrolls.scrollofmirrorimage.name=pergamena dell'immagine speculare
items.scrolls.scrollofmirrorimage.no_copies=La pergamena tenta di creare immagini speculari di te, ma queste non hanno un posto dove andare.
items.scrolls.scrollofrage.desc=Se letto ad alta voce, questo rotolo scatenerà un fragoroso ruggito che attirerà tutti i nemici verso chi lo leggerà e farà infuriare quelli vicini.
items.scrolls.scrollofrage.name=pergamena della rabbia
items.scrolls.scrollofrage.roar=La pergamena emette un ruggito furioso che riecheggia in tutta la prigione!
items.scrolls.scrollofrecharging.desc=La pura energia magica racchiusa in questa pergamena, una volta liberata, ricaricherà completamente le bacchette di chi la legge.
items.scrolls.scrollofrecharging.name=pergamena della ricarica
items.scrolls.scrollofrecharging.surge=Un'ondata di energia pervade il tuo corpo, rinvigorendo le tue bacchette!
items.scrolls.scrollofremovecurse.cleansed=Il tuo oggetto emana una luce purificatrice e un'energia malevola si disperde!
items.scrolls.scrollofremovecurse.desc=L'incantesimo contenuto in questa pergamena rimuoverà istantaneamente da armi, armature, anelli e oggetti portati dal lettore qualsiasi sortilegio che potrebbe impedirgli di eliminarli.
items.scrolls.scrollofremovecurse.inv_title=Pulire un oggetto
items.scrolls.scrollofremovecurse.name=pergamena di Rimozione della Maledizione
items.scrolls.scrollofremovecurse.not_cleansed=Il tuo oggetto si illumina di una luce purificante, ma non succede nulla.
items.scrolls.scrollofremovecurse.spirit=La tua pergamena libera lo spirito tormentato!
items.scrolls.scrollofretribution.blast=Una potente energia magica erutta dalla pergamena!
items.scrolls.scrollofretribution.desc=Questa pergamena contiene energia distruttiva che incanala la sofferenza di chi la legge verso l'esterno in un'esplosione di potere. Più debole è chi la legge, maggiore sarà il danno che infliggerà. Con pochissima salute, questa pergamena può uccidere la maggior parte dei nemici all'istante. Usare la pergamena, tuttavia, ha un costo per chi la usa, accecandolo e indebolendolo.
items.scrolls.scrollofretribution.name=rotolo della retribuzione
items.scrolls.scrollofteleportation.cant_reach=Non puoi teletrasportarti lì.
items.scrolls.scrollofteleportation.desc=L'incantesimo su questa pergamena teletrasporta istantaneamente chi lo legge in un luogo casuale del livello del dungeon. Può essere usato per sfuggire a una situazione pericolosa, ma lo sfortunato lettore potrebbe ritrovarsi in un posto ancora più pericoloso.
items.scrolls.scrollofteleportation.name=pergamena di teletrasporto
items.scrolls.scrollofteleportation.no_tele=La magia del teletrasporto fallisce.
items.scrolls.scrollofteleportation.prompt=Scegli un luogo in cui teletrasportarti
items.scrolls.scrollofteleportation.tele=In un batter d'occhio sei stato teletrasportato in un'altra area del livello.
items.scrolls.scrollofterror.desc=Un lampo di luce rossa terrorizzerà tutte le creature nel tuo campo visivo, che si gireranno e fuggiranno. Attaccare un nemico in fuga annullerà l'effetto.
items.scrolls.scrollofterror.many=La pergamena emette un brillante lampo di luce rossa e i mostri fuggono!
items.scrolls.scrollofterror.name=pergamena del terrore
items.scrolls.scrollofterror.none=La pergamena emette un brillante lampo di luce rossa.
items.scrolls.scrollofterror.one=La pergamena emette un brillante lampo di luce rossa e lo %s scappa!
items.scrolls.scrolloftransmutation.desc=Questa pergamena contiene una potente magia di trasmutazione. Se usata su un oggetto idoneo, lo trasformerà in un oggetto diverso dello stesso tipo. La magia preserverà anche potenziamenti, incantesimi e glifi. Pergamene e pozioni verranno trasmutate nel loro equivalente esotico, e viceversa.
items.scrolls.scrolloftransmutation.inv_title=Trasmutare un oggetto
items.scrolls.scrolloftransmutation.morph=Il tuo oggetto si trasforma in qualcosa di diverso!
items.scrolls.scrolloftransmutation.name=pergamena della trasmutazione
items.scrolls.scrolloftransmutation.nothing=Non succede niente di interessante.
items.scrolls.scrollofupgrade.desc=Questa pergamena potenzierà un singolo oggetto, migliorandone la qualità. Una bacchetta aumenterà in potenza e nel numero di cariche; un'arma infliggerà più danni o colpirà il bersaglio più frequentemente; un'armatura respingerà più colpi; l'effetto di un anello su chi lo indossa si intensificherà. Armi e armature richiederanno inoltre meno forza per essere utilizzate e qualsiasi maledizione sull'oggetto verrà rimossa.
items.scrolls.scrollofupgrade.inv_title=Aggiorna un oggetto
items.scrolls.scrollofupgrade.name=pergamena di potenziamento
items.scrolls.scrollofupgrade.remove_curse=La pergamena di potenziamento purifica il tuo oggetto dalla maledizione!
items.scrolls.scrollofupgrade.weaken_curse=La pergamena di potenziamento indebolisce la maledizione sul tuo oggetto.
items.spells.alchemize$wndalchemizeitem.energize=Trasforma in energia ZZQPH0ZXQ
items.spells.alchemize$wndalchemizeitem.energize_1=Trasforma 1 in energia %d
items.spells.alchemize$wndalchemizeitem.energize_all=Trasforma tutto in energia %d
items.spells.alchemize$wndalchemizeitem.sell=Trasforma in %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Trasforma 1 in %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Trasforma tutto in %dg
items.spells.alchemize.desc=Questo incantesimo contiene poteri trasmutativi simili a quelli presenti in un calderone alchemico. Ogni lancio permette all'utilizzatore di trasformare un oggetto (o una pila di oggetti) in oro o energia alchemica. Trasformare pozioni o pergamene in energia le identificherà persino!\n\nA Alcuni utilizzi di Alchemize sono venduti nei negozi, ma molti altri possono essere creati usando l'alchimia combinando un seme, una pietra runica e un po' di energia alchemica.
items.spells.alchemize.name=alchemizzare
items.spells.alchemize.prompt=Trasforma un oggetto in un oggetto tramite alchimia
items.spells.beaconofreturning.creatures=L'aura psichica delle creature vicine non ti permette di teletrasportarti in questo momento.
items.spells.beaconofreturning.desc=Questo intricato incantesimo conferisce all'utilizzatore la capacità di tornare in un luogo prestabilito, indipendentemente dalla distanza. L'incantesimo si consuma solo al ritorno, può essere impostato quante volte si desidera, ma ricorderà solo l'ultima posizione a cui è stato impostato.
items.spells.beaconofreturning.desc_set=Questo faro è stato posizionato da qualche parte al piano %d.
items.spells.beaconofreturning.name=faro del ritorno
items.spells.beaconofreturning.preventing=La forte aura magica di questo luogo ti impedisce di usare l'incantesimo!
items.spells.beaconofreturning.set=Il segnale di localizzazione è stato impostato nella tua posizione attuale.
items.spells.beaconofreturning.wnd_body=L'impostazione sovrascriverà la posizione precedentemente impostata per il faro.\n\nIl ritorno ti riporterà all'ultima posizione impostata e consumerà un utilizzo dell'incantesimo.
items.spells.beaconofreturning.wnd_return=RITORNO
items.spells.beaconofreturning.wnd_set=IMPOSTATO
items.spells.curseinfusion.desc=Questo incantesimo infonde in un pezzo di equipaggiamento la stessa potente magia maligna presente in DM-300. L'oggetto su cui viene utilizzato verrà immediatamente maledetto e qualsiasi incantesimo o glifo presente verrà sovrascritto.\n\nNel caso di armi, armature e bacchette, l'oggetto otterrà dei potenziamenti oltre ad essere maledetto. I potenziamenti dell'infusione di maledizione non si accumulano e vengono persi se l'oggetto viene demaledetto.\n\nÈ possibile utilizzare anche più infusioni di maledizione per cambiare la maledizione su un'arma o un'armatura.
items.spells.curseinfusion.inv_title=Maledire un oggetto
items.spells.curseinfusion.name=infusione maledetta
items.spells.magicalinfusion.desc=Questo incantesimo possiede lo stesso potere magico di una pergamena di potenziamento, ma in una forma più stabile. Oltre a potenziare un oggetto normalmente, non cancellerà mai un incantesimo, un glifo o una maledizione.
items.spells.magicalinfusion.infuse=Il tuo oggetto è intriso di energia arcana!
items.spells.magicalinfusion.inv_title=Infondere un oggetto
items.spells.magicalinfusion.name=infuso magico
items.spells.magicalporter.desc=Questo incantesimo teletrasporterà magicamente qualsiasi oggetto su cui venga lanciato. A differenza del faro di un mercante, tuttavia, gli oggetti verranno teletrasportati all'ingresso del piano del boss successivo.
items.spells.magicalporter.inv_title=Trasferisci un oggetto
items.spells.magicalporter.name=facchino magico
items.spells.magicalporter.nowhere=Non esiste un luogo in cui tu possa trasferire un oggetto.
items.spells.phaseshift.desc=Questo incantesimo caotico teletrasporterà qualsiasi personaggio su cui è diretto in una posizione casuale sul piano attuale, stordendolo per un periodo di tempo considerevole. I nemici più potenti saranno in grado di resistere all'effetto stordente. Questo incantesimo può essere diretto contro un bersaglio o contro chi lo lancia.
items.spells.phaseshift.name=sfasamento
items.spells.phaseshift.no_target=Non c'è niente da teletrasportare lì.
items.spells.reclaimtrap.desc=Questo incantesimo contiene residui dell'energia meccanica di DM-300. Quando viene lanciato su una trappola attiva, il potere della trappola si attacca a te, permettendoti di usare nuovamente l'incantesimo per espellere questo potere e attivare l'effetto della trappola in qualsiasi luogo tu voglia.\n\nTuttavia, alcune trappole potrebbero non funzionare in tutti i luoghi e solo una trappola può essere immagazzinata alla volta.
items.spells.reclaimtrap.desc_trap=L'incantesimo è attualmente pronto ad attivare un _%s._
items.spells.reclaimtrap.name=trappola di recupero
items.spells.reclaimtrap.no_trap=Non c'è nessuna trappola.
items.spells.recycle.desc=Questo incantesimo contiene una forma minore di magia di trasmutazione. Sebbene non funzioni sull'equipaggiamento, trasformerà una pergamena, una pozione, un seme, una pietra runica o un dardo appuntito in un oggetto casuale dello stesso tipo.
items.spells.recycle.inv_title=Ricicla un oggetto
items.spells.recycle.name=riciclare
items.spells.recycle.recycled=Il tuo articolo è stato riciclato nel seguente modo: %s.
items.spells.spell.ac_cast=LANCIO
items.spells.spell.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.spells.spell.no_magic=Non puoi lanciare incantesimi se sei immune alla magia.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Questo incantesimo incanala l'energia delle braci elementali utilizzate per crearlo e ti permetterà di evocare un elementale alleato che combatterà al tuo fianco! È possibile evocare un solo elementale alla volta, ma l'incantesimo può essere lanciato nuovamente per far tornare l'elementale a te senza alcun costo.
items.spells.summonelemental.desc_chaos=L'incantesimo sta attualmente irradiando energia caotica, evocherà un _elementale del caos_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_fire=L'incantesimo è attualmente rovente al tatto, evocherà un elementale del fuoco. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_frost=L'incantesimo è attualmente freddo al tatto, evocherà un elementale del gelo. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.desc_newborn=L'incantesimo al momento non è potenziato e evocherà un elementale neonato senza attacco a distanza. Puoi potenziare una pozione di fiamma liquida, una pozione di gelo, una pergamena di ricarica o una pergamena di trasmutazione specificate, in modo che le future evocazioni siano elementali a piena potenza!
items.spells.summonelemental.desc_shock=L'incantesimo sta attualmente irradiando energia statica, evocherà un _elementale di shock_. Puoi infondere un oggetto diverso, ma l'incantesimo perderà l'infusione attuale.
items.spells.summonelemental.imbue_prompt=Infondere un oggetto
items.spells.summonelemental.name=evocare elementale
items.spells.targetedspell.inv_title=Infondere un oggetto
items.spells.targetedspell.prompt=Scegli un obiettivo
items.spells.telekineticgrab.cant_grab=Non puoi afferrarlo.
items.spells.telekineticgrab.desc=Questo incantesimo permette all'incantatore di afferrare a distanza tutti gli oggetti in una posizione, o tutte le armi da lancio attaccate a un nemico!\n\nNon può essere usato per afferrare oggetti di proprietà di qualcun altro, o per afferrare contenitori come forzieri.
items.spells.telekineticgrab.name=presa telecinetica
items.spells.telekineticgrab.no_target=Non c'è niente da afferrare lì.
items.spells.unstablespell.desc=Questo piccolo cristallo quadrato nero presenta simboli runici cangianti su ciascuna delle sue superfici.\n\nQuando attivato, attiverà l'effetto di una pergamena casuale. L'effetto della pergamena sarà sempre focalizzato sul combattimento se ci sono nemici nel tuo campo visivo, e sarà sempre non focalizzato sul combattimento altrimenti.
items.spells.unstablespell.name=incantesimo instabile
items.spells.wildenergy.desc=Questo incantesimo contiene parte dell'energia maledetta che alimentava DM-300. Una volta lanciato, ricaricherà le tue bacchette e gli artefatti usurati, attivando anche un effetto casuale sulla bacchetta maledetta. Puoi però scegliere la direzione in cui questa magia maledetta si propagherà.
items.spells.wildenergy.name=energia selvaggia
items.stones.inventorystone.ac_use=UTILIZZO
items.stones.runestone$placeholder.name=pietra runica
items.stones.runestone.discover_hint=Puoi trovare questo oggetto casualmente nel dungeon oppure crearlo tramite alchimia.
items.stones.stoneofaggression$aggression.desc=La magia manipolativa fa sì che tutti i nemici vicini preferiscano attaccare questo personaggio.\n\nTurni rimanenti: %s.
items.stones.stoneofaggression$aggression.name=mirato
items.stones.stoneofaggression.desc=Quando questa pietra viene lanciata contro un alleato o un nemico, tutti i nemici vicini tenderanno ad attaccare quel personaggio per un breve periodo. I nemici boss, tuttavia, possono resistere all'effetto, riducendone significativamente la durata e subendo meno danni dagli attacchi dei loro servitori.
items.stones.stoneofaggression.name=pietra dell'aggressione
items.stones.stoneofaugmentation$wndaugment.cancel=Non importa
items.stones.stoneofaugmentation$wndaugment.choice=Cosa vorresti migliorare?
items.stones.stoneofaugmentation$wndaugment.damage=Danno
items.stones.stoneofaugmentation$wndaugment.defense=Difesa
items.stones.stoneofaugmentation$wndaugment.evasion=Evasione
items.stones.stoneofaugmentation$wndaugment.none=Rimozione dell'aumento
items.stones.stoneofaugmentation$wndaugment.speed=Velocità
items.stones.stoneofaugmentation.desc=Questa runa possiede una potente magia che può potenziare l'equipaggiamento per migliorarne una proprietà a scapito di un'altra.\n\nApplicandola su un'arma, potrai potenziarne la velocità o il danno. Anche le armi da lancio guadagneranno o perderanno durabilità in proporzione alla loro velocità.\n\nApplicandola su un'armatura, potrai potenziarne la difesa o l'elusione.
items.stones.stoneofaugmentation.discover_hint=È possibile acquistare questo oggetto in un negozio oppure crearlo tramite alchimia.
items.stones.stoneofaugmentation.inv_title=Aggiungi un elemento
items.stones.stoneofaugmentation.name=pietra di aumento
items.stones.stoneofblast.desc=Questa runa esploderà all'istante nel punto in cui verrà lanciata. Proprio come una bomba, l'esplosione infliggerà danni a tutto ciò che si trova nelle vicinanze.
items.stones.stoneofblast.name=pietra dell'esplosione
items.stones.stoneofblink.desc=Questa runa teletrasporterà l'utilizzatore nel luogo in cui viene lanciata.
items.stones.stoneofblink.name=pietra del battito di ciglia
items.stones.stoneofclairvoyance.desc=Questa pietra rivelerà istantaneamente tutte le tessere in un'area molto ampia intorno al punto in cui viene lanciata. Il suo effetto si propagherà persino attraverso i muri.
items.stones.stoneofclairvoyance.name=pietra della chiaroveggenza
items.stones.stoneofdeepsleep.desc=Quando questa pietra viene lanciata contro un nemico, lo farà cadere in un profondo sonno magico. I nemici addormentati magicamente dormiranno per sempre finché non verranno disturbati.
items.stones.stoneofdeepsleep.name=pietra del sonno profondo
items.stones.stoneofdetectmagic.desc=Questa runa è in grado di rilevare la magia che agisce su un oggetto. Usandola su un oggetto non identificato, potrai scoprire se è affetto da una maledizione malevola o se è influenzato da una magia positiva, come un incantesimo o un potenziamento.
items.stones.stoneofdetectmagic.detected_bad=Rilevi una magia malevola che influenza questo oggetto!
items.stones.stoneofdetectmagic.detected_both=Riscontri sia magia positiva che magia malevola che influenzano questo oggetto!
items.stones.stoneofdetectmagic.detected_good=Riscontri una magia positiva che influenza questo oggetto!
items.stones.stoneofdetectmagic.detected_none=Non si percepisce alcuna magia che influenzi questo oggetto.
items.stones.stoneofdetectmagic.inv_title=Rileva un oggetto
items.stones.stoneofdetectmagic.name=pietra di rilevamento della magia
items.stones.stoneofdisarming.desc=Questa runa racchiude una magia in grado di disattivare le trappole maligne nascoste nel dungeon. Può disinnescare fino a 9 trappole nell'area circostante.
items.stones.stoneofdisarming.name=pietra di disarmo
items.stones.stoneofenchantment.armor=La tua armatura brilla nell'oscurità!
items.stones.stoneofenchantment.desc=Questa runa possiede una magia incantevole. A differenza di una pergamena di potenziamento, non aumenterà direttamente la potenza di un oggetto, ma infonderà un'arma o un'armatura con un incantesimo, conferendole un nuovo potere.
items.stones.stoneofenchantment.inv_title=Incanta un oggetto
items.stones.stoneofenchantment.name=pietra dell'incantesimo
items.stones.stoneofenchantment.weapon=La tua arma brilla nell'oscurità!
items.stones.stoneoffear.desc=Quando questa pietra viene lanciata contro un personaggio, questi sarà sopraffatto dal terrore, si volterà e fuggirà. Attaccare un personaggio in fuga ne accorcerà l'effetto.
items.stones.stoneoffear.name=pietra della paura
items.stones.stoneofflock.desc=Questa runa evoca pecore magiche per un breve periodo di tempo nei pressi del luogo in cui viene lanciata.
items.stones.stoneofflock.name=pietra del gregge
items.stones.stoneofintuition$wndguess.break=La tua pietra dell'intuizione si sgretola in polvere...
items.stones.stoneofintuition$wndguess.correct=Corretto. Il tipo di articolo è stato identificato!
items.stones.stoneofintuition$wndguess.incorrect=La tua ipotesi era errata.
items.stones.stoneofintuition$wndguess.text=Prova a indovinare di che tipo di oggetto si tratta. Se indovini, il tipo verrà identificato!
items.stones.stoneofintuition.break_info=Puoi usare le pietre dell'intuizione due volte prima che una si rompa; il tuo prossimo utilizzo non consumerà una pietra.
items.stones.stoneofintuition.break_warn=Hai già utilizzato una pietra dell'intuizione, quindi il tuo prossimo utilizzo consumerà una pietra.
items.stones.stoneofintuition.desc=Questa runa possiede una versione più debole della magia presente nelle pergamene di identificazione. Invece di identificare direttamente un oggetto, agisce sulla tua intuizione, permettendoti di tentare di identificare il tipo di una pozione, una pergamena o un anello per tentativi.
items.stones.stoneofintuition.inv_title=Seleziona un elemento
items.stones.stoneofintuition.name=pietra dell'intuizione
items.stones.stoneofshock.desc=Questa runa scatena un'esplosione di energia elettrica che stordisce brevemente tutti i bersagli vicini e conferisce a chi la lancia una carica alla bacchetta per ogni bersaglio colpito.
items.stones.stoneofshock.name=pietra dello shock
items.stylus.ac_inscribe=ISCRIVITI
items.stylus.cursed=La magia dello stilo non funzionerà sulle armature maledette.
items.stylus.desc=Questo stilo arcano è fatto di una pietra scura e molto dura. Usandolo puoi incidere un glifo magico sulla tua armatura, ma non hai alcun potere di scegliere quale glifo sarà, lo stilo lo deciderà per te.
items.stylus.identify=Per prima cosa devi accertarti se quell'armatura è maledetta.
items.stylus.inscribed=Hai inciso la tua armatura con lo stilo.
items.stylus.name=stilo arcano
items.stylus.prompt=Seleziona un'armatura
items.tengusmask.ac_wear=INDOSSARE
items.tengusmask.desc=Questa maschera è caduta dal volto di Tengu mentre moriva, puoi sentire un grande potere magico emanare da essa. Era la maschera la fonte della forza di Tengu?\n\nQuando indossata, l'enorme potere della maschera verrà trasferito in te, permettendoti di _scegliere una sottoclasse per il tuo eroe._\n\nQuale sottoclasse sceglierai?
items.tengusmask.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.tengusmask.name=La maschera di Tengu
items.tengusmask.used=La maschera si disintegra mentre il suo potere fluisce in te!
items.torch.ac_light=LEGGERO
items.torch.desc=Un elemento imprescindibile per chi ama l'avventura: quando un dungeon piomba nell'oscurità, una torcia può essere di grande aiuto per illuminare il cammino.
items.torch.name=torcia
items.trinkets.chaoticcenser.desc=Dopo un po' di tempo nel calderone alchemico, questo incensiere sembra produrre fumo da solo! Questi gas si accumulano e vengono emessi dall'incensiere verso i nemici a intervalli semi-casuali. Sembra in grado di produrre ogni tipo di gas, ma riceverai un breve preavviso prima che l'incensiere si attivi.
items.trinkets.chaoticcenser.name=incensiere caotico
items.trinkets.chaoticcenser.spew=Il tuo incensiere sta per emettere: %s.
items.trinkets.chaoticcenser.stats_desc=Al suo livello attuale, questo gingillo genererà un gas nocivo vicino a un nemico all'incirca ogni _%d_ turni. I gas appariranno solo quando sono presenti nemici. A livelli più alti, questi gas hanno maggiori probabilità di essere esotici e potenti.
items.trinkets.chaoticcenser.typical_stats_desc=In genere questo gingillo genererà un gas nocivo vicino a un nemico all'incirca ogni _%d_ turni. I gas appariranno solo quando sono presenti nemici. Ai livelli più alti questi gas hanno maggiori probabilità di essere esotici e potenti.
items.trinkets.crackedspyglass.desc=Questo telescopio portatile sarebbe una dimostrazione di grande e precisa fattura, se non fosse per la crepa sulla lente frontale. Il cannocchiale sembra esserti d'aiuto rivelando nuovi oggetti nel dungeon, ma a causa del suo difetto gli oggetti rivelati sono piuttosto difficili da vedere!
items.trinkets.crackedspyglass.name=cannocchiale incrinato
items.trinkets.crackedspyglass.stats_desc=Al suo livello attuale, questo gingillo ha una probabilità di _%1$s%% di creare un oggetto nascosto extra su ogni piano non boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=Al suo livello attuale, questo gingillo ha una probabilità del _100%%_ di creare un oggetto nascosto extra su ogni piano non boss e una probabilità del _%1$s%% di creare un secondo oggetto nascosto extra.
items.trinkets.crackedspyglass.typical_stats_desc=In genere questo gingillo ha una probabilità _%1$s%% di creare un oggetto nascosto extra su ogni piano non boss.
items.trinkets.dimensionalsundial.desc=Questa piccola meridiana portatile è in qualche modo in grado di proiettare un'ombra nelle profondità del dungeon, anche se non la si tiene in posizione verticale. Ancor più strano, la posizione dell'ombra sembra non avere alcuna relazione con il sole in questo mondo. Quando non proietta alcuna ombra, la meridiana sembra attirare il pericolo.
items.trinkets.dimensionalsundial.name=meridiana dimensionale
items.trinkets.dimensionalsundial.stats_desc=Al suo livello attuale, questo gingillo ridurrà il tasso di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (dalle 8:00 alle 20:00) e aumenterà il tasso di generazione dei nemici di _%2$d%%_ durante la notte (dalle 20:00 alle 8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=In genere questo gingillo ridurrà la frequenza di generazione dei nemici di _%1$d%%_ durante il giorno nella vita reale (dalle 8:00 alle 20:00) e aumenterà la frequenza di generazione dei nemici di _%2$d%%_ durante la notte (dalle 20:00 alle 8:00).
items.trinkets.dimensionalsundial.warning=La tua meridiana non proietta ombra, e ti senti a disagio.
items.trinkets.exoticcrystals.desc=Questi piccoli cristalli rosa hanno la stessa forma dei cristalli di energia alchemica. Sebbene non possano essere utilizzati direttamente come fonte di energia, sembrano in qualche modo influenzare le pozioni e le pergamene che si trovano.
items.trinkets.exoticcrystals.name=cristalli esotici
items.trinkets.exoticcrystals.stats_desc=Al suo livello attuale, questo gingillo sostituirà _%s%%_ di pozioni o pergamene ottenute con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.
items.trinkets.exoticcrystals.typical_stats_desc=In genere questo gingillo sostituirà _%s%%_ di pozioni o pergamene con i loro equivalenti esotici. Ciò non influisce su pozioni di forza, pergamene di potenziamento o oggetti generati per aiutare a risolvere le stanze pericolose.
items.trinkets.eyeofnewt.desc=Questo occhio di tritone dorato e nero è un ingrediente comune, ora trasformato in un gingillo. L'occhio sembra ridurre la vista in cambio della possibilità di vedere le cose in modi diversi.
items.trinkets.eyeofnewt.name=occhio di tritone
items.trinkets.eyeofnewt.stats_desc=Al suo livello attuale, questo gingillo ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale dei nemici entro _%2$d_ caselle.
items.trinkets.eyeofnewt.typical_stats_desc=In genere questo gingillo ridurrà il tuo raggio visivo di _%1$s%%_, ma ti garantirà anche la visione mentale dei nemici entro _%2$d_ caselle.
items.trinkets.ferrettuft.desc=Un ciuffo di setosa pelliccia bianca di furetto, tenuto insieme da un nastro verde lime annodato a fiocco. I furetti sono noti per la loro agilità, la loro indole birichina e la loro mancanza di integrità. Parte di questa energia sembra irradiarsi da questo gingillo, migliorando la capacità di sfuggire a qualsiasi cosa si trovi nelle vicinanze.
items.trinkets.ferrettuft.name=ciuffo di furetto
items.trinkets.ferrettuft.stats_desc=Al suo livello attuale, questo gingillo aumenterà l'elusione di tutti i personaggi di _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=In genere questo gingillo aumenterà l'elusione di tutti i personaggi di _%1$s%%_.
items.trinkets.mimictooth.desc=Questo grosso dente affilato dev'essere stato strappato a un mimic molto infelice. Sembra che stia influenzando i mimic del dungeon, rendendoli più frequenti e pericolosi.
items.trinkets.mimictooth.name=dente imitativo
items.trinkets.mimictooth.stats_desc=Al suo livello attuale, questo gingillo renderà tutti i tipi di mimic _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che lasciano cadere. Ogni piano del dungeon avrà anche una probabilità _%2$s%%_ di contenere un mimic d'ebano furtivo extra.
items.trinkets.mimictooth.typical_stats_desc=In genere questo gingillo renderà tutti i tipi di mimic _%1$sx_ più comuni e molto più difficili da individuare, ma aumenterà anche la quantità di bottino che lasciano cadere. Ogni piano del dungeon avrà anche una probabilità _%2$s%%_ di contenere un mimic d'ebano furtivo extra.
items.trinkets.mossyclump.desc=Questo ciuffo di muschio umido sembra trattenere la sua umidità non importa quanto lo si strizzi. Sembra essere magicamente legato al dungeon stesso, rendendo più probabile la comparsa di erba e acqua.
items.trinkets.mossyclump.name=ciuffo muschioso
items.trinkets.mossyclump.stats_desc=Al suo livello attuale questo gingillo farà sì che _%d%%_ dei pavimenti non a tema vengano riempiti con acqua o erba invece.\n\nQuesto gingillo costa una quantità maggiore di energia per essere potenziato.
items.trinkets.mossyclump.typical_stats_desc=In genere questo gingillo farà sì che _%d%%_ dei pavimenti non a tema vengano riempiti con acqua o erba invece.\n\nQuesto gingillo costa una maggiore quantità di energia per essere potenziato.
items.trinkets.parchmentscrap.desc=Questo piccolo frammento di pergamena sembra provenire da un rotolo. Ha conservato parte della sua magia e pare che stia influenzando le armi e le armature trovate nel dungeon.
items.trinkets.parchmentscrap.name=frammento di pergamena
items.trinkets.parchmentscrap.stats_desc=Al suo livello attuale, questo gingillo renderà comuni gli incantesimi e i glifi _%dx_ e le maledizioni su armi e armature _%sx_. Le maledizioni su bacchette, anelli o artefatti non sono influenzate.\n\nQuesto gingillo costa una quantità maggiore di energia per essere potenziato.
items.trinkets.parchmentscrap.typical_stats_desc=In genere questo gingillo renderà comuni gli incantesimi e i glifi _%dx_ e le maledizioni su armi e armature _%sx_. Le maledizioni su bacchette, anelli o artefatti non sono influenzate.\n\nQuesto gingillo costa una quantità maggiore di energia per essere potenziato.
items.trinkets.petrifiedseed.desc=Questo seme si è fossilizzato, o per via di lenti processi geologici o per magia. Il seme sembra influenzare magicamente la flora del dungeon, sostituendo occasionalmente i semi delle piante con pietre runiche.
items.trinkets.petrifiedseed.name=seme pietrificato
items.trinkets.petrifiedseed.stats_desc=Al suo livello attuale, questo gingillo farà sì che l'erba calpestata rilasci pietre runiche invece di semi _%1$s%%_ volte, e farà anche sì che l'erba alta rilasci oggetti _%2$s%%_ più spesso.
items.trinkets.petrifiedseed.typical_stats_desc=In genere questo gingillo farà sì che l'erba calpestata rilasci pietre runiche invece di semi _%1$s%%_ delle volte, e farà anche sì che l'erba alta rilasci oggetti _%2$s%%_ più spesso.
items.trinkets.ratskull.desc=Questo macabro gingillo non è molto più grande del cranio di un normale ratto, che a quanto pare è una rarità in questo dungeon. L'influenza magica del cranio sembra attrarre gli abitanti più rari del dungeon, facendoli apparire molto più spesso.
items.trinkets.ratskull.name=cranio di ratto
items.trinkets.ratskull.stats_desc=Al suo livello attuale, questo gingillo renderà _%dx_ la probabilità di apparizione di nemici esotici rari. Il teschio è tuttavia efficace solo per metà nell'attirare mimi di cristallo e statue corazzate.
items.trinkets.ratskull.typical_stats_desc=In genere questo gingillo renderà più probabile la comparsa di nemici esotici rari. Il teschio, tuttavia, è efficace solo a metà nell'attirare imitatori di cristallo e statue corazzate.
items.trinkets.saltcube.desc=Questo grande cristallo di sale è stato tagliato in una forma cubica quasi perfetta e, in qualche modo, è riuscito a far defluire metà dell'acqua dal calderone alchemico invece di sciogliersi. Sembra che disidrati e conservi magicamente il cibo che mangi, prolungando il senso di sazietà, ma anche riducendo il recupero della salute quando non sei a digiuno.
items.trinkets.saltcube.name=cubetto di sale
items.trinkets.saltcube.stats_desc=Al suo livello attuale, questo gingillo aumenterà il tempo prima che tu abbia fame di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il pavimento non sia bloccato.
items.trinkets.saltcube.typical_stats_desc=In genere questo gingillo aumenterà il tempo prima che tu abbia fame di _%1$s%%_, ma ridurrà anche il tuo tasso di rigenerazione della salute di _%2$s%%_ a meno che il pavimento non sia bloccato.
items.trinkets.shardofoblivion$thrownusetracker.desc=Hai recentemente utilizzato un'arma da lancio non identificata, che conta come un pezzo di equipaggiamento non identificato utilizzato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=È stata utilizzata un'arma da lancio non identificata.
items.trinkets.shardofoblivion$wandusetracker.desc=Hai usato di recente una bacchetta non identificata, che conta come un pezzo di equipaggiamento non identificato usato per il frammento dell'oblio per un po'.\n\nTurni rimanenti: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Bacchetta non identificata utilizzata
items.trinkets.shardofoblivion.ac_identify=IDENTIFICARE
items.trinkets.shardofoblivion.desc=Dopo essere stato immerso nel calderone alchemico, questo piccolo frammento di metallo maledetto si è trasformato in... niente? La luce sembra piegarsi attorno ad esso e fluttua immobile quando non lo tieni in mano. Il frammento sembra attingere magicamente energia dalla tua ignoranza, quindi probabilmente è meglio non pensarci troppo.
items.trinkets.shardofoblivion.identify=Hai identificato l'oggetto!
items.trinkets.shardofoblivion.identify_not_yet=Quell'oggetto non è ancora pronto per essere identificato.
items.trinkets.shardofoblivion.identify_prompt=Identifica un elemento
items.trinkets.shardofoblivion.identify_ready=È pronto un oggetto da identificare: %s. Usa il tuo Frammento dell'Oblio su di esso per identificarlo.
items.trinkets.shardofoblivion.identify_ready_worn=I tuoi oggetti usurati sono ora pronti per essere identificati. Usa il tuo Frammento dell'Oblio sugli oggetti per identificarli.
items.trinkets.shardofoblivion.name=scheggia dell'oblio
items.trinkets.shardofoblivion.stats_desc=Al suo livello attuale, questo gingillo aumenterà la probabilità che i nemici lascino cadere bottino di 20%% per ogni pezzo di equipaggiamento non identificato che hai equipaggiato o usato di recente, fino a un massimo di _%d oggetti_. Il frammento ti impedirà anche di identificare l'equipaggiamento, ma può essere utilizzato per identificare manualmente gli oggetti che sono pronti per essere identificati.
items.trinkets.shardofoblivion.typical_stats_desc=In genere, questo gingillo aumenterà la probabilità che i nemici lascino cadere bottino di 20%% per ogni pezzo di equipaggiamento non identificato che hai equipaggiato o usato di recente, fino a un massimo di _%d oggetti_. Il frammento ti impedirà anche di identificare l'equipaggiamento, ma può essere utilizzato per identificare manualmente gli oggetti che sono pronti per tale scopo.
items.trinkets.thirteenleafclover.desc=In qualche modo, la cottura nel calderone alchemico ha fatto sì che questo trifoglio sviluppasse un mucchio di foglie extra! Non è chiaro se questo gingillo porti fortuna o sfortuna, forse renderà la tua fortuna più caotica?
items.trinkets.thirteenleafclover.name=trifoglio a tredici foglie
items.trinkets.thirteenleafclover.stats_desc=Al suo livello attuale, questo gingillo ti farà infliggere il massimo danno _%1$d%%_ del tempo e il minimo danno _%2$d%%_ del tempo.
items.trinkets.thirteenleafclover.typical_stats_desc=In genere questo gingillo ti farà infliggere il massimo danno _%1$d%%_ del tempo e il minimo danno _%2$d%%_ del tempo.
items.trinkets.trapmechanism.desc=Il meccanismo centrale di una delle trappole a fossa del dungeon, accuratamente scolpito nel pavimento per poterlo trasportare. Sembra essere magicamente legato al dungeon stesso, rendendo più frequenti i terreni pericolosi ma aumentando anche la tua affinità con essi.
items.trinkets.trapmechanism.name=meccanismo di trappola
items.trinkets.trapmechanism.stats_desc=Al suo livello attuale, questo gingillo farà sì che _%1$d%%_ dei piani non a tema vengano riempiti di trappole o abissi. Inoltre, _%2$d%%_ delle trappole nascoste del dungeon saranno invece visibili.
items.trinkets.trapmechanism.typical_stats_desc=In genere questo gingillo farà sì che _%1$d%%_ dei piani non a tema vengano riempiti di trappole o abissi. Inoltre, _%2$d%%_ delle trappole nascoste del dungeon saranno invece visibili.
items.trinkets.trinket$placeholder.name=gingillo
items.trinkets.trinket.discover_hint=Questo oggetto ha una probabilità di essere un'opzione ogni volta che crei un gingillo tramite alchimia.
items.trinkets.trinketcatalyst$randomtrinket.desc=Un oggetto nelle vicinanze è incastrato in una borsa che non riesci ad aprire. Il processo alchemico dissolverà la borsa, ma non saprai quale gingillo otterrai finché non lo farai!
items.trinkets.trinketcatalyst$randomtrinket.name=gingillo casuale
items.trinkets.trinketcatalyst.desc=Questa sfera di magica polvere dorata luccica nell'oscurità del dungeon. Questo catalizzatore può essere utilizzato in un calderone alchemico con un po' di energia alchemica per produrre un gingillo unico. I gingilli forniscono vari effetti diversi che modificano leggermente il dungeon o i suoi abitanti. I gingilli possono essere potenziati con più energia per rendere il loro effetto più potente, oppure lasciati cadere per rinunciare completamente all'effetto.
items.trinkets.trinketcatalyst.name=catalizzatore magico
items.trinkets.trinketcatalyst.window_text=L'acqua inizia a brillare non appena aggiungi il catalizzatore. Ci sono alcuni oggetti nelle vicinanze che potresti infondere di energia per trasformarli in un amuleto magico.
items.trinkets.trinketcatalyst.window_title=creare un gingillo
items.trinkets.vialofblood.desc=Questa sottile fiala contiene il sangue di qualche abitante del dungeon; ruotandola, si muove lentamente. Sembra potenziare magicamente gli effetti curativi, ma anche rallentarli.
items.trinkets.vialofblood.name=fiala di sangue
items.trinkets.vialofblood.stats_desc=Al suo livello attuale, questo gingillo aumenterà la salute complessiva che ottieni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi si verificheranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo valore scala con il livello dell'eroe).
items.trinkets.vialofblood.typical_stats_desc=In genere questo gingillo aumenterà la salute complessiva che ottieni bevendo pozioni curative, otri o pozzi di salute di _%1$s%%_. Tuttavia, questi effetti curativi si verificheranno anche più lentamente, rigenerando un massimo di _%2$s_ HP per turno (questo valore scala con il livello dell'eroe).
items.trinkets.wondrousresin.desc=Questa resina blu scintillante sembra contenere l'essenza distillata della magia di una bacchetta maledetta. La magia del calderone alchemico sembra averla in qualche modo stabilizzata, e ora sta influenzando le vostre bacchette.
items.trinkets.wondrousresin.name=resina meravigliosa
items.trinkets.wondrousresin.stats_desc=Al suo livello attuale, questo gingillo costringerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ del tempo e farà sì che le bacchette non maledette sparino un ulteriore fulmine maledetto neutro o positivo _%2$s%%_ del tempo.\n\nQuesto gingillo costa una quantità maggiore di energia per essere potenziato.
items.trinkets.wondrousresin.typical_stats_desc=In genere questo gingillo costringerà gli effetti della bacchetta maledetta a diventare neutri o positivi _%1$s%%_ delle volte e farà sì che le bacchette non maledette sparino un ulteriore fulmine maledetto neutro o positivo _%2$s%%_ delle volte.\n\nQuesto gingillo costa una quantità maggiore di energia per essere potenziato.
items.wands.cursedwand.disguise=Il tuo aspetto cambia sotto i tuoi occhi!
items.wands.cursedwand.fire=Si sente odore di bruciato...
items.wands.cursedwand.grass=L'erba spunta tutt'intorno a te!
items.wands.cursedwand.gravity=La gravità all'improvviso inizia ad attrarre in direzioni casuali!
items.wands.cursedwand.gravity_end=Il caos gravitazionale finisce.
items.wands.cursedwand.gravity_positive=La gravità all'improvviso inizia ad agire in direzioni casuali, ma questo non sembra avere alcun effetto su di te.
items.wands.cursedwand.mass_invuln=Una luce brillante scaturisce dalla tua bacchetta!
items.wands.cursedwand.nothing=Non succede nulla.
items.wands.cursedwand.ondeath=Sei stato ucciso dal tuo stesso %s.
items.wands.cursedwand.petrify=All'improvviso ti blocchi sul posto!
items.wands.cursedwand.sinkhole=Il terreno comincia a cedere intorno a te!
items.wands.cursedwand.sinkhole_positive=Il terreno inizia a cedere, ma al tatto sembra abbastanza solido.
items.wands.cursedwand.supernova=Una palla di energia fiammeggiante comincia a crescere. Forse è meglio scappare!
items.wands.cursedwand.supernova_positive=Una palla di energia fiammeggiante inizia a crescere, ma in qualche modo dà una sensazione di sicurezza.
items.wands.cursedwand.transmogrify_other=Il tuo oggetto si trasforma in qualcosa di diverso!
items.wands.cursedwand.transmogrify_wand=La tua bacchetta si trasforma in un oggetto diverso!
items.wands.damagewand.upgrade_stat_name_1=Danno magico
items.wands.wand$placeholder.name=bacchetta
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Questo %s è maledetto!
items.wands.wand.cursed=Questa bacchetta è maledetta, il che rende la sua magia caotica e casuale.
items.wands.wand.fizzles=La tua bacchetta sfrigola; probabilmente non è sufficientemente carica.
items.wands.wand.identify=Ora conosci la tua bacchetta a sufficienza per poterla identificare.
items.wands.wand.no_magic=La tua bacchetta non funziona; non puoi usare bacchette magiche se sei immune alla magia.
items.wands.wand.not_cursed=Questa bacchetta è esente da magia malevola.
items.wands.wand.prompt=Scegli un luogo da colpire
items.wands.wand.resin_many=Questa bacchetta ha acquisito _%d livelli_ dalla resina arcana.
items.wands.wand.resin_one=Questa bacchetta ha guadagnato 1 livello grazie alla resina arcana.
items.wands.wand.self_target=Non puoi prendere di mira te stesso!
items.wands.wandofblastwave.bmage_desc=Quando il Mago Guerriero colpisce un nemico paralizzato con un bastone dell'onda d'urto, consuma la paralisi infliggendo un'esplosione di danni magici bonus. Questo effetto ha un breve tempo di ricarica per ogni nemico.
items.wands.wandofblastwave.desc=Questa bacchetta è realizzata in una sorta di pietra marmorizzata, con finiture dorate e una gemma nera rotonda sulla punta. Al tatto risulta molto pesante.
items.wands.wandofblastwave.eleblast_desc=Un'esplosione elementale con un bastone a onda d'urto infligge il 67% di danni e respinge tutti i nemici al di fuori dell'area dell'esplosione.
items.wands.wandofblastwave.knockback_ondeath=L'impatto ti ha ucciso...
items.wands.wandofblastwave.name=bacchetta dell'onda d'urto
items.wands.wandofblastwave.ondeath=Ti sei ucciso con la tua stessa Bacchetta dell'Onda Esplosiva...
items.wands.wandofblastwave.staff_name=personale dell'onda d'urto
items.wands.wandofblastwave.stats_desc=Questa bacchetta spara un dardo che esplode violentemente in un punto bersaglio. La forza di questa esplosione infligge _%1$d-%2$d danni_ ed è abbastanza forte da far volare via la maggior parte dei nemici.
items.wands.wandofblastwave.typical_stats_desc=Questa bacchetta spara un dardo che esplode violentemente in un punto bersaglio. La forza di questa esplosione infligge in genere _%1$d-%2$d danni_ ed è abbastanza forte da far volare via la maggior parte dei nemici.
items.wands.wandofblastwave.upgrade_stat_name_2=Rinculo
items.wands.wandofcorrosion.bmage_desc=Quando il Mago da Battaglia colpisce un nemico con un bastone della corrosione, il nemico ha una probabilità di diventare melmosa.
items.wands.wandofcorrosion.desc=Questa bacchetta ha un corpo color cenere che si apre rivelando una gemma arancione brillante.
items.wands.wandofcorrosion.eleblast_desc=Un'esplosione elementale con un bastone della corrosione infligge ai nemici 4 turni di corrosione, con un danno iniziale di 6.
items.wands.wandofcorrosion.name=bacchetta di corrosione
items.wands.wandofcorrosion.staff_name=staff di corrosione
items.wands.wandofcorrosion.stats_desc=Questa bacchetta spara un dardo che esplode in una nube di gas altamente corrosivo in un punto bersaglio. Qualsiasi cosa si trovi all'interno di questa nube subirà danni crescenti nel tempo, a partire da _%d danni._
items.wands.wandofcorrosion.upgrade_stat_name_1=Danni da corrosione
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume del gas
items.wands.wandofcorruption.already_corrupted=Quel carattere non può essere ulteriormente influenzato.
items.wands.wandofcorruption.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone della corruzione, quest'ultimo ha la possibilità di impazzire.
items.wands.wandofcorruption.desc=Questa bacchetta emana un'energia oscura e caotica, come del resto sarebbe già evidente dal piccolo teschio decorativo sulla sua punta.
items.wands.wandofcorruption.eleblast_desc=Un'esplosione elementale con un bastone della corruzione infligge ai nemici 5 turni di furia.
items.wands.wandofcorruption.name=bacchetta della corruzione
items.wands.wandofcorruption.staff_name=personale della corruzione
items.wands.wandofcorruption.stats_desc=Questa bacchetta rilascerà un'esplosione di energia corruttrice che indebolirà i nemici e alla fine li piegherà al tuo volere. I nemici sono in grado di resistere alla corruzione, ma quelli indeboliti sono molto più facili da corrompere rispetto a quelli sani.
items.wands.wandofcorruption.upgrade_stat_name_1=Potere corrotto
items.wands.wandofcorruption.upgrade_stat_name_2=Durata del debuff
items.wands.wandofdisintegration.bmage_desc=Quando impugnato dal _mago guerriero_, il bastone della disintegrazione ha un raggio d'attacco aumentato, come se avesse un incantesimo di proiezione.
items.wands.wandofdisintegration.desc=Questa bacchetta è realizzata con un unico blocco liscio di ossidiana, attraversato da una luce viola intenso che percorre il suo lato fino alla punta. Risplende di un'energia distruttiva, pronta a scagliarsi in avanti.
items.wands.wandofdisintegration.eleblast_desc=Un'esplosione elementale con un bastone della disintegrazione infligge il 100% di danni e trapassa i muri.
items.wands.wandofdisintegration.name=bacchetta di disintegrazione
items.wands.wandofdisintegration.staff_name=personale della disintegrazione
items.wands.wandofdisintegration.stats_desc=Questa bacchetta spara un raggio che trapassa qualsiasi ostacolo e la sua distanza aumenterà con ogni potenziamento. Il raggio infligge _%1$d-%2$d danni_ e infligge anche danni bonus per ogni nemico e muro che attraversa.
items.wands.wandofdisintegration.upgrade_stat_name_2=Gamma massima
items.wands.wandoffireblast.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di fuoco, c'è una probabilità che si generi un'esplosione che danneggia i nemici e consuma tutto il fuoco nelle vicinanze! Questa probabilità aumenta con la quantità di fuoco adiacente al nemico.
items.wands.wandoffireblast.desc=Questa bacchetta è realizzata in legno laccato rosso con abbondante foglia d'oro, che le conferisce un aspetto regale. La sua punta crepita e sibila, impaziente di sprigionare la sua potente magia.
items.wands.wandoffireblast.eleblast_desc=Un attacco elementale con un bastone di fuoco infligge il 100% di danni, spalanca le porte e incendia nemici e terreno.
items.wands.wandoffireblast.name=bacchetta di fuoco
items.wands.wandoffireblast.staff_name=personale di Fireblast
items.wands.wandoffireblast.stats_desc=Questa bacchetta emette un cono di fuoco quando viene utilizzata. Il suo prossimo attacco consumerà _%1$d cariche_ e infliggerà _%2$d-%3$d danni._ Più cariche utilizza la bacchetta, più grande e potente sarà l'effetto.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Carica Danno
items.wands.wandoffireblast.upgrade_stat_name_2=2 danni da carica
items.wands.wandoffireblast.upgrade_stat_name_3=3 danni da carica
items.wands.wandoffrost.bmage_desc=Quando il Mago Guerriero colpisce un nemico congelato con un bastone di ghiaccio, c'è una probabilità che si congeli all'istante. Questa probabilità aumenta quanto più il nemico è congelato.
items.wands.wandoffrost.desc=Questa bacchetta sembra fatta di una sorta di ghiaccio magico. La sua luce si intensifica verso la punta arrotondata. Al tatto risulta molto fredda, eppure la mano rimane in qualche modo calda.
items.wands.wandoffrost.eleblast_desc=Un attacco elementale con un bastone di ghiaccio infligge il 100% dei danni, congela i nemici e spegne gli incendi.
items.wands.wandoffrost.name=bacchetta di gelo
items.wands.wandoffrost.staff_name=bastone di gelo
items.wands.wandoffrost.stats_desc=Questa bacchetta scaglia raffiche di energia ghiacciata contro i tuoi nemici, infliggendo _%1$d-%2$d danni_ e congelandoli. L'effetto sembra più forte in acqua. I nemici già congelati o raffreddati subiscono meno danni da questa bacchetta.
items.wands.wandoffrost.upgrade_stat_name_2=Durata del brivido
items.wands.wandoflightning$lightningcharge.desc=Il Mago da Battaglia è attualmente carico di energia, il che gli conferisce immunità al suo bastone del fulmine e aumenta la portata dell'arco di fulmine che può scaturire da esso.\n\nTurni rimanenti: %s.
items.wands.wandoflightning$lightningcharge.name=Carica elettricamente
items.wands.wandoflightning.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di fulmini, ha una probabilità di caricarsi elettricamente per 10 turni. Finché è carico, il Mago Guerriero è immune ai danni da fulmine e lancerà fulmini con maggiore intensità.
items.wands.wandoflightning.desc=Questa bacchetta è realizzata in metallo massiccio, il che la rende sorprendentemente pesante. Due punte si incurvano l'una verso l'altra all'estremità, e tra di esse si genera un arco elettrico.
items.wands.wandoflightning.eleblast_desc=Un'esplosione elementale con un bastone di fulmini infligge il 100% di danni, stordisce i nemici per 5 turni ed elettrizza l'acqua.
items.wands.wandoflightning.name=bacchetta del fulmine
items.wands.wandoflightning.ondeath=Ti sei ucciso con la tua stessa Bacchetta del Fulmine...
items.wands.wandoflightning.staff_name=bastone del fulmine
items.wands.wandoflightning.stats_desc=Questa bacchetta emette potenti scariche elettriche che attraversano qualsiasi cosa colpisca, infliggendo _%1$d-%2$d danni._ Questa elettricità si propagherà ai personaggi vicini e si diffonde più facilmente nell'acqua. Le scariche di questa bacchetta possono danneggiare te, ma non i tuoi alleati.
items.wands.wandoflivingearth$earthguardian.desc=Le rocce generate dalla tua bacchetta di terra vivente si sono trasformate in un guardiano di terra protettivo! Questo protettore roccioso attaccherà i nemici vicini, costringendoli ad attaccare il guardiano invece di te. Quando tutte le minacce vicine saranno eliminate, il guardiano si riformerà intorno a te e ricomparirà al prossimo utilizzo della bacchetta.
items.wands.wandoflivingearth$earthguardian.discover_hint=È possibile trovare questo personaggio con una bacchetta specifica.
items.wands.wandoflivingearth$earthguardian.name=guardiano della terra
items.wands.wandoflivingearth$earthguardian.wand_info=Il potere difensivo del guardiano è legato al livello della tua bacchetta. Attualmente blocca _%1$d-%2$d danni._
items.wands.wandoflivingearth$rockarmor.desc=Delle rocce magiche circondano il tuo corpo; quando vieni attaccato, cercheranno di bloccare i tuoi attacchi e ridurranno i danni subiti del 50%. Tuttavia, ogni danno bloccato consuma parte della roccia. Armatura rimanente: %1$d. Se si accumula abbastanza roccia intorno a te, il prossimo colpo della tua bacchetta di terra vivente farà sì che le rocce si uniscano a formare un guardiano che combatterà al tuo fianco. Armatura necessaria per il Guardiano: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Anche questo guardiano terrestre beneficia del Potere di Molti. Turni rimanenti: %d.
items.wands.wandoflivingearth$rockarmor.name=armatura di roccia
items.wands.wandoflivingearth.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di terra vivente, parte del danno inflitto viene restituito sotto forma di armatura di roccia.
items.wands.wandoflivingearth.desc=Questa bacchetta è fatta di una strana roccia, con bande di energia gialla luminosa. Le rocce sembrano muoversi leggermente quando si impugna la bacchetta, come se potessero sentire la mano.
items.wands.wandoflivingearth.eleblast_desc=Un'esplosione elementale con un bastone di terra vivente infligge il 50% di danni e cura un guardiano di terra attivo per ogni nemico colpito.
items.wands.wandoflivingearth.name=bacchetta della terra vivente
items.wands.wandoflivingearth.staff_name=personale della terra vivente
items.wands.wandoflivingearth.stats_desc=Questa bacchetta lancia dardi di roccia magica contro i nemici, infliggendo _%1$d-%2$d danni._ Le rocce si ricomporranno poi attorno all'utilizzatore, conferendogli un'armatura proporzionale ai danni inflitti. Se si accumula abbastanza armatura, questa si trasformerà in un guardiano di roccia al successivo utilizzo della bacchetta.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardiano Punti Vita Massimi
items.wands.wandoflivingearth.upgrade_stat_name_3=Blocco del tutore
items.wands.wandofmagicmissile$magiccharge.desc=La tua bacchetta del dardo magico ha ricaricato le tue bacchette, aumentando il livello effettivo del prossimo attacco che effettueranno. Le tue bacchette sono potenziate a: +%d. Turni di carica magica rimanenti: %s.
items.wands.wandofmagicmissile$magiccharge.name=carica magica
items.wands.wandofmagicmissile.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di dardo magico, tutte le sue bacchette, oltre al bastone stesso, si caricano.
items.wands.wandofmagicmissile.desc=Questa bacchetta piuttosto semplice lancia missili di pura energia magica. Sebbene la bacchetta in sé non abbia effetti speciali, dispone di più cariche disponibili e, una volta potenziata, può potenziare brevemente altre bacchette.
items.wands.wandofmagicmissile.discover_hint=Uno degli eroi inizia con questo oggetto.
items.wands.wandofmagicmissile.eleblast_desc=Un'esplosione elementale con un bastone del dardo magico infligge il 50% di danni e garantisce al mago 15 turni di ricarica.
items.wands.wandofmagicmissile.name=bacchetta del dardo magico
items.wands.wandofmagicmissile.staff_name=bastone del missile magico
items.wands.wandofmagicmissile.stats_desc=Ogni dardo di questa bacchetta infligge _%1$d-%2$d danni_ e, se potenziata, potenzierà brevemente altre bacchette.
items.wands.wandofprismaticlight.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di luce prismatica, quest'ultimo rimarrà paralizzato per una durata proporzionale al livello del bastone.
items.wands.wandofprismaticlight.desc=Questa bacchetta è realizzata in un unico pezzo di cristallo traslucido, come un lungo frammento di vetro liscio. Piccoli fasci di luce colorata danzano intorno alla punta della bacchetta, pronti a sprigionarsi.
items.wands.wandofprismaticlight.eleblast_desc=Un'esplosione elementale con un bastone di luce prismatica infligge il 67% di danni, rivela tutto il terreno nell'area dell'esplosione e acceca i nemici per 5 turni.
items.wands.wandofprismaticlight.name=bacchetta di luce prismatica
items.wands.wandofprismaticlight.staff_name=bastone di luce prismatica
items.wands.wandofprismaticlight.stats_desc=Questa bacchetta emette raggi di luce che squarciano l'oscurità del dungeon, rivelando aree nascoste e trappole. Il raggio può accecare i nemici e infligge _%1$d-%2$d danni._ I nemici demoniaci e non morti bruceranno nella luce intensa della bacchetta, subendo danni bonus.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Caso cieco
items.wands.wandofprismaticlight.upgrade_stat_name_3=Durata della luce
items.wands.wandofregrowth$dewcatcher.desc=Le piante "acchiappa-rugiada" sono piante meravigliose che si riempiono di rugiada magica. Tentano di mimetizzarsi con l'erba per non dare nell'occhio, ma i rigonfiamenti di rugiada accumulata le tradiscono.
items.wands.wandofregrowth$dewcatcher.discover_hint=È possibile trovare questa pianta con una bacchetta specifica.
items.wands.wandofregrowth$dewcatcher.name=pararughe
items.wands.wandofregrowth$lotus.desc=Il loto dorato è una pianta mistica che può essere evocata solo da una potente bacchetta della rigenerazione. La sua aura potenzia tutte le piante e i loro effetti, ma consuma rapidamente la sua energia e muore dopo poco tempo.
items.wands.wandofregrowth$lotus.discover_hint=È possibile trovare questa pianta con una bacchetta specifica, dopo averla potenziata più volte.
items.wands.wandofregrowth$lotus.name=Loto d'oro
items.wands.wandofregrowth$lotus.wand_info=Questo loto è stato prodotto da una bacchetta di rigenerazione _+%1$d_. Tutte le piante nel suo effetto si attiveranno _istantaneamente_ se piantate su un personaggio. Le piante avranno anche una probabilità _%2$d%%_ di rilasciare il loro seme e i dardi appuntiti useranno _%3$d%% meno durabilità_.
items.wands.wandofregrowth$seedpod.desc=I Baccelli di Semi sono piante magiche che producono semi di altri tipi di piante, anziché semi propri. In qualche modo riescono a diffondersi pur non avendo semi propri.
items.wands.wandofregrowth$seedpod.discover_hint=È possibile trovare questa pianta con una bacchetta specifica.
items.wands.wandofregrowth$seedpod.name=Baccello di semi
items.wands.wandofregrowth.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone della rigenerazione, e entrambi si trovano sull'erba, otterrà guarigione erboristica in proporzione al danno inflitto.
items.wands.wandofregrowth.degradation=Dopo un altro _%d carica_ questa bacchetta inizierà a non produrre più piante ed erba fresca. Questo limite aumenta salendo di livello o potenziando la bacchetta.
items.wands.wandofregrowth.desc=Questa bacchetta è realizzata con un sottile fusto di legno intagliato con maestria. In qualche modo è ancora viva e vibrante, di un verde brillante come il cuore di un giovane albero. "Quando la vita cessa, una nuova vita inizia sempre a crescere... Il ciclo eterno rimane sempre!"
items.wands.wandofregrowth.eleblast_desc=Un'esplosione elementale con un bastone della rigenerazione radica i nemici e fa crescere erba in modo casuale sull'area dell'esplosione.
items.wands.wandofregrowth.name=bacchetta della ricrescita
items.wands.wandofregrowth.staff_name=bastone della rigenerazione
items.wands.wandofregrowth.stats_desc=Quando viene utilizzata, questa bacchetta emetterà un'energia magica di rigenerazione a cono, facendo rivivere erba, radici e piante rare. Il suo prossimo impulso consumerà _%1$d cariche_. Più cariche utilizza la bacchetta, più grande e potente sarà l'effetto.
items.wands.wandofregrowth.upgrade_stat_name_1=Erba per carica
items.wands.wandofregrowth.upgrade_stat_name_2=Limite totale dell'erba
items.wands.wandoftransfusion.bmage_desc=Quando il Mago da Battaglia colpisce un nemico incantato con un bastone di trasfusione, otterrà uno scudo e il suo prossimo attacco con il bastone non gli costerà punti salute.
items.wands.wandoftransfusion.charged=Il tuo bastone è carico dell'energia vitale del tuo nemico!
items.wands.wandoftransfusion.desc=Questa bacchetta dalla forma piuttosto semplice si distingue per la sua tonalità magenta e la gemma nera come la pece sulla punta.
items.wands.wandoftransfusion.eleblast_desc=Un'esplosione elementale con un bastone di trasfusione incanta i nemici, cura gli alleati e infligge il 100% di danni ai nemici non morti.
items.wands.wandoftransfusion.name=bacchetta per trasfusione
items.wands.wandoftransfusion.ondeath=Ti sei ucciso con la tua stessa Bacchetta della Trasfusione...
items.wands.wandoftransfusion.staff_name=personale addetto alle trasfusioni
items.wands.wandoftransfusion.stats_desc=Quando usata su alleati o nemici ammaliati, questa bacchetta assorbirà _%1$d punti salute dell'utilizzatore_ per curare o proteggere l'alleato per _%2$d punti salute._ Quando usata sui nemici, la bacchetta li ammalia brevemente applicando _%3$d scudi_ all'utilizzatore. I non morti ostili subiranno _%4$d-%5$d danni_ invece di essere ammaliati.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoprotezione
items.wands.wandoftransfusion.upgrade_stat_name_3=Danni da non morti
items.wands.wandofwarding$ward.desc_1=Questo scudo base colpirà automaticamente qualsiasi nemico che entri nel suo raggio visivo, infliggendo _%1$d-%2$d danni._\n\nColpendo questo scudo con la tua bacchetta di protezione lo potenzierai.\n\nQuesto scudo colpirà una sola volta prima di dissiparsi.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per mantenere questo scudo.
items.wands.wandofwarding$ward.desc_2=Questo scudo potenziato ha uno schema più intricato e può attaccare più volte. Ogni scarica di questo scudo infliggerà _%1$d-%2$d danni._\n\nScaricando questo scudo con la tua bacchetta di protezione lo potenzierai.\n\nQuesto scudo scaricherà tre volte prima di dissiparsi.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per mantenere questo scudo.
items.wands.wandofwarding$ward.desc_3=Questo scudo completamente potenziato è in grado di attaccare più volte dei suoi predecessori. Ogni scarica di questo scudo infliggerà _%1$d-%2$d danni._\n\nScaricando questo scudo con la tua bacchetta di protezione lo potenzierai.\n\nQuesto scudo scaricherà cinque volte prima di dissiparsi.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per sostenere questo scudo.
items.wands.wandofwarding$ward.desc_4=Questa sentinella più piccola ha la stessa potenza di fuoco di una protezione maggiore, ma ha punti salute invece di un numero fisso di cariche. Assomiglia alla gemma sulla punta della tua bacchetta di protezione. Ogni scarica di questa sentinella infliggerà _%1$d-%2$d danni._\n\nColpire questa sentinella con la tua bacchetta di protezione la potenzierà e la curerà.\n\nQuesta sentinella consumerà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di protezione su di essa.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per sostenere questa sentinella.
items.wands.wandofwarding$ward.desc_5=Questa torretta potenziata è più grande e più resistente di una torretta inferiore. Ogni scarica di questa torretta infliggerà _%1$d-%2$d danni._\n\nColpire questa torretta con la tua bacchetta di protezione la potenzierà e la curerà.\n\nQuesta torretta consumerà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di protezione su di essa.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per sostenere questa torretta.
items.wands.wandofwarding$ward.desc_6=Questa torretta completamente potenziata è significativamente più resistente delle sue predecessore. Ogni scarica di questa torretta infliggerà _%1$d-%2$d danni._\n\nColpire questa torretta con la tua bacchetta di protezione la curerà.\n\nQuesta torretta consumerà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di protezione su di essa.\n\nLa tua bacchetta di protezione sta usando _%3$d energia_ per sostenere questa torretta.
items.wands.wandofwarding$ward.desc_generic_sentry=Questa sentinella ha la stessa potenza di fuoco di una ward, ma ha punti salute invece di un numero fisso di cariche. Assomiglia alla gemma sulla punta della tua bacchetta di protezione.\n\nColpire questa sentinella con la tua bacchetta di protezione la potenzierà e la curerà.\n\nQuesta sentinella consumerà un po' di salute ogni volta che colpisce un nemico, ma può essere curata usando la tua bacchetta di protezione su di essa.
items.wands.wandofwarding$ward.desc_generic_ward=Questo scudo colpirà automaticamente qualsiasi nemico che entri nel suo raggio visivo. Colpendo questo scudo con la tua bacchetta di protezione, lo potenzierai. Gli scudi hanno un numero limitato di scariche prima di dissiparsi.
items.wands.wandofwarding$ward.discover_hint=È possibile trovare questo personaggio con una bacchetta specifica.
items.wands.wandofwarding$ward.dismiss_body=Puoi dissolvere questa protezione se non vuoi più che la tua bacchetta la mantenga. Così facendo, la protezione viene distrutta immediatamente.\n\nDissolvere questa protezione?
items.wands.wandofwarding$ward.dismiss_cancel=NO
items.wands.wandofwarding$ward.dismiss_confirm=SÌ
items.wands.wandofwarding$ward.dismiss_title=Dimettere questo reparto?
items.wands.wandofwarding$ward.name_1=quartiere minore
items.wands.wandofwarding$ward.name_2=reparto
items.wands.wandofwarding$ward.name_3=reparto maggiore
items.wands.wandofwarding$ward.name_4=sentinella minore
items.wands.wandofwarding$ward.name_5=sentinella
items.wands.wandofwarding$ward.name_6=sentinella maggiore
items.wands.wandofwarding.bad_location=Non puoi collocare un ricovero lì.
items.wands.wandofwarding.bmage_desc=Quando il Mago Guerriero colpisce un nemico con un bastone di protezione, tutte le protezioni e le sentinelle attive hanno una possibilità di essere curate.
items.wands.wandofwarding.desc=Questa corta bacchetta di metallo ha una gemma viola brillante che fluttua sopra la sua punta.
items.wands.wandofwarding.eleblast_desc=Un'esplosione elementale con un bastone di protezione cura tutte le protezioni e le sentinelle nell'area dell'esplosione.
items.wands.wandofwarding.name=bacchetta di protezione
items.wands.wandofwarding.no_more_wards=La tua bacchetta non può sostenere altri incantesimi di protezione.
items.wands.wandofwarding.staff_name=personale di reparto
items.wands.wandofwarding.stats_desc=Anziché danneggiare direttamente un nemico, questa bacchetta evocherà sentinelle e ward statiche. Le ward possono essere evocate ovunque, anche attraverso i muri se si ha visibilità. Questa bacchetta può mantenere ward per un valore di _%d energia_ alla volta.
items.wands.wandofwarding.upgrade_stat_name_1=Danni al reparto
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=BERE
items.waterskin.collected=Raccogli la goccia di rugiada nella tua borraccia.
items.waterskin.desc=Un contenitore per liquidi, realizzato in cuoio e corda, chiuso con un tappo di sughero.
items.waterskin.desc_full=La borraccia piena sembra irradiare energia, forse può essere usata per benedire un altro oggetto di sopravvivenza?
items.waterskin.desc_heal=L'otre viene attualmente utilizzato per conservare l'acqua curativa. Più l'otre è pieno, maggiore sarà l'effetto curativo immediato che otterrai bevendone. Berrai solo la quantità necessaria.
items.waterskin.desc_water=Al momento l'otre contiene solo acqua potabile. Sicuramente nel sotterraneo ci sarà qualcos'altro che l'otre potrebbe contenere.
items.waterskin.discover_hint=Uno degli eroi inizia con questo oggetto.
items.waterskin.empty=La tua borraccia è vuota!
items.waterskin.full=La tua borraccia è piena!
items.waterskin.name=borraccia
items.weapon.curses.annoying.desc=Le armi fastidiose sono capaci di parlare, ma sono un po' troppo energiche. Spesso attireranno l'attenzione su di te senza volerlo.
items.weapon.curses.annoying.elestrike_desc=Un attacco elementale con una fastidiosa maledizione ha il 20% di probabilità di mandare in tilt ogni nemico nel raggio d'azione per 6 turni.
items.weapon.curses.annoying.msg_1=OOH, STIAMO LITIGANDO CONTRO QUALCOSA!?
items.weapon.curses.annoying.msg_10=BEN COLPITO!
items.weapon.curses.annoying.msg_11=Non volevo essere un'arma, volevo essere l'ascia di un boscaiolo.
items.weapon.curses.annoying.msg_12=Ricorda, l'eccessiva sicurezza in sé stessi è un killer lento e insidioso.
items.weapon.curses.annoying.msg_13=TUTTE LE TUE BASE APPARTENGONO A NOI!
items.weapon.curses.annoying.msg_2=SÌ, PRENDILI!
items.weapon.curses.annoying.msg_3=EHI, ASCOLTA!
items.weapon.curses.annoying.msg_4=SIAMO GIÀ AL BOSS!?
items.weapon.curses.annoying.msg_5=AHIA, NON COLPIRMI COSÌ FORTE!
items.weapon.curses.annoying.msg_6=MUORI, INSETTO!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=POSSIAMO FARE UNA PAUSA?!
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.name=fastidioso %s
items.weapon.curses.dazzling.desc=Le armi abbaglianti a volte emettono una luce accecante, abbagliando chiunque le veda.
items.weapon.curses.dazzling.elestrike_desc=Un attacco elementale con una maledizione abbagliante ha il 50% di probabilità di accecare ogni nemico nel raggio d'azione per 6 turni.
items.weapon.curses.dazzling.name=abbagliante %s
items.weapon.curses.displacing.desc=Le armi di spostamento sono intrise di una magia di teletrasporto caotica, che consente loro di teletrasportare i nemici in modo casuale sul pavimento.
items.weapon.curses.displacing.elestrike_desc=Un attacco elementale con maledizione di spostamento ha il 50% di probabilità di teletrasportare ogni nemico nel raggio d'azione.
items.weapon.curses.displacing.name=spostamento ZZQPH0ZXQ
items.weapon.curses.explosive.desc=Le armi esplosive accumulano gradualmente potenza ed esplodono, danneggiando tutto ciò che si trova nelle vicinanze.
items.weapon.curses.explosive.desc_cool=La tua arma è attualmente fredda al tatto.
items.weapon.curses.explosive.desc_hot=La tua arma è rovente! Sta per esplodere!
items.weapon.curses.explosive.desc_warm=La tua arma sta accumulando energia e si sta riscaldando...
items.weapon.curses.explosive.elestrike_desc=Un attacco elementale con maledizione esplosiva ha il 50% di probabilità di provocare un'esplosione su un nemico casuale nel raggio d'azione.
items.weapon.curses.explosive.hot=Caldo!
items.weapon.curses.explosive.name=esplosivo %s
items.weapon.curses.explosive.warm=Caldo...
items.weapon.curses.friendly.desc=Le armi amichevoli sono più adatte ai pacifisti, poiché a volte scatenano incantesimi che rendono impossibile il combattimento.
items.weapon.curses.friendly.elestrike_desc=Un attacco elementale con una maledizione amichevole ha il 50% di probabilità di incantare ogni nemico nel raggio d'azione per 6 turni.
items.weapon.curses.friendly.name=amichevole %s
items.weapon.curses.polarized.desc=Un'arma polarizzata è influenzata dalla magia, che fa sì che il suo attacco infligga il 50% di danni in più o nessun danno.
items.weapon.curses.polarized.elestrike_desc=Un attacco elementale con maledizione polarizzata ha il 50% di probabilità di infliggere 24-36 danni a ciascun nemico nel raggio d'azione.
items.weapon.curses.polarized.name=polarizzato %s
items.weapon.curses.sacrificial.desc=Le armi sacrificali richiederanno sangue a chi le indossa in cambio dell'attacco ai nemici. Più chi le indossa è in salute, più sangue richiederà la maledizione.
items.weapon.curses.sacrificial.elestrike_desc=Un attacco elementale con maledizione sacrificale infligge 12 punti ferita di sanguinamento all'eroe e a ogni nemico nel raggio d'azione.
items.weapon.curses.sacrificial.name=sacrificale %s
items.weapon.curses.wayward$waywardbuff.desc=La magia della tua arma ribelle si è attivata, rendendola estremamente imprecisa per un breve periodo. Tieni presente che questo non influisce sugli attacchi che colpiscono sicuramente, come gli attacchi a sorpresa. Attaccare con successo con l'arma ribelle annullerà immediatamente questo effetto.\n\nTurni rimanenti: %s.
items.weapon.curses.wayward$waywardbuff.name=ribelle
items.weapon.curses.wayward.desc=Le armi che sfuggono al controllo a volte diventano estremamente imprecise. Questa magia dura per un breve periodo quando si attiva, ma può essere dissipata sferrando un colpo con l'arma in questione.
items.weapon.curses.wayward.elestrike_desc=Un attacco elementale con una maledizione ribelle ha il 50% di probabilità di maledire ogni nemico nel raggio d'azione per 6 turni.
items.weapon.curses.wayward.name=%s ribelle
items.weapon.enchantments.blazing.desc=Questo incantesimo fa sì che delle fiamme sgorgano da un'arma, incendiando i nemici e infliggendo danni bonus a quelli già in fiamme.
items.weapon.enchantments.blazing.elestrike_desc=Un attacco elementale con un incantesimo fiammeggiante diffonde il fuoco su ogni casella nel raggio d'azione, per una durata di 8 turni.
items.weapon.enchantments.blazing.name=fiammeggiante %s
items.weapon.enchantments.blocking$blockbuff.desc=L'incantesimo di blocco della tua arma ti ha concesso un breve aumento della tua potenza difensiva!\n\nScudo rimanente: %d\n\nTurni rimanenti: %s.
items.weapon.enchantments.blocking$blockbuff.name=blocco
items.weapon.enchantments.blocking.desc=Le armi che bloccano gli attacchi hanno una probabilità di proteggerti brevemente dopo aver attaccato con esse.
items.weapon.enchantments.blocking.elestrike_desc=Un attacco elementale con un incantesimo di blocco conferisce al Duellante 6 di scudo extra per ogni nemico nel raggio d'azione.
items.weapon.enchantments.blocking.name=bloccando %s
items.weapon.enchantments.blooming.desc=Le armi fiorite contengono una magia che farà germogliare la vegetazione su o intorno a coloro che vengono colpiti.
items.weapon.enchantments.blooming.elestrike_desc=Un attacco elementale con un incantesimo di fioritura diffonde l'erba fino a 8 caselle di distanza e immobilizza tutti i nemici nel raggio d'azione per 6 turni.
items.weapon.enchantments.blooming.name=%s in fiore
items.weapon.enchantments.chilling.desc=I nemici colpiti da questo incantesimo vengono congelati, rallentando i loro movimenti e i loro attacchi.
items.weapon.enchantments.chilling.elestrike_desc=Un attacco elementale con un incantesimo gelido diffonde aria gelida su ogni casella nel raggio d'azione, per una durata di 8 turni.
items.weapon.enchantments.chilling.name=rinfrescante %s
items.weapon.enchantments.corrupting.desc=Questo potente incantesimo ha la capacità di piegare i nemici al tuo volere. Quando un nemico viene ucciso con quest'arma, c'è una probabilità che si corrompa invece di morire.
items.weapon.enchantments.corrupting.elestrike_desc=Un attacco elementale con un incantesimo di corruzione ha una probabilità del 5-25% (in base ai punti vita mancanti) di corrompere ogni nemico nel raggio d'azione, eccetto il bersaglio principale.
items.weapon.enchantments.corrupting.name=corrompendo ZZQPH0ZXQ
items.weapon.enchantments.elastic.desc=Le armi elastiche hanno la possibilità di respingere i nemici per brevi distanze.
items.weapon.enchantments.elastic.elestrike_desc=Un colpo elementale con un incantesimo elastico respinge tutti i nemici nel raggio d'azione di 5 caselle.
items.weapon.enchantments.elastic.name=elastico %s
items.weapon.enchantments.grim.desc=Questo potente incantesimo ha il potere di giustiziare istantaneamente un nemico. L'effetto è più probabile quanto più debole è il nemico.
items.weapon.enchantments.grim.elestrike_desc=Un attacco elementale con un incantesimo sinistro ha una probabilità del 6-30% (in base ai punti vita mancanti) di uccidere ogni nemico nel raggio d'azione, eccetto il bersaglio principale.
items.weapon.enchantments.grim.name=tetro %s
items.weapon.enchantments.kinetic$conserveddamage.desc=La tua arma ha immagazzinato la forza in eccesso di un precedente colpo mortale e la applicherà come danno bonus al tuo prossimo attacco. L'energia, tuttavia, si esaurirà lentamente nel tempo.\n\nDanno conservato: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=danni conservati
items.weapon.enchantments.kinetic.desc=Quando un nemico viene ucciso con un'arma cinetica, l'energia in eccesso viene immagazzinata nell'arma e verrà utilizzata per il successivo attacco andato a buon fine.
items.weapon.enchantments.kinetic.elestrike_desc=Un attacco elementale con un incantesimo cinetico applica il 40% del danno accumulato a ogni nemico nel raggio d'azione, eccetto il bersaglio principale.
items.weapon.enchantments.kinetic.name=cinetico %s
items.weapon.enchantments.lucky.desc=I nemici uccisi da un'arma fortunata hanno una probabilità di rilasciare bottino extra.
items.weapon.enchantments.lucky.elestrike_desc=Un attacco elementale con un incantesimo fortunato ha una probabilità del 12,5% di generare bottino sotto ogni nemico nel raggio d'azione. Questo effetto può attivarsi solo una volta per nemico.
items.weapon.enchantments.lucky.name=fortunato %s
items.weapon.enchantments.projecting.desc=Grazie a questo incantesimo, le armi da mischia avranno una portata maggiore. Le armi a distanza penetreranno i muri se mirate a bersagli vicini.
items.weapon.enchantments.projecting.elestrike_desc=Un attacco elementale con un incantesimo di proiezione infligge il 30% di danni a ogni nemico nel raggio d'azione, eccetto il bersaglio principale.
items.weapon.enchantments.projecting.name=proiezione ZZQPH0ZXQ
items.weapon.enchantments.shocking.desc=Scariche elettriche scaturiscono da un'arma folgorante, infliggendo danni extra a tutti i nemici vicini.
items.weapon.enchantments.shocking.elestrike_desc=Un attacco elementale con un incantesimo folgorante diffonde elettricità a tutte le caselle nel raggio d'azione, per una durata di 8 turni.
items.weapon.enchantments.shocking.name=scioccante %s
items.weapon.enchantments.unstable.desc=Questo incantesimo irradia energia caotica, agendo come un incantesimo diverso a ogni colpo.
items.weapon.enchantments.unstable.elestrike_desc=Un attacco elementale con un incantesimo instabile applica un effetto di incantesimo casuale a ogni nemico nel raggio d'azione, eccetto il bersaglio principale.
items.weapon.enchantments.unstable.name=%s instabile
items.weapon.enchantments.vampiric.desc=Questo potente incantesimo sottrae energia vitale ai nemici a ogni colpo, convogliandola nuovamente verso chi lo indossa. L'effetto è più forte quanto più bassa è la salute di chi lo porta.
items.weapon.enchantments.vampiric.elestrike_desc=Un attacco elementale con un incantesimo vampirico cura il Duellante di 2,5 HP per ogni nemico nel raggio d'azione.
items.weapon.enchantments.vampiric.name=vampirico %s
items.weapon.melee.assassinsblade.ability_desc=Il Duellante può _muoversi furtivamente_ mentre impugna una lama da assassino. Questa abilità permette al Duellante di teletrasportarsi istantaneamente fino a 3 caselle di distanza e gli garantisce _%d turni di invisibilità._
items.weapon.melee.assassinsblade.ability_name=furtivo
items.weapon.melee.assassinsblade.desc=Una piccola lama ondulata in ossidiana, difficile da maneggiare nonostante la sua leggerezza, ma letale se colpisce il bersaglio giusto.
items.weapon.melee.assassinsblade.name=lama dell'assassino
items.weapon.melee.assassinsblade.stats_desc=Quest'arma è più efficace contro i nemici ignari.
items.weapon.melee.assassinsblade.typical_ability_desc=Il Duellante può _muoversi furtivamente_ mentre impugna una lama da assassino. Questa abilità permette al Duellante di teletrasportarsi istantaneamente fino a 3 caselle di distanza e in genere gli garantisce _%d turni di invisibilità._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.battleaxe.ability_desc=Il Duellante può eseguire un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.battleaxe.ability_name=colpo pesante
items.weapon.melee.battleaxe.desc=L'enorme testa in acciaio di quest'ascia da battaglia conferisce una notevole forza a ogni ampio colpo.
items.weapon.melee.battleaxe.name=ascia da battaglia
items.weapon.melee.battleaxe.stats_desc=Si tratta di un'arma piuttosto precisa.
items.weapon.melee.battleaxe.typical_ability_desc=Il Duellante può eseguire un _colpo pesante_ con un'ascia da battaglia. Questo attacco concentrato infligge in genere _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.crossbow$chargedshot.desc=La Duellante sta concentrando il potere nella sua balestra. Il prossimo attacco che effettuerà con essa colpirà sempre e applicherà uno dei tre effetti seguenti:\n - Gli attacchi in mischia respingeranno i nemici di alcune caselle.\n - I dardi senza punta infliggeranno danni bonus.\n - I dardi con punta otterranno usi extra e applicheranno il loro effetto in un'area 7x7. Gli effetti positivi dei dardi influenzeranno solo gli alleati, mentre gli effetti negativi si applicheranno solo ai nemici. La Duellante non può usare questa abilità per applicare effetti positivi dei dardi a se stessa.
items.weapon.melee.crossbow$chargedshot.name=accusato
items.weapon.melee.crossbow.ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco normale vada sempre a segno e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un'area 7x7 e dureranno per _%2$d utilizzi in più_.
items.weapon.melee.crossbow.ability_name=colpo caricato
items.weapon.melee.crossbow.desc=Un'arma piuttosto complessa che scaglia dardi a velocità eccezionali. Sebbene non sia stata progettata per questo scopo, il peso e la robustezza di questa balestra la rendono anche una discreta arma da mischia.
items.weapon.melee.crossbow.name=balestra
items.weapon.melee.crossbow.stats_desc=Quest'arma potenzia i dardi lanciati, infliggendo _%1$d-%2$d danni_ quando è equipaggiata, e conferirà loro anche il suo incantesimo.
items.weapon.melee.crossbow.typical_ability_desc=La Duellante può _caricare_ la sua balestra, facendo sì che il suo prossimo attacco normale vada sempre a segno e applichi uno dei tre effetti: gli attacchi in mischia respingeranno i nemici, i dardi senza punta infliggeranno in genere _+%1$d danni_ e i dardi con punta applicheranno il loro effetto in un'area 7x7 e in genere dureranno per _%2$d utilizzi in più_.
items.weapon.melee.crossbow.typical_stats_desc=In genere, quest'arma potenzia i dardi lanciati per infliggere _%1$d-%2$d danni_ quando è equipaggiata e conferirà loro anche il suo incantesimo.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Potenziamento abilità
items.weapon.melee.cudgel.ability_desc=Il Duellante può eseguire un _colpo pesante_ con una mazza. Questo attacco concentrato infligge _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.cudgel.ability_name=colpo pesante
items.weapon.melee.cudgel.desc=Una piccola mazza di ottone, realizzata più come strumento di autodifesa per i nobili che come arma da avventura.
items.weapon.melee.cudgel.discover_hint=Uno degli eroi inizia con questo oggetto.
