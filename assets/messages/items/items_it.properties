items.weapon.melee.roundshield$guardtracker.desc=La Duellante ha preparato il suo scudo in previsione degli attacchi in arrivo. Gli attacchi fisici o magici sferrati contro di lei saranno completamente annullati.\n\nTurni rimanenti: %s.
