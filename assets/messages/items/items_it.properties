items.weapon.melee.katana.typical_ability_desc=Il Duellante può _scagliarsi_ con una katana contro un nemico a 1 casella di distanza. Questo si muove verso il nemico, infligge in genere _%1$d-%2$d danni_ ed è garantito che colpisca.
items.weapon.melee.longsword.ability_desc=Il Duellante può _fendere_ un nemico con una spada lunga. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
