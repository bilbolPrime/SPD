items.weapon.melee.runicblade.ability_desc=Il Duellante può eseguire un _fendente runico_ con una lama runica. Questo attacco è garantito per colpire e ha un potere di incantamento pari a _+%d%%._
items.weapon.melee.runicblade.ability_name=taglio runico
items.weapon.melee.runicblade.desc=Un'arma misteriosa proveniente da una terra lontana, con una lama di un blu brillante.
items.weapon.melee.runicblade.name=lama runica
items.weapon.melee.runicblade.stats_desc=Quest'arma trae maggior beneficio dagli aggiornamenti.
items.weapon.melee.runicblade.typical_ability_desc=Il Duellante può eseguire un _fendente runico_ con una lama runica. Questo attacco è garantito per colpire e in genere ha un potere di incantamento pari a _+%d%%._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Potere delle abilità
items.weapon.melee.sai$combostriketracker.desc=Il Duellante sta accumulando combo che possono essere utilizzate per aumentare il danno dell'abilità di attacco combo. Ogni attacco normale in mischia o con arma da lancio andato a segno conterà, ma non attaccare con successo per 5 turni azzera questa combo.\n\nColpi recenti: %1$d.\n\nTurni prima che i colpi vengano persi: %2$s.
items.weapon.melee.sai$combostriketracker.name=attacco combinato
items.weapon.melee.sai.ability_desc=Il Duellante può eseguire un _colpo combinato_ con i sai. Questo attacco è garantito e infligge _+%d danni_ per ogni volta che il Duellante ha colpito con un attacco normale in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.sai.ability_name=attacco combinato
items.weapon.melee.sai.desc=Due lame sottili, ciascuna pensata per essere impugnata con una sola mano. Perfette per abbattere i nemici con una raffica di fendenti.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Si tratta di un'arma molto veloce.
items.weapon.melee.sai.typical_ability_desc=Il Duellante può eseguire un _colpo combinato_ con i sai. Questo attacco è garantito e infligge in genere _+%d danni_ per ogni volta che il Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.scimitar$sworddance.desc=La Duellante esegue rapidi colpi basati sullo slancio in una sorta di danza. Mentre questa posizione è attiva, attacca 60%% più velocemente (abbastanza da attaccare esattamente due volte per turno con una scimitarra) e ha una precisione di +50%%.\n\nTurni rimanenti: %s.
items.weapon.melee.scimitar$sworddance.name=danza della spada
items.weapon.melee.scimitar.ability_desc=Il Duellante può eseguire una _danza di spada_ con una scimitarra. Questa posizione non richiede tempo per essere attivata e garantisce al Duellante +60%% velocità d'attacco e +50%% precisione per _%d turni._
items.weapon.melee.scimitar.ability_name=danza della spada
items.weapon.melee.scimitar.desc=Una lama spessa e ricurva. La sua forma consente attacchi più rapidi, ma meno potenti.
items.weapon.melee.scimitar.name=scimitarra
items.weapon.melee.scimitar.stats_desc=Si tratta di un'arma piuttosto veloce.
items.weapon.melee.scimitar.typical_ability_desc=Il Duellante può eseguire una _danza di spada_ con una scimitarra. Questa posizione non richiede tempo per essere attivata e garantisce al Duellante +60%% velocità d'attacco e +50%% precisione in genere per _%d turni._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.shortsword.ability_desc=Il Duellante può _fendere_ un nemico con una spada corta. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.shortsword.ability_name=spaccare
items.weapon.melee.shortsword.desc=Una spada piuttosto corta, solo pochi centimetri più lunga di un pugnale.
items.weapon.melee.shortsword.name=spada corta
items.weapon.melee.shortsword.typical_ability_desc=Il Duellante può _fendere_ un nemico con una spada corta. Questo infligge in genere _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.sickle.ability_desc=Il Duellante può _mietere_ un nemico con una falce. Questo attacco devastante è garantito e infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.weapon.melee.sickle.ability_name=raccolto
items.weapon.melee.sickle.desc=Un attrezzo agricolo portatile che può fungere anche da arma robusta ma ingombrante.
items.weapon.melee.sickle.name=falce
items.weapon.melee.sickle.stats_desc=Si tratta di un'arma piuttosto imprecisa.
items.weapon.melee.sickle.typical_ability_desc=Il Duellante può _mietere_ un nemico con una falce. Questo attacco devastante è garantito per colpire e in genere infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.weapon.melee.spear.ability_desc=Il Duellante può usare la punta di una lancia per _colpire_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.weapon.melee.spear.ability_name=arpione
items.weapon.melee.spear.desc=Una sottile asta di legno con la punta in ferro affilato.
items.weapon.melee.spear.name=lancia
items.weapon.melee.spear.stats_desc=Questa è un'arma piuttosto lenta.\nQuest'arma ha una portata maggiore.
items.weapon.melee.spear.typical_ability_desc=Il Duellante può usare la punta di una lancia per _colpire_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge in genere _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.weapon.melee.sword$cleavetracker.desc=La Duellante è pronta a dare seguito al suo precedente attacco ad area. Il prossimo utilizzo di attacco ad area non costerà alcuna carica abilità arma.\n\nTurni rimanenti: %s.
items.weapon.melee.sword$cleavetracker.name=spaccare
items.weapon.melee.sword.ability_desc=Il Duellante può _fendere_ un nemico con una spada. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.sword.ability_name=spaccare
items.weapon.melee.sword.desc=Una spada ben bilanciata. Non troppo grande, ma comunque notevolmente più lunga di una spada corta.
items.weapon.melee.sword.name=spada
items.weapon.melee.sword.typical_ability_desc=Il Duellante può _fendere_ un nemico con una spada. Questo infligge in genere _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.warhammer.ability_desc=Il Duellante può eseguire un _colpo pesante_ con un martello da guerra. Questo attacco concentrato infligge _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.warhammer.ability_name=colpo pesante
items.weapon.melee.warhammer.desc=Poche creature possono resistere al colpo devastante di questa imponente massa di piombo e acciaio, ma ci vuole una grande forza per usarla efficacemente.
items.weapon.melee.warhammer.name=martello da guerra
items.weapon.melee.warhammer.stats_desc=Si tratta di un'arma piuttosto precisa.
items.weapon.melee.warhammer.typical_ability_desc=Il Duellante può eseguire un _colpo pesante_ con un martello da guerra. Questo attacco concentrato infligge in genere _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.warscythe.ability_desc=Il Duellante può _mietere_ un nemico con una falce da guerra. Questo attacco devastante è garantito per colpire e infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.weapon.melee.warscythe.ability_name=raccolto
items.weapon.melee.warscythe.desc=Questo strumento grande e ingombrante è stato rinforzato per renderlo più efficace nel tagliare i nemici che i raccolti.
items.weapon.melee.warscythe.name=falce da guerra
items.weapon.melee.warscythe.stats_desc=Si tratta di un'arma piuttosto imprecisa.
items.weapon.melee.warscythe.typical_ability_desc=Il Duellante può _mietere_ un nemico con una falce da guerra. Questo attacco devastante è garantito per colpire e in genere infligge _%d danni_. Questo danno viene applicato come sanguinamento se il bersaglio non è immune.
items.weapon.melee.whip.ability_desc=La Duellante può frustare tutti i nemici intorno a sé con una frusta. Questa abilità infligge _%1$d-%2$d danni_, attacca tutti i nemici entro il raggio d'attacco ed è garantita per colpire.
items.weapon.melee.whip.ability_name=ciglia
items.weapon.melee.whip.desc=Sebbene la corda spinata all'estremità di quest'arma infligga pochi danni, la sua portata è ineguagliabile.
items.weapon.melee.whip.name=frusta
items.weapon.melee.whip.stats_desc=Quest'arma ha una portata enorme.
items.weapon.melee.whip.typical_ability_desc=La Duellante può frustare tutti i nemici intorno a sé con una frusta. Questa abilità infligge in genere _%1$d-%2$d danni_, attacca tutti i nemici entro il raggio d'attacco ed è garantita per colpire.
items.weapon.melee.wornshortsword.ability_desc=Il Duellante può _fendere_ un nemico con una spada corta usurata. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.wornshortsword.ability_name=spaccare
items.weapon.melee.wornshortsword.desc=Una spada piuttosto corta, consumata dall'uso intenso. È sia più debole che leggermente più leggera di una spada corta in condizioni migliori.
items.weapon.melee.wornshortsword.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.melee.wornshortsword.name=spada corta consumata
items.weapon.melee.wornshortsword.typical_ability_desc=Il Duellante può _fendere_ un nemico con una spada corta usurata. Questo infligge in genere _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.missiles.bolas.desc=Queste insolite armi a distanza non infliggono molti danni, ma sono estremamente efficaci nel rallentare il bersaglio.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Quest'arma infligge menomazione al suo bersaglio.
items.weapon.missiles.boomerang.desc=Lanciato contro il nemico, questo proiettile di legno piatto e curvo tornerà nelle mani di chi lo ha lanciato.
items.weapon.missiles.boomerang.durability=Grazie alla sua solida costruzione, questo boomerang non si romperà con l'uso.
items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.darts.adrenalinedart.desc=Questi dardi sono dotati di una sostanza a base di cardo selvatico che aumenta la velocità di movimento e di attacco degli alleati, oppure riduce temporaneamente la velocità di movimento dei nemici. Il dardo in sé è comunque dannoso per i nemici, ma non per gli alleati.
items.weapon.missiles.darts.adrenalinedart.name=dardo di adrenalina
items.weapon.missiles.darts.blindingdart.desc=Questi dardi hanno la punta contenente un composto a base di erba cieca che acceca il bersaglio per un breve periodo. Non disorientano però, quindi il nemico saprà comunque dove ti ha visto l'ultima volta.
items.weapon.missiles.darts.blindingdart.name=dardo accecante
items.weapon.missiles.darts.chillingdart.desc=Questi dardi sono dotati di una punta a base di composto Icecap che raffredderà notevolmente il bersaglio.
items.weapon.missiles.darts.chillingdart.name=dardo agghiacciante
items.weapon.missiles.darts.cleansingdart.desc=Questi dardi sono dotati di una sostanza a base di mageroyal che renderà temporaneamente gli alleati immuni a tutti gli effetti negativi, oppure rimuoverà gli effetti positivi dai nemici. I nemici potrebbero persino dimenticare per un attimo di starvi attaccando o di essere in fuga. Il dardo in sé è comunque dannoso per i nemici, ma non per gli alleati.
items.weapon.missiles.darts.cleansingdart.name=dardo purificatore
items.weapon.missiles.darts.dart.ac_tip=MANCIA
items.weapon.missiles.darts.dart.desc=Questi semplici bastoncini di legno con la punta acuminata sono appesantiti per volare dritti e colpire la preda con un semplice movimento del polso. Possono essere dotati di semi in punta per ottenere effetti aggiuntivi al momento del lancio.
items.weapon.missiles.darts.dart.name=dardo
items.weapon.missiles.darts.dart.prompt=Seleziona un seme
items.weapon.missiles.darts.dart.tip_all=punta %1$d freccette con semi %2$d
items.weapon.missiles.darts.dart.tip_cancel=cancellare
items.weapon.missiles.darts.dart.tip_desc=Un seme può essere combinato con una o due freccette per inciderle. Ogni tipo di seme produce il proprio tipo di freccetta incisa, con un effetto unico monouso. Incidendo una freccetta con questi semi si otterrà una _%s._
items.weapon.missiles.darts.dart.tip_one=punta 1 dardo con 1 seme
items.weapon.missiles.darts.dart.tip_title=Punta delle freccette
items.weapon.missiles.darts.dart.tip_two=punta 2 freccette con 1 seme
items.weapon.missiles.darts.dart.unlimited_uses=Grazie alla loro semplice costruzione, le freccette dureranno praticamente per sempre.
items.weapon.missiles.darts.displacingdart.desc=Questi dardi hanno una punta con un composto a base di Fadeleaf che teletrasporterà il bersaglio a breve distanza.
items.weapon.missiles.darts.displacingdart.name=dardo di spostamento
items.weapon.missiles.darts.healingdart.desc=Questi dardi sono dotati di una sostanza a base di erba solare che conferisce un'immediata capacità curativa al bersaglio. Il dardo in sé è comunque dannoso per i nemici, ma non per gli alleati.
items.weapon.missiles.darts.healingdart.name=dardo curativo
items.weapon.missiles.darts.holydart.desc=Questi dardi sono dotati di una sostanza a base di fiore stellare che infonde energia sacra al bersaglio. Alleati e nemici normali saranno benedetti, mentre i nemici non morti o demoniaci subiranno gravi danni. Il dardo in sé è comunque dannoso per i nemici, ma non per gli alleati.
items.weapon.missiles.darts.holydart.name=freccia sacra
items.weapon.missiles.darts.incendiarydart.desc=Queste freccette hanno una punta con un composto a base di firebloom che, all'impatto, si sprigionerà in fiamme brillanti.
items.weapon.missiles.darts.incendiarydart.name=dardo incendiario
items.weapon.missiles.darts.paralyticdart.desc=Questi dardi sono dotati di una sostanza a base di radici che paralizza il bersaglio per un breve periodo.
items.weapon.missiles.darts.paralyticdart.name=dardo paralizzante
items.weapon.missiles.darts.poisondart.desc=Questi dardi hanno la punta contenente un composto a base di Atriplex che avvelenerà il bersaglio.
items.weapon.missiles.darts.poisondart.name=dardo avvelenato
items.weapon.missiles.darts.rotdart.desc=Questi dardi micidiali sono dotati di una punta acida a base di bacche corrosive, che corrode aggressivamente qualsiasi cosa entri in contatto con essi. I nemici più potenti resisteranno alla maggior parte dell'effetto, ma la corrosione è sufficientemente forte da uccidere facilmente la maggior parte dei nemici comuni. Durano più a lungo degli altri dardi con punta, ma la loro resistenza non può essere aumentata.
items.weapon.missiles.darts.rotdart.discover_hint=È possibile creare questo oggetto utilizzando un seme ottenuto da una missione specifica.
items.weapon.missiles.darts.rotdart.name=freccia marciume
items.weapon.missiles.darts.shockingdart.desc=Questi dardi sono dotati di una punta a base di una sostanza derivata dalla vite delle tempeste, che infliggerà una forte scossa al bersaglio.
items.weapon.missiles.darts.shockingdart.name=dardo stordente
items.weapon.missiles.darts.tippeddart.about_to_break=La punta della tua freccetta sta per scadere.
items.weapon.missiles.darts.tippeddart.ac_clean=PULITO
items.weapon.missiles.darts.tippeddart.cancel=cancellare
items.weapon.missiles.darts.tippeddart.clean_all=pulire tutto
items.weapon.missiles.darts.tippeddart.clean_desc=Questa operazione rimuoverà la punta a semi dalle tue freccette, riportandole alla loro forma originale.
items.weapon.missiles.darts.tippeddart.clean_one=uno pulito
items.weapon.missiles.darts.tippeddart.clean_title=Freccette pulite
items.weapon.missiles.darts.tippeddart.discover_hint=Puoi acquistare questo oggetto in un negozio oppure crearlo utilizzando un seme.
items.weapon.missiles.darts.tippeddart.has_broken=La punta della tua freccetta è scaduta.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Ma questi sono di qualità talmente elevata che dureranno praticamente per sempre._
items.weapon.missiles.darts.tippeddart.uses_left=Questo mazzo di freccette ha ancora _%d/%d_ utilizzi prima che una punta si consumi.
items.weapon.missiles.fishingspear.desc=Piccole lance da lancio che funzionano bene come arma improvvisata, nonostante siano state progettate per la pesca.
items.weapon.missiles.fishingspear.name=lancia da pesca
items.weapon.missiles.forcecube.desc=Questi cubi magici dalla forma bizzarra sono abbastanza piccoli da poter essere tenuti in mano, ma sono incredibilmente pesanti.
items.weapon.missiles.forcecube.name=cubo di forza
items.weapon.missiles.forcecube.ondeath=Ti sei ucciso con il tuo stesso Cubo di Forza...
items.weapon.missiles.forcecube.stats_desc=Quest'arma distribuisce la forza del suo impatto su una piccola area, colpendo tutto ciò che si trova nelle vicinanze.
items.weapon.missiles.heavyboomerang.desc=Questo grande boomerang è difficile da maneggiare efficacemente, ma infliggerà danni considerevoli.
items.weapon.missiles.heavyboomerang.name=boomerang pesante
items.weapon.missiles.heavyboomerang.stats_desc=Quest'arma ritorna al punto da cui è stata lanciata dopo cinque turni.
items.weapon.missiles.javelin.desc=Queste lance da lancio di grandi dimensioni sono appesantite in modo che la punta rimanga rivolta in avanti mentre solcano l'aria.
items.weapon.missiles.javelin.name=giavellotto
items.weapon.missiles.kunai.desc=Questi piccoli coltelli sono molto efficaci nelle mani di un utilizzatore esperto.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Quest'arma è più efficace contro i nemici ignari.
items.weapon.missiles.missileweapon$placeholder.name=arma da lancio
items.weapon.missiles.missileweapon.about_to_break=La tua arma da lancio sta per rompersi.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se l'ultima arma da lancio del tuo set di armi da lancio potenziate si rompe, il set andrà perso per sempre. Sei sicuro di volerla lanciare?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=NO
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=SÌ
items.weapon.missiles.missileweapon.curse_discover=Quest'arma da lancio è maledetta!
items.weapon.missiles.missileweapon.distance=Le armi da lancio sono più precise a distanza, ma meno precise a distanza ravvicinata.
items.weapon.missiles.missileweapon.durability=Le armi da lancio si usurano e si rompono con l'uso.
items.weapon.missiles.missileweapon.dust=L'arma lanciata si sbriciola in polvere al tuo tocco.
items.weapon.missiles.missileweapon.has_broken=Una delle tue armi da lancio si è rotta.
items.weapon.missiles.missileweapon.probably_too_heavy=Probabilmente quest'arma è troppo pesante per te.
items.weapon.missiles.missileweapon.stats_known=Questo set di armi da lancio di livello _%1$d_ infligge danni pari a _%2$d-%3$d_ e richiede forza pari a _%4$d_ per essere utilizzato.
items.weapon.missiles.missileweapon.stats_unknown=In genere, questo set di armi da lancio di livello _%1$d_ infligge danni pari a _%2$d-%3$d_ e richiede una forza pari a _%4$d_ per essere utilizzato.
items.weapon.missiles.missileweapon.unknown_uses=In genere, questo set di armi da lancio avrà _%d_ utilizzi prima che una si rompa.
items.weapon.missiles.missileweapon.unlimited_uses=Questo set è di qualità talmente elevata che durerà praticamente per sempre.
items.weapon.missiles.missileweapon.uses_left=Questo set di armi da lancio ha _%d/%d_ utilizzi rimanenti prima che una si rompa.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Hai appena lanciato uno shuriken all'istante e devi aspettare prima di poterlo fare di nuovo. Gli shuriken possono ancora essere lanciati, ma alla velocità normale dell'arma.\n\nTurni rimanenti: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Tempo di ricarica dello shuriken
items.weapon.missiles.shuriken.desc=Queste stelle di metallo dalle lame affilatissime infliggono danni notevoli quando colpiscono. Si possono lanciare in rapida successione.
items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Gli shuriken possono essere lanciati istantaneamente con un tempo di ricarica di 20 turni.
items.weapon.missiles.throwingclub.desc=Un'arma da lancio piuttosto semplice ma resistente, essenzialmente una grossa pietra fissata a un bastone.
items.weapon.missiles.throwingclub.name=mazza da lancio
items.weapon.missiles.throwingclub.stats_desc=Quest'arma non si attacca ai nemici e può essere raccolta all'istante.
items.weapon.missiles.throwinghammer.desc=Questi robusti martelli sono progettati per essere lanciati contro il nemico. La loro struttura interamente in metallo e liscia li rende molto resistenti.
items.weapon.missiles.throwinghammer.name=martello da lancio
items.weapon.missiles.throwinghammer.stats_desc=Quest'arma non si attacca ai nemici e può essere raccolta all'istante.
items.weapon.missiles.throwingknife.desc=Questi coltelli leggeri sono bilanciati in modo da fendere l'aria con precisione verso il bersaglio.
items.weapon.missiles.throwingknife.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.missiles.throwingknife.name=coltello da lancio
items.weapon.missiles.throwingknife.stats_desc=Quest'arma è più efficace contro i nemici ignari.
items.weapon.missiles.throwingspear.desc=Queste lance leggere hanno telai sottili progettati per essere lanciati, non per essere affondati.
items.weapon.missiles.throwingspear.name=lancia
items.weapon.missiles.throwingspike.desc=Queste robuste aste metalliche appuntite sono progettate per essere lanciate contro nemici lontani.
items.weapon.missiles.throwingspike.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.missiles.throwingspike.name=schiacciata di lancio
items.weapon.missiles.throwingstone.desc=Queste pietre vengono levigate per poter essere lanciate con maggiore potenza rispetto a una pietra normale.
items.weapon.missiles.throwingstone.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.missiles.throwingstone.name=lancio di pietre
items.weapon.missiles.tomahawk.desc=Queste asce da lancio hanno un bordo seghettato che lacera la lama mentre si conficcano nel nemico.
items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Quest'arma infligge _%1$d-%2$d sanguinamento_ al suo bersaglio.
items.weapon.missiles.tomahawk.typical_stats_desc=Quest'arma infligge tipicamente _%1$d-%2$d sanguinamento_ al suo bersaglio.
items.weapon.missiles.trident.desc=Enormi lance da lancio con tre punte letali all'estremità. Sono potenti, ma piuttosto pesanti.
items.weapon.missiles.trident.name=tridente
items.weapon.spiritbow.ac_shoot=SPARARE
items.weapon.spiritbow.desc=Un arco forgiato in un antico legno magico. La corda e le incisioni dell'arco brillano di una tenue luce azzurra. Quando la corda viene tesa, l'arco evoca una freccia magica che può essere scagliata contro un nemico.
items.weapon.spiritbow.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.spiritbow.name=arco spirituale
items.weapon.spiritbow.prompt=Scegli un obiettivo
items.weapon.spiritbow.stats=L'arco non può essere potenziato direttamente, ma diventerà gradualmente più potente man mano che sali di livello. Al tuo livello attuale, le frecce scagliate dall'arco infliggeranno _%1$d-%2$d danni_ e richiederanno _%3$d forza_ per essere utilizzate correttamente.
items.weapon.weapon$enchantment.discover_hint=Puoi trovare un oggetto con questo effetto in modo casuale nel dungeon, oppure provare ad applicarlo tu stesso a un oggetto.
items.weapon.weapon$enchantment.enchant=incanto
items.weapon.weapon$enchantment.rankings_desc=Ucciso da un incantesimo
items.weapon.weapon.cursed=Si può percepire una magia malevola che si annida in quest'arma.
items.weapon.weapon.cursed_worn=Poiché quest'arma è maledetta, non hai il potere di rimuoverla.
items.weapon.weapon.enchant_hardened=È stato _indurito_
items.weapon.weapon.enchanted=ha un _%s._
items.weapon.weapon.excess_str=Grazie alla tua forza eccessiva, infliggerai _0-%d danni bonus_ con quest'arma.
items.weapon.weapon.faster=È potenziato per migliorare la velocità.
items.weapon.weapon.hardened_no_enchant=Quest'arma è stata temprata, ma al momento non è incantata.
items.weapon.weapon.hardening_gone=L'indurimento di quest'arma si è consumato!
items.weapon.weapon.identify=Ora hai sufficiente familiarità con la tua arma per identificarla.
items.weapon.weapon.incompatible=L'interazione di diversi tipi di magia ha annullato l'incantesimo su quest'arma!
items.weapon.weapon.not_cursed=Quest'arma è esente da magia malevola.
items.weapon.weapon.stronger=È potenziato per aumentare il danno.
items.weapon.weapon.too_heavy=A causa della tua forza insufficiente, quest'arma limiterà la tua velocità d'attacco, la tua precisione e la tua capacità di sorprendere gli avversari.
items.weapon.weapon.weak_cursed=Nonostante la maledizione, è possibile disequipaggiare quest'arma.

items.keys.skeletonkey.desc=Questa chiave ha un aspetto serio: la sua testa ha la forma di un teschio. Probabilmente può aprire qualche porta importante.
items.weapon.missiles.bombarrow.desc=Una freccia con una bomba attaccata. Mantieni le distanze.
items.weapon.missiles.bombarrow.name=freccia bomba
items.weapon.missiles.missileweapon.damage_desc=Quest'arma infligge da _%1$d_ a _%2$d_ danni per colpo.
items.bags.seedpouch.desc=Questa piccola borsa di velluto può contenere qualsiasi quantità di semi. Molto comoda.
items.bags.seedpouch.name=bustina di semi
items.potions.potionofmight.desc=Questo potente liquido scorre nei tuoi muscoli, aumentando permanentemente la forza di un punto e la salute di cinque.
items.potions.potionofmight.name=Pozione di Potere
items.rings.ringofdetection.desc=Questo anello permette di notare trappole e porte segrete senza fermarsi a cercare. Se degradato, intorpidisce i sensi e rende più difficile scoprire i segreti, anche cercandoli attivamente.
items.rings.ringofdetection.name=Anello di rilevamento
items.rings.ringofhaggler.desc=Questo anello non ha alcun potere magico, ma indica ai mercanti che chi lo porta appartiene alla Gilda dei Ladri. Di solito concedono volentieri uno sconto in cambio della promessa di essere lasciati in pace per un po'. Potenziare l'anello non offre altri vantaggi.
items.rings.ringofhaggler.name=Anello del Contrattatore
items.rings.ringofherbalism.desc=Questo anello aumenta le probabilità di raccogliere rugiada e semi calpestando l'erba.
items.rings.ringofherbalism.name=Anello dell'erboristeria
items.rings.ringofmending.desc=Questo anello migliora la rigenerazione del corpo e permette di recuperare più in fretta la salute perduta. Un anello degradato rallenta o addirittura blocca la rigenerazione naturale.
items.rings.ringofmending.name=anello della rigenerazione
items.rings.ringofpower.desc=Il campo d'energia emanato da questo anello rende più potenti le tue bacchette. Un anello degradato, invece, le indebolisce.
items.rings.ringofpower.name=Anello del Potere
items.rings.ringofsatiety.desc=Con questo anello puoi stare più a lungo senza mangiare. Un anello degradato ha l'effetto opposto.
items.rings.ringofsatiety.name=Anello di sazietà
items.rings.ringofshadows.desc=Se indossi questo anello, i nemici avranno meno probabilità di notarti. Gli anelli d'ombra sbiaditi allerteranno i nemici che altrimenti non si sarebbero accorti della tua presenza.
items.rings.ringofshadows.name=Anello d'ombre
items.rings.ringofthorns.desc=Questo anello non ha vere spine, ma ogni nemico che ti attacca subisce una parte del danno che ti infligge. Potenziarlo non offre altri vantaggi.
items.rings.ringofthorns.name=Anello di spine
items.scrolls.scrollofchallenge.desc=Se letto ad alta voce, questo rotolo scatenerà un ruggito minaccioso che risveglierà tutti i mostri e li avviserà della posizione del lettore.
items.scrolls.scrollofchallenge.name=pergamena della sfida
items.scrolls.scrollofenchantment.desc=Questa pergamena è in grado di infondere un'arma o un'armatura con un incantesimo casuale, conferendo loro un potere speciale.
items.scrolls.scrollofenchantment.name=pergamena di incantamento
items.scrolls.scrollofpsionicblast.desc=Questa pergamena contiene energia distruttiva che può essere incanalata psionicamente per infliggere danni ingenti a tutte le creature entro un campo visivo. Un lampo di luce concomitante accecherà temporaneamente tutti coloro che si trovano nell'area d'effetto, incluso chi legge la pergamena.
items.scrolls.scrollofpsionicblast.name=pergamena dell'esplosione psionica
items.scrolls.scrollofwipeout.desc=Leggi questa pergamena per scatenare l'ira degli spiriti del dungeon, uccidendo tutto ciò che si trova nel livello attuale. Beh, quasi tutto. Alcune delle creature più potenti potrebbero non essere influenzate.
items.scrolls.scrollofwipeout.name=pergamena di annientamento
items.wands.wandofblink.desc=Questa bacchetta permette di teletrasportarti nella direzione scelta. Le creature e gli ostacoli bloccano il teletrasporto.
items.wands.wandofblink.name=bacchetta del teletrasporto
items.wands.wandoffirebolt.desc=Questa bacchetta scaglia fiammate magiche. Incendia il terreno infiammabile e ferisce e brucia le creature colpite.
items.wands.wandoffirebolt.name=bacchetta del dardo di fuoco
