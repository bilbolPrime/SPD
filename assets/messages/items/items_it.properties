items.weapon.melee.roundshield$guardtracker.name=guardia
items.weapon.melee.roundshield.ability_desc=Il Duellante può proteggersi con uno scudo rotondo, annullando completamente tutti gli attacchi fisici o magici diretti contro di lui per _%d turni_. Una volta che il Duellante ha bloccato un attacco, contrattaccare o usare la magia porrà fine alla protezione.
items.weapon.melee.roundshield.ability_name=guardia
items.weapon.melee.roundshield.desc=Questo grande scudo blocca efficacemente gli attacchi e, all'occorrenza, si rivela un'arma discreta.
items.weapon.melee.roundshield.name=scudo rotondo
items.weapon.melee.roundshield.stats_desc=Quest'arma blocca 0-%d danni. Questa capacità di blocco aumenta con i potenziamenti.
items.weapon.melee.roundshield.typical_ability_desc=Il Duellante può proteggersi con uno scudo rotondo, annullando completamente tutti gli attacchi fisici o magici diretti contro di lui, in genere per _%d turni_. Una volta che il Duellante ha bloccato un attacco, contrattaccare o usare la magia porrà fine alla protezione.
items.weapon.melee.roundshield.typical_stats_desc=In genere quest'arma blocca 0-%d danni. Questa capacità di blocco aumenta con i potenziamenti.
