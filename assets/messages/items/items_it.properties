items.armor.classarmor.charge_use=L'utilizzo di questa abilità in questo momento consumerà la carica _%s_.
items.armor.classarmor.discover_hint=Puoi trovare questo oggetto dopo aver sconfitto il boss del ventesimo piano con uno specifico eroe.
items.armor.classarmor.low_charge=L'armatura non ha abbastanza carica per usare il suo potere speciale!
items.armor.classarmor.no_ability=La tua armatura al momento non ha alcuna abilità, dovresti sceglierne una!
items.armor.classarmor.not_equipped=Devi indossare quest'armatura per poter usare il suo potere speciale!
