items.weapon.melee.flail$spinabilitytracker.desc=La Duellante sta facendo roteare il suo flagello, accumulando danni per il suo prossimo attacco normale. Ogni rotazione richiede un turno ma aumenta il danno, fino a un massimo di tre rotazioni. Il flagello è inoltre garantito per colpire mentre ruota.\n\nRotazioni attuali: %1$d%%.\nTurni rimanenti: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=filatura
items.weapon.melee.flail.ability_desc=Il Duellante può far roteare un flagello per accumulare energia per un breve periodo. Ogni turno in cui il flagello viene fatto roteare, infliggerà +%d danni al suo prossimo attacco normale, fino a un massimo di 3 volte. Un flagello rotante ha inoltre la garanzia di colpire. Solo l'avvio della rotazione del flagello costa una carica.
items.weapon.melee.flail.ability_name=rotazione
items.weapon.melee.flail.desc=Una palla chiodata attaccata a un manico tramite una catena. Molto difficile da maneggiare, ma devastante se colpisce nel segno.
items.weapon.melee.flail.name=flagello
items.weapon.melee.flail.spin_warn=Non puoi più far girare il flagello.
items.weapon.melee.flail.stats_desc=Quest'arma è piuttosto imprecisa. \n Quest'arma non può sferrare un attacco a sorpresa.
items.weapon.melee.flail.typical_ability_desc=Il Duellante può far roteare un flagello per accumulare energia per un breve periodo. Ogni turno in cui il flagello viene fatto roteare, infliggerà in genere +%d danni con il suo prossimo attacco normale, fino a un massimo di 3 volte. Un flagello rotante ha anche la garanzia di colpire. Solo l'avvio della rotazione del flagello costa una carica.
items.weapon.melee.gauntlet.ability_desc=Il Duellante può eseguire un _colpo combinato_ con un guanto di pietra. Questo attacco è garantito e infligge _+%d danni_ per ogni volta che il Duellante ha colpito con un attacco normale in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gauntlet.ability_name=attacco combinato
items.weapon.melee.gauntlet.desc=Questo enorme guanto è fatto di tessuto cremisi con pesanti strati di pietra magica sopra. Il tessuto si stringe intorno a te, rendendo le spesse piastre di pietra quasi una seconda pelle. Brandire un'arma così pesante richiede forza, ma conferisce una potenza tremenda ai tuoi colpi.
items.weapon.melee.gauntlet.name=guanto di pietra
items.weapon.melee.gauntlet.stats_desc=Si tratta di un'arma molto veloce.
items.weapon.melee.gauntlet.typical_ability_desc=Il Duellante può eseguire un _colpo combinato_ con un guanto di pietra. Questo attacco è garantito e infligge in genere _+%d danni_ per ogni volta che il Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.glaive.ability_desc=Il Duellante può usare la punta di una falce per _colpire_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.weapon.melee.glaive.ability_name=arpione
items.weapon.melee.glaive.desc=Una massiccia arma inastata composta da una lama di spada all'estremità di un'asta.
items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Questa è un'arma piuttosto lenta.\nQuest'arma ha una portata maggiore.
items.weapon.melee.glaive.typical_ability_desc=Il Duellante può usare la punta di una falce per _colpire_ un nemico che si trova nel raggio d'azione ma non adiacente. Questo infligge in genere _%1$d-%2$d danni_, respinge il nemico ed è garantito che colpisca.
items.weapon.melee.gloves.ability_desc=Il Duellante può eseguire un _colpo combinato_ con i guanti borchiati. Questo attacco è garantito e infligge _+%d danni_ per ogni volta che il Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.gloves.ability_name=attacco combinato
items.weapon.melee.gloves.desc=Questi guanti borchiati non offrono una vera protezione, ma fungono da arma improvvisata lasciando le mani libere.
items.weapon.melee.gloves.discover_hint=Uno degli eroi inizia con questo oggetto.
items.weapon.melee.gloves.name=guanti borchiati
items.weapon.melee.gloves.stats_desc=Si tratta di un'arma molto veloce.
items.weapon.melee.gloves.typical_ability_desc=Il Duellante può eseguire un _colpo combinato_ con i guanti borchiati. Questo attacco è garantito e infligge in genere _+%d danni_ per ogni volta che il Duellante ha colpito con un normale attacco in mischia o con un'arma da lancio. Non colpire per 5 turni azzera questa combo.
items.weapon.melee.greataxe.ability_desc=La Duellante può eseguire un attacco di _ritorsione_ con un'ascia bipenne se ha meno di 50%% punti salute. Questo attacco devastante infligge _%1$d-%2$d danni_, è garantito che colpisca ed è istantaneo se uccide un nemico.
items.weapon.melee.greataxe.ability_name=retribuzione
items.weapon.melee.greataxe.desc=Pensata per essere portata a spalla, quest'ascia titanica è tanto potente quanto pesante.
items.weapon.melee.greataxe.name=ascia bipenne
items.weapon.melee.greataxe.stats_desc=Quest'arma è incredibilmente pesante.
items.weapon.melee.greataxe.typical_ability_desc=La Duellante può eseguire un attacco di _ritorsione_ con un'ascia bipenne se ha meno di 50%% punti salute. Questo attacco devastante infligge in genere _%1$d-%2$d danni_, è garantito che colpisca ed è istantaneo se uccide un nemico.
items.weapon.melee.greatshield.ability_desc=Il Duellante può proteggersi con un grande scudo, annullando completamente tutti gli attacchi fisici o magici diretti contro di lui per _%d turni_. Una volta che il Duellante ha bloccato un attacco, contrattaccare o usare la magia porrà fine alla protezione.
items.weapon.melee.greatshield.ability_name=guardia
items.weapon.melee.greatshield.desc=Più simile a un muro mobile che a uno scudo, questa gigantesca massa di metallo favorisce la difesa, ma non lascia molto spazio per attaccare.
items.weapon.melee.greatshield.name=grande scudo
items.weapon.melee.greatshield.stats_desc=Quest'arma blocca 0-%d danni. Questa capacità di blocco aumenta con i potenziamenti.
items.weapon.melee.greatshield.typical_ability_desc=Il Duellante può proteggersi con un grande scudo, annullando completamente tutti gli attacchi fisici o magici diretti contro di lui, in genere per _%d turni_. Una volta che il Duellante ha bloccato un attacco, contrattaccare o usare la magia porrà fine alla protezione.
items.weapon.melee.greatshield.typical_stats_desc=In genere quest'arma blocca 0-%d danni. Questa capacità di blocco aumenta con i potenziamenti.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Durata dell'abilità
items.weapon.melee.greatsword.ability_desc=Il Duellante può _fendere_ un nemico con uno spadone. Questo infligge _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.greatsword.ability_name=spaccare
items.weapon.melee.greatsword.desc=Questa lama imponente infligge danni ingenti investendo tutto il suo peso in ogni colpo.
items.weapon.melee.greatsword.name=spada a due mani
items.weapon.melee.greatsword.typical_ability_desc=Il Duellante può _fendere_ un nemico con uno spadone. Questo infligge in genere _%1$d-%2$d danni_ ed è garantito che colpisca. Se fendere uccide un nemico, l'effetto è istantaneo e il Duellante può usare di nuovo fendere entro 5 turni gratuitamente.
items.weapon.melee.handaxe.ability_desc=Il Duellante può eseguire un _colpo pesante_ con un'ascia a mano. Questo attacco concentrato infligge _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.handaxe.ability_name=colpo pesante
items.weapon.melee.handaxe.desc=Un'ascia leggera, comunemente usata per abbattere alberi. La lama larga si rivela efficace anche contro i nemici.
items.weapon.melee.handaxe.name=ascia a mano
items.weapon.melee.handaxe.stats_desc=Si tratta di un'arma piuttosto precisa.
items.weapon.melee.handaxe.typical_ability_desc=Il Duellante può eseguire un _colpo pesante_ con un'ascia a mano. Questo attacco concentrato infligge in genere _%1$d-%2$d danni_ se coglie di sorpresa il nemico e lo stordisce per 5 turni, riducendo precisione ed elusione di 50%%. Il colpo pesante colpisce sempre, ma infligge danni normali se non coglie di sorpresa il nemico.
items.weapon.melee.katana.ability_desc=Il Duellante può _affondare_ con una katana contro un nemico a 1 casella di distanza. Questo si muove verso il nemico, infligge _%1$d-%2$d danni_ ed è garantito che colpisca.
