items.amulet.ac_end=FINE DEL GIOCO
items.amulet.ascent_desc=Inizi a sentire il grande e terribile potere di Yog-Dzewa irradiarsi dall'amuleto. Risalire attraverso il dungeon come mortale potrebbe essere più difficile di quanto pensassi! Se continui a salire con l'amuleto, il dungeon diventerà più pericoloso, i teletrasporti tra i piani saranno disabilitati e potrai vincere la partita solo sconfiggendo i nemici mentre sali attraverso il dungeon! Puoi lasciare l'amuleto qui per ora se vuoi salire senza iniziare questa sfida, oppure attivare l'amuleto prima di salire per terminare la partita normalmente.
items.amulet.ascent_no=Fermatevi per ora.
items.amulet.ascent_title=Ascensione
items.amulet.ascent_yes=Continuare!
items.amulet.desc=L'Amuleto di Yendor è il manufatto più potente conosciuto dagli umani e dai nani. I suoi cristalli scintillanti racchiudono un potere incredibile e meraviglioso.
items.amulet.desc_ascent=Le origini dell'amuleto sono sconosciute, ma è evidente che sia stato fortemente influenzato dal potere di Yog-Dzewa. Il dungeon sembra piegarsi alla volontà di Yog mentre lo attraversi, rendendo i nemici molto più numerosi e potenti! Inoltre, non sei più in grado di attivare o scartare l'amuleto, quasi come se fosse maledetto.
items.amulet.desc_origins=Le origini dell'amuleto sono ignote. La storia narra che il Re dei Nani si vantò di averlo scoperto poco prima che la civiltà nanica interrompesse ogni contatto. Come lo trovò? Come fece Yog-Dzewa a sottrarglielo? Domande a cui forse risponderemo un'altra volta, l'importante ora è che l'amuleto sia tuo!
items.amulet.discover_hint=Puoi trovare questo oggetto in fondo al dungeon...
items.amulet.name=amuleto di Yendor
items.ankh.ac_bless=benedire
items.ankh.bless=Benedici l'ankh con acqua magica.
items.ankh.desc=Questo antico simbolo d'immortalità permette di tornare in vita dopo la morte. Alla resurrezione, tutti gli oggetti non equipaggiati vanno perduti.
items.ankh.desc_blessed=Questo antico simbolo di immortalità conferisce la capacità di tornare in vita dopo la morte. L'ankh è stato benedetto ed è ora molto più potente. L'ankh si sacrificherà per salvarti in un momento di pericolo mortale.
items.ankh.discover_hint=Puoi acquistare questo articolo in un negozio.
items.ankh.name=ankh
items.arcaneresin.ac_apply=FARE DOMANDA A
items.arcaneresin.apply=Ricopri la tua bacchetta con la resina, aumentandone il potere!
items.arcaneresin.desc=Questa polvere finissima luccica tra le sfumature del viola e del bianco. Può agire come un amplificatore di energie magiche, aumentando il livello delle bacchette quando viene applicata ad esse! L'aggiornamento di una bacchetta costa 1, 2 o 3 unità di resina a seconda del livello iniziale della bacchetta. La resina può potenziare le bacchette fino a un massimo di +3. Gli aggiornamenti in resina vengono tuttavia sovrascritti da altre fonti di potenziamento (come le pergamene di potenziamento) e non si applicano quando si infonde una bacchetta nel bastone del Mago.
items.arcaneresin.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.arcaneresin.level_too_high=Quella bacchetta è troppo potente perché la resina possa migliorarla.
items.arcaneresin.name=resina arcana
items.arcaneresin.not_enough=Non hai abbastanza resina per farlo!
items.arcaneresin.prompt=Seleziona una bacchetta
