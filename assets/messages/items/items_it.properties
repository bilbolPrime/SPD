items.armor.armor.avg_absorb=In genere, questa armatura di livello _tier-%1$d_ blocca i danni di _%2$d-%3$d_ e richiede una forza di _%4$d_ per essere utilizzata correttamente.
items.armor.armor.curr_absorb=Questa armatura di livello _%1$d_ blocca i danni di _%2$d-%3$d_ e richiede _%4$d forza_ per essere utilizzata correttamente.
items.armor.armor.cursed=Si può percepire una magia malevola che si annida all'interno di quest'armatura.
items.armor.armor.cursed_worn=Poiché quest'armatura è maledetta, non hai il potere di rimuoverla.
items.armor.armor.defense=È potenziato per migliorare la difesa.
items.armor.armor.detach_seal=Stacchi il sigillo dalla tua armatura.
items.armor.armor.equip_cursed=L'armatura ti stringe dolorosamente intorno.
items.armor.armor.evasion=È potenziato per migliorare l'_evasione_
items.armor.armor.excess_str=Grazie alla tua forza eccessiva, sei più agile e sfuggente quando indossi quest'armatura.
items.armor.armor.glyph_hardened=È stato _indurito_
items.armor.armor.hardened_no_glyph=Questa armatura è stata indurita, ma al momento non reca alcun glifo inciso.
items.armor.armor.hardening_gone=Lo strato protettivo di questa armatura si è consumato!
items.armor.armor.identify=Ora conosci la tua armatura a sufficienza per identificarla.
items.armor.armor.incompatible=L'interazione di diversi tipi di magia ha cancellato il glifo da quest'armatura!
items.armor.armor.inscribed=reca l'iscrizione _%s._
items.armor.armor.not_cursed=Quest'armatura è immune alla magia maligna.
items.armor.armor.probably_too_heavy=Probabilmente quest'armatura è troppo pesante per te.
items.armor.armor.seal_attached=Il sigillo spezzato del Guerriero è attaccato a questa armatura. Quando sta per subire danni e la sua salute scende al di sotto della metà, gli conferirà uno scudo _%d_.
items.armor.armor.seal_transfer=Il sigillo rotto del Guerriero deve essere applicato all'armatura che indossa attualmente per potergli apportare beneficio. Desideri rimuovere automaticamente il sigillo dall'armatura che stai togliendo e applicarlo all'armatura che stai equipaggiando?
items.armor.armor.seal_transfer_no=NO
items.armor.armor.seal_transfer_yes=SÌ
items.armor.armor.too_heavy=A causa della tua forza insufficiente, indossare quest'armatura ridurrà la tua capacità di muoverti, schivare e difenderti.
items.armor.armor.weak_cursed=Nonostante la maledizione, è possibile togliere quest'armatura.
