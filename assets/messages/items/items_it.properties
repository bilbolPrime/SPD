items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbarico
items.weapon.weaponeffects.weaponeffect.smite.name=%s del barbaro
items.weapon.weaponeffects.weaponeffect.smite.desc=Quest'arma è _barbarica_. Ogni colpo ha il _20%_ di probabilità di attivare _Punizione di livello 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Punizione!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Repulsivo
items.weapon.weaponeffects.weaponeffect.knockback.name=%s della repulsione
items.weapon.weaponeffects.weaponeffect.knockback.desc=Quest'arma è _repulsiva_. Ogni colpo ha il _20%_ di probabilità di respingere il nemico di _una casella_. I boss non possono essere respinti.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Respinta!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Serpentino
items.weapon.weaponeffects.weaponeffect.venom.name=%s del serpente
items.weapon.weaponeffects.weaponeffect.venom.desc=Quest'arma è _serpentina_. Ogni colpo ha il _20%_ di probabilità di avvelenare il bersaglio.
items.weapon.weaponeffects.weaponeffect.venom.activate=Veleno!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Storpiatore
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s dello storpiamento
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Quest'arma è _storpiatrice_. I colpi a distanza andati a segno hanno il _20%_ di probabilità di azzoppare il nemico per _10 turni_. I boss sono immuni.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Zoppia!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Runico
items.weapon.weaponeffects.weaponeffect.spark.name=%s delle rune
items.weapon.weaponeffects.weaponeffect.spark.desc=Questa bacchetta è _runica_. La sua magia ha il _20%_ di probabilità di attivare _Scintilla_, infliggendo _4–8_ danni magici aggiuntivi.
items.weapon.weaponeffects.weaponeffect.spark.activate=Scintilla!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Malefico
items.weapon.weaponeffects.weaponeffect.curse.name=%s del maleficio
items.weapon.weaponeffects.weaponeffect.curse.desc=Questa bacchetta è _malefica_. La sua magia ha il _20%_ di probabilità di indebolire il bersaglio, riducendone i danni del _5%_ per _10 turni_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Maledizione!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Drenante
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s del risucchio
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Questa bacchetta è _drenante_. La sua magia ha il _20%_ di probabilità di attivare _Risucchio vitale_, infliggendo _8–16_ danni magici aggiuntivi e curandoti della vita sottratta.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Risucchio!

items.armor.armorprefix.stalwart.name=%s tenace
items.armor.armorprefix.stalwart.desc=Quest'armatura è _tenace_. Gli attacchi nemici hanno il _20%_ di probabilità di attivare _Robustezza di livello 5_, riducendo i danni del _20%_.
items.armor.armorprefix.stalwart.activate=Robustezza!

items.armor.armorprefix.vigilant.name=%s vigile
items.armor.armorprefix.vigilant.desc=Quest'armatura è _vigile_. Ti dà il _20%_ di probabilità di schivare un attacco nemico a distanza.
items.armor.armorprefix.vigilant.activate=Percezione!

items.armor.armorprefix.elusive.name=%s sfuggente
items.armor.armorprefix.elusive.desc=Quest'armatura è _sfuggente_. Subire danni da un attacco nemico ha il _20%_ di probabilità di aumentare la tua evasione di _5_ per _5 turni_.
items.armor.armorprefix.elusive.activate=Evasione!
