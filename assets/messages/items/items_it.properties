items.armor.clericarmor.desc=Indossando questo misto di stoffa e armatura, il Chierico può eseguire un'abilità speciale.
items.armor.clericarmor.name=vesti da eroe
items.armor.clotharmor.desc=Questa armatura leggera offre una protezione di base.
items.armor.clotharmor.discover_hint=Uno degli eroi inizia con questo oggetto.
items.armor.clotharmor.name=armatura di stoffa
items.armor.curses.antientropy.desc=La maledizione anti-entropia agisce contro le forze dell'universo, attirando energia verso chi la indossa e allontanandola dall'ambiente circostante. Questo incendia brevemente chi la indossa, ma congela tutto ciò che lo circonda!
items.armor.curses.antientropy.name=%s di anti-entropia
items.armor.curses.bulk.desc=Le armature voluminose sembrano più grandi e imponenti, ma in realtà non offrono una difesa migliore. Anzi, le dimensioni maggiori rendono molto difficile attraversare le porte.
items.armor.curses.bulk.name=%s di massa
items.armor.curses.corrosion.desc=La corazza anticorrosione è in grado di rompersi rilasciando un fluido corrosivo, ricoprendo tutto ciò che si trova nelle vicinanze con una melma appiccicosa e acida.
items.armor.curses.corrosion.name=%s di corrosione
items.armor.curses.displacement.desc=La maledizione dello spostamento tenta di mettere in salvo chi la indossa quando viene attaccato. È fin troppo efficace, però, teletrasportando casualmente l'utilizzatore in giro per il livello.
items.armor.curses.displacement.name=%s di spostamento
items.armor.curses.metabolism.desc=La maledizione del metabolismo converte direttamente la sazietà in salute quando chi la indossa è ferito, fornendo una spinta alla guarigione, ma causando rapidamente la fame.
items.armor.curses.metabolism.name=%s del metabolismo
items.armor.curses.multiplicity.desc=Un'armatura maledetta dalla molteplicità contiene una pericolosa magia di duplicazione. A volte creerà un'immagine speculare di chi la indossa, ma è altrettanto probabile che duplichi l'attaccante!
items.armor.curses.multiplicity.name=%s di molteplicità
items.armor.curses.overgrowth.desc=L'armatura di vegetazione lussureggiante è ricoperta da varie piante fiorite. Sebbene questo effetto sia indubbiamente interessante, non offre alcun vantaggio in termini di difesa e queste piante si attiveranno casualmente durante il combattimento!
items.armor.curses.overgrowth.name=%s di crescita eccessiva
items.armor.curses.stench.desc=Un'armatura maledetta da un fetore rilascerà nuvole di gas nocivo, pericolose per tutto ciò che si trova nel raggio d'azione della nube.
items.armor.curses.stench.name=%s di puzza
items.armor.duelistarmor.desc=Indossando questa armatura e questo mantello, il Duellante può eseguire un'abilità speciale.
items.armor.duelistarmor.name=corazza dell'eroe
items.armor.glyphs.affection.desc=Questo potente glifo manipola la mente degli aggressori, affascinandoli temporaneamente.
items.armor.glyphs.affection.name=%s di affetto
items.armor.glyphs.antimagic.desc=Questo potente glifo permette all'armatura di difendere chi la indossa sia dagli attacchi magici che da quelli fisici. Questa difesa magica non è influenzata dal livello dell'armatura.
items.armor.glyphs.antimagic.name=%s di anti-magia
items.armor.glyphs.brimstone.desc=Questo glifo protegge chi lo indossa e i suoi averi dal fuoco, annullandone completamente i danni e gli effetti negativi.
items.armor.glyphs.brimstone.name=%s di zolfo
items.armor.glyphs.camouflage.desc=Questo glifo permette a chi lo indossa di mimetizzarsi nell'erba alta, garantendogli un'invisibilità temporanea.
items.armor.glyphs.camouflage.name=%s di mimetizzazione
items.armor.glyphs.entanglement.desc=Questo glifo fa crescere un'armatura di terra attorno a chi lo indossa per assorbire i danni, ma quest'armatura si romperà se chi la indossa si muove.
items.armor.glyphs.entanglement.name=%s di intreccio
items.armor.glyphs.flow.desc=Questo glifo manipola il flusso dell'acqua intorno a chi lo indossa, rendendolo molto più veloce quando si muove al suo interno.
items.armor.glyphs.flow.name=%s di flusso
items.armor.glyphs.obfuscation.desc=Questo glifo oscura chi lo indossa, rendendolo più difficile da individuare.
items.armor.glyphs.obfuscation.name=%s di offuscamento
items.armor.glyphs.potential.desc=Questo glifo accumula energia quando viene colpito, fornendo carica alla bacchetta di chi lo indossa quando viene attivato.
items.armor.glyphs.potential.name=%s di potenziale
items.armor.glyphs.repulsion.desc=Questo glifo respinge la forza degli aggressori, scaraventandoli indietro.
items.armor.glyphs.repulsion.name=%s di repulsione
items.armor.glyphs.stone.desc=Questo glifo avvolge l'armatura con una pesante pietra magica che rende impossibile schivare, ma blocca i danni in proporzione all'evasione.
items.armor.glyphs.stone.name=%s di pietra
items.armor.glyphs.swiftness.desc=Questo glifo aumenta la velocità di chi lo indossa quando non si trova vicino a un nemico.
items.armor.glyphs.swiftness.name=%s di rapidità
items.armor.glyphs.thorns.desc=Questo potente glifo danneggia gli aggressori, facendoli sanguinare lentamente quando attaccano chi lo indossa.
items.armor.glyphs.thorns.name=%s di spine
items.armor.glyphs.viscosity$defereddamage.desc=Il danno viene inflitto lentamente nel tempo invece che immediatamente.\n\nDanno differito rimanente: %d.
items.armor.glyphs.viscosity$defereddamage.name=danni differiti
items.armor.glyphs.viscosity$defereddamage.ondeath=Il danno differito ti ha ucciso...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Ucciso da danni differiti
items.armor.glyphs.viscosity.deferred=differito ZZQPH0ZXQ
items.armor.glyphs.viscosity.desc=Questo glifo è in grado di immagazzinare i danni inflitti a chi lo indossa, distribuendoli gradualmente anziché tutti in una volta.
items.armor.glyphs.viscosity.name=%s di viscosità
items.armor.huntressarmor.desc=Indossando questo mantello, la Cacciatrice può eseguire un'abilità speciale.
items.armor.huntressarmor.name=mantello dell'eroe
items.armor.huntressarmor.no_enemies=Nessun nemico in vista
items.armor.leatherarmor.desc=Armatura realizzata con pelle di mostro conciata. Non è leggera come un'armatura di stoffa, ma offre una protezione migliore.
items.armor.leatherarmor.name=armatura di cuoio
items.armor.magearmor.desc=Indossando questa splendida veste, il Mago può eseguire un'abilità speciale.
items.armor.magearmor.name=veste dell'eroe
items.armor.mailarmor.desc=Le maglie metalliche ad incastro creano un'armatura robusta ma flessibile.
items.armor.mailarmor.name=armatura a maglia
items.armor.platearmor.desc=Enormi piastre di metallo sono unite tra loro a formare un'armatura che offre una protezione impareggiabile a qualsiasi avventuriero abbastanza forte da sopportarne il peso impressionante.
items.armor.platearmor.name=armatura a piastre
items.armor.roguearmor.desc=Indossando questi abiti scuri, il Ladro può eseguire un'abilità speciale.
items.armor.roguearmor.name=abito da eroe
items.armor.scalearmor.desc=Le scaglie metalliche cucite su un gilet di cuoio creano un'armatura flessibile ma protettiva.
items.armor.scalearmor.name=armatura a scaglie
items.armor.warriorarmor.desc=Indossando questa pesante armatura a piastre, il Guerriero può eseguire un'abilità speciale.
items.armor.warriorarmor.name=cotta di maglia dell'eroe
items.artifacts.alchemiststoolkit.ac_brew=BIRRA
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZZARE
items.artifacts.alchemiststoolkit.cursed=Il tuo kit maledetto ti impedisce di usare l'alchimia!
items.artifacts.alchemiststoolkit.desc=Questo kit contiene diversi reagenti ed erbe, insieme a una piccola fiala per la miscelazione, che permette di praticare l'alchimia ovunque ci si trovi. La fiala contiene ciò che sembra essere un cristallo di energia alchemica in forma liquida.
items.artifacts.alchemiststoolkit.desc_cursed=Il maledetto kit di attrezzi si è legato a te e ti impedisce di usare l'alchimia.
items.artifacts.alchemiststoolkit.desc_hint=Il kit di strumenti in dotazione genera lentamente energia alchemica man mano che acquisisci esperienza. Sembra che la miscela nella fiala possa essere potenziata aggiungendovi dei cristalli energetici.
items.artifacts.alchemiststoolkit.desc_warming=Il kit di strumenti si sta attualmente riscaldando e sarà pronto per l'uso tra poco.
items.artifacts.alchemiststoolkit.energize_1=6 energia: +1 livello
items.artifacts.alchemiststoolkit.energize_all=Energia %1$d: livelli +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Ogni 6 cristalli di energia forniranno al kit di strumenti energia sufficiente per salire di livello, il che aumenta la velocità con cui il kit di strumenti genera energia nel tempo e la velocità con cui si riscalda.\n\nQuanta energia desideri utilizzare?
items.artifacts.alchemiststoolkit.name=kit dell'alchimista
items.artifacts.alchemiststoolkit.need_energy=Per farlo ti servono almeno 6 punti energia.
items.artifacts.alchemiststoolkit.not_ready=Il tuo kit di strumenti non si è ancora riscaldato completamente.
items.artifacts.artifact.cannot_wear_two=Non è possibile indossare due manufatti identici.
items.artifacts.artifact.curse_known=Si può percepire una magia malevola che si annida all'interno del manufatto.
items.artifacts.artifact.equip_cursed=L'artefatto si lega dolorosamente a te.
items.artifacts.artifact.need_to_equip=Per farlo, devi equipaggiare il tuo artefatto.
items.artifacts.artifact.not_cursed=Questo artefatto è esente da magia malevola.
items.artifacts.capeofthorns$thorns.desc=Il tuo mantello irradia energia, avvolgendoti in un campo di forza deflettrice!\n\nTutti i danni che ricevi sono ridotti finché l'effetto delle spine è attivo. Inoltre, se l'attaccante è vicino a te, la quantità ridotta viene riflessa verso l'attaccante.\n\nTurni di spine rimanenti: %s.
items.artifacts.capeofthorns$thorns.inert=Il tuo mantello torna ad essere inerte.
items.artifacts.capeofthorns$thorns.levelup=Il tuo mantello diventa sempre più forte!
items.artifacts.capeofthorns$thorns.name=spine
items.artifacts.capeofthorns$thorns.radiating=Il tuo mantello inizia a irradiare energia, ti senti protetto!
items.artifacts.capeofthorns.desc=Questi frammenti di metallo collassati provenienti dal DM-300 si sono uniti a formare un mantello rigido. Sembra che immagazzini un'energia profonda, forse possiede parte del potere del DM-300?
items.artifacts.capeofthorns.desc_active=Il mantello sembra rilasciare energia accumulata, irradiando un potere protettivo.
items.artifacts.capeofthorns.desc_inactive=Il mantello, con la sua rassicurante pesantezza sulle spalle, sembra trarne energia dai danni che subisci.
items.artifacts.capeofthorns.name=Capo di spine
items.artifacts.chaliceofblood.ac_prick=PUNTURA
items.artifacts.chaliceofblood.desc=Questo calice d'argento splendente è stranamente ornato da gemme appuntite sul bordo.
items.artifacts.chaliceofblood.desc_1=Mentre tieni in mano il calice, senti uno strano impulso a pungerti con le gemme appuntite.
items.artifacts.chaliceofblood.desc_2=Parte del tuo sangue si raccoglie nel calice, puoi sentire sottilmente il calice che ti infonde energia vitale, accelerando la tua naturale rigenerazione. Desideri comunque tagliarti sul calice, pur sapendo che farà male.
items.artifacts.chaliceofblood.desc_3=Il calice è colmo fino all'orlo della tua essenza vitale. Puoi sentire il calice riversare energia vitale in te.
items.artifacts.chaliceofblood.desc_cursed=Il calice maledetto si è legato alla tua mano e sta inibendo la tua capacità di rigenerare la salute.
items.artifacts.chaliceofblood.name=calice di sangue
items.artifacts.chaliceofblood.no=No, ho cambiato idea.
items.artifacts.chaliceofblood.ondeath=Il Calice ti prosciuga l'essenza vitale...
items.artifacts.chaliceofblood.onprick=Ti pungi e la tua essenza vitale si riversa nel calice.
items.artifacts.chaliceofblood.prick_warn=Ogni volta che usi il calice, consumerà più energia vitale, ma in cambio migliorerà ulteriormente la tua rigenerazione naturale della salute.\n\nAttualmente, pungersi infligge _%1$d-%2$d danni_, sebbene questo danno possa essere ridotto da _blocchi fisici e magici o riduzione del danno_. Senza considerare gli effetti di riduzione del danno, pungersi ha attualmente una _%3$s%% probabilità_ di prosciugare completamente la tua forza vitale.\n\nSei sicuro di voler offrire al calice più energia vitale?
items.artifacts.chaliceofblood.yes=Sì, so cosa sto facendo
items.artifacts.cloakofshadows$cloakstealth.desc=Il tuo mantello d'ombra ti conferisce invisibilità finché ne sei avvolto. Rimarrai invisibile finché non verrà annullato o finché la carica del mantello non si esaurirà. Mentre sei invisibile, i nemici non possono attaccarti o seguirti. Gli attacchi fisici e gli effetti magici (come pergamene e bacchette) annulleranno immediatamente l'invisibilità. Si attivano fino all'esaurimento della carica:
items.artifacts.cloakofshadows$cloakstealth.levelup=Il tuo mantello si rafforza!
items.artifacts.cloakofshadows$cloakstealth.name=avvolto nel mantello
items.artifacts.cloakofshadows$cloakstealth.no_charge=Il tuo mantello ha esaurito l'energia.
items.artifacts.cloakofshadows.ac_stealth=FURTIVITÀ
items.artifacts.cloakofshadows.cooldown=Il tuo mantello ha bisogno di %d round in più per ricaricarsi.
items.artifacts.cloakofshadows.cursed=Non puoi usare un mantello maledetto.
items.artifacts.cloakofshadows.desc=Un mantello magico di inestimabile valore, rubato molti anni fa dall'armeria reale dal Ladro. Quando indossato, può essere usato per diventare completamente invisibile per un breve periodo. Più il mantello viene usato, più diventerà potente, permettendo al Ladro di diventare invisibile più frequentemente e per periodi più lunghi.
items.artifacts.cloakofshadows.discover_hint=Uno degli eroi inizia con questo oggetto.
items.artifacts.cloakofshadows.name=mantello d'ombre
items.artifacts.cloakofshadows.no_charge=Il tuo mantello non si è ancora ricaricato a sufficienza per essere utilizzabile.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Come hai fatto a sopravvivere?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Vorrei averne uno anch'io...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh mio Dio! Sei ancora vivo!
items.artifacts.driedrose$ghosthero.def_verb=schivato
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Mi dispiace... buona fortuna...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finiscilo... senza di me...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... non posso...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Buona fortuna...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Stanco... per ora...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ritornerò...
items.artifacts.driedrose$ghosthero.desc=Una figura eterea dall'aspetto fragile, di forma umanoide. Il suo potere sembra legato alla rosa che possiedi. Questo fantasma potrebbe non essere granché, ma sembra essere il tuo unico vero amico quaggiù.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Perché sta succedendo questo? Pensavo che avessimo avuto successo.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Com'è possibile che quella cosa sia ancora in grado di influenzare il mondo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Spero tu sappia cosa stai facendo con quell'amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Suppongo che non abbiamo ancora finito.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Siamo già arrivati così lontano, possiamo farcela!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Ancora un po' e ce la faremo ad andarcene da qui!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Nessun umano o nano ha messo piede qui da moltissimo tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Cosa potrebbe spingere i nani ad abbandonare una miniera d'oro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=È un peccato che tutto l'oro qui presente sia inutile in superficie.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Le creature che vivono qui sono deformi, proprio come quelle che si trovano nelle fogne.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Persino i pipistrelli qui sono assetati di sangue.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Nessuna traccia di attrezzature minerarie, i nani si sono forse riappropriati di tutto?
items.artifacts.driedrose$ghosthero.dialogue_city_1=I nani erano laboriosi, ma avidi.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Quindi la metropoli nanica è davvero caduta.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Spero che la superficie non finisca mai come questo posto.
items.artifacts.driedrose$ghosthero.dialogue_city_4=I nani non dovrebbero avere un aspetto così pallido.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Non so cosa sia peggio, i nani o le loro creazioni.
items.artifacts.driedrose$ghosthero.dialogue_city_6=A quanto pare anche i nani sono diventati dei mostri senza cervello.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Che posto è questo?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Questo posto è terrificante...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=A cosa stavano pensando i nani, a giocare con il potere in questo modo?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=I mostri che si trovano qui sono ultraterreni, da dove vengono?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Lo senti? È come se qualcosa ci stesse osservando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Meno male che ci sono le torce, qui è così buio!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ho sentito delle storie su questo posto, niente di buono.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Questo posto è sempre stato più simile a una prigione sotterranea che a una vera e propria cella.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Non riesco a immaginare cosa sia successo quando questo posto è stato abbandonato.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Sembra che sia i prigionieri che le guardie si siano trasformati in mostri.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Quale potrebbe essere la causa di tutti questi scheletri?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Queste persone non dovevano finire così...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Un tempo queste fognature erano sicure, la gente ci viveva persino d'inverno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Mi chiedo che fine abbiano fatto le pattuglie di guardia, si sono arrese?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Avevo dei familiari in superficie, spero che stiano bene.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Le guardie non sono riuscite a sconfiggere questi mostri, ma forse noi ci riusciremo.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se persino le fogne sono così pericolose, chissà cosa si nasconde sotto...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Cosa potrebbe aver causato una crescita così imponente di questi ratti e granchi?
items.artifacts.driedrose$ghosthero.direct_prompt=Cosa dovrei fare?
items.artifacts.driedrose$ghosthero.directed_attack_1=Va bene, mi occuperò di quello.
items.artifacts.driedrose$ghosthero.directed_attack_2=Prenderò quello.
items.artifacts.driedrose$ghosthero.directed_attack_3=Coinvolgente...
items.artifacts.driedrose$ghosthero.directed_attack_4=Prendiamoli!
items.artifacts.driedrose$ghosthero.directed_attack_5=Quello ce l'ho.
items.artifacts.driedrose$ghosthero.directed_follow_1=Va bene, ti seguirò.
items.artifacts.driedrose$ghosthero.directed_follow_2=Ti seguirò da vicino.
items.artifacts.driedrose$ghosthero.directed_follow_3=Ti seguo...
items.artifacts.driedrose$ghosthero.directed_follow_4=Va bene, andiamo!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ti copro le spalle.
items.artifacts.driedrose$ghosthero.directed_position_1=D'accordo, manterrò quella posizione.
items.artifacts.driedrose$ghosthero.directed_position_2=Andrò lì e difenderò.
items.artifacts.driedrose$ghosthero.directed_position_3=Riposizionamento...
items.artifacts.driedrose$ghosthero.directed_position_4=Sto arrivando!
items.artifacts.driedrose$ghosthero.directed_position_5=Vado lì.
items.artifacts.driedrose$ghosthero.discover_hint=È possibile trovare questo personaggio con un artefatto specifico.
items.artifacts.driedrose$ghosthero.hello=Ciao di nuovo %s.
items.artifacts.driedrose$ghosthero.introduce=Il mio spirito è legato a questa rosa, era preziosissima per me, un dono del mio amore che ho lasciato in superficie.\n\nNon posso tornare da lui, ma grazie a te ho una seconda possibilità di completare il mio viaggio. Quando potrò, risponderò alla tua chiamata e combatterò con te.\n\nFinché avrai la rosa potrò sentire la tua voce, così potrai usarla per guidarmi da lontano.\n\nSpero che tu possa riuscire dove io ho fallito...
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.player_killed_1=NO!...
items.artifacts.driedrose$ghosthero.player_killed_2=Non ho potuto aiutarli...
items.artifacts.driedrose$ghosthero.player_killed_3=Non così...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Solo i nani costruirebbero una macchina mineraria che uccide gli intrusi.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Quella cosa è enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Come ha fatto questa cosa a rimanere attiva per così tanto tempo?
items.artifacts.driedrose$ghosthero.seen_goo_1=Attenzione alla melma!
items.artifacts.driedrose$ghosthero.seen_goo_2=Molti dei miei amici sono morti a causa di questa cosa, è ora di vendicarsi!
items.artifacts.driedrose$ghosthero.seen_goo_3=Una simile abominazione non può essere lasciata vivere!
items.artifacts.driedrose$ghosthero.seen_king_1=Quando si dice che il potere corrompe, è a questo che ci si riferisce.
items.artifacts.driedrose$ghosthero.seen_king_2=Ormai assomiglia più a un lich che a un re.
items.artifacts.driedrose$ghosthero.seen_king_3=Persino nella morte i nani obbediscono al loro padrone.
items.artifacts.driedrose$ghosthero.seen_tengu_1=L'unico prigioniero rimasto è un assassino letale. Ovviamente...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ci ha intrappolati!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ho sentito storie dell'orrore su quella maschera...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, non promette bene.
items.artifacts.driedrose$ghosthero.seen_yog_2=Quindi è così che appare un dio?
items.artifacts.driedrose$ghosthero.seen_yog_3=Questo farà male...
items.artifacts.driedrose$petal.desc=Un fragile petalo secco, che in qualche modo è sopravvissuto fino a questo punto del sotterraneo.
items.artifacts.driedrose$petal.levelup=Si aggiunge il petalo alla rosa.
items.artifacts.driedrose$petal.maxlevel=La rosa è completata!
items.artifacts.driedrose$petal.name=petalo essiccato
items.artifacts.driedrose$petal.no_room=Non c'è più spazio per questo petalo, quindi lo scarti.
items.artifacts.driedrose$petal.no_rose=Non hai una rosa a cui aggiungere questo petalo.
items.artifacts.driedrose$wndghosthero.armor_prompt=Seleziona un'armatura
items.artifacts.driedrose$wndghosthero.cant_cursed=Il fantasma può utilizzare solo attrezzature di cui sei certo non siano maledette.
items.artifacts.driedrose$wndghosthero.cant_strength=Il fantasma non è abbastanza forte per usarlo.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Il fantasma potrebbe non essere abbastanza forte da usarlo.
items.artifacts.driedrose$wndghosthero.cant_unique=Il fantasma non può utilizzare oggetti unici.
items.artifacts.driedrose$wndghosthero.desc=Il fantasma è debole di per sé, ma la sua forma è abbastanza solida da poter essere equipaggiato con un'arma e un'armatura. Sarà in grado di usare questi oggetti proprio come te.\n\nIl fantasma può attualmente equipaggiare oggetti che richiedono fino a _%d forza._
items.artifacts.driedrose$wndghosthero.title=Equipaggiamento del Fantasma
items.artifacts.driedrose$wndghosthero.weapon_prompt=Seleziona un'arma
items.artifacts.driedrose.ac_direct=DIRETTO
items.artifacts.driedrose.ac_outfit=VESTITO
items.artifacts.driedrose.ac_summon=CONVOCARE
items.artifacts.driedrose.charged=La tua rosa è completamente carica!
items.artifacts.driedrose.cursed=Non puoi usare una rosa maledetta.
items.artifacts.driedrose.desc=È questa la rosa di cui ha parlato il fantasma prima di scomparire? Sembra possedere un qualche potere spirituale, forse può essere usata per incanalare l'energia di quel guerriero perduto.
items.artifacts.driedrose.desc_armor=Armatura del Fantasma: %s
items.artifacts.driedrose.desc_cursed=La rosa maledetta è legata alla tua mano, e la senti stranamente fredda.
items.artifacts.driedrose.desc_hint=Sembra che manchino alcuni petali. Forse riattaccandoli la rosa si rinforzerà.
items.artifacts.driedrose.desc_no_quest=Una rosa secca e invecchiata che in qualche modo resiste ancora nonostante l'età. Sembra possedere un qualche potere spirituale, ma al momento non hai idea di come usarlo.
items.artifacts.driedrose.desc_strength=Forza del fantasma: %s
items.artifacts.driedrose.desc_weapon=Arma del Fantasma: %s
items.artifacts.driedrose.name=rosa essiccata
items.artifacts.driedrose.no_charge=La tua rosa non è ancora completamente carica.
items.artifacts.driedrose.no_space=Non ci sono posti liberi nelle vicinanze.
items.artifacts.driedrose.spawned=Hai già evocato il fantasma.
items.artifacts.etherealchains$chainsrecharge.levelup=Le tue catene si rafforzano!
items.artifacts.etherealchains.ac_cast=LANCIO
items.artifacts.etherealchains.cant_pull=Le tue catene non possono trainare quel bersaglio.
items.artifacts.etherealchains.cant_reach=Le tue catene non possono arrivare fin lì.
items.artifacts.etherealchains.cursed=Non puoi usare catene maledette.
items.artifacts.etherealchains.desc=Queste catene, grandi ma leggere, brillano di energia spirituale. Possono essere usate per attirare te verso il terreno o per attirare i nemici verso di te. La natura eterea delle catene permette loro persino di attraversare i muri!
items.artifacts.etherealchains.desc_cursed=Le catene maledette sono bloccate al tuo fianco, oscillando incessantemente, cercando di farti inciampare o di immobilizzarti.
items.artifacts.etherealchains.desc_equipped=Le catene ti avvolgono, prosciugando lentamente l'energia spirituale di coloro che sconfiggi. Ogni carica è un anello della catena, che si estenderà esattamente di una casella.
items.artifacts.etherealchains.does_nothing=Questo non servirà a niente.
items.artifacts.etherealchains.inside_wall=Le tue catene possono solo trascinarti attraverso i muri, non contro di essi.
items.artifacts.etherealchains.name=catene eteree
items.artifacts.etherealchains.no_charge=Le tue catene non sono sufficientemente cariche.
items.artifacts.etherealchains.nothing_to_grab=Non c'è niente da afferrare lì.
items.artifacts.etherealchains.prompt=Scegli una località da prendere di mira.
items.artifacts.etherealchains.rooted=Le tue catene non possono trascinarti finché sei radicato.
items.artifacts.holytome.ac_cast=LANCIO
items.artifacts.holytome.cursed=Non puoi usare un tomo maledetto.
items.artifacts.holytome.desc=Un tomo sacro che funge da focus per la magia divina del Chierico. L'utilizzo del tomo permette al Chierico di lanciare una varietà di incantesimi magici. Il tomo diventerà progressivamente più potente man mano che il Chierico lo utilizza, fornendogli più cariche massime e aumentando leggermente la velocità di ricarica.
items.artifacts.holytome.discover_hint=Uno degli eroi inizia con questo oggetto.
items.artifacts.holytome.levelup=Il tuo tomo si fa sempre più forte!
items.artifacts.holytome.name=tomo sacro
items.artifacts.holytome.no_spell=Al momento non sei in grado di lanciare quell'incantesimo.
items.artifacts.hornofplenty.ac_eat=MANGIARE
items.artifacts.hornofplenty.ac_snack=SPUNTINO
items.artifacts.hornofplenty.ac_store=NEGOZIO
items.artifacts.hornofplenty.desc=Questo corno non può essere suonato, ma sembra riempirsi di cibo man mano che si procede nell'avventura e si acquisisce esperienza. È possibile consumare ogni carica singolarmente come spuntino, oppure mangiare fino a saziarsi.
items.artifacts.hornofplenty.desc_cursed=Il corno maledetto si è legato al tuo fianco, sembra desideroso di prendere cibo piuttosto che produrlo.
items.artifacts.hornofplenty.desc_hint=Forse esiste un modo per aumentare la potenza del corno fornendogli energia alimentare.
items.artifacts.hornofplenty.eat=Si mangia dal corno.
items.artifacts.hornofplenty.feed=Il corno consuma la tua offerta di cibo.
items.artifacts.hornofplenty.full=Il tuo corno è pieno di cibo!
items.artifacts.hornofplenty.levelup=Il corno consuma la tua offerta di cibo e cresce in forza!
items.artifacts.hornofplenty.maxlevel=Il tuo corno ha consumato tutto il cibo che poteva!
items.artifacts.hornofplenty.name=corno dell'abbondanza
items.artifacts.hornofplenty.no_food=Il tuo corno non ha cibo da mangiare!
items.artifacts.hornofplenty.prompt=Seleziona del cibo
items.artifacts.hornofplenty.reject=Il tuo corno rifiuta la frutta cruda e insipida.
items.artifacts.lloydsbeacon.ac_return=RITORNO
items.artifacts.lloydsbeacon.ac_set=IMPOSTATO
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.creatures=L'aura psichica delle creature vicine non ti permette di usare il faro di Lloyd in questo momento.
items.artifacts.lloydsbeacon.desc=Il faro di Lloyd è un intricato dispositivo magico che conferisce all'utilizzatore il controllo sulla magia del teletrasporto. Il faro può essere usato per tornare in un luogo prestabilito, ma una volta caricato equipaggiandolo, può anche emettere raffiche di magia di teletrasporto casuale. Questa magia può essere diretta verso un bersaglio o verso l'utilizzatore stesso.
items.artifacts.lloydsbeacon.desc_set=Questo faro è stato posizionato da qualche parte nel livello %d di Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Il tuo faro si fa sempre più forte!
items.artifacts.lloydsbeacon.name=faro di Lloyd
items.artifacts.lloydsbeacon.no_charge=Il tuo trasmettitore non ha energia sufficiente al momento.
items.artifacts.lloydsbeacon.preventing=La forte aura magica di questo luogo ti impedisce di usare il faro di Lloyd!
items.artifacts.lloydsbeacon.prompt=Scegli un punto da trattare.
items.artifacts.lloydsbeacon.return=Il faro di Lloyd è stato posizionato correttamente nella tua posizione attuale; ora puoi tornare qui in qualsiasi momento.
items.artifacts.lloydsbeacon.tele_fail=La magia del teletrasporto fallisce.
items.artifacts.masterthievesarmband.ac_steal=RUBARE
items.artifacts.masterthievesarmband.cursed=Non puoi usare un bracciale maledetto.
items.artifacts.masterthievesarmband.desc=Questo bracciale di velluto viola porta il marchio di un maestro del furto. Non ti appartiene, ma probabilmente non apparteneva nemmeno al suo ultimo proprietario.
items.artifacts.masterthievesarmband.desc_cursed=Il bracciale maledetto è legato al tuo polso e, in qualche modo, la tua borsa d'oro sembra alleggerirsi lentamente...
items.artifacts.masterthievesarmband.desc_worn=Senti il potere crescere nel tuo bracciale al polso man mano che acquisisci esperienza. Puoi usare questo potere per rubare nei negozi o per derubare i nemici! Derubare i nemici avviene all'istante, li disorienta brevemente e ti dà la possibilità di ottenere qualsiasi bottino abbiano! Questo potere è più efficace contro i nemici ignari. Derubare lo stesso nemico più volte non aumenta le possibilità di ottenere bottino.
items.artifacts.masterthievesarmband.failed_steal=Non sei riuscito a rubare niente.
items.artifacts.masterthievesarmband.full=Il tuo braccialetto è completamente carico!
items.artifacts.masterthievesarmband.level_up=Il tuo bracciale diventa sempre più forte!
items.artifacts.masterthievesarmband.name=bracciale da ladro provetto
items.artifacts.masterthievesarmband.no_charge=Il tuo braccialetto non è sufficientemente carico.
items.artifacts.masterthievesarmband.no_steal=Quel nemico non ha nulla da rubare.
items.artifacts.masterthievesarmband.no_target=Devi prendere di mira un nemico adiacente a te.
items.artifacts.masterthievesarmband.prompt=Scegli un nemico da colpire
items.artifacts.masterthievesarmband.steal_shopkeeper=Non è consentito rubare direttamente ai negozianti.
items.artifacts.masterthievesarmband.stole_item=Hai rubato un oggetto: %s.
items.artifacts.sandalsofnature.absorb_seed=Le calzature assorbono i semi, e sembrano più sane.
items.artifacts.sandalsofnature.ac_feed=FORAGGIO
items.artifacts.sandalsofnature.ac_root=RADICE
items.artifacts.sandalsofnature.desc_1=Quelli che a prima vista sembrano sandali fatti di spago sono in realtà due piante! Appaiono molto deboli e pallide, forse hanno bisogno di essere nutrite?
items.artifacts.sandalsofnature.desc_2=Le calzature sono cresciute e ora assomigliano di più a due scarpe su misura. Hanno riacquistato un po' di colore, forse possono crescere ancora di più?
items.artifacts.sandalsofnature.desc_3=Le piante sono ricresciute e ora assomigliano a un paio di robusti stivali fatti di corteccia. Sembrano aver riacquistato le forze, ma forse possono crescere ancora di più?
items.artifacts.sandalsofnature.desc_4=Le piante sembrano aver raggiunto la loro dimensione massima, assomigliano a un paio di schinieri corazzati. Gli schinieri sono di un marrone scuro e ricordano un albero molto robusto.
items.artifacts.sandalsofnature.desc_ability=Le calzature ondeggiano con il colore dell'ultimo seme che hai dato loro. Possono mettere radici nel terreno per un breve periodo e produrre l'effetto di quella pianta ovunque in un raggio di 3 caselle.\nSeme: _%s_\nCarica necessaria: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=I sandali maledetti impediscono qualsiasi sintonia con la natura.
items.artifacts.sandalsofnature.desc_hint=Indossando questo manufatto, ti sentirai più in sintonia con la natura.
items.artifacts.sandalsofnature.desc_seeds=Hai nutrito le calzature con i semi %d.
items.artifacts.sandalsofnature.levelup=Le tue scarpe aumentano di dimensioni!
items.artifacts.sandalsofnature.low_charge=Le tue scarpe non hanno abbastanza energia per farlo.
items.artifacts.sandalsofnature.name=sandali della natura
items.artifacts.sandalsofnature.name_1=scarpe della natura
items.artifacts.sandalsofnature.name_2=stivali della natura
items.artifacts.sandalsofnature.name_3=schinieri della natura
items.artifacts.sandalsofnature.no_effect=Per prima cosa, devi dare un seme alle tue scarpe.
items.artifacts.sandalsofnature.out_of_range=Quella posizione è fuori dalla portata.
items.artifacts.sandalsofnature.prompt=Seleziona un seme
items.artifacts.sandalsofnature.prompt_target=Seleziona una località
items.artifacts.skeletonkey$keywall.desc=Un muro magico temporaneo è stato eretto qui dalla chiave scheletro.
items.artifacts.skeletonkey.ac_insert=INSERIRE
items.artifacts.skeletonkey.crystal_charges=Per aprire una serratura di cristallo sono necessarie 5 cariche.
items.artifacts.skeletonkey.cursed=Non puoi usare una chiave scheletro maledetta.
items.artifacts.skeletonkey.desc=Una chiave dall'aspetto importante con una testa a forma di teschio. I suoi denti sembrano diversi ogni volta che li si guarda.
items.artifacts.skeletonkey.desc_cursed=La chiave maledetta sembra evitare attivamente di entrare in qualsiasi serratura e rende persino difficile (ma non impossibile) l'utilizzo delle altre chiavi.
items.artifacts.skeletonkey.desc_worn=Questa chiave magica sembra acquisire potere man mano che la usi al posto delle normali chiavi del dungeon. Può essere inserita in quasi tutte le serrature del dungeon per aprirle o chiuderle, comprese le porte che non erano mai state chiuse prima. La chiave può anche essere usata in uno spazio vuoto in una direzione cardinale o diagonale per "bloccare" l'aria di fronte a te, creando un muro solido largo 3 caselle che dura 10 turni. Bloccare l'aria allontanerà i nemici se c'è spazio per farlo.
items.artifacts.skeletonkey.discard=Buttate via le chiavi in eccesso.
items.artifacts.skeletonkey.force_lock=La serratura si è indebolita senza la tua chiave universale. Riesci comunque a forzarla.
items.artifacts.skeletonkey.gold_charges=Per aprire una serratura d'oro sono necessarie 2 cariche.
items.artifacts.skeletonkey.invalid_target=Lì non c'è niente da bloccare o sbloccare.
items.artifacts.skeletonkey.iron_charges=Per aprire una serratura normale è necessaria 1 carica.
items.artifacts.skeletonkey.levelup=La tua chiave universale diventa più forte!
items.artifacts.skeletonkey.lock_charges=Chiudere una porta richiede 2 cariche.
items.artifacts.skeletonkey.lock_no_space=Non puoi rinchiudere un personaggio dentro una porta!
items.artifacts.skeletonkey.locked_with_key=Quella porta era chiusa a chiave con la tua chiave universale.
items.artifacts.skeletonkey.name=chiave scheletro
items.artifacts.skeletonkey.prompt=Scegli un obiettivo
items.artifacts.skeletonkey.wall_charges=Per creare un muro temporaneo sono necessarie 2 cariche.
items.artifacts.skeletonkey.wont_open=Per qualche ragione, la chiave non entra in questa serratura.
items.artifacts.talismanofforesight$foresight.desc=Ti senti molto nervoso, come se ci fosse un pericolo invisibile nelle vicinanze.
items.artifacts.talismanofforesight$foresight.name=lungimiranza
items.artifacts.talismanofforesight$foresight.uneasy=Ti senti a disagio.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Una pietra liscia con strane incisioni. Si ha la sensazione che osservi tutto ciò che ci circonda, tenendo d'occhio qualsiasi cosa nascosta.
items.artifacts.talismanofforesight.desc_cursed=Il talismano maledetto ti fissa intensamente, offuscando i tuoi sensi.
items.artifacts.talismanofforesight.desc_worn=Quando tieni in mano il talismano, senti che i tuoi sensi si acuiscono. Il talismano si carica lentamente col passare del tempo e quando scopri porte nascoste o trappole. Il talismano può spendere la sua carica per "divinare" in un cono, rivelando tutte le tessere e i segreti nell'area scansionata e garantendoti la visione di nemici e oggetti per un breve periodo.
items.artifacts.talismanofforesight.full_charge=Il tuo talismano è completamente carico!
items.artifacts.talismanofforesight.levelup=Il tuo talismano diventa più potente!
items.artifacts.talismanofforesight.low_charge=Il talismano richiede almeno il 5% di carica per poter effettuare la divinazione.
items.artifacts.talismanofforesight.name=talismano di preveggenza
items.artifacts.talismanofforesight.prompt=Seleziona una posizione da scansionare.
items.artifacts.timekeepershourglass$sandbag.desc=Questa piccola bustina di sabbia fine dovrebbe funzionare perfettamente con la tua clessidra.\n\nSembra strano che il negoziante abbia proprio questo articolo quando ne hai bisogno...
items.artifacts.timekeepershourglass$sandbag.levelup=Si aggiunge la sabbia alla clessidra.
items.artifacts.timekeepershourglass$sandbag.maxlevel=La tua clessidra è piena di sabbia magica!
items.artifacts.timekeepershourglass$sandbag.name=sacchetto di sabbia magica
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Non hai una clessidra in cui mettere questa sabbia.
items.artifacts.timekeepershourglass$timefreeze.desc=Il tempo si ferma intorno a te, permettendoti di compiere azioni all'istante. L'effetto durerà finché non verrà annullato o la tua clessidra non si scaricherà. Anche attaccare o usare la magia interromperà questo effetto.\n\nGira fino all'utilizzo della carica: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento del tempo
items.artifacts.timekeepershourglass.ac_activate=ATTIVARE
items.artifacts.timekeepershourglass.cursed=Non puoi usare una clessidra maledetta.
items.artifacts.timekeepershourglass.deactivate=Si disattiva il blocco del tempo.
items.artifacts.timekeepershourglass.desc=Questa grande e decorata clessidra ha un aspetto piuttosto modesto, ma si percepisce una grande potenza nella sua cornice finemente intagliata. Mentre la si fa ruotare e si osserva la sabbia scorrere, si può sentire la sua magia che ci attrae; sicuramente, usare questa magia permetterebbe di avere un certo controllo sul tempo.
items.artifacts.timekeepershourglass.desc_cursed=La clessidra maledetta è bloccata al tuo fianco, puoi sentirla mentre cerca di manipolare il flusso del tuo tempo.
items.artifacts.timekeepershourglass.desc_hint=La clessidra sembra aver perso un po' di sabbia, se solo potessi trovarne un po'...
items.artifacts.timekeepershourglass.freeze=Il tempo si è fermato intorno a me.
items.artifacts.timekeepershourglass.name=clessidra del cronometrista
items.artifacts.timekeepershourglass.no_charge=La tua clessidra non si è ancora ricaricata a sufficienza per essere utilizzabile.
items.artifacts.timekeepershourglass.onfreeze=Tutto intorno a te si ferma improvvisamente.
items.artifacts.timekeepershourglass.onstasis=Il mondo sembra cambiare intorno a te in un istante.
items.artifacts.timekeepershourglass.prompt=Come vorresti usare la magia della clessidra?\n\nMentre sei in stasi, il tempo scorrerà normalmente mentre sei congelato e completamente invulnerabile, consuma fino a 2 cariche alla volta.\n\nQuando il tempo è congelato, puoi muoverti come se le tue azioni non richiedessero tempo. Questo può essere disattivato in qualsiasi momento usando la clessidra o attaccando.
items.artifacts.timekeepershourglass.stasis=Mi sono messo in stasi
items.artifacts.unstablespellbook.ac_add=AGGIUNGERE
items.artifacts.unstablespellbook.ac_read=LEGGERE
items.artifacts.unstablespellbook.blinded=Non è possibile leggere un libro se si è ciechi.
items.artifacts.unstablespellbook.cursed=Non puoi leggere da un libro di incantesimi maledetto.
items.artifacts.unstablespellbook.desc=Questo tomo è in condizioni sorprendentemente buone, considerando la sua età. Sfogliandone le pagine, fruscia e crepita, pervaso da un'energia instabile. Chissà quale incantesimo potresti lanciare se lo leggessi.
items.artifacts.unstablespellbook.desc_cursed=Il libro maledetto si è impossessato di te, impedendoti di utilizzare la maggior parte delle pergamene.
items.artifacts.unstablespellbook.desc_empowered=Le pergamene che hai aggiunto al libro risplendono di potere. Potrai scegliere la versione esotica degli effetti di queste pergamene, ma a un costo aggiuntivo.
items.artifacts.unstablespellbook.desc_index=Il libro è incompleto. L'indice al momento punta alle seguenti pagine vuote:
items.artifacts.unstablespellbook.infuse_scroll=Trasmetti l'energia della pergamena al libro.
items.artifacts.unstablespellbook.name=libro degli incantesimi instabile
items.artifacts.unstablespellbook.no_charge=Il tuo libro degli incantesimi è momentaneamente senza energia.
items.artifacts.unstablespellbook.prompt=Seleziona una pergamena
items.artifacts.unstablespellbook.read_empowered=La pergamena che hai aggiunto al libro degli incantesimi è carica di energia. Puoi incanalare la versione normale o quella esotica dell'effetto di questa pergamena. Scegliere la variante esotica costerà 2 cariche invece di 1.
items.artifacts.unstablespellbook.unable_scroll=Non è possibile aggiungere questa pergamena al libro.
items.artifacts.unstablespellbook.unknown_scroll=Non sai ancora di che tipo di pergamena si tratti.
items.bags.bag.discover_hint=Puoi acquistare questo articolo in un negozio.
items.bags.bag.name=zaino
items.bags.magicalholster.desc=Questa fondina sottile è realizzata con la pelle di un animale esotico e possiede una potente magia che le permette di contenere un'enorme quantità di armi a distanza.\n\nBasta infilare la mano nella borsa e prenderete sempre l'oggetto che stavate cercando.\n\nGrazie alla magia della fondina, le bacchette si caricheranno leggermente più velocemente e le armi da lancio dureranno leggermente più a lungo al suo interno.
items.bags.magicalholster.name=fondina magica
items.bags.potionbandolier.desc=Questa spessa bandoliera si adatta al petto come una fascia, ha molte cinghie isolanti per contenere fiale di pozioni, l'otre d'acqua o fiale di metallo liquido.\n\nMentre sono all'interno della bandoliera, le tue pozioni dovrebbero essere protette dal freddo.
items.bags.potionbandolier.name=bandoliera delle pozioni
items.bags.scrollholder.desc=Questo contenitore tubolare sembra fatto apposta per gli strumenti e le carte di un astronomo, ma le tue pergamene ci staranno altrettanto bene. Ci sono anche alcuni scomparti laterali che si adatterebbero perfettamente a cristalli magici, stili arcani e resina arcana. Il contenitore non sembra molto infiammabile, quindi le tue pergamene dovrebbero essere al sicuro dal fuoco al suo interno.
items.bags.scrollholder.name=porta-rotolo
items.bags.velvetpouch.desc=Questo piccolo sacchetto di velluto può contenere molti piccoli oggetti, come semi, pietre runiche e alcuni ingredienti alchemici.
items.bags.velvetpouch.discover_hint=Uno degli eroi inizia con questo oggetto.
items.bags.velvetpouch.name=pochette di velluto
items.bombs.arcanebomb.desc=Questa bomba è stata intrisa di proprietà arcane. Esploderà in una potente esplosione simile all'attacco potenziato di Goo, infliggendo _%1$d-%2$d danni magici_ a qualsiasi cosa entro 2 caselle.
items.bombs.arcanebomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.arcanebomb.name=bomba arcana
items.bombs.bomb$doublebomb.desc=Una pila di due grosse bombe a polvere nera, sembra che una sia gratis!
items.bombs.bomb$doublebomb.name=due bombe
items.bombs.bomb.ac_lightthrow=LEGGERE E GIRARE
items.bombs.bomb.desc=Una bomba a polvere nera piuttosto pesante. L'esplosione di questa bomba infligge _%1$d-%2$d danni_ a qualsiasi cosa si trovi nelle vicinanze e distruggerà parte del terreno o degli oggetti adiacenti.
items.bombs.bomb.desc_burning=La miccia della bomba sta bruciando, mantieni le distanze o spegnila!
items.bombs.bomb.desc_fuse=Sembra che, una volta accesa, la miccia impiegherà un paio di colpi per consumarsi completamente.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=L'esplosione ti uccide...
items.bombs.bomb.rankings_desc=Ucciso da un'esplosione
items.bombs.bomb.snuff_fuse=Spegni rapidamente la miccia della bomba.
items.bombs.firebomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo fiamme continue entro 2 caselle.
items.bombs.firebomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.firebomb.name=bomba incendiaria
items.bombs.flashbangbomb.desc=Questa bomba personalizzata esploderà in un'esplosione di luce, suono ed elettricità. Tutto ciò che si trova entro 2 caselle subirà _%1$d-%2$d danni_ dall'esplosione, ulteriori 25%% danni dall'elettricità e rimarrà stordito per 10 turni.
items.bombs.flashbangbomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.flashbangbomb.name=granata stordente
items.bombs.frostbomb.desc=Questa bomba è stata modificata per esplodere in un'area più ampia, infliggendo _%1$d-%2$d danni_ e diffondendo una raffica continua di aria gelida entro 2 caselle.
items.bombs.frostbomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.frostbomb.name=bomba gelo
items.bombs.holybomb.desc=Questa bomba è stata modificata per proiettare una luce sacra in un'area più ampia quando esplode. Tutto ciò che si trova entro 2 caselle subirà _%1$d-%2$d danni_ dall'esplosione, e i nemici non morti o demoniaci subiranno ulteriori 50%% danni dalla luce sacra.
items.bombs.holybomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.holybomb.name=bomba santa
items.bombs.noisemaker.desc=Questa bomba personalizzata farà rumore ripetutamente quando la sua miccia si esaurirà. Quando qualcosa tocca la bomba, esploderà e infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle!
items.bombs.noisemaker.desc_burning=Il dispositivo rumoroso sta ticchettando, esploderà quando qualcosa si avvicinerà!
items.bombs.noisemaker.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.noisemaker.name=generatore di rumore
items.bombs.regrowthbomb.desc=Questa bomba personalizzata, invece di esplodere, spargerà un liquido vitale in un raggio di 3 caselle. L'area colpita dall'esplosione farà germogliare rapidamente erba e piante. Tu e tutti gli alleati coinvolti nell'esplosione sarete curati come se aveste bevuto una pozione curativa.
items.bombs.regrowthbomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.regrowthbomb.name=bomba di ricrescita
items.bombs.shrapnelbomb.desc=Questa bomba è stata modificata con frammenti di metallo del DM-300, che si frantumeranno e voleranno ovunque quando esploderà, infliggendo _%1$d-%2$d danni_ in un'ampia area intorno alla bomba. Faresti meglio a nasconderti dietro qualcosa quando la usi...
items.bombs.shrapnelbomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.shrapnelbomb.name=bomba a schegge
items.bombs.smokebomb.desc=Questa bomba è stata modificata per emettere una densa nube di gas contemporaneamente all'esplosione. Infliggerà _%1$d-%2$d danni_ e diffonderà una fitta nebbia entro 2 caselle.
items.bombs.smokebomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.smokebomb.name=bomba fumogena
items.bombs.woollybomb.desc=Questa bomba personalizzata creerà un ampio campo di pecore magiche dopo l'esplosione. L'esplosione infliggerà _%1$d-%2$d danni_ a qualsiasi cosa entro 2 caselle. Le pecore bloccheranno il movimento e persisteranno per molto tempo! Tuttavia, in presenza di nemici potenti, le pecore non dureranno altrettanto a lungo e potranno essere eliminate manualmente più velocemente interagendo con loro.
items.bombs.woollybomb.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.bombs.woollybomb.name=bomba lanosa
items.brokenseal$warriorshield.desc_active=Il sigillo rotto del Guerriero lo sta attualmente aiutando a perseverare, garantendogli uno scudo oltre alla sua salute. C'è un tempo di ricarica dopo che lo scudo si attiva inizialmente prima che possa essere utilizzato di nuovo. Questo scudo non si deteriora nel tempo, ma terminerà se non ci sono nemici nelle vicinanze per alcuni turni. Quando termina, qualsiasi scudo non utilizzato ridurrà il tempo di ricarica, fino a un massimo di 50. Scudo rimanente:
items.brokenseal$warriorshield.desc_cooldown=Il Guerriero ha recentemente ottenuto uno scudo dal suo sigillo rotto e deve aspettare di poter beneficiare nuovamente del suo effetto protettivo.\n\nTurni rimanenti: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Il tempo di ricarica dello scudo del Guerriero è attualmente negativo, il che significa che quando il suo scudo si attiva il tempo di ricarica sarà inferiore ai soliti 150 turni. Il tempo di ricarica dello scudo può essere ridotto fino a -150 turni, il che significa che sarà immediatamente disponibile di nuovo una volta attivato.\n\nTempo di ricarica attuale: %d.
items.brokenseal$warriorshield.name=Scudo del guerriero
items.brokenseal.ac_affix=APPORRE
items.brokenseal.affix=Applica il sigillo alla tua armatura!
items.brokenseal.choose_desc=Sia quest'armatura che il sigillo rotto hanno un glifo. Scegli quale glifo conservare.\n\nGlifo dell'armatura: %1$s\nGlifo del sigillo rotto: %2$s\n\nNota che se scegli il glifo attualmente presente sull'armatura, il sigillo non sarà in grado di trasferirlo in seguito.
items.brokenseal.choose_title=Scegli un glifo
items.brokenseal.cursed_armor=Il sigillo non si applicherà alle armature maledette.
items.brokenseal.desc=Un sigillo di cera, apposto sull'armatura come simbolo di valore. Al centro è incisa una runa di protezione sbiadita ed è spaccato a metà.\n\nUn ricordo della sua casa, il sigillo aiuta il guerriero a perseverare. Mentre indossa il sigillo, il guerriero otterrà istantaneamente uno scudo quando sta per subire danni pari o inferiori alla metà della sua salute.\n\nIl sigillo può essere apposto sull'armatura e spostato tra le armature. Può trasportare un singolo potenziamento, a condizione che tale potenziamento sia stato applicato all'armatura mentre il sigillo era attaccato ad essa.
items.brokenseal.discover_hint=Uno degli eroi inizia con questo oggetto.
items.brokenseal.inscribed=Il sigillo reca l'iscrizione _%s._
items.brokenseal.name=sigillo rotto
items.brokenseal.prompt=Seleziona un'armatura
items.brokenseal.unknown_armor=Per prima cosa devi stabilire se quell'armatura è maledetta o meno.
items.dewdrop.already_full=Hai già la salute al massimo.
items.dewdrop.desc=Una goccia di rugiada cristallina.
items.dewdrop.name=goccia di rugiada
items.dewvial.ac_drink=BERE
items.dewvial.auto_drink=La fiala di rugiada si è svuotata per curare le tue ferite.
items.dewvial.collected=Hai raccolto una goccia di rugiada nella fiala.
items.dewvial.desc=Puoi conservare la rugiada in eccesso in questa piccola fiala per berla più tardi. Se la fiala è piena, la rugiada verrà bevuta automaticamente quando sarai in pericolo di vita.
items.dewvial.empty=La tua fiala di rugiada è vuota!
items.dewvial.full=La tua fiala di rugiada è piena!
items.dewvial.name=fiala di rugiada
items.energycrystal.desc=Una collezione di piccoli cristalli magici, pieni di energia alchemica. Questi cristalli sono l'ingrediente più comune nelle ricette alchemiche e possono essere prodotti in un calderone alchemico smantellando oggetti consumabili.
items.energycrystal.name=cristallo energetico
items.equipableitem.ac_equip=ATTREZZATURA
items.equipableitem.ac_unequip=DISEQUIPAGGIARE
items.equipableitem.curse_detected=Avverti che l'oggetto è maledetto proprio prima di equipaggiarlo!
items.equipableitem.unequip_cursed=Non puoi rimuovere un oggetto maledetto!
items.food.berry.desc=Questa piccola bacca è stata trovata dalla Cacciatrice tra la vegetazione del dungeon. Si può mangiare velocemente, ripristina un po' di sazietà e potrebbe contenere un seme utilizzabile!
items.food.berry.discover_hint=È possibile trovare questo oggetto utilizzando un talento specifico dell'eroe.
items.food.berry.eat_msg=Quella bacca era deliziosa!
items.food.berry.name=bacca del dungeon
items.food.blandfruit$chunks.desc=Il frutto insipido è esploso all'impatto, lasciando dietro di sé pezzi inerti.\n\nNonostante un po' di terra, questi grossi pezzi di frutto insipido cotto sembrano perfettamente commestibili.
items.food.blandfruit$chunks.name=pezzi di frutta insipida
items.food.blandfruit.blindfruit=frutto cieco
items.food.blandfruit.cooked=frutto insipido cotto
items.food.blandfruit.desc=Così asciutto e inconsistente, forse cuocerlo a fuoco lento con un altro ingrediente potrebbe migliorarlo.
items.food.blandfruit.desc_cooked=Il frutto si è ingrossato durante il tempo trascorso in ammollo nella pentola e ha persino assorbito le proprietà del seme con cui è stato cotto. Avrà quindi l'effetto della pozione corrispondente al seme.
items.food.blandfruit.desc_eat=Sembra pronto per essere mangiato!
items.food.blandfruit.desc_throw=Sembra piuttosto instabile, forse è meglio buttarlo via.
items.food.blandfruit.dreamfruit=frutto magico
items.food.blandfruit.earthfruit=frutto della terra
items.food.blandfruit.fadefruit=frutta secca
items.food.blandfruit.firefruit=frutto del fuoco
items.food.blandfruit.icefruit=frutto di ghiaccio
items.food.blandfruit.name=frutto insipido
items.food.blandfruit.raw=Non sopporti di mangiarlo crudo.
items.food.blandfruit.rotfruit=frutto marcio
items.food.blandfruit.sorrowfruit=frutto della tristezza
items.food.blandfruit.starfruit=carambola
items.food.blandfruit.stormfruit=frutto della tempesta
items.food.blandfruit.sunfruit=frutto del girasole
items.food.blandfruit.swiftfruit=rondone
items.food.chargrilledmeat.desc=Sembra una bistecca di buona qualità.
items.food.chargrilledmeat.discover_hint=È possibile ricreare questa ricetta utilizzando un altro alimento.
items.food.chargrilledmeat.name=carne alla griglia
items.food.food.ac_eat=MANGIARE
items.food.food.desc=Niente di speciale: carne secca, biscotti, cose del genere.
items.food.food.eat_msg=Quel cibo era delizioso!
items.food.food.name=razione di cibo
items.food.frozencarpaccio.better=Ti senti meglio!
items.food.frozencarpaccio.desc=Si tratta di un pezzo di carne cruda congelata. L'unico modo per mangiarla è tagliandola a fettine sottili. E in questo modo è sorprendentemente buona.
items.food.frozencarpaccio.discover_hint=È possibile ricreare questa ricetta utilizzando un altro alimento.
items.food.frozencarpaccio.hard=Senti la pelle indurirsi!
items.food.frozencarpaccio.invis=Vedrete le vostre mani diventare invisibili!
items.food.frozencarpaccio.name=carpaccio congelato
items.food.frozencarpaccio.refresh=Rinfrescante!
items.food.meatpie.desc=Una deliziosa torta salata ripiena di carne saporita. Vi sazierà molto più di qualsiasi altro pasto.
items.food.meatpie.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.food.meatpie.eat_msg=Quel cibo era incredibile!
items.food.meatpie.name=torta di carne
items.food.mysterymeat$placeholder.name=carne
items.food.mysterymeat.desc=Mangiate a vostro rischio e pericolo!
items.food.mysterymeat.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.food.mysterymeat.eat_msg=Quel cibo aveva un sapore... strano.
items.food.mysterymeat.hot=Oh, fa caldo!
items.food.mysterymeat.legs=Non senti più le gambe!
items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.not_well=Non ti senti bene.
items.food.mysterymeat.stuffed=Sei pieno.
items.food.pasty$fishleftover.desc=Un po' di pesce avanzato dal pasto precedente. Puoi mangiarlo quando vuoi per placare un po' la fame.
items.food.pasty$fishleftover.eat_msg=Quel cibo era discreto.
items.food.pasty$fishleftover.name=avanzi di pesce
items.food.pasty.amulet_desc=Finalmente l'hai trovato, il magico amuleto di... aspetta un attimo, questo è solo un cioccolatino avvolto nella stagnola che sembra l'amuleto! Non ti darà un potere illimitato, ma almeno ti sazierà e ti darà una piccola carica artefatto.\n\nPesce d'aprile!
items.food.pasty.amulet_name=amuleto di Yendor?
items.food.pasty.cane_desc=Un enorme e dolcissimo bastoncino di zucchero. È abbastanza grande da saziarti, e lo zucchero potrebbe dare anche alle tue bacchette una piccola carica extra.\n\nBuone feste!
items.food.pasty.cane_name=bastoncino di zucchero
items.food.pasty.desc=Un autentico pasticcio della Cornovaglia con un ripieno tradizionale di manzo e patate. Delizioso!
items.food.pasty.egg_desc=Un grande uovo di cioccolato, avvolto in una colorata carta stagnola gialla. C'è abbastanza cioccolato per saziarti, e lo zucchero potrebbe dare ai tuoi manufatti una piccola carica extra.\n\nBuona Pasqua!
items.food.pasty.egg_name=uovo di Pasqua
items.food.pasty.fish_desc=Un pesce intero al vapore, magicamente conservato su un letto di verdure. È tradizione conservare del pesce per dopo in questo periodo dell'anno, così manterrai gli avanzi invece di mangiarlo tutto in una volta.\n\nBuon Capodanno Lunare!
items.food.pasty.fish_name=pesce al vapore
items.food.pasty.name=pasticcino
items.food.pasty.pie_desc=Una bella fetta di torta di zucca. Il suo sapore dolce e speziato ti sazierà e ti regalerà un piccolo momento di relax.\n\nBuon Halloween!
items.food.pasty.pie_name=torta di zucca
items.food.pasty.rainbow_desc=Questa pozione colorata è una specie di cibo liquido. Oltre a soddisfare la tua fame, contiene un po' di magia che calmerà un nemico non boss adiacente, rendendolo temporaneamente riluttante a combattere contro di te.\n\nHappy Pride!
items.food.pasty.rainbow_name=pozione arcobaleno
items.food.pasty.sparkling_desc=Questa pozione frizzante è una specie di cibo liquido. Placa la fame e simula il vino spumante, ma non è alcolica. La sensazione di calore nello stomaco ti darà un po' di protezione.\n\nBuon Anno!
items.food.pasty.sparkling_name=pozione scintillante
items.food.pasty.vanilla_desc=Questa grande fetta di torta alla vaniglia ha delle codette colorate e una glassa blu. La torta è stata fatta per celebrare anni di esperienza e, quando la mangerai, ti regalerà una piccola parte di quell'esperienza.\n\nIl Pixel Dungeon originale è stato rilasciato per la prima volta il 4 dicembre 2012. Buon compleanno Pixel Dungeon!
items.food.pasty.vanilla_name=torta blu
items.food.phantommeat.desc=Una grande bistecca traslucida e lucente, ricavata da un piranha fantasma. Questa carne magica non necessita di cottura e, oltre a saziarti completamente, offre numerosi benefici difensivi. Una volta consumata, conferisce invisibilità, pelle di corteccia, favorisce la guarigione e cura molti effetti negativi.
items.food.phantommeat.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.food.phantommeat.name=carne fantasma
items.food.smallration.desc=Sembra esattamente una razione di cibo standard, ma in formato più piccolo.
items.food.smallration.discover_hint=Puoi acquistare questo articolo in un negozio.
items.food.smallration.eat_msg=Quel cibo era discreto.
items.food.smallration.name=piccola razione alimentare
items.food.stewedmeat.desc=La cottura in umido ha purificato la carne da eventuali malattie o parassiti. Dovrebbe essere sicura da mangiare.
items.food.stewedmeat.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.food.stewedmeat.eat_msg=Quel cibo era discreto.
items.food.stewedmeat.name=carne in umido
items.food.supplyration.desc=Questa razione è stata lasciata nel dungeon dai e per i membri della gilda dei ladri. È specificamente progettata per essere consumata al volo e per aiutare nelle attività criminali in generale. Sebbene non sazi quanto una razione normale, può essere consumata rapidamente, fornisce una piccola guarigione diretta e ripristinerà una carica al mantello delle ombre del ladro.
items.food.supplyration.discover_hint=È possibile trovare questo oggetto utilizzando un talento specifico dell'eroe.
items.food.supplyration.name=razione di fornitura
items.gold.desc=Un mucchio di monete d'oro. Raccogli le monete d'oro per spenderle in seguito in un negozio.
items.gold.name=oro
items.heap.artifact=un artefatto
items.heap.chest=Petto
items.heap.chest_desc=Non saprai cosa c'è dentro finché non lo aprirai!
items.heap.crystal_chest=Scrigno di cristallo
items.heap.crystal_chest_desc=All'interno puoi vedere _%s_, ma per aprire lo scrigno ti serve una chiave di cristallo.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Cassa chiusa a chiave
items.heap.locked_chest_desc=Non saprai cosa c'è dentro finché non lo aprirai! Ma per aprirlo ti serve una chiave d'oro.
items.heap.remains=Resti dell'eroe
items.heap.remains_desc=Questo è tutto ciò che resta di uno dei tuoi predecessori. Forse vale la pena controllare se ci sono oggetti di valore.
items.heap.ring=un anello
items.heap.skeleton=Resti scheletrici
items.heap.skeleton_desc=Questo è tutto ciò che resta di un sfortunato avventuriero. Forse vale la pena controllare se ha trovato qualcosa di valore.
items.heap.tomb=Tomba
items.heap.tomb_desc=Questa antica tomba potrebbe contenere qualcosa di utile, ma il suo proprietario si opporrà senz'altro a una verifica.
items.heap.wand=una bacchetta
items.honeypot$shatteredpot.desc=Il vaso è andato in frantumi, solo il miele appiccicoso che ne riveste le pareti lo tiene insieme, e si sta lentamente disintegrando.\n\nNonostante il suo stato di rottura, l'ape sembra ancora voler proteggere il vaso.
items.honeypot$shatteredpot.name=vaso di miele in frantumi
items.honeypot.ac_shatter=FRANTUMARE
items.honeypot.desc=Questo enorme vasetto di miele non è solo pieno di miele, ma ospita al suo interno un'ape gigante! Queste api enormi di solito restano nei loro alveari, forse il vasetto è una sorta di trappola speciale? L'ape sembra piuttosto contenta dentro il vasetto con il suo miele e ti ronza intorno con diffidenza quando la guardi.
items.honeypot.name=trappola per il miele
items.item.ac_drop=GOCCIOLARE
items.item.ac_throw=GETTARE
items.item.curse=maledizione
items.item.custom_note=Questo articolo ha una nota personalizzata: "_%s_"
items.item.custom_note_type=Questo tipo di articolo ha una nota personalizzata: "_%s_"
items.item.discover_hint=Puoi trovare questo oggetto in modo casuale nel dungeon.
items.item.prompt=Scegliere la direzione del lancio
items.item.rankings_desc=Ucciso da: %s
items.journal.alchemypage.desc=Una pagina strappata da una guida all'alchimia.\n\nLa maggior parte del testo è troppo piccolo per essere letto da lontano, ma si può distinguere il titolo della pagina:\n\n_"%s"_
items.journal.alchemypage.name=pagina strappata del libro di alchimia
items.journal.documentpage.desc=Una pagina solitaria, probabilmente strappata da un libro. Dovrai raccoglierla per leggerla.
items.journal.documentpage.name=pagina strappata
items.journal.guidebook.desc=Una guida per avventurieri, lasciata qui da qualcuno che ha deciso che l'avventura non faceva per lui! Questo particolare libro è magico e può suggerire agli avventurieri di leggere una pagina al momento giusto.\n\nNonostante questa funzionalità, il libro è più popolare per le grandi parole "Non farti prendere dal panico!" scritte a caratteri grandi e amichevoli sulla copertina.
items.journal.guidebook.hint_desktop=La tua guida contiene dei consigli per te! Seleziona il pulsante lampeggiante del diario (%s) in alto a destra per leggerlo.
items.journal.guidebook.hint_mobile=La tua guida contiene consigli utili! Tocca il pulsante lampeggiante del diario in alto a destra per leggerlo.
items.journal.guidebook.hint_status=Guida
items.journal.guidebook.name=tomo della maestria nei dungeon
items.journal.guidepage.desc=Una pagina strappata da una guida di avventura.\n\nLa maggior parte del testo è troppo piccolo per essere letto da lontano, ma si può distinguere il titolo della pagina:\n\n_"%s"_
items.journal.guidepage.name=pagina strappata della guida
items.journal.regionlorepage$caves.desc=Quello che sembra essere un appunto nel diario di bordo di un esploratore, conservato in modo sorprendentemente buono nonostante la sua antichità. Prendilo in mano per leggerlo.
items.journal.regionlorepage$caves.name=vecchia voce di registro
items.journal.regionlorepage$city.desc=Una piccola tavoletta di metallo arrugginito con un messaggio magicamente inciso sopra. Le lettere sono ancora nitide nonostante l'età della tavoletta, ma per leggerle bisogna prenderla in mano.
items.journal.regionlorepage$city.name=tavoletta arrugginita
items.journal.regionlorepage$halls.desc=Una piccola tavoletta nera con lettere verdi luminose incise sopra. Da lontano, le lettere luminose si confondono in una foschia, bisogna prenderla in mano per leggerle.
items.journal.regionlorepage$halls.name=tavoletta luminosa
items.journal.regionlorepage$prison.desc=Una pagina di diario, o qualche altro tipo di documento, scritta su un vecchio pezzo di carta. Sembra essersi conservata meglio delle lettere che hai trovato nelle fogne, ma dovrai comunque raccoglierla per leggerla.
items.journal.regionlorepage$prison.name=Voce di diario consumata
items.journal.regionlorepage$sewers.desc=Quella che sembra una lettera, scritta su un pezzo di carta sporco. Dovrai prenderla in mano per riuscire a decifrare cosa c'è scritto.
items.journal.regionlorepage$sewers.name=lettera consumata
items.keys.crystalkey.desc=Le superfici tagliate di questa chiave di cristallo brillano nell'oscurità. Forse aprirà qualcosa fatto di cristallo?
items.keys.crystalkey.name=Chiave di cristallo
items.keys.goldenkey.desc=Le tacche su questa chiave d'oro sono minuscole e intricate. Forse aprirà uno scrigno chiuso a chiave?
items.keys.goldenkey.name=chiave d'oro
items.keys.ironkey.desc=Le tacche su questa antica chiave di ferro sono consumate; il suo cordino di cuoio è logorato dal tempo. Quale porta potrebbe aprire?
items.keys.ironkey.name=chiave di ferro
items.keys.skeletonkey.name=chiave scheletro
items.keys.wornkey.desc=Questa chiave è consumata e scolorita, ma ha un aspetto serio. Probabilmente può aprire qualche porta importante qui vicino.
items.keys.wornkey.name=chiave guidata
items.kindofmisc.unequip_message=Prima devi disequipaggiare uno di questi oggetti. Seleziona un oggetto con cui sostituirlo.
items.kindofmisc.unequip_title=Rimuovi un oggetto
items.kindofweapon.empty=vuoto
items.kindofweapon.equip_cursed=La tua presa sull'arma si stringe involontariamente.
items.kindofweapon.swift_equip=Equipaggiate rapidamente la vostra arma.
items.kindofweapon.which_equip_msg=In quale slot arma desideri equipaggiare questo oggetto?\n\nLa Campionessa attacca direttamente con la sua arma primaria, ma può usare l'abilità di entrambe le armi. Entrambe le armi condividono lo stesso numero di cariche.\n\nLa Campionessa può anche scambiare istantaneamente la sua arma primaria e secondaria.
items.kindofweapon.which_equip_primary=Primario (%s)
items.kindofweapon.which_equip_secondary=Secondario (%s)
items.kingscrown.ac_wear=INDOSSARE
items.kingscrown.desc=La corona dell'ultimo re dei nani, risplende di un'immensa energia magica. Quando indossata, la magia della corona fluirà nell'armatura che stai attualmente indossando, trasformandola in un'armatura epica unica con abilità speciali. La nuova armatura manterrà tutte le proprietà dell'armatura originale.
items.kingscrown.discover_hint=È possibile ottenere questo oggetto come bottino da determinati nemici.
items.kingscrown.naked=Purtroppo, la corona non può trasformare la tua biancheria intima.
items.kingscrown.name=Corona del Re dei Nani
items.kingscrown.ratgraded=Le zampe del Re dei Topi brillano intensamente mentre la tua armatura si trasforma!
items.kingscrown.upgraded=La corona brilla intensamente e poi si disintegra mentre la tua armatura si trasforma!
items.liquidmetal.ac_apply=FARE DOMANDA A
items.liquidmetal.already_fixed=Quell'arma da lancio è già in perfette condizioni!
items.liquidmetal.apply=Per riparare la tua arma da lancio, utilizzi il metallo liquido %d.
items.liquidmetal.desc=Questo liquido magico può riempire crepe e strappi su un'arma da lancio, riportandola in perfette condizioni! Se a un set di armi manca un'arma ma per il resto è completamente riparato, il metallo liquido può essere utilizzato anche per sostituire l'arma mancante dal set!\n\nUn'arma di livello 1 richiede 10 unità di metallo liquido per essere completamente riparata, un'arma di livello 5 ne richiede 30. Ogni potenziamento aumenta anche la quantità di metallo necessaria del 35%.\n\nIl metallo liquido non può essere utilizzato per riparare le punte dei dardi con punta.
items.liquidmetal.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.liquidmetal.name=metallo liquido
items.liquidmetal.prompt=Seleziona un'arma da lancio
items.lostbackpack.desc=Questo è il tuo inventario perduto. Recuperalo per recuperare tutti gli oggetti che hai perso!
items.lostbackpack.name=zaino smarrito
items.merchantsbeacon.ac_use=UTILIZZO
items.merchantsbeacon.desc=Questo strano oggetto tecnologico nanico ti permette di comunicare da grandi distanze.\n\nDopo essere stato attivato, questo faro ti permetterà di vendere oggetti a Pixel Mart da qualsiasi punto del dungeon.\n\nTuttavia, la magia all'interno del faro durerà solo per una sessione, quindi usala con saggezza.
items.merchantsbeacon.name=faro del mercante
items.potions.brews.aquabrew.desc=Quando viene frantumata, questa pozione rilascia un getto d'acqua pressurizzata nel punto in cui si trova. È abbastanza potente da danneggiare solo i nemici infuocati, ma diffonde anche acqua sul terreno circostante, disattiva trappole, spegne incendi e respinge i personaggi vicini al punto di esplosione.
items.potions.brews.aquabrew.name=birra d'acqua
items.potions.brews.blizzardbrew.desc=Quando viene frantumata, questa bevanda scatenerà una bufera vorticosa che si diffonderà rapidamente come un gas.
items.potions.brews.blizzardbrew.name=birra della bufera di neve
items.potions.brews.brew.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.potions.brews.causticbrew.desc=Questa pozione spargerà una melma corrosiva in un'ampia area intorno al punto in cui si frantuma. Qualsiasi cosa venga a contatto con la melma si scioglierà lentamente se non viene lavata via dall'acqua.
items.potions.brews.causticbrew.name=infuso caustico
items.potions.brews.infernalbrew.desc=Una volta frantumata, questa bevanda scatenerà un inferno furioso che si propagherà rapidamente come un gas.
items.potions.brews.infernalbrew.name=pozione infernale
items.potions.brews.shockingbrew.desc=Quando si rompe, questa bevanda scatenerà una tempesta elettrica in una vasta area intorno al punto in cui si rompe.
items.potions.brews.shockingbrew.name=bevanda scioccante
items.potions.brews.unstablebrew.desc=Questa pozione magica risplende con i cangianti colori dell'arcobaleno. Quando viene bevuta o lanciata, attiverà l'effetto di una pozione casuale. L'effetto della pozione sarà sempre benefico se viene bevuta e sempre dannoso se viene lanciata.
items.potions.brews.unstablebrew.name=birra instabile
items.potions.elixirs.elixir.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Hai temporaneamente acquisito proprietà rigenerative simili a quelle di Goo.\n\nMentre rimani in acqua, recupererai una piccola quantità di salute per turno. L'effetto si interrompe quando sei al massimo della salute o sei fuori dall'acqua.\n\nGuarigione rimanente: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=guarigione acquatica
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Questo elisir contiene i resti di Goo potenziati con una pozione curativa. Sebbene non fornisca una guarigione immediata, ripristinerà gradualmente una maggiore quantità di salute mentre ti trovi immerso nell'acqua.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elisir di ringiovanimento acquatico
items.potions.elixirs.elixirofarcanearmor.desc=Questo elisir conferirà a chi lo beve una resistenza duratura ai danni magici.
items.potions.elixirs.elixirofarcanearmor.name=elisir dell'armatura arcana
items.potions.elixirs.elixirofdragonsblood.desc=Una volta ingerito, questo elisir infonderà una potente energia infuocata nelle vene di chi lo beve. Questo effetto renderà chi lo assume immune al fuoco, permettendogli di incendiare i nemici con attacchi fisici.
items.potions.elixirs.elixirofdragonsblood.name=elisir di sangue di drago
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Sei sotto l'effetto di un elisir di caduta piuma, che ti permette di cadere nei burroni senza subire danni!\n\nTurni rimanenti: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=caduta di piume
items.potions.elixirs.elixiroffeatherfall.desc=Questo elisir offre un effetto di levitazione più debole ma più controllato, permettendo a chi lo beve di cadere da grandi altezze senza subire danni per un breve periodo.
items.potions.elixirs.elixiroffeatherfall.light=Ti senti leggero come una piuma!
items.potions.elixirs.elixiroffeatherfall.name=elisir della caduta di piume
items.potions.elixirs.elixirofhoneyedhealing.desc=Questo elisir unisce la guarigione alla dolcezza del miele. Se bevuto, applicherà lo stesso effetto di una pozione curativa e sazierà una piccola quantità di fame, ma può anche essere lanciato per curare un alleato. Le creature con affinità per il miele potrebbero essere pacificate se questo oggetto viene usato su di loro.
items.potions.elixirs.elixirofhoneyedhealing.name=elisir di guarigione al miele
items.potions.elixirs.elixiroficytouch.desc=Una volta ingerito, questo elisir permetterà a chi lo beve di assorbire il calore dai nemici che attacca. Questo effetto renderà chi lo beve immune al freddo e gli consentirà di congelare i nemici con attacchi fisici.
items.potions.elixirs.elixiroficytouch.name=elisir dal tocco gelido
items.potions.elixirs.elixirofmight$htboost.desc=Il tuo corpo si sente insolitamente forte e sano. La tua salute massima è aumentata per un periodo di tempo prolungato. Man mano che sali di livello, l'aumento diminuirà gradualmente. Quantità di aumento attuale: 0\nLivelli rimanenti: 1%d.
items.potions.elixirs.elixirofmight$htboost.name=potenziamento massimo della salute
items.potions.elixirs.elixirofmight.desc=Questo potente liquido scorrerà nei tuoi muscoli, aumentando permanentemente la tua forza di un punto e incrementando temporaneamente la salute massima di %d punti. L'aumento di salute è proporzionale alla tua salute massima, ma svanirà lentamente man mano che sali di livello.
items.potions.elixirs.elixirofmight.msg=Una forza rinnovata pervade il tuo corpo, ora possiedi la forza %d!
items.potions.elixirs.elixirofmight.name=elisir di potere
items.potions.elixirs.elixiroftoxicessence.desc=Una volta ingerito, questo elisir infonderà in chi lo beve un'energia tossica. Chi lo beve diffonderà continuamente gas tossici muovendosi e sarà immune a gas tossici e veleni per un periodo leggermente superiore alla durata dell'effetto.
items.potions.elixirs.elixiroftoxicessence.name=elisir di essenza tossica
items.potions.exotic.exoticpotion.amber=pozione d'ambra esotica
items.potions.exotic.exoticpotion.azure=pozione azzurra esotica
items.potions.exotic.exoticpotion.bistre=pozione esotica bistre
items.potions.exotic.exoticpotion.charcoal=pozione di carbone esotico
items.potions.exotic.exoticpotion.crimson=pozione cremisi esotica
items.potions.exotic.exoticpotion.discover_hint=È possibile creare questo oggetto tramite l'alchimia.
items.potions.exotic.exoticpotion.golden=pozione dorata esotica
items.potions.exotic.exoticpotion.indigo=pozione indaco esotica
items.potions.exotic.exoticpotion.ivory=pozione d'avorio esotico
items.potions.exotic.exoticpotion.jade=pozione di giada esotica
items.potions.exotic.exoticpotion.magenta=pozione magenta esotica
items.potions.exotic.exoticpotion.no=No, ho cambiato idea.
items.potions.exotic.exoticpotion.silver=pozione d'argento esotica
items.potions.exotic.exoticpotion.turquoise=pozione turchese esotica
items.potions.exotic.exoticpotion.unknown_desc=Questa fiaschetta rotonda contiene un liquido granuloso e colorato. Sembra essere estraneo a questa terra, chissà cosa potrebbe succedere se bevuto o gettato via?
items.potions.exotic.exoticpotion.warning=Vuoi davvero annullare l'utilizzo di questa pozione? Verrà consumata comunque.
items.potions.exotic.exoticpotion.yes=Sì, ne sono certo
items.potions.exotic.potionofcleansing$cleanse.desc=Questo personaggio è temporaneamente immune a tutti gli effetti di stato dannosi!\n\nTurni rimanenti: %s.
items.potions.exotic.potionofcleansing$cleanse.name=purificato
items.potions.exotic.potionofcleansing.desc=Questo potente reagente renderà chi lo beve immune a tutti gli effetti di stato negativi per alcuni turni. Può anche essere lanciato contro un bersaglio per purificarlo.
items.potions.exotic.potionofcleansing.name=pozione purificante
items.potions.exotic.potionofcorrosivegas.desc=Stappando o rompendo questo contenitore di vetro pressurizzato, il suo contenuto esploderà in una nube letale di gas corrosivo color ruggine. Il gas si diffonde più rapidamente di un gas tossico ed è più letale, ma non durerà altrettanto a lungo.
items.potions.exotic.potionofcorrosivegas.name=pozione di gas corrosivo
items.potions.exotic.potionofdivineinspiration.bonus=+2 Punti Talento!
items.potions.exotic.potionofdivineinspiration.desc=Il potere dell'energia sacra ridotto in forma liquida, questa pozione infonderà a chi la beve un potere divino, garantendogli due punti talento bonus in un livello a sua scelta. Questa pozione può essere utilizzata solo una volta per ogni livello di talento.
items.potions.exotic.potionofdivineinspiration.name=pozione di ispirazione divina
items.potions.exotic.potionofdivineinspiration.no_more_points=Non puoi ottenere altri punti talento bonus.
items.potions.exotic.potionofdivineinspiration.select_tier=Seleziona un livello di talento per ottenere due punti bonus. Devi aver sbloccato il livello per poter spendere i punti.
items.potions.exotic.potionofdragonsbreath.desc=Questa fiaschetta contiene un composto insolito che prende fuoco poco dopo essersi mescolato con la saliva. Sputando rapidamente il liquido, chi lo usa potrà sputare fiamme dalla bocca!
items.potions.exotic.potionofdragonsbreath.name=pozione del respiro del drago
items.potions.exotic.potionofdragonsbreath.prompt=Scegliete un luogo dove bruciare
items.potions.exotic.potionofearthenarmor.desc=Anziché paralizzare, questo liquido ha un effetto indurente sulla pelle, trasformandola in una sorta di armatura naturale temporanea.
items.potions.exotic.potionofearthenarmor.name=pozione di armatura di terra
items.potions.exotic.potionofmagicalsight.desc=Dopo aver bevuto questa pozione, i tuoi sensi si acuiranno brevemente a livelli incredibili, permettendoti di vedere attraverso i muri in un raggio di 12 caselle!
items.potions.exotic.potionofmagicalsight.name=pozione della vista magica
items.potions.exotic.potionofmastery.armor_easier=Indossare la tua armatura diventa più facile!
items.potions.exotic.potionofmastery.desc=Invece di conferire pura forza, questa pozione sintonizzerà i muscoli dell'utilizzatore su un particolare oggetto. Ciò renderà quell'oggetto più facile da usare, come se chi la beve si fosse esercitato con esso e avesse sviluppato una memoria muscolare. L'arma o l'armatura scelta richiederà 2 punti forza in meno per essere utilizzata. Questa pozione può essere utilizzata solo una volta su ciascun oggetto.
items.potions.exotic.potionofmastery.name=pozione della maestria
items.potions.exotic.potionofmastery.prompt=Padroneggia un oggetto
items.potions.exotic.potionofmastery.weapon_easier=La tua arma diventa più facile da maneggiare!
items.potions.exotic.potionofshielding.desc=Anziché curare, questa pozione proietterà uno scudo resistente attorno al corpo di chi la utilizza, bloccando una notevole quantità di danni.
items.potions.exotic.potionofshielding.name=pozione di protezione
items.potions.exotic.potionofshroudingfog.desc=A contatto con l'aria, il liquido contenuto in questa fiaschetta produrrà una densa nebbia fumosa che si diffonderà rapidamente, oscurando la visuale dei nemici.
items.potions.exotic.potionofshroudingfog.name=pozione di nebbia avvolgente
items.potions.exotic.potionofsnapfreeze.desc=La sostanza chimica contenuta in questa pozione reagirà rapidamente con l'aria, congelando e immobilizzando all'istante tutto ciò che si trova nel suo raggio d'azione.
items.potions.exotic.potionofsnapfreeze.name=pozione di congelamento istantaneo
items.potions.exotic.potionofstamina.desc=Bere questo liquido stranamente dolce ti darà una carica di energia duratura, permettendoti di correre a un ritmo più sostenuto per un periodo di tempo prolungato.
items.potions.exotic.potionofstamina.name=pozione di resistenza
items.potions.exotic.potionofstormclouds.desc=Lanciando questa pozione si creerà una nuvola di vapore concentrato che si espanderà rapidamente, condensandosi e riversandosi sull'ambiente circostante. Gran parte del terreno si trasformerà in acqua, i nemici infuocati subiranno danni, il fuoco si spegnerà e le trappole verranno sopraffatte e si romperanno.
items.potions.exotic.potionofstormclouds.name=pozione di nuvole tempestose
items.potions.potion$placeholder.name=pozione
