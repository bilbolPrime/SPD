items.artifacts.lloydsbeacon.ac_zap=ZASTRZELIĆ
items.artifacts.lloydsbeacon.creatures=Aura psychiczna pobliskich stworzeń nie pozwala ci w tej chwili używać latarni Lloyda.
items.artifacts.lloydsbeacon.desc=Latarnia Lloyda to skomplikowane urządzenie magiczne, które daje użytkownikowi kontrolę nad magią teleportacji. Latarnia może służyć do powrotu w wyznaczone miejsce, ale po naładowaniu może również wystrzeliwać ładunki losowej magii teleportacji. Magia ta może być skierowana na cel lub na samego użytkownika.
items.artifacts.lloydsbeacon.desc_set=Ta latarnia została umieszczona gdzieś na poziomie %d w Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Twój sygnał staje się silniejszy!
items.artifacts.lloydsbeacon.name=latarnia morska Lloyda
items.artifacts.lloydsbeacon.no_charge=Twoja latarnia nie ma obecnie wystarczającej ilości energii.
items.artifacts.lloydsbeacon.preventing=Silna magiczna aura tego miejsca uniemożliwia ci korzystanie z latarni Lloyda!
items.artifacts.lloydsbeacon.prompt=Wybierz lokalizację, którą chcesz zaatakować.
items.artifacts.lloydsbeacon.return=Latarnia morska Lloyd's została pomyślnie ustawiona w Twojej obecnej lokalizacji. Teraz możesz tu wrócić w każdej chwili.
items.artifacts.lloydsbeacon.tele_fail=Magia teleportacji zawodzi.
items.artifacts.masterthievesarmband.ac_steal=UKRAŚĆ
items.artifacts.masterthievesarmband.cursed=Nie możesz używać przeklętej opaski.
items.artifacts.masterthievesarmband.desc=Ta fioletowa aksamitna opaska nosi znak mistrza złodziei. Nie należy do ciebie, ale prawdopodobnie nie należała też do jej ostatniego użytkownika.
items.artifacts.masterthievesarmband.desc_cursed=Przeklęta opaska przywiązana jest do twojego nadgarstka, a twój woreczek ze złotem zdaje się powoli stawać lżejszy...
items.artifacts.masterthievesarmband.desc_worn=Wraz ze zdobywaniem doświadczenia czujesz, jak moc narasta w opasce na nadgarstku. Możesz użyć tej mocy do kradzieży w sklepach lub okradania wrogów! \n\nOkradanie wrogów odbywa się natychmiastowo, na krótko ich dezorientuje i daje szansę na zdobycie łupów! Ta moc jest skuteczniejsza przeciwko nieświadomym wrogom. Wielokrotne okradanie tego samego wroga nie zwiększa szans na zdobycie łupów.
items.artifacts.masterthievesarmband.failed_steal=Nie udało ci się niczego ukraść.
items.artifacts.masterthievesarmband.full=Twoja opaska jest w pełni naładowana!
items.artifacts.masterthievesarmband.level_up=Twoja opaska staje się silniejsza!
items.artifacts.masterthievesarmband.name=opaska mistrza złodziei
items.artifacts.masterthievesarmband.no_charge=Twoja opaska nie jest wystarczająco naładowana.
items.artifacts.masterthievesarmband.no_steal=Ten wróg nie ma nic do ukradzenia.
items.artifacts.masterthievesarmband.no_target=Musisz wybrać wroga znajdującego się obok ciebie.
items.artifacts.masterthievesarmband.prompt=Wybierz wroga, którego chcesz obrać za cel
items.artifacts.masterthievesarmband.steal_shopkeeper=Nie można okraść bezpośrednio sprzedawców.
items.artifacts.masterthievesarmband.stole_item=Ukradłeś przedmiot: %s.
items.artifacts.sandalsofnature.absorb_seed=Obuwie wchłania nasiona, wygląda na zdrowsze.
items.artifacts.sandalsofnature.ac_feed=KARMIĆ
items.artifacts.sandalsofnature.ac_root=ŹRÓDŁO
items.artifacts.sandalsofnature.desc_1=To, co na pierwszy rzut oka wygląda jak sandały ze sznurka, to w rzeczywistości dwie rośliny! Wydają się bardzo słabe i blade, może trzeba im podać składniki odżywcze?
items.artifacts.sandalsofnature.desc_2=Obuwie urosło i teraz bardziej przypomina dwa buty szyte na miarę. Przywrócił im trochę koloru, może jeszcze urosną?
items.artifacts.sandalsofnature.desc_3=Rośliny znów urosły i teraz przypominają parę solidnych butów z kory. Wygląda na to, że rośliny odzyskały siły, ale może jeszcze urosną?
items.artifacts.sandalsofnature.desc_4=Rośliny zdają się osiągać maksymalne rozmiary, przypominają parę pancernych nagolenników. Nagolenniki mają głęboki brązowy kolor i przypominają bardzo wytrzymałe drzewo.
items.artifacts.sandalsofnature.desc_ability=Obuwie mieni się kolorem ostatniego nasiona, którym je karmiłeś. Mogą na krótko zapuścić korzenie w ziemi i wywołać efekt tej rośliny w dowolnym miejscu w promieniu 3 pól.\nNasiono: _%s_\nWymagany ładunek: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Przeklęte sandały blokują jakąkolwiek łączność z naturą.
items.artifacts.sandalsofnature.desc_hint=Nosząc ten artefakt poczujesz większą harmonię z naturą.
items.artifacts.sandalsofnature.desc_seeds=Nakarmiłeś obuwie nasionami %d.
items.artifacts.sandalsofnature.levelup=Twoje obuwie powiększa się!
items.artifacts.sandalsofnature.low_charge=Twoje obuwie nie ma na to wystarczającej ilości energii.
items.artifacts.sandalsofnature.name=sandały natury
items.artifacts.sandalsofnature.name_1=buty natury
items.artifacts.sandalsofnature.name_2=buty natury
items.artifacts.sandalsofnature.name_3=skwarki natury
items.artifacts.sandalsofnature.no_effect=Najpierw musisz nakarmić obuwie nasieniem.
items.artifacts.sandalsofnature.out_of_range=Ta lokalizacja jest poza zasięgiem.
items.artifacts.sandalsofnature.prompt=Wybierz nasiono
items.artifacts.sandalsofnature.prompt_target=Wybierz lokalizację
items.artifacts.skeletonkey$keywall.desc=Tymczasowa magiczna ściana została tutaj umieszczona za pomocą klucza szkieletowego.
items.artifacts.skeletonkey.ac_insert=WSTAWIĆ
items.artifacts.skeletonkey.crystal_charges=Otwarcie kryształowego zamka wymaga 5 ładunków.
items.artifacts.skeletonkey.cursed=Nie możesz używać przeklętego klucza szkieletowego.
items.artifacts.skeletonkey.desc=Wyglądający na ważny klucz z główką w kształcie czaszki. Jego zęby wydają się inne za każdym razem, gdy na nie spojrzysz.
items.artifacts.skeletonkey.desc_cursed=Przeklęty klucz najwyraźniej aktywnie unika wpasowania się w jakikolwiek zamek, a nawet utrudnia (choć nie uniemożliwia) korzystanie z pozostałych kluczy.
items.artifacts.skeletonkey.desc_worn=Ten magiczny klucz zdaje się zyskiwać na mocy, gdy używasz go zamiast zwykłych kluczy lochów. Można go włożyć do niemal każdego zamka lochu, aby go otworzyć lub zamknąć, w tym drzwi, które wcześniej nigdy nie były zamknięte. \n\n Klucza można nawet użyć na pustej przestrzeni w kierunku kardynalnym lub ukośnym, aby „zamknąć” powietrze przed sobą, tworząc solidną ścianę o szerokości 3 pól, która utrzymuje się przez 10 tur. Zamknięcie odepchnie wrogów, jeśli będzie na to miejsce.
items.artifacts.skeletonkey.discard=Wyrzucasz nadmiarowe klucze.
items.artifacts.skeletonkey.force_lock=Zamek osłabł bez twojego klucza uniwersalnego. Udaje ci się go otworzyć siłą.
items.artifacts.skeletonkey.gold_charges=Otwarcie złotego zamka wymaga 2 ładunków.
items.artifacts.skeletonkey.invalid_target=Nie ma tam niczego do zablokowania lub odblokowania.
items.artifacts.skeletonkey.iron_charges=Otwarcie zwykłego zamka wymaga 1 ładowania.
items.artifacts.skeletonkey.levelup=Twój klucz szkieletowy staje się silniejszy!
items.artifacts.skeletonkey.lock_charges=Zamknięcie drzwi wymaga 2 ładunków.
items.artifacts.skeletonkey.lock_no_space=Nie możesz zamknąć postaci wewnątrz drzwi!
items.artifacts.skeletonkey.locked_with_key=Te drzwi były zamknięte na twój klucz uniwersalny.
items.artifacts.skeletonkey.name=wytrych
items.artifacts.skeletonkey.prompt=Wybierz cel
items.artifacts.skeletonkey.wall_charges=Stworzenie tymczasowej ściany wymaga 2 ładunków.
items.artifacts.skeletonkey.wont_open=Klucz z jakiegoś powodu nie pasuje do tego zamka.
items.artifacts.talismanofforesight$foresight.desc=Czujesz się bardzo zdenerwowany, jakby w pobliżu czyhało jakieś niewidzialne niebezpieczeństwo.
items.artifacts.talismanofforesight$foresight.name=dalekowzroczność
items.artifacts.talismanofforesight$foresight.uneasy=Czujesz się nieswojo.
items.artifacts.talismanofforesight.ac_scry=WRÓŻYĆ Z KULI SZKLANEJ
items.artifacts.talismanofforesight.desc=Gładki kamień z dziwnymi grawerunkami. Masz wrażenie, że obserwuje wszystko wokół, wypatrując wszystkiego, co ukryte.
items.artifacts.talismanofforesight.desc_cursed=Przeklęty talizman intensywnie się w ciebie wpatruje, przytępiając twoje zmysły.
items.artifacts.talismanofforesight.desc_worn=Trzymając talizman, czujesz, jak twoje zmysły się wyostrzają. Talizman powoli się ładuje wraz z upływem czasu i odkrywaniem ukrytych drzwi lub pułapek. \n\n Talizman może rozładować ładunek, aby „widzieć” w kształcie stożka, który ujawnia wszystkie pola i sekrety w skanowanym obszarze, a także zapewnia krótkotrwałą wizję wrogów i przedmiotów.
items.artifacts.talismanofforesight.full_charge=Twój Talizman jest w pełni naładowany!
items.artifacts.talismanofforesight.levelup=Twój Talizman staje się silniejszy!
items.artifacts.talismanofforesight.low_charge=Aby móc wróżyć, talizman wymaga co najmniej 5% naładowania.
items.artifacts.talismanofforesight.name=talizman przewidywania
items.artifacts.talismanofforesight.prompt=Wybierz lokalizację, którą chcesz zeskanować.
items.artifacts.timekeepershourglass$sandbag.desc=Ta mała torebka drobnego piasku powinna idealnie pasować do Twojej klepsydry.\n\nDziwne, że sprzedawca miałby ten konkretny przedmiot akurat wtedy, gdy go potrzebujesz...
items.artifacts.timekeepershourglass$sandbag.levelup=Dodajesz piasek do klepsydry.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Twoja klepsydra jest wypełniona magicznym piaskiem!
items.artifacts.timekeepershourglass$sandbag.name=worek magicznego piasku
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nie masz klepsydry, do której mógłbyś wsypać piasek.
items.artifacts.timekeepershourglass$timefreeze.desc=Czas wokół Ciebie jest zamrożony, co pozwala Ci natychmiast wykonywać czynności. Efekt będzie trwał do momentu jego anulowania lub wyczerpania się ładunku w Klepsydrze. Atakowanie lub użycie magii również przerwie ten efekt. \n\n Obroty do momentu użycia ładunku: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Zamrożenie czasu
items.artifacts.timekeepershourglass.ac_activate=AKTYWOWAĆ
items.artifacts.timekeepershourglass.cursed=Nie możesz używać przeklętej klepsydry.
items.artifacts.timekeepershourglass.deactivate=Dezaktywujesz zamrożenie czasu.
items.artifacts.timekeepershourglass.desc=Ta duża, ozdobna klepsydra wygląda dość niepozornie, ale w jej misternie rzeźbionej ramie czujesz ogromną moc. Obracając klepsydrę i obserwując przesypujący się piasek, czujesz, jak jej magia cię przyciąga. Z pewnością użycie tej magii dałoby ci pewną kontrolę nad czasem.
items.artifacts.timekeepershourglass.desc_cursed=Przeklęta klepsydra jest przytwierdzona do twojego boku. Czujesz, jak próbuje manipulować twoim przepływem czasu.
items.artifacts.timekeepershourglass.desc_hint=Wygląda na to, że w klepsydrze zgubiono trochę piasku, gdybyś tylko mógł go znaleźć...
items.artifacts.timekeepershourglass.freeze=Zamroź czas wokół mnie
items.artifacts.timekeepershourglass.name=klepsydra zegarmistrza
items.artifacts.timekeepershourglass.no_charge=Twoja klepsydra nie naładowała się jeszcze na tyle, by nadawać się do użytku.
items.artifacts.timekeepershourglass.onfreeze=Wszystko wokół nagle zamarza.
items.artifacts.timekeepershourglass.onstasis=Świat wokół ciebie w jednej chwili zdaje się zmieniać.
items.artifacts.timekeepershourglass.prompt=Jak chcesz wykorzystać magię klepsydry?\n\nW stanie hibernacji czas płynie normalnie, a ty jesteś zamrożony i całkowicie niezniszczalny, zużywając do 2 ładunków na raz.\n\nGdy czas jest zamrożony, możesz poruszać się, jakby twoje działania nie trwały długo. Funkcję tę można wyłączyć w dowolnym momencie, używając klepsydry lub atakując.
items.artifacts.timekeepershourglass.stasis=Wprowadziłem się w stan spoczynku
items.artifacts.unstablespellbook.ac_add=DODAĆ
items.artifacts.unstablespellbook.ac_read=CZYTAĆ
items.artifacts.unstablespellbook.blinded=Nie możesz czytać książki, będąc zaślepionym.
items.artifacts.unstablespellbook.cursed=Nie możesz czytać z zaklętej księgi czarów.
items.artifacts.unstablespellbook.desc=Ten tom jest w zaskakująco dobrym stanie, biorąc pod uwagę jego wiek. Syczy i trzeszczy, gdy przesuwasz strony, kipiąc niestabilną energią. Czytając tę książkę, nie sposób przewidzieć, jakie zaklęcie można rzucić.
items.artifacts.unstablespellbook.desc_cursed=Przeklęta księga przywiązała się do ciebie i uniemożliwia ci korzystanie z większości zwojów.
items.artifacts.unstablespellbook.desc_empowered=Zwoje, które dodałeś do księgi, świecą mocą. Będziesz mógł wybrać egzotyczną wersję efektów tych zwojów, ale za dodatkową opłatą.
items.artifacts.unstablespellbook.desc_index=Książka jest niekompletna. Jej indeks wskazuje obecnie następujące puste strony:
items.artifacts.unstablespellbook.infuse_scroll=Nasycasz książkę energią zwoju.
items.artifacts.unstablespellbook.name=niestabilna księga zaklęć
items.artifacts.unstablespellbook.no_charge=Twoja księga czarów jest chwilowo pozbawiona energii.
items.artifacts.unstablespellbook.prompt=Wybierz przewijanie
items.artifacts.unstablespellbook.read_empowered=Zwój, który dodałeś do księgi czarów, nabiera energii. Możesz wykorzystać zwykłą lub egzotyczną wersję efektu tego zwoju.\n\nWybór egzotycznej wersji będzie kosztował 2 ładunki zamiast 1.
items.artifacts.unstablespellbook.unable_scroll=Nie możesz dodać tego zwoju do księgi.
items.artifacts.unstablespellbook.unknown_scroll=Nie jesteś jeszcze pewien, jaki to rodzaj zwoju.
items.bags.bag.discover_hint=Możesz kupić ten przedmiot w sklepie.
items.bags.bag.name=plecak
items.bags.magicalholster.desc=Ta smukła kabura wykonana jest z egzotycznej skóry zwierzęcej i posiada potężną magię, która pozwala na przechowywanie w niej ogromnej ilości broni dystansowej.\n\nWystarczy sięgnąć do torby, a zawsze znajdziesz przedmiot, którego szukasz.\n\nDzięki magii kabury, różdżki ładują się nieco szybciej, a rzucana broń wytrzyma nieco dłużej.
items.bags.magicalholster.name=magiczna kabura
items.bags.potionbandolier.desc=Ten gruby bandolier dopasowuje się do klatki piersiowej jak pas. Ma wiele izolowanych pasków do przytrzymywania fiolek z miksturami, bukłaka z wodą lub fiolek z ciekłym metalem.\n\nPrzebywając w bandolierze, mikstury powinny być chronione przed zimnem.
items.bags.potionbandolier.name=bandolier na mikstury
items.bags.scrollholder.desc=Ten rurowy pojemnik wygląda, jakby pomieścił narzędzia i mapy astronomiczne, ale Twoje zwoje zmieszczą się równie dobrze. Jest nawet kilka bocznych przegródek, które idealnie pomieszczą kryształy magii, rysiki magiczne i żywicę magiczną. \n\n Pojemnik nie wygląda na łatwopalny, więc Twoje zwoje powinny być bezpieczne w środku przed ogniem.
items.bags.scrollholder.name=uchwyt na zwoje
items.bags.velvetpouch.desc=W tym małym aksamitnym woreczku można przechowywać wiele drobnych przedmiotów, takich jak nasiona, kamienie runiczne i niektóre składniki alchemiczne.
items.bags.velvetpouch.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.bags.velvetpouch.name=aksamitny woreczek
items.bombs.arcanebomb.desc=Ta bomba została nasycona magicznymi właściwościami. Wybucha potężną eksplozją, podobną do podkręconego ataku Goo, zadając _%1$d-%2$d obrażeń magicznych_ wszystkiemu w promieniu 2 pól.
items.bombs.arcanebomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.arcanebomb.name=bomba arkanowa
items.bombs.bomb$doublebomb.desc=Stos dwóch potężnych bomb prochowych, wygląda jakbyś dostał jedną gratis!
items.bombs.bomb$doublebomb.name=dwie bomby
items.bombs.bomb.ac_lightthrow=ŚWIATŁO I RZUT
items.bombs.bomb.desc=Dość potężna bomba prochowa. Eksplozja tej bomby zadaje _%1$d-%2$d obrażeń_ wszystkiemu, co znajduje się w jej pobliżu, i niszczy niektóre elementy terenu lub przedmioty.
items.bombs.bomb.desc_burning=Zapalnik bomby się przepala, trzymaj się z daleka albo ją ugaś!
items.bombs.bomb.desc_fuse=Wygląda na to, że lont będzie potrzebował kilku strzałów, aby wypalić się po zapaleniu.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=Eksplozja cię zabije...
items.bombs.bomb.rankings_desc=Zabity przez eksplozję
items.bombs.bomb.snuff_fuse=Szybko gasisz lont bomby.
items.bombs.firebomb.desc=Ta bomba została zmodyfikowana tak, aby eksplodowała na większym obszarze, zadając _%1$d-%2$d obrażeń_ i rozprzestrzeniając stały ogień na obszar 2 pól.
items.bombs.firebomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.firebomb.name=bomba zapalająca
items.bombs.flashbangbomb.desc=Ta spersonalizowana bomba wybuchnie, wywołując eksplozję światła, dźwięku i elektryczności. Wszystko w promieniu 2 pól otrzyma _%1$d-%2$d obrażeń_ od eksplozji, dodatkowe 25%% obrażeń od elektryczności i zostanie ogłuszone na 10 tur.
items.bombs.flashbangbomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.flashbangbomb.name=granat hukowy
items.bombs.frostbomb.desc=Ta bomba została zmodyfikowana tak, aby eksplodowała na większym obszarze, zadając _%1$d-%2$d obrażeń_ i rozprzestrzeniając ciągły podmuch mroźnego powietrza w promieniu 2 pól.
items.bombs.frostbomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.frostbomb.name=bomba mrozowa
items.bombs.holybomb.desc=Ta bomba została zmodyfikowana tak, aby po wybuchu rozbłyskiwała świętym światłem na większym obszarze. Wszystko w promieniu 2 pól otrzyma _%1$d-%2$d obrażeń_ od eksplozji, a nieumarli lub demoniczni wrogowie otrzymają dodatkowe 50%% obrażeń od świętego światła.
items.bombs.holybomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.holybomb.name=święta bomba
items.bombs.noisemaker.desc=Ta spersonalizowana bomba będzie wielokrotnie wydawać odgłosy, gdy jej lont się wyczerpie. Gdy coś jej dotknie, wybuchnie i zada _%1$d-%2$d obrażeń_ wszystkiemu w promieniu 2 pól!
items.bombs.noisemaker.desc_burning=Hałasujący gadżet tyka, wybuchnie, gdy coś się zbliży!
items.bombs.noisemaker.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.noisemaker.name=hałasownik
items.bombs.regrowthbomb.desc=Ta spersonalizowana bomba rozpryskuje życiodajną ciecz w promieniu 3 pól, zamiast eksplodować. Obszar objęty wybuchem szybko wyrośnie trawą i roślinami. Ty i wszyscy sojusznicy objęci wybuchem zostaniecie uzdrowieni, tak jakby wypili miksturę uzdrawiającą.
items.bombs.regrowthbomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.regrowthbomb.name=bomba odrostu
items.bombs.shrapnelbomb.desc=Ta bomba została zmodyfikowana kawałkami metalu z DM-300, które po wybuchu rozbiją się i rozlecą wszędzie, zadając _%1$d-%2$d obrażeń_ w ogromnym zasięgu wokół bomby. Lepiej się za czymś schować, gdy jej używasz...
items.bombs.shrapnelbomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.shrapnelbomb.name=bomba odłamkowa
items.bombs.smokebomb.desc=Ta bomba została zmodyfikowana tak, aby jednocześnie z wybuchem wystrzeliwała gęstą chmurę gazu. Zadaje _%1$d-%2$d obrażeń_ i rozprzestrzenia mgłę w promieniu 2 pól.
items.bombs.smokebomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.smokebomb.name=bomba dymna
items.bombs.woollybomb.desc=Ta spersonalizowana bomba po eksplozji stworzy rozległe pole magicznych owiec. Eksplozja zada _%1$d-%2$d obrażeń_ wszystkiemu w promieniu 2 pól. Owce zablokują ruch i będą istnieć przez bardzo długi czas! Owce nie przetrwają jednak tak długo w obecności potężnych wrogów i można je szybciej rozproszyć ręcznie, wchodząc z nimi w interakcję.
items.bombs.woollybomb.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.bombs.woollybomb.name=wełniana bomba
items.brokenseal$warriorshield.desc_active=Złamana pieczęć Wojownika pomaga mu obecnie przetrwać, zapewniając mu tarczę oprócz zdrowia. Po pierwszym uruchomieniu tarczy następuje czas odnowienia, zanim będzie można jej ponownie użyć.\n\nTa tarcza nie zanika z czasem, ale przestanie działać, jeśli w pobliżu przez kilka tur nie będzie żadnych wrogów. Po jej zakończeniu, każda niewykorzystana tarcza skróci czas odnowienia, maksymalnie do 50%%.\n\nPozostała tarcza: %1$d.\n\nAktualny czas odnowienia: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Wojownik niedawno zyskał osłonę dzięki złamanej pieczęci i musi poczekać, aż znów będzie mógł skorzystać z jej efektu osłony.\n\nPozostałe obroty: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Czas odnowienia tarczy Wojownika jest obecnie ujemny, co oznacza, że po aktywacji tarczy czas odnowienia będzie krótszy niż standardowe 150 tur. Czas odnowienia tarczy można skrócić nawet do -150 tur, co oznacza, że będzie ona ponownie dostępna natychmiast po aktywacji.\n\nAktualny czas odnowienia: %d.
items.brokenseal$warriorshield.name=Tarcza Wojownika
items.brokenseal.ac_affix=AFIKS
items.brokenseal.affix=Przymocuj pieczęć do swojej zbroi!
items.brokenseal.choose_desc=Zarówno ta zbroja, jak i złamana pieczęć posiadają glif. Wybierz, który glif chcesz zachować. \n\nGlif zbroi: %1$s\nGlif złamanej pieczęci: %2$s\n\nPamiętaj, że jeśli wybierzesz glif, który aktualnie znajduje się na zbroi, pieczęć nie będzie mogła zostać później przeniesiona.
items.brokenseal.choose_title=Wybierz glif
items.brokenseal.cursed_armor=Pieczęć nie będzie miała zastosowania do przeklętej zbroi.
items.brokenseal.desc=Pieczęć woskowa, przymocowana do zbroi jako symbol męstwa. Pośrodku wygrawerowana jest wyblakła runa ochrony, a środek jest pęknięty na pół. \n\nPieczęć, pamiątka z domu, pomaga wojownikowi wytrwać. Nosząc pieczęć, wojownik natychmiast zyskuje tarczę, gdy jego zdrowie spadnie do połowy lub mniej. \n\nPieczęć można _przymocować do zbroi_ i przenosić między zbrojami. Może ona przenosić jedno ulepszenie, pod warunkiem, że zostało ono zastosowane do zbroi, gdy pieczęć była do niej przymocowana.
items.brokenseal.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.brokenseal.inscribed=Na pieczęci widnieje napis _%s._
items.brokenseal.name=zerwana plomba
items.brokenseal.prompt=Wybierz zbroję
items.brokenseal.unknown_armor=Najpierw musisz ustalić, czy zbroja jest przeklęta czy nie.
items.dewdrop.already_full=Już jesteś w pełni zdrowy.
items.dewdrop.desc=Krystalicznie czysta kropla rosy.
items.dewdrop.name=kropla rosy
items.dewvial.ac_drink=WYPIJ
items.dewvial.auto_drink=Fiolka z rosą została opróżniona, by uleczyć twoje rany.
items.dewvial.collected=Kropla rosy trafiła do twojej fiolki.
items.dewvial.desc=W tej małej fiolce możesz przechowywać nadmiar rosy, by wypić ją później. Jeśli fiolka jest pełna, rosa zostanie wypita automatycznie w chwili śmiertelnego zagrożenia.
items.dewvial.empty=Twoja fiolka na rosę jest pusta!
items.dewvial.full=Twoja fiolka na rosę jest pełna!
items.dewvial.name=fiolka na rosę
items.energycrystal.desc=Zbiór małych magicznych kryształów wypełnionych energią alchemiczną.\n\nKryształy te są najczęstszym składnikiem receptur alchemicznych i można je wytworzyć w alchemicznym garnku, ze złomowanych przedmiotów eksploatacyjnych.
items.energycrystal.name=kryształ energetyczny
items.equipableitem.ac_equip=WYPOSAŻYĆ
items.equipableitem.ac_unequip=WYPOSAŻENIE
items.equipableitem.curse_detected=Czujesz, że przedmiot jest przeklęty już na samym początku, zanim go założysz!
items.equipableitem.unequip_cursed=Nie możesz usunąć przeklętego przedmiotu!
items.food.berry.desc=Tę małą jagodę znalazła Łowczyni wśród roślinności lochów. Można ją szybko zjeść, przywraca odrobinę sytości i może zawierać użyteczne nasiono!
items.food.berry.discover_hint=Przedmiot ten możesz znaleźć za pomocą konkretnego talentu bohatera.
items.food.berry.eat_msg=Ta jagoda była pyszna!
items.food.berry.name=jagoda lochowa
items.food.blandfruit$chunks.desc=Owoc ten eksplodował przy uderzeniu, pozostawiając po sobie martwe kawałki.\n\nMimo odrobiny brudu, te duże kawałki ugotowanego owocu wydają się całkowicie jadalne.
items.food.blandfruit$chunks.name=kawałki mdłego owocu
items.food.blandfruit.blindfruit=ślepy owoc
items.food.blandfruit.cooked=gotowany mdły owoc
items.food.blandfruit.desc=Jest tak suchy i nietrwały, że być może warto byłoby go ugotować z innym składnikiem.
items.food.blandfruit.desc_cooked=Owoc napęczniał od czasu namoczenia w garnku i wchłonął nawet właściwości pestki, z którą był gotowany. Będzie miał działanie podobne do mikstury, której pestka odpowiadała.
items.food.blandfruit.desc_eat=Wygląda, że jest gotowe do spożycia!
items.food.blandfruit.desc_throw=Wydaje się dość niestabilny, więc lepiej będzie się go pozbyć.
