items.amulet.ac_end=ZAKOŃCZ GRĘ
items.amulet.ascent_desc=Zaczynasz czuć wielką i straszliwą moc Yog-Dzewy promieniującą z amuletu. Powrót przez lochy jako śmiertelnik może być trudniejszy, niż myślałeś! \n\nJeśli będziesz kontynuować wspinaczkę z amuletem, lochy staną się bardziej niebezpieczne, teleportacje między piętrami zostaną wyłączone, a ty będziesz mógł wygrać grę tylko pokonując wrogów podczas wspinaczki! \n\nMożesz na razie zostawić amulet, jeśli chcesz wspiąć się bez rozpoczynania tego wyzwania, lub aktywować go przed wspinaczką, aby normalnie zakończyć grę.
items.amulet.ascent_no=Zatrzymaj się na teraz
items.amulet.ascent_title=Wniebowstąpienie
items.amulet.ascent_yes=Kontynuować!
items.amulet.desc=Amulet Yendoru to najpotężniejszy artefakt znany ludziom i krasnoludom. Jego lśniące kryształy kryją w sobie niesamowitą i cudowną moc.
items.amulet.desc_ascent=Pochodzenie amuletu jest nieznane, ale najwyraźniej został on silnie ukształtowany przez moc Yog-Dzewy. Lochy zdają się poddawać woli Yoga, gdy się przez nie przemieszczasz, przez co przeciwnicy stają się znacznie liczniejsi i potężniejsi! Nie możesz już aktywować ani odrzucać amuletu, jakby był przeklęty.
items.amulet.desc_origins=Pochodzenie amuletu jest nieznane. Historia głosi, że Król Krasnoludów chwalił się, że odkrył artefakt na krótko przed tym, jak cywilizacja krasnoludów zerwała z nim wszelkie kontakty. Jak go znalazł? Jak Yog-Dzewa mu go odebrał? Pytania może na inny czas, teraz liczy się tylko to, że amulet jest twój!
items.amulet.discover_hint=Ten przedmiot znajdziesz na dole lochu...
items.amulet.name=amulet yendoru
items.ankh.ac_bless=błogosławić
items.ankh.bless=Błogosławisz Ankh magiczną wodą.
items.ankh.desc=Starożytny symbol nieśmiertelności pozwala powrócić do życia po śmierci. Przy wskrzeszeniu tracisz wszystkie przedmioty poza założonym ekwipunkiem.
items.ankh.desc_blessed=Ten starożytny symbol nieśmiertelności daje możliwość powrotu do życia po śmierci. Ankh został pobłogosławiony i jest teraz znacznie silniejszy. Ankh poświęci się, by uratować cię w chwili śmiertelnego niebezpieczeństwa.
items.ankh.discover_hint=Możesz kupić ten przedmiot w sklepie.
items.ankh.name=ankh
items.arcaneresin.ac_apply=STOSOWAĆ
items.arcaneresin.apply=Pokrywasz swoją różdżkę żywicą, zwiększając jej moc!
items.arcaneresin.desc=Ten drobny proszek mieni się odcieniami fioletu i bieli. Może wzmacniać magiczną energię, podnosząc poziom różdżek po nałożeniu na nie! \n\nUlepszenie różdżki kosztuje 1, 2 lub 3 żywicy, w zależności od jej początkowego poziomu. Żywica może ulepszyć różdżki maksymalnie do +3. \n\nUlepszenia żywicy są _nadpisywane przez inne źródła ulepszeń_ (takie jak zwoje ulepszeń) i nie działają po nasyceniu różdżki laską maga.
items.arcaneresin.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.arcaneresin.level_too_high=Ta różdżka jest zbyt potężna, aby żywica mogła ją ulepszyć.
items.arcaneresin.name=żywica tajemna
items.arcaneresin.not_enough=Nie masz na to wystarczająco dużo żywicy!
items.arcaneresin.prompt=Wybierz różdżkę
items.armor.armor$glyph.discover_hint=Możesz znaleźć przedmiot z tym efektem losowo w lochu lub spróbować samemu zastosować go na przedmiocie.
items.armor.armor$glyph.glyph=glif
items.armor.armor$glyph.killed=%s cię zabił...
items.armor.armor$glyph.rankings_desc=Zabity przez glif
items.armor.armor.ac_detach=ODŁĄCZYĆ
items.armor.armor.avg_absorb=Zazwyczaj ten pancerz _tier-%1$d_ blokuje obrażenia _%2$d-%3$d_ i wymaga _%4$d wytrzymałości_, aby móc go prawidłowo używać.
items.armor.armor.curr_absorb=Ten pancerz _tier-%1$d_ blokuje obrażenia _%2$d-%3$d_ i wymaga _%4$d siły_, aby móc go prawidłowo używać.
items.armor.armor.cursed=Można wyczuć, że pod tą zbroją kryje się złowroga magia.
items.armor.armor.cursed_worn=Ponieważ ta zbroja jest przeklęta, nie masz możliwości jej zdjęcia.
items.armor.armor.defense=Został rozszerzony w celu wzmocnienia _obrony._
items.armor.armor.detach_seal=Zdejmujesz pieczęć ze swojej zbroi.
items.armor.armor.equip_cursed=Zbroja boleśnie cię uciska.
items.armor.armor.evasion=Został rozszerzony w celu zwiększenia _uniku_.
items.armor.armor.excess_str=Ze względu na Twoją nadmierną siłę, jesteś _bardziej unikowy_, gdy nosisz tę zbroję.
items.armor.armor.glyph_hardened=Został _zahartowany_.
items.armor.armor.hardened_no_glyph=Ta zbroja została _utwardzona_, ale obecnie nie ma na niej żadnego glifu.
items.armor.armor.hardening_gone=Utwardzenie tej zbroi już się zestarzało!
items.armor.armor.identify=Teraz znasz już swoją zbroję na tyle dobrze, że możesz ją rozpoznać.
items.armor.armor.incompatible=Interakcja różnych rodzajów magii spowodowała zatarcie glifu na tej zbroi!
items.armor.armor.inscribed=jest na nim wyryty napis _%s._
items.armor.armor.not_cursed=Ta zbroja jest wolna od złowrogiej magii.
items.armor.armor.probably_too_heavy=Być może ta zbroja jest dla ciebie za ciężka.
items.armor.armor.seal_attached=Do tej zbroi przymocowana jest złamana pieczęć Wojownika. Gdy będzie miał zostać ranny poniżej połowy zdrowia, zapewni mu ona tarczę _%d_.
items.armor.armor.seal_transfer=Złamana pieczęć Wojownika musi zostać przymocowana do aktualnie noszonej zbroi, aby przyniosła mu korzyści. Czy chcesz automatycznie odłączyć pieczęć od zbroi, którą zdejmujesz, i przymocować ją do zbroi, którą zakładasz?
items.armor.armor.seal_transfer_no=NIE
items.armor.armor.seal_transfer_yes=Tak
items.armor.armor.too_heavy=Ponieważ Twoja siła jest niewystarczająca, noszenie tej zbroi zmniejszy Twoją zdolność do poruszania się, unikania ciosów i obrony.
items.armor.armor.weak_cursed=Pomimo klątwy możesz zdjąć tę zbroję.
items.armor.classarmor.ac_ability=WYBIERZ ZDOLNOŚĆ
items.armor.classarmor.ac_transfer=PRZENOSIĆ
items.armor.classarmor.charge_use=Skorzystanie ze zdolności w tej chwili spowoduje zużycie ładunku _%s_.
items.armor.classarmor.discover_hint=Przedmiot ten można znaleźć po pokonaniu bossa na 20. piętrze określonym bohaterem.
items.armor.classarmor.low_charge=Zbroja nie ma wystarczająco dużo ładunku, aby użyć jej specjalnej mocy!
items.armor.classarmor.no_ability=Twoja zbroja obecnie nie ma żadnej umiejętności, powinieneś wybrać jedną!
items.armor.classarmor.not_equipped=Aby korzystać z jej specjalnej mocy, musisz założyć tę zbroję!
items.armor.classarmor.transfer_cancel=anulować
items.armor.classarmor.transfer_complete=Właściwości Twojej bohaterskiej zbroi zostały przeniesione!
items.armor.classarmor.transfer_desc=Magię korony króla krasnoludów można przenieść na inny zestaw zbroi. Należy pamiętać, że oryginalna zbroja ulegnie zniszczeniu w trakcie tego procesu.
items.armor.classarmor.transfer_prompt=Wybierz zbroję
items.armor.classarmor.transfer_title=Transfer Armor
items.armor.clericarmor.desc=Nosząc tę mieszankę materiału i płyt, duchowny może wykonywać specjalne czynności.
items.armor.clericarmor.name=szaty bohatera
items.armor.clotharmor.desc=Ta lekka zbroja zapewnia podstawową ochronę.
items.armor.clotharmor.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.armor.clotharmor.name=zbroja z tkaniny
items.armor.curses.antientropy.desc=Klątwa Antyentropii działa przeciwko siłom wszechświata, wciągając energię do noszącego i odciągając ją od otoczenia. To na krótko podpala noszącego, ale zamraża wszystko wokół!
items.armor.curses.antientropy.name=%s antyentropii
items.armor.curses.bulk.desc=Pancerz o większej masie wygląda na większy i bardziej imponujący, ale w rzeczywistości nie zapewnia zwiększonej ochrony. Co gorsza, większy rozmiar znacznie utrudnia wchodzenie do drzwi.
items.armor.curses.bulk.name=%s luzem
items.armor.curses.corrosion.desc=Pancerz antykorozyjny jest w stanie pęknąć pod wpływem żrącego płynu, pokrywając wszystko w pobliżu lepką, kwaśną mazią.
items.armor.curses.corrosion.name=%s korozji
items.armor.curses.displacement.desc=Klątwa przemieszczenia próbuje przenieść użytkownika w bezpieczne miejsce, gdy zostanie zaatakowany. Jest jednak nieco zbyt skuteczna, losowo teleportując użytkownika po poziomie.
items.armor.curses.displacement.name=%s przemieszczenia
items.armor.curses.metabolism.desc=Klątwa metabolizmu natychmiast zamienia sytość w zdrowie, gdy noszący ją człowiek zostaje ranny, przyspieszając proces gojenia, ale szybko powodując głód.
items.armor.curses.metabolism.name=%s metabolizmu
items.armor.curses.multiplicity.desc=Zbroja przeklęta wielością zawiera niebezpieczną magię duplikacji. Czasami tworzy lustrzane odbicie noszącego, ale równie dobrze może duplikować atakującego!
items.armor.curses.multiplicity.name=%s wielokrotności
items.armor.curses.overgrowth.desc=Pancerz z zarośli pokryty jest różnymi kwitnącymi roślinami. Choć ten efekt wygląda ciekawie, nie zapewnia żadnej obrony, a rośliny te będą się losowo aktywować w walce!
items.armor.curses.overgrowth.name=%s przerostu
items.armor.curses.stench.desc=Zbroja przeklęta smrodem będzie uwalniać chmury trującego gazu, który jest niebezpieczny dla wszystkiego, co znajdzie się w chmurze.
items.armor.curses.stench.name=%s smrodu
items.armor.duelistarmor.desc=Nosząc zbroję płytową i pelerynę, Duelist może wykonywać specjalne czynności.
items.armor.duelistarmor.name=napierśnik bohatera
items.armor.glyphs.affection.desc=Ten potężny glif manipuluje umysłem napastnika, tymczasowo go oczarowując.
items.armor.glyphs.affection.name=%s uczucia
items.armor.glyphs.antimagic.desc=Ten potężny glif pozwala zbroi bronić noszącego ją przed atakami magicznymi i fizycznymi. Ta magiczna obrona nie jest zależna od poziomu zbroi.
items.armor.glyphs.antimagic.name=%s antymagii
items.armor.glyphs.brimstone.desc=Ten glif chroni noszącego go i jego rzeczy przed ogniem, całkowicie niwelując jego obrażenia i negatywne efekty.
items.armor.glyphs.brimstone.name=%s siarki
items.armor.glyphs.camouflage.desc=Ten glif pozwala noszącemu go wtopić się w wysoką trawę, zapewniając mu tymczasową niewidzialność.
items.armor.glyphs.camouflage.name=%s kamuflażu
items.armor.glyphs.entanglement.desc=Ten glif sprawia, że wokół noszącego go człowieka tworzy się ziemna zbroja, która pochłania obrażenia. Zbroja ta ulega zniszczeniu, jeśli noszący ją człowiek się poruszy.
items.armor.glyphs.entanglement.name=%s splątania
items.armor.glyphs.flow.desc=Ten glif steruje przepływem wody wokół noszącego go człowieka, dzięki czemu porusza się on znacznie szybciej.
items.armor.glyphs.flow.name=%s przepływu
items.armor.glyphs.obfuscation.desc=Ten glif ukrywa noszącego go mężczyznę, przez co trudniej go wykryć.
items.armor.glyphs.obfuscation.name=%s zaciemniania
items.armor.glyphs.potential.desc=Ten glif gromadzi energię po uderzeniu, ładując różdżkę noszącego go użytkownika po jego aktywacji.
items.armor.glyphs.potential.name=%s potencjału
items.armor.glyphs.repulsion.desc=Ten glif odbija siłę atakującego, odrzucając go do tyłu.
items.armor.glyphs.repulsion.name=%s odpychania
items.armor.glyphs.stone.desc=Ten glif otacza zbroję ciężkim magicznym kamieniem, który uniemożliwia unik, ale blokuje obrażenia proporcjonalnie do uniku.
items.armor.glyphs.stone.name=%s z kamienia
items.armor.glyphs.swiftness.desc=Ten glif zwiększa prędkość noszącego go gracza, jeśli nie znajduje się on w pobliżu wroga.
items.armor.glyphs.swiftness.name=%s szybkości
items.armor.glyphs.thorns.desc=Ten potężny glif rani napastników, powodując u nich powolne krwawienie, gdy atakują noszącego go gracza.
items.armor.glyphs.thorns.name=%s cierni
items.armor.glyphs.viscosity$defereddamage.desc=Obrażenia są zadawane powoli, w miarę upływu czasu, a nie natychmiast.\n\nPozostałe odroczone obrażenia: %d.
items.armor.glyphs.viscosity$defereddamage.name=odroczone szkody
items.armor.glyphs.viscosity$defereddamage.ondeath=Odroczone uszkodzenia cię zabiły...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Zabity przez opóźnione obrażenia
items.armor.glyphs.viscosity.deferred=odroczony %d
items.armor.glyphs.viscosity.desc=Ten glif jest w stanie przechowywać obrażenia zadawane noszącemu go gracza i zadawać je powoli, a nie naraz.
items.armor.glyphs.viscosity.name=%s lepkości
items.armor.huntressarmor.desc=Nosząc ten płaszcz, Łowczyni może wykonywać specjalne czynności.
items.armor.huntressarmor.name=płaszcz bohatera
items.armor.huntressarmor.no_enemies=Żadnych wrogów w zasięgu wzroku
items.armor.leatherarmor.desc=Zbroja wykonana z garbowanej skóry potwora. Nie tak lekka jak zbroja z tkaniny, ale zapewnia lepszą ochronę.
items.armor.leatherarmor.name=skórzana zbroja
items.armor.magearmor.desc=Nosząc tę piękną szatę, Mag może wykonywać specjalne czynności.
items.armor.magearmor.name=szata bohatera
items.armor.mailarmor.desc=Połączone metalowe ogniwa tworzą wytrzymałą, ale elastyczną zbroję.
items.armor.mailarmor.name=zbroja kolczasta
items.armor.platearmor.desc=Ogromne płyty metalowe są połączone ze sobą, tworząc kombinezon zapewniający niezrównaną ochronę każdemu poszukiwaczowi przygód, który jest na tyle silny, by udźwignąć jego ogromny ciężar.
items.armor.platearmor.name=zbroja płytowa
items.armor.roguearmor.desc=Nosząc ten ciemny strój, Łotrzyk może wykonywać specjalne czynności.
items.armor.roguearmor.name=strój bohatera
items.armor.scalearmor.desc=Metalowe łuski przyszyte do skórzanej kamizelki tworzą elastyczną, a zarazem ochronną zbroję.
items.armor.scalearmor.name=zbroja łuskowa
items.armor.warriorarmor.desc=Nosząc tę ciężką zbroję płytową, Wojownik może wykonywać specjalne czynności.
items.armor.warriorarmor.name=zbroja płytowa bohatera
items.artifacts.alchemiststoolkit.ac_brew=NAPAR
items.artifacts.alchemiststoolkit.ac_energize=POBUDZAĆ
items.artifacts.alchemiststoolkit.cursed=Twój przeklęty zestaw narzędzi nie pozwala ci używać alchemii!
items.artifacts.alchemiststoolkit.desc=Ten zestaw zawiera szereg odczynników i ziół oraz małą fiolkę do mieszania, umożliwiającą alchemię w podróży. Fiolka zawiera coś, co wygląda jak alchemiczne kryształy energii w postaci płynnej.
items.artifacts.alchemiststoolkit.desc_cursed=Przeklęty zestaw narzędzi przywiązał się do ciebie i nie pozwoli ci korzystać z alchemii.
items.artifacts.alchemiststoolkit.desc_hint=Wyposażony zestaw narzędzi powoli generuje energię alchemiczną w miarę zdobywania doświadczenia. Wygląda na to, że miksturę w fiolce można ulepszyć, dodając do niej kryształy energii.
items.artifacts.alchemiststoolkit.desc_warming=Zestaw narzędzi jest obecnie rozgrzewany i za chwilę będzie gotowy do użycia.
items.artifacts.alchemiststoolkit.energize_1=6 energii: +1 poziom
items.artifacts.alchemiststoolkit.energize_all=Energia %1$d: +poziomy %2$d
items.artifacts.alchemiststoolkit.energize_desc=Każde 6 kryształów energii zapewni zestawowi narzędzi wystarczającą ilość energii, aby osiągnąć poziom, co zwiększa szybkość, z jaką zestaw narzędzi generuje energię w czasie, a także szybkość, z jaką się nagrzewa.\n\nIle energii chcesz wykorzystać?
items.artifacts.alchemiststoolkit.name=zestaw narzędzi alchemika
items.artifacts.alchemiststoolkit.need_energy=Potrzebujesz do tego co najmniej 6 energii.
items.artifacts.alchemiststoolkit.not_ready=Twój zestaw narzędzi nie zdążył się jeszcze rozgrzać.
items.artifacts.artifact.cannot_wear_two=Nie możesz nosić dwóch takich samych artefaktów.
items.artifacts.artifact.curse_known=Można wyczuć, że wewnątrz artefaktu kryje się złowroga magia.
items.artifacts.artifact.equip_cursed=Artefakt boleśnie się do ciebie przywiązuje.
items.artifacts.artifact.need_to_equip=Aby to zrobić, musisz wyposażyć się w artefakt.
items.artifacts.artifact.not_cursed=Artefakt ten jest wolny od złowrogiej magii.
items.artifacts.capeofthorns$thorns.desc=Twoja peleryna emanuje energią, otaczając cię polem siły odbijającej!\n\nWszystkie otrzymywane obrażenia są redukowane, gdy efekt cierni jest aktywny. Dodatkowo, jeśli atakujący znajduje się obok ciebie, zmniejszona wartość jest odbijana z powrotem w stronę atakującego.\n\nPozostała liczba obrotów cierniami: %s.
items.artifacts.capeofthorns$thorns.inert=Twój Peleryna znów staje się bezwładna.
items.artifacts.capeofthorns$thorns.levelup=Twój Peleryna staje się silniejsza!
items.artifacts.capeofthorns$thorns.name=ciernie
items.artifacts.capeofthorns$thorns.radiating=Twoja peleryna zaczyna emanować energią, czujesz się chroniony!
items.artifacts.capeofthorns.desc=Te zapadnięte arkusze metalu z DM-300 uformowały się w sztywną pelerynę. Wydaje się, że magazynuje głęboką energię, może ma w sobie coś z mocy DM-300?
items.artifacts.capeofthorns.desc_active=Peleryna zdaje się uwalniać zmagazynowaną energię, emanuje ochronną mocą.
items.artifacts.capeofthorns.desc_inactive=Peleryna przyjemnie ciąży na twoich ramionach, masz wrażenie, że odzyskuje energię dzięki odnoszonym obrażeniom.
items.artifacts.capeofthorns.name=Przylądek cierniowy
items.artifacts.chaliceofblood.ac_prick=UKŁUCIE
items.artifacts.chaliceofblood.desc=Ten lśniący srebrny kielich jest dziwnie ozdobiony ostrymi kamieniami szlachetnymi na krawędzi.
items.artifacts.chaliceofblood.desc_1=Trzymając kielich, czujesz dziwną potrzebę ukłucia się ostrymi kamieniami.
items.artifacts.chaliceofblood.desc_2=Część twojej krwi gromadzi się w kielichu. Możesz subtelnie poczuć, jak kielich zasila cię energią życiową, zwiększając naturalną regenerację zdrowia. Nadal chcesz się skaleczyć o kielich, mimo że wiesz, że to będzie bolało.
items.artifacts.chaliceofblood.desc_3=Kielich jest wypełniony po brzegi twoją esencją życia. Czujesz, jak kielich wlewa w ciebie energię życiową.
items.artifacts.chaliceofblood.desc_cursed=Przeklęty kielich przywiązał się do twojej ręki i blokuje twoją zdolność regeneracji zdrowia.
items.artifacts.chaliceofblood.name=kielich krwi
items.artifacts.chaliceofblood.no=Nie, zmieniłem zdanie
items.artifacts.chaliceofblood.ondeath=Kielich wysysa z ciebie całą esencję życiową...
items.artifacts.chaliceofblood.onprick=Kłujesz się, a twoja esencja życiowa spływa do kielicha.
items.artifacts.chaliceofblood.prick_warn=Za każdym razem, gdy użyjesz kielicha, będzie on wysysał z ciebie więcej energii życiowej, ale w zamian dodatkowo wzmocni twoją naturalną regenerację zdrowia.\n\nAktualne nakłucie samego siebie zada _%1$d-%2$d obrażenia_, aczkolwiek obrażenia te można zmniejszyć _zarówno poprzez blokadę fizyczną, jak i magiczną lub redukcję obrażeń._ Bez uwzględnienia efektów redukcji obrażeń, nakłucie samego siebie ma obecnie _%3$s%% szansę_ na całkowite wyssanie twojej siły życiowej.\n\nCzy na pewno chcesz podarować kielichowi więcej energii życiowej?
items.artifacts.chaliceofblood.yes=Tak, wiem, co robię
items.artifacts.cloakofshadows$cloakstealth.desc=Twój płaszcz cieni zapewnia ci niewidzialność, gdy jesteś nim otulony. Pozostaniesz w niewidzialności, dopóki nie zostanie anulowany lub dopóki nie wyczerpie się jego ładunek.\n\nDopóki jesteś niewidzialny, wrogowie nie mogą cię atakować ani podążać za tobą. Ataki fizyczne i efekty magiczne (takie jak zwoje i różdżki) natychmiast anulują niewidzialność.\n\nTury do momentu użycia ładunku: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Twój płaszcz staje się mocniejszy!
items.artifacts.cloakofshadows$cloakstealth.name=zamaskowany
items.artifacts.cloakofshadows$cloakstealth.no_charge=Twój płaszcz stracił energię.
items.artifacts.cloakofshadows.ac_stealth=PODSTĘP
items.artifacts.cloakofshadows.cooldown=Twój płaszcz potrzebuje %d więcej rund, żeby się zregenerować.
items.artifacts.cloakofshadows.cursed=Nie możesz używać przeklętego płaszcza.
items.artifacts.cloakofshadows.desc=Bezcenny magiczny płaszcz, skradziony z królewskiej zbrojowni wiele lat temu przez Łotrzyka. Po założeniu, można go użyć, aby na krótko stać się całkowicie niewidzialnym.\n\nIm częściej używany jest płaszcz, tym staje się silniejszy, pozwalając Łotrzykowi stawać się niewidzialnym częściej i na dłużej.
items.artifacts.cloakofshadows.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.artifacts.cloakofshadows.name=płaszcz cieni
items.artifacts.cloakofshadows.no_charge=Twój płaszcz nie naładował się jeszcze na tyle, abyś mógł go użyć.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Jak to przeżyłeś?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Chciałbym mieć taki...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=O mój Boże! Ty jeszcze żyjesz!
items.artifacts.driedrose$ghosthero.def_verb=uniknął
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Przepraszam... powodzenia...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Dokończ to... beze mnie...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nie... nie mogę...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Powodzenia...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Zmęczony... na razie...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Wrócę...
items.artifacts.driedrose$ghosthero.desc=Delikatna, eteryczna postać o humanoidalnym kształcie. Jej moc wydaje się być związana z różą, którą posiadasz. \n\nTen duch może i nie jest niczym niezwykłym, ale wydaje się, że to twój jedyny prawdziwy przyjaciel tutaj.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Dlaczego tak się dzieje? Myślałem, że nam się udało?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Jak to możliwe, że coś takiego nadal może wpływać na ten świat?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Mam nadzieję, że wiesz, co robisz z tym amuletem.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Chyba jeszcze nie skończyliśmy.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Zaszliśmy już tak daleko, możemy to dokończyć!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Jeszcze trochę i uda nam się stąd wydostać!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Od bardzo dawna nie odwiedził nas żaden człowiek ani krasnolud.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Co skłoniło krasnoludy do porzucenia kopalni złota?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Szkoda, że całe to złoto jest na pierwszy rzut oka bezużyteczne.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Stworzenia tutaj są wypaczone, zupełnie jak w kanałach.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Nawet nietoperze są tu krwiożercze.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Nie ma śladu sprzętu górniczego. Czy krasnoludy odzyskały wszystko?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Krasnoludy były pracowite, ale i chciwe.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Więc metropolia krasnoludów naprawdę upadła.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Mam nadzieję, że powierzchnia nigdy nie skończy tak, jak to miejsce.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Krasnoludy nie powinny być tak blade.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Nie wiem, co jest gorsze, krasnoludy czy ich dzieła.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Wygląda na to, że krasnoludy również stały się bezmyślnymi potworami.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Co to za miejsce?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=To miejsce jest przerażające...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Co krasnoludy sobie myślały, igrając z taką mocą?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Potwory tutaj są nie z tego świata, skąd się wzięły?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Czujesz to? Jakby coś nas obserwowało.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Całe szczęście, że są latarki, bo tu jest tak ciemno!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Słyszałem opowieści o tym miejscu, ale nic dobrego.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=To miejsce zawsze przypominało bardziej loch niż więzienie.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Nie mogę sobie wyobrazić, co się działo, kiedy to miejsce zostało opuszczone.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Wygląda na to, że zarówno więźniowie, jak i strażnicy zostali zamienieni w potwory.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Co może być odpowiedzialne za obecność tych wszystkich szkieletów?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ci ludzie nie musieli skończyć w ten sposób...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Dawniej te kanały były bezpieczne, ludzie mieszkali tu nawet zimą.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ciekawe, co stało się z patrolami strażniczymi, czy się poddali?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Miałem rodzinę na powierzchni, mam nadzieję, że są bezpieczni.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Strażnicy nie mogli pokonać tych potworów, ale może nam się uda.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Jeśli nawet kanały są tak niebezpieczne, to ciekawe, co jest na dole...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Co mogło spowodować, że te szczury i kraby urosły do tak dużych rozmiarów?
items.artifacts.driedrose$ghosthero.direct_prompt=Co powinienem zrobić?
items.artifacts.driedrose$ghosthero.directed_attack_1=Okej, zaatakuję to.
items.artifacts.driedrose$ghosthero.directed_attack_2=Ja wezmę ten.
items.artifacts.driedrose$ghosthero.directed_attack_3=Ujmujący...
items.artifacts.driedrose$ghosthero.directed_attack_4=Złapmy ich!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ja to mam.
items.artifacts.driedrose$ghosthero.directed_follow_1=Dobrze, pójdę za tobą.
items.artifacts.driedrose$ghosthero.directed_follow_2=Będę cię wspierał.
items.artifacts.driedrose$ghosthero.directed_follow_3=Obserwuję Cię...
items.artifacts.driedrose$ghosthero.directed_follow_4=Dobra, jedziemy!
items.artifacts.driedrose$ghosthero.directed_follow_5=Mogę cię wspierać.
items.artifacts.driedrose$ghosthero.directed_position_1=Dobrze, podtrzymam to stanowisko.
items.artifacts.driedrose$ghosthero.directed_position_2=Pójdę tam i będę bronił.
items.artifacts.driedrose$ghosthero.directed_position_3=Zmiana położenia...
items.artifacts.driedrose$ghosthero.directed_position_4=Już jadę!
items.artifacts.driedrose$ghosthero.directed_position_5=Pójdę tam.
items.artifacts.driedrose$ghosthero.discover_hint=Możesz znaleźć tę postać, mając przy sobie specjalny artefakt.
items.artifacts.driedrose$ghosthero.hello=Witaj ponownie %s.
items.artifacts.driedrose$ghosthero.introduce=Mój duch jest związany z tą różą, była dla mnie bardzo cenna, dar od mojej miłości, którą zostawiłem na powierzchni.\n\nNie mogę do niego wrócić, ale dzięki tobie mam drugą szansę na dokończenie mojej podróży. Kiedy będę mógł, odpowiem na twoje wezwanie i będę z tobą walczył.\n\nDopóki masz różę, słyszę twój głos, więc możesz nim kierować mną z daleka.\n\nMam nadzieję, że odniesiesz sukces tam, gdzie ja poniosłem porażkę...
items.artifacts.driedrose$ghosthero.name=smutny duch
items.artifacts.driedrose$ghosthero.player_killed_1=NIE!...
items.artifacts.driedrose$ghosthero.player_killed_2=Nie mogłam im pomóc...
items.artifacts.driedrose$ghosthero.player_killed_3=Nie w ten sposób...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Tylko krasnoludy zbudowałyby maszynę górniczą, która zabija intruzów.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Ta rzecz jest ogromna...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Jak to możliwe, że ta rzecz działa tak długo?
items.artifacts.driedrose$ghosthero.seen_goo_1=Uważaj, Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Wielu moich przyjaciół zginęło z tego powodu, czas na zemstę!
items.artifacts.driedrose$ghosthero.seen_goo_3=Nie możemy pozwolić, żeby taka obrzydliwość żyła!
items.artifacts.driedrose$ghosthero.seen_king_1=Kiedy ludzie mówią, że władza deprawuje, to właśnie to mają na myśli.
items.artifacts.driedrose$ghosthero.seen_king_2=Teraz jest bardziej liczem niż królem.
items.artifacts.driedrose$ghosthero.seen_king_3=Nawet po śmierci krasnoludy są posłuszne swemu panu.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Jedyny pozostały więzień to niebezpieczny zabójca. Oczywiście...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Złapał nas w pułapkę!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Słyszałem straszne historie o tej masce...
items.artifacts.driedrose$ghosthero.seen_yog_1=O, to nie wygląda dobrze.
items.artifacts.driedrose$ghosthero.seen_yog_2=Więc tak wygląda bóg?
items.artifacts.driedrose$ghosthero.seen_yog_3=To będzie bolało...
items.artifacts.driedrose$petal.desc=Słaby, wysuszony płatek, który jakimś cudem przetrwał tak daleko w lochu.
items.artifacts.driedrose$petal.levelup=Dodajesz płatek do róży.
items.artifacts.driedrose$petal.maxlevel=Róża jest ukończona!
items.artifacts.driedrose$petal.name=suszony płatek
items.artifacts.driedrose$petal.no_room=Nie ma już miejsca na ten płatek, więc go wyrzucasz.
items.artifacts.driedrose$petal.no_rose=Nie masz róży, do której mógłbyś dodać ten płatek.
items.artifacts.driedrose$wndghosthero.armor_prompt=Wybierz zbroję
items.artifacts.driedrose$wndghosthero.cant_cursed=Duch może używać wyłącznie sprzętu, co do którego masz pewność, że nie jest przeklęty.
items.artifacts.driedrose$wndghosthero.cant_strength=Duch nie jest wystarczająco silny, żeby tego użyć.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Duch może nie być wystarczająco silny, aby tego użyć.
items.artifacts.driedrose$wndghosthero.cant_unique=Duch nie może używać unikalnych przedmiotów.
items.artifacts.driedrose$wndghosthero.desc=Duch sam w sobie jest słaby, ale jego forma jest wystarczająco solidna, by wyposażyć go w broń i zbroję. Będzie mógł używać tych przedmiotów tak jak ty.\n\nDuch może obecnie wyposażyć się w przedmioty wymagające siły do _%d._
items.artifacts.driedrose$wndghosthero.title=Sprzęt Ducha
items.artifacts.driedrose$wndghosthero.weapon_prompt=Wybierz broń
items.artifacts.driedrose.ac_direct=BEZPOŚREDNI
items.artifacts.driedrose.ac_outfit=STRÓJ
items.artifacts.driedrose.ac_summon=WEZWAĆ
items.artifacts.driedrose.charged=Twoja róża jest w pełni naładowana!
items.artifacts.driedrose.cursed=Nie możesz użyć przeklętej róży.
items.artifacts.driedrose.desc=Czy to ta róża, o której wspominał duch przed zniknięciem? Wydaje się, że ma w sobie jakąś duchową moc, być może można jej użyć do przekierowania energii zaginionego wojownika.
items.artifacts.driedrose.desc_armor=Zbroja ducha: %s
items.artifacts.driedrose.desc_cursed=Przeklęta róża jest przywiązana do twojej dłoni, jest niesamowicie zimna.
items.artifacts.driedrose.desc_hint=Wygląda na to, że brakuje jej kilku płatków. Może ich ponowne przyklejenie wzmocni różę.
items.artifacts.driedrose.desc_no_quest=Wysuszona, stara róża, która mimo wieku nadal trzyma się razem.\n\nWydaje się, że ma pewną duchową moc, ale w tej chwili nie masz pojęcia, jak ją wykorzystać.
items.artifacts.driedrose.desc_strength=Siła ducha: %s
items.artifacts.driedrose.desc_weapon=Broń Ducha: %s
items.artifacts.driedrose.name=suszona róża
items.artifacts.driedrose.no_charge=Twoja róża nie jest jeszcze w pełni naładowana.
items.artifacts.driedrose.no_space=Nie ma wolnego miejsca w Twojej okolicy.
items.artifacts.driedrose.spawned=Już przywołałeś ducha.
items.artifacts.etherealchains$chainsrecharge.levelup=Twoje łańcuchy stają się silniejsze!
items.artifacts.etherealchains.ac_cast=RZUCAĆ
items.artifacts.etherealchains.cant_pull=Twoje łańcuchy nie są w stanie przyciągnąć tego celu.
items.artifacts.etherealchains.cant_reach=Twoje łańcuchy tam nie dosięgną.
items.artifacts.etherealchains.cursed=Nie możesz używać przeklętych łańcuchów.
items.artifacts.etherealchains.desc=Te duże, a zarazem lekkie łańcuchy emanują duchową energią. Można ich używać, by przyciągać cię do terenu lub wrogów. Eteryczna natura łańcuchów pozwala im nawet przechodzić przez ściany!
items.artifacts.etherealchains.desc_cursed=Przeklęte łańcuchy przyczepione są do twojego boku i nieustannie się huśtają, próbując cię potknąć lub związać.
items.artifacts.etherealchains.desc_equipped=Łańcuchy spoczywają wokół twojego boku, powoli wysysając energię duchową z pokonanych. Każdy ładunek to ogniwo w łańcuchu, które rozciągnie się dokładnie na jedno pole.
items.artifacts.etherealchains.does_nothing=To nic nie da.
items.artifacts.etherealchains.inside_wall=Łańcuchy mogą cię przenieść jedynie przez ściany, ale nie do środka.
items.artifacts.etherealchains.name=eteryczne łańcuchy
items.artifacts.etherealchains.no_charge=Twoje łańcuchy nie mają wystarczającego ładunku.
items.artifacts.etherealchains.nothing_to_grab=Nie ma tam niczego, czego można by się złapać.
items.artifacts.etherealchains.prompt=Wybierz lokalizację docelową.
items.artifacts.etherealchains.rooted=Twoje łańcuchy nie pociągną cię, dopóki jesteś zakorzeniony.
items.artifacts.holytome.ac_cast=RZUCAĆ
items.artifacts.holytome.cursed=Nie możesz używać przeklętej księgi.
items.artifacts.holytome.desc=Święta księga, która skupia boską magię Kleryka. Używanie jej pozwala Klerykowi rzucać różnorodne zaklęcia. \n\nKsięga będzie stopniowo zyskiwać na mocy, gdy Kleryk będzie jej używał, zapewniając mu więcej maksymalnych ładunków i nieznacznie zwiększając szybkość ładowania.
items.artifacts.holytome.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.artifacts.holytome.levelup=Twoja księga staje się silniejsza!
items.artifacts.holytome.name=święta księga
items.artifacts.holytome.no_spell=Nie możesz teraz rzucić tego zaklęcia.
items.artifacts.hornofplenty.ac_eat=JEŚĆ
items.artifacts.hornofplenty.ac_snack=PRZEKĄSKA
items.artifacts.hornofplenty.ac_store=SKLEP
items.artifacts.hornofplenty.desc=W ten róg nie da się dąć, ale zdaje się on napełniać jedzeniem w miarę twoich przygód i zdobywania doświadczenia. Możesz zużywać każdy ładunek osobno jako przekąskę lub jeść, aż się nasycisz.
items.artifacts.hornofplenty.desc_cursed=Przeklęty róg przywiązał się do twojego boku, wygląda na to, że bardziej zależy mu na zdobywaniu pożywienia niż na jego wytwarzaniu.
items.artifacts.hornofplenty.desc_hint=Być może da się zwiększyć moc rogu poprzez dostarczenie mu energii z pożywienia.
items.artifacts.hornofplenty.eat=Jesz z rogu.
items.artifacts.hornofplenty.feed=Róg pochłania ofiarowane przez ciebie jedzenie.
items.artifacts.hornofplenty.full=Twój róg jest pełen jedzenia!
items.artifacts.hornofplenty.levelup=Róg pochłania ofiarowane ci jedzenie i rośnie w siłę!
items.artifacts.hornofplenty.maxlevel=Twój róg pożarł całe jedzenie, jakie mógł!
items.artifacts.hornofplenty.name=róg obfitości
items.artifacts.hornofplenty.no_food=W twoim rogu nie ma nic do jedzenia!
items.artifacts.hornofplenty.prompt=Wybierz jakieś jedzenie
items.artifacts.hornofplenty.reject=Twój róg odrzuca surowe, mdłe owoce.
items.artifacts.lloydsbeacon.ac_return=POWRÓT
