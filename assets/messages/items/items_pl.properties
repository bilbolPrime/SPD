items.rings.ring.sapphire=pierścień z szafirem
items.rings.ring.topaz=pierścień z topazem
items.rings.ring.tourmaline=pierścień z turmalinem
items.rings.ring.unknown_desc=Ten metalowy pierścień zdobi duży %s, lśniący w ciemności. Kto wie, jaki będzie miał efekt po założeniu?
items.rings.ringofaccuracy.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając Twoją celność łącznie o _%s%%_.
items.rings.ringofaccuracy.desc=Ten pierścień zwiększa szansę trafienia wroga.
items.rings.ringofaccuracy.name=pierścień celności
items.rings.ringofaccuracy.stats=Po założeniu pierścień ten zwiększy Twoją celność o _%s%%._
items.rings.ringofaccuracy.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększy Twoją celność o _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Zwiększenie celności
items.rings.ringofarcana.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając w sumie moc zaklęć i glifów o _%s%%_.
items.rings.ringofarcana.desc=Ten pierścień wzmacnia magiczne zaklęcia na broni i glify na zbroi, w tym klątwy! Najpierw zwiększa szansę aktywacji, a następnie, gdy szansa aktywacji osiągnie 100%, zwiększa siłę efektu. Przeklęty pierścień osłabia zaklęcia, glify i klątwy.
items.rings.ringofarcana.name=pierścień arkanów
items.rings.ringofarcana.stats=Po założeniu pierścień ten zwiększy moc zaklęć i glifów o _%s%%._
items.rings.ringofarcana.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększa moc zaklęć i glifów o _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Wzmocnienie Arkany
items.rings.ringofelements.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zapewniając łącznie _%s%%_ odporności na żywioły.
items.rings.ringofelements.desc=Ten pierścień zapewnia odporność na ogień, elektryczność, gazy i inne żywioły. Skraca też czas działania negatywnych efektów.
items.rings.ringofelements.name=pierścień żywiołów
items.rings.ringofelements.stats=Po założeniu pierścień ten zapewni _%s%%_ odporność na żywioły.
items.rings.ringofelements.typical_stats=Po założeniu pierścień ten zazwyczaj zapewnia _%s%%_ odporność na żywioły.
items.rings.ringofelements.upgrade_stat_name_1=Opór
items.rings.ringofenergy.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając w sumie prędkość ładowania o _%s%%_.
items.rings.ringofenergy.desc=Twój magiczny ekwipunek będzie się ładować szybciej w polu arkanicznym promieniującym z tego pierścienia. Przeklęty pierścień będzie się ładować wolniej.
items.rings.ringofenergy.name=pierścień energii
items.rings.ringofenergy.stats=Po założeniu pierścień ten zwiększy szybkość ładowania różdżki, artefaktu i bohaterskiej zbroi o _%s%%._
items.rings.ringofenergy.typical_stats=Po założeniu pierścień ten będzie zazwyczaj zwiększał prędkość ładowania różdżki, artefaktu i bohaterskiej zbroi o _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Wzmocnienie ładowania
items.rings.ringofevasion.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając w sumie Twój unik o _%s%%_.
items.rings.ringofevasion.desc=Ten pierścień zwiększa szansę uniknięcia ataku wroga.
items.rings.ringofevasion.name=pierścień uniku
items.rings.ringofevasion.stats=Po założeniu pierścień ten zwiększy Twoją zdolność uniku o _%s%%._
items.rings.ringofevasion.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększy twoją zdolność uniku o _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Wzmocnienie uniku
items.rings.ringofforce$brawlersstance.desc=W tej postawie standardowe ataki Duelistki będą korzystać z wyposażonego pierścienia siły, nawet gdy ma ona przy sobie broń. Ataki te zyskują dodatkowe obrażenia i nadal korzystają z ulepszeń i zaklęć broni.\n\nUtrzymanie tej postawy wymaga jednak skupienia, zmniejszając szybkość ładowania zdolności broni o 50%.\n\nTę postawę można włączać i wyłączać za pomocą pierścienia siły, ale zmniejszenie szybkości ładowania utrzyma się przez chwilę, jeśli postawa zostanie szybko aktywowana i dezaktywowana.
items.rings.ringofforce$brawlersstance.name=postawa awanturnika
items.rings.ringofforce.ability_desc=Pojedynek może przyjąć postawę _brawlera_ z tym pierścieniem, dzięki czemu jej standardowe ataki zawsze będą używać tego pierścienia, nawet z założoną bronią. Ataki te zadają _%1$d-%2$d obrażeń_ i odziedziczą również zaklęcie i wzmocnienie broni. Ta postawa spowalnia szybkość ładowania broni o 50%%.
items.rings.ringofforce.ability_name=postawa awanturnika
items.rings.ringofforce.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zadając łącznie _%1$d-%2$d obrażeń_ bez broni lub zwiększając obrażenia o _%3$d_ z bronią.
items.rings.ringofforce.desc=Ten pierścień wzmacnia siłę ciosów wręcz noszącego. Ta dodatkowa moc jest dość słaba podczas walki bronią, ale atak bez broni będzie znacznie silniejszy. Przeklęty pierścień osłabi natomiast ciosy noszącego.
items.rings.ringofforce.name=pierścień siły
items.rings.ringofforce.stats=Gdy jesteś bez broni i przy swojej obecnej sile, pierścień ten zadaje _%1$d-%2$d obrażeń._ Po założeniu broni pierścień ten zwiększa obrażenia o _%3$d._
items.rings.ringofforce.typical_ability_desc=Pojedynek może przyjąć postawę _brawlera_ z tym pierścieniem, dzięki czemu jej standardowe ataki zawsze będą używać tego pierścienia, nawet z założoną bronią. Te ataki zazwyczaj zadają _%1$d-%2$d obrażeń_ i dziedziczą również zaklęcie i wzmocnienie broni. Ta postawa spowalnia szybkość przeładowania broni o 50%%.
items.rings.ringofforce.typical_stats=Gdy jesteś bez broni i dysponujesz swoją obecną siłą, pierścień ten zazwyczaj zadaje obrażenia rzędu _%1$d-%2$d._ Po założeniu broni pierścień ten zazwyczaj zwiększa obrażenia o _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Nieuzbrojone obrażenia
items.rings.ringofforce.upgrade_stat_name_2=Wzmocnienie obrażeń uzbrojonych
items.rings.ringofforce.upgrade_stat_name_3=Obrażenia umiejętności
items.rings.ringoffuror.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając w sumie prędkość Twoich ataków o _%s%%_.
items.rings.ringoffuror.desc=Ten pierścień obdarza noszącego go wewnętrzną furią, pozwalając mu atakować szybciej. Przeklęty pierścień zamiast tego spowolni szybkość ataku noszącego.
items.rings.ringoffuror.name=pierścień furii
items.rings.ringoffuror.stats=Po założeniu pierścień ten zwiększy prędkość twoich ataków o _%s%%._
items.rings.ringoffuror.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększy prędkość twoich ataków o _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Zwiększenie prędkości ataku
items.rings.ringofhaste.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając w sumie Twoją prędkość ruchu o _%s%%_.
items.rings.ringofhaste.desc=Ten pierścień przyspiesza upływ czasu dla noszącej go osoby, pozwalając wykonywać wszystkie czynności nieco szybciej.
items.rings.ringofhaste.name=pierścień pośpiechu
items.rings.ringofhaste.stats=Po założeniu pierścień ten zwiększy Twoją prędkość ruchu o _%s%%._
items.rings.ringofhaste.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększa prędkość ruchu o _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Zwiększenie prędkości ruchu
items.rings.ringofmight.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając Twoją siłę o _%1$d_ i maksymalne PW o _%2$s%%_.
items.rings.ringofmight.desc=Pierścień ten wzmacnia cechy fizyczne noszącego, zapewniając mu większą siłę fizyczną i kondycję. Przeklęty pierścień osłabi noszącego.
items.rings.ringofmight.name=pierścień potęgi
items.rings.ringofmight.stats=Po założeniu pierścień ten zwiększy Twoją siłę o _%1$d_ i Twoje maksymalne HP o _%2$s%%._
items.rings.ringofmight.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększy twoją siłę o _%1$d_ i twoje maksymalne PW o _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=wzmocnienie siły
items.rings.ringofmight.upgrade_stat_name_2=Maksymalne wzmocnienie HP
items.rings.ringofsharpshooting.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając poziom efektywnej broni rzucanej o _%1$d_ i zwiększając jej wytrzymałość o _%2$s%%_.
items.rings.ringofsharpshooting.desc=Pierścień ten zwiększa precyzję i celność noszącego, co sprawi, że wszystkie bronie miotacze będą bardziej zabójcze i trwalsze. Przeklęty pierścień będzie miał odwrotny efekt.
items.rings.ringofsharpshooting.name=pierścień strzelectwa wyborowego
items.rings.ringofsharpshooting.stats=Po założeniu pierścień ten zwiększy obrażenia zadawane przez broń rzucaną, tak jakby jej poziom został zwiększony o _%1$d_, a jej wytrzymałość zwiększy się o _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększa obrażenia zadawane przez broń rzucaną, tak jakby jej poziom został zwiększony o _%1$d_, a jej wytrzymałość zwiększy się o _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Wzmocnienie obrażeń poziomu
items.rings.ringofsharpshooting.upgrade_stat_name_2=Zwiększenie trwałości
items.rings.ringoftenacity.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zmniejszając otrzymywane przez Ciebie obrażenia łącznie nawet o _%s%%_.
items.rings.ringoftenacity.desc=Po założeniu pierścień ten pozwoli noszącemu oprzeć się zazwyczaj śmiertelnym ciosom. Im bardziej ranny jest użytkownik, tym bardziej odporny będzie na obrażenia. Przeklęty pierścień ułatwi natomiast wrogom zabicie noszącego.
items.rings.ringoftenacity.name=pierścień wytrwałości
items.rings.ringoftenacity.stats=Po założeniu pierścień ten zmniejszy otrzymywane przez ciebie obrażenia nawet o _%s%%._
items.rings.ringoftenacity.typical_stats=Po założeniu pierścień ten zazwyczaj zmniejszy otrzymywane obrażenia nawet o _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maksymalna odporność na uszkodzenia
items.rings.ringofwealth.combined_stats=Założone przez Ciebie pierścienie łączą swoją moc, zwiększając Twoje szczęście w sumie o _%s%%_.
items.rings.ringofwealth.desc=Ten pierścień działa jak magnes na skarby, zwiększając prawdopodobieństwo, że wrogowie i pojemniki będą nieść cenne przedmioty. Przeklęty pierścień zmniejszy natomiast szansę na zdobycie łupów.
items.rings.ringofwealth.name=pierścień bogactwa
items.rings.ringofwealth.stats=Po założeniu pierścień ten zwiększy Twoje szczęście o _%s%%._
items.rings.ringofwealth.typical_stats=Po założeniu pierścień ten zazwyczaj zwiększa twoje szczęście o _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Wzmocnienie szczęścia
items.scrolls.exotic.exoticscroll.berkanan=egzotyczny zwój BERKANANA
items.scrolls.exotic.exoticscroll.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.scrolls.exotic.exoticscroll.gyfu=egzotyczny zwój GYFU
items.scrolls.exotic.exoticscroll.isaz=egzotyczny zwój ISAZ
items.scrolls.exotic.exoticscroll.kaunan=egzotyczny zwój z Kowna
items.scrolls.exotic.exoticscroll.laguz=egzotyczny zwój LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=egzotyczny zwój MANNAZA
items.scrolls.exotic.exoticscroll.naudiz=egzotyczny zwój NAUDIZA
items.scrolls.exotic.exoticscroll.odal=egzotyczny zwój ODAL
items.scrolls.exotic.exoticscroll.raido=egzotyczny zwój RAIDO
items.scrolls.exotic.exoticscroll.sowilo=egzotyczny zwój SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=egzotyczny zwój TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Na tym czarnym pergaminie widnieje błyszcząca, nieczytelna magiczna runa. Wydaje się być obca tej krainie, kto wie, co się stanie, gdy przeczyta się ją na głos?
items.scrolls.exotic.exoticscroll.yngvi=egzotyczny zwój YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Zaklęcie na tym zwoju otoczy cię magiczną aurą, która tymczasowo zablokuje wszystkie magiczne efekty, zarówno szkodliwe, jak i pomocne. Dotyczy to efektów większości magicznych przedmiotów, takich jak różdżki, zwoje, pierścienie, artefakty, zaklęcia i klątwy. Zdolności heroicznej zbroi są jednak wystarczająco silne, by działać niezależnie od tego.
items.scrolls.exotic.scrollofantimagic.name=zwój antymagii
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Wokół ciebie pojawiła się magiczna arena, oznaczona kłębiącą się czerwoną mgłą.\n\nGdy stoisz we mgle, twój głód nie wzrośnie, a obrażenia ze wszystkich źródeł będą o 33%% mniejsze. Jeśli posiadasz inne źródła redukcji obrażeń (takie jak pancerz), zostaną one zastosowane po redukcji o 33%%.\n\nPozostała liczba tur: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena wyzwań
items.scrolls.exotic.scrollofchallenge.desc=Po przeczytaniu na głos zwój ten wywoła potężny ryk, który przyciągnie wrogów do użytkownika, jednocześnie tworząc wokół nich małą arenę.\n\nDopóki czytelnik pozostaje na tej arenie, otrzymuje o 33% mniej obrażeń ze wszystkich źródeł (efekt ten jest stosowany przed innymi formami redukcji obrażeń) i nie odczuwa uczucia sytości.\n\nRozmiar areny będzie dostosowywał się do rozmiaru obszaru, w którym znajduje się czytelnik. Będzie ona szczególnie mała w niektórych obszarach z bossami.
items.scrolls.exotic.scrollofchallenge.name=zwój wyzwania
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Twój zwój wróżby zidentyfikował następujące elementy:
items.scrolls.exotic.scrollofdivination.desc=Ten zwój losowo zidentyfikuje cztery rodzaje przedmiotów, których obecnie nie znasz. Zidentyfikowane typy to kolor mikstury, runa zwoju lub klejnot pierścienia. Zidentyfikowane przedmioty niekoniecznie będą tymi, które nosisz.
items.scrolls.exotic.scrollofdivination.name=zwój wróżby
items.scrolls.exotic.scrollofdivination.nothing_left=Nie ma już nic do zidentyfikowania!
items.scrolls.exotic.scrollofdread.desc=Po przeczytaniu, ten zwój wyemituje błysk czerwonego światła, który wzbudzi niesamowity strach we wszystkich wrogach w polu widzenia. Efekt jest tak potężny, że będą oni próbowali szybko uciec z całego lochu i nigdy więcej się nie pojawią!\n\nPodobnie jak w przypadku strachu, efekt ten może wygasnąć z czasem lub w wyniku ataku na wroga.\n\nWrogowie o silnej woli, tacy jak bossowie, zostaną narażeni na zwykły strach.
items.scrolls.exotic.scrollofdread.name=zwój grozy
items.scrolls.exotic.scrollofenchantment.armor=Wybierz glif, który chcesz zastosować do swojej zbroi.
items.scrolls.exotic.scrollofenchantment.cancel=anulować
items.scrolls.exotic.scrollofenchantment.cancel_warn=Anulowanie nadal spowoduje zużycie zwoju zaklęcia. Jesteś pewien?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nie, zmieniłem zdanie
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Tak, jestem pewien
items.scrolls.exotic.scrollofenchantment.desc=Ten zwój nasyci broń lub zbroję potężną magiczną energią. Czytelnik ma nawet pewną kontrolę nad tym, jaką magią zostanie nasycona.
items.scrolls.exotic.scrollofenchantment.inv_title=Zaczaruj przedmiot
items.scrolls.exotic.scrollofenchantment.name=zwój zaklęcia
items.scrolls.exotic.scrollofenchantment.weapon=Wybierz zaklęcie, które chcesz zastosować do swojej broni.
items.scrolls.exotic.scrollofforesight.desc=Po przeczytaniu tego zwoju, czytelnik będzie stale i z krystaliczną jasnością widział szczegóły pobliskiego terenu. Efekt ten utrzymuje się przez długi czas i ujawnia wszystkie ukryte drzwi lub pułapki, dzięki czemu poszukiwania stają się zbędne.
items.scrolls.exotic.scrollofforesight.name=zwój przewidywania
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Anulowanie nadal będzie skutkowało zużyciem zwoju metamorfozy. Jesteś pewien?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Wybierz talent, który chcesz przekształcić.
items.scrolls.exotic.scrollofmetamorphosis.desc=Ten zwój zawiera potężną magię transmutacji, która działa na rzucającego zaklęcie, a nie na przedmiot. Magia tego zwoju pozwoli ci wybrać jeden talent i zastąpić go jednym z pięciu talentów tego samego poziomu z różnych klas bohaterów!\n\nTen efekt działa tylko na talenty klasowe, a nie na talenty zdobyte z podklas lub umiejętności pancerza. Talenty, których nie możesz użyć, nie będą dostępne jako opcje.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=przemieniać talent
items.scrolls.exotic.scrollofmetamorphosis.name=zwój metamorfozy
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Wybierz nowy talent, którym zastąpisz swój dotychczasowy.
items.scrolls.exotic.scrollofmysticalenergy.desc=Surowa magiczna moc zawarta w tym pergaminie po uwolnieniu będzie z czasem zasilać artefakty wyposażone przez użytkownika.
items.scrolls.exotic.scrollofmysticalenergy.name=zwój mistycznej energii
items.scrolls.exotic.scrollofpassage.desc=Zaklęcie na tym pergaminie natychmiast przenosi czytelnika do najbliższego regionu, znajdującego się na pierwszym piętrze nad nim. Bardzo przydatne, aby szybko dostać się do sklepu.
items.scrolls.exotic.scrollofpassage.name=zwój przejścia
items.scrolls.exotic.scrollofprismaticimage.desc=Zaklęcie na tym zwoju stworzy kolorową, iluzoryczną kopię czytającego. Ten pryzmatyczny obraz działa jak słabszy klon czytającego, z podobną obroną, ale niższymi punktami zdrowia i obrażeniami.\n\nPryzmatyczny obraz pojawi się w obecności wrogów i będzie próbował bronić czytającego.\n\nJeśli pryzmatyczny obraz już istnieje, użycie tego zwoju całkowicie go uleczy.
items.scrolls.exotic.scrollofprismaticimage.name=zwój obrazu pryzmatycznego
items.scrolls.exotic.scrollofpsionicblast.desc=Ten zwój zawiera niewiarygodną, niszczycielską energię, którą można skierować, by zniszczyć umysły wszystkich widocznych istot.\n\nJest jednak znaczący zwrot, a czytelnik również zostanie zraniony, oślepiony i osłabiony. Im więcej celów trafi zwój, tym mniej obrażeń odniesie.
items.scrolls.exotic.scrollofpsionicblast.name=zwój wybuchu psionicznego
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psioniczny Wybuch rozrywa twój umysł...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=To stworzenie zostało zaczarowane magią zwoju syreniej pieśni.\n\nZaczarowana postać staje się twoim stałym sojusznikiem i będzie walczyć z każdym wrogiem, którego napotka.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=ujarzmiony
items.scrolls.exotic.scrollofsirenssong.cancel=Musisz wybrać cel.
items.scrolls.exotic.scrollofsirenssong.desc=Przeczytanie tego zwoju emituje uwodzicielską melodię, która oczaruje wybranego wroga, na stałe zamieniając go w sojusznika! Inni wrogowie, którzy ją usłyszą, zostaną tymczasowo zaczarowani.\n\n Szczególnie silni wrogowie mogą oprzeć się efektowi oczarowania i zamiast tego zostaną zaczarowani.
items.scrolls.exotic.scrollofsirenssong.name=zwój pieśni syreny
items.scrolls.exotic.scrollofsirenssong.no_target=Zwój aktywuje się bez celu.
items.scrolls.exotic.scrollofsirenssong.prompt=Wybierz cel
items.scrolls.inventoryscroll.no=Nie, zmieniłem zdanie
items.scrolls.inventoryscroll.warning=Czy na pewno chcesz anulować użycie tego zwoju? Zwój nie został wcześniej zidentyfikowany, więc i tak zostanie zużyty.
items.scrolls.inventoryscroll.yes=Tak, jestem pewien
items.scrolls.scroll$placeholder.name=zwój
items.scrolls.scroll.ac_read=CZYTAĆ
items.scrolls.scroll.berkanan=zwój BERKANANA
items.scrolls.scroll.blinded=Nie możesz przeczytać zwoju, będąc zaślepionym.
items.scrolls.scroll.cursed=Twoja przeklęta księga czarów uniemożliwia ci użycie magii tego zwoju! Zwój usuwania klątw może jednak okazać się wystarczająco silny, żeby zadziałać...
items.scrolls.scroll.gyfu=zwój GYFU
items.scrolls.scroll.isaz=zwój ISAZ
items.scrolls.scroll.kaunan=zwój KOWAN
items.scrolls.scroll.laguz=zwój LAGUZ
items.scrolls.scroll.mannaz=zwój MANNAZA
items.scrolls.scroll.naudiz=zwój NAUDIZA
items.scrolls.scroll.no_magic=Nie możesz przeczytać zwoju, będąc odpornym na magię.
items.scrolls.scroll.odal=zwój ODAL
items.scrolls.scroll.raido=zwój RAIDO
items.scrolls.scroll.sowilo=zwój SOWILO
items.scrolls.scroll.tiwaz=zwój TIWAZ
items.scrolls.scroll.unknown_desc=Ten pergamin pokrywa nieczytelne pismo, a w miejscu tytułu widnieje runa %s. Kto wie, co się stanie po odczytaniu go na głos?
items.scrolls.scroll.yngvi=zwój YNGVI
items.scrolls.scrollofidentify.desc=Na stałe ujawnia wszystkie sekrety pojedynczego przedmiotu.
items.scrolls.scrollofidentify.inv_title=Zidentyfikuj przedmiot
items.scrolls.scrollofidentify.it_is=Twój przedmiot został zidentyfikowany: %s.
items.scrolls.scrollofidentify.name=zwój identyfikacyjny
items.scrolls.scrolloflullaby.desc=Uspokajająca melodia wprawi w głęboki sen wszystkie stworzenia w twoim polu widzenia, dając ci szansę na ucieczkę lub niespodziewany atak.
items.scrolls.scrolloflullaby.name=zwój kołysanki
items.scrolls.scrolloflullaby.sooth=Zwój wydaje kojącą melodię. Czujesz się bardzo senny.
items.scrolls.scrollofmagicmapping.desc=Po przeczytaniu tego zwoju w twojej pamięci zapadnie krystalicznie czysty obraz, który wskaże ci dokładny układ poziomu i ujawni wszystkie ukryte sekrety. Lokalizacja przedmiotów i stworzeń pozostanie nieznana.
items.scrolls.scrollofmagicmapping.layout=Teraz znasz już układ poziomu.
items.scrolls.scrollofmagicmapping.name=zwój magicznej mapy
items.scrolls.scrollofmirrorimage.copies=Zwój tworzy twoje lustrzane odbicie.
items.scrolls.scrollofmirrorimage.desc=Zaklęcie z tego zwoju stworzy iluzoryczne bliźnięta czytelnika, które będą ścigać jego wrogów.
items.scrolls.scrollofmirrorimage.name=zwój lustrzanego odbicia
items.scrolls.scrollofmirrorimage.no_copies=Zwój próbuje stworzyć twoje lustrzane odbicie, ale ono nie ma dokąd pójść.
items.scrolls.scrollofrage.desc=Kiedy przeczytasz ten zwój na głos, rozlegnie się potężny ryk, który przyciągnie wszystkich wrogów do czytającego i rozwścieczy tych w pobliżu.
items.scrolls.scrollofrage.name=zwój wściekłości
items.scrolls.scrollofrage.roar=Zwój wydaje wściekły ryk, który rozbrzmiewa w całym lochu!
items.scrolls.scrollofrecharging.desc=Surowa magiczna moc zawarta w tym pergaminie po jej uwolnieniu naładuje wszystkie różdżki czytelnika do pełnej mocy.
items.scrolls.scrollofrecharging.name=zwój doładowania
items.scrolls.scrollofrecharging.surge=Fala energii przepływa przez Twoje ciało, wzmacniając Twoje różdżki!
items.scrolls.scrollofremovecurse.cleansed=Twój przedmiot rozbłyska oczyszczającym światłem, a złośliwa energia się rozprasza!
items.scrolls.scrollofremovecurse.desc=Zaklęcie z tego zwoju natychmiast usunie z broni, zbroi, pierścieni i noszonych przez czytelnika przedmiotów wszelkie złe zaklęcia, które mogłyby uniemożliwić noszącemu je zdjęcie.
items.scrolls.scrollofremovecurse.inv_title=Oczyść przedmiot
items.scrolls.scrollofremovecurse.name=zwój usuwania klątwy
items.scrolls.scrollofremovecurse.not_cleansed=Przedmiot świeci oczyszczającym światłem, ale nic się nie dzieje.
items.scrolls.scrollofremovecurse.spirit=Twój zwój uwalnia udręczonego ducha!
items.scrolls.scrollofretribution.blast=Potężna magiczna energia wytryskuje ze zwoju!
items.scrolls.scrollofretribution.desc=Ten zwój zawiera niszczycielską energię, która uwalnia cierpienie czytelnika na zewnątrz, zamieniając je w eksplozję mocy. Im słabszy jest czytelnik, tym większe obrażenia zadaje. Przy bardzo niskim poziomie zdrowia zwój ten może zabić większość wrogów natychmiast.\n\nUżywanie zwoju ma jednak negatywny wpływ na użytkownika, oślepiając go i osłabiając.
items.scrolls.scrollofretribution.name=zwój zemsty
items.scrolls.scrollofteleportation.cant_reach=Nie możesz się tam teleportować.
items.scrolls.scrollofteleportation.desc=Zaklęcie na tym pergaminie natychmiast przenosi czytelnika w losowe miejsce na poziomie lochów. Można go użyć, aby uciec z niebezpiecznej sytuacji, ale pechowiec może znaleźć się w jeszcze bardziej niebezpiecznym miejscu.
items.scrolls.scrollofteleportation.name=zwój teleportacji
items.scrolls.scrollofteleportation.no_tele=Magia teleportacji zawodzi.
items.scrolls.scrollofteleportation.prompt=Wybierz miejsce do teleportacji
items.scrolls.scrollofteleportation.tele=W mgnieniu oka zostałeś teleportowany w inne miejsce poziomu.
items.scrolls.scrollofterror.desc=Błysk czerwonego światła ogarnie wszystkie istoty w twoim polu widzenia przerażeniem, a one odwrócą się i uciekną. Zaatakowanie uciekającego wroga rozproszy efekt.
items.scrolls.scrollofterror.many=Zwój emituje oślepiający błysk czerwonego światła, a potwory uciekają!
items.scrolls.scrollofterror.name=zwój terroru
items.scrolls.scrollofterror.none=Zwój emituje jasny błysk czerwonego światła.
items.scrolls.scrollofterror.one=Zwój emituje jasny błysk czerwonego światła, a %s ucieka!
items.scrolls.scrolloftransmutation.desc=Ten zwój zawiera potężną magię transmutacji. Po użyciu na odpowiednim przedmiocie, przekształci go w inny przedmiot tego samego typu. Magia ta zachowa nawet ulepszenia, zaklęcia i glify. Zwoje i mikstury zostaną przekształcone w ich egzotyczne odpowiedniki i odwrotnie.
items.scrolls.scrolloftransmutation.inv_title=Transmutacja przedmiotu
items.scrolls.scrolloftransmutation.morph=Twój przedmiot zmienia się w coś innego!
items.scrolls.scrolloftransmutation.name=zwój transmutacji
items.scrolls.scrolloftransmutation.nothing=Nic ciekawego się nie dzieje.
items.scrolls.scrollofupgrade.desc=Ten zwój ulepszy pojedynczy przedmiot, poprawiając jego jakość. Różdżka będzie miała większą moc i więcej ładunków; broń będzie zadawać większe obrażenia lub częściej trafiać w cel; zbroja będzie odbijać dodatkowe ciosy; efekt pierścienia na jego posiadaczu się nasili. Broń i zbroja będą również wymagały mniejszej siły, a wszelkie klątwy rzucone na przedmiot zostaną zdjęte.
items.scrolls.scrollofupgrade.inv_title=Ulepsz przedmiot
items.scrolls.scrollofupgrade.name=zwój ulepszenia
items.scrolls.scrollofupgrade.remove_curse=Zwój ulepszenia oczyszcza przedmiot z klątwy!
items.scrolls.scrollofupgrade.weaken_curse=Zwój ulepszenia osłabia klątwę rzuconą na twój przedmiot.
items.spells.alchemize$wndalchemizeitem.energize=Zamień się w energię %d
items.spells.alchemize$wndalchemizeitem.energize_1=Zmień 1 w energię %d
items.spells.alchemize$wndalchemizeitem.energize_all=Zamień wszystko w energię %d
items.spells.alchemize$wndalchemizeitem.sell=Zamień się w %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Zmień 1 w %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Zamień wszystko w %dg
items.spells.alchemize.desc=To zaklęcie zawiera moce transmutacyjne podobne do tych, które można znaleźć w tyglu alchemicznym. Każde rzucenie pozwala użytkownikowi zamienić przedmiot (lub stos przedmiotów) w złoto lub energię alchemiczną. Przemiana mikstur lub zwojów w energię pozwoli nawet je zidentyfikować! Kilka zastosowań alchemicznych jest dostępnych w sklepach, ale wiele więcej można uzyskać za pomocą alchemii, łącząc nasiono, kamień runiczny i odrobinę energii alchemicznej.
items.spells.alchemize.name=alchemizować
items.spells.alchemize.prompt=Alchemizuj przedmiot
items.spells.beaconofreturning.creatures=Aura psychiczna sąsiadujących stworzeń nie pozwala ci w tym momencie na teleportację.
items.spells.beaconofreturning.desc=To skomplikowane zaklęcie daje użytkownikowi możliwość powrotu do wyznaczonego miejsca, niezależnie od odległości. Zaklęcie zostanie zużyte tylko podczas powrotu. Można je rzucać dowolną liczbę razy, ale zapamięta ono tylko ostatnią lokalizację, do której zostało użyte.
items.spells.beaconofreturning.desc_set=Ta latarnia została ustawiona gdzieś na piętrze %d.
items.spells.beaconofreturning.name=latarnia powrotu
items.spells.beaconofreturning.preventing=Silna magiczna aura tego miejsca uniemożliwia ci użycie zaklęcia!
items.spells.beaconofreturning.set=Latarnia została ustawiona w Twojej aktualnej lokalizacji.
items.spells.beaconofreturning.wnd_body=Ustawienie nadpisze lokalizację, w której poprzednio ustawiono sygnalizator.\n\nPowrót spowoduje powrót do ostatnio ustawionej lokalizacji i zużyje jedno użycie zaklęcia.
items.spells.beaconofreturning.wnd_return=POWRÓT
items.spells.beaconofreturning.wnd_set=USTAWIĆ
items.spells.curseinfusion.desc=To zaklęcie nasyca przedmiot tą samą potężną, złośliwą magią, co DM-300. Przedmiot, na którym zostanie rzucone, zostanie natychmiast przeklęty, a wszelkie zaklęcia lub glify, które mógł posiadać, zostaną unieważnione.\n\nW przypadku broni, zbroi i różdżek, przedmiot oprócz przeklęcia otrzyma ulepszenia. Ulepszenia infuzji klątwy nie kumulują się, a ulepszenia zostaną utracone, jeśli przedmiot zostanie odczarowany.\n\nWielokrotne infuzje klątwy mogą również posłużyć do zmiany klątwy nałożonej na broń lub zbroję.
items.spells.curseinfusion.inv_title=Przeklnij przedmiot
items.spells.curseinfusion.name=wlew klątwy
items.spells.magicalinfusion.desc=Ten czar posiada taką samą moc magiczną jak zwój ulepszenia, lecz w bardziej stabilnej formie.\n\nOprócz ulepszania przedmiotu w normalny sposób, nigdy nie usunie zaklęcia, glifu ani klątwy.
items.spells.magicalinfusion.infuse=Twój przedmiot jest nasycony tajemną energią!
items.spells.magicalinfusion.inv_title=Nasącz przedmiot
items.spells.magicalinfusion.name=magiczny napar
items.spells.magicalporter.desc=To zaklęcie magicznie przeniesie każdy przedmiot, na który zostanie rzucone. Jednak w przeciwieństwie do latarni kupieckiej, przedmioty zostaną przeniesione do wejścia na kolejne piętro z bossem.
items.spells.magicalporter.inv_title=Przenieś przedmiot
items.spells.magicalporter.name=magiczny tragarz
items.spells.magicalporter.nowhere=Nie ma miejsca, do którego można przenieść przedmiot.
items.spells.phaseshift.desc=To chaotyczne zaklęcie teleportuje dowolną postać, w którą zostanie skierowane, w losowe miejsce na aktualnym piętrze i ogłusza ją na długi czas. Potężni przeciwnicy będą w stanie oprzeć się efektowi ogłuszenia. Zaklęcie to można skierować na cel lub na samego użytkownika.
items.spells.phaseshift.name=przesunięcie fazowe
items.spells.phaseshift.no_target=Nie ma tam czego teleportować.
items.spells.reclaimtrap.desc=To zaklęcie zawiera pozostałości energii mechanicznej DM-300. Po rzuceniu na aktywną pułapkę, moc pułapki zostanie do ciebie przywiązana, pozwalając ci ponownie użyć zaklęcia, aby ją wypędzić i aktywować efekt pułapki w dowolnym miejscu.\n\nJednak niektóre pułapki mogą nie działać we wszystkich miejscach, a jednocześnie można przechowywać tylko jedną pułapkę.
items.spells.reclaimtrap.desc_trap=Zaklęcie jest obecnie gotowe do wywołania _%s._
items.spells.reclaimtrap.name=pułapka odzyskująca
items.spells.reclaimtrap.no_trap=Nie ma tam żadnej pułapki.
items.spells.recycle.desc=To zaklęcie zawiera słabszą formę magii transmutacyjnej. Chociaż nie działa na ekwipunek, zamienia zwój, miksturę, nasiono, kamień runiczny lub strzałkę z grotem w losowy przedmiot tego samego typu.
items.spells.recycle.inv_title=Recykling przedmiotu
items.spells.recycle.name=ponownie wprowadzać do obiegu
items.spells.recycle.recycled=Twój przedmiot został poddany recyklingowi i otrzymał nazwę: %s.
items.spells.spell.ac_cast=RZUCAĆ
items.spells.spell.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.spells.spell.no_magic=Nie możesz rzucać zaklęć, będąc odpornym na magię.
items.spells.summonelemental.ac_imbue=PRZEFARBOWAĆ
items.spells.summonelemental.desc=To zaklęcie skupia energię żywiołów użytych do jego stworzenia i pozwoli ci przywołać przyjaznego żywiołaka, który będzie z tobą walczył! Jednocześnie można przywołać tylko jednego żywiołaka, ale zaklęcie można rzucić ponownie, aby żywiołak wrócił do ciebie bez żadnych kosztów.
items.spells.summonelemental.desc_chaos=Zaklęcie obecnie emanuje energią chaosu, przywoła _żywiołaka chaosu_. Możesz nasycić inny przedmiot, ale zaklęcie straci swoje obecne nasycenie.
items.spells.summonelemental.desc_fire=Zaklęcie jest obecnie gorące w dotyku i przywoła _żywiołaka ognia_. Możesz nasycić nim inny przedmiot, ale zaklęcie straci swoje obecne nasycenie.
items.spells.summonelemental.desc_frost=Zaklęcie jest obecnie zimne w dotyku i przywoła _żywiołaka mrozu_. Możesz nasycić inny przedmiot, ale zaklęcie straci swoje obecne nasycenie.
items.spells.summonelemental.desc_newborn=Zaklęcie jest obecnie nienasycone i przywoła _nowo narodzonego żywiołaka_ bez ataku dystansowego. Możesz nasycić zidentyfikowaną miksturę płynnego ognia, miksturę mrozu, zwój doładowania lub zwój transmutacji, aby wzmocnić zaklęcie, dzięki czemu przyszłe przywołania będą żywiołakami o pełnej mocy!
items.spells.summonelemental.desc_shock=Zaklęcie emituje obecnie energię statyczną, przywoła _elementala szoku_. Możesz nasycić inny przedmiot, ale zaklęcie straci swoje obecne nasycenie.
items.spells.summonelemental.imbue_prompt=Nasycić przedmiot
items.spells.summonelemental.name=przywołać żywiołaka
items.spells.targetedspell.inv_title=Nasącz przedmiot
items.spells.targetedspell.prompt=Wybierz cel
items.spells.telekineticgrab.cant_grab=Nie możesz tego złapać.
items.spells.telekineticgrab.desc=To zaklęcie pozwala rzucającemu je graczowi zdalnie chwytać wszystkie przedmioty w danym miejscu lub wszystkie rzucane bronie przyczepione do wroga!\n\nNie można go używać do chwytania przedmiotów należących do kogoś innego ani do chwytania pojemników, takich jak skrzynie.
items.spells.telekineticgrab.name=chwyt telekinetyczny
items.spells.telekineticgrab.no_target=Nie ma tam niczego, czego można by się złapać.
items.spells.unstablespell.desc=Ten mały, czarny, kwadratowy kryształ ma na każdej powierzchni przesuwające się symbole runiczne. \n\nPo aktywacji uruchamia efekt losowego zwoju. Efekt zwoju zawsze będzie ukierunkowany na walkę, jeśli w polu widzenia znajdują się wrogowie, i zawsze będzie ukierunkowany na walkę w przeciwnym razie.
items.spells.unstablespell.name=niestabilny czar
items.spells.wildenergy.desc=To zaklęcie zawiera część przeklętej energii, która zasilała DM-300. Po rzuceniu naładuje twoje różdżki i zużyte artefakty, a także uruchomi losowy efekt przeklętej różdżki. Możesz jednak wybrać kierunek, w którym ta przeklęta magia będzie tryskać.
items.spells.wildenergy.name=dzika energia
items.stones.inventorystone.ac_use=UŻYWAĆ
items.stones.runestone$placeholder.name=kamień runiczny
items.stones.runestone.discover_hint=Możesz znaleźć ten przedmiot losowo w lochach lub stworzyć go poprzez alchemię.
items.stones.stoneofaggression$aggression.desc=Magia manipulacyjna sprawia, że wszyscy pobliscy wrogowie wolą atakować tę postać.\n\nPozostałe tury: %s.
items.stones.stoneofaggression$aggression.name=ukierunkowany
items.stones.stoneofaggression.desc=Gdy ten kamień zostanie rzucony w sojusznika lub wroga, wszyscy pobliscy wrogowie będą przez krótki czas atakować tę postać. \n\nBossowie mogą jednak oprzeć się temu efektowi, co znacznie skraca czas jego trwania i zmniejsza obrażenia od ataków ich sług.
items.stones.stoneofaggression.name=kamień agresji
items.stones.stoneofaugmentation$wndaugment.cancel=Nieważne
items.stones.stoneofaugmentation$wndaugment.choice=Co chciałbyś ulepszyć?
items.stones.stoneofaugmentation$wndaugment.damage=Szkoda
items.stones.stoneofaugmentation$wndaugment.defense=Obrona
items.stones.stoneofaugmentation$wndaugment.evasion=Uchylanie się
items.stones.stoneofaugmentation$wndaugment.none=Usuń rozszerzenie
items.stones.stoneofaugmentation$wndaugment.speed=Prędkość
items.stones.stoneofaugmentation.desc=Ten kamień runiczny posiada potężną magię, która może wzmocnić ekwipunek, wzmacniając jedną właściwość kosztem innej.\n\nUżycie broni pozwoli ci zwiększyć szybkość lub obrażenia. Broń miotana również zyskuje lub traci wytrzymałość proporcjonalnie do swojej szybkości.\n\nUżycie zbroi pozwoli ci zwiększyć obronę lub uniki.
items.stones.stoneofaugmentation.discover_hint=Możesz kupić ten przedmiot w sklepie lub stworzyć go metodą alchemii.
items.stones.stoneofaugmentation.inv_title=Rozszerzyć element
items.stones.stoneofaugmentation.name=kamień powiększenia
items.stones.stoneofblast.desc=Ten kamień runiczny natychmiast eksploduje w miejscu, w które zostanie rzucony. Podobnie jak bomba, eksplozja zadaje obrażenia wszystkim w pobliżu.
items.stones.stoneofblast.name=kamień wybuchu
items.stones.stoneofblink.desc=Ten kamień runiczny teleportuje użytkownika do miejsca, w którym został rzucony.
items.stones.stoneofblink.name=kamień mrugnięcia
items.stones.stoneofclairvoyance.desc=Ten kamień natychmiast odsłoni wszystkie płytki na bardzo dużym obszarze wokół miejsca, w którym zostanie rzucony. Jego działanie będzie sięgać nawet przez ściany.
items.stones.stoneofclairvoyance.name=kamień jasnowidzenia
items.stones.stoneofdeepsleep.desc=Rzucenie tym kamieniem we wroga wprawi go w głęboki, magiczny sen. Magicznie uśpieni wrogowie będą spać wiecznie, dopóki nie zostaną zbudzeni.
items.stones.stoneofdeepsleep.name=kamień głębokiego snu
items.stones.stoneofdetectmagic.desc=Ten kamień runiczny potrafi wykryć magię działającą na przedmiot. Użycie tego kamienia na niezidentyfikowanym przedmiocie pozwoli ci sprawdzić, czy jest on pod wpływem złowrogiej klątwy, a także czy jest pod wpływem pozytywnej magii, takiej jak zaklęcie lub ulepszenia.
items.stones.stoneofdetectmagic.detected_bad=Wykryłeś złośliwą magię działającą na ten przedmiot!
items.stones.stoneofdetectmagic.detected_both=Wykrywasz zarówno pozytywną, jak i złośliwą magię działającą na ten przedmiot!
items.stones.stoneofdetectmagic.detected_good=Wykryłeś pozytywną magię działającą na ten przedmiot!
items.stones.stoneofdetectmagic.detected_none=Nie wykryłeś żadnej magii wpływającej na ten przedmiot.
items.stones.stoneofdetectmagic.inv_title=Wykryj element
items.stones.stoneofdetectmagic.name=kamień wykrywania magii
items.stones.stoneofdisarming.desc=Ten kamień runiczny skrywa magię, która może unieszkodliwić złośliwe pułapki ukryte w lochach. Rozbraja do 9 pułapek w obszarze, w który zostanie rzucony.
items.stones.stoneofdisarming.name=kamień rozbrajający
items.stones.stoneofenchantment.armor=Twoja zbroja świeci w ciemności!
items.stones.stoneofenchantment.desc=Ten kamień runiczny posiada magiczną moc. W przeciwieństwie do zwoju ulepszenia, nie zwiększa on bezpośrednio mocy przedmiotu, lecz nasyca broń lub zbroję zaklęciem, nadając jej nową moc.
items.stones.stoneofenchantment.inv_title=Zaczaruj przedmiot
items.stones.stoneofenchantment.name=kamień zaklęcia
items.stones.stoneofenchantment.weapon=Twoja broń świeci w ciemności!
items.stones.stoneoffear.desc=Kiedy ten kamień zostanie rzucony na postać, ogarnie ją przerażenie, odwróci się i ucieknie. Zaatakowanie uciekającej postaci skróci efekt.
items.stones.stoneoffear.name=kamień strachu
items.stones.stoneofflock.desc=Ten kamień runiczny przywołuje na krótki czas magiczne owce wokół miejsca, do którego zostanie rzucony.
items.stones.stoneofflock.name=kamień trzody
items.stones.stoneofintuition$wndguess.break=Twój kamień intuicji rozsypuje się w pył...
items.stones.stoneofintuition$wndguess.correct=Zgadza się. Typ przedmiotu został zidentyfikowany!
items.stones.stoneofintuition$wndguess.incorrect=Twoje przypuszczenie było błędne.
items.stones.stoneofintuition$wndguess.text=Zgadnij, jaki jest typ niezidentyfikowanego przedmiotu. Jeśli zgadniesz poprawnie, typ zostanie zidentyfikowany!
items.stones.stoneofintuition.break_info=Kamieni intuicji możesz użyć dwa razy zanim któryś się rozbije; _następne użycie nie zużyje kamienia_.
items.stones.stoneofintuition.break_warn=Wcześniej użyłeś kamienia intuicji, więc _następne użycie zużyje kamień_.
items.stones.stoneofintuition.desc=Ten kamień runiczny zawiera słabszą wersję magii zawartej w zwojach identyfikacyjnych. Zamiast bezpośrednio identyfikować przedmiot, oddziałuje on na twoją intuicję, pozwalając ci spróbować zidentyfikować rodzaj mikstury, zwoju lub pierścienia poprzez zgadywanie.
items.stones.stoneofintuition.inv_title=Wybierz element
items.stones.stoneofintuition.name=kamień intuicji
items.stones.stoneofshock.desc=Ten kamień runiczny wyzwala podmuch energii elektrycznej, który na krótko ogłusza wszystkie pobliskie cele i zapewnia ładunek różdżki rzucającej za każdy trafiony cel.
items.stones.stoneofshock.name=kamień szoku
items.stylus.ac_inscribe=WPISAĆ
items.stylus.cursed=Magia rysika nie zadziała na przeklętą zbroję.
items.stylus.desc=Ten tajemny rysik jest wykonany z ciemnego, bardzo twardego kamienia. Za jego pomocą możesz wyryć magiczny glif na swojej zbroi, ale nie masz wpływu na to, jaki to będzie glif – rysik zdecyduje za ciebie.
items.stylus.identify=Najpierw musisz sprawdzić, czy ta zbroja jest przeklęta.
items.stylus.inscribed=Narysowałeś swoją zbroję rysikiem.
items.stylus.name=tajemny rysik
items.stylus.prompt=Wybierz zbroję
items.tengusmask.ac_wear=NOSIĆ
items.tengusmask.desc=Ta maska spadła z twarzy Tengu, gdy ten umierał. Można poczuć emanującą z niej potężną magiczną moc. Czy maska była źródłem siły Tengu?\n\nPo założeniu, potężna moc maski zostanie przeniesiona na ciebie, umożliwiając ci _wybór podklasy dla swojego bohatera._\n\nKtórą podklasę wybierzesz?
items.tengusmask.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.tengusmask.name=Maska Tengu
items.tengusmask.used=Maska rozpada się, gdy jej moc wnika w ciebie!
items.torch.ac_light=ŚWIATŁO
items.torch.desc=Podstawowy element wyposażenia każdego poszukiwacza przygód – gdy w lochach robi się ciemno, pochodnia może okazać się pomocna w oświetleniu drogi.
items.torch.name=latarka
items.trinkets.chaoticcenser.desc=Po pewnym czasie spędzonym w alchemicznym garnku, ta kadzielnica z kadzidłem zaczyna sama z siebie wytwarzać dym! Gazy te kumulują się i w nieregularnych odstępach czasu wystrzeliwują z kadzielnicy w kierunku wrogów. Wydaje się, że potrafi wytwarzać najróżniejsze gazy, ale tuż przed aktywacją kadzielnicy otrzymasz ostrzeżenie.
items.trinkets.chaoticcenser.name=chaotyczna kadzielnica
items.trinkets.chaoticcenser.spew=Z twojej kadzielnicy zaraz wyleci: %s.
items.trinkets.chaoticcenser.stats_desc=Na obecnym poziomie ten gadżet będzie wydzielał szkodliwy gaz w pobliżu wroga mniej więcej co _%d_ tur. Gazy pojawią się tylko wtedy, gdy wrogowie będą obecni. Na wyższych poziomach gazy te będą miały większą szansę na egzotyczny i silny charakter.
items.trinkets.chaoticcenser.typical_stats_desc=Zazwyczaj ten gadżet wydziela szkodliwy gaz w pobliżu wroga mniej więcej co _%d_ tur. Gazy pojawiają się tylko wtedy, gdy wrogowie są obecni. Na wyższych poziomach gazy te są bardziej egzotyczne i silniejsze.
items.trinkets.crackedspyglass.desc=Ten ręczny teleskop byłby demonstracją znakomitego i precyzyjnego wykonania, gdyby nie pęknięcie wzdłuż przedniej soczewki. Luneta zdaje się pomagać w odkrywaniu nowych przedmiotów w lochach, ale ze względu na swoją wadę, odkryte przedmioty są dość trudne do zobaczenia!
items.trinkets.crackedspyglass.name=pęknięta luneta
items.trinkets.crackedspyglass.stats_desc=Na obecnym poziomie ten drobiazg ma _%1$s%%_ szansę na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze, na którym nie ma bossa.
items.trinkets.crackedspyglass.stats_desc_upgraded=Na obecnym poziomie ten drobiazg ma _100%% szans_ na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze, na którym nie ma bossa, oraz _%1$s%% szans_ na stworzenie drugiego dodatkowego ukrytego przedmiotu.
items.trinkets.crackedspyglass.typical_stats_desc=Zazwyczaj ten drobiazg ma _%1$s%%_ szansę na stworzenie dodatkowego ukrytego przedmiotu na każdym piętrze, na którym nie ma bossa.
items.trinkets.dimensionalsundial.desc=Ten mały, ręczny zegar słoneczny potrafi rzucać cień w głębi lochów, nawet jeśli nie trzyma się go pionowo. Co jeszcze dziwniejsze, położenie cienia wydaje się nie mieć związku ze słońcem w tym świecie. Gdy cień nie pada, zegar słoneczny zdaje się przyciągać niebezpieczeństwo.
items.trinkets.dimensionalsundial.name=zegar słoneczny wymiarowy
items.trinkets.dimensionalsundial.stats_desc=Na obecnym poziomie ta ozdoba zmniejszy częstotliwość pojawiania się wrogów o _%1$d%%_ w ciągu dnia w realnym życiu (od 8:00 do 20:00) i zwiększy częstotliwość pojawiania się wrogów o _%2$d%%_ w nocy (od 20:00 do 8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=Zazwyczaj ten gadżet zmniejszy częstotliwość pojawiania się wrogów o _%1$d%%_ w ciągu dnia w realnym życiu (od 8:00 do 20:00), a zwiększy częstotliwość pojawiania się wrogów o _%2$d%%_ w nocy (od 20:00 do 8:00).
items.trinkets.dimensionalsundial.warning=Twój zegar słoneczny nie rzuca cienia, czujesz się nieswojo.
items.trinkets.exoticcrystals.desc=Te małe różowe kryształy mają ten sam kształt, co kryształy energii alchemicznej. Chociaż nie można ich bezpośrednio wykorzystać do pozyskiwania energii, wydaje się, że w jakiś sposób wpływają na mikstury i zwoje, które znajdziesz.
items.trinkets.exoticcrystals.name=egzotyczne kryształy
items.trinkets.exoticcrystals.stats_desc=Na obecnym poziomie ten drobiazg zastąpi _%s%%_ mikstur lub zwojów ich egzotycznymi odpowiednikami. Nie ma to wpływu na mikstury siły, zwoje ulepszeń ani przedmioty generowane w celu rozwiązania problemów w pomieszczeniach z niebezpieczeństwami.
items.trinkets.exoticcrystals.typical_stats_desc=Zazwyczaj ten drobiazg zastępuje _%s%%_ mikstur lub zwojów ich egzotycznymi odpowiednikami. Nie ma to wpływu na mikstury siły, zwoje ulepszeń ani przedmioty generowane w celu rozwiązania problemów w pomieszczeniach z niebezpieczeństwami.
items.trinkets.eyeofnewt.desc=To złoto-czarne oko traszki to powszechny składnik, teraz udoskonalony jako ozdoba. Wygląda na to, że oko ogranicza pole widzenia, pozwalając ci widzieć rzeczy w inny sposób.
items.trinkets.eyeofnewt.name=oko traszki
items.trinkets.eyeofnewt.stats_desc=Na obecnym poziomie ten gadżet zmniejszy twój zasięg widzenia o _%1$s%%_, ale jednocześnie zapewni ci widzenie umysłem wrogów znajdujących się w odległości _%2$d_ pól.
items.trinkets.eyeofnewt.typical_stats_desc=Zazwyczaj ten gadżet zmniejszy twój zasięg widzenia o _%1$s%%_, ale dodatkowo zapewni ci widzenie umysłem wrogów znajdujących się w odległości _%2$d_ pól.
items.trinkets.ferrettuft.desc=Kępka jedwabistego, białego futra fretki, spięta limonkowozieloną wstążką zawiązaną w kokardę. Fretki słyną ze swojej zwinności, psotności i braku uczciwości. Część tej mocy zdaje się promieniować z tej ozdoby, ułatwiając unikanie wszystkiego, co znajduje się w pobliżu.
items.trinkets.ferrettuft.name=kępka fretki
items.trinkets.ferrettuft.stats_desc=Na obecnym poziomie ten gadżet zwiększy uniki wszystkich postaci o _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Zazwyczaj ten gadżet zwiększy unik wszystkich postaci o _%1$s%%_.
items.trinkets.mimictooth.desc=Ten duży, ostry ząb musiał zostać wyrwany bardzo nieszczęśliwemu imitatorowi. Wydaje się, że wpływa on na imitatorów w lochach, sprawiając, że pojawiają się częściej i są bardziej niebezpieczni.
items.trinkets.mimictooth.name=ząb imitujący
items.trinkets.mimictooth.stats_desc=Na obecnym poziomie ten drobiazg sprawi, że wszelkiego rodzaju mimikry _%1$sx_ będą bardziej powszechne i znacznie trudniejsze do wykrycia, ale jednocześnie zwiększy ilość łupów, które z nich wypadną. Każde piętro lochu będzie miało również szansę _%2$s%%_ na znalezienie dodatkowego, ukrytego mimikra z ebonu.
items.trinkets.mimictooth.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że wszelkiego rodzaju mimikry _%1$sx_ będą bardziej powszechne i znacznie trudniejsze do wykrycia, ale jednocześnie zwiększy ilość łupów, które upuszczają. Każde piętro lochu będzie miało również szansę _%2$s%%_ na znalezienie dodatkowego, ukrytego mimikra z ebonu.
items.trinkets.mossyclump.desc=Ta kępa mokrego mchu zdaje się zatrzymywać wilgoć, bez względu na to, jak mocno ją ściskasz. Wygląda na to, że jest magicznie związana z samym lochem, co zwiększa prawdopodobieństwo pojawienia się trawy i wody.
items.trinkets.mossyclump.name=kępa mchu
items.trinkets.mossyclump.stats_desc=Na obecnym poziomie ten drobiazg sprawi, że _%d%%_ podłóg bez określonej tematyki zostanie wypełnionych wodą lub trawą.\n\nUlepszenie tego drobiazgu kosztuje większą ilość energii.
items.trinkets.mossyclump.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że podłogi _%d%%_ nietematycznych podłóg zostaną wypełnione wodą lub trawą.\n\nUlepszenie tego drobiazgu kosztuje większą ilość energii.
items.trinkets.parchmentscrap.desc=Ten mały skrawek pergaminu wygląda, jakby pochodził ze zwoju. Zachował część swojej magii i najwyraźniej wpływa na broń i zbroje znalezione w lochach.
items.trinkets.parchmentscrap.name=skrawek pergaminu
items.trinkets.parchmentscrap.stats_desc=Na obecnym poziomie ten drobiazg sprawi, że zaklęcia i glify _%dx_ będą powszechne, a klątwy na broni i zbrojach _%sx_ będą powszechne. Klątwy na różdżkach, pierścieniach i artefaktach nie będą miały wpływu.\n\nUlepszenie tego drobiazgu kosztuje więcej energii.
items.trinkets.parchmentscrap.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że zaklęcia i glify _%dx_ staną się powszechne, a klątwy na broni i zbroi _%sx_ staną się powszechne. Klątwy na różdżkach, pierścieniach i artefaktach nie są objęte tym efektem. \n\nUlepszenie tego drobiazgu kosztuje więcej energii.
items.trinkets.petrifiedseed.desc=To nasiono uległo skamienieniu, albo w wyniku powolnych procesów geologicznych, albo za sprawą magii. Wydaje się, że nasiono magicznie wpływa na florę lochów, czasami zastępując nasiona roślin kamieniami runicznymi.
items.trinkets.petrifiedseed.name=skamieniałe nasiona
items.trinkets.petrifiedseed.stats_desc=Na obecnym poziomie ten drobiazg sprawi, że zdeptana trawa będzie upuszczać kamienie runiczne zamiast nasion _%1$s%%_, a także sprawi, że wysoka trawa będzie częściej upuszczać przedmioty _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że zdeptana trawa będzie upuszczać kamienie runiczne zamiast nasion _%1$s%%_, a także sprawi, że z wysokiej trawy częściej będą upuszczać przedmioty _%2$s%%_.
items.trinkets.ratskull.desc=Ten makabryczny drobiazg jest niewiele większy od czaszki zwykłego szczura, co jest w tym lochu rzadkością. Magiczny wpływ czaszki zdaje się przyciągać rzadszych mieszkańców lochu, sprawiając, że pojawiają się oni znacznie częściej.
items.trinkets.ratskull.name=czaszka szczura
items.trinkets.ratskull.stats_desc=Na obecnym poziomie ta ozdoba sprawi, że rzadkie, egzotyczne wrogowie _%dx_ będą pojawiać się częściej. Czaszka jest jednak tylko w połowie tak skuteczna w przyciąganiu kryształowych imitatorów i opancerzonych posągów.
items.trinkets.ratskull.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że rzadkie, egzotyczne wrogowie _%dx_ będą pojawiać się częściej. Czaszka jest jednak tylko w połowie tak skuteczna w przyciąganiu kryształowych imitatorów i opancerzonych posągów.
items.trinkets.saltcube.desc=Ten duży kryształ soli został oszlifowany do niemal idealnego kształtu sześcianu i jakimś cudem udało mu się odsączyć połowę wody z alchemicznego garnka, zamiast się rozpuścić. Wygląda na to, że w magiczny sposób odwadnia i konserwuje spożywane jedzenie, przedłużając uczucie sytości, ale jednocześnie spowalniając regenerację organizmu, gdy nie odczuwasz głodu.
items.trinkets.saltcube.name=kostka soli
items.trinkets.saltcube.stats_desc=Na obecnym poziomie ten gadżet wydłuży czas, po którym poczujesz głód o _%1$s%%_, ale jednocześnie zmniejszy szybkość regeneracji zdrowia o _%2$s%%_, chyba że podłoga jest zablokowana.
items.trinkets.saltcube.typical_stats_desc=Zazwyczaj ten gadżet wydłuża czas, po którym poczujesz głód o _%1$s%%_, ale jednocześnie zmniejsza szybkość regeneracji zdrowia o _%2$s%%_, chyba że podłoga jest zablokowana.
items.trinkets.shardofoblivion$thrownusetracker.desc=Ostatnio użyłeś niezidentyfikowanej broni rzucanej, co przez chwilę liczy się jako jeden element niezidentyfikowanego wyposażenia dla odłamka zapomnienia.\n\nPozostałe tury: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Użyto niezidentyfikowanej broni miotanej
items.trinkets.shardofoblivion$wandusetracker.desc=Ostatnio użyłeś niezidentyfikowanej różdżki, co przez chwilę liczy się jako jeden element niezidentyfikowanego wyposażenia dla odłamka zapomnienia.\n\nPozostałe obroty: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Użyto niezidentyfikowanej różdżki
items.trinkets.shardofoblivion.ac_identify=ZIDENTYFIKOWAĆ
items.trinkets.shardofoblivion.desc=Po ugotowaniu w alchemicznym garnku, ten mały odłamek przeklętego metalu zmienił się w... nicość? Światło zdaje się zakrzywiać wokół niego, a on unosi się w miejscu, gdy go nie trzymasz. Odłamek zdaje się magicznie czerpać moc z twojej ignorancji, więc najlepiej o tym za dużo nie myśleć.
items.trinkets.shardofoblivion.identify=Ty identyfikujesz przedmiot!
items.trinkets.shardofoblivion.identify_not_yet=Tego elementu nie można jeszcze zidentyfikować.
items.trinkets.shardofoblivion.identify_prompt=Zidentyfikuj przedmiot
items.trinkets.shardofoblivion.identify_ready=Przedmiot jest gotowy do identyfikacji: %s. Użyj na nim Odłamka Zapomnienia, aby go zidentyfikować.
items.trinkets.shardofoblivion.identify_ready_worn=Twoje zużyte przedmioty są teraz gotowe do identyfikacji. Użyj Odłamka Zapomnienia na przedmiotach, aby je zidentyfikować.
items.trinkets.shardofoblivion.name=odłamek zapomnienia
items.trinkets.shardofoblivion.stats_desc=Na obecnym poziomie ten drobiazg zwiększy częstotliwość wypadania łupów przez wrogów o 20%% za każdy niezidentyfikowany element wyposażenia, który założyłeś lub ostatnio użyłeś, do maksymalnie _%d przedmiotu/przedmiotów_. Odłamek uniemożliwi również identyfikację wyposażenia, ale można go użyć do ręcznej identyfikacji przedmiotów, które są na niego gotowe.
items.trinkets.shardofoblivion.typical_stats_desc=Zazwyczaj ten drobiazg zwiększa częstotliwość wypadania łupów przez wrogów o 20%% za każdy niezidentyfikowany element wyposażenia, który założyłeś lub ostatnio użyłeś, do maksymalnie _%d przedmiotu/przedmiotów_. Odłamek uniemożliwi również identyfikację wyposażenia, ale można go użyć do ręcznej identyfikacji przedmiotów, które są na niego gotowe.
items.trinkets.thirteenleafclover.desc=W jakiś sposób gotowanie w alchemicznym garnku sprawiło, że ta koniczyna wyrosła z mnóstwa dodatkowych liści! Nie jest do końca jasne, czy ten drobiazg przynosi szczęście, czy pecha. Może ten drobiazg sprawi, że twoje szczęście stanie się jeszcze bardziej chaotyczne?
items.trinkets.thirteenleafclover.name=trzynastolistna koniczyna
items.trinkets.thirteenleafclover.stats_desc=Na obecnym poziomie ten gadżet sprawi, że zadajesz maksymalne obrażenia _%1$d%%_ czasu i minimalne obrażenia _%2$d%%_ czasu.
items.trinkets.thirteenleafclover.typical_stats_desc=Zazwyczaj ten gadżet sprawi, że zadajesz maksymalne obrażenia _%1$d%%_ w danym momencie i minimalne obrażenia _%2$d%%_ w danym momencie.
items.trinkets.trapmechanism.desc=Główny mechanizm jednej z pułapek w lochu, starannie wykuty w podłodze, aby można go było przenosić. Wydaje się, że jest magicznie powiązany z samym lochem, co sprawia, że niebezpieczny teren jest bardziej powszechny, ale jednocześnie zwiększa twoją sympatię do niego.
items.trinkets.trapmechanism.name=mechanizm pułapkowy
items.trinkets.trapmechanism.stats_desc=Na obecnym poziomie ta ozdoba sprawi, że _%1$d%%_ podłóg bez określonego tematu zostanie wypełnionych pułapkami lub przepaściami. Dodatkowo, _%2$d%%_ ukrytych pułapek w lochach będzie widocznych.
items.trinkets.trapmechanism.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że _%1$d%%_ podłóg bez określonego tematu zostanie wypełnionych pułapkami lub przepaściami. Dodatkowo, _%2$d%%_ ukrytych pułapek w lochach będzie widocznych.
items.trinkets.trinket$placeholder.name=cacko
items.trinkets.trinket.discover_hint=Ten przedmiot ma szansę stać się opcją za każdym razem, gdy stworzysz błyskotkę za pomocą alchemii.
items.trinkets.trinketcatalyst$randomtrinket.desc=Jeden przedmiot znajdujący się w pobliżu utknął w woreczku, którego nie możesz otworzyć.\n\nProces alchemiczny rozpuści woreczek, ale nie dowiesz się, jaki drobiazg otrzymasz, dopóki tego nie zrobisz!
items.trinkets.trinketcatalyst$randomtrinket.name=losowy drobiazg
items.trinkets.trinketcatalyst.desc=Ta kula magicznego, złotego pyłu migocze w mroku lochu. Katalizator można użyć w alchemicznym garnku, dodając odrobinę energii alchemicznej, aby stworzyć unikalną błyskotkę. \n\nDrobnostki zapewniają różnorodne efekty, które nieznacznie zmieniają loch lub jego mieszkańców. Błyskotki można ulepszyć, dodając więcej energii, aby wzmocnić ich efekt, lub upuścić, aby całkowicie go wyeliminować.
items.trinkets.trinketcatalyst.name=magiczny katalizator
items.trinkets.trinketcatalyst.window_text=Woda zaczyna świecić, gdy dodasz katalizator. W pobliżu znajduje się kilka przedmiotów, które możesz nasycić energią i zamienić w magiczny drobiazg.
items.trinkets.trinketcatalyst.window_title=stworzyć drobiazg
items.trinkets.vialofblood.desc=Ta cienka fiolka zawiera krew jakiegoś mieszkańca lochu. Porusza się powoli, gdy się ją obraca. Wydaje się, że magicznie wzmacnia efekty lecznicze, ale jednocześnie je opóźnia.
items.trinkets.vialofblood.name=fiolka z krwią
items.trinkets.vialofblood.stats_desc=Na obecnym poziomie ten gadżet zwiększy ogólne zdrowie, które zyskujesz pijąc mikstury lecznicze, bukłaki lub studnie zdrowia o _%1$s%%_. Jednak efekty lecznicze będą działać wolniej, regenerując maksymalnie _%2$s_ PW na turę (efekt skaluje się z poziomem bohatera).
items.trinkets.vialofblood.typical_stats_desc=Zazwyczaj ten gadżet zwiększa ogólną ilość zdrowia, którą zyskujesz pijąc mikstury lecznicze, bukłaki lub studnie zdrowia o _%1$s%%_. Jednak efekty lecznicze będą działać wolniej, regenerując maksymalnie _%2$s_ PW na turę (efekt skaluje się z poziomem bohatera).
items.trinkets.wondrousresin.desc=Ta lśniąca, niebieska żywica wydaje się zawierać destylowaną esencję magii zaklętej różdżki. Magia z alchemicznego garnka najwyraźniej ją nieco ustabilizowała i teraz wpływa na twoje różdżki.
items.trinkets.wondrousresin.name=cudowna żywica
items.trinkets.wondrousresin.stats_desc=Na obecnym poziomie ten drobiazg sprawi, że efekty zaklętej różdżki staną się neutralne lub pozytywne _%1$s%%_ czasu i sprawi, że niezaklęte różdżki wystrzelą dodatkowy neutralny lub pozytywny zaklęty impuls _%2$s%%_ czasu.\n\nUlepszenie tego drobiazgu kosztuje większą ilość energii.
items.trinkets.wondrousresin.typical_stats_desc=Zazwyczaj ten drobiazg sprawi, że efekty zaklętej różdżki staną się neutralne lub pozytywne _%1$s%%_ czasu i sprawi, że różdżki bez zaklęcia wystrzelą dodatkowy neutralny lub pozytywny zaklęty impuls _%2$s%%_ czasu.\n\nUlepszenie tego drobiazgu kosztuje większą ilość energii.
items.wands.cursedwand.disguise=Twój wygląd zmienia się na twoich oczach!
items.wands.cursedwand.fire=Czujesz zapach spalenizny...
items.wands.cursedwand.grass=Wokół ciebie rośnie trawa!
items.wands.cursedwand.gravity=Siła grawitacji nagle zaczyna działać w losowych kierunkach!
items.wands.cursedwand.gravity_end=Koniec chaosu grawitacyjnego.
items.wands.cursedwand.gravity_positive=Nagle siła grawitacji zaczyna działać w losowych kierunkach, ale na ciebie nie ma to wpływu.
items.wands.cursedwand.mass_invuln=Z twojej różdżki wystrzeliwuje olśniewające światło!
items.wands.cursedwand.nothing=Nic się nie dzieje.
items.wands.cursedwand.ondeath=Zostałeś zabity przez własnego %s.
items.wands.cursedwand.petrify=Nagle zastygasz w bezruchu!
items.wands.cursedwand.sinkhole=Ziemia zaczyna ustępować Ci miejsca!
items.wands.cursedwand.sinkhole_positive=Grunt zaczyna ustępować, ale pod tobą wydaje się wystarczająco stabilny.
items.wands.cursedwand.supernova=Płonąca kula energii zaczyna rosnąć. Może zechcesz uciekać!
items.wands.cursedwand.supernova_positive=Płonąca kula energii zaczyna rosnąć, ale w jakiś sposób wydaje się bezpieczna.
items.wands.cursedwand.transmogrify_other=Twój przedmiot zmienia się w coś innego!
items.wands.cursedwand.transmogrify_wand=Twoja różdżka zmienia się w inny przedmiot!
items.wands.damagewand.upgrade_stat_name_1=Obrażenia magiczne
items.wands.wand$placeholder.name=różdżka
items.wands.wand.ac_zap=ZASTRZELIĆ
items.wands.wand.curse_discover=Ten %s jest przeklęty!
items.wands.wand.cursed=Ta różdżka jest przeklęta, przez co jej magia jest chaotyczna i losowa.
items.wands.wand.fizzles=Twoja różdżka iskrzy; prawdopodobnie nie jest wystarczająco naładowana.
items.wands.wand.identify=Teraz znasz już swoją różdżkę na tyle dobrze, że możesz ją rozpoznać.
items.wands.wand.no_magic=Twoja różdżka zaczyna iskrzyć. Nie możesz używać różdżek, gdy jesteś odporny na magię.
items.wands.wand.not_cursed=Ta różdżka jest wolna od złowrogiej magii.
items.wands.wand.prompt=Wybierz lokalizację do zabicia
items.wands.wand.resin_many=Ta różdżka zyskała _poziomy %d_ dzięki żywicy tajemnej.
items.wands.wand.resin_one=Ta różdżka zyskała _1 poziom_ dzięki żywicy tajemnej.
items.wands.wand.self_target=Nie możesz celować w siebie!
items.wands.wandofblastwave.bmage_desc=Kiedy _Mag Bitewny_ uderzy sparaliżowanego wroga laską fali uderzeniowej, zniweluje ona paraliż, zadając dodatkowe obrażenia magiczne. Ma krótki czas odnowienia dla każdego wroga.
items.wands.wandofblastwave.desc=Ta różdżka jest wykonana z marmurkowego kamienia, ze złotymi zdobieniami i okrągłym czarnym klejnotem na końcu. W dłoni wydaje się bardzo ciężka.
items.wands.wandofblastwave.eleblast_desc=Żywiołowy wybuch za pomocą laski fali uderzeniowej zadaje 67% obrażeń i wyrzuca wszystkich wrogów poza obszar wybuchu.
items.wands.wandofblastwave.knockback_ondeath=Zderzenie cię zabiło...
items.wands.wandofblastwave.name=różdżka fali uderzeniowej
items.wands.wandofblastwave.ondeath=Zabiłeś się własną Różdżką Fali Uderzeniowej...
items.wands.wandofblastwave.staff_name=personel fali uderzeniowej
items.wands.wandofblastwave.stats_desc=Ta różdżka wystrzeliwuje pocisk, który gwałtownie detonuje w wybranym miejscu. Siła tego wybuchu zadaje _%1$d-%2$d obrażeń_ i jest wystarczająco silna, by powalić większość wrogów.
items.wands.wandofblastwave.typical_stats_desc=Ta różdżka wystrzeliwuje bełt, który gwałtownie detonuje w wybranym miejscu. Siła tego wybuchu zazwyczaj zadaje _%1$d-%2$d obrażeń_ i jest wystarczająco silna, by powalić większość wrogów.
items.wands.wandofblastwave.upgrade_stat_name_2=Odrzucenie
items.wands.wandofcorrosion.bmage_desc=Kiedy _Mag Bitewny_ uderza wroga kosturem korozji, wróg ma szansę zostać pokryty korozja.
items.wands.wandofcorrosion.desc=Różdżka ta ma popielate ciało, które po otwarciu kryje w sobie błyszczący, pomarańczowy klejnot.
items.wands.wandofcorrosion.eleblast_desc=Żywiołowy wybuch kosturem korozji zadaje wrogom 4 tury korozji, początkowo z 6 obrażeniami.
items.wands.wandofcorrosion.name=różdżka korozji
items.wands.wandofcorrosion.staff_name=personel korozji
items.wands.wandofcorrosion.stats_desc=Ta różdżka wystrzeliwuje pocisk, który eksploduje w wybranym miejscu, zamieniając się w chmurę silnie żrącego gazu. Wszystko, co zostanie złapane w tę chmurę, będzie z czasem otrzymywać coraz większe obrażenia, zaczynając od _%d obrażeń._
items.wands.wandofcorrosion.upgrade_stat_name_1=Uszkodzenia korozyjne
items.wands.wandofcorrosion.upgrade_stat_name_2=Objętość gazu
items.wands.wandofcorruption.already_corrupted=Na tę postać nie można już wpływać.
items.wands.wandofcorruption.bmage_desc=Kiedy _Mag Bitewny_ uderza wroga laską korupcji, wróg ma szansę się zapalić.
items.wands.wandofcorruption.desc=Różdżka ta emanuje chaotyczną, ciemną energią, co nie jest już oczywiste po małej, ozdobnej czaszce w kształcie litery U na jej końcu.
items.wands.wandofcorruption.eleblast_desc=Żywiołowy wybuch za pomocą laski korupcji zadaje wrogom 5 tur amoku.
items.wands.wandofcorruption.name=różdżka korupcji
items.wands.wandofcorruption.staff_name=personel korupcyjny
items.wands.wandofcorruption.stats_desc=Ta różdżka wyzwoli podmuch energii korupcji, który osłabi wrogów i ostatecznie zmusi ich do posłuszeństwa twojej woli. Wrogowie są w stanie oprzeć się korupcji, ale osłabionych wrogów jest znacznie łatwiej skorumpować niż zdrowych.
items.wands.wandofcorruption.upgrade_stat_name_1=Korupcyjna władza
items.wands.wandofcorruption.upgrade_stat_name_2=Czas trwania osłabienia
items.wands.wandofdisintegration.bmage_desc=Kiedy dzierży ją _Mag Bitewny_, laska dezintegracji ma zwiększony zasięg ataku, jakby była zaklęta w projekcji.
items.wands.wandofdisintegration.desc=Ta różdżka jest wykonana z litego, gładkiego kawałka obsydianu, z ciemnofioletowym światłem biegnącym wzdłuż jej boku, kończącym się na czubku. Świeci niszczycielską energią, czekając, by wystrzelić naprzód.
items.wands.wandofdisintegration.eleblast_desc=Żywiołowy wybuch z użyciem laski dezintegracji zadaje 100% obrażeń i przebija ściany.
items.wands.wandofdisintegration.name=różdżka dezintegracji
items.wands.wandofdisintegration.staff_name=personel rozpadu
items.wands.wandofdisintegration.stats_desc=Ta różdżka wystrzeliwuje wiązkę, która przebija każdą przeszkodę i będzie miała większy zasięg, im więcej będzie ulepszeń. Wiązka zadaje _%1$d-%2$d obrażeń_, a także zadaje dodatkowe obrażenia za każdego wroga i ścianę, którą przebije.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maksymalny zasięg
items.wands.wandoffireblast.bmage_desc=Kiedy _Mag Bitewny_ uderza wroga laską ognia, istnieje szansa na eksplozję, która rani wrogów i pochłania cały pobliski ogień! Szansa ta wzrasta wraz z ilością ognia w pobliżu wroga.
items.wands.wandoffireblast.desc=Ta różdżka wykonana jest z lakierowanego na czerwono drewna, obficie pokrytego złotymi liśćmi, co nadaje jej królewski wygląd. Jej czubek trzeszczy i syczy, chętna do uwolnienia swojej potężnej magii.
items.wands.wandoffireblast.eleblast_desc=Żywiołowy wybuch za pomocą ognistego podmuchu zadaje 100% obrażeń, wyważa drzwi i podpala wrogów oraz teren.
items.wands.wandoffireblast.name=różdżka ognistego podmuchu
items.wands.wandoffireblast.staff_name=personel ognistego wybuchu
items.wands.wandoffireblast.stats_desc=Ta różdżka po użyciu wystrzeliwuje stożek ognia. Jej kolejny atak zużyje _ładunki %1$d_ i zada _obrażenia %2$d-%3$d_. Im więcej ładunków zużyje różdżka, tym większy i silniejszy będzie efekt.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Obrażenia za ładunek
items.wands.wandoffireblast.upgrade_stat_name_2=2 obrażenia od ładunku
items.wands.wandoffireblast.upgrade_stat_name_3=3 obrażenia od ładunku
items.wands.wandoffrost.bmage_desc=Kiedy _Mag Bitewny_ uderzy wychłodzonego wroga kosturem mrozu, ma on szansę na natychmiastowe zamrożenie. Szansa ta rośnie wraz ze stopniem wychłodzenia.
items.wands.wandoffrost.desc=Ta różdżka wydaje się być zrobiona z jakiegoś magicznego lodu. Jej kolor staje się jaśniejszy w kierunku zaokrąglonego czubka. Trzymana w dłoni wydaje się bardzo zimna, ale w jakiś sposób dłoń pozostaje ciepła.
items.wands.wandoffrost.eleblast_desc=Żywiołowy atak laską mrozu zadaje 100% obrażeń, zamraża wrogów i gasi pożary.
items.wands.wandoffrost.name=różdżka mrozu
items.wands.wandoffrost.staff_name=personel mrozu
items.wands.wandoffrost.stats_desc=Ta różdżka wystrzeliwuje w kierunku wrogów strumienie lodowatej energii, zadając _%1$d-%2$d obrażeń_ i wychładzając. Efekt wydaje się silniejszy w wodzie. Wrogowie, którzy są już schłodzoni lub zamrożeni, otrzymują mniejsze obrażenia od tej różdżki.
items.wands.wandoffrost.upgrade_stat_name_2=Czas trwania chłodzenia
items.wands.wandoflightning$lightningcharge.desc=Mag bitewny jest obecnie naładowany energią, co zapewnia mu odporność na jego kostur błyskawic i zwiększa zasięg, w jakim błyskawice mogą z niego generować łuki.\n\nPozostałe tury: %s.
items.wands.wandoflightning$lightningcharge.name=Naładowany elektrycznie
items.wands.wandoflightning.bmage_desc=Kiedy _Mag Bitewny_ uderzy wroga laską błyskawic, ma szansę na naładowanie się elektrycznością na 10 tur. Podczas naładowania Mag Bitewny jest odporny na obrażenia od błyskawic i będzie generował jeszcze większe wyładowania.
items.wands.wandoflightning.desc=Ta różdżka jest wykonana z litego metalu, przez co jest zaskakująco ciężka. Dwa zęby zakrzywiają się na końcach, a między nimi przepływają prądy elektryczne.
items.wands.wandoflightning.eleblast_desc=Żywiołowy wybuch za pomocą laski błyskawic zadaje 100% obrażeń, ogłusza wrogów na 5 tur i elektryzuje wodę.
items.wands.wandoflightning.name=różdżka piorunów
items.wands.wandoflightning.ondeath=Zabiłeś się własną Różdżką Błyskawic...
items.wands.wandoflightning.staff_name=laska piorunów
items.wands.wandoflightning.stats_desc=Ta różdżka wysyła potężny łuk elektryczny przez cel, w który zostanie trafiona, zadając obrażenia _%1$d-%2$d_. Prąd elektryczny będzie przeskakiwał na pobliskie postacie i rozprzestrzenia się łatwiej w wodzie. Łuki elektryczne z tej różdżki mogą zranić ciebie, ale nie zranią twoich sojuszników.
items.wands.wandoflivingearth$earthguardian.desc=Skały z twojej różdżki z żywej ziemi uformowały się w ochronnego, glinianego strażnika! Ten kamienny obrońca będzie atakował pobliskich wrogów, zmuszając ich do ataku na strażnika zamiast na ciebie. Gdy wszystkie pobliskie zagrożenia znikną, strażnik uformuje się wokół ciebie ponownie i powróci, gdy następnym razem użyjesz swojej różdżki.
items.wands.wandoflivingearth$earthguardian.discover_hint=Postać tę można znaleźć z konkretną różdżką.
items.wands.wandoflivingearth$earthguardian.name=gliniany strażnik
items.wands.wandoflivingearth$earthguardian.wand_info=Siła obronna strażnika jest powiązana z poziomem twojej różdżki. Obecnie blokuje obrażenia od _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Magiczne skały otaczają twoje ciało. Gdy zostaniesz zaatakowany, spróbują zablokować ciosy i zmniejszą otrzymywane obrażenia o 50%%. Każde zablokowane obrażenia zdrapują jednak część skały.\n\nPozostała zbroja: %1$d.\n\nJeśli wokół ciebie zgromadzi się wystarczająco dużo skał, kolejny cios z twojej różdżki z żywej ziemi sprawi, że skały utworzą strażnika, który będzie z tobą walczył.\n\nZbroja potrzebna dla strażnika: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ten ziemny strażnik również korzysta z Mocy Wielu. Pozostałe tury: %d.
items.wands.wandoflivingearth$rockarmor.name=zbroja skalna
items.wands.wandoflivingearth.bmage_desc=Kiedy _Mag Bitewny_ uderza wroga laską z żywej ziemi, część zadanych obrażeń powraca w postaci kamiennej zbroi.
items.wands.wandoflivingearth.desc=Ta różdżka jest wykonana z osobliwego kamienia, z pasmami jaskrawej, żółtej energii. Kamienie zdają się lekko poruszać, gdy chwytasz różdżkę, jakby wyczuwały twoją dłoń.
items.wands.wandoflivingearth.eleblast_desc=Żywiołowy wybuch laską żywej ziemi zadaje 50% obrażeń i leczy aktywnego strażnika ziemi za każdego trafionego wroga.
items.wands.wandoflivingearth.name=różdżka żywej ziemi
items.wands.wandoflivingearth.staff_name=personel żywej ziemi
items.wands.wandoflivingearth.stats_desc=Ta różdżka wystrzeliwuje w przeciwników pociski magicznej skały, zadając _%1$d-%2$d obrażeń_. Następnie skały wokół użytkownika odtworzą się, zapewniając mu pancerz proporcjonalny do zadanych obrażeń. Jeśli zgromadzi wystarczającą ilość pancerza, przy kolejnym porażeniu różdżką uformuje się kamienny strażnik.
items.wands.wandoflivingearth.upgrade_stat_name_2=Strażnik Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Blokowanie strażnika
items.wands.wandofmagicmissile$magiccharge.desc=Twoja różdżka magicznego pocisku przekazała moc z powrotem do twoich różdżek, zwiększając skuteczność kolejnego porażenia, które wygenerują.\n\nTwoje różdżki zostały wzmocnione do: +%d.\n\nPozostała liczba tur magicznego ładunku: %s.
items.wands.wandofmagicmissile$magiccharge.name=ładunek magiczny
items.wands.wandofmagicmissile.bmage_desc=Kiedy _Mag Bitewny_ uderzy wroga laską z magicznym pociskiem, wszystkie jego różdżki, oprócz laski, zyskają ładunek.
items.wands.wandofmagicmissile.desc=Ta dość prosta różdżka wystrzeliwuje pociski czystej, magicznej energii. Choć sama różdżka nie ma żadnych efektów specjalnych, ma więcej dostępnych ładunków i po ulepszeniu może na krótko wzmocnić inne różdżki.
items.wands.wandofmagicmissile.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.wands.wandofmagicmissile.eleblast_desc=Żywiołowy wybuch pociskiem magicznym zadaje 50% obrażeń i zapewnia magowi 15 tur na doładowanie.
items.wands.wandofmagicmissile.name=różdżka magicznego pocisku
items.wands.wandofmagicmissile.staff_name=laska magicznego pocisku
items.wands.wandofmagicmissile.stats_desc=Każdy strzał z tej różdżki zadaje _%1$d-%2$d obrażeń_ i na krótko wzmocni inne różdżki, jeśli zostanie ulepszona.
items.wands.wandofprismaticlight.bmage_desc=Kiedy _Mag Bitewny_ uderzy wroga laską pryzmatycznego światła, zostanie on okaleczony na czas, którego długość zależy od poziomu laski.
items.wands.wandofprismaticlight.desc=Ta różdżka jest wykonana z litego kawałka półprzezroczystego kryształu, niczym długi kawałek gładkiego szkła. Małe drobinki kolorowego światła tańczą wokół czubka różdżki, gotowe do wybuchu.
items.wands.wandofprismaticlight.eleblast_desc=Żywiołowy wybuch wykonany za pomocą pryzmatycznego światła zadaje 67% obrażeń, ujawnia cały teren w zasięgu wybuchu i oślepia wrogów na 5 tur.
items.wands.wandofprismaticlight.name=różdżka światła pryzmatycznego
items.wands.wandofprismaticlight.staff_name=laska światła pryzmatycznego
items.wands.wandofprismaticlight.stats_desc=Ta różdżka wystrzeliwuje promienie światła, które przecinają mrok lochu, odsłaniając ukryte obszary i pułapki. Promień może oślepiać wrogów i zadaje _%1$d-%2$d obrażeń._ Demoniczni i nieumarli przeciwnicy będą płonąć w jasnym świetle różdżki, otrzymując dodatkowe obrażenia.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Ślepy przypadek
items.wands.wandofprismaticlight.upgrade_stat_name_3=Czas trwania światła
items.wands.wandofregrowth$dewcatcher.desc=Łapacze rosy to cudowne rośliny, które wypełniają się magiczną rosą. Próbują kamuflować się pod trawą, aby uniknąć uwagi, ale zdradzają je wypukłości zebranej rosy.
items.wands.wandofregrowth$dewcatcher.discover_hint=Roślinę tę można znaleźć za pomocą specjalnej różdżki.
items.wands.wandofregrowth$dewcatcher.name=Łapacz rosy
items.wands.wandofregrowth$lotus.desc=Złoty lotos to mistyczna roślina, którą można przywołać jedynie za pomocą potężnej różdżki odrastania. Jego aura wzmacnia wszystkie rośliny i ich efekty, ale po krótkim czasie wyczerpuje swoją energię i obumiera.
items.wands.wandofregrowth$lotus.discover_hint=Roślinę tę można znaleźć przy konkretnej różdżce, po jej wielokrotnym ulepszeniu.
items.wands.wandofregrowth$lotus.name=Złoty Lotos
items.wands.wandofregrowth$lotus.wand_info=Ten lotos został wytworzony za pomocą różdżki _+%1$d_ odrostu. Wszystkie rośliny w jego zasięgu zostaną _natychmiast aktywowane_, jeśli zostaną posadzone na postaci. Rośliny będą miały również _%2$d%% szansę_ na upuszczenie nasion, a strzałki z końcówkami będą zużywać _%3$d%% mniej wytrzymałości_.
items.wands.wandofregrowth$seedpod.desc=Strąki nasienne to magiczne rośliny, które wytwarzają nasiona z innych gatunków roślin, a nie z własnych. W jakiś sposób udaje im się rozmnażać, mimo że nie mają własnych nasion.
items.wands.wandofregrowth$seedpod.discover_hint=Roślinę tę można znaleźć za pomocą specjalnej różdżki.
items.wands.wandofregrowth$seedpod.name=Strąk nasienny
items.wands.wandofregrowth.bmage_desc=Gdy _Mag Bitewny_ uderzy wroga laską wzrostu, a obaj stoją na trawie, otrzyma ziołowe leczenie proporcjonalne do zadanych obrażeń.
items.wands.wandofregrowth.degradation=Po kolejnych ładowaniach _%d_ różdżka przestanie wytwarzać rośliny i świeżą trawę. Limit ten zwiększa się poprzez awansowanie lub ulepszenie różdżki.
items.wands.wandofregrowth.desc=Ta różdżka jest wykonana z cienkiego trzonka z mistrzowsko rzeźbionego drewna. Jakimś cudem wciąż jest żywa i pełna życia, jasnozielona jak rdzeń młodego drzewa. „Kiedy życie gaśnie, nowe życie zawsze zaczyna rosnąć… Wieczny cykl zawsze trwa!”
items.wands.wandofregrowth.eleblast_desc=Żywiołowy wybuch z laską odrostu ukorzenia wrogów i powoduje losowe pojawienie się trawy na obszarze wybuchu.
items.wands.wandofregrowth.name=różdżka odrostu
items.wands.wandofregrowth.staff_name=personel odrostu
items.wands.wandofregrowth.stats_desc=Po użyciu, ta różdżka wystrzeli magiczną energię odrostu w stożku, powodując ożywienie trawy, korzeni i rzadkich roślin. Jej kolejne uderzenie zużyje _ładunki %1$d_. Im więcej ładunków zużyje różdżka, tym większy i silniejszy będzie efekt.
items.wands.wandofregrowth.upgrade_stat_name_1=Trawa na jedno ładowanie
items.wands.wandofregrowth.upgrade_stat_name_2=Całkowity limit trawy
items.wands.wandoftransfusion.bmage_desc=Kiedy _Mag Bitewny_ uderzy zaczarowanego wroga laską transfuzji, zyska osłonę, a jego następny atak laską nie będzie kosztował żadnego zdrowia.
items.wands.wandoftransfusion.charged=Twoja laska jest naładowana energią życiową twojego wroga!
items.wands.wandoftransfusion.desc=Różdżka o dość prostym kształcie, wyróżnia się odcieniem magenty i czarnym jak smoła kamieniem na końcu.
items.wands.wandoftransfusion.eleblast_desc=Żywiołowy wybuch za pomocą laski transfuzji zaklina wrogów, leczy sojuszników i zadaje 100% obrażeń nieumarłym wrogom.
items.wands.wandoftransfusion.name=różdżka do transfuzji
items.wands.wandoftransfusion.ondeath=Zabiłeś się własną Różdżką Transfuzji...
items.wands.wandoftransfusion.staff_name=personel transfuzjologii
items.wands.wandoftransfusion.stats_desc=Użyta na sojusznikach lub zaczarowanych wrogach, ta różdżka pozbawi użytkownika _%1$d zdrowia_, lecząc go lub osłaniając sojusznika, aby zapewnić mu _%2$d zdrowia_. Użyta na wrogach, różdżka na krótko ich zaczaruje, jednocześnie nakładając na użytkownika _%3$d osłonę_. Wrogie nieumarłe otrzymają _%4$d-%5$d obrażeń_ zamiast zostać zaczarowane.
items.wands.wandoftransfusion.upgrade_stat_name_1=Uzdrawianie sojusznicze
items.wands.wandoftransfusion.upgrade_stat_name_2=Samoosłaniający
items.wands.wandoftransfusion.upgrade_stat_name_3=Obrażenia od nieumarłych
items.wands.wandofwarding$ward.desc_1=Ten podstawowy przedmiot automatycznie porazi każdego wroga, który znajdzie się w jego zasięgu widzenia, zadając _%1$d-%2$d obrażenia._\n\nPorażenie tego przedmiotu różdżką ochrony spowoduje jego ulepszenie.\n\nTen przedmiot porazi tylko raz, po czym się rozproszy.\n\nTwoja różdżka ochrony wykorzystuje _%3$d energię_, aby podtrzymać ten przedmiot.
items.wands.wandofwarding$ward.desc_2=Ten ulepszony przedmiot ma bardziej złożony wzór i może atakować wielokrotnie. Każde porażenie z tego przedmiotu zada obrażenia _%1$d-%2$d._\n\nPorażenie tego przedmiotu różdżką ochrony ulepszy go.\n\nTen przedmiot zostanie porażony trzy razy, zanim się rozproszy.\n\nTwoja różdżka ochrony zużywa energię _%3$d_ do podtrzymania tego przedmiotu.
items.wands.wandofwarding$ward.desc_3=Ten w pełni ulepszony totem może atakować więcej razy niż jego poprzednicy. Każde porażenie z tego totemu zada _%1$d-%2$d obrażeń._\n\nPorażenie tego totemu różdżką totemu ulepszy go.\n\nTen totem zaatakuje pięć razy, zanim się rozproszy.\n\nTwoja różdżka totemu zużywa _%3$d energii_ do podtrzymania tego totemu.
items.wands.wandofwarding$ward.desc_4=Ten mniejszy strażnik ma taką samą siłę ognia jak większy strażnik, ale zamiast określonej liczby ładunków ma zdrowie. Przypomina klejnot na końcu różdżki strażnika. Każde porażenie z tego strażnika zada _%1$d-%2$d obrażeń._\n\nPorażenie tego strażnika różdżką strażnika ulepszy go i uleczy.\n\nTen strażnik zużywa trochę zdrowia za każdym razem, gdy poraża wroga, ale można go uleczyć, używając na nim różdżki strażnika.\n\nTwoja różdżka strażnika zużywa _%3$d energii_ do podtrzymania tego strażnika.
items.wands.wandofwarding$ward.desc_5=Ten ulepszony wartownik jest większy i bardziej wytrzymały niż słabszy wartownik. Każde porażenie z tego wartownika zada _%1$d-%2$d obrażeń._\n\nPorażenie tego wartownika różdżką ochronną ulepszy go i uleczy.\n\nTen wartownik zużywa trochę zdrowia za każdym razem, gdy porazi wroga, ale można go uleczyć, używając na nim różdżki ochronnej.\n\nTwoja różdżka ochronna zużywa _%3$d energii_ do podtrzymania tego wartownika.
items.wands.wandofwarding$ward.desc_6=Ten w pełni ulepszony wartownik jest znacznie trwalszy niż jego poprzednicy. Każde porażenie z tego wartownika zadaje _%1$d-%2$d obrażeń._\n\nPorażenie tego wartownika różdżką ochronną uleczy go.\n\nTen wartownik zużywa trochę zdrowia za każdym razem, gdy poraża wroga, ale można go uleczyć, używając na nim różdżki ochronnej.\n\nTwoja różdżka ochronna zużywa _%3$d energii_ do podtrzymania tego wartownika.
items.wands.wandofwarding$ward.desc_generic_sentry=Ten strażnik ma taką samą siłę ognia jak strażnik, ale zamiast określonej liczby ładunków ma zdrowie. Przypomina klejnot na końcu różdżki strażnika.\n\nPorażenie tego strażnika różdżką strażnika ulepszy go i uleczy.\n\nTen strażnik zużywa trochę zdrowia za każdym razem, gdy porazi wroga, ale można go uleczyć, używając na nim różdżki strażnika.
items.wands.wandofwarding$ward.desc_generic_ward=Ten przedmiot automatycznie porazi każdego wroga, który znajdzie się w jego zasięgu widzenia.\n\nPorażenie tego przedmiotu różdżką obdarzy go ulepszeniami.\n\nTematy mają ograniczoną liczbę porażeń, zanim się rozproszą.
items.wands.wandofwarding$ward.discover_hint=Postać tę można znaleźć z konkretną różdżką.
items.wands.wandofwarding$ward.dismiss_body=Możesz rozproszyć ten znak, jeśli nie chcesz już, aby twoja różdżka go utrzymywała. To natychmiast zniszczy znak.\n\nOdrzucić ten znak?
items.wands.wandofwarding$ward.dismiss_cancel=NIE
items.wands.wandofwarding$ward.dismiss_confirm=Tak
items.wands.wandofwarding$ward.dismiss_title=Odrzucić ten oddział?
items.wands.wandofwarding$ward.name_1=mniejszy oddział
items.wands.wandofwarding$ward.name_2=oddział
items.wands.wandofwarding$ward.name_3=większy okręg
items.wands.wandofwarding$ward.name_4=mniejszy wartownik
items.wands.wandofwarding$ward.name_5=wartownik
items.wands.wandofwarding$ward.name_6=większy wartownik
items.wands.wandofwarding.bad_location=Nie można tam umieścić oddziału.
items.wands.wandofwarding.bmage_desc=Kiedy _Mag Bitewny_ uderza wroga laską ochrony, wszystkie aktywne przedmioty ochronne i strażnicy mają szansę na uleczenie.
items.wands.wandofwarding.desc=Ta krótka metalowa różdżka ma jasnofioletowy klejnot unoszący się nad jej końcem.
items.wands.wandofwarding.eleblast_desc=Żywiołowy wybuch za pomocą laski ochronnej leczy wszystkich strażników i strażników w obszarze wybuchu.
items.wands.wandofwarding.name=różdżka ochronna
items.wands.wandofwarding.no_more_wards=Twoja różdżka nie wytrzyma już żadnych zaklęć.
items.wands.wandofwarding.staff_name=personel oddziału
items.wands.wandofwarding.stats_desc=Zamiast bezpośrednio ranić wroga, ta różdżka przywołuje nieruchome strażniki i wartowników. Strażników można przywołać w dowolnym miejscu, nawet przez ściany, jeśli masz wizję. Ta różdżka może utrzymać warty _%d_ energii naraz.
items.wands.wandofwarding.upgrade_stat_name_1=Uszkodzenie oddziału
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=DRINK
items.waterskin.collected=Zbierasz kroplę rosy do bukłaka z wodą.
items.waterskin.desc=Pojemnik na płyny, wykonany ze skóry i sznurka, zamykany korkiem.
items.waterskin.desc_full=Pełny bukłak zdaje się emanować energią. Może można go wykorzystać do pobłogosławienia kolejnego przedmiotu potrzebnego do przetrwania?
items.waterskin.desc_heal=Bukłak jest obecnie używany do przechowywania wody leczniczej. Im bardziej będzie wypełniony, tym szybciej zostaniesz uzdrowiony po wypiciu z niego. Wypijesz tylko tyle, ile potrzebujesz.
items.waterskin.desc_water=W tej chwili w bukłaku jest tylko trochę zwykłej wody pitnej. Na pewno jest coś w lochu, co mogłoby tam być.
items.waterskin.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.waterskin.empty=Twój bukłak jest pusty!
items.waterskin.full=Twój bukłak jest pełny!
items.waterskin.name=bukłak
items.weapon.curses.annoying.desc=Irytujące bronie potrafią mówić, ale są nieco zbyt energiczne. Często nieumyślnie zwrócą na ciebie uwagę.
items.weapon.curses.annoying.elestrike_desc=Elementarny atak z irytującą klątwą ma 20% szans na zaatakowanie każdego wroga w zasięgu na 6 tur.
items.weapon.curses.annoying.msg_1=O, CZY MY Z CZYMŚ WALCZYMY!?
items.weapon.curses.annoying.msg_10=DOBRZE UDERZONE!
items.weapon.curses.annoying.msg_11=Nie chciałem być bronią. Chciałem być siekierą drwala.
items.weapon.curses.annoying.msg_12=Pamiętaj, że nadmierna pewność siebie to powolny i podstępny zabójca.
items.weapon.curses.annoying.msg_13=WSZYSTKIE TWOJE BAZY NALEŻĄ DO NAS!
items.weapon.curses.annoying.msg_2=TAK, ZDOBYWAJCIE JE!
items.weapon.curses.annoying.msg_3=HEJ, SŁUCHAJ!
items.weapon.curses.annoying.msg_4=CZY JUŻ JESTEŚMY U SZEFA!?
items.weapon.curses.annoying.msg_5=AUĆ, NIE HAŁUJ MNIE TAK MOCNO!
items.weapon.curses.annoying.msg_6=ZGINĄĆ, OWADZIE!
items.weapon.curses.annoying.msg_7=WOOOOOOOOOOOOOOOO!
items.weapon.curses.annoying.msg_8=CZY MOŻEMY ZROBIĆ SOBIE PRZERWĘ!?
items.weapon.curses.annoying.msg_9=BACH, HAHA!
items.weapon.curses.annoying.name=irytujący %s
items.weapon.curses.dazzling.desc=Olśniewająca broń czasami będzie błyskać oślepiającym światłem, oślepiając wszystko, co może ją zobaczyć.
items.weapon.curses.dazzling.elestrike_desc=Żywiołowy atak z olśniewającą klątwą ma 50% szans na oślepienie każdego wroga w zasięgu na 6 tur.
items.weapon.curses.dazzling.name=olśniewający %s
items.weapon.curses.displacing.desc=Przemieszczająca się broń jest nasycona chaotyczną magią teleportacji, posiadającą zdolność losowego przemieszczania wrogów po podłodze.
items.weapon.curses.displacing.elestrike_desc=Żywiołowy atak z klątwą przemieszczającą ma 50% szans na teleportację każdego wroga w zasięgu.
items.weapon.curses.displacing.name=przemieszczanie %s
items.weapon.curses.explosive.desc=Broń wybuchowa stopniowo zwiększa swoją moc i eksploduje, uszkadzając wszystko w pobliżu.
items.weapon.curses.explosive.desc_cool=Twoja broń jest obecnie chłodna w dotyku.
items.weapon.curses.explosive.desc_hot=Twoja broń jest gorąca! Zaraz wybuchnie!
items.weapon.curses.explosive.desc_warm=Twoja broń nabiera energii i rozgrzewa się...
items.weapon.curses.explosive.elestrike_desc=Żywiołowy atak z klątwą wybuchową ma 50% szans na wywołanie eksplozji u losowego wroga w zasięgu.
items.weapon.curses.explosive.hot=Gorący!
items.weapon.curses.explosive.name=materiał wybuchowy %s
items.weapon.curses.explosive.warm=Ciepły...
items.weapon.curses.friendly.desc=Pacyfiści najlepiej radzą sobie z bronią sojuszniczą, gdyż od czasu do czasu uruchamia ona magię uniemożliwiającą walkę.
items.weapon.curses.friendly.elestrike_desc=Żywiołowy atak z przyjazną klątwą ma 50% szans na zauroczenie każdego wroga w zasięgu na 6 tur.
items.weapon.curses.friendly.name=przyjazny %s
items.weapon.curses.polarized.desc=Broń spolaryzowana jest pod wpływem magii, która sprawia, że jej atak zadaje o 50% więcej obrażeń lub nie zadaje żadnych obrażeń.
items.weapon.curses.polarized.elestrike_desc=Żywiołowy atak z klątwą spolaryzowaną ma 50% szans na zadanie 24-36 obrażeń każdemu przeciwnikowi w zasięgu.
items.weapon.curses.polarized.name=spolaryzowane %s
items.weapon.curses.sacrificial.desc=Broń ofiarna będzie wymagać krwi od noszącego ją w zamian za atakowanie wrogów. Im zdrowszy jest noszący, tym więcej krwi pochłonie klątwa.
items.weapon.curses.sacrificial.elestrike_desc=Elementarne uderzenie z klątwą ofiarną sprawia, że bohater i każdy przeciwnik w zasięgu krwawią, tracąc 12 punktów zdrowia.
items.weapon.curses.sacrificial.name=ofiarny %s
items.weapon.curses.wayward$waywardbuff.desc=Magia twojej niepokornej broni została aktywowana, przez co stała się ona niezwykle niecelna na krótki czas. Pamiętaj, że nie ma to wpływu na ataki, które z pewnością trafią, takie jak ataki z zaskoczenia. Udany atak niepokorną bronią natychmiast usunie ten efekt.\n\nPozostałe tury: %s.
items.weapon.curses.wayward$waywardbuff.name=nieobliczalny
items.weapon.curses.wayward.desc=Zbłąkana broń czasami staje się wyjątkowo niecelna. Ta magia trwa chwilę po aktywacji, ale można ją rozproszyć, zadając cios zbłąkaną bronią.
items.weapon.curses.wayward.elestrike_desc=Elementarny atak z klątwą ma 50% szans na rzucenie klątwy na każdego wroga w zasięgu na 6 tur.
items.weapon.curses.wayward.name=niegrzeczny %s
items.weapon.enchantments.blazing.desc=To zaklęcie sprawia, że z broni zaczynają wydobywać się płomienie, podpalające wrogów i zadające dodatkowe obrażenia tym wrogom, którzy już są w płomieniach.
items.weapon.enchantments.blazing.elestrike_desc=Żywiołowy atak z płonącym zaklęciem rozprzestrzenia ogień na wszystkie pola w zasięgu, co trwa 8 tur.
items.weapon.enchantments.blazing.name=płonący %s
items.weapon.enchantments.blocking$blockbuff.desc=Blokujące zaklęcie twojej broni zapewniło ci krótkotrwałe wzmocnienie siły obronnej!\n\nPozostała osłona: %d\n\nPozostała liczba tur: %s.
items.weapon.enchantments.blocking$blockbuff.name=bloking
items.weapon.enchantments.blocking.desc=Broń blokująca ma szansę na chwilowe osłonięcie cię po ataku nią.
items.weapon.enchantments.blocking.elestrike_desc=Elementarny atak z blokującym zaklęciem zapewnia Duelistowi dodatkowe 6 punktów tarczy za każdego wroga w zasięgu.
items.weapon.enchantments.blocking.name=blokowanie %s
items.weapon.enchantments.blooming.desc=Kwitnąca broń zawiera magię, która sprawia, że na trafionym obiekcie lub wokół niego wyrasta roślinność.
items.weapon.enchantments.blooming.elestrike_desc=Żywiołowy atak z rozkwitającym zaklęciem rozprzestrzenia trawę na obszar do 8 pól i unieruchamia wszystkich wrogów w zasięgu na 6 tur.
items.weapon.enchantments.blooming.name=kwitnący %s
items.weapon.enchantments.chilling.desc=Wrogowie objęci tym zaklęciem zostają wyziębieni, co spowalnia ich ruchy i ataki.
items.weapon.enchantments.chilling.elestrike_desc=Elementarny atak z mrożącym urokiem rozprzestrzenia mroźne powietrze na każdą płytkę w zasięgu, co trwa 8 tur.
items.weapon.enchantments.chilling.name=mrożący krew w żyłach %s
items.weapon.enchantments.corrupting.desc=To potężne zaklęcie potrafi podporządkować wrogów twojej woli. Gdy wróg zostanie zabity tą bronią, istnieje szansa, że zostanie skażony, zamiast umrzeć.
items.weapon.enchantments.corrupting.elestrike_desc=Żywiołowy atak z zaklęciem skażającym ma 5-25% szans (w oparciu o brakujące PW) na skażenie każdego wroga w zasięgu, poza celem głównym.
items.weapon.enchantments.corrupting.name=uszkadzanie %s
items.weapon.enchantments.elastic.desc=Elastyczna broń ma szansę odrzucić wrogów na niewielką odległość.
items.weapon.enchantments.elastic.elestrike_desc=Żywiołowy cios z elastycznym zaklęciem odrzuca wszystkich wrogów w zasięgu o 5 pól.
items.weapon.enchantments.elastic.name=elastyczny %s
items.weapon.enchantments.grim.desc=To potężne zaklęcie posiada moc natychmiastowego wyeliminowania wroga. Prawdopodobieństwo wystąpienia efektu jest tym większe, im słabszy jest wróg.
items.weapon.enchantments.grim.elestrike_desc=Elementarny atak z ponurym zaklęciem ma 6-30% szans (w oparciu o brakujące HP) na zabicie każdego wroga w zasięgu, poza celem głównym.
items.weapon.enchantments.grim.name=ponury %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Twoja broń zmagazynowała nadmiar siły z poprzedniego śmiertelnego ciosu i doda go jako dodatkowe obrażenia do następnego ataku. Energia będzie jednak stopniowo zanikać z czasem.\n\nZachowane obrażenia: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=zachowane uszkodzenia
items.weapon.enchantments.kinetic.desc=Kiedy wróg zostaje zabity bronią kinetyczną, nadmiarowa siła zostaje zmagazynowana w broni i wykorzystana w kolejnym skutecznym ataku.
items.weapon.enchantments.kinetic.elestrike_desc=Elementarne uderzenie z zaklęciem kinetycznym zadaje 40% zmagazynowanych obrażeń każdemu przeciwnikowi w zasięgu, oprócz głównego celu.
items.weapon.enchantments.kinetic.name=kinetyczny %s
items.weapon.enchantments.lucky.desc=Wrogowie zabici szczęśliwą bronią mają szansę na upuszczenie dodatkowego łupu.
items.weapon.enchantments.lucky.elestrike_desc=Atak żywiołów ze szczęśliwym zaklęciem ma 12,5% szansy na pojawienie się łupu pod każdym przeciwnikiem w zasięgu. Ten efekt może zostać aktywowany tylko raz na każdego wroga.
items.weapon.enchantments.lucky.name=szczęśliwy %s
items.weapon.enchantments.projecting.desc=Dzięki temu zaklęciu broń biała zyska większy zasięg. Broń dystansowa będzie przebijać ściany, gdy zostanie wycelowana w pobliskie cele.
items.weapon.enchantments.projecting.elestrike_desc=Elementarny atak z rzucanym zaklęciem zadaje 30% obrażeń każdemu przeciwnikowi w zasięgu, oprócz głównego celu.
items.weapon.enchantments.projecting.name=wystający %s
items.weapon.enchantments.shocking.desc=Łuki elektryczne powstają z broni paraliżującej, zadając dodatkowe obrażenia wszystkim pobliskim wrogom.
items.weapon.enchantments.shocking.elestrike_desc=Żywiołowy atak z porażającym zaklęciem rozprzestrzenia elektryczność na wszystkie pola w zasięgu, co trwa 8 tur.
items.weapon.enchantments.shocking.name=szokujący %s
items.weapon.enchantments.unstable.desc=Zaklęcie to emanuje chaotyczną energią, działając przy każdym trafieniu jako inne zaklęcie.
items.weapon.enchantments.unstable.elestrike_desc=Elementarny atak z niestabilnym zaklęciem nakłada losowy efekt zaklęcia na każdego wroga w zasięgu, oprócz głównego celu.
items.weapon.enchantments.unstable.name=niestabilny %s
items.weapon.enchantments.vampiric.desc=To potężne zaklęcie wysysa energię życiową z wrogów z każdym ciosem, wtłaczając ją z powrotem do noszącego. Efekt jest tym silniejszy, im niższy jest poziom zdrowia noszącego.
items.weapon.enchantments.vampiric.elestrike_desc=Elementarne uderzenie z wampirycznym zaklęciem leczy Duelistę o 2,5 punktów zdrowia za każdego wroga w zasięgu.
items.weapon.enchantments.vampiric.name=wampiryczny %s
items.weapon.melee.assassinsblade.ability_desc=Duelistka może _skradać się_, dzierżąc ostrze zabójcy. Ta umiejętność pozwala Duelistce natychmiast przemknąć na odległość do 3 pól i zapewnia jej _%d tur niewidzialności._
items.weapon.melee.assassinsblade.ability_name=donosiciel
items.weapon.melee.assassinsblade.desc=Małe, faliste ostrze wykonane z obsydianu, trudne w użyciu, mimo że lekkie, lecz śmiercionośne, jeśli trafi w odpowiedni cel.
items.weapon.melee.assassinsblade.name=ostrze zabójcy
items.weapon.melee.assassinsblade.stats_desc=Ta broń jest skuteczniejsza przeciwko nieświadomym wrogom.
items.weapon.melee.assassinsblade.typical_ability_desc=Duelista może _skradać się_, dzierżąc ostrze zabójcy. Ta umiejętność pozwala Duelistowi natychmiast przemknąć na odległość do 3 pól i zazwyczaj zapewnia jej _%d tur niewidzialności._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.battleaxe.ability_desc=Duelista może zadać _ciężki cios_ toporem bojowym. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Ciężki cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.battleaxe.ability_name=ciężki cios
items.weapon.melee.battleaxe.desc=Ogromna stalowa głowica tego topora bojowego zapewnia znaczną siłę każdemu szerokiemu uderzeniu.
items.weapon.melee.battleaxe.name=topór bojowy
items.weapon.melee.battleaxe.stats_desc=To jest dość celna broń.
items.weapon.melee.battleaxe.typical_ability_desc=Duelista może zadać _ciężki cios_ toporem bojowym. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Ciężki cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.crossbow$chargedshot.desc=Duelistka skupia moc w swojej kuszy. Jej kolejny atak zawsze trafi i nałoży jeden z trzech efektów: \n – Ataki wręcz odrzucą wrogów o kilka pól. \n – Strzałki bez grotów zadają dodatkowe obrażenia. \n – Strzałki z grotami zyskają dodatkowe zastosowania i nałożą swój efekt na obszar 7x7. Pozytywne efekty strzałek będą działać tylko na sojuszników, a szkodliwe efekty będą działać tylko na wrogów. Duelistka nie może użyć tej zdolności, aby nałożyć pozytywne efekty strzałek na siebie.
items.weapon.melee.crossbow$chargedshot.name=oskarżony
items.weapon.melee.crossbow.ability_desc=Duelistka może _naładować_ swoją kuszę, co sprawia, że jej następny zwykły atak zawsze trafia i nakłada jeden z trzech efektów: ataki wręcz odrzucają wrogów, nieostrzone strzałki zadają _+%1$d obrażeń_, a ostre strzałki nakładają swój efekt na obszar 7x7 i trwają _%2$d więcej użyć_.
items.weapon.melee.crossbow.ability_name=strzał ładowany
items.weapon.melee.crossbow.desc=Dość skomplikowana broń, która strzela bełtami z wyjątkową prędkością. Choć nie jest do tego przeznaczona, jej ciężar i solidna konstrukcja sprawiają, że jest to również niezła broń do walki wręcz.
items.weapon.melee.crossbow.name=kusza
items.weapon.melee.crossbow.stats_desc=Ta broń wzmacnia rzucane strzałki, zadając _%1$d-%2$d obrażeń_, gdy jest założona, a nawet zapewnia im swój czar.
items.weapon.melee.crossbow.typical_ability_desc=Duelistka może _naładować_ swoją kuszę, co sprawia, że jej kolejny zwykły atak zawsze trafia i nakłada jeden z trzech efektów: ataki wręcz odrzucają wrogów, strzałki bez grotów zazwyczaj zadają _+%1$d obrażeń_, a strzałki z grotami nakładają swój efekt na obszar 7x7 i zwykle trwają o _%2$d więcej użyć_.
items.weapon.melee.crossbow.typical_stats_desc=Zazwyczaj ta broń wzmacnia rzucane strzałki, zadając _%1$d-%2$d obrażeń_, gdy jest wyposażona, a nawet zapewnia im swój czar.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Wzmocnienie umiejętności
items.weapon.melee.cudgel.ability_desc=Pojedynek może zadać _silny cios_ pałką. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.cudgel.ability_name=ciężki cios
items.weapon.melee.cudgel.desc=Mała mosiężna buława, służąca raczej jako narzędzie samoobrony szlachty niż broń bojowa.
items.weapon.melee.cudgel.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.cudgel.name=pałka
items.weapon.melee.cudgel.stats_desc=To jest dość celna broń.
items.weapon.melee.cudgel.typical_ability_desc=Duelista może zadać _silny cios_ pałką. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.dagger.ability_desc=Pojedynkowiczka może _skradać się_, dzierżąc sztylet. Ta umiejętność pozwala pojedynkowiczce natychmiast przemknąć na odległość do 5 pól i zapewnia jej _%d tur niewidzialności._
items.weapon.melee.dagger.ability_name=donosiciel
items.weapon.melee.dagger.desc=Prosty żelazny sztylet ze zużytą drewnianą rękojeścią.
items.weapon.melee.dagger.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.dagger.name=sztylet
items.weapon.melee.dagger.stats_desc=Ta broń jest skuteczniejsza przeciwko nieświadomym wrogom.
items.weapon.melee.dagger.typical_ability_desc=Pojedynkowiczka może _skradać się_, dzierżąc sztylet. Ta umiejętność pozwala pojedynkowiczce natychmiast przemknąć na odległość do 5 pól i zazwyczaj zapewnia jej _%d tur niewidzialności._
items.weapon.melee.dagger.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.dirk.ability_desc=Pojedynkowiczka może _skradać się_, dzierżąc sztylet. Ta umiejętność pozwala pojedynkowiczce natychmiast przemknąć na odległość do 4 pól i zapewnia jej _%d tur niewidzialności._
items.weapon.melee.dirk.ability_name=donosiciel
items.weapon.melee.dirk.desc=Dłuższy sztylet do pchnięć zapewnia więcej stali, która pozwala zaatakować wrogów.
items.weapon.melee.dirk.name=sztylet
items.weapon.melee.dirk.stats_desc=Ta broń jest skuteczniejsza przeciwko nieświadomym wrogom.
items.weapon.melee.dirk.typical_ability_desc=Pojedynkowiczka może _skradać się_, dzierżąc sztylet. Ta umiejętność pozwala pojedynkowiczce natychmiast przemknąć na odległość do 4 pól i zazwyczaj zapewnia jej _%d tur niewidzialności._
items.weapon.melee.dirk.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.flail$spinabilitytracker.desc=Duelistka kręci swoim cepem, zwiększając obrażenia przed kolejnym standardowym atakiem. Każdy obrót zajmuje jedną turę, ale zwiększa obrażenia, maksymalnie do trzech. Cepa kręci się z pewnością i trafi przeciwnika.\n\nAktualne obroty: %1$d%%.\nPozostałe tury: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail.ability_desc=Duelist może _kręcić_ cepem, aby na krótko zgromadzić moc. Każda tura obrotu cepem zadaje _+%d obrażeń_ przy kolejnym standardowym ataku, maksymalnie 3 razy. Wirujący cep również ma gwarancję trafienia. Samo rozpoczęcie obrotu cepem kosztuje ładunek.
items.weapon.melee.flail.ability_name=kręcić się
items.weapon.melee.flail.desc=Kolczasta kula przymocowana do rączki za pomocą łańcucha. Bardzo nieporęczna, ale zabójcza, jeśli trafi dobrze.
items.weapon.melee.flail.name=cep
items.weapon.melee.flail.spin_warn=Nie możesz już kręcić cepem.
items.weapon.melee.flail.stats_desc=Jest to broń raczej niedokładna.\nTa broń nie potrafi zaskoczyć przeciwnika.
items.weapon.melee.flail.typical_ability_desc=Duelist może _kręcić_ cepem, aby na krótko zgromadzić moc. Każda tura obrotu cepem zazwyczaj zadaje _+%d obrażeń_ przy kolejnym standardowym ataku, maksymalnie 3 razy. Wirujący cep również ma gwarancję trafienia. Samo rozpoczęcie obrotu cepem kosztuje ładunek.
items.weapon.melee.gauntlet.ability_desc=Duelista może wykonać _kombinację ciosów_ kamienną rękawicą. Ten atak ma gwarantowane trafienie i zadaje _+%d obrażeń_ za każdym razem, gdy Duelista trafi zwykłym atakiem wręcz lub bronią miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.gauntlet.ability_name=uderzenie kombinowane
items.weapon.melee.gauntlet.desc=Ta masywna rękawica wykonana jest z karmazynowego materiału, na którym umieszczono warstwę ciężkich, magicznych kamieni. Materiał zaciska się wokół ciebie, sprawiając, że grube kamienne płyty otulają cię niczym druga skóra. Machanie tak ciężką bronią wymaga siły, ale zadaje ciosy z ogromną siłą.
items.weapon.melee.gauntlet.name=kamienna rękawica
items.weapon.melee.gauntlet.stats_desc=To bardzo szybka broń.
items.weapon.melee.gauntlet.typical_ability_desc=Duelista może wykonać _kombinację ciosów_ kamienną rękawicą. Ten atak ma gwarantowane trafienie i zazwyczaj zadaje _+%d obrażeń_ za każdym razem, gdy Duelista trafi zwykłym atakiem wręcz lub bronią miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.glaive.ability_desc=Pojedynkowicz może użyć czubka glewii, aby _przebić_ wroga znajdującego się w zasięgu, ale nie sąsiadującego z nim. Zadaje to _%1$d-%2$d obrażeń_, odrzuca wroga i gwarantuje trafienie.
items.weapon.melee.glaive.ability_name=kolec
items.weapon.melee.glaive.desc=Ogromna broń drzewcowa składająca się z ostrza miecza umieszczonego na końcu drzewca.
items.weapon.melee.glaive.name=glewia
items.weapon.melee.glaive.stats_desc=To dość powolna broń.\nTa broń ma dodatkowy zasięg.
items.weapon.melee.glaive.typical_ability_desc=Pojedynkowicz może użyć czubka glewii, aby _przebić_ wroga znajdującego się w zasięgu, ale nie sąsiadującego z nim. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_, odrzuca wroga i gwarantuje trafienie.
items.weapon.melee.gloves.ability_desc=Duelista może wykonać _kombinację ciosów_ za pomocą rękawic z ćwiekami. Ten atak ma gwarantowane trafienie i zadaje _+%d obrażeń_ za każdym razem, gdy Duelista trafi zwykłym atakiem wręcz lub bronią miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.gloves.ability_name=uderzenie kombinowane
items.weapon.melee.gloves.desc=Te nabijane kolcami rękawice nie zapewniają prawdziwej ochrony, ale stanowią praktyczną broń, pozwalając jednocześnie zachować swobodę rąk.
items.weapon.melee.gloves.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.gloves.name=rękawiczki z ćwiekami
items.weapon.melee.gloves.stats_desc=To bardzo szybka broń.
items.weapon.melee.gloves.typical_ability_desc=Duelista może wykonać _kombinację ciosów_ za pomocą rękawic z ćwiekami. Ten atak ma gwarantowany efekt i zazwyczaj zadaje _+%d obrażeń_ za każde trafienie Duelisty zwykłą bronią białą lub miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.greataxe.ability_desc=Duelistka może wykonać atak _retrybucyjny_ toporem, jeśli ma mniej niż 50%% punktów zdrowia. Ten niszczycielski atak zadaje _%1$d-%2$d obrażeń_, ma gwarantowane trafienie i jest natychmiastowy, jeśli zabije wroga.
items.weapon.melee.greataxe.ability_name=zemsta
items.weapon.melee.greataxe.desc=Zaprojektowana do noszenia na ramieniu, ta gigantyczna siekiera jest równie potężna, co ciężka.
items.weapon.melee.greataxe.name=topór dwuręczny
items.weapon.melee.greataxe.stats_desc=Ta broń jest niesamowicie ciężka.
items.weapon.melee.greataxe.typical_ability_desc=Duelistka może wykonać atak _retrybucyjny_ toporem, jeśli ma mniej niż 50%% punktów zdrowia. Ten niszczycielski atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, ma gwarantowane trafienie i jest natychmiastowy, jeśli zabije wroga.
items.weapon.melee.greatshield.ability_desc=Duelistka może _bronić_ się wielką tarczą, całkowicie anulując wszystkie ataki fizyczne i magiczne skierowane przeciwko niej przez _%d tur_. Gdy Duelistka zablokuje atak, kontratak lub użycie magii zakończy obronę.
items.weapon.melee.greatshield.ability_name=strażnik
items.weapon.melee.greatshield.desc=Ta gigantyczna masa metalu przypomina raczej ruchomą ścianę niż tarczę. Pomaga w obronie, ale nie pozostawia wiele miejsca na atak.
items.weapon.melee.greatshield.name=wielka tarcza
items.weapon.melee.greatshield.stats_desc=Ta broń blokuje obrażenia od 0 do %d. Blokada ta skaluje się z ulepszeniami.
items.weapon.melee.greatshield.typical_ability_desc=Duelistka może _bronić_ się wielką tarczą, całkowicie anulując wszystkie ataki fizyczne lub magiczne, zazwyczaj przez _%d tur_. Gdy Duelistka zablokuje atak, kontratak lub użycie magii zakończy obronę.
items.weapon.melee.greatshield.typical_stats_desc=Zazwyczaj ta broń blokuje obrażenia od 0 do %d. Blokada ta skaluje się z ulepszeniami.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.greatsword.ability_desc=Pojedynkowicz może _rozłupać_ wroga wielkim mieczem. Zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.greatsword.ability_name=rozszczepiać
items.weapon.melee.greatsword.desc=To potężne ostrze zadaje duże obrażenia, inwestując całą swoją masę w każdy cios.
items.weapon.melee.greatsword.name=wielki miecz
items.weapon.melee.greatsword.typical_ability_desc=Pojedynkowicz może _rozłupać_ wroga wielkim mieczem. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.handaxe.ability_desc=Duelista może wykonać _silny cios_ toporem ręcznym. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.handaxe.ability_name=ciężki cios
items.weapon.melee.handaxe.desc=Lekka siekiera, najczęściej używana do ścinania drzew. Szerokie ostrze sprawdza się również w walce z wrogami.
items.weapon.melee.handaxe.name=siekiera ręczna
items.weapon.melee.handaxe.stats_desc=To jest dość celna broń.
items.weapon.melee.handaxe.typical_ability_desc=Duelista może zadać _silny cios_ toporem ręcznym. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.katana.ability_desc=Duelista może _rzucić się_ kataną na wroga oddalonego o 1 pole. Posuwa się ona w kierunku wroga, zadaje _%1$d-%2$d obrażeń_ i z pewnością trafi.
items.weapon.melee.katana.ability_name=lonża
items.weapon.melee.katana.desc=Smukły miecz z dużą metalową osłoną nad rękojeścią.
items.weapon.melee.katana.name=katana
items.weapon.melee.katana.stats_desc=Ta broń blokuje 0-3 obrażeń.
items.weapon.melee.katana.typical_ability_desc=Duelista może _rzucić się_ kataną na wroga oddalonego o 1 pole. Ten atak porusza się w kierunku wroga, zazwyczaj zadaje _%1$d-%2$d obrażeń_ i jest gwarantowany.
items.weapon.melee.longsword.ability_desc=Pojedynkowicz może _rozłupać_ wroga długim mieczem. Zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.longsword.ability_name=rozszczepiać
items.weapon.melee.longsword.desc=Długie, ostre jak brzytwa stalowe ostrze tego miecza lśni uspokajająco, choć jego rozmiar sprawia, że jest dość ciężki.
items.weapon.melee.longsword.name=długi miecz
items.weapon.melee.longsword.typical_ability_desc=Pojedynkowicz może _rozłupać_ przeciwnika długim mieczem. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.mace.ability_desc=Duelista może zadać _ciężki cios_ buławą. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Ciężki cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.mace.ability_name=ciężki cios
items.weapon.melee.mace.desc=Duża żelazna głowica tej broni zadaje znaczne obrażenia.
items.weapon.melee.mace.name=buzdygan
items.weapon.melee.mace.stats_desc=To jest dość celna broń.
items.weapon.melee.mace.typical_ability_desc=Duelista może zadać _silny cios_ buławą. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.magesstaff.ac_imbue=PRZEFARBOWAĆ
items.weapon.melee.magesstaff.ac_zap=ZASTRZELIĆ
items.weapon.melee.magesstaff.cursed_wand=Kostur jest przeklęty, przez co jego magia staje się chaotyczna i losowa.
items.weapon.melee.magesstaff.desc=Ta laska, wykonana przez samego Maga, jest wyjątkową magiczną bronią, do której można przymocować różdżkę.
items.weapon.melee.magesstaff.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.magesstaff.has_wand=Personel jest obecnie nasączony _%s._
items.weapon.melee.magesstaff.imbue=Wyposażasz swój personel w %s.
items.weapon.melee.magesstaff.imbue_cursed=_Jeśli zaklniesz różdżkę, twoja laska również zostanie zaklęta!_
items.weapon.melee.magesstaff.imbue_desc=Czy na pewno chcesz nasycić swoją laskę tą różdżką?\n\nJeśli nasycana różdżka ma taki sam lub wyższy poziom niż laska, laska odziedziczy poziom tej różdżki plus jedno ze swoich ulepszeń.
items.weapon.melee.magesstaff.imbue_level=To nasycenie spowoduje powstanie personelu _+%d._
items.weapon.melee.magesstaff.imbue_lost=Różdżka, którą obecnie posiadasz, _zostanie utracona_.
items.weapon.melee.magesstaff.imbue_talent=Różdżka, która jest obecnie nasączona w Twojej lasce _zostanie zwrócona za +0_.
items.weapon.melee.magesstaff.imbue_unknown=Nie znasz poziomu tej różdżki, ale to nasycenie zapewni Ci co najmniej laskę _+%d._
items.weapon.melee.magesstaff.name=laska maga
items.weapon.melee.magesstaff.no=Nie, zmieniłem zdanie
items.weapon.melee.magesstaff.no_wand=Obecnie w lasce nie ma żadnej magii, musi zostać _nasycona mocą różdżki_, aby można było używać jej do rzucania zaklęć.
items.weapon.melee.magesstaff.preserved=Poprzednia różdżka została zachowana!
items.weapon.melee.magesstaff.prompt=Wybierz różdżkę
items.weapon.melee.magesstaff.yes=Tak, jestem pewien
items.weapon.melee.meleeweapon.ability_cant_use=Nie możesz teraz skorzystać z tej umiejętności.
items.weapon.melee.meleeweapon.ability_low_str=Nie jesteś wystarczająco silny, aby używać tej broni.
items.weapon.melee.meleeweapon.ability_need_equip=Aby skorzystać z danej broni, musisz ją wyposażyć.
items.weapon.melee.meleeweapon.ability_no_charge=Nie masz wystarczająco dużo energii, aby użyć tej zdolności.
items.weapon.melee.meleeweapon.ability_no_target=Nie ma tam żadnego celu.
items.weapon.melee.meleeweapon.ability_occupied=To miejsce jest zajęte.
items.weapon.melee.meleeweapon.ability_target_range=Ten cel nie znajduje się w zasięgu.
