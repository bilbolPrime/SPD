items.weapon.melee.meleeweapon.probably_too_heavy=Być może ta broń jest dla ciebie za ciężka.
items.weapon.melee.meleeweapon.prompt=Wybierz cel
items.weapon.melee.meleeweapon.stats_known=Ta broń biała _tier-%1$d_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, aby móc jej używać prawidłowo.
items.weapon.melee.meleeweapon.stats_unknown=Zazwyczaj ta broń biała _tier-%1$d_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, aby móc jej używać prawidłowo.
items.weapon.melee.meleeweapon.swap=Zamiana broni
items.weapon.melee.meleeweapon.swap_full=Nie da się tego zrobić przy pełnym ekwipunku.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Obrażenia umiejętności
items.weapon.melee.quarterstaff$defensivestance.desc=Pojedynkowiczka używa swojego kija bojowego do odbijania nadlatujących ciosów i pocisków. Dopóki pozostaje w tej pozycji, jej unikanie wszystkich ataków jest potrojone.\n\nPozostałe tury: %s.
items.weapon.melee.quarterstaff$defensivestance.name=postawa obronna
items.weapon.melee.quarterstaff.ability_desc=Pojedynkowiczka może przyjąć _postawę obronną_ z kijem bojowym. Ta postawa jest bardzo szybka w aktywacji i potraja jej unik na _%d tur._
items.weapon.melee.quarterstaff.ability_name=postawa obronna
items.weapon.melee.quarterstaff.desc=Kij z twardego drewna, którego końce są podkute żelazem.
items.weapon.melee.quarterstaff.name=pałka
items.weapon.melee.quarterstaff.stats_desc=Ta broń blokuje 0-2 obrażeń.
items.weapon.melee.quarterstaff.typical_ability_desc=Pojedynkowiczka może przyjąć _postawę obronną_ z kijem bojowym. Ta postawa jest bardzo szybka w aktywacji i potraja jej unik, zazwyczaj na _%d tur._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.rapier.ability_desc=Duelista może _rzucić się_ z rapierem na wroga oddalonego o 1 pole. Ten atak porusza się w kierunku wroga, zadaje _%1$d-%2$d obrażeń_ i z pewnością trafi.
items.weapon.melee.rapier.ability_name=lonża
items.weapon.melee.rapier.desc=Smukły, prosty miecz zapewniający pewną ochronę w zamian za mniejszą siłę cięcia.
items.weapon.melee.rapier.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.rapier.name=rapier
items.weapon.melee.rapier.stats_desc=Ta broń blokuje 0-1 obrażeń.
items.weapon.melee.rapier.typical_ability_desc=Duelista może _rzucić się_ z rapierem na wroga oddalonego o 1 pole. Pocisk porusza się w kierunku wroga, zazwyczaj zadaje _%1$d-%2$d obrażeń_ i z pewnością trafi.
items.weapon.melee.roundshield$guardtracker.desc=Duelistka przygotowała swoją tarczę w oczekiwaniu na nadchodzące ataki. Ataki fizyczne lub magiczne zostaną całkowicie zneutralizowane.\n\nPozostałe tury: %s.
items.weapon.melee.roundshield$guardtracker.guarded=ostrożny
items.weapon.melee.roundshield$guardtracker.name=strzegący
items.weapon.melee.roundshield.ability_desc=Duelista może _obronić_ się okrągłą tarczą, całkowicie negując wszystkie ataki fizyczne i magiczne skierowane przeciwko niej przez _%d tur_. Gdy Duelista zablokuje atak, kontratak lub użycie magii zakończy obronę.
items.weapon.melee.roundshield.ability_name=strażnik
items.weapon.melee.roundshield.desc=Ta duża tarcza skutecznie blokuje ataki i stanowi niezłą broń w trudnych chwilach.
items.weapon.melee.roundshield.name=okrągła tarcza
items.weapon.melee.roundshield.stats_desc=Ta broń blokuje obrażenia od 0 do %d. Blokada ta skaluje się z ulepszeniami.
items.weapon.melee.roundshield.typical_ability_desc=Duelist może _obronić_ się okrągłą tarczą, całkowicie neutralizując wszystkie ataki fizyczne i magiczne, zazwyczaj przez _%d tur_. Gdy Duelist zablokuje atak, kontratak lub użycie magii zakończy obronę.
items.weapon.melee.roundshield.typical_stats_desc=Zazwyczaj ta broń blokuje obrażenia od 0 do %d. Blokada ta skaluje się z ulepszeniami.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.runicblade.ability_desc=Pojedynkowicz może wykonać _runiczne cięcie_ runicznym ostrzem. Ten atak ma gwarantowaną skuteczność i moc zaklęcia _+%d%%._
items.weapon.melee.runicblade.ability_name=cięcie runiczne
items.weapon.melee.runicblade.desc=Tajemnicza broń z odległej krainy, z jasnoniebieskim ostrzem.
items.weapon.melee.runicblade.name=runiczne ostrze
items.weapon.melee.runicblade.stats_desc=Ta broń potrzebuje większych ulepszeń.
items.weapon.melee.runicblade.typical_ability_desc=Pojedynkowicz może wykonać _runiczne cięcie_ runicznym ostrzem. Ten atak ma gwarantowaną skuteczność i zazwyczaj ma moc zaklęcia _+%d%%._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Moc umiejętności
items.weapon.melee.sai$combostriketracker.desc=Duelist buduje kombinację, której można użyć do zwiększenia obrażeń umiejętności uderzenia kombinowanego. Każdy udany atak bronią białą lub miotaną będzie liczony, ale brak udanego ataku przez 5 tur resetuje tę kombinację.\n\nOstatnie trafienia: %1$d.\n\nTury do utraty trafień: %2$s.
items.weapon.melee.sai$combostriketracker.name=uderzenie kombinowane
items.weapon.melee.sai.ability_desc=Duelista może wykonać _kombinację ciosów_ za pomocą sai. Ten atak ma gwarantowane trafienie i zadaje _+%d obrażeń_ za każdym razem, gdy Duelista trafi zwykłym atakiem wręcz lub bronią miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.sai.ability_name=uderzenie kombinowane
items.weapon.melee.sai.desc=Dwa cienkie ostrza przeznaczone do trzymania w jednej ręce. Doskonałe do rozwalania wrogów gradem cięć.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=To bardzo szybka broń.
items.weapon.melee.sai.typical_ability_desc=Duelista może wykonać _kombinację ciosów_ za pomocą sai. Ten atak ma gwarantowane trafienie i zazwyczaj zadaje _+%d obrażeń_ za każdym razem, gdy Duelista trafi zwykłym atakiem wręcz lub bronią miotaną. Brak trafienia przez 5 tur resetuje tę kombinację.
items.weapon.melee.scimitar$sworddance.desc=Pojedynek wykonuje szybkie ciosy oparte na pędzie, niczym taniec. W tej postawie atakuje o 60%% szybciej (wystarczająco, by atakować dokładnie dwa razy na turę sejmitarem) i ma +50%% celności.\n\nPozostało tur: %s.
items.weapon.melee.scimitar$sworddance.name=taniec z mieczami
items.weapon.melee.scimitar.ability_desc=Pojedynkowicz może wykonać _taniec miecza_ z scimitarem. Aktywacja tej postawy jest natychmiastowa i zapewnia pojedynkowiczowi +60%% szybkości ataku i +50%% celności na _%d tur._
items.weapon.melee.scimitar.ability_name=taniec z mieczami
items.weapon.melee.scimitar.desc=Grube, zakrzywione ostrze. Jego kształt pozwala na szybsze, ale mniej potężne ataki.
items.weapon.melee.scimitar.name=bułat
items.weapon.melee.scimitar.stats_desc=To dość szybka broń.
items.weapon.melee.scimitar.typical_ability_desc=Pojedynkowicz może wykonać _taniec miecza_ z scimitarem. Aktywacja tej postawy jest natychmiastowa i zapewnia pojedynkowiczowi +60%% szybkości ataku i +50%% celności, zazwyczaj na _%d tur._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Czas trwania umiejętności
items.weapon.melee.shortsword.ability_desc=Pojedynkowicz może _rozłupać_ wroga krótkim mieczem. Zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.shortsword.ability_name=rozszczepiać
items.weapon.melee.shortsword.desc=Dość krótki miecz, tylko o kilka cali dłuższy od sztyletu.
items.weapon.melee.shortsword.name=krótki miecz
items.weapon.melee.shortsword.typical_ability_desc=Pojedynkowicz może _rozłupać_ wroga krótkim mieczem. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.sickle.ability_desc=Duelista może _zniszczyć_ wroga sierpem. Ten niszczycielski atak ma gwarantowane trafienie i zadaje _%d obrażeń_. Obrażenia te są zadawane jako krwawienie, jeśli cel nie jest odporny.
items.weapon.melee.sickle.ability_name=zbiór
items.weapon.melee.sickle.desc=Przenośne narzędzie rolnicze, które może być także silną, lecz nieporęczną bronią.
items.weapon.melee.sickle.name=sierp
items.weapon.melee.sickle.stats_desc=Jest to raczej niedokładna broń.
items.weapon.melee.sickle.typical_ability_desc=Pojedynek może _zniszczyć_ wroga sierpem. Ten niszczycielski atak ma gwarantowane trafienie i zazwyczaj zadaje _%d obrażeń_. Obrażenia te są zadawane jako krwawienie, jeśli cel nie jest odporny.
items.weapon.melee.spear.ability_desc=Duelista może użyć ostrza włóczni, aby _przebić_ wroga znajdującego się w zasięgu, ale nie sąsiadującego z nim. Zadaje to _%1$d-%2$d obrażeń_, odrzuca wroga i gwarantuje trafienie.
items.weapon.melee.spear.ability_name=kolec
items.weapon.melee.spear.desc=Smukły drewniany pręt zakończony zaostrzonym żelazem.
items.weapon.melee.spear.name=włócznia
items.weapon.melee.spear.stats_desc=To dość powolna broń.\nTa broń ma dodatkowy zasięg.
items.weapon.melee.spear.typical_ability_desc=Duelista może użyć ostrza włóczni, aby _przebić_ wroga znajdującego się w zasięgu, ale nie sąsiadującego z nim. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_, odrzuca wroga i gwarantuje trafienie.
items.weapon.melee.sword$cleavetracker.desc=Pojedynkowiczka jest gotowa do kontynuacji poprzedniego rozszczepienia. Kolejne użycie rozszczepienia nie będzie kosztować żadnego ładunku umiejętności broni.\n\nPozostałe tury: %s.
items.weapon.melee.sword$cleavetracker.name=rozszczepiać
items.weapon.melee.sword.ability_desc=Pojedynkowicz może _rozłupać_ wroga mieczem. Zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.sword.ability_name=rozszczepiać
items.weapon.melee.sword.desc=Dobrze wyważony miecz. Niezbyt duży, ale wciąż zauważalnie dłuższy niż miecz krótki.
items.weapon.melee.sword.name=miecz
items.weapon.melee.sword.typical_ability_desc=Pojedynkowicz może _rozłupać_ wroga mieczem. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.warhammer.ability_desc=Duelista może wykonać _silny cios_ młotem bojowym. Ten skoncentrowany atak zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy wroga, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy wroga.
items.weapon.melee.warhammer.ability_name=ciężki cios
items.weapon.melee.warhammer.desc=Niewiele stworzeń jest w stanie wytrzymać miażdżące uderzenie tej ogromnej masy ołowiu i stali, ale aby skutecznie jej użyć, potrzebna jest wielka siła.
items.weapon.melee.warhammer.name=młot bojowy
items.weapon.melee.warhammer.stats_desc=To jest dość celna broń.
items.weapon.melee.warhammer.typical_ability_desc=Duelista może wykonać _silny cios_ młotem bojowym. Ten skoncentrowany atak zazwyczaj zadaje _%1$d-%2$d obrażeń_, jeśli zaskoczy przeciwnika, i ogłusza go na 5 tur, co zmniejsza celność i uniki o 50%%. Silny cios zawsze trafia, ale zadaje normalne obrażenia, jeśli nie zaskoczy przeciwnika.
items.weapon.melee.warscythe.ability_desc=Duelista może _zniszczyć_ wroga za pomocą wojennej kosy. Ten niszczycielski atak ma gwarantowane trafienie i zadaje _%d obrażeń_. Obrażenia te są zadawane jako krwawienie, jeśli cel nie jest odporny.
items.weapon.melee.warscythe.ability_name=zbiór
items.weapon.melee.warscythe.desc=To duże i nieporęczne narzędzie zostało wzmocnione, dzięki czemu lepiej radzi sobie z cięciem wrogów niż upraw.
items.weapon.melee.warscythe.name=kosa wojenna
items.weapon.melee.warscythe.stats_desc=Jest to raczej niedokładna broń.
items.weapon.melee.warscythe.typical_ability_desc=Duelista może _zniszczyć_ wroga za pomocą wojennej kosy. Ten niszczycielski atak ma gwarantowane trafienie i zazwyczaj zadaje _%d obrażeń_. Obrażenia te są zadawane jako krwawienie, jeśli cel nie jest odporny.
items.weapon.melee.whip.ability_desc=Duelistka może _smagać_ wszystkich wrogów wokół siebie biczem. Ta umiejętność zadaje _%1$d-%2$d obrażeń_, atakuje wszystkich wrogów w zasięgu i ma gwarantowane trafienie.
items.weapon.melee.whip.ability_name=bicz
items.weapon.melee.whip.desc=Kolczasta lina na końcu tej broni zadaje niewielkie obrażenia, ale jej zasięg jest bezkonkurencyjny.
items.weapon.melee.whip.name=bicz
items.weapon.melee.whip.stats_desc=Ta broń ma ogromny zasięg.
items.weapon.melee.whip.typical_ability_desc=Duelistka może _smagać_ wszystkich wrogów wokół siebie biczem. Ta umiejętność zazwyczaj zadaje _%1$d-%2$d obrażeń_, atakuje wszystkich wrogów w zasięgu i ma gwarantowane trafienie.
items.weapon.melee.wornshortsword.ability_desc=Pojedynkowicz może _rozłupać_ wroga zużytym krótkim mieczem. Zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.melee.wornshortsword.ability_name=rozszczepiać
items.weapon.melee.wornshortsword.desc=Dość krótki miecz, wytarty przez intensywne użytkowanie. Jest słabszy i nieco lżejszy od miecza krótkiego w lepszym stanie.
items.weapon.melee.wornshortsword.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.melee.wornshortsword.name=zużyty krótki miecz
items.weapon.melee.wornshortsword.typical_ability_desc=Pojedynkowicz może _rozłupać_ wroga zużytym krótkim mieczem. Zazwyczaj zadaje to _%1$d-%2$d obrażeń_ i jest gwarantowane trafienie. Jeśli rozłupanie zabije wroga, jest ono natychmiastowe, a pojedynkowicz może użyć rozłupania ponownie w ciągu 5 tur za darmo.
items.weapon.missiles.bolas.desc=Ta niezwykła broń dystansowa nie zadaje wielkich obrażeń, ale doskonale spowalnia cel.
items.weapon.missiles.bolas.name=kule
items.weapon.missiles.bolas.stats_desc=Broń ta zadaje celowi obrażenia.
items.weapon.missiles.boomerang.desc=Rzucony w stronę wroga płaski, zakrzywiony drewniany pocisk wróci do rąk osoby, która go rzuci.
items.weapon.missiles.boomerang.durability=Dzięki solidnej konstrukcji bumerang ten nie złamie się podczas użytkowania.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Te strzałki są pokryte mieszanką na bazie ostropestu, która zwiększa prędkość ruchu i ataku sojuszników lub chwilowo zmniejsza prędkość ruchu wrogów. Sama strzałka nadal jest szkodliwa dla wrogów, ale nie wyrządzi krzywdy sojusznikom.
items.weapon.missiles.darts.adrenalinedart.name=rzutka z adrenaliną
items.weapon.missiles.darts.blindingdart.desc=Te lotki są nasączone substancją na bazie wierzby pospolitej, która na krótko oślepia cel. Nie dezorientują jednak, więc wróg nadal będzie wiedział, gdzie cię ostatnio widział.
items.weapon.missiles.darts.blindingdart.name=oślepiająca strzałka
items.weapon.missiles.darts.chillingdart.desc=Te rzutki mają końcówki pokryte substancją na bazie lodu, która znacząco chłodzi cel.
items.weapon.missiles.darts.chillingdart.name=mrożąca krew w żyłach lotka
items.weapon.missiles.darts.cleansingdart.desc=Te strzałki są nasączone mieszanką na bazie mageroyal, która tymczasowo uodpornia sojuszników na wszelkie negatywne efekty lub usuwa pozytywne efekty z wrogów. Wrogowie mogą nawet na chwilę zapomnieć, że atakują lub uciekają przed tobą. Sama strzałka nadal jest szkodliwa dla wrogów, ale nie wyrządzi krzywdy sojusznikom.
items.weapon.missiles.darts.cleansingdart.name=strzałka oczyszczająca
items.weapon.missiles.darts.dart.ac_tip=WSKAZÓWKA
items.weapon.missiles.darts.dart.desc=Te proste drzewce z drewna zakończonego kolcami są obciążone tak, aby leciały prosto i żądliły ofiarę jednym ruchem nadgarstka. Można je nadziać nasionami, aby uzyskać dodatkowe efekty po rzucie.
items.weapon.missiles.darts.dart.name=strzałka
items.weapon.missiles.darts.dart.prompt=Wybierz nasiono
items.weapon.missiles.darts.dart.tip_all=końcówki lotek %1$d z nasionami %2$d
items.weapon.missiles.darts.dart.tip_cancel=anulować
items.weapon.missiles.darts.dart.tip_desc=Nasiono można połączyć z jedną lub dwiema lotkami, aby je zaostrzyć. Każdy rodzaj nasion wytwarza własny rodzaj lotki z zaostrzoną końcówką, o unikalnym efekcie jednorazowego użycia.\n\nZaostrzenie lotki tymi nasionami spowoduje powstanie _%s._
items.weapon.missiles.darts.dart.tip_one=końcówka 1 lotki z 1 nasionkiem
items.weapon.missiles.darts.dart.tip_title=Tip Darts
items.weapon.missiles.darts.dart.tip_two=końcówka 2 lotek z 1 nasionkiem
items.weapon.missiles.darts.dart.unlimited_uses=Dzięki prostej konstrukcji lotki będą skutecznie służyć wiecznie.
items.weapon.missiles.darts.displacingdart.desc=Te rzutki są wyposażone w groty wykonane z substancji na bazie liści zanikających, która teleportuje cel na niewielką odległość.
items.weapon.missiles.darts.displacingdart.name=przemieszczająca się lotka
items.weapon.missiles.darts.healingdart.desc=Te strzałki są pokryte mieszanką na bazie trawy słonecznej, która zapewnia celowi natychmiastowe leczenie. Sama strzałka nadal zadaje obrażenia wrogom, ale nie zaszkodzi sojusznikom.
items.weapon.missiles.darts.healingdart.name=strzałka lecznicza
items.weapon.missiles.darts.holydart.desc=Te strzałki są nasączone mieszanką na bazie kwiatu gwiaździstego, która nasyca cel świętą energią. Sojusznicy i zwykli wrogowie zostaną pobłogosławieni, ale nieumarli i demoniczni wrogowie odniosą poważne obrażenia. Sama strzałka nadal zadaje obrażenia wrogom, ale nie wyrządzi krzywdy sojusznikom.
items.weapon.missiles.darts.holydart.name=święta strzałka
items.weapon.missiles.darts.incendiarydart.desc=Te rzutki mają groty pokryte substancją na bazie ognistego kwiatu, która po uderzeniu eksploduje jasnym płomieniem.
items.weapon.missiles.darts.incendiarydart.name=strzałka zapalająca
items.weapon.missiles.darts.paralyticdart.desc=Tego typu rzutki mają groty nasączone substancją na bazie korzenia ziemi, która na krótki czas paraliżuje cel.
items.weapon.missiles.darts.paralyticdart.name=rzutka paraliżująca
items.weapon.missiles.darts.poisondart.desc=Groty tych rzutek są nasączone substancją na bazie mchu smutku, która zatruwa cel.
items.weapon.missiles.darts.poisondart.name=zatruta strzałka
items.weapon.missiles.darts.rotdart.desc=Te zabójcze strzałki są pokryte kwaśnym związkiem na bazie gnilnych owoców, który agresywnie trawi wszystko, z czym strzałka się zetknie. Potężni przeciwnicy będą w stanie oprzeć się większości tego efektu, ale korozja jest na tyle silna, że z łatwością zabije większość zwykłych wrogów. Te strzałki wytrzymują dłużej niż inne strzałki z grotami, ale ich wytrzymałości nie da się zwiększyć.
items.weapon.missiles.darts.rotdart.discover_hint=Możesz stworzyć ten przedmiot, wykorzystując nasiono uzyskane w ramach konkretnego zadania.
items.weapon.missiles.darts.rotdart.name=zgnilizna strzałka
items.weapon.missiles.darts.shockingdart.desc=Te lotki mają groty wykonane ze związku na bazie burzliwego pnącza, który zadaje celowi potężny cios.
items.weapon.missiles.darts.shockingdart.name=szokująca lotka
items.weapon.missiles.darts.tippeddart.about_to_break=Grot twojej lotki wkrótce się wyczerpie.
items.weapon.missiles.darts.tippeddart.ac_clean=CZYSTY
items.weapon.missiles.darts.tippeddart.cancel=anulować
items.weapon.missiles.darts.tippeddart.clean_all=wyczyść wszystko
items.weapon.missiles.darts.tippeddart.clean_desc=Ta czynność usunie nasiona z twoich lotek i przywróci im normalny wygląd.
items.weapon.missiles.darts.tippeddart.clean_one=czysty jeden
items.weapon.missiles.darts.tippeddart.clean_title=Czyste lotki
items.weapon.missiles.darts.tippeddart.discover_hint=Możesz kupić ten przedmiot w sklepie lub stworzyć go przy użyciu nasiona.
items.weapon.missiles.darts.tippeddart.has_broken=Ważność grotu Twojej lotki uległa przeterminowaniu.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Ale są one tak wysokiej jakości, że będą służyć wiecznie._
items.weapon.missiles.darts.tippeddart.uses_left=W tym stosie lotek pozostało _%d/%d_ użyć, zanim jedna końcówka się zużyje.
items.weapon.missiles.fishingspear.desc=Malutkie włócznie do rzucania, które mimo że są przeznaczone do łowienia ryb, świetnie sprawdzają się jako improwizowana broń.
items.weapon.missiles.fishingspear.name=włócznia wędkarska
items.weapon.missiles.forcecube.desc=Te dziwnie ukształtowane magiczne kostki są na tyle małe, że można je trzymać w dłoni, ale są niewiarygodnie ciężkie.
items.weapon.missiles.forcecube.name=kostka siły
items.weapon.missiles.forcecube.ondeath=Zabiłeś się własną Kostką Mocy...
items.weapon.missiles.forcecube.stats_desc=Broń ta rozkłada siłę uderzenia na małym obszarze, rażąc wszystko, co znajduje się w pobliżu.
items.weapon.missiles.heavyboomerang.desc=Ten duży bumerang jest trudny do efektywnego użycia, ale zadaje znaczne obrażenia.
items.weapon.missiles.heavyboomerang.name=ciężki bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Broń ta powraca do miejsca, z którego została rzucona, po pięciu turach.
items.weapon.missiles.javelin.desc=Większe włócznie do rzucania są obciążone tak, aby ostrze na ich końcu znajdowało się z przodu, gdy lecą w powietrzu.
items.weapon.missiles.javelin.name=oszczep
items.weapon.missiles.kunai.desc=Te małe noże są bardzo wytrzymałe w rękach wprawnego użytkownika.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Ta broń jest skuteczniejsza przeciwko nieświadomym wrogom.
items.weapon.missiles.missileweapon$placeholder.name=broń rzucana
items.weapon.missiles.missileweapon.about_to_break=Twoja rzucona broń zaraz się złamie.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Jeśli ostatnia broń miotana z twojego ulepszonego zestawu broni miotanej ulegnie zniszczeniu, zestaw zostanie trwale utracony. Czy na pewno chcesz nią rzucić?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=NIE
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Tak
items.weapon.missiles.missileweapon.curse_discover=Ta rzucana broń jest przeklęta!
items.weapon.missiles.missileweapon.distance=Broń miotana jest celniejsza na dystans, ale mniej celna w zwarciu.
items.weapon.missiles.missileweapon.durability=Broń rzucana zużywa się i łamie w miarę użytkowania.
items.weapon.missiles.missileweapon.dust=Rzucona broń rozpada się na pył, gdy jej dotkniesz.
items.weapon.missiles.missileweapon.has_broken=Jedna z twoich rzucanych broni się złamała.
items.weapon.missiles.missileweapon.probably_too_heavy=Być może ta broń jest dla ciebie za ciężka.
items.weapon.missiles.missileweapon.stats_known=Ten zestaw broni miotanej _tier-%1$d_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, aby go użyć.
items.weapon.missiles.missileweapon.stats_unknown=Zazwyczaj ten zestaw broni miotanej _tier-%1$d_ zadaje _%2$d-%3$d obrażeń_ i wymaga _%4$d siły_, aby go użyć.
items.weapon.missiles.missileweapon.unknown_uses=Zazwyczaj ten zestaw broni rzucanej będzie miał _%d_ zastosowań zanim się zepsuje.
items.weapon.missiles.missileweapon.unlimited_uses=Ten zestaw jest tak wysokiej jakości, że będzie służył wiecznie.
items.weapon.missiles.missileweapon.uses_left=Ten zestaw broni miotanej ma jeszcze _%d/%d_ użyć, zanim któraś się zepsuje.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Niedawno rzuciłeś shurikenem w trybie natychmiastowym i musisz odczekać, zanim zrobisz to ponownie. Shurikenami nadal można rzucać, ale z normalną prędkością broni.\n\nPozostałe tury: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Czas odnowienia shurikenów
items.weapon.missiles.shuriken.desc=Metalowe gwiazdki o ostrych jak brzytwa krawędziach zadają znaczne obrażenia po trafieniu. Można rzucać nimi bardzo szybko.
items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikeny można rzucać natychmiastowo, z czasem odnowienia wynoszącym 20 tur.
items.weapon.missiles.throwingclub.desc=Dość prosta, ale wytrzymała broń rzucana, w zasadzie duży kamień przymocowany do kija.
items.weapon.missiles.throwingclub.name=klub do rzucania
items.weapon.missiles.throwingclub.stats_desc=Ta broń nie przykleja się do wrogów i można ją natychmiast zebrać.
items.weapon.missiles.throwinghammer.desc=Te potężne młoty zostały zaprojektowane do rzucania we wroga. Ich gładka, całkowicie metalowa konstrukcja sprawia, że są bardzo wytrzymałe.
items.weapon.missiles.throwinghammer.name=młot do rzucania
items.weapon.missiles.throwinghammer.stats_desc=Ta broń nie przykleja się do wrogów i można ją natychmiast zebrać.
items.weapon.missiles.throwingknife.desc=Te lekkie noże są wyważone tak, aby mogły przecinać powietrze i lądować prosto w celu.
items.weapon.missiles.throwingknife.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.missiles.throwingknife.name=nóż do rzucania
items.weapon.missiles.throwingknife.stats_desc=Ta broń jest skuteczniejsza przeciwko nieświadomym wrogom.
items.weapon.missiles.throwingspear.desc=Te lekkie włócznie mają cienkie ramy, które służą do rzucania, a nie do pchania.
items.weapon.missiles.throwingspear.name=rzucanie włócznią
items.weapon.missiles.throwingspike.desc=Te wytrzymałe, spiczaste, metalowe strzały służą do rzucania w oddalonych wrogów.
items.weapon.missiles.throwingspike.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.missiles.throwingspike.name=kolce do rzucania
items.weapon.missiles.throwingstone.desc=Kamienie te są szlifowane, aby można je było rzucać z większą mocą niż zwykłymi kamieniami.
items.weapon.missiles.throwingstone.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.missiles.throwingstone.name=rzucanie kamieniem
items.weapon.missiles.tomahawk.desc=Tego typu topory do rzucania mają ząbkowane ostrze, które rozrywa się, gdy przyklei się do wroga.
items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Broń ta zadaje celowi _%1$d-%2$d krwawienie_.
items.weapon.missiles.tomahawk.typical_stats_desc=Ta broń zazwyczaj zadaje celowi _%1$d-%2$d krwawienie_.
items.weapon.missiles.trident.desc=Ogromne włócznie do rzucania z trzema śmiercionośnymi zębami na końcu. Są potężne, ale dość ciężkie.
items.weapon.missiles.trident.name=trójząb
items.weapon.spiritbow.ac_shoot=STRZELAĆ
items.weapon.spiritbow.desc=Łuk wykonany ze starożytnego, magicznego drewna. Cięciwa i grawerunki na łuku świecą bladoniebieskim światłem. Po naciągnięciu cięciwy łuk ten wyczarowuje magiczną strzałę, którą można wystrzelić w kierunku wroga.
items.weapon.spiritbow.discover_hint=Jeden z bohaterów zaczyna z tym przedmiotem.
items.weapon.spiritbow.name=łuk duchowy
items.weapon.spiritbow.prompt=Wybierz cel
items.weapon.spiritbow.stats=Łuku nie można bezpośrednio ulepszyć, ale będzie on stopniowo zyskiwał na sile wraz z awansem. Na obecnym poziomie strzały wystrzelone z łuku będą zadawać _%1$d-%2$d obrażeń_ i będą wymagać _%3$d siły_, aby prawidłowo ich używać.
items.weapon.weapon$enchantment.discover_hint=Możesz znaleźć przedmiot z tym efektem losowo w lochu lub spróbować samemu zastosować go na przedmiocie.
items.weapon.weapon$enchantment.enchant=zachwyt
items.weapon.weapon$enchantment.rankings_desc=Zabity przez zaklęcie
items.weapon.weapon.cursed=Można wyczuć w tej broni złowrogą magię.
items.weapon.weapon.cursed_worn=Ponieważ ta broń jest przeklęta, nie masz możliwości jej usunięcia.
items.weapon.weapon.enchant_hardened=Został _zahartowany_.
items.weapon.weapon.enchanted=ma _%s._
items.weapon.weapon.excess_str=Ze względu na twoją nadmierną siłę, zadasz tej broni _0-%d dodatkowych obrażeń_.
items.weapon.weapon.faster=Został rozszerzony w celu zwiększenia _prędkości._
items.weapon.weapon.hardened_no_enchant=Ta broń została _zahartowana_, ale obecnie nie jest zaczarowana.
items.weapon.weapon.hardening_gone=Utwardzenie tej broni już zanikło!
items.weapon.weapon.identify=Teraz znasz już swoją broń na tyle dobrze, że możesz ją rozpoznać.
items.weapon.weapon.incompatible=Interakcja różnych rodzajów magii zneutralizowała zaklęcie rzucone na tę broń!
items.weapon.weapon.not_cursed=Ta broń jest wolna od złowrogiej magii.
items.weapon.weapon.stronger=Został ulepszony, aby zwiększyć _obrażenia_.
items.weapon.weapon.too_heavy=Ze względu na twoją niewystarczającą siłę broń ta ograniczy szybkość twojego ataku, celność i zdolność do zaskakującego ataku.
items.weapon.weapon.weak_cursed=Pomimo klątwy możesz zdjąć tę broń.

items.keys.skeletonkey.desc=Ten klucz wygląda poważnie: jego głowa ma kształt czaszki. Prawdopodobnie może otworzyć jakieś poważne drzwi.
items.weapon.missiles.bombarrow.desc=Strzała z przyczepioną bombą. Zachowaj dystans.
items.weapon.missiles.bombarrow.name=strzała bombowa
items.weapon.missiles.missileweapon.damage_desc=Ta broń zadaje obrażenia od _%1$d_ do _%2$d_ na trafienie.
items.bags.seedpouch.desc=Ta mała aksamitna sakiewka pomieści dowolną liczbę nasion. Bardzo wygodna.
items.bags.seedpouch.name=woreczek z nasionami
items.potions.potionofmight.desc=Ten potężny płyn przepłynie przez twoje mięśnie, na stałe zwiększając siłę o jeden punkt, a zdrowie o pięć.
items.potions.potionofmight.name=Mikstura Mocy
items.rings.ringofdetection.desc=Ten pierścień pozwala dostrzegać ukryte pułapki i sekretne drzwi bez poświęcania czasu na szukanie. Osłabione pierścienie wykrywania przytępiają zmysły i utrudniają odkrywanie sekretów nawet podczas aktywnych poszukiwań.
items.rings.ringofdetection.name=Pierścień detekcji
items.rings.ringofhaggler.desc=Ten pierścień nie ma żadnej magicznej mocy. Pokazuje jednak kupcom, że jego właściciel należy do Gildii Złodziei. Zwykle chętnie dają zniżkę w zamian za obietnicę chwilowego spokoju. Ulepszenie pierścienia nie daje dodatkowych korzyści.
items.rings.ringofhaggler.name=pierścień targowania
items.rings.ringofherbalism.desc=Ten pierścień zwiększa szansę znalezienia rosy i nasion podczas deptania trawy.
items.rings.ringofherbalism.name=pierścień zielarstwa
items.rings.ringofmending.desc=Ten pierścień wzmacnia zdolność organizmu do regeneracji i przyspiesza odzyskiwanie zdrowia. Osłabione pierścienie spowalniają, a nawet zatrzymują naturalne leczenie.
items.rings.ringofmending.name=pierścień regeneracji
items.rings.ringofpower.desc=Pole energii emitowane przez ten pierścień wzmacnia twoje różdżki. Osłabione pierścienie mocy działają odwrotnie.
items.rings.ringofpower.name=Pierścień Mocy
items.rings.ringofsatiety.desc=Ten pierścień pozwala dłużej wytrzymać bez jedzenia. Osłabione pierścienie sytości mają przeciwny efekt.
items.rings.ringofsatiety.name=Pierścień sytości
items.rings.ringofshadows.desc=Wrogowie będą mniej skłonni cię zauważyć, jeśli założysz ten pierścień. Zdegradowane kręgi cieni zaalarmują wrogów, którzy w przeciwnym razie mogliby nie zauważyć twojej obecności.
items.rings.ringofshadows.name=Pierścień Cieni
items.rings.ringofthorns.desc=Pierścień nie ma prawdziwych cierni, lecz wróg, który cię zaatakuje, sam otrzyma część zadanych obrażeń. Ulepszenie pierścienia nie daje dodatkowych korzyści.
items.rings.ringofthorns.name=Pierścień cierni
items.scrolls.scrollofchallenge.desc=Kiedy przeczytasz ten zwój na głos, wyda on przerażający ryk, który obudzi wszystkie potwory i powiadomi je o miejscu pobytu czytającego.
items.scrolls.scrollofchallenge.name=zwój wyzwania
items.scrolls.scrollofenchantment.desc=Zwój ten potrafi nałożyć na broń lub zbroję losowy czar, nadając jej szczególną moc.
items.scrolls.scrollofenchantment.name=zwój zaklęcia
items.scrolls.scrollofpsionicblast.desc=Ten zwój zawiera niszczycielską energię, którą można psionicznie skierować, aby zadać ogromne obrażenia wszystkim istotom w polu widzenia. Towarzyszący mu błysk światła tymczasowo oślepia wszystkich w obszarze działania, w tym osobę czytającą zwój.
items.scrolls.scrollofpsionicblast.name=zwój wybuchu psionicznego
items.scrolls.scrollofwipeout.desc=Przeczytaj ten zwój, aby uwolnić gniew duchów lochów, zabijając wszystko na tym poziomie. No, prawie wszystko. Niektóre z potężniejszych stworzeń mogą pozostać nietknięte.
items.scrolls.scrollofwipeout.name=zwój zagłady
items.wands.wandofblink.desc=Ta różdżka pozwala teleportować się w wybranym kierunku. Stworzenia i stałe przeszkody zatrzymują teleportację.
items.wands.wandofblink.name=różdżka teleportacji
items.wands.wandoffirebolt.desc=Ta różdżka wystrzeliwuje pociski magicznego ognia. Podpala łatwopalny teren, a trafioną istotę rani i stawia w płomieniach.
items.wands.wandoffirebolt.name=różdżka ognistego pocisku
