items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbarzyński
items.weapon.weaponeffects.weaponeffect.smite.name=%s barbarzyńcy
items.weapon.weaponeffects.weaponeffect.smite.desc=Ta broń jest _barbarzyńska_. Trafienie ma _20%_ szans na wywołanie _Porażenia 1. poziomu_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Porażenie!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Odpychający
items.weapon.weaponeffects.weaponeffect.knockback.name=%s odpychania
items.weapon.weaponeffects.weaponeffect.knockback.desc=Ta broń jest _odpychająca_. Trafienie ma _20%_ szans na odepchnięcie wroga o _jedno pole_. Bossów nie można odepchnąć.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Odrzucenie!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Wężowy
items.weapon.weaponeffects.weaponeffect.venom.name=%s węża
items.weapon.weaponeffects.weaponeffect.venom.desc=Ta broń jest _wężowa_. Trafienie ma _20%_ szans na zatrucie celu.
items.weapon.weaponeffects.weaponeffect.venom.activate=Jad!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Okaleczający
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s okaleczenia
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Ta broń jest _okaleczająca_. Trafienia z dystansu mają _20%_ szans na okaleczenie wroga na _10 tur_. Bossowie są odporni.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Okaleczenie!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Runiczny
items.weapon.weaponeffects.weaponeffect.spark.name=%s run
items.weapon.weaponeffects.weaponeffect.spark.desc=Ta różdżka jest _runiczna_. Jej magia ma _20%_ szans na wywołanie _Iskry_, która zadaje _4–8_ dodatkowych obrażeń magicznych.
items.weapon.weaponeffects.weaponeffect.spark.activate=Iskra!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Złowieszczy
items.weapon.weaponeffects.weaponeffect.curse.name=%s uroku
items.weapon.weaponeffects.weaponeffect.curse.desc=Ta różdżka jest _złowieszcza_. Jej magia ma _20%_ szans na osłabienie celu, zmniejszając zadawane przez niego obrażenia o _5%_ na _10 tur_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Klątwa!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Wysysający
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s wyssania
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Ta różdżka _wysysa życie_. Jej magia ma _20%_ szans na zadanie _8–16_ dodatkowych obrażeń magicznych i przywrócenie ci tylu punktów zdrowia, ile odebrała celowi.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Wyssanie!

items.armor.armorprefix.stalwart.name=%s niezłomności
items.armor.armorprefix.stalwart.desc=Ten pancerz daje _niezłomność_. Ataki wrogów mają _20%_ szans na wywołanie _Twardości 5. poziomu_, co zmniejsza ich obrażenia o _20%_.
items.armor.armorprefix.stalwart.activate=Twardość!

items.armor.armorprefix.vigilant.name=%s czujności
items.armor.armorprefix.vigilant.desc=Ten pancerz daje _czujność_. Masz _20%_ szans na uniknięcie ataku dystansowego wroga.
items.armor.armorprefix.vigilant.activate=Czujność!

items.armor.armorprefix.elusive.name=%s nieuchwytności
items.armor.armorprefix.elusive.desc=Ten pancerz daje _nieuchwytność_. Gdy atak wroga zada ci obrażenia, masz _20%_ szans na zwiększenie uniku o _5_ na _5 tur_.
items.armor.armorprefix.elusive.activate=Unik!
