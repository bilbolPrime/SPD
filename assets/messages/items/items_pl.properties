items.food.food.ac_eat=JEŚĆ
items.food.food.desc=Nic specjalnego: suszone mięso, jakieś ciasteczka i tym podobne rzeczy.
items.food.food.eat_msg=To jedzenie smakowało pysznie!
items.food.food.name=racja żywnościowa
items.food.frozencarpaccio.better=Czujesz się lepiej!
items.food.frozencarpaccio.desc=To kawałek zamrożonego, surowego mięsa. Można je jeść tylko krojąc je na cienkie plasterki. I w ten sposób jest zaskakująco smaczne.
items.food.frozencarpaccio.discover_hint=Można to samo zrobić używając innego produktu spożywczego.
items.food.frozencarpaccio.hard=Czujesz jak Twoja skóra twardnieje!
items.food.frozencarpaccio.invis=Widzisz, jak twoje ręce stają się niewidzialne!
items.food.frozencarpaccio.name=mrożone carpaccio
items.food.frozencarpaccio.refresh=Orzeźwiający!
items.food.meatpie.desc=Pyszny placek z pikantnym mięsem. Zaspokoi głód bardziej niż jakikolwiek inny posiłek.
items.food.meatpie.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.food.meatpie.eat_msg=To jedzenie było niesamowite!
items.food.meatpie.name=pasztet mięsny
items.food.mysterymeat$placeholder.name=mięso
items.food.mysterymeat.desc=Jesz na własne ryzyko!
items.food.mysterymeat.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.food.mysterymeat.eat_msg=To jedzenie smakowało... dziwnie.
items.food.mysterymeat.hot=Och, jak gorąco!
items.food.mysterymeat.legs=Nie czujesz nóg!
items.food.mysterymeat.name=tajemnicze mięso
items.food.mysterymeat.not_well=Źle się czujesz.
items.food.mysterymeat.stuffed=Jesteś wypchany.
items.food.pasty$fishleftover.desc=Trochę nadwyżki ryby z poprzedniego posiłku. Możesz ją zjeść w dowolnym momencie, aby zaspokoić głód.
items.food.pasty$fishleftover.eat_msg=To jedzenie smakowało w porządku.
items.food.pasty$fishleftover.name=resztki ryb
items.food.pasty.amulet_desc=W końcu go znalazłeś, magiczny amulet... chwila, to tylko czekoladka w folii, wyglądająca jak amulet! Nie da ci nieograniczonej mocy, ale przynajmniej cię nasyci i da ci trochę ładunku artefaktu.\n\nPrima aprilis!
items.food.pasty.amulet_name=amulet yendoru?
items.food.pasty.cane_desc=Ogromna, słodka laska cukrowa. Jest na tyle duża, że można się nią najeść, a cukier może też dodać jej odrobinę energii.\n\nWesołych Świąt!
items.food.pasty.cane_name=laska cukrowa
items.food.pasty.desc=Autentyczny kornwalijski pasztecik z tradycyjnym nadzieniem z wołowiny i ziemniaków. Pyszny!
items.food.pasty.egg_desc=Wielkie, czekoladowe jajko, zawinięte w kolorową, żółtą folię. Czekolady jest tu na tyle dużo, że z pewnością się nasycisz, a cukier może nadać Twoim artefaktom odrobinę smaku.\n\nWesołych Świąt Wielkanocnych!
items.food.pasty.egg_name=pisanka
items.food.pasty.fish_desc=Cała ryba gotowana na parze, magicznie zakonserwowana na łożu z zielonych warzyw. Tradycyjnie o tej porze roku odkłada się trochę ryby na później, dzięki czemu zachowasz resztki, zamiast zjeść ją całą na raz.\n\nSzczęśliwego Nowego Roku Księżycowego!
items.food.pasty.fish_name=ryba gotowana na parze
items.food.pasty.name=pasztecik
items.food.pasty.pie_desc=Ogromny kawałek ciasta dyniowego. Jego słodko-pikantny smak nasyci Cię i doda odrobinę ukojenia.\n\nWesołego Halloween!
items.food.pasty.pie_name=ciasto dyniowe
items.food.pasty.rainbow_desc=Ta kolorowa mikstura to rodzaj płynnego jedzenia. Oprócz zaspokojenia głodu, zawiera odrobinę magii, która uspokoi pobliskiego przeciwnika (niebossa), sprawiając, że na chwilę zniechęci się do walki z tobą. \n\nSzczęśliwej Dumy!
items.food.pasty.rainbow_name=tęczowy eliksir
items.food.pasty.sparkling_desc=Ten musujący eliksir to rodzaj płynnego pożywienia. Zaspokaja głód i imituje wino musujące, ale tak naprawdę nie zawiera alkoholu. Ciepło w brzuchu zapewni Ci odrobinę ochrony.\n\nSzczęśliwego Nowego Roku!
items.food.pasty.sparkling_name=musujący eliksir
items.food.pasty.vanilla_desc=Ten duży kawałek ciasta waniliowego ma kolorową posypkę i niebieski lukier. Ciasto powstało, aby uczcić lata doświadczeń i zapewni Ci odrobinę tych doświadczeń, gdy je zjesz.\n\nOryginalna gra Pixel Dungeon ukazała się po raz pierwszy 4 grudnia 2012 roku. Wszystkiego najlepszego, Pixel Dungeon!
items.food.pasty.vanilla_name=niebieskie ciasto
items.food.phantommeat.desc=Duży, lśniący, półprzezroczysty stek, wycięty z widmowej piranii. To magiczne mięso nie wymaga gotowania i oprócz pełnego nasycenia zapewnia szereg korzyści obronnych. Po spożyciu zapewnia niewidzialność, skórę z kory, pewne uzdrowienia i leczy wiele szkodliwych efektów.
items.food.phantommeat.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.food.phantommeat.name=mięso fantomowe
items.food.smallration.desc=Wygląda dokładnie jak standardowa racja żywnościowa, tylko mniejsza.
items.food.smallration.discover_hint=Możesz kupić ten przedmiot w sklepie.
items.food.smallration.eat_msg=To jedzenie smakowało w porządku.
items.food.smallration.name=mała racja żywnościowa
items.food.stewedmeat.desc=Duszenie mięsa oczyściło je z wszelkich chorób i pasożytów. Powinno być bezpieczne do spożycia.
items.food.stewedmeat.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.food.stewedmeat.eat_msg=To jedzenie smakowało w porządku.
items.food.stewedmeat.name=mięso duszone
items.food.supplyration.desc=Ta racja żywnościowa została pozostawiona w lochu przez i dla członków gildii złodziei. Została zaprojektowana specjalnie do spożycia w biegu i pomaga w ogólnych sztuczkach.\n\nChociaż nie syci tak bardzo jak zwykła racja, można ją szybko zjeść, zapewnia trochę bezpośredniego leczenia i przywraca ładunek płaszczowi cieni Łotrzyka.
items.food.supplyration.discover_hint=Przedmiot ten możesz znaleźć za pomocą konkretnego talentu bohatera.
items.food.supplyration.name=racja zaopatrzenia
items.gold.desc=Stos złotych monet. Zbieraj złote monety, aby wydać je później w sklepie.
items.gold.name=złoto
items.heap.artifact=artefakt
items.heap.chest=Klatka piersiowa
items.heap.chest_desc=Nie dowiesz się, co jest w środku, dopóki nie otworzysz!
items.heap.crystal_chest=Skrzynia kryształowa
items.heap.crystal_chest_desc=W środku możesz zobaczyć _%s_, ale żeby otworzyć skrzynię, potrzebujesz kryształowego klucza.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Zamknięta skrzynia
items.heap.locked_chest_desc=Nie dowiesz się, co jest w środku, dopóki go nie otworzysz! Ale żeby go otworzyć, potrzebujesz złotego klucza.
items.heap.remains=Szczątki bohatera
items.heap.remains_desc=To wszystko, co zostało po jednym z twoich poprzedników. Może warto sprawdzić, czy nie ma tam jakichś wartościowych rzeczy.
items.heap.ring=pierścień
items.heap.skeleton=Szczątki kostne
items.heap.skeleton_desc=To wszystko, co zostało po jakimś nieszczęsnym poszukiwaczu przygód. Może warto sprawdzić, czy nie ma tam jakichś wartościowych rzeczy.
items.heap.tomb=Grób
items.heap.tomb_desc=W tym starożytnym grobowcu może znajdować się coś przydatnego, ale jego właściciel z pewnością nie zgodzi się na sprawdzenie tego.
items.heap.wand=różdżka
items.honeypot$shatteredpot.desc=Garnek został rozbity, trzyma go w całości jedynie lepki miód pokrywający jego ścianki, a teraz powoli się rozpada.\n\nPomimo rozbitego stanu, pszczoła nadal wydaje się chcieć chronić garnek.
items.honeypot$shatteredpot.name=rozbity garnek miodu
items.honeypot.ac_shatter=ROZTRZASKAĆ
items.honeypot.desc=Ten duży garnek z miodem jest tak naprawdę wyścielony tylko miodem, a zamiast tego mieszka w nim gigantyczna pszczoła! Tego typu ogromne pszczoły zazwyczaj przebywają w swoich ulach, być może garnek to jakaś specjalistyczna klatka dla traperów? Pszczoła wydaje się być całkiem zadowolona z miodowego wnętrza garnka i nieufnie bzyczy, gdy na nią patrzysz.
items.honeypot.name=garnek miodu
items.item.ac_drop=UPUSZCZAĆ
items.item.ac_throw=RZUCIĆ
items.item.curse=przekleństwo
items.item.custom_note=Do tego przedmiotu przypisano notatkę: „_%s_”
items.item.custom_note_type=Ten typ przedmiotu ma niestandardową notatkę: „_%s_”
items.item.discover_hint=Ten przedmiot możesz znaleźć losowo w lochach.
items.item.prompt=Wybierz kierunek rzutu
items.item.rankings_desc=Zabity przez: %s
items.journal.alchemypage.desc=Podarta strona z przewodnika po alchemii.\n\nWiększość tekstu jest zbyt mała, aby odczytać ją z odległości, ale można odczytać tytuł strony:\n\n_"%s"_
items.journal.alchemypage.name=podarta strona książki alchemicznej
items.journal.documentpage.desc=Pojedyncza strona, prawdopodobnie wyrwana z jakiejś książki. Będziesz musiał ją podnieść, żeby przeczytać.
items.journal.documentpage.name=podarta strona
items.journal.guidebook.desc=Przewodnik dla poszukiwaczy przygód, pozostawiony przez kogoś, kto uznał, że przygody nie są dla niego! Ta konkretna książka jest magiczna i może skłonić poszukiwaczy przygód do przeczytania strony w odpowiednim momencie.\n\nPomimo tej funkcjonalności, książka cieszy się największą popularnością dzięki napisowi „Nie panikuj!”, napisanemu dużymi, przyjaznymi literami na okładce.
items.journal.guidebook.hint_desktop=Twój przewodnik ma dla Ciebie porady! Kliknij migający przycisk dziennika (%s) w prawym górnym rogu, aby go przeczytać.
items.journal.guidebook.hint_mobile=Twój przewodnik ma dla Ciebie porady! Kliknij migający przycisk dziennika w prawym górnym rogu, aby go przeczytać.
items.journal.guidebook.hint_status=Przewodnik
items.journal.guidebook.name=tom mistrzostwa lochów
items.journal.guidepage.desc=Podarta strona z przewodnika podróżniczego.\n\nWiększość tekstu jest zbyt mała, aby przeczytać ją z daleka, ale tytuł strony można odczytać:\n\n_"%s"_
items.journal.guidepage.name=podarta strona przewodnika
items.journal.regionlorepage$caves.desc=Coś, co wygląda na wpis w dzienniku pokładowym odkrywcy, zachowało się zaskakująco dobrze, mimo że musi mieć tyle lat. Podnieś to i przeczytaj.
items.journal.regionlorepage$caves.name=stary wpis w dzienniku
items.journal.regionlorepage$city.desc=Mała, zardzewiała metalowa tabliczka z magicznie wyrytą wiadomością. Litery są nadal wyraźne, pomimo wieku tabliczki, ale trzeba ją podnieść, żeby ją przeczytać.
items.journal.regionlorepage$city.name=zardzewiała tabliczka
items.journal.regionlorepage$halls.desc=Mała, czarna tabliczka z wytrawionymi świecącymi, zielonymi literami. Świecące litery zlewają się z daleka w mgłę. Aby odczytać, trzeba ją podnieść.
items.journal.regionlorepage$halls.name=świecąca tabletka
items.journal.regionlorepage$prison.desc=Wpis w dzienniku lub jakiś inny zapis, spisany na starym kawałku papieru. Wygląda na to, że przetrwał lepiej niż listy znalezione w kanałach, ale i tak będziesz musiał go podnieść, żeby go przeczytać.
items.journal.regionlorepage$prison.name=zużyty wpis w dzienniku
items.journal.regionlorepage$sewers.desc=Coś, co wygląda na list, napisane na zakurzonej kartce papieru. Będziesz musiał ją podnieść, żeby odczytać, co jest na niej napisane.
items.journal.regionlorepage$sewers.name=zużyty list
items.keys.crystalkey.desc=Szlifowane powierzchnie tego kryształowego klucza migoczą w ciemności. Może otworzy coś z kryształu?
items.keys.crystalkey.name=Klucz kryształowy
items.keys.goldenkey.desc=Nacięcia na tym złotym kluczu są maleńkie i misterne. Może otworzy zamkniętą skrzynię?
items.keys.goldenkey.name=złoty klucz
items.keys.ironkey.desc=Nacięcia na tym starożytnym żelaznym kluczu są mocno wytarte; skórzany pasek na nim jest zniszczony przez wiek. Jakie drzwi mógłby otworzyć?
items.keys.ironkey.name=żelazny klucz
items.keys.skeletonkey.name=wytrych
items.keys.wornkey.desc=Ten klucz jest zużyty i odbarwiony, ale wygląda poważnie. Prawdopodobnie można nim otworzyć jakieś poważne drzwi w pobliżu.
items.keys.wornkey.name=zużyty klucz
items.kindofmisc.unequip_message=Najpierw musisz zdjąć jeden z tych przedmiotów. Wybierz przedmiot, na który chcesz dokonać zamiany.
items.kindofmisc.unequip_title=Zdejmij jeden przedmiot
items.kindofweapon.empty=pusty
items.kindofweapon.equip_cursed=Twój chwyt mimowolnie zaciska się na broni.
items.kindofweapon.swift_equip=Szybko wyposażasz się w broń.
items.kindofweapon.which_equip_msg=Do którego slotu na broń chcesz przypisać ten przedmiot?\n\nMistrz atakuje bezpośrednio swoją bronią główną, ale może korzystać ze zdolności każdej z nich. Obie bronie mają taką samą liczbę ładunków.\n\nMistrz może również natychmiast zamienić broń główną i dodatkową.
items.kindofweapon.which_equip_primary=Podstawowy (%s)
items.kindofweapon.which_equip_secondary=Drugorzędny (%s)
items.kingscrown.ac_wear=NOSIĆ
items.kingscrown.desc=Korona ostatniego króla krasnoludów, która emanuje ogromną magiczną energią.\n\nGdy korona zostanie założona, magia wpłynie do zbroi, którą obecnie nosisz, przemieniając ją w _unikalną epicką zbroję ze specjalnymi zdolnościami_. Nowa zbroja zachowa wszystkie właściwości oryginalnej zbroi.
items.kingscrown.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.kingscrown.naked=Niestety, korona nie jest w stanie zmienić Twojej bielizny.
items.kingscrown.name=Korona Króla Krasnoludów
items.kingscrown.ratgraded=Łapy Króla Szczurów świecą jasno, gdy twoja zbroja się zmienia!
items.kingscrown.upgraded=Korona świeci jasno, a następnie rozpada się, gdy twoja zbroja się zmienia!
items.liquidmetal.ac_apply=STOSOWAĆ
items.liquidmetal.already_fixed=Ta rzucana broń jest już w idealnym stanie!
items.liquidmetal.apply=Do naprawy broni rzucanej używasz ciekłego metalu %d.
items.liquidmetal.desc=Ten magiczny płyn może wypełnić pęknięcia i rozdarcia w rzuconej broni, przywracając ją do idealnego stanu! Jeśli w zestawie broni brakuje broni, ale poza tym jest ona w pełni naprawiona, płynny metal może zostać użyty do zastąpienia brakującej broni z zestawu! \n\nA Broń poziomu 1 wymaga 10 płynnego metalu do pełnej naprawy, broń poziomu 5 wymaga 30. Każde ulepszenie zwiększa również ilość potrzebnego metalu o 35%. \n\nPłynnego metalu nie można użyć do naprawy grotów rzutek z grotami.
items.liquidmetal.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.liquidmetal.name=ciekły metal
items.liquidmetal.prompt=Wybierz broń rzucaną
items.lostbackpack.desc=To Twój utracony ekwipunek. Zbierz go, aby odzyskać wszystkie utracone przedmioty!
items.lostbackpack.name=zgubiony plecak
items.merchantsbeacon.ac_use=UŻYWAĆ
items.merchantsbeacon.desc=Ten dziwny przykład krasnoludzkiej technologii pozwala ci komunikować się z dużej odległości.\n\nPo aktywacji, ten nadajnik umożliwi ci sprzedawanie przedmiotów w Pixel Mart z dowolnego miejsca w lochu.\n\nJednak magia w nadajniku będzie działać tylko przez jedną sesję, więc używaj jej mądrze.
items.merchantsbeacon.name=latarnia kupiecka
items.potions.brews.aquabrew.desc=Po rozbiciu, ten napój wystrzeli w miejscu, gdzie się znajduje, strumień wody pod ciśnieniem. Jest on wystarczająco silny, by zranić jedynie ognistych wrogów, ale rozprowadza wodę po pobliskim terenie, unieszkodliwia pułapki, gasi pożary i odrzuca postacie w pobliżu strumienia.
items.potions.brews.aquabrew.name=napój wodny
items.potions.brews.blizzardbrew.desc=Po rozbiciu napój ten uwolni wirującą zamieć, która rozprzestrzenia się błyskawicznie niczym gaz.
items.potions.brews.blizzardbrew.name=napój zamieciowy
items.potions.brews.brew.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.potions.brews.causticbrew.desc=Ten napój rozprzestrzeni żrącą maź na dużym obszarze wokół miejsca, w którym się rozbije. Wszystko, co wpadnie w maź, będzie się powoli topić, jeśli nie da się tego zmyć wodą.
items.potions.brews.causticbrew.name=żrący napój
items.potions.brews.infernalbrew.desc=Po rozbiciu, napój ten uwolni szalejący ogień, który szybko rozprzestrzenia się jak gaz.
items.potions.brews.infernalbrew.name=piekielny napój
items.potions.brews.shockingbrew.desc=Po rozbiciu napój ten wywoła burzę elektryczną na dużym obszarze wokół miejsca, w którym nastąpi rozbicie.
items.potions.brews.shockingbrew.name=szokujący napój
items.potions.brews.unstablebrew.desc=Ten magiczny napój świeci mieniącymi się kolorami tęczy. Wypicie lub rzucenie nim uruchomi efekt losowej mikstury. Efekt mikstury zawsze będzie korzystny, jeśli zostanie wypita, i zawsze szkodliwy, jeśli zostanie rzucona.
items.potions.brews.unstablebrew.name=niestabilny napój
items.potions.elixirs.elixir.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Tymczasowo zyskałeś właściwości regenerujące podobne do Goo.\n\nStojąc w wodzie, odzyskujesz niewielką ilość zdrowia na turę. Efekt zostaje wstrzymany, gdy masz pełne zdrowie lub gdy jesteś poza wodą.\n\nPozostało leczenie: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=uzdrawianie wodne
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ten eliksir zawiera resztki Goo wzmocnione miksturą leczniczą. Chociaż nie zapewnia natychmiastowego leczenia, będzie stopniowo przywracać większą ilość zdrowia, gdy będziesz stał w wodzie.
items.potions.elixirs.elixirofaquaticrejuvenation.name=eliksir odmłodzenia wodnego
items.potions.elixirs.elixirofarcanearmor.desc=Ten eliksir zapewni osobie pijącej długotrwałą odporność na obrażenia magiczne.
items.potions.elixirs.elixirofarcanearmor.name=eliksir tajemnej zbroi
items.potions.elixirs.elixirofdragonsblood.desc=Po spożyciu eliksir ten wyśle ognistą moc do żył pijącego. Ten efekt sprawi, że pijący stanie się odporny na ogień i będzie mógł podpalać wrogów atakami fizycznymi.
items.potions.elixirs.elixirofdragonsblood.name=eliksir krwi smoka
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Jesteś pod wpływem eliksiru spadających piór, dzięki czemu możesz spadać w przepaście bez obrażeń!\n\nPozostało tur: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=opadanie piór
items.potions.elixirs.elixiroffeatherfall.desc=Ten eliksir zapewnia słabszy, ale bardziej kontrolowany efekt lewitacji, pozwalając osobie, która go wypije, na chwilowy spadek z dużej wysokości bez odniesienia obrażeń.
items.potions.elixirs.elixiroffeatherfall.light=Poczujesz się lekki jak piórko!
items.potions.elixirs.elixiroffeatherfall.name=eliksir opadania piór
items.potions.elixirs.elixirofhoneyedhealing.desc=Ten eliksir łączy w sobie właściwości lecznicze ze słodyczą miodu. Po wypiciu działa tak samo jak eliksir leczniczy i zaspokaja niewielki głód, ale można go również rzucić, aby uleczyć sojusznika.\n\nStworzenia lubiące miód mogą zostać spacyfikowane, jeśli użyje się na nich tego przedmiotu.
items.potions.elixirs.elixirofhoneyedhealing.name=eliksir miodowego uzdrawiania
items.potions.elixirs.elixiroficytouch.desc=Po spożyciu eliksir ten pozwoli pijącemu wysysać ciepło z atakowanych wrogów. Efekt ten sprawi, że pijący stanie się odporny na zimno i będzie mógł wychładzać wrogów atakami fizycznymi.
items.potions.elixirs.elixiroficytouch.name=eliksir lodowatego dotyku
items.potions.elixirs.elixirofmight$htboost.desc=Twoje ciało czuje się nienaturalnie silne i zdrowe.\n\nTwoje maksymalne zdrowie jest zwiększone przez dłuższy czas. Wraz z kolejnymi poziomami, wzrost będzie stopniowo zanikał.\n\nAktualna wartość wzmocnienia: %d.\nPozostałe poziomy: %d.
items.potions.elixirs.elixirofmight$htboost.name=maksymalne zwiększenie zdrowia
items.potions.elixirs.elixirofmight.desc=Ten potężny płyn rozprowadzi się po twoich mięśniach, trwale zwiększając twoją siłę o jeden punkt i tymczasowo zwiększając maksymalne zdrowie o punkty %d. Zwiększenie zdrowia skaluje się z twoim maksymalnym zdrowiem, ale będzie powoli ustępować wraz z kolejnymi poziomami.
items.potions.elixirs.elixirofmight.msg=Nowo odkryta siła przepływa przez Twoje ciało, teraz masz siłę %d!
items.potions.elixirs.elixirofmight.name=eliksir potęgi
items.potions.elixirs.elixiroftoxicessence.desc=Po spożyciu eliksir ten nasyci osobę pijącą toksyczną energią. Osoba pijąca będzie stale rozpylać toksyczny gaz podczas ruchu i będzie odporna na toksyczny gaz i truciznę przez nieco dłuższy czas niż trwa efekt.
items.potions.elixirs.elixiroftoxicessence.name=eliksir toksycznej esencji
items.potions.exotic.exoticpotion.amber=egzotyczny eliksir bursztynowy
items.potions.exotic.exoticpotion.azure=egzotyczny lazurowy eliksir
items.potions.exotic.exoticpotion.bistre=egzotyczny eliksir bistre
items.potions.exotic.exoticpotion.charcoal=egzotyczny eliksir węglowy
items.potions.exotic.exoticpotion.crimson=egzotyczny szkarłatny eliksir
items.potions.exotic.exoticpotion.discover_hint=Przedmiot ten można wytworzyć metodą alchemii.
items.potions.exotic.exoticpotion.golden=egzotyczny złoty eliksir
items.potions.exotic.exoticpotion.indigo=egzotyczny eliksir indygo
items.potions.exotic.exoticpotion.ivory=egzotyczny eliksir z kości słoniowej
items.potions.exotic.exoticpotion.jade=egzotyczny eliksir jadeitowy
items.potions.exotic.exoticpotion.magenta=egzotyczny eliksir magenty
items.potions.exotic.exoticpotion.no=Nie, zmieniłem zdanie
items.potions.exotic.exoticpotion.silver=egzotyczny srebrny eliksir
items.potions.exotic.exoticpotion.turquoise=egzotyczny turkusowy eliksir
items.potions.exotic.exoticpotion.unknown_desc=Ta okrągła fiolka zawiera ziarnistą, kolorową ciecz. Wydaje się być obca w tym kraju, kto wie, co się z nią stanie, gdy się ją wypije lub rzuci?
items.potions.exotic.exoticpotion.warning=Czy naprawdę chcesz anulować użycie tej mikstury? I tak zostanie zużyta.
items.potions.exotic.exoticpotion.yes=Tak, jestem pewien
items.potions.exotic.potionofcleansing$cleanse.desc=Ta postać jest tymczasowo odporna na wszystkie szkodliwe efekty statusu!\n\nPozostało tur: %s.
items.potions.exotic.potionofcleansing$cleanse.name=oczyszczony
items.potions.exotic.potionofcleansing.desc=Ten potężny odczynnik po wypiciu uodporni pijącego na wszystkie szkodliwe efekty statusu na kilka tur. Można go również rzucić w cel, aby go oczyścić.
items.potions.exotic.potionofcleansing.name=mikstura oczyszczająca
items.potions.exotic.potionofcorrosivegas.desc=Odkorkowanie lub rozbicie tego sprężonego szkła spowoduje eksplozję jego zawartości, która zamieni się w śmiertelnie niebezpieczny obłok żrącego gazu o rdzawym kolorze. Gaz ten rozprzestrzenia się szybciej niż gaz toksyczny i jest bardziej śmiercionośny, ale też nie utrzymuje się tak długo.
items.potions.exotic.potionofcorrosivegas.name=mikstura żrącego gazu
items.potions.exotic.potionofdivineinspiration.bonus=+2 punkty talentu!
items.potions.exotic.potionofdivineinspiration.desc=Moc świętej energii sprowadzona do postaci płynnej. Ten napój przepełnia pijącego go boską mocą, przyznając mu dwa dodatkowe punkty talentów na wybranym poziomie talentu.\n\nTen napój można użyć tylko raz dla każdego poziomu talentu.
items.potions.exotic.potionofdivineinspiration.name=mikstura boskiej inspiracji
items.potions.exotic.potionofdivineinspiration.no_more_points=Nie możesz zdobyć więcej punktów talentu.
items.potions.exotic.potionofdivineinspiration.select_tier=Wybierz poziom talentu, aby zdobyć dwa punkty bonusowe. Aby móc wydać punkty, musisz odblokować poziom.
items.potions.exotic.potionofdragonsbreath.desc=Ta fiolka zawiera niezwykły związek, który wybucha płomieniem wkrótce po zmieszaniu ze śliną. Szybkie wyplucie płynu pozwoli użytkownikowi wyrzucić z ust ogień!
items.potions.exotic.potionofdragonsbreath.name=mikstura oddechu smoka
items.potions.exotic.potionofdragonsbreath.prompt=Wybierz miejsce do spalenia
items.potions.exotic.potionofearthenarmor.desc=Płyn ten zamiast paraliżować, działa utwardzająco na skórę, zamieniając ją w tymczasową, naturalną zbroję.
items.potions.exotic.potionofearthenarmor.name=mikstura ziemnej zbroi
items.potions.exotic.potionofmagicalsight.desc=Po wypiciu tego napoju Twoje zmysły na chwilę zostaną wyostrzone do niesamowitego poziomu, co pozwoli Ci widzieć przez ściany w promieniu 12 pól!
items.potions.exotic.potionofmagicalsight.name=mikstura magicznego wzroku
items.potions.exotic.potionofmastery.armor_easier=Twoja zbroja staje się łatwiejsza do noszenia!
items.potions.exotic.potionofmastery.desc=Zamiast dodawać siły, ta mikstura dostosuje mięśnie użytkownika do konkretnego przedmiotu. Dzięki temu będzie on łatwiejszy w użyciu, jakby osoba pijąca go ćwiczyła i wyrobiła sobie pamięć mięśniową.\n\nWybrana broń lub zbroja będzie wymagała o 2 mniej siły do użycia. Ta mikstura może być użyta tylko raz na każdym przedmiocie.
items.potions.exotic.potionofmastery.name=mikstura mistrzostwa
items.potions.exotic.potionofmastery.prompt=Opanuj przedmiot
items.potions.exotic.potionofmastery.weapon_easier=Twoja broń staje się łatwiejsza w użyciu!
items.potions.exotic.potionofshielding.desc=Zamiast leczyć, mikstura ta tworzy wokół ciała użytkownika trwałą tarczę, blokującą znaczną ilość obrażeń.
items.potions.exotic.potionofshielding.name=mikstura osłaniająca
items.potions.exotic.potionofshroudingfog.desc=Po wystawieniu na działanie powietrza płyn w tej kolbie wytworzy gęstą mgłę, która szybko się rozprzestrzenia i blokuje widoczność wrogom.
items.potions.exotic.potionofshroudingfog.name=mikstura otulającej mgły
items.potions.exotic.potionofsnapfreeze.desc=Substancja chemiczna zawarta w tej miksturze reaguje błyskawicznie z powietrzem, natychmiast zamrażając i unieruchamiając wszystko, co znajdzie się w jej zasięgu.
items.potions.exotic.potionofsnapfreeze.name=mikstura szybkiego mrożenia
items.potions.exotic.potionofstamina.desc=Wypicie tego dziwnie słodkiego płynu zapewni Ci długotrwały zastrzyk energii, dzięki czemu będziesz mógł biegać w szybszym tempie przez dłuższy czas.
items.potions.exotic.potionofstamina.name=mikstura wytrzymałości
items.potions.exotic.potionofstormclouds.desc=Rzucenie tą miksturą stworzy szybko rozprzestrzeniającą się chmurę skoncentrowanej pary, która skropli się i rozleje na otoczenie. Większość terenu zamieni się w wodę, ogniści wrogowie otrzymają obrażenia, ogień zostanie zgaszony, a pułapki zostaną przytłoczone i rozbite.
items.potions.exotic.potionofstormclouds.name=mikstura chmur burzowych
items.potions.potion$placeholder.name=napój
items.potions.potion$seedtopotion.name=Losowa mikstura
items.potions.potion.ac_drink=WYPIJ
items.potions.potion.amber=bursztynowy eliksir
items.potions.potion.azure=lazurowa mikstura
items.potions.potion.beneficial=Dobroczynny eliksir
items.potions.potion.bistre=mikstura bistre
items.potions.potion.charcoal=mikstura węglowa
items.potions.potion.crimson=szkarłatny eliksir
items.potions.potion.discover_hint=Możesz znaleźć ten przedmiot losowo w lochach lub stworzyć go poprzez alchemię.
items.potions.potion.golden=złoty eliksir
items.potions.potion.harmful=Szkodliwy eliksir!
items.potions.potion.indigo=eliksir indygo
items.potions.potion.ivory=mikstura z kości słoniowej
items.potions.potion.jade=mikstura jadeitowa
items.potions.potion.magenta=mikstura magenta
items.potions.potion.no=Nie, zmieniłem zdanie
items.potions.potion.shatter=Kolba rozbija się, a ciecz rozpryskuje się, nie powodując żadnych szkód.
items.potions.potion.silver=srebrna mikstura
items.potions.potion.sure_drink=Jesteś pewien, że chcesz to wypić? W większości przypadków powinieneś rzucać takimi miksturami we wrogów.
items.potions.potion.sure_throw=Jesteś pewien, że chcesz to wyrzucić? W większości przypadków sensowne jest wypicie.
items.potions.potion.turquoise=turkusowy eliksir
items.potions.potion.unknown_desc=W tej fiolce wiruje płyn %s. Kto wie, co się stanie po wypiciu go lub rzuceniu fiolką?
items.potions.potion.yes=Tak, wiem, co robię
items.potions.potionofexperience.desc=Opowieści z niezliczonych bitew sprowadzone do płynnej formy - ten napój natychmiast podniesie twój poziom doświadczenia.
items.potions.potionofexperience.name=mikstura doświadczenia
items.potions.potionoffrost.desc=W kontakcie z powietrzem ta substancja paruje, tworząc lodowatą chmurę. Każde stworzenie, które jej dotknie, zamarza w miejscu i nie może się poruszać ani działać.
items.potions.potionoffrost.name=mikstura mrozu
items.potions.potionofhaste.desc=Wypicie tego dziwnie słodkiego płynu na krótko doda ci ogromnej dawki energii, która umożliwi ci szybkie bieganie.
items.potions.potionofhaste.energetic=Czujesz się pełen energii!
items.potions.potionofhaste.name=mikstura pośpiechu
items.potions.potionofhealing.desc=Eliksir, który natychmiast przywraca pełne zdrowie i leczy zatrucie.
items.potions.potionofhealing.heal=Twoje rany zaczynają się zamykać.
items.potions.potionofhealing.name=mikstura lecznicza
items.potions.potionofinvisibility.desc=Wypicie tej mikstury na pewien czas uczyni cię niewidzialnym. Wrogowie nie będą mogli cię zobaczyć. Zaatakowanie wroga albo użycie różdżki lub zwoju na jego oczach przerwie działanie mikstury.
items.potions.potionofinvisibility.invisible=Widzisz, jak twoje ręce stają się niewidzialne!
items.potions.potionofinvisibility.name=mikstura niewidzialności
items.potions.potionoflevitation.desc=Wypicie tego osobliwego płynu uniesie cię w powietrze, pozwalając bez trudu przelatywać nad pułapkami. Ogień i gazy wypełniają jednak powietrze, więc nie da się ich w ten sposób ominąć.
items.potions.potionoflevitation.float=Unosisz się w powietrzu!
items.potions.potionoflevitation.name=mikstura lewitacji
items.potions.potionofliquidflame.desc=Kolba ta zawiera niestabilny związek, który gwałtownie zapali się po wystawieniu na działanie powietrza.
items.potions.potionofliquidflame.name=mikstura płynnego płomienia
items.potions.potionofmindvision.desc=Po wypiciu tego, twój umysł dostroi się do psychicznego sygnału odległych stworzeń, co pozwoli ci wyczuć obecność biologiczną przez ściany. Eliksir ten pozwoli ci również widzieć przez pobliskie ściany i drzwi.
items.potions.potionofmindvision.name=mikstura wizji umysłu
items.potions.potionofmindvision.see_mobs=Można w jakiś sposób wyczuć obecność umysłów innych stworzeń!
items.potions.potionofmindvision.see_none=W jakiś sposób możesz powiedzieć, że w tej chwili jesteś na tym poziomie sam.
items.potions.potionofparalyticgas.desc=Po wystawieniu na działanie powietrza, ciecz w tej butelce wyparuje, tworząc otępiającą żółtą mgiełkę. Każdy, kto wdycha tę chmurę, zostaje natychmiast sparaliżowany i przez jakiś czas po jej rozproszeniu nie może się poruszać. Tym przedmiotem można rzucać w odległych wrogów, aby znaleźli się w zasięgu działania gazu.
items.potions.potionofparalyticgas.name=mikstura gazu paraliżującego
items.potions.potionofpurity.desc=Ta substancja szybko neutralizuje wszystkie szkodliwe gazy w zasięgu działania. Wypicie jej zapewnia chwilową odporność na te gazy.
items.potions.potionofpurity.freshness=Czujesz niezwykłą świeżość w powietrzu.
items.potions.potionofpurity.name=Mikstura Oczyszczenia
items.potions.potionofpurity.protected=Otula Cię folia ochronna!
items.potions.potionofstrength.desc=Ten silny płyn popłynie przez Twoje mięśnie, trwale zwiększając Twoją siłę o jeden punkt.
items.potions.potionofstrength.msg=Nowo odkryta siła przepływa przez Twoje ciało, teraz masz siłę %d!
items.potions.potionofstrength.name=mikstura siły
items.potions.potionoftoxicgas.desc=Odkorkowanie lub rozbicie tego sprężonego szkła spowoduje eksplozję jego zawartości, która zamieni się w śmiertelnie niebezpieczny obłok toksycznego, zielonego gazu. Zamiast odkorkowywać go ręcznie, możesz rzucić tą miksturą w odległych wrogów.
items.potions.potionoftoxicgas.name=mikstura toksycznego gazu
items.quest.ceremonialcandle.desc=Zestaw świec, które podczas użytkowania przetopiono i połączono ze sobą.\n\nSamodzielnie są bezużyteczne, ale użyte z innymi świecami w odpowiednim wzorze, mogą skupić energię do rytuału przywołania.
items.quest.ceremonialcandle.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.ceremonialcandle.name=świeca ceremonialna
items.quest.corpsedust.chill=Dreszcze przechodzą Ci po kręgosłupie.
items.quest.corpsedust.desc=Kula pyłu trupiego nie różni się wyglądem od zwykłej kuli pyłu. Ale czuć w niej złowrogą energię.\n\nDobrym pomysłem byłoby jak najszybsze pozbycie się jej.
items.quest.corpsedust.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.corpsedust.name=pył zwłok
items.quest.darkgold.desc=Metal ten nazywany jest ciemnym nie ze względu na kolor (nie różni się on niczym od zwykłego złota), ale dlatego, że topi się pod wpływem światła dziennego, przez co na powierzchni staje się bezużyteczny.
items.quest.darkgold.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.darkgold.name=ciemna ruda złota
items.quest.darkgold.you_now_have=Teraz masz rudę ciemnego złota %d.
items.quest.dwarftoken.desc=Wielu krasnoludów i niektóre z ich większych tworów noszą te małe kawałki metalu o nieznanym przeznaczeniu. Może to biżuteria, a może jakiś rodzaj dowodu tożsamości. Krasnoludy to dziwni ludzie.
items.quest.dwarftoken.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.dwarftoken.name=żeton krasnoluda
items.quest.embers.desc=Specjalne żarzące się węgle, które można pozyskać tylko z młodych żywiołaków ognia. Promieniują energią cieplną.
items.quest.embers.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.embers.name=żywiołowe żary
items.quest.escapecrystal.ac_use=UŻYWAĆ
items.quest.escapecrystal.desc=Cienki, magiczny kryształ, który najwyraźniej zawiera magię teleportacji. Możesz użyć kryształu w dowolnym momencie, aby opuścić krasnoludzki skarbiec, ale nie będziesz mógł niczego stamtąd zabrać!
items.quest.escapecrystal.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.escapecrystal.name=kryształ ucieczki
items.quest.gooblob.desc=Giętka kula mazi, oddzielona od Goo, gdy ten umierał. Wygląda prawie jak wielka kula galaretki, choć nie odważyłbyś się jej zjeść.\n\nSamodzielnie nic nie robi, ale może być przydatne w połączeniu z niektórymi miksturami lub bombą. Przynajmniej powinno przekształcić się w przyzwoitą ilość energii.
items.quest.gooblob.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.quest.gooblob.name=plama mazi
items.quest.metalshard.desc=Odłamek zardzewiałego, przeklętego metalu, który odłamał się od DM-300 podczas jego niszczenia. Czujesz w nim nieaktywną, złowrogą magię.\n\nSamodzielnie nic nie robi, ale może być przydatny w połączeniu z niektórymi zwojami lub bombą. Przynajmniej powinien przekształcić się w przyzwoitą ilość energii.
items.quest.metalshard.discover_hint=Przedmiot ten można zdobyć po pokonaniu niektórych wrogów.
items.quest.metalshard.name=przeklęty odłamek metalu
items.quest.pickaxe.ability_desc=Pojedynkowicz może _przebić_ wroga kilofem. Gwarantuje to trafienie, powoduje podatność na obrażenia przez 3 tury i zadaje _%1$d-%2$d obrażeń_ przeciwnikom ze sztywną skórą.
items.quest.pickaxe.ability_name=przebić
items.quest.pickaxe.desc=To solidne i ciężkie narzędzie do rozbijania skał. Nie musisz wyposażać się w kilof, aby nim kopać, ale w razie potrzeby prawdopodobnie można je wykorzystać jako broń.
items.quest.pickaxe.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
items.quest.pickaxe.name=kilof
items.quest.pickaxe.upgrade_ability_stat_name=Obrażenia umiejętności
items.quest.ratskull.desc=Zaskakująco duża czaszka szczura. Byłaby świetnym trofeum myśliwskim, gdybyś miał ścianę, na której mógłbyś ją powiesić.
items.quest.ratskull.name=gigantyczna czaszka szczura
items.remains.bowfragment.desc=Ten złamany fragment drewna był kiedyś częścią zaginionego łuku ducha Łowczyni. Wciąż wyczuwasz w nim odrobinę energii natury, możesz użyć go, aby zasadzić wokół siebie wysoką trawę. Jednak to zniszczy fragment.
items.remains.bowfragment.name=fragment łuku
items.remains.brokenhilt.desc=Ta złamana rękojeść wygląda, jakby pochodziła z broni pokonanego pojedynkowicza. Wciąż czujesz w niej odrobinę mocy bojowej, możesz jej użyć, aby uzyskać niewielki bonus do obrażeń przy dwóch kolejnych ciosach w walce wręcz. Jednak to zniszczy rękojeść.
items.remains.brokenhilt.name=złamana rękojeść
items.remains.brokenstaff.desc=Laska tego maga została złamana na pół po śmierci właściciela. Nadal czujesz w niej trochę magicznej energii, możesz jej użyć, aby nieco naładować swoje różdżki. Jednak spowoduje to zniszczenie laski.
items.remains.brokenstaff.name=złamany personel
items.remains.cloakscrap.desc=Ten skrawek prześwitującej tkaniny wygląda, jakby pochodził z płaszcza cienia nieżyjącego już Łotrzyka. Wciąż czuć w nim odrobinę mistycznej energii, którą można wykorzystać do lekkiego wzmocnienia artefaktów. Jednak takie działanie zniszczy tkaninę.
items.remains.cloakscrap.name=skrawek materiału
items.remains.remainsitem.ac_use=UŻYWAĆ
items.remains.remainsitem.discover_hint=Przedmiot ten można znaleźć w szczątkach konkretnego bohatera z poprzedniej przegranej rozgrywki.
items.remains.sealshard.desc=Te maleńkie odłamki czerwonego wosku wyglądają, jakby pochodziły z pieczęci poległego Wojownika. Nadal czujesz odrobinę siły woli, która trzyma się pieczęci, możesz jej użyć, aby zapewnić sobie odrobinę ochrony. Jednak to zniszczy odłamki pieczęci.
items.remains.sealshard.name=odłamki fok
items.remains.tornpage.desc=Ta strona wygląda, jakby została wyrwana z wygasłej świętej księgi jakiegoś kapłana. Wciąż jest w niej odrobina boskiej energii, której możesz użyć, aby odzyskać odrobinę zdrowia. Jednak to zniszczy podartą stronę.
items.remains.tornpage.name=podarta strona
items.rings.ring.agate=pierścień z agatem
items.rings.ring.amethyst=pierścień z ametystem
items.rings.ring.curse_known=W tym pierścieniu można wyczuć złowrogą magię.
items.rings.ring.cursed_worn=Ponieważ pierścień ten jest przeklęty, nie masz możliwości jego zdjęcia.
items.rings.ring.diamond=pierścionek z brylantem
items.rings.ring.emerald=pierścień ze szmaragdem
items.rings.ring.equip_cursed=Pierścień zaciska się boleśnie na palcu!
items.rings.ring.garnet=pierścień z granatem
items.rings.ring.identify=Teraz znasz już swój pierścionek na tyle dobrze, że możesz go rozpoznać.
items.rings.ring.known=To jest %s
items.rings.ring.not_cursed=Pierścień ten jest wolny od złowrogiej magii.
items.rings.ring.onyx=pierścień z onyksu
items.rings.ring.opal=pierścień z opalem
items.rings.ring.quartz=pierścień kwarcowy
