items.artifacts.driedrose$ghosthero.hello=你好 %s。
items.artifacts.driedrose$ghosthero.introduce=我的靈魂與這朵玫瑰緊緊相連，它對我來說無比珍貴，是我留在人世間的愛人送給我的禮物。我無法回到他身邊，但多虧了你，我才有了第二次機會完成我的旅程。當我能夠做到時，我會回應你的召喚，與你並肩作戰。只要你擁有這朵玫瑰，我就能聽到你的聲音，你可以用它在遠方指引我。但願你能在我失敗的地方取得成功…
items.artifacts.driedrose$ghosthero.name=悲傷的鬼魂
items.artifacts.driedrose$ghosthero.player_killed_1=不！ ……
items.artifacts.driedrose$ghosthero.player_killed_2=我幫不了他們…
items.artifacts.driedrose$ghosthero.player_killed_3=不是這樣的…
items.artifacts.driedrose$ghosthero.seen_dm300_1=只有矮人才會建造能殺死入侵者的採礦機器。
items.artifacts.driedrose$ghosthero.seen_dm300_2=那東西真大…
items.artifacts.driedrose$ghosthero.seen_dm300_3=這東西怎麼能一直保持活躍狀態？
