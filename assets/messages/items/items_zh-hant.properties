items.artifacts.masterthievesarmband.desc=這條紫色天鵝絨臂環帶有盜賊大師的標誌。它不屬於你，但它之前的擁有者可能也不屬於它。
items.artifacts.masterthievesarmband.desc_cursed=那條被詛咒的臂環綁在你的手腕上，不知為何，你口袋裡的金子似乎正在慢慢變輕…
items.artifacts.masterthievesarmband.desc_worn=隨著經驗的積累，你會感覺到手腕上的手臂環力量不斷增強。你可以利用這股力量從商店行竊，或是搶劫敵人！搶劫敵人會瞬間發生，短暫地使其失去方向感，並讓你有機會獲得他們身上的所有戰利品！這種力量對毫無防備的敵人效果更佳。多次搶劫同一個敵人並不會增加獲得戰利品的幾率。
items.artifacts.masterthievesarmband.failed_steal=你什麼也沒偷到。
items.artifacts.masterthievesarmband.full=您的臂帶已充滿電！
items.artifacts.masterthievesarmband.level_up=你的臂章越來越牢固了！
items.artifacts.masterthievesarmband.name=盜賊大師臂章
items.artifacts.masterthievesarmband.no_charge=您的臂帶電量不足。
items.artifacts.masterthievesarmband.no_steal=那個敵人沒有什麼好偷的。
items.artifacts.masterthievesarmband.no_target=你必須選擇與你相鄰的敵人作為攻擊目標。
items.artifacts.masterthievesarmband.prompt=選擇一個敵人作為攻擊目標
items.artifacts.masterthievesarmband.steal_shopkeeper=你不能直接偷店主的東西。
items.artifacts.masterthievesarmband.stole_item=你偷了一件物品：%s。
items.artifacts.sandalsofnature.absorb_seed=鞋子吸收了種子，看起來更健康了。
items.artifacts.sandalsofnature.ac_feed=餵食
items.artifacts.sandalsofnature.ac_root=根
items.artifacts.sandalsofnature.desc_1=乍看像是麻繩做成的涼鞋，其實是兩株植物！它們看起來很弱，顏色也很蒼白，或許需要施肥？
items.artifacts.sandalsofnature.desc_2=鞋子長大了，現在更像兩雙訂製皮鞋了。它們恢復了一些顏色，也許還能繼續長大？
items.artifacts.sandalsofnature.desc_3=這些植物又重新生長了，現在看起來像一雙用樹皮製成的結實靴子。它們似乎恢復了活力，但或許還能繼續成長？
items.artifacts.sandalsofnature.desc_4=這些植物似乎已經長到了最大尺寸，看起來像一雙鎧甲般的脛甲。這雙脛甲呈現深棕色，形狀像一棵非常粗壯的樹。
items.artifacts.sandalsofnature.desc_ability=鞋子會泛起你餵給它們的最後一顆種子的顏色。它們可以短暫地紮根於地面，並在3格半徑內產生該植物的效果。種子：_%s_\n所需充能：_%d%%_
items.artifacts.sandalsofnature.desc_cursed=這雙被詛咒的涼鞋阻礙了人與大自然的和諧相處。
items.artifacts.sandalsofnature.desc_hint=戴上這件飾品，你會感覺與自然更加和諧。
items.artifacts.sandalsofnature.desc_seeds=你已經餵鞋子吃了 %d 種子。
items.artifacts.sandalsofnature.levelup=你的鞋子突然變大了！
items.artifacts.sandalsofnature.low_charge=你的鞋子沒有足夠的能量來做到這一點。
items.artifacts.sandalsofnature.name=自然涼鞋
items.artifacts.sandalsofnature.name_1=自然之鞋
items.artifacts.sandalsofnature.name_2=自然之靴
items.artifacts.sandalsofnature.name_3=自然脛甲
items.artifacts.sandalsofnature.no_effect=你必須先在鞋子裡放一顆種子。
items.artifacts.sandalsofnature.out_of_range=此位置超出範圍。
items.artifacts.sandalsofnature.prompt=選擇一顆種子
items.artifacts.sandalsofnature.prompt_target=選擇位置
items.artifacts.skeletonkey$keywall.desc=骷髏鑰匙在這裡設置了一道臨時魔法牆。
items.artifacts.skeletonkey.ac_insert=插入
items.artifacts.skeletonkey.crystal_charges=打開水晶鎖需要 5 次充能。
items.artifacts.skeletonkey.cursed=你不能使用被詛咒的骷髏鑰匙。
items.artifacts.skeletonkey.desc=一把看起來很重要的鑰匙，鑰匙頭形狀像骷髏頭。每次看，它的齒似乎都不一樣。
items.artifacts.skeletonkey.desc_cursed=這把該死的鑰匙似乎故意避免插入任何鎖，甚至讓你很難（但並非不可能）使用其他鑰匙。
items.artifacts.skeletonkey.desc_worn=這把魔法鑰匙似乎會隨著使用次數的增加而增強力量，取代地牢中普通的鑰匙。它幾乎可以插入地牢中任何鎖，用於打開或關閉鎖，包括以前從未上鎖的門。這把鑰匙甚至可以用於正前方或斜前方的空白區域，以「鎖定」你面前的空氣，形成一道持續10回合的3格寬的實體牆。如果空間允許，鎖定也會將敵人推開。
items.artifacts.skeletonkey.discard=你丟棄多餘的鑰匙。
items.artifacts.skeletonkey.force_lock=沒有了萬能鑰匙，鎖已經鬆脫了。你設法把它撬開了。
items.artifacts.skeletonkey.gold_charges=打開金鎖需要2次充能。
items.artifacts.skeletonkey.invalid_target=那裡沒有需要上鎖或解鎖的東西。
items.artifacts.skeletonkey.iron_charges=打開一把普通鎖需要 1 次充能。
items.artifacts.skeletonkey.levelup=你的萬能鑰匙越來越強了！
items.artifacts.skeletonkey.lock_charges=鎖門需要2次充電。
items.artifacts.skeletonkey.lock_no_space=你不能把角色鎖在門裡！
items.artifacts.skeletonkey.locked_with_key=那扇門是用你的萬用鑰匙鎖上的。
items.artifacts.skeletonkey.name=萬能鑰匙
items.artifacts.skeletonkey.prompt=選擇目標
items.artifacts.skeletonkey.wall_charges=建造臨時牆需要 2 次充能。
items.artifacts.skeletonkey.wont_open=不知為何，鑰匙插不進這把鎖裡。
items.artifacts.talismanofforesight$foresight.desc=你感到非常緊張，彷彿附近有看不見的危險。
items.artifacts.talismanofforesight$foresight.name=遠見
items.artifacts.talismanofforesight$foresight.uneasy=你感到不安。
items.artifacts.talismanofforesight.ac_scry=驚魂
items.artifacts.talismanofforesight.desc=一塊光滑的石頭，上面刻著奇怪的圖案。你感覺它好像在看著你周圍的一切，警戒著任何隱藏的東西。
items.artifacts.talismanofforesight.desc_cursed=那枚被詛咒的護身符正專注地盯著你，麻痺你的感官。
items.artifacts.talismanofforesight.desc_worn=握住護身符後，你會感覺自己的感官變得更敏銳。隨著時間的推移，護身符會緩慢累積能量，當你發現隱藏的門或陷阱時，能量也會隨之累積。護身符可以消耗能量進行錐形範圍的“占卜”，揭示掃描區域內的所有地塊和秘密，並在短時間內讓你看到敵人和物品。
items.artifacts.talismanofforesight.full_charge=你的護身符已充滿電！
items.artifacts.talismanofforesight.levelup=你的護身符變得更強了！
items.artifacts.talismanofforesight.low_charge=該護符需要至少 5% 的能量才能進行占卜。
items.artifacts.talismanofforesight.name=預知護身符
items.artifacts.talismanofforesight.prompt=選擇掃描位置。
items.artifacts.timekeepershourglass$sandbag.desc=這小袋細沙應該非常適合你的沙漏。 \n\n店主剛好在你需要的時候有這個東西，這似乎有點奇怪…
items.artifacts.timekeepershourglass$sandbag.levelup=你把沙子倒入沙漏裡。
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的沙漏裡裝滿了神奇的沙子！
items.artifacts.timekeepershourglass$sandbag.name=一袋魔法沙
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你沒有沙漏來裝這些沙子。
items.artifacts.timekeepershourglass$timefreeze.desc=時間在你周圍靜止，使你可以瞬間執行動作。此效果持續到被取消或你的沙漏能量耗盡為止。攻擊或使用魔法也會打破此效果。 \n\n持續回合數直到充能使用：%s。
items.artifacts.timekeepershourglass$timefreeze.name=時間凍結
items.artifacts.timekeepershourglass.ac_activate=啟用設定
items.artifacts.timekeepershourglass.cursed=你不能使用被詛咒的沙漏。
items.artifacts.timekeepershourglass.deactivate=你關閉了時間凍結功能。
items.artifacts.timekeepershourglass.desc=這個碩大的華麗沙漏外表樸素，但你卻能感受到它精雕細琢的外殼中蘊藏著強大的力量。當你轉動沙漏，看著沙子緩緩流淌時，你會感覺到它散發出的魔力在牽引著你，你不禁會想，如果運用這股魔力，你或許就能掌控時間。
items.artifacts.timekeepershourglass.desc_cursed=那隻被詛咒的沙漏被鎖在你的身邊，你能感覺到它試圖操縱你的時間流逝。
items.artifacts.timekeepershourglass.desc_hint=沙漏似乎漏掉了一些沙子，要是你能找到一些就好了…
items.artifacts.timekeepershourglass.freeze=讓我周圍的時間靜止
items.artifacts.timekeepershourglass.name=計時員的沙漏
items.artifacts.timekeepershourglass.no_charge=你的沙漏還沒有充滿電，暫時無法使用。
items.artifacts.timekeepershourglass.onfreeze=周圍的一切突然靜止了。
items.artifacts.timekeepershourglass.onstasis=世界彷彿在一瞬間發生了變化。
items.artifacts.timekeepershourglass.prompt=你想如何使用沙漏的魔法？ \n\n靜止狀態下，時間正常流逝，而你則處於凍結狀態且完全無敵，每次最多消耗2次充能。 \n\n時間凍結時，你的行動彷彿沒有時間限制。此狀態可隨時透過使用沙漏或攻擊來解除。
items.artifacts.timekeepershourglass.stasis=讓自己進入靜止狀態
items.artifacts.unstablespellbook.ac_add=添加
items.artifacts.unstablespellbook.ac_read=讀
items.artifacts.unstablespellbook.blinded=失明時無法閱讀書籍。
items.artifacts.unstablespellbook.cursed=你無法閱讀被詛咒的魔法書。
items.artifacts.unstablespellbook.desc=考慮到它的年代，這本古籍的保存狀況出奇地好。翻動書頁時，它會發出嘶嘶聲和劈啪聲，彷彿蘊含著一股不穩定的能量。如果你閱讀這本書，誰也無法預料你會施展什麼樣的魔法。
items.artifacts.unstablespellbook.desc_cursed=這本被詛咒的書已經與你束縛在一起，它阻礙了你使用大多數捲軸的能力。
items.artifacts.unstablespellbook.desc_empowered=你添加到書中的捲軸散發著強大的能量。你可以選擇這些捲軸的異域版本效果，但需要額外付費。
items.artifacts.unstablespellbook.desc_index=這本書並不完整。它的索引目前指向以下空白頁：
items.artifacts.unstablespellbook.infuse_scroll=你將捲軸的能量注入書中。
items.artifacts.unstablespellbook.name=不穩定的魔法書
items.artifacts.unstablespellbook.no_charge=你的魔法書暫時沒能量了。
items.artifacts.unstablespellbook.prompt=選擇捲軸
items.artifacts.unstablespellbook.read_empowered=你添加到法術書中的捲軸能量湧動。你可以選擇引導此捲軸的普通版或異域版效果。選擇異域版效果將消耗2點充能而非1點。
items.artifacts.unstablespellbook.unable_scroll=您無法將此捲軸新增至書中。
items.artifacts.unstablespellbook.unknown_scroll=你還不確定這是什麼類型的捲軸。
items.bags.bag.discover_hint=你可以在商店裡買到這個商品。
items.bags.bag.name=背包
items.bags.magicalholster.desc=這款纖薄的槍套由某種珍稀動物皮毛製成，蘊含強大的魔法，可以收納大量遠程武器。您只需伸手即可輕鬆取用所需物品。由於槍套的魔法作用，魔杖在槍套內充能速度略微加快，投擲武器的續航時間也稍微延長。
items.bags.magicalholster.name=魔法槍套
items.bags.potionbandolier.desc=這條厚實的彈藥帶像腰帶一樣繫在胸前，上面有許多隔熱帶，可以用來裝藥水瓶、水袋或液態金屬瓶。裝在彈藥帶裡，你的藥水就能免受寒冷侵襲。
items.bags.potionbandolier.name=藥水彈藥帶
items.bags.scrollholder.desc=這個管狀容器看起來像是用來裝天文學家的工具和海圖的，但你的捲軸放進去也一樣合適。它甚至還有幾個側隔層，可以很好地放置魔法水晶、奧術筆和奧術樹脂。這個容器看起來不太易燃，所以你的捲軸放在裡面應該不會著火。
items.bags.scrollholder.name=捲軸支架
items.bags.velvetpouch.desc=這個小小的天鵝絨袋可以存放很多小物件，例如種子、符文石和一些煉金術材料。
items.bags.velvetpouch.discover_hint=其中一位英雄初始就擁有這件物品。
items.bags.velvetpouch.name=天鵝絨小袋
items.bombs.arcanebomb.desc=這枚炸彈被賦予了神秘的力量。它會像古伊的強化攻擊一樣爆炸，對2格範圍內的所有目標造成_%1$d-%2$d點魔法傷害_。
items.bombs.arcanebomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.arcanebomb.name=奧術炸彈
items.bombs.bomb$doublebomb.desc=兩枚沉重的黑火藥炸彈疊在一起，看起來好像可以免費獲得一枚！
items.bombs.bomb$doublebomb.name=兩枚炸彈
items.bombs.bomb.ac_lightthrow=燈光和投射
items.bombs.bomb.desc=一枚威力相當大的黑火藥炸彈。這枚炸彈爆炸後會對周圍所有物體造成_%1$d-%2$d點傷害_，並摧毀部分相鄰地形或物品。
items.bombs.bomb.desc_burning=炸彈的引信快要燒完了，請保持距離或將其撲滅！
items.bombs.bomb.desc_fuse=看起來引信點燃後需要幾輪射擊才能燒盡。
items.bombs.bomb.name=炸彈
items.bombs.bomb.ondeath=爆炸會要了你的命…
items.bombs.bomb.rankings_desc=死於爆炸
items.bombs.bomb.snuff_fuse=你迅速掐滅了炸彈的引信。
items.bombs.firebomb.desc=這枚炸彈經過改造，爆炸範圍更大，造成_%1$d-%2$d傷害_，並在2格範圍內蔓延持續火焰。
items.bombs.firebomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.firebomb.name=燃燒彈
items.bombs.flashbangbomb.desc=這枚特製炸彈爆炸時會爆發出耀眼的光芒、震撼的音效和強勁的電流。爆炸產生的衝擊波會使周圍兩格範圍內的物體受到_%1$d-%2$d點傷害，電流還會額外造成25%%點傷害，並使其眩暈10回合。
items.bombs.flashbangbomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.flashbangbomb.name=閃光彈
items.bombs.frostbomb.desc=這枚炸彈經過改造，爆炸範圍更大，造成 _%1$d-%2$d 點傷害，並在 2 格範圍內持續釋放一股冰冷的空氣。
items.bombs.frostbomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.frostbomb.name=霜彈
items.bombs.holybomb.desc=這枚炸彈經過改造，爆炸時會在更大範圍內閃耀聖光。爆炸產生的傷害為_%1$d-%2$d_，爆炸範圍內兩格內的所有目標都會受到_%1$d-%2$d_點傷害，而亡靈或惡魔敵人還會額外受到50%%_點聖光傷害。
items.bombs.holybomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.holybomb.name=聖彈
items.bombs.noisemaker.desc=這枚特製炸彈的引信耗盡時會反覆發出噪音。當有物體觸碰到炸彈時，它會爆炸，並對2格範圍內的所有物體造成_%1$d-%2$d點傷害_！
items.bombs.noisemaker.desc_burning=這個發出噪音的裝置正在滴答作響，當有東西靠近時它就會爆炸！
items.bombs.noisemaker.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.noisemaker.name=噪音製造器
items.bombs.regrowthbomb.desc=這枚特製炸彈不會爆炸，而是會在周圍三格範圍內噴灑生命之液。爆炸區域會迅速長出青草和植物。你和所有被爆炸波及的盟友都會獲得如同飲用治療藥水般的生命值恢復。
items.bombs.regrowthbomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.regrowthbomb.name=再生炸彈
items.bombs.shrapnelbomb.desc=這枚炸彈經過改造，加入了DM-300的金屬碎片，爆炸時碎片會四處飛濺，對炸彈周圍大範圍內的敵人造成_%1$d-%2$d點傷害_。使用時最好找個掩體躲起來…
items.bombs.shrapnelbomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.shrapnelbomb.name=彈片炸彈
items.bombs.smokebomb.desc=這枚炸彈經過改造，爆炸的同時會噴出一團濃厚的氣體雲。它會造成_%1$d-%2$d點傷害_，並在2格範圍內散佈迷霧。
items.bombs.smokebomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.smokebomb.name=煙霧彈
items.bombs.woollybomb.desc=這枚特製炸彈爆炸後會生成一大片魔法綿羊。爆炸會對周圍兩格內的所有目標造成_%1$d-%2$d點傷害_。這些綿羊會阻擋移動，並且持續存在很長時間！不過，如果遇到強大的敵人，綿羊的持續時間會縮短，而且可以透過與敵人互動來更快地驅散它們。
items.bombs.woollybomb.discover_hint=你可以透過煉金術製作這個物品。
items.bombs.woollybomb.name=毛絨炸彈
items.brokenseal$warriorshield.desc_active=戰士破碎的封印目前正幫助他堅持下去，除了生命值之外，還能提供他護盾。護盾初始觸發後會有一段冷卻時間，之後才能再次使用。此護盾不會隨時間衰減，但如果附近幾個回合內沒有敵人，護盾就會消失。護盾消失時，任何未使用的護盾值都會減少冷卻時間，最多可減少 50 回合。剩餘護盾值：目前冷卻時間：
items.brokenseal$warriorshield.desc_cooldown=戰士最近因封印破損而獲得了護盾，必須等待一段時間才能再次受益於其護盾效果。剩餘回合數：\n\n。
items.brokenseal$warriorshield.desc_negative_cooldown=戰士的護盾冷卻時間目前為負值，這意味著當他的護盾啟動時，冷卻時間將低於通常的 150 回合。護盾冷卻時間可以減少到最低 -150 回合，這意味著一旦激活，護盾將立即再次可用。目前冷卻時間：%d。
items.brokenseal$warriorshield.name=戰士之盾
items.brokenseal.ac_affix=詞綴
items.brokenseal.affix=你將封印貼在你的盔甲上！
items.brokenseal.choose_desc=這件盔甲和破損的封印都附有符文。請選擇保留哪個符文。盔甲符文：\n\n破損封印符文：%2$s\n\n請注意，如果您選擇盔甲上目前的符文，封印之後將無法轉移該符文。
items.brokenseal.choose_title=選擇一個字形
items.brokenseal.cursed_armor=封印對詛咒盔甲無效。
items.brokenseal.desc=一枚蠟封，作為英勇的象徵，被貼在盔甲上。蠟封中央刻著褪色的保護符文，中間裂開成兩半。這枚來自家鄉的印記，能幫助戰士堅持不懈。戴上此印記的戰士，在生命值即將降至一半或以下時，會立即獲得護盾。此印記可以貼在盔甲上，並且可以在不同盔甲之間轉移。它還可以攜帶一項升級，前提是該升級是在印記貼附於盔甲期間應用的。
items.brokenseal.discover_hint=其中一位英雄初始就擁有這件物品。
items.brokenseal.inscribed=印章上刻有_%s。 _
items.brokenseal.name=封條破損
items.brokenseal.prompt=選擇一件盔甲
items.brokenseal.unknown_armor=你首先必須確定那件盔甲是否被詛咒了。
items.dewdrop.already_full=你目前健康狀況完全正常。
items.dewdrop.desc=晶瑩剔透的露珠。由於此地的神奇力量，純淨水俱有輕微的療癒功效。
items.dewdrop.name=露珠
items.dewvial.ac_drink=飲用
items.dewvial.auto_drink=你喝光了瓶中的露水，治好了傷口。
items.dewvial.collected=你將一滴露水收集到了露水瓶中。
items.dewvial.desc=這個小瓶子可以儲存多餘的露水，留著以後飲用。瓶子裝滿後，若你瀕臨死亡，就會自動喝下其中的露水。
items.dewvial.empty=你的露水瓶空了！
items.dewvial.full=你的露水瓶滿了！
items.dewvial.name=露水瓶
items.energycrystal.desc=一堆充滿煉金能量的小型魔法水晶。這些水晶是煉金配方中最常見的原料，可以透過在煉金術鍋中分解消耗品來獲得。
items.energycrystal.name=能量晶體
items.equipableitem.ac_equip=裝備
items.equipableitem.ac_unequip=取消裝備
items.equipableitem.curse_detected=就在你裝備這件物品之前，你感覺到它被詛咒了！
items.equipableitem.unequip_cursed=你無法移除被詛咒的物品！
items.food.berry.desc=女獵人在地牢的植物叢中發現了這種小漿果。它可以快速食用，恢復少量飽足感，而且可能含有可用的種子！
items.food.berry.discover_hint=你可以透過特定的英雄天賦找到這件物品。
items.food.berry.eat_msg=那顆莓果真好吃！
items.food.berry.name=地城漿果
items.food.blandfruit$chunks.desc=這種味道寡淡的水果在撞擊後爆炸，留下了一堆塊狀物。儘管沾了一些泥土，但這些煮熟的味道寡淡的水果大塊看起來完全可以食用。
items.food.blandfruit$chunks.name=淡味水果塊
items.food.blandfruit.blindfruit=盲果
items.food.blandfruit.cooked=煮熟的淡味水果
items.food.blandfruit.desc=太乾太淡了，或許加點別的食材燉一下會好一點。
items.food.blandfruit.desc_cooked=果實浸泡在鍋裡一段時間後變得飽滿多汁，甚至吸收了與之一起烹調的種子的成分。它將具有與種子對應的藥劑的功效。
items.food.blandfruit.desc_eat=它看起來好像已經可以吃了！
items.food.blandfruit.desc_throw=它看起來非常不穩定，最好把它扔掉。
items.food.blandfruit.dreamfruit=蒟蒻
items.food.blandfruit.earthfruit=土果
items.food.blandfruit.fadefruit=褪色果實
items.food.blandfruit.firefruit=火果
items.food.blandfruit.icefruit=冰果
items.food.blandfruit.name=淡果
items.food.blandfruit.raw=你無法忍受生吃它。
items.food.blandfruit.rotfruit=爛果
items.food.blandfruit.sorrowfruit=悲傷果
items.food.blandfruit.starfruit=楊桃
items.food.blandfruit.stormfruit=風暴果
items.food.blandfruit.sunfruit=太陽果
items.food.blandfruit.swiftfruit=迅捷果
items.food.chargrilledmeat.desc=看起來像是一塊不錯的牛排。
items.food.chargrilledmeat.discover_hint=你可以用另一種食物來製作它。
items.food.chargrilledmeat.name=炭烤肉
items.food.food.ac_eat=吃
items.food.food.desc=這裡沒什麼特別的：肉乾、一些餅乾——諸如此類的東西。
items.food.food.eat_msg=那食物味道真好！
items.food.food.name=食物配給
items.food.frozencarpaccio.better=你感覺好多了！
items.food.frozencarpaccio.desc=這是一塊冷凍生肉。唯一的食用方法是切成薄片。而這樣吃起來卻出奇地好吃。
items.food.frozencarpaccio.discover_hint=你可以用另一種食物來製作它。
items.food.frozencarpaccio.hard=你感覺皮膚變硬了！
items.food.frozencarpaccio.invis=你看到你的雙手消失了！
items.food.frozencarpaccio.name=冷凍生牛肉片
items.food.frozencarpaccio.refresh=清爽！
items.food.meatpie.desc=美味的餡餅，裡面塞滿了鮮嫩的肉餡。這道菜比任何其他食物都更能讓你感到滿足。
items.food.meatpie.discover_hint=你可以透過煉金術製作這個物品。
items.food.meatpie.eat_msg=那食物太棒了！
items.food.meatpie.name=肉餅
items.food.mysterymeat$placeholder.name=肉
items.food.mysterymeat.desc=後果自負！
items.food.mysterymeat.discover_hint=你可以從某些敵人身上掉落此物品。
items.food.mysterymeat.eat_msg=那食物的味道……很奇怪。
items.food.mysterymeat.hot=哦，好熱！
items.food.mysterymeat.legs=你感覺不到你的腿了！
items.food.mysterymeat.name=神秘肉
items.food.mysterymeat.not_well=你覺得不太舒服。
items.food.mysterymeat.stuffed=你吃飽了。
items.food.pasty$fishleftover.desc=這是你上一餐剩下的一些魚。你可以隨時吃掉它來補充一些飢餓感。
items.food.pasty$fishleftover.eat_msg=那食物味道還可以。
items.food.pasty$fishleftover.name=魚的剩菜
items.food.pasty.amulet_desc=你終於找到了，神奇的護身符——等等，這只是一塊用錫紙包裹的巧克力，看起來像護身符！它不會賦予你無限的力量，但至少可以填飽肚子，並給你一點神器能量。愚人節快樂！
items.food.pasty.amulet_name=延多爾護身符？
items.food.pasty.cane_desc=一根巨大的、甜膩膩的拐杖糖。它大到可以讓你吃飽，而且糖分可能還會為你的魔杖增加一點點能量。節日快樂！
items.food.pasty.cane_name=拐杖糖
items.food.pasty.desc=正宗的康沃爾餡餅，餡料是傳統的牛肉馬鈴薯餡。美味！
items.food.pasty.egg_desc=一個巨大的巧克力蛋，用彩色的黃色錫紙包裹著。這裡面的巧克力足夠讓你吃飽，糖分或許還能為你的神器增添一點額外的能量。復活節快樂！
items.food.pasty.egg_name=復活節彩蛋
items.food.pasty.fish_desc=一條完整的清蒸魚，神奇地保存在綠葉蔬菜上。每年這個時候，人們都會留一些魚過年吃，這樣你就可以留一些剩菜，而不是一次吃完。新年快樂！
items.food.pasty.fish_name=清蒸魚
items.food.pasty.name=糊狀物
items.food.pasty.pie_desc=一大塊南瓜派。它香甜微辣的味道會讓你飽腹，還能帶給你一絲慰藉。萬聖節快樂！
items.food.pasty.pie_name=南瓜派
items.food.pasty.rainbow_desc=這種色彩繽紛的藥水是一種液態食物。除了能滿足你的飢餓感之外，它還蘊含著一點魔法，可以安撫附近非首領敵人，使其暫時不願與你戰鬥。 \n\n驕傲月快樂！
items.food.pasty.rainbow_name=彩虹藥水
items.food.pasty.sparkling_desc=這款閃閃發光的飲品是一種液態食物。它能滿足飢餓感，模擬氣泡酒的口感，但實際上並不含酒精。喝下去後，腹部會感到溫暖，帶給你一絲慰藉。新年快樂！
items.food.pasty.sparkling_name=閃亮藥水
items.food.pasty.vanilla_desc=這塊巨大的香草蛋糕上撒滿了彩色糖屑，並淋上了藍色糖霜。這款蛋糕是為了慶祝多年的遊戲經驗而製作的，吃掉它，你也能獲得一些遊戲經驗。 \n\n初代《像素地牢》於2012年12月4日首次發布。祝《像素地牢》生日快樂！
items.food.pasty.vanilla_name=藍色蛋糕
items.food.phantommeat.desc=一塊晶瑩剔透、閃閃發光的大牛排，取自幽靈食人魚。這種神奇的肉不需要烹飪，除了能讓你完全飽足之外，還能提供許多防禦增益。食用後，你將獲得隱身術、樹皮術、一些治療效果，並能治癒許多有害的負面狀態。
items.food.phantommeat.discover_hint=你可以從某些敵人身上掉落此物品。
items.food.phantommeat.name=幻影肉
items.food.smallration.desc=它看起來和標準口糧一模一樣，只是份量更小。
items.food.smallration.discover_hint=你可以在商店裡買到這個商品。
items.food.smallration.eat_msg=那食物味道還可以。
items.food.smallration.name=少量食物配給
items.food.stewedmeat.desc=燉煮已經清除了肉中的所有疾病和寄生蟲，可以安全食用。
items.food.stewedmeat.discover_hint=你可以透過煉金術製作這個物品。
items.food.stewedmeat.eat_msg=那食物味道還可以。
items.food.stewedmeat.name=把子肉
items.food.supplyration.desc=這份口糧是盜賊公會成員留在地牢裡的，也是為他們準備的。它專為邊走邊吃而設計，有助於進行各種陰謀詭計。雖然它不像普通口糧那樣飽腹，但它可以快速食用，提供少量直接治療，並能恢復盜賊暗影斗篷的充能。
items.food.supplyration.discover_hint=你可以透過特定的英雄天賦找到這件物品。
items.food.supplyration.name=供應配給
items.gold.desc=一堆金幣。收集金幣，以便之後在商店裡消費。
items.gold.name=金子
items.heap.artifact=一件文物
items.heap.chest=胸部
items.heap.chest_desc=不打開你永遠不會知道裡面是什麼！
items.heap.crystal_chest=水晶箱
items.heap.crystal_chest_desc=你可以看到裡面有 _%s_，但要打開寶箱，你需要一把水晶鑰匙。
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=上鎖的箱子
items.heap.locked_chest_desc=不打開它你永遠不會知道裡面是什麼！但要打開它，你需要一把金鑰匙。
items.heap.remains=英雄遺骸
items.heap.remains_desc=這是你前任留下的全部遺物。或許值得看看裡面有沒有什麼值錢的東西。
items.heap.ring=一枚戒指
items.heap.skeleton=骨骼遺骸
items.heap.skeleton_desc=這就是某個不幸的冒險者留下的全部遺物。或許值得搜查裡面有沒有什麼值錢的東西。
items.heap.tomb=墓
items.heap.tomb_desc=這座古墓裡可能藏有有用的東西，但它的主人肯定會反對你去查看。
items.heap.wand=魔杖
items.honeypot$shatteredpot.desc=花盆已經破碎，只有黏在盆壁上的黏稠蜂蜜勉強維持著它的完整性，但它正在慢慢散架。儘管花盆已經破碎，蜜蜂似乎仍然想要保護它。
items.honeypot$shatteredpot.name=破碎的蜜罐
items.honeypot.ac_shatter=破碎
items.honeypot.desc=這個巨大的蜜罐裡其實只裝了蜂蜜，裡面竟然住著一隻巨型蜜蜂！這種體型龐大的蜜蜂通常都待在蜂巢裡，或許這個罐子是某種特製的捕蜂籠？蜜蜂在罐子裡享用著蜂蜜，看起來十分愜意，當你注視它時，它會警戒地嗡嗡叫著。
items.honeypot.name=蜜罐
items.item.ac_drop=降低
items.item.ac_throw=丟
items.item.curse=詛咒
items.item.custom_note=此物品有自訂備註：“_%s_”
items.item.custom_note_type=此類商品帶有自訂備註：“_%s_”
items.item.discover_hint=你可以在地牢中隨機找到這件物品。
items.item.prompt=選擇投擲方向
items.item.rankings_desc=被 %s 殺死
items.journal.alchemypage.desc=一張撕下來的煉金術指南書頁。大部分文字太小，遠距離難以辨認，但可以辨認出頁面標題。
items.journal.alchemypage.name=撕碎的煉金術書頁
items.journal.documentpage.desc=一張孤零零的紙頁，可能是從某本書上撕下來的。你需要把它撿起來才能閱讀。
items.journal.documentpage.name=撕破的頁面
items.journal.guidebook.desc=這是一本冒險者指南，一位最終決定放棄冒險的人把它留在了這裡！這本書很神奇，能在關鍵時刻提醒冒險者翻開其中一頁。儘管它有這種神奇的功能，但這本書最受歡迎的原因還是封面上用醒目的大字寫著的“別慌！”
items.journal.guidebook.hint_desktop=您的旅遊指南裡有建議！點擊右上角閃爍的日誌按鈕（%s）即可閱讀。
items.journal.guidebook.hint_mobile=您的旅遊指南裡有建議！點擊右上角閃爍的日誌按鈕即可閱讀。
items.journal.guidebook.hint_status=指南
items.journal.guidebook.name=地下城精通之書
items.journal.guidepage.desc=一本冒險指南撕下的一頁。大部分文字太小，遠距離難以辨認，但可以辨認出頁面標題。
items.journal.guidepage.name=撕破的旅遊指南頁
items.journal.regionlorepage$caves.desc=這是一份看似探險家航海日誌的記錄，保存得相當完好，儘管年代久遠。拿起來讀一讀吧。
items.journal.regionlorepage$caves.name=舊日誌條目
items.journal.regionlorepage$city.desc=一塊鏽跡斑斑的小金屬板，上面神奇地刻著一段訊息。儘管年代久遠，上面的字跡依然清晰，但你必須拿起它才能閱讀。
items.journal.regionlorepage$city.name=生鏽的石板
items.journal.regionlorepage$halls.desc=一塊黑色小平板，上面刻著閃著綠光的字母。從遠處看，這些閃閃發光的字母模糊成一片，需要拿起來才能看清楚。
items.journal.regionlorepage$halls.name=發光平板電腦
items.journal.regionlorepage$prison.desc=一張寫在舊紙上的日記或其他記錄。它似乎比你在下水道裡找到的信件保存得更好，但你仍然需要把它撿起來才能閱讀。
items.journal.regionlorepage$prison.name=磨損的日記條目
items.journal.regionlorepage$sewers.desc=看起來像是一封信，寫在一張沾滿泥土的紙上。你需要把它撿起來才能看清上面寫的是什麼。
items.journal.regionlorepage$sewers.name=磨損的字母
items.keys.crystalkey.desc=這把水晶鑰匙的切割面在黑暗中閃閃發光。或許它能打開什麼水晶製品？
items.keys.crystalkey.name=水晶鑰匙
items.keys.goldenkey.desc=這把金鑰匙上的凹槽細小而複雜。或許它能打開一個上鎖的箱子？
items.keys.goldenkey.name=金鑰匙
items.keys.ironkey.desc=這把古老的鐵鑰匙上的凹槽已經磨損嚴重；它的皮質掛繩也因年代久遠而破舊不堪。它能打開哪扇門呢？
items.keys.ironkey.name=鐵鑰匙
items.keys.skeletonkey.name=萬能鑰匙
items.keys.wornkey.desc=這把鑰匙雖然磨損褪色，但看起來很堅固。說不定能打開附近某扇很重要的門。
items.keys.wornkey.name=磨損的鑰匙
items.kindofmisc.unequip_message=您必須先卸下其中一件物品。選擇一件物品進行交換。
items.kindofmisc.unequip_title=卸下一件物品
items.kindofweapon.empty=空的
items.kindofweapon.equip_cursed=你不由自主地握緊了武器。
items.kindofweapon.swift_equip=你迅速裝備好武器。
items.kindofweapon.which_equip_msg=你想把這件物品裝備到哪個武器欄位？ \n\n該英雄直接使用主武器攻擊，但可以使用兩把武器的技能。兩把武器共享相同的充能次數。 \n\n該英雄還可以瞬間切換主武器和副武器。
items.kindofweapon.which_equip_primary=主要 (%s)
items.kindofweapon.which_equip_secondary=二級 (%s)
items.kingscrown.ac_wear=穿
items.kingscrown.desc=這是最後一位矮人國王的王冠，它散發著強大的魔法能量。穿戴後，王冠的魔法會注入你目前穿著的盔甲，將其轉化為擁有特殊能力的獨一無二的史詩級盔甲。新的盔甲將保留原盔甲的所有屬性。
items.kingscrown.discover_hint=你可以從某些敵人身上掉落此物品。
items.kingscrown.naked=可惜的是，皇冠並不能改變你的內衣。
items.kingscrown.name=矮人王的王冠
items.kingscrown.ratgraded=鼠王的爪子發出耀眼的光芒，你的盔甲也跟著變形！
items.kingscrown.upgraded=王冠發出耀眼的光芒，然後隨著你的盔甲變形而消散！
items.liquidmetal.ac_apply=申請
items.liquidmetal.already_fixed=那件投擲武器已經完好無損了！
items.liquidmetal.apply=你使用 %d 液態金屬來修復你的投擲武器。
items.liquidmetal.desc=這種神奇的液體可以填補投擲武器上的裂縫和破損，使其恢復完美狀態！如果一套武器缺少一件，但其他部分都已修復，那麼液態金屬甚至可以用來替換缺少的武器！ 1級武器完全修復需要10個液態金屬，5級武器需要30個。每次升級都會使所需的液態金屬量增加35%。液態金屬不能用來修復飛鏢的鏢尖。
items.liquidmetal.discover_hint=你可以透過煉金術製作這個物品。
items.liquidmetal.name=液態金屬
items.liquidmetal.prompt=選擇投擲武器
items.lostbackpack.desc=這是你遺失的物品清單。收集它們即可找回所有遺失的物品！
items.lostbackpack.name=背包丟失了
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=這件奇特的矮人科技製品能讓你遠距離通訊。啟動後，這個信標能讓你在地牢的任何地方向像素商店出售物品。然而，信標中的魔法只能持續一個遊戲回合，所以要謹慎使用。
items.merchantsbeacon.name=商人的燈塔
items.potions.brews.aquabrew.desc=這種藥劑破碎後，會在其所在位置釋放出一股高壓水流。水流威力只足以傷害火焰敵人，但也會將水擴散到附近地形，解除陷阱，撲滅火焰，並將附近的敵人擊退。
items.potions.brews.aquabrew.name=水釀
items.potions.brews.blizzardbrew.desc=這種酒瓶破碎後會釋放出一陣旋風般的暴風雪，並像氣體一樣迅速蔓延。
items.potions.brews.blizzardbrew.name=暴雪釀造
items.potions.brews.brew.discover_hint=你可以透過煉金術製作這個物品。
items.potions.brews.causticbrew.desc=這種藥劑破碎後會在周圍大片區域內擴散腐蝕性黏液。任何被黏液沾染的物體，如果無法用水沖洗乾淨，都會慢慢融化。
items.potions.brews.causticbrew.name=腐蝕性藥劑
items.potions.brews.infernalbrew.desc=這款酒一旦破碎，就會釋放出熊熊烈火，並像氣體一樣迅速蔓延。
items.potions.brews.infernalbrew.name=地獄佳釀
items.potions.brews.shockingbrew.desc=這種酒瓶破碎時，會在破碎位置周圍的大片區域引發雷暴。
items.potions.brews.shockingbrew.name=令人震驚的釀造
items.potions.brews.unstablebrew.desc=這瓶神奇的藥劑會發出變幻莫測的彩虹光芒。飲用或投擲後，它會觸發隨機藥劑的效果。飲用後，藥劑效果總是有益的；投擲後，藥劑效果總是有害的。
items.potions.brews.unstablebrew.name=不穩定的釀造
items.potions.elixirs.elixir.discover_hint=你可以透過煉金術製作這個物品。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=你暫時獲得了類似黏液的恢復能力。站在水中時，你每回合會恢復少量生命值。當你的生命值全滿或離開水面時，此效果暫停。剩餘生命值：
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水療法
items.potions.elixirs.elixirofaquaticrejuvenation.desc=這種藥劑含有殘留的黏液，並添加了治療藥水。雖然它不能立即恢復生命值，但當你站在水中時，它會持續恢復更多生命值。
items.potions.elixirs.elixirofaquaticrejuvenation.name=水生復原靈藥
items.potions.elixirs.elixirofarcanearmor.desc=這種藥劑能使飲用者獲得持久的魔法傷害抵抗力。
items.potions.elixirs.elixirofarcanearmor.name=奧術護甲藥劑
items.potions.elixirs.elixirofdragonsblood.desc=飲用此藥劑後，熾熱的力量將湧遍飲用者的血管。此效果將使飲用者免疫火焰傷害，並使其能夠透過物理攻擊點燃敵人。
items.potions.elixirs.elixirofdragonsblood.name=龍血藥劑
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=你處於羽落藥劑的效果之下，可以落入深淵而不會受到傷害！剩餘回合數：\n\n。
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=羽毛落下
items.potions.elixirs.elixiroffeatherfall.desc=這種藥劑能產生較弱但更可控的懸浮效果，使飲用者能夠在短時間內從很高的地方墜落而不會受到傷害。
items.potions.elixirs.elixiroffeatherfall.light=你覺得輕如鴻毛！
items.potions.elixirs.elixiroffeatherfall.name=羽毛墜落的靈藥
items.potions.elixirs.elixirofhoneyedhealing.desc=這種藥劑結合了治癒能力和蜂蜜的甜美。飲用後，它能達到與治療藥水相同的效果，並能少量緩解飢餓感；它也可以投擲出去治療盟友。對嗜蜜的生物使用此物品可能會使其平靜下來。
items.potions.elixirs.elixirofhoneyedhealing.name=蜂蜜療癒靈藥
items.potions.elixirs.elixiroficytouch.desc=服用此藥劑後，飲用者可以吸取攻擊敵人的熱量。此效果會使飲用者免疫寒冷，並能透過物理攻擊使敵人降溫。
items.potions.elixirs.elixiroficytouch.name=冰觸靈藥
items.potions.elixirs.elixirofmight$htboost.desc=你的身體感覺異常強壯健康。你的最大生命值會在一段時間內大幅提升。隨著等級提升，提升效果會逐漸減弱。目前提升數值：剩餘等級：
items.potions.elixirs.elixirofmight$htboost.name=最大生命值提升
items.potions.elixirs.elixirofmight.desc=這種強效液體會流遍你的肌肉，永久提升你的力量值1點，並暫時提升你的最大生命值%d點。生命值提升效果與你的最大生命值成正比，但會隨著等級提升而逐漸消失。
items.potions.elixirs.elixirofmight.msg=新的力量湧遍全身，你現在擁有了%d的力量！
items.potions.elixirs.elixirofmight.name=力量靈藥
items.potions.elixirs.elixiroftoxicessence.desc=服用此藥劑後，飲用者將獲得毒性能量。飲用者移動時會持續散發毒氣，並且在藥劑效果持續時間略長於其作用持續時間後，將免疫毒氣和毒素。
items.potions.elixirs.elixiroftoxicessence.name=猛毒精華
items.potions.exotic.exoticpotion.amber=異域琥珀藥劑
items.potions.exotic.exoticpotion.azure=異域蔚藍藥劑
items.potions.exotic.exoticpotion.bistre=異國苦酒藥劑
items.potions.exotic.exoticpotion.charcoal=異國木炭藥劑
items.potions.exotic.exoticpotion.crimson=異域深紅藥劑
items.potions.exotic.exoticpotion.discover_hint=你可以透過煉金術製作這個物品。
items.potions.exotic.exoticpotion.golden=異國黃金藥水
items.potions.exotic.exoticpotion.indigo=異國靛藍藥劑
items.potions.exotic.exoticpotion.ivory=異域象牙藥劑
items.potions.exotic.exoticpotion.jade=異域玉藥水
items.potions.exotic.exoticpotion.magenta=異國洋紅色藥水
items.potions.exotic.exoticpotion.no=不，我改變主意了。
items.potions.exotic.exoticpotion.silver=異域銀藥劑
items.potions.exotic.exoticpotion.turquoise=異國綠松石藥水
items.potions.exotic.exoticpotion.unknown_desc=這個圓形的燒瓶裡裝著一種顆粒狀的彩色液體。它似乎來自外地，誰知道喝下去或丟掉之後會發生什麼事？
items.potions.exotic.exoticpotion.warning=你真的要取消這次藥水的使用嗎？反正它最終都會被消耗掉。
items.potions.exotic.exoticpotion.yes=是的，我肯定
items.potions.exotic.potionofcleansing$cleanse.desc=角色暫時免疫所有有害狀態效果！剩餘回合數：\n\n。
items.potions.exotic.potionofcleansing$cleanse.name=已清洗
items.potions.exotic.potionofcleansing.desc=這種強效試劑飲用後，可使飲用者在幾個回合內免疫所有有害狀態效果。它也可以投擲到目標身上進行淨化。
items.potions.exotic.potionofcleansing.name=淨化藥劑
items.potions.exotic.potionofcorrosivegas.desc=打開或打碎這個加壓玻璃瓶會導致瓶內液體爆炸，噴出致命的腐蝕性銹色氣體。這種氣體擴散速度比有毒氣體更快，毒性也更強，但持續時間更短。
items.potions.exotic.potionofcorrosivegas.name=腐蝕性氣體
items.potions.exotic.potionofdivineinspiration.bonus=+2 天賦點數！
items.potions.exotic.potionofdivineinspiration.desc=此藥水將神聖能量濃縮成液體，飲用者將獲得神聖力量，並可在其選擇的天賦等級中獲得兩個額外天賦點數。每個天賦等級只能使用一次此藥水。
items.potions.exotic.potionofdivineinspiration.name=神聖靈感的藥劑
items.potions.exotic.potionofdivineinspiration.no_more_points=你不能再獲得任何額外的天賦點數了。
items.potions.exotic.potionofdivineinspiration.select_tier=選擇一個天賦等級即可獲得兩個獎勵點數。您必須先解鎖該等級才能使用這些點數。
items.potions.exotic.potionofdragonsbreath.desc=這個燒瓶裡裝著一種不尋常的化合物，它與唾液混合後會立即燃燒。快速吐出瓶中的液體，使用者就能從口中噴出火焰！
items.potions.exotic.potionofdragonsbreath.name=龍息藥劑
items.potions.exotic.potionofdragonsbreath.prompt=選擇一個地點進行焚燒
items.potions.exotic.potionofearthenarmor.desc=這種液體不會使皮膚麻痺，反而會使皮膚硬化，使其暫時變成天然盔甲。
items.potions.exotic.potionofearthenarmor.name=土之鎧甲藥劑
items.potions.exotic.potionofmagicalsight.desc=喝下這瓶酒後，你的感官會短暫地增強到難以置信的程度，讓你能夠看穿半徑 12 格範圍內的牆壁！
items.potions.exotic.potionofmagicalsight.name=魔法視力藥水
items.potions.exotic.potionofmastery.armor_easier=你的盔甲穿起來更輕鬆了！
items.potions.exotic.potionofmastery.desc=這種藥劑不會直接賦予使用者力量，而是使使用者的肌肉與特定物品相符。這會使該物品更容易使用，如同飲用者已經練習過並形成了肌肉記憶一般。所選武器或盔甲的使用所需力量將減少2點。每種物品只能使用一次此藥劑。
items.potions.exotic.potionofmastery.name=精通藥劑
items.potions.exotic.potionofmastery.prompt=精通一件物品
items.potions.exotic.potionofmastery.weapon_easier=你的武器更容易使用了！
items.potions.exotic.potionofshielding.desc=這種藥水不會治癒傷勢，而是在使用者身體周圍形成一個堅固的護盾，抵抗相當一部分傷害。
items.potions.exotic.potionofshielding.name=護盾藥水
items.potions.exotic.potionofshroudingfog.desc=當暴露在空氣中時，這個燒瓶中的液體會產生濃厚的煙霧，迅速擴散並阻擋敵人的視線。
items.potions.exotic.potionofshroudingfog.name=霧藥劑
items.potions.exotic.potionofsnapfreeze.desc=此藥劑中所含的化學物質會迅速與空氣反應，瞬間凍結並固定其作用範圍內的所有物體。
items.potions.exotic.potionofsnapfreeze.name=速凍藥水
items.potions.exotic.potionofstamina.desc=飲用這種味道奇特的甜液體，可以讓你獲得持久的能量提升，使你能夠以更快的速度長時間奔跑。
items.potions.exotic.potionofstamina.name=耐力藥水
items.potions.exotic.potionofstormclouds.desc=投擲此藥劑會產生一團快速擴散的濃縮蒸氣雲，蒸氣凝結後傾瀉而下。大部分地形將變成水，火焰敵人會受到傷害，火焰會被撲滅，陷阱也會被沖破。
items.potions.exotic.potionofstormclouds.name=暴風雲藥劑
items.potions.potion$placeholder.name=藥水
items.potions.potion$seedtopotion.name=隨機藥水
items.potions.potion.ac_drink=飲用
items.potions.potion.amber=琥珀藥水
items.potions.potion.azure=天青藥水
items.potions.potion.beneficial=有益藥劑
items.potions.potion.bistre=苦艾藥劑
items.potions.potion.charcoal=木炭藥劑
items.potions.potion.crimson=深紅藥劑
items.potions.potion.discover_hint=你可以在地牢中隨機找到這件物品，或者透過煉金術製作它。
items.potions.potion.golden=黃金藥水
items.potions.potion.harmful=有害藥水！
items.potions.potion.indigo=靛藍藥水
items.potions.potion.ivory=象牙藥水
items.potions.potion.jade=玉藥水
items.potions.potion.magenta=洋紅色藥水
items.potions.potion.no=不，我改變主意了。
items.potions.potion.shatter=燒瓶破碎，液體濺出，但無害。
items.potions.potion.silver=銀色藥水
items.potions.potion.sure_drink=你確定要喝嗎？大多數情況下，你應該把這種藥水丟向你的敵人。
items.potions.potion.sure_throw=你確定要丟掉它嗎？大多數情況下，喝掉它才是明智之舉。
items.potions.potion.turquoise=綠松石藥水
items.potions.potion.unknown_desc=這隻小瓶裡翻湧著%s的液體。誰知道喝下或扔出它會發生什麼？
items.potions.potion.yes=是的，我知道自己在做什麼。
items.potions.potionofexperience.desc=這款藥劑凝聚了無數戰役的傳奇經驗，能夠瞬間提升你的經驗等級。
items.potions.potionofexperience.name=經驗藥劑
items.potions.potionoffrost.desc=這種藥劑接觸空氣後會蒸發成冰冷的雲霧。碰到雲霧的生物會凍在原地，無法行動或移動。
items.potions.potionoffrost.name=冰霜藥劑
items.potions.potionofhaste.desc=喝下這種味道奇甜的液體，會在短時間內帶給你巨大的能量，讓你能夠高速奔跑。
items.potions.potionofhaste.energetic=你感覺精力充沛！
items.potions.potionofhaste.name=加速藥水
items.potions.potionofhealing.desc=能立刻恢復全部生命並解除中毒的靈藥。
items.potions.potionofhealing.heal=你的傷口開始癒合。
items.potions.potionofhealing.name=治療藥水
items.potions.potionofinvisibility.desc=喝下這瓶藥水能讓你暫時隱形，敵人將無法看見你。攻擊敵人，或在敵人眼前使用法杖或卷軸，都會解除效果。
items.potions.potionofinvisibility.invisible=你看到你的雙手消失了！
items.potions.potionofinvisibility.name=隱形藥水
items.potions.potionoflevitation.desc=喝下這種奇妙的液體後，你會浮在空中，輕鬆越過陷阱。不過，火焰和氣體也會充斥空氣，不能靠漂浮避開。
items.potions.potionoflevitation.float=你飄到空中了！
items.potions.potionoflevitation.name=懸浮藥水
items.potions.potionofliquidflame.desc=這個燒瓶裡裝著一種不穩定的化合物，一旦暴露在空氣中就會劇烈燃燒。
items.potions.potionofliquidflame.name=液態火焰藥劑
items.potions.potionofmindvision.desc=喝下此藥後，你的意識將與遠處生物的靈能訊號相協調，使你能夠隔牆感知生物的存在。此外，此藥還能讓你看穿附近的牆壁和門。
items.potions.potionofmindvision.name=靈視藥劑
items.potions.potionofmindvision.see_mobs=你似乎能感受到其他生物的意識存在！
items.potions.potionofmindvision.see_none=你會隱約感覺到，此刻在這個層面上，你是孤單一人。
items.potions.potionofparalyticgas.desc=暴露在空氣中後，此瓶中的液體會汽化成令人麻痺的黃色煙霧。任何吸入這種煙霧的人都會立即麻痺，即使煙霧消散後也會有一段時間無法動彈。此物品可以投擲向遠處的敵人，使其受到煙霧的影響。
items.potions.potionofparalyticgas.name=麻痺氣體藥劑
items.potions.potionofpurity.desc=這種藥劑能迅速中和範圍內的所有有害氣體。喝下它，還能暫時免受這些氣體的影響。
items.potions.potionofpurity.freshness=你感到空氣異常清新。
items.potions.potionofpurity.name=淨化藥水
items.potions.potionofpurity.protected=一層保護膜包裹著你！
items.potions.potionofstrength.desc=這種強效液體會流遍你的肌肉，永久增強你的力量1點。
items.potions.potionofstrength.msg=新的力量湧遍全身，你現在擁有了%d的力量！
items.potions.potionofstrength.name=力量藥劑
items.potions.potionoftoxicgas.desc=打開或打碎這個加壓玻璃瓶會導致裡面的東西爆炸，噴出一團致命的綠色毒氣。你可以選擇把這瓶藥水丟向遠處的敵人，而不是用手打開它。
items.potions.potionoftoxicgas.name=毒氣藥劑
items.quest.ceremonialcandle.desc=一組蠟燭，因使用而熔化並融合在一起。單獨使用時它們毫無價值，但與其他蠟燭按一定圖案一起使用時，它們可以集中能量用於召喚儀式。
items.quest.ceremonialcandle.discover_hint=你可以在特定任務中找到這件物品。
items.quest.ceremonialcandle.name=儀式蠟燭
items.quest.corpsedust.chill=一股寒意湧上脊背。
items.quest.corpsedust.desc=這團屍塵從外表上看與普通塵球並無二致，但你能感覺到其中潛藏著一股邪惡的能量。盡快清除它或許是個好主意。
items.quest.corpsedust.discover_hint=你可以在特定任務中找到這件物品。
items.quest.corpsedust.name=屍粉
items.quest.darkgold.desc=這種金屬被稱為“暗金”，不是因為它的顏色（它與普通黃金沒有區別），而是因為它在日光下會熔化，因此在表面毫無用處。
items.quest.darkgold.discover_hint=你可以在特定任務中找到這件物品。
items.quest.darkgold.name=黑金礦石
items.quest.darkgold.you_now_have=您現在擁有 %d 深色金礦石。
items.quest.dwarftoken.desc=許多矮人以及他們的一些大型造物都攜帶著這些用途不明的小金屬片。或許是首飾，或許是某種身分識別。矮人真是個奇特的種族。
items.quest.dwarftoken.discover_hint=你可以在特定任務中找到這件物品。
items.quest.dwarftoken.name=矮人代幣
items.quest.embers.desc=只能從幼年火元素身上採集到的特殊餘燼。它們會散發熱能。
items.quest.embers.discover_hint=你可以在特定任務中找到這件物品。
items.quest.embers.name=元素餘燼
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.desc=這是一塊纖薄的魔法水晶，似乎蘊含著傳送魔法。你可以隨時使用這塊水晶離開矮人寶庫，但你無法帶走任何東西！
items.quest.escapecrystal.discover_hint=你可以在特定任務中找到這件物品。
items.quest.escapecrystal.name=逃逸水晶
items.quest.gooblob.desc=一團黏糊糊的、軟綿綿的物質，從死去的Goo身上分離出來。它幾乎就像一大團果凍，不過你肯定不敢吃它。它本身沒有任何作用，但或許可以和某些藥水或炸彈結合使用。至少它應該能轉化為相當可觀的能量。
items.quest.gooblob.discover_hint=你可以從某些敵人身上掉落此物品。
items.quest.gooblob.name=一團黏糊糊的東西
items.quest.metalshard.desc=一塊鏽跡斑斑、詛咒纏身的金屬碎片，是DM-300被摧毀時脫落的。你能感覺到其中蘊含著一股沉寂的邪惡魔法。它本身毫無作用，但或許可以與某些捲軸或炸彈結合使用。至少，它應該能轉化為相當可觀的能量。
items.quest.metalshard.discover_hint=你可以從某些敵人身上掉落此物品。
items.quest.metalshard.name=詛咒金屬碎片
items.quest.pickaxe.ability_desc=決鬥者可以用鎬刺穿敵人。此招必定命中，使敵人陷入3回合的易傷狀態，並對擁有堅硬皮膚的敵人造成_%1$d-%2$d點傷害_。
items.quest.pickaxe.ability_name=刺穿
items.quest.pickaxe.desc=這是一把堅固而沉重的碎石工具。雖然不用裝備鎬子也能用它挖礦，但在緊急情況下它或許可以當作武器使用。
items.quest.pickaxe.discover_hint=你可以在特定任務中找到這件物品。
items.quest.pickaxe.name=鎬
items.quest.pickaxe.upgrade_ability_stat_name=技能傷害
items.quest.ratskull.desc=一個出乎意料的大老鼠頭骨。如果你有牆可以掛起來，它會是一件很棒的狩獵戰利品。
items.quest.ratskull.name=巨鼠頭骨
items.remains.bowfragment.desc=這塊破碎的木片曾是某個失落的女獵人的靈弓的一部分。你還能感受到碎片中殘留的些許自然能量，你可以用它在周圍種出一些高草。不過，這樣做會摧毀碎片本身。
items.remains.bowfragment.name=弓碎片
items.remains.brokenhilt.desc=這斷劍柄看起來像是來自戰敗決鬥者的武器。你還能感受到劍柄中殘留的一絲武力，你可以用它來為接下來的兩次近戰攻擊造成一些額外傷害。不過，這樣做會徹底摧毀劍柄。
items.remains.brokenhilt.name=斷柄
items.remains.brokenstaff.desc=這根法杖在主人過世後斷成了兩截。你仍然可以感受到法杖中殘留的魔力，可以用它來稍微增強你的魔杖能量。但是這樣做會徹底摧毀法杖。
items.remains.brokenstaff.name=斷裂的杖
items.remains.cloakscrap.desc=這塊半透明的布料看起來像是來自一位已故盜賊的暗影斗篷。你還能感覺到它殘留著一絲神祕能量，可以用它來稍微提升你的神器能量。不過，這樣做會破壞這塊布料。
items.remains.cloakscrap.name=碎布
items.remains.remainsitem.ac_use=使用
items.remains.remainsitem.discover_hint=你可以在之前某次失敗的冒險中某個特定英雄的遺骸中找到這件物品。
items.remains.sealshard.desc=這些細小的紅色蠟片看起來像是來自一位陣亡戰士的封印。你還能感覺到封印上殘留著一絲意志力，你可以用它來給自己一些保護。但是這樣做會摧毀這些封印碎片。
items.remains.sealshard.name=封印碎片
items.remains.tornpage.desc=這一頁看起來像是從一本過期的牧師聖典上撕下來的。上面還殘留著一些神聖能量，你可以用它來恢復少量生命值。不過，這樣做會毀掉這頁撕下來的東西。
items.remains.tornpage.name=撕破的頁面
items.rings.ring.agate=瑪瑙戒指
items.rings.ring.amethyst=紫水晶戒指
items.rings.ring.curse_known=你能感覺到這枚戒指裡潛藏著一股邪惡的魔法。
items.rings.ring.cursed_worn=因為這枚戒指被詛咒了，你無力將其取下。
items.rings.ring.diamond=鑽石戒指
items.rings.ring.emerald=祖母綠戒指
items.rings.ring.equip_cursed=戒指勒得手指生疼！
items.rings.ring.garnet=石榴石戒指
items.rings.ring.identify=你現在對自己的戒指已經夠熟悉，可以認出它了。
items.rings.ring.known=這是 %s
items.rings.ring.not_cursed=這枚戒指沒有邪惡魔法。
items.rings.ring.onyx=縝瑪瑙戒指
items.rings.ring.opal=蛋白石戒指
items.rings.ring.quartz=石英戒指
items.rings.ring.ruby=紅寶石戒指
items.rings.ring.sapphire=藍寶石戒指
items.rings.ring.topaz=黃玉戒指
items.rings.ring.tourmaline=碧璽戒指
items.rings.ring.unknown_desc=這枚金屬戒指上嵌著一顆碩大的%s，在黑暗中閃閃發光。誰知道戴上它會有什麼效果？
items.rings.ringofaccuracy.combined_stats=你裝備的戒指正在結合它們的力量，總共使你的命中率提高_%s%%_。
items.rings.ringofaccuracy.desc=這枚戒指能提高你擊中敵人的機率。
items.rings.ringofaccuracy.name=精準之戒
items.rings.ringofaccuracy.stats=戴上此戒指可提升您的精準度_%s%%。 _
items.rings.ringofaccuracy.typical_stats=戴上此戒指後，您的精準度通常會提高_%s%%。 _
items.rings.ringofaccuracy.upgrade_stat_name_1=精準度提升
items.rings.ringofarcana.combined_stats=你裝備的戒指正在結合它們的力量，總共使附魔和符文的力量增加_%s%%_。
items.rings.ringofarcana.desc=這枚戒指可以增強武器上的魔法附魔和盔甲上的符文，包括詛咒！它首先提高觸發幾率，然後在觸發幾率達到100%時增強效果強度。詛咒戒指則會削弱附魔、符文和詛咒的效果。
items.rings.ringofarcana.name=奧術之戒
items.rings.ringofarcana.stats=戴上此戒指後，附魔與符文的威力將提升_%s%%。 _
items.rings.ringofarcana.typical_stats=配戴此戒指時，通常會使附魔和符文的威力提升_%s%%。
items.rings.ringofarcana.upgrade_stat_name_1=至寶強化
items.rings.ringofelements.combined_stats=你裝備的戒指正在結合它們的力量，總共提供_%s%%_元素抗性。
items.rings.ringofelements.desc=這枚戒指能抵禦火焰、電擊、氣體等元素的傷害，也能縮短負面效果的持續時間。
items.rings.ringofelements.name=元素之戒
items.rings.ringofelements.stats=佩戴此戒指時，將提供_%s%%_元素抵抗力。
items.rings.ringofelements.typical_stats=配戴此戒指時，通常會提供_%s%%_元素抵抗力。
items.rings.ringofelements.upgrade_stat_name_1=反抗
items.rings.ringofenergy.combined_stats=你裝備的戒指正在結合它們的力量，總共將充能速度提高_%s%%_。
items.rings.ringofenergy.desc=在這枚戒指散發的奧術力場中，你的魔法裝備會更快充能。而一枚被詛咒的戒指則會減慢充能速度。
items.rings.ringofenergy.name=能量環
items.rings.ringofenergy.stats=戴上此戒指後，魔杖、神器和英雄護甲的充能速度將提高_%s%%。 _
items.rings.ringofenergy.typical_stats=戴上此戒指後，通常會使魔杖、神器和英雄護甲的充能速度提高_%s%%。 _
items.rings.ringofenergy.upgrade_stat_name_1=充能加速
items.rings.ringofevasion.combined_stats=你裝備的戒指正在結合它們的力量，總共使你的閃避能力提高_%s%%_。
items.rings.ringofevasion.desc=這枚戒指能提高你躲開敵人攻擊的機率。
items.rings.ringofevasion.name=閃避之戒
items.rings.ringofevasion.stats=戴上此戒指後，你的閃避率將提高_%s%%。 _
items.rings.ringofevasion.typical_stats=戴上此戒指後，你的閃避率通常會提高_%s%%。
items.rings.ringofevasion.upgrade_stat_name_1=迴避性能提升
items.rings.ringofforce$brawlersstance.desc=在此姿態下，決鬥者的普通攻擊即使裝備了武器也會使用已裝備的力量戒指。這些攻擊會獲得額外傷害，並且仍然會使用武器的強化和附魔效果。然而，維持此姿態需要專注力，會使武器技能的充能速度降低50%。此姿態可以透過使用力量戒指來切換開啟或關閉，但如果快速啟動和關閉此姿態，充能速度的降低效果會持續一段時間。
items.rings.ringofforce$brawlersstance.name=鬥士的姿態
items.rings.ringofforce.ability_desc=決鬥者佩戴此戒指後可進入_鬥士姿態_，使其普通攻擊始終使用此戒指，即使裝備武器也是如此。這些攻擊將造成_%1$d-%2$d點傷害_，並繼承武器的附魔和強化效果。此姿態會使武器充能速度降低50%%點。
items.rings.ringofforce.ability_name=鬥士的姿態
items.rings.ringofforce.combined_stats=你裝備的戒指正在結合它們的力量，在沒有武器的情況下造成總共 _%1$d-%2$d 點傷害_，或使用武器時增加傷害 _%3$d_。
items.rings.ringofforce.desc=這枚戒指能增強配戴者近戰攻擊的威力。使用武器時，這種額外力量提升幅度較小，但徒手攻擊則會大幅增強。而詛咒戒指則會削弱配戴者的攻擊力。
items.rings.ringofforce.name=力量之環
items.rings.ringofforce.stats=空手時，以你目前的力量值，這枚戒指將造成_%1$d-%2$d點傷害。裝備武器後，這枚戒指將增加_%3$d點傷害。
items.rings.ringofforce.typical_ability_desc=決鬥者佩戴此戒指後可進入_鬥士姿態_，使其普通攻擊始終使用此戒指，即使裝備武器也是如此。這些攻擊通常會造成_%1$d-%2$d點傷害_，並且會繼承武器的附魔和強化效果。此姿態會使武器充能速度降低50%%點。
items.rings.ringofforce.typical_stats=空手時，以你目前的力量值，這枚戒指通常會造成_%1$d-%2$d點傷害。裝備武器後，這枚戒指通常會增加_%3$d點傷害。
items.rings.ringofforce.upgrade_stat_name_1=非武裝傷害
items.rings.ringofforce.upgrade_stat_name_2=武裝傷害提升
items.rings.ringofforce.upgrade_stat_name_3=技能傷害
items.rings.ringoffuror.combined_stats=你裝備的戒指正在結合它們的力量，使你的攻擊速度總共提高_%s%%_。
items.rings.ringoffuror.desc=這枚戒指能賦予配戴者內心的狂怒，使其攻擊速度更快。而一枚詛咒戒指則會降低配戴者的攻擊速度。
items.rings.ringoffuror.name=狂怒之環
items.rings.ringoffuror.stats=戴上此戒指後，你的攻擊速度將提升_%s%%。
items.rings.ringoffuror.typical_stats=戴上此戒指後，通常會使你的攻擊速度提高_%s%%。
items.rings.ringoffuror.upgrade_stat_name_1=攻擊速度提升
items.rings.ringofhaste.combined_stats=你裝備的戒指正在結合它們的力量，總共使你的移動速度提高_%s%%_。
items.rings.ringofhaste.desc=這枚戒指能加快佩戴者的時間流速，讓一切行動都快上少許。
items.rings.ringofhaste.name=疾速之戒
items.rings.ringofhaste.stats=戴上此戒指後，您的移動速度將提升_%s%%。 _
items.rings.ringofhaste.typical_stats=戴上此戒指後，您的移動速度通常會提高_%s%%。
items.rings.ringofhaste.upgrade_stat_name_1=移動速度提升
items.rings.ringofmight.combined_stats=你裝備的戒指正在結合它們的力量，總共可以提升你的力量_%1$d_和最大生命值_%2$s%%_。
items.rings.ringofmight.desc=這款戒指能增強配戴者的體能，賦予他們更強健的體魄和更佳的耐力。而一枚被詛咒的戒指則會削弱配戴者的力量。
items.rings.ringofmight.name=威力之戒
items.rings.ringofmight.stats=戴上此戒指後，你的力量值將增加_%1$d_，最大生命值將增加_%2$s%%_。
items.rings.ringofmight.typical_stats=戴上此戒指後，通常會使你的力量值增加_%1$d_，最大生命值增加_%2$s%%_。
items.rings.ringofmight.upgrade_stat_name_1=增強
items.rings.ringofmight.upgrade_stat_name_2=最大生命值提升
items.rings.ringofsharpshooting.combined_stats=你裝備的戒指正在結合它們的力量，總共將有效投擲武器等級提高_%1$d_，耐久度提高_%2$s%%_。
items.rings.ringofsharpshooting.desc=這枚戒指能提升配戴者的精準度和瞄準能力，讓所有投擲武器的威力和耐久度都得到提升。詛咒戒指則會產生相反的效果。
items.rings.ringofsharpshooting.name=神槍手之環
items.rings.ringofsharpshooting.stats=戴上此戒指後，投擲武器的傷害將提升至相當於武器等級提升_%1$d_的水平，耐久度也將提升_%2$s%%_。
items.rings.ringofsharpshooting.typical_stats=戴上此戒指後，通常會將你的投擲武器的傷害提升至相當於武器等級提升了_%1$d_，並將武器耐久度提升_%2$s%%_。
items.rings.ringofsharpshooting.upgrade_stat_name_1=等級傷害提升
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久度提升
items.rings.ringoftenacity.combined_stats=你裝備的戒指正在結合它們的力量，總共最多可減少你受到的傷害_%s%%_。
items.rings.ringoftenacity.desc=佩戴此戒指後，佩戴者可以抵抗通常致命的攻擊。佩戴者受傷越重，抵抗力就越強。而詛咒戒指則會使敵人更容易處決配戴者。
items.rings.ringoftenacity.name=堅韌之環
items.rings.ringoftenacity.stats=戴上此戒指可減少您受到的傷害，最多可達_%s%%。 _
items.rings.ringoftenacity.typical_stats=配戴此戒指時，通常可減少您受到的傷害，最多可達_%s%%。 _
items.rings.ringoftenacity.upgrade_stat_name_1=最大傷害抗性
items.rings.ringofwealth.combined_stats=你裝備的戒指正在結合它們的力量，總共使你的運氣增加_%s%%_。
items.rings.ringofwealth.desc=這枚戒指如同磁鐵般吸引寶藏，增加敵人和容器中掉落貴重物品的機率。而詛咒戒指則會降低你獲得戰利品的幾率。
items.rings.ringofwealth.name=財富之環
items.rings.ringofwealth.stats=戴上此戒指可提升您的運氣值_%s%%。 _
items.rings.ringofwealth.typical_stats=戴上此戒指通常會增加您的運氣值_%s%%。
items.rings.ringofwealth.upgrade_stat_name_1=幸運值提升
items.scrolls.exotic.exoticscroll.berkanan=貝爾卡南的異域捲軸
items.scrolls.exotic.exoticscroll.discover_hint=你可以透過煉金術製作這個物品。
items.scrolls.exotic.exoticscroll.gyfu=GYFU的異域捲軸
items.scrolls.exotic.exoticscroll.isaz=伊薩茲的異域捲軸
items.scrolls.exotic.exoticscroll.kaunan=考南的異域捲軸
items.scrolls.exotic.exoticscroll.laguz=拉古茲的異國捲軸
items.scrolls.exotic.exoticscroll.mannaz=曼納茲的異域捲軸
items.scrolls.exotic.exoticscroll.naudiz=瑙迪茲的異國風情捲軸
items.scrolls.exotic.exoticscroll.odal=奧達爾的異域捲軸
items.scrolls.exotic.exoticscroll.raido=雷多的異域捲軸
items.scrolls.exotic.exoticscroll.sowilo=索維洛的異域捲軸
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ的異域捲軸
items.scrolls.exotic.exoticscroll.unknown_desc=這張黑色羊皮紙上寫著一個閃閃發光、難以辨認的魔法符文。它似乎與這片土地格格不入，誰知道當它被大聲朗讀時會發生什麼？
items.scrolls.exotic.exoticscroll.yngvi=YNGVI的異域捲軸
items.scrolls.exotic.scrollofantimagic.desc=此捲軸上的咒語會為你營造一層魔法光環，暫時阻擋所有魔法效果，無論有害還是有益。這包括大多數魔法物品的效果，例如魔杖、捲軸、戒指、神器、附魔和詛咒。不過，英雄護甲的技能威力強大，足以不受此影響。
items.scrolls.exotic.scrollofantimagic.name=反魔法捲軸
items.scrolls.exotic.scrollofchallenge$challengearena.desc=你周圍出現了一個魔法競技場，周圍瀰漫著翻滾的紅色迷霧。站在迷霧中，你的飢餓值不會增加，並且受到的所有傷害減少33。如果你有其他減傷效果（例如護甲），這些效果會在減傷之後生效。剩餘回合數：2。
items.scrolls.exotic.scrollofchallenge$challengearena.name=挑戰競技場
items.scrolls.exotic.scrollofchallenge.desc=朗讀此捲軸時，會發出震耳欲聾的咆哮，吸引敵人靠近使用者，同時在其周圍生成一個小型競技場。只要朗讀者待在這個競技場內，就能減少33%的傷害（此效果優先於其他傷害減免），且不會失去飽食度。競技場的大小會根據朗讀者所在區域的大小而改變。在某些首領戰區域，競技場會特別小。
items.scrolls.exotic.scrollofchallenge.name=挑戰捲軸
items.scrolls.exotic.scrollofdivination$wnddivination.desc=你的占卜捲軸已確定以下物品：
items.scrolls.exotic.scrollofdivination.desc=此捲軸將隨機識別四種你目前未知的物品類型。辨識出的物品類型可能是藥水的顏色、捲軸上的符文或戒指上的寶石。辨識出的物品不一定會是你目前攜帶的物品。
items.scrolls.exotic.scrollofdivination.name=占卜捲軸
items.scrolls.exotic.scrollofdivination.nothing_left=已經沒有什麼可以辨認的了！
items.scrolls.exotic.scrollofdread.desc=閱讀此捲軸後，會發出一道紅光，令視野內的所有敵人陷入極度恐懼之中。此效果極為強大，他們會迅速逃離整個地牢，從此消失無蹤！如同恐懼效果一樣，此效果會隨時間流逝或敵人受到攻擊而消失。意志堅定的敵人，例如首領，則會受到普通的恐懼效果影響。
items.scrolls.exotic.scrollofdread.name=恐懼捲軸
items.scrolls.exotic.scrollofenchantment.armor=選擇一個符文應用在你的盔甲上。
items.scrolls.exotic.scrollofenchantment.cancel=取消
items.scrolls.exotic.scrollofenchantment.cancel_warn=取消操作仍然會消耗你的附魔捲軸，你確定嗎？
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=不，我改變主意了。
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=是的，我確定
items.scrolls.exotic.scrollofenchantment.desc=這張捲軸能將強大的魔法能量注入武器或盔甲中。讀者甚至可以在一定程度上控制注入的是哪種魔法。
items.scrolls.exotic.scrollofenchantment.inv_title=給物品附魔
items.scrolls.exotic.scrollofenchantment.name=魔法捲軸
items.scrolls.exotic.scrollofenchantment.weapon=選擇一種附魔方式應用在你的武器上。
items.scrolls.exotic.scrollofforesight.desc=閱讀此捲軸後，周圍地形的細節將以水晶般清晰的形態持續呈現在讀者腦海中。此效果持續相當長的時間，並會揭示所有隱藏的門或陷阱，使搜尋變得毫無必要。
items.scrolls.exotic.scrollofforesight.name=預見捲軸
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取消操作仍然會消耗你的變形捲軸，你確定嗎？
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=選擇一項天賦去蛻變。
items.scrolls.exotic.scrollofmetamorphosis.desc=此捲軸蘊含強大的變形魔法，其效果作用於施法者而非物品。捲軸的魔法允許你選擇一個天賦，並將其替換為五個來自不同英雄職業的同等級天賦之一！此效果僅適用於職業天賦，不適用於次職業或護甲技能。你無法使用的天賦將不會顯示在選項中。
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=蛻變天賦
items.scrolls.exotic.scrollofmetamorphosis.name=變形捲軸
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=選擇一項新天賦來替換你已蛻變的天賦。
items.scrolls.exotic.scrollofmysticalenergy.desc=這張羊皮紙中蘊藏著原始的魔法力量，釋放後會逐漸為使用者裝備的神器充能。
items.scrolls.exotic.scrollofmysticalenergy.name=神秘能量捲軸
items.scrolls.exotic.scrollofpassage.desc=這張羊皮紙上的咒語能瞬間將讀者傳送到離自己最近的、位於其上方一樓的區域。非常適合快速前往商店。
items.scrolls.exotic.scrollofpassage.name=通道捲軸
items.scrolls.exotic.scrollofprismaticimage.desc=此捲軸上的咒語將創造出一個色彩斑斕的幻象，與施法者形成鏡像。這個稜鏡般的幻像如同施法者的弱化版，防禦力與施法者相似，但生命值和攻擊力較低。當敵人出現時，棱鏡幻象便會現身，並試圖保護施法者。如果棱鏡幻像已存在，使用此捲軸將使其完全恢復。
items.scrolls.exotic.scrollofprismaticimage.name=棱鏡影像捲軸
items.scrolls.exotic.scrollofpsionicblast.desc=此捲軸蘊含著驚人的破壞性能量，可引導之摧毀所有可見生物的心智。然而，此能量會產生強烈的反作用力，閱讀者本身也會受到傷害、失明和虛弱。捲軸擊中的目標越多，自身受到的傷害就越小。
items.scrolls.exotic.scrollofpsionicblast.name=靈能衝擊捲軸
items.scrolls.exotic.scrollofpsionicblast.ondeath=靈能衝擊會撕裂你的心智…
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=這個生物被海妖之歌捲軸的魔法迷惑了。被迷惑的角色將永久成為你的盟友，並將與你遇到的任何敵人戰鬥。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=著迷
items.scrolls.exotic.scrollofsirenssong.cancel=你必須選擇一個目標。
items.scrolls.exotic.scrollofsirenssong.desc=閱讀此捲軸會發出迷人的旋律，魅惑目標敵人，將其永久轉化為盟友！其他聽到此旋律的敵人會被暫時魅惑。特別強大的敵人可以抵抗魅惑效果，反而會被魅惑。
items.scrolls.exotic.scrollofsirenssong.name=海妖之歌捲軸
items.scrolls.exotic.scrollofsirenssong.no_target=捲軸無需指定目標即可啟動。
items.scrolls.exotic.scrollofsirenssong.prompt=選擇目標
items.scrolls.inventoryscroll.no=不，我改變主意了。
items.scrolls.inventoryscroll.warning=您確定要取消此次捲軸使用嗎？該捲軸之前未被識別，因此無論如何都會被消耗掉。
items.scrolls.inventoryscroll.yes=是的，我肯定
items.scrolls.scroll$placeholder.name=捲動
items.scrolls.scroll.ac_read=讀
items.scrolls.scroll.berkanan=貝爾卡南捲軸
items.scrolls.scroll.blinded=失明的時候是看不清楚捲軸的。
items.scrolls.scroll.cursed=你那本被詛咒的魔法書阻止你使用這張捲軸的魔法！不過，一張移除詛咒的捲軸或許夠強大，仍然有效…
items.scrolls.scroll.gyfu=GYFU捲軸
items.scrolls.scroll.isaz=伊薩茲捲軸
items.scrolls.scroll.kaunan=考南捲軸
items.scrolls.scroll.laguz=拉古茲捲軸
items.scrolls.scroll.mannaz=曼納茲捲軸
items.scrolls.scroll.naudiz=諾迪茲捲軸
items.scrolls.scroll.no_magic=免疫魔法時無法閱讀捲軸。
items.scrolls.scroll.odal=奧達爾捲軸
items.scrolls.scroll.raido=雷多的捲軸
items.scrolls.scroll.sowilo=索維洛捲軸
items.scrolls.scroll.tiwaz=提瓦茲捲軸
items.scrolls.scroll.unknown_desc=這張羊皮紙上寫滿了無法辨認的文字，標題處印著符文%s。誰知道大聲讀出它會發生什麼？
items.scrolls.scroll.yngvi=YNGVI捲軸
items.scrolls.scrollofidentify.desc=永久揭示單一物品的所有秘密。
items.scrolls.scrollofidentify.inv_title=識別一個項目
items.scrolls.scrollofidentify.it_is=您的物品已被識別：%s。
items.scrolls.scrollofidentify.name=鑑定卷軸
items.scrolls.scrolloflullaby.desc=舒緩的旋律會讓視野內的所有生物都進入深度睡眠，給你逃跑或對它們發動突襲的機會。
items.scrolls.scrolloflullaby.name=搖籃曲卷軸
items.scrolls.scrolloflullaby.sooth=捲軸奏出舒緩的旋律，你感到昏昏欲睡。
items.scrolls.scrollofmagicmapping.desc=閱讀此捲軸後，一幅清晰無比的圖像將深深烙印在你的記憶中，讓你清晰地了解關卡的佈局，並揭示所有隱藏的秘密。物品和生物的具體位置仍將未知。
items.scrolls.scrollofmagicmapping.layout=現在您應該已經了解關卡佈局了。
items.scrolls.scrollofmagicmapping.name=魔法地圖卷軸
items.scrolls.scrollofmirrorimage.copies=捲軸上會形成你的鏡像。
items.scrolls.scrollofmirrorimage.desc=此捲軸上的咒語將創造出讀者的幻影分身，這些分身將追擊他的敵人。
items.scrolls.scrollofmirrorimage.name=鏡像卷軸
items.scrolls.scrollofmirrorimage.no_copies=捲軸試圖創造出你的鏡像，但它們無處可去。
items.scrolls.scrollofrage.desc=大聲朗讀此捲軸，將發出震耳欲聾的咆哮，吸引所有敵人來到讀者面前，並激怒附近的敵人。
items.scrolls.scrollofrage.name=憤怒捲軸
items.scrolls.scrollofrage.roar=捲軸發出震耳欲聾的咆哮聲，響徹整個地牢！
items.scrolls.scrollofrecharging.desc=這張羊皮紙中蘊藏著原始的魔法力量，一旦釋放，就能將讀者的所有魔杖重新充滿能量。
items.scrolls.scrollofrecharging.name=充能卷軸
items.scrolls.scrollofrecharging.surge=一股能量湧遍全身，為你的魔杖注入活力！
items.scrolls.scrollofremovecurse.cleansed=你的物品散發出潔淨的光芒，邪惡的能量消散了！
items.scrolls.scrollofremovecurse.desc=此捲軸上的咒語將立即解除讀者武器、盔甲、戒指和隨身物品上任何可能阻止佩戴者移除它們的邪惡魔法。
items.scrolls.scrollofremovecurse.inv_title=清潔物品
items.scrolls.scrollofremovecurse.name=解除詛咒卷軸
items.scrolls.scrollofremovecurse.not_cleansed=你的物品發出淨化之光，但什麼事也沒發生。
items.scrolls.scrollofremovecurse.spirit=你的捲軸解救了受折磨的靈魂！
items.scrolls.scrollofretribution.blast=強大的魔法能量從捲軸中爆發而出！
items.scrolls.scrollofretribution.desc=這捲軸蘊含著毀滅性的能量，能將讀者的痛苦轉化為強大的力量。讀者越軟弱，造成的傷害就越大。在生命值極低的情況下，這捲軸可以瞬間殺死大多數敵人。然而，使用捲軸也會對使用者造成傷害，使其失明並變得虛弱。
items.scrolls.scrollofretribution.name=復仇捲軸
items.scrolls.scrollofteleportation.cant_reach=你無法瞬間移動到那裡。
items.scrolls.scrollofteleportation.desc=這張羊皮紙上的咒語能瞬間將讀者傳送到地牢某一層的隨機地點。它可以用來逃離危險境地，但運氣不好的讀者也可能發現自己身處在更危險的地方。
items.scrolls.scrollofteleportation.name=傳送卷軸
items.scrolls.scrollofteleportation.no_tele=傳送魔法失效了。
items.scrolls.scrollofteleportation.prompt=選擇傳送地點
items.scrolls.scrollofteleportation.tele=眨眼間，你就被傳送到了關卡中的另一個地點。
items.scrolls.scrollofterror.desc=一道紅光閃過，你視野內的所有生物都會驚恐萬分，轉身逃竄。攻擊逃跑的敵人可以驅散這種效果。
items.scrolls.scrollofterror.many=捲軸發出耀眼的紅光，怪物們四散奔逃！
items.scrolls.scrollofterror.name=恐懼卷軸
items.scrolls.scrollofterror.none=捲軸發出耀眼的紅光。
items.scrolls.scrollofterror.one=捲軸發出耀眼的紅光，%s 逃走了！
items.scrolls.scrolloftransmutation.desc=這張捲軸蘊含著強大的變形魔法。對符合條件的物品使用後，它會將物品轉化為同類型的其他物品。魔法甚至會保留物品的升級、附魔和符文。捲軸和藥水會被轉化為同類型的異種物品，反之亦然。
items.scrolls.scrolloftransmutation.inv_title=轉化物品
items.scrolls.scrolloftransmutation.morph=你的物品會變成別的東西！
items.scrolls.scrolloftransmutation.name=變形捲軸
items.scrolls.scrolloftransmutation.nothing=什麼有趣的事也沒發生。
items.scrolls.scrollofupgrade.desc=此捲軸可升級一件物品，提升其品質。魔杖的威力及充能次數將會增加；武器的傷害會更高或命中率會更高；盔甲能抵擋更多攻擊；戒指對配戴者的效果會增強。武器和盔甲的使用所需力量也會降低，並且物品上的所有詛咒都將被解除。
items.scrolls.scrollofupgrade.inv_title=升級物品
items.scrolls.scrollofupgrade.name=升級卷軸
items.scrolls.scrollofupgrade.remove_curse=升級捲軸可以清除你物品上的詛咒！
items.scrolls.scrollofupgrade.weaken_curse=升級捲軸可以削弱物品上的詛咒。
items.spells.alchemize$wndalchemizeitem.energize=轉化為 %d 能量
items.spells.alchemize$wndalchemizeitem.energize_1=將 1 轉化為 %d 能量
items.spells.alchemize$wndalchemizeitem.energize_all=將所有能量轉換為 %d 能量
items.spells.alchemize$wndalchemizeitem.sell=變成 %dg
items.spells.alchemize$wndalchemizeitem.sell_1=將 1 轉換為 %dg
items.spells.alchemize$wndalchemizeitem.sell_all=全部變成 %dg
items.spells.alchemize.desc=這個法術蘊含著類似煉金術壺的轉化力量。每次施法都能將一件物品（或一組物品）轉換為金幣或煉金能量。將藥水或捲軸轉化為能量甚至能辨識它們！一些煉金術道具可以在商店購買，但更多道具可以透過煉金術合成，只需將種子、符文石和少量煉金術能量組合即可。
items.spells.alchemize.name=煉金術
items.spells.alchemize.prompt=煉金術改造物品
items.spells.beaconofreturning.creatures=周圍生物的靈能光環暫時阻止你進行傳送。
items.spells.beaconofreturning.desc=這個精妙的法術賦予使用者返回指定地點的能力，無論距離遠近。法術效果僅在返回時消耗，可以設定任意次數，但只會記住最近一次設定的位置。
items.spells.beaconofreturning.desc_set=此信標設置在 %d 樓層的某個位置。
items.spells.beaconofreturning.name=回歸的燈塔
items.spells.beaconofreturning.preventing=這裡強大的魔法氣息阻止你使用魔法！
items.spells.beaconofreturning.set=信標已設定在您目前位置。
items.spells.beaconofreturning.wnd_body=設定將覆蓋信標先前設定的位置。返回將返回您上次設定的位置並消耗一次法術使用次數。
items.spells.beaconofreturning.wnd_return=返回
items.spells.beaconofreturning.wnd_set=放
items.spells.curseinfusion.desc=此法術會將DM-300中存在的強大邪惡魔法注入一件裝備。被施法的物品會立即受到詛咒，其原有的任何附魔或符文都會被覆蓋。對於武器、盔甲和魔杖，除了受到詛咒之外，物品還會獲得升級。詛咒注入的升級效果不會疊加，如果物品解除詛咒，所有升級效果都會消失。也可以使用多次詛咒注入來改變武器或盔甲上的詛咒。
items.spells.curseinfusion.inv_title=詛咒一件物品
items.spells.curseinfusion.name=詛咒灌注
items.spells.magicalinfusion.desc=此法術擁有與升級捲軸相同的魔法力量，但形式更加穩定。除了像普通升級捲軸一樣升級物品外，它永遠不會清除附魔、符文或詛咒。
items.spells.magicalinfusion.infuse=你的物品注入了神秘能量！
items.spells.magicalinfusion.inv_title=注入物品
items.spells.magicalinfusion.name=魔法灌注
items.spells.magicalporter.desc=這個法術能將施放的任何物品神奇地傳送過去。但與商人的信標不同，這些物品會被傳送到下一層首領關卡的入口處。
items.spells.magicalporter.inv_title=移植物品
items.spells.magicalporter.name=神奇的搬運工
items.spells.magicalporter.nowhere=你沒有地方可以轉移物品。
items.spells.phaseshift.desc=這個混亂的法術會將目標角色傳送到目前樓層的隨機位置，並使其眩暈一段時間。強大的敵人能夠抵抗眩暈效果。此法術可以指向目標，也可以指向施法者本身。
items.spells.phaseshift.name=相移
items.spells.phaseshift.no_target=那裡沒有可以傳送的東西。
items.spells.reclaimtrap.desc=此法術蘊含著DM-300機械能量的殘餘。當施放於已啟動的陷阱時，陷阱的力量將附著於你，使你能夠再次使用此法術釋放這股力量，並在任何你想要的位置觸發陷阱的效果。然而，某些陷阱可能無法在所有地方生效，且一次只能儲存一個陷阱。
items.spells.reclaimtrap.desc_trap=該法術目前已準備好觸發_%s。
items.spells.reclaimtrap.name=回收陷阱
items.spells.reclaimtrap.no_trap=那裡沒有陷阱。
items.spells.recycle.desc=這個法術包含一種低階變形魔法。雖然它對裝備無效，但可以將捲軸、藥水、種子、符文石或帶尖飛鏢隨機轉換為同類型的物品。
items.spells.recycle.inv_title=回收物品
items.spells.recycle.name=回收
items.spells.recycle.recycled=您的物品已回收為：%s。
items.spells.spell.ac_cast=投擲
items.spells.spell.discover_hint=你可以透過煉金術製作這個物品。
items.spells.spell.no_magic=處於魔法免疫狀態時無法施法。
items.spells.summonelemental.ac_imbue=浸潤
items.spells.summonelemental.desc=這個法術會引導用來製作它的元素餘燼的能量，讓你召喚一個友方元素生物與你並肩作戰！一次只能召喚一個元素生物，但你可以再次施放此法術，免費將元素生物召回。
items.spells.summonelemental.desc_chaos=該法術目前散發著混沌能量，它會召喚出一個混沌元素。你可以為其他物品附魔，但法術會失去目前的附魔效果。
items.spells.summonelemental.desc_fire=法術目前觸感滾燙，會召喚一個火元素。你可以為其他物品附魔，但法術會失去目前的附魔效果。
items.spells.summonelemental.desc_frost=法術目前帶有冰冷效果，會召喚出一個冰霜元素。你可以為其他物品附魔，但法術會失去目前的附魔效果。
items.spells.summonelemental.desc_newborn=該法術目前尚未附魔，會召喚一個沒有遠程攻擊能力的新生元素生物。你可以使用已鑑定的液態火焰藥水、冰霜藥水、充能捲軸或變形捲軸來強化該法術，使之後召喚的元素生物擁有完整的力量！
items.spells.summonelemental.desc_shock=法術目前散發著靜電能量，會召喚一個電擊元素。你可以為其他物品附魔，但法術會失去目前的附魔效果。
items.spells.summonelemental.imbue_prompt=賦予物品
items.spells.summonelemental.name=召喚元素
items.spells.targetedspell.inv_title=注入物品
items.spells.targetedspell.prompt=選擇目標
items.spells.telekineticgrab.cant_grab=你抓不到它。
items.spells.telekineticgrab.desc=此法術允許施法者遠程獲取某個地點的所有物品，或所有黏在敵人身上的投擲武器！它不能用於獲取其他人擁有的物品，也不能用於獲取箱子之類的容器。
items.spells.telekineticgrab.name=念動力抓取
items.spells.telekineticgrab.no_target=那裡沒有什麼可以拿的。
items.spells.unstablespell.desc=這顆黑色小方水晶的每個面上都刻有不斷變化的符文符號。啟動後，它會觸發一張隨機捲軸的效果。若視野範圍內有敵人，捲軸效果必定與戰鬥相關；否則，捲軸效果必定與非戰鬥相關。
items.spells.unstablespell.name=不穩定咒語
items.spells.wildenergy.desc=這個咒語蘊含著驅動DM-300的部分詛咒能量。施放後，它會為你的魔杖和穿戴的神器充能，同時也會隨機觸發一個詛咒魔杖效果。不過，你可以選擇這股詛咒魔法的射向方向。
items.spells.wildenergy.name=狂野的能量
items.stones.inventorystone.ac_use=使用
items.stones.runestone$placeholder.name=符文石
items.stones.runestone.discover_hint=你可以在地牢中隨機找到這件物品，或者透過煉金術製作它。
items.stones.stoneofaggression$aggression.desc=操縱魔法使附近所有敵人優先攻擊該角色。剩餘回合數：\n\n。
items.stones.stoneofaggression$aggression.name=目標
items.stones.stoneofaggression.desc=當這塊石頭投擲向友軍或敵軍時，附近所有敵人會在短時間內優先攻擊該角色。然而，首領級敵人可以抵抗此效果，大幅縮短持續時間並減少其爪牙的攻擊傷害。
items.stones.stoneofaggression.name=侵略之石
items.stones.stoneofaugmentation$wndaugment.cancel=沒關係
items.stones.stoneofaugmentation$wndaugment.choice=您希望改進哪些方面？
items.stones.stoneofaugmentation$wndaugment.damage=損害
items.stones.stoneofaugmentation$wndaugment.defense=防禦
items.stones.stoneofaugmentation$wndaugment.evasion=規避
items.stones.stoneofaugmentation$wndaugment.none=移除增強功能
items.stones.stoneofaugmentation$wndaugment.speed=速度
items.stones.stoneofaugmentation.desc=這塊符文石蘊含強大的魔法，可以強化裝備，以犧牲另一項屬性為代價來提升其某項屬性。將其用於武器上，可以提升速度或傷害。投擲武器的耐久度也會根據其速度成比例地增加或減少。將其用於盔甲上，可提升防禦力或閃避力。
items.stones.stoneofaugmentation.discover_hint=你可以從商店購買此物品，或透過煉金術製作。
items.stones.stoneofaugmentation.inv_title=增強物品
items.stones.stoneofaugmentation.name=增生石
items.stones.stoneofblast.desc=這塊符文石會在投擲到的位置立即爆炸。就像炸彈一樣，爆炸會對附近的一切物體造成傷害。
items.stones.stoneofblast.name=爆破石
items.stones.stoneofblink.desc=這塊符文石會將使用者傳送到它被投擲的位置。
items.stones.stoneofblink.name=眨眼之石
items.stones.stoneofclairvoyance.desc=這塊石頭會立即顯現出它周圍一大片區域內的所有地磚。它的效果甚至可以穿透牆壁。
items.stones.stoneofclairvoyance.name=透視之石
items.stones.stoneofdeepsleep.desc=這塊石頭丟向敵人時，會讓他們陷入深度魔法沉睡。陷入魔法沉睡的敵人會永遠沉睡，直到被喚醒。
items.stones.stoneofdeepsleep.name=深眠之石
items.stones.stoneofdetectmagic.desc=這塊符文石能夠探測物品上受到的魔法影響。用這塊符文石偵測一件未鑑定的物品，可以判斷它是否受到邪惡詛咒的影響，以及是否受到附魔或升級等正面魔法的影響。
items.stones.stoneofdetectmagic.detected_bad=你偵測到這件物品受到了邪惡魔法的影響！
items.stones.stoneofdetectmagic.detected_both=你偵測到這件物品同時受到正面和惡意魔法的影響！
items.stones.stoneofdetectmagic.detected_good=你偵測到這件物品受到正面魔法的影響！
items.stones.stoneofdetectmagic.detected_none=你沒有偵測到任何魔法影響這件物品。
items.stones.stoneofdetectmagic.inv_title=檢測物品
items.stones.stoneofdetectmagic.name=魔法偵測石
items.stones.stoneofdisarming.desc=這塊符文石蘊含著魔法，可以解除隱藏在地牢各處的惡意陷阱。它投擲到目標區域後，最多可以解除9個陷阱。
items.stones.stoneofdisarming.name=解除武裝之石
items.stones.stoneofenchantment.armor=你的盔甲在黑暗中閃閃發光！
items.stones.stoneofenchantment.desc=這塊符文石蘊含著強大的魔法。與升級捲軸不同，它不會直接提升物品的威力，而是會給武器或盔甲附魔，賦予其新的力量。
items.stones.stoneofenchantment.inv_title=給物品附魔
items.stones.stoneofenchantment.name=魔法石
items.stones.stoneofenchantment.weapon=你的武器在黑暗中會發光！
items.stones.stoneoffear.desc=這塊石頭丟向角色時，角色會極度恐懼，轉身逃跑。攻擊逃跑中的角色會縮短效果持續時間。
items.stones.stoneoffear.name=恐懼之石
items.stones.stoneofflock.desc=這塊符文石會在投擲地點附近短時間內召喚魔法綿羊。
items.stones.stoneofflock.name=羊群之石
items.stones.stoneofintuition$wndguess.break=你的直覺之石化為塵埃…
items.stones.stoneofintuition$wndguess.correct=正確。物品類型已識別！
items.stones.stoneofintuition$wndguess.incorrect=你的猜測是錯誤的。
items.stones.stoneofintuition$wndguess.text=猜猜這個未識別物品的類型。如果你猜對了，就能辨識出它的類型！
items.stones.stoneofintuition.break_info=直覺之石可以使用兩次才會損壞，_下次使用不會消耗石頭_。
items.stones.stoneofintuition.break_warn=你之前已經使用過直覺之石，所以_你下次使用將會消耗一塊直覺之石_。
items.stones.stoneofintuition.desc=這塊符文石蘊含著一種威力較弱的鑑定捲軸魔法。它並非直接鑑定物品，而是運用你的直覺，讓你透過猜測來嘗試辨識藥水、捲軸或戒指的類型。
items.stones.stoneofintuition.inv_title=選擇一個項目
items.stones.stoneofintuition.name=直覺之石
items.stones.stoneofshock.desc=這塊符文石會釋放出一股電能，短暫地使附近所有目標昏迷，並且每擊中一個目標，就會為投擲魔杖增加一次充能。
items.stones.stoneofshock.name=震驚之石
items.stylus.ac_inscribe=題
items.stylus.cursed=觸控筆的魔法對詛咒盔甲無效。
items.stylus.desc=這支神秘的觸控筆由某種深色、極其堅硬的石頭製成。用它可以將魔法符文刻在你的盔甲上，但你無法選擇刻的符文是什麼，觸控筆會替你決定。
items.stylus.identify=你必須先確定那件盔甲是否被詛咒了。
items.stylus.inscribed=你用觸控筆在盔甲上刻字。
items.stylus.name=神秘觸控筆
items.stylus.prompt=選擇一件盔甲
items.tengusmask.ac_wear=穿
items.tengusmask.desc=天狗死後，面具從他臉上脫落，你能感受到其中散發出的強大魔力。這面具是天狗力量的泉源嗎？戴上面具後，其強大的力量將轉移到你身上，使你能夠為你的英雄選擇一個子職業。你會選擇哪個子職業呢？
items.tengusmask.discover_hint=你可以從某些敵人身上掉落此物品。
items.tengusmask.name=天狗的面具
items.tengusmask.used=面具在力量流入你體內時便會消散！
items.torch.ac_light=光
items.torch.desc=火把是冒險者的必備品，當地牢陷入黑暗時，它可以指引方向。
items.torch.name=火炬
items.trinkets.chaoticcenser.desc=這件煉金術物品在煉金術中放置一段時間後，這隻焚香爐似乎會自行冒煙！這些氣體不斷積聚，並會以半隨機的間隔從爐中噴向敵人。它似乎能夠產生各種各樣的氣體，但在焚香爐啟動前，你會得到短暫的預警。
items.trinkets.chaoticcenser.name=混亂的香爐
items.trinkets.chaoticcenser.spew=你的香爐即將噴出：%s。
items.trinkets.chaoticcenser.stats_desc=目前等級下，這件飾品大約每隔_%d_回合會在敵人附近生成一團有害氣體。氣體只會在有敵人出現時才會生成。等級越高，這些氣體越有可能變得奇特且威力強大。
items.trinkets.chaoticcenser.typical_stats_desc=通常情況下，這件飾品大約每隔_%d_回合會在敵人附近生成一種有害氣體。氣體只會在有敵人出現時才會生成。等級越高，這些氣體越有可能變得奇特且威力強大。
items.trinkets.crackedspyglass.desc=如果不是前鏡片上的裂縫，這台手持望遠鏡堪稱精湛工藝的典範。這台望遠鏡似乎能幫助你發現地牢中的新物品，但由於它的缺陷，發現的物品很難看清！
items.trinkets.crackedspyglass.name=破裂的望遠鏡
items.trinkets.crackedspyglass.stats_desc=目前等級，此飾品有 _%1$s%% 的幾率在每個非首領樓層產生一個額外的隱藏物品。
items.trinkets.crackedspyglass.stats_desc_upgraded=目前等級，該飾品有 _100%% 的幾率在每個非首領樓層生成一個額外的隱藏物品，有 _%1$s%% 的幾率生成第二個額外的隱藏物品。
items.trinkets.crackedspyglass.typical_stats_desc=通常情況下，這個飾品有 _%1$s%% 的幾率在每個非 Boss 層產生額外的隱藏物品。
items.trinkets.dimensionalsundial.desc=這個小小的手持日晷，即使你沒有把它豎直拿著，也能在地牢深處投射出影子。更奇怪的是，影子的位置似乎與這個世界的太陽毫無關聯。當日晷沒有投射出影子時，它似乎就會招來危險。
items.trinkets.dimensionalsundial.name=立體日晷
items.trinkets.dimensionalsundial.stats_desc=就目前而言，這件飾品會在現實生活中的白天（上午 8 點至晚上 8 點）將敵人的生成率降低 _%1$d%%_，並在夜晚（晚上 8 點至次日早上 8 點）將敵人的生成率提高 _%2$d%%Q。
items.trinkets.dimensionalsundial.typical_stats_desc=通常情況下，這個飾品會在現實生活中的白天（上午 8 點至晚上 8 點）將敵人的生成率降低 _%1$d%%_，並在夜晚（晚上 8 點至早上 8 點）將敵人的生成率提高 _%2$d%%_。
items.trinkets.dimensionalsundial.warning=日晷沒有投下陰影，你感到不安。
items.trinkets.exoticcrystals.desc=這些粉紅色的小晶體形狀與煉金能量晶體相同。雖然它們不能直接用於獲取能量，但似乎會對你找到的藥劑和捲軸產生某種影響。
items.trinkets.exoticcrystals.name=奇異水晶
items.trinkets.exoticcrystals.stats_desc=目前，此飾品會將掉落的藥水或捲軸替換為對應的異域版本。但力量藥水、升級捲軸以及用於解決危險房間的物品不受影響。
items.trinkets.exoticcrystals.typical_stats_desc=通常情況下，這件飾品會將掉落的藥水或捲軸替換為對應的稀有物品。但這不會影響力量藥水、升級捲軸或用於解決危險房間的物品。
items.trinkets.eyeofnewt.desc=這種金黑色的蠑螈眼珠原本是常見的材料，如今卻被製成了飾品。據說，這隻眼睛會降低你的視力，但能讓你以其他方式看待事物。
items.trinkets.eyeofnewt.name=蠑螈眼
items.trinkets.eyeofnewt.stats_desc=目前等級的這個飾品會將你的視野範圍減少_%1$s%%_，但也會賦予你對_%2$d_格內敵人的心靈視覺。
items.trinkets.eyeofnewt.typical_stats_desc=通常情況下，這款飾品會將你的視野範圍減少_%1$s%%_，但也會賦予你對_%2$d_格內敵人的心靈視覺。
items.trinkets.ferrettuft.desc=一撮絲滑的白色雪貂毛，用一條亮綠色的絲帶綁成蝴蝶結。雪貂以敏捷、淘氣和不守規矩而聞名。這件小飾品似乎也散發著雪貂的某種魔力，增強了它躲避附近一切事物的能力。
items.trinkets.ferrettuft.name=雪貂毛簇
items.trinkets.ferrettuft.stats_desc=在目前等級下，該飾品將使所有角色的閃避率提高_%1$s%%_。
items.trinkets.ferrettuft.typical_stats_desc=通常情況下，這個飾品會使所有角色的閃避率提高_%1$s%%_。
items.trinkets.mimictooth.desc=這顆又大又尖的牙齒一定是從一個非常不高興的擬態怪身上拔下來的。它似乎對地牢裡的擬態怪產生了影響，使它們出現得更頻繁，也更加危險。
items.trinkets.mimictooth.name=仿生牙
items.trinkets.mimictooth.stats_desc=目前，這件飾品會讓各種擬態怪_%1$sx_出現頻率更高，更難被發現，但同時也會增加它們掉落的戰利品數量。此外，每個地牢樓層都有_%2$s%%_的幾率額外出現一隻隱密的烏木擬態怪。
items.trinkets.mimictooth.typical_stats_desc=通常情況下，這件飾品會使各種擬態怪出現頻率更高，更難被發現，但同時也會增加它們掉落的戰利品數量。此外，每個地牢樓層都有一定幾率出現一隻額外的隱密烏木擬態怪。
items.trinkets.mossyclump.desc=這團濕漉漉的苔蘚似乎無論你怎麼用力擠壓都無法保持水分。它好像與地牢本身有著某種神奇的聯繫，使得草和水更容易出現。
items.trinkets.mossyclump.name=苔蘚叢
items.trinkets.mossyclump.stats_desc=在目前等級下，此飾品會使_%d%%_個無主題樓層變成充滿水或草地。 \n\n升級此飾品需要消耗更多能量。
items.trinkets.mossyclump.typical_stats_desc=通常情況下，這個飾品會讓_%d%%_的非主題樓層變成充滿水或草。 \n\n升級這個飾品需要消耗更多能量。
items.trinkets.parchmentscrap.desc=這張小小的羊皮紙碎片看起來像是從捲軸上撕下來的。它保留了一些魔法，而且似乎對地牢裡找到的武器和盔甲有著影響。
items.trinkets.parchmentscrap.name=羊皮紙碎片
items.trinkets.parchmentscrap.stats_desc=在目前等級下，此飾品可將附魔和符文變為普通品質，武器和盔甲上的詛咒變為普通品質。魔杖、戒指或神器上的詛咒不受影響。升級此飾品需要消耗更多能量。
items.trinkets.parchmentscrap.typical_stats_desc=通常情況下，這件飾品會將附魔和符文_%dx_變為普通品質，並將武器和盔甲上的詛咒_%sx_變為普通品質。魔杖、戒指或神器上的詛咒不受影響。 \n\n升級這件飾品需要消耗更多能量。
items.trinkets.petrifiedseed.desc=這顆種子已經化石化，可能是緩慢的地質過程或魔法作用的結果。這顆種子似乎以某種魔法影響地牢中的植物群落，偶爾會將植物種子替換成符文石。
items.trinkets.petrifiedseed.name=石化種子
items.trinkets.petrifiedseed.stats_desc=目前的等級，這個飾品會使被踩踏的草有 _%1$s%%_ 次掉落符文石而不是種子，也會使高高的草更容易掉落物品 _%2$s%%_。
items.trinkets.petrifiedseed.typical_stats_desc=通常情況下，這個飾品會讓被踩踏的草掉落符文石而不是種子，並且會讓高高的草更頻繁地掉落物品。
items.trinkets.ratskull.desc=這件詭異的小玩意兒比一般老鼠的頭骨大不了多少，而老鼠在這個地牢裡卻十分罕見。這顆頭骨似乎蘊含著某種魔法力量，吸引地牢裡那些更稀有的生物，使它們出現的頻率大大增加。
items.trinkets.ratskull.name=老鼠頭骨
items.trinkets.ratskull.stats_desc=就目前等級而言，這件飾品會使稀有異域敵人_%dx_出現的機率增加一半。然而，骷髏頭對吸引水晶擬態怪和裝甲雕像的效果只有原來的一半。
items.trinkets.ratskull.typical_stats_desc=通常情況下，這件飾品會提高稀有異域敵人_%dx_出現的機率。然而，骷髏頭對吸引水晶擬態怪和裝甲雕像的效果只有一半。
items.trinkets.saltcube.desc=這塊巨大的鹽晶被切割成近乎完美的立方體形狀，它非但沒有溶解，反而吸走了煉金鍋裡一半的水。它似乎具有神奇的脫水和保存食物的功效，能延長飽足感，但同時也會降低非飢餓狀態下的生命值恢復速度。
items.trinkets.saltcube.name=鹽塊
items.trinkets.saltcube.stats_desc=目前等級的這個飾品可以增加你飢餓前的持續時間_%1$s%%_，但也會降低你的生命恢復速度_%2$s%%_，除非該樓層被鎖定。
items.trinkets.saltcube.typical_stats_desc=通常情況下，這個飾品會使你的飢餓時間延長_%1$s%%_，但也會降低你的生命值恢復速度_%2$s%%_，除非該樓層被鎖定。
items.trinkets.shardofoblivion$thrownusetracker.desc=你最近使用了一件未鑑定的投擲武器，這件武器在一段時間內會被視為一件已使用的未鑑定裝備，計入湮滅碎片。剩餘回合數：\n\n。
items.trinkets.shardofoblivion$thrownusetracker.name=使用身份不明的投擲武器
items.trinkets.shardofoblivion$wandusetracker.desc=你最近使用了一根未鑑定的魔杖，在一段時間內，它會被計為一件已使用的未鑑定裝備，用於遺忘碎片。剩餘回合數：\n\n。
items.trinkets.shardofoblivion$wandusetracker.name=使用身份不明的魔杖
items.trinkets.shardofoblivion.ac_identify=確認
items.trinkets.shardofoblivion.desc=這塊被詛咒的金屬碎片在煉金鍋裡熬了一段時間後，竟然變成了……虛無？光線似乎會繞著它彎曲，而且當你不握住它時，它會懸浮在空中。這塊碎片似乎以魔法的方式汲取你的無知，所以最好別想太多。
items.trinkets.shardofoblivion.identify=你認出這件物品了！
items.trinkets.shardofoblivion.identify_not_yet=該物品尚未準備好進行鑑定。
items.trinkets.shardofoblivion.identify_prompt=識別一個項目
items.trinkets.shardofoblivion.identify_ready=物品已準備好鑑定：%s。使用你的湮滅碎片進行鑑定。
items.trinkets.shardofoblivion.identify_ready_worn=你所有穿戴過的物品現在都可以進行鑑定了。使用你的湮滅碎片對物品進行鑑定。
items.trinkets.shardofoblivion.name=遺忘碎片
items.trinkets.shardofoblivion.stats_desc=目前，這件飾品會使敵人掉落戰利品的幾率提高20%%，每件你裝備或最近使用過的未鑑定裝備增加一次掉落，最多可增加_%d件_。該碎片還會阻止你鑑定裝備，但可用於手動鑑定已準備好鑑定的物品。
items.trinkets.shardofoblivion.typical_stats_desc=通常情況下，這件飾品會使敵人掉落戰利品的幾率提高20%%，每件你裝備或最近使用過的未鑑定裝備增加20%%，最多可增加_%d件_。該碎片還會阻止你鑑定裝備，但可用於手動鑑定已準備好鑑定的物品。
items.trinkets.thirteenleafclover.desc=不知為何，這株三葉草在煉金鍋裡熬煮後竟然長出了好多額外的葉子！這件飾品究竟是吉利還是厄運還真不好說，或許它會讓你的運氣更加捉摸不定？
items.trinkets.thirteenleafclover.name=十三葉三葉草
items.trinkets.thirteenleafclover.stats_desc=目前等級的這個飾品會使你在_%1$d%%_次造成最大傷害，在_%2$d%%_次造成最小傷害。
items.trinkets.thirteenleafclover.typical_stats_desc=通常情況下，這款飾品會讓你在_%1$d%%_天造成最大傷害，在_%2$d%%_天造成最小傷害。
items.trinkets.trapmechanism.desc=這是地牢中一個陷阱的核心部件，精心雕刻在地板上以便攜帶。它似乎與地牢本身有著某種魔法聯繫，使危險地形更加常見，同時也提升了你與該地形的親和力。
items.trinkets.trapmechanism.name=陷阱機制
items.trinkets.trapmechanism.stats_desc=目前，這件飾品將使_%1$d%%_個無主題樓層變成佈滿陷阱或深淵。此外，地牢中_%2$d%%_個隱藏陷阱也會變得可見。
items.trinkets.trapmechanism.typical_stats_desc=通常情況下，這件飾品會讓_%1$d%%_部分原本沒有主題的樓層變成佈滿陷阱或深淵。此外，地牢中_%2$d%%_部分隱藏陷阱也會變得可見。
items.trinkets.trinket$placeholder.name=小飾品
items.trinkets.trinket.discover_hint=當你透過煉金術製作飾品時，該物品有一定幾率成為可選物品。
items.trinkets.trinketcatalyst$randomtrinket.desc=附近有一件物品卡在一個你打不開的小袋子裡。煉金術會溶解這個小袋子，但你不做煉金術就不知道會得到什麼小玩意兒！
items.trinkets.trinketcatalyst$randomtrinket.name=隨機小飾品
items.trinkets.trinketcatalyst.desc=這團神奇的金色粉末在地牢的黑暗中閃爍。只需少量煉金能量，即可將此催化劑用於煉金鍋，製作出獨特的飾品。飾品能提供各種不同的效果，略微改變地牢或其居民的屬性。飾品可以消耗更多能量進行升級，增強其效果；也可以丟棄飾品，使其完全失去效果。
items.trinkets.trinketcatalyst.name=魔法催化劑
items.trinkets.trinketcatalyst.window_text=加入催化劑後，水開始發光。附近有一些物品可以注入能量，變成魔法飾品。
items.trinkets.trinketcatalyst.window_title=製作一件小飾品
items.trinkets.vialofblood.desc=這個細長的試管裡裝著地牢裡某個居民的血液，當你旋轉試管時，血液會緩慢流動。它似乎能以某種魔法增強治療效果，但同時也會延緩治療的生效。
items.trinkets.vialofblood.name=一小瓶血
items.trinkets.vialofblood.stats_desc=在當前等級下，此飾品可使你從飲用治療藥水、水袋或生命之泉中獲得的生命值增加_%1$s%%_。但是，這些治療效果的恢復速度也會變慢，每回合最多恢復_%2$s_點生命值（此數值隨英雄等級提升）。
items.trinkets.vialofblood.typical_stats_desc=通常情況下，這件飾品會使你從飲用治療藥水、水袋或生命之泉中獲得的生命值增加_%1$s%%_。但是，這些治療效果的恢復速度也會變慢，每回合最多恢復_%2$s_點生命值（此數值隨英雄等級提升）。
items.trinkets.wondrousresin.desc=這款閃著藍光的樹脂似乎蘊含著被詛咒魔杖魔法的精華。煉金術坩堝中的魔法似乎使其穩定了一些，現在它正在影響你的魔杖。
items.trinkets.wondrousresin.name=奇妙的樹脂
items.trinkets.wondrousresin.stats_desc=在當前等級下，此飾品有 _%1$s%%_ 的機率使詛咒魔杖的效果變為中性或正面效果，並且有 _%2$s%%_ 的機率使未詛咒的魔杖額外釋放一次中性或正面的詛咒電擊。升級此飾品需要消耗更多能量。
items.trinkets.wondrousresin.typical_stats_desc=通常情況下，這件飾品會使詛咒魔杖的效果在一定機率下變為中性或正面效果，並且會使未詛咒的魔杖在一定機率下額外釋放一次中性或正面的詛咒電擊。升級這件飾品需要消耗更多能量。
items.wands.cursedwand.disguise=你的外表會在你眼前改變！
items.wands.cursedwand.fire=你聞到了燒焦的味道…
items.wands.cursedwand.grass=你周圍的草叢突然冒了出來！
items.wands.cursedwand.gravity=重力突然開始向隨機方向拉扯！
items.wands.cursedwand.gravity_end=重力混亂結束了。
items.wands.cursedwand.gravity_positive=重力突然開始向隨機方向拉扯，但這似乎並沒有影響到你。
items.wands.cursedwand.mass_invuln=你的魔杖迸發出耀眼的光芒！
items.wands.cursedwand.nothing=什麼也沒發生。
items.wands.cursedwand.ondeath=你被你自己的 %s 殺死了。
items.wands.cursedwand.petrify=你突然僵在了原地！
items.wands.cursedwand.sinkhole=你周圍的地面開始塌陷！
items.wands.cursedwand.sinkhole_positive=地面開始下陷，但感覺腳下還算穩固。
items.wands.cursedwand.supernova=一團熾熱的能量球開始膨脹。你最好趕緊跑！
items.wands.cursedwand.supernova_positive=一個熾熱的能量球開始膨脹，但不知為何卻讓人感覺很安全。
items.wands.cursedwand.transmogrify_other=你的物品會變成別的東西！
items.wands.cursedwand.transmogrify_wand=你的魔杖變成了另一個物品！
items.wands.damagewand.upgrade_stat_name_1=魔法傷害
items.wands.wand$placeholder.name=魔杖
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=這個 %s 被詛咒了！
items.wands.wand.cursed=這根魔杖被詛咒了，它的魔法混亂而隨機。
items.wands.wand.fizzles=你的魔杖沒電了；它一定是電量不足。
items.wands.wand.identify=你現在已經夠熟悉你的魔杖，能夠認出它了。
items.wands.wand.no_magic=你的魔杖失效了；在魔法免疫狀態下，你無法使用魔杖。
items.wands.wand.not_cursed=這根魔杖沒有邪惡魔法。
items.wands.wand.prompt=選擇要傳送的位置
items.wands.wand.resin_many=這根魔杖從神秘樹脂中獲得了_%d層數_。
items.wands.wand.resin_one=這根魔杖因吸收了奧術樹脂而提升了 1 級。
items.wands.wand.self_target=你不能以自己為目標！
items.wands.wandofblastwave.bmage_desc=當戰鬥法師使用衝擊波法杖攻擊麻痺狀態的敵人時，會消耗麻痺效果，造成額外魔法傷害。此效果對每個敵人都有短暫的冷卻時間。
items.wands.wandofblastwave.desc=這根魔杖由一種類似大理石的石頭製成，鑲有金邊，頂端鑲嵌著一顆圓形的黑色寶石。拿在手上很有分量。
items.wands.wandofblastwave.eleblast_desc=使用衝擊波法杖的元素衝擊可造成 67% 的傷害，並將所有敵人擊出衝擊範圍。
items.wands.wandofblastwave.knockback_ondeath=那場車禍奪走了你的生命…
items.wands.wandofblastwave.name=衝擊波魔杖
items.wands.wandofblastwave.ondeath=你用自己的衝擊波魔杖自殺了…
items.wands.wandofblastwave.staff_name=衝擊波之杖
items.wands.wandofblastwave.stats_desc=這根魔杖會射出一道光束，光束會在目標位置劇烈爆炸。爆炸威力巨大，可造成_%1$d-%2$d點傷害，足以將大多數敵人擊飛。
items.wands.wandofblastwave.typical_stats_desc=這根魔杖會射出一道光束，光束會在目標位置劇烈爆炸。爆炸威力通常為_%1$d-%2$d點傷害_，足以將大多數敵人擊飛。
items.wands.wandofblastwave.upgrade_stat_name_2=擊退
items.wands.wandofcorrosion.bmage_desc=當戰鬥法師用腐蝕法杖攻擊敵人時，敵人有幾率被腐蝕。
items.wands.wandofcorrosion.desc=這根魔杖杖身呈現灰白色，打開後會露出一顆璀璨的橘色寶石。
items.wands.wandofcorrosion.eleblast_desc=使用腐蝕法杖的元素爆炸會使敵人受到 4 回合的腐蝕效果，初始傷害為 6 點。
items.wands.wandofcorrosion.name=腐蝕之杖
items.wands.wandofcorrosion.staff_name=腐蝕人員
items.wands.wandofcorrosion.stats_desc=這根魔杖會射出一道光束，光束會在目標位置爆炸並釋放出一團高腐蝕性氣體。任何被這團氣體包圍的物體都會隨著時間推移而受到不斷增加的傷害，初始傷害值為_%d。
items.wands.wandofcorrosion.upgrade_stat_name_1=腐蝕損傷
items.wands.wandofcorrosion.upgrade_stat_name_2=氣體體積
items.wands.wandofcorruption.already_corrupted=那個性格無法再被改變。
items.wands.wandofcorruption.bmage_desc=當戰鬥法師用腐化法杖攻擊敵人時，敵人有幾率陷入狂暴狀態。
items.wands.wandofcorruption.desc=這根魔杖散發著混亂的黑暗能量，如果從它頂端的小骷髏裝飾造型還不夠明顯的話。
items.wands.wandofcorruption.eleblast_desc=使用腐化法杖的元素爆炸會使敵人陷入 5 回合的狂暴狀態。
items.wands.wandofcorruption.name=腐敗之杖
items.wands.wandofcorruption.staff_name=腐敗人員
items.wands.wandofcorruption.stats_desc=這根魔杖會釋放出一股腐蝕能量，削弱敵人，最終迫使他們屈服於你的意志。敵人能夠抵抗腐蝕，但虛弱的敵人比健康的敵人更容易被腐蝕。
items.wands.wandofcorruption.upgrade_stat_name_1=貪腐的權力
items.wands.wandofcorruption.upgrade_stat_name_2=減益效果持續時間
items.wands.wandofdisintegration.bmage_desc=當戰鬥法師使用分解法杖時，其攻擊範圍會增加，就像它具有投射魔法一樣。
items.wands.wandofdisintegration.desc=這根魔杖由一塊光滑的黑曜石實心製成，深紫色的光芒沿著杖身向上延伸，直至杖尖。它散發著毀滅性的能量，隨時準備向前噴射。
items.wands.wandofdisintegration.eleblast_desc=使用分解法杖釋放的元素衝擊波可造成 100% 的傷害，並能穿透牆壁。
items.wands.wandofdisintegration.name=分解魔杖
items.wands.wandofdisintegration.staff_name=瓦解人員
items.wands.wandofdisintegration.stats_desc=這根魔杖發射的光束可以穿透任何障礙物，升級後射程更遠。光束造成_%1$d-%2$d點傷害，並且每穿透一個敵人或一面牆，都會造成額外傷害。
items.wands.wandofdisintegration.upgrade_stat_name_2=最大射程
items.wands.wandoffireblast.bmage_desc=當戰鬥法師使用火焰衝擊法杖攻擊敵人時，有幾率引發爆炸，對敵人造成傷害併吞噬附近所有火焰！敵人周圍火焰越多，引發爆炸的幾率越高。
items.wands.wandoffireblast.desc=這根魔杖由塗有紅漆的木製成，並大量貼有金箔，顯得十分華麗。杖尖發出劈啪聲和嘶嘶聲，彷彿隨時準備釋放其強大的魔法。
items.wands.wandoffireblast.eleblast_desc=使用火焰衝擊法杖進行元素衝擊，可造成 100% 的傷害，炸開大門，並點燃敵人和地形。
items.wands.wandoffireblast.name=火焰衝擊魔杖
items.wands.wandoffireblast.staff_name=火焰衝擊
items.wands.wandoffireblast.stats_desc=這根魔杖使用時會噴射出一道錐形火焰。它的下一次攻擊會消耗_%1$d點能量，並造成_%2$d-%3$d點傷害。魔杖消耗的能量越多，效果範圍越大、威力越強。
items.wands.wandoffireblast.upgrade_stat_name_1=1 點充能傷害
items.wands.wandoffireblast.upgrade_stat_name_2=2點充能傷害
items.wands.wandoffireblast.upgrade_stat_name_3=3點充能傷害
items.wands.wandoffrost.bmage_desc=當戰鬥法師用冰霜杖攻擊一個處於冰凍狀態的敵人時，有幾率使其立即凍結。敵人越是處於冰凍狀態，凍結的幾率就越高。
items.wands.wandoffrost.desc=這根魔杖似乎是用某種魔法冰製成的。它的光芒越靠近圓潤的杖尖越亮。握在手裡感覺非常冰冷，但不知為何，你的手卻依然溫暖。
items.wands.wandoffrost.eleblast_desc=使用冰霜法杖釋放元素衝擊，可造成 100% 的傷害，凍結敵人，並撲滅火焰。
items.wands.wandoffrost.name=冰霜魔杖
items.wands.wandoffrost.staff_name=霜凍之杖
items.wands.wandoffrost.stats_desc=這根魔杖會向敵人發射冰冷能量衝擊波，造成_%1$d-%2$d點傷害並使其冰凍。在水中效果似乎更強。已被冰凍或冰凍的敵人所受到的傷害會降低。
items.wands.wandoffrost.upgrade_stat_name_2=冷卻時間
items.wands.wandoflightning$lightningcharge.desc=戰鬥法師目前能量充沛，使他免疫閃電法杖的攻擊，並增加閃電弧的範圍。剩餘回合數：\n\n。
items.wands.wandoflightning$lightningcharge.name=帶電
items.wands.wandoflightning.bmage_desc=當戰鬥法師用閃電法杖攻擊敵人時，有幾率為自己充能，持續10回合。充能期間，戰鬥法師免疫閃電傷害，並且能更遠距離釋放閃電。
items.wands.wandoflightning.desc=這根魔杖由實心金屬製成，因此出乎意料地重。杖尖的兩個叉狀物彎曲匯合，電流在它們之間產生電弧。
items.wands.wandoflightning.eleblast_desc=使用閃電法杖進行元素爆炸，可造成 100% 的傷害，使敵人昏迷 5 回合，並使水帶電。
items.wands.wandoflightning.name=閃電魔杖
items.wands.wandoflightning.ondeath=你用自己的閃電魔杖自殺了…
items.wands.wandoflightning.staff_name=閃電權杖
items.wands.wandoflightning.stats_desc=這根魔杖會釋放出強大的閃電，穿透它所擊中的目標，造成_%1$d-%2$d點傷害。這種電流會波及附近的敵人，並且在水中更容易擴散。這根魔杖釋放的閃電會傷害你，但不會傷害你的隊友。
items.wands.wandoflivingearth$earthguardian.desc=你手中的活土魔杖所召喚的岩石已經化為一個守護你的大地衛士！這個岩石衛士會攻擊附近的敵人，迫使他們攻擊衛兵而不是你。當所有威脅都消失後，衛兵會在你周圍重新凝聚，並在下次使用魔杖時再次出現。
items.wands.wandoflivingearth$earthguardian.discover_hint=你可以用特定的魔杖找到這個角色。
items.wands.wandoflivingearth$earthguardian.name=大地守護者
items.wands.wandoflivingearth$earthguardian.wand_info=守護者的防禦力與你的魔杖等級掛鉤。它目前可以抵擋_%1$d-%2$d點傷害。
items.wands.wandoflivingearth$rockarmor.desc=魔法岩石環繞著你的身體，當你受到攻擊時，它們會嘗試為你格擋，並減少你受到的傷害50點。然而，每次格擋都會刮掉一些岩石。剩餘護甲：如果圍繞你聚集的岩石足夠多，你下一次使用活土魔杖的攻擊會使岩石凝聚成一個守護者，與你並肩作戰。守護者所需的護甲：
items.wands.wandoflivingearth$rockarmor.desc_many=這位大地守護者也受益於「眾生之力」。剩餘回合數：%d。
items.wands.wandoflivingearth$rockarmor.name=岩石護甲
items.wands.wandoflivingearth.bmage_desc=當戰鬥法師用活土法杖攻擊敵人時，造成的傷害的一部分會轉化為岩石護甲返回。
items.wands.wandoflivingearth.desc=這根魔杖由一種奇特的岩石製成，上面閃爍著黃色的能量條紋。當你握住魔杖時，這些岩石似乎會微微移動，彷彿它們能感受到你的手。
items.wands.wandoflivingearth.eleblast_desc=使用活土法杖的元素衝擊可造成 50% 的傷害，並且每擊中一個敵人，即可治療一名活躍的土元素守護者。
items.wands.wandoflivingearth.name=活土魔杖
items.wands.wandoflivingearth.staff_name=活地球的工作人員
items.wands.wandoflivingearth.stats_desc=這根魔杖會向敵人發射魔法岩石，造成_%1$d-%2$d點傷害。岩石隨後會在使用者周圍重新凝聚，根據造成的傷害量為其提供護甲。如果護甲累積到一定程度，魔杖下次施法時會形成一個岩石守衛。
items.wands.wandoflivingearth.upgrade_stat_name_2=守護者最大生命值
items.wands.wandoflivingearth.upgrade_stat_name_3=守護者阻擋
items.wands.wandofmagicmissile$magiccharge.desc=你的魔法飛彈魔杖已將能量回饋給你的其他魔杖，提升了下一次魔法攻擊的有效等級。你的魔杖威力提升至：+%d.\n\n剩餘魔法充能回合數：%s.
items.wands.wandofmagicmissile$magiccharge.name=魔法充能
items.wands.wandofmagicmissile.bmage_desc=當戰鬥法師用魔法飛彈法杖攻擊敵人時，除了他的法杖之外，他所有的魔杖都會獲得充能。
items.wands.wandofmagicmissile.desc=這根外觀樸素的魔杖能發射純粹的魔法能量彈。雖然魔杖本身沒有任何特殊效果，但它擁有更多的充能次數，並且在升級後可以短暫地強化其他魔杖。
items.wands.wandofmagicmissile.discover_hint=其中一位英雄初始就擁有這件物品。
items.wands.wandofmagicmissile.eleblast_desc=使用魔法飛彈法杖的元素衝擊可造成 50% 的傷害，並使法師獲得 15 回合的冷卻時間。
items.wands.wandofmagicmissile.name=魔杖魔法飛彈
items.wands.wandofmagicmissile.staff_name=魔法飛彈法杖
items.wands.wandofmagicmissile.stats_desc=這根魔杖射出的每一支箭都會造成_%1$d-%2$d點傷害，如果升級的話，還會短暫地強化其他魔杖。
items.wands.wandofprismaticlight.bmage_desc=當戰鬥法師用棱彩光杖攻擊敵人時，敵人將被削弱，削弱持續時間隨法杖等級而增加。
items.wands.wandofprismaticlight.desc=這根魔杖由一整塊半透明的水晶製成，就像一塊光滑的長玻璃。五彩斑斕的光芒在魔杖尖端翩翩起舞，彷彿隨時都會迸發出來。
items.wands.wandofprismaticlight.eleblast_desc=使用棱彩光杖的元素爆炸可造成 67% 的傷害，揭示爆炸範圍內的所有地形，並使敵人失明 5 回合。
items.wands.wandofprismaticlight.name=棱鏡之光魔杖
items.wands.wandofprismaticlight.staff_name=棱鏡之光權杖
items.wands.wandofprismaticlight.stats_desc=這根魔杖射出的光束能穿透地牢的黑暗，照亮隱藏區域和陷阱。光束能使敵人失明，並造成_%1$d-%2$d點傷害。惡魔和亡靈敵人會在魔杖的強光下燃燒，受到額外傷害。
items.wands.wandofprismaticlight.upgrade_stat_name_2=盲目機會
items.wands.wandofprismaticlight.upgrade_stat_name_3=光照持續時間
items.wands.wandofregrowth$dewcatcher.desc=露珠草是一種神奇的植物，它們會吸收大量的露水。為了不引人注目，它們會偽裝成草叢，但身上積聚的露水卻暴露了它們的行蹤。
items.wands.wandofregrowth$dewcatcher.discover_hint=你可以用特定的魔杖找到這種植物。
items.wands.wandofregrowth$dewcatcher.name=露捕手
items.wands.wandofregrowth$lotus.desc=金蓮花是一種神秘植物，只能透過強大的再生魔杖召喚而來。它的靈氣可以增強所有植物及其效果，但它會消耗自身能量，並在短時間內枯萎。
items.wands.wandofregrowth$lotus.discover_hint=你可以用特定的魔杖找到這種植物，但需要多次升級魔杖才能找到它。
items.wands.wandofregrowth$lotus.name=金蓮
items.wands.wandofregrowth$lotus.wand_info=這株蓮花是由一根再生魔杖（_+%1$d_）培育而成。所有受其效果影響的植物，如果種植在角色身上，都會立即生效。植物還有一定幾率（_%2$d%%）掉落種子，而帶有尖端的飛鏢消耗的耐久度會減少（_%3$d%%）。
items.wands.wandofregrowth$seedpod.desc=種子莢是一種神奇的植物，它們不會產生自己的種子，而是從其他植物中獲取種子。儘管沒有自己的種子，它們卻能以某種方式傳播開來。
items.wands.wandofregrowth$seedpod.discover_hint=你可以用特定的魔杖找到這種植物。
items.wands.wandofregrowth$seedpod.name=種子莢
items.wands.wandofregrowth.bmage_desc=當戰鬥法師用再生法杖攻擊敵人，且雙方都站在草地上時，他將獲得與造成的傷害成比例的草藥治療。
items.wands.wandofregrowth.degradation=再充能_%d次後，這根魔杖將無法再生長出植物和新鮮的草。升級或強化魔杖可以提高這個上限。
items.wands.wandofregrowth.desc=這根魔杖由一根精雕細琢的細木杖身製成。它彷彿依然鮮活靈動，翠綠如幼樹的樹心。 「當生命終結，新的生命總會萌芽……永恆的輪迴永不停息！”
items.wands.wandofregrowth.eleblast_desc=使用再生法杖進行元素爆炸，可以使敵人紮根，並在爆炸區域隨機生長出青草。
items.wands.wandofregrowth.name=再生魔杖
items.wands.wandofregrowth.staff_name=再生人員
items.wands.wandofregrowth.stats_desc=使用時，這根魔杖會向外錐形發射魔法再生能量，使草木、根莖和稀有植物復甦。下一次釋放能量將消耗_%1$d點能量。魔杖消耗的能量越多，效果越強，範圍也越大。
items.wands.wandofregrowth.upgrade_stat_name_1=每筆費用
items.wands.wandofregrowth.upgrade_stat_name_2=總草量限制
items.wands.wandoftransfusion.bmage_desc=當戰鬥法師用輸血法杖攻擊被魅惑的敵人時，他將獲得護盾，並且下次用法杖攻擊不會消耗任何生命值。
items.wands.wandoftransfusion.charged=你的工作人員被賦予了敵人的生命能量！
items.wands.wandoftransfusion.desc=這根魔杖形狀相當普通，但它的洋紅色調和頂端的漆黑寶石使其格外引人注目。
items.wands.wandoftransfusion.eleblast_desc=使用輸血法杖釋放元素衝擊波，可以魅惑敵人、治療盟友，並對亡靈敵人造成 100% 的傷害。
items.wands.wandoftransfusion.name=輸血魔杖
items.wands.wandoftransfusion.ondeath=你用自己的輸血魔杖自殺了…
items.wands.wandoftransfusion.staff_name=輸血人員
items.wands.wandoftransfusion.stats_desc=對盟友或被魅惑的敵人使用時，這根魔杖會消耗使用者_%1$d點生命值，為盟友恢復或提供_%2$d點生命值的護盾。對敵人使用時，魔杖會短暫魅惑敵人，同時提供使用者_%3$d點護盾。敵對亡靈生物會受到_%4$d-%5$d點傷害，而不是被魅惑。
items.wands.wandoftransfusion.upgrade_stat_name_1=盟友治療
items.wands.wandoftransfusion.upgrade_stat_name_2=自屏蔽
items.wands.wandoftransfusion.upgrade_stat_name_3=亡靈傷害
items.wands.wandofwarding$ward.desc_1=這個基礎結界會自動電擊任何進入其視野範圍內的敵人，造成_%1$d-%2$d點傷害。 _\n\n用你的守護魔杖強化這個結界會將其升級。 _\n\n這個結界只會電擊一次，之後就會消失。 _\n\n你的守護魔杖正在消耗_%3$d點能量來維持這個結界。
items.wands.wandofwarding$ward.desc_2=這個升級後的結界有更複雜的圖案，可以多次攻擊。每次攻擊都會造成_%1$d-%2$d點傷害。用你的守護魔杖攻擊這個結界可以升級它。這個結界會在消失前攻擊三次。你的守護魔杖需要消耗_%3$d點能量來維持這個結界。
items.wands.wandofwarding$ward.desc_3=這個完全升級的結界比之前的結界攻擊次數還要多。每次攻擊都會造成_%1$d-%2$d點傷害。用你的守護魔杖攻擊這個結界可以升級它。這個結界會在消失前攻擊五次。你的守護魔杖需要消耗_%3$d點能量來維持這個結界。
items.wands.wandofwarding$ward.desc_4=這個小型哨兵擁有與大型守衛相同的火力，但它擁有生命值而非固定的充能次數。它的形狀類似你守護魔杖頂端的寶石。此哨兵每次攻擊都會造成_%1$d-%2$d點傷害。 _\n\n用你的守護魔杖攻擊該哨兵可以升級並治療它。 _\n\n該哨兵每次攻擊敵人都會消耗一些生命值，但可以透過使用你的守護魔杖來治療它。 _\n\n你的守護魔杖正在消耗_%3$d點能量來維持該哨兵的運作。
items.wands.wandofwarding$ward.desc_5=這個升級後的哨兵比普通哨兵更大更耐用。它每次電擊都會造成_%1$d-%2$d點傷害。用你的守護魔杖電擊這個哨兵可以升級並治療它。每次電擊敵人時，這個哨兵都會消耗一些生命值，但可以用你的守護魔杖治療它。你的守護魔杖正在消耗_%3$d點能量來維持這個哨兵。
items.wands.wandofwarding$ward.desc_6=這個完全升級的哨兵比之前的哨兵更耐打。它每次電擊都會造成_%1$d-%2$d點傷害。用你的守護魔杖電擊這個哨兵可以治療它。每次電擊敵人時，這個哨兵都會消耗一些生命值，但可以用你的守護魔杖治療它。你的守護魔杖正在消耗_%3$d點能量來維持這個哨兵的生命值。
items.wands.wandofwarding$ward.desc_generic_sentry=這個哨兵擁有與守護者相同的火力，但它擁有生命值而非固定的充能次數。它的外觀類似你守護魔杖頂端的寶石。用你的守護魔杖攻擊這個哨兵可以升級並治療它。這個哨兵每次攻擊敵人都會消耗一些生命值，但可以用你的守護魔杖治療它。
items.wands.wandofwarding$ward.desc_generic_ward=這個守衛會自動電擊任何進入其視野範圍內的敵人。用你的守護魔杖電擊這個守衛可以升級它。守衛的電擊次數有限，超過次數就會消失。
items.wands.wandofwarding$ward.discover_hint=你可以用特定的魔杖找到這個角色。
items.wands.wandofwarding$ward.dismiss_body=如果你不再希望魔杖維持這個結界，你可以將其驅散。這樣做會立即摧毀該結界。 \n\n解除此結界？
items.wands.wandofwarding$ward.dismiss_cancel=不
items.wands.wandofwarding$ward.dismiss_confirm=是的
items.wands.wandofwarding$ward.dismiss_title=解散這個病房？
items.wands.wandofwarding$ward.name_1=較小的病房
items.wands.wandofwarding$ward.name_2=病房
items.wands.wandofwarding$ward.name_3=大病房
items.wands.wandofwarding$ward.name_4=低級哨兵
items.wands.wandofwarding$ward.name_5=哨兵
items.wands.wandofwarding$ward.name_6=更強大的哨兵
items.wands.wandofwarding.bad_location=那裡不能設置病房。
items.wands.wandofwarding.bmage_desc=當戰鬥法師用守護法杖攻擊敵人時，所有啟動的守護和哨兵都有幾率可以治療。
items.wands.wandofwarding.desc=這根短小的金屬魔杖頂端漂浮著一顆明亮的紫色寶石。
items.wands.wandofwarding.eleblast_desc=使用守護法杖進行元素衝擊可以治療撞擊範圍內的所有守護和哨兵。
items.wands.wandofwarding.name=守護魔杖
items.wands.wandofwarding.no_more_wards=你的魔杖無法再維持更多的結界了。
items.wands.wandofwarding.staff_name=病房工作人員
items.wands.wandofwarding.stats_desc=這根魔杖不會直接傷害敵人，而是召喚固定的守衛和哨兵。守衛可以召喚在任何地方，即使穿牆也可以（只要你有視野）。這根魔杖一次可以維持價值_%d能量_個的守衛。
items.wands.wandofwarding.upgrade_stat_name_1=守衛傷害
items.wands.wandofwarding.upgrade_stat_name_2=沃德能源
items.waterskin.ac_drink=喝
items.waterskin.collected=你把露珠收集到水囊裡。
items.waterskin.desc=用皮革和繩子製成的盛裝液體的容器，用軟木塞密封。
items.waterskin.desc_full=裝滿水的水囊似乎散發著能量，或許可以用來祝福其他生存用品？
items.waterskin.desc_heal=這個水囊目前用來儲存療癒之水。水囊越滿，你喝到裡面的水後就能立刻恢復越多的生命值。你只會喝到所需的水量。
items.waterskin.desc_water=現在水囊裡只有一些普通的飲用水。地牢裡一定有其他東西可以裝在水囊裡。
items.waterskin.discover_hint=其中一位英雄初始就擁有這件物品。
items.waterskin.empty=你的水囊空了！
items.waterskin.full=你的水囊滿了！
items.waterskin.name=水袋
items.weapon.curses.annoying.desc=煩人的武器會說話，但它們精力過於旺盛。它們常常會無意間吸引你的注意。
items.weapon.curses.annoying.elestrike_desc=帶有煩人詛咒的元素打擊有 20% 的幾率使範圍內的每個敵人陷入狂暴狀態，持續 6 回合。
items.weapon.curses.annoying.msg_1=哦，我們是在跟什麼東西戰鬥嗎？ ！
items.weapon.curses.annoying.msg_10=擊中目標！
items.weapon.curses.annoying.msg_11=我不想成為武器，我想成為伐木工的斧頭。
items.weapon.curses.annoying.msg_12=記住，過度自信是個緩慢而隱密的殺手。
items.weapon.curses.annoying.msg_13=你們的基地都屬於我們了！
items.weapon.curses.annoying.msg_2=耶，拿下他們！
items.weapon.curses.annoying.msg_3=嘿，聽著！
items.weapon.curses.annoying.msg_4=我們見到老闆了嗎！ ？
items.weapon.curses.annoying.msg_5=哎喲，別把我甩得那麼用力！
items.weapon.curses.annoying.msg_6=去死吧，昆蟲！
items.weapon.curses.annoying.msg_7=哇哦！
items.weapon.curses.annoying.msg_8=我們能休息一下嗎？ ！
items.weapon.curses.annoying.msg_9=砰！哈哈！
items.weapon.curses.annoying.name=煩人的 %s
items.weapon.curses.dazzling.desc=炫目武器有時會發出耀眼的光芒，使所有能看見它們的人或物都睜不開眼。
items.weapon.curses.dazzling.elestrike_desc=帶有眩目詛咒的元素打擊有 50% 的幾率使範圍內的每個敵人失明 6 回合。
items.weapon.curses.dazzling.name=耀眼的 %s
items.weapon.curses.displacing.desc=位移武器蘊含著混亂的傳送魔法，能夠隨機將敵人傳送到地板的任何地方。
items.weapon.curses.displacing.elestrike_desc=帶有位移詛咒的元素攻擊有 50% 的幾率將範圍內的每個敵人傳送走。
items.weapon.curses.displacing.name=置換 %s
items.weapon.curses.explosive.desc=爆炸性武器會逐漸積蓄能量並爆炸，對附近的任何物體造成破壞。
items.weapon.curses.explosive.desc_cool=你的武器現在摸起來是涼的。
items.weapon.curses.explosive.desc_hot=你的武器太燙了！它快要爆炸了！
items.weapon.curses.explosive.desc_warm=你的武器正在積蓄能量並升溫…
items.weapon.curses.explosive.elestrike_desc=帶有爆炸詛咒的元素打擊有 50% 的幾率使範圍內隨機的敵人發生爆炸。
items.weapon.curses.explosive.hot=熱的！
items.weapon.curses.explosive.name=爆炸 %s
items.weapon.curses.explosive.warm=溫暖的...
items.weapon.curses.friendly.desc=友善的武器最適合和平主義者，但偶爾會觸發魔法，使人無法戰鬥。
items.weapon.curses.friendly.elestrike_desc=帶有友方詛咒的元素攻擊有 50% 的幾率魅惑範圍內的所有敵人，持續 6 回合。
items.weapon.curses.friendly.name=友善的 %s
items.weapon.curses.polarized.desc=極化武器會受到魔法的影響，使其攻擊力要麼提高 50%，要麼完全不造成傷害。
items.weapon.curses.polarized.elestrike_desc=帶有極化詛咒的元素打擊有 50% 的幾率對範圍內的每個敵人造成 24-36 點傷害。
items.weapon.curses.polarized.name=極化的 %s
items.weapon.curses.sacrificial.desc=祭祀武器會要求佩戴者獻上鮮血才能攻擊敵人。配戴者越健康，詛咒奪取的血就越多。
items.weapon.curses.sacrificial.elestrike_desc=帶有獻祭詛咒的元素攻擊會使英雄和範圍內的每個敵人流血，造成 12 點生命值傷害。
items.weapon.curses.sacrificial.name=犧牲 %s
items.weapon.curses.wayward$waywardbuff.desc=你的離經叛道的武器的魔法已激活，使其在短時間內極度不準。請注意，這不會影響必定命中的攻擊，例如突襲。使用離經叛道的武器成功攻擊將立即解除此效果。剩餘回合數：\n\n。
items.weapon.curses.wayward$waywardbuff.name=任性的
items.weapon.curses.wayward.desc=偏離預定軌道的武器有時會變得極度不精準。這種魔法效果會在啟動後持續一段時間，但可以透過用偏離預定軌道的武器擊中目標來解除。
items.weapon.curses.wayward.elestrike_desc=帶有邪咒的元素攻擊有 50% 的幾率使範圍內的每個敵人陷入 6 回合的詛咒狀態。
items.weapon.curses.wayward.name=任性的 %s
items.weapon.enchantments.blazing.desc=這種附魔效果會使火焰從武器中噴湧而出，點燃敵人，並對已經著火的敵人造成額外傷害。
items.weapon.enchantments.blazing.elestrike_desc=帶有熾熱附魔的元素打擊會將火焰擴散到範圍內的每一格，持續 8 回合。
items.weapon.enchantments.blazing.name=熾熱的 %s
items.weapon.enchantments.blocking$blockbuff.desc=你的武器的格擋附魔使你的防禦力短暫提升！剩餘護盾：剩餘回合數 ...
items.weapon.enchantments.blocking$blockbuff.name=阻塞
items.weapon.enchantments.blocking.desc=格擋武器在使用後有幾率短暫地為你提供護盾。
items.weapon.enchantments.blocking.elestrike_desc=帶有格擋附魔的元素打擊，每有一個敵人處於攻擊範圍內，決鬥者便可獲得額外的 6 點護盾值。
items.weapon.enchantments.blocking.name=阻塞 %s
items.weapon.enchantments.blooming.desc=綻放武器蘊含魔法，能使被擊中的目標身上或周圍長出植物。
items.weapon.enchantments.blooming.elestrike_desc=帶有綻放附魔的元素打擊會在範圍內最多 8 格範圍內散播青草，並使範圍內的所有敵人定身 6 回合。
items.weapon.enchantments.blooming.name=盛開的 %s
items.weapon.enchantments.chilling.desc=受到此魔法影響的敵人會感到寒冷，移動和攻擊速度都會減慢。
items.weapon.enchantments.chilling.elestrike_desc=帶有寒冰附魔的元素打擊會將寒氣擴散到範圍內的每一格，持續 8 回合。
items.weapon.enchantments.chilling.name=冷卻 %s
items.weapon.enchantments.corrupting.desc=這種強大的附魔能夠將敵人轉化為你的附身對象。當敵人被這武器擊殺時，有一定幾率會墮落而非死亡。
items.weapon.enchantments.corrupting.elestrike_desc=帶有腐化附魔的元素打擊有 5-25% 的幾率（基於損失的生命值）腐化範圍內的每個敵人，但主要目標除外。
items.weapon.enchantments.corrupting.name=損壞 %s
items.weapon.enchantments.elastic.desc=彈性武器有幾率將敵人擊飛一段距離。
items.weapon.enchantments.elastic.elestrike_desc=帶有彈性附魔的元素攻擊會將範圍內的所有敵人擊退 5 格。
items.weapon.enchantments.elastic.name=彈性 %s
items.weapon.enchantments.grim.desc=這種強大的魔法擁有瞬間處決敵人的力量。敵人越弱，效果觸發的幾率就越高。
items.weapon.enchantments.grim.elestrike_desc=帶有兇猛附魔的元素打擊有 6-30% 的幾率（基於損失的生命值）殺死範圍內的所有敵人，但主要目標除外。
items.weapon.enchantments.grim.name=嚴峻的 %s
items.weapon.enchantments.kinetic$conserveddamage.desc=你的武器儲存了上次致命一擊的剩餘能量，並將在下次攻擊中將其轉化為額外傷害。然而，能量會隨著時間而逐漸消散。 \n\n 保留傷害：%d。
items.weapon.enchantments.kinetic$conserveddamage.name=保護性損傷
items.weapon.enchantments.kinetic.desc=當敵人被動能武器殺死時，任何多餘的能量都會儲存在武器中，並用於下一次成功的攻擊。
items.weapon.enchantments.kinetic.elestrike_desc=帶有動能附魔的元素打擊會對範圍內的每個敵人造成 40% 的儲存傷害，但主要目標除外。
items.weapon.enchantments.kinetic.name=動力學 %s
items.weapon.enchantments.lucky.desc=被幸運武器擊殺的敵人有幾率掉落額外戰利品。
items.weapon.enchantments.lucky.elestrike_desc=帶有幸運附魔的元素打擊有 12.5% 的幾率在範圍內每個敵人腳下生成戰利品。此效果對每個敵人只能觸發一次。
items.weapon.enchantments.lucky.name=幸運 %s
items.weapon.enchantments.projecting.desc=獲得此附魔後，近戰武器的攻擊範圍將增加。遠程武器在瞄準附近目標時可以穿透牆壁。
items.weapon.enchantments.projecting.elestrike_desc=帶有投射附魔的元素打擊會對範圍內的每個敵人造成 30% 的傷害，但主要目標除外。
items.weapon.enchantments.projecting.name=投影 %s
items.weapon.enchantments.shocking.desc=電擊武器發出電弧，對附近所有敵人造成額外傷害。
items.weapon.enchantments.shocking.elestrike_desc=一次帶有驚人附魔的元素打擊會將電流擴散到範圍內的每一格，持續 8 回合。
items.weapon.enchantments.shocking.name=令人震驚的 %s
items.weapon.enchantments.unstable.desc=這種附魔散發出混亂的能量，每次受到攻擊都會產生不同的附魔效果。
items.weapon.enchantments.unstable.elestrike_desc=帶有不穩定附魔的元素打擊會對範圍內的每個敵人施加隨機附魔效果，但主要目標除外。
items.weapon.enchantments.unstable.name=不穩定的 %s
items.weapon.enchantments.vampiric.desc=這種強大的附魔每次攻擊都會吸取敵人的生命力，並將其輸送回穿戴者本身。穿戴者生命值越低，效果越強。
items.weapon.enchantments.vampiric.elestrike_desc=帶有吸血附魔的元素打擊，每有一個敵人在範圍內，就能為決鬥者恢復 2.5 點生命值。
items.weapon.enchantments.vampiric.name=吸血鬼 %s
items.weapon.melee.assassinsblade.ability_desc=決鬥者在使用刺客之刃時可以潛行。此能力使決鬥者瞬間閃現至多3格遠，並獲得_%d回合的隱身效果。
items.weapon.melee.assassinsblade.ability_name=潛行
items.weapon.melee.assassinsblade.desc=一把由黑曜石製成的小巧波浪形刀刃，雖然輕巧，但使用起來卻很困難，不過如果擊中正確的目標，就會造成致命的傷害。
items.weapon.melee.assassinsblade.name=刺客之刃
items.weapon.melee.assassinsblade.stats_desc=這種武器對毫無防備的敵人效果更佳。
items.weapon.melee.assassinsblade.typical_ability_desc=決鬥者在使用刺客之刃時可以潛行。這項能力可以讓決鬥者瞬間閃現至多3格遠，通常會賦予她_%d回合的隱身效果。
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=能力持續時間
items.weapon.melee.battleaxe.ability_desc=決鬥者可以使用戰斧發動重擊。如果重擊使敵人措手不及，則會造成_%1$d-%2$d點傷害，並使其眩暈5回合，降低50%%點命中率和閃避率。重擊必定命中，但如果未能使敵人措手不及，則造成普通傷害。
items.weapon.melee.battleaxe.ability_name=重擊
items.weapon.melee.battleaxe.desc=這把戰斧巨大的鋼製斧頭，每次揮砍都威力十足。
items.weapon.melee.battleaxe.name=戰斧
items.weapon.melee.battleaxe.stats_desc=這是一件相當精準的武器。
items.weapon.melee.battleaxe.typical_ability_desc=決鬥者可以使用戰斧發動重擊。這種集中攻擊如果使敵人措手不及，通常會造成_%1$d-%2$d點傷害，並使其眩暈5回合，降低50%%點命中率和閃避率。重擊必定命中，但如果未能使敵人措手不及，則造成普通傷害。
items.weapon.melee.crossbow$chargedshot.desc=決鬥者將力量集中在弩箭之上。她下一次的攻擊必定命中，並附加以下三種效果之一：\n - 近戰攻擊會將敵人擊退數格。 \n - 未加箭頭的飛鏢會造成額外傷害。 \n - 加箭頭的飛鏢會獲得額外使用次數，並在7x7範圍內施加效果。正面飛鏢效果只會影響友方單位，負面效果只會影響敵方單位。決鬥者無法使用此能力為自己施加正面飛鏢效果。
items.weapon.melee.crossbow$chargedshot.name=帶電
items.weapon.melee.crossbow.ability_desc=決鬥者可以為她的弩充能，使她的下一次普通攻擊必定命中，並施加以下三種效果之一：近戰攻擊會將敵人擊退，未加箭頭的飛鏢會造成 +%1$d 點傷害，加箭頭的飛鏢會在 7x7 的範圍內施加效果，並持續使用 10 次。
items.weapon.melee.crossbow.ability_name=蓄力射擊
items.weapon.melee.crossbow.desc=這是一種結構相當精巧的武器，能以極快的速度發射箭矢。雖然它並非為此而設計，但這把弩的重量和堅固的結構也使它成為一種不錯的近戰武器。
items.weapon.melee.crossbow.name=弩
items.weapon.melee.crossbow.stats_desc=裝備此武器後，投擲的飛鏢可造成 _%1$d-%2$d 點傷害_，並且還會將其附魔效果賦予飛鏢。
items.weapon.melee.crossbow.typical_ability_desc=決鬥者可以為她的弩充能，使她的下一次普通攻擊必定命中，並施加以下三種效果之一：近戰攻擊會將敵人擊退，未加箭頭的飛鏢通常會造成 +%1$d 點傷害，加箭頭的飛鏢會在 7x7 的範圍內施加效果，並且通常會持續使用 +%2$dQ 次。
items.weapon.melee.crossbow.typical_stats_desc=通常情況下，裝備此武器後，投擲的飛鏢會受到 _%1$d-%2$d 傷害_，甚至還會將其附魔效果賦予飛鏢。
items.weapon.melee.crossbow.upgrade_ability_stat_name=能力提升
items.weapon.melee.cudgel.ability_desc=決鬥者可以使用棍棒發動重擊。如果此集中攻擊使敵人措手不及，則會造成_%1$d-%2$d點傷害，並使其眩暈5回合，降低50%%點命中率和閃避率。重擊必定命中，但如果未使敵人措手不及，則只會造成普通傷害。
items.weapon.melee.cudgel.ability_name=重擊
items.weapon.melee.cudgel.desc=一把小型黃銅權杖，與其說是冒險武器，不如說是貴族們的自衛工具。
items.weapon.melee.cudgel.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.melee.cudgel.name=棍棒
items.weapon.melee.cudgel.stats_desc=這是一件相當精準的武器。
items.weapon.melee.cudgel.typical_ability_desc=決鬥者可以使用棍棒發動重擊。這種集中攻擊如果使敵人措手不及，通常會造成_%1$d-%2$d點傷害，並使其眩暈5回合，降低50%%點命中率和閃避率。重擊必定命中，但如果未能使敵人措手不及，則造成普通傷害。
items.weapon.melee.dagger.ability_desc=決鬥者可以使用匕首進行潛行。此能力使決鬥者瞬間閃現至多5格遠，並獲得%d回合的隱身效果。
items.weapon.melee.dagger.ability_name=潛行
items.weapon.melee.dagger.desc=一把簡單的鐵匕首，附有磨損的木柄。
items.weapon.melee.dagger.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.melee.dagger.name=匕首
items.weapon.melee.dagger.stats_desc=這種武器對毫無防備的敵人效果更佳。
items.weapon.melee.dagger.typical_ability_desc=決鬥者在使用匕首時可以潛行。這項能力可以讓決鬥者瞬間閃現到最多5格遠的地方，通常會賦予她%d回合的隱身效果。
items.weapon.melee.dagger.upgrade_ability_stat_name=能力持續時間
items.weapon.melee.dirk.ability_desc=決鬥者在使用匕首時可以潛行。此能力使決鬥者瞬間閃現至多4格遠，並獲得%d回合的隱身效果。
items.weapon.melee.dirk.ability_name=潛行
items.weapon.melee.dirk.desc=更長的刺刀，能提供更多的鋼材刺入敵人體內。
items.weapon.melee.dirk.name=短劍
items.weapon.melee.dirk.stats_desc=這種武器對毫無防備的敵人效果更佳。
items.weapon.melee.dirk.typical_ability_desc=決鬥者在使用匕首時可以潛行。這項能力可以讓決鬥者瞬間閃現到最多4格之外，通常會賦予她%d回合的隱身效果。
items.weapon.melee.dirk.upgrade_ability_stat_name=能力持續時間
items.weapon.melee.flail$spinabilitytracker.desc=決鬥者正在旋轉她的連枷，累積傷害以進行下一次普通攻擊。每次旋轉消耗一回合，但會增加傷害，最多可旋轉三次。旋轉期間，連枷必定命中。目前旋轉次數：剩餘回合數：2。
items.weapon.melee.flail$spinabilitytracker.name=旋轉
items.weapon.melee.flail.ability_desc=決鬥者可以旋轉連枷來積蓄力量，並持續一段時間。每次旋轉連枷，其下一次普通攻擊都會造成額外傷害，最多可疊加3次。旋轉的連枷必定命中。只有開始旋轉連枷才會消耗一點能量。
items.weapon.melee.flail.ability_name=旋轉
items.weapon.melee.flail.desc=一個帶刺的球，透過一條鍊子連接到一個把手上。雖然非常笨重，但如果擊中要害，威力巨大。
items.weapon.melee.flail.name=連枷
items.weapon.melee.flail.spin_warn=你不能再轉動連枷了。
items.weapon.melee.flail.stats_desc=這是一把精度不高的武器。這把武器無法進行突襲。
items.weapon.melee.flail.typical_ability_desc=決鬥者可以旋轉連枷來積蓄力量，並持續一段時間。每次旋轉連枷，通常會在下一次普通攻擊中造成+%d點傷害，最多可觸發3次。旋轉的連枷必定命中。只有開始旋轉連枷才會消耗一點能量。
items.weapon.melee.gauntlet.ability_desc=決鬥者可以使用石拳套發動連擊。此攻擊必定命中，並且每次決鬥者使用普通近戰或投擲武器攻擊命中目標後，都會造成額外傷害（+%d）。如果連續5回合未命中目標，則連擊將會重設。
items.weapon.melee.gauntlet.ability_name=連擊
items.weapon.melee.gauntlet.desc=這副巨大的護手由深紅色織物製成，表面覆蓋著厚重的魔法石層。織物緊緊包裹著你，使厚實的石板如同第二層皮膚般貼合。揮舞如此沉重的武器需要強大的力量，但也能賦予你的攻擊驚人的威力。
items.weapon.melee.gauntlet.name=石手套
items.weapon.melee.gauntlet.stats_desc=這是一種速度非常快的武器。
items.weapon.melee.gauntlet.typical_ability_desc=決鬥者可以使用石拳套發動連擊。此攻擊必定命中，並且通常會造成額外傷害，傷害值等於決鬥者每次使用普通近戰或投擲武器攻擊命中目標後的傷害值。如果連續5回合未命中目標，則連擊將會重設。
