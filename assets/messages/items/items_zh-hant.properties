items.artifacts.driedrose$ghosthero.desc=一個身形縹緲、人形縹緲的身影。它的力量似乎與你擁有的那朵玫瑰有關。這個幽靈或許不強大，但它似乎是你在這裡唯一真正的朋友。
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=為什麼會發生這種情況？我以為我們成功了？
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=那東西為何至今仍能影響這個世界？
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=我希望你知道該如何使用那個護身符。
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=看來我們還沒完。
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=我們已經走了這麼遠，一定能完成這件事！
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=再走一小段路，我們就能出去了！
items.artifacts.driedrose$ghosthero.dialogue_caves_1=這裡已經很久沒有人類或矮人居住過了。
items.artifacts.driedrose$ghosthero.dialogue_caves_2=什麼原因會導致矮人放棄金礦？
items.artifacts.driedrose$ghosthero.dialogue_caves_3=可惜的是，這裡所有的黃金在地表上都毫無用處。
items.artifacts.driedrose$ghosthero.dialogue_caves_4=這裡的生物都扭曲變形，就像下水道裡的生物一樣。
items.artifacts.driedrose$ghosthero.dialogue_caves_5=就連這裡的蝙蝠都嗜血成性。
items.artifacts.driedrose$ghosthero.dialogue_caves_6=沒有發現任何採礦設備的蹤跡，矮人們都把礦場全部收回了嗎？
items.artifacts.driedrose$ghosthero.dialogue_city_1=矮人們勤勞，但貪婪。
items.artifacts.driedrose$ghosthero.dialogue_city_2=矮人大都會真的陷落了。
items.artifacts.driedrose$ghosthero.dialogue_city_3=我希望地表永遠不要變成這裡這樣。
items.artifacts.driedrose$ghosthero.dialogue_city_4=矮人不應該看起來這麼蒼白。
items.artifacts.driedrose$ghosthero.dialogue_city_5=我不知道哪個比較糟糕，是矮人，還是他們的創造物。
items.artifacts.driedrose$ghosthero.dialogue_city_6=看來矮人們現在也變成沒有理智的怪物。
items.artifacts.driedrose$ghosthero.dialogue_halls_1=這是什麼地方？
items.artifacts.driedrose$ghosthero.dialogue_halls_2=這個地方太可怕了…
items.artifacts.driedrose$ghosthero.dialogue_halls_3=矮人們究竟在想什麼，竟然如此玩弄權力？
items.artifacts.driedrose$ghosthero.dialogue_halls_4=這裡的怪物來自另一個世界，它們究竟是從哪裡來的？
items.artifacts.driedrose$ghosthero.dialogue_halls_5=你能感覺到嗎？感覺好像有東西在看著我們。
items.artifacts.driedrose$ghosthero.dialogue_halls_6=幸好有手電筒，這裡太黑了！
items.artifacts.driedrose$ghosthero.dialogue_prison_1=我聽說過一些關於這個地方的傳聞，都不是什麼好話。
items.artifacts.driedrose$ghosthero.dialogue_prison_2=這裡與其說是監獄，不如說更像地牢。
items.artifacts.driedrose$ghosthero.dialogue_prison_3=我無法想像這個地方被廢棄時發生了什麼事。
items.artifacts.driedrose$ghosthero.dialogue_prison_4=囚犯和獄警似乎都變成了怪物。
items.artifacts.driedrose$ghosthero.dialogue_prison_5=這些骸骨究竟是什麼原因造成的？
items.artifacts.driedrose$ghosthero.dialogue_prison_6=這些人本不該落得如此下場…
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=這些下水道以前很安全，甚至冬天也有人住在這裡。
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=我想知道那些巡邏隊員都怎麼樣了，他們放棄了嗎？
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=我的家人在地面上，希望他們平安無事。
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=守衛們無法戰勝這些怪物，但或許我們可以。
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=如果連下水道都這麼危險，真不知道下面是什麼樣子…
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=是什麼原因導致這些老鼠和螃蟹長得這麼大？
