items.weapon.melee.scimitar.typical_ability_desc=決鬥者可以使用彎刀施展劍舞。此姿態無需任何時間即可激活，並使決鬥者獲得+60攻擊速度和+50命中率，通常持續_2回合_。
items.weapon.melee.scimitar.upgrade_ability_stat_name=能力持續時間
items.weapon.melee.shortsword.ability_desc=決鬥者可以使用短劍對敵人進行劈砍。此技能造成 %1$d-%2$d 點傷害，且必定命中。若劈砍擊殺敵人，則立即生效，決鬥者可在 5 回合內再次免費使用劈砍。
items.weapon.melee.shortsword.ability_name=劈開
items.weapon.melee.shortsword.desc=這是一把很短的劍，只比匕首長幾吋。
items.weapon.melee.shortsword.name=短劍
items.weapon.melee.shortsword.typical_ability_desc=決鬥者可以使用短劍對敵人進行劈砍。此技能通常會造成 %1$d-%2$d 點傷害，並且必定命中。如果劈砍擊殺了敵人，則擊殺立即生效，決鬥者可以在 5 回合內再次免費使用劈砍。
items.weapon.melee.sickle.ability_desc=決鬥者可以用鐮刀收割敵人。這毀滅性的攻擊必定命中，造成_%d點傷害。如果目標不免疫流血效果，則該傷害會轉化為流血效果。
items.weapon.melee.sickle.ability_name=收成
items.weapon.melee.sickle.desc=一種手持式農具，也可作為威力強大但笨重的武器使用。
items.weapon.melee.sickle.name=鐮刀
items.weapon.melee.sickle.stats_desc=這是一種精度較低的武器。
items.weapon.melee.sickle.typical_ability_desc=決鬥者可以用鐮刀收割敵人。這一毀滅性的攻擊必定命中，通常會造成 %d 點傷害。如果目標不免疫流血效果，則該傷害會轉化為流血效果。
items.weapon.melee.spear.ability_desc=決鬥者可以使用長矛尖端刺擊範圍內但不在相鄰位置的敵人。這會造成 %1$d-%2$d 點傷害，擊退敵人，並且必定命中。
items.weapon.melee.spear.ability_name=長釘
items.weapon.melee.spear.desc=一根細長的木棍，頂端裝有磨尖的鐵棒。
items.weapon.melee.spear.name=矛
items.weapon.melee.spear.stats_desc=這把武器速度較慢。這把武器的攻擊範圍更遠。
items.weapon.melee.spear.typical_ability_desc=決鬥者可以使用長矛尖端刺擊範圍內但不在相鄰位置的敵人。這通常會造成 %1$d-%2$d 點傷害，擊退敵人，並且必定命中。
items.weapon.melee.sword$cleavetracker.desc=決鬥者已準備好再次使用順劈斬。下一次使用順劈斬不會消耗任何武器技能充能。剩餘回合數：\n\n。
items.weapon.melee.sword$cleavetracker.name=劈開
items.weapon.melee.sword.ability_desc=決鬥者可以用劍劈砍敵人。此技能造成 %1$d-%2$d 點傷害，且必定命中。若劈砍擊殺敵人，則立即生效，決鬥者可在 5 回合內再次免費使用劈砍。
items.weapon.melee.sword.ability_name=劈開
items.weapon.melee.sword.desc=這是一把平衡性很好的劍。尺寸適中，但比短劍明顯長。
items.weapon.melee.sword.name=劍
items.weapon.melee.sword.typical_ability_desc=決鬥者可以用劍對敵人進行劈砍。此技能通常會造成 %1$d-%2$d 點傷害，並且必定命中。如果劈砍擊殺了敵人，則擊殺立即生效，決鬥者可以在 5 回合內再次免費使用劈砍。
items.weapon.melee.warhammer.ability_desc=決鬥者可以使用戰鎚發動重擊。如果重擊使敵人措手不及，則會造成_%1$d-%2$d點傷害，並使其眩暈5回合，期間命中率和閃避率降低50%%點。重擊必定命中，但如果未能使敵人措手不及，則只會造成普通傷害。
items.weapon.melee.warhammer.ability_name=重擊
items.weapon.melee.warhammer.desc=很少有生物能夠承受這尊高聳的鉛鋼巨像的重擊，但要有效地使用它需要極大的力量。
items.weapon.melee.warhammer.name=戰鎚
items.weapon.melee.warhammer.stats_desc=這是一件相當精準的武器。
items.weapon.melee.warhammer.typical_ability_desc=決鬥者可以使用戰鎚發動重擊。這種集中攻擊如果使敵人措手不及，通常會造成_%1$d-%2$d點傷害，並使其眩暈5回合，降低50%%點命中率和閃避率。重擊必定命中，但如果未能使敵人措手不及，則只會造成普通傷害。
items.weapon.melee.warscythe.ability_desc=決鬥者可以用戰鐮來收割敵人。這次威力巨大的攻擊必定命中，造成 %d 點傷害。如果目標不免疫流血，則該傷害會轉化為流血效果。
items.weapon.melee.warscythe.ability_name=收成
items.weapon.melee.warscythe.desc=這種笨重的大工具經過加固，使其更適合用來對付敵人而不是農作物。
items.weapon.melee.warscythe.name=戰爭鐮刀
items.weapon.melee.warscythe.stats_desc=這是一種精度較低的武器。
items.weapon.melee.warscythe.typical_ability_desc=決鬥者可以用戰鐮來收割敵人。這項威力龐大的攻擊必定命中，通常會造成 %d 點傷害。如果目標不免疫流血，則該傷害會以流血效果的形式生效。
items.weapon.melee.whip.ability_desc=決鬥者可以用鞭子抽打周圍所有敵人。此技能造成 %1$d-%2$d 點傷害，攻擊範圍內所有敵人，且必定命中。
items.weapon.melee.whip.ability_name=睫毛
items.weapon.melee.whip.desc=雖然這種武器末端的帶倒鉤的繩索造成的傷害很小，但它的攻擊範圍是無與倫比的。
items.weapon.melee.whip.name=鞭
items.weapon.melee.whip.stats_desc=這種武器射程極遠。
items.weapon.melee.whip.typical_ability_desc=決鬥者可以用鞭子抽打周圍所有敵人。此技能通常會造成 %1$d-%2$d 點傷害，攻擊範圍內所有敵人，並且必定命中。
items.weapon.melee.wornshortsword.ability_desc=決鬥者可以用一把破舊的短劍對敵人進行劈砍。此攻擊造成_%1$d-%2$d點傷害，且必定命中。如果劈砍擊殺了敵人，則擊殺立即生效，決鬥者可以在5回合內再次免費使用劈砍。
items.weapon.melee.wornshortsword.ability_name=劈開
items.weapon.melee.wornshortsword.desc=這是一把很短的劍，因長期使用而磨損嚴重。它比保存完好的短劍更脆弱也更輕一些。
items.weapon.melee.wornshortsword.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.melee.wornshortsword.name=磨損的短劍
items.weapon.melee.wornshortsword.typical_ability_desc=決鬥者可以用一把破舊的短劍對敵人進行劈砍。這通常會造成 %1$d-%2$d 點傷害，並且必定命中。如果劈砍擊殺了敵人，則擊殺立即生效，決鬥者可以在 5 回合內再次免費使用劈砍。
items.weapon.missiles.bolas.desc=這些不尋常的遠程武器雖然殺傷力不大，但卻能很好地減緩目標的速度。
items.weapon.missiles.bolas.name=博拉斯
items.weapon.missiles.bolas.stats_desc=這種武器能使目標喪失行動能力。
items.weapon.missiles.boomerang.desc=這種扁平彎曲的木製投擲物投向敵人後會回到投擲者的手中。
items.weapon.missiles.boomerang.durability=由於其結構堅固，這款迴旋鏢不會因使用而損壞。
items.weapon.missiles.boomerang.name=迴力鏢
items.weapon.missiles.darts.adrenalinedart.desc=這些飛鏢的鏢尖塗有以薊草為原料的化合物，可以提升友軍的移動速度和攻擊速度，或短暫降低敵人的移動速度。飛鏢本身仍會對敵人造成傷害，但不會傷害友軍。
items.weapon.missiles.darts.adrenalinedart.name=腎上腺素飛鏢
items.weapon.missiles.darts.blindingdart.desc=這些飛鏢的鏢尖塗有以盲草為原料的化合物，能使目標短暫失明。但它們不會使目標失去方向感，所以敵人仍然會知道最後看到你的位置。
items.weapon.missiles.darts.blindingdart.name=致盲飛鏢
items.weapon.missiles.darts.chillingdart.desc=這些飛鏢的鏢尖塗有冰蓋基化合物，可以顯著降低目標溫度。
items.weapon.missiles.darts.chillingdart.name=令人膽寒的飛鏢
items.weapon.missiles.darts.cleansingdart.desc=這些飛鏢的鏢尖塗有以魔力草為原料的化合物，能暫時使盟友免疫所有負面效果，或清除敵人身上的正面效果。敵人甚至可能短暫地忘記自己正在攻擊或逃離你。飛鏢本身仍然會對敵人造成傷害，但不會傷害盟友。
items.weapon.missiles.darts.cleansingdart.name=清潔飛鏢
items.weapon.missiles.darts.dart.ac_tip=提示
items.weapon.missiles.darts.dart.desc=這些簡單的木棍頂端裝有尖刺，重量經過精心設計，飛行軌跡穩定，只需手腕輕輕一甩即可刺穿獵物。在木棍頂端綁上種子，投擲後還能獲得額外效果。
items.weapon.missiles.darts.dart.name=鏢
items.weapon.missiles.darts.dart.prompt=選擇一顆種子
items.weapon.missiles.darts.dart.tip_all=尖端 %1$d 飛鏢，帶有 %2$d 種子
items.weapon.missiles.darts.dart.tip_cancel=取消
items.weapon.missiles.darts.dart.tip_desc=種子可以與一枚或兩枚飛鏢組合，用來製作鏢尖。每種種子都會製作出專屬的鏢尖飛鏢，具有獨特的單次使用效果。用這些種子製作的鏢尖飛鏢會產生_%s。
items.weapon.missiles.darts.dart.tip_one=尖端 1 飛鏢，附 1 顆種子
items.weapon.missiles.darts.dart.tip_title=飛鏢尖端
items.weapon.missiles.darts.dart.tip_two=尖端 2 飛鏢，1 種子
items.weapon.missiles.darts.dart.unlimited_uses=由於結構簡單，飛鏢實際上可以永久使用。
items.weapon.missiles.darts.displacingdart.desc=這些飛鏢的鏢尖塗有以褪色葉為基礎的化合物，可以將目標瞬間傳送到一小段距離之外。
items.weapon.missiles.darts.displacingdart.name=移位飛鏢
items.weapon.missiles.darts.healingdart.desc=這些飛鏢的鏢尖塗有以太陽草為原料的化合物，能為目標提供短暫的治療效果。飛鏢本身仍會對敵人造成傷害，但不會傷害友軍。
items.weapon.missiles.darts.healingdart.name=治療飛鏢
items.weapon.missiles.darts.holydart.desc=這些飛鏢的鏢尖塗有星花萃取物，能將神聖能量注入目標體內。盟友和普通敵人會獲得祝福，但亡靈或惡魔敵人會受到重創。飛鏢本身對敵人仍然有害，但不會傷害盟友。
items.weapon.missiles.darts.holydart.name=聖鏢
items.weapon.missiles.darts.incendiarydart.desc=這些飛鏢的鏢尖塗有火花化合物，撞擊時會燃起耀眼的火焰。
items.weapon.missiles.darts.incendiarydart.name=燃燒鏢
items.weapon.missiles.darts.paralyticdart.desc=這些飛鏢的尖端塗有以土根為基礎的化合物，可以短時間內麻痺目標。
items.weapon.missiles.darts.paralyticdart.name=麻痺鏢
items.weapon.missiles.darts.poisondart.desc=這些飛鏢的尖端塗有以苦苔蘚為基礎的化合物，可以毒害目標。
items.weapon.missiles.darts.poisondart.name=毒鏢
items.weapon.missiles.darts.rotdart.desc=這些邪惡的飛鏢尖端塗有酸性腐爛漿果化合物，能夠迅速腐蝕飛鏢接觸到的任何物體。強大的敵人能夠抵抗大部分腐蝕效果，但其腐蝕力足以輕易殺死大多數普通敵人。這些飛鏢比其他尖端塗有腐蝕化合物的飛鏢更持久，但其耐久度無法提升。
items.weapon.missiles.darts.rotdart.discover_hint=你可以使用特定任務中獲得的種子來製作此物品。
items.weapon.missiles.darts.rotdart.name=腐爛飛鏢
items.weapon.missiles.darts.shockingdart.desc=這些飛鏢的鏢尖塗有以風暴藤蔓為基礎的化合物，會對目標造成劇烈的電擊。
items.weapon.missiles.darts.shockingdart.name=電擊飛鏢
items.weapon.missiles.darts.tippeddart.about_to_break=你的飛鏢鏢尖快要失效了。
items.weapon.missiles.darts.tippeddart.ac_clean=乾淨的
items.weapon.missiles.darts.tippeddart.cancel=取消
items.weapon.missiles.darts.tippeddart.clean_all=全部清理乾淨
items.weapon.missiles.darts.tippeddart.clean_desc=此操作將去除飛鏢上的種子尖端，使其恢復為普通飛鏢。
items.weapon.missiles.darts.tippeddart.clean_one=乾淨的
items.weapon.missiles.darts.tippeddart.clean_title=清潔飛鏢
items.weapon.missiles.darts.tippeddart.discover_hint=你可以在商店購買此物品，或使用種子製作它。
items.weapon.missiles.darts.tippeddart.has_broken=你的飛鏢鏢尖端已經失效了。
items.weapon.missiles.darts.tippeddart.unlimited_uses=但這些產品品質極高，實際上可以永久使用。
items.weapon.missiles.darts.tippeddart.uses_left=這疊飛鏢在其中一個鏢尖磨損之前還能使用 _%d/%d_ 次。
items.weapon.missiles.fishingspear.desc=雖然最初是為捕魚而設計的，但這種小型投擲矛作為臨時武器也非常好用。
items.weapon.missiles.fishingspear.name=魚叉
items.weapon.missiles.forcecube.desc=這些形狀奇特的魔法立方體體積小巧，可以握在手中，但卻非常重。
items.weapon.missiles.forcecube.name=力立方體
items.weapon.missiles.forcecube.ondeath=你用自己的原力立方體自殺了…
items.weapon.missiles.forcecube.stats_desc=這種武器能將衝擊力分散到一個很小的範圍內，擊中附近的一切物體。
items.weapon.missiles.heavyboomerang.desc=這個大型迴旋鏢難以有效使用，但能造成相當大的傷害。
items.weapon.missiles.heavyboomerang.name=重型迴旋鏢
items.weapon.missiles.heavyboomerang.stats_desc=這件武器會在五回合後回到投擲點。
items.weapon.missiles.javelin.desc=這些較大的投擲長矛都經過加重處理，以便在飛行過程中保持矛尖朝前。
items.weapon.missiles.javelin.name=標槍
items.weapon.missiles.kunai.desc=這些小刀在熟練使用者手中威力無窮。
items.weapon.missiles.kunai.name=苦無
items.weapon.missiles.kunai.stats_desc=這種武器對毫無防備的敵人效果更佳。
items.weapon.missiles.missileweapon$placeholder.name=投擲武器
items.weapon.missiles.missileweapon.about_to_break=你投擲的武器即將斷裂。
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=如果你強化投擲武器套裝中的最後一件投擲武器損壞，該套裝將永久丟失。你確定要投擲它嗎？
items.weapon.missiles.missileweapon.break_upgraded_warn_no=不
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=是的
items.weapon.missiles.missileweapon.curse_discover=這件投擲武器被詛咒了！
items.weapon.missiles.missileweapon.distance=投擲武器遠距離射擊更精準，近距離射擊不太精準。
items.weapon.missiles.missileweapon.durability=投擲武器在使用過程中會磨損和損壞。
items.weapon.missiles.missileweapon.dust=投擲出去的武器一碰就化為塵埃。
items.weapon.missiles.missileweapon.has_broken=你的一件投擲武器壞了。
items.weapon.missiles.missileweapon.probably_too_heavy=這件武器可能對你來說太重了。
items.weapon.missiles.missileweapon.stats_known=這套 _tier-%1$d_ 投擲武器造成 _%2$d-%3$d 點傷害，使用需要 _%4$d 點力量。
items.weapon.missiles.missileweapon.stats_unknown=通常情況下，這套 _tier-%1$d_ 投擲武器會造成 _%2$d-%3$d 點傷害，並且需要 _%4$d 點力量才能使用。
items.weapon.missiles.missileweapon.unknown_uses=通常情況下，這套投擲武器在損壞之前可以使用 _%d_ 次。
items.weapon.missiles.missileweapon.unlimited_uses=這套產品品質極佳，幾乎可以永久使用。
items.weapon.missiles.missileweapon.uses_left=這套投擲武器還剩下_%d/%d_次使用次數，之後就會有一個損壞。
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=你剛剛瞬間投擲了一枚手裡劍，必須等待一段時間才能再次投擲。手裡劍仍然可以投擲，但速度為正常武器速度。剩餘回合數：\n\n。
items.weapon.missiles.shuriken$shurikeninstanttracker.name=手裡劍冷卻時間
items.weapon.missiles.shuriken.desc=這些星形金屬片有著剃刀般鋒利的刃口，命中目標時能造成重創。投擲速度非常快。
items.weapon.missiles.shuriken.name=手裏劍
items.weapon.missiles.shuriken.stats_desc=手裡劍可以立即投擲，冷卻時間20回合。
items.weapon.missiles.throwingclub.desc=結構相當簡單但經久耐用的投擲武器，本質上就是一塊綁在棍子上的大石頭。
items.weapon.missiles.throwingclub.name=投擲棒
items.weapon.missiles.throwingclub.stats_desc=這種武器不會黏在敵人身上，可以立即拾取。
items.weapon.missiles.throwinghammer.desc=這些厚重的錘子設計用來投擲攻擊敵人。它們光滑的全金屬結構意味著它們非常耐用。
items.weapon.missiles.throwinghammer.name=投擲錘
items.weapon.missiles.throwinghammer.stats_desc=這種武器不會黏在敵人身上，可以立即拾取。
items.weapon.missiles.throwingknife.desc=這些輕巧的刀具經過精心平衡，能夠劃出一道弧線，精準地擊中目標。
items.weapon.missiles.throwingknife.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.missiles.throwingknife.name=飛刀
items.weapon.missiles.throwingknife.stats_desc=這種武器對毫無防備的敵人效果更佳。
items.weapon.missiles.throwingspear.desc=這些輕型長矛的框架很薄，設計用於投擲，而不是刺擊。
items.weapon.missiles.throwingspear.name=投擲長矛
items.weapon.missiles.throwingspike.desc=這些堅固耐用的尖頭金屬桿是用來投擲攻擊遠處敵人的。
items.weapon.missiles.throwingspike.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.missiles.throwingspike.name=投擲扣球
items.weapon.missiles.throwingstone.desc=這些石頭經過打磨，使其投擲時比普通石頭更有力。
items.weapon.missiles.throwingstone.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.missiles.throwingstone.name=投擲石塊
items.weapon.missiles.tomahawk.desc=這些投擲斧的邊緣呈鋸齒狀，會在黏住敵人時撕裂敵人。
items.weapon.missiles.tomahawk.name=鉞
items.weapon.missiles.tomahawk.stats_desc=此武器會對目標造成_%1$d-%2$d流血_效果。
items.weapon.missiles.tomahawk.typical_stats_desc=此武器通常會對目標造成_%1$d-%2$d流血_。
items.weapon.missiles.trident.desc=巨大的投擲長矛，末端有三個致命的尖刺。它們威力強大，但也很重。
items.weapon.missiles.trident.name=三叉戟
items.weapon.spiritbow.ac_shoot=射擊
items.weapon.spiritbow.desc=由古代魔法木材製成的弓。弓弦和弓身上的紋飾散發著淡藍色的光芒。拉動弓弦，即可召喚出一支魔法箭矢，射向敵人。
items.weapon.spiritbow.discover_hint=其中一位英雄初始就擁有這件物品。
items.weapon.spiritbow.name=靈弓
items.weapon.spiritbow.prompt=選擇目標
items.weapon.spiritbow.stats=弓箭無法直接升級，而是會隨著等級提升而逐漸變強。在你目前等級，弓箭射出的箭矢會造成_%1$d-%2$d點傷害_，並且需要_%3$d點力量才能正確使用。
items.weapon.weapon$enchantment.discover_hint=你可以在地牢中隨機找到具有這種效果的物品，或者嘗試自己將其應用到物品上。
items.weapon.weapon$enchantment.enchant=魅力
items.weapon.weapon$enchantment.rankings_desc=被魔法殺死
items.weapon.weapon.cursed=你能感覺到這把武器中潛藏著一股邪惡的魔法。
items.weapon.weapon.cursed_worn=因為這件武器被詛咒了，你無力將其移除。
items.weapon.weapon.enchant_hardened=它已經_硬化了_。
items.weapon.weapon.enchanted=它有一個_%s。 _
items.weapon.weapon.excess_str=由於你的力量過剩，你將使用這把武器造成 _0-%d 額外傷害_。
items.weapon.weapon.faster=它經過增強以提升速度。
items.weapon.weapon.hardened_no_enchant=這件武器已經強化，但目前尚未附魔。
items.weapon.weapon.hardening_gone=這件武器的硬化層已經磨損了！
items.weapon.weapon.identify=你現在對自己的武器已經夠熟悉，能夠辨識它了。
items.weapon.weapon.incompatible=不同類型魔法的相互作用使這件武器上的附魔失效了！
items.weapon.weapon.not_cursed=這件武器沒有邪惡魔法。
items.weapon.weapon.stronger=它被強化以增強傷害。
items.weapon.weapon.too_heavy=由於你的力量不足，這把武器會降低你的攻擊速度、精準度和奇襲能力。
items.weapon.weapon.weak_cursed=儘管受到詛咒，你仍然可以卸下這件武器。

items.keys.skeletonkey.desc=這把鑰匙看起來很厲害：它的鑰匙頭形狀像骷髏頭。或許它能打開一扇非常特別的門。
items.weapon.missiles.bombarrow.desc=一支箭，箭上綁著炸彈。保持距離。
items.weapon.missiles.bombarrow.name=炸彈箭
items.weapon.missiles.missileweapon.damage_desc=此武器每次攻擊造成_%1$d_至_%2$d_點傷害。
items.bags.seedpouch.desc=這個小小的天鵝絨袋子能裝下任意數量的種子。十分方便。
items.bags.seedpouch.name=種子袋
items.potions.potionofmight.desc=這股強勁的液體會流遍你的肌肉，永久增加一點力量和五點生命。
items.potions.potionofmight.name=強壯藥劑
items.rings.ringofdetection.desc=戴上這枚戒指，不必花時間搜索，也能察覺隱藏的陷阱和暗門。弱化的探知之戒會讓感官變得遲鈍，即使主動搜索，也更難發現秘密。
items.rings.ringofdetection.name=探知之戒
items.rings.ringofhaggler.desc=這枚戒指其實沒有魔法效果，卻能讓商人知道佩戴者是盜賊公會的一員。只要答應暫時不找他們的麻煩，他們通常很樂意打個折。升級戒指不會帶來額外好處。
items.rings.ringofhaggler.name=議價之戒
items.rings.ringofherbalism.desc=這枚戒指能提高你踩踏草叢時找到露水和種子的機率。
items.rings.ringofherbalism.name=草藥之戒
items.rings.ringofmending.desc=這枚戒指能增強身體的自癒能力，加快生命恢復。弱化的戒指會減慢自然恢復，甚至使其完全停止。
items.rings.ringofmending.name=再生之戒
items.rings.ringofpower.desc=這枚戒指散發出的能量場會增強你的法杖。弱化的能量之戒則會削弱法杖。
items.rings.ringofpower.name=能量之戒
items.rings.ringofsatiety.desc=戴上這枚戒指，你能更久不吃東西。弱化的飽腹之戒會起到相反的效果。
items.rings.ringofsatiety.name=飽腹之戒
items.rings.ringofshadows.desc=戴這枚戒指，敵人更難注意到你。而破損的暗影戒指則會驚動那些原本可能不會察覺你存在的敵人。
items.rings.ringofshadows.name=暗影之戒
items.rings.ringofthorns.desc=這枚戒指並不會長出真的荊棘，但攻擊你的敵人會承受自己所造成的部分傷害。升級戒指不會帶來額外好處。
items.rings.ringofthorns.name=荊棘之戒
items.scrolls.scrollofchallenge.desc=大聲朗讀此捲軸，將會發出震耳欲聾的咆哮，喚醒所有怪物，並讓它們察覺到朗讀者的位置。
items.scrolls.scrollofchallenge.name=挑戰卷軸
items.scrolls.scrollofenchantment.desc=此捲軸可以隨機給武器或盔甲附魔，賦予其特殊力量。
items.scrolls.scrollofenchantment.name=附魔卷軸
items.scrolls.scrollofpsionicblast.desc=此捲軸蘊含著毀滅性的能量，可透過心靈感應引導，對視野範圍內的所有生物造成巨大傷害。伴隨而來的閃光將暫時致盲作用範圍內的所有人，包括捲軸的閱讀者。
items.scrolls.scrollofpsionicblast.name=靈能衝擊卷軸
items.scrolls.scrollofwipeout.desc=閱讀此捲軸，即可釋放地牢惡靈的怒火，屠戮當前層的一切。嗯，幾乎所有生物都會被殺。一些更強大的生物或許不受影響。
items.scrolls.scrollofwipeout.name=滅絕卷軸
items.wands.wandofblink.desc=這根法杖能讓你朝選定的方向瞬間移動。生物和障礙物都會阻斷傳送。
items.wands.wandofblink.name=閃現法杖
items.wands.wandoffirebolt.desc=這根法杖能射出魔法火焰，點燃可燃的地形，並對擊中的生物造成傷害，使其燃燒。
items.wands.wandoffirebolt.name=火焰箭法杖
