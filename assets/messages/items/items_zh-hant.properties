items.amulet.ac_end=結束遊戲
items.amulet.ascent_desc=你開始感受到尤格-澤瓦強大而可怕的力量從護身符中散發出來。以凡人的身份重返地牢可能比你想像的要困難得多！如果你繼續帶著護身符向上攀登，地牢將變得更加危險，樓層間的傳送將被禁用，你只能透過在攀登過程中擊敗敵人來贏得遊戲！如果你想在不進行此挑戰的情況下繼續攀登，可以暫時將護身符留在這裡；或者在攀登之前啟動護身符，以正常方式結束遊戲。
items.amulet.ascent_no=暫時停止
items.amulet.ascent_title=升天
items.amulet.ascent_yes=繼續！
items.amulet.desc=延多護符是人類和矮人已知的最強大的神器。它閃閃發光的晶體蘊含著不可思議的神奇力量。
items.amulet.desc_ascent=這枚護身符的來歷不明，但顯然受到了尤格·澤瓦力量的強烈影響。隨著你在地牢中穿行，地牢似乎也在屈從於尤格的意志，敵人數量和實力都大幅提升！而且，你現在也無法啟動或丟棄這枚護身符，彷彿它被詛咒了一般。
items.amulet.desc_origins=這枚護身符的來歷無人知曉。史書記載，矮人王曾誇耀自己在矮人文明斷絕一切聯繫前不久發現了這件神器。他是如何找到它的？尤格-澤瓦又是如何從他手中奪走它的？這些問題或許留待以後再問，現在最重要的是，這枚護身符就歸你所有了！
items.amulet.discover_hint=你可以在地牢底部找到這件物品…
items.amulet.name=延多爾護身符
items.ankh.ac_bless=保佑
items.ankh.bless=你用魔法水祝福生命之符。
items.ankh.desc=這個古老的不朽象徵能讓人死而復生。復活時，所有未裝備的物品都會遺失。
items.ankh.desc_blessed=這個古老的永生象徵賦予人死後復生的能力。安卡已被加持，如今更加強大。在危難之際，安卡會犧牲自己來拯救你。
items.ankh.discover_hint=你可以在商店裡買到這個商品。
items.ankh.name=安卡
items.arcaneresin.ac_apply=申請
items.arcaneresin.apply=你在魔杖上塗抹樹脂，增強它的威力！
items.arcaneresin.desc=這種細粉閃爍著紫白交織的光芒。它可以增強魔法能量，塗抹在魔杖上即可提升魔杖等級！升級魔杖需要消耗1、2或3個樹脂，數量取決於魔杖的初始等級。樹脂最多可將魔杖升級至+3級。然而，樹脂升級的效果會被其他升級方式（例如昇級捲軸）覆蓋，並且在將魔杖附魔到法師法杖時無效。
items.arcaneresin.discover_hint=你可以透過煉金術製作這個物品。
items.arcaneresin.level_too_high=那根魔杖威力太大，樹脂無法增強其效果。
items.arcaneresin.name=神秘樹脂
items.arcaneresin.not_enough=你的樹脂不夠用！
items.arcaneresin.prompt=選擇一根魔杖
items.armor.armor$glyph.discover_hint=你可以在地牢中隨機找到具有這種效果的物品，或者嘗試自己將其應用到物品上。
