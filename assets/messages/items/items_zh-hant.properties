items.artifacts.cloakofshadows$cloakstealth.desc=你的暗影斗篷賦予你隱身能力，當你被它遮蔽時，隱身狀態將持續到斗篷能量耗盡或斗篷效果消失為止。隱身期間，敵人無法攻擊或追蹤你。物理攻擊和魔法效果（例如捲軸和魔杖）會立即解除隱形狀態。使用暗影斗篷前的回合數：0。
