items.weapon.weaponeffects.weaponeffect.smite.prefix=野蠻
items.weapon.weaponeffects.weaponeffect.smite.name=野蠻%s
items.weapon.weaponeffects.weaponeffect.smite.desc=這件武器帶有_野蠻_之力。命中時有_20%_的機率施放_1級懲擊_。
items.weapon.weaponeffects.weaponeffect.smite.activate=懲擊！

items.weapon.weaponeffects.weaponeffect.knockback.prefix=斥退
items.weapon.weaponeffects.weaponeffect.knockback.name=斥退%s
items.weapon.weaponeffects.weaponeffect.knockback.desc=這件武器帶有_斥退_之力。命中時有_20%_的機率將敵人擊退_一格_。無法擊退首領。
items.weapon.weaponeffects.weaponeffect.knockback.activate=擊退！

items.weapon.weaponeffects.weaponeffect.venom.prefix=蛇牙
items.weapon.weaponeffects.weaponeffect.venom.name=蛇牙%s
items.weapon.weaponeffects.weaponeffect.venom.desc=這件武器帶有_蛇牙_之毒。命中時有_20%_的機率使目標中毒。
items.weapon.weaponeffects.weaponeffect.venom.activate=毒液！

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=致殘
items.weapon.weaponeffects.weaponeffect.kneeshot.name=致殘%s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=這件武器能夠_致殘_。遠程攻擊命中時有_20%_的機率使敵人殘廢_10回合_。首領不受影響。
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=殘廢！

items.weapon.weaponeffects.weaponeffect.spark.prefix=符文
items.weapon.weaponeffects.weaponeffect.spark.name=符文%s
items.weapon.weaponeffects.weaponeffect.spark.desc=這根法杖刻有_符文_。其魔法有_20%_的機率觸發_火花_，額外造成_4–8_點魔法傷害。
items.weapon.weaponeffects.weaponeffect.spark.activate=火花！

items.weapon.weaponeffects.weaponeffect.curse.prefix=咒術
items.weapon.weaponeffects.weaponeffect.curse.name=咒術%s
items.weapon.weaponeffects.weaponeffect.curse.desc=這根法杖蘊含_咒術_。其魔法有_20%_的機率削弱目標，使其造成的傷害降低_5%_，持續_10回合_。
items.weapon.weaponeffects.weaponeffect.curse.activate=詛咒！

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=汲取
items.weapon.weaponeffects.weaponeffect.drainlife.name=汲取%s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=這根法杖能夠_汲取_生命。其魔法有_20%_的機率額外造成_8–16_點魔法傷害，並為你恢復等同於目標實際損失的生命值。
items.weapon.weaponeffects.weaponeffect.drainlife.activate=汲取！

items.armor.armorprefix.stalwart.name=堅毅%s
items.armor.armorprefix.stalwart.desc=這件護甲賦予你_堅毅_之力。敵人的攻擊有_20%_的機率觸發_5級堅韌_，使該次傷害降低_20%_。
items.armor.armorprefix.stalwart.activate=堅韌！

items.armor.armorprefix.vigilant.name=警戒%s
items.armor.armorprefix.vigilant.desc=這件護甲讓你保持_警戒_。你有_20%_的機率躲過敵人的遠程攻擊。
items.armor.armorprefix.vigilant.activate=警覺！

items.armor.armorprefix.elusive.name=靈巧%s
items.armor.armorprefix.elusive.desc=這件護甲讓你更加_靈巧_。受到敵人攻擊的傷害時，有_20%_的機率使閃避提高_5_，持續_5回合_。
items.armor.armorprefix.elusive.activate=閃避！
