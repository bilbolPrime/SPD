items.artifacts.driedrose$ghosthero.seen_king_2=他現在更像個巫妖而不是國王。
items.artifacts.driedrose$ghosthero.seen_king_3=即使在死後，矮人依然服從他們的主人。
items.artifacts.driedrose$ghosthero.seen_tengu_1=剩下的唯一一個囚犯是個冷血殺手。當然…
items.artifacts.driedrose$ghosthero.seen_tengu_2=他把我們困住了！
