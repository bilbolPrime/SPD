items.artifacts.lloydsbeacon.desc=勞埃德的信標是一件精巧的魔法裝置，它賦予使用者控制傳送魔法的能力。信標可以用來返回指定地點，也可以在裝備充能後釋放隨機的傳送魔法。這種魔法可以指向目標，也可以指向使用者本身。
