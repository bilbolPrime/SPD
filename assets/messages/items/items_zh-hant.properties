items.armor.armor.cursed=你能感覺到這身盔甲裡潛藏著一股邪惡的魔法。
items.armor.armor.cursed_worn=因為這件盔甲被詛咒了，你無力脫下它。
items.armor.armor.defense=它被增強以提升防禦能力。
items.armor.armor.detach_seal=你把封印從盔甲上取下來。
items.armor.armor.equip_cursed=盔甲緊緊地勒著你，讓你感到疼痛。
items.armor.armor.evasion=它經過強化以增強閃避能力。
items.armor.armor.excess_str=由於你的力量過強，穿上這套盔甲後，你的閃避能力會更強。
items.armor.armor.glyph_hardened=它已經_硬化了_。
items.armor.armor.hardened_no_glyph=這件盔甲已經過強化處理，但目前還沒有刻上符文。
items.armor.armor.hardening_gone=這件盔甲的硬化層已經脫落了！
items.armor.armor.identify=你現在對自己的盔甲已經夠熟悉，可以認出它了。
items.armor.armor.incompatible=不同類型魔法的互動抹去了這件盔甲上的符文！
items.armor.armor.inscribed=上面刻有_%s。 _
items.armor.armor.not_cursed=這件盔甲沒有受到邪惡魔法的影響。
items.armor.armor.probably_too_heavy=這套盔甲可能對你來說太重了。
items.armor.armor.seal_attached=戰士的破損封印附著在這件盔甲上。當他的生命值低於一半時，會獲得_%d護盾。
items.armor.armor.seal_transfer=戰士破損的封印必須貼附在他目前穿戴的盔甲上才能生效。您是否希望在脫下盔甲時自動將封印取下並貼附到正在穿戴的盔甲上？
items.armor.armor.seal_transfer_no=不
items.armor.armor.seal_transfer_yes=是的
items.armor.armor.too_heavy=由於你的力量不足，穿戴這件盔甲會降低你的移動、閃避和防禦能力。
items.armor.armor.weak_cursed=儘管受到詛咒，你仍然可以卸下這件盔甲。
items.armor.classarmor.ac_ability=選擇能力
items.armor.classarmor.ac_transfer=轉移
items.armor.classarmor.charge_use=現在使用該能力將消耗_%s_電量。
items.armor.classarmor.discover_hint=使用特定英雄擊敗 20 層 Boss 後，即可獲得此物品。
items.armor.classarmor.low_charge=這套盔甲能量不足，無法使用特殊能力！
items.armor.classarmor.no_ability=你的盔甲目前沒有任何能力，你應該選擇一個！
items.armor.classarmor.not_equipped=你必須穿上這套盔甲才能使用它的特殊能力！
items.armor.classarmor.transfer_cancel=取消
items.armor.classarmor.transfer_complete=你的英雄盔甲屬性已轉移！
items.armor.classarmor.transfer_desc=矮人王冠的魔法可以轉移到另一套盔甲上。但請注意，原盔甲會在轉移過程中被摧毀。
items.armor.classarmor.transfer_prompt=選擇一件盔甲
items.armor.classarmor.transfer_title=轉移裝甲
items.armor.clericarmor.desc=穿上這套布甲混搭的服裝後，牧師可以施展特殊能力。
items.armor.clericarmor.name=英雄的服飾
items.armor.clotharmor.desc=這種輕型盔甲提供基本防護。
items.armor.clotharmor.discover_hint=其中一位英雄初始就擁有這件物品。
items.armor.clotharmor.name=布甲
items.armor.curses.antientropy.desc=反熵詛咒能夠對抗宇宙的力量，將能量吸入佩戴者體內，並從周圍環境中抽離。這會使佩戴者短暫地燃燒起來，但會凍結周圍的一切！
items.armor.curses.antientropy.name=反熵的 %s
items.armor.curses.bulk.desc=厚重的盔甲看起來更大更威武，但實際上防禦力並沒有增強。更糟的是，增加的體積反而讓進出門變得非常困難。
items.armor.curses.bulk.name=散裝 %s
items.armor.curses.corrosion.desc=腐蝕護甲能夠噴出腐蝕性液體，使周圍所有物體都沾滿黏稠的酸性液體。
items.armor.curses.corrosion.name=腐蝕的 %s
items.armor.curses.displacement.desc=位移詛咒會在佩戴者受到攻擊時將其轉移到安全位置。然而，它的效果過於強大，會將使用者隨機傳送到關卡中的其他地方。
items.armor.curses.displacement.name=位移 %s
items.armor.curses.metabolism.desc=新陳代謝詛咒會在佩戴者受傷時直接將飽腹感轉化為健康，從而加快癒合速度，但也會很快導致飢餓。
items.armor.curses.metabolism.name=%s 代謝
items.armor.curses.multiplicity.desc=被詛咒擁有複製能力的盔甲蘊含著危險的複製魔法。它有時會創造出穿戴者的鏡像，但同樣也有可能複製攻擊者！
items.armor.curses.multiplicity.name=%s 多重性
items.armor.curses.overgrowth.desc=茂盛的盔甲上覆蓋著各種盛開的植物。雖然這種效果看起來很有趣，但對防禦毫無作用，而且這些植物會在戰鬥中隨機激活！
items.armor.curses.overgrowth.name=%s 過度生長
items.armor.curses.stench.desc=被惡臭詛咒的盔甲會釋放出有毒氣體雲，對雲中的一切生物都具有危害性。
items.armor.curses.stench.name=惡臭
items.armor.duelistarmor.desc=穿上這套板甲和披風後，決鬥者可以施展特殊能力。
items.armor.duelistarmor.name=英雄的胸甲
items.armor.glyphs.affection.desc=這個強大的符文可以操控攻擊者的心智，暫時迷惑他們。
items.armor.glyphs.affection.name=%s 的愛意
items.armor.glyphs.antimagic.desc=這種強大的符文能讓盔甲同時抵禦物理和魔法攻擊。這種魔法防禦力不受盔甲等級的影響。
items.armor.glyphs.antimagic.name=反魔法的 %s
items.armor.glyphs.brimstone.desc=這個符文可以保護佩戴者及其財產免受火焰傷害，並完全消除火焰的損害和負面影響。
items.armor.glyphs.brimstone.name=硫磺的 %s
items.armor.glyphs.camouflage.desc=這個符文可以讓配戴者融入高高的草叢中，使其暫時隱身。
items.armor.glyphs.camouflage.name=迷彩的 %s
items.armor.glyphs.entanglement.desc=這個符文會在穿戴者周圍生成一層土質盔甲來吸收傷害，但如果穿戴者移動，這層盔甲就會破碎。
items.armor.glyphs.entanglement.name=糾纏的 %s
items.armor.glyphs.flow.desc=這個符號可以控制佩戴者周圍的水流，使他們在水中移動時更快。
items.armor.glyphs.flow.name=%s 流量
items.armor.glyphs.obfuscation.desc=這個符號會遮蔽佩戴者，使其更難被發現。
items.armor.glyphs.obfuscation.name=混淆的 %s
items.armor.glyphs.potential.desc=擊打此符文可積蓄能量，啟動後可為配戴者的魔杖充能。
items.armor.glyphs.potential.name=潛在的 %s
items.armor.glyphs.repulsion.desc=這個符號能反彈攻擊者的力量，將他們擊飛。
items.armor.glyphs.repulsion.name=%s 排斥
items.armor.glyphs.stone.desc=這個符文用厚重的魔法石包裹住盔甲，使閃避成為不可能，但能根據閃避程度阻擋傷害。
items.armor.glyphs.stone.name=%s 石頭
items.armor.glyphs.swiftness.desc=當配戴者遠離敵人時，此符文可提升其速度。
items.armor.glyphs.swiftness.name=%s 的速度
items.armor.glyphs.thorns.desc=這個強大的符文會傷害攻擊者，使他們在攻擊佩戴者時緩慢流血。
items.armor.glyphs.thorns.name=荊棘的 %s
items.armor.glyphs.viscosity$defereddamage.desc=傷害會隨著時間的推移而緩慢造成，而不是立即造成。剩餘延遲傷害：\n\n。
items.armor.glyphs.viscosity$defereddamage.name=延遲損害
items.armor.glyphs.viscosity$defereddamage.ondeath=延遲造成的傷害最終害死了你…
items.armor.glyphs.viscosity$defereddamage.rankings_desc=因延遲傷害而死
items.armor.glyphs.viscosity.deferred=延遲 %d
items.armor.glyphs.viscosity.desc=這個符文能夠儲存佩戴者所受到的傷害，並緩慢地將傷害釋放給佩戴者，而不是一次性釋放。
items.armor.glyphs.viscosity.name=%s 黏度
items.armor.huntressarmor.desc=穿上這件斗篷後，女獵人可以施展特殊能力。
items.armor.huntressarmor.name=英雄斗篷
items.armor.huntressarmor.no_enemies=周圍沒有敵人
items.armor.leatherarmor.desc=用鞣製過的怪物皮製成的盔甲。雖然不如布甲輕便，但防護性能更好。
items.armor.leatherarmor.name=皮甲
items.armor.magearmor.desc=穿上這件華麗的長袍，法師可以施展特殊能力。
items.armor.magearmor.name=英雄長袍
items.armor.mailarmor.desc=相互連結的金屬鏈節造就了一套既堅固又靈活的盔甲。
items.armor.mailarmor.name=鎖子甲
items.armor.platearmor.desc=巨大的金屬板連接在一起，組成了一套盔甲，為任何足夠強壯、能夠承受其驚人重量的冒險者提供無與倫比的保護。
items.armor.platearmor.name=板甲
items.armor.roguearmor.desc=穿上這身黑色裝束時，盜賊可以使用特殊能力。
items.armor.roguearmor.name=英雄的裝束
items.armor.scalearmor.desc=縫在皮革背心上的金屬鱗片形成了一種既靈活又具有保護作用的盔甲。
items.armor.scalearmor.name=鱗甲
items.armor.warriorarmor.desc=穿上這套厚重的板甲後，戰士可以施展特殊能力。
items.armor.warriorarmor.name=英雄的板甲
items.artifacts.alchemiststoolkit.ac_brew=釀造
items.artifacts.alchemiststoolkit.ac_energize=通電
items.artifacts.alchemiststoolkit.cursed=你那該死的工具包讓你無法使用煉金術！
items.artifacts.alchemiststoolkit.desc=這套工具包包含多種試劑和草藥，以及一個小型混合瓶，方便隨時隨地進行煉金術實驗。瓶中裝著液態的、看起來像是煉金能量晶體的物質。
items.artifacts.alchemiststoolkit.desc_cursed=這套被詛咒的工具箱已經束縛在你身邊，不讓你使用煉金術。
items.artifacts.alchemiststoolkit.desc_hint=隨著經驗的積累，你裝備的工具箱會緩慢產生煉金能量。看起來，在小瓶中的混合物中添加能量晶體可以增強其效果。
items.artifacts.alchemiststoolkit.desc_warming=工具包目前正在預熱，稍等片刻即可使用。
items.artifacts.alchemiststoolkit.energize_1=6點能量：+1級
items.artifacts.alchemiststoolkit.energize_all=%1$d 能量：+%2$d 水平
items.artifacts.alchemiststoolkit.energize_desc=每收集 6 個能量水晶，工具包就能獲得足夠的能量升級，升級後工具包的能量產生速度和升溫速度都會加快。您想使用多少能量？
items.artifacts.alchemiststoolkit.name=煉金術士的工具箱
items.artifacts.alchemiststoolkit.need_energy=你至少需要6點能量。
items.artifacts.alchemiststoolkit.not_ready=你的工具包還沒完全預熱。
items.artifacts.artifact.cannot_wear_two=你不能佩戴兩件相同的聖物。
items.artifacts.artifact.curse_known=你能感覺到這件神器中潛藏著一股邪惡的魔法。
items.artifacts.artifact.equip_cursed=這件神器會痛苦地與你緊緊相連。
items.artifacts.artifact.need_to_equip=你需要裝備你的神器才能做到這一點。
items.artifacts.artifact.not_cursed=這件神器沒有邪惡魔法。
items.artifacts.capeofthorns$thorns.desc=你的披風散發著能量，在你周圍形成一個偏轉力場！荊棘效果啟動期間，你受到的所有傷害都會減少。此外，如果攻擊者在你旁邊，減少的傷害會反彈給攻擊者。荊棘效果剩餘回合數：0。
items.artifacts.capeofthorns$thorns.inert=你的披風再次變得無法使用。
items.artifacts.capeofthorns$thorns.levelup=你的披風變得更強了！
items.artifacts.capeofthorns$thorns.name=荊棘
items.artifacts.capeofthorns$thorns.radiating=你的披風開始散發能量，你覺得受到了保護！
items.artifacts.capeofthorns.desc=DM-300殘骸的金屬片坍塌後聚合成一件堅硬的披風。它似乎儲存著巨大的能量，或許蘊含著DM-300的部分力量？
items.artifacts.capeofthorns.desc_active=這件披風似乎在釋放儲存的能量，散發出一種保護性的力量。
items.artifacts.capeofthorns.desc_inactive=披風壓在肩上，沉甸甸的，讓人感到安心，它似乎能從你所受的傷害中汲取能量。
items.artifacts.capeofthorns.name=荊棘斗篷
items.artifacts.chaliceofblood.ac_prick=刺
items.artifacts.chaliceofblood.desc=這個閃亮的銀聖杯邊緣裝飾著奇特的尖銳寶石。
items.artifacts.chaliceofblood.desc_1=當你手捧聖杯時，你會莫名其妙地想要用尖銳的寶石刺穿自己。
items.artifacts.chaliceofblood.desc_2=你的一部分血液匯聚在聖杯中，你能隱約感覺到聖杯正將生命能量注入你的體內，增強你的自然健康再生能力。即使明知會很痛，你還是想用聖杯割傷自己。
items.artifacts.chaliceofblood.desc_3=聖杯盛滿了你的生命精華。你能感覺到聖杯正在將生命能量重新註入你的體內。
items.artifacts.chaliceofblood.desc_cursed=被詛咒的聖杯已經束縛在你的手上，並抑制了你恢復生命值的能力。
items.artifacts.chaliceofblood.name=血之聖杯
items.artifacts.chaliceofblood.no=不，我改變主意了。
items.artifacts.chaliceofblood.ondeath=聖杯會吸乾你的生命精華…
items.artifacts.chaliceofblood.onprick=你刺破自己，你的生命精華流入聖杯。
