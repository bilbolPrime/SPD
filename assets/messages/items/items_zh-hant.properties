items.artifacts.etherealchains.desc=這些粗大卻輕盈的鎖鏈散發著靈能的光芒。它們可以用來將你拉向地形，或將敵人拉向你。這些鎖鏈的虛幻特性甚至使它們能夠穿牆而過！
