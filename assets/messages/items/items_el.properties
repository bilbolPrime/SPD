items.amulet.ac_end=ΤΕΛΟΣ ΤΟ ΠΑΙΧΝΙΔΙ
items.amulet.ascent_desc=Αρχίζεις να νιώθεις τη μεγάλη και τρομερή δύναμη του Yog-Dzewa να ακτινοβολεί από το φυλαχτό. Η ανάβαση πίσω από το μπουντρούμι ως θνητός μπορεί να είναι πιο δύσκολη από ό,τι νόμιζες!\n\nΑν συνεχίσετε την ανάβαση με το φυλαχτό, το μπουντρούμι θα γίνει πιο επικίνδυνο, οι τηλεμεταφορές μεταξύ των ορόφων θα απενεργοποιηθούν και θα μπορείτε να κερδίσετε το παιχνίδι μόνο νικώντας εχθρούς καθώς ανεβαίνετε μέσα από το μπουντρούμι!\n\nΜπορείτε να αφήσετε το φυλαχτό εδώ προς το παρόν αν θέλετε να ανεβείτε χωρίς να ξεκινήσετε αυτήν την πρόκληση ή να ενεργοποιήσετε το φυλαχτό πριν την ανάβαση για να τερματίσετε κανονικά το παιχνίδι.
items.amulet.ascent_no=Σταμάτα προς το παρόν
items.amulet.ascent_title=Ανάληψη
items.amulet.ascent_yes=Συνεχίζω!
items.amulet.desc=Το Φυλαχτό του Γιέντορ είναι το πιο ισχυρό τεχνούργημα που είναι γνωστό στον άνθρωπο ή στους νάνους. Οι λαμπεροί κρύσταλλοι του περιέχουν απίστευτη και θαυμαστή δύναμη.
items.amulet.desc_ascent=Η προέλευση του φυλαχτού είναι άγνωστη, αλλά είναι σαφές ότι έχει επηρεαστεί σε μεγάλο βαθμό από τη δύναμη του Yog-Dzewa. Το μπουντρούμι φαίνεται να υποκύπτει στη θέληση του Yog καθώς κινείστε μέσα σε αυτό, κάνοντας τους εχθρούς πολύ πιο πολλούς και ισχυρούς! Επίσης, δεν μπορείτε πλέον να ενεργοποιήσετε ή να απορρίψετε το φυλαχτό, σχεδόν σαν να είναι καταραμένο.
items.amulet.desc_origins=Η προέλευση του φυλαχτού είναι άγνωστη. Η ιστορία λέει ότι ο Βασιλιάς των Νάνων καυχιόταν ότι είχε ανακαλύψει το τεχνούργημα λίγο πριν ο πολιτισμός των Νάνων διακόψει κάθε επαφή. Πώς το βρήκε; Πώς του το πήρε ο Γιογκ-Ντζέβα; Ερωτήσεις για μια άλλη φορά ίσως, το μόνο που έχει σημασία τώρα είναι ότι το φυλαχτό είναι δικό σου!
items.amulet.discover_hint=Μπορείς να βρεις αυτό το αντικείμενο στον πάτο του μπουντρουμιού...
items.amulet.name=φυλαχτό του Γιέντορ
items.ankh.ac_bless=ευλογώ
items.ankh.bless=Ευλογείς το Άνκχ με μαγικό νερό.
items.ankh.desc=Το αρχαίο σύμβολο της αθανασίας σου επιτρέπει να επιστρέψεις στη ζωή μετά τον θάνατο. Με την ανάσταση χάνονται όλα τα αντικείμενα που δεν φοράς ως εξοπλισμό.
items.ankh.desc_blessed=Αυτό το αρχαίο σύμβολο αθανασίας δίνει τη δυνατότητα επιστροφής στη ζωή μετά θάνατον. Το Ankh έχει ευλογηθεί και τώρα είναι πολύ πιο δυνατό. Το Ankh θα θυσιαστεί για να σας σώσει σε μια στιγμή θανάσιμου κινδύνου.
items.ankh.discover_hint=Μπορείτε να αγοράσετε αυτό το προϊόν σε ένα κατάστημα.
items.ankh.name=ανκχ
items.arcaneresin.ac_apply=ΕΦΑΡΜΟΖΩ
items.arcaneresin.apply=Επικαλύπτεις το ραβδί σου με ρητίνη, αυξάνοντας τη δύναμή του!
items.arcaneresin.desc=Αυτή η λεπτή σκόνη λαμπυρίζει ανάμεσα σε αποχρώσεις του μωβ και του λευκού. Μπορεί να λειτουργήσει ως ενισχυτής μαγικών ενεργειών, αυξάνοντας το επίπεδο των ραβδιών όταν εφαρμόζεται σε αυτά!\n\nΗ αναβάθμιση ενός ραβδιού κοστίζει 1, 2 ή 3 ρητίνη ανάλογα με το αρχικό επίπεδο του ραβδιού. Η ρητίνη μπορεί να αναβαθμίσει ραβδιά έως και +3.\n\nΟι αναβαθμίσεις ρητίνης _παρακάμπτονται από άλλες πηγές αναβάθμισης_ ωστόσο (όπως οι πάπυροι αναβάθμισης) και δεν ισχύουν όταν εμποτίζεται ένα ραβδί στο ραβδί του Μάγου.
items.arcaneresin.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.arcaneresin.level_too_high=Αυτό το ραβδί είναι πολύ ισχυρό για να βελτιωθεί με ρητίνη.
items.arcaneresin.name=απόκρυφη ρητίνη
items.arcaneresin.not_enough=Δεν έχεις αρκετή ρητίνη για αυτό!
items.arcaneresin.prompt=Επιλέξτε ένα ραβδί
items.armor.armor$glyph.discover_hint=Μπορείτε να βρείτε ένα αντικείμενο με αυτό το εφέ τυχαία στο μπουντρούμι ή να προσπαθήσετε να το εφαρμόσετε σε ένα αντικείμενο μόνοι σας.
items.armor.armor$glyph.glyph=γλύφωμα
items.armor.armor$glyph.killed=%s σε σκότωσε...
items.armor.armor$glyph.rankings_desc=Σκοτώθηκε από ένα γλύφωμα
items.armor.armor.ac_detach=ΑΠΟΣΠΩ
items.armor.armor.avg_absorb=Συνήθως αυτή η θωράκιση _tier-%1$d_ μπλοκάρει τη ζημιά _%2$d-%3$d_ και απαιτεί δύναμη _%4$d_ για να χρησιμοποιηθεί σωστά.
items.armor.armor.curr_absorb=Αυτή η θωράκιση _tier-%1$d_ μπλοκάρει τη ζημιά _%2$d-%3$d_ και απαιτεί δύναμη _%4$d_ για να χρησιμοποιηθεί σωστά.
items.armor.armor.cursed=Μπορείς να νιώσεις μια κακόβουλη μαγεία να παραμονεύει μέσα σε αυτή την πανοπλία.
items.armor.armor.cursed_worn=Επειδή αυτή η πανοπλία είναι καταραμένη, είσαι ανίσχυρος να την αφαιρέσεις.
items.armor.armor.defense=Είναι επαυξημένο για να ενισχύσει την _άμυνα._
items.armor.armor.detach_seal=Αποσπάς τη σφραγίδα από την πανοπλία σου.
items.armor.armor.equip_cursed=Η πανοπλία συστέλλεται γύρω σου με επώδυνο τρόπο.
items.armor.armor.evasion=Είναι επαυξημένο για να ενισχύσει την _διαφυγή._
items.armor.armor.excess_str=Λόγω της υπερβολικής δύναμής σου, είσαι _πιο ευέλικτος_ όταν φοράς αυτή την πανοπλία.
items.armor.armor.glyph_hardened=Έχει _σκληρυνθεί._
items.armor.armor.hardened_no_glyph=Αυτή η πανοπλία έχει _σκληρυνθεί,_ αλλά προς το παρόν δεν φέρει χαραγμένο κάποιο σύμβολο.
items.armor.armor.hardening_gone=Η σκλήρυνση αυτής της πανοπλίας έχει φθαρεί!
items.armor.armor.identify=Τώρα είσαι αρκετά εξοικειωμένος με την πανοπλία σου για να την αναγνωρίσεις.
items.armor.armor.incompatible=Η αλληλεπίδραση διαφορετικών τύπων μαγείας έχει σβήσει το σύμβολο σε αυτήν την πανοπλία!
items.armor.armor.inscribed=φέρει χαραγμένο ένα _%s._
items.armor.armor.not_cursed=Αυτή η πανοπλία είναι απαλλαγμένη από κακόβουλη μαγεία.
items.armor.armor.probably_too_heavy=Πιθανώς αυτή η πανοπλία είναι πολύ βαριά για σένα.
items.armor.armor.seal_attached=Η σπασμένη σφραγίδα του Πολεμιστή είναι προσαρτημένη σε αυτήν την πανοπλία. Όταν πρόκειται να τραυματιστεί κάτω από το μισό επίπεδο ζωής, θα του δώσει _%d θωράκιση_.
items.armor.armor.seal_transfer=Η σπασμένη σφραγίδα του Πολεμιστή πρέπει να τοποθετηθεί στην ήδη φθαρμένη πανοπλία του για να τον ωφελήσει. Θέλετε να αποσυνδέσετε αυτόματα τη σφραγίδα από την πανοπλία που αφαιρείτε και να την τοποθετήσετε στην πανοπλία που εξοπλίζετε;
items.armor.armor.seal_transfer_no=Όχι
items.armor.armor.seal_transfer_yes=Ναί
items.armor.armor.too_heavy=Λόγω της ανεπαρκούς δύναμής σας, η χρήση αυτής της πανοπλίας θα μειώσει την ικανότητά σας να κινείστε, να αποφεύγετε και να αμύνεστε.
items.armor.armor.weak_cursed=Παρά την κατάρα, είσαι σε θέση να αποεξοπλίσεις αυτήν την πανοπλία.
items.armor.classarmor.ac_ability=ΕΠΙΛΕΞΤΕ ΙΚΑΝΟΤΗΤΑ
items.armor.classarmor.ac_transfer=ΜΕΤΑΦΟΡΑ
items.armor.classarmor.charge_use=Η χρήση της ικανότητας τώρα θα καταναλώσει φόρτιση _%s_.
items.armor.classarmor.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο αφού νικήσετε τον αρχηγό του 20ου ορόφου με έναν συγκεκριμένο ήρωα.
items.armor.classarmor.low_charge=Η πανοπλία δεν έχει αρκετό φορτίο για να χρησιμοποιήσει την ειδική της δύναμη!
items.armor.classarmor.no_ability=Η πανοπλία σου δεν έχει καμία ικανότητα αυτήν τη στιγμή, θα πρέπει να διαλέξεις μία!
items.armor.classarmor.not_equipped=Πρέπει να φοράς αυτήν την πανοπλία για να χρησιμοποιήσεις την ειδική της δύναμη!
items.armor.classarmor.transfer_cancel=ματαίωση
items.armor.classarmor.transfer_complete=Οι ιδιότητες της ηρωικής σου πανοπλίας έχουν μεταφερθεί!
items.armor.classarmor.transfer_desc=Η μαγεία του στέμματος του νάνου βασιλιά μπορεί να μεταφερθεί σε ένα άλλο σετ πανοπλίας. Σημειώστε ότι η αρχική πανοπλία θα καταστραφεί στη διαδικασία.
items.armor.classarmor.transfer_prompt=Επιλέξτε μια πανοπλία
items.armor.classarmor.transfer_title=Μεταφορά πανοπλίας
items.armor.clericarmor.desc=Ενώ φοράει αυτό το μείγμα υφάσματος και πιάτου, ο Κληρικός μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.clericarmor.name=άμφια ηρώων
items.armor.clotharmor.desc=Αυτή η ελαφριά θωράκιση προσφέρει βασική προστασία.
items.armor.clotharmor.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.armor.clotharmor.name=υφασμάτινη πανοπλία
items.armor.curses.antientropy.desc=Η κατάρα της Αντιεντροπίας λειτουργεί ενάντια στις δυνάμεις του σύμπαντος, τραβώντας ενέργεια προς τον χρήστη και μακριά από το περιβάλλον του. Αυτό βάζει για λίγο φωτιά στον χρήστη, αλλά παγώνει τα πάντα γύρω του!
items.armor.curses.antientropy.name=%s της αντι-εντροπίας
items.armor.curses.bulk.desc=Η ογκώδης πανοπλία φαίνεται μεγαλύτερη και πιο επιβλητική, αλλά στην πραγματικότητα δεν έχει ενισχυμένη άμυνα. Ακόμα χειρότερα, το πρόσθετο μέγεθος καθιστά πολύ δύσκολη την είσοδο σε πόρτες.
items.armor.curses.bulk.name=%s χύμα
items.armor.curses.corrosion.desc=Η θωράκιση διάβρωσης είναι ικανή να εκραγεί με διαβρωτικό υγρό, επικαλύπτοντας τα πάντα στην περιοχή με κολλώδη όξινη εκροή.
items.armor.curses.corrosion.name=%s της διάβρωσης
items.armor.curses.displacement.desc=Η κατάρα της μετατόπισης επιχειρεί να μετακινήσει τον χρήστη σε ασφαλές μέρος όταν δέχεται επίθεση. Είναι λίγο υπερβολικά αποτελεσματική, ωστόσο, τηλεμεταφέροντας τυχαία τον χρήστη σε όλο το επίπεδο.
items.armor.curses.displacement.name=%s μετατόπισης
items.armor.curses.metabolism.desc=Η κατάρα του μεταβολισμού μετατρέπει άμεσα τον κορεσμό σε υγεία όταν ο χρήστης τραυματίζεται, παρέχοντας μια ώθηση στην επούλωση, αλλά προκαλώντας γρήγορα πείνα.
items.armor.curses.metabolism.name=%s του μεταβολισμού
items.armor.curses.multiplicity.desc=Η πανοπλία που έχει καταραστεί με πολλαπλότητα περιέχει επικίνδυνη μαγεία διπλασιασμού. Μερικές φορές δημιουργεί μια κατοπτρική εικόνα του χρήστη, αλλά είναι εξίσου πιθανό να διπλασιάσει τον επιτιθέμενο!
items.armor.curses.multiplicity.name=%s πολλαπλότητας
items.armor.curses.overgrowth.desc=Η πανοπλία από υπερβλάστηση καλύπτεται από διάφορα ανθισμένα φυτά. Ενώ αυτό το εφέ φαίνεται σίγουρα ενδιαφέρον, δεν κάνει τίποτα για άμυνα και αυτά τα φυτά θα ενεργοποιηθούν τυχαία στη μάχη!
items.armor.curses.overgrowth.name=%s υπερανάπτυξης
items.armor.curses.stench.desc=Η καταραμένη με δυσοσμία πανοπλία θα απελευθερώσει σύννεφα επιβλαβούς αερίου, το οποίο είναι επικίνδυνο για οτιδήποτε παγιδευτεί στο σύννεφο.
items.armor.curses.stench.name=%s δυσοσμίας
items.armor.duelistarmor.desc=Ενώ φοράει αυτήν την πανοπλία και την κάπα, ο Μονομάχος μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.duelistarmor.name=θώρακας ήρωα
items.armor.glyphs.affection.desc=Αυτό το ισχυρό σύμβολο χειραγωγεί το μυαλό των επιτιθέμενων, γοητεύοντάς τους προσωρινά.
items.armor.glyphs.affection.name=%s στοργής
items.armor.glyphs.antimagic.desc=Αυτό το ισχυρό σύμβολο επιτρέπει στην πανοπλία να υπερασπίζεται τον κάτοχό της από μαγικές επιθέσεις, καθώς και από φυσικές. Αυτή η μαγική άμυνα δεν επηρεάζεται από το επίπεδο της πανοπλίας.
items.armor.glyphs.antimagic.name=%s της αντιμαγείας
items.armor.glyphs.brimstone.desc=Αυτό το σύμβολο προστατεύει τον χρήστη και τα υπάρχοντά του από τη φωτιά, εξαλείφοντας εντελώς τη ζημιά και τις αρνητικές επιπτώσεις της.
items.armor.glyphs.brimstone.name=%s από θειάφι
items.armor.glyphs.camouflage.desc=Αυτό το σύμβολο επιτρέπει στον χρήστη να ενσωματωθεί σε ψηλό γρασίδι, χαρίζοντάς του προσωρινή αορατότητα.
items.armor.glyphs.camouflage.name=%s καμουφλάζ
items.armor.glyphs.entanglement.desc=Αυτό το σύμβολο δημιουργεί μια χωμάτινη πανοπλία γύρω από τον χρήστη για να απορροφήσει τη ζημιά, αλλά αυτή η πανοπλία θα σπάσει αν ο χρήστης κινηθεί.
items.armor.glyphs.entanglement.name=%s εμπλοκής
items.armor.glyphs.flow.desc=Αυτό το σύμβολο χειρίζεται τη ροή του νερού γύρω από τον χρήστη, καθιστώντας τον πολύ πιο γρήγορο όταν κινείται μέσα σε αυτό.
items.armor.glyphs.flow.name=%s ροής
items.armor.glyphs.obfuscation.desc=Αυτό το σύμβολο κρύβει τον χρήστη, καθιστώντας τον πιο δύσκολο να εντοπιστεί.
items.armor.glyphs.obfuscation.name=%s συσκότισης
items.armor.glyphs.potential.desc=Αυτό το σύμβολο συσσωρεύει ενέργεια όταν το χτυπάς, δίνοντας φόρτιση στο ραβδί του χρήστη όταν ενεργοποιείται.
items.armor.glyphs.potential.name=%s δυναμικού
items.armor.glyphs.repulsion.desc=Αυτό το σύμβολο αναπηδά δύναμη εναντίον των επιτιθέμενων, στέλνοντάς τους να πετάξουν πίσω.
items.armor.glyphs.repulsion.name=%s απώθησης
items.armor.glyphs.stone.desc=Αυτό το σύμβολο περιβάλλει την πανοπλία με βαριά μαγική πέτρα που καθιστά αδύνατη την αποφυγή, αλλά μπλοκάρει τη ζημιά ανάλογα με την αποφυγή.
items.armor.glyphs.stone.name=%s από πέτρα
items.armor.glyphs.swiftness.desc=Αυτό το σύμβολο ενισχύει την ταχύτητα του χρήστη κάθε φορά που δεν βρίσκεται κοντά σε εχθρό.
items.armor.glyphs.swiftness.name=%s ταχύτητας
items.armor.glyphs.thorns.desc=Αυτό το ισχυρό σύμβολο βλάπτει τους επιτιθέμενους, προκαλώντας τους να αιμορραγούν αργά όταν επιτίθενται στον χρήστη.
items.armor.glyphs.thorns.name=%s από αγκάθια
items.armor.glyphs.viscosity$defereddamage.desc=Η ζημιά αντιμετωπίζεται αργά με την πάροδο του χρόνου αντί για άμεσα. \n\nΥπόλοιπη ζημιά που απομένει: %d.
items.armor.glyphs.viscosity$defereddamage.name=αναβαλλόμενη ζημιά
items.armor.glyphs.viscosity$defereddamage.ondeath=Η αναβαλλόμενη ζημιά σε σκότωσε...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Σκοτώθηκε από αναβαλλόμενη ζημιά
items.armor.glyphs.viscosity.deferred=αναβαλλόμενο %d
items.armor.glyphs.viscosity.desc=Αυτό το σύμβολο είναι σε θέση να αποθηκεύει τη ζημιά που προκαλείται στον χρήστη, προκαλώντας την αργά και όχι μονομιάς.
items.armor.glyphs.viscosity.name=%s ιξώδους
items.armor.huntressarmor.desc=Ενώ φοράει αυτόν τον μανδύα, η Κυνηγός μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.huntressarmor.name=μανδύας ήρωα
items.armor.huntressarmor.no_enemies=Δεν υπάρχουν εχθροί στο οπτικό πεδίο
items.armor.leatherarmor.desc=Πανοπλία φτιαγμένη από κατεργασμένο δέρμα τέρατος. Δεν είναι τόσο ελαφριά όσο η υφασμάτινη πανοπλία αλλά παρέχει καλύτερη προστασία.
items.armor.leatherarmor.name=δερμάτινη πανοπλία
items.armor.magearmor.desc=Ενώ φοράει αυτή την πανέμορφη ρόμπα, ο Μάγος μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.magearmor.name=ρόμπα ήρωα
items.armor.mailarmor.desc=Οι αλληλοσυνδεόμενοι μεταλλικοί κρίκοι δημιουργούν μια ανθεκτική αλλά εύκαμπτη πανοπλία.
items.armor.mailarmor.name=πανοπλία αλληλογραφίας
items.armor.platearmor.desc=Τεράστιες μεταλλικές πλάκες ενώνονται σε μια στολή που παρέχει απαράμιλλη προστασία σε κάθε τυχοδιώκτη αρκετά δυνατό ώστε να αντέξει το εντυπωσιακό βάρος της.
items.armor.platearmor.name=πλάκα θωράκισης
items.armor.roguearmor.desc=Ενώ φοράει αυτή τη σκούρα ενδυμασία, ο Ρόουγκ μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.roguearmor.name=ενδυμασία ήρωα
items.armor.scalearmor.desc=Τα μεταλλικά λέπια που είναι ραμμένα σε ένα δερμάτινο γιλέκο δημιουργούν μια εύκαμπτη, αλλά προστατευτική πανοπλία.
items.armor.scalearmor.name=πανοπλία κλίμακας
items.armor.warriorarmor.desc=Ενώ φοράει αυτή την βαριά επιμεταλλωμένη πανοπλία, ο Πολεμιστής μπορεί να εκτελέσει μια ειδική ικανότητα.
items.armor.warriorarmor.name=ταχυδρομική πινακίδα ήρωα
items.artifacts.alchemiststoolkit.ac_brew=ΕΤΟΙΜΑΖΩ
items.artifacts.alchemiststoolkit.ac_energize=ΕΝΕΡΓΟΠΟΙΩ
items.artifacts.alchemiststoolkit.cursed=Η καταραμένη εργαλειοθήκη σου σε εμποδίζει να χρησιμοποιήσεις την αλχημεία!
items.artifacts.alchemiststoolkit.desc=Αυτό το κιτ εργαλείων περιέχει μια σειρά από αντιδραστήρια και βότανα μαζί με ένα μικρό φιαλίδιο ανάμειξης, επιτρέποντας την αλχημεία εν κινήσει. Το φιαλίδιο περιέχει κάτι που μοιάζει με κρυστάλλους αλχημικής ενέργειας σε υγρή μορφή.
items.artifacts.alchemiststoolkit.desc_cursed=Η καταραμένη εργαλειοθήκη έχει δεθεί στο πλευρό σου και αρνείται να σε αφήσει να χρησιμοποιήσεις αλχημεία.
items.artifacts.alchemiststoolkit.desc_hint=Η εξοπλισμένη εργαλειοθήκη παράγει σιγά σιγά αλχημική ενέργεια καθώς αποκτάτε εμπειρία. Φαίνεται ότι το μείγμα στο φιαλίδιο θα μπορούσε να ενισχυθεί προσθέτοντας κρυστάλλους ενέργειας σε αυτό.
items.artifacts.alchemiststoolkit.desc_warming=Το κιτ εργαλείων προθερμαίνεται αυτήν τη στιγμή και θα είναι έτοιμο για χρήση μετά από λίγο.
items.artifacts.alchemiststoolkit.energize_1=6 ενέργεια: +1 επίπεδο
items.artifacts.alchemiststoolkit.energize_all=Ενέργεια %1$d: επίπεδα +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Κάθε 6 κρύσταλλοι ενέργειας θα δώσουν στο κιτ εργαλείων αρκετή ενέργεια για να αποκτήσει ένα επίπεδο, γεγονός που αυξάνει τον ρυθμό με τον οποίο το κιτ εργαλείων παράγει ενέργεια με την πάροδο του χρόνου και πόσο γρήγορα θερμαίνεται. \n\nΠόση ενέργεια θα θέλατε να χρησιμοποιήσετε;
items.artifacts.alchemiststoolkit.name=εργαλειοθήκη αλχημιστή
items.artifacts.alchemiststoolkit.need_energy=Χρειάζεστε τουλάχιστον 6 ενέργεια για αυτό.
items.artifacts.alchemiststoolkit.not_ready=Η εργαλειοθήκη σας δεν έχει ολοκληρωθεί η προθέρμανση.
items.artifacts.artifact.cannot_wear_two=Δεν μπορείς να φορέσεις δύο από το ίδιο αντικείμενο.
items.artifacts.artifact.curse_known=Μπορείτε να νιώσετε μια κακόβουλη μαγεία να παραμονεύει μέσα στο τεχνούργημα.
items.artifacts.artifact.equip_cursed=Το τεχνούργημα δένεται επώδυνα μαζί σου.
items.artifacts.artifact.need_to_equip=Πρέπει να εξοπλίσεις το τεχνούργημά σου για να το κάνεις αυτό.
items.artifacts.artifact.not_cursed=Αυτό το τεχνούργημα είναι απαλλαγμένο από κακόβουλη μαγεία.
items.artifacts.capeofthorns$thorns.desc=Η κάπα σου ακτινοβολεί ενέργεια, περιβάλλοντάς σε σε ένα πεδίο εκτροπικής δύναμης! \n\nΌλη η ζημιά που δέχεσαι μειώνεται όσο είναι ενεργό το εφέ αγκάθια. Επιπλέον, αν ο επιτιθέμενος είναι δίπλα σου, η μειωμένη ποσότητα εκτρέπεται πίσω στον επιτιθέμενο.\n\nΣτροφές αγκάθια που απομένουν: %s.
items.artifacts.capeofthorns$thorns.inert=Η κάπα σου γίνεται ξανά αδρανής.
items.artifacts.capeofthorns$thorns.levelup=Η κάπα σου δυναμώνει!
items.artifacts.capeofthorns$thorns.name=αγκάθια
items.artifacts.capeofthorns$thorns.radiating=Η κάπα σας αρχίζει να ακτινοβολεί ενέργεια, νιώθετε προστατευμένοι!
items.artifacts.capeofthorns.desc=Αυτά τα συμπτυχμένα μεταλλικά φύλλα από το DM-300 έχουν σχηματιστεί μαζί σε ένα άκαμπτο ακρωτήριο. Φαίνεται να αποθηκεύει μια βαθιά ενέργεια, ίσως να έχει και μέρος της ισχύος του DM-300;
items.artifacts.capeofthorns.desc_active=Η κάπα φαίνεται να απελευθερώνει αποθηκευμένη ενέργεια, ακτινοβολεί μια προστατευτική δύναμη.
items.artifacts.capeofthorns.desc_inactive=Η κάπα σε βαραίνει καθησυχαστικά, μοιάζει να παίρνει ενέργεια από τη ζημιά που δέχεσαι.
items.artifacts.capeofthorns.name=ακρωτήριο με αγκάθια
items.artifacts.chaliceofblood.ac_prick=ΠΟΥΤΣΟΣ
items.artifacts.chaliceofblood.desc=Αυτό το λαμπερό ασημένιο δισκοπότηρο είναι περίεργα διακοσμημένο με αιχμηρά πετράδια στο χείλος.
items.artifacts.chaliceofblood.desc_1=Καθώς κρατάς το δισκοπότηρο, νιώθεις μια παράξενη ανάγκη να τρυπήσεις τον εαυτό σου στα αιχμηρά πετράδια.
items.artifacts.chaliceofblood.desc_2=Μέρος του αίματός σας συγκεντρώνεται στο δισκοπότηρο, μπορείτε να νιώσετε διακριτικά το δισκοπότηρο να σας τροφοδοτεί με ζωτική ενέργεια, αυξάνοντας τη φυσική αναγέννηση της υγείας σας. Θέλετε ακόμα να κοπείτε στο δισκοπότηρο, παρόλο που ξέρετε ότι θα πονέσει.
items.artifacts.chaliceofblood.desc_3=Το δισκοπότηρο είναι γεμάτο μέχρι το χείλος με την ουσία της ζωής σας. Μπορείτε να νιώσετε το δισκοπότηρο να σας επιστρέφει ζωτική ενέργεια.
items.artifacts.chaliceofblood.desc_cursed=Το καταραμένο δισκοπότηρο έχει δέσει τον εαυτό του στο χέρι σου και εμποδίζει την ικανότητά σου να αναγεννάς την υγεία σου.
items.artifacts.chaliceofblood.name=δισκοπότηρο αίματος
items.artifacts.chaliceofblood.no=Όχι, άλλαξα γνώμη
items.artifacts.chaliceofblood.ondeath=Το Δισκοπότηρο ρουφάει την ουσία της ζωής σου στεγνή...
items.artifacts.chaliceofblood.onprick=Τρυπάς τον εαυτό σου και η ουσία της ζωής σου στραγγίζει στο δισκοπότηρο.
items.artifacts.chaliceofblood.prick_warn=Κάθε φορά που χρησιμοποιείτε το δισκοπότηρο, θα απορροφά περισσότερη από την ενέργεια της ζωής σας, αλλά σε αντάλλαγμα θα ενισχύει περαιτέρω την φυσική αναγέννηση της υγείας σας.\n\n Αυτή τη στιγμή, το να τρυπάτε τον εαυτό σας προκαλεί _%1$d-%2$d ζημιά_, αν και αυτή η ζημιά μπορεί να μειωθεί _τόσο με φυσικό όσο και με μαγικό μπλοκάρισμα ή μείωση της ζημιάς._ Χωρίς να λαμβάνονται υπόψη οι επιπτώσεις της μείωσης της ζημιάς, το να τρυπάτε τον εαυτό σας έχει αυτήν τη στιγμή _%3$s%% πιθανότητα_ να εξαντλήσει εντελώς τη δύναμη της ζωής σας.\n\nΕίστε σίγουροι ότι θέλετε να προσφέρετε στο δισκοπότηρο περισσότερη ενέργεια ζωής;
items.artifacts.chaliceofblood.yes=Ναι, ξέρω τι κάνω
items.artifacts.cloakofshadows$cloakstealth.desc=Ο μανδύας των σκιών σου σου δίνει αορατότητα όσο είσαι καλυμμένος από αυτόν. Θα παραμείνεις καλυμμένος μέχρι να ακυρωθεί ή να εξαντληθεί ο μανδύας σου.\n\nΕνώ είσαι αόρατος, οι εχθροί δεν μπορούν να σε επιτεθούν ή να σε ακολουθήσουν. Οι φυσικές επιθέσεις και τα μαγικά εφέ (όπως πάπυροι και ραβδιά) θα ακυρώσουν αμέσως την αορατότητα.\n\nΓυρίζει μέχρι να φορτιστεί: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Ο μανδύας σου δυναμώνει!
items.artifacts.cloakofshadows$cloakstealth.name=καλυμμένος με μανδύα
items.artifacts.cloakofshadows$cloakstealth.no_charge=Η ενέργειά του μανδύα σου έχει εξαντληθεί.
items.artifacts.cloakofshadows.ac_stealth=ΛΑΘΡΑΙΑ
items.artifacts.cloakofshadows.cooldown=Ο μανδύας σου χρειάζεται %d περισσότερους γύρους για να αναζωογονηθεί.
items.artifacts.cloakofshadows.cursed=Δεν μπορείς να χρησιμοποιήσεις έναν καταραμένο μανδύα.
items.artifacts.cloakofshadows.desc=Ένας ανεκτίμητος μαγικός μανδύας, που κλάπηκε από το βασιλικό οπλοστάσιο πριν από πολλά χρόνια από τον Απατεώνα. Όταν φορεθεί, μπορεί να χρησιμοποιηθεί για να γίνει εντελώς αόρατος για μικρό χρονικό διάστημα.\n\n Όσο περισσότερο χρησιμοποιείται ο μανδύας, τόσο πιο δυνατός θα γίνεται, επιτρέποντας στον Απατεώνα να γίνεται αόρατος πιο συχνά και για μεγαλύτερα χρονικά διαστήματα.
items.artifacts.cloakofshadows.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.artifacts.cloakofshadows.name=μανδύας από σκιές
items.artifacts.cloakofshadows.no_charge=Ο μανδύας σου δεν έχει επαναφορτιστεί αρκετά για να είναι χρησιμοποιήσιμος ακόμα.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Πώς το επιβίωσες αυτό;
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Μακάρι να είχα κι εγώ ένα από αυτά...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ω, Θεέ μου! Είσαι ακόμα ζωντανός!
items.artifacts.driedrose$ghosthero.def_verb=απέφυγε
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Λυπάμαι... καλή τύχη...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Τελείωσέ το... χωρίς εμένα...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Όχι... δεν μπορώ...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Καλή τύχη...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Κουρασμένος... προς το παρόν...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Θα επιστρέψω...
items.artifacts.driedrose$ghosthero.desc=Μια εύθραυστη αιθέρια φιγούρα με ανθρωποειδές σχήμα. Η δύναμή τους φαίνεται να συνδέεται με το τριαντάφυλλο που έχεις. \n\nΑυτό το φάντασμα μπορεί να μην είναι και πολύ, φαίνεται να είναι ο μόνος αληθινός σου φίλος εδώ κάτω.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Γιατί συμβαίνει αυτό, νόμιζα ότι τα καταφέραμε;
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Πώς είναι αυτό το πράγμα ακόμα ικανό να επηρεάσει αυτόν τον κόσμο;
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ελπίζω να ξέρεις τι κάνεις με αυτό το φυλαχτό.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Υποθέτω ότι δεν τελειώσαμε ακόμα.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Έχουμε ήδη φτάσει τόσο μακριά, μπορούμε να το τελειώσουμε!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Λίγο ακόμα, μπορούμε να φύγουμε από εδώ!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Κανένας άνθρωπος ή νάνος δεν έχει βρεθεί εδώ για πολύ καιρό.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Τι θα έκανε τους νάνους να εγκαταλείψουν ένα χρυσωρυχείο;
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Είναι κρίμα που όλος ο χρυσός εδώ είναι άχρηστος επιφανειακά.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Τα πλάσματα εδώ είναι διεστραμμένα, όπως ακριβώς στους υπονόμους.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Ακόμα και οι νυχτερίδες είναι αιμοδιψείς εδώ.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Κανένα ίχνος εξοπλισμού εξόρυξης, τα πήραν πίσω όλα οι νάνοι;
items.artifacts.driedrose$ghosthero.dialogue_city_1=Οι νάνοι ήταν εργατικοί, αλλά άπληστοι.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Έτσι, η μητρόπολη των νάνων έχει πραγματικά πέσει.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Ελπίζω η επιφάνεια να μην καταλήξει ποτέ όπως αυτό το μέρος.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Οι νάνοι δεν υποτίθεται ότι πρέπει να φαίνονται τόσο χλωμοί.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Δεν ξέρω τι είναι χειρότερο, οι νάνοι ή τα δημιουργήματά τους.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Φαίνεται ότι οι νάνοι είναι πλέον και άβουλα τέρατα.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Τι είναι αυτό το μέρος;
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Αυτό το μέρος είναι τρομακτικό...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Τι σκέφτονταν οι νάνοι, παίζοντας με τη δύναμη έτσι;
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Τα τέρατα εδώ είναι απόκοσμα, από πού προήλθαν;
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Το νιώθεις; Είναι σαν κάτι να μας παρακολουθεί.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Δόξα τω Θεώ που υπάρχουν δάδες, είναι τόσο σκοτεινά εδώ!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Έχω ακούσει ιστορίες για αυτό το μέρος, τίποτα καλό.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Αυτό το μέρος ήταν πάντα περισσότερο μπουντρούμι παρά φυλακή.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Δεν μπορώ να φανταστώ τι συνέβη όταν αυτό το μέρος εγκαταλείφθηκε.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Φαίνεται ότι τόσο οι κρατούμενοι όσο και οι φρουροί έχουν μετατραπεί σε τέρατα.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Τι θα μπορούσε να ευθύνεται για όλους αυτούς τους σκελετούς;
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Δεν ήταν απαραίτητο να καταλήξουν έτσι αυτοί οι άνθρωποι...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Αυτοί οι υπόνομοι ήταν κάποτε ασφαλείς, οι άνθρωποι ζούσαν εδώ ακόμη και τον χειμώνα.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Αναρωτιέμαι τι απέγιναν οι περιπολίες της φρουράς, τα παράτησαν;
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Είχα οικογένεια στην επιφάνεια, ελπίζω να είναι ασφαλείς.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Οι φρουροί δεν μπόρεσαν να νικήσουν αυτά τα τέρατα, αλλά ίσως μπορούμε εμείς.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Αν ακόμη και οι αποχετεύσεις είναι τόσο επικίνδυνες, αναρωτιέμαι τι υπάρχει από κάτω...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Τι θα μπορούσε να έχει κάνει αυτούς τους αρουραίους και τα καβούρια να μεγαλώσουν τόσο πολύ;
items.artifacts.driedrose$ghosthero.direct_prompt=Τι πρέπει να κάνω;
items.artifacts.driedrose$ghosthero.directed_attack_1=Εντάξει, θα επιτεθώ σε αυτό.
items.artifacts.driedrose$ghosthero.directed_attack_2=Θα πάρω αυτό.
items.artifacts.driedrose$ghosthero.directed_attack_3=Ελκυστικός...
items.artifacts.driedrose$ghosthero.directed_attack_4=Ας τα πάρουμε!
items.artifacts.driedrose$ghosthero.directed_attack_5=Έχω αυτό.
items.artifacts.driedrose$ghosthero.directed_follow_1=Εντάξει, θα σε ακολουθήσω.
items.artifacts.driedrose$ghosthero.directed_follow_2=Θα μείνω πίσω σου.
items.artifacts.driedrose$ghosthero.directed_follow_3=Σε ακολουθώ...
items.artifacts.driedrose$ghosthero.directed_follow_4=Εντάξει, πάμε!
items.artifacts.driedrose$ghosthero.directed_follow_5=Σε στηρίζω.
items.artifacts.driedrose$ghosthero.directed_position_1=Εντάξει, θα κρατήσω αυτή τη θέση.
items.artifacts.driedrose$ghosthero.directed_position_2=Θα πάω εκεί και θα αμυνθώ.
items.artifacts.driedrose$ghosthero.directed_position_3=Επανατοποθέτηση...
items.artifacts.driedrose$ghosthero.directed_position_4=Στο δρόμο μου!
items.artifacts.driedrose$ghosthero.directed_position_5=Θα κατευθυνθώ προς τα εκεί.
items.artifacts.driedrose$ghosthero.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με ένα συγκεκριμένο τεχνούργημα.
items.artifacts.driedrose$ghosthero.hello=Γεια σου και πάλι %s.
items.artifacts.driedrose$ghosthero.introduce=Το πνεύμα μου είναι δεμένο με αυτό το τριαντάφυλλο, ήταν πολύτιμο για μένα, ένα δώρο από την αγάπη μου που άφησα στην επιφάνεια. \n\nΔεν μπορώ να επιστρέψω σε αυτόν, αλλά χάρη σε εσάς έχω μια δεύτερη ευκαιρία να ολοκληρώσω το ταξίδι μου. Όταν μπορέσω, θα ανταποκριθώ στο κάλεσμά σας και θα αγωνιστώ μαζί σας. \n\nΑ Όσο έχετε το τριαντάφυλλο, μπορώ να ακούσω τη φωνή σας, ώστε να μπορείτε να το χρησιμοποιήσετε για να με κατευθύνετε από μακριά. \n\nΕλπίζω να πετύχετε εκεί που απέτυχα εγώ...
items.artifacts.driedrose$ghosthero.name=θλιβερό φάντασμα
items.artifacts.driedrose$ghosthero.player_killed_1=Οχι!...
items.artifacts.driedrose$ghosthero.player_killed_2=Δεν μπορούσα να τους βοηθήσω...
items.artifacts.driedrose$ghosthero.player_killed_3=Όχι έτσι...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Μόνο οι νάνοι θα κατασκεύαζαν μια μηχανή εξόρυξης που σκοτώνει τους εισβολείς.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Αυτό το πράγμα είναι τεράστιο...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Πώς γίνεται αυτό το πράγμα να παραμένει ενεργό για τόσο καιρό;
items.artifacts.driedrose$ghosthero.seen_goo_1=Προσοχή Γκού!
items.artifacts.driedrose$ghosthero.seen_goo_2=Πολλοί από τους φίλους μου πέθαναν εξαιτίας αυτού του πράγματος, ώρα για εκδίκηση!
items.artifacts.driedrose$ghosthero.seen_goo_3=Ένα τέτοιο βδέλυγμα δεν μπορεί να επιτραπεί να ζήσει!
items.artifacts.driedrose$ghosthero.seen_king_1=Όταν οι άνθρωποι λένε ότι η εξουσία διαφθείρει, αυτό εννοούν.
items.artifacts.driedrose$ghosthero.seen_king_2=Είναι περισσότερο λιχουδάς παρά βασιλιάς τώρα.
items.artifacts.driedrose$ghosthero.seen_king_3=Ακόμα και στον θάνατο, οι νάνοι υπακούν στον αφέντη τους.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Ο μόνος κρατούμενος που έχει απομείνει είναι ένας θανάσιμος δολοφόνος. Φυσικά...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Μας έχει παγιδεύσει!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Έχω ακούσει τρομακτικές ιστορίες για αυτή τη μάσκα...
items.artifacts.driedrose$ghosthero.seen_yog_1=Ω, αυτό δεν φαίνεται καλό.
items.artifacts.driedrose$ghosthero.seen_yog_2=Έτσι μοιάζει λοιπόν ένας θεός;
