items.artifacts.masterthievesarmband.ac_steal=ΚΛΕΒΩ
items.artifacts.masterthievesarmband.cursed=Δεν μπορείς να χρησιμοποιήσεις ένα καταραμένο περιβραχιόνιο.
items.artifacts.masterthievesarmband.desc=Αυτό το μωβ βελούδινο περιβραχιόνιο φέρει το σημάδι ενός έμπειρου κλέφτη. Δεν ανήκει σε εσάς, αλλά πιθανότατα δεν ανήκε ούτε στον τελευταίο χρήστη του.
items.artifacts.masterthievesarmband.desc_cursed=Το καταραμένο περιβραχιόνιο είναι δεμένο στον καρπό σου, και με κάποιο τρόπο το πουγκί σου με το χρυσό φαίνεται να γίνεται σιγά σιγά ελαφρύτερο...
items.artifacts.masterthievesarmband.desc_worn=Νιώθεις τη δύναμη να συσσωρεύεται στο περιβραχιόνιο στον καρπό σου καθώς αποκτάς εμπειρία. Μπορείς να χρησιμοποιήσεις αυτήν τη δύναμη για να κλέψεις από καταστήματα ή για να ληστέψεις εχθρούς!\n\nΗ ληστεία των εχθρών συμβαίνει αμέσως, τους αποπροσανατολίζει για λίγο και σου δίνει την ευκαιρία να πάρεις ό,τι λάφυρα έχουν! Αυτή η δύναμη είναι πιο αποτελεσματική ενάντια σε εχθρούς που δεν γνωρίζουν. Η ληστεία του ίδιου εχθρού πολλές φορές δεν δίνει περισσότερες πιθανότητες για λάφυρα.
items.artifacts.masterthievesarmband.failed_steal=Δεν κατάφερες να κλέψεις τίποτα.
