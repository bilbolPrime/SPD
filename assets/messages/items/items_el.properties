items.journal.documentpage.desc=Μια μοναχική σελίδα, πιθανώς σκισμένη από κάποιο βιβλίο. Θα πρέπει να την πιάσεις για να τη διαβάσεις.
items.journal.documentpage.name=σκισμένη σελίδα
items.journal.guidebook.desc=Ένας οδηγός για τυχοδιώκτες, που άφησε εδώ κάποιος που αποφάσισε ότι οι περιπέτειες δεν ήταν για αυτούς! Αυτό το συγκεκριμένο βιβλίο είναι μαγικό και μπορεί να παρακινήσει τους τυχοδιώκτες να διαβάσουν μια σελίδα την κατάλληλη στιγμή. \n\nΠαρά αυτή τη λειτουργικότητα, το βιβλίο είναι πιο δημοφιλές λόγω των μεγάλων λέξεων "Μην πανικοβάλλεστε!" γραμμένες με μεγάλα φιλικά γράμματα στο εξώφυλλο.
items.journal.guidebook.hint_desktop=Ο οδηγός σας έχει συμβουλές για εσάς! Επιλέξτε το κουμπί του ημερολογίου που αναβοσβήνει (%s) επάνω δεξιά για να το διαβάσετε.
items.journal.guidebook.hint_mobile=Ο οδηγός σας έχει συμβουλές για εσάς! Πατήστε το κουμπί του ημερολογίου που αναβοσβήνει επάνω δεξιά για να το διαβάσετε.
items.journal.guidebook.hint_status=Οδηγός
items.journal.guidebook.name=τόμος της κυριαρχίας στα μπουντρούμια
items.journal.guidepage.desc=Μια σκισμένη σελίδα από έναν οδηγό περιπέτειας. \n\nΤο μεγαλύτερο μέρος του κειμένου είναι πολύ μικρό για να διαβαστεί από απόσταση, αλλά μπορείτε να διακρίνετε τον τίτλο της σελίδας: \n\n_"%s"_
items.journal.guidepage.name=σκισμένη σελίδα οδηγού
items.journal.regionlorepage$caves.desc=Αυτό που μοιάζει με καταχώρηση στο ημερολόγιο ενός εξερευνητή, διατηρημένο εκπληκτικά καλά, παρά το πόσο παλιό πρέπει να είναι. Πάρτε το για να το διαβάσετε.
items.journal.regionlorepage$caves.name=παλιά καταχώρηση αρχείου καταγραφής
items.journal.regionlorepage$city.desc=Μια μικρή σκουριασμένη μεταλλική πλάκα με ένα μαγικά χαραγμένο μήνυμα. Τα γράμματα είναι ακόμα καθαρά παρά την ηλικία της πλάκας, αλλά θα πρέπει να την σηκώσετε για να τη διαβάσετε.
items.journal.regionlorepage$city.name=σκουριασμένο tablet
items.journal.regionlorepage$halls.desc=Μια μικρή μαύρη πλάκα με χαραγμένα λαμπερά πράσινα γράμματα. Τα λαμπερά γράμματα θολώνουν μεταξύ τους δημιουργώντας μια ομίχλη από απόσταση, θα πρέπει να την σηκώσετε για να τη διαβάσετε.
items.journal.regionlorepage$halls.name=λαμπερό δισκίο
items.journal.regionlorepage$prison.desc=Μια καταχώρηση ημερολογίου ή κάποιο άλλο είδος αρχείου, γραμμένο σε ένα παλιό κομμάτι χαρτί. Φαίνεται ότι τα πήγε καλύτερα από τα γράμματα που βρήκες στους υπονόμους, αλλά θα χρειαστεί να το πάρεις στα χέρια σου για να το διαβάσεις.
items.journal.regionlorepage$prison.name=φθαρμένη καταχώρηση ημερολογίου
items.journal.regionlorepage$sewers.desc=Αυτό που μοιάζει με γράμμα, γραμμένο σε ένα λεκιασμένο από τη βρωμιά κομμάτι χαρτί. Θα πρέπει να το σηκώσετε για να μπορέσετε να διακρίνετε τι είναι γραμμένο σε αυτό.
items.journal.regionlorepage$sewers.name=φθαρμένο γράμμα
items.keys.crystalkey.desc=Οι κομμένες επιφάνειες αυτού του κρυστάλλινου κλειδιού λαμπυρίζουν στο σκοτάδι. Ίσως ανοίξει κάτι φτιαγμένο από κρύσταλλο;
items.keys.crystalkey.name=Κρυστάλλινο κλειδί
items.keys.goldenkey.desc=Οι εγκοπές σε αυτό το χρυσό κλειδί είναι μικροσκοπικές και περίπλοκες. Ίσως θα ανοίξει ένα κλειδωμένο σεντούκι;
items.keys.goldenkey.name=χρυσό κλειδί
items.keys.ironkey.desc=Οι εγκοπές σε αυτό το αρχαίο σιδερένιο κλειδί είναι πολύ φθαρμένες. Το δερμάτινο κορδόνι του είναι φθαρμένο από τον χρόνο. Ποια πόρτα μπορεί να ανοίξει;
items.keys.ironkey.name=σιδερένιο κλειδί
items.keys.skeletonkey.name=κλειδί σκελετού
items.keys.wornkey.desc=Αυτό το κλειδί είναι φθαρμένο και ξεθωριασμένο, αλλά φαίνεται σοβαρό. Πιθανώς μπορεί να ανοίξει κάποια σοβαρή πόρτα εκεί κοντά.
items.keys.wornkey.name=φθαρμένο κλειδί
items.kindofmisc.unequip_message=Πρέπει πρώτα να αφαιρέσετε τον εξοπλισμό από ένα από αυτά τα αντικείμενα. Επιλέξτε ένα αντικείμενο για ανταλλαγή.
items.kindofmisc.unequip_title=Αφαίρεση ενός αντικειμένου
items.kindofweapon.empty=αδειάζω
items.kindofweapon.equip_cursed=Η λαβή σου σφίγγει ακούσια γύρω από το όπλο.
items.kindofweapon.swift_equip=Εξοπλίζεις γρήγορα το όπλο σου.
items.kindofweapon.which_equip_msg=Σε ποια θέση όπλου θα θέλατε να εξοπλίσετε αυτό το αντικείμενο; \n\nΗ Πρωταθλήτρια επιτίθεται απευθείας με το κύριο όπλο της, αλλά μπορεί να χρησιμοποιήσει την ικανότητα και των δύο όπλων. Και τα δύο όπλα έχουν τον ίδιο αριθμό γόμωσης. \n\nΗ Πρωταθλήτρια μπορεί επίσης να ανταλλάξει άμεσα το κύριο και το δευτερεύον όπλο της.
items.kindofweapon.which_equip_primary=Πρωτεύον (%s)
items.kindofweapon.which_equip_secondary=Δευτερεύον (%s)
items.kingscrown.ac_wear=ΦΘΟΡΑ
items.kingscrown.desc=Το στέμμα του τελευταίου βασιλιά νάνου, λάμπει με τρομερή μαγική ενέργεια. \n\n Όταν φορεθεί, η μαγεία του στέμματος θα ρέει στην πανοπλία που φοράτε αυτήν τη στιγμή, μετατρέποντάς την σε μια _μοναδική επική πανοπλία με ειδικές ικανότητες_. Η νέα πανοπλία θα διατηρήσει όλες τις ιδιότητες της αρχικής πανοπλίας.
items.kingscrown.discover_hint=Μπορείτε να αποκτήσετε αυτό το αντικείμενο ως σταγόνα από ορισμένους εχθρούς.
items.kingscrown.naked=Δυστυχώς, το στέμμα δεν μπορεί να μεταμορφώσει τα εσώρουχά σας.
items.kingscrown.name=Στέμμα του Νάνου Βασιλιά
items.kingscrown.ratgraded=Τα πόδια του Βασιλιά των Ποντικών λάμπουν καθώς η πανοπλία σου μεταμορφώνεται!
items.kingscrown.upgraded=Το στέμμα λάμπει έντονα και μετά αποσυντίθεται καθώς η πανοπλία σου μεταμορφώνεται!
items.liquidmetal.ac_apply=ΕΦΑΡΜΟΖΩ
items.liquidmetal.already_fixed=Αυτό το όπλο που πετάχτηκε είναι ήδη σε άριστη κατάσταση!
items.liquidmetal.apply=Χρησιμοποιείς υγρό μέταλλο %d για να επισκευάσεις το όπλο που έχεις πετάξει.
items.liquidmetal.desc=Αυτό το μαγικό υγρό μπορεί να γεμίσει τις ρωγμές και τα σκισίματα σε ένα πεταμένο όπλο, αποκαθιστώντας το σε άριστη κατάσταση! Εάν από ένα σετ όπλων λείπει ένα όπλο αλλά έχει επισκευαστεί πλήρως, τότε το υγρό μέταλλο μπορεί ακόμη και να χρησιμοποιηθεί για να αντικαταστήσει ένα όπλο που λείπει από το σετ! \n\nA ένα όπλο βαθμίδας 1 απαιτεί 10 υγρά μέταλλα για να επισκευαστεί πλήρως, ένα όπλο βαθμίδας 5 απαιτεί 30. Κάθε αναβάθμιση αυξάνει επίσης την ποσότητα μετάλλου που απαιτείται κατά 35%. \n\nΤο υγρό μέταλλο δεν μπορεί να χρησιμοποιηθεί για την επισκευή των άκρων σε βέλη με αιχμή.
items.liquidmetal.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.liquidmetal.name=υγρό μέταλλο
items.liquidmetal.prompt=Επιλέξτε ένα όπλο που ρίχνεται
items.lostbackpack.desc=Αυτό είναι το χαμένο σας απόθεμα. Συλλέξτε το για να ανακτήσετε όλα τα αντικείμενα που χάσατε!
items.lostbackpack.name=χαμένο σακίδιο πλάτης
items.merchantsbeacon.ac_use=ΧΡΗΣΗ
items.merchantsbeacon.desc=Αυτό το παράξενο κομμάτι τεχνολογίας νάνων σάς επιτρέπει να επικοινωνείτε από μεγάλες αποστάσεις.\n\nΑφού ενεργοποιηθεί, αυτό το beacon θα σας επιτρέψει να πουλάτε αντικείμενα στην Pixel Mart από οπουδήποτε στο μπουντρούμι.\n\nΩστόσο, η μαγεία μέσα στο beacon θα διαρκέσει μόνο για μία συνεδρία, γι' αυτό χρησιμοποιήστε την με σύνεση.
items.merchantsbeacon.name=φάρος εμπόρου
items.potions.brews.aquabrew.desc=Όταν θρυμματιστεί, αυτό το ρόφημα θα απελευθερώσει μια ριπή νερού υπό πίεση στο σημείο που βρίσκεται. Είναι αρκετά ισχυρό μόνο για να προκαλέσει ζημιά σε φλογερούς εχθρούς, αλλά επίσης σκορπίζει νερό σε κοντινό έδαφος, απενεργοποιεί παγίδες, σβήνει φωτιές και απωθεί χαρακτήρες κοντά στην έκρηξη.
items.potions.brews.aquabrew.name=aqua brew
items.potions.brews.blizzardbrew.desc=Όταν θρυμματιστεί, αυτό το ρόφημα θα απελευθερώσει μια στροβιλιζόμενη χιονοθύελλα που εξαπλώνεται γρήγορα σαν αέριο.
items.potions.brews.blizzardbrew.name=ρόφημα χιονοθύελλας
items.potions.brews.brew.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.potions.brews.causticbrew.desc=Αυτό το ρόφημα θα διαδώσει διαβρωτική λάσπη σε μια μεγάλη περιοχή γύρω από το σημείο που θα θρυμματιστεί. Οτιδήποτε πιαστεί από τη λάσπη θα λιώσει αργά αν δεν μπορεί να την ξεπλύνει με νερό.
items.potions.brews.causticbrew.name=καυστικό ρόφημα
items.potions.brews.infernalbrew.desc=Όταν θρυμματιστεί, αυτό το ρόφημα θα εξαπολύσει μια μανιασμένη κόλαση που εξαπλώνεται γρήγορα σαν αέριο.
items.potions.brews.infernalbrew.name=κολασμένο ρόφημα
items.potions.brews.shockingbrew.desc=Όταν θρυμματιστεί, αυτό το ρόφημα θα εξαπολύσει μια ηλεκτρική καταιγίδα σε μια ευρεία περιοχή γύρω από το σημείο που θα σπάσει.
items.potions.brews.shockingbrew.name=συγκλονιστικό ρόφημα
items.potions.brews.unstablebrew.desc=Αυτό το μαγικό ρόφημα λάμπει με τα μεταβαλλόμενα χρώματα του ουράνιου τόξου. \n\nΌταν το πιείτε ή το πετάξετε, θα ενεργοποιηθεί η επίδραση ενός τυχαίου φίλτρου. Η επίδραση του φίλτρου θα είναι πάντα ωφέλιμη αν την πιείτε και θα είναι πάντα επιβλαβής αν την πετάξετε.
items.potions.brews.unstablebrew.name=ασταθής παρασκευή
items.potions.elixirs.elixir.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Έχετε προσωρινά αποκτήσει ιδιότητες αποκατάστασης παρόμοιες με αυτές του Goo.\n\nΕνώ στέκεστε στο νερό, θα ανακτάτε μια μικρή ποσότητα ζωής ανά γύρο. Η επίδραση διακόπτεται προσωρινά όταν βρίσκεστε σε πλήρη υγεία ή βρίσκεστε εκτός νερού.\n\nΥπόλοιπο θεραπείας που απομένει: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=υδρόβια θεραπεία
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Αυτό το ελιξίριο περιέχει τα υπολείμματα του Goo ενισχυμένα με ένα θεραπευτικό φίλτρο. Αν και δεν θα προσφέρει άμεση θεραπεία, θα αποκαθιστά σταθερά μεγαλύτερη ποσότητα υγείας ενώ στέκεστε στο νερό.
items.potions.elixirs.elixirofaquaticrejuvenation.name=ελιξίριο αναζωογόνησης στο νερό
items.potions.elixirs.elixirofarcanearmor.desc=Αυτό το ελιξίριο θα δώσει στον πότη μακροχρόνια αντίσταση στη μαγική ζημιά.
items.potions.elixirs.elixirofarcanearmor.name=ελιξίριο της απόκρυφης πανοπλίας
items.potions.elixirs.elixirofdragonsblood.desc=Όταν καταναλωθεί, αυτό το ελιξίριο θα στείλει πύρινη δύναμη να κυλήσει στις φλέβες του πότη. Αυτό το αποτέλεσμα θα κάνει τον πότη άτρωτο στη φωτιά και θα του επιτρέψει να πυρπολήσει τους εχθρούς με φυσικές επιθέσεις.
items.potions.elixirs.elixirofdragonsblood.name=ελιξίριο αίματος δράκου
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Βρίσκεστε υπό την επίδραση ενός ελιξιρίου πτώσης φτερών, που σας επιτρέπει να πέσετε σε χάσματα χωρίς να δεχθείτε ζημιά!\n\nΥπολειπόμενοι γύροι: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=πτώση φτερών
items.potions.elixirs.elixiroffeatherfall.desc=Αυτό το ελιξίριο προσφέρει ένα ασθενέστερο αλλά πιο ελεγχόμενο φαινόμενο αιώρησης, επιτρέποντας στον πότη να πέσει σε μεγάλες αποστάσεις χωρίς να υποστεί βλάβη για λίγο.
items.potions.elixirs.elixiroffeatherfall.light=Νιώθεις ελαφρύς σαν πούπουλο!
items.potions.elixirs.elixiroffeatherfall.name=ελιξίριο της πτώσης φτερών
items.potions.elixirs.elixirofhoneyedhealing.desc=Αυτό το ελιξίριο συνδυάζει τη θεραπεία με τη γλυκύτητα του μελιού. Όταν πίνεται, θα έχει το ίδιο αποτέλεσμα με ένα φίλτρο θεραπείας και θα ικανοποιήσει μια μικρή ποσότητα πείνας, αλλά μπορεί επίσης να πεταχτεί για να θεραπεύσει έναν σύμμαχο.\n\nΤα πλάσματα που έχουν αδυναμία στο μέλι μπορεί να ειρηνεύσουν αν χρησιμοποιηθεί αυτό το αντικείμενο πάνω τους.
items.potions.elixirs.elixirofhoneyedhealing.name=ελιξίριο θεραπείας με μέλι
items.potions.elixirs.elixiroficytouch.desc=Όταν καταναλωθεί, αυτό το ελιξίριο θα επιτρέψει στον πότη να απορροφήσει τη θερμότητα από τους εχθρούς στους οποίους επιτίθεται. Αυτό το αποτέλεσμα θα κάνει τον πότη άτρωτο στο κρύο και θα του επιτρέψει να ψύξει τους εχθρούς με σωματικές επιθέσεις.
items.potions.elixirs.elixiroficytouch.name=ελιξίριο παγωμένης αφής
items.potions.elixirs.elixirofmight$htboost.desc=Το σώμα σας αισθάνεται αφύσικα δυνατό και υγιές.\n\nΗ μέγιστη υγεία σας ενισχύεται για μεγάλο χρονικό διάστημα. Καθώς αυξάνετε τα επίπεδα, η ώθηση θα εξασθενεί σταθερά.\n\nΤρέχον ποσό ενίσχυσης: %d.\nΥπολοίπους επιπέδων: %d.
items.potions.elixirs.elixirofmight$htboost.name=μέγιστη ενίσχυση υγείας
items.potions.elixirs.elixirofmight.desc=Αυτό το ισχυρό υγρό θα ρέει μέσα στους μύες σας, αυξάνοντας μόνιμα τη δύναμή σας κατά ένα βαθμό και αυξάνοντας προσωρινά τη μέγιστη υγεία κατά πόντους %d. Η ενίσχυση της υγείας κλιμακώνεται με τη μέγιστη υγεία σας, αλλά θα εξασθενεί σιγά σιγά καθώς αυξάνετε επίπεδα.
items.potions.elixirs.elixirofmight.msg=Η νέα σου δύναμη ξεχειλίζει από δύναμη και τώρα έχεις δύναμη %d!
items.potions.elixirs.elixirofmight.name=ελιξίριο δύναμης
items.potions.elixirs.elixiroftoxicessence.desc=Όταν καταναλωθεί, αυτό το ελιξίριο θα εμποτίσει τον πότη με τοξική ενέργεια. Ο πότης θα διασπείρει συνεχώς τοξικό αέριο καθώς κινείται και θα είναι άτρωτος σε τοξικό αέριο και δηλητήριο για λίγο περισσότερο χρόνο από τη διάρκεια της επίδρασης.
items.potions.elixirs.elixiroftoxicessence.name=ελιξίριο τοξικής ουσίας
items.potions.exotic.exoticpotion.amber=εξωτικό κεχριμπαρένιο φίλτρο
items.potions.exotic.exoticpotion.azure=εξωτικό γαλάζιο φίλτρο
items.potions.exotic.exoticpotion.bistre=εξωτικό φίλτρο bistre
items.potions.exotic.exoticpotion.charcoal=εξωτικό φίλτρο άνθρακα
items.potions.exotic.exoticpotion.crimson=εξωτικό πορφυρό φίλτρο
items.potions.exotic.exoticpotion.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.potions.exotic.exoticpotion.golden=εξωτικό χρυσό φίλτρο
items.potions.exotic.exoticpotion.indigo=εξωτικό φίλτρο ίντιγκο
items.potions.exotic.exoticpotion.ivory=εξωτικό φίλτρο από ελεφαντόδοντο
items.potions.exotic.exoticpotion.jade=εξωτικό φίλτρο νεφρίτη
items.potions.exotic.exoticpotion.magenta=εξωτικό ματζέντα φίλτρο
items.potions.exotic.exoticpotion.no=Όχι, άλλαξα γνώμη
items.potions.exotic.exoticpotion.silver=εξωτικό ασημένιο φίλτρο
items.potions.exotic.exoticpotion.turquoise=εξωτικό τιρκουάζ φίλτρο
items.potions.exotic.exoticpotion.unknown_desc=Αυτό το στρογγυλό φιαλίδιο περιέχει ένα κοκκώδες πολύχρωμο υγρό. Φαίνεται ξένο προς αυτή τη γη, ποιος ξέρει τι μπορεί να κάνει όταν το πιεις ή το πετάξεις;
items.potions.exotic.exoticpotion.warning=Θέλεις πραγματικά να ακυρώσεις τη χρήση αυτού του φίλτρου; Θα καταναλωθεί ούτως ή άλλως.
items.potions.exotic.exoticpotion.yes=Ναι, είμαι θετικός/η
items.potions.exotic.potionofcleansing$cleanse.desc=Αυτός ο χαρακτήρας είναι προσωρινά άτρωτος σε όλες τις επιβλαβείς επιδράσεις της κατάστασης!\n\nΥπολειπόμενοι στροφές: %s.
items.potions.exotic.potionofcleansing$cleanse.name=καθαρισμένος
items.potions.exotic.potionofcleansing.desc=Αυτό το ισχυρό αντιδραστήριο θα καταστήσει τον πότη άτρωτο σε όλες τις επιβλαβείς επιπτώσεις της κατάστασης για μερικούς γύρους όταν πιει. Μπορεί επίσης να ριχθεί σε έναν στόχο για να τον καθαρίσει.
items.potions.exotic.potionofcleansing.name=φίλτρο καθαρισμού
items.potions.exotic.potionofcorrosivegas.desc=Το άνοιγμα ή το θρυμματισμό αυτού του υπό πίεση γυαλιού θα προκαλέσει την έκρηξη του περιεχομένου του σε ένα θανατηφόρο νέφος διαβρωτικού αερίου στο χρώμα της σκουριάς. Το αέριο εξαπλώνεται πιο γρήγορα από το τοξικό αέριο και είναι πιο θανατηφόρο, αλλά δεν θα διαρκέσει τόσο πολύ.
items.potions.exotic.potionofcorrosivegas.name=φίλτρο διαβρωτικού αερίου
items.potions.exotic.potionofdivineinspiration.bonus=+2 Πόντοι Ταλέντου!
items.potions.exotic.potionofdivineinspiration.desc=Με τη δύναμη της ιερής ενέργειας να έχει μειωθεί σε υγρή μορφή, αυτό το βύθισμα θα εμποτίσει τον πότη με θεϊκή δύναμη, δίνοντάς του δύο επιπλέον πόντους ταλέντου σε μια βαθμίδα της επιλογής του.\n\nΑυτό το φίλτρο μπορεί να χρησιμοποιηθεί μόνο μία φορά για κάθε βαθμίδα ταλέντου.
items.potions.exotic.potionofdivineinspiration.name=φίλτρο θεϊκής έμπνευσης
items.potions.exotic.potionofdivineinspiration.no_more_points=Δεν μπορείτε να κερδίσετε περισσότερους πόντους μπόνους ταλέντου.
items.potions.exotic.potionofdivineinspiration.select_tier=Επίλεξε ένα επίπεδο ταλέντου για να κερδίσεις δύο επιπλέον πόντους. Πρέπει να έχεις ξεκλειδώσει το επίπεδο για να μπορέσεις να ξοδέψεις τους πόντους.
items.potions.exotic.potionofdragonsbreath.desc=Αυτή η φιάλη περιέχει μια ασυνήθιστη ένωση η οποία εκρήγνυται και παίρνει φλόγα λίγο μετά την ανάμειξη με το σάλιο. Φτύνοντας γρήγορα το υγρό, ο χρήστης μπορεί να ξεσπάσει φλόγα από το στόμα του!
items.potions.exotic.potionofdragonsbreath.name=φίλτρο της αναπνοής του δράκου
items.potions.exotic.potionofdragonsbreath.prompt=Επιλέξτε μια τοποθεσία για καύση
items.potions.exotic.potionofearthenarmor.desc=Αντί να παραλύει, αυτό το υγρό έχει μια σκληρυντική επίδραση στο δέρμα, η οποία το μετατρέπει σε προσωρινή φυσική θωράκιση.
items.potions.exotic.potionofearthenarmor.name=φίλτρο από χωμάτινη πανοπλία
items.potions.exotic.potionofmagicalsight.desc=Αφού το πιείτε, οι αισθήσεις σας θα ενισχυθούν για λίγο σε απίστευτα επίπεδα, επιτρέποντάς σας να βλέπετε μέσα από τοίχους σε ακτίνα 12 πλακιδίων!
items.potions.exotic.potionofmagicalsight.name=φίλτρο μαγικής όρασης
items.potions.exotic.potionofmastery.armor_easier=Η πανοπλία σας γίνεται πιο εύκολη στη χρήση!
items.potions.exotic.potionofmastery.desc=Αντί να παρέχει ακατέργαστη δύναμη, αυτό το φίλτρο θα συντονίσει τους μύες του χρήστη με ένα συγκεκριμένο αντικείμενο. Αυτό θα κάνει το αντικείμενο πιο εύκολο στη χρήση, σαν ο πότης να είχε εξασκηθεί με αυτό και να είχε αναπτύξει μυϊκή μνήμη. \n\nΤο επιλεγμένο όπλο ή πανοπλία θα απαιτεί 2 μονάδες λιγότερη δύναμη για να χρησιμοποιηθεί. Αυτό το φίλτρο μπορεί να χρησιμοποιηθεί μόνο μία φορά σε κάθε αντικείμενο.
items.potions.exotic.potionofmastery.name=φίλτρο κυριαρχίας
items.potions.exotic.potionofmastery.prompt=Κατακτήστε ένα στοιχείο
items.potions.exotic.potionofmastery.weapon_easier=Το όπλο σας γίνεται πιο εύκολο στη χρήση!
items.potions.exotic.potionofshielding.desc=Αντί να θεραπεύει, αυτό το φίλτρο θα προβάλλει μια ανθεκτική ασπίδα γύρω από το σώμα του χρήστη, μπλοκάροντας ένα σημαντικό ποσό ζημιάς.
items.potions.exotic.potionofshielding.name=φίλτρο θωράκισης
items.potions.exotic.potionofshroudingfog.desc=Όταν εκτίθεται στον αέρα, το υγρό σε αυτή τη φιάλη θα παράγει μια πυκνή καπνιστή ομίχλη που εξαπλώνεται γρήγορα και εμποδίζει την όραση των εχθρών σας.
items.potions.exotic.potionofshroudingfog.name=φίλτρο ομίχλης που καλύπτει
items.potions.exotic.potionofsnapfreeze.desc=Η χημική ουσία που περιέχεται σε αυτό το φίλτρο θα αντιδράσει γρήγορα με τον αέρα, παγώνοντας αμέσως και ριζώνοντας τα πάντα εντός της επίδρασής του.
items.potions.exotic.potionofsnapfreeze.name=φίλτρο ακαριαίας κατάψυξης
items.potions.exotic.potionofstamina.desc=Πίνοντας αυτό το παράξενα γλυκό υγρό θα σας δώσει μια ώθηση ενέργειας μακράς διαρκείας, επιτρέποντάς σας να τρέχετε με επιταχυνόμενο ρυθμό για μεγάλο χρονικό διάστημα.
items.potions.exotic.potionofstamina.name=φίλτρο αντοχής
items.potions.exotic.potionofstormclouds.desc=Ρίχνοντας αυτό το φίλτρο θα δημιουργηθεί ένα γρήγορα εξαπλούμενο σύννεφο συμπυκνωμένου ατμού, το οποίο θα συμπυκνωθεί και θα χυθεί στο περιβάλλον. Το μεγαλύτερο μέρος του εδάφους θα μετατραπεί σε νερό, οι πύρινοι εχθροί θα υποστούν ζημιά, η φωτιά θα σβήσει και οι παγίδες θα κατακλυστούν και θα σπάσουν.
items.potions.exotic.potionofstormclouds.name=φίλτρο από σύννεφα καταιγίδας
items.potions.potion$placeholder.name=δόση
items.potions.potion$seedtopotion.name=Τυχαίο φίλτρο
items.potions.potion.ac_drink=ΠΙΕΣ
items.potions.potion.amber=κεχριμπαρένιο φίλτρο
items.potions.potion.azure=γαλάζιο φίλτρο
items.potions.potion.beneficial=Ευεργετικό φίλτρο
items.potions.potion.bistre=φίλτρο bistre
items.potions.potion.charcoal=φίλτρο άνθρακα
items.potions.potion.crimson=πορφυρό φίλτρο
items.potions.potion.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο τυχαία στο μπουντρούμι ή να το κατασκευάσετε μέσω αλχημείας.
items.potions.potion.golden=χρυσό φίλτρο
items.potions.potion.harmful=Επιβλαβές φίλτρο!
items.potions.potion.indigo=φίλτρο ίντιγκο
items.potions.potion.ivory=φίλτρο από ελεφαντόδοντο
items.potions.potion.jade=φίλτρο νεφρίτη
items.potions.potion.magenta=ματζέντα φίλτρο
items.potions.potion.no=Όχι, άλλαξα γνώμη
items.potions.potion.shatter=Το φιαλίδιο θρυμματίζεται και το υγρό πιτσιλίζει ακίνδυνα.
items.potions.potion.silver=ασημένιο φίλτρο
items.potions.potion.sure_drink=Είσαι σίγουρος ότι θέλεις να το πιεις; Στις περισσότερες περιπτώσεις θα πρέπει να πετάς τέτοια φίλτρα στους εχθρούς σου.
items.potions.potion.sure_throw=Είσαι σίγουρος ότι θέλεις να το πετάξεις; Στις περισσότερες περιπτώσεις είναι λογικό να το πιεις.
items.potions.potion.turquoise=τυρκουάζ φίλτρο
items.potions.potion.unknown_desc=Στο φιαλίδιο αυτό στροβιλίζεται ένα %s υγρό. Ποιος ξέρει τι θα συμβεί αν το πιεις ή το πετάξεις;
items.potions.potion.yes=Ναι, ξέρω τι κάνω
items.potions.potionofexperience.desc=Οι ιστορικές εμπειρίες από πλήθος μαχών, μετατραπέντες σε υγρή μορφή, αυτό το βύθισμα θα ανεβάσει αμέσως το επίπεδο εμπειρίας σας.
items.potions.potionofexperience.name=φίλτρο εμπειρίας
items.potions.potionoffrost.desc=Όταν εκτεθεί στον αέρα, αυτή η ουσία εξατμίζεται σε ένα παγωμένο σύννεφο. Κάθε πλάσμα που το αγγίζει παγώνει στη θέση του και δεν μπορεί ούτε να δράσει ούτε να κινηθεί.
items.potions.potionoffrost.name=φίλτρο παγετού
items.potions.potionofhaste.desc=Πίνοντας αυτό το παράξενα γλυκό υγρό θα σας γεμίσει με τεράστια ενέργεια για μικρό χρονικό διάστημα, επιτρέποντάς σας να τρέχετε με υψηλές ταχύτητες.
items.potions.potionofhaste.energetic=Νιώθεις γεμάτος ενέργεια!
items.potions.potionofhaste.name=φίλτρο βιασύνης
items.potions.potionofhealing.desc=Ένα ελιξίριο που αποκαθιστά αμέσως όλη την υγεία σου και θεραπεύει τη δηλητηρίαση.
items.potions.potionofhealing.heal=Οι πληγές σου αρχίζουν να κλείνουν.
items.potions.potionofhealing.name=θεραπευτικό φίλτρο
items.potions.potionofinvisibility.desc=Πίνοντας αυτό το φίλτρο γίνεσαι προσωρινά αόρατος και οι εχθροί δεν μπορούν να σε δουν. Αν επιτεθείς σε εχθρό ή χρησιμοποιήσεις ραβδί ή πάπυρο μπροστά στα μάτια του, η επίδραση χάνεται.
items.potions.potionofinvisibility.invisible=Βλέπεις τα χέρια σου να γίνονται αόρατα!
items.potions.potionofinvisibility.name=φίλτρο αορατότητας
items.potions.potionoflevitation.desc=Αυτό το παράξενο υγρό σε κάνει να αιωρείσαι, ώστε να περνάς εύκολα πάνω από παγίδες. Οι φλόγες και τα αέρια όμως γεμίζουν τον αέρα και δεν μπορείς να τα αποφύγεις έτσι.
items.potions.potionoflevitation.float=Πετάς στον αέρα!
items.potions.potionoflevitation.name=φίλτρο αιώρησης
items.potions.potionofliquidflame.desc=Αυτή η φιάλη περιέχει μια ασταθή ένωση η οποία θα εκραγεί βίαια και θα φλεγεί κατά την έκθεση στον αέρα.
items.potions.potionofliquidflame.name=φίλτρο υγρής φλόγας
items.potions.potionofmindvision.desc=Αφού πιείτε αυτό, το μυαλό σας θα συντονιστεί με την ψυχική υπογραφή μακρινών πλασμάτων, επιτρέποντάς σας να αισθανθείτε βιολογικές παρουσίες μέσα από τοίχους. Επίσης, αυτό το φίλτρο θα σας επιτρέψει να δείτε μέσα από κοντινούς τοίχους και πόρτες.
items.potions.potionofmindvision.name=φίλτρο νοητικής όρασης
items.potions.potionofmindvision.see_mobs=Μπορείς με κάποιο τρόπο να νιώσεις την παρουσία του μυαλού άλλων πλασμάτων!
items.potions.potionofmindvision.see_none=Μπορείς με κάποιο τρόπο να καταλάβεις ότι είσαι μόνος σε αυτό το επίπεδο αυτή τη στιγμή.
items.potions.potionofparalyticgas.desc=Μόλις εκτεθεί στον ανοιχτό αέρα, το υγρό σε αυτό το φιαλίδιο θα εξατμιστεί σε μια μουδιασμένη κίτρινη ομίχλη. Όποιος εισπνεύσει το σύννεφο θα παραλύσει αμέσως, ανίκανος να κινηθεί για κάποιο χρονικό διάστημα αφού διαλυθεί το σύννεφο. Αυτό το αντικείμενο μπορεί να πετάξει σε μακρινούς εχθρούς για να τους πιάσει υπό την επίδραση του αερίου.
items.potions.potionofparalyticgas.name=φίλτρο παραλυτικού αερίου
items.potions.potionofpurity.desc=Αυτή η ουσία εξουδετερώνει γρήγορα όλα τα βλαβερά αέρια στην περιοχή επίδρασης. Αν την πιεις, αποκτάς προσωρινή ανοσία σε αυτά.
items.potions.potionofpurity.freshness=Νιώθεις μια ασυνήθιστη φρεσκάδα στον αέρα.
items.potions.potionofpurity.name=Φίλτρο Καθαρισμού
items.potions.potionofpurity.protected=Μια προστατευτική μεμβράνη σε τυλίγει!
items.potions.potionofstrength.desc=Αυτό το ισχυρό υγρό θα διαπεράσει τους μύες σας, αυξάνοντας μόνιμα τη δύναμή σας κατά ένα βαθμό.
items.potions.potionofstrength.msg=Η νέα σου δύναμη ξεχειλίζει από δύναμη και τώρα έχεις δύναμη %d!
items.potions.potionofstrength.name=φίλτρο δύναμης
items.potions.potionoftoxicgas.desc=Το άνοιγμα ή το σπάσιμο αυτού του υπό πίεση γυαλιού θα προκαλέσει την έκρηξη του περιεχομένου του σε ένα θανατηφόρο σύννεφο τοξικού πράσινου αερίου. Μπορείτε να επιλέξετε να πετάτε αυτό το φίλτρο σε μακρινούς εχθρούς αντί να το ανοίγετε με το χέρι.
items.potions.potionoftoxicgas.name=φίλτρο τοξικού αερίου
items.quest.ceremonialcandle.desc=Ένα σετ κεριών, λιωμένα και συγχωνευμένα μεταξύ τους μέσω της χρήσης. \n\nA Μόνα τους είναι άχρηστα, αλλά όταν χρησιμοποιούνται με άλλα κεριά σε ένα μοτίβο, μπορούν να εστιάσουν την ενέργεια για μια τελετουργία επίκλησης.
items.quest.ceremonialcandle.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.ceremonialcandle.name=τελετουργικό κερί
items.quest.corpsedust.chill=Ένα ρίγος διατρέχει τη σπονδυλική σου στήλη.
items.quest.corpsedust.desc=Η μπάλα από σκόνη πτώματος δεν διαφέρει εξωτερικά από μια συνηθισμένη μπάλα σκόνης. Αλλά μπορείς να νιώσεις μια κακόβουλη ενέργεια να παραμονεύει μέσα της.\n\nΘα ήταν καλή ιδέα να την ξεφορτωθείς το συντομότερο δυνατό.
items.quest.corpsedust.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.corpsedust.name=σκόνη πτώματος
items.quest.darkgold.desc=Αυτό το μέταλλο ονομάζεται σκούρο όχι λόγω του χρώματός του (δεν διαφέρει από τον κανονικό χρυσό), αλλά επειδή λιώνει στο φως της ημέρας, καθιστώντας το άχρηστο στην επιφάνεια.
items.quest.darkgold.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.darkgold.name=σκούρο χρυσό μετάλλευμα
items.quest.darkgold.you_now_have=Τώρα έχετε σκούρο χρυσό μετάλλευμα %d.
items.quest.dwarftoken.desc=Πολλοί νάνοι και μερικές από τις μεγαλύτερες δημιουργίες τους κουβαλούν αυτά τα μικρά κομμάτια μετάλλου άγνωστης χρήσης. Ίσως είναι κοσμήματα ή ίσως κάποιο είδος ταυτότητας. Οι νάνοι είναι παράξενοι άνθρωποι.
items.quest.dwarftoken.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.dwarftoken.name=νάνος τόκεν
items.quest.embers.desc=Ειδικά κάρβουνα που μπορούν να συλλεχθούν μόνο από νεαρά στοιχειώδη της φωτιάς. Ακτινοβολούν θερμική ενέργεια.
items.quest.embers.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.embers.name=στοιχειώδη κάρβουνα
items.quest.escapecrystal.ac_use=ΧΡΗΣΗ
items.quest.escapecrystal.desc=Ένας λεπτός μαγικός κρύσταλλος που φαίνεται να περιέχει μαγεία τηλεμεταφοράς. Μπορείτε να χρησιμοποιήσετε τον κρύσταλλο ανά πάσα στιγμή για να φύγετε από το θησαυροφυλάκιο των νάνων, αλλά δεν θα μπορείτε να πάρετε τίποτα μαζί σας!
items.quest.escapecrystal.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.escapecrystal.name=κρύσταλλο διαφυγής
items.quest.gooblob.desc=Μια τρεμάμενη μάζα από κολλώδη ουσία, που αποκολλήθηκε από την Κολώδη ουσία καθώς πέθαινε. Είναι σχεδόν σαν μια μεγάλη μπάλα από ζελέ, αν και δεν θα τολμούσες να τη φας.\n\nΔεν κάνει τίποτα από μόνο του, αλλά μπορεί να είναι χρήσιμο όταν συνδυάζεται με ορισμένα φίλτρα ή μια βόμβα. Τουλάχιστον θα πρέπει να μετατραπεί σε μια αξιοπρεπή ποσότητα ενέργειας.
items.quest.gooblob.discover_hint=Μπορείτε να αποκτήσετε αυτό το αντικείμενο ως σταγόνα από ορισμένους εχθρούς.
items.quest.gooblob.name=μια σταγόνα λάσπης
items.quest.metalshard.desc=Ένα θραύσμα σκουριασμένου καταραμένου μετάλλου, το οποίο έσπασε από το DM-300 καθώς καταστράφηκε. Μπορείτε να νιώσετε μια ανενεργή κακόβουλη μαγεία μέσα σε αυτό.\n\nΔεν κάνει τίποτα από μόνο του, αλλά μπορεί να είναι χρήσιμο όταν συνδυάζεται με συγκεκριμένους πάπυρους ή μια βόμβα. Τουλάχιστον θα πρέπει να μετατραπεί σε μια αξιοπρεπή ποσότητα ενέργειας.
items.quest.metalshard.discover_hint=Μπορείτε να αποκτήσετε αυτό το αντικείμενο ως σταγόνα από ορισμένους εχθρούς.
items.quest.metalshard.name=καταραμένο μεταλλικό θραύσμα
items.quest.pickaxe.ability_desc=Ο Μονομάχος μπορεί να _τρυπήσει_ έναν εχθρό με μια αξίνα. Αυτό είναι εγγυημένο ότι θα χτυπήσει, εφαρμόζεται ως ευάλωτος για 3 γύρους και προκαλεί _%1$d-%2$d ζημιά_ σε εχθρούς με άκαμπτο δέρμα.
items.quest.pickaxe.ability_name=διατρυπώ
items.quest.pickaxe.desc=Αυτό είναι ένα στιβαρό και βαρύ εργαλείο για το σπάσιμο βράχων. Δεν χρειάζεται να εξοπλίσετε την αξίνα για να το χρησιμοποιήσετε, αλλά πιθανότατα μπορεί να χρησιμοποιηθεί και ως όπλο σε περίπτωση ανάγκης.
items.quest.pickaxe.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
items.quest.pickaxe.name=αξίνα
items.quest.pickaxe.upgrade_ability_stat_name=Ζημιά Ικανότητας
items.quest.ratskull.desc=Ένα εκπληκτικά μεγάλο κρανίο αρουραίου. Θα ήταν ένα εξαιρετικό κυνηγετικό τρόπαιο, αν είχατε έναν τοίχο για να το στερεώσετε.
items.quest.ratskull.name=γιγάντιο κρανίο αρουραίου
items.remains.bowfragment.desc=Αυτό το σπασμένο κομμάτι ξύλου ήταν κάποτε μέρος του πνευματικού τόξου μιας χαμένης Κυνηγού. Μπορείτε ακόμα να νιώσετε λίγη ενέργεια της φύσης που έχει απομείνει στο κομμάτι, μπορείτε να χρησιμοποιήσετε το κομμάτι για να φυτέψετε λίγο ψηλό γρασίδι γύρω σας. Ωστόσο, κάνοντας αυτό θα το καταστρέψετε.
items.remains.bowfragment.name=θραύσμα τόξου
items.remains.brokenhilt.desc=Αυτή η σπασμένη λαβή μοιάζει σαν να προέρχεται από το όπλο ενός ηττημένου Μονομάχου. Μπορείτε ακόμα να νιώσετε λίγη πολεμική δύναμη που έχει απομείνει στη λαβή, την οποία μπορείτε να χρησιμοποιήσετε για να πάρετε λίγη επιπλέον ζημιά στις επόμενες δύο επιθέσεις σώμα με σώμα. Ωστόσο, αν το κάνετε αυτό, η λαβή θα καταστραφεί.
items.remains.brokenhilt.name=σπασμένη λαβή
items.remains.brokenstaff.desc=Το ραβδί αυτού του Μάγου έσπασε στη μέση αφότου ο κάτοχός του πέθανε. Μπορείτε ακόμα να νιώσετε κάποια μαγική ενέργεια που έχει απομείνει στο ραβδί, μπορείτε να τη χρησιμοποιήσετε για να δώσετε στα ραβδιά σας μια μικρή ώθηση φόρτισης. Ωστόσο, αν το κάνετε αυτό, θα καταστρέψετε το ραβδί.
items.remains.brokenstaff.name=σπασμένο προσωπικό
items.remains.cloakscrap.desc=Αυτό το κομμάτι ημιδιαφανούς υφάσματος μοιάζει σαν να προέρχεται από τον μανδύα των σκιών ενός μεταγενινού Rogue. Μπορείτε ακόμα να νιώσετε λίγη μυστικιστική ενέργεια που έχει απομείνει μέσα του, μπορείτε να τη χρησιμοποιήσετε για να δώσετε στα τεχνουργήματά σας μια μικρή ώθηση φόρτισης. Κάτι τέτοιο, ωστόσο, θα καταστρέψει το ύφασμα.
items.remains.cloakscrap.name=θραύσματα υφάσματος
items.remains.remainsitem.ac_use=ΧΡΗΣΗ
items.remains.remainsitem.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο στα απομεινάρια ενός συγκεκριμένου ήρωα από μια προηγούμενη χαμένη πορεία.
items.remains.sealshard.desc=Αυτά τα μικροσκοπικά θραύσματα κόκκινου κεριού μοιάζουν σαν να προέρχονται από τη σφραγίδα ενός πεσμένου Πολεμιστή. Μπορείτε ακόμα να νιώσετε μια μικρή δόση θέλησης να προσκολλάται στη σφραγίδα, μπορείτε να τη χρησιμοποιήσετε για να προστατέψετε τον εαυτό σας από λίγη θωράκιση. Ωστόσο, κάνοντας αυτό θα καταστρέψετε τα θραύσματα της σφραγίδας.
items.remains.sealshard.name=θραύσματα φώκιας
items.remains.tornpage.desc=Αυτή η σελίδα μοιάζει σαν να έχει αντιγραφεί από τον ιερό τόμο ενός ληγμένου Κληρικού. Υπάρχει ακόμα λίγη θεϊκή ενέργεια που κολλάει πάνω της, μπορείτε να τη χρησιμοποιήσετε για να ανακτήσετε λίγη υγεία. Ωστόσο, κάνοντας αυτό θα καταστρέψετε τη σκισμένη σελίδα.
items.remains.tornpage.name=σκισμένη σελίδα
items.rings.ring.agate=δαχτυλίδι αχάτη
items.rings.ring.amethyst=δαχτυλίδι από αμέθυστο
items.rings.ring.curse_known=Μπορείς να νιώσεις μια κακόβουλη μαγεία να παραμονεύει μέσα σε αυτό το δαχτυλίδι.
items.rings.ring.cursed_worn=Επειδή αυτό το δαχτυλίδι είναι καταραμένο, είσαι ανίσχυρος να το αφαιρέσεις.
items.rings.ring.diamond=διαμαντένιο δαχτυλίδι
items.rings.ring.emerald=σμαραγδένιο δαχτυλίδι
items.rings.ring.equip_cursed=Το δαχτυλίδι σφίγγει γύρω από το δάχτυλό σου με πόνο!
items.rings.ring.garnet=δαχτυλίδι γρανάτη
items.rings.ring.identify=Τώρα είστε αρκετά εξοικειωμένοι με το δαχτυλίδι σας για να το αναγνωρίσετε.
items.rings.ring.known=Αυτό είναι ένα %s
items.rings.ring.not_cursed=Αυτό το δαχτυλίδι είναι απαλλαγμένο από κακόβουλη μαγεία.
items.rings.ring.onyx=δαχτυλίδι από όνυχα
items.rings.ring.opal=δαχτυλίδι από οπάλιο
items.rings.ring.quartz=δαχτυλίδι χαλαζία
items.rings.ring.ruby=δαχτυλίδι με ρουμπίνι
