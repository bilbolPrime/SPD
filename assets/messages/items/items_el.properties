items.food.frozencarpaccio.desc=Είναι ένα κομμάτι κατεψυγμένο ωμό κρέας. Ο μόνος τρόπος να το φάτε είναι κόβοντάς το σε λεπτές φέτες. Και με αυτόν τον τρόπο είναι εκπληκτικά νόστιμο.
