items.rings.ring.topaz=δαχτυλίδι από τοπάζι
items.rings.ring.tourmaline=δαχτυλίδι τουρμαλίνης
items.rings.ring.unknown_desc=Αυτό το μεταλλικό δαχτυλίδι είναι στολισμένο με %s που λάμπει στο σκοτάδι. Ποιος ξέρει τι θα συμβεί αν το φορέσεις;
items.rings.ringofaccuracy.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας την ακρίβειά σου κατά _%s%%_ συνολικά.
items.rings.ringofaccuracy.desc=Αυτό το δαχτυλίδι αυξάνει την πιθανότητα να πετύχεις τον εχθρό.
items.rings.ringofaccuracy.name=δαχτυλίδι ακρίβειας
items.rings.ringofaccuracy.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει την ακρίβειά σας κατά _%s%%._
items.rings.ringofaccuracy.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την ακρίβειά σας κατά _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Ενίσχυση ακρίβειας
items.rings.ringofarcana.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας τη δύναμη των μαγειών και των γλύφων κατά _%s%%_ συνολικά.
items.rings.ringofarcana.desc=Αυτό το δαχτυλίδι ενισχύει τα μαγικά ξόρκια στα όπλα και τα σύμβολα στην πανοπλία, συμπεριλαμβανομένων των κατάρων! Αρχικά αυξάνει την πιθανότητα ενεργοποίησης και στη συνέχεια αυξάνει την ισχύ του αποτελέσματος μόλις η πιθανότητα ενεργοποίησης γίνει 100%. Ένα καταραμένο δαχτυλίδι θα αποδυναμώσει τα ξόρκια, τα σύμβολα και τις κατάρες.
items.rings.ringofarcana.name=δαχτυλίδι της Αρκάνα
items.rings.ringofarcana.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει τη δύναμη των μαγικών και των ιερογλυφικών συμβόλων κατά _%s%%._
items.rings.ringofarcana.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει τη δύναμη των μαγικών και των ιερογλυφικών συμβόλων κατά _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Ενίσχυση Αρκάνα
items.rings.ringofelements.combined_stats=Τα εξοπλισμένα δαχτυλίδια σας συνδυάζουν την ισχύ τους, παρέχοντας συνολικά _%s%%_ στοιχειακή αντίσταση.
items.rings.ringofelements.desc=Αυτό το δαχτυλίδι προσφέρει αντίσταση στη φωτιά, τον ηλεκτρισμό, τα αέρια και άλλα στοιχεία. Μειώνει επίσης τη διάρκεια των αρνητικών επιδράσεων.
items.rings.ringofelements.name=δαχτυλίδι των στοιχείων
items.rings.ringofelements.stats=Όταν φοριέται, αυτός ο δακτύλιος θα παρέχει στοιχειακή αντίσταση _%s%%_.
items.rings.ringofelements.typical_stats=Όταν φοριέται, αυτός ο δακτύλιος συνήθως παρέχει στοιχειακή αντίσταση _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Αντίσταση
items.rings.ringofenergy.combined_stats=Τα εξοπλισμένα δαχτυλίδια σας συνδυάζουν την ισχύ τους, αυξάνοντας την ταχύτητα φόρτισης κατά _%s%%_ συνολικά.
items.rings.ringofenergy.desc=Ο μαγικός σας εξοπλισμός θα επαναφορτίζεται πιο γρήγορα στο απόκρυφο πεδίο που ακτινοβολεί από αυτό το δαχτυλίδι. Ένα καταραμένο δαχτυλίδι αντίθετα θα επιβραδύνει την επαναφόρτιση.
items.rings.ringofenergy.name=δαχτυλίδι ενέργειας
items.rings.ringofenergy.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει την ταχύτητα φόρτισης του ραβδιού, του τεχνουργήματος και της ηρωικής πανοπλίας κατά _%s%%._
items.rings.ringofenergy.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την ταχύτητα φόρτισης του ραβδιού, του τεχνουργήματος και της ηρωικής πανοπλίας κατά _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Ενίσχυση φόρτισης
items.rings.ringofevasion.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας την αποφυγή σου κατά _%s%%_ συνολικά.
items.rings.ringofevasion.desc=Αυτό το δαχτυλίδι αυξάνει την πιθανότητα να αποφύγεις την επίθεση του εχθρού.
items.rings.ringofevasion.name=δαχτυλίδι διαφυγής
items.rings.ringofevasion.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει την αποφυγή σας κατά _%s%%._
items.rings.ringofevasion.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την αποφυγή σας κατά _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Ενίσχυση αποφυγής
items.rings.ringofforce$brawlersstance.desc=Ενώ βρίσκεται σε αυτήν τη στάση, οι κανονικές επιθέσεις της Μονομάχου θα χρησιμοποιούν ένα εξοπλισμένο δαχτυλίδι δύναμης ακόμα και όταν έχει εξοπλισμένο ένα όπλο. Αυτές οι επιθέσεις αποκτούν επιπλέον ζημιά και θα εξακολουθούν να χρησιμοποιούν την ενίσχυση και τη γοητεία του όπλου.\n\nΗ διατήρηση αυτής της στάσης απαιτεί εστίαση, ωστόσο, μειώνοντας την ταχύτητα επαναφόρτισης της ικανότητας του όπλου κατά 50%.\n\nΑυτή η στάση μπορεί να ενεργοποιηθεί ή να απενεργοποιηθεί χρησιμοποιώντας ένα δαχτυλίδι δύναμης, αλλά η μείωση της ταχύτητας φόρτισης θα παραμείνει για λίγο εάν η στάση ενεργοποιηθεί και απενεργοποιηθεί γρήγορα.
items.rings.ringofforce$brawlersstance.name=στάση καβγατζή
items.rings.ringofforce.ability_desc=Ο Μονομάχος μπορεί να υιοθετήσει μια στάση _μαχητή_ με αυτό το δαχτυλίδι, με αποτέλεσμα οι τακτικές επιθέσεις του να χρησιμοποιούν πάντα αυτό το δαχτυλίδι ακόμα και με ένα όπλο εξοπλισμένο. Αυτές οι επιθέσεις θα προκαλέσουν _%1$d-%2$d ζημιά_ και θα κληρονομήσουν επίσης τη γοητεία και την ενίσχυση του όπλου. Αυτή η στάση επιβραδύνει την ταχύτητα επαναφόρτισης του όπλου κατά 50%%.
items.rings.ringofforce.ability_name=στάση καβγατζή
items.rings.ringofforce.combined_stats=Τα εξοπλισμένα δαχτυλίδια σας συνδυάζουν τη δύναμή τους, προκαλώντας συνολικά _%1$d-%2$d ζημιά_ χωρίς όπλο ή αυξάνοντας τη ζημιά κατά _%3$d_ με ένα.
items.rings.ringofforce.desc=Αυτό το δαχτυλίδι ενισχύει τη δύναμη των χτυπημάτων σώμα με σώμα από τον κάτοχό του. Αυτή η επιπλέον δύναμη είναι αρκετά αδύναμη όταν χειρίζεστε όπλα, αλλά μια άοπλη επίθεση θα γίνει πολύ πιο δυνατή. Ένα καταραμένο δαχτυλίδι αντίθετα θα αποδυναμώσει τα χτυπήματα του κάτοχού του.
items.rings.ringofforce.name=δαχτυλίδι δύναμης
items.rings.ringofforce.stats=Όταν είστε άοπλοι, με την τρέχουσα δύναμή σας, αυτό το δαχτυλίδι θα προκαλέσει _%1$d-%2$d ζημιά._ Με ένα όπλο εξοπλισμένο, αυτό το δαχτυλίδι θα αυξήσει τη ζημιά κατά _%3$d._
items.rings.ringofforce.typical_ability_desc=Ο Μονομάχος μπορεί να υιοθετήσει μια _στάση καυγάτζη_ με αυτό το δαχτυλίδι, με αποτέλεσμα οι τακτικές επιθέσεις του να χρησιμοποιούν πάντα αυτό το δαχτυλίδι ακόμα και με ένα όπλο εξοπλισμένο. Αυτές οι επιθέσεις συνήθως προκαλούν _%1$d-%2$d ζημιά_ και θα κληρονομήσουν επίσης τη γοητεία και την ενίσχυση του όπλου. Αυτή η στάση επιβραδύνει την ταχύτητα επαναφόρτισης του όπλου κατά 50%%.
items.rings.ringofforce.typical_stats=Όταν είστε άοπλοι, με την τρέχουσα δύναμή σας, συνήθως αυτό το δαχτυλίδι θα προκαλέσει _%1$d-%2$d ζημιά._ Με ένα όπλο εξοπλισμένο, συνήθως αυτό το δαχτυλίδι θα αυξήσει τη ζημιά κατά _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Ζημιά από άοπλη χρήση
items.rings.ringofforce.upgrade_stat_name_2=Ενίσχυση Ζημιάς από Όπλιση
items.rings.ringofforce.upgrade_stat_name_3=Ζημιά Ικανότητας
items.rings.ringoffuror.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας την ταχύτητα των επιθέσεών σου κατά _%s%%_ συνολικά.
items.rings.ringoffuror.desc=Αυτό το δαχτυλίδι δίνει στον κάτοχό του μια εσωτερική οργή, επιτρέποντάς του να επιτίθεται πιο γρήγορα. Ένα καταραμένο δαχτυλίδι αντίθετα θα επιβραδύνει την ταχύτητα επίθεσης του κάτοχού του.
items.rings.ringoffuror.name=δαχτυλίδι οργής
items.rings.ringoffuror.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει την ταχύτητα των επιθέσεών σας κατά _%s%%._
items.rings.ringoffuror.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την ταχύτητα των επιθέσεών σας κατά _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Ενίσχυση Ταχύτητας Επίθεσης
items.rings.ringofhaste.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας την ταχύτητα κίνησής σου κατά _%s%%_ συνολικά.
items.rings.ringofhaste.desc=Αυτό το δαχτυλίδι επιταχύνει τη ροή του χρόνου για όποιον το φορά, επιτρέποντάς του να κάνει τα πάντα λίγο πιο γρήγορα.
items.rings.ringofhaste.name=δαχτυλίδι βιασύνης
items.rings.ringofhaste.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει την ταχύτητα κίνησής σας κατά _%s%%._
items.rings.ringofhaste.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την ταχύτητα κίνησής σας κατά _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Ενίσχυση ταχύτητας κίνησης
items.rings.ringofmight.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, ενισχύοντας τη δύναμή σου κατά _%1$d_ και τη μέγιστη Ζωή σου κατά _%2$s%%_ συνολικά.
items.rings.ringofmight.desc=Αυτό το δαχτυλίδι ενισχύει τα φυσικά χαρακτηριστικά του χρήστη, χαρίζοντάς του μεγαλύτερη σωματική δύναμη και σωματική διάπλαση. Ένα καταραμένο δαχτυλίδι θα τον αποδυναμώσει.
items.rings.ringofmight.name=δαχτυλίδι δύναμης
items.rings.ringofmight.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα αυξήσει τη δύναμή σας κατά _%1$d_ και τη μέγιστη HP σας κατά _%2$s%%._
items.rings.ringofmight.typical_stats=Όταν φοριέται, αυτός ο δακτύλιος συνήθως αυξάνει τη δύναμή σας κατά _%1$d_ και τη μέγιστη HP σας κατά _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=ενίσχυση δύναμης
items.rings.ringofmight.upgrade_stat_name_2=Μέγιστη ενίσχυση HP
items.rings.ringofsharpshooting.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, ενισχύοντας το αποτελεσματικό επίπεδο ρίψης όπλου κατά _%1$d_ και αυξάνοντας την αντοχή τους κατά _%2$s%%_ συνολικά.
items.rings.ringofsharpshooting.desc=Αυτό το δαχτυλίδι ενισχύει την ακρίβεια και τη στόχευση του χρήστη, γεγονός που θα κάνει όλα τα όπλα με βλήματα πιο καταστροφικά και ανθεκτικά. Ένα καταραμένο δαχτυλίδι θα έχει το αντίθετο αποτέλεσμα.
items.rings.ringofsharpshooting.name=δαχτυλίδι σκοποβολής
items.rings.ringofsharpshooting.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα ενισχύσει τη ζημιά των όπλων που ρίχνετε σαν να αυξήθηκε το επίπεδό τους κατά _%1$d_, και θα αυξήσει την αντοχή τους κατά _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Όταν φοριέται, αυτός ο δακτύλιος συνήθως ενισχύει τη ζημιά των όπλων που ρίχνετε, σαν να αυξανόταν το επίπεδό τους κατά _%1$d_ και αυξάνει την αντοχή τους κατά _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Αύξηση Ζημιάς Επιπέδου
items.rings.ringofsharpshooting.upgrade_stat_name_2=Ενίσχυση Ανθεκτικότητας
items.rings.ringoftenacity.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, μειώνοντας τη ζημιά που δέχεσαι έως και _%s%%_ συνολικά.
items.rings.ringoftenacity.desc=Όταν φοριέται, αυτό το δαχτυλίδι θα επιτρέψει στον χρήστη να αντισταθεί σε κανονικά θανάσιμα χτυπήματα. Όσο πιο τραυματισμένος είναι ο χρήστης, τόσο πιο ανθεκτικός θα είναι σε ζημιές. Ένα καταραμένο δαχτυλίδι θα διευκολύνει τους εχθρούς να εκτελέσουν τον χρήστη.
items.rings.ringoftenacity.name=δαχτυλίδι επιμονής
items.rings.ringoftenacity.stats=Όταν φοριέται, αυτό το δαχτυλίδι θα μειώσει τη ζημιά που δέχεστε έως και _%s%%._
items.rings.ringoftenacity.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως μειώνει τη ζημιά που δέχεστε έως και _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Μέγιστη Αντίσταση Ζημιάς
items.rings.ringofwealth.combined_stats=Τα εξοπλισμένα δαχτυλίδια σου συνδυάζουν τη δύναμή τους, αυξάνοντας την τύχη σου κατά _%s%%_ συνολικά.
items.rings.ringofwealth.desc=Αυτό το δαχτυλίδι λειτουργεί σαν μαγνήτης για θησαυρούς, αυξάνοντας την πιθανότητα εχθροί και κοντέινερ να μεταφέρουν πολύτιμα αντικείμενα. Ένα καταραμένο δαχτυλίδι θα μειώσει αντίθετα την πιθανότητα να λάβετε λάφυρα.
items.rings.ringofwealth.name=δαχτυλίδι πλούτου
items.rings.ringofwealth.stats=Όταν φορεθεί, αυτό το δαχτυλίδι θα αυξήσει την τύχη σας κατά _%s%%._
items.rings.ringofwealth.typical_stats=Όταν φοριέται, αυτό το δαχτυλίδι συνήθως αυξάνει την τύχη σας κατά _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Ενίσχυση Τύχης
items.scrolls.exotic.exoticscroll.berkanan=εξωτικός κύλινδρος του BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.scrolls.exotic.exoticscroll.gyfu=εξωτικός κύλινδρος του GYFU
items.scrolls.exotic.exoticscroll.isaz=εξωτικός κύλινδρος του ISAZ
