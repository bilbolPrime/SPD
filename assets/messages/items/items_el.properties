items.weapon.weaponeffects.weaponeffect.smite.prefix=Βαρβαρικό
items.weapon.weaponeffects.weaponeffect.smite.name=%s του βαρβάρου
items.weapon.weaponeffects.weaponeffect.smite.desc=Αυτό το όπλο είναι _βαρβαρικό_. Κάθε επιτυχημένο χτύπημα έχει _20%_ πιθανότητα να ενεργοποιήσει _Χτύπημα επιπέδου 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Χτύπημα!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Απωθητικό
items.weapon.weaponeffects.weaponeffect.knockback.name=%s απώθησης
items.weapon.weaponeffects.weaponeffect.knockback.desc=Αυτό το όπλο είναι _απωθητικό_. Κάθε επιτυχημένο χτύπημα έχει _20%_ πιθανότητα να σπρώξει τον εχθρό _ένα τετράγωνο_ πίσω. Τα αφεντικά δεν σπρώχνονται.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Απώθηση!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Φιδίσιο
items.weapon.weaponeffects.weaponeffect.venom.name=%s του φιδιού
items.weapon.weaponeffects.weaponeffect.venom.desc=Αυτό το όπλο είναι _φιδίσιο_. Κάθε επιτυχημένο χτύπημα έχει _20%_ πιθανότητα να δηλητηριάσει τον στόχο.
items.weapon.weaponeffects.weaponeffect.venom.activate=Δηλητήριο!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Σακατευτικό
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s σακατέματος
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Αυτό το όπλο είναι _σακατευτικό_. Οι βολές που πετυχαίνουν έχουν _20%_ πιθανότητα να σακατέψουν τον εχθρό για _10 γύρους_. Τα αφεντικά έχουν ανοσία.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Σακάτεμα!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Ρουνικό
items.weapon.weaponeffects.weaponeffect.spark.name=%s των ρούνων
items.weapon.weaponeffects.weaponeffect.spark.desc=Αυτό το ραβδί είναι _ρουνικό_. Η μαγεία του έχει _20%_ πιθανότητα να ενεργοποιήσει _Σπίθα_, προκαλώντας _4–8_ επιπλέον μαγική ζημιά.
items.weapon.weaponeffects.weaponeffect.spark.activate=Σπίθα!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Καταρατικό
items.weapon.weaponeffects.weaponeffect.curse.name=%s κατάρας
items.weapon.weaponeffects.weaponeffect.curse.desc=Αυτό το ραβδί _καταριέται_. Η μαγεία του έχει _20%_ πιθανότητα να αποδυναμώσει τον στόχο, μειώνοντας τη ζημιά που προκαλεί κατά _5%_ για _10 γύρους_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Κατάρα!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Απομυζητικό
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s απομύζησης
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Αυτό το ραβδί _απομυζά ζωή_. Η μαγεία του έχει _20%_ πιθανότητα να προκαλέσει _8–16_ επιπλέον μαγική ζημιά και να σε θεραπεύσει όσο η ζωή που έκλεψε.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Απομύζηση!

items.armor.armorprefix.stalwart.name=%s αντοχής
items.armor.armorprefix.stalwart.desc=Αυτή η πανοπλία είναι _ακλόνητη_. Οι επιθέσεις των εχθρών έχουν _20%_ πιθανότητα να ενεργοποιήσουν _Ανθεκτικότητα επιπέδου 5_, μειώνοντας τη ζημιά τους κατά _20%_.
items.armor.armorprefix.stalwart.activate=Ανθεκτικότητα!

items.armor.armorprefix.vigilant.name=%s επαγρύπνησης
items.armor.armorprefix.vigilant.desc=Αυτή η πανοπλία προσφέρει _επαγρύπνηση_. Έχεις _20%_ πιθανότητα να αποφύγεις μια επίθεση εχθρού από απόσταση.
items.armor.armorprefix.vigilant.activate=Επαγρύπνηση!

items.armor.armorprefix.elusive.name=%s διαφυγής
items.armor.armorprefix.elusive.desc=Αυτή η πανοπλία σε κάνει _άπιαστο_. Όταν μια επίθεση εχθρού σε τραυματίσει, έχεις _20%_ πιθανότητα να αυξηθεί η αποφυγή σου κατά _5_ για _5 γύρους_.
items.armor.armorprefix.elusive.activate=Αποφυγή!
