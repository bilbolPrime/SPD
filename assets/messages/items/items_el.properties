items.artifacts.lloydsbeacon.creatures=Η ψυχική αύρα των γειτονικών πλασμάτων δεν σου επιτρέπει να χρησιμοποιήσεις το φάρο του Λόιντ αυτή τη στιγμή.
items.artifacts.lloydsbeacon.desc=Το φάρος του Lloyd είναι μια περίπλοκη μαγική συσκευή που παρέχει στον χρήστη τον έλεγχο των μαγικών τηλεμεταφοράς. Το φάρος μπορεί να χρησιμοποιηθεί για επιστροφή σε μια καθορισμένη τοποθεσία, αλλά μπορεί επίσης να εκπέμψει εκρήξεις τυχαίας μαγείας τηλεμεταφοράς μόλις φορτιστεί από τον εξοπλισμό του. Αυτή η μαγεία μπορεί να κατευθυνθεί σε έναν στόχο ή στον ίδιο τον χρήστη.
items.artifacts.lloydsbeacon.desc_set=Αυτό το beacon τοποθετήθηκε κάπου στο επίπεδο %d του Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Ο φάρος σας δυναμώνει!
