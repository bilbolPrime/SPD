items.food.berry.desc=Αυτό το μικρό μούρο βρέθηκε από την Κυνηγό ανάμεσα στη βλάστηση του μπουντρουμιού. Μπορεί να καταναλωθεί γρήγορα, αποκαθιστά μια μικρή ποσότητα κορεσμού και μπορεί να περιέχει έναν χρήσιμο σπόρο!
