items.artifacts.sandalsofnature.desc_1=Αυτό που αρχικά μοιάζει με σανδάλια φτιαγμένα από σπάγκο, στην πραγματικότητα είναι δύο φυτά! Φαίνονται πολύ αδύναμα και χλωμά, ίσως χρειάζονται θρεπτικά συστατικά;
items.artifacts.sandalsofnature.desc_2=Τα υποδήματα έχουν μεγαλώσει και τώρα μοιάζουν περισσότερο με δύο ραμμένα παπούτσια. Έχει επιστρέψει λίγο χρώμα σε αυτά, ίσως μπορούν να μεγαλώσουν κι άλλο;
items.artifacts.sandalsofnature.desc_3=Τα φυτά έχουν ξαναμεγαλώσει και τώρα μοιάζουν με ένα ζευγάρι συμπαγείς μπότες φτιαγμένες από φλοιό. Τα φυτά φαίνεται να έχουν ανακτήσει τη δύναμή τους, αλλά ίσως μπορούν ακόμα να αναπτυχθούν περισσότερο;
items.artifacts.sandalsofnature.desc_4=Τα φυτά φαίνεται να έχουν φτάσει στο μέγιστο μέγεθος τους, μοιάζουν με ένα ζευγάρι θωρακισμένων περικνημίδων. Οι περικνημίδες έχουν βαθύ καφέ χρώμα και μοιάζουν με ένα πολύ στιβαρό δέντρο.
items.artifacts.sandalsofnature.desc_ability=Τα υποδήματα κυματίζουν με το χρώμα του τελευταίου σπόρου που τους ταΐσατε. Μπορούν να ριζώσουν για λίγο στο έδαφος και να παράγουν το αποτέλεσμα αυτού του φυτού οπουδήποτε σε μια ακτίνα 3 πλακιδίων.\nΣπόρος: _%s_\nΑπαιτούμενη χρέωση: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Τα καταραμένα σανδάλια εμποδίζουν κάθε συντονισμό με τη φύση.
items.artifacts.sandalsofnature.desc_hint=Νιώθεις πιο συντονισμένος με τη φύση φορώντας αυτό το τεχνούργημα.
items.artifacts.sandalsofnature.desc_seeds=Ταΐσατε τα υποδήματα με σπόρους %d.
