items.artifacts.etherealchains.rooted=Οι αλυσίδες σου δεν μπορούν να σε τραβήξουν όσο είσαι ριζωμένος.
items.artifacts.holytome.ac_cast=ΕΚΜΑΓΕΙΟ
items.artifacts.holytome.cursed=Δεν μπορείς να χρησιμοποιήσεις έναν καταραμένο τόμο.
items.artifacts.holytome.desc=Ένας ιερός τόμος που λειτουργεί ως επίκεντρο της θεϊκής μαγείας του Κληρικού. Η χρήση του τόμου επιτρέπει στον Κληρικό να εκτελεί μια ποικιλία μαγικών ξορκιών.\n\nΟ τόμος θα γίνεται σταθερά πιο ισχυρός καθώς τον χρησιμοποιεί ο Κληρικός, δίνοντάς του περισσότερες μέγιστες φορτίσεις και αυξάνοντας ελαφρώς την ταχύτητα επαναφόρτισης.
items.artifacts.holytome.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
