items.artifacts.lloydsbeacon.preventing=Η έντονη μαγική αύρα αυτού του μέρους σε εμποδίζει να χρησιμοποιήσεις το φάρο του Λόιντ!
items.artifacts.lloydsbeacon.prompt=Επιλέξτε μια τοποθεσία για να κάνετε ζάπινγκ.
items.artifacts.lloydsbeacon.return=Το Lloyd's beacon ρυθμίστηκε με επιτυχία στην τρέχουσα τοποθεσία σας, τώρα μπορείτε να επιστρέψετε εδώ οποιαδήποτε στιγμή.
