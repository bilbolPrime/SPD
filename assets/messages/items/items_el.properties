items.energycrystal.desc=Μια συλλογή από μικρούς μαγικούς κρυστάλλους, γεμάτους με αλχημική ενέργεια. \n\n Αυτοί οι κρύσταλλοι είναι το πιο συνηθισμένο συστατικό στις συνταγές αλχημείας και μπορούν να παραχθούν σε ένα αλχημειακό δοχείο με την απόρριψη αναλώσιμων αντικειμένων.
