items.artifacts.skeletonkey$keywall.desc=Ένας προσωρινός μαγικός τοίχος έχει τοποθετηθεί εδώ δίπλα στο κλειδί-σκελετό.
items.artifacts.skeletonkey.ac_insert=ΕΙΣΑΓΩ
items.artifacts.skeletonkey.crystal_charges=Το άνοιγμα μιας κρυστάλλινης κλειδαριάς απαιτεί 5 φορτίσεις.
items.artifacts.skeletonkey.cursed=Δεν μπορείς να χρησιμοποιήσεις ένα καταραμένο κλειδί-σκελετό.
items.artifacts.skeletonkey.desc=Ένα κλειδί που μοιάζει με σημαντικό, με κεφάλι σε σχήμα κρανίου. Τα δόντια του φαίνονται διαφορετικά κάθε φορά που τα κοιτάς.
items.artifacts.skeletonkey.desc_cursed=Το καταραμένο κλειδί φαίνεται να αποφεύγει ενεργά να χωρέσει σε οποιαδήποτε κλειδαριά, και μάλιστα δυσκολεύει (αλλά όχι αδύνατη) τη χρήση των άλλων κλειδιών σας.
items.artifacts.skeletonkey.desc_worn=Αυτό το μαγικό κλειδί φαίνεται να αποκτά δύναμη καθώς το χρησιμοποιείτε αντί για τα κανονικά κλειδιά του μπουντρουμιού. Μπορεί να εισαχθεί σε σχεδόν οποιαδήποτε από τις κλειδαριές του μπουντρουμιού για να τις ανοίξει ή να τις κλείσει, συμπεριλαμβανομένων θυρών που δεν ήταν ποτέ κλειδωμένες στο παρελθόν.\n\nΤο κλειδί μπορεί ακόμη και να χρησιμοποιηθεί σε κενό χώρο σε μια κεντρική ή διαγώνια κατεύθυνση για να «κλειδώσει» τον αέρα μπροστά σας, δημιουργώντας έναν συμπαγή τοίχο πλάτους 3 πλακιδίων που διαρκεί για 10 γύρους. Το κλείδωμα θα απωθήσει τους εχθρούς αν υπάρχει χώρος για να το κάνει.
items.artifacts.skeletonkey.discard=Πετάς τα περιττά σου κλειδιά.
items.artifacts.skeletonkey.force_lock=Η κλειδαριά έχει αποδυναμωθεί χωρίς το βασικό σου κλειδί. Καταφέρνεις να την ανοίξεις με το ζόρι.
items.artifacts.skeletonkey.gold_charges=Το άνοιγμα μιας χρυσής κλειδαριάς απαιτεί 2 φορτίσεις.
items.artifacts.skeletonkey.invalid_target=Δεν υπάρχει τίποτα να κλειδώσεις ή να ξεκλειδώσεις εκεί.
