items.artifacts.driedrose.desc_hint=Φαίνεται να λείπουν κάποια πέταλα. Ίσως η επανατοποθέτησή τους θα δυναμώσει το τριαντάφυλλο.
items.artifacts.driedrose.desc_no_quest=Ένα αποξηραμένο παλαιωμένο τριαντάφυλλο που με κάποιο τρόπο εξακολουθεί να συγκρατείται παρά την ηλικία του. \n\n Φαίνεται να έχει κάποια πνευματική δύναμη, αλλά δεν έχετε ιδέα πώς να τη χρησιμοποιήσετε αυτή τη στιγμή.
