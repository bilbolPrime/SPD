items.food.pasty$fishleftover.name=υπολείμματα ψαριών
items.food.pasty.amulet_desc=Επιτέλους το βρήκες, το μαγικό φυλαχτό του - περίμενε ένα λεπτό, αυτή είναι απλώς μια σοκολάτα τυλιγμένη σε αλουμινόχαρτο, φτιαγμένη για να μοιάζει με το φυλαχτό! Δεν θα σου δώσει απεριόριστη δύναμη, αλλά τουλάχιστον θα σε χορτάσει και θα σου δώσει μια μικρή φόρτιση από τεχνουργήματα.\n\n Πρωταπριλιά!
items.food.pasty.amulet_name=φυλαχτό του Γιέντορ;
items.food.pasty.cane_desc=Ένα τεράστιο ζαχαρούχο γλυκό ζαχαροκάλαμο. Είναι αρκετά μεγάλο για να σας χορτάσει, και η ζάχαρη μπορεί να δώσει και στα ραβδιά σας μια μικρή επιπλέον χρέωση.\n\nΚαλές Γιορτές!
items.food.pasty.cane_name=καραμέλα από ζαχαροκάλαμο
items.food.pasty.desc=Μια αυθεντική πίτες Κορνουάλης με παραδοσιακή γέμιση από μοσχάρι και πατάτα. Πεντανόστιμη!
items.food.pasty.egg_desc=Ένα υπέροχο μεγάλο σοκολατένιο αυγό, τυλιγμένο σε πολύχρωμο κίτρινο αλουμινόχαρτο. Υπάρχει εύκολα αρκετή σοκολάτα εδώ για να σας χορτάσει, και η ζάχαρη μπορεί να δώσει στα τεχνουργήματά σας μια μικρή επιπλέον επιβάρυνση.\n\nΚαλό Πάσχα!
items.food.pasty.egg_name=πασχαλινό αυγό
items.food.pasty.fish_desc=Ένα ολόκληρο ψάρι στον ατμό, μαγικά διατηρημένο σε ένα κρεβάτι από χόρτα. Είναι παράδοση να φυλάτε λίγο ψάρι για αργότερα, γύρω από αυτή την εποχή του χρόνου, ώστε να κρατήσετε κάποια από τα περισσεύματα αντί να τα φάτε όλα μονομιάς. \n\nΚαλή Σεληνιακή Πρωτοχρονιά!
items.food.pasty.fish_name=στον ατμό ψάρι
items.food.pasty.name=ζυμώδης
items.food.pasty.pie_desc=Ένα υπέροχο μεγάλο κομμάτι κολοκυθόπιτας. Η γλυκιά και πικάντικη γεύση της θα σας χορτάσει και θα σας δώσει μια μικρή δόση θεραπείας. \n\nΚαλό Χάλοουιν!
items.food.pasty.pie_name=κολοκυθόπιτα
items.food.pasty.rainbow_desc=Αυτό το πολύχρωμο φίλτρο είναι ένα είδος υγρής τροφής. Εκτός από το ότι ικανοποιεί την πείνα σας, έχει και λίγη μαγεία που θα ηρεμήσει έναν γειτονικό εχθρό που δεν είναι αρχηγός, κάνοντάς τον προσωρινά διστακτικό να σας πολεμήσει.\n\nΧρόνια πολλά για την Υπερηφάνεια!
items.food.pasty.rainbow_name=φίλτρο ουράνιου τόξου
items.food.pasty.sparkling_desc=Αυτό το αφρώδες φίλτρο είναι ένα είδος υγρής τροφής. Ικανοποιεί την πείνα και προσομοιώνει το αφρώδες κρασί, αλλά στην πραγματικότητα δεν είναι αλκοολούχο. Η ζεστή αίσθηση στην κοιλιά σας θα σας προσφέρει μια μικρή θωράκιση. \n\nΚαλή Χρονιά!
items.food.pasty.sparkling_name=αφρώδες φίλτρο
items.food.pasty.vanilla_desc=Αυτή η μεγάλη φέτα κέικ βανίλιας έχει πολύχρωμες τρούφες και μπλε γλάσο. Το κέικ φτιάχτηκε για να γιορτάσει τα χρόνια εμπειρίας και θα σας χαρίσει μια μικρή ποσότητα αυτής της εμπειρίας όταν το φάτε.\n\nΤο αρχικό Pixel Dungeon κυκλοφόρησε για πρώτη φορά στις 4 Δεκεμβρίου 2012. Χρόνια πολλά Pixel Dungeon!
items.food.pasty.vanilla_name=μπλε κέικ
items.food.phantommeat.desc=Μια μεγάλη λαμπερή, ημιδιαφανής μπριζόλα, κομμένη από ένα φανταστικό πιράνχα. Αυτό το μαγικό κρέας δεν χρειάζεται μαγείρεμα και προσφέρει μια σειρά από αμυντικά οφέλη, εκτός από το ότι σας χορταίνει πλήρως. Όταν καταναλωθεί, θα σας χαρίσει αορατότητα, θα σας κάνει να ξεφλουδίσετε, θα σας θεραπεύσει και θα σας βοηθήσει να απαλλαγείτε από πολλές βλαβερές συνέπειες.
items.food.phantommeat.discover_hint=Μπορείτε να αποκτήσετε αυτό το αντικείμενο ως σταγόνα από ορισμένους εχθρούς.
items.food.phantommeat.name=φάντασμα κρέας
items.food.smallration.desc=Μοιάζει ακριβώς με μια τυπική μερίδα φαγητού, αλλά μικρότερη.
items.food.smallration.discover_hint=Μπορείτε να αγοράσετε αυτό το προϊόν σε ένα κατάστημα.
items.food.smallration.eat_msg=Αυτό το φαγητό είχε μια καλή γεύση.
items.food.smallration.name=μικρή μερίδα φαγητού
items.food.stewedmeat.desc=Το βράσιμο του κρέατος το έχει καθαρίσει από οποιαδήποτε ασθένεια ή παράσιτα. Θα πρέπει να είναι ασφαλές για κατανάλωση.
items.food.stewedmeat.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.food.stewedmeat.eat_msg=Αυτό το φαγητό είχε μια καλή γεύση.
items.food.stewedmeat.name=στιφάδο κρέας
items.food.supplyration.desc=Αυτή η μερίδα έμεινε στο μπουντρούμι από και για τα μέλη της συντεχνίας των κλεφτών. Είναι ειδικά σχεδιασμένη για να τρώγεται εν κινήσει και να βοηθάει σε γενικές κόλπα.\n\nΕνώ δεν σας χορταίνει τόσο πολύ όσο μια κανονική μερίδα, μπορεί να καταναλωθεί γρήγορα, παρέχει λίγη άμεση θεραπεία και θα αποκαταστήσει μια φόρτιση στον μανδύα των σκιών του Rogue.
items.food.supplyration.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο χρησιμοποιώντας ένα συγκεκριμένο ταλέντο ήρωα.
items.food.supplyration.name=μερίδα εφοδιασμού
items.gold.desc=Μια στοίβα από χρυσά νομίσματα. Συλλέξτε χρυσά νομίσματα για να τα ξοδέψετε αργότερα σε ένα κατάστημα.
