items.artifacts.skeletonkey.wall_charges=Η δημιουργία ενός προσωρινού τοίχου απαιτεί 2 φορτίσεις.
items.artifacts.skeletonkey.wont_open=Το κλειδί δεν χωράει σε αυτήν την κλειδαριά για κάποιο λόγο.
items.artifacts.talismanofforesight$foresight.desc=Νιώθεις πολύ νευρικός, σαν να υπάρχει ένας αόρατος κίνδυνος κοντά.
items.artifacts.talismanofforesight$foresight.name=πρόβλεψη
items.artifacts.talismanofforesight$foresight.uneasy=Νιώθεις άβολα.
items.artifacts.talismanofforesight.ac_scry=ΣΚΡΙ
items.artifacts.talismanofforesight.desc=Μια λεία πέτρα με παράξενες χαρακτικές πάνω της. Νιώθεις σαν να παρακολουθεί τα πάντα γύρω σου, προσέχοντας οτιδήποτε κρυφό.
items.artifacts.talismanofforesight.desc_cursed=Το καταραμένο φυλαχτό σε κοιτάζει επίμονα, αμβλύνοντας τις αισθήσεις σου.
items.artifacts.talismanofforesight.desc_worn=Όταν κρατάτε το φυλαχτό, νιώθετε ότι οι αισθήσεις σας ενισχύονται. Το φυλαχτό αυξάνει σιγά σιγά τη φόρτισή του καθώς περνάει ο χρόνος και όταν ανακαλύπτετε κρυφές πόρτες ή παγίδες.\n\nΤο φυλαχτό μπορεί να χρησιμοποιήσει τη φόρτισή του για να «κρυφτεί» σε σχήμα κώνου, αποκαλύπτοντας όλα τα πλακίδια και τα μυστικά στην σαρωμένη περιοχή και θα σας δώσει όραση εχθρών και αντικειμένων για μικρό χρονικό διάστημα.
items.artifacts.talismanofforesight.full_charge=Το Φυλαχτό σας είναι πλήρως φορτισμένο!
items.artifacts.talismanofforesight.levelup=Το Φυλαχτό σου δυναμώνει!
items.artifacts.talismanofforesight.low_charge=Το φυλαχτό απαιτεί τουλάχιστον 5% φόρτιση για να κρυφτεί.
items.artifacts.talismanofforesight.name=φυλαχτό της προνοητικότητας
items.artifacts.talismanofforesight.prompt=Επιλέξτε μια τοποθεσία για σάρωση.
items.artifacts.timekeepershourglass$sandbag.desc=Αυτή η μικρή σακούλα με λεπτή άμμο θα πρέπει να ταιριάζει τέλεια με την κλεψύδρα σας. \n\n Φαίνεται περίεργο που ο καταστηματάρχης θα έχει αυτό το συγκεκριμένο αντικείμενο ακριβώς τη στιγμή που το χρειάζεστε...
items.artifacts.timekeepershourglass$sandbag.levelup=Προσθέτεις την άμμο στην κλεψύδρα σου.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Η κλεψύδρα σου είναι γεμάτη με μαγική άμμο!
items.artifacts.timekeepershourglass$sandbag.name=σακούλα με μαγική άμμο
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Δεν έχεις κλεψύδρα για να τοποθετήσεις αυτή την άμμο.
items.artifacts.timekeepershourglass$timefreeze.desc=Ο χρόνος παγώνει γύρω σας, επιτρέποντάς σας να εκτελείτε ενέργειες άμεσα. Το εφέ θα διαρκέσει μέχρι να ακυρωθεί ή να εξαντληθεί η φόρτιση της κλεψύδρας σας. Η επίθεση ή η χρήση μαγείας θα διακόψει και αυτό το εφέ. \n\nΓυρίζει μέχρι να χρησιμοποιηθεί η φόρτιση: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Παγωμένος Χρόνος
items.artifacts.timekeepershourglass.ac_activate=ΔΡΑΣΤΗΡΙΟΠΟΙΩ
items.artifacts.timekeepershourglass.cursed=Δεν μπορείς να χρησιμοποιήσεις μια καταραμένη κλεψύδρα.
items.artifacts.timekeepershourglass.deactivate=Απενεργοποιείτε το πάγωμα χρόνου.
items.artifacts.timekeepershourglass.desc=Αυτή η μεγάλη περίτεχνη κλεψύδρα φαίνεται αρκετά απλή, αλλά νιώθεις μια μεγάλη δύναμη στο περίτεχνα σκαλισμένο πλαίσιό της. Καθώς περιστρέφεις την κλεψύδρα και παρακολουθείς την άμμο να χύνεται, μπορείς να νιώσεις τη μαγεία της να σε τραβάει. Σίγουρα η χρήση αυτής της μαγείας θα σου έδινε κάποιο έλεγχο με την πάροδο του χρόνου.
items.artifacts.timekeepershourglass.desc_cursed=Η καταραμένη κλεψύδρα είναι κλειδωμένη στο πλευρό σου, μπορείς να την νιώσεις να προσπαθεί να χειραγωγήσει τη ροή του χρόνου σου.
items.artifacts.timekeepershourglass.desc_hint=Η κλεψύδρα φαίνεται να έχει χάσει λίγη άμμο, μακάρι να μπορούσες να βρεις λίγη...
items.artifacts.timekeepershourglass.freeze=Πάγωσε τον χρόνο γύρω μου
items.artifacts.timekeepershourglass.name=κλεψύδρα του χρονομέτρη
items.artifacts.timekeepershourglass.no_charge=Η κλεψύδρα σου δεν έχει φορτίσει αρκετά για να είναι ακόμα χρησιμοποιήσιμη.
items.artifacts.timekeepershourglass.onfreeze=Όλα γύρω σου ξαφνικά παγώνουν.
items.artifacts.timekeepershourglass.onstasis=Ο κόσμος μοιάζει να αλλάζει γύρω σου σε μια στιγμή.
items.artifacts.timekeepershourglass.prompt=Πώς θα σας φαινόταν να χρησιμοποιήσετε τη μαγεία της κλεψύδρας;\n\nΕνώ βρίσκεστε σε στάση, ο χρόνος θα κυλάει κανονικά ενώ εσείς είστε παγωμένοι και εντελώς άτρωτοι, καταναλώνοντας έως και 2 φορτίσεις κάθε φορά.\n\nΌταν ο χρόνος είναι παγωμένος, μπορείτε να κινηθείτε σαν οι ενέργειές σας να μην χρειάζονται χρόνο. Αυτό μπορεί να απενεργοποιηθεί ανά πάσα στιγμή χρησιμοποιώντας την κλεψύδρα ή επιτιθέμενοι.
items.artifacts.timekeepershourglass.stasis=Βάζω τον εαυτό μου σε στασιμότητα
items.artifacts.unstablespellbook.ac_add=ΠΡΟΣΘΕΤΩ
items.artifacts.unstablespellbook.ac_read=ΑΝΑΓΝΩΣΗ
items.artifacts.unstablespellbook.blinded=Δεν μπορείς να διαβάσεις από το βιβλίο ενώ είσαι τυφλός.
items.artifacts.unstablespellbook.cursed=Δεν μπορείς να διαβάσεις από ένα καταραμένο βιβλίο ξορκιών.
items.artifacts.unstablespellbook.desc=Αυτός ο Τόμος βρίσκεται σε εκπληκτικά καλή κατάσταση δεδομένης της ηλικίας του. Σφυρίζει και τρίζει καθώς μετακινείτε τις σελίδες, ξεχειλίζοντας από ασταθή ενέργεια. Αν διαβάσετε από αυτό το βιβλίο, δεν μπορείτε να καταλάβετε τι ξόρκι μπορεί να κάνετε.
items.artifacts.unstablespellbook.desc_cursed=Το καταραμένο βιβλίο έχει δέσει τον εαυτό του πάνω σου, εμποδίζει την ικανότητά σου να χρησιμοποιείς τους περισσότερους πάπυρους.
items.artifacts.unstablespellbook.desc_empowered=Οι πάπυροι που έχετε προσθέσει στο βιβλίο λάμπουν από δύναμη. Θα μπορείτε να επιλέξετε την εξωτική έκδοση αυτών των εφέ πάπυρου, αλλά με επιπλέον χρέωση.
items.artifacts.unstablespellbook.desc_index=Το βιβλίο είναι ημιτελές. Ο δείκτης του δείχνει αυτήν τη στιγμή στις ακόλουθες κενές σελίδες:
items.artifacts.unstablespellbook.infuse_scroll=Εμπλέκεις το βιβλίο με την ενέργεια του πάπυρου.
items.artifacts.unstablespellbook.name=ασταθές βιβλίο ξορκιών
items.artifacts.unstablespellbook.no_charge=Το βιβλίο των μαγικών σου έχει εξαντληθεί προς το παρόν.
items.artifacts.unstablespellbook.prompt=Επιλέξτε μια κύλιση
items.artifacts.unstablespellbook.read_empowered=Ο πάπυρος που προσθέσατε στο βιβλίο ξορκιών γεμίζει με ενέργεια. Μπορείτε να διοχετεύσετε είτε την κανονική είτε την εξωτική έκδοση της επίδρασης αυτού του πάπυρου.\n\nΗ επιλογή της εξωτικής παραλλαγής θα κοστίσει 2 χρεώσεις αντί για 1.
items.artifacts.unstablespellbook.unable_scroll=Δεν μπορείτε να προσθέσετε αυτόν τον πάπυρο στο βιβλίο.
items.artifacts.unstablespellbook.unknown_scroll=Δεν είστε σίγουροι ακόμα για τι είδους πάπυρο πρόκειται.
items.bags.bag.discover_hint=Μπορείτε να αγοράσετε αυτό το προϊόν σε ένα κατάστημα.
items.bags.bag.name=σάκος πλάτης
items.bags.magicalholster.desc=Αυτή η λεπτή θήκη είναι κατασκευασμένη από δέρμα εξωτικού ζώου και διαθέτει ισχυρή μαγεία που της επιτρέπει να αποθηκεύει μια τεράστια ποσότητα όπλων από απόσταση. \n\nΜπορείτε απλά να βάλετε το χέρι σας στην τσάντα και θα πιάνετε πάντα το αντικείμενο που ψάχνατε. \n\nΛόγω της μαγείας της θήκης, τα ραβδιά θα φορτίζουν ελαφρώς πιο γρήγορα και τα όπλα που πετιούνται θα διαρκέσουν λίγο περισσότερο μέσα σε αυτήν.
items.bags.magicalholster.name=μαγική θήκη
items.bags.potionbandolier.desc=Αυτό το χοντρό μαντήλι εφαρμόζει γύρω από το στήθος σας σαν ζώνη και έχει πολλούς μονωμένους ιμάντες για να κρατάει φιαλίδια φίλτρων, το υδατόκρεμά σας ή φιαλίδια από υγρό μέταλλο. \n\nΕνώ βρίσκεστε μέσα στο μαντήλι, τα φίλτρα σας θα πρέπει να προστατεύονται από το κρύο.
items.bags.potionbandolier.name=φίλτρο μπαντολιέρης
items.bags.scrollholder.desc=Αυτό το σωληνωτό δοχείο μοιάζει σαν να χωράει τα εργαλεία και τους χάρτες ενός αστρονόμου, αλλά οι πάπυροί σας θα χωρέσουν εξίσου καλά. Υπάρχουν ακόμη και μερικά πλαϊνά διαμερίσματα που θα χωρούσαν ωραία κρυστάλλους ξορκιών, απόκρυφα στυλό και απόκρυφη ρητίνη. \n\nΗ θήκη δεν φαίνεται πολύ εύφλεκτη, επομένως οι πάπυροί σας θα πρέπει να είναι ασφαλείς από φωτιά στο εσωτερικό της.
items.bags.scrollholder.name=θήκη πάπυρου
items.bags.velvetpouch.desc=Αυτή η μικρή βελούδινη θήκη μπορεί να αποθηκεύσει πολλά μικρά αντικείμενα, όπως σπόρους, ρουνικούς λίθους και ορισμένα συστατικά αλχημείας.
items.bags.velvetpouch.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.bags.velvetpouch.name=βελούδινη θήκη
items.bombs.arcanebomb.desc=Αυτή η βόμβα έχει εμπλουτιστεί με απόκρυφες ιδιότητες. Θα εκραγεί με μια ισχυρή έκρηξη παρόμοια με την ενισχυμένη επίθεση του Goo, προκαλώντας _%1$d-%2$d μαγική ζημιά_ σε οτιδήποτε βρίσκεται εντός 2 πλακιδίων.
items.bombs.arcanebomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.arcanebomb.name=απόκρυφη βόμβα
items.bombs.bomb$doublebomb.desc=Μια στοίβα από δύο τεράστιες βόμβες μαύρης πυρίτιδας, φαίνεται ότι παίρνεις τη μία δωρεάν!
items.bombs.bomb$doublebomb.name=δύο βόμβες
items.bombs.bomb.ac_lightthrow=ΦΩΣ & ΡΙΞΗ
items.bombs.bomb.desc=Μια αρκετά βαριά βόμβα μαύρης πυρίτιδας. Μια έκρηξη από αυτήν τη βόμβα προκαλεί _%1$d-%2$d ζημιά_ σε οτιδήποτε βρίσκεται δίπλα της και θα καταστρέψει κάποιο παρακείμενο έδαφος ή αντικείμενα.
items.bombs.bomb.desc_burning=Το φυτίλι της βόμβας καίγεται, κράτα απόσταση ή σβήσε το!
items.bombs.bomb.desc_fuse=Φαίνεται ότι το φυτίλι θα χρειαστεί μερικές βολές για να καεί μόλις ανάψει.
items.bombs.bomb.name=βόμβα
items.bombs.bomb.ondeath=Η έκρηξη σε σκοτώνει...
items.bombs.bomb.rankings_desc=Σκοτώθηκε από έκρηξη
items.bombs.bomb.snuff_fuse=Σβήνεις γρήγορα το φυτίλι της βόμβας.
items.bombs.firebomb.desc=Αυτή η βόμβα έχει τροποποιηθεί για να εκρήγνυται σε μεγαλύτερη περιοχή, προκαλώντας _%1$d-%2$d ζημιά_ και εξαπλώνοντας παρατεταμένη φλόγα μέσα σε 2 πλακίδια.
items.bombs.firebomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.firebomb.name=βόμβα μολότοφ
items.bombs.flashbangbomb.desc=Αυτή η προσαρμοσμένη βόμβα θα εκραγεί σε μια έκρηξη φωτός, ήχου και ηλεκτρισμού όταν εκραγεί. Οτιδήποτε βρίσκεται σε απόσταση 2 πλακιδίων θα δεχτεί _%1$d-%2$d ζημιά_ από την έκρηξη, μια επιπλέον ζημιά 25%% από τον ηλεκτρισμό και θα ακινητοποιηθεί για 10 γύρους.
items.bombs.flashbangbomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.flashbangbomb.name=κρότος-λάμψη
items.bombs.frostbomb.desc=Αυτή η βόμβα έχει τροποποιηθεί για να εκρήγνυται σε μεγαλύτερη περιοχή, προκαλώντας _%1$d-%2$d ζημιά_ και εξαπλώνοντας μια παρατεταμένη ριπή παγωμένου αέρα μέσα σε 2 πλακίδια.
items.bombs.frostbomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.frostbomb.name=παγωμένη βόμβα
items.bombs.holybomb.desc=Αυτή η βόμβα έχει τροποποιηθεί για να εκπέμπει ιερό φως σε μεγαλύτερη περιοχή όταν εκρήγνυται. Οτιδήποτε βρίσκεται εντός 2 πλακιδίων θα δεχτεί _%1$d-%2$d ζημιά_ από την έκρηξη, και οι νεκροζώντανοι ή οι δαιμονικοί εχθροί θα δεχτούν επιπλέον 50%% ζημιά από το ιερό φως.
items.bombs.holybomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.holybomb.name=ιερή βόμβα
items.bombs.noisemaker.desc=Αυτή η προσαρμοσμένη βόμβα θα κάνει επανειλημμένα θόρυβο όταν τελειώσει το φυτίλι της. Όταν κάτι αγγίξει τη βόμβα, θα εκραγεί και θα προκαλέσει _%1$d-%2$d ζημιά_ σε οτιδήποτε βρίσκεται εντός 2 πλακιδίων!
items.bombs.noisemaker.desc_burning=Ο θορυβοποιός χτυπάει αργά, θα εκραγεί όταν κάτι πλησιάσει!
items.bombs.noisemaker.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.noisemaker.name=θορυβοποιός
items.bombs.regrowthbomb.desc=Αυτή η προσαρμοσμένη βόμβα θα εκτοξεύσει ζωογόνο υγρό παντού μέσα σε 3 πλακίδια αντί να εκραγεί. Η περιοχή που θα πληγεί από την έκρηξη θα φυτρώσει γρήγορα γρασίδι και φυτά. Εσείς και οποιοσδήποτε σύμμαχος που θα πληγεί από την έκρηξη θα θεραπευτείτε σαν να είχαν πιει ένα θεραπευτικό φίλτρο.
items.bombs.regrowthbomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.regrowthbomb.name=βόμβα αναγέννησης
items.bombs.shrapnelbomb.desc=Αυτή η βόμβα έχει τροποποιηθεί με κομμάτια μετάλλου του DM-300, τα οποία θα θρυμματιστούν και θα εκτοξευθούν παντού όταν εκραγούν, προκαλώντας _%1$d-%2$d ζημιά_ σε τεράστια εμβέλεια γύρω από τη βόμβα. Καλύτερα να κρυφτείς πίσω από κάτι όταν τη χρησιμοποιείς...
items.bombs.shrapnelbomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.shrapnelbomb.name=βόμβα θραυσμάτων
items.bombs.smokebomb.desc=Αυτή η βόμβα έχει τροποποιηθεί ώστε να εκτοξεύει ένα πυκνό νέφος αερίου ταυτόχρονα με την έκρηξή της. Θα προκαλέσει _%1$d-%2$d ζημιά_ και θα απλώσει ομίχλη που καλύπτει 2 πλακίδια.
items.bombs.smokebomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.smokebomb.name=βόμβα καπνού
items.bombs.woollybomb.desc=Αυτή η προσαρμοσμένη βόμβα θα δημιουργήσει ένα ευρύ πεδίο από μαγικά πρόβατα μετά την έκρηξή της. Η έκρηξη θα προκαλέσει _%1$d-%2$d ζημιά_ σε οτιδήποτε βρίσκεται εντός 2 πλακιδίων. Το πρόβατο θα μπλοκάρει την κίνηση και θα παραμένει για πολύ μεγάλο χρονικό διάστημα! Το πρόβατο όμως δεν θα διαρκέσει τόσο πολύ παρουσία ισχυρών εχθρών και μπορεί να εξουδετερωθεί χειροκίνητα νωρίτερα αλληλεπιδρώντας μαζί τους.
items.bombs.woollybomb.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.bombs.woollybomb.name=μάλλινη βόμβα
items.brokenseal$warriorshield.desc_active=Η σπασμένη σφραγίδα του Πολεμιστή τον βοηθά αυτήν τη στιγμή να επιμένει, παρέχοντάς του ασπίδα επιπλέον της υγείας του. Υπάρχει ένας χρόνος αναμονής μετά την αρχική ενεργοποίηση της ασπίδας, προτού μπορέσει να χρησιμοποιηθεί ξανά.\n\nΑυτή η ασπίδα δεν φθείρεται με την πάροδο του χρόνου, αλλά θα λήξει αν δεν υπάρχουν εχθροί κοντά για μερικούς γύρους. Όταν τελειώσει, οποιαδήποτε αχρησιμοποίητη ασπίδα θα μειώσει τον χρόνο αναμονής, έως το μέγιστο των 50%%.\n\nΥπόλοιπο ασπίδας: %1$d.\n\nΤρέχων χρόνος αναμονής: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Ο Πολεμιστής πρόσφατα απέκτησε θωράκιση από τη σπασμένη σφραγίδα του και πρέπει να περιμένει μέχρι να μπορέσει να επωφεληθεί ξανά από την επίδραση θωράκισής της.\n\nΥπόλοιποι Γύροι: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Ο χρόνος αναμονής της ασπίδας του Πολεμιστή είναι αυτήν τη στιγμή αρνητικός, που σημαίνει ότι όταν ενεργοποιηθεί η ασπίδα του, ο χρόνος αναμονής θα είναι χαμηλότερος από τους συνήθεις 150 γύρους. Ο χρόνος αναμονής της ασπίδας μπορεί να μειωθεί έως και σε -150 γύρους, πράγμα που σημαίνει ότι θα είναι αμέσως ξανά διαθέσιμη μόλις ενεργοποιηθεί.\n\nΤρέχων χρόνος αναμονής: %d.
items.brokenseal$warriorshield.name=Ασπίδα Πολεμιστή
items.brokenseal.ac_affix=ΠΡΟΣΦΥΜΑ
items.brokenseal.affix=Εσύ βάζεις τη σφραγίδα στην πανοπλία σου!
items.brokenseal.choose_desc=Τόσο αυτή η πανοπλία όσο και η σπασμένη σφραγίδα φέρουν ένα σύμβολο. Επιλέξτε ποιο σύμβολο θα κρατηθεί.\n\nΓλύφος Πανοπλίας: %1$s\nΓλύφος Σπασμένης Σφραγίδας: %2$s\n\nΣημειώστε ότι αν επιλέξετε το σύμβολο που βρίσκεται αυτήν τη στιγμή στην πανοπλία, η σφραγίδα δεν θα μπορεί να το μεταφέρει αργότερα.
items.brokenseal.choose_title=Επιλέξτε ένα γλύφο
items.brokenseal.cursed_armor=Η σφραγίδα δεν θα ισχύει για καταραμένη πανοπλία.
items.brokenseal.desc=Μια σφραγίδα από κερί, προσαρτημένη στην πανοπλία ως σύμβολο ανδρείας. Έχει έναν ξεθωριασμένο ρούνο προστασίας χαραγμένο στο κέντρο και είναι σπασμένο στη μέση.\n\nA ενθύμιο από το σπίτι του, η σφραγίδα βοηθά τον πολεμιστή να επιμείνει. Ενώ φοράει τη σφραγίδα, ο πολεμιστής θα αποκτήσει αμέσως θωράκιση όταν πρόκειται να υποστεί ζημιά στη μισή ζωή ή χαμηλότερη.\n\nΗ σφραγίδα μπορεί να _προσαρτηθεί στην πανοπλία_ και να μετακινηθεί μεταξύ πανοπλιών. Μπορεί να φέρει μία μόνο αναβάθμιση, αρκεί η αναβάθμιση να εφαρμόστηκε στην πανοπλία ενώ η σφραγίδα ήταν προσαρτημένη σε αυτήν.
items.brokenseal.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.brokenseal.inscribed=Η σφραγίδα φέρει χαραγμένη την ένδειξη _%s._
