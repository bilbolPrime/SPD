items.artifacts.hornofplenty.desc=Δεν μπορείς να φυσήξεις μέσα σε αυτό το κέρας, αλλά φαίνεται να γεμίζει με φαγητό καθώς εξερευνάς και αποκτάς εμπειρία. Μπορείς να καταναλώσεις κάθε φόρτιση ξεχωριστά ως σνακ ή να φας μέχρι να χορτάσεις.
items.artifacts.hornofplenty.desc_cursed=Το καταραμένο κέρατο έχει δέσει τον εαυτό του στο πλευρό σου, φαίνεται να είναι πρόθυμο να πάρει τροφή παρά να την παράγει.
items.artifacts.hornofplenty.desc_hint=Ίσως υπάρχει τρόπος να αυξηθεί η ισχύς του κόρνου δίνοντάς του τροφική ενέργεια.
