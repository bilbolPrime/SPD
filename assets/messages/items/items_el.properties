items.dewvial.desc=Μπορείς να φυλάξεις την περίσσια δροσιά σε αυτό το μικρό φιαλίδιο για να την πιεις αργότερα. Αν το φιαλίδιο είναι γεμάτο, θα πιεις τη δροσιά αυτόματα όταν κινδυνεύεις να πεθάνεις.
