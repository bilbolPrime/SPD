items.food.blandfruit.desc=Τόσο στεγνό και άοσμο, που ίσως το βράσιμο του με κάποιο άλλο συστατικό θα το βελτίωνε.
items.food.blandfruit.desc_cooked=Ο καρπός έχει φουσκώσει από τον χρόνο που έχει μουλιάσει στην κατσαρόλα και έχει απορροφήσει ακόμη και τις ιδιότητες του σπόρου με τον οποίο μαγειρέψαμε. Θα έχει την επίδραση οποιουδήποτε φίλτρου στο οποίο αντιστοιχούσε ο σπόρος.
