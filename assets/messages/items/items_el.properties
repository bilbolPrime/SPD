items.journal.alchemypage.desc=Μια σκισμένη σελίδα από έναν οδηγό αλχημείας. \n\nΤο μεγαλύτερο μέρος του κειμένου είναι πολύ μικρό για να διαβαστεί από απόσταση, αλλά μπορείτε να διακρίνετε τον τίτλο της σελίδας: \n\n_"%s"_
