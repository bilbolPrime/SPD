items.artifacts.etherealchains.cursed=Δεν μπορείς να χρησιμοποιήσεις καταραμένες αλυσίδες.
items.artifacts.etherealchains.desc=Αυτές οι μεγάλες αλλά ελαφριές αλυσίδες λάμπουν με πνευματική ενέργεια. Μπορούν να χρησιμοποιηθούν για να σας τραβήξουν προς το έδαφος ή να τραβήξουν εχθρούς προς το μέρος σας. Η αιθέρια φύση των αλυσίδων τους επιτρέπει ακόμη και να εκτείνονται μέσα από τοίχους!
items.artifacts.etherealchains.desc_cursed=Οι καταραμένες αλυσίδες είναι κλειδωμένες στο πλευρό σου, αιωρούνται συνεχώς, προσπαθώντας να σε σκοντάψουν ή να σε δέσουν.
items.artifacts.etherealchains.desc_equipped=Οι αλυσίδες ακουμπούν γύρω από το πλευρό σας, απορροφώντας αργά την πνευματική ενέργεια όσων νικάτε. Κάθε φόρτιση είναι ένας κρίκος στην αλυσίδα, ο οποίος θα εκτείνεται σε ακριβώς ένα πλακίδιο.
