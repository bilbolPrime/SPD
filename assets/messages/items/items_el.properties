items.artifacts.driedrose$wndghosthero.desc=Το φάντασμα είναι αδύναμο από μόνο του, αλλά η μορφή του είναι αρκετά συμπαγής για να είναι εξοπλισμένο με όπλο και πανοπλία. Θα μπορεί να χρησιμοποιεί αυτά τα αντικείμενα όπως ακριβώς κάνετε εσείς.\n\nΤο φάντασμα μπορεί προς το παρόν να εξοπλίσει αντικείμενα που απαιτούν δύναμη έως _%d._
