items.scrolls.exotic.exoticscroll.unknown_desc=Ένας λαμπερός, ανεξιχνίαστος μαγικός ρούνος είναι γραμμένος σε αυτή τη μαύρη περγαμηνή. Φαίνεται ξένος σε αυτή τη γη, ποιος ξέρει τι θα κάνει όταν διαβαστεί δυνατά;
items.scrolls.exotic.exoticscroll.yngvi=εξωτικός κύλινδρος του YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Η επικλητική φράση σε αυτόν τον πάπυρο θα σας περιβάλει με μια μαγική αύρα που μπλοκάρει προσωρινά όλα τα μαγικά εφέ, επιβλαβή ή χρήσιμα. Αυτό περιλαμβάνει τα περισσότερα εφέ μαγικών αντικειμένων, όπως ραβδιά, πάπυρους, δαχτυλίδια, αντικείμενα, ξόρκια και κατάρες. Οι ικανότητες της ηρωικής πανοπλίας είναι αρκετά ισχυρές για να λειτουργήσουν ανεξάρτητα από αυτό.
items.scrolls.exotic.scrollofantimagic.name=κύλινδρος αντιμαγείας
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Μια μαγική αρένα έχει εμφανιστεί γύρω σας, που συμβολίζεται από μια κυματιστή κόκκινη ομίχλη.\n\nΕνώ στέκεστε στην ομίχλη, η πείνα σας δεν θα αυξηθεί και θα δεχτείτε 33%% λιγότερη ζημιά από όλες τις πηγές. Εάν έχετε οποιεσδήποτε άλλες πηγές μείωσης ζημιάς (όπως πανοπλία), αυτές θα εφαρμοστούν μετά τη μείωση 33%%.\n\nΥπόλοιποι γύροι: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=αρένα πρόκλησης
items.scrolls.exotic.scrollofchallenge.desc=Όταν διαβαστεί φωναχτά, αυτός ο πάπυρος θα εξαπολύσει ένα δυνατό βρυχηθμό που θα προσελκύσει τους εχθρούς προς τον χρήστη, δημιουργώντας ταυτόχρονα μια μικρή αρένα γύρω τους.\n\nAΕφόσον ο αναγνώστης παραμείνει σε αυτήν την αρένα, θα δεχτεί 33% λιγότερη ζημιά από όλες τις πηγές (αυτό εφαρμόζεται πριν από άλλες μορφές μείωσης ζημιάς) και δεν θα χάσει τον κορεσμό του.\n\nΤο μέγεθος της αρένας θα κλιμακωθεί ανάλογα με το μέγεθος της περιοχής στην οποία βρίσκεται ο αναγνώστης. Θα είναι ιδιαίτερα μικρό σε ορισμένες περιοχές του αρχηγού.
items.scrolls.exotic.scrollofchallenge.name=πάπυρος πρόκλησης
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ο κύλινδρος της μαντείας σας έχει εντοπίσει τα ακόλουθα στοιχεία:
items.scrolls.exotic.scrollofdivination.desc=Αυτός ο πάπυρος θα αναγνωρίσει τυχαία τέσσερις τύπους αντικειμένων που δεν γνωρίζετε προς το παρόν. Οι τύποι που αναγνωρίζονται μπορεί να είναι το χρώμα ενός φίλτρου, ο ρούνος ενός πάπυρου ή το πετράδι ενός δαχτυλιδιού. Τα αντικείμενα που αναγνωρίζονται δεν θα είναι απαραίτητα αυτά που κουβαλάτε.
items.scrolls.exotic.scrollofdivination.name=ρολό μαντείας
items.scrolls.exotic.scrollofdivination.nothing_left=Δεν έχει μείνει τίποτα να αναγνωρίσουμε!
items.scrolls.exotic.scrollofdread.desc=Όταν διαβαστεί, αυτός ο πάπυρος θα εκπέμψει μια λάμψη κόκκινου φωτός που θα ενσταλάξει απίστευτο τρόμο σε όλους τους εχθρούς στο οπτικό σας πεδίο. Τόσο ισχυρό είναι αυτό το φαινόμενο που θα προσπαθήσουν γρήγορα να δραπετεύσουν από ολόκληρο το μπουντρούμι, για να μην τους ξαναδείτε ποτέ!\n\nΌπως και με τον τρόμο, αυτό το φαινόμενο μπορεί να λήξει με την πάροδο του χρόνου ή εάν ο εχθρός δεχθεί επίθεση.\n\nΟι ισχυρογνώμονες εχθροί, όπως οι αρχηγοί, θα υποστούν κανονικό τρόμο.
items.scrolls.exotic.scrollofdread.name=κύλινδρος τρόμου
items.scrolls.exotic.scrollofenchantment.armor=Επιλέξτε ένα σύμβολο για να εφαρμόσετε στην πανοπλία σας.
items.scrolls.exotic.scrollofenchantment.cancel=ματαίωση
items.scrolls.exotic.scrollofenchantment.cancel_warn=Η ακύρωση θα εξακολουθήσει να καταναλώνει τον πάπυρο μαγείας σου, είσαι σίγουρος;
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Όχι, άλλαξα γνώμη
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ναι, είμαι σίγουρος/η
items.scrolls.exotic.scrollofenchantment.desc=Αυτός ο πάπυρος θα εμποτίσει ένα όπλο ή μια πανοπλία με ισχυρή μαγική ενέργεια. Ο αναγνώστης έχει ακόμη και κάποιο βαθμό ελέγχου ως προς το ποια μαγεία είναι εμποτισμένη.
items.scrolls.exotic.scrollofenchantment.inv_title=Μαγέψτε ένα αντικείμενο
items.scrolls.exotic.scrollofenchantment.name=κύλινδρος μαγείας
items.scrolls.exotic.scrollofenchantment.weapon=Επιλέξτε μια γοητεία για να εφαρμόσετε στο όπλο σας.
items.scrolls.exotic.scrollofforesight.desc=Αφού διαβάσει αυτόν τον πάπυρο, οι λεπτομέρειες του κοντινού εδάφους θα τροφοδοτούνται συνεχώς στο μυαλό του αναγνώστη με κρυστάλλινη καθαρότητα. Αυτό το εφέ διαρκεί για σημαντικό χρονικό διάστημα και θα αποκαλύψει όλες τις κρυφές πόρτες ή παγίδες, καθιστώντας την αναζήτηση περιττή.
items.scrolls.exotic.scrollofforesight.name=πάπυρος προνοητικότητας
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Η ακύρωση θα συνεχίσει να καταναλώνει τον κύλινδρο της μεταμόρφωσης, είσαι σίγουρος;
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Διάλεξε ένα ταλέντο για να μεταμορφωθείς.
items.scrolls.exotic.scrollofmetamorphosis.desc=Αυτός ο πάπυρος περιέχει ισχυρή μαγεία μεταστοιχείωσης, η οποία θα εφαρμοστεί στον παίκτη αντί για ένα αντικείμενο. Η μαγεία αυτού του πάπυρου θα σας επιτρέψει να επιλέξετε ένα ταλέντο και να το αντικαταστήσετε με ένα από τα πέντε ταλέντα της ίδιας βαθμίδας από διαφορετικές κλάσεις ηρώων!\n\nΑυτό το εφέ μπορεί να εφαρμοστεί μόνο σε ταλέντα κλάσης, όχι σε ταλέντα που αποκτώνται από υποκλάσεις ή ικανότητες θωράκισης. Τα ταλέντα που δεν μπορείτε να χρησιμοποιήσετε δεν θα δοθούν ως επιλογές.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=μεταμορφώνω το ταλέντο
items.scrolls.exotic.scrollofmetamorphosis.name=κύλινδρος της μεταμόρφωσης
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Διάλεξε ένα νέο ταλέντο για να αντικαταστήσεις το μεταμορφωμένο σου ταλέντο.
items.scrolls.exotic.scrollofmysticalenergy.desc=Η ακατέργαστη μαγική δύναμη που είναι δεσμευμένη σε αυτό το περγαμηνό, όταν απελευθερωθεί, θα φορτίσει τα εξοπλισμένα αντικείμενα ενός χρήστη με την πάροδο του χρόνου.
items.scrolls.exotic.scrollofmysticalenergy.name=κύλινδρος μυστικιστικής ενέργειας
items.scrolls.exotic.scrollofpassage.desc=Το ξόρκι σε αυτό το περγαμηνό μεταφέρει αμέσως τον αναγνώστη στην πλησιέστερη περιοχή, στον πρώτο όροφο από πάνω του. Πολύ βολικό για γρήγορη πρόσβαση σε ένα κατάστημα.
items.scrolls.exotic.scrollofpassage.name=κύλινδρος αποσπάσματος
items.scrolls.exotic.scrollofprismaticimage.desc=Η επωδός σε αυτόν τον πάπυρο θα δημιουργήσει ένα πολύχρωμο, απατηλό δίδυμο του αναγνώστη. Αυτή η πρισματική εικόνα λειτουργεί ως ένας πιο αδύναμος κλώνος του αναγνώστη, με παρόμοια άμυνα αλλά χαμηλότερη hp και ζημιά.\n\nΗ πρισματική εικόνα θα εμφανίζεται όταν υπάρχουν εχθροί και θα προσπαθεί να υπερασπιστεί τον αναγνώστη.\n\nΕάν υπάρχει ήδη μια πρισματική εικόνα, η χρήση αυτού του πάπυρου θα την θεραπεύσει πλήρως.
items.scrolls.exotic.scrollofprismaticimage.name=κύλινδρος πρισματικής εικόνας
items.scrolls.exotic.scrollofpsionicblast.desc=Αυτός ο πάπυρος περιέχει απίστευτη καταστροφική ενέργεια που μπορεί να διοχετευτεί για να καταστρέψει τα μυαλά όλων των ορατών πλασμάτων.\n\nΥπάρχει σημαντική ανατροφοδότηση, ωστόσο, και ο αναγνώστης θα υποστεί επίσης ζημιά, θα τυφλωθεί και θα αποδυναμωθεί. Όσο περισσότερους στόχους χτυπήσει ο πάπυρος, τόσο λιγότερη αυτοτραυματισμός θα υποστεί.
items.scrolls.exotic.scrollofpsionicblast.name=κύλινδρος ψιονικής έκρηξης
items.scrolls.exotic.scrollofpsionicblast.ondeath=Η Ψιονική Έκρηξη σου διαλύει το μυαλό...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Αυτό το πλάσμα έχει μαγευτεί από τη μαγεία ενός πάπυρου με το τραγούδι της Σειρήνας. \n\nΈνας μαγεμένος χαρακτήρας είναι για πάντα σύμμαχός σας και θα πολεμήσει οποιονδήποτε εχθρό συναντήσει.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=μαγεμένος
items.scrolls.exotic.scrollofsirenssong.cancel=Πρέπει να επιλέξετε έναν στόχο.
items.scrolls.exotic.scrollofsirenssong.desc=Η ανάγνωση αυτού του πάπυρου εκπέμπει μια σαγηνευτική μελωδία που θα μαγέψει έναν στοχευμένο εχθρό, μετατρέποντάς τον μόνιμα σε σύμμαχο! Άλλοι εχθροί που θα την ακούσουν θα γοητευτούν προσωρινά. \n\nΙδιαίτερα ισχυροί εχθροί μπορούν να αντισταθούν στο εφέ μαγείας και αντ' αυτού θα γοητευτούν.
items.scrolls.exotic.scrollofsirenssong.name=πάπυρος με το τραγούδι της Σειρήνας
items.scrolls.exotic.scrollofsirenssong.no_target=Ο πάπυρος ενεργοποιείται χωρίς στόχο.
items.scrolls.exotic.scrollofsirenssong.prompt=Επιλέξτε έναν στόχο
items.scrolls.inventoryscroll.no=Όχι, άλλαξα γνώμη
items.scrolls.inventoryscroll.warning=Θέλετε πραγματικά να ακυρώσετε αυτήν τη χρήση κύλισης; Η κύλιση δεν είχε αναγνωριστεί προηγουμένως, επομένως θα καταναλωθεί ούτως ή άλλως.
items.scrolls.inventoryscroll.yes=Ναι, είμαι θετικός/η
items.scrolls.scroll$placeholder.name=πάπυρος
items.scrolls.scroll.ac_read=ΑΝΑΓΝΩΣΗ
items.scrolls.scroll.berkanan=κύλινδρος του BERKANAN
items.scrolls.scroll.blinded=Δεν μπορείς να διαβάσεις έναν πάπυρο ενώ είσαι τυφλός.
items.scrolls.scroll.cursed=Το καταραμένο βιβλίο ξορκιών σου σε εμποδίζει να επικαλεστείς τη μαγεία αυτού του πάπυρου! Ένας πάπυρος αφαίρεσης κατάρας μπορεί να είναι αρκετά ισχυρός για να συνεχίσει να λειτουργεί...
items.scrolls.scroll.gyfu=κύλινδρος του GYFU
items.scrolls.scroll.isaz=κύλινδρος του ISAZ
items.scrolls.scroll.kaunan=κύλινδρος του KAUNAN
items.scrolls.scroll.laguz=κύλινδρος του ΛΑΓΟΥΖ
items.scrolls.scroll.mannaz=κύλινδρος του ΜΑΝΝΑΖ
items.scrolls.scroll.naudiz=κύλινδρος του NAUDIZ
items.scrolls.scroll.no_magic=Δεν μπορείς να διαβάσεις έναν πάπυρο όσο είσαι άτρωτος στη μαγεία.
items.scrolls.scroll.odal=κύλινδρος του ODAL
items.scrolls.scroll.raido=κύλινδρος του RAIDO
items.scrolls.scroll.sowilo=κύλινδρος του SOWILO
items.scrolls.scroll.tiwaz=κύλινδρος του TIWAZ
items.scrolls.scroll.unknown_desc=Αυτή η περγαμηνή είναι γεμάτη ακατάληπτα γράμματα και φέρει τον ρούνο %s ως τίτλο. Ποιος ξέρει τι θα συμβεί αν τη διαβάσεις δυνατά;
items.scrolls.scroll.yngvi=πάπυρος του YNGVI
items.scrolls.scrollofidentify.desc=Αποκαλύπτει μόνιμα όλα τα μυστικά ενός μόνο αντικειμένου.
items.scrolls.scrollofidentify.inv_title=Προσδιορίστε ένα στοιχείο
items.scrolls.scrollofidentify.it_is=Το αντικείμενό σας έχει αναγνωριστεί: %s.
items.scrolls.scrollofidentify.name=πάπυρος αναγνώρισης
items.scrolls.scrolloflullaby.desc=Μια χαλαρωτική μελωδία θα βάλει όλα τα πλάσματα στο οπτικό σας πεδίο σε βαθύ ύπνο, δίνοντάς σας την ευκαιρία να φύγετε ή να τους επιτεθείτε αιφνιδιαστικά.
items.scrolls.scrolloflullaby.name=πάπυρος νανουρίσματος
items.scrolls.scrolloflullaby.sooth=Ο πάπυρος βγάζει μια καταπραϋντική μελωδία. Νιώθεις πολύ νυσταγμένος.
items.scrolls.scrollofmagicmapping.desc=Όταν διαβαστεί αυτός ο πάπυρος, μια εικόνα κρυστάλλινης διαύγειας θα χαραχθεί στη μνήμη σας, ειδοποιώντας σας για την ακριβή διάταξη του επιπέδου και αποκαλύπτοντας όλα τα κρυμμένα μυστικά. Οι τοποθεσίες των αντικειμένων και των πλασμάτων θα παραμείνουν άγνωστες.
items.scrolls.scrollofmagicmapping.layout=Τώρα γνωρίζετε τη διάταξη των επιπέδων.
items.scrolls.scrollofmagicmapping.name=πάπυρος μαγικής χαρτογράφησης
items.scrolls.scrollofmirrorimage.copies=Ο κύλινδρος σχηματίζει κατοπτρικές εικόνες σας.
items.scrolls.scrollofmirrorimage.desc=Η επωδός σε αυτόν τον πάπυρο θα δημιουργήσει ψευδαισθητικά δίδυμα του αναγνώστη, τα οποία θα κυνηγήσουν τους εχθρούς του.
items.scrolls.scrollofmirrorimage.name=πάπυρος κατοπτρικής εικόνας
items.scrolls.scrollofmirrorimage.no_copies=Ο πάπυρος προσπαθεί να δημιουργήσει κατοπτρικές εικόνες σου, αλλά δεν έχουν πουθενά να πάνε.
items.scrolls.scrollofrage.desc=Όταν διαβαστεί φωναχτά, αυτός ο κύλινδρος θα εξαπολύσει έναν μεγάλο βρυχηθμό που θα προσελκύσει όλους τους εχθρούς κοντά στον αναγνώστη και θα εξοργίσει τους κοντινούς.
items.scrolls.scrollofrage.name=κύλινδρος οργής
items.scrolls.scrollofrage.roar=Ο πάπυρος εκπέμπει έναν εξοργιστικό βρυχηθμό που αντηχεί σε όλο το μπουντρούμι!
items.scrolls.scrollofrecharging.desc=Η ακατέργαστη μαγική δύναμη που είναι δεσμευμένη σε αυτό το περγαμηνό, όταν απελευθερωθεί, θα επαναφορτίσει όλα τα ραβδιά του αναγνώστη σε πλήρη ισχύ.
items.scrolls.scrollofrecharging.name=πάπυρος επαναφόρτισης
items.scrolls.scrollofrecharging.surge=Μια έκρηξη ενέργειας διαπερνά το σώμα σας, αναζωογονώντας τα ραβδιά σας!
items.scrolls.scrollofremovecurse.cleansed=Το αντικείμενό σας λάμπει με ένα καθαρτικό φως και μια κακόβουλη ενέργεια διασκορπίζεται!
items.scrolls.scrollofremovecurse.desc=Η επικλητική φράση σε αυτόν τον πάπυρο θα αφαιρέσει αμέσως από το όπλο, την πανοπλία, τα δαχτυλίδια και τα αντικείμενα που μεταφέρει ο αναγνώστης τυχόν κακά ξόρκια που θα μπορούσαν να εμποδίσουν τον χρήστη να τα αφαιρέσει.
items.scrolls.scrollofremovecurse.inv_title=Καθαρισμός ενός αντικειμένου
items.scrolls.scrollofremovecurse.name=πάπυρος αφαίρεσης κατάρας
items.scrolls.scrollofremovecurse.not_cleansed=Το αντικείμενό σας λάμπει με ένα καθαριστικό φως, αλλά δεν συμβαίνει τίποτα.
items.scrolls.scrollofremovecurse.spirit=Ο πάπυρος σου ελευθερώνει το βασανισμένο πνεύμα!
items.scrolls.scrollofretribution.blast=Ισχυρή μαγική ενέργεια ξεπηδά από τον πάπυρο!
items.scrolls.scrollofretribution.desc=Αυτός ο πάπυρος περιέχει καταστροφική ενέργεια η οποία διοχετεύει τον πόνο του αναγνώστη προς τα έξω σε μια έκρηξη δύναμης. Όσο πιο αδύναμος είναι ο αναγνώστης, τόσο μεγαλύτερη ζημιά θα προκαλέσει. Σε πολύ χαμηλή ζωή, αυτός ο πάπυρος μπορεί να σκοτώσει τους περισσότερους εχθρούς αμέσως.\n\nUΩστόσο, η χρήση του πάπυρου έχει αρνητικό αντίκτυπο στον χρήστη, τυφλώνοντάς τον και αποδυναμώνοντάς τον.
items.scrolls.scrollofretribution.name=πάπυρος της τιμωρίας
items.scrolls.scrollofteleportation.cant_reach=Δεν μπορείς να τηλεμεταφερθείς εκεί.
items.scrolls.scrollofteleportation.desc=Το ξόρκι σε αυτό το περγαμηνό μεταφέρει αμέσως τον αναγνώστη σε μια τυχαία τοποθεσία στο επίπεδο του μπουντρουμιού. Μπορεί να χρησιμοποιηθεί για να ξεφύγει από μια επικίνδυνη κατάσταση, αλλά ο άτυχος αναγνώστης μπορεί να βρεθεί σε ένα ακόμη πιο επικίνδυνο μέρος.
items.scrolls.scrollofteleportation.name=πάπυρος τηλεμεταφοράς
items.scrolls.scrollofteleportation.no_tele=Η μαγεία της τηλεμεταφοράς αποτυγχάνει.
items.scrolls.scrollofteleportation.prompt=Επιλέξτε μια τοποθεσία για τηλεμεταφορά
items.scrolls.scrollofteleportation.tele=Σε μια στιγμή τηλεμεταφέρθηκες σε μια άλλη τοποθεσία του επιπέδου.
items.scrolls.scrollofterror.desc=Μια λάμψη κόκκινου φωτός θα κατακλύσει με τρόμο όλα τα πλάσματα στο οπτικό σας πεδίο και θα γυρίσουν και θα φύγουν. Η επίθεση σε έναν εχθρό που τρέχει θα διαλύσει το φαινόμενο.
items.scrolls.scrollofterror.many=Ο πάπυρος εκπέμπει μια λαμπρή λάμψη κόκκινου φωτός και τα τέρατα τρέπονται σε φυγή!
items.scrolls.scrollofterror.name=πάπυρος τρόμου
items.scrolls.scrollofterror.none=Ο κύλινδρος εκπέμπει μια λαμπρή λάμψη κόκκινου φωτός.
items.scrolls.scrollofterror.one=Ο πάπυρος εκπέμπει μια λαμπρή λάμψη κόκκινου φωτός και το %s τρέπεται σε φυγή!
items.scrolls.scrolloftransmutation.desc=Αυτός ο πάπυρος περιέχει ισχυρή μαγεία μεταστοιχείωσης. Όταν χρησιμοποιείται σε ένα κατάλληλο αντικείμενο, θα το μετατρέψει σε ένα διαφορετικό αντικείμενο του ίδιου τύπου. Η μαγεία θα διατηρήσει ακόμη και αναβαθμίσεις, ξόρκια και γλύφους. Οι πάπυροι και τα φίλτρα θα μετατραπούν στο εξωτικό τους αντίστοιχο και αντίστροφα.
items.scrolls.scrolloftransmutation.inv_title=Μετατροπή ενός στοιχείου
items.scrolls.scrolloftransmutation.morph=Το αντικείμενό σας μεταμορφώνεται σε κάτι διαφορετικό!
items.scrolls.scrolloftransmutation.name=κύλινδρος μεταστοιχείωσης
items.scrolls.scrolloftransmutation.nothing=Δεν συμβαίνει τίποτα ενδιαφέρον.
items.scrolls.scrollofupgrade.desc=Αυτός ο πάπυρος θα αναβαθμίσει ένα μεμονωμένο αντικείμενο, βελτιώνοντας την ποιότητά του. Ένα ραβδί θα αυξηθεί σε ισχύ και σε αριθμό φορτίσεων. Ένα όπλο θα προκαλέσει περισσότερη ζημιά ή θα βρει το σημάδι του πιο συχνά. Μια πανοπλία θα εκτρέψει επιπλέον χτυπήματα. Η επίδραση ενός δαχτυλιδιού στον κάτοχό του θα ενταθεί. Τα όπλα και η πανοπλία θα απαιτούν επίσης λιγότερη δύναμη για χρήση και τυχόν κατάρες στο αντικείμενο θα αρθούν.
items.scrolls.scrollofupgrade.inv_title=Αναβάθμιση ενός στοιχείου
items.scrolls.scrollofupgrade.name=πάπυρος αναβάθμισης
items.scrolls.scrollofupgrade.remove_curse=Ο πάπυρος αναβάθμισης καθαρίζει την κατάρα στο αντικείμενό σας!
items.scrolls.scrollofupgrade.weaken_curse=Ο πάπυρος αναβάθμισης αποδυναμώνει την κατάρα στο αντικείμενό σας.
items.spells.alchemize$wndalchemizeitem.energize=Μετατρέψτε σε ενέργεια %d
items.spells.alchemize$wndalchemizeitem.energize_1=Μετατρέψτε 1 σε ενέργεια %d
items.spells.alchemize$wndalchemizeitem.energize_all=Μετατρέψτε τα πάντα σε ενέργεια %d
items.spells.alchemize$wndalchemizeitem.sell=Μετατρέψτε σε %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Μετατρέψτε το 1 σε %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Μετατρέψτε τα όλα σε %dg
items.spells.alchemize.desc=Αυτό το ξόρκι περιέχει μετατρεπτικές δυνάμεις παρόμοιες με αυτές που βρίσκονται σε ένα δοχείο αλχημείας. Κάθε χρήση επιτρέπει στον χρήστη να μετατρέψει ένα αντικείμενο (ή μια στοίβα αντικειμένων) σε χρυσό ή αλχημική ενέργεια. Η μετατροπή φίλτρων ή πάπυρων σε ενέργεια θα τα αναγνωρίσει ακόμη και!\n\nA Λίγες χρήσεις Αλχημισμού πωλούνται από καταστήματα, αλλά πολλές περισσότερες μπορούν να γίνουν χρησιμοποιώντας αλχημεία συνδυάζοντας έναν σπόρο, μια ρουνική πέτρα και λίγη αλχημική ενέργεια.
items.spells.alchemize.name=αλχημίζω
items.spells.alchemize.prompt=Αλχημίστε ένα αντικείμενο
items.spells.beaconofreturning.creatures=Η Ψυχική αύρα των γειτονικών πλασμάτων δεν σας επιτρέπει να τηλεμεταφέρεστε αυτή τη στιγμή.
items.spells.beaconofreturning.desc=Αυτό το περίπλοκο ξόρκι δίνει στον χρήστη τη δυνατότητα να επιστρέψει σε μια καθορισμένη τοποθεσία, ανεξάρτητα από την απόσταση. Το ξόρκι θα καταναλωθεί μόνο με την επιστροφή, μπορεί να οριστεί όσες φορές θέλετε, αλλά θα θυμάται μόνο την πιο πρόσφατη τοποθεσία στην οποία ορίστηκε.
items.spells.beaconofreturning.desc_set=Αυτός ο φάρος ήταν τοποθετημένος κάπου στον όροφο %d.
items.spells.beaconofreturning.name=φάρος επιστροφής
items.spells.beaconofreturning.preventing=Η έντονη μαγική αύρα αυτού του μέρους σε εμποδίζει να χρησιμοποιήσεις το ξόρκι!
items.spells.beaconofreturning.set=Το beacon ορίστηκε στην τρέχουσα τοποθεσία σας.
items.spells.beaconofreturning.wnd_body=Η ρύθμιση θα παρακάμψει την τοποθεσία στην οποία είχε οριστεί προηγουμένως το beacon.\n\nΗ επιστροφή θα σας επιστρέψει στην τελευταία καθορισμένη τοποθεσία σας και θα καταναλώσει μία χρήση του ξορκιού.
items.spells.beaconofreturning.wnd_return=ΑΠΟΔΟΣΗ
items.spells.beaconofreturning.wnd_set=ΣΕΙΡΑ
items.spells.curseinfusion.desc=Αυτό το ξόρκι εμποτίζει ένα κομμάτι εξοπλισμού με την ίδια ισχυρή κακοήθη μαγεία που υπάρχει στο DM-300. Το αντικείμενο στο οποίο χρησιμοποιείται θα καταραστεί αμέσως και οποιαδήποτε μαγεία ή γλύφος μπορεί να είχε θα παρακαμφθεί.\n\nΣτην περίπτωση όπλων, πανοπλιών και ραβδιών, το αντικείμενο θα αποκτήσει αναβαθμίσεις εκτός από την κατάρα. Οι αναβαθμίσεις έγχυσης κατάρας δεν συσσωρεύονται και οι αναβαθμίσεις χάνονται εάν το αντικείμενο δεν καταραστεί.\n\nΠολλαπλές εγχύσεις κατάρας μπορούν επίσης να χρησιμοποιηθούν για να αλλάξετε την κατάρα σε ένα όπλο ή πανοπλία.
items.spells.curseinfusion.inv_title=Καταραστείτε ένα αντικείμενο
items.spells.curseinfusion.name=έγχυση κατάρας
items.spells.magicalinfusion.desc=Αυτό το ξόρκι έχει την ίδια μαγική δύναμη με έναν πάπυρο αναβάθμισης, αλλά σε πιο σταθερή μορφή. \n\n Εκτός από την αναβάθμιση ενός αντικειμένου κανονικά, δεν θα σβήσει ποτέ μια γοητεία, ένα σύμβολο ή μια κατάρα.
items.spells.magicalinfusion.infuse=Το αντικείμενό σου είναι εμπλουτισμένο με απόκρυφη ενέργεια!
items.spells.magicalinfusion.inv_title=Εγχύστε ένα αντικείμενο
items.spells.magicalinfusion.name=μαγική έγχυση
items.spells.magicalporter.desc=Αυτό το ξόρκι θα μεταφέρει μαγικά οποιοδήποτε αντικείμενο στο οποίο θα εκτελεστεί. Σε αντίθεση με ένα φάρο εμπόρου, ωστόσο, τα αντικείμενα θα μεταφερθούν στην είσοδο του επόμενου ορόφου του αρχηγού.
items.spells.magicalporter.inv_title=Μεταφορά ενός στοιχείου
items.spells.magicalporter.name=μαγικός αχθοφόρος
items.spells.magicalporter.nowhere=Δεν υπάρχει πουθενά για να μεταφέρετε ένα αντικείμενο.
items.spells.phaseshift.desc=Αυτό το χαοτικό ξόρκι θα τηλεμεταφέρει οποιονδήποτε χαρακτήρα στοχεύει σε μια τυχαία τοποθεσία στον τρέχοντα όροφο και θα τον αναισθητοποιήσει για σημαντικό χρονικό διάστημα. Οι ισχυροί εχθροί θα είναι σε θέση να αντισταθούν στο εφέ αναισθητοποίησης. Αυτό το ξόρκι μπορεί να κατευθυνθεί σε έναν στόχο ή στον ίδιο τον χρήστη.
items.spells.phaseshift.name=μετατόπιση φάσης
items.spells.phaseshift.no_target=Δεν υπάρχει τίποτα για τηλεμεταφορά εκεί.
items.spells.reclaimtrap.desc=Αυτό το ξόρκι περιέχει υπολείμματα της μηχανικής ενέργειας του DM-300. Όταν εκτελείται σε μια ενεργή παγίδα, η δύναμη της παγίδας θα προσκολληθεί σε εσάς, επιτρέποντάς σας να χρησιμοποιήσετε ξανά το ξόρκι για να αποβάλετε αυτήν τη δύναμη και να ενεργοποιήσετε την επίδραση της παγίδας σε οποιαδήποτε τοποθεσία θέλετε.\n\nΩστόσο, ορισμένες παγίδες ενδέχεται να μην λειτουργούν σε όλα τα μέρη και μόνο μία παγίδα μπορεί να αποθηκευτεί κάθε φορά.
items.spells.reclaimtrap.desc_trap=Το ξόρκι είναι έτοιμο να ενεργοποιήσει ένα _%s._
items.spells.reclaimtrap.name=παγίδα ανάκτησης
items.spells.reclaimtrap.no_trap=Δεν υπάρχει παγίδα εκεί.
items.spells.recycle.desc=Αυτό το ξόρκι περιέχει μια λιγότερο σημαντική μορφή μαγείας μεταστοιχείωσης. Αν και δεν λειτουργεί με εξοπλισμό, θα μετατρέψει έναν πάπυρο, ένα φίλτρο, έναν σπόρο, μια ρουνική πέτρα ή ένα βέλος με αιχμή σε ένα τυχαίο αντικείμενο του ίδιου τύπου.
items.spells.recycle.inv_title=Ανακυκλώστε ένα αντικείμενο
items.spells.recycle.name=ανακυκλώνω
items.spells.recycle.recycled=Το αντικείμενό σας ανακυκλώθηκε σε: %s.
items.spells.spell.ac_cast=ΕΚΜΑΓΕΙΟ
items.spells.spell.discover_hint=Μπορείτε να κατασκευάσετε αυτό το αντικείμενο μέσω αλχημείας.
items.spells.spell.no_magic=Δεν μπορείς να κάνεις ξόρκια όσο είσαι άτρωτος στη μαγεία.
items.spells.summonelemental.ac_imbue=ΕΜΠΟΤΙΖΩ
items.spells.summonelemental.desc=Αυτό το ξόρκι διοχετεύει την ενέργεια των στοιχειωδών κάρβουνων που χρησιμοποιούνται για την παρασκευή του και θα σας επιτρέψει να καλέσετε ένα φιλικό στοιχειώδες για να πολεμήσει μαζί σας! Μόνο ένα στοιχειώδες μπορεί να καλεστεί κάθε φορά, αλλά το ξόρκι μπορεί να επαναχρησιμοποιηθεί για να σας επιστρέψει το στοιχειώδες χωρίς κόστος.
items.spells.summonelemental.desc_chaos=Το ξόρκι αυτή τη στιγμή εκπέμπει χαοτική ενέργεια, θα καλέσει ένα _στοιχειακό χάους_. Μπορείτε να εμποτίσετε ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει την τρέχουσα εμποτισμένη του δύναμη.
items.spells.summonelemental.desc_fire=Το ξόρκι είναι αυτήν τη στιγμή καυτό στην αφή, θα καλέσει ένα _στοιχειακό της φωτιάς_. Μπορείτε να εμποτίσετε ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει την τρέχουσα εμποτισμό του.
items.spells.summonelemental.desc_frost=Το ξόρκι είναι αυτήν τη στιγμή κρύο στην αφή, θα καλέσει ένα _παγωμένο στοιχειακό_. Μπορείτε να εμποτίσετε ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει την τρέχουσα εμποτισμό του.
items.spells.summonelemental.desc_newborn=Το ξόρκι δεν έχει εμποτιστεί προς το παρόν και θα καλέσει ένα _νεογέννητο στοιχειώδες_ χωρίς επίθεση από απόσταση. Μπορείτε να εμποτίσετε ένα προσδιορισμένο φίλτρο υγρής φλόγας, φίλτρο παγετού, πάγο επαναφόρτισης ή πάγο μεταστοιχείωσης για να ενεργοποιήσετε το ξόρκι, με αποτέλεσμα οι μελλοντικές κλήσεις να είναι στοιχειώδες πλήρους ισχύος!
items.spells.summonelemental.desc_shock=Το ξόρκι εκπέμπει αυτήν τη στιγμή στατική ενέργεια, θα καλέσει ένα _στοιχειακό σοκ_. Μπορείτε να εμποτίσετε ένα διαφορετικό αντικείμενο, αλλά το ξόρκι θα χάσει την τρέχουσα εμποτισμό του.
items.spells.summonelemental.imbue_prompt=Εμποτισμός ενός στοιχείου
items.spells.summonelemental.name=καλέστε το στοιχειώδες
items.spells.targetedspell.inv_title=Εγχύστε ένα αντικείμενο
items.spells.targetedspell.prompt=Επιλέξτε έναν στόχο
items.spells.telekineticgrab.cant_grab=Δεν μπορείς να το πιάσεις αυτό.
items.spells.telekineticgrab.desc=Αυτό το ξόρκι επιτρέπει στον παίκτη να αρπάξει από απόσταση όλα τα αντικείμενα σε μια τοποθεσία ή όλα τα όπλα που πετάχτηκαν κολλημένα σε έναν εχθρό!\n\nΔεν μπορεί να χρησιμοποιηθεί για να αρπάξει αντικείμενα που ανήκουν σε κάποιον άλλο ή για να αρπάξει δοχεία όπως κιβώτια.
items.spells.telekineticgrab.name=τηλεκινητική αρπαγή
items.spells.telekineticgrab.no_target=Δεν υπάρχει τίποτα να πιάσεις εκεί.
items.spells.unstablespell.desc=Αυτός ο μικρός μαύρος τετράγωνος κρύσταλλος έχει μεταβαλλόμενα ρουνικά σύμβολα σε κάθε μία από τις επιφάνειές του.\n\nΌταν ενεργοποιηθεί, θα ενεργοποιήσει το εφέ μιας τυχαίας κύλισης. Το εφέ κύλισης θα εστιάζει πάντα στη μάχη εάν υπάρχουν εχθροί στο οπτικό σας πεδίο, ενώ διαφορετικά θα είναι πάντα μη μαχητικό.
items.spells.unstablespell.name=ασταθές ξόρκι
items.spells.wildenergy.desc=Αυτό το ξόρκι περιέχει μέρος της καταραμένης ενέργειας που τροφοδοτούσε το DM-300. Όταν εκτελεστεί, θα επαναφορτίσει τα ραβδιά σας και τα φθαρμένα αντικείμενα, ενώ παράλληλα θα ενεργοποιήσει ένα τυχαίο εφέ καταραμένου ραβδιού. Ωστόσο, μπορείτε να επιλέξετε μια κατεύθυνση για να πυροβολήσει αυτή η καταραμένη μαγεία.
items.spells.wildenergy.name=άγρια ενέργεια
items.stones.inventorystone.ac_use=ΧΡΗΣΗ
items.stones.runestone$placeholder.name=ρουνικός λίθος
items.stones.runestone.discover_hint=Μπορείτε να βρείτε αυτό το αντικείμενο τυχαία στο μπουντρούμι ή να το κατασκευάσετε μέσω αλχημείας.
items.stones.stoneofaggression$aggression.desc=Η χειριστική μαγεία κάνει όλους τους κοντινούς εχθρούς να προτιμούν να επιτίθενται σε αυτόν τον χαρακτήρα.\n\nΥπολειπόμενοι γύροι: %s.
items.stones.stoneofaggression$aggression.name=στοχευμένο
items.stones.stoneofaggression.desc=Όταν αυτή η πέτρα πετιέται σε έναν σύμμαχο ή εχθρό, όλοι οι κοντινοί εχθροί θα προτιμήσουν να επιτεθούν σε αυτόν τον χαρακτήρα για μικρό χρονικό διάστημα. \n\nΟι εχθροί-αρχηγοί μπορούν να αντισταθούν στην επίδραση, ωστόσο, μειώνοντας σημαντικά τη διάρκεια και δέχοντας λιγότερη ζημιά από τις επιθέσεις των υπηρετών τους.
items.stones.stoneofaggression.name=πέτρα της επιθετικότητας
items.stones.stoneofaugmentation$wndaugment.cancel=Δεν πειράζει
items.stones.stoneofaugmentation$wndaugment.choice=Τι θα θέλατε να βελτιώσετε;
items.stones.stoneofaugmentation$wndaugment.damage=Βλάβη
items.stones.stoneofaugmentation$wndaugment.defense=Αμυνα
items.stones.stoneofaugmentation$wndaugment.evasion=Υπεκφυγή
items.stones.stoneofaugmentation$wndaugment.none=Αφαίρεση αύξησης
items.stones.stoneofaugmentation$wndaugment.speed=Ταχύτητα
items.stones.stoneofaugmentation.desc=Αυτή η ρουνική πέτρα διαθέτει ισχυρή μαγεία που μπορεί να ενισχύσει τον εξοπλισμό για να βελτιώσει μια ιδιότητα εις βάρος μιας άλλης.\n\nΧρησιμοποιώντας ένα όπλο θα μπορείτε να βελτιώσετε είτε την ταχύτητα είτε τη ζημιά. Τα εκτοξευόμενα όπλα θα αποκτήσουν ή θα χάσουν επίσης ανθεκτικότητα ανάλογα με την ταχύτητά τους.\n\nΧρησιμοποιώντας πανοπλία θα μπορείτε να βελτιώσετε είτε την άμυνα είτε την αποφυγή.
items.stones.stoneofaugmentation.discover_hint=Μπορείτε να αγοράσετε αυτό το αντικείμενο σε ένα κατάστημα ή να το κατασκευάσετε μέσω αλχημείας.
items.stones.stoneofaugmentation.inv_title=Αύξηση ενός στοιχείου
items.stones.stoneofaugmentation.name=πέτρα της αύξησης
items.stones.stoneofblast.desc=Αυτή η ρουνική πέτρα θα εκραγεί αμέσως στο σημείο που θα ριχθεί. Όπως ακριβώς μια βόμβα, η έκρηξη θα προκαλέσει ζημιά σε οτιδήποτε βρίσκεται κοντά.
items.stones.stoneofblast.name=πέτρα της έκρηξης
items.stones.stoneofblink.desc=Αυτή η ρουνική πέτρα θα τηλεμεταφέρει τον χρήστη στην τοποθεσία όπου θα πετάξει.
items.stones.stoneofblink.name=πέτρα του ανοιγοκλείσματος των ματιών
items.stones.stoneofclairvoyance.desc=Αυτή η πέτρα θα αποκαλύψει αμέσως όλα τα πλακίδια σε μια πολύ μεγάλη περιοχή γύρω από το σημείο που θα πεταχτεί. Η επίδρασή της θα φτάσει ακόμη και μέσα από τοίχους.
items.stones.stoneofclairvoyance.name=πέτρα της διόρασης
items.stones.stoneofdeepsleep.desc=Όταν αυτή η πέτρα πετιέται σε έναν εχθρό, θα τον βάλει σε έναν βαθύ μαγικό ύπνο. Οι μαγικά κοιμισμένοι εχθροί θα κοιμούνται για πάντα μέχρι να ενοχληθούν.
items.stones.stoneofdeepsleep.name=πέτρα του βαθύ ύπνου
items.stones.stoneofdetectmagic.desc=Αυτή η ρουνική πέτρα είναι σε θέση να ανιχνεύσει μαγεία που επηρεάζει ένα αντικείμενο. Η χρήση αυτής της πέτρας σε ένα άγνωστο αντικείμενο θα σας πει εάν επηρεάζεται από μια κακόβουλη κατάρα και εάν επηρεάζεται από θετική μαγεία, όπως μια γοητεία ή αναβαθμίσεις.
items.stones.stoneofdetectmagic.detected_bad=Εντοπίζετε κακόβουλη μαγεία που επηρεάζει αυτό το αντικείμενο!
items.stones.stoneofdetectmagic.detected_both=Εντοπίζεις τόσο θετική όσο και κακόβουλη μαγεία που επηρεάζει αυτό το αντικείμενο!
items.stones.stoneofdetectmagic.detected_good=Εντοπίζετε θετική μαγεία που επηρεάζει αυτό το αντικείμενο!
items.stones.stoneofdetectmagic.detected_none=Δεν εντοπίζεις καμία μαγεία που να επηρεάζει αυτό το αντικείμενο.
items.stones.stoneofdetectmagic.inv_title=Εντοπισμός ενός αντικειμένου
items.stones.stoneofdetectmagic.name=πέτρα ανίχνευσης μαγείας
items.stones.stoneofdisarming.desc=Αυτή η ρουνική πέτρα περιέχει μαγεία που μπορεί να απενεργοποιήσει κακόβουλες παγίδες κρυμμένες σε όλο το μπουντρούμι. Θα αφοπλίσει έως και 9 παγίδες γύρω από την περιοχή στην οποία πετιέται.
items.stones.stoneofdisarming.name=πέτρα του αφοπλισμού
items.stones.stoneofenchantment.armor=Η πανοπλία σου λάμπει στο σκοτάδι!
items.stones.stoneofenchantment.desc=Αυτή η ρουνική πέτρα διαθέτει μαγική δύναμη. Σε αντίθεση με έναν πάπυρο αναβάθμισης, δεν θα αυξήσει την άμεση ισχύ ενός αντικειμένου, αλλά αντίθετα θα προσδώσει σε ένα όπλο ή πανοπλία μια μαγεία, δίνοντάς του μια νέα δύναμη.
items.stones.stoneofenchantment.inv_title=Μαγέψτε ένα αντικείμενο
items.stones.stoneofenchantment.name=πέτρα της μαγείας
items.stones.stoneofenchantment.weapon=Το όπλο σου λάμπει στο σκοτάδι!
items.stones.stoneoffear.desc=Όταν αυτή η πέτρα πετιέται πάνω σε έναν χαρακτήρα, θα τον κατακλύσει ο τρόμος και θα γυρίσει και θα τραπεί σε φυγή. Η επίθεση σε έναν χαρακτήρα που φεύγει θα μειώσει την επίδραση.
items.stones.stoneoffear.name=πέτρα του φόβου
items.stones.stoneofflock.desc=Αυτή η ρουνική πέτρα καλεί ένα μαγικό πρόβατο για μικρό χρονικό διάστημα γύρω από την τοποθεσία όπου ρίχνεται.
items.stones.stoneofflock.name=πέτρα του κοπαδιού
items.stones.stoneofintuition$wndguess.break=Η πέτρα της διαίσθησής σου θρυμματίζεται σε σκόνη...
items.stones.stoneofintuition$wndguess.correct=Σωστά. Ο τύπος του αντικειμένου έχει αναγνωριστεί!
items.stones.stoneofintuition$wndguess.incorrect=Η εικασία σου ήταν λανθασμένη.
items.stones.stoneofintuition$wndguess.text=Μάντεψε ποιος είναι ο τύπος του άγνωστου αντικειμένου. Αν μαντέψεις σωστά, ο τύπος θα αναγνωριστεί!
items.stones.stoneofintuition.break_info=Μπορείς να χρησιμοποιήσεις τις πέτρες της διαίσθησης δύο φορές πριν σπάσει η μία, _η επόμενη χρήση σου δεν θα καταναλώσει ούτε μια πέτρα_.
items.stones.stoneofintuition.break_warn=Έχετε χρησιμοποιήσει μια πέτρα της διαίσθησης στο παρελθόν, οπότε _η επόμενη χρήση σας θα καταναλώσει μια πέτρα_.
items.stones.stoneofintuition.desc=Αυτή η ρουνική πέτρα περιέχει μια πιο αδύναμη εκδοχή της μαγείας που βρίσκεται στους πάπυρους αναγνώρισης. Αντί να αναγνωρίζει άμεσα ένα αντικείμενο, θα λειτουργήσει με τη διαίσθησή σας, επιτρέποντάς σας να προσπαθήσετε να αναγνωρίσετε τον τύπο ενός φίλτρου, πάπυρου ή δαχτυλιδιού μαντεύοντας.
items.stones.stoneofintuition.inv_title=Επιλέξτε ένα στοιχείο
items.stones.stoneofintuition.name=πέτρα της διαίσθησης
items.stones.stoneofshock.desc=Αυτή η ρουνική πέτρα εξαπολύει μια έκρηξη ηλεκτρικής ενέργειας η οποία ακινητοποιεί για λίγο όλους τους κοντινούς στόχους και δίνει στο ραβδί που ρίχνει τη φόρτιση για κάθε χτύπημα στόχου.
items.stones.stoneofshock.name=πέτρα του σοκ
items.stylus.ac_inscribe=ΕΠΙΓΡΑΦΩ
items.stylus.cursed=Η μαγεία της γραφίδας δεν θα λειτουργήσει σε καταραμένη πανοπλία.
items.stylus.desc=Αυτή η μαγική γραφίδα είναι φτιαγμένη από κάποια σκούρα, πολύ σκληρή πέτρα. Χρησιμοποιώντας την μπορείτε να χαράξετε ένα μαγικό σύμβολο στην πανοπλία σας, αλλά δεν έχετε καμία εξουσία να επιλέξετε ποιο σύμβολο θα είναι, η γραφίδα θα το αποφασίσει για εσάς.
items.stylus.identify=Πρέπει πρώτα να προσδιορίσεις αν αυτή η πανοπλία είναι καταραμένη.
items.stylus.inscribed=Χάραξες την πανοπλία σου με τη γραφίδα.
items.stylus.name=απόκρυφη γραφίδα
items.stylus.prompt=Επιλέξτε μια πανοπλία
items.tengusmask.ac_wear=ΦΘΟΡΑ
items.tengusmask.desc=Αυτή η μάσκα έπεσε από το πρόσωπο του Τένγκου καθώς πέθαινε, μπορείς να νιώσεις μεγάλη μαγική δύναμη να πηγάζει από αυτήν. Ήταν η μάσκα η πηγή δύναμης του Τένγκου; \n\n Όταν φορεθεί, η τρομερή δύναμη της μάσκας θα μεταφερθεί σε εσένα, επιτρέποντάς σου να _επιλέξεις μια υποκλάση για τον ήρωά σου._\n\nΠοια υποκλάση θα επιλέξεις;
items.tengusmask.discover_hint=Μπορείτε να αποκτήσετε αυτό το αντικείμενο ως σταγόνα από ορισμένους εχθρούς.
items.tengusmask.name=Η μάσκα του Τένγκου
items.tengusmask.used=Η μάσκα διαλύεται καθώς η δύναμή της ρέει μέσα σου!
items.torch.ac_light=ΦΩΣ
items.torch.desc=Ένα βασικό στοιχείο για περιπέτειες, όταν ένα μπουντρούμι σκοτεινιάζει, ένας φακός μπορεί να σας καθοδηγήσει.
items.torch.name=δάδα
items.trinkets.chaoticcenser.desc=Μετά από λίγο χρόνο στο αλχημειακό δοχείο, αυτό το θυμιατήρι φαίνεται να παράγει καπνό από μόνο του! Αυτά τα αέρια συσσωρεύονται και θα εκτοξεύονται από το θυμιατήρι προς τους εχθρούς σε ημι-τυχαία χρονικά διαστήματα. Φαίνεται ικανό να παράγει κάθε είδους αέρια, αλλά θα λάβετε μια στιγμή προειδοποίησης λίγο πριν ενεργοποιηθεί το θυμιατήρι.
items.trinkets.chaoticcenser.name=χαοτικό θυμιατήρι
items.trinkets.chaoticcenser.spew=Το θυμιατήριό σου πρόκειται να ξεράσει: %s.
items.trinkets.chaoticcenser.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα δημιουργεί ένα επιβλαβές αέριο κοντά σε έναν εχθρό περίπου σε κάθε γύρο του _%d_. Τα αέρια θα εμφανίζονται μόνο όταν υπάρχουν εχθροί. Σε υψηλότερα επίπεδα, αυτά τα αέρια είναι πιο πιθανό να είναι εξωτικά και ισχυρά.
items.trinkets.chaoticcenser.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα δημιουργήσει ένα επιβλαβές αέριο κοντά σε έναν εχθρό περίπου σε κάθε γύρο του _%d_. Τα αέρια θα εμφανίζονται μόνο όταν υπάρχουν εχθροί. Σε υψηλότερα επίπεδα, αυτά τα αέρια είναι πιο πιθανό να είναι εξωτικά και ισχυρά.
items.trinkets.crackedspyglass.desc=Αυτό το φορητό τηλεσκόπιο θα αποτελούσε επίδειξη εξαιρετικής και ακριβούς κατασκευής, αν δεν υπήρχε η ρωγμή κατά μήκος του μπροστινού φακού του. Το τηλεσκόπιο φαίνεται να σας βοηθά αποκαλύπτοντας νέα αντικείμενα στο μπουντρούμι, αλλά λόγω του ελαττώματός του, τα αντικείμενα που αποκαλύπτονται είναι αρκετά δύσκολο να τα δείτε!
items.trinkets.crackedspyglass.name=ραγισμένο τηλεσκόπιο
items.trinkets.crackedspyglass.stats_desc=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι έχει την _%1$s%%_ ευκαιρία_ να δημιουργήσει ένα επιπλέον κρυφό αντικείμενο σε κάθε όροφο που δεν είναι αρχηγός.
items.trinkets.crackedspyglass.stats_desc_upgraded=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι έχει μια _100%%_ πιθανότητα_ να δημιουργήσει ένα επιπλέον κρυφό αντικείμενο σε κάθε όροφο που δεν είναι αρχηγός, και μια _%1$s%%_ πιθανότητα_ να δημιουργήσει ένα δεύτερο επιπλέον κρυφό αντικείμενο.
items.trinkets.crackedspyglass.typical_stats_desc=Συνήθως αυτό το μπιχλιμπίδι έχει την _%1$s%%_ ευκαιρία_ να δημιουργήσει ένα επιπλέον κρυφό αντικείμενο σε κάθε όροφο που δεν είναι αρχηγός.
items.trinkets.dimensionalsundial.desc=Αυτό το μικρό φορητό ηλιακό ρολόι καταφέρνει με κάποιο τρόπο να ρίχνει μια σκιά στα βάθη του μπουντρουμιού, ακόμα κι αν δεν το κρατάτε όρθιο. Ακόμα πιο παράξενο είναι ότι η θέση της σκιάς φαίνεται να μην έχει καμία σχέση με τον ήλιο σε αυτόν τον κόσμο. Όταν δεν ρίχνεται σκιά, το ηλιακό ρολόι φαίνεται να προσελκύει κίνδυνο.
items.trinkets.dimensionalsundial.name=διαστατικό ηλιακό ρολόι
items.trinkets.dimensionalsundial.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα μειώσει τον ρυθμό εμφάνισης των εχθρών κατά _%1$d%%_ κατά τη διάρκεια της ημέρας στην πραγματική ζωή (8 π.μ.-8 μ.μ.) και θα αυξήσει τον ρυθμό εμφάνισης των εχθρών κατά _%2$d%%_ τη νύχτα (8 μ.μ.-8 π.μ.).
items.trinkets.dimensionalsundial.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα μειώσει τον ρυθμό εμφάνισης των εχθρών κατά _%1$d%%_ κατά τη διάρκεια της ημέρας στην πραγματική ζωή (8 π.μ.-8 μ.μ.) και θα αυξήσει τον ρυθμό εμφάνισης των εχθρών κατά _%2$d%%_ τη νύχτα (8 μ.μ.-8 π.μ.).
items.trinkets.dimensionalsundial.warning=Το ηλιακό σου ρολόι δεν ρίχνει σκιά, νιώθεις άβολα.
items.trinkets.exoticcrystals.desc=Αυτοί οι μικροί ροζ κρύσταλλοι έχουν το ίδιο σχήμα με τους κρυστάλλους αλχημικής ενέργειας. Ενώ δεν μπορούν να χρησιμοποιηθούν άμεσα για ενέργεια, φαίνεται να επηρεάζουν με κάποιο τρόπο τα φίλτρα και τους πάπυρους που βρίσκεις.
items.trinkets.exoticcrystals.name=εξωτικοί κρύσταλλοι
items.trinkets.exoticcrystals.stats_desc=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι θα αντικαταστήσει τα _%s%%_ των φίλτρων ή των σταγόνων πάπυρων με τα εξωτικά τους ισοδύναμα. Αυτό δεν επηρεάζει τα φίλτρα δύναμης, τους πάπυρους αναβάθμισης ή τα αντικείμενα που δημιουργούνται για να βοηθήσουν στην επίλυση επικίνδυνων δωματίων.
items.trinkets.exoticcrystals.typical_stats_desc=Συνήθως, αυτό το εμβληματικό αντικείμενο θα αντικαταστήσει τα _%s%%_ φίλτρων ή τα scroll drops με τα εξωτικά τους ισοδύναμα. Αυτό δεν επηρεάζει τα φίλτρα δύναμης, τους πάπυρους αναβάθμισης ή τα αντικείμενα που δημιουργούνται για να βοηθήσουν στην επίλυση επικίνδυνων δωματίων.
items.trinkets.eyeofnewt.desc=Αυτό το χρυσό και μαύρο μάτι τρίτωνα είναι ένα συνηθισμένο συστατικό, που τώρα έχει εμπλουτιστεί σε ένα μπιχλιμπίδι. Το μάτι φαίνεται να μειώνει την όρασή σας με αντάλλαγμα να σας επιτρέπει να βλέπετε τα πράγματα με άλλους τρόπους.
items.trinkets.eyeofnewt.name=μάτι του τρίτωνα
items.trinkets.eyeofnewt.stats_desc=Στο τρέχον επίπεδό του, αυτό το στολίδι θα μειώσει το οπτικό σας πεδίο κατά _%1$s%%_, αλλά θα σας δώσει επίσης νοητική όραση για εχθρούς εντός πλακιδίων _%2$d_.
items.trinkets.eyeofnewt.typical_stats_desc=Συνήθως, αυτό το στολίδι θα μειώσει το εύρος όρασής σας κατά _%1$s%%_, αλλά θα σας δώσει επίσης νοητική όραση για εχθρούς εντός πλακιδίων _%2$d_.
items.trinkets.ferrettuft.desc=Μια τούφα από μεταξένια λευκή γούνα κουναβιού, που συγκρατείται από μια κορδέλα σε χρώμα λάιμ δεμένη σε σχήμα φιόγκου. Τα κουνάβια είναι γνωστά για την ευκινησία, την σκανταλιά και την έλλειψη ακεραιότητας. Μέρος αυτής της δύναμης φαίνεται να ακτινοβολεί από το στολίδι, ενισχύοντας την αποφυγή οτιδήποτε βρίσκεται κοντά.
items.trinkets.ferrettuft.name=τούφα νυφίτσας
items.trinkets.ferrettuft.stats_desc=Στο τρέχον επίπεδό του, αυτό το trinket θα αυξήσει την αποφυγή όλων των χαρακτήρων κατά _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Συνήθως, αυτό το trinket θα αυξήσει την αποφυγή όλων των χαρακτήρων κατά _%1$s%%_.
items.trinkets.mimictooth.desc=Αυτό το μεγάλο κοφτερό δόντι πρέπει να προέρχεται από κάποιον πολύ δυστυχισμένο μιμητή. Φαίνεται ότι επηρεάζει τους μιμητές του μπουντρουμιού, κάνοντάς τους πιο συχνούς και επικίνδυνους.
items.trinkets.mimictooth.name=μιμούνται τα δόντια
items.trinkets.mimictooth.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα κάνει όλα τα είδη μιμητών _%1$sx_ πιο συνηθισμένα και πολύ πιο δύσκολο να εντοπιστούν, αλλά θα αυξήσει επίσης την ποσότητα των λεηλασιών που ρίχνουν. Κάθε όροφος μπουντρουμιού θα έχει επίσης την ευκαιρία _%2$s%%_ να περιέχει ένα επιπλέον κρυφό μιμητή από έβενο.
items.trinkets.mimictooth.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα κάνει όλα τα είδη μιμητών _%1$sx_ πιο συνηθισμένα και πολύ πιο δύσκολο να εντοπιστούν, αλλά θα αυξήσει επίσης την ποσότητα των λεηλασιών που ρίχνουν. Κάθε όροφος μπουντρουμιού θα έχει επίσης την ευκαιρία _%2$s%%_ να περιέχει ένα επιπλέον κρυφό μιμητή από έβενο.
items.trinkets.mossyclump.desc=Αυτή η συστάδα από βρεγμένα βρύα φαίνεται να κρατάει την υγρασία της όσο δυνατά κι αν την πιέζεις. Φαίνεται να είναι μαγικά δεμένη με το ίδιο το μπουντρούμι, κάνοντας πιο πιθανό να εμφανιστεί γρασίδι και νερό.
items.trinkets.mossyclump.name=βρυώδης συστάδα
items.trinkets.mossyclump.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα γεμίσει _%d%%_ δάπεδα χωρίς θέμα είτε με νερό είτε με γρασίδι.\n\nΑυτό το κόσμημα κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.trinkets.mossyclump.typical_stats_desc=Συνήθως, αυτό το στολίδι θα γεμίσει _%d%%_ δάπεδα χωρίς θέμα είτε με νερό είτε με γρασίδι.\n\nΑυτό το στολίδι κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.trinkets.parchmentscrap.desc=Αυτό το μικρό κομμάτι περγαμηνής μοιάζει σαν να προέρχεται από πάπυρο. Έχει διατηρήσει μέρος της μαγείας του και φαίνεται να επηρεάζει όπλα και πανοπλίες που βρίσκονται στο μπουντρούμι.
items.trinkets.parchmentscrap.name=αποκόμματα περγαμηνής
items.trinkets.parchmentscrap.stats_desc=Στο τρέχον επίπεδό του, αυτό το στολίδι θα κάνει τα ξόρκια και τα σύμβολα _%dx_ ως συνηθισμένα, και τις κατάρες σε όπλα και πανοπλίες _%sx_ ως συνηθισμένες. Οι κατάρες σε ραβδιά, δαχτυλίδια ή αντικείμενα δεν επηρεάζονται.\n\nΑυτό το στολίδι κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.trinkets.parchmentscrap.typical_stats_desc=Συνήθως, αυτό το στολίδι θα κάνει τα ξόρκια και τα σύμβολα _%dx_ ως συνηθισμένα, και τις κατάρες σε όπλα και πανοπλίες _%sx_ ως συνηθισμένα. Οι κατάρες σε ραβδιά, δαχτυλίδια ή αντικείμενα δεν επηρεάζονται.\n\nΑυτό το στολίδι κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.trinkets.petrifiedseed.desc=Αυτός ο σπόρος έχει απολιθωθεί, είτε μέσω αργών γεωλογικών διεργασιών είτε μέσω μαγείας. Ο σπόρος φαίνεται να επηρεάζει μαγικά τη χλωρίδα του μπουντρουμιού, αντικαθιστώντας περιστασιακά τους σπόρους φυτών με ρουνικούς λίθους.
items.trinkets.petrifiedseed.name=απολιθωμένος σπόρος
items.trinkets.petrifiedseed.stats_desc=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι θα κάνει το ποδοπατημένο γρασίδι να ρίχνει ρουνικές πέτρες αντί για σπόρους _%1$s%%_ της εποχής, και επίσης θα κάνει το ψηλό γρασίδι να ρίχνει αντικείμενα _%2$s%%_ πιο συχνά.
items.trinkets.petrifiedseed.typical_stats_desc=Συνήθως, αυτό το μπιχλιμπίδι θα κάνει το ποδοπατημένο γρασίδι να ρίχνει ρουνικές πέτρες αντί για σπόρους _%1$s%%_ του χρόνου, και επίσης θα κάνει το ψηλό γρασίδι να ρίχνει αντικείμενα _%2$s%%_ πιο συχνά.
items.trinkets.ratskull.desc=Αυτό το μακάβριο μπιχλιμπίδι δεν είναι πολύ μεγαλύτερο από το κρανίο ενός κανονικού αρουραίου, κάτι που είναι κάπως σπάνιο σε αυτό το μπουντρούμι. Η μαγική επιρροή του κρανίου φαίνεται να προσελκύει τους πιο σπάνιους κατοίκους του μπουντρούμι, κάνοντάς τους να εμφανίζονται πολύ πιο συχνά.
items.trinkets.ratskull.name=κρανίο αρουραίου
items.trinkets.ratskull.stats_desc=Στο τρέχον επίπεδό του, αυτό το στολίδι θα κάνει τους σπάνιους εξωτικούς εχθρούς _%dx_ να εμφανιστούν όσο το δυνατόν λιγότερο. Ωστόσο, το κρανίο είναι μόνο κατά το ήμισυ λιγότερο αποτελεσματικό στην προσέλκυση κρυστάλλινων μιμητών και θωρακισμένων αγαλμάτων.
items.trinkets.ratskull.typical_stats_desc=Συνήθως, αυτό το στολίδι θα κάνει τους σπάνιους εξωτικούς εχθρούς _%dx_ να εμφανιστούν όσο το δυνατόν πιο εύκολα. Ωστόσο, το κρανίο είναι μόνο κατά το ήμισυ λιγότερο αποτελεσματικό στην προσέλκυση κρυστάλλινων μιμητών και θωρακισμένων αγαλμάτων.
items.trinkets.saltcube.desc=Αυτός ο μεγάλος κρύσταλλος αλατιού κόπηκε σε σχεδόν τέλειο σχήμα κύβου και με κάποιο τρόπο κατάφερε να στραγγίξει το μισό νερό από το δοχείο αλχημείας αντί να διαλυθεί. Φαίνεται να αφυδατώνει και να συντηρεί μαγικά την τροφή που τρώτε, παρατείνοντας τον κορεσμό που νιώθετε, αλλά και μειώνοντας την αποκατάσταση της υγείας σας όταν δεν πεινάτε.
items.trinkets.saltcube.name=κύβος αλατιού
items.trinkets.saltcube.stats_desc=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι θα αυξήσει τον χρόνο που θα χρειαστεί μέχρι να πεινάσετε κατά _%1$s%%_, αλλά θα μειώσει επίσης τον ρυθμό αναγέννησης της υγείας σας κατά _%2$s%%_, εκτός εάν το πάτωμα είναι κλειδωμένο.
items.trinkets.saltcube.typical_stats_desc=Συνήθως, αυτό το μπιχλιμπίδι θα αυξήσει τον χρόνο που θα χρειαστεί μέχρι να πεινάσετε κατά _%1$s%%_, αλλά θα μειώσει επίσης τον ρυθμό αναγέννησης της υγείας σας κατά _%2$s%%_, εκτός εάν το πάτωμα είναι κλειδωμένο.
items.trinkets.shardofoblivion$thrownusetracker.desc=Πρόσφατα χρησιμοποίησες ένα άγνωστο όπλο που είχε πεταχτεί, το οποίο μετράει ως ένα κομμάτι χρησιμοποιημένου άγνωστου εξοπλισμού για το θραύσμα της λήθης για λίγο καιρό.\n\nΥπόλοιπο στροφών: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Χρησιμοποιήθηκε άγνωστο όπλο
items.trinkets.shardofoblivion$wandusetracker.desc=Πρόσφατα χρησιμοποίησες ένα άγνωστο ραβδί, το οποίο μετράει ως ένα κομμάτι χρησιμοποιημένου άγνωστου εξοπλισμού για το θραύσμα της λήθης για λίγο καιρό.\n\nΥπολειπόμενοι γύροι: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Χρησιμοποιήθηκε άγνωστη ράβδος
items.trinkets.shardofoblivion.ac_identify=ΑΝΑΓΝΩΡΙΖΩ
items.trinkets.shardofoblivion.desc=Αφού το μαγείρεψες στην κατσαρόλα της αλχημείας, αυτό το μικρό θραύσμα καταραμένου μετάλλου έχει αλλάξει και έχει φτιαχτεί από... τίποτα; Το φως φαίνεται να λυγίζει γύρω του και αιωρείται στη θέση του όταν δεν το κρατάς. Το θραύσμα φαίνεται να αντλεί μαγικά δύναμη από την άγνοιά σου, οπότε είναι ίσως καλύτερο να μην το σκέφτεσαι πολύ.
items.trinkets.shardofoblivion.identify=Αναγνωρίζετε το αντικείμενο!
items.trinkets.shardofoblivion.identify_not_yet=Αυτό το στοιχείο δεν είναι ακόμη έτοιμο για ταυτοποίηση.
items.trinkets.shardofoblivion.identify_prompt=Προσδιορίστε ένα στοιχείο
items.trinkets.shardofoblivion.identify_ready=Ένα αντικείμενο είναι έτοιμο για αναγνώριση: %s. Χρησιμοποιήστε το Θραύσμα της Λήθης που έχετε πάνω του για να το αναγνωρίσετε.
items.trinkets.shardofoblivion.identify_ready_worn=Τα φθαρμένα αντικείμενά σας είναι πλέον έτοιμα για αναγνώριση. Χρησιμοποιήστε το Θραύσμα της Λήθης σε αντικείμενα για να τα αναγνωρίσετε.
items.trinkets.shardofoblivion.name=θραύσμα της λήθης
items.trinkets.shardofoblivion.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα αυξήσει τον ρυθμό με τον οποίο οι εχθροί ρίχνουν λάφυρα κατά 20%% για κάθε κομμάτι άγνωστου εξοπλισμού που έχετε εξοπλίσει ή χρησιμοποιήσατε πρόσφατα, σε ένα μέγιστο _%d αντικείμενο(α)_. Το θραύσμα θα σας εμποδίσει επίσης να αναγνωρίσετε εξοπλισμό, αλλά μπορεί να χρησιμοποιηθεί για να αναγνωρίσετε χειροκίνητα αντικείμενα που είναι έτοιμα για αυτόν.
items.trinkets.shardofoblivion.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα αυξήσει τον ρυθμό με τον οποίο οι εχθροί ρίχνουν λάφυρα κατά 20%% για κάθε κομμάτι άγνωστου εξοπλισμού που έχετε εξοπλίσει ή χρησιμοποιήσατε πρόσφατα, σε ένα μέγιστο _%d αντικείμενο(α)_. Το θραύσμα θα σας εμποδίσει επίσης να αναγνωρίσετε εξοπλισμό, αλλά μπορεί να χρησιμοποιηθεί για να αναγνωρίσετε χειροκίνητα αντικείμενα που είναι έτοιμα για αυτόν.
items.trinkets.thirteenleafclover.desc=Κάπως, το βράσιμο στην κατσαρόλα της αλχημείας έκανε αυτό το τριφύλλι να βγάλει ένα σωρό επιπλέον φύλλα! Δεν είναι ξεκάθαρο αν αυτό το μπιχλιμπίδι είναι τυχερό ή άτυχο, ίσως αυτό το μπιχλιμπίδι να κάνει την τύχη σας πιο χαοτική;
items.trinkets.thirteenleafclover.name=τριφύλλι δεκατριών φύλλων
items.trinkets.thirteenleafclover.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα σας προκαλέσει τη μέγιστη ζημιά _%1$d%%_ της κάθε φορά και την ελάχιστη ζημιά _%2$d%%_ της κάθε φορά.
items.trinkets.thirteenleafclover.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα σας προκαλέσει τη μέγιστη ζημιά _%1$d%%_ της κάθε φορά και την ελάχιστη ζημιά _%2$d%%_ της κάθε φορά.
items.trinkets.trapmechanism.desc=Ο βασικός μηχανισμός μιας από τις παγίδες του μπουντρουμιού, σκαλισμένος προσεκτικά στο πάτωμα για να μπορεί να μεταφερθεί. Φαίνεται να είναι μαγικά συνδεδεμένος με το ίδιο το μπουντρούμι, καθιστώντας το επικίνδυνο έδαφος πιο συνηθισμένο, αλλά και αυξάνοντας την αγάπη σας προς αυτό.
items.trinkets.trapmechanism.name=μηχανισμός παγίδευσης
items.trinkets.trapmechanism.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα γεμίσει _%1$d%%_ από τα δάπεδα χωρίς θέμα είτε με παγίδες είτε με χάσματα. Επιπλέον, _%2$d%%_ από τις κρυφές παγίδες του μπουντρουμιού θα είναι ορατές.
items.trinkets.trapmechanism.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα κάνει _%1$d%%_ από τα άθελα δάπεδα να γεμίζουν είτε με παγίδες είτε με χάσματα. Επιπλέον, _%2$d%%_ από τις κρυφές παγίδες του μπουντρουμιού θα είναι ορατές.
items.trinkets.trinket$placeholder.name=μπιχλιμπίδι
items.trinkets.trinket.discover_hint=Αυτό το αντικείμενο έχει την πιθανότητα να είναι μια επιλογή κάθε φορά που φτιάχνετε ένα μπιχλιμπίδι μέσω αλχημείας.
items.trinkets.trinketcatalyst$randomtrinket.desc=Ένα κοντινό αντικείμενο είναι κολλημένο μέσα σε μια θήκη που δεν μπορείς να ανοίξεις. \n\nΗ αλχημεία θα διαλύσει τη θήκη, αλλά δεν θα ξέρεις τι μπιχλιμπίδι θα πάρεις μέχρι να το κάνεις!
items.trinkets.trinketcatalyst$randomtrinket.name=τυχαίο μπιχλιμπίδι
items.trinkets.trinketcatalyst.desc=Αυτή η μπάλα από μαγική χρυσή σκόνη λαμπυρίζει στο σκοτάδι του μπουντρουμιού. Αυτός ο καταλύτης μπορεί να χρησιμοποιηθεί σε ένα αλχημικό δοχείο με λίγη αλχημική ενέργεια για να παράγει ένα μοναδικό αντικείμενο-μπιχλιμπίδι.\n\nΤα μπιχλιμπίδια παρέχουν διάφορα εφέ που αλλάζουν ελαφρώς το μπουντρούμι ή τους κατοίκους του. Τα μπιχλιμπίδια μπορούν να αναβαθμιστούν με περισσότερη ενέργεια για να γίνει η επίδρασή τους πιο ισχυρή ή να πέσουν για να εξαλειφθεί εντελώς η επίδραση.
items.trinkets.trinketcatalyst.name=μαγικός καταλύτης
items.trinkets.trinketcatalyst.window_text=Το νερό αρχίζει να λάμπει καθώς προσθέτετε τον καταλύτη. Υπάρχουν μερικά κοντινά αντικείμενα που θα μπορούσατε να εμποτίσετε με ενέργεια για να τα μετατρέψετε σε ένα μαγικό στολίδι.
items.trinkets.trinketcatalyst.window_title=δημιουργήστε ένα μπιχλιμπίδι
items.trinkets.vialofblood.desc=Αυτό το λεπτό φιαλίδιο περιέχει το αίμα κάποιου κατοίκου του μπουντρουμιού και κινείται αργά καθώς το περιστρέφετε. Φαίνεται να ενισχύει μαγικά τα ισχυρότερα θεραπευτικά αποτελέσματα, αλλά και να τα καθυστερεί.
items.trinkets.vialofblood.name=φιαλίδιο αίματος
items.trinkets.vialofblood.stats_desc=Στο τρέχον επίπεδό του, αυτό το μπιχλιμπίδι θα αυξήσει τη συνολική υγεία που κερδίζετε πίνοντας φίλτρα θεραπείας, ασκούς νερού ή πηγάδια υγείας κατά _%1$s%%_. Ωστόσο, αυτά τα θεραπευτικά αποτελέσματα θα εμφανίζονται επίσης πιο αργά, αναγεννώντας μέγιστο _%2$s_ Ζωή ανά γύρο (αυτό αυξάνεται ανάλογα με το επίπεδο ήρωα).
items.trinkets.vialofblood.typical_stats_desc=Συνήθως, αυτό το μπιχλιμπίδι θα αυξήσει τη συνολική υγεία που αποκτάτε πίνοντας φίλτρα θεραπείας, ασκούς νερού ή πηγάδια υγείας κατά _%1$s%%_. Ωστόσο, αυτά τα θεραπευτικά αποτελέσματα θα εμφανίζονται επίσης πιο αργά, αναγεννώντας το μέγιστο _%2$s_ HP ανά γύρο (αυτό αυξάνεται ανάλογα με το επίπεδο ήρωα).
items.trinkets.wondrousresin.desc=Αυτή η λαμπερή μπλε ρητίνη φαίνεται να έχει την αποσταγμένη ουσία της μαγείας ενός καταραμένου ραβδιού. Η μαγεία από το αλχημειακό δοχείο φάνηκε να την έχει σταθεροποιήσει κάπως και τώρα επηρεάζει τα ραβδιά σας.
items.trinkets.wondrousresin.name=θαυμαστή ρητίνη
items.trinkets.wondrousresin.stats_desc=Στο τρέχον επίπεδό του, αυτό το κόσμημα θα αναγκάσει τα εφέ των καταραμένων ραβδιών να γίνουν ουδέτερα ή θετικά _%1$s%%_ της κάθε φορά, και θα κάνει τα μη καταραμένα ραβδιά να πυροδοτήσουν ένα επιπλέον ουδέτερο ή θετικό καταραμένο zap _%2$s%%_ της κάθε φορά.\n\nΑυτό το κόσμημα κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.trinkets.wondrousresin.typical_stats_desc=Συνήθως, αυτό το κόσμημα θα αναγκάσει τα εφέ του καταραμένου ραβδιού να γίνουν ουδέτερα ή θετικά _%1$s%%_ των περιπτώσεων, και θα προκαλέσει τα μη καταραμένα ραβδιά να πυροδοτήσουν ένα επιπλέον ουδέτερο ή θετικό καταραμένο zap _%2$s%%_ των περιπτώσεων.\n\nΑυτό το κόσμημα κοστίζει μεγαλύτερη ποσότητα ενέργειας για αναβάθμιση.
items.wands.cursedwand.disguise=Η εμφάνισή σου αλλάζει μπροστά στα μάτια σου!
items.wands.cursedwand.fire=Μυρίζεις κάψιμο...
items.wands.cursedwand.grass=Χόρτο ξεφυτρώνει γύρω σου!
items.wands.cursedwand.gravity=Η βαρύτητα ξαφνικά αρχίζει να τραβάει προς τυχαίες κατευθύνσεις!
items.wands.cursedwand.gravity_end=Το χάος της βαρύτητας τελειώνει.
items.wands.cursedwand.gravity_positive=Η βαρύτητα αρχίζει ξαφνικά να έλκει τυχαίες κατευθύνσεις, αλλά αυτό δεν φαίνεται να σε επηρεάζει.
items.wands.cursedwand.mass_invuln=Λαμπερό φως ξεπηδά από το ραβδί σου!
items.wands.cursedwand.nothing=Δεν συμβαίνει τίποτα.
items.wands.cursedwand.ondeath=Σε σκότωσε ο ίδιος σου ο %s.
items.wands.cursedwand.petrify=Ξαφνικά παγώνεις στη θέση σου!
items.wands.cursedwand.sinkhole=Το έδαφος αρχίζει να υποχωρεί γύρω σου!
items.wands.cursedwand.sinkhole_positive=Το έδαφος αρχίζει να υποχωρεί, αλλά από κάτω σου φαίνεται αρκετά στέρεο.
items.wands.cursedwand.supernova=Μια φλεγόμενη μπάλα ενέργειας αρχίζει να αναπτύσσεται. Ίσως θελήσετε να τρέξετε!
items.wands.cursedwand.supernova_positive=Μια φλεγόμενη μπάλα ενέργειας αρχίζει να αναπτύσσεται, αλλά με κάποιο τρόπο νιώθεις ασφαλής.
items.wands.cursedwand.transmogrify_other=Το αντικείμενό σας μεταμορφώνεται σε κάτι διαφορετικό!
items.wands.cursedwand.transmogrify_wand=Το ραβδί σου μεταμορφώνεται σε διαφορετικό αντικείμενο!
items.wands.damagewand.upgrade_stat_name_1=Μαγική Ζημιά
items.wands.wand$placeholder.name=ράβδος
items.wands.wand.ac_zap=ΖΑΠ
items.wands.wand.curse_discover=Αυτό το %s είναι καταραμένο!
items.wands.wand.cursed=Αυτό το ραβδί είναι καταραμένο, κάνοντας τη μαγεία του χαοτική και τυχαία.
items.wands.wand.fizzles=Το ραβδί σου σβήνει. Πρέπει να μην έχει αρκετή φόρτιση.
items.wands.wand.identify=Τώρα είστε αρκετά εξοικειωμένοι με το ραβδί σας για να το αναγνωρίσετε.
items.wands.wand.no_magic=Το ραβδί σου σβήνει. Δεν μπορείς να χρησιμοποιήσεις ραβδιά όσο είσαι άτρωτος στη μαγεία.
items.wands.wand.not_cursed=Αυτό το ραβδί είναι απαλλαγμένο από κακόβουλη μαγεία.
items.wands.wand.prompt=Επιλέξτε μια τοποθεσία για να κάνετε ζάπινγκ
items.wands.wand.resin_many=Αυτό το ραβδί έχει αποκτήσει _επίπεδα %d_ από ρητίνη arcane.
items.wands.wand.resin_one=Αυτό το ραβδί έχει αποκτήσει _1 επίπεδο_ από την ρητίνη Arcane.
items.wands.wand.self_target=Δεν μπορείς να στοχεύσεις τον εαυτό σου!
items.wands.wandofblastwave.bmage_desc=Όταν ο _Μάγος Μάχης_ χτυπήσει έναν παράλυτο εχθρό με ένα ραβδί ωστικού κύματος, θα καταναλώσει την παράλυση για να προκαλέσει μια έκρηξη μπόνους μαγικής ζημιάς. Αυτό έχει σύντομο χρόνο αναμονής ανά εχθρό.
items.wands.wandofblastwave.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα είδος μαρμάρινης πέτρας, με χρυσή επένδυση και ένα στρογγυλό μαύρο πετράδι στην άκρη. Είναι πολύ βαρύ στο χέρι σας.
items.wands.wandofblastwave.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί κύματος έκρηξης προκαλεί 67% ζημιά και εξοντώνει όλους τους εχθρούς εκτός της περιοχής έκρηξης.
items.wands.wandofblastwave.knockback_ondeath=Η σύγκρουση σε σκότωσε...
items.wands.wandofblastwave.name=ραβδί κύματος έκρηξης
items.wands.wandofblastwave.ondeath=Αυτοκτόνησες με το δικό σου Ραβδί από Εκρηκτικό Κύμα...
items.wands.wandofblastwave.staff_name=προσωπικό του ωστικού κύματος
items.wands.wandofblastwave.stats_desc=Αυτό το ραβδί εκτοξεύει μια βλήτη που εκρήγνυται βίαια σε μια στοχευμένη τοποθεσία. Η δύναμη αυτής της έκρηξης προκαλεί _%1$d-%2$d ζημιά_ και είναι αρκετά ισχυρή για να πετάξει τους περισσότερους εχθρούς.
items.wands.wandofblastwave.typical_stats_desc=Αυτό το ραβδί εκτοξεύει μια βλήτη που εκρήγνυται βίαια σε μια στοχευμένη τοποθεσία. Η δύναμη αυτής της έκρηξης συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι αρκετά ισχυρή για να πετάξει τους περισσότερους εχθρούς.
items.wands.wandofblastwave.upgrade_stat_name_2=Νοκ Μπακ
items.wands.wandofcorrosion.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα διαβρωτικό ραβδί, ο εχθρός έχει την πιθανότητα να γίνει μούσκεμα.
items.wands.wandofcorrosion.desc=Αυτό το ραβδί έχει ένα σταχτί σώμα που ανοίγει σε ένα λαμπρό πορτοκαλί πετράδι.
items.wands.wandofcorrosion.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί διάβρωσης προκαλεί στους εχθρούς 4 φορές διάβρωση, ξεκινώντας από 6 ζημιά.
items.wands.wandofcorrosion.name=ραβδί διάβρωσης
items.wands.wandofcorrosion.staff_name=προσωπικό διάβρωσης
items.wands.wandofcorrosion.stats_desc=Αυτό το ραβδί εκτοξεύει μια βόμβα που εκρήγνυται σε ένα νέφος εξαιρετικά διαβρωτικού αερίου σε μια στοχευμένη τοποθεσία. Οτιδήποτε παγιδευτεί μέσα σε αυτό το νέφος θα υποστεί αυξανόμενη ζημιά με την πάροδο του χρόνου, ξεκινώντας από _%d ζημιά._
items.wands.wandofcorrosion.upgrade_stat_name_1=Ζημιές από διάβρωση
items.wands.wandofcorrosion.upgrade_stat_name_2=Όγκος αερίου
items.wands.wandofcorruption.already_corrupted=Αυτός ο χαρακτήρας δεν μπορεί να επηρεαστεί περαιτέρω.
items.wands.wandofcorruption.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί διαφθοράς, ο εχθρός έχει την ευκαιρία να καεί.
items.wands.wandofcorruption.desc=Αυτό το ραβδί ακτινοβολεί χαοτική σκοτεινή ενέργεια, αν αυτό δεν ήταν ήδη εμφανές από το μικρό διακοσμητικό κρανίο που έχει σχήμα στην άκρη του.
items.wands.wandofcorruption.eleblast_desc=Μια στοιχειώδης έκρηξη με ένα ραβδί διαφθοράς προκαλεί στους εχθρούς 5 στροφές αμόκ.
items.wands.wandofcorruption.name=ραβδί της διαφθοράς
items.wands.wandofcorruption.staff_name=προσωπικό της διαφθοράς
items.wands.wandofcorruption.stats_desc=Αυτό το ραβδί θα απελευθερώσει μια έκρηξη διαφθείρουσας ενέργειας που θα αποδυναμώσει τους εχθρούς και τελικά θα τους υποτάξει στη θέλησή σας. Οι εχθροί είναι σε θέση να αντισταθούν στη διαφθείρωση, αλλά οι αδύναμοι εχθροί είναι πολύ πιο εύκολο να διαφθείρονται από τους υγιείς.
items.wands.wandofcorruption.upgrade_stat_name_1=Διαφθείροντας την Εξουσία
items.wands.wandofcorruption.upgrade_stat_name_2=Διάρκεια αποδυνάμωσης
items.wands.wandofdisintegration.bmage_desc=Όταν χρησιμοποιείται από τον _Μάγο της Μάχης_, ένα ραβδί αποσύνθεσης έχει αυξημένη εμβέλεια επίθεσης, σαν να είχε μια προεξέχουσα μαγεία.
items.wands.wandofdisintegration.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα συμπαγές, λείο κομμάτι οψιδιανού, με ένα βαθύ μωβ φως να διατρέχει την πλευρά του, καταλήγοντας στην άκρη. Λάμπει με καταστροφική ενέργεια, περιμένοντας να εκτοξευθεί προς τα εμπρός.
items.wands.wandofdisintegration.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί αποσύνθεσης προκαλεί 100% ζημιά και διαπερνά τοίχους.
items.wands.wandofdisintegration.name=ραβδί της αποσύνθεσης
items.wands.wandofdisintegration.staff_name=προσωπικό της αποσύνθεσης
items.wands.wandofdisintegration.stats_desc=Αυτό το ραβδί εκτοξεύει μια ακτίνα που διαπερνά οποιοδήποτε εμπόδιο και θα πηγαίνει πιο μακριά όσο περισσότερο αναβαθμίζεται. Η ακτίνα προκαλεί _%1$d-%2$d ζημιά_ και θα προκαλεί επίσης επιπλέον ζημιά για κάθε εχθρό και τοίχο που διαπερνά.
items.wands.wandofdisintegration.upgrade_stat_name_2=Μέγιστο εύρος
items.wands.wandoffireblast.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί πύρινης έκρηξης, υπάρχει πιθανότητα να προκαλέσει μια έκρηξη που θα προκαλέσει ζημιά στους εχθρούς και θα καταναλώσει όλη τη φωτιά που βρίσκεται κοντά! Αυτή η πιθανότητα αυξάνεται όσο περισσότερη φωτιά βρίσκεται δίπλα στον εχθρό.
items.wands.wandoffireblast.desc=Αυτό το ραβδί είναι κατασκευασμένο από ξύλο με κόκκινο βερνίκι και φύλλα χρυσού χρησιμοποιούνται άφθονα για να το κάνουν να φαίνεται αρκετά βασιλικό. Τρίζει και σφυρίζει στην άκρη, πρόθυμο να απελευθερώσει την ισχυρή μαγεία του.
items.wands.wandoffireblast.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί πύρινης έκρηξης προκαλεί 100% ζημιά, ανοίγει διάρρηκτα πόρτες και βάζει φωτιά σε εχθρούς και έδαφος.
items.wands.wandoffireblast.name=ραβδί πύρινης έκρηξης
items.wands.wandoffireblast.staff_name=προσωπικό της πυρόσβεσης
items.wands.wandoffireblast.stats_desc=Αυτό το ραβδί εκτοξεύει έναν κώνο φωτιάς όταν χρησιμοποιείται. Η επόμενη επίθεσή του θα καταναλώσει _%1$d φορτίσεις_ και θα προκαλέσει _%2$d-%3$d ζημιά._ Όσο περισσότερες φορτίσεις χρησιμοποιεί το ραβδί, τόσο μεγαλύτερο και ισχυρότερο είναι το αποτέλεσμα.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Ζημιά Φόρτισης
items.wands.wandoffireblast.upgrade_stat_name_2=2 Ζημιά Φόρτισης
items.wands.wandoffireblast.upgrade_stat_name_3=3 Ζημιά Φόρτισης
items.wands.wandoffrost.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν παγωμένο εχθρό με ένα ραβδί παγετού, έχει την ευκαιρία να παγώσει αμέσως. Αυτή η πιθανότητα μεγαλώνει όσο πιο παγωμένοι είναι.
items.wands.wandoffrost.desc=Αυτό το ραβδί φαίνεται να είναι φτιαγμένο από κάποιο είδος μαγικού πάγου. Γίνεται πιο φωτεινό προς την στρογγυλεμένη άκρη του. Είναι πολύ κρύο όταν το κρατάς, αλλά με κάποιο τρόπο το χέρι σου παραμένει ζεστό.
items.wands.wandoffrost.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί παγετού προκαλεί 100% ζημιά, παγώνει τους εχθρούς και σβήνει φωτιές.
items.wands.wandoffrost.name=ραβδί παγετού
items.wands.wandoffrost.staff_name=προσωπικό του παγετού
items.wands.wandoffrost.stats_desc=Αυτό το ραβδί εκτοξεύει εκρήξεις παγωμένης ενέργειας προς τους εχθρούς σας, προκαλώντας _%1$d-%2$d ζημιά_ και κρυώνοντας. Η επίδραση φαίνεται ισχυρότερη στο νερό. Οι εχθροί που είναι ήδη κρυωμένοι ή κατεψυγμένοι δέχονται λιγότερη ζημιά από αυτό το ραβδί.
items.wands.wandoffrost.upgrade_stat_name_2=Διάρκεια Ψύξης
items.wands.wandoflightning$lightningcharge.desc=Ο Μάγος της Μάχης είναι αυτήν τη στιγμή φορτισμένος με ενέργεια, γεγονός που του παρέχει ανοσία στο επιτελείο του από τους κεραυνούς και αυξάνει την εμβέλεια που μπορεί να εκπέμψει ο κεραυνός από αυτόν. \n\nΥπόλοιπες Στροφές: %s.
items.wands.wandoflightning$lightningcharge.name=Ηλεκτρικά φορτισμένο
items.wands.wandoflightning.bmage_desc=Όταν _ο Μάχος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί κεραυνού, έχει την ευκαιρία να φορτιστεί ηλεκτρικά για 10 γύρους. Ενώ είναι φορτισμένος, ο Μάχος της Μάχης είναι άτρωτος σε ζημιά από κεραυνούς και θα εκπέμπει περαιτέρω κεραυνούς.
items.wands.wandoflightning.desc=Αυτό το ραβδί είναι κατασκευασμένο από συμπαγές μέταλλο, γεγονός που το καθιστά εκπληκτικά βαρύ. Δύο αιχμές καμπυλώνουν στην άκρη και μεταξύ τους σχηματίζεται ηλεκτρικό τόξο.
items.wands.wandoflightning.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί κεραυνού προκαλεί 100% ζημιά, ακινητοποιεί τους εχθρούς για 5 γύρους και ηλεκτρίζει το νερό.
items.wands.wandoflightning.name=ραβδί αστραπής
items.wands.wandoflightning.ondeath=Αυτοκτόνησες με το δικό σου Ραβδί από Κεραυνό...
items.wands.wandoflightning.staff_name=ράβδος κεραυνού
items.wands.wandoflightning.stats_desc=Αυτό το ραβδί στέλνει ισχυρό τόξο κεραυνού μέσα από οτιδήποτε πυροβολείται, προκαλώντας _%1$d-%2$d ζημιά._ Αυτός ο ηλεκτρισμός θα σχηματίζει τόξο προς τους κοντινούς χαρακτήρες και εξαπλώνεται πιο εύκολα στο νερό. Τα τόξα από αυτό το ραβδί μπορούν να σας προκαλέσουν ζημιά, αλλά δεν θα βλάψουν τους συμμάχους σας.
items.wands.wandoflivingearth$earthguardian.desc=Οι πέτρες από το ραβδί σου από ζωντανή γη έχουν σχηματίσει έναν προστατευτικό χωμάτινο φύλακα! Αυτός ο βραχώδης προστάτης θα επιτεθεί σε κοντινούς εχθρούς, κάτι που θα τους αναγκάσει να επιτεθούν στον φύλακα αντί για εσένα. Όταν όλες οι κοντινές απειλές εξαφανιστούν, ο φύλακας θα ξανασχηματιστεί γύρω σου και θα επιστρέψει την επόμενη φορά που θα χρησιμοποιήσεις το ραβδί σου.
items.wands.wandoflivingearth$earthguardian.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με ένα συγκεκριμένο ραβδί.
items.wands.wandoflivingearth$earthguardian.name=χωμάτινος φύλακας
items.wands.wandoflivingearth$earthguardian.wand_info=Η αμυντική δύναμη του φύλακα συνδέεται με το επίπεδο του ραβδιού σας. Προς το παρόν μπλοκάρει τη ζημιά _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Μαγικές πέτρες περιβάλλουν το σώμα σας. Όταν δέχεστε επίθεση, θα προσπαθήσουν να σας μπλοκάρουν και θα μειώσουν τη ζημιά που δέχεστε κατά 50%%. Ωστόσο, κάθε ζημιά που μπλοκάρεται ξύνει μέρος της πέτρας.\n\nΥπόλοιπη πανοπλία: %1$d.\n\nΕάν χτίσετε αρκετή πέτρα γύρω σας, το επόμενο χτύπημα από το ραβδί σας από ζωντανή γη θα κάνει τις πέτρες να σχηματίσουν έναν φύλακα που θα πολεμήσει μαζί σας.\n\nΠανοπλία που απαιτείται για τον Φύλακα: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Αυτός ο χωμάτινος φύλακας επωφελείται επίσης από τη Δύναμη των Πολλών. Υπόλοιποι Γύροι: %d.
items.wands.wandoflivingearth$rockarmor.name=πανοπλία βράχου
items.wands.wandoflivingearth.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί από ζωντανή γη, μέρος της ζημιάς που προκαλείται επιστρέφεται ως πανοπλία από βράχο.
items.wands.wandoflivingearth.desc=Αυτό το ραβδί είναι φτιαγμένο από έναν περίεργο βράχο, με ζώνες λαμπερής κίτρινης ενέργειας. Οι βράχοι φαίνεται να μετακινούνται ελαφρώς καθώς πιάνετε το ραβδί, σαν να μπορούν να νιώσουν το χέρι σας.
items.wands.wandoflivingearth.eleblast_desc=Μια έκρηξη στοιχείων με ένα ραβδί ζωντανής γης προκαλεί 50% ζημιά και θεραπεύει έναν ενεργό χωμάτινο φύλακα για κάθε εχθρικό χτύπημα.
items.wands.wandoflivingearth.name=ραβδί ζωντανής γης
items.wands.wandoflivingearth.staff_name=προσωπικό της ζωντανής γης
items.wands.wandoflivingearth.stats_desc=Αυτό το ραβδί στέλνει βολές μαγικής πέτρας στους εχθρούς, προκαλώντας _%1$d-%2$d ζημιά._ Οι πέτρες θα ανασχηματιστούν γύρω από τον χρήστη, παρέχοντάς του πανοπλία ανάλογη με τη ζημιά που προκαλείται. Εάν κατασκευαστεί αρκετή πανοπλία, θα σχηματιστεί σε έναν φύλακα βράχου την επόμενη φορά που θα χτυπηθεί το ραβδί.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Αποκλεισμός Φύλακα
items.wands.wandofmagicmissile$magiccharge.desc=Το ραβδί με το μαγικό σου βλήμα έχει τροφοδοτήσει ξανά με ισχύ τα ραβδιά σου, ενισχύοντας το αποτελεσματικό επίπεδο του επόμενου πλήγματος που θα κάνουν.\n\nΤα ραβδιά σου ενισχύονται σε: +%d.\n\nΥπόλοιπο μαγικού φορτίου: %s.
items.wands.wandofmagicmissile$magiccharge.name=μαγικό φορτίο
items.wands.wandofmagicmissile.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί μαγικού βλήματος, όλα τα ραβδιά του θα αποκτήσουν φορτίο εκτός από το ραβδί του.
items.wands.wandofmagicmissile.desc=Αυτό το αρκετά απλό ραβδί εκτοξεύει πυραύλους καθαρής μαγικής ενέργειας. Ενώ το ίδιο το ραβδί δεν έχει ειδικά εφέ, έχει περισσότερες διαθέσιμες φορτίσεις και μπορεί να ενδυναμώσει για λίγο άλλα ραβδιά όταν αναβαθμιστεί.
items.wands.wandofmagicmissile.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.wands.wandofmagicmissile.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί μαγικού πυραύλου προκαλεί 50% ζημιά και δίνει στον μάγο 15 γύρους επαναφόρτισης.
items.wands.wandofmagicmissile.name=μαγικό ραβδί πυραύλου
items.wands.wandofmagicmissile.staff_name=ραβδί μαγικού πυραύλου
items.wands.wandofmagicmissile.stats_desc=Κάθε βίδα από αυτό το ραβδί προκαλεί _%1$d-%2$d ζημιά_ και θα ενδυναμώσει για λίγο άλλα ραβδιά αν αναβαθμιστεί.
items.wands.wandofprismaticlight.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα πρισματικό φως, θα παραμείνει ανάπηρος για μια διάρκεια που αυξάνεται ανάλογα με το επίπεδο του μπαστουνιού.
items.wands.wandofprismaticlight.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα συμπαγές κομμάτι ημιδιαφανούς κρυστάλλου, σαν ένα μακρύ κομμάτι λείου γυαλιού. Μικρά κομμάτια πολύχρωμου φωτός χορεύουν γύρω από την άκρη του ραβδιού, πρόθυμα να εκραγούν.
items.wands.wandofprismaticlight.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί πρισματικού φωτός προκαλεί 67% ζημιά, αποκαλύπτει όλο το έδαφος στην έκρηξη και τυφλώνει τους εχθρούς για 5 γύρους.
items.wands.wandofprismaticlight.name=ραβδί πρισματικού φωτός
items.wands.wandofprismaticlight.staff_name=ράβδος πρισματικού φωτός
items.wands.wandofprismaticlight.stats_desc=Αυτό το ραβδί εκτοξεύει ακτίνες φωτός που διαπερνούν το σκοτάδι του μπουντρουμιού, αποκαλύπτοντας κρυφές περιοχές και παγίδες. Η δέσμη μπορεί να τυφλώσει τους εχθρούς και προκαλεί _%1$d-%2$d ζημιά._ Οι δαιμονικοί και οι νεκρόψυχοι εχθροί θα καίγονται στο έντονο φως του ραβδιού, δεχόμενοι επιπλέον ζημιά.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Τυφλή Πιθανότητα
items.wands.wandofprismaticlight.upgrade_stat_name_3=Διάρκεια φωτός
items.wands.wandofregrowth$dewcatcher.desc=Οι δροσοπιγκοί είναι θαυματουργά φυτά που γεμίζουν τον εαυτό τους με μαγική δροσιά. Προσπαθούν να καμουφλαριστούν ως γρασίδι για να αποφύγουν την προσοχή, αλλά οι διογκώσεις της συσσωρευμένης δροσιάς τους τα προδίδουν.
items.wands.wandofregrowth$dewcatcher.discover_hint=Μπορείτε να βρείτε αυτό το φυτό με ένα συγκεκριμένο ραβδί.
items.wands.wandofregrowth$dewcatcher.name=Δροσοπαγίδα
items.wands.wandofregrowth$lotus.desc=Ο χρυσός λωτός είναι ένα μυστικιστικό φυτό που μπορεί να επικαλεστεί μόνο ένα ισχυρό ραβδί αναγέννησης. Η αύρα του ενισχύει όλα τα φυτά και τις φυτικές επιδράσεις, αλλά καίει όλη την ενέργειά του και πεθαίνει μετά από σύντομο χρονικό διάστημα.
items.wands.wandofregrowth$lotus.discover_hint=Μπορείτε να βρείτε αυτό το φυτό με ένα συγκεκριμένο ραβδί, αφού το αναβαθμίσετε αρκετές φορές.
items.wands.wandofregrowth$lotus.name=Χρυσός Λωτός
items.wands.wandofregrowth$lotus.wand_info=Αυτός ο λωτός δημιουργήθηκε από ένα _+%1$d_ ραβδί αναγέννησης. Όλα τα φυτά στην επίδρασή του θα _ενεργοποιηθούν αμέσως_ εάν φυτευτούν σε έναν χαρακτήρα. Τα φυτά θα έχουν επίσης _%2$d%% πιθανότητα_ να ρίξουν τον σπόρο τους, και τα βελάκια με την άκρη θα έχουν _%3$d%% λιγότερη ανθεκτικότητα_.
items.wands.wandofregrowth$seedpod.desc=Οι λοβοί σπόρων είναι μαγικά φυτά που παράγουν σπόρους από άλλα είδη φυτών, αντί για δικούς τους σπόρους. Κατάφεραν με κάποιο τρόπο να εξαπλωθούν παρόλο που δεν είχαν δικούς τους σπόρους.
items.wands.wandofregrowth$seedpod.discover_hint=Μπορείτε να βρείτε αυτό το φυτό με ένα συγκεκριμένο ραβδί.
items.wands.wandofregrowth$seedpod.name=Κέλυφος σπόρων
items.wands.wandofregrowth.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί από αναγέννηση, και οι δύο στέκονται στο γρασίδι, θα λάβει φυτική θεραπεία ανάλογα με τη ζημιά που προκαλείται.
items.wands.wandofregrowth.degradation=Μετά από άλλη μια φόρτιση του _%d_, αυτό το ραβδί θα αρχίσει να μην παράγει φυτά και φρέσκο γρασίδι. Αυτό το όριο αυξάνεται με την αναβάθμιση ή την αναβάθμιση του ραβδιού.
items.wands.wandofregrowth.desc=Αυτό το ραβδί είναι φτιαγμένο από ένα λεπτό στέλεχος από ξύλο, σκαλισμένο με μαεστρία. Κατά κάποιο τρόπο, είναι ακόμα ζωντανό και ζωηρό, φωτεινό πράσινο σαν την καρδιά ενός νεαρού δέντρου. «Όταν η ζωή σταματά, μια νέα ζωή αρχίζει πάντα να αναπτύσσεται... Ο αιώνιος κύκλος παραμένει πάντα!»
items.wands.wandofregrowth.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί από αναγέννηση ριζώνει τους εχθρούς και φυτρώνει γρασίδι τυχαία πάνω στην περιοχή των εκρήξεων.
items.wands.wandofregrowth.name=ραβδί αναγέννησης
items.wands.wandofregrowth.staff_name=προσωπικό αναγέννησης
items.wands.wandofregrowth.stats_desc=Όταν χρησιμοποιείται, αυτό το ραβδί θα εκτοξεύσει μαγική ενέργεια αναγέννησης προς τα έξω σε έναν κώνο, προκαλώντας τη ζωή σε γρασίδι, ρίζες και σπάνια φυτά. Το επόμενο χτύπημα θα καταναλώσει _%1$d φορτίσεις_. Όσο περισσότερες φορτίσεις χρησιμοποιεί το ραβδί, τόσο μεγαλύτερο και ισχυρότερο είναι το αποτέλεσμα.
items.wands.wandofregrowth.upgrade_stat_name_1=Χόρτο ανά φόρτιση
items.wands.wandofregrowth.upgrade_stat_name_2=Συνολικό Όριο Χόρτου
items.wands.wandoftransfusion.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν μαγεμένο εχθρό με ένα ραβδί μετάγγισης, θα αποκτήσει θωράκιση και το επόμενο χτύπημά του με το ραβδί δεν θα κοστίσει ζωή.
items.wands.wandoftransfusion.charged=Το ραβδί σου είναι φορτισμένο με την ζωτική ενέργεια του εχθρού σου!
items.wands.wandoftransfusion.desc=Ένα ραβδί με αρκετά απλό σχήμα, ξεχωρίζει λόγω της ματζέντα απόχρωσής του και του κατάμαυρου πολύτιμου λίθου στην άκρη.
items.wands.wandoftransfusion.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί μετάγγισης γοητεύει τους εχθρούς, θεραπεύει συμμάχους και προκαλεί 100% ζημιά στους νεκρό εχθρούς.
items.wands.wandoftransfusion.name=ραβδί μετάγγισης
items.wands.wandoftransfusion.ondeath=Αυτοκτόνησες με το ίδιο σου το Ραβδί Μετάγγισης...
items.wands.wandoftransfusion.staff_name=προσωπικό μετάγγισης
items.wands.wandoftransfusion.stats_desc=Όταν χρησιμοποιείται σε συμμάχους ή γοητευμένους εχθρούς, αυτό το ραβδί θα απορροφήσει _%1$d από την υγεία του χρήστη_ για να θεραπεύσει ή να προστατεύσει τον σύμμαχο για _%2$d ζωή._ Όταν χρησιμοποιείται σε εχθρούς, το ραβδί τους γοητεύει για λίγο ενώ εφαρμόζει _%3$d θωράκιση_ στον χρήστη. Οι εχθρικοί νεκροζώντανοι θα δεχτούν _%4$d-%5$d ζημιά_ αντί να γοητευτούν.
items.wands.wandoftransfusion.upgrade_stat_name_1=Θεραπεία με Σύμμαχο
items.wands.wandoftransfusion.upgrade_stat_name_2=Αυτοθωράκιση
items.wands.wandoftransfusion.upgrade_stat_name_3=Ζημιά από Απέθαντους
items.wands.wandofwarding$ward.desc_1=Αυτό το βασικό ward θα εξαπολύσει αυτόματα αεροπορικώς οποιονδήποτε εχθρό μπει στην εμβέλεια του, προκαλώντας _%1$d-%2$d ζημιά._\n\nΕάν εξαπολύσετε αεροπορικώς αεροπορικώς warding σε αυτό το ward με το ραβδί σας, θα το αναβαθμίσετε.\n\nΑυτό το ward θα εξαπολύσει αεροπορικώς warding μόνο μία φορά πριν διαλυθεί.\n\nΤο ραβδί σας χρησιμοποιεί _%3$d ενέργεια_ για να συντηρήσει αυτό το ward.
items.wands.wandofwarding$ward.desc_2=Αυτό το αναβαθμισμένο ward έχει ένα πιο περίπλοκο μοτίβο και μπορεί να επιτεθεί πολλές φορές. Κάθε χτύπημα από αυτό το ward θα προκαλέσει _%1$d-%2$d ζημιά._\n\nΤο χτύπημα σε αυτό το ward με το ραβδί warding σας θα το αναβαθμίσει.\n\nΑυτό το ward θα χτυπήσει τρεις φορές πριν διαλυθεί.\n\nΤο ραβδί warding σας χρησιμοποιεί _%3$d ενέργεια_ για να διατηρήσει αυτό το ward.
items.wands.wandofwarding$ward.desc_3=Αυτό το πλήρως αναβαθμισμένο ward είναι σε θέση να επιτεθεί περισσότερες φορές από τους προκατόχους του. Κάθε χτύπημα από αυτό το ward θα προκαλέσει _%1$d-%2$d ζημιά._\n\nΤο χτύπημα σε αυτό το ward με το ραβδί warding σας θα το αναβαθμίσει.\n\nΑυτό το ward θα χτυπήσει πέντε φορές πριν διαλυθεί.\n\nΤο ραβδί warding σας χρησιμοποιεί _%3$d ενέργεια_ για να συντηρήσει αυτό το ward.
items.wands.wandofwarding$ward.desc_4=Αυτός ο μικρότερος φρουρός έχει την ίδια ισχύ πυρός με έναν μεγαλύτερο φύλακα, αλλά έχει ζωή αντί για έναν καθορισμένο αριθμό φορτίσεων. Μοιάζει με το πετράδι στην άκρη του ραβδιού προστασίας σας. Κάθε χτύπημα από αυτόν τον φρουρό θα προκαλέσει _%1$d-%2$d ζημιά._\n\nΤο χτύπημα αυτού του φρουρού με το ραβδί προστασίας σας θα τον αναβαθμίσει και θα τον θεραπεύσει.\n\nΑυτός ο φρουρός θα ξοδεύει κάποια υγεία κάθε φορά που χτυπά έναν εχθρό, αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί προστασίας σας πάνω του.\n\nΤο ραβδί προστασίας σας χρησιμοποιεί _%3$d ενέργεια_ για να συντηρήσει αυτόν τον φρουρό.
items.wands.wandofwarding$ward.desc_5=Αυτός ο αναβαθμισμένος φρουρός είναι μεγαλύτερος και πιο ανθεκτικός από έναν μικρότερο φρουρό. Κάθε χτύπημα από αυτόν τον φρουρό θα προκαλέσει _%1$d-%2$d ζημιά._\n\nΤο χτύπημα αυτού του φρουρού με το ραβδί προστασίας σας θα τον αναβαθμίσει και θα τον θεραπεύσει.\n\nΑυτός ο φρουρός θα ξοδεύει κάποια υγεία κάθε φορά που χτυπά έναν εχθρό, αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί προστασίας σας πάνω του.\n\nΤο ραβδί προστασίας σας χρησιμοποιεί _%3$d ενέργεια_ για να συντηρήσει αυτόν τον φρουρό.
items.wands.wandofwarding$ward.desc_6=Αυτός ο πλήρως αναβαθμισμένος φρουρός είναι σημαντικά πιο ανθεκτικός από τους προκατόχους του. Κάθε χτύπημα από αυτόν τον φρουρό θα προκαλέσει _%1$d-%2$d ζημιά._\n\nΤο χτύπημα αυτού του φρουρού με το ραβδί προστασίας σας θα τον θεραπεύσει.\n\nΑυτός ο φρουρός θα ξοδεύει κάποια υγεία κάθε φορά που χτυπά έναν εχθρό, αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί προστασίας σας πάνω του.\n\nΤο ραβδί προστασίας σας χρησιμοποιεί _%3$d ενέργεια_ για να συντηρήσει αυτόν τον φρουρό.
items.wands.wandofwarding$ward.desc_generic_sentry=Αυτός ο φρουρός έχει την ίδια ισχύ πυρός με ένα ward, αλλά έχει ζωή αντί για έναν καθορισμένο αριθμό φορτίσεων. Μοιάζει με το πετράδι στην άκρη του ραβδιού προστασίας σας.\n\nΑν χτυπήσετε αυτόν τον φρουρό με το ραβδί προστασίας σας, θα τον αναβαθμίσετε και θα τον θεραπεύσετε.\n\nΑυτός ο φρουρός θα ξοδεύει κάποια ζωή κάθε φορά που χτυπάει έναν εχθρό, αλλά μπορεί να θεραπευτεί χρησιμοποιώντας το ραβδί προστασίας σας πάνω του.
items.wands.wandofwarding$ward.desc_generic_ward=Αυτό το ward θα εξουδετερώσει αυτόματα οποιονδήποτε εχθρό βρεθεί στην εμβέλεια του οράματός του.\n\nΗ εξουδετέρωση αυτού του ward με το ραβδί προστασίας σας θα το αναβαθμίσει.\n\nΤα wards έχουν περιορισμένο αριθμό airpills πριν διαλυθούν.
items.wands.wandofwarding$ward.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με ένα συγκεκριμένο ραβδί.
items.wands.wandofwarding$ward.dismiss_body=Μπορείτε να διαλύσετε αυτό το μάλλινο θηρίο αν δεν θέλετε πλέον να το συντηρεί το ραβδί σας. Με αυτόν τον τρόπο, το θηρίο καταστρέφεται αμέσως.\n\nΑπορρίψτε αυτό το θηρίο;
items.wands.wandofwarding$ward.dismiss_cancel=Όχι
items.wands.wandofwarding$ward.dismiss_confirm=Ναί
items.wands.wandofwarding$ward.dismiss_title=Να απορριφθεί αυτός ο θάλαμος;
items.wands.wandofwarding$ward.name_1=κατώτερη πτέρυγα
items.wands.wandofwarding$ward.name_2=πτέρυγα
items.wands.wandofwarding$ward.name_3=μεγαλύτερη περιφέρεια
items.wands.wandofwarding$ward.name_4=κατώτερος φρουρός
items.wands.wandofwarding$ward.name_5=φρουρός
items.wands.wandofwarding$ward.name_6=μεγαλύτερος φρουρός
items.wands.wandofwarding.bad_location=Δεν μπορείς να τοποθετήσεις θάλαμο εκεί.
items.wands.wandofwarding.bmage_desc=Όταν _ο Μάγος της Μάχης_ χτυπήσει έναν εχθρό με ένα ραβδί προστασίας, όλοι οι ενεργοί φύλακες και φρουροί έχουν την ευκαιρία να θεραπευτούν.
items.wands.wandofwarding.desc=Αυτό το κοντό μεταλλικό ραβδί έχει ένα φωτεινό μωβ πετράδι που αιωρείται πάνω από την άκρη του.
items.wands.wandofwarding.eleblast_desc=Μια στοιχειακή έκρηξη με ένα ραβδί φύλαξης θεραπεύει όλους τους φύλακες και τους φρουρούς στην περιοχή της έκρηξης.
items.wands.wandofwarding.name=ραβδί φύλαξης
items.wands.wandofwarding.no_more_wards=Το ραβδί σου δεν μπορεί να αντέξει άλλα μάγια.
items.wands.wandofwarding.staff_name=προσωπικό φύλαξης
items.wands.wandofwarding.stats_desc=Αντί να προκαλεί άμεση ζημιά σε έναν εχθρό, αυτό το ραβδί θα καλεί στάσιμους φύλακες και φρουρούς. Οι φύλακες μπορούν να καλούνται οπουδήποτε, ακόμα και μέσα από τοίχους αν έχετε όραση. Αυτό το ραβδί μπορεί να διατηρήσει _%d_ αξίας φύλας κάθε φορά.
items.wands.wandofwarding.upgrade_stat_name_1=Ζημιά σε θάλαμο
items.wands.wandofwarding.upgrade_stat_name_2=Ενέργεια Ward
items.waterskin.ac_drink=ΠΟΤΟ
items.waterskin.collected=Μαζεύεις τη δροσοσταλίδα στο ασκί σου.
items.waterskin.desc=Δοχείο για υγρό, φτιαγμένο από δέρμα και σπάγκο, σφραγισμένο με πώμα από φελλό.
items.waterskin.desc_full=Το πλήρες δέρμα νερού φαίνεται να ακτινοβολεί ενέργεια, ίσως μπορεί να χρησιμοποιηθεί για να ευλογήσει κάποιο άλλο αντικείμενο επιβίωσης;
items.waterskin.desc_heal=Το ασκί χρησιμοποιείται αυτήν τη στιγμή για την αποθήκευση θεραπευτικού νερού. Όσο πιο γεμάτο είναι το ασκί, τόσο περισσότερο θα θεραπευτείτε αμέσως όταν πίνετε από αυτό. Θα πίνετε μόνο όσο χρειάζεστε.
items.waterskin.desc_water=Αυτή τη στιγμή, το ασκί περιέχει μόνο λίγο πόσιμο νερό. Σίγουρα υπάρχει κάτι στο μπουντρούμι που θα μπορούσε να αποθηκεύσει το ασκί.
items.waterskin.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.waterskin.empty=Το ασκί σου είναι άδειο!
items.waterskin.full=Το ασκί σου είναι γεμάτο!
items.waterskin.name=νεροσκάφος
items.weapon.curses.annoying.desc=Τα ενοχλητικά όπλα μπορούν να μιλήσουν, αλλά είναι λίγο υπερβολικά ενεργητικά. Συχνά θα τραβήξουν την προσοχή πάνω σας χωρίς να το θέλουν.
items.weapon.curses.annoying.elestrike_desc=Ένα στοιχειακό χτύπημα με μια ενοχλητική κατάρα έχει 20% πιθανότητα να εξαπολύσει αμοκ σε κάθε εχθρό που βρίσκεται σε εμβέλεια για 6 γύρους.
items.weapon.curses.annoying.msg_1=ΩΩ, ΜΑΧΟΜΑΣΤΕ ΚΑΤΙ!;
items.weapon.curses.annoying.msg_10=ΚΑΛΑ ΧΤΥΠΗΜΕΝΟ!
items.weapon.curses.annoying.msg_11=Δεν ήθελα να είμαι όπλο, ήθελα να είμαι το τσεκούρι ενός ξυλοκόπου.
items.weapon.curses.annoying.msg_12=Να θυμάστε ότι η υπερβολική αυτοπεποίθηση είναι ένας αργός και ύπουλος δολοφόνος.
items.weapon.curses.annoying.msg_13=ΟΛΗ Η ΒΑΣΗ ΣΑΣ ΑΝΗΚΕΙ ΣΕ ΕΜΑΣ!
items.weapon.curses.annoying.msg_2=ΝΑΙ, ΠΑΡΤΕ ΤΑ!
items.weapon.curses.annoying.msg_3=Ε, ΑΚΟΥΣΤΕ!
items.weapon.curses.annoying.msg_4=ΕΙΜΑΣΤΕ ΑΚΟΜΑ ΣΤΟ ΑΦΕΝΤΙΚΟ!;
items.weapon.curses.annoying.msg_5=ΑΟΥΤΣ, ΜΗΝ ΜΕ ΠΙΕΖΕΙΣ ΤΟΣΟ ΔΥΝΑΤΑ!
items.weapon.curses.annoying.msg_6=ΠΕΘΑΝΕ, ΕΝΤΟΜΟ!
items.weapon.curses.annoying.msg_7=ΟΥΙΙΙΙΙΙΙΙΙΙΙΙΙ!
items.weapon.curses.annoying.msg_8=ΜΠΟΡΟΥΜΕ ΝΑ ΚΑΝΟΥΜΕ ΕΝΑ ΔΙΑΛΕΙΜΜΑ!;
items.weapon.curses.annoying.msg_9=ΠΑΟΥ, ΧΑΧΑ!
items.weapon.curses.annoying.name=ενοχλητικό %s
items.weapon.curses.dazzling.desc=Εκθαμβωτικά όπλα μερικές φορές θα λάμψουν με εκθαμβωτικό φως, τυφλώνοντας οτιδήποτε μπορεί να τα δει.
items.weapon.curses.dazzling.elestrike_desc=Ένα στοιχειακό χτύπημα με μια εκθαμβωτική κατάρα έχει 50% πιθανότητα να τυφλώσει κάθε εχθρό στην εμβέλεια για 6 γύρους.
items.weapon.curses.dazzling.name=εκθαμβωτικό %s
items.weapon.curses.displacing.desc=Τα όπλα που εκτοπίζονται είναι εμπλουτισμένα με χαοτική μαγεία τηλεμεταφοράς, έχοντας την ικανότητα να παραμορφώνουν τους εχθρούς στο πάτωμα τυχαία.
items.weapon.curses.displacing.elestrike_desc=Ένα στοιχειακό χτύπημα με μια κατάρα που εκτοπίζει έχει 50% πιθανότητα να τηλεμεταφέρει κάθε εχθρό που βρίσκεται σε εμβέλεια.
items.weapon.curses.displacing.name=μετατοπίζοντας %s
items.weapon.curses.explosive.desc=Τα εκρηκτικά όπλα συσσωρεύουν σταθερά ισχύ και εκρήγνυνται, καταστρέφοντας οτιδήποτε βρίσκεται κοντά.
items.weapon.curses.explosive.desc_cool=Το όπλο σου είναι αυτή τη στιγμή ωραίο στην αφή.
items.weapon.curses.explosive.desc_hot=Το όπλο σου είναι καυτό! Είναι έτοιμο να εκραγεί!
items.weapon.curses.explosive.desc_warm=Το όπλο σου είναι να χτίζεις ενέργεια και να ζεσταίνεσαι...
items.weapon.curses.explosive.elestrike_desc=Ένα στοιχειακό χτύπημα με εκρηκτική κατάρα έχει 50% πιθανότητα να προκαλέσει έκρηξη σε έναν τυχαίο εχθρό που βρίσκεται σε εμβέλεια.
items.weapon.curses.explosive.hot=Καυτό!
items.weapon.curses.explosive.name=εκρηκτικό %s
items.weapon.curses.explosive.warm=Ζεστός...
items.weapon.curses.friendly.desc=Τα φιλικά όπλα είναι ιδανικά για τους ειρηνιστές, καθώς περιστασιακά ενεργοποιούν μαγεία που καθιστά αδύνατη τη μάχη.
items.weapon.curses.friendly.elestrike_desc=Ένα στοιχειακό χτύπημα με μια φιλική κατάρα έχει 50% πιθανότητα να γοητεύσει κάθε εχθρό στην εμβέλεια για 6 γύρους.
items.weapon.curses.friendly.name=φιλικό %s
items.weapon.curses.polarized.desc=Ένα πολωμένο όπλο επηρεάζεται από μαγεία που προκαλεί είτε 50% περισσότερη ζημιά είτε καθόλου ζημιά στην επίθεσή του.
items.weapon.curses.polarized.elestrike_desc=Ένα στοιχειακό χτύπημα με πολωμένη κατάρα έχει 50% πιθανότητα να προκαλέσει 24-36 ζημιά σε κάθε εχθρό που βρίσκεται σε εμβέλεια.
items.weapon.curses.polarized.name=πολωμένο %s
items.weapon.curses.sacrificial.desc=Τα όπλα θυσίας θα απαιτούν αίμα από τον κάτοχό τους σε αντάλλαγμα για την επίθεση στους εχθρούς. Όσο πιο υγιής είναι ο κάτοχός τους, τόσο περισσότερο αίμα θα δεχτεί η κατάρα.
items.weapon.curses.sacrificial.elestrike_desc=Ένα στοιχειακό χτύπημα με μια θυσιαστική κατάρα προκαλεί αιμορραγία στον ήρωα και σε κάθε εχθρό στην εμβέλεια για 12 ΖΩΕΣ.
items.weapon.curses.sacrificial.name=θυσιαστικό %s
items.weapon.curses.wayward$waywardbuff.desc=Η μαγεία του άτακτου όπλου σας έχει ενεργοποιηθεί, καθιστώντας το εξαιρετικά ανακριβές για μικρό χρονικό διάστημα. Σημειώστε ότι αυτό δεν επηρεάζει τις επιθέσεις που είναι εγγυημένο ότι θα πετύχουν, όπως οι αιφνιδιαστικές επιθέσεις. Η επιτυχημένη επίθεση με το άτακτο όπλο θα εξαλείψει αμέσως αυτό το φαινόμενο.\n\nΥπόλοιπο στροφών: %s.
items.weapon.curses.wayward$waywardbuff.name=δύστροπος
items.weapon.curses.wayward.desc=Τα άτακτα όπλα μερικές φορές γίνονται εξαιρετικά ανακριβή. Αυτή η μαγεία διαρκεί για λίγο όταν ενεργοποιείται, αλλά μπορεί να διαλυθεί με ένα χτύπημα με το άτακτο όπλο.
items.weapon.curses.wayward.elestrike_desc=Ένα στοιχειακό χτύπημα με μια άστατη κατάρα έχει 50% πιθανότητα να εξαγριώσει κάθε εχθρό στην εμβέλεια για 6 γύρους.
items.weapon.curses.wayward.name=άτακτος %s
items.weapon.enchantments.blazing.desc=Αυτή η γοητεία προκαλεί φλόγες να εκτοξεύονται από ένα όπλο, ανάβοντας τους εχθρούς και προκαλώντας επιπλέον ζημιά σε εχθρούς που είναι ήδη στις φλόγες.
items.weapon.enchantments.blazing.elestrike_desc=Ένα στοιχειακό χτύπημα με μια φλεγόμενη γοητεία εξαπλώνει φωτιά σε κάθε πλακίδιο στην εμβέλεια, η οποία διαρκεί 8 γύρους.
items.weapon.enchantments.blazing.name=φλεγόμενο %s
items.weapon.enchantments.blocking$blockbuff.desc=Η μαγεία μπλοκαρίσματος του όπλου σας σάς έχει δώσει μια σύντομη ώθηση στην αμυντική σας δύναμη!\n\nΥπόλοιπη θωράκιση: %d\n\nΥπόλοιποι γύροι: %s.
items.weapon.enchantments.blocking$blockbuff.name=μπλοκάρισμα
items.weapon.enchantments.blocking.desc=Τα όπλα μπλοκαρίσματος έχουν την ευκαιρία να σας προστατεύσουν για λίγο μετά την επίθεσή σας με αυτά.
items.weapon.enchantments.blocking.elestrike_desc=Ένα στοιχειακό χτύπημα με ένα ξόρκι μπλοκαρίσματος δίνει στον Μονομάχο 6 επιπλέον ασπίδες για κάθε εχθρό που βρίσκεται σε εμβέλεια.
items.weapon.enchantments.blocking.name=μπλοκάρισμα %s
items.weapon.enchantments.blooming.desc=Τα ανθισμένα όπλα περιέχουν μαγεία που θα κάνει τη βλάστηση να φυτρώνει πάνω ή γύρω από όσους χτυπηθούν από αυτά.
items.weapon.enchantments.blooming.elestrike_desc=Ένα στοιχειακό χτύπημα με μια ανθισμένη γοητεία απλώνει το γρασίδι σε έως και 8 πλακίδια σε εμβέλεια και ριζώνει όλους τους εχθρούς σε εμβέλεια για 6 γύρους.
items.weapon.enchantments.blooming.name=ανθίζοντας %s
items.weapon.enchantments.chilling.desc=Οι εχθροί που χτυπιούνται με αυτή τη μαγεία παγώνουν, επιβραδύνοντας την κίνηση και τις επιθέσεις τους.
items.weapon.enchantments.chilling.elestrike_desc=Ένα στοιχειακό χτύπημα με μια ανατριχιαστική γοητεία σκορπίζει ανατριχιαστικό αέρα σε κάθε πλακίδιο στην εμβέλεια, το οποίο διαρκεί 8 γύρους.
items.weapon.enchantments.chilling.name=ανατριχιαστικό %s
items.weapon.enchantments.corrupting.desc=Αυτή η ισχυρή μαγεία έχει την ικανότητα να μετατρέπει τους εχθρούς στη θέλησή σας. Όταν ένας εχθρός σκοτώνεται με αυτό το όπλο, υπάρχει πιθανότητα να διαφθαρεί αντί να πεθάνει.
items.weapon.enchantments.corrupting.elestrike_desc=Ένα στοιχειακό χτύπημα με μια διεφθαρμένη γοητεία έχει 5-25% πιθανότητα (βάσει της έλλειψης Ζωής) να διαφθείρει κάθε εχθρό σε εμβέλεια, εκτός από τον κύριο στόχο.
items.weapon.enchantments.corrupting.name=διαφθείροντας %s
items.weapon.enchantments.elastic.desc=Τα ελαστικά όπλα έχουν την πιθανότητα να στείλουν τους εχθρούς πίσω σε μικρές αποστάσεις.
items.weapon.enchantments.elastic.elestrike_desc=Ένα στοιχειακό χτύπημα με ελαστική γοητεία ρίχνει όλους τους εχθρούς στην εμβέλεια 5 πλακίδια πίσω.
items.weapon.enchantments.elastic.name=ελαστικό %s
items.weapon.enchantments.grim.desc=Αυτή η ισχυρή μαγεία έχει τη δύναμη να εκτελέσει αμέσως έναν εχθρό. Το αποτέλεσμα είναι πιο πιθανό να συμβεί όσο πιο αδύναμος είναι ο εχθρός.
items.weapon.enchantments.grim.elestrike_desc=Ένα στοιχειακό χτύπημα με μια ζοφερή γοητεία έχει 6-30% πιθανότητα (βάσει της Ζωής που λείπει) να σκοτώσει κάθε εχθρό σε εμβέλεια, εκτός από τον κύριο στόχο.
items.weapon.enchantments.grim.name=ζοφερό %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Το όπλο σας έχει αποθηκεύσει την πλεονάζουσα δύναμη από ένα προηγούμενο φονικό χτύπημα και θα την εφαρμόσει ως επιπλέον ζημιά στην επόμενη επίθεσή σας. Ωστόσο, η ενέργεια θα εξασθενίσει αργά με την πάροδο του χρόνου. \n\nΔιατηρημένη Ζημιά: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=διατηρημένη ζημιά
items.weapon.enchantments.kinetic.desc=Όταν ένας εχθρός σκοτώνεται με ένα κινητικό όπλο, οποιαδήποτε πλεονάζουσα δύναμη αποθηκεύεται στο όπλο και θα εφαρμοστεί στην επόμενη επιτυχημένη επίθεση.
items.weapon.enchantments.kinetic.elestrike_desc=Ένα στοιχειακό χτύπημα με κινητική γοητεία προκαλεί το 40% της αποθηκευμένης ζημιάς σε κάθε εχθρό εντός εμβέλειας, εκτός από τον κύριο στόχο.
items.weapon.enchantments.kinetic.name=κινητική %s
items.weapon.enchantments.lucky.desc=Οι εχθροί που σκοτώνονται από ένα τυχερό όπλο έχουν την ευκαιρία να ρίξουν επιπλέον λάφυρα.
items.weapon.enchantments.lucky.elestrike_desc=Ένα στοιχειακό χτύπημα με μια τυχερή γοητεία έχει 12,5% πιθανότητα να δημιουργήσει λάφυρα κάτω από κάθε εχθρό στην εμβέλεια. Αυτή η επίδραση μπορεί να ενεργοποιηθεί μόνο μία φορά ανά εχθρό.
items.weapon.enchantments.lucky.name=τυχερός %s
items.weapon.enchantments.projecting.desc=Με αυτό το μαγικό όπλο σώμα με σώμα θα αποκτήσετε επιπλέον εμβέλεια. Τα όπλα από απόσταση θα διαπερνούν τοίχους όταν στοχεύουν σε κοντινούς στόχους.
items.weapon.enchantments.projecting.elestrike_desc=Ένα στοιχειακό χτύπημα με μια προεξέχουσα γοητεία προκαλεί 30% ζημιά σε κάθε εχθρό στην εμβέλεια, εκτός από τον κύριο στόχο.
items.weapon.enchantments.projecting.name=προβάλλοντας %s
items.weapon.enchantments.shocking.desc=Ηλεκτρικά τόξα από ένα όπλο που σοκάρει, προκαλώντας επιπλέον ζημιά σε όλους τους κοντινούς εχθρούς.
items.weapon.enchantments.shocking.elestrike_desc=Ένα στοιχειακό χτύπημα με μια συγκλονιστική μαγεία διαδίδει ηλεκτρισμό σε κάθε πλακίδιο στην εμβέλεια, το οποίο διαρκεί 8 γύρους.
items.weapon.enchantments.shocking.name=σοκαριστικό %s
items.weapon.enchantments.unstable.desc=Αυτή η γοητεία ακτινοβολεί χαοτική ενέργεια, λειτουργώντας ως διαφορετική γοητεία με κάθε χτύπημα.
items.weapon.enchantments.unstable.elestrike_desc=Ένα στοιχειακό χτύπημα με ασταθή γοητεία εφαρμόζει ένα τυχαίο εφέ γοητείας σε κάθε εχθρό στην εμβέλεια, εκτός από τον κύριο στόχο.
items.weapon.enchantments.unstable.name=ασταθές %s
items.weapon.enchantments.vampiric.desc=Αυτή η ισχυρή γοητεία απορροφά ζωτική δύναμη από τους εχθρούς με κάθε χτύπημα, διοχετεύοντάς την πίσω στον κάτοχό της. Η επίδραση είναι ισχυρότερη όσο χαμηλότερη είναι η υγεία του κάτοχού της.
items.weapon.enchantments.vampiric.elestrike_desc=Ένα στοιχειακό χτύπημα με μια βρικολαϊκή γοητεία θεραπεύει τον Μονομάχο για 2,5 ΖΩΗ για κάθε εχθρό στην εμβέλεια.
items.weapon.enchantments.vampiric.name=βαμπιρικό %s
items.weapon.melee.assassinsblade.ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει μια λεπίδα δολοφόνου. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του έως και 3 πλακίδια μακριά και του δίνει _%d στροφές αορατότητας._
items.weapon.melee.assassinsblade.ability_name=έρπω
items.weapon.melee.assassinsblade.desc=Μια μικρή κυματιστή λεπίδα από οψιανό, δύσκολη στη χρήση παρά το γεγονός ότι είναι ελαφριά, αλλά θανατηφόρα αν βρει το σωστό σημάδι.
items.weapon.melee.assassinsblade.name=λεπίδα δολοφόνου
items.weapon.melee.assassinsblade.stats_desc=Αυτό το όπλο είναι ισχυρότερο ενάντια σε εχθρούς που δεν γνωρίζουν.
items.weapon.melee.assassinsblade.typical_ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει μια λεπίδα δολοφόνου. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του έως και 3 πλακίδια μακριά και συνήθως της δίνει _%d στροφές αορατότητας._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.battleaxe.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα τσεκούρι μάχης. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.battleaxe.ability_name=βαρύ πλήγμα
items.weapon.melee.battleaxe.desc=Η τεράστια ατσάλινη κεφαλή αυτού του πολεμικού τσεκουριού προσθέτει σημαντικό βάρος σε κάθε φαρδύ χτύπημα.
items.weapon.melee.battleaxe.name=πολεμικό τσεκούρι
items.weapon.melee.battleaxe.stats_desc=Αυτό είναι ένα αρκετά ακριβές όπλο.
items.weapon.melee.battleaxe.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα τσεκούρι μάχης. Αυτή η συγκεντρωμένη επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.crossbow$chargedshot.desc=Η Μονομάχος εστιάζει τη δύναμή της στο τόξο της. Η επόμενη επίθεση που θα κάνει με αυτό θα χτυπήσει πάντα και θα εφαρμόσει ένα από τα τρία εφέ: \n- Οι επιθέσεις σώμα με σώμα θα ρίξουν τους εχθρούς μερικά πλακίδια μακριά. \n- Τα βελάκια χωρίς άκρη θα προκαλέσουν επιπλέον ζημιά. \n- Τα βελάκια με άκρη θα αποκτήσουν επιπλέον χρήσεις και θα εφαρμόσουν την επίδρασή τους σε μια περιοχή 7x7. Τα θετικά εφέ βελών θα επηρεάσουν μόνο τους συμμάχους και τα επιβλαβή εφέ θα ισχύουν μόνο για τους εχθρούς. Η Μονομάχος δεν μπορεί να χρησιμοποιήσει αυτήν την ικανότητα για να εφαρμόσει θετικά εφέ βελών στον εαυτό της.
items.weapon.melee.crossbow$chargedshot.name=κατηγορούμενος
items.weapon.melee.crossbow.ability_desc=Η Μονομάχος μπορεί να _χτυπήσει_ την βαλλίστρα της, με αποτέλεσμα η επόμενη κανονική της επίθεση με αυτήν να πετυχαίνει πάντα και να εφαρμόζει ένα από τα τρία εφέ: οι επιθέσεις σώμα με σώμα θα εκτοξεύσουν τους εχθρούς μακριά, τα βελάκια χωρίς κορυφή θα προκαλέσουν _+%1$d ζημιά_ και τα βελάκια με άκρη θα εφαρμόσουν την επίδρασή τους σε μια περιοχή 7x7 και θα διαρκέσουν για _%2$d περισσότερες χρήσεις_.
items.weapon.melee.crossbow.ability_name=φορτισμένος πυροβολισμός
items.weapon.melee.crossbow.desc=Ένα αρκετά περίπλοκο όπλο που εκτοξεύει βολές με εξαιρετικές ταχύτητες. Αν και δεν έχει σχεδιαστεί για αυτό, η στιβαρή και στιβαρή κατασκευή αυτού του τόξου το καθιστά επίσης ένα αξιοπρεπές όπλο για μάχες σώμα με σώμα.
items.weapon.melee.crossbow.name=τόξο
items.weapon.melee.crossbow.stats_desc=Αυτό το όπλο ενισχύει τα ριπτόμενα βελάκια για να προκαλέσει _%1$d-%2$d ζημιά_ όταν είναι εξοπλισμένο, και θα τους δώσει ακόμη και τη μαγεία του.
items.weapon.melee.crossbow.typical_ability_desc=Η Μονομάχος μπορεί να _χτυπήσει_ την βαλλίστρα της, με αποτέλεσμα η επόμενη κανονική της επίθεση με αυτήν να πετυχαίνει πάντα και να εφαρμόζει ένα από τα τρία εφέ: οι επιθέσεις σώμα με σώμα θα απομακρύνουν τους εχθρούς, τα βελάκια χωρίς κορυφή συνήθως προκαλούν _+%1$d ζημιά_ και τα βελάκια με άκρη θα εφαρμόζουν την επίδρασή τους σε μια περιοχή 7x7 και συνήθως διαρκούν για _%2$d περισσότερες χρήσεις_.
items.weapon.melee.crossbow.typical_stats_desc=Συνήθως, αυτό το όπλο ενισχύει τα ριπτόμενα βελάκια για να προκαλέσει _%1$d-%2$d ζημιά_ όταν είναι εξοπλισμένο, και μάλιστα τους δίνει τη μαγεία του.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Ενίσχυση Ικανότητας
items.weapon.melee.cudgel.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα ρόπαλο. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.cudgel.ability_name=βαρύ πλήγμα
items.weapon.melee.cudgel.desc=Ένα μικρό ορειχάλκινο ρόπαλο, κατασκευασμένο περισσότερο ως εργαλείο αυτοάμυνας για ευγενείς παρά ως όπλο περιπέτειας.
items.weapon.melee.cudgel.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.cudgel.name=ρόπαλο
items.weapon.melee.cudgel.stats_desc=Αυτό είναι ένα αρκετά ακριβές όπλο.
items.weapon.melee.cudgel.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα ρόπαλο. Αυτή η συγκεντρωμένη επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.dagger.ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει ένα στιλέτο. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του έως και 5 πλακίδια μακριά και του δίνει _%d στροφές αορατότητας._
items.weapon.melee.dagger.ability_name=έρπω
items.weapon.melee.dagger.desc=Ένα απλό σιδερένιο στιλέτο με φθαρμένη ξύλινη λαβή.
items.weapon.melee.dagger.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.dagger.name=στιλέτο
items.weapon.melee.dagger.stats_desc=Αυτό το όπλο είναι ισχυρότερο ενάντια σε εχθρούς που δεν γνωρίζουν.
items.weapon.melee.dagger.typical_ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει ένα στιλέτο. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του σε απόσταση έως και 5 πλακιδίων και συνήθως του δίνει _%d στροφές αορατότητας._
items.weapon.melee.dagger.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.dirk.ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει ένα πούρο. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του έως και 4 πλακίδια μακριά και του δίνει _%d στροφές αορατότητας._
items.weapon.melee.dirk.ability_name=έρπω
items.weapon.melee.dirk.desc=Ένα μακρύτερο ωστικό στιλέτο, δίνει λίγο περισσότερο ατσάλι για να βυθιστείς στους εχθρούς.
items.weapon.melee.dirk.name=στιλέτο
items.weapon.melee.dirk.stats_desc=Αυτό το όπλο είναι ισχυρότερο ενάντια σε εχθρούς που δεν γνωρίζουν.
items.weapon.melee.dirk.typical_ability_desc=Ο Μονομάχος μπορεί να _κρυφτεί_ ενώ κρατάει ένα πούρο. Αυτή η ικανότητα επιτρέπει στον Μονομάχο να ανοιγοκλείνει αμέσως τα μάτια του σε απόσταση έως και 4 πλακιδίων και συνήθως του δίνει _%d στροφές αορατότητας._
items.weapon.melee.dirk.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.flail$spinabilitytracker.desc=Η Μονομάχος περιστρέφει το μαστίγιό της, δημιουργώντας ζημιά για την επόμενη κανονική της επίθεση. Κάθε περιστροφή διαρκεί μία στροφή αλλά αυξάνει τη ζημιά, σε μέγιστο τρεις περιστροφές. Το μαστίγιο είναι επίσης εγγυημένο ότι θα χτυπήσει ενώ περιστρέφεται.\n\nΤρέχουσες περιστροφές: %1$d%%.\nΥπόλοιποι γύροι: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=κλώση
items.weapon.melee.flail.ability_desc=Ο Μονομάχος μπορεί να _περιστρέψει_ ένα μαστίγιο για να αυξήσει τη δύναμή του για μικρό χρονικό διάστημα. Σε κάθε στροφή που περιστρέφεται το μαστίγιο, θα προκαλεί _+%d ζημιά_ στην επόμενη κανονική του επίθεση, μέχρι το πολύ 3 φορές. Ένα μαστίγιο που περιστρέφεται είναι επίσης εγγυημένο ότι θα χτυπήσει. Μόνο η έναρξη της περιστροφής του μαστιγίου κοστίζει μια χρέωση.
items.weapon.melee.flail.ability_name=γνέθω
items.weapon.melee.flail.desc=Μια μπάλα με καρφιά που είναι στερεωμένη σε μια λαβή με ένα κομμάτι αλυσίδας. Πολύ δύσχρηστη, αλλά καταστροφική αν πετύχει ένα δυνατό χτύπημα.
items.weapon.melee.flail.name=κόπανος
items.weapon.melee.flail.spin_warn=Δεν μπορείς να περιστρέφεις πια το μαστίγιο.
items.weapon.melee.flail.stats_desc=Αυτό είναι ένα μάλλον ανακριβές όπλο. \nΑυτό το όπλο δεν μπορεί να αιφνιδιάσει την επίθεση.
items.weapon.melee.flail.typical_ability_desc=Ο Μονομάχος μπορεί να _περιστρέψει_ ένα μαστίγιο για να αυξήσει τη δύναμή του για μικρό χρονικό διάστημα. Σε κάθε στροφή που περιστρέφεται το μαστίγιο, συνήθως προκαλεί _+%d ζημιά_ στην επόμενη κανονική του επίθεση, μέχρι το πολύ 3 φορές. Ένα περιστρεφόμενο μαστίγιο είναι επίσης εγγυημένο ότι θα χτυπήσει. Μόνο το να ξεκινήσει κανείς να περιστρέφει το μαστίγιο κοστίζει μια χρέωση.
items.weapon.melee.gauntlet.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με ένα πέτρινο γάντι. Αυτή η επίθεση είναι εγγυημένη για να πετύχει και προκαλεί _+%d ζημιά_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με πετούμενο όπλο. Αν δεν χτυπήσει για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.gauntlet.ability_name=συνδυαστική απεργία
items.weapon.melee.gauntlet.desc=Αυτό το τεράστιο γάντι είναι φτιαγμένο από κατακόκκινο ύφασμα με στρώσεις από βαριά μαγική πέτρα στην κορυφή. Το ύφασμα σφίγγει γύρω σας, κάνοντας τις χοντρές πέτρινες πλάκες σχεδόν σαν δεύτερο δέρμα. Το να κουνάς ένα τόσο βαρύ όπλο απαιτεί δύναμη, αλλά προσθέτει τεράστια δύναμη στα χτυπήματά σου.
items.weapon.melee.gauntlet.name=πέτρινο γάντι
items.weapon.melee.gauntlet.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.gauntlet.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με ένα πέτρινο γάντι. Αυτή η επίθεση είναι εγγυημένη για επιτυχία και συνήθως προκαλεί _+%d ζημιά_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με πετούμενο όπλο. Αν δεν χτυπήσει για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.glaive.ability_desc=Ο Μονομάχος μπορεί να χρησιμοποιήσει την άκρη μιας λόγχης για να _καρφώσει_ έναν εχθρό που βρίσκεται σε εμβέλεια αλλά όχι δίπλα. Αυτό προκαλεί _%1$d-%2$d ζημιά_, απωθεί τον εχθρό και είναι εγγυημένο ότι θα χτυπήσει.
items.weapon.melee.glaive.ability_name=ακίδα
items.weapon.melee.glaive.desc=Ένα τεράστιο κοντάρι που αποτελείται από μια λεπίδα σπαθιού στην άκρη ενός κοντάρι.
items.weapon.melee.glaive.name=λόγχη
items.weapon.melee.glaive.stats_desc=Αυτό είναι ένα μάλλον αργό όπλο. \nΑυτό το όπλο έχει επιπλέον εμβέλεια.
items.weapon.melee.glaive.typical_ability_desc=Ο Μονομάχος μπορεί να χρησιμοποιήσει την άκρη μιας λόγχης για να _καρφώσει_ έναν εχθρό που βρίσκεται σε εμβέλεια αλλά όχι δίπλα. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_, απωθεί τον εχθρό και είναι εγγυημένο ότι θα τον χτυπήσει.
items.weapon.melee.gloves.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με γάντια με καρφιά. Αυτή η επίθεση είναι εγγυημένη για επιτυχία και προκαλεί _+%d ζημιά_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με ριχτή επίθεση με όπλο. Αν δεν χτυπήσει για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.gloves.ability_name=συνδυαστική απεργία
items.weapon.melee.gloves.desc=Αυτά τα γάντια με τρουκς δεν παρέχουν καμία πραγματική προστασία, αλλά λειτουργούν ως ένα χρήσιμο όπλο διατηρώντας παράλληλα τα χέρια ελεύθερα.
items.weapon.melee.gloves.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.gloves.name=γάντια με καρφιά
items.weapon.melee.gloves.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.gloves.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με γάντια με καρφιά. Αυτή η επίθεση είναι εγγυημένη για επιτυχία και συνήθως προκαλεί _+%d ζημιά_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με ριχτή επίθεση με όπλο. Αν δεν χτυπήσει για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.greataxe.ability_desc=Η Μονομάχος μπορεί να εκτελέσει μια _επίθεση ανταπόδοσης_ με ένα μεγάλο τσεκούρι αν έχει ζωή κάτω από 50%%. Αυτή η καταστροφική επίθεση προκαλεί _%1$d-%2$d ζημιά,_ είναι εγγυημένη ότι θα χτυπήσει και είναι άμεση αν σκοτώσει έναν εχθρό.
items.weapon.melee.greataxe.ability_name=τιμωρία
items.weapon.melee.greataxe.desc=Προοριζόμενο για μεταφορά στον ώμο, αυτό το τιτάνιο τσεκούρι είναι τόσο ισχυρό όσο και βαρύ.
items.weapon.melee.greataxe.name=μεγάλο τσεκούρι
items.weapon.melee.greataxe.stats_desc=Αυτό το όπλο είναι απίστευτα βαρύ.
items.weapon.melee.greataxe.typical_ability_desc=Η Μονομάχος μπορεί να εκτελέσει μια _επίθεση ανταπόδοσης_ με ένα μεγάλο τσεκούρι αν έχει ζωή κάτω από 50%%. Αυτή η καταστροφική επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά,_ είναι εγγυημένη ότι θα χτυπήσει και είναι στιγμιαία αν σκοτώσει έναν εχθρό.
items.weapon.melee.greatshield.ability_desc=Η Μονομάχος μπορεί να _προστατευθεί_ με μια μεγάλη ασπίδα, εξουδετερώνοντας εντελώς όλες τις φυσικές ή μαγικές επιθέσεις που γίνονται εναντίον της για τους γύρους _%d_. Μόλις η Μονομάχος μπλοκάρει μια επίθεση, η αντεπίθεση ή η χρήση μαγείας θα τερματίσει την προστασία.
items.weapon.melee.greatshield.ability_name=φρουρά
items.weapon.melee.greatshield.desc=Μοιάζει περισσότερο με κινητό τείχος παρά με ασπίδα, αυτή η γιγαντιαία μάζα μετάλλου βοηθά στην άμυνα, αλλά δεν αφήνει πολλά περιθώρια για επίθεση.
items.weapon.melee.greatshield.name=μεγάλη ασπίδα
items.weapon.melee.greatshield.stats_desc=Αυτό το όπλο μπλοκάρει ζημιά 0-%d. Αυτό το μπλοκάρισμα κλιμακώνεται με τις αναβαθμίσεις.
items.weapon.melee.greatshield.typical_ability_desc=Η Μονομάχος μπορεί να _προστατευθεί_ με μια μεγάλη ασπίδα, εξουδετερώνοντας εντελώς όλες τις φυσικές ή μαγικές επιθέσεις που γίνονται εναντίον της, συνήθως στους γύρους _%d_. Μόλις η Μονομάχος μπλοκάρει μια επίθεση, η αντεπίθεση ή η χρήση μαγείας θα τερματίσει την προστασία.
items.weapon.melee.greatshield.typical_stats_desc=Συνήθως, αυτό το όπλο μπλοκάρει ζημιά 0-%d. Αυτό το μπλοκάρισμα κλιμακώνεται με τις αναβαθμίσεις.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.greatsword.ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα μεγάλο σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι άμεσο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.greatsword.ability_name=σχίζω
items.weapon.melee.greatsword.desc=Αυτή η πανύψηλη λεπίδα προκαλεί μεγάλη ζημιά επενδύοντας το βάρος της σε κάθε χτύπημα.
items.weapon.melee.greatsword.name=μεγάλο σπαθί
items.weapon.melee.greatsword.typical_ability_desc=Ο Μονομάχος μπορεί να _διασπάσει_ έναν εχθρό με ένα μεγάλο σπαθί. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το διάσπαση σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το διάσπαση εντός 5 γύρων δωρεάν.
items.weapon.melee.handaxe.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα χειρόπλεγμα. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.handaxe.ability_name=βαρύ πλήγμα
items.weapon.melee.handaxe.desc=Ένα ελαφρύ τσεκούρι, που χρησιμοποιείται συνήθως για την ρίψη δέντρων. Η φαρδιά λεπίδα λειτουργεί καλά και ενάντια σε εχθρούς.
items.weapon.melee.handaxe.name=χειροτέχνημα
items.weapon.melee.handaxe.stats_desc=Αυτό είναι ένα αρκετά ακριβές όπλο.
items.weapon.melee.handaxe.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα χειρόπλεγμα. Αυτή η συγκεντρωμένη επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.katana.ability_desc=Ο Μονομάχος μπορεί να _επιτεθεί_ με ένα katana σε έναν εχθρό που βρίσκεται 1 πλακίδιο μακριά. Αυτό κινείται προς τον εχθρό, προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα τον χτυπήσει.
items.weapon.melee.katana.ability_name=ξιφίζω
items.weapon.melee.katana.desc=Ένα λεπτό σπαθί με μια μεγάλη μεταλλική προστατευτική λαβή πάνω από τη λαβή.
items.weapon.melee.katana.name=κατάνα
items.weapon.melee.katana.stats_desc=Αυτό το όπλο μπλοκάρει ζημιά 0-3.
items.weapon.melee.katana.typical_ability_desc=Ο Μονομάχος μπορεί να _επιτεθεί_ με ένα katana σε έναν εχθρό που βρίσκεται 1 πλακίδιο μακριά. Αυτό κινείται προς τον εχθρό, συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα τον χτυπήσει.
items.weapon.melee.longsword.ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα μακρύ σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.longsword.ability_name=σχίζω
items.weapon.melee.longsword.desc=Η μακριά, κοφτερή σαν ξυράφι, ατσάλινη λεπίδα αυτού του σπαθιού λάμπει καθησυχαστικά, αν και το μέγεθός της το καθιστά αρκετά βαρύ.
items.weapon.melee.longsword.name=μακρύ σπαθί
items.weapon.melee.longsword.typical_ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα μακρύ σπαθί. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.mace.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα ρόπαλο. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.mace.ability_name=βαρύ πλήγμα
items.weapon.melee.mace.desc=Η μεγάλη σιδερένια κεφαλή αυτού του όπλου προκαλεί σημαντική ζημιά.
items.weapon.melee.mace.name=σκήπτρο
items.weapon.melee.mace.stats_desc=Αυτό είναι ένα αρκετά ακριβές όπλο.
items.weapon.melee.mace.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα ρόπαλο. Αυτή η συγκεντρωμένη επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.magesstaff.ac_imbue=ΕΜΠΟΤΙΖΩ
items.weapon.melee.magesstaff.ac_zap=ΖΑΠ
items.weapon.melee.magesstaff.cursed_wand=Το ραβδί είναι καταραμένο, κάνοντας τη μαγεία του χαοτική και τυχαία.
items.weapon.melee.magesstaff.desc=Κατασκευασμένο από τον ίδιο τον Μάγο, αυτό το ραβδί είναι ένα μοναδικό μαγικό όπλο στο οποίο μπορεί να τοποθετηθεί ένα ραβδί.
items.weapon.melee.magesstaff.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.magesstaff.has_wand=Το προσωπικό είναι επί του παρόντος εμποτισμένο με _%s._
items.weapon.melee.magesstaff.imbue=Εμπνέετε το προσωπικό σας με το %s.
items.weapon.melee.magesstaff.imbue_cursed=_Αν εμποτίσεις ένα καταραμένο ραβδί, τότε και το δικό σου ραβδί θα καταραστεί!_
items.weapon.melee.magesstaff.imbue_desc=Είστε σίγουροι ότι θέλετε να εμπλουτίσετε το ραβδί σας με αυτό το ραβδί;\n\nΕάν το ραβδί που εμπλουτίζεται είναι του ίδιου ή υψηλότερου επιπέδου από το ραβδί, το ραβδί θα κληρονομήσει το επίπεδο αυτού του ραβδιού συν μία μόνο από τις δικές του αναβαθμίσεις.
items.weapon.melee.magesstaff.imbue_level=Αυτή η προσθήκη θα έχει ως αποτέλεσμα ένα _+%d προσωπικό._
items.weapon.melee.magesstaff.imbue_lost=Το ραβδί που είναι αυτή τη στιγμή εμποτισμένο στο ραβδί σου _θα χαθεί_.
items.weapon.melee.magesstaff.imbue_talent=Το ραβδί που είναι αυτήν τη στιγμή εμποτισμένο στο ραβδί σας _θα επιστραφεί στο +0_.
items.weapon.melee.magesstaff.imbue_unknown=Δεν ξέρεις το επίπεδο αυτού του ραβδιού, αλλά αυτή η εμφύσηση θα έχει ως αποτέλεσμα τουλάχιστον ένα _+%d μπαστούνι._
items.weapon.melee.magesstaff.name=το προσωπικό του μάγου
items.weapon.melee.magesstaff.no=Όχι, άλλαξα γνώμη
items.weapon.melee.magesstaff.no_wand=Το ραβδί προς το παρόν δεν έχει μαγεία, πρέπει να είναι _εμποτισμένο με τη δύναμη ενός ραβδιού_ πριν μπορέσει να χρησιμοποιηθεί για ξόρκια.
items.weapon.melee.magesstaff.preserved=Το προηγούμενο ραβδί διατηρήθηκε!
items.weapon.melee.magesstaff.prompt=Επιλέξτε ένα ραβδί
items.weapon.melee.magesstaff.yes=Ναι, είμαι σίγουρος/η
items.weapon.melee.meleeweapon.ability_cant_use=Δεν μπορείς να χρησιμοποιήσεις αυτή τη δυνατότητα τώρα.
items.weapon.melee.meleeweapon.ability_low_str=Δεν είσαι αρκετά δυνατός για να χρησιμοποιήσεις την ικανότητα αυτού του όπλου.
items.weapon.melee.meleeweapon.ability_need_equip=Πρέπει να εξοπλίσεις αυτό το όπλο για να χρησιμοποιήσεις την ικανότητά του.
items.weapon.melee.meleeweapon.ability_no_charge=Δεν έχεις αρκετή ενέργεια για να χρησιμοποιήσεις αυτή την ικανότητα.
items.weapon.melee.meleeweapon.ability_no_target=Δεν υπάρχει στόχος εκεί.
items.weapon.melee.meleeweapon.ability_occupied=Η τοποθεσία αυτή είναι κατειλημμένη.
items.weapon.melee.meleeweapon.ability_target_range=Αυτός ο στόχος δεν βρίσκεται εντός εμβέλειας.
items.weapon.melee.meleeweapon.ac_ability=ΙΚΑΝΟΤΗΤΑ
items.weapon.melee.meleeweapon.probably_too_heavy=Πιθανώς αυτό το όπλο είναι πολύ βαρύ για εσάς.
items.weapon.melee.meleeweapon.prompt=Επιλέξτε έναν στόχο
items.weapon.melee.meleeweapon.stats_known=Αυτό το όπλο μάχης σώμα με σώμα _tier-%1$d_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.melee.meleeweapon.stats_unknown=Συνήθως αυτό το όπλο μάχης σώμα με σώμα _tier-%1$d_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί σωστά.
items.weapon.melee.meleeweapon.swap=Ανταλλαγή όπλων
items.weapon.melee.meleeweapon.swap_full=Δεν μπορείς να το κάνεις αυτό με ένα πλήρες απόθεμα.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Ζημιά Ικανότητας
items.weapon.melee.quarterstaff$defensivestance.desc=Η Μονομάχος χρησιμοποιεί το ραβδί της για να εκτρέπει τα εισερχόμενα χτυπήματα και τα βλήματα. Όσο βρίσκεται σε αυτή τη στάση, η αποφυγή όλων των επιθέσεων τριπλασιάζεται. \n\nΣτροφές που απομένουν: %s.
items.weapon.melee.quarterstaff$defensivestance.name=αμυντική στάση
items.weapon.melee.quarterstaff.ability_desc=Ο Μονομάχος μπορεί να πάρει _αμυντική στάση_ με ένα ραβδί. Αυτή η στάση ενεργοποιείται χωρίς χρόνο και τριπλασιάζει την αποφυγή της για τους γύρους _%d._
items.weapon.melee.quarterstaff.ability_name=αμυντική στάση
items.weapon.melee.quarterstaff.desc=Ένα μπαστούνι από σκληρό ξύλο, με τις άκρες του να είναι σιδερένιες.
items.weapon.melee.quarterstaff.name=ρόπαλο με σιδηράν αιχμήν
items.weapon.melee.quarterstaff.stats_desc=Αυτό το όπλο μπλοκάρει ζημιά 0-2.
items.weapon.melee.quarterstaff.typical_ability_desc=Ο Μονομάχος μπορεί να πάρει _αμυντική στάση_ με ένα ραβδί. Αυτή η στάση δεν χρειάζεται χρόνο για να ενεργοποιηθεί και τριπλασιάζει την αποφυγή της, συνήθως για τους γύρους _%d._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.rapier.ability_desc=Ο Μονομάχος μπορεί να _επιτεθεί_ με ένα ξίφος σε έναν εχθρό που βρίσκεται 1 πλακίδιο μακριά. Αυτό κινείται προς τον εχθρό, προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει.
items.weapon.melee.rapier.ability_name=ξιφίζω
items.weapon.melee.rapier.desc=Ένα λεπτό, ίσιο σπαθί που προσφέρει κάποια προστασία σε αντάλλαγμα για λιγότερη δύναμη κοπής.
items.weapon.melee.rapier.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.rapier.name=ξίφος
items.weapon.melee.rapier.stats_desc=Αυτό το όπλο μπλοκάρει ζημιά 0-1.
items.weapon.melee.rapier.typical_ability_desc=Ο Μονομάχος μπορεί να _επιτεθεί_ με ένα ξίφος σε έναν εχθρό που βρίσκεται 1 πλακίδιο μακριά. Αυτό κινείται προς τον εχθρό, συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα τον χτυπήσει.
items.weapon.melee.roundshield$guardtracker.desc=Η Μονομάχος έχει ετοιμάσει την ασπίδα της εν αναμονή των επερχόμενων επιθέσεων. Οι φυσικές ή μαγικές επιθέσεις εναντίον της θα εξουδετερωθούν εντελώς.\n\nΥπολειπόμενοι γύροι: %s.
items.weapon.melee.roundshield$guardtracker.guarded=επιφυλακτικός
items.weapon.melee.roundshield$guardtracker.name=φρούρηση
items.weapon.melee.roundshield.ability_desc=Η Μονομάχος μπορεί να _προστατευθεί_ με μια στρογγυλή ασπίδα, εξουδετερώνοντας εντελώς όλες τις φυσικές ή μαγικές επιθέσεις που γίνονται εναντίον της για τους γύρους _%d_. Μόλις η Μονομάχος μπλοκάρει μια επίθεση, η αντεπίθεση ή η χρήση μαγείας θα τερματίσει την προστασία.
items.weapon.melee.roundshield.ability_name=φρουρά
items.weapon.melee.roundshield.desc=Αυτή η μεγάλη ασπίδα μπλοκάρει αποτελεσματικά τις επιθέσεις και αποτελεί ένα αξιοπρεπές όπλο σε περίπτωση ανάγκης.
items.weapon.melee.roundshield.name=στρογγυλή ασπίδα
items.weapon.melee.roundshield.stats_desc=Αυτό το όπλο μπλοκάρει ζημιά 0-%d. Αυτό το μπλοκάρισμα κλιμακώνεται με τις αναβαθμίσεις.
items.weapon.melee.roundshield.typical_ability_desc=Η Μονομάχος μπορεί να _προστατευθεί_ με μια στρογγυλή ασπίδα, εξουδετερώνοντας εντελώς όλες τις φυσικές ή μαγικές επιθέσεις που γίνονται εναντίον της, συνήθως στους γύρους _%d_. Μόλις η Μονομάχος μπλοκάρει μια επίθεση, η αντεπίθεση ή η χρήση μαγείας θα τερματίσει την προστασία.
items.weapon.melee.roundshield.typical_stats_desc=Συνήθως, αυτό το όπλο μπλοκάρει ζημιά 0-%d. Αυτό το μπλοκάρισμα κλιμακώνεται με τις αναβαθμίσεις.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.runicblade.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _ρουνικό χτύπημα_ με μια ρουνική λεπίδα. Αυτή η επίθεση είναι εγγυημένη και έχει _+%d%% μαγική δύναμη._
items.weapon.melee.runicblade.ability_name=ρουνική κάθετος
items.weapon.melee.runicblade.desc=Ένα μυστηριώδες όπλο από μια μακρινή χώρα, με μια φωτεινή μπλε λεπίδα.
items.weapon.melee.runicblade.name=ρουνική λεπίδα
items.weapon.melee.runicblade.stats_desc=Αυτό το όπλο επωφελείται περισσότερο από αναβαθμίσεις.
items.weapon.melee.runicblade.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _ρουνικό χτύπημα_ με μια ρουνική λεπίδα. Αυτή η επίθεση είναι εγγυημένη για επιτυχία και συνήθως έχει _+%d%% μαγική δύναμη._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Δύναμη Ικανότητας
items.weapon.melee.sai$combostriketracker.desc=Ο Μονομάχος κατασκευάζει συνδυασμούς που μπορούν να χρησιμοποιηθούν για την αύξηση της ζημιάς της ικανότητας συνδυαστικού χτυπήματος. Κάθε επιτυχημένη κανονική μάχη σώμα με σώμα ή επίθεση με όπλο που πετάγεται θα μετρήσει, αλλά η μη επιτυχημένη επίθεση για 5 γύρους μηδενίζει αυτόν τον συνδυασμό.\n\nΠρόσφατες επιτυχίες: %1$d.\n\nΓυρίζει μέχρι να χαθούν τα χτυπήματα: %2$s.
items.weapon.melee.sai$combostriketracker.name=συνδυαστική απεργία
items.weapon.melee.sai.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με sai. Αυτή η επίθεση είναι εγγυημένη για χτύπημα και προκαλεί _+%d ζημιά_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με ρίψη όπλου. Αν δεν χτυπήσετε για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.sai.ability_name=συνδυαστική απεργία
items.weapon.melee.sai.desc=Δύο λεπτές λεπίδες που προορίζονται για χρήση με το ένα χέρι η καθεμία. Εξαιρετικές για να εξοντώνετε εχθρούς με μια σειρά από κοψίματα.
items.weapon.melee.sai.name=σάι
items.weapon.melee.sai.stats_desc=Αυτό είναι ένα πολύ γρήγορο όπλο.
items.weapon.melee.sai.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _combo strike_ με sai. Αυτή η επίθεση είναι εγγυημένη για να πετύχει και συνήθως προκαλεί _+%d damage_ για κάθε φορά που ο Μονομάχος έχει χτυπήσει με μια κανονική επίθεση σώμα με σώμα ή με ρίψη όπλου. Αν δεν χτυπήσει για 5 γύρους, αυτό το combo επαναφέρεται.
items.weapon.melee.scimitar$sworddance.desc=Η Μονομάχος κάνει γρήγορα χτυπήματα βασισμένα στην ορμή σε ένα είδος χορού. Ενώ αυτή η στάση είναι ενεργή, επιτίθεται 60%% πιο γρήγορα (αρκετά για να επιτεθεί ακριβώς δύο φορές σε έναν γύρο με ένα γιαταγάνι) και έχει ακρίβεια +50%%.\n\nΥπολειπόμενοι γύροι: %s.
items.weapon.melee.scimitar$sworddance.name=χορός με σπαθιά
items.weapon.melee.scimitar.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει έναν _χορό σπαθιού_ με ένα γιαταγάνι. Αυτή η στάση ενεργοποιείται χωρίς χρόνο και του δίνει ταχύτητα επίθεσης +60%% και ακρίβεια +50%% για τους γύρους _%d._
items.weapon.melee.scimitar.ability_name=χορός με σπαθιά
items.weapon.melee.scimitar.desc=Μια παχιά καμπυλωτή λεπίδα. Το σχήμα της επιτρέπει γρηγορότερες, αλλά λιγότερο ισχυρές επιθέσεις.
items.weapon.melee.scimitar.name=γιαταγάνι
items.weapon.melee.scimitar.stats_desc=Αυτό είναι ένα αρκετά γρήγορο όπλο.
items.weapon.melee.scimitar.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει έναν _χορό σπαθιού_ με ένα γιαταγάνι. Αυτή η στάση ενεργοποιείται χωρίς χρόνο και του δίνει ταχύτητα επίθεσης +60%% και ακρίβεια +50%%, συνήθως για τους γύρους _%d._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Διάρκεια Ικανότητας
items.weapon.melee.shortsword.ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα κοντό σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι άμεσο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.shortsword.ability_name=σχίζω
items.weapon.melee.shortsword.desc=Ένα αρκετά κοντό σπαθί, μόνο λίγα εκατοστά μακρύτερο από ένα στιλέτο.
items.weapon.melee.shortsword.name=κοντό σπαθί
items.weapon.melee.shortsword.typical_ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα κοντό σπαθί. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.sickle.ability_desc=Ο Μονομάχος μπορεί να _θερίσει_ έναν εχθρό με δρεπάνι. Αυτή η καταστροφική επίθεση είναι εγγυημένη για να χτυπήσει και προκαλεί _%d ζημιά_. Αυτή η ζημιά εφαρμόζεται ως αιμορραγία εάν ο στόχος δεν είναι άτρωτος.
items.weapon.melee.sickle.ability_name=συγκομιδή
items.weapon.melee.sickle.desc=Ένα φορητό γεωργικό εργαλείο που μπορεί να χρησιμεύσει και ως ισχυρό αλλά δυσκίνητο όπλο.
items.weapon.melee.sickle.name=δρεπάνι
items.weapon.melee.sickle.stats_desc=Αυτό είναι ένα μάλλον ανακριβές όπλο.
items.weapon.melee.sickle.typical_ability_desc=Ο Μονομάχος μπορεί να _θερίσει_ έναν εχθρό με δρεπάνι. Αυτή η καταστροφική επίθεση είναι εγγυημένη και συνήθως προκαλεί _%d ζημιά_. Αυτή η ζημιά εφαρμόζεται ως αιμορραγία εάν ο στόχος δεν είναι άτρωτος.
items.weapon.melee.spear.ability_desc=Ο Μονομάχος μπορεί να χρησιμοποιήσει την άκρη ενός δόρατος για να _καρφώσει_ έναν εχθρό που βρίσκεται σε εμβέλεια αλλά όχι δίπλα. Αυτό προκαλεί _%1$d-%2$d ζημιά_, απωθεί τον εχθρό και είναι εγγυημένο ότι θα χτυπήσει.
items.weapon.melee.spear.ability_name=ακίδα
items.weapon.melee.spear.desc=Μια λεπτή ξύλινη ράβδος με αιχμηρό σίδερο.
items.weapon.melee.spear.name=δόρυ
items.weapon.melee.spear.stats_desc=Αυτό είναι ένα μάλλον αργό όπλο. \nΑυτό το όπλο έχει επιπλέον εμβέλεια.
items.weapon.melee.spear.typical_ability_desc=Ο Μονομάχος μπορεί να χρησιμοποιήσει την άκρη ενός δόρατος για να _καρφώσει_ έναν εχθρό που βρίσκεται σε εμβέλεια αλλά όχι δίπλα. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_, απωθεί τον εχθρό και είναι εγγυημένο ότι θα χτυπήσει.
items.weapon.melee.sword$cleavetracker.desc=Η Μονομάχος είναι έτοιμη να συνεχίσει την προηγούμενη χρήση της. Η επόμενη χρήση της λειτουργίας της δεν θα κοστίσει καμία χρέωση ικανότητας όπλου.\n\nΓύροι που απομένουν: %s.
items.weapon.melee.sword$cleavetracker.name=σχίζω
items.weapon.melee.sword.ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.sword.ability_name=σχίζω
items.weapon.melee.sword.desc=Ένα όμορφα ισορροπημένο σπαθί. Όχι πολύ μεγάλο, αλλά αισθητά μακρύτερο από ένα κοντό σπαθί.
items.weapon.melee.sword.name=σπαθί
items.weapon.melee.sword.typical_ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα σπαθί. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Εάν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.warhammer.ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα πολεμικό σφυρί. Αυτή η συγκεντρωμένη επίθεση προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.warhammer.ability_name=βαρύ πλήγμα
items.weapon.melee.warhammer.desc=Λίγα πλάσματα μπορούν να αντέξουν το συντριπτικό χτύπημα αυτής της πανύψηλης μάζας από μόλυβδο και ατσάλι, αλλά χρειάζεται μεγάλη δύναμη για να τη χρησιμοποιήσει κανείς αποτελεσματικά.
items.weapon.melee.warhammer.name=πολεμικό σφυρί
items.weapon.melee.warhammer.stats_desc=Αυτό είναι ένα αρκετά ακριβές όπλο.
items.weapon.melee.warhammer.typical_ability_desc=Ο Μονομάχος μπορεί να εκτελέσει ένα _βαρύ χτύπημα_ με ένα πολεμικό σφυρί. Αυτή η συγκεντρωμένη επίθεση συνήθως προκαλεί _%1$d-%2$d ζημιά_ αν αιφνιδιάσει τον εχθρό και τον ζαλίζει για 5 γύρους, γεγονός που μειώνει την ακρίβεια και την αποφυγή κατά 50%%. Το βαρύ χτύπημα χτυπάει πάντα, αλλά προκαλεί κανονική ζημιά αν δεν αιφνιδιάσει τον εχθρό.
items.weapon.melee.warscythe.ability_desc=Ο Μονομάχος μπορεί να _θερίσει_ έναν εχθρό με ένα πολεμικό δρεπάνι. Αυτή η καταστροφική επίθεση είναι εγγυημένη ότι θα χτυπήσει και προκαλεί _%d ζημιά_. Αυτή η ζημιά εφαρμόζεται ως αιμορραγία εάν ο στόχος δεν είναι άτρωτος.
items.weapon.melee.warscythe.ability_name=συγκομιδή
items.weapon.melee.warscythe.desc=Αυτό το μεγάλο και δύσχρηστο εργαλείο έχει ενισχυθεί ώστε να είναι καλύτερο στο κόψιμο εχθρών παρά στις καλλιέργειες.
items.weapon.melee.warscythe.name=πολεμικό δρεπάνι
items.weapon.melee.warscythe.stats_desc=Αυτό είναι ένα μάλλον ανακριβές όπλο.
items.weapon.melee.warscythe.typical_ability_desc=Ο Μονομάχος μπορεί να _θερίσει_ έναν εχθρό με ένα πολεμικό δρεπάνι. Αυτή η καταστροφική επίθεση είναι εγγυημένη και συνήθως προκαλεί _%d ζημιά_. Αυτή η ζημιά εφαρμόζεται ως αιμορραγία εάν ο στόχος δεν είναι άτρωτος.
items.weapon.melee.whip.ability_desc=Η Μονομάχος μπορεί να _μαστιγώσει_ όλους τους εχθρούς γύρω της με ένα μαστίγιο. Αυτή η ικανότητα προκαλεί _%1$d-%2$d ζημιά_, επιτίθεται σε όλους τους εχθρούς εντός εμβέλειας επίθεσης και είναι εγγυημένη η επιτυχία.
items.weapon.melee.whip.ability_name=μαστίγιο
items.weapon.melee.whip.desc=Ενώ το αγκαθωτό μήκος σχοινιού στο άκρο αυτού του όπλου προκαλεί μικρή ζημιά, η εμβέλειά του δεν μπορεί να συγκριθεί.
items.weapon.melee.whip.name=μαστίγιο
items.weapon.melee.whip.stats_desc=Αυτό το όπλο έχει τεράστια εμβέλεια.
items.weapon.melee.whip.typical_ability_desc=Η Μονομάχος μπορεί να _μαστιγώσει_ όλους τους εχθρούς γύρω της με ένα μαστίγιο. Αυτή η ικανότητα συνήθως προκαλεί _%1$d-%2$d ζημιά_, επιτίθεται σε όλους τους εχθρούς εντός εμβέλειας επίθεσης και είναι εγγυημένη η επιτυχία.
items.weapon.melee.wornshortsword.ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα φθαρμένο κοντό σπαθί. Αυτό προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.melee.wornshortsword.ability_name=σχίζω
items.weapon.melee.wornshortsword.desc=Ένα αρκετά κοντό σπαθί, φθαρμένο από την έντονη χρήση. Είναι ταυτόχρονα πιο αδύναμο και λίγο ελαφρύτερο από ένα κοντό σπαθί σε καλύτερη κατάσταση.
items.weapon.melee.wornshortsword.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.melee.wornshortsword.name=φθαρμένο κοντό σπαθί
items.weapon.melee.wornshortsword.typical_ability_desc=Ο Μονομάχος μπορεί να _κόψει_ έναν εχθρό με ένα φθαρμένο κοντό σπαθί. Αυτό συνήθως προκαλεί _%1$d-%2$d ζημιά_ και είναι εγγυημένο ότι θα χτυπήσει. Αν το κόψιμο σκοτώσει έναν εχθρό, είναι ακαριαίο και ο Μονομάχος μπορεί να χρησιμοποιήσει ξανά το κόψιμο εντός 5 γύρων δωρεάν.
items.weapon.missiles.bolas.desc=Αυτά τα ασυνήθιστα όπλα απόστασης δεν προκαλούν μεγάλη ζημιά, αλλά κάνουν εξαιρετική δουλειά στο να επιβραδύνουν τον στόχο τους.
items.weapon.missiles.bolas.name=μπόλα
items.weapon.missiles.bolas.stats_desc=Αυτό το όπλο προκαλεί παράλυση στον στόχο του.
items.weapon.missiles.boomerang.desc=Όταν ριχθεί στον εχθρό, αυτό το επίπεδο, κυρτό ξύλινο βλήμα θα επιστρέψει στα χέρια αυτού που το έριξε.
items.weapon.missiles.boomerang.durability=Λόγω της στιβαρής κατασκευής του, αυτό το μπούμερανγκ δεν θα σπάσει από τη χρήση.
items.weapon.missiles.boomerang.name=μπούμερανγκ
items.weapon.missiles.darts.adrenalinedart.desc=Αυτά τα βελάκια έχουν μια σύνθεση με βάση το swiftthistle, η οποία ενισχύει την ταχύτητα κίνησης και επίθεσης των συμμάχων ή μειώνει για λίγο την ταχύτητα κίνησης των εχθρών. Το ίδιο το βελάκι εξακολουθεί να είναι επιβλαβές για τους εχθρούς, αλλά δεν θα βλάψει τους συμμάχους.
items.weapon.missiles.darts.adrenalinedart.name=βέλος αδρεναλίνης
items.weapon.missiles.darts.blindingdart.desc=Αυτά τα βελάκια έχουν μια ουσία με βάση το τυφλόχορτο, η οποία θα τυφλώσει τον στόχο τους για μικρό χρονικό διάστημα. Ωστόσο, δεν αποπροσανατολίζουν, επομένως ο εχθρός θα ξέρει ακόμα πού σας είδε τελευταία φορά.
items.weapon.missiles.darts.blindingdart.name=εκτυφλωτικό βέλος
items.weapon.missiles.darts.chillingdart.desc=Αυτά τα βελάκια έχουν στην άκρη μια σύνθεση με βάση το παγοκάλυμμα, η οποία θα ψύξει σημαντικά τον στόχο τους.
items.weapon.missiles.darts.chillingdart.name=ανατριχιαστικό βέλος
items.weapon.missiles.darts.cleansingdart.desc=Αυτά τα βελάκια έχουν μια σύνθεση με βάση το mageroyal, η οποία προσωρινά θα κάνει τους συμμάχους άτρωτους σε όλες τις αρνητικές επιδράσεις ή θα καθαρίσει τις θετικές επιδράσεις από τους εχθρούς. Οι εχθροί μπορεί ακόμη και να ξεχάσουν για λίγο ότι σας επιτίθενται ή ότι σας τρέπονται σε φυγή. Το ίδιο το βελάκι εξακολουθεί να είναι επιβλαβές για τους εχθρούς, αλλά δεν θα βλάψει τους συμμάχους.
items.weapon.missiles.darts.cleansingdart.name=βέλος καθαρισμού
items.weapon.missiles.darts.dart.ac_tip=ΑΚΡΟ
items.weapon.missiles.darts.dart.desc=Αυτά τα απλά ξύλινα κοντάρια με αιχμηρές άκρες φέρουν βάρος για να πετούν πιστά και να τσιμπούν το θήραμά τους με μια κίνηση του καρπού. Μπορούν να ενισχυθούν με σπόρους για να αποκτήσουν επιπλέον εφέ όταν πετώνται.
items.weapon.missiles.darts.dart.name=βέλος
items.weapon.missiles.darts.dart.prompt=Επιλέξτε έναν σπόρο
items.weapon.missiles.darts.dart.tip_all=βελάκια %1$d με σπόρους %2$d
items.weapon.missiles.darts.dart.tip_cancel=ματαίωση
items.weapon.missiles.darts.dart.tip_desc=Ένας σπόρος μπορεί να συνδυαστεί με ένα ή δύο βέλη για να τον ρίξετε στην άκρη. Κάθε τύπος σπόρου παράγει τον δικό του τύπο βέλους με άκρη, με ένα μοναδικό εφέ μίας χρήσης.\n\nΤο να ρίξετε στην άκρη ένα βέλος με αυτούς τους σπόρους θα παράγει ένα _%s._
items.weapon.missiles.darts.dart.tip_one=1 βελάκι με 1 σπόρο
items.weapon.missiles.darts.dart.tip_title=Βελάκια με άκρη
items.weapon.missiles.darts.dart.tip_two=2 βελάκια με 1 σπόρο
items.weapon.missiles.darts.dart.unlimited_uses=Λόγω της απλής κατασκευής τους, τα βελάκια θα διαρκέσουν για πάντα.
items.weapon.missiles.darts.displacingdart.desc=Αυτά τα βελάκια έχουν στην άκρη μια ένωση με βάση το fadeleaf, η οποία τηλεμεταφέρει τον στόχο τους σε μικρή απόσταση.
items.weapon.missiles.darts.displacingdart.name=εκτοπίζοντας βέλος
items.weapon.missiles.darts.healingdart.desc=Αυτά τα βελάκια έχουν μια σύνθεση με βάση το ηλιαχτίδα, η οποία προσφέρει μια έκρηξη θεραπείας στον στόχο τους. Το ίδιο το βελάκι εξακολουθεί να είναι επιβλαβές για τους εχθρούς, αλλά δεν θα βλάψει τους συμμάχους.
items.weapon.missiles.darts.healingdart.name=θεραπευτικό βέλος
items.weapon.missiles.darts.holydart.desc=Αυτά τα βελάκια έχουν μια σύνθεση με βάση το αστερόφυλλο, η οποία διοχετεύει ιερή ενέργεια στον στόχο τους. Οι σύμμαχοι και οι κανονικοί εχθροί θα γίνουν ευλογημένοι, αλλά οι νεκροζώντανοι ή οι δαιμονικοί εχθροί θα δεχτούν βαριά ζημιά. Το ίδιο το βελάκι εξακολουθεί να είναι επιβλαβές για τους εχθρούς, αλλά δεν θα βλάψει τους συμμάχους.
items.weapon.missiles.darts.holydart.name=ιερό βέλος
items.weapon.missiles.darts.incendiarydart.desc=Αυτά τα βελάκια έχουν στην άκρη μια σύνθεση με βάση την άνθιση της φωτιάς, η οποία θα εκραγεί σε λαμπερές φλόγες κατά την πρόσκρουση.
items.weapon.missiles.darts.incendiarydart.name=εμπρηστικό βέλος
items.weapon.missiles.darts.paralyticdart.desc=Αυτά τα βελάκια έχουν στην άκρη μια ένωση με βάση τη ρίζα του χώματος, η οποία θα παραλύσει τον στόχο τους για μικρό χρονικό διάστημα.
items.weapon.missiles.darts.paralyticdart.name=παραλυτικό βέλος
items.weapon.missiles.darts.poisondart.desc=Αυτά τα βελάκια έχουν στην άκρη μια ένωση με βάση το sorrowmoss, η οποία θα δηλητηριάσει τον στόχο τους.
items.weapon.missiles.darts.poisondart.name=δηλητηριώδες βέλος
items.weapon.missiles.darts.rotdart.desc=Αυτά τα αδίστακτα βελάκια έχουν μια όξινη ένωση με βάση το rotberry, η οποία θα διαβρώσει επιθετικά οτιδήποτε έρθει σε επαφή με το βέλος. Οι ισχυροί εχθροί θα αντισταθούν στο μεγαλύτερο μέρος της επίδρασης, αλλά η διάβρωση είναι αρκετά ισχυρή για να σκοτώσει εύκολα τους περισσότερους τυπικούς εχθρούς. Αυτά διαρκούν περισσότερο από άλλα βελάκια με μύτη, αλλά η αντοχή τους δεν μπορεί να ενισχυθεί.
items.weapon.missiles.darts.rotdart.discover_hint=Μπορείτε να δημιουργήσετε αυτό το αντικείμενο χρησιμοποιώντας έναν σπόρο από μια συγκεκριμένη αποστολή.
items.weapon.missiles.darts.rotdart.name=σάπιο βέλος
items.weapon.missiles.darts.shockingdart.desc=Αυτά τα βελάκια έχουν στην άκρη μια ένωση με βάση το Stormvine, η οποία θα προκαλέσει ένα άσχημο σοκ στον στόχο τους.
items.weapon.missiles.darts.shockingdart.name=σοκαριστικό βέλος
items.weapon.missiles.darts.tippeddart.about_to_break=Η άκρη του βελακιού σου πρόκειται να λήξει.
items.weapon.missiles.darts.tippeddart.ac_clean=ΚΑΘΑΡΟΣ
items.weapon.missiles.darts.tippeddart.cancel=ματαίωση
items.weapon.missiles.darts.tippeddart.clean_all=καθαρίστε τα πάντα
items.weapon.missiles.darts.tippeddart.clean_desc=Αυτή η ενέργεια θα αφαιρέσει την άκρη των σπόρων από τα βελάκια σας, επαναφέροντάς τα στην κανονική τους μορφή.
items.weapon.missiles.darts.tippeddart.clean_one=καθαρός
items.weapon.missiles.darts.tippeddart.clean_title=Καθαρά βελάκια
items.weapon.missiles.darts.tippeddart.discover_hint=Μπορείτε να αγοράσετε αυτό το προϊόν σε ένα κατάστημα ή να το δημιουργήσετε χρησιμοποιώντας έναν σπόρο.
items.weapon.missiles.darts.tippeddart.has_broken=Η άκρη του βελακιού σου έχει λήξει.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Αλλά αυτά είναι τόσο υψηλής ποιότητας που θα διαρκέσουν για πάντα._
items.weapon.missiles.darts.tippeddart.uses_left=Αυτή η στοίβα βελάκια έχει ακόμη _%d/%d_ χρήσεις πριν εξαντληθεί η μύτη της.
items.weapon.missiles.fishingspear.desc=Μικροσκοπικά δόρατα ρίψης που λειτουργούν καλά ως αυτοσχέδιο όπλο παρά το γεγονός ότι έχουν σχεδιαστεί για ψάρεμα.
items.weapon.missiles.fishingspear.name=δόρυ ψαρέματος
items.weapon.missiles.forcecube.desc=Αυτοί οι μαγικοί κύβοι με το παράξενο σχήμα είναι αρκετά μικροί για να τους χωρέσετε στο χέρι σας, αλλά είναι απίστευτα βαριοί.
items.weapon.missiles.forcecube.name=κύβος δύναμης
items.weapon.missiles.forcecube.ondeath=Αυτοκτόνησες με τον δικό σου Κύβο Δύναμης...
items.weapon.missiles.forcecube.stats_desc=Αυτό το όπλο απλώνει τη δύναμη της πρόσκρουσής του σε μια μικρή περιοχή, χτυπώντας οτιδήποτε βρίσκεται κοντά.
items.weapon.missiles.heavyboomerang.desc=Αυτό το μεγάλο μπούμερανγκ είναι δύσκολο να το χειριστείς αποτελεσματικά, αλλά θα προκαλέσει σημαντική ζημιά.
items.weapon.missiles.heavyboomerang.name=βαρύ μπούμερανγκ
items.weapon.missiles.heavyboomerang.stats_desc=Αυτό το όπλο κάνει κύκλους πίσω στην τοποθεσία από την οποία ρίχτηκε μετά από πέντε γύρους.
items.weapon.missiles.javelin.desc=Αυτά τα μεγαλύτερα δόρατα ρίψης έχουν βάρος για να κρατούν την αιχμή τους στην άκρη τους πιο μπροστά καθώς πλέουν στον αέρα.
items.weapon.missiles.javelin.name=ακόντιο
items.weapon.missiles.kunai.desc=Αυτά τα μικρά μαχαίρια είναι πολύ ισχυρά στα χέρια ενός έμπειρου χρήστη.
items.weapon.missiles.kunai.name=κουνάι
items.weapon.missiles.kunai.stats_desc=Αυτό το όπλο είναι ισχυρότερο ενάντια σε εχθρούς που δεν γνωρίζουν.
items.weapon.missiles.missileweapon$placeholder.name=εκτοξευμένο όπλο
items.weapon.missiles.missileweapon.about_to_break=Το όπλο που πετάχτηκες πρόκειται να σπάσει.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Αν το τελευταίο όπλο που έχει ριχθεί στο βελτιωμένο σετ όπλων που έχετε ρίξει σπάσει, το σετ θα χαθεί οριστικά. Είστε σίγουροι ότι θέλετε να το ρίξετε;
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Όχι
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ναί
items.weapon.missiles.missileweapon.curse_discover=Αυτό το όπλο που πετάχτηκε είναι καταραμένο!
items.weapon.missiles.missileweapon.distance=Τα εκτοξευόμενα όπλα είναι πιο ακριβή σε απόσταση, αλλά λιγότερο ακριβή σε κοντινή απόσταση.
items.weapon.missiles.missileweapon.durability=Τα πεταμένα όπλα θα φθαρούν και θα σπάσουν καθώς χρησιμοποιούνται.
items.weapon.missiles.missileweapon.dust=Το πεταμένο όπλο θρυμματίζεται σε σκόνη καθώς το αγγίζεις.
items.weapon.missiles.missileweapon.has_broken=Ένα από τα όπλα που έριξες έχει σπάσει.
items.weapon.missiles.missileweapon.probably_too_heavy=Πιθανώς αυτό το όπλο είναι πολύ βαρύ για εσάς.
items.weapon.missiles.missileweapon.stats_known=Αυτό το σετ όπλων που ρίχνονται _tier-%1$d_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί.
items.weapon.missiles.missileweapon.stats_unknown=Συνήθως αυτό το σετ όπλων που ρίχνονται _tier-%1$d_ προκαλεί _%2$d-%3$d ζημιά_ και απαιτεί _%4$d δύναμη_ για να χρησιμοποιηθεί.
items.weapon.missiles.missileweapon.unknown_uses=Συνήθως αυτό το σετ όπλων που ρίχνονται θα έχει _%d_ χρήσεις πριν σπάσει.
items.weapon.missiles.missileweapon.unlimited_uses=Αυτό το σετ είναι τόσο υψηλής ποιότητας που θα διαρκέσει για πάντα.
items.weapon.missiles.missileweapon.uses_left=Αυτό το σετ όπλων που ρίχνονται έχει ακόμη _%d/%d_ χρήσεις πριν σπάσει.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Πρόσφατα ρίξατε ένα σούρικεν αμέσως και πρέπει να περιμένετε πριν το κάνετε ξανά. Τα σούρικεν μπορούν ακόμα να ριχθούν, αλλά με την κανονική ταχύτητα του όπλου.\n\nΥπόλοιπες στροφές: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Χρόνος Αναμονής Shuriken
items.weapon.missiles.shuriken.desc=Αστερόμορφα κομμάτια μετάλλου με λεπίδες κοφτερές σαν ξυράφι, που προκαλούν μεγάλη ζημιά όταν βρίσκουν στόχο. Μπορούν να ριχτούν πολύ γρήγορα.
items.weapon.missiles.shuriken.name=σούρικεν
items.weapon.missiles.shuriken.stats_desc=Τα Shuriken μπορούν να πεταχτούν άμεσα με χρόνο αναμονής 20 στροφών.
items.weapon.missiles.throwingclub.desc=Ένα αρκετά απλό αλλά ανθεκτικό όπλο με ρίψη, ουσιαστικά μια μεγάλη πέτρα στερεωμένη σε ένα μπαστούνι.
items.weapon.missiles.throwingclub.name=λέσχη ρίψης
items.weapon.missiles.throwingclub.stats_desc=Αυτό το όπλο δεν κολλάει στους εχθρούς και μπορεί να συλλεχθεί αμέσως.
items.weapon.missiles.throwinghammer.desc=Αυτά τα βαριά σφυριά έχουν σχεδιαστεί για να εκτοξεύονται εναντίον ενός εχθρού. Η λεία, εξ ολοκλήρου μεταλλική κατασκευή τους σημαίνει ότι είναι αρκετά ανθεκτικά.
items.weapon.missiles.throwinghammer.name=ρίψη σφυριού
items.weapon.missiles.throwinghammer.stats_desc=Αυτό το όπλο δεν κολλάει στους εχθρούς και μπορεί να συλλεχθεί αμέσως.
items.weapon.missiles.throwingknife.desc=Αυτά τα ελαφριά μαχαίρια είναι ισορροπημένα ώστε να σχηματίζουν τόξο στον αέρα κατευθείαν προς τον στόχο τους.
items.weapon.missiles.throwingknife.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.missiles.throwingknife.name=μαχαίρι ρίψης
items.weapon.missiles.throwingknife.stats_desc=Αυτό το όπλο είναι ισχυρότερο ενάντια σε εχθρούς που δεν γνωρίζουν.
items.weapon.missiles.throwingspear.desc=Αυτά τα ελαφριά δόρατα έχουν λεπτά πλαίσια τα οποία έχουν σχεδιαστεί για να ρίπτονται και όχι για να ωθούνται.
items.weapon.missiles.throwingspear.name=ρίψη δόρυ
items.weapon.missiles.throwingspike.desc=Αυτά τα ανθεκτικά μυτερά μεταλλικά βελόνια προορίζονται για να εκτοξεύονται σε μακρινούς εχθρούς.
items.weapon.missiles.throwingspike.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.missiles.throwingspike.name=ρίψη ακίδας
items.weapon.missiles.throwingstone.desc=Αυτές οι πέτρες τρίβονται για να μπορούν να ρίχνονται με μεγαλύτερη δύναμη από μια κανονική πέτρα.
items.weapon.missiles.throwingstone.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.missiles.throwingstone.name=πετώντας πέτρα
items.weapon.missiles.tomahawk.desc=Αυτά τα τσεκούρια ρίψης έχουν μια οδοντωτή άκρη που σκίζεται καθώς κολλάνε σε έναν εχθρό.
items.weapon.missiles.tomahawk.name=πέλεκυς ερυθρόδερμου
items.weapon.missiles.tomahawk.stats_desc=Αυτό το όπλο προκαλεί _%1$d-%2$d αιμορραγία_ στον στόχο του.
items.weapon.missiles.tomahawk.typical_stats_desc=Αυτό το όπλο συνήθως προκαλεί _%1$d-%2$d αιμορραγία_ στον στόχο του.
items.weapon.missiles.trident.desc=Τεράστιες λόγχες ρίψης με τρεις θανατηφόρες αιχμές στην άκρη. Είναι ισχυρές, αλλά αρκετά βαριές.
items.weapon.missiles.trident.name=τρίαινα
items.weapon.spiritbow.ac_shoot=ΒΛΑΣΤΟΣ
items.weapon.spiritbow.desc=Ένα τόξο φτιαγμένο από αρχαίο μαγικό ξύλο. Η χορδή και οι χαρακτικές του τόξου λάμπουν με ένα απαλό μπλε φως. Όταν τραβηχτεί η χορδή, αυτό το τόξο θα δημιουργήσει ένα μαγικό βέλος που μπορεί να εκτοξευθεί εναντίον ενός εχθρού.
items.weapon.spiritbow.discover_hint=Ένας από τους ήρωες ξεκινά με αυτό το αντικείμενο.
items.weapon.spiritbow.name=πνευματικό τόξο
items.weapon.spiritbow.prompt=Επιλέξτε έναν στόχο
items.weapon.spiritbow.stats=Το τόξο δεν μπορεί να αναβαθμιστεί απευθείας, αλλά θα δυναμώνει σταθερά καθώς ανεβαίνετε επίπεδο. Στο τρέχον επίπεδό σας, τα βέλη που εκτοξεύονται από το τόξο θα προκαλούν _%1$d-%2$d ζημιά_ και απαιτούν _%3$d δύναμη_ για να χρησιμοποιηθούν σωστά.
items.weapon.weapon$enchantment.discover_hint=Μπορείτε να βρείτε ένα αντικείμενο με αυτό το εφέ τυχαία στο μπουντρούμι ή να προσπαθήσετε να το εφαρμόσετε σε ένα αντικείμενο μόνοι σας.
items.weapon.weapon$enchantment.enchant=μαγεία
items.weapon.weapon$enchantment.rankings_desc=Σκοτώθηκε από μια μαγεία
items.weapon.weapon.cursed=Μπορείτε να νιώσετε μια κακόβουλη μαγεία να παραμονεύει μέσα σε αυτό το όπλο.
items.weapon.weapon.cursed_worn=Επειδή αυτό το όπλο είναι καταραμένο, είσαι ανίσχυρος να το αφαιρέσεις.
items.weapon.weapon.enchant_hardened=Έχει _σκληρυνθεί._
items.weapon.weapon.enchanted=έχει ένα _%s._
items.weapon.weapon.excess_str=Λόγω της υπερβολικής δύναμής σας, θα προκαλέσετε _0-%d επιπλέον ζημιά_ με αυτό το όπλο.
items.weapon.weapon.faster=Είναι επαυξημένο για να ενισχύσει την _ταχύτητα._
items.weapon.weapon.hardened_no_enchant=Αυτό το όπλο έχει _σκληρυνθεί,_ αλλά προς το παρόν δεν είναι μαγεμένο.
items.weapon.weapon.hardening_gone=Η σκλήρυνση σε αυτό το όπλο έχει φθαρεί!
items.weapon.weapon.identify=Τώρα είστε αρκετά εξοικειωμένοι με το όπλο σας για να το αναγνωρίσετε.
items.weapon.weapon.incompatible=Η αλληλεπίδραση διαφορετικών τύπων μαγείας έχει ακυρώσει τη γοητεία αυτού του όπλου!
items.weapon.weapon.not_cursed=Αυτό το όπλο είναι απαλλαγμένο από κακόβουλη μαγεία.
items.weapon.weapon.stronger=Αυξάνεται για να ενισχύσει τη _ζημιά._
items.weapon.weapon.too_heavy=Λόγω της ανεπαρκούς δύναμής σας, αυτό το όπλο θα εμποδίσει την ταχύτητα επίθεσής σας, την ακρίβεια και την ικανότητά σας να αιφνιδιάσετε την επίθεση.
items.weapon.weapon.weak_cursed=Παρά την κατάρα, μπορείτε να αποεξοπλίσετε αυτό το όπλο.

items.keys.skeletonkey.desc=Αυτό το κλειδί φαίνεται σοβαρό: το κεφάλι του έχει σχήμα κρανίου. Πιθανώς μπορεί να ανοίξει κάποια σοβαρή πόρτα.
items.weapon.missiles.bombarrow.desc=Ένα βέλος με μια βόμβα προσαρτημένη. Κράτα απόσταση..
items.weapon.missiles.bombarrow.name=βέλος βόμβας
items.weapon.missiles.missileweapon.damage_desc=Αυτό το όπλο προκαλεί ζημιά από _%1$d_ έως _%2$d_ ανά χτύπημα.
items.bags.seedpouch.desc=Αυτό το μικρό βελούδινο πουγκί χωράει όσους σπόρους θέλεις. Πολύ βολικό.
items.bags.seedpouch.name=σακούλα σπόρων
items.potions.potionofmight.desc=Αυτό το ισχυρό υγρό διατρέχει τους μυς σου, αυξάνοντας μόνιμα τη δύναμή σου κατά έναν πόντο και την υγεία σου κατά πέντε.
items.potions.potionofmight.name=φίλτρο ισχύος
items.rings.ringofdetection.desc=Με αυτό το δαχτυλίδι μπορείς να εντοπίζεις κρυμμένες παγίδες και μυστικές πόρτες χωρίς να χάνεις χρόνο ψάχνοντας. Τα εξασθενημένα δαχτυλίδια ανίχνευσης αμβλύνουν τις αισθήσεις σου, κάνοντας τα μυστικά δυσκολότερα να βρεθούν ακόμη και όταν ψάχνεις.
items.rings.ringofdetection.name=δαχτυλίδι ανίχνευσης
items.rings.ringofhaggler.desc=Αυτό το δαχτυλίδι δεν έχει στην πραγματικότητα μαγική δύναμη. Δείχνει όμως στους εμπόρους ότι ο κάτοχός του ανήκει στη Συντεχνία των Κλεφτών. Συνήθως δίνουν πρόθυμα έκπτωση με αντάλλαγμα την υπόσχεση ότι θα τους αφήσουν για λίγο ήσυχους. Η αναβάθμιση του δαχτυλιδιού δεν προσφέρει επιπλέον οφέλη.
items.rings.ringofhaggler.name=Δαχτυλίδι του Παζαράτη
items.rings.ringofherbalism.desc=Αυτό το δαχτυλίδι αυξάνει την πιθανότητα να βρεις δροσοσταλίδες και σπόρους πατώντας το χορτάρι.
items.rings.ringofherbalism.name=Δαχτυλίδι Βοτανοθεραπείας
items.rings.ringofmending.desc=Αυτό το δαχτυλίδι ενισχύει την αναγέννηση του σώματος, ώστε να ανακτάς γρηγορότερα τη χαμένη υγεία. Τα εξασθενημένα δαχτυλίδια επιβραδύνουν ή ακόμη και σταματούν τη φυσική ανάρρωση.
items.rings.ringofmending.name=δαχτυλίδι αναγέννησης
items.rings.ringofpower.desc=Το ενεργειακό πεδίο αυτού του δαχτυλιδιού ενισχύει τα ραβδιά σου. Τα εξασθενημένα δαχτυλίδια δύναμης τα αποδυναμώνουν.
items.rings.ringofpower.name=Δαχτυλίδι Δύναμης
items.rings.ringofsatiety.desc=Με αυτό το δαχτυλίδι αντέχεις περισσότερο χωρίς φαγητό. Τα εξασθενημένα δαχτυλίδια κορεσμού έχουν το αντίθετο αποτέλεσμα.
items.rings.ringofsatiety.name=Δαχτυλίδι Κορεσμού
items.rings.ringofshadows.desc=Οι εχθροί θα είναι λιγότερο πιθανό να σας προσέξουν αν φοράτε αυτό το δαχτυλίδι. Οι υποβαθμισμένοι δακτύλιοι από σκιές θα ειδοποιούν τους εχθρούς που διαφορετικά μπορεί να μην είχαν προσέξει την παρουσία σας.
items.rings.ringofshadows.name=Δαχτυλίδι των Σκιών
items.rings.ringofthorns.desc=Το δαχτυλίδι δεν έχει αληθινά αγκάθια, αλλά όποιος σου επιτίθεται δέχεται ο ίδιος μέρος της ζημιάς που προκαλεί. Η αναβάθμισή του δεν προσφέρει επιπλέον οφέλη.
items.rings.ringofthorns.name=Δαχτυλίδι από αγκάθια
items.scrolls.scrollofchallenge.desc=Όταν διαβαστεί φωναχτά, αυτός ο πάπυρος θα εξαπολύσει ένα απαιτητικό βρυχηθμό που θα ξυπνήσει όλα τα τέρατα και θα τα ειδοποιήσει για την τοποθεσία του αναγνώστη.
items.scrolls.scrollofchallenge.name=πάπυρος πρόκλησης
items.scrolls.scrollofenchantment.desc=Αυτός ο πάπυρος μπορεί να εμπλουτίσει ένα όπλο ή μια πανοπλία με μια τυχαία γοητεία, δίνοντάς του μια ειδική δύναμη.
items.scrolls.scrollofenchantment.name=πάπυρος μαγικής ενίσχυσης
items.scrolls.scrollofpsionicblast.desc=Αυτός ο πάπυρος περιέχει καταστροφική ενέργεια, η οποία μπορεί να διοχετευτεί ψυχολογικά για να προκαλέσει τεράστια ζημιά σε όλα τα πλάσματα εντός ενός οπτικού πεδίου. Μια συνοδευτική λάμψη φωτός θα τυφλώσει προσωρινά όλους στην περιοχή επίδρασης, συμπεριλαμβανομένου του αναγνώστη του πάπυρου.
items.scrolls.scrollofpsionicblast.name=πάπυρος ψιονικής έκρηξης
items.scrolls.scrollofwipeout.desc=Διάβασε αυτόν τον πάπυρο για να εξαπολύσεις την οργή των πνευμάτων των μπουντρουμιών, σκοτώνοντας τα πάντα στο τρέχον επίπεδο. Λοιπόν, σχεδόν τα πάντα. Μερικά από τα πιο ισχυρά πλάσματα μπορεί να μην επηρεαστούν.
items.scrolls.scrollofwipeout.name=πάπυρος αφανισμού
items.wands.wandofblink.desc=Αυτό το ραβδί σου επιτρέπει να τηλεμεταφέρεσαι προς την επιλεγμένη κατεύθυνση. Πλάσματα και άψυχα εμπόδια σταματούν την τηλεμεταφορά.
items.wands.wandofblink.name=ραβδί τηλεμεταφοράς
items.wands.wandoffirebolt.desc=Αυτό το ραβδί εκτοξεύει ριπές μαγικής φωτιάς. Ανάβει το εύφλεκτο έδαφος και τραυματίζει και καίει το πλάσμα που πετυχαίνει.
items.wands.wandoffirebolt.name=ραβδί πύρινου βλήματος
