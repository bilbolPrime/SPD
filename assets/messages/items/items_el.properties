items.food.blandfruit$chunks.desc=Το άγευστο φρούτο έχει εκραγεί κατά την πρόσκρουση, αφήνοντας πίσω του αδρανή κομμάτια. \n\n Παρά την λίγη βρωμιά, αυτά τα μεγάλα κομμάτια μαγειρεμένου άγευστου φρούτου φαίνονται τέλεια βρώσιμα.
