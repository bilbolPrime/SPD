items.heap.locked_chest_desc=Δεν θα ξέρεις τι υπάρχει μέσα μέχρι να το ανοίξεις! Αλλά για να το ανοίξεις χρειάζεσαι ένα χρυσό κλειδί.
items.heap.remains=Τα λείψανα του ήρωα
items.heap.remains_desc=Αυτό είναι ό,τι έχει απομείνει από έναν από τους προκατόχους σας. Ίσως αξίζει να ελέγξετε για τυχόν πολύτιμα αντικείμενα.
items.heap.ring=ένα δαχτυλίδι
items.heap.skeleton=Σκελετικά υπολείμματα
items.heap.skeleton_desc=Αυτό είναι ό,τι έχει απομείνει από κάποιον άτυχο τυχοδιώκτη. Ίσως αξίζει να ψάξετε για τυχόν πολύτιμα αντικείμενα.
items.heap.tomb=Τάφος
items.heap.tomb_desc=Αυτός ο αρχαίος τάφος μπορεί να περιέχει κάτι χρήσιμο, αλλά ο κάτοχός του σίγουρα θα αντιταχθεί στον έλεγχο.
items.heap.wand=ένα ραβδί
items.honeypot$shatteredpot.desc=Η γλάστρα έχει θρυμματιστεί, μόνο το κολλώδες μέλι που καλύπτει τα τοιχώματά της την κρατά ενωμένη και σιγά σιγά διαλύεται. \n\nΠαρά την κατεστραμμένη της κατάσταση, η μέλισσα φαίνεται να θέλει ακόμα να προστατεύσει την γλάστρα.
items.honeypot$shatteredpot.name=θρυμματισμένο δοχείο μελιού
items.honeypot.ac_shatter=ΘΡΥΜΜΑΤΙΖΩ
items.honeypot.desc=Αυτή η μεγάλη γλάστρα είναι στην πραγματικότητα επενδυμένη μόνο με μέλι, αντίθετα φιλοξενεί μια γιγάντια μέλισσα! Αυτού του είδους οι τεράστιες μέλισσες συνήθως μένουν στις κυψέλες τους, ίσως η γλάστρα να είναι κάποιο είδος εξειδικευμένου κλουβιού για παγιδευτές; Η μέλισσα φαίνεται αρκετά ικανοποιημένη μέσα στην γλάστρα με το μέλι της και σας βουίζει επιφυλακτικά όταν την κοιτάτε.
