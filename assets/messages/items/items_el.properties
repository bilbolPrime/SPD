items.artifacts.driedrose.desc=Είναι αυτό το τριαντάφυλλο που ανέφερε το φάντασμα πριν εξαφανιστεί; Φαίνεται να κατέχει κάποια πνευματική δύναμη, ίσως μπορεί να χρησιμοποιηθεί για να διοχετεύσει την ενέργεια αυτού του χαμένου πολεμιστή.
