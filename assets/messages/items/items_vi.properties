items.artifacts.skeletonkey$keywall.desc=Chiếc chìa khóa vạn năng đã tạo ra một bức tường ma thuật tạm thời ở đây.
items.artifacts.skeletonkey.ac_insert=CHÈN
items.artifacts.skeletonkey.crystal_charges=Để mở khóa pha lê cần 5 lần sạc.
items.artifacts.skeletonkey.cursed=Bạn không thể sử dụng chìa khóa vạn năng bị nguyền rủa.
items.artifacts.skeletonkey.desc=Một chiếc chìa khóa trông rất quan trọng với phần đầu hình hộp sọ. Răng của nó dường như thay đổi mỗi khi bạn nhìn vào.
items.artifacts.skeletonkey.desc_cursed=Chiếc chìa khóa bị nguyền rủa dường như đang cố tình tránh khớp với bất kỳ ổ khóa nào, và thậm chí còn khiến bạn khó (nhưng không phải là không thể) sử dụng những chiếc chìa khóa khác.
items.artifacts.skeletonkey.desc_worn=Chiếc chìa khóa ma thuật này dường như càng mạnh hơn khi bạn sử dụng nó thay vì những chiếc chìa khóa thông thường của hầm ngục. Nó có thể được cắm vào hầu hết mọi ổ khóa trong hầm ngục để mở hoặc đóng chúng, kể cả những cánh cửa chưa từng bị khóa trước đây. Chìa khóa thậm chí có thể được sử dụng trên không gian trống theo hướng chính hoặc chéo để 'khóa' không khí phía trước bạn, tạo ra một bức tường vững chắc rộng 3 ô kéo dài 10 lượt. Việc khóa sẽ đẩy lùi kẻ thù nếu có đủ không gian.
items.artifacts.skeletonkey.discard=Bạn loại bỏ những chìa khóa thừa.
items.artifacts.skeletonkey.force_lock=Ổ khóa đã yếu đi vì không có chìa khóa vạn năng của bạn. Bạn đã tìm cách cạy nó ra.
items.artifacts.skeletonkey.gold_charges=Mở khóa vàng cần 2 lần sạc.
items.artifacts.skeletonkey.invalid_target=Ở đó không có gì để khóa hay mở khóa cả.
items.artifacts.skeletonkey.iron_charges=Mở một ổ khóa thông thường cần 1 lần sạc.
items.artifacts.skeletonkey.levelup=Chìa khóa vạn năng của bạn ngày càng mạnh mẽ hơn!
items.artifacts.skeletonkey.lock_charges=Việc khóa cửa cần 2 lần sạc.
items.artifacts.skeletonkey.lock_no_space=Bạn không thể nhốt một nhân vật bên trong cánh cửa!
items.artifacts.skeletonkey.locked_with_key=Cánh cửa đó đã bị khóa bằng chiếc chìa khóa vạn năng của bạn.
items.artifacts.skeletonkey.name=chìa khóa vạn năng
items.artifacts.skeletonkey.prompt=Chọn mục tiêu
items.artifacts.skeletonkey.wall_charges=Việc tạo một bức tường tạm thời cần 2 lần sử dụng.
items.artifacts.skeletonkey.wont_open=Không hiểu sao chìa khóa lại không vừa với ổ khóa này.
items.artifacts.talismanofforesight$foresight.desc=Bạn cảm thấy rất lo lắng, như thể có một mối nguy hiểm vô hình đang rình rập gần đó.
items.artifacts.talismanofforesight$foresight.name=tầm nhìn xa
items.artifacts.talismanofforesight$foresight.uneasy=Bạn cảm thấy không thoải mái.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Một viên đá nhẵn bóng với những hình khắc kỳ lạ trên đó. Bạn có cảm giác như nó đang quan sát mọi thứ xung quanh, để mắt đến bất cứ điều gì bị che giấu.
items.artifacts.talismanofforesight.desc_cursed=Chiếc bùa chú bị nguyền rủa đang nhìn chằm chằm vào bạn, làm tê liệt các giác quan của bạn.
items.artifacts.talismanofforesight.desc_worn=Khi cầm bùa hộ mệnh, bạn sẽ cảm thấy các giác quan của mình trở nên nhạy bén hơn. Bùa hộ mệnh sẽ từ từ tích lũy năng lượng theo thời gian và khi bạn phát hiện ra những cánh cửa hoặc cạm bẫy ẩn. Bùa hộ mệnh có thể sử dụng năng lượng của nó để "quan sát" theo hình nón, tiết lộ tất cả các ô và bí mật trong khu vực được quét, và sẽ cho bạn tầm nhìn về kẻ thù và vật phẩm trong một thời gian ngắn.
items.artifacts.talismanofforesight.full_charge=Bùa hộ mệnh của bạn đã được sạc đầy!
items.artifacts.talismanofforesight.levelup=Bùa hộ mệnh của bạn ngày càng mạnh mẽ hơn!
items.artifacts.talismanofforesight.low_charge=Bùa hộ mệnh cần ít nhất 5% năng lượng để có thể sử dụng khả năng soi chiếu.
items.artifacts.talismanofforesight.name=bùa hộ mệnh của sự tiên đoán
items.artifacts.talismanofforesight.prompt=Chọn vị trí cần quét.
items.artifacts.timekeepershourglass$sandbag.desc=Túi cát mịn nhỏ này sẽ rất phù hợp với đồng hồ cát của bạn.\n\nThật kỳ lạ là người bán hàng lại có món đồ này đúng lúc bạn cần...
items.artifacts.timekeepershourglass$sandbag.levelup=Bạn bỏ cát vào đồng hồ cát.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Đồng hồ cát của bạn chứa đầy cát thần kỳ!
items.artifacts.timekeepershourglass$sandbag.name=túi cát thần kỳ
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Bạn không có đồng hồ cát để đựng cát này.
items.artifacts.timekeepershourglass$timefreeze.desc=Thời gian như bị đóng băng xung quanh bạn, cho phép bạn thực hiện các hành động ngay lập tức. Hiệu ứng này sẽ kéo dài cho đến khi bị hủy bỏ hoặc đồng hồ cát của bạn hết năng lượng. Tấn công hoặc sử dụng phép thuật cũng sẽ phá vỡ hiệu ứng này.\n\nLượt cho đến khi sử dụng năng lượng: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Thời gian đóng băng
items.artifacts.timekeepershourglass.ac_activate=KÍCH HOẠT
items.artifacts.timekeepershourglass.cursed=Bạn không thể sử dụng đồng hồ cát bị nguyền rủa.
items.artifacts.timekeepershourglass.deactivate=Bạn tắt chức năng đóng băng thời gian.
items.artifacts.timekeepershourglass.desc=Chiếc đồng hồ cát lớn, được trang trí công phu này trông khá bình thường, nhưng bạn cảm nhận được một sức mạnh to lớn trong khung chạm khắc tinh xảo của nó. Khi bạn xoay đồng hồ cát và nhìn cát chảy ra, bạn có thể cảm nhận được ma thuật của nó đang níu kéo bạn, chắc chắn việc sử dụng ma thuật này sẽ cho bạn một chút quyền kiểm soát thời gian.
items.artifacts.timekeepershourglass.desc_cursed=Chiếc đồng hồ cát bị nguyền rủa đang khóa chặt bên cạnh bạn, bạn có thể cảm nhận được nó đang cố gắng thao túng dòng chảy thời gian của mình.
items.artifacts.timekeepershourglass.desc_hint=Hình như chiếc đồng hồ cát đã hết cát rồi, giá mà bạn tìm được chút cát đó...
items.artifacts.timekeepershourglass.freeze=Hãy đóng băng thời gian xung quanh tôi
items.artifacts.timekeepershourglass.name=đồng hồ cát của người giữ thời gian
items.artifacts.timekeepershourglass.no_charge=Đồng hồ cát của bạn chưa được nạp đủ năng lượng để sử dụng.
items.artifacts.timekeepershourglass.onfreeze=Mọi thứ xung quanh bạn đột nhiên đóng băng.
items.artifacts.timekeepershourglass.onstasis=Thế giới dường như thay đổi xung quanh bạn trong chớp mắt.
items.artifacts.timekeepershourglass.prompt=Bạn muốn sử dụng phép thuật của đồng hồ cát như thế nào?\n\nKhi ở trạng thái bất động, thời gian sẽ trôi bình thường trong khi bạn bị đóng băng và hoàn toàn bất khả xâm phạm, tiêu hao tối đa 2 lượt sử dụng mỗi lần.\n\nKhi thời gian bị đóng băng, bạn có thể di chuyển như thể hành động của mình không tốn thời gian. Có thể tắt hiệu ứng này bất cứ lúc nào bằng cách sử dụng đồng hồ cát hoặc tấn công.
items.artifacts.timekeepershourglass.stasis=Đặt bản thân vào trạng thái tĩnh
items.artifacts.unstablespellbook.ac_add=THÊM VÀO
items.artifacts.unstablespellbook.ac_read=ĐỌC
items.artifacts.unstablespellbook.blinded=Bạn không thể đọc sách khi bị bịt mắt.
items.artifacts.unstablespellbook.cursed=Bạn không thể đọc sách phép thuật bị nguyền rủa.
items.artifacts.unstablespellbook.desc=Cuốn sách này vẫn còn trong tình trạng tốt đáng ngạc nhiên so với tuổi đời của nó. Nó phát ra những tiếng lách tách và sủi bọt khi bạn lật từng trang, tràn đầy năng lượng bất ổn. Nếu bạn đọc từ cuốn sách này, không ai biết bạn có thể niệm được phép thuật gì.
items.artifacts.unstablespellbook.desc_cursed=Cuốn sách bị nguyền rủa đã trói buộc bạn, nó đang cản trở khả năng sử dụng hầu hết các cuộn phép thuật của bạn.
items.artifacts.unstablespellbook.desc_empowered=Những cuộn giấy mà bạn đã thêm vào cuốn sách đang tỏa ra sức mạnh. Bạn có thể chọn phiên bản đặc biệt của hiệu ứng từ những cuộn giấy này, nhưng phải trả thêm phí.
items.artifacts.unstablespellbook.desc_index=Cuốn sách chưa hoàn chỉnh. Mục lục hiện đang trỏ đến các trang trống sau:
items.artifacts.unstablespellbook.infuse_scroll=Bạn truyền năng lượng của cuộn giấy vào cuốn sách.
items.artifacts.unstablespellbook.name=sách phép thuật không ổn định
items.artifacts.unstablespellbook.no_charge=Sách phép thuật của bạn hiện đã hết năng lượng.
items.artifacts.unstablespellbook.prompt=Chọn một cuộn giấy
items.artifacts.unstablespellbook.read_empowered=Cuộn giấy phép thuật bạn vừa thêm vào sách phép đang tràn đầy năng lượng. Bạn có thể sử dụng phiên bản thông thường hoặc phiên bản đặc biệt của hiệu ứng cuộn giấy này. Chọn phiên bản đặc biệt sẽ tốn 2 lượt sử dụng thay vì 1.
items.artifacts.unstablespellbook.unable_scroll=Bạn không thể thêm cuộn giấy này vào sách.
items.artifacts.unstablespellbook.unknown_scroll=Bạn chưa chắc chắn đây là loại cuộn giấy nào.
items.bags.bag.discover_hint=Bạn có thể mua sản phẩm này tại cửa hàng.
items.bags.bag.name=balo
items.bags.magicalholster.desc=Chiếc bao đựng vũ khí mỏng này được làm từ da của một loài động vật quý hiếm, và sở hữu phép thuật mạnh mẽ cho phép nó chứa được một lượng lớn vũ khí tầm xa. Bạn chỉ cần thò tay vào túi và luôn lấy được món đồ mình đang tìm kiếm. Nhờ phép thuật của bao đựng, đũa phép sẽ được nạp năng lượng nhanh hơn một chút và vũ khí ném sẽ bền hơn một chút khi được cất giữ bên trong.
items.bags.magicalholster.name=bao đựng ma thuật
items.bags.potionbandolier.desc=Chiếc dây đeo vai dày này ôm sát ngực như một chiếc khăn choàng, có nhiều dây đai cách nhiệt để giữ các lọ thuốc, bình nước hoặc các lọ kim loại lỏng. Khi ở trong dây đeo vai, các loại thuốc của bạn sẽ được bảo vệ khỏi cái lạnh.
items.bags.potionbandolier.name=dây đeo thuốc
items.bags.scrollholder.desc=Chiếc hộp hình trụ này trông giống như hộp đựng dụng cụ và bản đồ của nhà thiên văn học, nhưng cuộn giấy của bạn cũng sẽ vừa vặn. Thậm chí còn có một vài ngăn bên hông, rất phù hợp để đựng tinh thể phép thuật, bút cảm ứng ma thuật và nhựa ma thuật. Chiếc hộp này trông không dễ bắt lửa, vì vậy cuộn giấy của bạn sẽ an toàn khỏi hỏa hoạn khi để bên trong.
items.bags.scrollholder.name=giá đỡ cuộn giấy
items.bags.velvetpouch.desc=Chiếc túi nhung nhỏ này có thể đựng được nhiều vật dụng nhỏ, chẳng hạn như hạt giống, đá rune và một số nguyên liệu luyện kim.
items.bags.velvetpouch.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.bags.velvetpouch.name=túi nhung
items.bombs.arcanebomb.desc=Quả bom này được yểm bùa bằng những thuộc tính huyền bí. Nó sẽ phát nổ thành một vụ nổ mạnh mẽ tương tự như đòn tấn công được cường hóa của Goo, gây ra _%1$d-%2$d sát thương phép thuật_ cho bất cứ thứ gì trong phạm vi 2 ô.
items.bombs.arcanebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.arcanebomb.name=bom bí ẩn
items.bombs.bomb$doublebomb.desc=Một chồng hai quả bom thuốc súng đen nặng trịch, có vẻ như bạn được tặng một quả miễn phí!
items.bombs.bomb$doublebomb.name=hai quả bom
items.bombs.bomb.ac_lightthrow=ÁNH SÁNG & CHIẾU XA
items.bombs.bomb.desc=Một quả bom thuốc súng đen khá lớn. Vụ nổ của quả bom này gây ra sát thương _%1$d-%2$d_ cho bất cứ thứ gì nằm cạnh nó, và sẽ phá hủy một số địa hình hoặc vật phẩm liền kề.
items.bombs.bomb.desc_burning=Ngòi nổ của quả bom đang cháy dần, hãy giữ khoảng cách hoặc dập tắt nó đi!
items.bombs.bomb.desc_fuse=Có vẻ như cần vài phát bắn mới đủ để ngòi nổ cháy hết sau khi được châm lửa.
items.bombs.bomb.name=bom
items.bombs.bomb.ondeath=Vụ nổ sẽ giết chết bạn...
items.bombs.bomb.rankings_desc=Chết vì vụ nổ
items.bombs.bomb.snuff_fuse=Bạn nhanh chóng dập tắt ngòi nổ của quả bom.
items.bombs.firebomb.desc=Quả bom này đã được cải tiến để phát nổ trong phạm vi rộng hơn, gây ra sát thương _%1$d-%2$d_ và lan tỏa ngọn lửa liên tục trong phạm vi 2 ô.
items.bombs.firebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.firebomb.name=bom cháy
items.bombs.flashbangbomb.desc=Quả bom tùy chỉnh này sẽ phát nổ tạo ra một vụ nổ ánh sáng, âm thanh và điện. Bất cứ thứ gì trong phạm vi 2 ô sẽ chịu sát thương _%1$d-%2$d_ từ vụ nổ, thêm 25%% sát thương từ điện và bị choáng trong 10 lượt.
items.bombs.flashbangbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.flashbangbomb.name=lựu đạn gây choáng
items.bombs.frostbomb.desc=Quả bom này đã được cải tiến để phát nổ trong phạm vi rộng hơn, gây ra sát thương _%1$d-%2$d_ và lan tỏa một luồng khí lạnh kéo dài trong phạm vi 2 ô.
items.bombs.frostbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.frostbomb.name=bom băng
items.bombs.holybomb.desc=Quả bom này đã được cải tiến để phát ra ánh sáng thánh trong một khu vực rộng hơn khi phát nổ. Bất cứ thứ gì trong phạm vi 2 ô sẽ chịu sát thương _%1$d-%2$d_ từ vụ nổ, và kẻ thù là xác sống hoặc quỷ dữ sẽ chịu thêm 50%% sát thương từ ánh sáng thánh.
items.bombs.holybomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.holybomb.name=bom thần thánh
items.bombs.noisemaker.desc=Quả bom tùy chỉnh này sẽ liên tục phát ra tiếng ồn khi ngòi nổ hết. Khi có vật gì chạm vào bom, nó sẽ phát nổ và gây sát thương _%1$d-%2$d_ cho bất cứ thứ gì trong phạm vi 2 ô!
items.bombs.noisemaker.desc_burning=Cái còi đang tích tắc, nó sẽ nổ khi có vật gì đến gần!
items.bombs.noisemaker.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.noisemaker.name=máy tạo tiếng ồn
items.bombs.regrowthbomb.desc=Quả bom đặc chế này sẽ phun chất lỏng mang lại sự sống khắp phạm vi 3 ô thay vì phát nổ. Khu vực bị ảnh hưởng bởi vụ nổ sẽ nhanh chóng mọc cỏ và cây cối. Bản thân bạn và bất kỳ đồng minh nào bị ảnh hưởng bởi vụ nổ sẽ được hồi phục như thể họ đã uống một lọ thuốc chữa lành.
items.bombs.regrowthbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.regrowthbomb.name=bom tái sinh
items.bombs.shrapnelbomb.desc=Quả bom này đã được cải tiến bằng các mảnh kim loại vụn của DM-300, khi phát nổ chúng sẽ vỡ vụn và bay tứ tung, gây ra sát thương _%1$d-%2$d_ trong phạm vi rất rộng xung quanh quả bom. Tốt hơn hết bạn nên nấp sau vật chắn khi sử dụng nó...
items.bombs.shrapnelbomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.shrapnelbomb.name=bom mảnh
items.bombs.smokebomb.desc=Quả bom này đã được cải tiến để phun ra một đám mây khí dày đặc cùng lúc với vụ nổ. Nó sẽ gây ra sát thương _%1$d-%2$d_ và lan tỏa sương mù bao phủ trong phạm vi 2 ô.
items.bombs.smokebomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.smokebomb.name=bom khói
items.bombs.woollybomb.desc=Quả bom tùy chỉnh này sẽ tạo ra một vùng rộng lớn gồm những con cừu ma thuật sau khi phát nổ. Vụ nổ sẽ gây ra sát thương _%1$d-%2$d_ cho bất cứ thứ gì trong phạm vi 2 ô. Đàn cừu sẽ chặn đường di chuyển và tồn tại trong một thời gian rất dài! Tuy nhiên, đàn cừu sẽ không tồn tại lâu khi có mặt kẻ thù mạnh và có thể bị tiêu diệt sớm hơn bằng cách tương tác với chúng.
items.bombs.woollybomb.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.bombs.woollybomb.name=bom len
items.brokenseal$warriorshield.desc_active=Phong ấn bị phá vỡ của Chiến binh hiện đang giúp anh ta kiên trì, cung cấp cho anh ta lớp khiên bảo vệ ngoài lượng máu hiện có. Có một khoảng thời gian hồi chiêu sau khi lớp khiên được kích hoạt lần đầu trước khi có thể sử dụng lại.\n\nLớp khiên này không bị suy giảm theo thời gian, nhưng sẽ biến mất nếu không có kẻ thù nào ở gần trong vài lượt. Khi nó biến mất, bất kỳ lớp khiên nào chưa được sử dụng sẽ làm giảm thời gian hồi chiêu, tối đa là 50%%.\n\nLượng khiên còn lại: %1$d.\n\nThời gian hồi chiêu hiện tại: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Chiến binh vừa nhận được lớp bảo vệ từ phong ấn bị phá vỡ của mình, và phải chờ đến khi có thể hưởng lợi từ hiệu ứng bảo vệ đó một lần nữa.\n\nSố lượt còn lại: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Thời gian hồi chiêu của khiên Chiến binh hiện đang là âm, có nghĩa là khi khiên được kích hoạt, thời gian hồi chiêu sẽ thấp hơn mức thông thường là 150 lượt. Thời gian hồi chiêu của khiên có thể được giảm xuống mức thấp nhất là -150 lượt, có nghĩa là nó sẽ ngay lập tức sẵn sàng sử dụng lại sau khi được kích hoạt.\n\nThời gian hồi chiêu hiện tại: %d.
items.brokenseal$warriorshield.name=Khiên chiến binh
items.brokenseal.ac_affix=AFFIX
items.brokenseal.affix=Bạn gắn con dấu lên áo giáp của mình!
items.brokenseal.choose_desc=Cả bộ giáp này và con dấu bị vỡ đều mang một ký hiệu. Hãy chọn ký hiệu nào bạn muốn giữ lại.\n\nKý hiệu trên giáp: %1$s\nKý hiệu trên con dấu bị vỡ: %2$s\n\nLưu ý rằng nếu bạn chọn ký hiệu hiện đang có trên giáp, con dấu sẽ không thể chuyển ký hiệu đó sang sau này.
items.brokenseal.choose_title=Chọn một biểu tượng
items.brokenseal.cursed_armor=Con dấu này sẽ không có tác dụng với áo giáp bị nguyền rủa.
items.brokenseal.desc=Một con dấu sáp, được gắn vào áo giáp như một biểu tượng của lòng dũng cảm. Nó có một chữ rune bảo vệ đã mờ được khắc ở giữa, và bị nứt làm đôi ở giữa.\n\nLà một kỷ vật từ quê nhà, con dấu giúp chiến binh kiên trì. Khi đeo con dấu, chiến binh sẽ ngay lập tức nhận được lớp bảo vệ khi sắp bị giảm xuống còn một nửa máu hoặc thấp hơn.\n\nCon dấu có thể được gắn vào áo giáp và di chuyển giữa các bộ áo giáp. Nó có thể mang theo một nâng cấp duy nhất, miễn là nâng cấp đó đã được áp dụng cho áo giáp khi con dấu được gắn vào.
items.brokenseal.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.brokenseal.inscribed=Con dấu có khắc ký hiệu _%s._
items.brokenseal.name=con dấu bị vỡ
items.brokenseal.prompt=Chọn một bộ giáp
items.brokenseal.unknown_armor=Trước tiên, bạn phải xác định xem bộ giáp đó có bị nguyền rủa hay không.
