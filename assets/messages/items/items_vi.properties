items.food.blandfruit.desc=Món này quá khô và nhạt nhẽo, có lẽ nếu hầm thêm một nguyên liệu khác sẽ ngon hơn.
items.food.blandfruit.desc_cooked=Quả đã căng mọng nhờ thời gian ngâm trong nồi và thậm chí còn hấp thụ cả các đặc tính của hạt được dùng để nấu cùng. Nó sẽ có tác dụng tương ứng với loại thuốc mà hạt đó đã được nấu cùng.
items.food.blandfruit.desc_eat=Trông có vẻ sẵn sàng để ăn rồi!
items.food.blandfruit.desc_throw=Nó có vẻ khá dễ cháy nổ, có lẽ tốt nhất là nên vứt bỏ.
