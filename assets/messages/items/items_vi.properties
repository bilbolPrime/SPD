items.artifacts.hornofplenty.desc=Chiếc tù và này không thể thổi vào được, mà dường như sẽ tự động đầy thức ăn khi bạn phiêu lưu và tích lũy kinh nghiệm. Bạn có thể ăn từng phần thức ăn như một món ăn nhẹ, hoặc ăn cho đến khi no.
items.artifacts.hornofplenty.desc_cursed=Chiếc sừng bị nguyền rủa đã bám chặt lấy bạn, dường như nó chỉ muốn lấy thức ăn chứ không muốn tạo ra thức ăn.
items.artifacts.hornofplenty.desc_hint=Có lẽ có cách để tăng sức mạnh của chiếc sừng bằng cách cung cấp năng lượng từ thức ăn.
