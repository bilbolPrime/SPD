items.artifacts.lloydsbeacon.creatures=Hào quang tâm linh của các sinh vật lân cận không cho phép bạn sử dụng ngọn hải đăng Lloyd vào lúc này.
items.artifacts.lloydsbeacon.desc=Ngọn hải đăng của Lloyd là một thiết bị ma thuật phức tạp, cho phép người sử dụng điều khiển phép thuật dịch chuyển tức thời. Ngọn hải đăng có thể được dùng để quay trở lại một vị trí đã định, nhưng cũng có thể phóng ra những luồng phép thuật dịch chuyển tức thời ngẫu nhiên sau khi đã được nạp năng lượng từ việc trang bị. Phép thuật này có thể được hướng vào mục tiêu hoặc chính người sử dụng.
