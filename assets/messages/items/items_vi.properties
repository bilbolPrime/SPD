items.weapon.melee.runicblade.upgrade_ability_stat_name=Sức mạnh năng lực
items.weapon.melee.sai$combostriketracker.desc=Đấu sĩ đang xây dựng chuỗi combo có thể được sử dụng để tăng sát thương của kỹ năng tấn công combo. Mỗi đòn tấn công cận chiến hoặc ném vũ khí thông thường thành công sẽ được tính, nhưng nếu không tấn công thành công trong 5 lượt liên tiếp thì chuỗi combo này sẽ bị thiết lập lại.\n\nCác đòn đánh gần đây: %1$d.\n\nSố lượt cho đến khi mất đòn đánh: %2$s.
items.weapon.melee.sai$combostriketracker.name=đòn tấn công kết hợp
items.weapon.melee.sai.ability_desc=Đấu sĩ có thể thực hiện đòn tấn công kết hợp bằng sai. Đòn tấn công này chắc chắn trúng đích và gây thêm sát thương (+%d) cho mỗi lần Đấu sĩ tấn công trúng đích bằng vũ khí cận chiến hoặc vũ khí ném thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.sai.ability_name=đòn tấn công kết hợp
items.weapon.melee.sai.desc=Hai lưỡi kiếm mỏng, mỗi lưỡi được thiết kế để cầm bằng một tay. Rất hiệu quả trong việc hạ gục kẻ thù bằng những nhát chém liên tiếp.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Đây là một loại vũ khí rất nhanh.
items.weapon.melee.sai.typical_ability_desc=Đấu sĩ có thể thực hiện đòn tấn công kết hợp bằng sai. Đòn tấn công này chắc chắn trúng đích và thường gây ra sát thương _+%d_ cho mỗi lần Đấu sĩ tấn công trúng đích bằng vũ khí cận chiến hoặc vũ khí ném thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.scimitar$sworddance.desc=Đấu sĩ thực hiện những đòn tấn công nhanh dựa trên động lượng như một điệu nhảy. Khi tư thế này được kích hoạt, cô ấy tấn công nhanh hơn 60%% (đủ để tấn công chính xác hai lần một lượt với kiếm cong) và có độ chính xác +50%%.\n\nSố lượt còn lại: %s.
items.weapon.melee.scimitar$sworddance.name=múa kiếm
items.weapon.melee.scimitar.ability_desc=Đấu sĩ có thể thực hiện _vũ điệu kiếm_ với một thanh kiếm cong. Thế đứng này kích hoạt ngay lập tức và tăng cho Đấu sĩ +60%% tốc độ tấn công và +50%% độ chính xác trong _%d lượt._
items.weapon.melee.scimitar.ability_name=múa kiếm
items.weapon.melee.scimitar.desc=Lưỡi dao dày và cong. Hình dạng này cho phép tấn công nhanh hơn nhưng lực tác động yếu hơn.
items.weapon.melee.scimitar.name=kiếm cong
items.weapon.melee.scimitar.stats_desc=Đây là một loại vũ khí khá nhanh.
items.weapon.melee.scimitar.typical_ability_desc=Đấu sĩ có thể thực hiện _vũ điệu kiếm_ với một thanh kiếm cong. Thế đứng này kích hoạt ngay lập tức và giúp Đấu sĩ tăng +60%% tốc độ tấn công và +50%% độ chính xác, thường trong _%d lượt._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Thời lượng khả năng
items.weapon.melee.shortsword.ability_desc=Đấu sĩ có thể chém một kẻ địch bằng kiếm ngắn. Chiêu thức này gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.shortsword.ability_name=chia tách
items.weapon.melee.shortsword.desc=Một thanh kiếm khá ngắn, chỉ dài hơn dao găm vài inch.
items.weapon.melee.shortsword.name=kiếm ngắn
items.weapon.melee.shortsword.typical_ability_desc=Đấu sĩ có thể chém một kẻ địch bằng kiếm ngắn. Chiêu thức này thường gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.sickle.ability_desc=Đấu sĩ có thể _thu hoạch_ kẻ thù bằng lưỡi hái. Đòn tấn công tàn phá này chắc chắn trúng đích và gây ra _%d sát thương_. Sát thương này sẽ được tính theo dạng chảy máu nếu mục tiêu không miễn nhiễm.
items.weapon.melee.sickle.ability_name=mùa gặt
items.weapon.melee.sickle.desc=Một dụng cụ nông nghiệp cầm tay có thể dùng như một vũ khí mạnh mẽ nhưng cồng kềnh.
items.weapon.melee.sickle.name=lưỡi liềm
items.weapon.melee.sickle.stats_desc=Đây là một loại vũ khí khá thiếu chính xác.
items.weapon.melee.sickle.typical_ability_desc=Đấu sĩ có thể _thu hoạch_ kẻ thù bằng lưỡi hái. Đòn tấn công tàn phá này chắc chắn trúng đích và thường gây ra _%d sát thương_. Sát thương này sẽ được tính theo dạng chảy máu nếu mục tiêu không miễn nhiễm.
items.weapon.melee.spear.ability_desc=Đấu sĩ có thể dùng đầu mũi giáo để đâm vào kẻ địch trong tầm nhưng không ở sát bên. Đòn tấn công này gây ra sát thương _%1$d-%2$d_, đẩy lùi kẻ địch và chắc chắn trúng đích.
items.weapon.melee.spear.ability_name=gai
items.weapon.melee.spear.desc=Một thanh gỗ mảnh, đầu được gắn một thanh sắt mài sắc.
items.weapon.melee.spear.name=thương
items.weapon.melee.spear.stats_desc=Đây là một vũ khí khá chậm.\nVũ khí này có tầm bắn xa hơn.
items.weapon.melee.spear.typical_ability_desc=Đấu sĩ có thể dùng đầu mũi giáo để đâm vào kẻ địch trong tầm nhưng không ở sát bên. Thông thường, đòn tấn công này gây ra sát thương _%1$d-%2$d_, đẩy lùi kẻ địch và chắc chắn trúng đích.
items.weapon.melee.sword$cleavetracker.desc=Đấu sĩ đã sẵn sàng tiếp tục đòn chém trước đó. Lần sử dụng chém tiếp theo sẽ không tốn bất kỳ điểm tích lũy kỹ năng vũ khí nào.\n\nSố lượt còn lại: %s.
items.weapon.melee.sword$cleavetracker.name=chia tách
items.weapon.melee.sword.ability_desc=Đấu sĩ có thể chém một kẻ địch bằng kiếm. Chiêu thức này gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.sword.ability_name=chia tách
items.weapon.melee.sword.desc=Một thanh kiếm có độ cân bằng tốt. Không quá lớn, nhưng vẫn dài hơn đáng kể so với kiếm ngắn.
items.weapon.melee.sword.name=gươm
items.weapon.melee.sword.typical_ability_desc=Đấu sĩ có thể chém kẻ địch bằng kiếm. Chiêu thức này thường gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.warhammer.ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng búa chiến. Đòn tấn công tập trung này gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, đồng thời giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.warhammer.ability_name=cú đánh mạnh
items.weapon.melee.warhammer.desc=Rất ít sinh vật có thể chịu được cú đánh mạnh mẽ của khối chì và thép khổng lồ này, nhưng cần sức mạnh phi thường để sử dụng nó một cách hiệu quả.
items.weapon.melee.warhammer.name=búa chiến
items.weapon.melee.warhammer.stats_desc=Đây là một loại vũ khí khá chính xác.
items.weapon.melee.warhammer.typical_ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng búa chiến. Đòn tấn công tập trung này thường gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.warscythe.ability_desc=Đấu sĩ có thể _thu hoạch_ kẻ thù bằng lưỡi hái chiến tranh. Đòn tấn công tàn phá này chắc chắn trúng đích và gây ra _%d sát thương_. Sát thương này được tính theo dạng chảy máu nếu mục tiêu không miễn nhiễm.
items.weapon.melee.warscythe.ability_name=mùa gặt
items.weapon.melee.warscythe.desc=Công cụ to lớn và cồng kềnh này đã được gia cố để trở nên hiệu quả hơn trong việc tiêu diệt kẻ thù hơn là thu hoạch mùa màng.
items.weapon.melee.warscythe.name=lưỡi hái chiến tranh
items.weapon.melee.warscythe.stats_desc=Đây là một loại vũ khí khá thiếu chính xác.
items.weapon.melee.warscythe.typical_ability_desc=Đấu sĩ có thể _thu hoạch_ kẻ thù bằng lưỡi hái chiến tranh. Đòn tấn công tàn phá này chắc chắn trúng đích và thường gây ra _%d sát thương_. Sát thương này được tính theo dạng chảy máu nếu mục tiêu không miễn nhiễm.
items.weapon.melee.whip.ability_desc=Đấu sĩ có thể quất roi vào tất cả kẻ địch xung quanh. Khả năng này gây ra sát thương _%1$d-%2$d_, tấn công tất cả kẻ địch trong phạm vi tấn công và chắc chắn trúng đích.
items.weapon.melee.whip.ability_name=dây da roi
items.weapon.melee.whip.desc=Mặc dù đoạn dây gai ở cuối vũ khí này gây sát thương không cao, nhưng tầm với của nó thì không gì sánh được.
items.weapon.melee.whip.name=roi da
items.weapon.melee.whip.stats_desc=Loại vũ khí này có tầm bắn cực xa.
items.weapon.melee.whip.typical_ability_desc=Đấu sĩ có thể quất roi vào tất cả kẻ thù xung quanh. Khả năng này thường gây ra sát thương _%1$d-%2$d_, tấn công tất cả kẻ thù trong phạm vi tấn công và chắc chắn trúng đích.
items.weapon.melee.wornshortsword.ability_desc=Đấu sĩ có thể chém một kẻ địch bằng thanh kiếm ngắn đã cũ. Chiêu thức này gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.wornshortsword.ability_name=chia tách
items.weapon.melee.wornshortsword.desc=Một thanh kiếm khá ngắn, đã bị mòn do sử dụng nhiều. Nó yếu hơn và nhẹ hơn một chút so với một thanh kiếm ngắn ở tình trạng tốt hơn.
items.weapon.melee.wornshortsword.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.melee.wornshortsword.name=thanh kiếm ngắn cũ
items.weapon.melee.wornshortsword.typical_ability_desc=Đấu sĩ có thể chém kẻ địch bằng thanh kiếm ngắn đã cũ. Chiêu thức này thường gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.missiles.bolas.desc=Những vũ khí tầm xa khác thường này không gây nhiều sát thương, nhưng lại rất hiệu quả trong việc làm chậm mục tiêu.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Vũ khí này gây tê liệt mục tiêu.
items.weapon.missiles.boomerang.desc=Khi ném về phía kẻ thù, vật thể bằng gỗ dẹt, cong này sẽ quay trở lại tay người ném.
items.weapon.missiles.boomerang.durability=Nhờ cấu tạo chắc chắn, chiếc boomerang này sẽ không bị gãy khi sử dụng.
items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.darts.adrenalinedart.desc=Những mũi phi tiêu này được tẩm một hợp chất từ cây kế gai, giúp tăng tốc độ di chuyển và tấn công của đồng minh, hoặc làm giảm tốc độ di chuyển của kẻ thù trong thời gian ngắn. Bản thân mũi phi tiêu vẫn gây hại cho kẻ thù, nhưng sẽ không gây hại cho đồng minh.
items.weapon.missiles.darts.adrenalinedart.name=mũi tên adrenaline
items.weapon.missiles.darts.blindingdart.desc=Những mũi phi tiêu này được tẩm một hợp chất từ cây cỏ mù, có tác dụng làm mù mục tiêu trong thời gian ngắn. Tuy nhiên, chúng không gây mất phương hướng, vì vậy kẻ thù vẫn sẽ biết vị trí cuối cùng chúng nhìn thấy bạn.
items.weapon.missiles.darts.blindingdart.name=mũi tên mù
items.weapon.missiles.darts.chillingdart.desc=Những mũi phi tiêu này được tẩm một hợp chất gốc băng, có khả năng làm lạnh mục tiêu một cách đáng kể.
items.weapon.missiles.darts.chillingdart.name=mũi tên lạnh
items.weapon.missiles.darts.cleansingdart.desc=Những mũi phi tiêu này được tẩm một hợp chất gốc mageroyal, có tác dụng tạm thời giúp đồng minh miễn nhiễm với mọi hiệu ứng tiêu cực, hoặc loại bỏ các hiệu ứng tích cực khỏi kẻ thù. Kẻ thù thậm chí có thể tạm thời quên rằng chúng đang tấn công hoặc bỏ chạy khỏi bạn. Bản thân mũi phi tiêu vẫn gây hại cho kẻ thù, nhưng sẽ không gây hại cho đồng minh.
items.weapon.missiles.darts.cleansingdart.name=mũi tên tẩy rửa
items.weapon.missiles.darts.dart.ac_tip=MẸO
items.weapon.missiles.darts.dart.desc=Những chiếc phi tiêu đơn giản làm bằng gỗ có đầu nhọn này được thiết kế để bay thẳng và găm trúng con mồi chỉ với một cái vẫy cổ tay. Chúng có thể được gắn thêm hạt để tăng hiệu quả khi ném.
items.weapon.missiles.darts.dart.name=phi tiêu
items.weapon.missiles.darts.dart.prompt=Chọn một hạt giống
items.weapon.missiles.darts.dart.tip_all=Đầu mũi tên %1$d với hạt giống %2$d
items.weapon.missiles.darts.dart.tip_cancel=Hủy bỏ
items.weapon.missiles.darts.dart.tip_desc=Một hạt giống có thể được kết hợp với một hoặc hai mũi tên để gắn vào đầu mũi tên. Mỗi loại hạt giống sẽ tạo ra một loại mũi tên gắn đầu riêng, với hiệu ứng độc đáo chỉ sử dụng một lần. Việc gắn các hạt giống này vào mũi tên sẽ tạo ra mũi tên có đầu _%s._
items.weapon.missiles.darts.dart.tip_one=đầu mũi tên 1 với 1 hạt
items.weapon.missiles.darts.dart.tip_title=Mũi phi tiêu
items.weapon.missiles.darts.dart.tip_two=đầu 2 mũi phi tiêu với 1 hạt
items.weapon.missiles.darts.dart.unlimited_uses=Nhờ cấu tạo đơn giản, phi tiêu có thể sử dụng được gần như vĩnh viễn.
items.weapon.missiles.darts.displacingdart.desc=Những mũi phi tiêu này được gắn một hợp chất gốc lá cây fadeleaf, có khả năng dịch chuyển mục tiêu một khoảng cách ngắn.
items.weapon.missiles.darts.displacingdart.name=mũi tên dịch chuyển
items.weapon.missiles.darts.healingdart.desc=Những mũi phi tiêu này được gắn một hợp chất từ cỏ hướng dương, giúp hồi phục tức thì cho mục tiêu. Bản thân mũi phi tiêu vẫn gây hại cho kẻ thù, nhưng sẽ không gây hại cho đồng minh.
items.weapon.missiles.darts.healingdart.name=mũi tên chữa lành
items.weapon.missiles.darts.holydart.desc=Những mũi phi tiêu này được tẩm một hợp chất từ hoa sao, có khả năng truyền năng lượng thánh vào mục tiêu. Đồng minh và kẻ thù thông thường sẽ được ban phước, nhưng kẻ thù bất tử hoặc ma quỷ sẽ chịu sát thương nặng. Bản thân mũi phi tiêu vẫn gây hại cho kẻ thù, nhưng sẽ không gây hại cho đồng minh.
items.weapon.missiles.darts.holydart.name=mũi tên thần thánh
items.weapon.missiles.darts.incendiarydart.desc=Những mũi phi tiêu này được gắn một hợp chất gốc firebloom, sẽ bốc cháy rực rỡ khi va chạm.
items.weapon.missiles.darts.incendiarydart.name=phi tiêu gây cháy
items.weapon.missiles.darts.paralyticdart.desc=Những mũi phi tiêu này được tẩm một hợp chất có nguồn gốc từ rễ cây, có tác dụng làm tê liệt mục tiêu trong một thời gian ngắn.
items.weapon.missiles.darts.paralyticdart.name=mũi tên gây tê liệt
items.weapon.missiles.darts.poisondart.desc=Những mũi phi tiêu này được tẩm một hợp chất từ rêu sầu, có tác dụng gây độc cho mục tiêu.
items.weapon.missiles.darts.poisondart.name=mũi tên độc
items.weapon.missiles.darts.rotdart.desc=Những mũi phi tiêu độc ác này được tẩm một hợp chất axit từ quả mâm xôi thối, có khả năng ăn mòn mạnh mẽ bất cứ thứ gì mà phi tiêu tiếp xúc. Kẻ thù mạnh sẽ kháng lại hầu hết tác dụng, nhưng sự ăn mòn đủ mạnh để dễ dàng tiêu diệt hầu hết kẻ thù thông thường. Chúng bền hơn các loại phi tiêu tẩm độc khác, nhưng độ bền của chúng không thể được tăng cường.
items.weapon.missiles.darts.rotdart.discover_hint=Bạn có thể tạo ra vật phẩm này bằng cách sử dụng mã hạt giống từ một nhiệm vụ cụ thể.
items.weapon.missiles.darts.rotdart.name=mũi tên thối
items.weapon.missiles.darts.shockingdart.desc=Những mũi phi tiêu này được tẩm một hợp chất từ cây dây leo, có khả năng gây ra cú sốc mạnh cho mục tiêu.
items.weapon.missiles.darts.shockingdart.name=phi tiêu gây sốc
items.weapon.missiles.darts.tippeddart.about_to_break=Đầu mũi phi tiêu của bạn sắp hỏng rồi.
items.weapon.missiles.darts.tippeddart.ac_clean=LAU DỌN
items.weapon.missiles.darts.tippeddart.cancel=Hủy bỏ
items.weapon.missiles.darts.tippeddart.clean_all=làm sạch tất cả
items.weapon.missiles.darts.tippeddart.clean_desc=Thao tác này sẽ loại bỏ phần đầu nhọn của phi tiêu, đưa chúng trở lại thành phi tiêu thông thường.
items.weapon.missiles.darts.tippeddart.clean_one=sạch sẽ
items.weapon.missiles.darts.tippeddart.clean_title=Làm sạch phi tiêu
items.weapon.missiles.darts.tippeddart.discover_hint=Bạn có thể mua vật phẩm này ở cửa hàng hoặc tự tạo ra nó bằng cách sử dụng mã hạt giống.
items.weapon.missiles.darts.tippeddart.has_broken=Đầu mũi phi tiêu của bạn đã hết hạn sử dụng.
items.weapon.missiles.darts.tippeddart.unlimited_uses=Nhưng chúng có chất lượng cao đến mức có thể sử dụng được gần như vĩnh viễn.
items.weapon.missiles.darts.tippeddart.uses_left=Bộ phi tiêu này còn _%d/%d_ lần sử dụng nữa trước khi một đầu phi tiêu bị mòn.
items.weapon.missiles.fishingspear.desc=Những chiếc lao nhỏ dùng để ném, tuy được thiết kế để đánh bắt cá nhưng lại rất hiệu quả như một vũ khí tự chế.
items.weapon.missiles.fishingspear.name=giáo bắt cá
items.weapon.missiles.forcecube.desc=Những khối lập phương ma thuật có hình dạng kỳ lạ này đủ nhỏ để cầm trong tay, nhưng lại vô cùng nặng.
items.weapon.missiles.forcecube.name=khối lực
items.weapon.missiles.forcecube.ondeath=Ngươi đã tự sát bằng chính Khối Lực của mình...
items.weapon.missiles.forcecube.stats_desc=Loại vũ khí này phân tán lực tác động trên một khu vực nhỏ, bắn trúng mọi thứ xung quanh.
items.weapon.missiles.heavyboomerang.desc=Chiếc boomerang cỡ lớn này khó sử dụng hiệu quả, nhưng sẽ gây ra sát thương đáng kể.
items.weapon.missiles.heavyboomerang.name=boomerang nặng
items.weapon.missiles.heavyboomerang.stats_desc=Vũ khí này sẽ quay trở lại vị trí ban đầu sau năm lượt.
items.weapon.missiles.javelin.desc=Những ngọn giáo ném cỡ lớn này được gia trọng để giữ cho đầu nhọn luôn hướng về phía trước khi bay trong không trung.
items.weapon.missiles.javelin.name=lao
items.weapon.missiles.kunai.desc=Những con dao nhỏ này rất sắc bén trong tay người sử dụng thành thạo.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Vũ khí này hiệu quả hơn khi đối phó với kẻ địch không cảnh giác.
items.weapon.missiles.missileweapon$placeholder.name=vũ khí ném
items.weapon.missiles.missileweapon.about_to_break=Vũ khí bạn ném sắp bị gãy rồi.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Nếu vũ khí ném cuối cùng trong bộ vũ khí ném nâng cấp của bạn bị hỏng, bộ vũ khí đó sẽ bị mất vĩnh viễn. Bạn có chắc chắn muốn ném nó không?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=KHÔNG
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Đúng
items.weapon.missiles.missileweapon.curse_discover=Vũ khí ném này bị nguyền rủa!
items.weapon.missiles.missileweapon.distance=Vũ khí ném có độ chính xác cao hơn ở tầm xa, nhưng lại kém chính xác hơn ở cự ly gần.
items.weapon.missiles.missileweapon.durability=Vũ khí ném sẽ bị mòn và hỏng khi sử dụng.
items.weapon.missiles.missileweapon.dust=Vũ khí bị ném sẽ vỡ vụn thành bụi khi bạn chạm vào nó.
items.weapon.missiles.missileweapon.has_broken=Một trong những vũ khí bạn ném đã bị hỏng.
items.weapon.missiles.missileweapon.probably_too_heavy=Có lẽ vũ khí này quá nặng đối với bạn.
items.weapon.missiles.missileweapon.stats_known=Bộ vũ khí ném _tier-%1$d_ này gây sát thương _%2$d-%3$d_ và yêu cầu sức mạnh _%4$d_ để sử dụng.
items.weapon.missiles.missileweapon.stats_unknown=Thông thường, bộ vũ khí ném _tier-%1$d_ này gây ra sát thương _%2$d-%3$d_ và yêu cầu sức mạnh _%4$d_ để sử dụng.
items.weapon.missiles.missileweapon.unknown_uses=Thông thường, bộ vũ khí ném này sẽ có _%d_ lần sử dụng trước khi một cái bị hỏng.
items.weapon.missiles.missileweapon.unlimited_uses=Bộ sản phẩm này có chất lượng cao đến mức có thể sử dụng được gần như vĩnh viễn.
items.weapon.missiles.missileweapon.uses_left=Bộ vũ khí ném này còn _%d/%d_ lần sử dụng nữa trước khi một trong số chúng bị hỏng.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Bạn vừa ném phi tiêu ngay lập tức và phải đợi trước khi ném lại. Phi tiêu vẫn có thể được ném, nhưng với tốc độ vũ khí bình thường.\n\nSố lượt còn lại: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Thời gian hồi chiêu của Shuriken
items.weapon.missiles.shuriken.desc=Những mảnh kim loại hình sao có lưỡi sắc như dao cạo gây thương tích nặng khi trúng mục tiêu. Có thể ném chúng rất nhanh.
items.weapon.missiles.shuriken.name=phi tiêu
items.weapon.missiles.shuriken.stats_desc=Phi tiêu có thể được ném ngay lập tức với thời gian hồi chiêu 20 lượt.
items.weapon.missiles.throwingclub.desc=Một loại vũ khí ném khá đơn giản nhưng bền chắc, về cơ bản là một hòn đá lớn được gắn vào một cái gậy.
items.weapon.missiles.throwingclub.name=câu lạc bộ ném
items.weapon.missiles.throwingclub.stats_desc=Vũ khí này không bám dính vào kẻ thù và có thể thu thập ngay lập tức.
items.weapon.missiles.throwinghammer.desc=Những chiếc búa nặng này được thiết kế để ném vào kẻ thù. Cấu tạo hoàn toàn bằng kim loại trơn nhẵn giúp chúng khá bền.
items.weapon.missiles.throwinghammer.name=búa ném
items.weapon.missiles.throwinghammer.stats_desc=Vũ khí này không bám dính vào kẻ thù và có thể thu thập ngay lập tức.
items.weapon.missiles.throwingknife.desc=Những con dao nhẹ này được thiết kế cân bằng để bay vòng cung trong không trung và trúng mục tiêu.
items.weapon.missiles.throwingknife.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.missiles.throwingknife.name=dao phóng
items.weapon.missiles.throwingknife.stats_desc=Vũ khí này hiệu quả hơn khi đối phó với kẻ địch không cảnh giác.
items.weapon.missiles.throwingspear.desc=Những cây giáo nhẹ này có khung mỏng, được thiết kế để ném chứ không phải để đâm.
items.weapon.missiles.throwingspear.name=ném giáo
items.weapon.missiles.throwingspike.desc=Những mũi nhọn bằng kim loại bền chắc này được thiết kế để ném vào kẻ thù ở xa.
items.weapon.missiles.throwingspike.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.missiles.throwingspike.name=ném đinh
items.weapon.missiles.throwingstone.desc=Những viên đá này được mài nhẵn để có thể ném mạnh hơn so với đá thông thường.
items.weapon.missiles.throwingstone.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.missiles.throwingstone.name=ném đá
items.weapon.missiles.tomahawk.desc=Những chiếc rìu ném này có lưỡi răng cưa, khi cắm vào kẻ thù sẽ gây ra vết rách.
items.weapon.missiles.tomahawk.name=rìu chiến
items.weapon.missiles.tomahawk.stats_desc=Vũ khí này gây ra hiệu ứng chảy máu _%1$d-%2$d_ cho mục tiêu.
items.weapon.missiles.tomahawk.typical_stats_desc=Vũ khí này thường gây ra hiệu ứng chảy máu _%1$d-%2$d_ cho mục tiêu.
items.weapon.missiles.trident.desc=Những ngọn giáo ném khổng lồ với ba ngạnh sắc nhọn ở đầu. Chúng rất mạnh mẽ, nhưng khá nặng.
items.weapon.missiles.trident.name=đinh ba
items.weapon.spiritbow.ac_shoot=BẮN
items.weapon.spiritbow.desc=Một cây cung được làm từ loại gỗ ma thuật cổ xưa. Dây cung và các họa tiết khắc trên đó phát ra ánh sáng xanh nhạt. Khi kéo căng dây cung, cây cung này sẽ tạo ra một mũi tên ma thuật có thể bắn vào kẻ thù.
items.weapon.spiritbow.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.spiritbow.name=cung linh hồn
items.weapon.spiritbow.prompt=Chọn mục tiêu
items.weapon.spiritbow.stats=Cung tên không thể nâng cấp trực tiếp, mà sẽ mạnh dần lên khi bạn lên cấp. Ở cấp độ hiện tại, mũi tên bắn ra từ cung sẽ gây ra sát thương _%1$d-%2$d_ và cần _%3$d sức mạnh_ để sử dụng hiệu quả.
items.weapon.weapon$enchantment.discover_hint=Bạn có thể tìm thấy một vật phẩm có hiệu ứng này một cách ngẫu nhiên trong hầm ngục, hoặc thử áp dụng nó vào một vật phẩm của chính mình.
items.weapon.weapon$enchantment.enchant=sự mê hoặc
items.weapon.weapon$enchantment.rankings_desc=Bị giết bởi một phép thuật
items.weapon.weapon.cursed=Bạn có thể cảm nhận được một thứ ma thuật độc ác ẩn chứa bên trong vũ khí này.
items.weapon.weapon.cursed_worn=Vì vũ khí này bị nguyền rủa, bạn không thể nào hóa giải lời nguyền.
items.weapon.weapon.enchant_hardened=Nó đã được _cứng lại._
items.weapon.weapon.enchanted=Nó có _%s._
items.weapon.weapon.excess_str=Nhờ sức mạnh vượt trội, bạn sẽ gây thêm _0-%d sát thương_ với vũ khí này.
items.weapon.weapon.faster=Nó được cải tiến để tăng tốc độ.
items.weapon.weapon.hardened_no_enchant=Vũ khí này đã được tôi cứng, nhưng hiện chưa được yểm bùa.
items.weapon.weapon.hardening_gone=Lớp phủ bảo vệ trên vũ khí này đã bị mòn!
items.weapon.weapon.identify=Giờ bạn đã đủ quen thuộc với vũ khí của mình để nhận biết nó.
items.weapon.weapon.incompatible=Sự tương tác của các loại ma thuật khác nhau đã vô hiệu hóa bùa chú trên vũ khí này!
items.weapon.weapon.not_cursed=Vũ khí này không bị ảnh hưởng bởi ma thuật độc ác.
items.weapon.weapon.stronger=Nó được nâng cấp để tăng cường sát thương.
items.weapon.weapon.too_heavy=Do sức mạnh không đủ, vũ khí này sẽ cản trở tốc độ tấn công, độ chính xác và khả năng tấn công bất ngờ của bạn.
items.weapon.weapon.weak_cursed=Mặc dù bị nguyền rủa, bạn vẫn có thể tháo bỏ vũ khí này.

items.keys.skeletonkey.desc=Chiếc chìa khóa này trông rất đáng gờm: đầu chìa khóa có hình dạng như một cái đầu lâu. Có lẽ nó có thể mở được một cánh cửa rất quan trọng.
items.weapon.missiles.bombarrow.desc=Một mũi tên có gắn bom. Hãy giữ khoảng cách.
items.weapon.missiles.bombarrow.name=mũi tên bom
items.weapon.missiles.missileweapon.damage_desc=Vũ khí này gây ra sát thương từ _%1$d_ đến _%2$d_ mỗi lần đánh.
items.bags.seedpouch.desc=Chiếc túi nhung nhỏ này đựng được bao nhiêu hạt giống cũng vừa. Rất tiện.
items.bags.seedpouch.name=túi hạt giống
items.potions.potionofmight.desc=Chất lỏng mạnh mẽ này thấm vào cơ bắp, tăng vĩnh viễn một điểm sức mạnh và năm điểm sức khỏe.
items.potions.potionofmight.name=thuốc cường tráng
items.rings.ringofdetection.desc=Chiếc nhẫn này giúp người đeo nhận ra bẫy ẩn và cửa bí mật mà không cần mất thời gian tìm kiếm. Nhẫn phát hiện bị suy yếu sẽ làm cùn giác quan, khiến việc tìm bí mật khó hơn ngay cả khi chủ động tìm.
items.rings.ringofdetection.name=nhẫn phát hiện
items.rings.ringofhaggler.desc=Chiếc nhẫn này thực ra không có phép thuật. Nó cho thương nhân biết chủ nhân là thành viên Hội Trộm. Họ thường sẵn lòng giảm giá để đổi lấy lời hứa được yên ổn một thời gian. Nâng cấp nhẫn không mang lại lợi ích thêm.
items.rings.ringofhaggler.name=nhẫn mặc cả
items.rings.ringofherbalism.desc=Chiếc nhẫn này tăng cơ hội tìm được sương và hạt giống khi giẫm cỏ.
items.rings.ringofherbalism.name=nhẫn thảo dược
items.rings.ringofmending.desc=Chiếc nhẫn này tăng khả năng hồi phục của cơ thể, giúp sức khỏe trở lại nhanh hơn. Nhẫn bị suy yếu sẽ làm chậm hoặc thậm chí ngừng quá trình hồi phục tự nhiên.
items.rings.ringofmending.name=nhẫn hồi phục
items.rings.ringofpower.desc=Trường năng lượng tỏa ra từ chiếc nhẫn này khiến đũa phép của bạn mạnh hơn. Nhẫn sức mạnh bị suy yếu sẽ gây tác dụng ngược lại.
items.rings.ringofpower.name=nhẫn sức mạnh
items.rings.ringofsatiety.desc=Đeo chiếc nhẫn này giúp bạn nhịn đói lâu hơn. Nhẫn no bụng bị suy yếu có tác dụng ngược lại.
items.rings.ringofsatiety.name=nhẫn no bụng
items.rings.ringofshadows.desc=Kẻ thù sẽ ít có khả năng nhận ra bạn hơn nếu bạn đeo chiếc nhẫn này. Những chiếc nhẫn bóng tối bị hư hỏng sẽ cảnh báo những kẻ thù mà lẽ ra sẽ không nhận thấy sự hiện diện của bạn.
items.rings.ringofshadows.name=nhẫn bóng tối
items.rings.ringofthorns.desc=Chiếc nhẫn này không có gai thật, nhưng kẻ tấn công bạn sẽ phải chịu một phần sát thương mà nó gây ra. Nâng cấp nhẫn không mang lại lợi ích thêm.
items.rings.ringofthorns.name=nhẫn gai
items.scrolls.scrollofchallenge.desc=Khi được đọc to, cuộn giấy này sẽ phát ra một tiếng gầm đầy thách thức, đánh thức tất cả quái vật và báo hiệu vị trí của người đọc.
items.scrolls.scrollofchallenge.name=cuộn giấy thử thách
items.scrolls.scrollofenchantment.desc=Cuộn giấy này có khả năng yểm một phép thuật ngẫu nhiên lên vũ khí hoặc áo giáp, ban cho chúng một sức mạnh đặc biệt.
items.scrolls.scrollofenchantment.name=cuộn giấy phép thuật
items.scrolls.scrollofpsionicblast.desc=Cuộn giấy này chứa đựng năng lượng hủy diệt, có thể được dẫn truyền bằng năng lực tâm linh để gây sát thương lớn cho tất cả sinh vật trong tầm nhìn. Một tia sáng đi kèm sẽ tạm thời làm mù tất cả mọi người trong khu vực ảnh hưởng, kể cả người đọc cuộn giấy.
items.scrolls.scrollofpsionicblast.name=cuộn giấy bộc phá tâm linh
items.scrolls.scrollofwipeout.desc=Hãy đọc cuộn giấy này để giải phóng cơn thịnh nộ của các linh hồn ngục tối, tiêu diệt mọi thứ ở tầng hiện tại. À, gần như mọi thứ. Một số sinh vật mạnh hơn có thể không bị ảnh hưởng.
items.scrolls.scrollofwipeout.name=cuộn giấy hủy diệt
items.wands.wandofblink.desc=Đũa phép này cho phép bạn dịch chuyển tức thời theo hướng đã chọn. Sinh vật và vật cản sẽ chặn đường dịch chuyển.
items.wands.wandofblink.name=đũa phép dịch chuyển
items.wands.wandoffirebolt.desc=Đũa phép này bắn ra những luồng lửa ma thuật. Chúng đốt cháy địa hình dễ bén lửa, đồng thời gây thương tích và thiêu đốt sinh vật trúng phải.
items.wands.wandoffirebolt.name=đũa phép hỏa tiễn
