items.potions.potion.bistre=thuốc rượu bistre
items.potions.potion.charcoal=thuốc than hoạt tính
items.potions.potion.crimson=thuốc màu đỏ thẫm
items.potions.potion.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục, hoặc chế tạo nó thông qua thuật giả kim.
items.potions.potion.golden=thuốc vàng
items.potions.potion.harmful=Thuốc độc hại!
items.potions.potion.indigo=thuốc màu chàm
