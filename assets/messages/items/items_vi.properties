items.potions.potion.no=Không, tôi đã thay đổi ý định.
items.potions.potion.shatter=Chiếc bình vỡ tan và chất lỏng bắn tung tóe ra ngoài một cách vô hại.
items.potions.potion.silver=thuốc bạc
items.potions.potion.sure_drink=Bạn có chắc mình muốn uống nó không? Trong hầu hết các trường hợp, bạn nên ném những loại thuốc này vào kẻ thù của mình.
items.potions.potion.sure_throw=Bạn có chắc là muốn vứt nó đi không? Trong hầu hết các trường hợp, uống nó sẽ hợp lý hơn.
items.potions.potion.turquoise=thuốc màu ngọc lam
items.potions.potion.unknown_desc=Trong lọ này có một chất lỏng màu %s đang xoáy tròn. Ai biết được chuyện gì sẽ xảy ra nếu uống hoặc ném nó?
items.potions.potion.yes=Vâng, tôi biết mình đang làm gì.
items.potions.potionofexperience.desc=Những kinh nghiệm lừng lẫy từ vô số trận chiến được cô đọng lại dưới dạng lỏng, thức uống này sẽ ngay lập tức nâng cao cấp độ kinh nghiệm của bạn.
items.potions.potionofexperience.name=thuốc kinh nghiệm
items.potions.potionoffrost.desc=Khi gặp không khí, hóa chất này bốc hơi thành một đám mây lạnh buốt. Sinh vật chạm vào sẽ bị đóng băng tại chỗ, không thể cử động hay hành động.
items.potions.potionoffrost.name=thuốc băng giá
items.potions.potionofhaste.desc=Uống thứ chất lỏng có vị ngọt lạ này sẽ cung cấp cho bạn nguồn năng lượng dồi dào trong thời gian ngắn, cho phép bạn chạy với tốc độ cao.
items.potions.potionofhaste.energetic=Bạn cảm thấy tràn đầy năng lượng!
items.potions.potionofhaste.name=thuốc tăng tốc
items.potions.potionofhealing.desc=Một loại tiên dược lập tức hồi đầy sức khỏe và chữa ngộ độc.
items.potions.potionofhealing.heal=Các vết thương của bạn bắt đầu lành lại.
items.potions.potionofhealing.name=thuốc hồi phục
items.potions.potionofinvisibility.desc=Uống thuốc này sẽ khiến bạn tạm thời tàng hình, không bị kẻ địch nhìn thấy. Tấn công kẻ địch hoặc dùng đũa phép hay cuộn giấy trước mắt chúng sẽ làm mất hiệu lực.
items.potions.potionofinvisibility.invisible=Bạn thấy tay mình trở nên vô hình!
items.potions.potionofinvisibility.name=thuốc tàng hình
items.potions.potionoflevitation.desc=Chất lỏng kỳ lạ này khiến bạn lơ lửng trên không, dễ dàng vượt qua bẫy. Tuy nhiên, lửa và khí độc vẫn lan trong không khí nên không thể tránh bằng cách bay lên.
items.potions.potionoflevitation.float=Bạn như đang bay lơ lửng trên không trung!
items.potions.potionoflevitation.name=thuốc bay lơ lửng
items.potions.potionofliquidflame.desc=Chiếc bình này chứa một hợp chất không bền, sẽ bốc cháy dữ dội khi tiếp xúc với không khí.
items.potions.potionofliquidflame.name=thuốc lửa lỏng
items.potions.potionofmindvision.desc=Sau khi uống loại thuốc này, tâm trí bạn sẽ trở nên nhạy bén với dấu hiệu tâm linh của các sinh vật ở xa, cho phép bạn cảm nhận được sự hiện diện của sinh vật xuyên qua các bức tường. Ngoài ra, loại thuốc này cũng cho phép bạn nhìn xuyên qua các bức tường và cửa ra vào ở gần.
items.potions.potionofmindvision.name=thuốc thiên nhãn
items.potions.potionofmindvision.see_mobs=Bạn có thể cảm nhận được sự hiện diện của tâm trí các sinh vật khác!
items.potions.potionofmindvision.see_none=Bạn có thể cảm nhận được rằng hiện tại bạn đang đơn độc ở cấp độ này.
items.potions.potionofparalyticgas.desc=Khi tiếp xúc với không khí, chất lỏng trong bình này sẽ bốc hơi thành một làn khói vàng gây tê. Bất cứ ai hít phải làn khói này sẽ bị tê liệt ngay lập tức, không thể cử động trong một thời gian sau khi làn khói tan hết. Vật phẩm này có thể được ném vào kẻ thù ở xa để khiến chúng bị ảnh hưởng bởi khí độc.
items.potions.potionofparalyticgas.name=thuốc khí gây tê liệt
items.potions.potionofpurity.desc=Chất này nhanh chóng trung hòa mọi khí độc hại trong vùng tác dụng. Uống vào sẽ giúp bạn tạm thời miễn nhiễm với các loại khí đó.
items.potions.potionofpurity.freshness=Bạn cảm nhận được sự tươi mát lạ thường trong không khí.
items.potions.potionofpurity.name=Thuốc thanh tẩy
items.potions.potionofpurity.protected=Một lớp màng bảo vệ bao bọc bạn!
items.potions.potionofstrength.desc=Loại dung dịch mạnh mẽ này sẽ thấm sâu vào cơ bắp của bạn, giúp tăng sức mạnh của bạn thêm một điểm một cách vĩnh viễn.
items.potions.potionofstrength.msg=Sức mạnh mới tràn ngập cơ thể bạn, giờ đây bạn sở hữu sức mạnh %d!
items.potions.potionofstrength.name=thuốc tăng cường sức mạnh
items.potions.potionoftoxicgas.desc=Mở nắp hoặc làm vỡ bình thủy tinh chịu áp suất này sẽ khiến chất bên trong phát nổ thành một đám mây khí độc màu xanh lá cây chết người. Bạn có thể chọn ném thứ thuốc này vào kẻ thù ở xa thay vì tự tay mở nắp.
items.potions.potionoftoxicgas.name=bình khí độc
items.quest.ceremonialcandle.desc=Một bộ nến, bị nung chảy và kết dính lại với nhau do sử dụng. Riêng lẻ thì chúng vô giá trị, nhưng khi được sử dụng cùng với các nến khác theo một hình dạng nhất định, chúng có thể tập trung năng lượng cho một nghi lễ triệu hồi.
items.quest.ceremonialcandle.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.ceremonialcandle.name=nến nghi lễ
items.quest.corpsedust.chill=Cảm giác lạnh lẽo chạy dọc sống lưng.
items.quest.corpsedust.desc=Quả cầu bụi xác chết trông không khác gì một quả cầu bụi thông thường. Nhưng bạn có thể cảm nhận được một năng lượng tà ác ẩn náu bên trong nó. Loại bỏ nó càng sớm càng tốt là một ý kiến hay.
items.quest.corpsedust.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.corpsedust.name=bụi xác chết
items.quest.darkgold.desc=Kim loại này được gọi là kim loại tối màu không phải vì màu sắc của nó (nó không khác gì vàng thông thường), mà vì nó tan chảy dưới ánh sáng ban ngày, khiến nó trở nên vô dụng trên bề mặt.
items.quest.darkgold.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.darkgold.name=quặng vàng đen
items.quest.darkgold.you_now_have=Bạn hiện có quặng vàng đen %d.
items.quest.dwarftoken.desc=Nhiều người lùn và một số sinh vật khổng lồ do họ tạo ra đều mang theo những mảnh kim loại nhỏ này, không rõ mục đích sử dụng. Có thể chúng là đồ trang sức hoặc có thể là một loại giấy tờ tùy thân nào đó. Người lùn quả là những sinh vật kỳ lạ.
items.quest.dwarftoken.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.dwarftoken.name=mã thông báo người lùn
items.quest.embers.desc=Những đốm lửa đặc biệt chỉ có thể thu hoạch từ các nguyên tố lửa non. Chúng tỏa ra năng lượng nhiệt.
items.quest.embers.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.embers.name=tàn lửa nguyên tố
items.quest.escapecrystal.ac_use=SỬ DỤNG
items.quest.escapecrystal.desc=Một viên pha lê ma thuật mỏng manh dường như chứa phép thuật dịch chuyển tức thời. Bạn có thể sử dụng viên pha lê này bất cứ lúc nào để rời khỏi hầm chứa của người lùn, nhưng bạn sẽ không thể mang bất cứ thứ gì ra ngoài!
items.quest.escapecrystal.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.escapecrystal.name=tinh thể thoát hiểm
items.quest.gooblob.desc=Một khối chất nhầy nhão nhoẹt, tách ra từ Goo khi nó chết. Nó gần giống như một quả bóng thạch lớn, mặc dù bạn sẽ không dám ăn nó.\n\nNó không có tác dụng gì khi đứng một mình, nhưng có thể hữu ích khi kết hợp với một số loại thuốc hoặc bom. Ít nhất thì nó cũng có thể chuyển hóa thành một lượng năng lượng kha khá.
items.quest.gooblob.discover_hint=Bạn có thể nhận được vật phẩm này khi tiêu diệt một số kẻ thù nhất định.
items.quest.gooblob.name=cục chất nhầy
items.quest.metalshard.desc=Một mảnh kim loại bị nguyền rủa gỉ sét, vỡ ra từ DM-300 khi nó bị phá hủy. Bạn có thể cảm nhận được một thứ ma thuật độc ác tiềm ẩn bên trong nó. Nó không có tác dụng gì khi đứng một mình, nhưng có thể hữu ích khi kết hợp với một số cuộn phép hoặc bom. Ít nhất nó cũng có thể chuyển hóa thành một lượng năng lượng đáng kể.
items.quest.metalshard.discover_hint=Bạn có thể nhận được vật phẩm này khi tiêu diệt một số kẻ thù nhất định.
items.quest.metalshard.name=mảnh kim loại bị nguyền rủa
items.quest.pickaxe.ability_desc=Đấu sĩ có thể đâm xuyên kẻ địch bằng cuốc. Đòn này chắc chắn trúng đích, gây hiệu ứng dễ bị tổn thương trong 3 lượt và gây sát thương _%1$d-%2$d_ cho kẻ địch có lớp da cứng.
items.quest.pickaxe.ability_name=khoan
items.quest.pickaxe.desc=Đây là một công cụ chắc chắn và nặng dùng để phá đá. Bạn không cần phải trang bị cuốc để khai thác, nhưng có thể dùng nó như một vũ khí trong trường hợp cần thiết.
items.quest.pickaxe.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
items.quest.pickaxe.name=cuốc chim
items.quest.pickaxe.upgrade_ability_stat_name=Sát thương kỹ năng
items.quest.ratskull.desc=Một hộp sọ chuột lớn đến bất ngờ. Nó sẽ là một chiến lợi phẩm săn bắn tuyệt vời, nếu bạn có một bức tường để treo nó lên.
items.quest.ratskull.name=hộp sọ chuột khổng lồ
items.remains.bowfragment.desc=Mảnh gỗ vỡ này từng là một phần của cây cung linh hồn của một nữ thợ săn đã thất lạc. Bạn vẫn có thể cảm nhận được một chút năng lượng tự nhiên còn sót lại trong mảnh gỗ, bạn có thể dùng nó để trồng cỏ cao xung quanh mình. Tuy nhiên, làm như vậy sẽ phá hủy mảnh gỗ.
items.remains.bowfragment.name=mảnh cung
items.remains.brokenhilt.desc=Chuôi kiếm bị gãy này trông giống như thuộc về vũ khí của một đấu sĩ bại trận. Bạn vẫn có thể cảm nhận được một chút sức mạnh võ thuật còn sót lại trong chuôi kiếm, bạn có thể sử dụng nó để gây thêm một chút sát thương cho hai đòn đánh cận chiến tiếp theo. Tuy nhiên, làm như vậy sẽ phá hủy chuôi kiếm.
items.remains.brokenhilt.name=chuôi bị gãy
items.remains.brokenstaff.desc=Cây trượng của pháp sư này đã bị gãy làm đôi sau khi chủ nhân của nó qua đời. Bạn vẫn có thể cảm nhận được một chút năng lượng ma thuật còn sót lại trong cây trượng, bạn có thể dùng nó để tăng sức mạnh cho đũa phép của mình. Tuy nhiên, làm như vậy sẽ phá hủy cây trượng.
items.remains.brokenstaff.name=nhân viên bị hỏng
items.remains.cloakscrap.desc=Mảnh vải mỏng trong suốt này trông giống như được lấy từ chiếc áo choàng bóng tối của một tên trộm khét tiếng. Bạn vẫn có thể cảm nhận được một chút năng lượng huyền bí còn sót lại trong đó, bạn có thể dùng nó để tăng cường sức mạnh cho các vật phẩm của mình. Tuy nhiên, làm như vậy sẽ làm hỏng vải.
items.remains.cloakscrap.name=mảnh vải vụn
items.remains.remainsitem.ac_use=SỬ DỤNG
items.remains.remainsitem.discover_hint=Bạn có thể tìm thấy vật phẩm này trong hài cốt của một anh hùng cụ thể từ một lượt chơi thất bại trước đó.
items.remains.sealshard.desc=Những mảnh sáp đỏ nhỏ xíu này trông như thể đến từ ấn tín của một Chiến binh đã ngã xuống. Bạn vẫn có thể cảm nhận được một chút ý chí còn sót lại trong ấn tín, bạn có thể sử dụng nó để tạo cho mình một lớp bảo vệ. Tuy nhiên, làm như vậy sẽ phá hủy các mảnh ấn tín.
items.remains.sealshard.name=mảnh vỡ phong ấn
items.remains.tornpage.desc=Trang này trông như thể bị xé ra từ một cuốn sách thánh đã hết hạn sử dụng của một giáo sĩ. Vẫn còn một chút năng lượng thần thánh bám vào nó, bạn có thể dùng nó để hồi phục một chút máu. Tuy nhiên, làm như vậy sẽ phá hủy trang giấy bị xé.
items.remains.tornpage.name=trang bị rách
items.rings.ring.agate=nhẫn mã não
items.rings.ring.amethyst=nhẫn thạch anh tím
items.rings.ring.curse_known=Bạn có thể cảm nhận được một thứ ma thuật độc ác ẩn chứa bên trong chiếc nhẫn này.
items.rings.ring.cursed_worn=Vì chiếc nhẫn này bị nguyền rủa, bạn không thể tháo nó ra được.
items.rings.ring.diamond=nhẫn kim cương
items.rings.ring.emerald=nhẫn ngọc lục bảo
items.rings.ring.equip_cursed=Chiếc nhẫn siết chặt lấy ngón tay bạn một cách đau đớn!
items.rings.ring.garnet=nhẫn garnet
items.rings.ring.identify=Giờ bạn đã đủ quen thuộc với chiếc nhẫn của mình để nhận ra nó rồi.
items.rings.ring.known=Đây là %s
items.rings.ring.not_cursed=Chiếc nhẫn này không bị ảnh hưởng bởi ma thuật độc ác.
items.rings.ring.onyx=nhẫn onyx
items.rings.ring.opal=nhẫn opal
items.rings.ring.quartz=nhẫn thạch anh
items.rings.ring.ruby=nhẫn hồng ngọc
items.rings.ring.sapphire=nhẫn sapphire
items.rings.ring.topaz=nhẫn đá topaz
items.rings.ring.tourmaline=nhẫn tourmaline
items.rings.ring.unknown_desc=Chiếc nhẫn kim loại này được đính một viên %s lớn, lấp lánh trong bóng tối. Ai biết được nó sẽ có tác dụng gì khi đeo?
items.rings.ringofaccuracy.combined_stats=Những chiếc nhẫn bạn đang đeo kết hợp sức mạnh của chúng, tăng độ chính xác của bạn lên tổng cộng _%s%%_.
items.rings.ringofaccuracy.desc=Chiếc nhẫn này tăng khả năng đánh trúng kẻ địch.
items.rings.ringofaccuracy.name=nhẫn chính xác
items.rings.ringofaccuracy.stats=Khi đeo chiếc nhẫn này, độ chính xác của bạn sẽ được tăng lên _%s%%._
items.rings.ringofaccuracy.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ tăng độ chính xác của bạn lên _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Tăng độ chính xác
items.rings.ringofarcana.combined_stats=Những chiếc nhẫn bạn đang đeo sẽ kết hợp sức mạnh của chúng, tăng tổng sức mạnh của các phép thuật và ký hiệu lên _%s%%_.
items.rings.ringofarcana.desc=Chiếc nhẫn này tăng cường các phép thuật trên vũ khí và phù hiệu trên áo giáp, bao gồm cả lời nguyền! Đầu tiên, nó làm tăng tỷ lệ kích hoạt, sau đó tăng cường sức mạnh của hiệu ứng khi tỷ lệ kích hoạt đạt 100%. Một chiếc nhẫn bị nguyền rủa sẽ làm suy yếu các phép thuật, phù hiệu và lời nguyền.
items.rings.ringofarcana.name=nhẫn bí ẩn
items.rings.ringofarcana.stats=Khi đeo chiếc nhẫn này, sức mạnh của các phép thuật và ký hiệu sẽ được tăng lên _%s%%._
items.rings.ringofarcana.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ tăng sức mạnh của các phép thuật và ký hiệu lên _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Tăng cường Arcana
items.rings.ringofelements.combined_stats=Những chiếc nhẫn bạn đang trang bị kết hợp sức mạnh của chúng, tạo ra tổng cộng _%s%%_ khả năng kháng nguyên tố.
items.rings.ringofelements.desc=Chiếc nhẫn này giúp kháng lửa, điện, khí và các nguyên tố khác. Nó cũng rút ngắn thời gian chịu hiệu ứng xấu.
items.rings.ringofelements.name=nhẫn nguyên tố
items.rings.ringofelements.stats=Khi đeo, chiếc nhẫn này sẽ cung cấp khả năng chống chịu nguyên tố _%s%%_.
items.rings.ringofelements.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ cung cấp khả năng chống chịu nguyên tố _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Sức chống cự
items.rings.ringofenergy.combined_stats=Các chiếc nhẫn bạn đang đeo kết hợp sức mạnh của chúng, tăng tốc độ sạc lên tổng cộng _%s%%_.
items.rings.ringofenergy.desc=Trang bị ma thuật của bạn sẽ được nạp năng lượng nhanh hơn trong trường năng lượng huyền bí phát ra từ chiếc nhẫn này. Ngược lại, một chiếc nhẫn bị nguyền rủa sẽ làm chậm quá trình nạp năng lượng.
items.rings.ringofenergy.name=vòng năng lượng
items.rings.ringofenergy.stats=Khi đeo chiếc nhẫn này, tốc độ nạp năng lượng của gậy phép, thánh vật và giáp anh hùng sẽ tăng lên _%s%%._
items.rings.ringofenergy.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ tăng tốc độ nạp năng lượng của đũa phép, thánh vật và giáp anh hùng lên _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Tăng cường sạc
items.rings.ringofevasion.combined_stats=Những chiếc nhẫn bạn đang đeo kết hợp sức mạnh, tăng khả năng né tránh của bạn lên tổng cộng _%s%%_.
items.rings.ringofevasion.desc=Chiếc nhẫn này tăng khả năng né đòn của kẻ địch.
items.rings.ringofevasion.name=nhẫn né tránh
items.rings.ringofevasion.stats=Khi đeo chiếc nhẫn này, khả năng né tránh của bạn sẽ tăng lên _%s%%._
items.rings.ringofevasion.typical_stats=Khi đeo chiếc nhẫn này, khả năng né tránh của bạn thường sẽ tăng lên _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Tăng cường né tránh
items.rings.ringofforce$brawlersstance.desc=Khi ở tư thế này, các đòn tấn công thông thường của Đấu sĩ sẽ sử dụng chiếc nhẫn sức mạnh được trang bị ngay cả khi cô ấy đang cầm vũ khí. Các đòn tấn công này nhận được sát thương cộng thêm và vẫn sử dụng hiệu ứng tăng cường và bùa chú của vũ khí.\n\nDuy trì tư thế này cần tập trung, tuy nhiên, tốc độ hồi chiêu của kỹ năng vũ khí sẽ giảm 50%.\n\nTư thế này có thể được bật hoặc tắt bằng cách sử dụng chiếc nhẫn sức mạnh, nhưng việc giảm tốc độ hồi chiêu sẽ kéo dài trong một thời gian ngắn nếu tư thế được kích hoạt và tắt nhanh chóng.
items.rings.ringofforce$brawlersstance.name=tư thế của võ sĩ
items.rings.ringofforce.ability_desc=Với chiếc nhẫn này, Đấu sĩ có thể áp dụng thế _đấu tay đôi_, khiến các đòn tấn công thông thường của cô ấy luôn sử dụng chiếc nhẫn này ngay cả khi đang trang bị vũ khí. Các đòn tấn công này sẽ gây ra sát thương _%1$d-%2$d_ và cũng kế thừa hiệu ứng cường hóa và nâng cấp của vũ khí. Thế này làm chậm tốc độ nạp lại vũ khí đi 50%%.
items.rings.ringofforce.ability_name=tư thế của võ sĩ
items.rings.ringofforce.combined_stats=Những chiếc nhẫn bạn đang trang bị sẽ kết hợp sức mạnh của chúng, gây ra tổng sát thương _%1$d-%2$d_ nếu không dùng vũ khí, hoặc tăng sát thương lên _%3$d_ khi dùng vũ khí.
items.rings.ringofforce.desc=Chiếc nhẫn này tăng cường sức mạnh cho các đòn đánh cận chiến của người đeo. Sức mạnh tăng thêm này khá yếu khi sử dụng vũ khí, nhưng sẽ mạnh hơn nhiều khi tấn công tay không. Ngược lại, một chiếc nhẫn bị nguyền rủa sẽ làm suy yếu các đòn đánh của người đeo.
items.rings.ringofforce.name=vòng lực
items.rings.ringofforce.stats=Khi không trang bị vũ khí, với sức mạnh hiện tại của bạn, chiếc nhẫn này sẽ gây ra sát thương _%1$d-%2$d._ Khi trang bị vũ khí, chiếc nhẫn này sẽ tăng sát thương lên _%3$d._
items.rings.ringofforce.typical_ability_desc=Với chiếc nhẫn này, Đấu Sĩ có thể áp dụng thế _đấu tay đôi_, khiến các đòn tấn công thông thường của cô ấy luôn sử dụng chiếc nhẫn này ngay cả khi đang trang bị vũ khí. Các đòn tấn công này thường gây ra sát thương _%1$d-%2$d_ và cũng kế thừa hiệu ứng cường hóa và nâng cấp của vũ khí. Thế này làm chậm tốc độ nạp lại vũ khí đi 50%%.
items.rings.ringofforce.typical_stats=Khi không trang bị vũ khí, với sức mạnh hiện tại của bạn, chiếc nhẫn này thường gây ra sát thương _%1$d-%2$d._ Khi trang bị vũ khí, chiếc nhẫn này thường tăng sát thương lên _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Sát thương không vũ trang
items.rings.ringofforce.upgrade_stat_name_2=Tăng sát thương vũ trang
items.rings.ringofforce.upgrade_stat_name_3=Sát thương kỹ năng
items.rings.ringoffuror.combined_stats=Những chiếc nhẫn bạn đang trang bị đang kết hợp sức mạnh, tăng tốc độ tấn công của bạn lên tổng cộng _%s%%_.
items.rings.ringoffuror.desc=Chiếc nhẫn này ban cho người đeo một sức mạnh nội tại, cho phép họ tấn công nhanh hơn. Ngược lại, một chiếc nhẫn bị nguyền rủa sẽ làm chậm tốc độ tấn công của người đeo.
items.rings.ringoffuror.name=vòng cuồng nộ
items.rings.ringoffuror.stats=Khi đeo chiếc nhẫn này, tốc độ tấn công của bạn sẽ được tăng lên _%s%%._
items.rings.ringoffuror.typical_stats=Khi đeo chiếc nhẫn này, tốc độ tấn công của bạn thường sẽ tăng lên _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Tăng tốc độ tấn công
items.rings.ringofhaste.combined_stats=Những chiếc nhẫn bạn đang đeo kết hợp sức mạnh của chúng, tăng tốc độ di chuyển của bạn lên tổng cộng _%s%%_.
items.rings.ringofhaste.desc=Chiếc nhẫn này đẩy nhanh dòng thời gian của người đeo, khiến mọi hành động đều nhanh hơn một chút.
items.rings.ringofhaste.name=nhẫn tốc độ
items.rings.ringofhaste.stats=Khi đeo chiếc nhẫn này, tốc độ di chuyển của bạn sẽ được tăng lên _%s%%._
items.rings.ringofhaste.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ làm tăng tốc độ di chuyển của bạn lên _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Tăng tốc độ di chuyển
items.rings.ringofmight.combined_stats=Những chiếc nhẫn bạn đang đeo kết hợp sức mạnh của chúng, tăng sức mạnh của bạn lên _%1$d_ và HP tối đa lên _%2$s%%_ tổng cộng.
items.rings.ringofmight.desc=Chiếc nhẫn này giúp tăng cường các đặc điểm thể chất của người đeo, mang lại cho họ sức mạnh và thể lực vượt trội. Một chiếc nhẫn bị nguyền rủa sẽ làm suy yếu người đeo.
items.rings.ringofmight.name=chiếc nhẫn sức mạnh
items.rings.ringofmight.stats=Khi đeo chiếc nhẫn này, sức mạnh của bạn sẽ tăng thêm _%1$d_ và HP tối đa của bạn tăng thêm _%2$s%%._
items.rings.ringofmight.typical_stats=Khi đeo chiếc nhẫn này, sức mạnh của bạn thường sẽ tăng lên _%1$d_ và HP tối đa lên _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=tăng cường sức mạnh
items.rings.ringofmight.upgrade_stat_name_2=Tăng công suất tối đa
items.rings.ringofsharpshooting.combined_stats=Những chiếc nhẫn bạn đang đeo kết hợp sức mạnh của chúng, tăng cấp độ hiệu quả của vũ khí ném lên _%1$d_ và tăng độ bền của chúng lên tổng cộng _%2$s%%_.
items.rings.ringofsharpshooting.desc=Chiếc nhẫn này giúp tăng độ chính xác và khả năng nhắm bắn của người đeo, khiến tất cả các loại vũ khí tầm xa trở nên mạnh mẽ và bền bỉ hơn. Một chiếc nhẫn bị nguyền rủa sẽ có tác dụng ngược lại.
items.rings.ringofsharpshooting.name=vòng bắn tỉa
items.rings.ringofsharpshooting.stats=Khi đeo chiếc nhẫn này, sát thương của vũ khí ném sẽ được tăng lên như thể cấp độ của chúng được nâng lên _%1$d_, và độ bền của chúng cũng sẽ được tăng lên _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Khi đeo chiếc nhẫn này, sát thương của vũ khí ném thường sẽ được tăng lên như thể cấp độ của chúng được nâng lên _%1$d_ và độ bền của chúng cũng sẽ được tăng lên _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Tăng sát thương theo cấp độ
items.rings.ringofsharpshooting.upgrade_stat_name_2=Tăng cường độ bền
items.rings.ringoftenacity.combined_stats=Những chiếc nhẫn bạn đang trang bị sẽ kết hợp sức mạnh của chúng, giảm sát thương bạn phải chịu lên đến tổng cộng _%s%%_.
items.rings.ringoftenacity.desc=Khi đeo chiếc nhẫn này, người đeo sẽ có khả năng chống lại những đòn tấn công thường gây chết người. Người càng bị thương nặng, khả năng chống chịu sát thương càng cao. Ngược lại, một chiếc nhẫn bị nguyền rủa sẽ khiến kẻ thù dễ dàng tiêu diệt người đeo hơn.
items.rings.ringoftenacity.name=vòng kiên cường
items.rings.ringoftenacity.stats=Khi đeo chiếc nhẫn này, nó sẽ giúp giảm thiểu sát thương bạn phải chịu lên đến _%s%%._
items.rings.ringoftenacity.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ giúp giảm thiểu sát thương bạn phải chịu lên đến _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Khả năng chống sát thương tối đa
items.rings.ringofwealth.combined_stats=Những chiếc nhẫn bạn đang đeo đang kết hợp sức mạnh, tăng vận may của bạn lên tổng cộng _%s%%_.
items.rings.ringofwealth.desc=Chiếc nhẫn này hoạt động như một nam châm hút kho báu, làm tăng khả năng kẻ thù và các thùng chứa sẽ mang theo những vật phẩm có giá trị. Ngược lại, một chiếc nhẫn bị nguyền rủa sẽ làm giảm cơ hội nhận được chiến lợi phẩm của bạn.
items.rings.ringofwealth.name=chiếc nhẫn giàu có
items.rings.ringofwealth.stats=Khi đeo chiếc nhẫn này, vận may của bạn sẽ được tăng thêm _%s%%._
items.rings.ringofwealth.typical_stats=Khi đeo, chiếc nhẫn này thường sẽ tăng vận may của bạn lên _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Tăng vận may
items.scrolls.exotic.exoticscroll.berkanan=Cuộn giấy kỳ lạ của BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.scrolls.exotic.exoticscroll.gyfu=Cuộn giấy kỳ lạ của GYFU
items.scrolls.exotic.exoticscroll.isaz=Cuộn giấy kỳ lạ của ISAZ
items.scrolls.exotic.exoticscroll.kaunan=Cuộn giấy kỳ lạ của KAUNAN
items.scrolls.exotic.exoticscroll.laguz=Cuộn giấy kỳ lạ của LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=Cuộn giấy kỳ lạ của MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=Cuộn giấy kỳ lạ của NAUDIZ
items.scrolls.exotic.exoticscroll.odal=Cuộn giấy kỳ lạ của ODAL
items.scrolls.exotic.exoticscroll.raido=Cuộn giấy kỳ lạ của RAIDO
items.scrolls.exotic.exoticscroll.sowilo=Cuộn giấy kỳ lạ của SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=Cuộn giấy kỳ lạ của TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Trên tấm da thuộc màu đen này có khắc một loại bùa chú ma thuật phát sáng khó hiểu. Nó dường như đến từ vùng đất này, ai biết được điều gì sẽ xảy ra khi nó được đọc to?
items.scrolls.exotic.exoticscroll.yngvi=Cuộn giấy kỳ lạ của YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Câu thần chú trên cuộn giấy này sẽ bao quanh bạn bằng một luồng năng lượng ma thuật, tạm thời ngăn chặn mọi hiệu ứng ma thuật, dù có hại hay có lợi. Điều này bao gồm hầu hết các hiệu ứng của vật phẩm ma thuật như đũa phép, cuộn giấy, nhẫn, cổ vật, bùa chú và lời nguyền. Tuy nhiên, khả năng của áo giáp anh hùng đủ mạnh để vẫn hoạt động bình thường.
items.scrolls.exotic.scrollofantimagic.name=cuộn giấy chống phép thuật
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Một đấu trường ma thuật hiện ra xung quanh bạn, được biểu thị bằng một làn sương mù đỏ cuồn cuộn.\n\nKhi đứng trong sương mù, cơn đói của bạn sẽ không tăng lên và bạn sẽ chịu ít hơn 33%% sát thương từ mọi nguồn. Nếu bạn có bất kỳ nguồn giảm sát thương nào khác (chẳng hạn như giáp), chúng sẽ được áp dụng sau khi giảm 33%% sát thương.\n\nSố lượt còn lại: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=đấu trường thử thách
items.scrolls.exotic.scrollofchallenge.desc=Khi đọc to, cuộn giấy này sẽ phát ra một tiếng gầm lớn thu hút kẻ thù về phía người sử dụng đồng thời tạo ra một đấu trường nhỏ xung quanh họ.\n\nMiễn là người đọc ở trong đấu trường này, họ sẽ chịu ít hơn 33% sát thương từ mọi nguồn (hiệu ứng này được áp dụng trước các hình thức giảm sát thương khác), và họ sẽ không bị mất độ no.\n\nKích thước của đấu trường sẽ tỷ lệ thuận với kích thước khu vực mà người đọc đang ở. Nó sẽ đặc biệt nhỏ ở một số khu vực của trùm.
items.scrolls.exotic.scrollofchallenge.name=cuộn giấy thử thách
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Cuộn giấy bói toán của bạn đã xác định được những mục sau:
items.scrolls.exotic.scrollofdivination.desc=Cuộn giấy này sẽ ngẫu nhiên xác định bốn loại vật phẩm mà bạn hiện chưa biết. Các loại vật phẩm được xác định có thể là màu sắc của một lọ thuốc, một ký hiệu ma thuật trên cuộn giấy, hoặc một viên đá quý trên chiếc nhẫn. Các vật phẩm được xác định không nhất thiết phải là những vật phẩm bạn đang mang theo.
items.scrolls.exotic.scrollofdivination.name=cuộn giấy bói toán
items.scrolls.exotic.scrollofdivination.nothing_left=Không còn gì để nhận dạng nữa!
items.scrolls.exotic.scrollofdread.desc=Khi đọc cuộn giấy này, nó sẽ phát ra một tia sáng đỏ lóe lên, gieo rắc nỗi kinh hoàng tột độ cho tất cả kẻ thù trong tầm nhìn của bạn. Hiệu ứng này mạnh đến nỗi chúng sẽ nhanh chóng cố gắng chạy trốn khỏi toàn bộ hầm ngục và biến mất không dấu vết!\n\nCũng giống như hiệu ứng kinh hoàng, hiệu ứng này có thể biến mất theo thời gian hoặc nếu kẻ thù bị tấn công.\n\nNhững kẻ thù có ý chí mạnh mẽ, chẳng hạn như trùm, sẽ chỉ bị ảnh hưởng bởi hiệu ứng kinh hoàng thông thường.
items.scrolls.exotic.scrollofdread.name=cuộn kinh hoàng
items.scrolls.exotic.scrollofenchantment.armor=Chọn một biểu tượng để áp dụng lên áo giáp của bạn.
items.scrolls.exotic.scrollofenchantment.cancel=Hủy bỏ
items.scrolls.exotic.scrollofenchantment.cancel_warn=Việc hủy bỏ vẫn sẽ tiêu hao cuộn phép thuật của bạn, bạn có chắc không?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Không, tôi đã thay đổi ý định.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Vâng, tôi chắc chắn rồi.
items.scrolls.exotic.scrollofenchantment.desc=Cuộn giấy này sẽ truyền năng lượng ma thuật mạnh mẽ vào vũ khí hoặc áo giáp. Người đọc thậm chí còn có một số quyền kiểm soát nhất định đối với loại ma thuật được truyền vào.
items.scrolls.exotic.scrollofenchantment.inv_title=Phù phép một vật phẩm
items.scrolls.exotic.scrollofenchantment.name=cuộn giấy phép thuật
items.scrolls.exotic.scrollofenchantment.weapon=Chọn một phép thuật để áp dụng cho vũ khí của bạn.
items.scrolls.exotic.scrollofforesight.desc=Sau khi đọc cuộn giấy này, chi tiết về địa hình xung quanh sẽ liên tục được truyền tải đến tâm trí người đọc một cách rõ nét. Hiệu ứng này kéo dài trong một khoảng thời gian đáng kể và sẽ tiết lộ tất cả các cửa hoặc cạm bẫy ẩn, khiến việc tìm kiếm trở nên không cần thiết.
items.scrolls.exotic.scrollofforesight.name=cuộn giấy tiên tri
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Việc hủy bỏ vẫn sẽ tiêu hao cuộn giấy biến hình của bạn, bạn có chắc không?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Hãy chọn một tài năng để phát triển.
items.scrolls.exotic.scrollofmetamorphosis.desc=Cuộn giấy này chứa phép thuật biến đổi mạnh mẽ, sẽ tác động lên người thi triển phép thuật thay vì vật phẩm. Phép thuật của cuộn giấy này cho phép bạn chọn một kỹ năng và thay thế nó bằng một trong năm kỹ năng cùng cấp bậc từ các lớp anh hùng khác nhau! Hiệu ứng này chỉ áp dụng cho kỹ năng của lớp, không áp dụng cho kỹ năng có được từ phân lớp hoặc khả năng của giáp. Các kỹ năng mà bạn không thể sử dụng sẽ không được đưa ra làm lựa chọn.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=tài năng biến đổi
items.scrolls.exotic.scrollofmetamorphosis.name=cuộn giấy biến thái
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Hãy chọn một tài năng mới để thay thế tài năng đã biến đổi của bạn.
items.scrolls.exotic.scrollofmysticalenergy.desc=Sức mạnh ma thuật tiềm ẩn trong cuộn giấy này, khi được giải phóng, sẽ dần dần nạp năng lượng cho các vật phẩm mà người dùng đang trang bị.
items.scrolls.exotic.scrollofmysticalenergy.name=cuộn năng lượng huyền bí
items.scrolls.exotic.scrollofpassage.desc=Câu thần chú trên mảnh giấy da này ngay lập tức đưa người đọc đến khu vực gần nhất ở tầng trên. Rất tiện lợi để nhanh chóng đến một cửa hàng.
items.scrolls.exotic.scrollofpassage.name=cuộn giấy thông hành
items.scrolls.exotic.scrollofprismaticimage.desc=Câu thần chú trên cuộn giấy này sẽ tạo ra một bản sao ảo đầy màu sắc của người đọc. Hình ảnh lăng kính này hoạt động như một bản sao yếu hơn của người đọc, với khả năng phòng thủ tương tự nhưng máu và sát thương thấp hơn. Hình ảnh lăng kính sẽ hiện ra khi có kẻ thù và sẽ cố gắng bảo vệ người đọc. Nếu hình ảnh lăng kính đã tồn tại, sử dụng cuộn giấy này sẽ hồi phục hoàn toàn cho nó.
items.scrolls.exotic.scrollofprismaticimage.name=cuộn hình ảnh lăng kính
items.scrolls.exotic.scrollofpsionicblast.desc=Cuộn giấy này chứa đựng nguồn năng lượng hủy diệt khủng khiếp, có thể được dẫn truyền để phá hủy tâm trí của tất cả sinh vật hữu hình. Tuy nhiên, sẽ có phản hồi đáng kể, và người đọc cũng sẽ bị tổn thương, mù lòa và suy yếu. Cuộn giấy càng tác động đến nhiều mục tiêu, người đọc càng ít bị tổn thương.
items.scrolls.exotic.scrollofpsionicblast.name=cuộn giấy phép thuật tấn công tâm linh
items.scrolls.exotic.scrollofpsionicblast.ondeath=Vụ nổ tâm linh sẽ xé nát tâm trí bạn...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Sinh vật này đã bị mê hoặc bởi phép thuật của một cuộn giấy chứa bài hát của nàng tiên cá.\n\nMột nhân vật bị mê hoặc sẽ trở thành đồng minh vĩnh viễn của bạn và sẽ chiến đấu chống lại bất kỳ kẻ thù nào mà họ gặp phải.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=say mê
items.scrolls.exotic.scrollofsirenssong.cancel=Bạn phải chọn một mục tiêu.
items.scrolls.exotic.scrollofsirenssong.desc=Đọc cuộn giấy này sẽ phát ra một giai điệu quyến rũ, mê hoặc kẻ thù được nhắm mục tiêu, biến chúng thành đồng minh vĩnh viễn! Những kẻ thù khác nghe thấy sẽ bị mê hoặc tạm thời. Những kẻ thù đặc biệt mạnh có thể chống lại hiệu ứng mê hoặc, và thay vào đó sẽ bị mê hoặc.
items.scrolls.exotic.scrollofsirenssong.name=cuộn giấy bài hát của nàng tiên cá
items.scrolls.exotic.scrollofsirenssong.no_target=Cuộn giấy được kích hoạt mà không cần mục tiêu.
items.scrolls.exotic.scrollofsirenssong.prompt=Chọn mục tiêu
items.scrolls.inventoryscroll.no=Không, tôi đã thay đổi ý định.
items.scrolls.inventoryscroll.warning=Bạn có thực sự muốn hủy bỏ việc sử dụng cuộn này không? Cuộn này chưa được nhận diện trước đó, vì vậy nó sẽ được sử dụng dù sao đi nữa.
items.scrolls.inventoryscroll.yes=Vâng, tôi chắc chắn.
items.scrolls.scroll$placeholder.name=cuộn
items.scrolls.scroll.ac_read=ĐỌC
items.scrolls.scroll.berkanan=cuộn giấy BERKANAN
items.scrolls.scroll.blinded=Bạn không thể đọc cuộn giấy khi bị mù.
items.scrolls.scroll.cursed=Cuốn sách phép thuật bị nguyền rủa của bạn ngăn cản bạn sử dụng phép thuật của cuộn giấy này! Tuy nhiên, một cuộn giấy hóa giải lời nguyền có thể vẫn đủ mạnh để phát huy tác dụng...
items.scrolls.scroll.gyfu=cuộn giấy GYFU
items.scrolls.scroll.isaz=cuộn giấy của ISAZ
items.scrolls.scroll.kaunan=cuộn giấy của KAUNAN
items.scrolls.scroll.laguz=cuộn giấy của LAGUZ
items.scrolls.scroll.mannaz=cuộn giấy của MANNAZ
items.scrolls.scroll.naudiz=cuộn giấy của NAUDIZ
items.scrolls.scroll.no_magic=Bạn không thể đọc cuộn giấy khi đang miễn nhiễm với phép thuật.
items.scrolls.scroll.odal=cuộn ODAL
items.scrolls.scroll.raido=cuộn RAIDO
items.scrolls.scroll.sowilo=cuộn giấy SOWILO
items.scrolls.scroll.tiwaz=cuộn giấy TIWAZ
items.scrolls.scroll.unknown_desc=Tấm giấy da này phủ đầy chữ không thể đọc được, với cổ tự %s làm tiêu đề. Ai biết được chuyện gì sẽ xảy ra nếu đọc thành tiếng?
items.scrolls.scroll.yngvi=cuộn giấy YNGVI
items.scrolls.scrollofidentify.desc=Tiết lộ vĩnh viễn tất cả bí mật của một vật phẩm duy nhất.
items.scrolls.scrollofidentify.inv_title=Xác định một vật phẩm
items.scrolls.scrollofidentify.it_is=Sản phẩm của bạn đã được xác định: %s.
items.scrolls.scrollofidentify.name=cuộn giấy nhận diện
items.scrolls.scrolloflullaby.desc=Một giai điệu êm dịu sẽ đưa tất cả sinh vật trong tầm nhìn của bạn vào giấc ngủ sâu, tạo cơ hội cho bạn bỏ chạy hoặc tấn công bất ngờ chúng.
items.scrolls.scrolloflullaby.name=cuộn giấy ru ngủ
items.scrolls.scrolloflullaby.sooth=Cuộn giấy phát ra một giai điệu êm dịu. Bạn cảm thấy rất buồn ngủ.
items.scrolls.scrollofmagicmapping.desc=Khi cuộn giấy này được đọc, một hình ảnh rõ nét như pha lê sẽ khắc sâu vào trí nhớ của bạn, cho bạn biết chính xác bố cục của màn chơi và tiết lộ tất cả những bí mật ẩn giấu. Vị trí của các vật phẩm và sinh vật sẽ vẫn chưa được biết.
items.scrolls.scrollofmagicmapping.layout=Giờ bạn đã nắm được bố cục của màn chơi.
items.scrolls.scrollofmagicmapping.name=cuộn giấy lập bản đồ
items.scrolls.scrollofmirrorimage.copies=Cuộn giấy tạo thành hình ảnh phản chiếu của bạn.
items.scrolls.scrollofmirrorimage.desc=Câu thần chú trên cuộn giấy này sẽ tạo ra những bản sao ảo ảnh của người đọc, chúng sẽ truy đuổi kẻ thù của người đó.
items.scrolls.scrollofmirrorimage.name=cuộn giấy hình ảnh phản chiếu
items.scrolls.scrollofmirrorimage.no_copies=Cuộn giấy cố gắng tạo ra những hình ảnh phản chiếu của bạn, nhưng chúng không có nơi nào để đi.
items.scrolls.scrollofrage.desc=Khi được đọc to, cuộn giấy này sẽ phát ra một tiếng gầm lớn thu hút tất cả kẻ thù về phía người đọc và làm cho những kẻ ở gần đó nổi giận.
items.scrolls.scrollofrage.name=cuộn giấy giận dữ
items.scrolls.scrollofrage.roar=Cuộn giấy phát ra tiếng gầm rú giận dữ vang vọng khắp hầm ngục!
items.scrolls.scrollofrecharging.desc=Sức mạnh ma thuật tiềm ẩn trong tấm giấy da này, khi được giải phóng, sẽ nạp đầy năng lượng cho tất cả các cây đũa phép của người đọc.
items.scrolls.scrollofrecharging.name=cuộn giấy nạp năng lượng
items.scrolls.scrollofrecharging.surge=Một luồng năng lượng mạnh mẽ tràn ngập cơ thể bạn, tiếp thêm sinh lực cho những chiếc đũa phép!
items.scrolls.scrollofremovecurse.cleansed=Vật phẩm của bạn tỏa sáng với ánh sáng thanh tẩy, và năng lượng xấu xa tan biến!
items.scrolls.scrollofremovecurse.desc=Câu thần chú trên cuộn giấy này sẽ ngay lập tức loại bỏ khỏi vũ khí, áo giáp, nhẫn và các vật phẩm mà người đọc mang theo bất kỳ bùa chú xấu xa nào có thể ngăn cản người đeo tháo chúng ra.
items.scrolls.scrollofremovecurse.inv_title=Làm sạch một vật phẩm
items.scrolls.scrollofremovecurse.name=cuộn giấy hóa giải lời nguyền
items.scrolls.scrollofremovecurse.not_cleansed=Vật phẩm của bạn phát ra ánh sáng thanh tẩy, nhưng không có gì xảy ra.
items.scrolls.scrollofremovecurse.spirit=Cuộn giấy của bạn giải thoát linh hồn bị dày vò!
items.scrolls.scrollofretribution.blast=Một nguồn năng lượng ma thuật mạnh mẽ bùng phát từ cuộn giấy!
items.scrolls.scrollofretribution.desc=Cuộn giấy này chứa đựng năng lượng hủy diệt, truyền dẫn nỗi đau khổ của người đọc ra ngoài thành một luồng năng lượng mạnh mẽ. Người đọc càng yếu, sát thương gây ra càng lớn. Khi máu còn rất thấp, cuộn giấy này có thể tiêu diệt hầu hết kẻ thù ngay lập tức. Tuy nhiên, việc sử dụng cuộn giấy sẽ gây tổn hại cho người dùng, làm họ bị mù và suy yếu.
items.scrolls.scrollofretribution.name=cuộn giấy báo thù
items.scrolls.scrollofteleportation.cant_reach=Bạn không thể dịch chuyển tức thời đến đó.
items.scrolls.scrollofteleportation.desc=Câu thần chú trên mảnh giấy da này ngay lập tức đưa người đọc đến một vị trí ngẫu nhiên trong hầm ngục. Nó có thể được sử dụng để thoát khỏi tình huống nguy hiểm, nhưng người đọc không may mắn có thể thấy mình ở một nơi còn nguy hiểm hơn.
items.scrolls.scrollofteleportation.name=cuộn giấy dịch chuyển tức thời
items.scrolls.scrollofteleportation.no_tele=Phép thuật dịch chuyển tức thời thất bại.
items.scrolls.scrollofteleportation.prompt=Chọn một địa điểm để dịch chuyển tức thời
items.scrolls.scrollofteleportation.tele=Chỉ trong nháy mắt, bạn đã được dịch chuyển đến một vị trí khác trong màn chơi.
items.scrolls.scrollofterror.desc=Một luồng ánh sáng đỏ lóe lên sẽ khiến tất cả sinh vật trong tầm nhìn của bạn khiếp sợ, và chúng sẽ quay đầu bỏ chạy. Tấn công kẻ thù đang bỏ chạy sẽ làm tan biến hiệu ứng này.
items.scrolls.scrollofterror.many=Cuộn giấy phát ra một luồng ánh sáng đỏ rực rỡ và lũ quái vật bỏ chạy!
items.scrolls.scrollofterror.name=cuộn giấy kinh hoàng
items.scrolls.scrollofterror.none=Cuộn giấy phát ra một luồng ánh sáng đỏ rực rỡ.
items.scrolls.scrollofterror.one=Cuộn giấy phát ra một luồng ánh sáng đỏ rực rỡ và %s bỏ chạy!
items.scrolls.scrolloftransmutation.desc=Cuộn giấy này chứa phép thuật biến đổi mạnh mẽ. Khi được sử dụng trên một vật phẩm phù hợp, nó sẽ biến đổi vật phẩm đó thành một vật phẩm khác cùng loại. Phép thuật này thậm chí còn giữ nguyên các nâng cấp, bùa chú và ký hiệu. Các cuộn giấy và thuốc sẽ được biến đổi thành phiên bản hiếm có của chúng, và ngược lại.
items.scrolls.scrolloftransmutation.inv_title=Biến đổi một vật phẩm
items.scrolls.scrolloftransmutation.morph=Vật phẩm của bạn biến đổi thành một thứ khác!
items.scrolls.scrolloftransmutation.name=cuộn giấy biến đổi
items.scrolls.scrolloftransmutation.nothing=Chẳng có gì thú vị xảy ra cả.
items.scrolls.scrollofupgrade.desc=Cuộn giấy này sẽ nâng cấp một vật phẩm duy nhất, cải thiện chất lượng của nó. Gậy phép sẽ tăng sức mạnh và số lần sử dụng; vũ khí sẽ gây sát thương lớn hơn hoặc trúng mục tiêu thường xuyên hơn; áo giáp sẽ đỡ được nhiều đòn tấn công hơn; hiệu quả của chiếc nhẫn đối với người đeo sẽ được tăng cường. Vũ khí và áo giáp cũng sẽ cần ít sức mạnh hơn để sử dụng, và mọi lời nguyền trên vật phẩm sẽ được hóa giải.
items.scrolls.scrollofupgrade.inv_title=Nâng cấp một vật phẩm
items.scrolls.scrollofupgrade.name=cuộn giấy nâng cấp
items.scrolls.scrollofupgrade.remove_curse=Cuộn giấy nâng cấp sẽ hóa giải lời nguyền trên vật phẩm của bạn!
items.scrolls.scrollofupgrade.weaken_curse=Cuộn giấy nâng cấp làm suy yếu lời nguyền trên vật phẩm của bạn.
items.spells.alchemize$wndalchemizeitem.energize=Chuyển thành năng lượng %d
items.spells.alchemize$wndalchemizeitem.energize_1=Chuyển đổi 1 thành năng lượng %d
items.spells.alchemize$wndalchemizeitem.energize_all=Chuyển đổi tất cả thành năng lượng %d
items.spells.alchemize$wndalchemizeitem.sell=Chuyển thành %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Chuyển số 1 thành %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Chuyển tất cả thành %dg
items.spells.alchemize.desc=Phép thuật này chứa sức mạnh biến đổi tương tự như sức mạnh trong một chiếc nồi luyện kim. Mỗi lần niệm phép cho phép người dùng biến một vật phẩm (hoặc một chồng vật phẩm) thành vàng hoặc năng lượng luyện kim. Biến thuốc hoặc cuộn giấy thành năng lượng thậm chí còn giúp xác định chúng!\n\nMột vài lần sử dụng phép Alchemize được bán trong các cửa hàng, nhưng có thể tạo ra nhiều hơn nữa bằng cách sử dụng thuật luyện kim bằng cách kết hợp một hạt giống, một viên đá rune và một ít năng lượng luyện kim.
items.spells.alchemize.name=giả kim thuật
items.spells.alchemize.prompt=Biến đổi vật phẩm
items.spells.beaconofreturning.creatures=Hào quang tâm linh của các sinh vật lân cận không cho phép bạn dịch chuyển tức thời vào lúc này.
items.spells.beaconofreturning.desc=Phép thuật phức tạp này cho phép người dùng quay trở lại một vị trí đã định, bất kể khoảng cách. Phép thuật chỉ bị tiêu hao khi người dùng quay trở lại, có thể thiết lập nhiều lần tùy thích, nhưng nó chỉ ghi nhớ vị trí gần nhất mà người dùng đã thiết lập.
items.spells.beaconofreturning.desc_set=Thiết bị định vị này được đặt ở đâu đó trên tầng %d.
items.spells.beaconofreturning.name=ngọn hải đăng trở về
items.spells.beaconofreturning.preventing=Luồng năng lượng ma thuật mạnh mẽ của nơi này ngăn cản bạn sử dụng phép thuật!
items.spells.beaconofreturning.set=Thiết bị định vị đã được đặt tại vị trí hiện tại của bạn.
items.spells.beaconofreturning.wnd_body=Việc thiết lập này sẽ ghi đè lên vị trí mà thiết bị định vị đã được thiết lập trước đó. \n\nReturning sẽ đưa bạn trở lại vị trí đã thiết lập lần cuối và tiêu hao một lần sử dụng phép thuật.
items.spells.beaconofreturning.wnd_return=TRỞ LẠI
items.spells.beaconofreturning.wnd_set=BỘ
items.spells.curseinfusion.desc=Phép thuật này truyền vào một món trang bị loại ma thuật độc ác mạnh mẽ tương tự như trong DM-300. Vật phẩm được sử dụng phép thuật này sẽ ngay lập tức bị nguyền rủa, và mọi bùa chú hoặc ký hiệu mà nó có sẽ bị ghi đè.\n\nTrong trường hợp vũ khí, áo giáp và đũa phép, vật phẩm sẽ nhận được các nâng cấp ngoài việc bị nguyền rủa. Các nâng cấp truyền lời nguyền không cộng dồn, và các nâng cấp sẽ bị mất nếu vật phẩm được giải nguyền.\n\nNhiều lần truyền lời nguyền cũng có thể được sử dụng để thay đổi lời nguyền trên vũ khí hoặc áo giáp.
items.spells.curseinfusion.inv_title=Nguyền rủa một vật phẩm
items.spells.curseinfusion.name=truyền lời nguyền
items.spells.magicalinfusion.desc=Phép thuật này sở hữu sức mạnh ma thuật tương tự như cuộn giấy nâng cấp, nhưng ở dạng ổn định hơn. Ngoài việc nâng cấp vật phẩm như bình thường, nó sẽ không bao giờ xóa bỏ bùa chú, ký hiệu hoặc lời nguyền.
items.spells.magicalinfusion.infuse=Vật phẩm của bạn được truyền năng lượng huyền bí!
items.spells.magicalinfusion.inv_title=Truyền năng lượng vào một vật phẩm
items.spells.magicalinfusion.name=sự truyền phép kỳ diệu
items.spells.magicalporter.desc=Phép thuật này sẽ dịch chuyển bất kỳ vật phẩm nào được niệm lên. Tuy nhiên, không giống như ngọn hải đăng của thương nhân, các vật phẩm sẽ được dịch chuyển đến lối vào tầng trùm tiếp theo.
items.spells.magicalporter.inv_title=Vận chuyển một mặt hàng
items.spells.magicalporter.name=người khuân vác ma thuật
items.spells.magicalporter.nowhere=Bạn không thể chuyển vật phẩm đến bất kỳ nơi nào.
items.spells.phaseshift.desc=Phép thuật hỗn loạn này sẽ dịch chuyển tức thời bất kỳ nhân vật nào bị nhắm mục tiêu đến một vị trí ngẫu nhiên trên tầng hiện tại và làm choáng họ trong một khoảng thời gian đáng kể. Kẻ thù mạnh mẽ sẽ có khả năng chống lại hiệu ứng choáng. Phép thuật này có thể được nhắm vào mục tiêu hoặc chính người sử dụng.
items.spells.phaseshift.name=sự dịch chuyển pha
items.spells.phaseshift.no_target=Không có gì để dịch chuyển đến đó cả.
items.spells.reclaimtrap.desc=Phép thuật này chứa đựng tàn dư năng lượng cơ học của DM-300. Khi được niệm lên một cái bẫy đang hoạt động, sức mạnh của cái bẫy sẽ bám vào bạn, cho phép bạn sử dụng phép thuật này một lần nữa để giải phóng sức mạnh đó và kích hoạt hiệu ứng của bẫy ở bất kỳ vị trí nào bạn muốn. Tuy nhiên, một số bẫy có thể không hoạt động ở mọi nơi, và chỉ có thể lưu trữ một bẫy tại một thời điểm.
items.spells.reclaimtrap.desc_trap=Phép thuật hiện đang sẵn sàng kích hoạt _%s._
items.spells.reclaimtrap.name=bẫy thu hồi
items.spells.reclaimtrap.no_trap=Ở đó không có bẫy.
items.spells.recycle.desc=Phép thuật này chứa một dạng ma thuật biến đổi yếu hơn. Mặc dù không có tác dụng với trang bị, phép thuật này sẽ biến đổi một cuộn giấy, lọ thuốc, hạt giống, đá rune hoặc phi tiêu tẩm độc thành một vật phẩm ngẫu nhiên cùng loại.
items.spells.recycle.inv_title=Tái chế một món đồ
items.spells.recycle.name=tái chế
items.spells.recycle.recycled=Sản phẩm của bạn đã được tái chế thành: %s.
items.spells.spell.ac_cast=DÀN DIỄN VIÊN
items.spells.spell.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.spells.spell.no_magic=Bạn không thể niệm phép khi đang miễn nhiễm với phép thuật.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Phép thuật này dẫn truyền năng lượng của các tàn lửa nguyên tố được sử dụng để tạo ra nó, và sẽ cho phép bạn triệu hồi một nguyên tố đồng minh để chiến đấu cùng bạn! Chỉ có thể triệu hồi một nguyên tố tại một thời điểm, nhưng phép thuật có thể được thi triển lại để đưa nguyên tố trở lại với bạn mà không mất phí.
items.spells.summonelemental.desc_chaos=Phép thuật này hiện đang tỏa ra năng lượng hỗn loạn, nó sẽ triệu hồi một _nguyên tố hỗn loạn_. Bạn có thể truyền năng lượng vào một vật phẩm khác, nhưng phép thuật sẽ mất đi hiệu ứng truyền năng lượng hiện tại.
items.spells.summonelemental.desc_fire=Phép thuật này hiện đang rất nóng khi chạm vào, nó sẽ triệu hồi một _nguyên tố lửa_. Bạn có thể truyền năng lượng vào một vật phẩm khác, nhưng phép thuật sẽ mất đi hiệu ứng truyền năng lượng hiện tại.
items.spells.summonelemental.desc_frost=Phép thuật này hiện đang lạnh khi chạm vào, nó sẽ triệu hồi một _nguyên tố băng giá_. Bạn có thể truyền năng lượng vào một vật phẩm khác, nhưng phép thuật sẽ mất đi hiệu ứng truyền năng lượng hiện tại.
items.spells.summonelemental.desc_newborn=Phép thuật hiện tại chưa được cường hóa, và sẽ triệu hồi một _nguyên tố sơ sinh_ mà không cần tấn công tầm xa. Bạn có thể cường hóa một lọ thuốc lửa lỏng, lọ thuốc băng giá, cuộn giấy nạp năng lượng hoặc cuộn giấy biến đổi đã được xác định để tăng sức mạnh cho phép thuật, khiến những lần triệu hồi sau này sẽ là những nguyên tố mạnh mẽ!
items.spells.summonelemental.desc_shock=Phép thuật hiện đang phát ra năng lượng tĩnh điện, nó sẽ triệu hồi một _nguyên tố điện giật_. Bạn có thể truyền năng lượng vào một vật phẩm khác, nhưng phép thuật sẽ mất đi hiệu ứng truyền năng lượng hiện tại.
items.spells.summonelemental.imbue_prompt=Truyền năng lượng vào vật phẩm
items.spells.summonelemental.name=triệu hồi nguyên tố
items.spells.targetedspell.inv_title=Truyền năng lượng vào một vật phẩm
items.spells.targetedspell.prompt=Chọn mục tiêu
items.spells.telekineticgrab.cant_grab=Bạn không thể lấy được thứ đó.
items.spells.telekineticgrab.desc=Phép thuật này cho phép người thi triển phép thuật điều khiển từ xa để lấy tất cả vật phẩm tại một vị trí, hoặc tất cả vũ khí bị ném trúng kẻ thù! Nó không thể được sử dụng để lấy vật phẩm thuộc sở hữu của người khác, hoặc để lấy các vật chứa như rương.
items.spells.telekineticgrab.name=nắm bắt bằng năng lực điều khiển từ xa
items.spells.telekineticgrab.no_target=Không có gì để nắm lấy ở đó cả.
items.spells.unstablespell.desc=Viên pha lê vuông nhỏ màu đen này có các biểu tượng rune thay đổi trên mỗi bề mặt của nó.\n\nKhi được kích hoạt, nó sẽ kích hoạt hiệu ứng của một cuộn giấy ngẫu nhiên. Hiệu ứng của cuộn giấy sẽ luôn tập trung vào chiến đấu nếu có kẻ thù trong tầm nhìn của bạn, và sẽ luôn không tập trung vào chiến đấu nếu không có kẻ thù.
items.spells.unstablespell.name=phép thuật không ổn định
items.spells.wildenergy.desc=Phép thuật này chứa một phần năng lượng bị nguyền rủa từng cung cấp năng lượng cho DM-300. Khi được thi triển, nó sẽ nạp lại năng lượng cho đũa phép và các vật phẩm bạn đang đeo, đồng thời kích hoạt một hiệu ứng bị nguyền rủa ngẫu nhiên trên đũa phép. Tuy nhiên, bạn có thể chọn hướng cho phép thuật bị nguyền rủa này tác động.
items.spells.wildenergy.name=năng lượng hoang dã
items.stones.inventorystone.ac_use=SỬ DỤNG
items.stones.runestone$placeholder.name=đá rune
items.stones.runestone.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục, hoặc chế tạo nó thông qua thuật giả kim.
items.stones.stoneofaggression$aggression.desc=Phép thuật thao túng khiến tất cả kẻ thù gần đó đều muốn tấn công nhân vật này.\n\nSố lượt còn lại: %s.
items.stones.stoneofaggression$aggression.name=nhắm mục tiêu
items.stones.stoneofaggression.desc=Khi ném viên đá này vào đồng minh hoặc kẻ thù, tất cả kẻ thù gần đó sẽ ưu tiên tấn công nhân vật đó trong một thời gian ngắn. Tuy nhiên, kẻ thù cấp Boss có thể kháng lại hiệu ứng này, làm giảm đáng kể thời gian tác dụng và chịu ít sát thương hơn từ các đòn tấn công của tay sai.
items.stones.stoneofaggression.name=hòn đá của sự hung hãn
items.stones.stoneofaugmentation$wndaugment.cancel=Đừng bận tâm
items.stones.stoneofaugmentation$wndaugment.choice=Bạn muốn cải thiện điều gì?
items.stones.stoneofaugmentation$wndaugment.damage=Hư hại
items.stones.stoneofaugmentation$wndaugment.defense=Phòng thủ
items.stones.stoneofaugmentation$wndaugment.evasion=Trốn tránh
items.stones.stoneofaugmentation$wndaugment.none=Loại bỏ phần tăng cường
items.stones.stoneofaugmentation$wndaugment.speed=Tốc độ
items.stones.stoneofaugmentation.desc=Viên đá rune này sở hữu ma thuật mạnh mẽ, có thể tăng cường trang bị để cải thiện một thuộc tính này nhưng lại làm giảm thuộc tính khác. Sử dụng lên vũ khí sẽ giúp bạn tăng tốc độ hoặc sát thương. Vũ khí ném cũng sẽ tăng hoặc giảm độ bền tỷ lệ thuận với tốc độ của chúng. Sử dụng lên áo giáp sẽ giúp bạn tăng cường khả năng phòng thủ hoặc né tránh.
items.stones.stoneofaugmentation.discover_hint=Bạn có thể mua vật phẩm này ở cửa hàng hoặc chế tạo nó thông qua thuật giả kim.
items.stones.stoneofaugmentation.inv_title=Tăng cường một vật phẩm
items.stones.stoneofaugmentation.name=đá tăng trưởng
items.stones.stoneofblast.desc=Viên đá ma thuật này sẽ phát nổ ngay lập tức tại vị trí được ném đến. Giống như một quả bom, vụ nổ sẽ gây sát thương cho bất cứ thứ gì ở gần đó.
items.stones.stoneofblast.name=đá nổ
items.stones.stoneofblink.desc=Viên đá ma thuật này sẽ dịch chuyển người dùng đến vị trí mà nó được ném tới.
items.stones.stoneofblink.name=viên đá chớp mắt
items.stones.stoneofclairvoyance.desc=Viên đá này sẽ ngay lập tức làm lộ tất cả các ô gạch trong một khu vực rất rộng xung quanh nơi nó được ném. Tác dụng của nó thậm chí còn xuyên qua cả tường.
items.stones.stoneofclairvoyance.name=đá thấu thị
items.stones.stoneofdeepsleep.desc=Khi ném hòn đá này vào kẻ thù, nó sẽ khiến chúng rơi vào giấc ngủ ma thuật sâu. Kẻ thù bị ngủ ma thuật sẽ ngủ mãi mãi cho đến khi bị quấy rầy.
items.stones.stoneofdeepsleep.name=hòn đá của giấc ngủ sâu
items.stones.stoneofdetectmagic.desc=Viên đá rune này có khả năng phát hiện ma thuật tác động lên vật phẩm. Sử dụng viên đá này trên một vật phẩm chưa được xác định sẽ cho bạn biết liệu nó có bị ảnh hưởng bởi lời nguyền độc ác hay không, và liệu nó có bị ảnh hưởng bởi ma thuật tích cực như bùa chú hoặc nâng cấp hay không.
items.stones.stoneofdetectmagic.detected_bad=Bạn phát hiện ma thuật độc ác đang ảnh hưởng đến vật phẩm này!
items.stones.stoneofdetectmagic.detected_both=Bạn phát hiện cả ma thuật tích cực và tiêu cực đang tác động lên vật phẩm này!
items.stones.stoneofdetectmagic.detected_good=Bạn cảm nhận được năng lượng ma thuật tích cực đang tác động lên vật phẩm này!
items.stones.stoneofdetectmagic.detected_none=Bạn không phát hiện ra bất kỳ phép thuật nào tác động đến vật phẩm này.
items.stones.stoneofdetectmagic.inv_title=Phát hiện một vật phẩm
items.stones.stoneofdetectmagic.name=viên đá phát hiện ma thuật
items.stones.stoneofdisarming.desc=Viên đá ma thuật này có khả năng vô hiệu hóa những cạm bẫy nguy hiểm ẩn giấu khắp hầm ngục. Nó có thể vô hiệu hóa tối đa 9 cạm bẫy xung quanh khu vực bị ném vào.
items.stones.stoneofdisarming.name=đá tước vũ khí
items.stones.stoneofenchantment.armor=Bộ giáp của bạn phát sáng trong bóng tối!
items.stones.stoneofenchantment.desc=Viên đá rune này sở hữu ma thuật mê hoặc. Không giống như cuộn giấy nâng cấp, nó sẽ không tăng sức mạnh trực tiếp của vật phẩm, mà thay vào đó sẽ truyền một phép thuật vào vũ khí hoặc áo giáp, ban cho chúng một sức mạnh mới.
items.stones.stoneofenchantment.inv_title=Phù phép một vật phẩm
items.stones.stoneofenchantment.name=viên đá mê hoặc
items.stones.stoneofenchantment.weapon=Vũ khí của bạn phát sáng trong bóng tối!
items.stones.stoneoffear.desc=Khi hòn đá này được ném vào một nhân vật, họ sẽ bị choáng ngợp bởi nỗi kinh hoàng và sẽ quay lưng bỏ chạy. Tấn công một nhân vật đang bỏ chạy sẽ làm giảm hiệu quả của nó.
items.stones.stoneoffear.name=hòn đá sợ hãi
items.stones.stoneofflock.desc=Viên đá ma thuật này sẽ triệu hồi những con cừu thần kỳ trong một thời gian ngắn xung quanh vị trí mà nó được ném đến.
items.stones.stoneofflock.name=đá của đàn
items.stones.stoneofintuition$wndguess.break=Viên đá trực giác của bạn tan thành bụi...
items.stones.stoneofintuition$wndguess.correct=Chính xác. Loại mặt hàng đã được xác định!
items.stones.stoneofintuition$wndguess.incorrect=Bạn đoán sai rồi.
items.stones.stoneofintuition$wndguess.text=Hãy đoán xem vật thể chưa xác định này thuộc loại nào. Nếu bạn đoán đúng, loại vật thể sẽ được xác định!
items.stones.stoneofintuition.break_info=Bạn có thể sử dụng đá trực giác hai lần trước khi một viên bị vỡ, _lần sử dụng tiếp theo sẽ không tiêu hao đá_.
items.stones.stoneofintuition.break_warn=Bạn đã từng sử dụng viên đá trực giác trước đây, vì vậy lần sử dụng tiếp theo của bạn sẽ tiêu hao một viên đá.
items.stones.stoneofintuition.desc=Viên đá rune này chứa một phiên bản yếu hơn của phép thuật được tìm thấy trong các cuộn giấy nhận dạng. Thay vì trực tiếp xác định một vật phẩm, nó sẽ hoạt động dựa trên trực giác của bạn, cho phép bạn thử xác định loại thuốc, cuộn giấy hoặc nhẫn bằng cách đoán.
items.stones.stoneofintuition.inv_title=Chọn một mục
items.stones.stoneofintuition.name=viên đá trực giác
items.stones.stoneofshock.desc=Viên đá rune này giải phóng một luồng năng lượng điện làm choáng váng tạm thời tất cả các mục tiêu gần đó, và tăng năng lượng cho cây trượng ném mỗi khi trúng mục tiêu.
items.stones.stoneofshock.name=hòn đá sốc
items.stylus.ac_inscribe=ĐĂNG KÝ
items.stylus.cursed=Phép thuật của bút cảm ứng sẽ không có tác dụng với bộ giáp bị nguyền rủa.
items.stylus.desc=Chiếc bút ma thuật này được làm từ một loại đá tối màu, rất cứng. Sử dụng nó, bạn có thể khắc một ký hiệu ma thuật lên áo giáp của mình, nhưng bạn không có quyền lựa chọn ký hiệu đó là gì, chiếc bút sẽ quyết định thay cho bạn.
items.stylus.identify=Trước tiên, bạn phải xác định xem bộ giáp đó có bị nguyền rủa hay không.
items.stylus.inscribed=Bạn đã khắc lên áo giáp của mình bằng bút stylus.
items.stylus.name=bút chì bí ẩn
items.stylus.prompt=Chọn một bộ giáp
items.tengusmask.ac_wear=MẶC
items.tengusmask.desc=Chiếc mặt nạ này rơi khỏi mặt Tengu khi hắn chết, bạn có thể cảm nhận được sức mạnh ma thuật to lớn tỏa ra từ nó. Phải chăng chiếc mặt nạ là nguồn sức mạnh của Tengu? Khi đeo vào, sức mạnh to lớn của chiếc mặt nạ sẽ được truyền vào bạn, cho phép bạn _chọn một nhánh phụ cho anh hùng của mình._ Bạn sẽ chọn nhánh phụ nào?
items.tengusmask.discover_hint=Bạn có thể nhận được vật phẩm này khi tiêu diệt một số kẻ thù nhất định.
items.tengusmask.name=Mặt nạ Tengu
items.tengusmask.used=Chiếc mặt nạ tan rã khi sức mạnh của nó truyền vào bạn!
items.torch.ac_light=ÁNH SÁNG
items.torch.desc=Là vật dụng thiết yếu trong các cuộc phiêu lưu, khi hầm ngục tối tăm, ngọn đuốc có thể giúp soi đường.
items.torch.name=ngọn đuốc
items.trinkets.chaoticcenser.desc=Sau một thời gian trong nồi luyện kim, lư hương này dường như tự tạo ra khói! Khí tích tụ và sẽ phun ra từ lư hương về phía kẻ thù theo những khoảng thời gian ngẫu nhiên. Có vẻ như nó có khả năng tạo ra đủ loại khí, nhưng bạn sẽ nhận được một khoảnh khắc cảnh báo ngay trước khi lư hương hoạt động.
items.trinkets.chaoticcenser.name=lư hương hỗn loạn
items.trinkets.chaoticcenser.spew=Lư hương của bạn sắp phun ra: %s.
items.trinkets.chaoticcenser.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ tạo ra một loại khí độc hại gần kẻ thù khoảng mỗi _%d_ lượt. Khí chỉ xuất hiện khi có kẻ thù. Ở cấp độ cao hơn, các loại khí này có nhiều khả năng là khí độc hại và mạnh mẽ hơn.
items.trinkets.chaoticcenser.typical_stats_desc=Thông thường, vật phẩm này sẽ tạo ra một loại khí độc hại gần kẻ thù cứ sau khoảng _%d_ lượt. Khí độc chỉ xuất hiện khi có kẻ thù. Ở cấp độ cao hơn, các loại khí này có nhiều khả năng là khí độc hại và mạnh mẽ hơn.
items.trinkets.crackedspyglass.desc=Chiếc kính viễn vọng cầm tay này sẽ là minh chứng cho sự khéo léo và chính xác tuyệt vời, nếu không phải vì vết nứt dọc theo thấu kính phía trước. Chiếc kính viễn vọng dường như đang giúp bạn bằng cách hé lộ những vật phẩm mới trong hầm ngục, nhưng do khuyết điểm của nó nên những vật phẩm được hé lộ khá khó nhìn!
items.trinkets.crackedspyglass.name=kính viễn vọng bị nứt
items.trinkets.crackedspyglass.stats_desc=Ở cấp độ hiện tại, vật phẩm này có _%1$s%% xác suất_ tạo ra thêm một vật phẩm ẩn trên mỗi tầng không phải tầng trùm.
items.trinkets.crackedspyglass.stats_desc_upgraded=Ở cấp độ hiện tại, vật phẩm này có _100%% cơ hội_ tạo ra thêm một vật phẩm ẩn trên mỗi tầng không phải tầng trùm, và _%1$s%% cơ hội_ tạo ra thêm một vật phẩm ẩn thứ hai.
items.trinkets.crackedspyglass.typical_stats_desc=Thông thường, vật phẩm này có _xác suất_ là _%1$s%% để tạo ra một vật phẩm ẩn bổ sung trên mỗi tầng không phải tầng trùm.
items.trinkets.dimensionalsundial.desc=Chiếc đồng hồ mặt trời cầm tay nhỏ bé này bằng cách nào đó lại có thể tạo ra bóng trong sâu thẳm hầm ngục, ngay cả khi bạn không cầm nó thẳng đứng. Điều kỳ lạ hơn nữa là vị trí của cái bóng dường như không liên quan gì đến mặt trời trong thế giới này. Khi không có bóng đổ, chiếc đồng hồ mặt trời dường như thu hút nguy hiểm.
items.trinkets.dimensionalsundial.name=đồng hồ mặt trời ba chiều
items.trinkets.dimensionalsundial.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ giảm tỷ lệ xuất hiện của kẻ thù xuống _%1$d%%_ vào ban ngày trong đời thực (8 giờ sáng - 8 giờ tối), và tăng tỷ lệ xuất hiện của kẻ thù lên _%2$d%%_ vào ban đêm (8 giờ tối - 8 giờ sáng).
items.trinkets.dimensionalsundial.typical_stats_desc=Thông thường, vật phẩm này sẽ làm giảm tỷ lệ xuất hiện của kẻ thù xuống _%1$d%%_ vào ban ngày trong đời thực (8 giờ sáng - 8 giờ tối), và tăng tỷ lệ xuất hiện của kẻ thù lên _%2$d%%_ vào ban đêm (8 giờ tối - 8 giờ sáng).
items.trinkets.dimensionalsundial.warning=Bạn cảm thấy không yên tâm vì đồng hồ mặt trời không đổ bóng.
items.trinkets.exoticcrystals.desc=Những tinh thể nhỏ màu hồng này có hình dạng giống với tinh thể năng lượng giả kim thuật. Mặc dù không thể sử dụng chúng trực tiếp để tạo năng lượng, nhưng dường như chúng đang ảnh hưởng đến các loại thuốc và cuộn giấy phép thuật mà bạn tìm thấy.
items.trinkets.exoticcrystals.name=tinh thể kỳ lạ
items.trinkets.exoticcrystals.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ thay thế _%s%%_ các loại thuốc hoặc cuộn giấy rơi ra bằng các vật phẩm hiếm tương đương. Điều này không ảnh hưởng đến thuốc tăng sức mạnh, cuộn giấy nâng cấp hoặc các vật phẩm được tạo ra để giúp giải quyết các phòng nguy hiểm.
items.trinkets.exoticcrystals.typical_stats_desc=Thông thường, vật phẩm này sẽ thay thế _%s%%_ các loại thuốc hoặc cuộn giấy rơi ra bằng các vật phẩm hiếm tương đương. Điều này không ảnh hưởng đến thuốc tăng sức mạnh, cuộn giấy nâng cấp hoặc các vật phẩm được tạo ra để giúp giải quyết các phòng nguy hiểm.
items.trinkets.eyeofnewt.desc=Con mắt của con kỳ nhông vàng đen này là một nguyên liệu phổ biến, nay được nâng tầm thành một món đồ trang sức. Con mắt này dường như làm giảm thị lực của bạn để đổi lấy việc cho phép bạn nhìn mọi vật theo một cách khác.
items.trinkets.eyeofnewt.name=mắt của kỳ nhông
items.trinkets.eyeofnewt.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ giảm tầm nhìn của bạn đi _%1$s%%_, nhưng cũng sẽ cho phép bạn nhìn thấy bằng tâm trí kẻ thù trong phạm vi _%2$d_ ô.
items.trinkets.eyeofnewt.typical_stats_desc=Thông thường, vật phẩm này sẽ làm giảm tầm nhìn của bạn đi _%1$s%%_, nhưng cũng sẽ cho phép bạn nhìn thấy bằng mắt thường kẻ thù trong phạm vi _%2$d_ ô.
items.trinkets.ferrettuft.desc=Một nhúm lông chồn trắng mượt, được giữ chặt bằng một dải ruy băng màu xanh lá cây thắt nơ. Chồn nổi tiếng với sự nhanh nhẹn, tinh nghịch và thiếu trung thực. Một phần sức mạnh đó dường như tỏa ra từ món đồ trang sức này, giúp chúng dễ dàng né tránh bất cứ thứ gì ở gần đó.
items.trinkets.ferrettuft.name=chùm lông chồn
items.trinkets.ferrettuft.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ tăng khả năng né tránh của tất cả nhân vật lên _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Thông thường, vật phẩm này sẽ tăng khả năng né tránh của tất cả nhân vật lên _%1$s%%_.
items.trinkets.mimictooth.desc=Chiếc răng sắc nhọn lớn này chắc hẳn đã được nhổ từ một con quái vật bắt chước nào đó rất bất hạnh. Có vẻ như nó đang ảnh hưởng đến những con quái vật bắt chước trong hầm ngục, khiến chúng xuất hiện thường xuyên hơn và nguy hiểm hơn.
items.trinkets.mimictooth.name=răng giả
items.trinkets.mimictooth.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ khiến tất cả các loại quái vật giả dạng _%1$sx_ trở nên phổ biến hơn và khó phát hiện hơn nhiều, đồng thời cũng làm tăng lượng vật phẩm chúng rơi ra. Mỗi tầng hầm ngục cũng sẽ có _%2$s%%_ cơ hội chứa thêm một con quái vật giả dạng đen tàng hình.
items.trinkets.mimictooth.typical_stats_desc=Thông thường, vật phẩm này sẽ khiến tất cả các loại quái vật giả dạng _%1$sx_ trở nên phổ biến hơn và khó phát hiện hơn nhiều, đồng thời cũng làm tăng lượng vật phẩm chúng rơi ra. Mỗi tầng hầm ngục cũng sẽ có _%2$s%%_ cơ hội chứa thêm một con quái vật giả dạng ebony tàng hình.
items.trinkets.mossyclump.desc=Cụm rêu ướt này dường như giữ chặt độ ẩm dù bạn có bóp mạnh đến đâu. Nó dường như có mối liên hệ kỳ diệu với chính hầm ngục, khiến cho cỏ và nước dễ xuất hiện hơn.
items.trinkets.mossyclump.name=cụm rêu
items.trinkets.mossyclump.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ khiến các tầng không theo chủ đề _%d%%_ trở nên ngập nước hoặc cỏ.\n\nVật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.trinkets.mossyclump.typical_stats_desc=Thông thường, vật phẩm này sẽ khiến các tầng không theo chủ đề trở nên ngập nước hoặc phủ cỏ. Vật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.trinkets.parchmentscrap.desc=Mảnh giấy da nhỏ này trông giống như được cắt ra từ một cuộn giấy. Nó vẫn giữ được một phần ma thuật của mình, và dường như đang ảnh hưởng đến vũ khí và áo giáp được tìm thấy trong hầm ngục.
items.trinkets.parchmentscrap.name=mảnh giấy da
items.trinkets.parchmentscrap.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ làm cho các phép thuật và ký hiệu _%dx_ trở nên phổ biến, và các lời nguyền trên vũ khí và áo giáp _%sx_ cũng trở nên phổ biến. Các lời nguyền trên gậy phép, nhẫn hoặc cổ vật không bị ảnh hưởng.\n\nVật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.trinkets.parchmentscrap.typical_stats_desc=Thông thường, vật phẩm này sẽ làm cho các phép thuật và ký hiệu _%dx_ trở nên phổ biến, và các lời nguyền trên vũ khí và áo giáp _%sx_ cũng trở nên phổ biến. Các lời nguyền trên gậy phép, nhẫn hoặc cổ vật không bị ảnh hưởng.\n\nVật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.trinkets.petrifiedseed.desc=Hạt giống này đã hóa thạch, có thể do quá trình địa chất diễn ra chậm hoặc do phép thuật. Hạt giống dường như đang tác động một cách kỳ diệu đến hệ thực vật trong hầm ngục, thỉnh thoảng thay thế hạt giống cây trồng bằng những phiến đá khắc chữ rune.
items.trinkets.petrifiedseed.name=hạt giống hóa đá
items.trinkets.petrifiedseed.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ khiến cỏ bị giẫm nát rơi ra đá rune thay vì hạt giống _%1$s%%_ trong một số trường hợp, và cũng sẽ khiến cỏ cao rơi ra vật phẩm _%2$s%%_ thường xuyên hơn.
items.trinkets.petrifiedseed.typical_stats_desc=Thông thường, vật phẩm này sẽ khiến cỏ bị giẫm nát rơi ra đá rune thay vì hạt giống _%1$s%%_ trong một số trường hợp, và cũng sẽ khiến cỏ cao rơi ra vật phẩm _%2$s%%_ thường xuyên hơn.
items.trinkets.ratskull.desc=Vật trang sức rùng rợn này không lớn hơn nhiều so với hộp sọ của một con chuột bình thường, vốn là một thứ hiếm gặp ở hầm ngục này. Ảnh hưởng ma thuật của hộp sọ dường như thu hút những cư dân hiếm hoi hơn của hầm ngục, khiến chúng xuất hiện thường xuyên hơn.
items.trinkets.ratskull.name=hộp sọ chuột
items.trinkets.ratskull.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ làm tăng khả năng xuất hiện của những kẻ thù hiếm và kỳ lạ _%dx_. Tuy nhiên, chiếc đầu lâu chỉ có hiệu quả bằng một nửa trong việc thu hút những kẻ bắt chước pha lê và tượng bọc thép.
items.trinkets.ratskull.typical_stats_desc=Thông thường, vật phẩm này sẽ làm tăng khả năng xuất hiện của những kẻ thù hiếm và kỳ lạ _%dx_. Tuy nhiên, chiếc đầu lâu chỉ có hiệu quả bằng một nửa trong việc thu hút những sinh vật giả dạng pha lê và tượng bọc thép.
items.trinkets.saltcube.desc=Tinh thể muối lớn này được cắt thành hình lập phương gần như hoàn hảo, và bằng cách nào đó nó đã hút hết một nửa lượng nước trong nồi luyện kim thay vì tan ra. Có vẻ như nó đang làm khô và bảo quản thức ăn bạn ăn một cách kỳ diệu, kéo dài cảm giác no, nhưng cũng làm giảm khả năng phục hồi sức khỏe khi bạn không bị đói.
items.trinkets.saltcube.name=viên muối
items.trinkets.saltcube.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ tăng thời gian trước khi bạn cảm thấy đói lên _%1$s%%_, nhưng cũng sẽ làm giảm tốc độ hồi phục sức khỏe của bạn đi _%2$s%%_ trừ khi tầng đó bị khóa.
items.trinkets.saltcube.typical_stats_desc=Thông thường, vật phẩm này sẽ kéo dài thời gian trước khi bạn cảm thấy đói thêm _%1$s%%_, nhưng cũng sẽ làm giảm tốc độ hồi phục sức khỏe của bạn đi _%2$s%%_ trừ khi tầng đó bị khóa.
items.trinkets.shardofoblivion$thrownusetracker.desc=Bạn vừa sử dụng một vũ khí ném không xác định, vũ khí này được tính là một trang bị không xác định đã sử dụng cho Mảnh Vỡ Lãng Quên trong một thời gian ngắn.\n\nSố lượt còn lại: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Vũ khí ném không xác định đã được sử dụng
items.trinkets.shardofoblivion$wandusetracker.desc=Bạn vừa sử dụng một cây đũa phép chưa xác định, và nó được tính là một món trang bị chưa xác định đã qua sử dụng cho Mảnh Vỡ Lãng Quên trong một thời gian ngắn.\n\nSố lượt còn lại: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Cây đũa phép không rõ nguồn gốc đã được sử dụng.
items.trinkets.shardofoblivion.ac_identify=NHẬN DẠNG
items.trinkets.shardofoblivion.desc=Sau khi được tôi luyện trong nồi luyện kim, mảnh kim loại bị nguyền rủa nhỏ bé này đã biến đổi thành... hư không? Ánh sáng dường như uốn cong xung quanh nó, và nó lơ lửng tại chỗ khi bạn không cầm nó. Mảnh kim loại dường như đang hút năng lượng từ sự thiếu hiểu biết của bạn một cách kỳ diệu, vì vậy tốt nhất là đừng nghĩ về nó quá nhiều.
items.trinkets.shardofoblivion.identify=Bạn hãy xác định vật phẩm đó!
items.trinkets.shardofoblivion.identify_not_yet=Vật phẩm đó hiện chưa thể được xác định.
items.trinkets.shardofoblivion.identify_prompt=Xác định một vật phẩm
items.trinkets.shardofoblivion.identify_ready=Một vật phẩm đã sẵn sàng để nhận dạng: %s. Hãy sử dụng Mảnh Vỡ Lãng Quên của bạn để nhận dạng nó.
items.trinkets.shardofoblivion.identify_ready_worn=Các vật phẩm bạn đã sử dụng giờ đã sẵn sàng để nhận dạng. Hãy sử dụng Mảnh Vỡ Lãng Quên (Shard of Oblivion) lên các vật phẩm để nhận dạng chúng.
items.trinkets.shardofoblivion.name=mảnh vỡ của sự lãng quên
items.trinkets.shardofoblivion.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ tăng tỷ lệ rơi đồ của kẻ thù lên 20%% cho mỗi món trang bị chưa được xác định mà bạn đã trang bị hoặc sử dụng gần đây, tối đa là _%d vật phẩm_. Mảnh ghép này cũng sẽ ngăn bạn xác định trang bị, nhưng có thể được sử dụng để tự xác định các vật phẩm đã sẵn sàng để xác định.
items.trinkets.shardofoblivion.typical_stats_desc=Thông thường, vật phẩm này sẽ tăng tỷ lệ rơi đồ của kẻ thù lên 20%% cho mỗi món trang bị chưa được xác định mà bạn đã trang bị hoặc sử dụng gần đây, tối đa là _%d vật phẩm_. Mảnh ghép này cũng sẽ ngăn bạn xác định trang bị, nhưng có thể được sử dụng để tự xác định các vật phẩm đã sẵn sàng để xác định.
items.trinkets.thirteenleafclover.desc=Không hiểu sao, sau khi được "nấu" trong nồi luyện kim, cây cỏ ba lá này lại mọc thêm rất nhiều lá! Không rõ liệu vật phẩm này mang lại may mắn hay xui xẻo, có lẽ nó sẽ khiến vận may của bạn trở nên hỗn loạn hơn chăng?
items.trinkets.thirteenleafclover.name=cỏ ba lá mười ba lá
items.trinkets.thirteenleafclover.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ giúp bạn gây sát thương tối đa _%1$d%%_ trong hầu hết các trường hợp, và sát thương tối thiểu _%2$d%%_ trong hầu hết các trường hợp.
items.trinkets.thirteenleafclover.typical_stats_desc=Thông thường, vật phẩm này sẽ giúp bạn gây sát thương tối đa _%1$d%%_ trong hầu hết các trường hợp, và sát thương tối thiểu _%2$d%%_ trong hầu hết các trường hợp.
items.trinkets.trapmechanism.desc=Cơ chế cốt lõi của một trong những cạm bẫy trong hầm ngục, được chạm khắc cẩn thận từ sàn nhà để có thể mang đi. Nó dường như được liên kết một cách kỳ diệu với chính hầm ngục, khiến địa hình nguy hiểm trở nên phổ biến hơn nhưng cũng làm tăng sự gắn bó của bạn với nó.
items.trinkets.trapmechanism.name=cơ chế bẫy
items.trinkets.trapmechanism.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ khiến các tầng _%1$d%%_ không theo chủ đề trở nên đầy bẫy hoặc vực sâu. Ngoài ra, các bẫy ẩn _%2$d%%_ trong hầm ngục sẽ hiển thị.
items.trinkets.trapmechanism.typical_stats_desc=Thông thường, vật phẩm này sẽ khiến các tầng _%1$d%%_ không theo chủ đề trở nên đầy rẫy bẫy hoặc vực sâu. Ngoài ra, các bẫy ẩn _%2$d%%_ trong hầm ngục sẽ hiển thị.
items.trinkets.trinket$placeholder.name=đồ trang sức
items.trinkets.trinket.discover_hint=Vật phẩm này có cơ hội xuất hiện khi bạn chế tạo đồ trang sức bằng thuật giả kim.
items.trinkets.trinketcatalyst$randomtrinket.desc=Một vật phẩm gần đó bị kẹt bên trong một chiếc túi mà bạn không thể mở ra. Quá trình luyện kim sẽ làm tan chảy chiếc túi, nhưng bạn sẽ không biết mình nhận được món đồ trang sức gì cho đến khi thực hiện xong!
items.trinkets.trinketcatalyst$randomtrinket.name=đồ trang sức ngẫu nhiên
items.trinkets.trinketcatalyst.desc=Quả cầu bụi vàng ma thuật này lấp lánh trong bóng tối của hầm ngục. Chất xúc tác này có thể được sử dụng trong nồi luyện kim với một chút năng lượng luyện kim để tạo ra một vật phẩm trang sức độc đáo. Các vật phẩm trang sức mang lại nhiều hiệu ứng khác nhau, làm thay đổi nhẹ hầm ngục hoặc cư dân của nó. Có thể nâng cấp vật phẩm trang sức bằng cách thêm năng lượng để tăng sức mạnh cho hiệu ứng, hoặc vứt bỏ để mất hoàn toàn hiệu ứng.
items.trinkets.trinketcatalyst.name=chất xúc tác ma thuật
items.trinkets.trinketcatalyst.window_text=Nước bắt đầu phát sáng khi bạn thêm chất xúc tác. Có một vài vật phẩm gần đó mà bạn có thể truyền năng lượng vào để biến chúng thành vật trang sức ma thuật.
items.trinkets.trinketcatalyst.window_title=tạo ra một món đồ trang sức
items.trinkets.vialofblood.desc=Lọ nhỏ này chứa máu của một cư dân nào đó trong ngục tối, nó chuyển động chậm rãi khi bạn xoay lọ. Dường như nó đang tăng cường hiệu quả chữa lành một cách kỳ diệu, nhưng đồng thời cũng làm chậm quá trình đó.
items.trinkets.vialofblood.name=lọ máu
items.trinkets.vialofblood.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ tăng tổng lượng máu bạn nhận được từ việc uống thuốc hồi phục, bình nước hoặc giếng hồi phục lên _%1$s%%_. Tuy nhiên, hiệu ứng hồi phục này cũng sẽ diễn ra chậm hơn, hồi phục tối đa _%2$s_ HP mỗi lượt (tỷ lệ này phụ thuộc vào cấp độ anh hùng).
items.trinkets.vialofblood.typical_stats_desc=Thông thường, vật phẩm này sẽ tăng tổng lượng máu bạn nhận được từ việc uống thuốc hồi phục, bình nước hoặc giếng hồi phục lên _%1$s%%_. Tuy nhiên, hiệu ứng hồi phục này cũng sẽ diễn ra chậm hơn, hồi phục tối đa _%2$s_ HP mỗi lượt (tỷ lệ này phụ thuộc vào cấp độ anh hùng).
items.trinkets.wondrousresin.desc=Loại nhựa màu xanh óng ánh này dường như chứa đựng tinh túy của ma thuật từ một cây đũa phép bị nguyền rủa. Ma thuật từ chiếc nồi luyện kim dường như đã ổn định nó phần nào, và giờ nó đang ảnh hưởng đến những cây đũa phép của bạn.
items.trinkets.wondrousresin.name=nhựa kỳ diệu
items.trinkets.wondrousresin.stats_desc=Ở cấp độ hiện tại, vật phẩm này sẽ buộc các hiệu ứng của đũa phép bị nguyền rủa trở nên trung tính hoặc tích cực _%1$s%%_ lần, và sẽ khiến những cây đũa phép không bị nguyền rủa bắn thêm một tia sét nguyền rủa trung tính hoặc tích cực _%2$s%%_ lần. Vật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.trinkets.wondrousresin.typical_stats_desc=Thông thường, vật phẩm này sẽ buộc các hiệu ứng của đũa phép bị nguyền rủa trở nên trung tính hoặc tích cực _%1$s%%_ trong một số trường hợp, và sẽ khiến những cây đũa phép không bị nguyền rủa bắn ra thêm một tia sét nguyền rủa trung tính hoặc tích cực _%2$s%%_ trong một số trường hợp. Vật phẩm này tốn nhiều năng lượng hơn để nâng cấp.
items.wands.cursedwand.disguise=Diện mạo của bạn sẽ thay đổi ngay trước mắt!
items.wands.cursedwand.fire=Bạn ngửi thấy mùi khét...
items.wands.cursedwand.grass=Cỏ mọc um tùm xung quanh bạn!
items.wands.cursedwand.gravity=Lực hấp dẫn đột nhiên bắt đầu kéo theo những hướng ngẫu nhiên!
items.wands.cursedwand.gravity_end=Hiện tượng hỗn loạn trọng lực kết thúc.
items.wands.cursedwand.gravity_positive=Lực hấp dẫn đột nhiên bắt đầu kéo theo những hướng ngẫu nhiên, nhưng điều này dường như không ảnh hưởng đến bạn.
items.wands.cursedwand.mass_invuln=Ánh sáng rực rỡ bùng phát từ cây đũa phép của bạn!
items.wands.cursedwand.nothing=Không có gì xảy ra cả.
items.wands.cursedwand.ondeath=Bạn đã bị chính %s của mình giết chết.
items.wands.cursedwand.petrify=Bạn đột nhiên đứng im như tượng!
items.wands.cursedwand.sinkhole=Mặt đất xung quanh bạn bắt đầu sụp xuống!
items.wands.cursedwand.sinkhole_positive=Mặt đất bắt đầu lún xuống, nhưng vẫn cảm giác khá vững chắc dưới chân bạn.
items.wands.cursedwand.supernova=Một quả cầu năng lượng rực lửa bắt đầu lớn dần. Có lẽ bạn nên chạy ngay!
items.wands.cursedwand.supernova_positive=Một quả cầu năng lượng rực lửa bắt đầu lớn dần, nhưng bằng cách nào đó nó lại mang đến cảm giác an toàn.
items.wands.cursedwand.transmogrify_other=Vật phẩm của bạn biến đổi thành một thứ khác!
items.wands.cursedwand.transmogrify_wand=Cây đũa phép của bạn biến hình thành một vật phẩm khác!
items.wands.damagewand.upgrade_stat_name_1=Sát thương phép
items.wands.wand$placeholder.name=cây đũa phép
items.wands.wand.ac_zap=TIA SÁNG
items.wands.wand.curse_discover=%s này bị nguyền rủa rồi!
items.wands.wand.cursed=Cây đũa phép này bị nguyền rủa, khiến phép thuật của nó trở nên hỗn loạn và ngẫu nhiên.
items.wands.wand.fizzles=Cây đũa phép của bạn phát ra tiếng xì hơi; chắc hẳn nó không đủ năng lượng.
items.wands.wand.identify=Giờ bạn đã đủ quen thuộc với cây đũa phép của mình để nhận ra nó rồi.
items.wands.wand.no_magic=Cây đũa phép của bạn bị tắt; bạn không thể sử dụng đũa phép khi đang miễn nhiễm với phép thuật.
items.wands.wand.not_cursed=Cây đũa phép này không chứa ma thuật độc ác.
items.wands.wand.prompt=Chọn vị trí để tiêu diệt
items.wands.wand.resin_many=Cây đũa phép này đã tăng thêm _%d cấp độ_ nhờ nhựa ma thuật.
items.wands.wand.resin_one=Cây đũa phép này đã tăng _1 cấp_ nhờ nhựa phép thuật.
items.wands.wand.self_target=Bạn không thể nhắm mục tiêu vào chính mình!
items.wands.wandofblastwave.bmage_desc=Khi _Pháp sư Chiến đấu_ tấn công kẻ địch đang bị tê liệt bằng cây trượng sóng xung kích, nó sẽ hấp thụ hiệu ứng tê liệt để gây thêm sát thương phép thuật. Hiệu ứng này có thời gian hồi chiêu ngắn cho mỗi kẻ địch.
items.wands.wandofblastwave.desc=Cây đũa phép này được làm từ một loại đá cẩm thạch, viền vàng và có một viên đá quý đen tròn ở đầu. Cầm trên tay, nó khá nặng.
items.wands.wandofblastwave.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng sóng xung kích gây ra 67% sát thương và hất văng tất cả kẻ địch ra khỏi khu vực vụ nổ.
items.wands.wandofblastwave.knockback_ondeath=Vụ va chạm đã cướp đi sinh mạng của bạn...
items.wands.wandofblastwave.name=cây đũa phép sóng xung kích
items.wands.wandofblastwave.ondeath=Ngươi đã tự sát bằng chính cây trượng sóng xung kích của mình...
items.wands.wandofblastwave.staff_name=nhân viên sóng xung kích
items.wands.wandofblastwave.stats_desc=Cây đũa phép này bắn ra một tia năng lượng phát nổ dữ dội tại vị trí mục tiêu. Lực nổ gây ra sát thương _%1$d-%2$d_ và đủ mạnh để hất tung hầu hết kẻ thù.
items.wands.wandofblastwave.typical_stats_desc=Cây đũa phép này bắn ra một tia năng lượng phát nổ dữ dội tại vị trí mục tiêu. Lực nổ thường gây ra sát thương _%1$d-%2$d_ và đủ mạnh để hất tung hầu hết kẻ thù.
items.wands.wandofblastwave.upgrade_stat_name_2=Đẩy lùi
items.wands.wandofcorrosion.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng cây trượng ăn mòn, kẻ thù có khả năng bị biến thành chất nhầy.
items.wands.wandofcorrosion.desc=Cây đũa phép này có thân màu tro, khi mở ra sẽ lộ ra một viên đá quý màu cam rực rỡ.
items.wands.wandofcorrosion.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng ăn mòn sẽ gây hiệu ứng ăn mòn lên kẻ địch trong 4 lượt, bắt đầu với 6 sát thương.
items.wands.wandofcorrosion.name=cây đũa phép ăn mòn
items.wands.wandofcorrosion.staff_name=nhân viên ăn mòn
items.wands.wandofcorrosion.stats_desc=Cây trượng này bắn ra một tia năng lượng phát nổ thành một đám mây khí có tính ăn mòn cao tại vị trí được chỉ định. Bất cứ thứ gì nằm trong đám mây này sẽ chịu sát thương tăng dần theo thời gian, bắt đầu từ mức sát thương _%d._
items.wands.wandofcorrosion.upgrade_stat_name_1=Hư hỏng do ăn mòn
items.wands.wandofcorrosion.upgrade_stat_name_2=Thể tích khí
items.wands.wandofcorruption.already_corrupted=Tính cách đó không thể bị tác động thêm nữa.
items.wands.wandofcorruption.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng cây trượng tha hóa, kẻ thù có khả năng bị biến thành khói.
items.wands.wandofcorruption.desc=Cây đũa phép này tỏa ra năng lượng hắc ám hỗn loạn, điều đó chắc hẳn đã quá rõ ràng từ hình đầu lâu nhỏ trang trí ở đầu đũa.
items.wands.wandofcorruption.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng tha hóa sẽ khiến kẻ thù bị cuồng nộ trong 5 lượt.
items.wands.wandofcorruption.name=cây gậy tham nhũng
items.wands.wandofcorruption.staff_name=nhân viên tham nhũng
items.wands.wandofcorruption.stats_desc=Cây trượng này sẽ giải phóng một luồng năng lượng tha hóa, làm suy yếu kẻ thù và cuối cùng khuất phục chúng theo ý muốn của bạn. Kẻ thù có thể chống lại sự tha hóa, nhưng những kẻ thù suy yếu sẽ dễ bị tha hóa hơn nhiều so với những kẻ thù khỏe mạnh.
items.wands.wandofcorruption.upgrade_stat_name_1=Quyền lực tha hóa
items.wands.wandofcorruption.upgrade_stat_name_2=Thời gian hiệu ứng suy yếu
items.wands.wandofdisintegration.bmage_desc=Khi được _Pháp sư chiến đấu_ sử dụng, cây trượng phân rã có tầm tấn công được tăng cường, như thể nó có một phép thuật chiếu xạ.
items.wands.wandofdisintegration.desc=Cây đũa phép này được làm từ một khối đá obsidian đặc và nhẵn, với ánh sáng màu tím đậm chạy dọc thân, kết thúc ở đầu. Nó phát sáng với năng lượng hủy diệt, sẵn sàng phóng về phía trước.
items.wands.wandofdisintegration.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng phân rã gây sát thương 100% và xuyên thủng tường.
items.wands.wandofdisintegration.name=cây đũa phép phân rã
items.wands.wandofdisintegration.staff_name=nhân viên tan rã
items.wands.wandofdisintegration.stats_desc=Cây đũa phép này bắn ra một tia sáng xuyên qua mọi chướng ngại vật, và tầm bắn sẽ xa hơn khi được nâng cấp. Tia sáng gây ra sát thương _%1$d-%2$d_, và cũng gây thêm sát thương cho mỗi kẻ địch và bức tường mà nó xuyên qua.
items.wands.wandofdisintegration.upgrade_stat_name_2=Phạm vi tối đa
items.wands.wandoffireblast.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng trượng lửa, có khả năng tạo ra một vụ nổ gây sát thương cho kẻ thù và thiêu rụi tất cả lửa xung quanh! Khả năng này tăng lên khi càng có nhiều lửa ở gần kẻ thù.
items.wands.wandoffireblast.desc=Cây đũa phép này được làm từ gỗ sơn mài đỏ, điểm xuyết nhiều lá vàng để tạo vẻ ngoài sang trọng. Đầu đũa phát ra tiếng lách tách và rít lên, như thể sẵn sàng giải phóng sức mạnh ma thuật của mình.
items.wands.wandoffireblast.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng lửa gây sát thương 100%, phá tung cửa và thiêu rụi kẻ thù cũng như địa hình.
items.wands.wandoffireblast.name=cây đũa phép lửa
items.wands.wandoffireblast.staff_name=nhân viên của fireblast
items.wands.wandoffireblast.stats_desc=Cây trượng này khi sử dụng sẽ phóng ra một luồng lửa hình nón. Đòn tấn công tiếp theo sẽ tiêu hao _%1$d lượt sử dụng_ và gây ra _%2$d-%3$d sát thương_. Càng nhiều lượt sử dụng, hiệu ứng càng lớn và mạnh hơn.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Sát thương tích lũy
items.wands.wandoffireblast.upgrade_stat_name_2=2 Sát thương tích lũy
items.wands.wandoffireblast.upgrade_stat_name_3=3 Sát thương tích lũy
items.wands.wandoffrost.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ địch đang bị đóng băng bằng trượng băng, chúng có cơ hội bị đóng băng ngay lập tức. Cơ hội này càng lớn khi mức độ đóng băng càng cao.
items.wands.wandoffrost.desc=Cây đũa phép này dường như được làm từ một loại băng ma thuật nào đó. Nó càng sáng hơn về phía đầu tròn. Khi cầm trên tay, nó rất lạnh, nhưng không hiểu sao tay bạn vẫn ấm.
items.wands.wandoffrost.eleblast_desc=Chiêu thức tấn công nguyên tố bằng trượng băng giá gây sát thương 100%, đóng băng kẻ thù và dập tắt lửa.
items.wands.wandoffrost.name=cây đũa phép băng giá
items.wands.wandoffrost.staff_name=nhân viên của Frost
items.wands.wandoffrost.stats_desc=Cây trượng này bắn ra những luồng năng lượng băng giá về phía kẻ thù, gây sát thương _%1$d-%2$d_ và làm đóng băng. Hiệu ứng có vẻ mạnh hơn trong nước. Kẻ thù đã bị đóng băng hoặc làm lạnh sẽ chịu ít sát thương hơn từ cây trượng này.
items.wands.wandoffrost.upgrade_stat_name_2=Thời gian làm lạnh
items.wands.wandoflightning$lightningcharge.desc=Pháp sư chiến đấu hiện đang được nạp đầy năng lượng, giúp anh ta miễn nhiễm với cây trượng sấm sét và tăng phạm vi phóng tia sét từ nó.\n\nSố lượt còn lại: %s.
items.wands.wandoflightning$lightningcharge.name=Đã tích điện
items.wands.wandoflightning.bmage_desc=Khi _Pháp sư Chiến đấu_ tấn công kẻ thù bằng cây trượng sấm sét, hắn có cơ hội tự tích điện cho bản thân trong 10 lượt. Trong khi tích điện, Pháp sư Chiến đấu miễn nhiễm với sát thương từ sấm sét và sẽ phóng sấm sét xa hơn.
items.wands.wandoflightning.desc=Cây đũa phép này được làm từ kim loại nguyên khối, nên nặng một cách đáng ngạc nhiên. Hai ngạnh cong vào nhau ở đầu, và dòng điện phóng ra giữa chúng.
items.wands.wandoflightning.eleblast_desc=Chiêu thức tấn công nguyên tố bằng trượng sấm sét gây sát thương 100%, làm choáng kẻ địch trong 5 lượt và tích điện cho nước.
items.wands.wandoflightning.name=cây gậy sấm sét
items.wands.wandoflightning.ondeath=Ngươi đã tự sát bằng chính cây trượng sấm sét của mình...
items.wands.wandoflightning.staff_name=cây trượng sấm sét
items.wands.wandoflightning.stats_desc=Cây đũa phép này phóng ra những tia sét mạnh mẽ xuyên qua bất cứ thứ gì nó bắn vào, gây ra sát thương _%1$d-%2$d_. Tia điện này sẽ phóng sang các nhân vật gần đó và lan truyền dễ dàng hơn trong nước. Tia điện từ cây đũa phép này có thể gây sát thương cho bạn, nhưng sẽ không làm hại đồng minh của bạn.
items.wands.wandoflivingearth$earthguardian.desc=Những tảng đá từ cây đũa phép đất sống của bạn đã kết hợp lại thành một người bảo vệ bằng đất! Người bảo vệ bằng đá này sẽ tấn công kẻ thù gần đó, buộc chúng phải tấn công người bảo vệ thay vì bạn. Khi tất cả các mối đe dọa gần đó biến mất, người bảo vệ sẽ tái tạo lại xung quanh bạn và sẽ trở lại khi bạn sử dụng cây đũa phép lần tiếp theo.
items.wands.wandoflivingearth$earthguardian.discover_hint=Bạn có thể tìm thấy nhân vật này với một cây đũa phép đặc biệt.
items.wands.wandoflivingearth$earthguardian.name=người bảo vệ đất
items.wands.wandoflivingearth$earthguardian.wand_info=Sức mạnh phòng thủ của người bảo vệ gắn liền với cấp độ của cây trượng của bạn. Hiện tại, nó chặn được lượng sát thương _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Những tảng đá ma thuật đang bao quanh cơ thể bạn, khi bạn bị tấn công, chúng sẽ cố gắng chặn đòn tấn công và giảm sát thương bạn nhận được đi 50%%. Tuy nhiên, mỗi lần chặn được sát thương sẽ làm mòn một phần đá.\n\nGiáp còn lại: %1$d.\n\nNếu đủ đá được tạo thành xung quanh bạn, lần phóng điện tiếp theo từ cây đũa phép đất sống của bạn sẽ khiến những tảng đá kết hợp lại thành một người bảo vệ sẽ chiến đấu cùng bạn.\n\nGiáp cần thiết cho Người bảo vệ: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Vị thần bảo hộ đất này cũng đang hưởng lợi từ Sức mạnh của Đa số. Số lượt còn lại: %d.
items.wands.wandoflivingearth$rockarmor.name=áo giáp đá
items.wands.wandoflivingearth.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng cây trượng đất sống, một phần sát thương gây ra sẽ được phản hồi dưới dạng giáp đá.
items.wands.wandoflivingearth.desc=Cây đũa phép này được làm từ một loại đá kỳ lạ, với những dải năng lượng màu vàng phát sáng. Những tảng đá dường như dịch chuyển nhẹ khi bạn cầm cây đũa phép, như thể chúng có thể cảm nhận được bàn tay bạn.
items.wands.wandoflivingearth.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng đất sống gây ra 50% sát thương và hồi máu cho một người bảo vệ đất đang hoạt động cho mỗi kẻ địch trúng phải.
items.wands.wandoflivingearth.name=cây gậy của đất sống
items.wands.wandoflivingearth.staff_name=nhân viên của trái đất sống
items.wands.wandoflivingearth.stats_desc=Cây đũa phép này phóng ra những tia đá ma thuật về phía kẻ thù, gây ra sát thương _%1$d-%2$d_. Những viên đá sau đó sẽ tái tạo lại xung quanh người sử dụng, ban cho họ lớp giáp tương ứng với sát thương gây ra. Nếu tích lũy đủ giáp, nó sẽ biến thành một người bảo vệ bằng đá khi cây đũa phép được sử dụng lần tiếp theo.
items.wands.wandoflivingearth.upgrade_stat_name_2=Người bảo vệ tối đa HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Chặn người bảo vệ
items.wands.wandofmagicmissile$magiccharge.desc=Cây đũa phép bắn tên lửa ma thuật của bạn đã nạp lại năng lượng cho các cây đũa phép khác, tăng cường hiệu quả của cú phóng tiếp theo.\n\nCác cây đũa phép của bạn được tăng cường lên: +%d.\n\nSố lượt tích điện ma thuật còn lại: %s.
items.wands.wandofmagicmissile$magiccharge.name=phí ma thuật
items.wands.wandofmagicmissile.bmage_desc=Khi _Pháp sư Chiến đấu_ tấn công kẻ thù bằng cây trượng phép thuật, tất cả các cây đũa phép của anh ta cũng sẽ được tích điện, ngoài cây trượng phép thuật chính.
items.wands.wandofmagicmissile.desc=Cây đũa phép khá đơn giản này phóng ra những quả tên lửa năng lượng ma thuật thuần túy. Mặc dù bản thân cây đũa phép không có hiệu ứng đặc biệt nào, nhưng nó có nhiều năng lượng dự trữ hơn và có thể tăng sức mạnh cho các cây đũa phép khác trong thời gian ngắn khi được nâng cấp.
items.wands.wandofmagicmissile.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.wands.wandofmagicmissile.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng phép thuật gây ra 50% sát thương và cho phép pháp sư hồi phục trong 15 lượt.
items.wands.wandofmagicmissile.name=cây đũa phép tên lửa
items.wands.wandofmagicmissile.staff_name=cây trượng tên lửa ma thuật
items.wands.wandofmagicmissile.stats_desc=Mỗi tia năng lượng từ cây trượng này gây ra sát thương _%1$d-%2$d_ và sẽ tăng sức mạnh cho các cây trượng khác trong thời gian ngắn nếu nó được nâng cấp.
items.wands.wandofprismaticlight.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng cây trượng ánh sáng lăng kính, chúng sẽ bị tê liệt trong một khoảng thời gian tỷ lệ thuận với cấp độ của cây trượng.
items.wands.wandofprismaticlight.desc=Cây đũa phép này được làm từ một khối tinh thể trong suốt đặc, giống như một khối thủy tinh dài và nhẵn bóng. Những đốm sáng nhỏ đầy màu sắc nhảy múa xung quanh đầu đũa, sẵn sàng bùng phát.
items.wands.wandofprismaticlight.eleblast_desc=Một đòn tấn công nguyên tố bằng cây trượng ánh sáng lăng kính gây ra 67% sát thương, làm lộ diện toàn bộ địa hình trong phạm vi vụ nổ và làm mù kẻ địch trong 5 lượt.
items.wands.wandofprismaticlight.name=cây đũa phép ánh sáng lăng kính
items.wands.wandofprismaticlight.staff_name=cây gậy ánh sáng lăng kính
items.wands.wandofprismaticlight.stats_desc=Cây đũa phép này bắn ra những tia sáng xuyên qua bóng tối của hầm ngục, hé lộ những khu vực ẩn giấu và cạm bẫy. Tia sáng có thể làm mù kẻ thù và gây ra sát thương _%1$d-%2$d_. Kẻ thù ma quỷ và xác sống sẽ bị thiêu đốt trong ánh sáng chói lọi của cây đũa phép, chịu thêm sát thương.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Cơ hội mù quáng
items.wands.wandofprismaticlight.upgrade_stat_name_3=Thời lượng ánh sáng
items.wands.wandofregrowth$dewcatcher.desc=Cây hứng sương là loài thực vật kỳ diệu, chúng tự tích trữ sương. Chúng cố gắng ngụy trang thành cỏ để tránh sự chú ý, nhưng những chỗ phồng lên do lượng sương tích tụ lại đã tố cáo chúng.
items.wands.wandofregrowth$dewcatcher.discover_hint=Bạn có thể tìm thấy loại cây này bằng một cây đũa phép đặc biệt.
items.wands.wandofregrowth$dewcatcher.name=Chim bắt sương
items.wands.wandofregrowth$lotus.desc=Hoa sen vàng là một loài thực vật thần bí chỉ có thể được triệu hồi bằng một cây đũa phép tái sinh mạnh mẽ. Hào quang của nó tăng cường sức mạnh cho tất cả các loài thực vật và hiệu ứng của chúng, nhưng nó cũng tiêu hao năng lượng và chết sau một thời gian ngắn.
items.wands.wandofregrowth$lotus.discover_hint=Bạn có thể tìm thấy loại cây này bằng một cây đũa phép đặc biệt, sau khi nâng cấp nó vài lần.
items.wands.wandofregrowth$lotus.name=Hoa sen vàng
items.wands.wandofregrowth$lotus.wand_info=Loài sen này được tạo ra bởi cây đũa phép tái sinh _+%1$d_. Tất cả các cây trong phạm vi ảnh hưởng của nó sẽ _kích hoạt ngay lập tức_ nếu chúng được trồng trên nhân vật. Cây cũng sẽ có _xác suất_ rơi hạt giống, và phi tiêu tẩm độc sẽ sử dụng _ít độ bền hơn_.
items.wands.wandofregrowth$seedpod.desc=Cây Hạt Giống là những loài thực vật kỳ diệu, chúng tạo ra hạt giống từ các loại cây khác, chứ không phải từ chính hạt giống của mình. Bằng cách nào đó, chúng vẫn có thể lan rộng dù không có hạt giống riêng.
items.wands.wandofregrowth$seedpod.discover_hint=Bạn có thể tìm thấy loại cây này bằng một cây đũa phép đặc biệt.
items.wands.wandofregrowth$seedpod.name=Vỏ hạt
items.wands.wandofregrowth.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ thù bằng cây trượng hồi phục, và cả hai đều đang đứng trên cỏ, anh ta sẽ nhận được hiệu ứng hồi phục bằng thảo dược tương ứng với sát thương gây ra.
items.wands.wandofregrowth.degradation=Sau khi sạc thêm _%d lần nữa_, cây đũa phép này sẽ bắt đầu không thể tạo ra cây và cỏ tươi nữa. Giới hạn này sẽ tăng lên khi bạn lên cấp hoặc nâng cấp cây đũa phép.
items.wands.wandofregrowth.desc=Cây đũa phép này được làm từ một thân gỗ mỏng được chạm khắc tinh xảo. Bằng cách nào đó, nó vẫn tràn đầy sức sống và sức sống, màu xanh tươi sáng như lõi của một cây non. "Khi sự sống kết thúc, sự sống mới luôn bắt đầu nảy nở... Vòng tuần hoàn vĩnh hằng luôn luôn tồn tại!"
items.wands.wandofregrowth.eleblast_desc=Một đòn tấn công nguyên tố kết hợp với cây trượng tái sinh sẽ trói chân kẻ thù và làm cỏ mọc ngẫu nhiên trong khu vực bị ảnh hưởng.
items.wands.wandofregrowth.name=cây đũa phép tái sinh
items.wands.wandofregrowth.staff_name=nhân viên tái phát triển
items.wands.wandofregrowth.stats_desc=Khi sử dụng, cây đũa phép này sẽ phóng ra năng lượng tái sinh kỳ diệu theo hình nón, khiến cỏ, rễ và các loài thực vật quý hiếm hồi sinh. Lần phóng năng lượng tiếp theo sẽ tiêu thụ _%1$d lần sạc_. Càng nhiều lần sạc được sử dụng, hiệu quả càng lớn và mạnh hơn.
items.wands.wandofregrowth.upgrade_stat_name_1=Tính phí cỏ
items.wands.wandofregrowth.upgrade_stat_name_2=Giới hạn tổng số cỏ
items.wands.wandoftransfusion.bmage_desc=Khi _Pháp sư Chiến đấu_ tấn công kẻ địch bị mê hoặc bằng cây trượng truyền máu, anh ta sẽ nhận được lớp khiên bảo vệ và cú đánh tiếp theo bằng cây trượng sẽ không tiêu hao máu.
items.wands.wandoftransfusion.charged=Nhân viên của bạn đang tràn đầy năng lượng sống của kẻ thù!
items.wands.wandoftransfusion.desc=Chiếc đũa phép có hình dáng khá đơn giản, nhưng lại nổi bật nhờ màu tím hồng và viên đá quý đen tuyền ở đầu.
items.wands.wandoftransfusion.eleblast_desc=Một đòn tấn công nguyên tố kết hợp với cây trượng truyền máu sẽ mê hoặc kẻ thù, hồi máu cho đồng minh và gây 100% sát thương cho kẻ thù bất tử.
items.wands.wandoftransfusion.name=cây đũa truyền máu
items.wands.wandoftransfusion.ondeath=Ngươi đã tự sát bằng chính Cây đũa phép Truyền máu của mình...
items.wands.wandoftransfusion.staff_name=nhân viên truyền máu
items.wands.wandoftransfusion.stats_desc=Khi sử dụng lên đồng minh hoặc kẻ thù bị mê hoặc, cây trượng này sẽ hút _%1$d máu của người dùng_ để hồi máu hoặc tạo khiên bảo vệ cho đồng minh trong _%2$d lần. Khi sử dụng lên kẻ thù, cây trượng sẽ mê hoặc chúng trong giây lát đồng thời tạo _%3$d khiên bảo vệ_ cho người dùng. Xác sống thù địch sẽ chịu _%4$d-%5$d sát thương_ thay vì bị mê hoặc.
items.wands.wandoftransfusion.upgrade_stat_name_1=Chữa lành đồng minh
items.wands.wandoftransfusion.upgrade_stat_name_2=Tự bảo vệ
items.wands.wandoftransfusion.upgrade_stat_name_3=Sát thương xác sống
items.wands.wandofwarding$ward.desc_1=Rào chắn cơ bản này sẽ tự động tấn công bất kỳ kẻ địch nào lọt vào tầm nhìn của nó, gây ra sát thương _%1$d-%2$d._\n\nSử dụng gậy phép canh gác của bạn để nâng cấp rào chắn này sẽ giúp nâng cấp nó.\n\nRào chắn này chỉ tấn công một lần trước khi biến mất.\n\nGậy phép canh gác của bạn đang sử dụng _%3$d năng lượng_ để duy trì rào chắn này.
items.wands.wandofwarding$ward.desc_2=Bùa hộ mệnh được nâng cấp này có hoa văn phức tạp hơn và có thể tấn công nhiều lần. Mỗi lần phóng điện từ bùa hộ mệnh này sẽ gây ra sát thương _%1$d-%2$d._\n\nPhóng điện vào bùa hộ mệnh này sẽ nâng cấp nó.\n\nBùa hộ mệnh này sẽ phóng điện ba lần trước khi tan biến.\n\nGậy hộ mệnh của bạn đang sử dụng _%3$d năng lượng_ để duy trì bùa hộ mệnh này.
items.wands.wandofwarding$ward.desc_3=Bùa hộ mệnh được nâng cấp hoàn toàn này có khả năng tấn công nhiều lần hơn so với các phiên bản trước. Mỗi lần phóng điện từ bùa hộ mệnh này sẽ gây ra sát thương _%1$d-%2$d._\n\nPhóng điện vào bùa hộ mệnh này sẽ nâng cấp nó.\n\nBùa hộ mệnh này sẽ phóng điện năm lần trước khi tan biến.\n\nGậy hộ mệnh của bạn đang sử dụng _%3$d năng lượng_ để duy trì bùa hộ mệnh này.
items.wands.wandofwarding$ward.desc_4=Lính canh nhỏ hơn này có hỏa lực tương đương với lính canh lớn hơn, nhưng thay vì số lần sử dụng cố định, nó có máu. Nó trông giống viên ngọc ở đầu cây trượng bảo vệ của bạn. Mỗi lần bắn từ lính canh này sẽ gây ra _%1$d-%2$d sát thương._\n\nSử dụng cây trượng bảo vệ của bạn để bắn vào lính canh này sẽ nâng cấp và hồi máu cho nó.\n\nLính canh này sẽ tiêu hao một lượng máu nhất định mỗi khi bắn trúng kẻ địch, nhưng có thể được hồi máu bằng cách sử dụng cây trượng bảo vệ của bạn lên nó.\n\nCây trượng bảo vệ của bạn đang sử dụng _%3$d năng lượng_ để duy trì lính canh này.
items.wands.wandofwarding$ward.desc_5=Trụ canh được nâng cấp này lớn hơn và bền hơn trụ canh thông thường. Mỗi lần phóng điện từ trụ canh này sẽ gây ra sát thương _%1$d-%2$d._\n\nPhóng điện vào trụ canh này sẽ nâng cấp và hồi máu cho nó.\n\nTrụ canh này sẽ tiêu hao một lượng máu nhất định mỗi khi phóng điện vào kẻ địch, nhưng có thể được hồi máu bằng cách sử dụng đũa phép bảo vệ của bạn lên nó.\n\nĐũa phép bảo vệ của bạn đang sử dụng _%3$d năng lượng_ để duy trì trụ canh này.
items.wands.wandofwarding$ward.desc_6=Trụ súng được nâng cấp hoàn toàn này bền hơn đáng kể so với các phiên bản trước. Mỗi lần phóng điện từ trụ súng này sẽ gây ra sát thương _%1$d-%2$d._\n\nPhóng điện trụ súng này sẽ hồi máu cho nó.\n\nTrụ súng này sẽ tiêu hao một lượng máu nhất định mỗi khi phóng điện vào kẻ địch, nhưng có thể được hồi máu bằng cách sử dụng đũa phép bảo vệ của bạn lên nó.\n\nĐũa phép bảo vệ của bạn đang sử dụng _%3$d năng lượng_ để duy trì trụ súng này.
items.wands.wandofwarding$ward.desc_generic_sentry=Lính canh này có hỏa lực tương đương với lính canh thông thường, nhưng thay vì số lần sử dụng cố định, nó có máu. Nó trông giống viên ngọc ở đầu cây trượng phòng hộ của bạn.\n\nSử dụng trượng phòng hộ của bạn để tấn công lính canh này sẽ nâng cấp và hồi máu cho nó.\n\nLính canh này sẽ tiêu hao một lượng máu nhất định mỗi khi tấn công kẻ địch, nhưng có thể được hồi máu bằng cách sử dụng trượng phòng hộ của bạn lên nó.
items.wands.wandofwarding$ward.desc_generic_ward=Vật phẩm này sẽ tự động tiêu diệt bất kỳ kẻ địch nào lọt vào tầm nhìn của nó. Sử dụng gậy phép thuật để tiêu diệt vật phẩm này sẽ nâng cấp nó. Vật phẩm có số lần tiêu diệt giới hạn trước khi biến mất.
items.wands.wandofwarding$ward.discover_hint=Bạn có thể tìm thấy nhân vật này với một cây đũa phép đặc biệt.
items.wands.wandofwarding$ward.dismiss_body=Bạn có thể hóa giải bùa chú này nếu không muốn cây đũa phép của mình duy trì nó nữa. Làm như vậy sẽ ngay lập tức phá hủy bùa chú.\n\nHủy bỏ bùa chú này?
items.wands.wandofwarding$ward.dismiss_cancel=KHÔNG
items.wands.wandofwarding$ward.dismiss_confirm=Đúng
items.wands.wandofwarding$ward.dismiss_title=Cho xuất viện bệnh nhân này?
items.wands.wandofwarding$ward.name_1=phường nhỏ
items.wands.wandofwarding$ward.name_2=phường
items.wands.wandofwarding$ward.name_3=khu vực lớn hơn
items.wands.wandofwarding$ward.name_4=lính canh nhỏ hơn
items.wands.wandofwarding$ward.name_5=lính canh
items.wands.wandofwarding$ward.name_6=lính canh lớn hơn
items.wands.wandofwarding.bad_location=Bạn không thể đặt một ô canh ở đó.
items.wands.wandofwarding.bmage_desc=Khi _Pháp sư chiến đấu_ tấn công kẻ địch bằng trượng phòng hộ, tất cả các lá chắn và lính canh đang hoạt động đều có cơ hội được hồi máu.
items.wands.wandofwarding.desc=Chiếc đũa phép ngắn bằng kim loại này có một viên đá quý màu tím sáng lấp lánh ở đầu.
items.wands.wandofwarding.eleblast_desc=Một đòn tấn công nguyên tố kết hợp với cây trượng hộ mệnh sẽ hồi phục tất cả các lá chắn và lính canh trong khu vực vụ nổ.
items.wands.wandofwarding.name=cây gậy bảo vệ
items.wands.wandofwarding.no_more_wards=Cây đũa phép của bạn không thể duy trì thêm bất kỳ bùa chú nào nữa.
items.wands.wandofwarding.staff_name=nhân viên phụ trách phòng bệnh
items.wands.wandofwarding.stats_desc=Thay vì gây sát thương trực tiếp cho kẻ địch, cây trượng này sẽ triệu hồi các mắt canh và lính canh cố định. Mắt canh có thể được triệu hồi ở bất cứ đâu, thậm chí xuyên qua tường nếu bạn có tầm nhìn. Cây trượng này có thể duy trì lượng năng lượng tương đương _%d_ mắt canh cùng một lúc.
items.wands.wandofwarding.upgrade_stat_name_1=Sát thương phòng thủ
items.wands.wandofwarding.upgrade_stat_name_2=Năng lượng Ward
items.waterskin.ac_drink=UỐNG
items.waterskin.collected=Bạn hứng những giọt sương vào bình đựng nước của mình.
items.waterskin.desc=Một vật chứa chất lỏng, được làm từ da và dây, có nút đậy bằng nút bần.
items.waterskin.desc_full=Chiếc bình đựng nước đầy ắp dường như tỏa ra năng lượng, có lẽ nó có thể được dùng để ban phước cho một vật dụng sinh tồn khác?
items.waterskin.desc_heal=Chiếc bình da hiện đang được dùng để chứa nước chữa bệnh. Bình càng đầy, bạn sẽ càng được chữa lành ngay lập tức khi uống nước từ đó. Bạn chỉ cần uống lượng nước cần thiết.
items.waterskin.desc_water=Hiện tại, bình da chỉ chứa một ít nước uống thông thường. Chắc chắn trong hầm ngục phải có thứ gì đó khác mà bình da có thể chứa được.
items.waterskin.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.waterskin.empty=Bình nước của bạn đã hết nước rồi!
items.waterskin.full=Bình nước của bạn đã đầy!
items.waterskin.name=bình nước
items.weapon.curses.annoying.desc=Những vũ khí gây khó chịu có khả năng nói chuyện, nhưng chúng hơi quá hiếu động. Chúng thường thu hút sự chú ý của bạn mà không hề cố ý.
items.weapon.curses.annoying.elestrike_desc=Đòn tấn công nguyên tố kèm lời nguyền khó chịu có 20% khả năng gây sát thương lên mọi kẻ địch trong phạm vi trong 6 lượt.
items.weapon.curses.annoying.msg_1=Ôi, chúng ta sắp chiến đấu với thứ gì đó à!?
items.weapon.curses.annoying.msg_10=Đánh trúng đích!
items.weapon.curses.annoying.msg_11=Tôi không muốn trở thành một vũ khí, tôi muốn trở thành chiếc rìu của người đốn gỗ.
items.weapon.curses.annoying.msg_12=Hãy nhớ rằng, sự tự tin thái quá là một kẻ giết người âm thầm và nguy hiểm.
items.weapon.curses.annoying.msg_13=TẤT CẢ CĂN CỨ CỦA CÁC NGƯỜI ĐỀU THUỘC VỀ CHÚ
items.weapon.curses.annoying.msg_2=ĐÚNG VẬY, BẮT CHÚNG ĐI!
items.weapon.curses.annoying.msg_3=NÀY, NGHE ĐÂY!
items.weapon.curses.annoying.msg_4=CHÚNG TA ĐÃ ĐẾN GẶP SẾP CHƯA!?
items.weapon.curses.annoying.msg_5=Ái chà, đừng vung mạnh thế!
items.weapon.curses.annoying.msg_6=CHẾT ĐI, CON CÔN TRÙNG!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CHÚNG TA CÓ THỂ NGHỈ GIẢI LAO MỘT CHÚT KHÔNG!?
items.weapon.curses.annoying.msg_9=BÙM, HAHA!
items.weapon.curses.annoying.name=%s gây khó chịu
items.weapon.curses.dazzling.desc=Những vũ khí chói lóa đôi khi sẽ phát ra ánh sáng rực rỡ, làm mù mọi thứ có thể nhìn thấy chúng.
items.weapon.curses.dazzling.elestrike_desc=Đòn tấn công nguyên tố kết hợp với lời nguyền chói lóa có 50% khả năng làm mù mọi kẻ địch trong phạm vi trong 6 lượt.
items.weapon.curses.dazzling.name=%s rực rỡ
items.weapon.curses.displacing.desc=Các loại vũ khí dịch chuyển được tích hợp phép thuật dịch chuyển hỗn loạn, có khả năng dịch chuyển kẻ thù xung quanh sàn đấu một cách ngẫu nhiên.
items.weapon.curses.displacing.elestrike_desc=Đòn tấn công nguyên tố kèm lời nguyền dịch chuyển có 50% khả năng dịch chuyển tức thời tất cả kẻ địch trong phạm vi.
items.weapon.curses.displacing.name=thay thế %s
items.weapon.curses.explosive.desc=Các loại vũ khí gây nổ tích tụ dần năng lượng và phát nổ, gây thiệt hại cho bất cứ thứ gì ở gần đó.
items.weapon.curses.explosive.desc_cool=Vũ khí của bạn hiện đang mát khi chạm vào.
items.weapon.curses.explosive.desc_hot=Vũ khí của bạn đang nóng! Nó sắp nổ rồi!
items.weapon.curses.explosive.desc_warm=Vũ khí của bạn đang tích lũy năng lượng và nóng lên...
items.weapon.curses.explosive.elestrike_desc=Đòn tấn công nguyên tố kết hợp với lời nguyền nổ có 50% khả năng gây ra vụ nổ trên một kẻ địch ngẫu nhiên trong phạm vi.
items.weapon.curses.explosive.hot=Nóng!
items.weapon.curses.explosive.name=chất nổ %s
items.weapon.curses.explosive.warm=Ấm...
items.weapon.curses.friendly.desc=Vũ khí thân thiện là lựa chọn tốt nhất cho những người theo chủ nghĩa hòa bình, đôi khi chúng kích hoạt phép thuật khiến việc chiến đấu trở nên bất khả thi.
items.weapon.curses.friendly.elestrike_desc=Đòn tấn công nguyên tố kết hợp với lời nguyền đồng minh có 50% khả năng mê hoặc mọi kẻ địch trong phạm vi trong 6 lượt.
items.weapon.curses.friendly.name=thân thiện %s
items.weapon.curses.polarized.desc=Vũ khí phân cực bị ảnh hưởng bởi phép thuật khiến đòn tấn công của nó gây thêm 50% sát thương hoặc không gây sát thương nào cả.
items.weapon.curses.polarized.elestrike_desc=Đòn tấn công nguyên tố với lời nguyền phân cực có 50% khả năng gây ra 24-36 sát thương cho mỗi kẻ địch trong phạm vi.
items.weapon.curses.polarized.name=phân cực %s
items.weapon.curses.sacrificial.desc=Vũ khí hiến tế sẽ đòi hỏi máu từ người đeo để đổi lấy việc tấn công kẻ thù. Người đeo càng khỏe mạnh, lời nguyền càng lấy đi nhiều máu hơn.
items.weapon.curses.sacrificial.elestrike_desc=Một đòn tấn công nguyên tố kết hợp với lời nguyền hiến tế khiến anh hùng và mỗi kẻ địch trong phạm vi ảnh hưởng bị chảy máu mất 12 HP.
items.weapon.curses.sacrificial.name=hy sinh %s
items.weapon.curses.wayward$waywardbuff.desc=Ma thuật của vũ khí lạc lối của bạn đã được kích hoạt, khiến nó cực kỳ thiếu chính xác trong một thời gian ngắn. Lưu ý rằng điều này không ảnh hưởng đến các đòn tấn công chắc chắn trúng đích, chẳng hạn như các đòn tấn công bất ngờ. Tấn công thành công bằng vũ khí lạc lối sẽ loại bỏ hiệu ứng này ngay lập tức.\n\nSố lượt còn lại: %s.
items.weapon.curses.wayward$waywardbuff.name=lạc lối
items.weapon.curses.wayward.desc=Vũ khí lạc lối đôi khi sẽ trở nên cực kỳ thiếu chính xác. Phép thuật này kéo dài trong một thời gian ngắn khi được kích hoạt, nhưng có thể bị hóa giải bằng cách tung ra một đòn đánh bằng vũ khí lạc lối đó.
items.weapon.curses.wayward.elestrike_desc=Đòn tấn công nguyên tố kết hợp với lời nguyền lạc lối có 50% khả năng gây hiệu ứng nguyền rủa lên mọi kẻ địch trong phạm vi trong 6 lượt.
items.weapon.curses.wayward.name=%s lạc lối
items.weapon.enchantments.blazing.desc=Phép thuật này khiến ngọn lửa phun ra từ vũ khí, đốt cháy kẻ thù và gây thêm sát thương cho những kẻ thù đang bốc cháy.
items.weapon.enchantments.blazing.elestrike_desc=Một đòn tấn công nguyên tố với hiệu ứng lửa lan tỏa ngọn lửa đến mọi ô trong phạm vi, kéo dài 8 lượt.
items.weapon.enchantments.blazing.name=%s rực lửa
items.weapon.enchantments.blocking$blockbuff.desc=Hiệu ứng phòng thủ của vũ khí đã giúp tăng cường sức mạnh phòng thủ của bạn trong một thời gian ngắn!\n\nLượng khiên còn lại: %d\n\nSố lượt còn lại: %s.
items.weapon.enchantments.blocking$blockbuff.name=chặn
items.weapon.enchantments.blocking.desc=Các vũ khí phòng thủ có khả năng tạo ra lớp bảo vệ tạm thời cho bạn sau khi tấn công bằng chúng.
items.weapon.enchantments.blocking.elestrike_desc=Đòn tấn công nguyên tố kết hợp với bùa chú phòng thủ sẽ tăng thêm 6 điểm phòng thủ cho mỗi kẻ địch trong phạm vi.
items.weapon.enchantments.blocking.name=chặn %s
items.weapon.enchantments.blooming.desc=Những vũ khí nở hoa chứa phép thuật có thể khiến cây cối mọc lên trên hoặc xung quanh những người bị chúng tấn công.
items.weapon.enchantments.blooming.elestrike_desc=Đòn tấn công nguyên tố kết hợp với hiệu ứng hoa nở sẽ lan tỏa cỏ trong phạm vi tối đa 8 ô và trói chân tất cả kẻ địch trong phạm vi đó trong 6 lượt.
items.weapon.enchantments.blooming.name=nở hoa %s
items.weapon.enchantments.chilling.desc=Kẻ địch trúng phải bùa chú này sẽ bị đóng băng, làm chậm chuyển động và đòn tấn công của chúng.
items.weapon.enchantments.chilling.elestrike_desc=Một đòn tấn công nguyên tố với hiệu ứng băng giá sẽ lan tỏa luồng khí lạnh đến mọi ô trong phạm vi, kéo dài 8 lượt.
items.weapon.enchantments.chilling.name=làm lạnh %s
items.weapon.enchantments.corrupting.desc=Phép thuật mạnh mẽ này có khả năng biến kẻ thù thành người phục tùng bạn. Khi một kẻ thù bị tiêu diệt bằng vũ khí này, có khả năng chúng sẽ bị tha hóa thay vì chết.
items.weapon.enchantments.corrupting.elestrike_desc=Đòn tấn công nguyên tố với bùa chú làm suy yếu có 5-25% khả năng (dựa trên lượng HP đã mất) làm suy yếu mọi kẻ địch trong phạm vi, ngoại trừ mục tiêu chính.
items.weapon.enchantments.corrupting.name=làm hỏng %s
items.weapon.enchantments.elastic.desc=Vũ khí đàn hồi có khả năng hất văng kẻ thù trong khoảng cách ngắn.
items.weapon.enchantments.elastic.elestrike_desc=Một đòn tấn công nguyên tố với hiệu ứng đàn hồi sẽ đẩy lùi tất cả kẻ địch trong phạm vi 5 ô.
items.weapon.enchantments.elastic.name=đàn hồi %s
items.weapon.enchantments.grim.desc=Phép thuật mạnh mẽ này có khả năng tiêu diệt kẻ thù ngay lập tức. Hiệu quả càng cao khi kẻ thù càng yếu.
items.weapon.enchantments.grim.elestrike_desc=Đòn tấn công nguyên tố với hiệu ứng hắc ám có 6-30% cơ hội (dựa trên lượng HP đã mất) để tiêu diệt mọi kẻ địch trong phạm vi, ngoại trừ mục tiêu chính.
items.weapon.enchantments.grim.name=%s ảm đạm
items.weapon.enchantments.kinetic$conserveddamage.desc=Vũ khí của bạn đã tích trữ năng lượng dư thừa từ đòn kết liễu trước đó và sẽ áp dụng nó như sát thương cộng thêm cho đòn tấn công tiếp theo. Tuy nhiên, năng lượng này sẽ giảm dần theo thời gian.\n\nSát thương tích lũy: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=thiệt hại được bảo tồn
items.weapon.enchantments.kinetic.desc=Khi tiêu diệt kẻ địch bằng vũ khí động năng, lực dư thừa sẽ được tích trữ trong vũ khí và được sử dụng cho đòn tấn công thành công tiếp theo.
items.weapon.enchantments.kinetic.elestrike_desc=Đòn tấn công nguyên tố với hiệu ứng động năng sẽ gây ra 40% sát thương tích lũy cho mỗi kẻ địch trong phạm vi, ngoại trừ mục tiêu chính.
items.weapon.enchantments.kinetic.name=động học %s
items.weapon.enchantments.lucky.desc=Kẻ thù bị tiêu diệt bởi vũ khí may mắn có cơ hội rơi ra thêm vật phẩm.
items.weapon.enchantments.lucky.elestrike_desc=Đòn tấn công nguyên tố kết hợp với bùa may mắn có 12,5% cơ hội tạo ra vật phẩm rơi ra dưới mỗi kẻ địch trong phạm vi. Hiệu ứng này chỉ có thể kích hoạt một lần cho mỗi kẻ địch.
items.weapon.enchantments.lucky.name=mã %s may mắn
items.weapon.enchantments.projecting.desc=Với bùa chú này, vũ khí cận chiến sẽ có tầm đánh xa hơn. Vũ khí tầm xa sẽ xuyên qua tường khi nhắm vào mục tiêu ở gần.
items.weapon.enchantments.projecting.elestrike_desc=Đòn tấn công nguyên tố với hiệu ứng phép thuật lan tỏa gây ra 30% sát thương cho mỗi kẻ địch trong phạm vi, ngoại trừ mục tiêu chính.
items.weapon.enchantments.projecting.name=chiếu %s
items.weapon.enchantments.shocking.desc=Tia điện phóng ra từ vũ khí gây sốc, gây thêm sát thương cho tất cả kẻ thù gần đó.
items.weapon.enchantments.shocking.elestrike_desc=Một đòn tấn công nguyên tố với hiệu ứng gây sốc sẽ lan tỏa điện năng đến mọi ô trong phạm vi, kéo dài 8 lượt.
items.weapon.enchantments.shocking.name=gây sốc %s
items.weapon.enchantments.unstable.desc=Phép thuật này tỏa ra năng lượng hỗn loạn, hoạt động như một phép thuật khác nhau mỗi khi bị tấn công.
items.weapon.enchantments.unstable.elestrike_desc=Đòn tấn công nguyên tố với hiệu ứng ma thuật không ổn định sẽ áp dụng hiệu ứng ma thuật ngẫu nhiên lên mọi kẻ địch trong phạm vi, ngoại trừ mục tiêu chính.
items.weapon.enchantments.unstable.name=%s không ổn định
items.weapon.enchantments.vampiric.desc=Phép thuật mạnh mẽ này hút sinh lực từ kẻ thù sau mỗi đòn đánh, rồi truyền ngược lại cho người đeo. Hiệu quả càng mạnh khi sức khỏe của người đeo càng thấp.
items.weapon.enchantments.vampiric.elestrike_desc=Đòn tấn công nguyên tố kết hợp với bùa chú hút máu sẽ hồi phục 2,5 HP cho mỗi kẻ địch trong phạm vi tác dụng lên Đấu sĩ.
items.weapon.enchantments.vampiric.name=ma cà rồng %s
items.weapon.melee.assassinsblade.ability_desc=Đấu sĩ có thể lén lút trong khi sử dụng thanh kiếm của sát thủ. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 3 ô và ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.assassinsblade.ability_name=lén lút
items.weapon.melee.assassinsblade.desc=Một lưỡi dao nhỏ, lượn sóng làm bằng đá obsidian, khó sử dụng dù nhẹ nhưng cực kỳ nguy hiểm nếu trúng đích.
items.weapon.melee.assassinsblade.name=lưỡi dao của sát thủ
items.weapon.melee.assassinsblade.stats_desc=Vũ khí này hiệu quả hơn khi đối phó với kẻ địch không cảnh giác.
items.weapon.melee.assassinsblade.typical_ability_desc=Đấu sĩ có thể lén lút trong khi sử dụng thanh kiếm của sát thủ. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 3 ô và thường ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Thời lượng khả năng
items.weapon.melee.battleaxe.ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng rìu chiến. Đòn tấn công tập trung này gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, đồng thời giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.battleaxe.ability_name=cú đánh mạnh
items.weapon.melee.battleaxe.desc=Đầu rìu chiến bằng thép khổng lồ này tạo ra sức nặng đáng kể cho mỗi nhát chém rộng.
items.weapon.melee.battleaxe.name=rìu chiến
items.weapon.melee.battleaxe.stats_desc=Đây là một loại vũ khí khá chính xác.
items.weapon.melee.battleaxe.typical_ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng rìu chiến. Đòn tấn công tập trung này thường gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.crossbow$chargedshot.desc=Đấu Sĩ đang tập trung sức mạnh vào cây nỏ của mình. Đòn tấn công tiếp theo của cô ấy sẽ luôn trúng đích và áp dụng một trong ba hiệu ứng sau: \n - Đòn tấn công cận chiến sẽ hất văng kẻ địch vài ô. \n - Mũi tên không có đầu nhọn sẽ gây thêm sát thương. \n - Mũi tên có đầu nhọn sẽ được sử dụng thêm lần nữa và áp dụng hiệu ứng trong khu vực 7x7. Hiệu ứng tích cực của mũi tên chỉ ảnh hưởng đến đồng minh, và hiệu ứng tiêu cực chỉ áp dụng cho kẻ địch. Đấu Sĩ không thể sử dụng khả năng này để áp dụng hiệu ứng tích cực của mũi tên lên chính mình.
items.weapon.melee.crossbow$chargedshot.name=bị tính phí
items.weapon.melee.crossbow.ability_desc=Đấu sĩ có thể _nạp_ năng lượng cho nỏ của mình, khiến đòn tấn công thường tiếp theo bằng nỏ luôn trúng đích và áp dụng một trong ba hiệu ứng: tấn công cận chiến sẽ hất văng kẻ thù, phi tiêu không có đầu nhọn sẽ gây thêm _+%1$d sát thương_, và phi tiêu có đầu nhọn sẽ áp dụng hiệu ứng trong khu vực 7x7 và kéo dài thêm _%2$d lượt sử dụng_.
items.weapon.melee.crossbow.ability_name=cú bắn tích điện
items.weapon.melee.crossbow.desc=Đây là một loại vũ khí khá phức tạp, bắn ra những mũi tên với tốc độ cực nhanh. Mặc dù không được thiết kế cho mục đích đó, nhưng trọng lượng và cấu tạo chắc chắn của chiếc nỏ này cũng khiến nó trở thành một vũ khí cận chiến khá tốt.
items.weapon.melee.crossbow.name=nỏ
items.weapon.melee.crossbow.stats_desc=Vũ khí này tăng sức mạnh cho phi tiêu ném, giúp gây ra sát thương _%1$d-%2$d_ khi được trang bị, và thậm chí còn truyền hiệu ứng phép thuật của nó cho phi tiêu.
items.weapon.melee.crossbow.typical_ability_desc=Đấu sĩ có thể _nạp_ năng lượng cho nỏ của mình, khiến đòn tấn công thường tiếp theo bằng nỏ luôn trúng đích và áp dụng một trong ba hiệu ứng: tấn công cận chiến sẽ hất văng kẻ thù, phi tiêu không có đầu nhọn thường gây thêm _+%1$d sát thương_, và phi tiêu có đầu nhọn sẽ áp dụng hiệu ứng trong khu vực 7x7 và thường kéo dài thêm _%2$d lượt sử dụng_.
items.weapon.melee.crossbow.typical_stats_desc=Thông thường, vũ khí này sẽ tăng sức mạnh cho phi tiêu ném, khiến chúng gây ra sát thương _%1$d-%2$d_ khi được trang bị, và thậm chí còn truyền hiệu ứng phép thuật của nó cho phi tiêu.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Tăng cường khả năng
items.weapon.melee.cudgel.ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng dùi cui. Đòn tấn công tập trung này gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng váng chúng trong 5 lượt, đồng thời giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.cudgel.ability_name=cú đánh mạnh
items.weapon.melee.cudgel.desc=Một chiếc chùy nhỏ bằng đồng thau, được chế tạo chủ yếu để tự vệ cho giới quý tộc hơn là làm vũ khí cho các cuộc phiêu lưu.
items.weapon.melee.cudgel.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.melee.cudgel.name=cây gậy
items.weapon.melee.cudgel.stats_desc=Đây là một loại vũ khí khá chính xác.
items.weapon.melee.cudgel.typical_ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng dùi cui. Đòn tấn công tập trung này thường gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng váng chúng trong 5 lượt, giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.dagger.ability_desc=Đấu sĩ có thể lén lút khi đang cầm dao găm. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 5 ô và ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.dagger.ability_name=lén lút
items.weapon.melee.dagger.desc=Một con dao găm đơn giản bằng sắt với cán gỗ đã cũ.
items.weapon.melee.dagger.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.melee.dagger.name=dao găm
items.weapon.melee.dagger.stats_desc=Vũ khí này hiệu quả hơn khi đối phó với kẻ địch không cảnh giác.
items.weapon.melee.dagger.typical_ability_desc=Đấu sĩ có thể lén lút khi đang cầm dao găm. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 5 ô và thường ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.dagger.upgrade_ability_stat_name=Thời lượng khả năng
items.weapon.melee.dirk.ability_desc=Đấu sĩ có thể lén lút khi cầm dao găm. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 4 ô và ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.dirk.ability_name=lén lút
items.weapon.melee.dirk.desc=Dao găm dài hơn, có độ cứng chắc hơn, giúp đâm sâu hơn vào kẻ thù.
items.weapon.melee.dirk.name=dao găm
items.weapon.melee.dirk.stats_desc=Vũ khí này hiệu quả hơn khi đối phó với kẻ địch không cảnh giác.
items.weapon.melee.dirk.typical_ability_desc=Đấu sĩ có thể lén lút khi cầm dao găm. Khả năng này cho phép Đấu sĩ dịch chuyển tức thời tối đa 4 ô và thường ban cho cô ta khả năng tàng hình trong _%d lượt._
items.weapon.melee.dirk.upgrade_ability_stat_name=Thời lượng khả năng
items.weapon.melee.flail$spinabilitytracker.desc=Đấu sĩ đang xoay cây chùy của mình, tích lũy sát thương cho đòn tấn công thường tiếp theo. Mỗi lần xoay tốn một lượt nhưng tăng sát thương, tối đa ba lần xoay. Chùy cũng chắc chắn trúng mục tiêu khi đang xoay.\n\nSố lượt xoay hiện tại: %1$d%%.\nSố lượt còn lại: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=quay
items.weapon.melee.flail.ability_desc=Đấu sĩ có thể _quay_ cây chùy để tích lũy sức mạnh trong một thời gian ngắn. Mỗi lượt quay chùy sẽ gây thêm _+%d sát thương_ trong đòn tấn công thường tiếp theo, tối đa 3 lần. Chùy đang quay cũng chắc chắn trúng đích. Chỉ việc bắt đầu quay chùy mới tốn một điểm tích lũy.
items.weapon.melee.flail.ability_name=quay
items.weapon.melee.flail.desc=Một quả cầu có gai được gắn vào một tay cầm bằng một đoạn dây xích. Rất khó điều khiển, nhưng sẽ gây sát thương khủng khiếp nếu trúng đích.
items.weapon.melee.flail.name=roi
items.weapon.melee.flail.spin_warn=Bạn không thể quay roi nữa.
items.weapon.melee.flail.stats_desc=Đây là một loại vũ khí khá thiếu chính xác.\nVũ khí này không thể tấn công bất ngờ.
items.weapon.melee.flail.typical_ability_desc=Đấu sĩ có thể _quay_ cây chùy để tích lũy sức mạnh trong một thời gian ngắn. Mỗi lượt quay chùy, đòn tấn công thường tiếp theo sẽ gây thêm _+%d sát thương_, tối đa 3 lần. Chùy đang quay cũng chắc chắn trúng đích. Chỉ việc bắt đầu quay chùy mới tốn một điểm tích lũy.
items.weapon.melee.gauntlet.ability_desc=Đấu sĩ có thể thực hiện đòn tấn công kết hợp bằng găng tay đá. Đòn tấn công này chắc chắn trúng đích và gây thêm sát thương (+%d) cho mỗi lần Đấu sĩ tấn công trúng đích bằng đòn tấn công cận chiến hoặc ném vũ khí thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.gauntlet.ability_name=đòn tấn công kết hợp
items.weapon.melee.gauntlet.desc=Chiếc găng tay khổng lồ này được làm từ vải màu đỏ thẫm với lớp đá ma thuật nặng phủ bên trên. Vải ôm sát lấy bạn, khiến những tấm đá dày gần như trở thành lớp da thứ hai. Vung một vũ khí nặng như vậy đòi hỏi sức mạnh, nhưng bù lại sẽ tăng thêm lực đáng kể cho những cú đánh của bạn.
items.weapon.melee.gauntlet.name=găng tay đá
items.weapon.melee.gauntlet.stats_desc=Đây là một loại vũ khí rất nhanh.
items.weapon.melee.gauntlet.typical_ability_desc=Đấu sĩ có thể thực hiện một đòn tấn công kết hợp bằng găng tay đá. Đòn tấn công này chắc chắn trúng đích và thường gây ra sát thương _+%d_ cho mỗi lần Đấu sĩ tấn công trúng đích bằng đòn tấn công cận chiến hoặc ném vũ khí thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.glaive.ability_desc=Đấu sĩ có thể dùng đầu mũi giáo để đâm vào kẻ địch trong tầm nhưng không ở sát bên. Đòn tấn công này gây ra sát thương _%1$d-%2$d_, đẩy lùi kẻ địch và chắc chắn trúng đích.
items.weapon.melee.glaive.ability_name=gai
items.weapon.melee.glaive.desc=Một loại vũ khí cán dài cỡ lớn, bao gồm một lưỡi kiếm gắn ở đầu một cây cán.
items.weapon.melee.glaive.name=giáo
items.weapon.melee.glaive.stats_desc=Đây là một vũ khí khá chậm.\nVũ khí này có tầm bắn xa hơn.
items.weapon.melee.glaive.typical_ability_desc=Đấu sĩ có thể dùng đầu mũi giáo để đâm vào kẻ địch trong tầm nhưng không ở sát bên. Chiêu này thường gây ra sát thương _%1$d-%2$d_, đẩy lùi kẻ địch và chắc chắn trúng đích.
items.weapon.melee.gloves.ability_desc=Đấu sĩ có thể thực hiện đòn tấn công kết hợp bằng găng tay đinh tán. Đòn tấn công này chắc chắn trúng đích và gây thêm sát thương (+%d) cho mỗi lần Đấu sĩ tấn công trúng đích bằng đòn tấn công cận chiến hoặc vũ khí ném thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.gloves.ability_name=đòn tấn công kết hợp
items.weapon.melee.gloves.desc=Những chiếc găng tay đính đinh tán này không thực sự có tác dụng bảo vệ, nhưng chúng lại có thể dùng như một vũ khí hữu dụng trong khi vẫn giữ cho đôi tay được tự do.
items.weapon.melee.gloves.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.melee.gloves.name=găng tay đinh tán
items.weapon.melee.gloves.stats_desc=Đây là một loại vũ khí rất nhanh.
items.weapon.melee.gloves.typical_ability_desc=Đấu sĩ có thể thực hiện đòn tấn công kết hợp bằng găng tay đinh tán. Đòn tấn công này chắc chắn trúng đích và thường gây ra sát thương _+%d_ cho mỗi lần Đấu sĩ tấn công trúng đích bằng đòn tấn công cận chiến hoặc vũ khí ném thông thường. Không tấn công trúng đích trong 5 lượt sẽ thiết lập lại chuỗi combo này.
items.weapon.melee.greataxe.ability_desc=Đấu sĩ có thể thực hiện đòn tấn công trả thù bằng đại rìa nếu lượng máu của cô ấy dưới 50%%. Đòn tấn công tàn phá này gây ra sát thương _%1$d-%2$d_, chắc chắn trúng đích và diễn ra tức thì nếu tiêu diệt được kẻ địch.
items.weapon.melee.greataxe.ability_name=sự trả thù
items.weapon.melee.greataxe.desc=Được thiết kế để vác trên vai, chiếc rìu khổng lồ này mạnh mẽ không kém gì trọng lượng của nó.
items.weapon.melee.greataxe.name=rìu lớn
items.weapon.melee.greataxe.stats_desc=Khẩu súng này cực kỳ nặng.
items.weapon.melee.greataxe.typical_ability_desc=Đấu sĩ có thể thực hiện đòn tấn công trả thù bằng đại rìa nếu lượng máu của cô ấy dưới 50%%. Đòn tấn công tàn phá này thường gây ra sát thương _%1$d-%2$d_, chắc chắn trúng đích và diễn ra tức thì nếu tiêu diệt được kẻ địch.
items.weapon.melee.greatshield.ability_desc=Đấu sĩ có thể tự bảo vệ mình bằng một chiếc khiên lớn, hoàn toàn vô hiệu hóa mọi đòn tấn công vật lý hoặc phép thuật nhắm vào mình trong vòng 0.5 lượt. Sau khi Đấu sĩ chặn được một đòn tấn công, việc phản công hoặc sử dụng phép thuật sẽ kết thúc trạng thái phòng thủ.
items.weapon.melee.greatshield.ability_name=bảo vệ
items.weapon.melee.greatshield.desc=Giống như một bức tường di động hơn là một tấm khiên, khối kim loại khổng lồ này hỗ trợ phòng thủ, nhưng không để lại nhiều khoảng trống cho tấn công.
items.weapon.melee.greatshield.name=tấm khiên lớn
items.weapon.melee.greatshield.stats_desc=Vũ khí này chặn được 0-%d sát thương. Khả năng chặn này tăng lên theo cấp độ nâng cấp.
items.weapon.melee.greatshield.typical_ability_desc=Đấu sĩ có thể tự bảo vệ mình bằng một chiếc khiên lớn, hoàn toàn vô hiệu hóa mọi đòn tấn công vật lý hoặc phép thuật nhắm vào cô ấy trong khoảng thời gian _%d lượt_. Sau khi Đấu sĩ chặn được một đòn tấn công, việc phản công hoặc sử dụng phép thuật sẽ kết thúc trạng thái phòng thủ.
items.weapon.melee.greatshield.typical_stats_desc=Thông thường, vũ khí này chặn được 0-%d sát thương. Khả năng chặn này tăng lên theo cấp độ nâng cấp.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Thời lượng khả năng
