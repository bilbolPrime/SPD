items.dewvial.name=lọ sương
items.energycrystal.desc=Một bộ sưu tập các tinh thể ma thuật nhỏ, chứa đầy năng lượng giả kim thuật.\n\nNhững tinh thể này là nguyên liệu phổ biến nhất trong các công thức giả kim thuật và có thể được tạo ra tại nồi giả kim thuật bằng cách phân hủy các vật phẩm tiêu hao.
