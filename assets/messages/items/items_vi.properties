items.artifacts.etherealchains.desc_cursed=Những sợi xích bị nguyền rủa khóa chặt bên hông bạn, liên tục đung đưa, cố gắng làm bạn vấp ngã hoặc trói buộc.
items.artifacts.etherealchains.desc_equipped=Những sợi xích nằm xung quanh bạn, từ từ hút cạn năng lượng tâm linh của những kẻ bạn đánh bại. Mỗi lần sử dụng là một mắt xích trong chuỗi, và chuỗi sẽ kéo dài ra chính xác một ô.
