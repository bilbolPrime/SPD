items.weapon.melee.runicblade.desc=Một vũ khí bí ẩn đến từ vùng đất xa xôi, với lưỡi kiếm màu xanh lam rực rỡ.
items.weapon.melee.runicblade.name=lưỡi kiếm rune
items.weapon.melee.runicblade.stats_desc=Khẩu súng này sẽ càng hiệu quả hơn khi được nâng cấp.
