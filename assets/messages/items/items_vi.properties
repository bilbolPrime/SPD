items.potions.exotic.exoticpotion.crimson=thuốc màu đỏ thẫm kỳ lạ
items.potions.exotic.exoticpotion.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.potions.exotic.exoticpotion.golden=thuốc vàng kỳ lạ
items.potions.exotic.exoticpotion.indigo=thuốc màu chàm kỳ lạ
items.potions.exotic.exoticpotion.ivory=thuốc ngà voi kỳ lạ
items.potions.exotic.exoticpotion.jade=thuốc ngọc bích kỳ lạ
items.potions.exotic.exoticpotion.magenta=thuốc màu hồng tím kỳ lạ
items.potions.exotic.exoticpotion.no=Không, tôi đã thay đổi ý định.
items.potions.exotic.exoticpotion.silver=thuốc bạc kỳ lạ
items.potions.exotic.exoticpotion.turquoise=thuốc màu ngọc lam kỳ lạ
items.potions.exotic.exoticpotion.unknown_desc=Chiếc bình tròn này chứa một chất lỏng có màu sắc sặc sỡ, dạng hạt. Có vẻ như nó đến từ vùng đất này, ai biết được chuyện gì sẽ xảy ra nếu uống hoặc ném nó đi?
items.potions.exotic.exoticpotion.warning=Bạn thực sự muốn hủy bỏ việc sử dụng loại thuốc này sao? Dù sao thì nó cũng sẽ bị tiêu hao thôi.
items.potions.exotic.exoticpotion.yes=Vâng, tôi chắc chắn.
items.potions.exotic.potionofcleansing$cleanse.desc=Nhân vật này tạm thời miễn nhiễm với tất cả các hiệu ứng trạng thái có hại!\n\nSố lượt còn lại: %s.
items.potions.exotic.potionofcleansing$cleanse.name=được thanh tẩy
items.potions.exotic.potionofcleansing.desc=Loại thuốc thử mạnh này sẽ giúp người uống miễn nhiễm với mọi hiệu ứng trạng thái có hại trong vài lượt khi uống vào. Nó cũng có thể được ném vào mục tiêu để thanh tẩy họ.
items.potions.exotic.potionofcleansing.name=thuốc thanh tẩy
items.potions.exotic.potionofcorrosivegas.desc=Mở nắp hoặc làm vỡ bình thủy tinh chịu áp suất này sẽ khiến chất bên trong phát nổ thành một đám mây khí ăn mòn màu gỉ sắt gây chết người. Khí này lan nhanh hơn khí độc và nguy hiểm hơn, nhưng cũng không tồn tại lâu.
items.potions.exotic.potionofcorrosivegas.name=thuốc khí ăn mòn
items.potions.exotic.potionofdivineinspiration.bonus=+2 Điểm Tài năng!
items.potions.exotic.potionofdivineinspiration.desc=Sức mạnh của năng lượng thiêng liêng được cô đọng thành dạng lỏng, thức uống này sẽ truyền cho người uống sức mạnh thần thánh, ban tặng họ hai điểm tài năng thưởng ở cấp độ mà họ lựa chọn.\n\n Bình thuốc này chỉ có thể được sử dụng một lần cho mỗi cấp độ tài năng.
items.potions.exotic.potionofdivineinspiration.name=thuốc của nguồn cảm hứng thần thánh
items.potions.exotic.potionofdivineinspiration.no_more_points=Bạn không thể nhận thêm điểm tài năng thưởng nào nữa.
items.potions.exotic.potionofdivineinspiration.select_tier=Chọn một cấp độ kỹ năng để nhận được hai điểm thưởng. Bạn phải mở khóa cấp độ đó mới có thể sử dụng điểm.
items.potions.exotic.potionofdragonsbreath.desc=Chiếc bình này chứa một hợp chất lạ, khi trộn với nước bọt sẽ bốc cháy ngay lập tức. Nhanh chóng nhổ chất lỏng ra sẽ cho phép người dùng phun lửa từ miệng!
items.potions.exotic.potionofdragonsbreath.name=thuốc hơi thở rồng
items.potions.exotic.potionofdragonsbreath.prompt=Chọn địa điểm để đốt.
items.potions.exotic.potionofearthenarmor.desc=Thay vì làm tê liệt, chất lỏng này có tác dụng làm cứng da, biến da thành một lớp giáp tự nhiên tạm thời.
items.potions.exotic.potionofearthenarmor.name=thuốc giáp đất
items.potions.exotic.potionofmagicalsight.desc=Sau khi uống thức uống này, các giác quan của bạn sẽ tạm thời được tăng cường đến mức đáng kinh ngạc, cho phép bạn nhìn xuyên qua các bức tường trong phạm vi 12 ô!
items.potions.exotic.potionofmagicalsight.name=thuốc nhìn thấy ma thuật
items.potions.exotic.potionofmastery.armor_easier=Bộ giáp của bạn sẽ dễ mặc hơn!
items.potions.exotic.potionofmastery.desc=Thay vì ban tặng sức mạnh thô, loại thuốc này sẽ điều chỉnh cơ bắp của người dùng cho phù hợp với một vật phẩm cụ thể. Điều này sẽ giúp vật phẩm đó dễ sử dụng hơn, như thể người uống đã luyện tập với nó và xây dựng được phản xạ cơ bắp. Vũ khí hoặc áo giáp được chọn sẽ cần ít hơn 2 điểm sức mạnh để sử dụng. Loại thuốc này chỉ có thể được sử dụng một lần cho mỗi vật phẩm.
items.potions.exotic.potionofmastery.name=thuốc tăng cường sức mạnh
items.potions.exotic.potionofmastery.prompt=Nắm vững một mục
items.potions.exotic.potionofmastery.weapon_easier=Vũ khí của bạn sẽ dễ sử dụng hơn!
items.potions.exotic.potionofshielding.desc=Thay vì chữa lành vết thương, loại thuốc này sẽ tạo ra một lớp khiên bền chắc bao quanh cơ thể người dùng, ngăn chặn một lượng sát thương đáng kể.
items.potions.exotic.potionofshielding.name=thuốc bảo vệ
items.potions.exotic.potionofshroudingfog.desc=Khi tiếp xúc với không khí, chất lỏng trong bình này sẽ tạo ra một lớp sương mù dày đặc, nhanh chóng lan rộng và che khuất tầm nhìn của kẻ thù.
items.potions.exotic.potionofshroudingfog.name=thuốc sương mù bao phủ
items.potions.exotic.potionofsnapfreeze.desc=Chất hóa học có trong loại thuốc này sẽ phản ứng nhanh chóng với không khí, lập tức đóng băng và trói chặt mọi thứ trong phạm vi ảnh hưởng của nó.
items.potions.exotic.potionofsnapfreeze.name=thuốc đóng băng tức thì
items.potions.exotic.potionofstamina.desc=Uống loại thức uống có vị ngọt lạ này sẽ cung cấp cho bạn nguồn năng lượng dồi dào kéo dài, cho phép bạn chạy nhanh hơn trong thời gian dài.
items.potions.exotic.potionofstamina.name=thuốc tăng sức bền
items.potions.exotic.potionofstormclouds.desc=Ném lọ thuốc này sẽ tạo ra một đám mây hơi nước đậm đặc lan nhanh, sau đó ngưng tụ và đổ xuống môi trường xung quanh. Hầu hết địa hình sẽ biến thành nước, kẻ thù hệ lửa sẽ bị sát thương, lửa sẽ bị dập tắt, và bẫy sẽ bị phá vỡ.
items.potions.exotic.potionofstormclouds.name=thuốc của những đám mây bão
