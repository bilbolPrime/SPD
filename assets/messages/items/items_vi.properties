items.food.berry.name=quả mọng ngục tối
items.food.blandfruit$chunks.desc=Quả blandfruit đã nổ tung khi va chạm, để lại những mảnh vụn trơ trọi phía sau. Mặc dù có dính một chút bụi bẩn, những miếng blandfruit nấu chín lớn này dường như hoàn toàn ăn được.
