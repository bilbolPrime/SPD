items.weapon.melee.magesstaff.ac_imbue=IMBUE
items.weapon.melee.magesstaff.ac_zap=TIA SÁNG
items.weapon.melee.magesstaff.cursed_wand=Cây trượng bị nguyền rủa, khiến phép thuật của nó trở nên hỗn loạn và ngẫu nhiên.
items.weapon.melee.magesstaff.desc=Được chính pháp sư chế tác, cây trượng này là một vũ khí ma thuật độc đáo có thể được cường hóa bằng một cây đũa phép.
items.weapon.melee.magesstaff.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.weapon.melee.magesstaff.has_wand=Hiện tại, nhân viên đang được truyền năng lượng _%s._
items.weapon.melee.magesstaff.imbue=Bạn truyền đạt %s cho nhân viên của mình.
items.weapon.melee.magesstaff.imbue_cursed=Nếu bạn yểm bùa lên một cây đũa phép bị nguyền rủa, thì cây trượng của bạn cũng sẽ bị nguyền rủa!
items.weapon.melee.magesstaff.imbue_desc=Bạn có chắc chắn muốn truyền sức mạnh từ cây đũa phép này vào cây trượng của mình không?\n\nNếu cây đũa phép được truyền sức mạnh có cùng cấp độ hoặc cao hơn cây trượng, cây trượng sẽ kế thừa cấp độ của cây đũa phép đó cộng thêm một cấp độ nâng cấp riêng của nó.
items.weapon.melee.magesstaff.imbue_level=Việc truyền năng lượng này sẽ tạo ra một cây trượng _+%d._
items.weapon.melee.magesstaff.imbue_lost=Cây đũa phép hiện đang được yểm vào cây trượng của bạn sẽ bị mất.
items.weapon.melee.magesstaff.imbue_talent=Cây đũa phép hiện đang được yểm vào cây trượng của bạn sẽ được trả lại với giá trị +0.
items.weapon.melee.magesstaff.imbue_unknown=Bạn không biết cấp độ của cây trượng này, nhưng phép cường hóa này sẽ tạo ra ít nhất một cây trượng _+%d._
items.weapon.melee.magesstaff.name=cây gậy của pháp sư
