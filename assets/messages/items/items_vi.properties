items.weapon.melee.magesstaff.no_wand=Cây trượng hiện tại không có phép thuật, nó cần được _truyền năng lượng của một cây đũa phép_ trước khi có thể được sử dụng để thi triển phép thuật.
items.weapon.melee.magesstaff.preserved=Cây đũa phép cũ đã được giữ lại!
