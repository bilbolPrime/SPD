items.artifacts.masterthievesarmband.cursed=Bạn không thể sử dụng chiếc vòng tay bị nguyền rủa.
items.artifacts.masterthievesarmband.desc=Chiếc băng tay nhung tím này mang dấu ấn của một tên trộm bậc thầy. Nó không thuộc về bạn, nhưng có lẽ người sử dụng trước đó cũng không sở hữu nó.
items.artifacts.masterthievesarmband.desc_cursed=Chiếc vòng tay bị nguyền rủa đã buộc chặt vào cổ tay bạn, và không hiểu sao túi vàng của bạn dường như đang dần nhẹ đi...
items.artifacts.masterthievesarmband.desc_worn=Bạn cảm nhận được sức mạnh tích tụ trong chiếc băng đeo tay khi tích lũy kinh nghiệm. Bạn có thể sử dụng sức mạnh này để ăn trộm từ các cửa hàng hoặc cướp bóc kẻ thù! Việc cướp bóc kẻ thù diễn ra ngay lập tức, làm chúng mất phương hướng trong giây lát và cho bạn cơ hội lấy được bất cứ chiến lợi phẩm nào chúng có! Sức mạnh này hiệu quả hơn đối với những kẻ thù không cảnh giác. Cướp bóc cùng một kẻ thù nhiều lần không làm tăng cơ hội nhận được chiến lợi phẩm.
