items.weapon.weaponeffects.weaponeffect.smite.prefix=Man rợ
items.weapon.weaponeffects.weaponeffect.smite.name=%s man rợ
items.weapon.weaponeffects.weaponeffect.smite.desc=Vũ khí này _man rợ_. Mỗi đòn trúng có _20%_ cơ hội tung _Đòn mạnh cấp 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Đòn mạnh!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Đẩy lùi
items.weapon.weaponeffects.weaponeffect.knockback.name=%s đẩy lùi
items.weapon.weaponeffects.weaponeffect.knockback.desc=Vũ khí này có sức _đẩy lùi_. Mỗi đòn trúng có _20%_ cơ hội đẩy kẻ địch lùi _một ô_. Không thể đẩy lùi trùm.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Đẩy lùi!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Mãng xà
items.weapon.weaponeffects.weaponeffect.venom.name=%s mãng xà
items.weapon.weaponeffects.weaponeffect.venom.desc=Vũ khí này mang độc của _mãng xà_. Mỗi đòn trúng có _20%_ cơ hội đầu độc mục tiêu.
items.weapon.weaponeffects.weaponeffect.venom.activate=Nọc độc!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Gây què
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s gây què
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Vũ khí này _gây què_. Các đòn đánh tầm xa trúng đích có _20%_ cơ hội khiến kẻ địch đi khập khiễng trong _10 lượt_. Trùm miễn nhiễm.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Què!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Cổ tự
items.weapon.weaponeffects.weaponeffect.spark.name=%s cổ tự
items.weapon.weaponeffects.weaponeffect.spark.desc=Đũa phép này có khắc _cổ tự_. Phép thuật của nó có _20%_ cơ hội tạo _Tia lửa_, gây thêm _4–8_ sát thương phép.
items.weapon.weaponeffects.weaponeffect.spark.activate=Tia lửa!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Nguyền rủa
items.weapon.weaponeffects.weaponeffect.curse.name=%s nguyền rủa
items.weapon.weaponeffects.weaponeffect.curse.desc=Đũa phép này có sức _nguyền rủa_. Phép thuật của nó có _20%_ cơ hội làm suy yếu mục tiêu, giảm _5%_ sát thương mục tiêu gây ra trong _10 lượt_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Lời nguyền!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Hút sinh lực
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s hút sinh lực
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Đũa phép này _hút sinh lực_. Phép thuật của nó có _20%_ cơ hội gây thêm _8–16_ sát thương phép và hồi cho bạn lượng máu bằng lượng đã lấy từ mục tiêu.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Hút sinh lực!

items.armor.armorprefix.stalwart.name=%s kiên cường
items.armor.armorprefix.stalwart.desc=Giáp này _kiên cường_. Đòn đánh của kẻ địch có _20%_ cơ hội kích hoạt _Bền bỉ cấp 5_, giảm _20%_ sát thương của đòn đó.
items.armor.armorprefix.stalwart.activate=Bền bỉ!

items.armor.armorprefix.vigilant.name=%s cảnh giác
items.armor.armorprefix.vigilant.desc=Giáp này giúp bạn _cảnh giác_. Bạn có _20%_ cơ hội né đòn đánh tầm xa của kẻ địch.
items.armor.armorprefix.vigilant.activate=Cảnh giác!

items.armor.armorprefix.elusive.name=%s khó bắt
items.armor.armorprefix.elusive.desc=Giáp này khiến bạn _khó bắt_. Khi đòn đánh của kẻ địch gây sát thương cho bạn, có _20%_ cơ hội tăng _5_ né tránh trong _5 lượt_.
items.armor.armorprefix.elusive.activate=Né tránh!
