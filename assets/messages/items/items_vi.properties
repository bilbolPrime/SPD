items.weapon.melee.roundshield.ability_desc=Đấu sĩ có thể tự bảo vệ mình bằng một chiếc khiên tròn, hoàn toàn vô hiệu hóa mọi đòn tấn công vật lý hoặc phép thuật nhắm vào mình trong vòng 0.5 lượt. Sau khi Đấu sĩ chặn được một đòn tấn công, việc phản công hoặc sử dụng phép thuật sẽ kết thúc trạng thái phòng thủ.
items.weapon.melee.roundshield.ability_name=bảo vệ
items.weapon.melee.roundshield.desc=Chiếc khiên lớn này có khả năng chặn đòn tấn công hiệu quả và cũng là một vũ khí khá tốt trong những tình huống khẩn cấp.
