items.equipableitem.unequip_cursed=Bạn không thể loại bỏ một vật phẩm bị nguyền rủa!
items.food.berry.desc=Loại quả mọng nhỏ này được Nữ Thợ Săn tìm thấy trong đám cây cối của hầm ngục. Nó có thể ăn nhanh, giúp phục hồi một lượng nhỏ năng lượng và có thể chứa một hạt giống có thể sử dụng được!
items.food.berry.discover_hint=Bạn có thể tìm thấy vật phẩm này bằng cách sử dụng một kỹ năng đặc biệt của anh hùng.
