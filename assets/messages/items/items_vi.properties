items.dewvial.ac_drink=UỐNG
items.dewvial.auto_drink=Lọ sương đã cạn để chữa lành vết thương của bạn.
items.dewvial.collected=Bạn đã hứng một giọt sương vào lọ.
items.dewvial.desc=Bạn có thể cất sương dư vào chiếc lọ nhỏ này để uống sau. Nếu lọ đầy, sương sẽ được uống tự động khi bạn cận kề cái chết.
