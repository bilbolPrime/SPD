items.artifacts.sandalsofnature.desc_1=Thoạt nhìn, những thứ trông giống như dép làm bằng dây thừng thực chất lại là hai cây! Chúng trông rất yếu ớt và nhợt nhạt, có lẽ chúng cần được cung cấp chất dinh dưỡng?
items.artifacts.sandalsofnature.desc_2=Đôi giày đã lớn hơn và giờ trông giống hai chiếc giày được may đo riêng hơn. Chúng đã có thêm màu sắc, có lẽ chúng vẫn có thể lớn hơn nữa?
items.artifacts.sandalsofnature.desc_3=Những cây này đã mọc lại và giờ trông giống như một đôi ủng chắc chắn làm từ vỏ cây. Chúng dường như đã lấy lại được sức sống, nhưng có lẽ chúng vẫn có thể phát triển hơn nữa?
items.artifacts.sandalsofnature.desc_4=Những cây này dường như đã đạt đến kích thước tối đa, chúng trông giống như một cặp giáp chân. Giáp chân có màu nâu sẫm và trông giống như một cái cây rất chắc khỏe.
items.artifacts.sandalsofnature.desc_ability=Đôi giày sẽ gợn sóng theo màu sắc của hạt giống cuối cùng bạn gieo cho chúng. Chúng có thể bám rễ xuống đất trong thời gian ngắn và tạo ra hiệu ứng của cây đó ở bất kỳ đâu trong bán kính 3 ô.\nHạt giống: _%s_\nCần sạc: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Đôi dép bị nguyền rủa đang ngăn cản mọi sự hòa hợp với thiên nhiên.
items.artifacts.sandalsofnature.desc_hint=Bạn sẽ cảm thấy hòa hợp hơn với thiên nhiên khi đeo món đồ này.
