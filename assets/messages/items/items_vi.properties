items.weapon.melee.greatsword.name=thanh kiếm lớn
items.weapon.melee.greatsword.typical_ability_desc=Đấu sĩ có thể chém một kẻ địch bằng đại kiếm. Chiêu thức này thường gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.handaxe.ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng rìu cầm tay. Đòn tấn công tập trung này gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, đồng thời giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.handaxe.ability_name=cú đánh mạnh
items.weapon.melee.handaxe.desc=Một loại rìu nhẹ, thường được dùng để đốn cây. Lưỡi rìu rộng cũng rất hiệu quả khi đối đầu với kẻ thù.
items.weapon.melee.handaxe.name=rìu cầm tay
