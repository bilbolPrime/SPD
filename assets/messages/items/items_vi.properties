items.artifacts.holytome.cursed=Bạn không thể sử dụng một cuốn sách bị nguyền rủa.
items.artifacts.holytome.desc=Một cuốn sách thánh đóng vai trò là vật tập trung cho ma thuật thần thánh của Giáo sĩ. Sử dụng cuốn sách cho phép Giáo sĩ thi triển nhiều loại phép thuật khác nhau. Cuốn sách sẽ dần trở nên mạnh mẽ hơn khi Giáo sĩ sử dụng nó, giúp Giáo sĩ có nhiều lượt sử dụng tối đa hơn và tốc độ hồi chiêu cũng nhanh hơn một chút.
