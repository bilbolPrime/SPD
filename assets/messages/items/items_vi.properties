items.artifacts.sandalsofnature.no_effect=Trước tiên, bạn phải cho giày của mình ăn một loại hạt giống.
items.artifacts.sandalsofnature.out_of_range=Vị trí đó nằm ngoài phạm vi phủ sóng.
