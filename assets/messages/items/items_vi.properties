items.weapon.melee.roundshield.typical_ability_desc=Đấu sĩ có thể tự bảo vệ mình bằng một chiếc khiên tròn, hoàn toàn vô hiệu hóa mọi đòn tấn công vật lý hoặc phép thuật nhắm vào mình trong khoảng thời gian _%d lượt_. Sau khi Đấu sĩ chặn được một đòn tấn công, việc phản công hoặc sử dụng phép thuật sẽ kết thúc trạng thái phòng thủ.
items.weapon.melee.roundshield.typical_stats_desc=Thông thường, vũ khí này chặn được 0-%d sát thương. Khả năng chặn này tăng lên theo cấp độ nâng cấp.
