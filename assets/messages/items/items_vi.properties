items.weapon.melee.katana.typical_ability_desc=Đấu sĩ có thể lao tới bằng thanh katana vào kẻ địch cách đó 1 ô. Hành động này di chuyển về phía kẻ địch, thường gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích.
items.weapon.melee.longsword.ability_desc=Đấu sĩ có thể chém một kẻ địch bằng kiếm dài. Chiêu thức này gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích. Nếu chém hạ gục kẻ địch, hiệu ứng diễn ra tức thì và Đấu sĩ có thể sử dụng chiêu chém lại trong vòng 5 lượt mà không mất phí.
items.weapon.melee.longsword.ability_name=chia tách
items.weapon.melee.longsword.desc=Lưỡi kiếm dài, sắc bén như dao cạo của thanh kiếm này sáng loáng đầy vẻ đáng tin cậy, mặc dù kích thước lớn khiến nó khá nặng.
items.weapon.melee.longsword.name=thanh kiếm dài
