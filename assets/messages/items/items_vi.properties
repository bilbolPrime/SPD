items.weapon.melee.roundshield$guardtracker.desc=Đấu sĩ đã chuẩn bị sẵn tấm khiên để đề phòng các đòn tấn công sắp tới. Các đòn tấn công vật lý hoặc phép thuật nhắm vào cô ấy sẽ bị vô hiệu hóa hoàn toàn.\n\nSố lượt còn lại: %s.
