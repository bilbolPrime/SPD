items.food.frozencarpaccio.better=Bạn cảm thấy khỏe hơn rồi!
items.food.frozencarpaccio.desc=Đó là một miếng thịt sống đông lạnh. Cách duy nhất để ăn nó là cắt thành từng lát mỏng. Và ăn theo cách này thì ngon đến bất ngờ.
