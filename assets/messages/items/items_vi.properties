items.amulet.ac_end=KẾT THÚC TRÒ CHƠI
items.amulet.ascent_desc=Bạn bắt đầu cảm nhận được sức mạnh to lớn và khủng khiếp của Yog-Dzewa tỏa ra từ chiếc bùa hộ mệnh. Việc quay trở lại hầm ngục với tư cách là một người phàm có thể khó khăn hơn bạn tưởng! Nếu bạn tiếp tục leo lên với chiếc bùa hộ mệnh, hầm ngục sẽ trở nên nguy hiểm hơn, các cổng dịch chuyển giữa các tầng sẽ bị vô hiệu hóa, và bạn chỉ có thể chiến thắng trò chơi bằng cách đánh bại kẻ thù khi leo lên hầm ngục! Bạn có thể để lại chiếc bùa hộ mệnh ở đây nếu muốn leo lên mà không bắt đầu thử thách này, hoặc kích hoạt chiếc bùa hộ mệnh trước khi leo lên để kết thúc trò chơi bình thường.
items.amulet.ascent_no=Dừng lại ngay
items.amulet.ascent_title=Thăng thiên
items.amulet.ascent_yes=Tiếp tục!
items.amulet.desc=Bùa hộ mệnh Yendor là bảo vật mạnh mẽ nhất mà loài người hay người lùn từng biết đến. Những tinh thể lấp lánh của nó chứa đựng sức mạnh phi thường và kỳ diệu.
items.amulet.desc_ascent=Nguồn gốc của chiếc bùa hộ mệnh vẫn chưa được biết rõ, nhưng rõ ràng nó đã bị ảnh hưởng rất nhiều bởi sức mạnh của Yog-Dzewa. Hầm ngục dường như đang tuân theo ý muốn của Yog khi bạn tiến sâu vào, khiến kẻ thù trở nên đông đảo và mạnh mẽ hơn rất nhiều! Bạn cũng không thể kích hoạt hoặc loại bỏ chiếc bùa hộ mệnh nữa, gần như thể nó đã bị nguyền rủa.
items.amulet.desc_origins=Nguồn gốc của chiếc bùa hộ mệnh vẫn chưa được biết rõ. Lịch sử kể rằng Vua của người Lùn từng khoe khoang rằng ông đã phát hiện ra cổ vật này ngay trước khi nền văn minh người Lùn cắt đứt mọi liên lạc. Ông ta tìm thấy nó bằng cách nào? Yog-Dzewa đã lấy nó từ ông ta bằng cách nào? Có lẽ đó là những câu hỏi dành cho một dịp khác, điều quan trọng bây giờ là chiếc bùa hộ mệnh đã thuộc về bạn!
items.amulet.discover_hint=Bạn có thể tìm thấy vật phẩm này ở dưới đáy hầm ngục...
items.amulet.name=bùa hộ mệnh của Yendor
items.ankh.ac_bless=chúc phúc
items.ankh.bless=Bạn ban phước cho biểu tượng ankh bằng nước thần kỳ.
items.ankh.desc=Biểu tượng bất tử cổ xưa này cho phép bạn sống lại sau khi chết. Khi hồi sinh, mọi vật phẩm không được trang bị đều sẽ mất.
items.ankh.desc_blessed=Biểu tượng bất tử cổ xưa này ban tặng khả năng hồi sinh sau khi chết. Biểu tượng Ankh đã được ban phước và giờ đây mạnh mẽ hơn rất nhiều. Ankh sẽ hy sinh bản thân để cứu bạn trong khoảnh khắc nguy hiểm đến tính mạng.
items.ankh.discover_hint=Bạn có thể mua sản phẩm này tại cửa hàng.
items.ankh.name=ankh
items.arcaneresin.ac_apply=ÁP DỤNG
items.arcaneresin.apply=Bạn phủ một lớp nhựa lên cây đũa phép của mình, giúp tăng sức mạnh của nó!
items.arcaneresin.desc=Loại bột mịn này lấp lánh giữa các sắc thái tím và trắng. Nó có thể hoạt động như một chất khuếch đại năng lượng ma thuật, tăng cấp độ của đũa phép khi được sử dụng! Nâng cấp đũa phép tốn 1, 2 hoặc 3 nhựa tùy thuộc vào cấp độ ban đầu của đũa phép. Nhựa có thể nâng cấp đũa phép lên tối đa +3. Tuy nhiên, việc nâng cấp bằng nhựa sẽ bị ghi đè bởi các nguồn nâng cấp khác (chẳng hạn như cuộn giấy nâng cấp) và không áp dụng khi truyền năng lượng vào đũa phép của Pháp sư.
items.arcaneresin.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.arcaneresin.level_too_high=Cây đũa phép đó quá mạnh, nhựa thông không thể cải thiện được.
items.arcaneresin.name=nhựa bí truyền
items.arcaneresin.not_enough=Bạn không có đủ nhựa cho việc đó!
items.arcaneresin.prompt=Chọn một cây đũa phép
items.armor.armor$glyph.discover_hint=Bạn có thể tìm thấy một vật phẩm có hiệu ứng này một cách ngẫu nhiên trong hầm ngục, hoặc thử áp dụng nó vào một vật phẩm của chính mình.
items.armor.armor$glyph.glyph=ký tự
items.armor.armor$glyph.killed=%s đã giết bạn...
items.armor.armor$glyph.rankings_desc=Bị giết bởi một ký hiệu
items.armor.armor.ac_detach=TÁCH RỜI
items.armor.armor.avg_absorb=Thông thường, bộ giáp _tier-%1$d_ này chặn được sát thương _%2$d-%3$d_ và yêu cầu sức mạnh _%4$d_ để sử dụng đúng cách.
items.armor.armor.curr_absorb=Bộ giáp _tier-%1$d_ này chặn được _%2$d-%3$d sát thương_ và yêu cầu _%4$d sức mạnh_ để sử dụng đúng cách.
items.armor.armor.cursed=Bạn có thể cảm nhận được một thứ ma thuật độc ác ẩn chứa bên trong bộ giáp này.
items.armor.armor.cursed_worn=Vì bộ giáp này bị nguyền rủa, bạn không thể nào tháo bỏ nó được.
items.armor.armor.defense=Nó được bổ sung để tăng cường khả năng phòng thủ.
items.armor.armor.detach_seal=Bạn gỡ bỏ lớp niêm phong khỏi áo giáp của mình.
items.armor.armor.equip_cursed=Bộ giáp siết chặt lấy bạn một cách đau đớn.
items.armor.armor.evasion=Nó được tăng cường để nâng cao khả năng né tránh.
items.armor.armor.excess_str=Nhờ sức mạnh vượt trội, bạn trở nên _né tránh_ tốt hơn khi mặc bộ giáp này.
items.armor.armor.glyph_hardened=Nó đã được _cứng lại._
items.armor.armor.hardened_no_glyph=Bộ giáp này đã được tôi cứng, nhưng hiện chưa được khắc bất kỳ ký hiệu nào.
items.armor.armor.hardening_gone=Lớp bảo vệ trên bộ giáp này đã bị mòn!
items.armor.armor.identify=Giờ bạn đã đủ quen thuộc với bộ giáp của mình để nhận ra nó rồi.
items.armor.armor.incompatible=Sự tương tác của các loại ma thuật khác nhau đã xóa mất hình khắc trên bộ giáp này!
items.armor.armor.inscribed=Nó được khắc dòng chữ _%s._
items.armor.armor.not_cursed=Bộ giáp này không bị ảnh hưởng bởi ma thuật độc ác.
items.armor.armor.probably_too_heavy=Có lẽ bộ giáp này quá nặng đối với bạn.
items.armor.armor.seal_attached=Con dấu bị phá vỡ của Chiến binh được gắn vào bộ giáp này. Khi anh ta sắp bị thương xuống dưới một nửa máu, nó sẽ cung cấp cho anh ta lớp khiên _%d_.
items.armor.armor.seal_transfer=Con dấu bị phá vỡ của Chiến binh cần được gắn vào bộ giáp anh ta đang mặc để phát huy tác dụng. Bạn có muốn tự động tháo con dấu khỏi bộ giáp bạn đang cởi ra và gắn nó vào bộ giáp bạn đang trang bị không?
items.armor.armor.seal_transfer_no=KHÔNG
items.armor.armor.seal_transfer_yes=Đúng
items.armor.armor.too_heavy=Do sức mạnh không đủ, việc mặc bộ giáp này sẽ làm giảm khả năng di chuyển, né tránh và phòng thủ của bạn.
items.armor.armor.weak_cursed=Mặc dù bị nguyền rủa, bạn vẫn có thể tháo bỏ bộ giáp này.
items.armor.classarmor.ac_ability=CHỌN KHẢ NĂNG
items.armor.classarmor.ac_transfer=CHUYỂN KHOẢN
items.armor.classarmor.charge_use=Việc sử dụng khả năng này ngay bây giờ sẽ tiêu hao _%s_ năng lượng.
items.armor.classarmor.discover_hint=Bạn có thể tìm thấy vật phẩm này sau khi đánh bại trùm tầng 20 với một anh hùng cụ thể.
items.armor.classarmor.low_charge=Bộ giáp không còn đủ năng lượng để sử dụng sức mạnh đặc biệt!
items.armor.classarmor.no_ability=Bộ giáp của bạn hiện không có khả năng nào, bạn nên chọn một khả năng!
items.armor.classarmor.not_equipped=Bạn cần phải mặc bộ giáp này để sử dụng sức mạnh đặc biệt của nó!
items.armor.classarmor.transfer_cancel=Hủy bỏ
items.armor.classarmor.transfer_complete=Thuộc tính của bộ giáp anh hùng của bạn đã được chuyển giao!
items.armor.classarmor.transfer_desc=Sức mạnh ma thuật của vương miện vua người lùn có thể được chuyển sang một bộ giáp khác. Lưu ý rằng bộ giáp ban đầu sẽ bị phá hủy trong quá trình này.
items.armor.classarmor.transfer_prompt=Chọn một bộ giáp
items.armor.classarmor.transfer_title=Giáp chuyển đổi
items.armor.clericarmor.desc=Khi mặc bộ trang phục kết hợp giữa vải và giáp này, vị tu sĩ có thể thực hiện một khả năng đặc biệt.
items.armor.clericarmor.name=trang phục anh hùng
items.armor.clotharmor.desc=Bộ giáp nhẹ này cung cấp khả năng bảo vệ cơ bản.
items.armor.clotharmor.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.armor.clotharmor.name=áo giáp vải
items.armor.curses.antientropy.desc=Lời nguyền phản entropy hoạt động chống lại các lực lượng của vũ trụ, hút năng lượng vào người đeo và lấy đi từ môi trường xung quanh. Điều này khiến người đeo bốc cháy trong chốc lát, nhưng đóng băng mọi thứ xung quanh họ!
items.armor.curses.antientropy.name=%s của phản entropy
items.armor.curses.bulk.desc=Bộ giáp cồng kềnh trông to lớn và oai vệ hơn, nhưng thực tế lại không tăng cường khả năng phòng thủ. Tệ hơn nữa, kích thước lớn hơn khiến việc di chuyển qua các ô cửa trở nên rất khó khăn.
items.armor.curses.bulk.name=%s số lượng lớn
items.armor.curses.corrosion.desc=Lớp giáp chống ăn mòn có khả năng vỡ ra và chứa đầy chất lỏng ăn mòn, bao phủ mọi thứ trong khu vực bằng chất lỏng axit dính.
items.armor.curses.corrosion.name=%s của sự ăn mòn
items.armor.curses.displacement.desc=Lời nguyền dịch chuyển cố gắng đưa người đeo đến nơi an toàn khi họ bị tấn công. Tuy nhiên, nó lại quá hiệu quả, dịch chuyển người dùng một cách ngẫu nhiên khắp màn chơi.
items.armor.curses.displacement.name=%s của dịch chuyển
items.armor.curses.metabolism.desc=Lời nguyền chuyển hóa trực tiếp biến trạng thái no thành sức khỏe khi người đeo bị thương, giúp tăng cường khả năng hồi phục nhưng nhanh chóng dẫn đến tình trạng đói khát.
items.armor.curses.metabolism.name=%s của quá trình chuyển hóa
items.armor.curses.multiplicity.desc=Bộ giáp bị nguyền rủa bởi phép thuật nhân bản nguy hiểm chứa đựng khả năng tạo ra bản sao. Đôi khi nó sẽ tạo ra hình ảnh phản chiếu của người mặc, nhưng cũng rất có khả năng tạo ra bản sao của kẻ tấn công!
items.armor.curses.multiplicity.name=%s của bội số
items.armor.curses.overgrowth.desc=Áo giáp sinh trưởng bao phủ bởi nhiều loại cây nở hoa. Mặc dù hiệu ứng này trông khá thú vị, nhưng nó không có tác dụng gì trong phòng thủ, và những cây này sẽ ngẫu nhiên nở hoa trong trận chiến!
items.armor.curses.overgrowth.name=%s của sự phát triển quá mức
items.armor.curses.stench.desc=Áo giáp bị nguyền rủa bởi mùi hôi thối sẽ giải phóng những đám khí độc hại, gây nguy hiểm cho mọi thứ bị mắc kẹt trong đám khí đó.
items.armor.curses.stench.name=%s mùi hôi thối
items.armor.duelistarmor.desc=Khi mặc bộ giáp trụ và áo choàng này, đấu sĩ có thể thực hiện một khả năng đặc biệt.
items.armor.duelistarmor.name=áo giáp của anh hùng
items.armor.glyphs.affection.desc=Biểu tượng mạnh mẽ này thao túng tâm trí kẻ tấn công, quyến rũ chúng trong một thời gian ngắn.
items.armor.glyphs.affection.name=%s của tình cảm
items.armor.glyphs.antimagic.desc=Biểu tượng mạnh mẽ này cho phép áo giáp bảo vệ người mặc khỏi các đòn tấn công ma thuật cũng như vật lý. Khả năng phòng thủ ma thuật này không bị ảnh hưởng bởi cấp độ của áo giáp.
items.armor.glyphs.antimagic.name=%s của phép thuật phản ma thuật
items.armor.glyphs.brimstone.desc=Biểu tượng này bảo vệ người đeo và tài sản của họ khỏi lửa, hoàn toàn vô hiệu hóa thiệt hại và tác động tiêu cực của nó.
items.armor.glyphs.brimstone.name=%s của lưu huỳnh
items.armor.glyphs.camouflage.desc=Biểu tượng này cho phép người đeo hòa mình vào đám cỏ cao, mang lại cho họ khả năng tàng hình tạm thời.
items.armor.glyphs.camouflage.name=%s của ngụy trang
items.armor.glyphs.entanglement.desc=Biểu tượng này tạo ra lớp giáp đất bao quanh người đeo để hấp thụ sát thương, nhưng lớp giáp này sẽ vỡ nếu người đeo di chuyển.
items.armor.glyphs.entanglement.name=%s của sự vướng víu
items.armor.glyphs.flow.desc=Biểu tượng này điều khiển dòng chảy của nước xung quanh người đeo, giúp họ di chuyển nhanh hơn nhiều khi ở trong đó.
items.armor.glyphs.flow.name=%s của dòng chảy
items.armor.glyphs.obfuscation.desc=Biểu tượng này che khuất người đeo, khiến họ khó bị phát hiện hơn.
items.armor.glyphs.obfuscation.name=%s của sự che giấu
items.armor.glyphs.potential.desc=Biểu tượng này tích tụ năng lượng khi bị tác động, cung cấp năng lượng cho cây trượng của người đeo khi nó được kích hoạt.
items.armor.glyphs.potential.name=%s tiềm năng
items.armor.glyphs.repulsion.desc=Biểu tượng này phản lại lực tác động lên kẻ tấn công, đẩy chúng bay ngược trở lại.
items.armor.glyphs.repulsion.name=%s của lực đẩy
items.armor.glyphs.stone.desc=Biểu tượng này bao quanh bộ giáp bằng một lớp đá ma thuật dày khiến việc né tránh trở nên bất khả thi, nhưng bù lại, sát thương nhận vào sẽ tỷ lệ thuận với khả năng né tránh.
items.armor.glyphs.stone.name=%s bằng đá
items.armor.glyphs.swiftness.desc=Biểu tượng này giúp tăng tốc độ của người đeo khi họ không ở gần kẻ thù.
items.armor.glyphs.swiftness.name=%s của tốc độ
items.armor.glyphs.thorns.desc=Biểu tượng mạnh mẽ này gây hại cho kẻ tấn công, khiến chúng chảy máu từ từ khi tấn công người đeo nó.
items.armor.glyphs.thorns.name=%s gai
items.armor.glyphs.viscosity$defereddamage.desc=Sát thương đang được gây ra từ từ theo thời gian thay vì ngay lập tức.\n\nSát thương còn lại chưa được xử lý: %d.
items.armor.glyphs.viscosity$defereddamage.name=thiệt hại trì hoãn
items.armor.glyphs.viscosity$defereddamage.ondeath=Sự tổn thương trì hoãn đã giết chết bạn...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Chết vì thiệt hại trì hoãn
items.armor.glyphs.viscosity.deferred=%d bị trì hoãn
items.armor.glyphs.viscosity.desc=Biểu tượng này có khả năng tích trữ sát thương gây ra cho người đeo, truyền sát thương đó từ từ thay vì dồn hết cùng một lúc.
items.armor.glyphs.viscosity.name=%s độ nhớt
items.armor.huntressarmor.desc=Khi khoác lên mình chiếc áo choàng này, Nữ Thợ Săn có thể thực hiện một khả năng đặc biệt.
items.armor.huntressarmor.name=áo choàng anh hùng
items.armor.huntressarmor.no_enemies=Không thấy kẻ thù nào.
items.armor.leatherarmor.desc=Giáp được làm từ da quái vật đã thuộc. Không nhẹ như giáp vải nhưng lại bảo vệ tốt hơn.
items.armor.leatherarmor.name=áo giáp da
items.armor.magearmor.desc=Khi khoác lên mình chiếc áo choàng lộng lẫy này, pháp sư có thể thực hiện một khả năng đặc biệt.
items.armor.magearmor.name=áo choàng anh hùng
items.armor.mailarmor.desc=Các mắt xích kim loại đan xen vào nhau tạo nên một bộ giáp chắc chắn nhưng vẫn linh hoạt.
items.armor.mailarmor.name=áo giáp lưới
items.armor.platearmor.desc=Những tấm kim loại khổng lồ được ghép lại với nhau tạo thành một bộ giáp mang lại khả năng bảo vệ vô song cho bất kỳ nhà thám hiểm nào đủ mạnh để chịu được sức nặng khủng khiếp của nó.
items.armor.platearmor.name=áo giáp tấm
items.armor.roguearmor.desc=Khi khoác lên mình bộ trang phục tối màu này, tên trộm có thể thực hiện một khả năng đặc biệt.
items.armor.roguearmor.name=trang phục anh hùng
items.armor.scalearmor.desc=Những vảy kim loại được khâu lên áo giáp da tạo nên một lớp giáp vừa linh hoạt vừa có khả năng bảo vệ tốt.
items.armor.scalearmor.name=áo giáp vảy
items.armor.warriorarmor.desc=Khi khoác lên mình bộ giáp nặng nề này, Chiến binh có thể thực hiện một khả năng đặc biệt.
items.armor.warriorarmor.name=áo giáp của anh hùng
items.artifacts.alchemiststoolkit.ac_brew=BIA
items.artifacts.alchemiststoolkit.ac_energize=TĂNG CƯỜNG NĂNG LƯỢNG
items.artifacts.alchemiststoolkit.cursed=Bộ dụng cụ bị nguyền rủa của bạn ngăn cản bạn sử dụng thuật giả kim!
items.artifacts.alchemiststoolkit.desc=Bộ dụng cụ này chứa một số chất phản ứng và thảo dược cùng với một lọ nhỏ để pha chế, cho phép thực hiện thuật giả kim mọi lúc mọi nơi. Lọ chứa thứ trông giống như các tinh thể năng lượng giả kim ở dạng lỏng.
items.artifacts.alchemiststoolkit.desc_cursed=Bộ dụng cụ bị nguyền rủa đã tự ràng buộc với bạn và không cho phép bạn sử dụng thuật giả kim.
items.artifacts.alchemiststoolkit.desc_hint=Bộ công cụ được trang bị đang dần tạo ra năng lượng giả kim thuật khi bạn tích lũy kinh nghiệm. Có vẻ như hỗn hợp trong lọ có thể được tăng cường bằng cách thêm các tinh thể năng lượng vào đó.
items.artifacts.alchemiststoolkit.desc_warming=Bộ công cụ hiện đang trong giai đoạn khởi động và sẽ sẵn sàng sử dụng sau một thời gian ngắn nữa.
items.artifacts.alchemiststoolkit.energize_1=6 năng lượng: +1 cấp độ
items.artifacts.alchemiststoolkit.energize_all=Năng lượng %1$d: +Mức độ %2$d
items.artifacts.alchemiststoolkit.energize_desc=Cứ mỗi 6 tinh thể năng lượng sẽ cung cấp đủ năng lượng cho bộ công cụ để tăng một cấp độ, giúp tăng tốc độ tạo năng lượng của bộ công cụ theo thời gian và tốc độ làm nóng nhanh hơn.\n\nBạn muốn sử dụng bao nhiêu năng lượng?
items.artifacts.alchemiststoolkit.name=bộ dụng cụ của nhà giả kim
items.artifacts.alchemiststoolkit.need_energy=Bạn cần ít nhất 6 điểm năng lượng cho việc đó.
items.artifacts.alchemiststoolkit.not_ready=Bộ công cụ của bạn vẫn chưa khởi động xong.
items.artifacts.artifact.cannot_wear_two=Bạn không thể đeo hai vật phẩm giống hệt nhau.
items.artifacts.artifact.curse_known=Bạn có thể cảm nhận được một thứ ma thuật độc ác ẩn chứa bên trong cổ vật.
items.artifacts.artifact.equip_cursed=Vật thể ấy bám chặt lấy bạn một cách đau đớn.
items.artifacts.artifact.need_to_equip=Bạn cần trang bị vật phẩm của mình để làm điều đó.
items.artifacts.artifact.not_cursed=Vật phẩm này không bị ảnh hưởng bởi ma thuật độc ác.
items.artifacts.capeofthorns$thorns.desc=Áo choàng của bạn đang tỏa ra năng lượng, bao quanh bạn trong một trường lực phản xạ!\n\nTất cả sát thương bạn nhận được đều bị giảm khi hiệu ứng gai nhọn đang hoạt động. Thêm vào đó, nếu kẻ tấn công ở ngay bên cạnh bạn, lượng sát thương giảm đó sẽ được phản xạ ngược lại kẻ tấn công.\n\nSố lượt gai nhọn còn lại: %s.
items.artifacts.capeofthorns$thorns.inert=Áo choàng của bạn lại trở nên vô hiệu.
items.artifacts.capeofthorns$thorns.levelup=Áo choàng của bạn ngày càng mạnh mẽ hơn!
items.artifacts.capeofthorns$thorns.name=gai
items.artifacts.capeofthorns$thorns.radiating=Chiếc áo choàng của bạn bắt đầu tỏa ra năng lượng, bạn cảm thấy được bảo vệ!
items.artifacts.capeofthorns.desc=Những mảnh kim loại bị sụp đổ từ DM-300 đã kết dính lại với nhau thành một chiếc áo choàng cứng cáp. Có vẻ như nó tích trữ một nguồn năng lượng sâu sắc, có lẽ nó chứa một phần sức mạnh của DM-300?
items.artifacts.capeofthorns.desc_active=Chiếc áo choàng dường như đang giải phóng năng lượng tích trữ, nó tỏa ra một sức mạnh bảo vệ.
items.artifacts.capeofthorns.desc_inactive=Chiếc áo choàng nặng trĩu trên vai bạn, tạo cảm giác an tâm, dường như nó đang tích lũy năng lượng từ những tổn thương bạn phải chịu đựng.
items.artifacts.capeofthorns.name=áo choàng gai
items.artifacts.chaliceofblood.ac_prick=ĐÂM
items.artifacts.chaliceofblood.desc=Chiếc chén thánh bằng bạc sáng bóng này được trang trí kỳ lạ với những viên đá quý sắc nhọn ở miệng chén.
items.artifacts.chaliceofblood.desc_1=Khi cầm chiếc chén thánh, bạn cảm thấy thôi thúc kỳ lạ muốn tự đâm mình vào những viên đá quý sắc nhọn.
items.artifacts.chaliceofblood.desc_2=Một phần máu của bạn đọng lại trong chiếc chén, bạn có thể cảm nhận một cách tinh tế rằng chiếc chén đang truyền năng lượng sống vào bạn, thúc đẩy quá trình tái tạo sức khỏe tự nhiên. Bạn vẫn muốn tự cứa mình vào chiếc chén, mặc dù biết rằng điều đó sẽ đau.
items.artifacts.chaliceofblood.desc_3=Chiếc chén đã đầy ắp tinh hoa sự sống của bạn. Bạn có thể cảm nhận được chiếc chén đang truyền năng lượng sống trở lại vào mình.
items.artifacts.chaliceofblood.desc_cursed=Chiếc chén bị nguyền rủa đã trói chặt vào tay bạn và đang cản trở khả năng hồi phục sức khỏe của bạn.
items.artifacts.chaliceofblood.name=chén máu
items.artifacts.chaliceofblood.no=Không, tôi đã thay đổi ý định.
items.artifacts.chaliceofblood.ondeath=Chiếc chén hút cạn sinh lực của bạn...
items.artifacts.chaliceofblood.onprick=Bạn tự chích vào người, và sinh lực của bạn chảy vào chiếc chén.
items.artifacts.chaliceofblood.prick_warn=Mỗi lần bạn sử dụng chiếc chén thánh, nó sẽ hút cạn sinh lực của bạn, nhưng bù lại sẽ tăng cường khả năng phục hồi sức khỏe tự nhiên của bạn. Hiện tại, việc tự chích vào mình sẽ gây ra _%1$d-%2$d sát thương_, mặc dù sát thương này có thể được giảm bớt bởi _cả khả năng chặn hoặc giảm sát thương vật lý và phép thuật_. Nếu không tính đến hiệu ứng giảm sát thương, việc tự chích vào mình hiện có _%3$s%% cơ hội_ làm cạn kiệt hoàn toàn sinh lực của bạn. Bạn có chắc chắn muốn dâng hiến thêm sinh lực cho chiếc chén thánh không?
items.artifacts.chaliceofblood.yes=Vâng, tôi biết mình đang làm gì.
items.artifacts.cloakofshadows$cloakstealth.desc=Áo choàng bóng tối của bạn ban cho bạn khả năng tàng hình khi bạn được bao phủ bởi nó. Bạn sẽ duy trì trạng thái tàng hình cho đến khi nó bị hủy bỏ hoặc áo choàng của bạn hết năng lượng.\n\nTrong khi bạn tàng hình, kẻ thù không thể tấn công hoặc đuổi theo bạn. Các đòn tấn công vật lý và hiệu ứng ma thuật (như cuộn giấy và đũa phép) sẽ ngay lập tức hủy bỏ khả năng tàng hình.\n\nLượt cho đến khi sử dụng năng lượng: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Áo choàng của bạn ngày càng mạnh mẽ hơn!
items.artifacts.cloakofshadows$cloakstealth.name=che giấu
items.artifacts.cloakofshadows$cloakstealth.no_charge=Áo choàng của bạn đã hết năng lượng.
items.artifacts.cloakofshadows.ac_stealth=TÀNG HÌNH
items.artifacts.cloakofshadows.cooldown=Áo choàng của bạn cần thêm %d lượt nữa để nạp lại năng lượng.
items.artifacts.cloakofshadows.cursed=Bạn không thể sử dụng áo choàng bị nguyền rủa.
items.artifacts.cloakofshadows.desc=Một chiếc áo choàng ma thuật vô giá, bị tên trộm đánh cắp khỏi kho vũ khí hoàng gia nhiều năm trước. Khi mặc vào, nó có thể giúp tên trộm hoàn toàn tàng hình trong một thời gian ngắn. Càng sử dụng nhiều, chiếc áo choàng càng trở nên mạnh mẽ hơn, cho phép tên trộm tàng hình thường xuyên hơn và trong thời gian dài hơn.
items.artifacts.cloakofshadows.discover_hint=Một trong những anh hùng bắt đầu với vật phẩm này.
items.artifacts.cloakofshadows.name=áo choàng bóng tối
items.artifacts.cloakofshadows.no_charge=Áo choàng của bạn chưa được sạc đủ để sử dụng.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Làm sao mà bạn sống sót qua chuyện đó?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Tôi ước mình có một cái như thế...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ôi trời! Anh vẫn còn sống!
items.artifacts.driedrose$ghosthero.def_verb=né tránh
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Tôi xin lỗi... chúc bạn may mắn...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Kết thúc chuyện này đi... mà không có tôi...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Không... Tôi không thể...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Chúc may mắn...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Mệt rồi... hiện tại...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Tôi sẽ quay lại...
items.artifacts.driedrose$ghosthero.desc=Một hình dáng yếu ớt, mờ ảo với hình dạng giống người. Sức mạnh của chúng dường như gắn liền với bông hồng bạn đang sở hữu.\n\nCon ma này có thể không mạnh lắm, nhưng dường như chúng là người bạn chân thành duy nhất của bạn ở đây.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Sao lại xảy ra chuyện này, tôi tưởng chúng ta đã thành công rồi chứ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Làm sao mà thứ đó vẫn có thể gây ảnh hưởng đến thế giới này được?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Tôi hy vọng bạn biết mình đang làm gì với chiếc bùa hộ mệnh đó.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Tôi cho rằng chúng ta vẫn chưa xong việc.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Chúng ta đã đi được một chặng đường dài rồi, chúng ta có thể hoàn thành việc này!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Chỉ một chút nữa thôi, chúng ta sẽ thoát khỏi đây!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Đã rất lâu rồi không có người hay người lùn nào ở đây cả.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Điều gì có thể khiến người lùn bỏ hoang mỏ vàng?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Thật đáng tiếc là tất cả số vàng ở đây đều vô dụng trên bề mặt.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Những sinh vật ở đây đều gớm ghiếc, giống hệt như trong cống rãnh.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Ngay cả loài dơi ở đây cũng khát máu.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Không thấy dấu hiệu của bất kỳ thiết bị khai thác nào, liệu người lùn đã thu hồi lại tất cả rồi sao?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Người lùn rất cần cù, nhưng tham lam.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Vậy là đô thị của người lùn thực sự đã sụp đổ.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Tôi hy vọng bề mặt Trái đất sẽ không bao giờ trở nên giống như nơi này.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Người lùn vốn không được cho là có làn da nhợt nhạt như vậy.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Tôi không biết cái nào tệ hơn, người lùn hay những sinh vật do họ tạo ra.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Dường như giờ đây cả người lùn cũng trở thành những con quái vật vô tri vô giác.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Đây là nơi nào vậy?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Nơi này thật đáng sợ...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Không hiểu sao lũ người lùn lại dám đùa giỡn với quyền lực như thế?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Những con quái vật ở đây trông thật kỳ dị, chúng đến từ đâu vậy?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Bạn có cảm nhận được không? Cảm giác như có thứ gì đó đang theo dõi chúng ta vậy.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=May mà có đèn pin, ở đây tối quá!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Tôi đã nghe nhiều chuyện về nơi này, chẳng có gì tốt đẹp cả.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Nơi này lúc nào cũng giống ngục tối hơn là nhà tù.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Tôi không thể tưởng tượng được chuyện gì đã xảy ra khi nơi này bị bỏ hoang.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Dường như cả tù nhân và lính canh đều đã biến thành quái vật.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Nguyên nhân nào dẫn đến việc có quá nhiều bộ xương như vậy?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Những người này không nhất thiết phải có kết cục như vậy...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Trước đây, những cống rãnh này rất an toàn, thậm chí người dân còn sống ở đây vào mùa đông.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Tôi tự hỏi chuyện gì đã xảy ra với các đội tuần tra bảo vệ, họ đã bỏ cuộc sao?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Tôi có người thân ở trên mặt đất, hy vọng họ vẫn an toàn.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Các vệ binh không thể đánh bại những con quái vật này, nhưng có lẽ chúng ta có thể.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Nếu ngay cả hệ thống cống rãnh cũng nguy hiểm như vậy, không biết bên dưới còn có gì nữa...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Điều gì có thể đã khiến những con chuột và cua này phát triển lớn đến vậy?
items.artifacts.driedrose$ghosthero.direct_prompt=Tôi nên làm gì?
items.artifacts.driedrose$ghosthero.directed_attack_1=Được rồi, tôi sẽ giải quyết vấn đề đó.
items.artifacts.driedrose$ghosthero.directed_attack_2=Tôi sẽ lấy cái đó.
items.artifacts.driedrose$ghosthero.directed_attack_3=Hấp dẫn...
items.artifacts.driedrose$ghosthero.directed_attack_4=Bắt lấy chúng nào!
items.artifacts.driedrose$ghosthero.directed_attack_5=Tôi có cái đó rồi.
items.artifacts.driedrose$ghosthero.directed_follow_1=Được rồi, tôi sẽ đi theo bạn.
items.artifacts.driedrose$ghosthero.directed_follow_2=Tôi sẽ đi theo sau bạn.
items.artifacts.driedrose$ghosthero.directed_follow_3=Tôi đang theo dõi bạn...
items.artifacts.driedrose$ghosthero.directed_follow_4=Được rồi, đi thôi!
items.artifacts.driedrose$ghosthero.directed_follow_5=Tôi sẽ luôn ủng hộ bạn.
items.artifacts.driedrose$ghosthero.directed_position_1=Được rồi, tôi sẽ giữ nguyên lập trường đó.
items.artifacts.driedrose$ghosthero.directed_position_2=Tôi sẽ đến đó và bảo vệ.
items.artifacts.driedrose$ghosthero.directed_position_3=Tái định vị...
items.artifacts.driedrose$ghosthero.directed_position_4=Tôi đang trên đường đến đây!
items.artifacts.driedrose$ghosthero.directed_position_5=Tôi sẽ đi đến đó.
