items.weapon.melee.handaxe.typical_ability_desc=Đấu sĩ có thể thực hiện một đòn đánh mạnh bằng rìu cầm tay. Đòn tấn công tập trung này thường gây ra sát thương _%1$d-%2$d nếu bất ngờ tấn công kẻ địch, và làm choáng chúng trong 5 lượt, giảm độ chính xác và khả năng né tránh đi 50%%. Đòn đánh mạnh luôn trúng đích nhưng gây sát thương bình thường nếu không bất ngờ tấn công kẻ địch.
items.weapon.melee.katana.ability_desc=Đấu sĩ có thể lao tới bằng thanh katana vào kẻ địch cách đó 1 ô. Hành động này di chuyển về phía kẻ địch, gây ra sát thương _%1$d-%2$d_ và chắc chắn trúng đích.
items.weapon.melee.katana.ability_name=lao tới
