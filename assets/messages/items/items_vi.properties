items.food.pasty$fishleftover.desc=Một ít cá còn thừa từ bữa ăn trước. Bạn có thể ăn bất cứ lúc nào để giảm bớt cơn đói.
items.food.pasty$fishleftover.eat_msg=Món ăn đó cũng tạm được.
items.food.pasty$fishleftover.name=cá thừa
items.food.pasty.amulet_desc=Cuối cùng bạn cũng tìm thấy nó rồi, chiếc bùa hộ mệnh kỳ diệu của - khoan đã, đây chỉ là một viên sô cô la bọc giấy bạc được làm cho giống như bùa hộ mệnh thôi! Nó sẽ không ban cho bạn sức mạnh vô hạn, nhưng ít nhất nó sẽ giúp bạn no bụng và cung cấp cho bạn một chút năng lượng cho vật phẩm.\n\nCá tháng Tư!
items.food.pasty.amulet_name=Bùa hộ mệnh của Yendor?
items.food.pasty.cane_desc=Một cây kẹo que khổng lồ ngọt ngào. Nó đủ lớn để làm bạn no căng bụng, và lượng đường trong đó thậm chí có thể cung cấp thêm một chút năng lượng cho cây đũa phép của bạn nữa. Chúc kỳ nghỉ lễ vui vẻ!
items.food.pasty.cane_name=kẹo que
items.food.pasty.desc=Một chiếc bánh Cornish pasty chính hiệu với nhân thịt bò và khoai tây truyền thống. Ngon tuyệt!
items.food.pasty.egg_desc=Một quả trứng sô cô la to đùng, được bọc trong giấy bạc màu vàng rực rỡ. Lượng sô cô la ở đây đủ để bạn no căng bụng, và đường có thể sẽ tiếp thêm một chút năng lượng cho những món đồ chơi của bạn. Chúc mừng Lễ Phục Sinh!
items.food.pasty.egg_name=trứng phục sinh
items.food.pasty.fish_desc=Một con cá hấp nguyên con, được bảo quản một cách kỳ diệu trên một lớp rau xanh. Theo truyền thống, người ta thường để dành một ít cá để ăn sau vào thời điểm này trong năm, vì vậy bạn sẽ có phần thừa thay vì ăn hết cùng một lúc. Chúc mừng năm mới âm lịch!
items.food.pasty.fish_name=cá hấp
items.food.pasty.name=bánh ngọt
items.food.pasty.pie_desc=Một miếng bánh bí ngô thật to. Hương vị ngọt ngào và cay nồng của nó sẽ làm bạn no bụng và mang lại cho bạn một chút cảm giác dễ chịu. Chúc mừng Halloween!
items.food.pasty.pie_name=bánh bí ngô
items.food.pasty.rainbow_desc=Loại thức uống nhiều màu sắc này là một dạng thực phẩm dạng lỏng. Ngoài việc giúp bạn no bụng, nó còn chứa một chút phép thuật giúp làm dịu kẻ thù không phải trùm ở gần đó, khiến chúng tạm thời do dự không muốn chiến đấu với bạn.\n\nChúc mừng ngày Tự hào!
items.food.pasty.rainbow_name=thuốc cầu vồng
items.food.pasty.sparkling_desc=Thức uống có ga này là một loại thực phẩm dạng lỏng. Nó giúp no bụng và mô phỏng rượu vang sủi bọt, nhưng thực chất không chứa cồn. Cảm giác ấm áp trong bụng sẽ mang lại một chút an ủi. Chúc mừng năm mới!
items.food.pasty.sparkling_name=thuốc lấp lánh
items.food.pasty.vanilla_desc=Miếng bánh vani lớn này được trang trí bằng những hạt rắc màu sắc và lớp kem phủ màu xanh dương. Chiếc bánh được làm để kỷ niệm nhiều năm kinh nghiệm, và sẽ mang lại cho bạn một phần nhỏ kinh nghiệm đó khi bạn ăn nó.\n\nPixel Dungeon phiên bản gốc được phát hành lần đầu vào ngày 4 tháng 12 năm 2012. Chúc mừng sinh nhật Pixel Dungeon!
items.food.pasty.vanilla_name=bánh màu xanh
items.food.phantommeat.desc=Một miếng bít tết lớn, bóng bẩy, trong suốt, được cắt từ cá piranha ma. Loại thịt kỳ diệu này không cần nấu chín và mang lại một số lợi ích phòng thủ ngoài việc giúp bạn no bụng. Khi ăn nó sẽ ban cho bạn khả năng tàng hình, lớp da bảo vệ, một số khả năng hồi phục và chữa khỏi nhiều tác hại.
items.food.phantommeat.discover_hint=Bạn có thể nhận được vật phẩm này khi tiêu diệt một số kẻ thù nhất định.
items.food.phantommeat.name=thịt ma
items.food.smallration.desc=Nó trông giống hệt một khẩu phần ăn tiêu chuẩn nhưng nhỏ hơn.
items.food.smallration.discover_hint=Bạn có thể mua sản phẩm này tại cửa hàng.
items.food.smallration.eat_msg=Món ăn đó cũng tạm được.
items.food.smallration.name=khẩu phần ăn nhỏ
items.food.stewedmeat.desc=Việc hầm thịt đã giúp loại bỏ mọi mầm bệnh hoặc ký sinh trùng. Vì vậy, thịt có thể ăn được một cách an toàn.
items.food.stewedmeat.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.food.stewedmeat.eat_msg=Món ăn đó cũng tạm được.
items.food.stewedmeat.name=thịt hầm
items.food.supplyration.desc=Khẩu phần ăn này được để lại trong ngục tối bởi và dành cho các thành viên của hội trộm. Nó được thiết kế đặc biệt để ăn khi đang di chuyển và hỗ trợ các hoạt động phi pháp nói chung. Mặc dù nó không làm bạn no như một khẩu phần ăn thông thường, nhưng nó có thể được ăn nhanh chóng, cung cấp một chút khả năng hồi phục trực tiếp và sẽ khôi phục một lần sử dụng cho áo choàng bóng tối của tên trộm.
items.food.supplyration.discover_hint=Bạn có thể tìm thấy vật phẩm này bằng cách sử dụng một kỹ năng đặc biệt của anh hùng.
items.food.supplyration.name=khẩu phần cung cấp
items.gold.desc=Một đống tiền vàng. Hãy thu thập tiền vàng để dùng chúng sau này trong cửa hàng.
items.gold.name=vàng
items.heap.artifact=một hiện vật
items.heap.chest=Ngực
items.heap.chest_desc=Bạn sẽ không biết bên trong có gì cho đến khi mở nó ra!
items.heap.crystal_chest=rương pha lê
items.heap.crystal_chest_desc=Bạn có thể thấy _%s_ bên trong, nhưng để mở rương bạn cần một chìa khóa pha lê.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Rương bị khóa
items.heap.locked_chest_desc=Bạn sẽ không biết bên trong có gì cho đến khi mở nó ra! Nhưng để mở được nó, bạn cần một chiếc chìa khóa vàng.
items.heap.remains=Di hài người anh hùng
items.heap.remains_desc=Đây là tất cả những gì còn sót lại từ một trong những người tiền nhiệm của bạn. Có lẽ nên kiểm tra xem có đồ vật quý giá nào không.
items.heap.ring=một chiếc nhẫn
items.heap.skeleton=Di hài bộ xương
items.heap.skeleton_desc=Đây là tất cả những gì còn sót lại của một nhà thám hiểm xấu số. Có lẽ nên kiểm tra xem có đồ vật giá trị nào không.
items.heap.tomb=Lăng mộ
items.heap.tomb_desc=Ngôi mộ cổ này có thể chứa thứ gì đó hữu ích, nhưng chủ nhân của nó chắc chắn sẽ phản đối việc kiểm tra.
items.heap.wand=một cây đũa phép
items.honeypot$shatteredpot.desc=Chiếc bình đã vỡ tan, chỉ còn lớp mật ong dính bám trên thành bình giữ cho nó không bị vỡ vụn, và nó đang từ từ tan ra. Mặc dù trong tình trạng vỡ nát, con ong dường như vẫn muốn bảo vệ chiếc bình.
items.honeypot$shatteredpot.name=hũ mật ong vỡ nát
items.honeypot.ac_shatter=VỠ VỠ
items.honeypot.desc=Chiếc hũ mật ong khổng lồ này thực chất chỉ được lót bằng mật ong, mà bên trong lại là một con ong khổng lồ! Những con ong to lớn như thế này thường ở trong tổ của chúng, có lẽ chiếc hũ này là một loại lồng bẫy chuyên dụng nào đó? Con ong có vẻ khá hài lòng khi ở trong hũ với mật ong của mình, và vo ve cảnh giác khi bạn nhìn vào nó.
items.honeypot.name=hũ mật ong
items.item.ac_drop=LÀM RƠI
items.item.ac_throw=NÉM
items.item.curse=lời nguyền
items.item.custom_note=Sản phẩm này có ghi chú tùy chỉnh: "_%s_"
items.item.custom_note_type=Loại mặt hàng này có ghi chú tùy chỉnh: "_%s_"
items.item.discover_hint=Bạn có thể tìm thấy vật phẩm này một cách ngẫu nhiên trong hầm ngục.
items.item.prompt=Chọn hướng ném
items.item.rankings_desc=Bị tiêu diệt bởi: %s
items.journal.alchemypage.desc=Một trang bị xé từ sách hướng dẫn về thuật giả kim.\n\nHầu hết chữ quá nhỏ để đọc từ xa, nhưng bạn có thể nhận ra tiêu đề của trang:\n\n_"%s"_
items.journal.alchemypage.name=trang sách giả kim thuật bị rách
items.journal.documentpage.desc=Một trang giấy lẻ, có lẽ bị xé ra từ một cuốn sách nào đó. Bạn cần phải nhặt nó lên để đọc.
items.journal.documentpage.name=trang bị rách
items.journal.guidebook.desc=Một cuốn cẩm nang phiêu lưu, được để lại ở đây bởi một người đã quyết định rằng phiêu lưu không dành cho họ! Cuốn sách đặc biệt này có phép thuật, và có thể nhắc nhở các nhà phiêu lưu đọc một trang đúng lúc. Bất chấp chức năng đó, cuốn sách được yêu thích nhất vì dòng chữ lớn "Đừng Hoảng Loạn!" được viết bằng chữ to thân thiện trên bìa.
items.journal.guidebook.hint_desktop=Sách hướng dẫn của bạn có những lời khuyên hữu ích! Chọn nút nhật ký nhấp nháy (%s) ở góc trên bên phải để đọc.
items.journal.guidebook.hint_mobile=Sách hướng dẫn của bạn có những lời khuyên hữu ích! Hãy nhấn vào nút nhật ký nhấp nháy ở góc trên bên phải để đọc.
items.journal.guidebook.hint_status=Sách hướng dẫn
items.journal.guidebook.name=cuốn sách về nghệ thuật chinh phục ngục tối
items.journal.guidepage.desc=Một trang bị xé từ sách hướng dẫn phiêu lưu.\n\nHầu hết chữ quá nhỏ để đọc từ xa, nhưng bạn có thể nhận ra tiêu đề của trang:\n\n_"%s"_
items.journal.guidepage.name=trang sách hướng dẫn bị rách
items.journal.regionlorepage$caves.desc=Có vẻ như đây là một đoạn ghi chép trong nhật ký thám hiểm, được bảo quản tốt đến đáng ngạc nhiên dù đã rất cũ. Hãy cầm lên và đọc nhé.
items.journal.regionlorepage$caves.name=mục nhật ký cũ
items.journal.regionlorepage$city.desc=Một tấm bảng kim loại nhỏ bị gỉ sét với một thông điệp được khắc một cách kỳ diệu. Các chữ cái vẫn rõ ràng dù tấm bảng đã rất cũ, nhưng bạn phải cầm nó lên mới đọc được.
items.journal.regionlorepage$city.name=viên thuốc bị rỉ sét
items.journal.regionlorepage$halls.desc=Một chiếc máy tính bảng nhỏ màu đen với những chữ cái màu xanh lá cây phát sáng được khắc trên đó. Những chữ cái phát sáng này mờ ảo khi nhìn từ xa, bạn sẽ phải cầm nó lên để đọc.
items.journal.regionlorepage$halls.name=máy tính bảng phát sáng
items.journal.regionlorepage$prison.desc=Một mẩu nhật ký, hoặc một loại ghi chép nào đó, được viết trên một mảnh giấy cũ. Có vẻ như nó còn nguyên vẹn hơn những lá thư bạn tìm thấy trong cống rãnh, nhưng bạn vẫn cần nhặt nó lên để đọc.
items.journal.regionlorepage$prison.name=nhật ký cũ
items.journal.regionlorepage$sewers.desc=Có vẻ như đó là một lá thư, được viết trên một mảnh giấy dính đầy bụi bẩn. Bạn cần phải nhặt nó lên để có thể đọc được nội dung bên trong.
items.journal.regionlorepage$sewers.name=chữ viết cũ
items.keys.crystalkey.desc=Những mặt cắt của chiếc chìa khóa pha lê này lấp lánh trong bóng tối. Có lẽ nó sẽ mở được thứ gì đó làm bằng pha lê chăng?
items.keys.crystalkey.name=Chìa khóa pha lê
items.keys.goldenkey.desc=Các vết khía trên chiếc chìa khóa vàng này rất nhỏ và tinh xảo. Có lẽ nó sẽ mở được một chiếc rương bị khóa?
items.keys.goldenkey.name=chìa khóa vàng
items.keys.ironkey.desc=Những vết khía trên chiếc chìa khóa sắt cổ này đã mòn vẹt; dây đeo bằng da của nó cũng sờn rách vì thời gian. Nó có thể mở cánh cửa nào?
items.keys.ironkey.name=chìa khóa sắt
items.keys.skeletonkey.name=chìa khóa vạn năng
items.keys.wornkey.desc=Chiếc chìa khóa này đã cũ và bạc màu, nhưng trông vẫn rất chắc chắn. Có lẽ nó có thể mở được một cánh cửa quan trọng nào đó gần đây.
items.keys.wornkey.name=chìa khóa cũ
items.kindofmisc.unequip_message=Trước tiên, bạn phải tháo một trong những vật phẩm này. Chọn một vật phẩm để thay thế.
items.kindofmisc.unequip_title=Tháo bỏ một vật phẩm
items.kindofweapon.empty=trống
items.kindofweapon.equip_cursed=Bạn vô thức siết chặt khẩu súng trong tay.
items.kindofweapon.swift_equip=Bạn nhanh chóng trang bị vũ khí.
items.kindofweapon.which_equip_msg=Bạn muốn trang bị vật phẩm này vào ô vũ khí nào?\n\nNhà vô địch tấn công trực tiếp bằng vũ khí chính, nhưng có thể sử dụng khả năng của cả hai vũ khí. Cả hai vũ khí đều có cùng số lần sử dụng.\n\nNhà vô địch cũng có thể đổi vũ khí chính và phụ ngay lập tức.
items.kindofweapon.which_equip_primary=Chính (%s)
items.kindofweapon.which_equip_secondary=Thứ cấp (%s)
items.kingscrown.ac_wear=MẶC
items.kingscrown.desc=Chiếc vương miện của vị vua người lùn cuối cùng, nó tỏa sáng với nguồn năng lượng ma thuật mạnh mẽ. Khi đội lên, ma thuật của vương miện sẽ truyền vào bộ giáp bạn đang mặc, biến nó thành một bộ giáp sử thi độc đáo với những khả năng đặc biệt. Bộ giáp mới sẽ giữ nguyên tất cả các đặc tính của bộ giáp ban đầu.
items.kingscrown.discover_hint=Bạn có thể nhận được vật phẩm này khi tiêu diệt một số kẻ thù nhất định.
items.kingscrown.naked=Thật không may, vương miện không thể biến đổi đồ lót của bạn.
items.kingscrown.name=Vương miện của Vua người lùn
items.kingscrown.ratgraded=Bàn chân của Chuột Vương phát sáng rực rỡ khi bộ giáp của bạn biến hình!
items.kingscrown.upgraded=Chiếc vương miện phát sáng rực rỡ rồi tan biến khi bộ giáp của bạn biến đổi!
items.liquidmetal.ac_apply=ÁP DỤNG
items.liquidmetal.already_fixed=Khẩu súng ném đó vẫn còn trong tình trạng hoàn hảo!
items.liquidmetal.apply=Bạn sử dụng kim loại lỏng %d để sửa chữa vũ khí ném của mình.
items.liquidmetal.desc=Loại chất lỏng kỳ diệu này có thể lấp đầy các vết nứt và rách trên vũ khí đã ném, khôi phục nó về trạng thái hoàn hảo! Nếu một bộ vũ khí bị thiếu một vũ khí nhưng các bộ phận khác đã được sửa chữa hoàn toàn, thì kim loại lỏng thậm chí có thể được sử dụng để thay thế vũ khí bị thiếu trong bộ đó! Một vũ khí cấp 1 cần 10 kim loại lỏng để được sửa chữa hoàn toàn, vũ khí cấp 5 cần 30. Mỗi lần nâng cấp cũng làm tăng lượng kim loại cần thiết lên 35%. Không thể sử dụng kim loại lỏng để sửa chữa đầu mũi của phi tiêu có đầu nhọn.
items.liquidmetal.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.liquidmetal.name=kim loại lỏng
items.liquidmetal.prompt=Chọn một vũ khí ném.
items.lostbackpack.desc=Đây là kho đồ bị mất của bạn. Hãy thu thập lại để lấy lại tất cả các vật phẩm bạn đã mất!
items.lostbackpack.name=ba lô bị mất
items.merchantsbeacon.ac_use=SỬ DỤNG
items.merchantsbeacon.desc=Thiết bị công nghệ kỳ lạ của người lùn này cho phép bạn liên lạc từ khoảng cách rất xa. Sau khi được kích hoạt, thiết bị phát tín hiệu này sẽ cho phép bạn bán vật phẩm cho Pixel Mart từ bất cứ đâu trong hầm ngục. Tuy nhiên, phép thuật bên trong thiết bị phát tín hiệu chỉ có hiệu lực trong một phiên chơi, vì vậy hãy sử dụng nó một cách khôn ngoan.
items.merchantsbeacon.name=ngọn hải đăng của thương gia
items.potions.brews.aquabrew.desc=Khi bị vỡ, loại đồ uống này sẽ giải phóng một luồng nước áp suất cao tại vị trí của nó. Lực phun chỉ đủ mạnh để gây sát thương cho kẻ thù đang bốc lửa, nhưng nó cũng lan nước ra khu vực xung quanh, vô hiệu hóa bẫy, dập tắt lửa và đẩy lùi các nhân vật ở gần vùng phun.
items.potions.brews.aquabrew.name=bia nước
items.potions.brews.blizzardbrew.desc=Khi bị vỡ, loại đồ uống này sẽ giải phóng một cơn bão xoáy dữ dội, nhanh chóng lan rộng như khí.
items.potions.brews.blizzardbrew.name=bia bão tuyết
items.potions.brews.brew.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.potions.brews.causticbrew.desc=Loại hỗn hợp này sẽ tạo ra chất lỏng ăn mòn lan rộng xung quanh vị trí nó vỡ vụn. Bất cứ thứ gì dính vào chất lỏng này sẽ từ từ tan chảy nếu không thể rửa sạch bằng nước.
items.potions.brews.causticbrew.name=đồ uống ăn mòn
items.potions.brews.infernalbrew.desc=Khi bị vỡ, loại đồ uống này sẽ giải phóng một ngọn lửa dữ dội lan nhanh như khí độc.
items.potions.brews.infernalbrew.name=bia địa ngục
items.potions.brews.shockingbrew.desc=Khi bị vỡ, loại đồ uống này sẽ giải phóng một cơn bão điện trong một khu vực rộng lớn xung quanh vị trí nó bị vỡ.
items.potions.brews.shockingbrew.name=bia gây sốc
items.potions.brews.unstablebrew.desc=Loại thức uống kỳ diệu này phát sáng với những màu sắc cầu vồng biến đổi liên tục. Khi uống hoặc ném đi, nó sẽ kích hoạt hiệu ứng của một loại thuốc ngẫu nhiên. Hiệu ứng của thuốc sẽ luôn có lợi nếu uống và luôn có hại nếu ném đi.
items.potions.brews.unstablebrew.name=bia không ổn định
items.potions.elixirs.elixir.discover_hint=Bạn có thể chế tạo vật phẩm này bằng thuật giả kim.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Bạn tạm thời có được khả năng hồi phục tương tự như Goo.\n\nKhi đứng trong nước, bạn sẽ hồi phục một lượng nhỏ máu mỗi lượt. Hiệu ứng sẽ tạm dừng khi bạn đã đầy máu hoặc ra khỏi nước.\n\nKhả năng hồi phục còn lại: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=chữa bệnh dưới nước
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Loại thuốc này chứa tàn dư của Goo được tăng cường bằng một loại thuốc chữa lành. Mặc dù nó sẽ không chữa lành ngay lập tức, nhưng nó sẽ dần dần phục hồi một lượng máu đáng kể khi bạn đứng trong nước.
items.potions.elixirs.elixirofaquaticrejuvenation.name=thuốc bổ phục hồi sức sống dưới nước
items.potions.elixirs.elixirofarcanearmor.desc=Loại thần dược này sẽ ban cho người uống khả năng kháng phép thuật lâu dài.
items.potions.elixirs.elixirofarcanearmor.name=thuốc bổ giáp ma thuật
items.potions.elixirs.elixirofdragonsblood.desc=Khi uống loại thần dược này, sức mạnh rực lửa sẽ chảy khắp mạch máu người uống. Hiệu ứng này sẽ giúp người uống miễn nhiễm với lửa và cho phép họ thiêu cháy kẻ thù bằng các đòn tấn công vật lý.
items.potions.elixirs.elixirofdragonsblood.name=thuốc trường sinh huyết rồng
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Bạn đang chịu ảnh hưởng của một loại thần dược giảm sát thương, cho phép bạn rơi xuống vực sâu mà không bị thương!\n\nSố lượt còn lại: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=lông vũ rơi
items.potions.elixirs.elixiroffeatherfall.desc=Loại thần dược này mang lại hiệu ứng bay lơ lửng yếu hơn nhưng được kiểm soát tốt hơn, cho phép người uống rơi từ độ cao lớn mà không bị thương trong một thời gian ngắn.
items.potions.elixirs.elixiroffeatherfall.light=Bạn cảm thấy nhẹ như lông vũ!
items.potions.elixirs.elixiroffeatherfall.name=thuốc tiên rơi lông vũ
items.potions.elixirs.elixirofhoneyedhealing.desc=Loại thuốc này kết hợp khả năng chữa bệnh với vị ngọt của mật ong. Khi uống, nó sẽ có tác dụng tương tự như một lọ thuốc chữa bệnh và làm dịu bớt cơn đói, nhưng cũng có thể ném để chữa lành cho đồng minh. Những sinh vật có ái lực với mật ong có thể được xoa dịu nếu sử dụng vật phẩm này lên chúng.
items.potions.elixirs.elixirofhoneyedhealing.name=thuốc bổ chữa lành bằng mật ong
items.potions.elixirs.elixiroficytouch.desc=Khi uống loại thần dược này, người uống sẽ hút nhiệt từ kẻ thù mà họ tấn công. Hiệu ứng này sẽ giúp người uống miễn nhiễm với cái lạnh và cho phép họ làm lạnh kẻ thù bằng các đòn tấn công vật lý.
items.potions.elixirs.elixiroficytouch.name=thuốc tiên cảm giác băng giá
items.potions.elixirs.elixirofmight$htboost.desc=Cơ thể bạn cảm thấy khỏe mạnh và cường tráng một cách bất thường.\n\nSức khỏe tối đa của bạn được tăng cường trong một khoảng thời gian dài. Khi bạn lên cấp, hiệu ứng tăng cường sẽ giảm dần.\n\nLượng tăng cường hiện tại: %d.\nSố cấp độ còn lại: %d.
items.potions.elixirs.elixirofmight$htboost.name=tăng cường sức khỏe tối đa
items.potions.elixirs.elixirofmight.desc=Loại chất lỏng mạnh mẽ này sẽ chảy khắp các cơ bắp của bạn, tăng sức mạnh vĩnh viễn thêm một điểm và tạm thời tăng máu tối đa thêm %d điểm. Hiệu quả tăng máu sẽ tỷ lệ thuận với máu tối đa của bạn, nhưng sẽ giảm dần khi bạn lên cấp.
items.potions.elixirs.elixirofmight.msg=Sức mạnh mới tràn ngập cơ thể bạn, giờ đây bạn sở hữu sức mạnh %d!
items.potions.elixirs.elixirofmight.name=thuốc trường sinh
items.potions.elixirs.elixiroftoxicessence.desc=Khi uống loại thần dược này, người uống sẽ được truyền năng lượng độc hại. Người uống sẽ liên tục phát tán khí độc khi di chuyển và sẽ miễn nhiễm với khí độc và chất độc trong thời gian ngắn hơn một chút so với thời gian tác dụng của nó.
items.potions.elixirs.elixiroftoxicessence.name=tinh chất độc
