daily.brief_0=Råttkungens förstärkningar är på väg. Besegra honom innan de når hovet. En fången fångvaktare kan hjälpa dig, och det bevakade förrådet innehåller förnödenheter.
daily.brief_1=Upploppet döljer Tengus flykt. Besegra de två flyktledarna för att öppna gömstället och slå sedan Tengu innan tiden går ut. Frige fångar som kan hjälpa dig eller leta i den låsta rustkammaren. Gömstället stängs bakom dig.
daily.brief_2=Tre gruvarbetare är instängda och den sista hissen går snart. Öppna deras skyddsrum, för alla tre levande tillbaka och ta hissen ut. DM-300 patrullerar tunnlarna. Slåss eller hitta en väg förbi. Förnödenheter och låsta genvägar kan hjälpa.
daily.brief_3=En Isklo, en Frostryggsgnoll och ett Rimhorn strövar i grottorna. Fäll alla tre och nå utgången innan stormen stänger vägen. Du väljer ordningen. Sidogångarna har förnödenheter, men det tar tid att leta.
daily.brief_4=Tre altaren kallar in demoner. Försegla dem innan ritualen slutförs. Varje förseglat altare stoppar en källa till förstärkningar. Välj din väg och sök förnödenheter i sidokamrarna om du behöver dem.
daily.brief_5=Håll utposten tills hjälpen kommer. Kaptenen måste överleva fem anfallsvågor. Försvararna håller mitten medan du slåss, söker förnödenheter eller öppnar celler för att få hjälp. Senare vågor kan komma från flera håll.
daily.brief_6=Stadens guld ligger i kungens skattkammare. Ta kaptenens nyckel, öppna kammaren och fly genom den bortre porten innan den stängs. Larmet går när skattkammaren öppnas. Samla förnödenheter och öppna genvägar först, eller försök med en snabbare kupp.
daily.rules=Varje datum har sin egen hjälte, utrustning och grotta. Använd dina färdighetspoäng före avfärd. Tiden räknas i turer. Försöket slutar om du lämnar evenemanget. Resultaten sparas separat och ger inga märken eller nya upptäckter i kunskapsboken.
